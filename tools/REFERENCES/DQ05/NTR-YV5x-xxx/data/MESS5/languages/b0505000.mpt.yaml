0:
  de: "@aBianca@bIch weiß, es gibt einen wichtigen Grund für deine Reise und so, %a000090.\n@c0@"
  en: "@aBianca@bI know there's an important reason behind your journey and all that, %a000090.\n@c0@"
  es: "@aBianca@bYa sé que viajas por un motivo importante y todo eso, %a000090.\n@c0@"
  fr: "@aBianca@bJe sais qu'il y a une raison importante derrière ton voyage, %a000090.\n@c0@"
  it: "@aBianca@bSo bene che il tuo non è un viaggio di piacere, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090には　しっかりした\n\t旅の目的があるから　うかれてちゃ\n\tいけないって　わかってるんだけど…\n@c0@"
1:
  de: "@aBianca@bAber ich finde es auch schön, mit dir die verschiedenen Städte zu besuchen. Ich komme mir fast vor wie auf einer Hochzeitsreise!\n@c0@"
  en: "@aBianca@bBut it is quite nice travellin' around different towns together. It feels like bein' on honeymoon!\n@c0@"
  es: "@aBianca@bPero es bonito esto de ir juntos de una ciudad a otra. ¡Es casi como una luna de miel!\n@c0@"
  fr: "@aBianca@bMais c'est quand même très agréable de voyager ensemble dans différentes villes. J'ai l'impression d'être en lune de mielⓠ\n@c0@"
  it: "@aBianca@bSpero che la mia vicinanza ti aiuti a superare i momenti di sconforto, a non sentirti solo, e ad avere fiducia nel futuro...\n@c0@"
  ja: "@a@bビアンカ「でも　こうして\n\tいろんな町を　歩いていると\n\t新婚旅行って　感じがするわよね。\n@c0@"
2:
  de: "@aNera@bEs kommt mir vor, als hätte ich jetzt mit dir ein ganz neues Leben angefangen, %a000090.\n@c0@"
  en: "@aNera@bI feel like I've been given a whole new lease of life now that I'm with you, %a000090.\n@c0@"
  es: "@aNera@bEstando contigo me siento como si la vita me hubiese dado una nueva oportunidad, %a000090.\n@c0@"
  fr: "@aNera@bJ'ai l'impression d'avoir la possibilité de vivre une seconde vie, maintenant que je suis avec toi, %a000090.\n@c0@"
  it: "@aNera@bOra che sono accanto a te, mi sembra di essere nata una seconda volta! Il mondo mi sembra più bello, il sole più splendente, e i fiori più profumati...\n@c0@"
  ja: "@a@bフローラ「あなたと　いっしょにいると\n\tいろんなことが　しんせんに\n\t感じられますのよ。\n@c0@"
3:
  de: "@aNera@bIch hoffe, wir werden noch viele Abenteuer gemeinsam erleben!\n@c0@"
  en: "@aNera@bI hope we'll have lots and lots of\r\nadventures together!\n@c0@"
  es: "@aNera@b¡Espero que vivamos muchísimas avventure juntos!\n@c0@"
  fr: "@aNera@bJ'espère que nous vivrons plein d'aventures ensembleⓠ\n@c0@"
  it: "@aNera@bSpero che staremo sempre insieme, tesoro mio...\n@c0@"
  ja: "@a@bフローラ「これからも\n\tあなたとともに　いろいろな\n\t発見や体験を　したいですわ。\n@c0@"
4:
  de: "@aBianca@bHier herrscht echte Hafenstadtatmosphäre, nicht?\n@c0@"
  en: "@aBianca@bThis place really has the feel of a port town, eh?\n@c0@"
  es: "@aBianca@bEsto es toda una ciudad portuaria, ¿a que sí?\n@c0@"
  fr: "@aBianca@bCet endroit possède vraiment l'atmosphère d'une ville portuaire, heinⓡ\n@c0@"
  it: "@aBianca@bSi vede che questa è una città di mare, eh?\n@c0@"
  ja: "@a@bビアンカ「いかにも　港町って\n\t感じがするわね。\n@c0@"
5:
  de: "@aNera@bSchnuppere doch nur mal die Seeluft! Da weiß man gleich, dass man in einer Hafenstadt ist!\n@c0@"
  en: "@aNera@bSmell that sea air! You can definitely tell it's a port town.\n@c0@"
  es: "@aNera@b¡No hay más que oler este aire marino! Ciudad portuaria, sicuro.\n@c0@"
  fr: "@aNera@bRespire un peu cet air iodéⓠ Impossible de\ns'y tromper, c'est bien une ville portuaire.\n@c0@"
  it: "@aNera@bSenti che profumo di salsedine!\nEh, sì! Grandport è un posto davvero carino...\n@c0@"
  ja: "@a@bフローラ「潮のかおりが　強いですわね。\n\tさすが　港町ですわ。\n@c0@"
6:
  de: "@aBianca@bHast du eine Ahnung, was der wollte? Ich hab nämlich keinen blassen Schimmer!\n@c0@"
  en: "@aBianca@bAny idea what that bloke was on about?\r\nIt all went right over my head!\n@c0@"
  es: "@aBianca@b¿Tienes idea de qué estaba hablando ese tipo?\r\n¡Yo no me he enterado de nada!\n@c0@"
  fr: "@aBianca@bTu as compris de quoi parlait ce typeⓡ\nÇa m'est passé totalement au-dessus la têteⓠ\n@c0@"
  it: "@aBianca@bScusa, di che parlava quel tizio...?\nEro soprappensiero, e non ho sentito cosa ha detto...\n@c0@"
  ja: "@a@bビアンカ「いまの会話じゃ　ぜんぜん\n\tなんの話か　わからないわね。\n@c0@"
7:
  de: "@aNera@bWeißt du, worum es da ging? Ich habe leider gar nichts verstanden!\n@c0@"
  en: "@aNera@bDid you understand what that man was talking about? I'm afraid I had no idea!\n@c0@"
  es: "@aNera@bNon capisco de qué habla ese hombre. ¿E tú?\n@c0@"
  fr: "@aNera@bTu as compris de quoi parlait cet hommeⓡ\nMoi, je n'en ai pas la moindre idéeⓠ\n@c0@"
  it: "@aNera@bMa di quale oggetto parla?!\nIo non l'ho mica capito!\n@c0@"
  ja: "@a@bフローラ「あなたったら　あの会話で\n\tわかりますの？？\n\t私には　さっぱりでしたわ。\n@c0@"
8:
  de: "@aBianca@bÜberall, wo wir hinkommen, scheint es viele besondere Souvenirs zu geben. Würde es nicht Spaß machen, sie zu sammeln?\n@c0@"
  en: "@aBianca@bThere do seem to be a lot of special souvenirs in a lot of the places we visit. Maybe it'd be fun to try collectin' them.\n@c0@"
  es: "@aBianca@bEn muchos de los sitios que visitamos hay muchos souvenires especiales. Igual sería divertido coleccionarlos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl semble effectivement y avoir beaucoup de spécialités dans les endroits que nous visitons.\r\nÇa pourrait être drôle d'essayer de les collectionner.\n@c0@"
  it: "@aBianca@bChe ne dici di collezionare gli oggetti tipici dei luoghi che visitiamo?\nPotremmo fare una bella raccolta di souvenir!\n@c0@"
  ja: "@a@bビアンカ「そういえば　いろいろな町で\n\tお土産品を　見るわね。\n\t集めてみるのも　おもしろいかも。\n@c0@"
9:
  de: "@aNera@bEs wäre schön, wenn wir gelegentlich ein Souvenir kaufen könnten, aber wahrscheinlich sollten wir nicht allzu viel Gepäck mit uns herumtragen.\n@c0@"
  en: "@aNera@bIt would be nice to buy the occasional souvenir, but I suppose we can't afford to add to our luggage too much.\n@c0@"
  es: "@aNera@bNo estaría mal comprare algún souvenir de vez en cuando, pero supongo que no podemos llevar demasiado equipaje.\n@c0@"
  fr: "@aNera@bÇa serait agréable de pouvoir acheter un souvenir de temps en temps, mais j'imagine qu'on ne peut pas\r\nse permettre de trop charger nos bagages.\n@c0@"
  it: "@aNera@bOgni tanto sarebbe bello comprare qualche souvenir, ma forse non è una buona idea aggiungere altre cose ai nostri bagagli. Sono già così pesanti!\n@c0@"
  ja: "@a@bフローラ「お土産もいいのですが\n\tあまりふえると　荷物に\n\tなってしまいますわ。\n@c0@"
10:
  de: "@aNera@bOh, das würde dir nichts ausmachen? Du bist natürlich sehr stark. Ja, wenn du nichts dagegen hast, all das zu tragen...\n@c0@"
  en: "@aNera@bOh, you don't mind? I suppose you are very strong. Well, if you don't mind carrying them...\n@c0@"
  es: "@aNera@b¿No te importa, dices? Supongo que eres una persona molto forte. Bueno, si te da igual llevarlos...\n@c0@"
  fr: "@aNera@bOh, tu es d'accordⓡ C'est vrai que tu es très fort. Eh bien, si ça ne t'ennuie pas de les porter...\n@c0@"
  it: "@aNera@bPerò mi piacerebbe avere qualche ricordo dei nostri viaggi... Non è che te la sentiresti di portare qualche oggettino in più?\n@c0@"
  ja: "@a@bフローラ「えっ　平気なのですか？\n\tまあ！　あなたって　力持ちなのね。\n@c0@"
11:
  de: "@aBianca@bDer Azimuth ist der höchste Berg der Welt. Es gibt schon verrückte Leute, was?\n@c0@"
  en: "@aBianca@bMt Azimuth is the highest mountain in the world. People certainly do some crazy things, eh?\n@c0@"
  es: "@aBianca@bEl monte Acimut es la montaña más alta del mundo. La gente hace cada cosa rara... ¿verdad?\n@c0@"
  fr: "@aBianca@bLe mont Azimut est la plus haute montagne du monde. Les gens font parfois des choses dingues, nonⓡ\n@c0@"
  it: "@aBianca@bIl Monte Azimuth è la vetta più alta del mondo.\nCome si fa a costruire un tempio proprio lassù, eh?\n㈡\nChi vuoi che ci vada a pregare?!\nQualche capra di montagna?!\n@c0@"
  ja: "@a@bビアンカ「セントベレスっていったら\n\t世界一　高い山じゃない。\n\tすごいことする人も　いるものね。\n@c0@"
12:
  de: "@aNera@bUnglaublich, was Menschen alles leisten können. Ich hoffe nur, dass sie dort nicht von Monstern angegriffen werden.\n@c0@"
  en: "@aNera@bIt's incredible to think that people are capable of such feats. I just hope they manage to avoid being attacked by monsters there.\n@c0@"
  es: "@aNera@bEs increíble pensar que hay personas capaces de esas proezas. Espero que, mientras están allí, no les ataque ningún mostro.\n@c0@"
  fr: "@aNera@bC'est incroyable de se dire que certains sont capables de faire des choses pareilles.\n㈡\nJ'espère que là-haut, ils arrivent à ne pas se faire attaquer par les monstres.\n@c0@"
  it: "@aNera@bMa chi avrà avuto la pensata di costruire un tempio in un luogo così inaccessibile?! E poi scommetto che quel posto pullula di mostri ferocissimi!\n@c0@"
  ja: "@a@bフローラ「そんなこと　人間のチカラで\n\tできるのかしら。　魔物が\n\tかかわっていないと　いいんですけど。\n@c0@"
13:
  de: "@aBianca@bDer arme alte Mann. Ich hoffe, das heißt nicht, dass er jetzt ganz allein dasteht.\n@c0@"
  en: "@aBianca@bThat poor old man. I hope that dun't mean he's all on his own now.\n@c0@"
  es: "@aBianca@bPobre viejo. Espero que ahora no se haya quedado solo en el mundo, ¿sabes?\n@c0@"
  fr: "@aBianca@bPauvre homme. J'espère que ça ne veut pas dire qu'il est seul, maintenant.\n@c0@"
  it: "@aBianca@bPovero vecchio... Spero che non resti da solo con il suo dolore. Mi piacerebbe poter fare qualcosa per lui, ma non so proprio come aiutarlo...\n@c0@"
  ja: "@a@bビアンカ「おじいさん　かわいそうね。\n\tもしかして　ひとりぼっちに\n\tなっちゃったのかしら……。\n@c0@"
14:
  de: "@aNera@bMan sagt ja, für Eltern gebe es nichts Schlimmeres, als ein Kind zu verlieren.\n@c0@"
  en: "@aNera@bPeople say there's nothing worse for a parent than outliving a child.\n@c0@"
  es: "@aNera@bDicen que lo peor que le puede pasar a un padre es sobrevivir a uno de sus bambini.\n@c0@"
  fr: "@aNera@bLes gens disent qu'il n'y a rien de pire quand on est parent que de survivre à son enfant.\n@c0@"
  it: "@aNera@bPer un genitore, non esiste dolore più grande che perdere un figlio...\n@c0@"
  ja: "@a@bフローラ「親として　子供に\n\t先立たれることほど\n\tつらいことはないと　聞きます。\n@c0@"
15:
  de: "@aNera@bEs ist schwer, die richtigen Worte zu finden, um diesen armen alten Mann zu trösten.\n@c0@"
  en: "@aNera@bIt's hard to find the right words to console\r\nthat poor old man.\n@c0@"
  es: "@aNera@bNo es fácil hallar las parole adecuadas para consolar a ese pobre anciano.\n@c0@"
  fr: "@aNera@bDifficile de trouver les mots pour consoler ce pauvre vieil homme.\n@c0@"
  it: "@aNera@bNon trovo nemmeno le parole adatte per consolare quell'uomo...\n@c0@"
  ja: "@a@bフローラ「あの　おじいさまには\n\tかけてさしあげる言葉も\n\tみつかりませんわ……。\n@c0@"
16:
  de: "@aBianca@bFrechheit! Na, egal. Wir mögen kein Geld haben, aber wir haben einander, und nur das zählt!\nAch, ich wünschte, das wäre mir vorhin eingefallen...\n@c0@"
  en: "@aBianca@bThe cheek of it! It dun't matter that we dun't have money, anyhow. We got love and that's what counts! Wish I'd said that to him...\n@c0@"
  es: "@aBianca@b¡Hay que ver qué cara! Pero no importa que no tengamos dinero. ¡Nos queremos y eso es lo que importa! Tendría que habérselo dicho...\n@c0@"
  fr: "@aBianca@bQuel culotⓠ Et puis qu'est-ce que ça peut faire qu'on n'ait pas d'argent. On s'aime, et c'est ce qui compteⓠ C'est ce que j'aurais dû lui répondre...\n@c0@"
  it: "@aBianca@bChe razza di cafone villano maleducato!\nMa non lo sa quell'idiota che i soldi non fanno la felicità, eh?!\n@c0@"
  ja: "@a@bビアンカ「うっ…　言い返せないところが\n\tくやしいけど　私たち　お金はなくても\n\t愛はいっぱいだもんねっ　%a000090。\n@c0@"
17:
  de: "@aNera@bHe he. So was hat noch keiner zu mir gesagt!\n@c0@"
  en: "@aNera@bHe he. No one's ever said anything like that to me before!\n@c0@"
  es: "@aNera@bJi, ji. ¡Nadie me ha dicho nunca algo così!\n@c0@"
  fr: "@aNera@bHi hi. Personne ne m'avait encore dit çaⓠ\n@c0@"
  it: "@aNera@bAh ah ah!\nQuasi quasi gli dico che la Jolly Ace appartiene a mio padre...!\n@c0@"
  ja: "@a@bフローラ「うふふ。　あんなふうに\n\t言われたのは　初めてですわ。\n@c0@"
18:
  de: "@aNera@bEs ist, als würde ich ein ganz neues Leben führen, seit ich dich geheiratet habe, %a000090.\n@c0@"
  en: "@aNera@bI feel as if I've started a new life since I married you, %a000090.\n@c0@"
  es: "@aNera@bSiento como si hubiese iniciado una nueva vita desde que me casé contigo, %a000090.\n@c0@"
  fr: "@aNera@bJ'ai l'impression d'avoir commencé une nouvelle vie quand je t'ai épousé, %a000090.\n@c0@"
  it: "@aNera@bScommetto che resterebbe pietrificato, se lo facessi!\n@c0@"
  ja: "@a@bフローラ「私　あなたと　新しい人生を\n\t歩いているんですわね。\n@c0@"
19:
  de: "@aBianca@bWenn ich mir die Ungeheuer ansehe, mit denen du dich angefreundet hast, %a000090, dann kann ich mir nur schwer vorstellen, dass sie alle böse sein sollen.\n@c0@"
  en: "@aBianca@bWhen I look at the monsters you've managed to befriend, %a000090, I find it hard to believe that all of them can be bad.\n@c0@"
  es: "@aBianca@bCuando miro a los monstruos de los que te has hecho amigo, %a000090, me cuesta creer que todos ellos sean malos, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand je regarde les monstres que tu as réussi à apprivoiser, %a000090, j'ai du mal à croire que tous puissent être méchants.\n@c0@"
  it: "@aBianca@bQuando guardo le creature con cui hai fatto amicizia, mi rendo conto che non tutti i mostri sono cattivi.\n@c0@"
  ja: "@a@bビアンカ「私　%a000090に　なつく\n\t魔物を見ていると　どうしても\n\t魔物全部が悪いとは　思えないな。\n@c0@"
20:
  de: "@aNera@bVermutlich müssen sich selbst Götter und Göttinnen einmal ausruhen. Wir müssen einfach hoffen, dass diese Pause nicht ewig dauern wird.\n@c0@"
  en: "@aNera@bI suppose even gods and goddesses need a break from time to time. We just have to hope the break doesn't last forever, that's all.\n@c0@"
  es: "@aNera@bSupongo que incluso los dioses y las diosas necesitan descansar de vez en cuando. Ma esperemos que la pausa no dure eternamente.\n@c0@"
  fr: "@aNera@bJe suppose que même les dieux et les déesses ont besoin de faire une pause de temps en temps.\n㈡\nIl faut juste espérer que la pause ne dure pas éternellement.\n@c0@"
  it: "@aNera@bMa no, non penso che questo drago celeste abbia dato ai mostri il permesso di attaccare gli uomini...\nSi sarà solo distratto un attimo, ecco tutto!\n@c0@"
  ja: "@a@bフローラ「神さまにだって\n\tお休みは　必要ですわよね。\n\t休んだままだと　困りますけど……。\n@c0@"
21:
  de: "@aBianca@bHier ist der Klingelbeutel sicher immer gut gefüllt, was?\n@c0@"
  en: "@aBianca@bIt looks like they get their fair share of church donations here, eh?\n@c0@"
  es: "@aBianca@bParece que aquí no les va nada mal con las donaciones, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait que les dons à l'église ne manquent pas ici, heinⓡ\n@c0@"
  it: "@aBianca@bUna banca sotto la chiesa?!\nQuesta proprio non me l'aspettavo!\n@c0@"
  ja: "@a@bビアンカ「ここって\n\t教会に寄付された　お金が\n\tいっぱい　預けてありそうね。\n@c0@"
22:
  de: "@aNera@bEs würde mich nicht wundern, wenn es vielen Leuten nicht einmal auffiele, dass es hier eine Bank gibt.\n@c0@"
  en: "@aNera@bI wouldn't be surprised if lots of people don't even realise there's a bank here.\n@c0@"
  es: "@aNera@bVeramente, no me extrañaría que muchas personas no se diesen siquiera cuenta de que aquí hay un banco.\n@c0@"
  fr: "@aNera@bÇa ne m'étonnerait pas que la plupart des gens ne réalisent même pas qu'il y a une banque, ici.\n@c0@"
  it: "@aNera@bSecondo me un mucchio di gente ignora l'esistenza di questa banca...\n@c0@"
  ja: "@a@bフローラ「こんなところに\n\t銀行があるなんて　気づかない方も\n\t多いんじゃないかしら。\n@c0@"
23:
  de: "@aBianca@bWas er wohl damit meint? Gehen wir hin und sehen nach, was es dort gibt!\n@c0@"
  en: "@aBianca@bI wonder what he means. We should go and see what we can find!\n@c0@"
  es: "@aBianca@bMe pregunto a qué se refiere, ¿sabes? ¡Deberíamos ir a ver qué encontramos!\n@c0@"
  fr: "@aBianca@bJe me demande ce qu'il veut dire. On devrait aller voir ce qu'on pourrait trouverⓠ\n@c0@"
  it: "@aBianca@bAdoro le cacce al tesoro!\nPerché non andiamo a vedere se riusciamo a trovare qualcosa, eh?\n@c0@"
  ja: "@a@bビアンカ「ちょっとした物って\n\tなにかしら？\n\tねえ　見にいってみましょうよ。\n@c0@"
24:
  de: "@aNera@bWie merkwürdig, dass dieser Seemann offenbar weiß, dass dort etwas zu holen ist, aber lieber uns hinschickt, statt selbst zu gehen. Was es wohl ist?\n@c0@"
  en: "@aNera@bHow strange that that sailor knows there's something there and yet doesn't go and get it himself. I wonder what it is.\n@c0@"
  es: "@aNera@bSembra extraño que ese marinero sepa que hay alguna cosa ahí y no vaya él mismo a por ella. Me pregunto qué será.\n@c0@"
  fr: "@aNera@bC'est bizarre que ce marin sache qu'il y a\r\nquelque chose à cet endroit et n'aille pourtant pas lui-même le chercher. Je me demande ce que c'est.\n@c0@"
  it: "@aNera@bSe c'è davvero qualcosa tra i fiori, come mai non è andato a prenderla lui stesso?!\nQuel tipo non me la racconta giusta...\n@c0@"
  ja: "@a@bフローラ「あの船員さんが\n\t落ちていると知りながら\n\t拾わない物って　なにかしら。\n@c0@"
25:
  de: "@aBianca@bDen kenne ich! Der hat bei dem Mann gelernt, der die Medizin für meinen Vater zubereitet hat, als ich noch klein war!\n@c0@"
  en: "@aBianca@bI know him! He used to study under the man who made us some medicine for my father back when I was little!\n@c0@"
  es: "@aBianca@b¡Lo conozco! ¡Estudiaba con ese hombre que preparó medicina para mi padre cuando yo era pequeña!\n@c0@"
  fr: "@aBianca@bJe le connais. Il étudiait auprès de l'homme qui\na un jour préparé un remède pour mon père,\nquand j'étais petiteⓠ\n@c0@"
  it: "@aBianca@bConosco quell'uomo!\nEra un allievo del farmacista che portò il medicinale a mio padre tanti anni fa!\n@c0@"
  ja: "@a@bビアンカ「あの人　おぼえてるわ。\n\t昔　父さんの薬を作ってくれた人の\n\tお弟子さんだったわよね！\n@c0@"
26:
  de: "@aNera@bWenn man sich vorstellt, dass dieser Mann einmal Apotheker werden wollte und nun Seemann ist! Man kann nie wissen, wo das Leben einen hinführt.\n@c0@"
  en: "@aNera@bTo think that man once dreamt of being a pharmacist and yet he's ended up a sailor!\r\nYou never can tell where life will take you.\n@c0@"
  es: "@aNera@b¡Y pensar que ese uomo soñaba con ser farmacéutico y ha acabado siendo marinero!\r\nLa vita nos lleva a veces por senderos imprevisibili.\n@c0@"
  fr: "@aNera@bDire que cet homme rêvait autrefois d'être herboriste et qu'il a fini marinⓠ On ne sait\njamais où la vie peut nous mener.\n@c0@"
  it: "@aNera@bQuel tipo sognava di diventare farmacista, e invece ha finito per fare il marinaio!\nLa vita riserva sempre tante sorprese...\n@c0@"
  ja: "@a@bフローラ「くすり師を　目指された方が\n\t今はこうして　船乗りなんて…\n\t人生って　分からないものですわね。\n@c0@"
27:
  de: "@aNera@bIst Steinach nicht das Dorf, aus dem du stammst?\n@c0@"
  en: "@aNera@bIsn't Whealbrook the village you come from?\n@c0@"
  es: "@aNera@bEres de Arroyofrío, ¿verdad?\n@c0@"
  fr: "@aNera@bRuycelieu... N'est-ce pas le village dont tu viensⓡ\n@c0@"
  it: "@aNera@bMa Valcava non è il villaggio da cui provieni?\n@c0@"
  ja: "@a@bフローラ「サンタローズって\n\tあなたのふるさと　でしょう？\n@c0@"
28:
  de: "@aNera@bIch hätte es damals gern besucht.\n@c0@"
  en: "@aNera@bI would've liked to have visited it all those years ago.\n@c0@"
  es: "@aNera@bVeramente, me hubiese gustado haber estado allí en aquellos tiempos.\n@c0@"
  fr: "@aNera@bJ'aurais bien aimé le visiter, il y a toutes ces années.\n@c0@"
  it: "@aNera@bSai? Anni fa fui sul punto di visitarlo insieme alla mia famiglia, ma mio padre dovette partire per un viaggio d'affari imprevisto, e la gita saltò...\n@c0@"
  ja: "@a@bフローラ「私も　昔のサンタローズを\n\t見てみたかったわ。\n@c0@"
29:
  de: "@aBianca@bEs ist ein wenig feucht hier, nicht? Vielleicht ist es den Monstern lieber so.\n@c0@"
  en: "@aBianca@bIt's a bit damp down here, en't it? Maybe the monsters prefer it that way.\n@c0@"
  es: "@aBianca@bMenuda humedad hay aquí abajo, ¿verdad? A lo mejor es que a los monstruos les gusta, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un peu humide ici, nonⓡ Peut-être que c'est ce que les monstres préfèrent.\n@c0@"
  it: "@aBianca@bAccidenti che umidità c'è quaggiù!\nRoba da farsi venire i reumatismi cronici in mezza giornata!\n@c0@"
  ja: "@a@bビアンカ「ここって　ちょっと\n\tジメジメしてるね。\n\t魔物って　こういう所が好きなのかな？\n@c0@"
30:
  de: "@aNera@bDie Monster hier werden gut versorgt. Sie sehen jedenfalls gesund und glücklich aus.\n@c0@"
  en: "@aNera@bThe monsters here are very well-looked-after. They certainly seem happy and healthy enough.\n@c0@"
  es: "@aNera@bLos mostri de aquí están muy bien cuidados. Desde luego, parecen bastante felices y sanos.\n@c0@"
  fr: "@aNera@bLes monstres qui sont ici sont très bien soignés.\r\nIls ont l'air plutôt heureux et en bonne santé.\n@c0@"
  it: "@aNera@bChe ambiente tetro!\nBeh, l'importante è che i mostri ci si trovino bene...\n@c0@"
  ja: "@a@bフローラ「部屋の奥の　魔物さんたち\n\tよく　お世話されているんですね。\n\tとっても　お元気そうですわ。\n@c0@"
31:
  de: "@aBianca@bEs gibt viele Schätze auf der ganzen Welt, aber ich bin dir von allen der liebste, stimmt's nicht, %a000090?\n@c0@"
  en: "@aBianca@bThere's all sorts of treasure around the world, but I'm your prized one, right, %a000090?\n@c0@"
  es: "@aBianca@bEl mundo está lleno de tesoros, pero tu mayor tesoro soy yoⓓ ¿a que sí, %a000090?\n@c0@"
  fr: "@aBianca@bIl y a toutes sortes de trésors dans le monde,\nmais je suis celui que tu as de plus précieux,\nn'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aBianca@bIl mondo è pieno di tesori, ma io per te sono quello più prezioso...\nDico bene, %a000090?\n@c0@"
  ja: "@a@bビアンカ「宝物って　いろいろあるけど\n\t%a000090の宝物は　私…　だよね？\n@c0@"
32:
  de: "@aBianca@bHa ha ha! Danke!\n@c0@"
  en: "@aBianca@bHa ha ha! Thanks!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡Gracias!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Merciⓠ\n@c0@"
  it: "@aBianca@bGrazie, amore mio!\nSei proprio... un tesoro!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「うふふ。　ありがとっ！\n@c0@"
33:
  de: "@aBianca@bHe! Ich wollte gerade sagen, und du mir!\n@c0@"
  en: "@aBianca@bHey! I was about to say you were mine!\n@c0@"
  es: "@aBianca@b¡Eh! ¡Estaba a punto de decir que tú eras el mío!\n@c0@"
  fr: "@aBianca@bHéⓠ Et moi qui allais te dire que toi, tu étais le mienⓠ\n@c0@"
  it: "@aBianca@bBah!\nSei più falso di una moneta di cartone!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「あ～あ！\n\t私の宝物は　%a000090なのになっ。\n@c0@"
34:
  de: "@aNera@bIst es nicht süß, was für große Träume Kinder haben?\n@c0@"
  en: "@aNera@bIt's really sweet how children have such big dreams like that.\n@c0@"
  es: "@aNera@bQué encanto, los grandes sueños de los bambini...\n@c0@"
  fr: "@aNera@bC'est vraiment mignon de voir que les enfants ont de si grands rêves.\n@c0@"
  it: "@aNera@bQuel bambino ha già le idee chiare sul suo futuro, eh?\nGli auguro di cuore di realizzare il suo sogno!\n@c0@"
  ja: "@a@bフローラ「子供って　夢を\n\tたくさん持っていて　ステキですわ。\n@c0@"
35:
  de: "@aBianca@bDie Wüste klingt ziemlich aufregend. Können wir uns dort nicht mal umsehen, %a000090?\n@c0@"
  en: "@aBianca@bThe desert sounds pretty excitin'. Can we go and have a look, %a000090?\n@c0@"
  es: "@aBianca@bEl desierto suena emocionante. ¿Vamos a echar un vistazo, %a000090?\n@c0@"
  fr: "@aBianca@bÇa a l'air chouette, le désert. On ne pourrait pas\ny faire un tour, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon mi dispiacerebbe fare una bella gita nel deserto.\nChe ne dici, %a000090?\n@c0@"
  ja: "@a@bビアンカ「砂漠って　なんだか\n\tわくわく　するわよね。\n\t行ってみたいな。　ねっ　%a000090。\n@c0@"
36:
  de: "@aNera@bIch vertrage leider die Hitze nicht sehr gut, aber wenn du diese Wüste aufsuchen willst, dann komme ich natürlich gern mit dir.\n@c0@"
  en: "@aNera@bI don't tend to be very good in the heat I'm afraid, but if you want to visit that desert, then of course I'm happy to go with you.\n@c0@"
  es: "@aNera@bMe temo que el calor no es lo que más me conviene, pero si quieres ir a visitar il deserto, por supuesto que iré con te.\n@c0@"
  fr: "@aNera@bJe ne supporte pas très bien la chaleur, je le crains, mais si tu as envie de visiter ce désert, je serai évidemment heureuse de t'accompagner.\n@c0@"
  it: "@aNera@bIo non sopporto il caldo, ma se tu volessi visitare il deserto, sarei ben lieta di accompagnarti.\n@c0@"
  ja: "@a@bフローラ「私　暑いところは\n\t少し　苦手なんですけど…\n\tあなたとなら　どこへでも行きますわ。\n@c0@"
37:
  de: "@aBianca@bEin Schrein für den legendären Helden? Vielleicht leben dort sogar noch irgendwelche Verwandte von ihm! Man darf die Hoffnung nie aufgeben!\n@c0@"
  en: "@aBianca@bA shrine to the legendary hero? Maybe that\r\nmeans there are ancestors of his there.\r\nYou can only hope!\n@c0@"
  es: "@aBianca@b¿Un altar dedicado al héroe legendario? A lo mejor quiere decir que allí hay antepasados suyos.\r\n¡La esperanza es lo último que se pierde!\n@c0@"
  fr: "@aBianca@bUn sanctuaire dédié au héros légendaireⓡ\nÇa veut peut-être dire qu'il a des ancêtres là-bas. On peut toujours espérerⓠ\n@c0@"
  it: "@aBianca@bUn tempio dedicato all'Eroe Leggendario?\nUhm... Chissà che da quelle parti non riusciamo a scoprire qualcosa di interessante...\n@c0@"
  ja: "@a@bビアンカ「伝説の勇者のお墓っ？\n\tじゃあ　そこに子孫も……\n\tと　うまくいけばいいんだけど。\n@c0@"
38:
  de: "@aNera@bWenn es dort einen Schrein für den legendären Helden gibt, dann befinden sich vielleicht noch ein paar seiner Besitztümer dort.\n@c0@"
  en: "@aNera@bIf there's a shrine there to the legendary hero, then maybe some of his belongings will still be there too.\n@c0@"
  es: "@aNera@bSi hay un altare dedicado al héroe legendario, quizá tengan también algunas de sus pertenencias.\n@c0@"
  fr: "@aNera@bS'il y a là-bas un sanctuaire dédié au héros légendaire, peut-être que certains des objets\r\nqu'il possédait y seront toujours.\n@c0@"
  it: "@aNera@bSe lì ci fosse realmente un tempio dedicato all'Eroe Leggendario, potrebbe anche esserci qualche oggetto che gli è appartenuto...\n@c0@"
  ja: "@a@bフローラ「勇者さまの　お墓があるなら\n\t勇者さまの　のこされた品々が\n\t伝わっているかもしれませんわね。\n@c0@"
39:
  de: "@aBianca@bDer klang aber nicht so, als würde er dich ernst nehmen, findest du nicht?\n@c0@"
  en: "@aBianca@bHe didn't really sound like he was takin' you seriously, eh?\n@c0@"
  es: "@aBianca@bNo parecía que te estuviese tomando muy en serio, ¿verdad?\n@c0@"
  fr: "@aBianca@bIl n'avait pas vraiment l'air de te prendre au sérieux, heinⓡ\n@c0@"
  it: "@aBianca@bHo l'impressione che non ci abbia creduti...\n@c0@"
  ja: "@a@bビアンカ「へー　って…\n\tなんだか　完全に\n\t聞き流されてるわよね。\n@c0@"
40:
  de: "@aNera@bVielleicht wird hier öfter vom legendären Helden gesprochen. Der Mann hinter der Theke schien sich nicht sonderlich für das Thema zu interessieren.\n@c0@"
  en: "@aNera@bMaybe there's a lot of talk here about the legendary hero. That man behind the bar didn't seem overly interested.\n@c0@"
  es: "@aNera@bQuizá aquí se hable molto del héroe legendario. Ese uomo de la barra no parecía estar muy interesado.\n@c0@"
  fr: "@aNera@bPeut-être qu'ici, on raconte beaucoup de choses sur le héros légendaire. Cet homme derrière le bar n'avait pas l'air très intéressé.\n@c0@"
  it: "@aNera@bForse crede che lo stiamo prendendo in giro...\n@c0@"
  ja: "@a@bフローラ「ここじゃ　勇者の話は\n\t多いのかも　知れませんね。\n\tバーテンさん　興味なさそうでしたわ。\n@c0@"
41:
  de: "@aBianca@bWir sind offenbar nicht die Einzigen, die den legendären Helden suchen.\n@c0@"
  en: "@aBianca@bLooks like we're not the only ones tryin' to track down the legendary hero.\n@c0@"
  es: "@aBianca@bParece que no somos los únicos que van tras el héroe legendario.\n@c0@"
  fr: "@aBianca@bOn dirait que nous ne sommes pas les seuls\r\nà rechercher le héros légendaire.\n@c0@"
  it: "@aBianca@bA quanto pare non siamo gli unici a essere sulle tracce dell'Eroe Leggendario...\n@c0@"
  ja: "@a@bビアンカ「私たちのほかにも\n\t勇者をさがしている人が　いたんだね。\n@c0@"
42:
  de: "@aNera@bFür einen Gelehrten, der nicht an Kämpfe gewöhnt ist, muss es eine beschwerliche Reise sein. Und für seine arme Frau ist das sicher auch kein Zuckerschlecken.\n@c0@"
  en: "@aNera@bIt would be a difficult journey for a scholarly type who's not used to fighting. That poor wife of his can't be enjoying it much either.\n@c0@"
  es: "@aNera@bSería un viaje molto difficile para un erudito que no está acostumbrado a luchar. Su pobre esposa tampoco lo debe de estar pasando bene.\n@c0@"
  fr: "@aNera@bÇa doit être une expédition difficile pour un homme d'études qui n'a pas l'habitude du combat. Et sa pauvre femme ne doit pas trop aimer ça non plus.\n@c0@"
  it: "@aNera@bSperiamo che suo marito si sia preparato a dovere per il viaggio! Stiamo scoprendo a nostre spese che trovare l'Eroe Leggendario non è impresa da poco...\n@c0@"
  ja: "@a@bフローラ「戦いになれていない\n\t学者さまには　つらい旅でしょうね。\n\t奥さまも　大変そうですわ。\n@c0@"
43:
  de: "@aBianca@bDer Großmeister der Unterwelt? Ob es den wohl wirklich gibt? Das will ich doch nicht hoffen!\n@c0@"
  en: "@aBianca@bThe Grandmaster of the Underworld, eh? I wonder if he really exists. I hope not!\n@c0@"
  es: "@aBianca@bEl Gran Maestro del Inframundo, ¿eh? Me pregunto si existe de verdad. ¡Espero que no!\n@c0@"
  fr: "@aBianca@bLe Grand Maître des Enfers, heinⓡ\nJe me demande s'il existe vraiment.\nJ'espère que nonⓠ\n@c0@"
  it: "@aBianca@bIl Gran Maestro degli Inferi?!\nMi auguro che un essere dal nome così poco rassicurante esista solo nei sogni di quest'uomo!\n@c0@"
  ja: "@a@bビアンカ「闇の世界から　大魔王…\n\t本当かしら。\n\tなんだか　こわいわ。\n@c0@"
44:
  de: "@aNera@bSo wild, wie die Monster draußen sich heutzutage gebärden, kann man sich leicht vorstellen, dass dieser Großmeister dahinterstecken könnte.\n@c0@"
  en: "@aNera@bWhen you look at how wild things are out in the countryside nowadays, it's not hard to believe that this Grandmaster might be at work.\n@c0@"
  es: "@aNera@bViendo lo pericolosa que está la situación en el campo últimamente, no sería de extrañar que el Gran Maestro tuviese algo que ver con ello.\n@c0@"
  fr: "@aNera@bLorsqu'on voit le désordre et le danger qui règnent actuellement dans les campagnes, on peut aisément croire qu'il s'agit bien de l'œuvre de ce Grand Maître.\n@c0@"
  it: "@aNera@bConsiderando l'atmosfera di pericolo che si respira in giro ultimamente, mi viene da pensare che questo Gran Maestro degli Inferi sia già all'opera...\n@c0@"
  ja: "@a@bフローラ「この頃の　外の様子からすると\n\t本当に　大魔王がやってこようと\n\tしているのかも　知れませんわね。\n@c0@"
45:
  de: "@aBianca@bMein Vater und ich haben damals auf unserer Reise nach Utensiel in dieser Herberge übernachtet.\n@c0@"
  en: "@aBianca@bDad and I stayed at this inn on our way to Stockenbarrel all those years ago.\n@c0@"
  es: "@aBianca@bPapá y yo pasamos por esta posada de camino a Clavis en aquel viaje, ¿sabes?\n@c0@"
  fr: "@aBianca@bPapa et moi avons dormi dans cette auberge sur la route pour Saint Éloi, il y a bien des années.\n@c0@"
  it: "@aBianca@bMio padre e io alloggiammo in questa locanda diversi anni fa, durante il viaggio che facemmo per trasferirci ad Aprianuam.\n@c0@"
  ja: "@a@bビアンカ「山奥の村へ行くとき\n\tここの宿屋にも　泊まったのよ。\n@c0@"
46:
  de: "@aBianca@bIch weiß noch, wie er gejammert hat, er könnte sich an einem solchen Ort nicht richtig entspannen!\n@c0@"
  en: "@aBianca@bI remember him moanin' and sayin' he couldn't relax properly in a place like this!\n@c0@"
  es: "@aBianca@b¡Recuerdo que se quejaba y decía que en un sitio así no había forma de descansar de verdad!\n@c0@"
  fr: "@aBianca@bJe me souviens l'avoir entendu ronchonner et dire qu'il ne pouvait pas se reposer correctement dans un endroit pareilⓠ\n@c0@"
  it: "@aBianca@bRicordo che papà si lamentò parecchio della sistemazione, perché temeva che non sarebbe riuscito a riposare bene in un posto del genere...\n@c0@"
  ja: "@a@bビアンカ「父さんは\n\tこんな宿屋で　くつろげるか！　って\n\t文句言ってたっけ……。\n@c0@"
47:
  de: "@aBianca@bAlso läuft die Vorstellung immer nur abends? Daran kann ich mich von meinem letzten Aufenthalt hier gar nicht mehr erinnern.\n@c0@"
  en: "@aBianca@bSo the show's only on of a night? I don't remember it bein' that way when I was here before.\n@c0@"
  es: "@aBianca@bEntonces, ¿el espectáculo solo se hace una noche? No recuerdo que fuera así la otra vez que estuve por aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors le spectacle n'a lieu que de nuitⓡ Je ne me souviens pas que c'était comme ça, la dernière fois que je suis venue.\n@c0@"
  it: "@aBianca@bQuindi lo spettacolo va in scena solo di sera?\nNon mi sembra che funzionasse così quando venni qui l'altra volta...\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\tステージは　夜だけなのね。\n\t昔　来たときも　そうだったかな。\n@c0@"
48:
  de: "@aNera@bDiese Tänzerinnen sind aber wirklich sehr spärlich bekleidet! Ich weiß gar nicht, wo ich hinsehen soll!\n@c0@"
  en: "@aNera@bThose dancing girls are wearing rather skimpy outfits! I hardly know where to look!\n@c0@"
  es: "@aNera@b¡Esas bailarinas llevan unos trajes molto atrevidos! ¡No sé ni a dónde mirar!\n@c0@"
  fr: "@aNera@bCes danseuses portent des tenues pour le moins... légèresⓠ Je ne sais même pas où poser les yeuxⓠ\n@c0@"
  it: "@aNera@bHai visto che costumini striminziti indossano le ballerin...\nNo. È meglio se non guardi, tesoro...\n@c0@"
  ja: "@a@bフローラ「ダンサーの皆さん……\n\tとってもダイタンな衣装ですわ。\n\t女の私が見ても　ドキドキします……。\n@c0@"
49:
  de: "@aBianca@bSeit wann bist du denn so charmant zu den Damen, häh?\n@c0@"
  en: "@aBianca@bSince when have you bin so good with\r\nthe ladies, eh?\n@c0@"
  es: "@aBianca@bVaya, ¿desde cuándo se te dan tan bien las chicas?\n@c0@"
  fr: "@aBianca@bDepuis quand tu es si doué avec les filles, heinⓡ\n@c0@"
  it: "@aBianca@bDa quando in qua sei diventato un dongiovanni, eh?!\nSarà meglio che cambi registro, maritino mio bello, altrimenti ti sego via le gambe!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら…\n\tいつの間に　女性のあつかいが\n\tそんなに　上手になったの？\n@c0@"
50:
  de: "@aBianca@bHm! An so etwas werde ich mich als verheiratete Frau wohl gewöhnen müssen.\n@c0@"
  en: "@aBianca@bHuh! Oh well. I suppose I have to put up with things like that now I'm married.\n@c0@"
  es: "@aBianca@b¡Umm! En fin. Supongo que me tendré que morder la lengua por esta vez.\n@c0@"
  fr: "@aBianca@bTsssⓠ Enfin bon. Je suppose que maintenant que je suis mariée, je dois supporter ce genre de choses.\n@c0@"
  it: "@aBianca@bBeh, dato che sono sposata con un gran bell'uomo, dovrò abituarmi a situazioni come questa...\n@c0@"
  ja: "@a@bビアンカ「ブツブツ…　こうして\n\tよゆうを　見せておくのも\n\t妻のつとめよね。　うんうん。\n@c0@"
51:
  de: "@aNera@bWie kannst du nur?! (Schluchz) Mach nur so weiter, dann geh ich zurück zu Papa!\n@c0@"
  en: "@aNera@bHow could you!? (sob) I'll go crying back to Papa if you say things like that!\n@c0@"
  es: "@aNera@b¡¿Cómo has podido?! (snif) ¡Si dices cosas così iré llorando a decírselo al mio papino!\n@c0@"
  fr: "@aNera@bComment oses-tuⓡⓐ (sanglot) Je vais aller pleurer auprès de papa si tu te conduis comme çaⓠ\n@c0@"
  it: "@aNera@bCome hai potuto dire una cosa del genere?! Sob!\r\nMi hai ferita! Sob! Vattene via, brutto cattivo che non sei altro! Sob e strasob!\n@c0@"
  ja: "@a@bフローラ「ひどいわ　あなたったら！\n\tうっ　うっ……。\n@c0@"
52:
  de: "@aNera@b... He he he! War doch nur ein Witz! Aber du hättest mal dein Gesicht sehen sollen!\n@c0@"
  en: "@aNera@b...He he he! Only joking!\nYou should see the look on your face!\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! ¡Era una broma!\r\n¡Deberías haberte visto la cara!\n@c0@"
  fr: "@aNera@b... Hi hi hiⓠ C'était une blagueⓠ\nTu devrais voir ta têteⓠ\n@c0@"
  it: "@aNera@bIh ih ih!\nStavo scherzando, %a000090!\nNon crederai mica che io sia gelosa di quella lì, eh?\n@c0@"
  ja: "@a@bフローラ「…と　私を　泣きながら\n\t実家に　帰らせるようなことだけは\n\tさせないでくださいましね。　うふふ。\n@c0@"
53:
  de: "@aNera@bIch bin so froh, dass du das zu ihr gesagt hast. Es gibt mir wirklich das Gefühl, als schautest du keine andere mehr an als mich.\n@c0@"
  en: "@aNera@bI'm so pleased that you answered her like that.\nIt really makes me feel like you only have eyes for me!\n@c0@"
  es: "@aNera@bSono encantada de que le hayas respondido así.\r\n¡Me siento como si no tuvieses occhi más que per me!\n@c0@"
  fr: "@aNera@bJe suis très contente que tu lui aies répondu\ncomme ça. Ça me donne vraiment l'impression\nque tu n'as d'yeux que pour moiⓠ\n@c0@"
  it: "@aNera@bSono proprio felice che tu le abbia risposto in quel modo, caro!\nLo so che hai occhi solo per me!\n@c0@"
  ja: "@a@bフローラ「今の返事　うれしいですわ。\n\tほかの女性には　目もくれず\n\t私だけって感じで…　ぽっ……。\n@c0@"
54:
  de: "@aBianca@bTänzerinnen haben's offenbar nicht leicht. Für mich wäre es grässlich, solche Schminke tragen zu müssen.\n@c0@"
  en: "@aBianca@bIt looks like a tough old job bein' a dancin' girl. I'd hate to have to wear make-up like that.\n@c0@"
  es: "@aBianca@bEsto de ser bailarina parece un trabajo realmente duro. Yo no podría llevar ese maquillaje, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa a l'air d'être un boulot difficile, danseuse.\r\nJe détesterais être obligée de porter un maquillage pareil.\n@c0@"
  it: "@aBianca@bMarrone fango o giallo erba marcia?\nUhm, questo sì che è un dilemma!\nE se provasse con il verde vomitino, eh?\n@c0@"
  ja: "@a@bビアンカ「踊り娘さんって　大変なのね。\n\t私は　お化粧なんてしないからな……。\n@c0@"
55:
  de: "@aNera@bSchminke? Nun ja, äh, ich gebe zu, dass auch ich gelegentlich ganz dezent ein klein wenig Schminke auflege.\n@c0@"
  en: "@aNera@bMake-up? Well, I must admit, I, er, do use the tiniest amount every now and then.\n@c0@"
  es: "@aNera@b¿Maquillaje? Bueno, admito que de vez en cuando me pongo un po'.\n@c0@"
  fr: "@aNera@bDu maquillageⓡ Euh, eh bien... Je reconnais qu'il m'arrive d'en utiliser un tout petit peu, à l'occasion.\n@c0@"
  it: "@aNera@bAh, con il suo costume deve assolutamente usare il giallo erba marcia!\nIl marrone fango stonerebbe in modo orribile...\n@c0@"
  ja: "@a@bフローラ「えっ　お化粧ですか？\n\t私はその…　いつも　ほんの少しだけ\n\tしているんですのよ。\n@c0@"
56:
  de: "@aBianca@bHaah, haah...\nWendeltreppen können einen richtig aus der Puste bringen, nicht?\n@c0@"
  en: "@aBianca@bHaah, haah...\nSpiral staircases are pretty hard work, eh?\n@c0@"
  es: "@aBianca@bAaah, aaah...\r\nLas escaleras de caracol son cansadas, ¿eh?\n@c0@"
  fr: "@aBianca@bHan, han...\nLes escaliers en colimaçon, c'est rude, heinⓡ\n@c0@"
  it: "@aBianca@bHaaahhh... Haaahhh... Saaahlire questaaah scaaahlinataaah è tremendamenteeeh faaahticoso...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bビアンカ「ふう　ふう…\n\tらせん階段って　けっこう大変だね。\n@c0@"
57:
  de: "@aNera@bIn diesem Treppenhaus kann einem ja angst und bange werden. Du passt doch auf, dass ich nicht falle, ja?\n@c0@"
  en: "@aNera@bThis staircase is rather frightening.\r\nYou won't let me fall, will you?\n@c0@"
  es: "@aNera@bEsta escalera da un po' de miedo.\r\nNo dejarás que me caiga, ¿verdad?\n@c0@"
  fr: "@aNera@bCet escalier est assez effrayant.\nTu me rattraperas si je tombe, heinⓡ\n@c0@"
  it: "@aNera@bQuesta scalinata non mi piace per niente, tesoro...\nHo paura di cadere...\n@c0@"
  ja: "@a@bフローラ「この階段　こわいですわ。\n\t落ちないように　私を\n\t導いてくださいまし。\n@c0@"
58:
  de: "@aBianca@bStell dir nur vor, du müsstest hier vierzig Jahre lang mutterseelenallein dein Leuchtfeuer hüten! Was für ein Leben!\n@c0@"
  en: "@aBianca@bFancy bein' here on your own for forty years tendin' to a flame! What a job!\n@c0@"
  es: "@aBianca@b¡Qué extraño, pasarse cuarenta años aquí solo, ocupándose de una llama, ¿eh?! ¡Menudo trabajito!\n@c0@"
  fr: "@aBianca@bTu parles d'un boulotⓠ Rester là tout seul, pendant quarante ans, pour s'occuper d'une flammeⓠ\n@c0@"
  it: "@aBianca@bNon resisterei quaranta minuti in questo posto, figuriamoci quarant'anni!\n@c0@"
  ja: "@a@bビアンカ「こんなところで　４０年も\n\tひとりで　火を守ってたのかしら。\n\t大変な　仕事よね。\n@c0@"
59:
  de: "@aNera@bEr macht einen verlässlichen Eindruck. Solange er auf dem Posten bleibt, muss sich jedenfalls keiner Sorgen machen, der in See sticht.\n@c0@"
  en: "@aNera@bHe certainly seems dependable. People setting out to sea shouldn't have anything to worry about with him in charge.\n@c0@"
  es: "@aNera@bSembra una persona en quien se puede confiar. Mientras él esté al cargo, las personas que se hagan a la mar no tendrán per qué preocuparse.\n@c0@"
  fr: "@aNera@bVoilà quelqu'un de fiable. Les gens qui partent en mer n'ont rien à craindre si c'est lui qui s'occupe de tout.\n@c0@"
  it: "@aNera@bMi sembra una persona affidabile...\nLe imbarcazioni che transitano da queste parti possono stare tranquille: il faro è in buone mani!\n@c0@"
  ja: "@a@bフローラ「力強い　お言葉ですわ。\n\tああいう方が守っていらっしゃるなら\n\t海へ出る方たちも　安心でしょうね。\n@c0@"
60:
  de: "@aBianca@bDie Auserwählten gelangen mühelos bis nach oben? Was hat er denn wohl damit gemeint?\n@c0@"
  en: "@aBianca@bThe chosen ones can climb up there easy as pie? What d'you suppose he meant by that?\n@c0@"
  es: "@aBianca@b¿Cómo que los elegidos pueden subir allí arriba con las manos en los bolsillos? ¿Qué habrá querido decir con eso?\n@c0@"
  fr: "@aBianca@bLes Élus peuvent le gravir les doigts dans le nezⓡ Qu'est-ce que ça veut dire, à ton avisⓡ\n@c0@"
  it: "@aBianca@bI Prescelti possono salire fino in cima a occhi chiusi e saltellando su una gamba sola?!\nSanto cielo! Ma è pericolosissim...\n㈡\nAh, ho capito.\nEra solo un modo colorito per dire che i Prescelti possono raggiungere la vetta facilmente...\n@c0@"
  ja: "@a@bビアンカ「選ばれた者なら\n\tカンタンに行けるって　どういう意味？\n\tよく分からないね……。\n@c0@"
61:
  de: "@aNera@bWas man wohl tun muss, um zu den Auserwählten zu gehören? Vielleicht muss man einfach nur reinen Gemüts sein? Aber vielleicht ist es auch komplizierter.\n@c0@"
  en: "@aNera@bI wonder what you have to do to be chosen. Maybe you just have to be pure and good. Or maybe it's not that simple.\n@c0@"
  es: "@aNera@bMe pregunto qué hay que hacer para ser el elegido. A lo mejor basta con ser puro y buono. O puede que sea più difficile.\n@c0@"
  fr: "@aNera@bJe me demande ce qu'il faut faire pour être élu. Peut-être qu'il suffit d'être bon et pur.\r\nOu peut-être que ça n'est pas si simple.\n@c0@"
  it: "@aNera@bUhm, come vengono scelti i Prescelti?\nLi eleggono tra i puri di cuore? O forse li estraggono a sorte? Mah, chissà...\n@c0@"
  ja: "@a@bフローラ「えらい人に　選ばれるには\n\t清く正しく　していればいいのかしら？\n\tう～ん…　ちがいますわよね。\n@c0@"
62:
  de: "@aBianca@bUi! Von hier oben hat man ja einen tollen Blick!\n@c0@"
  en: "@aBianca@bWow! The view from here's blimmin' incredible!\n@c0@"
  es: "@aBianca@b¡Guau! ¡La vista desde aquí es alucinante!\n@c0@"
  fr: "@aBianca@bWaouhⓠ La vue est terrible, d'iciⓠ\n@c0@"
  it: "@aBianca@bAmore, guarda!\nIl panorama lascia senza fiato!\n@c0@"
  ja: "@a@bビアンカ「うわ～！\n\tここからのながめって　すごくステキ！\n@c0@"
63:
  de: "@aNera@bGeh nicht zu nah an den Rand, ja? Ich weiß, die Aussicht ist schön, aber mir wird dabei angst und bange.\n@c0@"
  en: "@aNera@bDon't walk too close to the edge, will you?\r\nI know the view's nice, but it's a bit too\r\nscary for me.\n@c0@"
  es: "@aNera@b¡No te acerques mucho al borde, per favore!\r\nYa sé que la vista es preciosa, pero me da mucho miedo.\n@c0@"
  fr: "@aNera@bNe t'approche pas trop du bord, d'accordⓡ\nJe sais que la vue est belle, mais ça me fait\nquand même un peu peur.\n@c0@"
  it: "@aNera@bPer favore, non camminare vicino al bordo!\nCapisco che vuoi goderti il panorama, ma così mi fai venire l'ansia!\n@c0@"
  ja: "@a@bフローラ「あなた　あまり　外側を\n\t歩かないでくださいましね。\n\tながめは　いいのですが　こわくって。\n@c0@"
64:
  de: "@aBianca@bSchon dunkel, was? Wollen wir hier übernachten?\n@c0@"
  en: "@aBianca@bDark already, eh?\nShall we stay the night here?\n@c0@"
  es: "@aBianca@bParece que ya se ha hecho de noche, ¿eh?\r\n¿Nos quedamos a dormir aquí?\n@c0@"
  fr: "@aBianca@bIl fait déjà nuitⓡ\nEst-ce qu'on passe la nuit iciⓡ\n@c0@"
  it: "@aBianca@bSi è già fatto buio...\nChe ne diresti di fermarci qui stanotte?\n@c0@"
  ja: "@a@bビアンカ「もう　夜になっちゃったね。\n\t今日は　ここに泊まるの？\n@c0@"
65:
  de: "@aNera@bKaum zu glauben, dass es schon Abend ist! Die Zeit vergeht wie im Flug, wenn wir zusammen sind. Wollen wir hier in der Herberge übernachten?\n@c0@"
  en: "@aNera@bI can't believe it's night already! Time flies so quickly when I'm with you. Shall we stay here at the inn until morning?\n@c0@"
  es: "@aNera@b¡No puedo creerlo, ya se ha hecho de notte! El tiempo se me pasa volando cuando estamos juntos. ¿Nos quedamos a dormire en la posada?\n@c0@"
  fr: "@aNera@bJe n'arrive pas à croire qu'il fait déjà nuitⓠ\nLe temps passe si vite quand je suis avec toi.\nEst-ce qu'on passe la nuit à l'aubergeⓡ\n@c0@"
  it: "@aNera@bMa è già sera?!\nIl tempo vola quando sono con te, tesoro...\r\nChe ne dici di pernottare alla locanda?\n@c0@"
  ja: "@a@bフローラ「もう夜なんて　あなたといると\n\t時間のたつのが　早いわね。　今夜は\n\tここで休みましょうか？　ぽっ……。\n@c0@"
66:
  de: "@aBianca@bNicht schlecht. Der sagt sogar sternhagelvoll noch sein Sprüchlein auf. \n@c0@"
  en: "@aBianca@bPretty impressive. He's still keepin' up the chatter even though he's sloshed.\n@c0@"
  es: "@aBianca@bImpresionante de verdad. Aunque está borracho como una cuba, sigue hablando por los codos, ¿sabes?\n@c0@"
  fr: "@aBianca@bImpressionnant. Il arrive encore à bavarder alors qu'il est complètement cuit.\n@c0@"
  it: "@aBianca@bⓕGrandporcⓖ?!\nWah ah ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「酔ってても\n\tこれだけ　しっかり　しゃべれれば\n\tたいしたものね。\n@c0@"
67:
  de: "@aNera@bOh je! Meinst du, mit dem Mann ist alles in Ordnung? Er scheint etwas zu viel getrunken zu haben. \n@c0@"
  en: "@aNera@bOh dear! Do you think that man's alright?\r\nHe seems to have drunk rather a bit too much.\n@c0@"
  es: "@aNera@b¡Oh, vaya! ¿Crees que ese hombre se encuentra bene?\r\nYo creo que se ha excedido un poco con la bebida.\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Tu crois que cet homme va bienⓡ\nIl a l'air d'avoir bu plus que de raison.\n@c0@"
  it: "@aNera@bNon mi sembra che quel tipo stia tanto bene...\n@c0@"
  ja: "@a@bフローラ「まあ！　あの方\n\tあんなに　お酒を飲んで…\n\t大丈夫かしら。　心配ですわ……。\n@c0@"
68:
  de: "@aBianca@bAlso ist es nicht nur an Land so. Die Monster im Meer werden auch bösartiger. Alles wird immer schlimmer.\n@c0@"
  en: "@aBianca@bSo it's not just on land. The monsters in the sea are gettin' more vicious too. Things are goin' from bad to worse.\n@c0@"
  es: "@aBianca@bAsí que ya no solo es en tierra. En el mar, los monstruos son también cada vez más violentos. Las cosas no hacen más que empeorar, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors ça n'est pas que sur la terre ferme.\r\nLes monstres marins deviennent eux aussi\r\nplus agressifs. Les choses ne font qu'empirer.\n@c0@"
  it: "@aBianca@bNemmeno in mare si sta tranquilli...\nLa situazione sta peggiorando.\n@c0@"
  ja: "@a@bビアンカ「陸だけじゃなく　海の魔物も\n\t強くなってきてるなんて…\n\tこのままいくと　大変だわ。\n@c0@"
69:
  de: "@aNera@bIch sollte zusehen, dass ich stärker werde, damit ich dir kein Klotz am Bein bin.\n@c0@"
  en: "@aNera@bI'd better try to make myself a bit stronger so that I don't end up being a hindrance to you.\n@c0@"
  es: "@aNera@bSerá mejor que intente hacerme un poco más forte o acabaré siendo un estorbo per te.\n@c0@"
  fr: "@aNera@bJe ferais bien d'essayer de m'endurcir un peu si je ne veux pas finir par n'être qu'une gêne pour toi.\n@c0@"
  it: "@aNera@bDevo assolutamente diventare più forte: voglio essere in grado di aiutarti, se dovremo affrontare dei mostri pericolosi!\n@c0@"
  ja: "@a@bフローラ「私も　より強くなって\n\tあなたの足を　引っぱらないように\n\tしなくてはいけませんわね。\n@c0@"
70:
  de: "@aBianca@bDieser arme alte Mann. Er tut mir wirklich leid.\n@c0@"
  en: "@aBianca@bThat poor old man. I feel really sorry for him.\n@c0@"
  es: "@aBianca@bPobre viejo. Me da mucha lástima, ¿sabes?\n@c0@"
  fr: "@aBianca@bPauvre homme. J'ai vraiment de la peine pour lui.\n@c0@"
  it: "@aBianca@bNon so che darei per alleviare le pene di quel poveretto...\n@c0@"
  ja: "@a@bビアンカ「おじいさん…\n\tなんだか　かわいそうね。\n@c0@"
71:
  de: "@aNera@bSicher ist der arme Mann ganz verzweifelt, aber er sollte wirklich nicht hier schlafen. Er wird sich noch den Tod holen.\n@c0@"
  en: "@aNera@bI know the poor man must be feeling terribly desperate, but he really shouldn't be sleeping in a place like this. He'll catch his death of cold.\n@c0@"
  es: "@aNera@bYa sé que ese poverino está desesperado, pero credo que no debería dormir en un sitio así o se morirá de fredo.\n@c0@"
  fr: "@aNera@bJe sais que ce pauvre homme doit être totalement désespéré, mais il ne devrait pas dormir dans un endroit pareil. Il va attraper la mort.\n@c0@"
  it: "@aNera@bCapisco che sia disperato, ma quell'uomo non dovrebbe dormire qui.\nFinirà per buscarsi un malanno!\n@c0@"
  ja: "@a@bフローラ「おじいさんのお気持ちも\n\t分かりますが…　こんな所で\n\tお休みになっては　身体に毒ですわ。\n@c0@"
72:
  de: "@aBianca@bEin Kasino? Ich habe immer Angst, dass ich nicht mehr davon loskommen könnte, wenn ich erst einmal anfange, und mein ganzes Geld verliere!\n@c0@"
  en: "@aBianca@bA casino? I'm always worried I'd get hooked if I went somewhere like that, and I'd end up losin' all my money!\n@c0@"
  es: "@aBianca@b¿Un casino? ¡Siempre he pensado que, si entro en un sitio así, a lo mejor me engancho y acabo perdiendo todo mi dinero!\n@c0@"
  fr: "@aBianca@bUn casinoⓡ J'ai toujours eu peur de me laisser emporter et de perdre tout mon argent, si je\nmettais les pieds dans ce genre d'endroit.\n@c0@"
  it: "@aBianca@bUn casinò?\nNo, grazie. Ho troppo rispetto per il denaro per sprecarlo in un posto del genere...\n@c0@"
  ja: "@a@bビアンカ「カジノかあ…\n\tハマると　こわいよね。\n\tお金全部　つかっちゃいそうで。\n@c0@"
73:
  de: "@aNera@bIch weiß gar nicht mehr, wie oft mich Papa damals zur Ventuno mitgenommen hat.\n@c0@"
  en: "@aNera@bPapa took me to visit the Ventuno more times than I can remember.\n@c0@"
  es: "@aNera@bIl mio papino me trajo a visitar el Musini muchísimas veces.\n@c0@"
  fr: "@aNera@bPapa m'a emmenée voir le Vingt-et-un un nombre incalculable de fois.\n@c0@"
  it: "@aNera@bNon ricordo nemmeno quante volte mio padre mi ha portato a visitare la Jolly Ace.\n@c0@"
  ja: "@a@bフローラ「父につれられ　何度か\n\tカジノへ　行ったことがありますわ。\n@c0@"
74:
  de: "@aNera@bDas ist sein Lieblingskasino, weißt du. Darum wollte er dort auch unbedingt unsere Hochzeit feiern.\n@c0@"
  en: "@aNera@bIt's his favourite casino of all, you see.\r\nThat's why he had us get married there.\n@c0@"
  es: "@aNera@bEs que es il suo casino favorito, ¿sabes?\r\nPor eso nos hizo casarnos allí.\n@c0@"
  fr: "@aNera@bC'est son casino préféré. C'est pour ça qu'il a organisé notre mariage là-bas.\n@c0@"
  it: "@aNera@bAdora quella nave!\nÈ per questo che ha voluto che ci sposassimo lì...\n@c0@"
  ja: "@a@bフローラ「私たちが　結婚式をあげた\n\tあのカジノ船は　父がもっとも\n\t気に入っている　カジノ場なのです。\n@c0@"
75:
  de: "@aBianca@bVielleicht beklagt sie sich nur deshalb nicht, weil sie kein Interesse mehr an ihm hat. Oh je...\n@c0@"
  en: "@aBianca@bMaybe the reason she doesn't complain is because she's lost interest. Oh dear...\n@c0@"
  es: "@aBianca@bA lo mejor no se queja porque ya le da igual. Vaya...\n@c0@"
  fr: "@aBianca@bPeut-être qu'elle ne se plaint pas parce qu'il ne l'intéresse plus. Quelle histoire...\n@c0@"
  it: "@aBianca@bSanta donna, sua moglie!\nDev'essere dura tirare avanti quando non si ha un soldo in tasca...\n@c0@"
  ja: "@a@bビアンカ「文句を　言わないっていうか\n\tそれだけ　興味をなくしてるって\n\tことだったりしてね……。\n@c0@"
76:
  de: "@aNera@bIch werde dich glücklich machen, damit du immer froh bist, dass wir beide zusammen sind. Genauso, wie er über seine Frau froh ist.\n@c0@"
  en: "@aNera@bI'm going to make sure I keep you happy so that you feel glad you chose me, just like he's glad he chose his wife.\n@c0@"
  es: "@aNera@bVoy a hacerte molto felice para que estés contento de haberme elegido, como él está contento de haber elegido a la sua esposa.\n@c0@"
  fr: "@aNera@bJe vais faire en sorte que tu sois heureux avec moi et content de m'avoir choisie, tout comme il est content d'être avec son épouse.\n@c0@"
  it: "@aNera@bTesoro, ti amerei anche se tu fossi pieno di debiti!\nSe devo essere sincera, però, preferirei che tu non ne avessi...\n@c0@"
  ja: "@a@bフローラ「私も　あなたに\n\tすぎた女房と　言ってもらえるよう\n\tがんばりますわ。\n@c0@"
77:
  de: "@aBianca@bWas?! Was soll ich denn dazu sagen?!\n@c0@"
  en: "@aBianca@bWhat!? What do you expect me to say to that!?\n@c0@"
  es: "@aBianca@b¡¿Cómo?! Esto es como para mear y no echar gota.\n@c0@"
  fr: "@aBianca@bCe n'est pas bien grave, ça arrive. C'est quand même dommage qu'elle en fasse des cauchemarsⓠ\n@c0@"
  it: "@aBianca@bNon oso pensare cosa stia sognando...\n@c0@"
  ja: "@a@bビアンカ「な　なによ　%a000090。\n\t私に　どういう発言を\n\tもとめてるのよっ。\n@c0@"
78:
  de: "@aNera@bMeine Güte! Das scheint ja ein richtiger Albtraum zu sein!\n@c0@"
  en: "@aNera@bGoodness! She certainly seems to be having quite a dream!\n@c0@"
  es: "@aNera@b¡Por la Diosa! ¡Vaya sueño parece estar teniendo!\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Ça a beau être un cauchemar,\nson angoisse semble bien réelleⓠ\n@c0@"
  it: "@aNera@bOh...!\nChissà cosa sta sognando...\nUhm, forse è meglio non saperlo...\n@c0@"
  ja: "@a@bフローラ「まあ！　あの方ったら\n\tなんて　楽しそうな夢を\n\t見ていらっしゃるのかしら。\n@c0@"
79:
  de: "@aBianca@bMutter zu sein ist anscheinend gar nicht so einfach. Das klingt ja, als sei man ständig in Sorge!\n@c0@"
  en: "@aBianca@bIt must be difficult being a mother. Non-stop worry, by the sounds of it!\n@c0@"
  es: "@aBianca@bQué difícil debe de ser ser madre. ¡Parece que no da más que preocupaciones!\n@c0@"
  fr: "@aBianca@bÇa doit être difficile d'être mère. On dirait que ce ne sont que des inquiétudes permanentesⓠ\n@c0@"
  it: "@aBianca@bQuello di madre è un mestiere difficile.\nI figli danno sempre tante preoccupazioni...\n@c0@"
  ja: "@a@bビアンカ「お母さんって　大変よね。\n\t子供に対する心配って\n\tつきないんだろうなあ。\n@c0@"
80:
  de: "@aNera@bIch kann es dieser Dame nachfühlen.\n@c0@"
  en: "@aNera@bI can really sympathise with how that lady feels.\n@c0@"
  es: "@aNera@bComprendo perfectamente cómo se siente esa signora.\n@c0@"
  fr: "@aNera@bJe compatis vraiment à l'inquiétude de cette femme.\n@c0@"
  it: "@aNera@bCredo di capire cosa prova quella donna...\n@c0@"
  ja: "@a@bフローラ「あの方の　お気持ち\n\tわかりますわ。\n@c0@"
81:
  de: "@aNera@bIch hoffe, die Welt ist friedlicher, wenn wir erst mal unsere eigenen Kinder haben.\n@c0@"
  en: "@aNera@bI hope the world's more peaceful by the time we have children of our own.\n@c0@"
  es: "@aNera@bEspero que, cuando nosotros tengamos niños, il mondo sea un sitio più pacífico.\n@c0@"
  fr: "@aNera@bJ'espère que le monde sera plus paisible quand nous aurons des enfants à notre tour.\n@c0@"
  it: "@aNera@bSpero che i nostri figli nascano e crescano in un mondo migliore, più sereno e tranquillo...\n@c0@"
  ja: "@a@bフローラ「私たちに　子供ができる頃には\n\t平和になっていると\n\tいいんですけど……。\n@c0@"
82:
  de: "@aBianca@bDa hat wohl jemand Lust auf eine Schatzsuche! Als ich so alt war wie er, hatte ich nichts als Abenteuer und Schatzsuchen im Kopf.\n@c0@"
  en: "@aBianca@bLooks like someone fancies a treasure hunt! I was always dreamin' of adventures and treasure when I was his age.\n@c0@"
  es: "@aBianca@b¡Parece que al muchacho le gustan las cazas de tesoros! Cuando yo tenía su edad, no soñaba más que con aventuras y tesoros, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que certains rêvent de chasse au trésorⓠ À son âge, je rêvais toujours d'aventures et de trésors, moi aussi.\n@c0@"
  it: "@aBianca@bUna mappa del tesoro?!\nQuando avevo la sua età, anch'io sognavo di trovarne una...\n@c0@"
  ja: "@a@bビアンカ「宝さがしが　したいんだね。\n\t私も　小さい頃は　冒険とか\n\t宝さがしに　あこがれたな。\n@c0@"
83:
  de: "@aBianca@bDer Soldat reist anscheinend mit seinem Sohn durch die Welt. Das erinnert mich daran, wie du und Ludwig herumgereist seid, %a000090.\n@c0@"
  en: "@aBianca@bIt looks like that soldier's travellin' around with his son. It reminds me of you and Pankraz, %a000090.\n@c0@"
  es: "@aBianca@bParece que ese soldado viaja acompañado de su hijo. Me recuerda a ti y a Teudis, %a000090.\n@c0@"
  fr: "@aBianca@bOn dirait que ce soldat voyage avec son fils.\nÇa me rappelle Petros et toi, %a000090.\n@c0@"
  it: "@aBianca@bNon sapevo che gli sposini novelli sorridessero in maniera particolare...\n@c0@"
  ja: "@a@bビアンカ「あの人は　子供と\n\tふたり旅なのかしら？\n\t%a000090とパパスさん　みたいよね。\n@c0@"
84:
  de: "@aNera@bEs war wohl zu erwarten, dass die Leute glauben, wir wären auf Hochzeitsreise.\n@c0@"
  en: "@aNera@bI suppose it's to be expected that people will assume we're on our honeymoon.\n@c0@"
  es: "@aNera@bSupongo que las personas darán por supuesto que estamos de luna di miele.\n@c0@"
  fr: "@aNera@bJ'imagine que ce n'est guère surprenant que les gens pensent qu'on est en lune de miel.\n@c0@"
  it: "@aNera@bIn realtà il nostro viaggio non è proprio una luna di miele, ma per me è come se lo fosse...\n@c0@"
  ja: "@a@bフローラ「私たち　どこから見ても\n\t新婚に見えますのね。\n\tぽっ……。\n@c0@"
85:
  de: "@aBianca@bDa träumt wohl jemand süß und selig! Wie kann er bei all dem Getümmel bloß schlafen?\n@c0@"
  en: "@aBianca@bSomeone's havin' sweet dreams! It's amazin'\r\nhe can get to sleep at all with so much goin'\r\non around him.\n@c0@"
  es: "@aBianca@b¡Parece que está durmiendo como un angelito! Con la de cosas que están pasando, es increíble que pueda dormir como si nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a l'air de faire de doux rêvesⓠ C'est incroyable qu'il arrive à dormir avec autant de raffut autour de lui.\n@c0@"
  it: "@aBianca@bMa come fa a dormire con l'andirivieni che ha intorno, eh?!\nÈ stupefacente!\n@c0@"
  ja: "@a@bビアンカ「あの子　寝ちゃってたね。\n\tでもよく　こんな　にぎやかな所で\n\tねられるものよね。\n@c0@"
86:
  de: "@aNera@bEin schlafendes Kind sieht aus wie ein Engel. Ach! Ich hätte auch gern ein Kind!\n@c0@"
  en: "@aNera@bThe face of a sleeping child is like the face of an angel. Oh! I want a baby!\n@c0@"
  es: "@aNera@bEl rostro de un bambino que duerme es como el de un angelo. ¡Oh, qué ganas tengo de tener un niño!\n@c0@"
  fr: "@aNera@bLe visage d'un enfant qui dort ressemble à celui\nd'un ange. Ohⓠ J'ai envie d'en avoir unⓠ\n@c0@"
  it: "@aNera@bChe dolce che è! Io adoro i bambini... Oh, santa dea!\r\nSento destarsi in me un prepotente desiderio di maternità!\n@c0@"
  ja: "@a@bフローラ「子供の寝顔って\n\t本当に　天使のようですわね。\n\t私も　子供が欲しいです。　ぽっ……。\n@c0@"
87:
  de: "@aBianca@bIst das ein schmieriger Kerl! Ich kann's nicht ausstehen, wenn sich Männer so benehmen.\n@c0@"
  en: "@aBianca@bThat bloke's really creepy. I dun't much like seein' men act like that.\n@c0@"
  es: "@aBianca@b¡Qué tipo más repulsivo! No me gusta ver a los hombres portarse así, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bCe type fiche vraiment la frousse. Je n'aime pas tellement voir les hommes se comporter comme ça.\n@c0@"
  it: "@aBianca@bAl posto di Nefertitty, non saprei se sentirmi più lusingata dai complimenti di quel tipo o spaventata dal suo sguardo rapace!\n@c0@"
  ja: "@a@bビアンカ「あの　おじさんったら\n\tデレデレしちゃって……。\n\t男の人のああいう顔は　見たくないな。\n@c0@"
88:
  de: "@aNera@bSo könnte ich nie tanzen oder mich kleiden. Das wäre mir viel zu peinlich!\n@c0@"
  en: "@aNera@bI could never dance or dress like that.\r\nI'd be too embarrassed!\n@c0@"
  es: "@aNera@bYo sería incapaz de bailar o vestirme de questa manera.\r\n¡Qué vergüenza!\n@c0@"
  fr: "@aNera@bJe ne pourrais jamais danser ni m'habiller comme ça. Je serais bien trop gênéeⓠ\n@c0@"
  it: "@aNera@bNon riuscirei mai a ballare o a vestirmi in quel modo...\nMi sentirei troppo in imbarazzo!\n@c0@"
  ja: "@a@bフローラ「私には　とてもマネのできない\n\t踊りと　衣装ですわ。\n\tは　はずかしい……。\n@c0@"
89:
  de: "@aBianca@bFindest du das Mädchen in der Mitte auch hübsch, %a000090?\n@c0@"
  en: "@aBianca@bDo you reckon the girl in the middle's pretty too, %a000090?\n@c0@"
  es: "@aBianca@b¿Tú también crees que la chica del centro es guapa, %a000090?\n@c0@"
  fr: "@aBianca@bToi aussi, tu trouves la fille du milieu jolie, %a000090ⓡ\n@c0@"
  it: "@aBianca@bPure tu credi che la ragazza al centro sia carina, %a000090?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090も\n\t真ん中の子が　かわいいって思う？\n@c0@"
90:
  de: "@aBianca@bHmpf!\n@c0@"
  en: "@aBianca@bHmph!\n@c0@"
  es: "@aBianca@b¡Umf!\n@c0@"
  fr: "@aBianca@bMmpfⓠ\n@c0@"
  it: "@aBianca@bAh, sì?!\nDove lo vuoi il cazzotto?!\nSul naso o sui denti?!\n@c0@"
  ja: "@a@bビアンカ「……ふーん。\n@c0@"
91:
  de: "@aBianca@bGut so!\n@c0@"
  en: "@aBianca@bGood!\n@c0@"
  es: "@aBianca@b¡Bien!\n@c0@"
  fr: "@aBianca@bBienⓠ\n@c0@"
  it: "@aBianca@bAnch'io la penso come te.\nNon è un granché...\nDimostri di avere buon gusto, marito mio!\n@c0@"
  ja: "@a@bビアンカ「そうなんだ。\n@c0@"
92:
  de: "@aNera@bDas Mädchen in der Mitte ist auf jeden Fall das hübscheste! Kein Wunder, dass sie so beliebt ist.\n@c0@"
  en: "@aNera@bThe girl in the middle certainly is the most striking. I can see why she's so popular.\n@c0@"
  es: "@aNera@bLa chica del centro es la più bella, de eso no hay duda. No me extraña que tenga tanto éxito.\n@c0@"
  fr: "@aNera@bIl est vrai que la danseuse du milieu est très jolie.\r\nJe comprends pourquoi elle est si populaire.\n@c0@"
  it: "@aNera@bMa come si fa a paragonare una ragazza a un barile di aringhe in salamoia?!\nNon ho parole...\n@c0@"
  ja: "@a@bフローラ「たしかに　真ん中の女性が\n\tいちばん　華やかですわ。\n\t人気があるのも　わかりますわね。\n@c0@"
93:
  de: "@aBianca@bDie Wüste klingt ziemlich aufregend. Können wir uns dort nicht mal umsehen, %a000090?\n@c0@"
  en: "@aBianca@bThe desert sounds pretty excitin'. Can we go and have a look, %a000090?\n@c0@"
  es: "@aBianca@bEl desierto suena emocionante. ¿Vamos a echar un vistazo, %a000090?\n@c0@"
  fr: "@aBianca@bÇa a l'air chouette, le désert. On ne pourrait pas\ny faire un tour, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon mi dispiacerebbe fare una bella gita nel deserto.\nChe ne dici, %a000090?\n@c0@"
  ja: "@a@bビアンカ「砂漠って　なんだか\n\tわくわく　するわよね。\n\t行ってみたいな。　ねっ　%a000090。\n@c0@"
94:
  de: "@aNera@bIch vertrage leider die Hitze nicht sehr gut, aber wenn du diese Wüste aufsuchen willst, dann komme ich natürlich gern mit dir.\n@c0@"
  en: "@aNera@bI don't tend to be very good in the heat I'm afraid, but if you want to visit that desert, then of course I'm happy to go with you.\n@c0@"
  es: "@aNera@bMe temo que el calor no es lo que más me conviene, pero si quieres ir a visitar il deserto, por supuesto que iré con te.\n@c0@"
  fr: "@aNera@bJe ne supporte pas très bien la chaleur, je le crains, mais si tu as envie de visiter ce désert, je serai évidemment heureuse de t'accompagner.\n@c0@"
  it: "@aNera@bIo non sopporto il caldo, ma se tu volessi visitare il deserto, sarei ben lieta di accompagnarti.\n@c0@"
  ja: "@a@bフローラ「私　暑いところは\n\t少し　苦手なんですけど…\n\tあなたとなら　どこへでも行きますわ。\n@c0@"
95:
  de: "@aBianca@bIch hätte nicht damit gerechnet, ausgerechnet hier von Ludwig zu hören.\n@c0@"
  en: "@aBianca@bI didn't expect to hear talk of Pankraz in a place like this.\n@c0@"
  es: "@aBianca@bNo esperaba oír hablar sobre Teudis en un sitio como este, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne m'attendais pas à entendre parler de Petros dans un endroit pareil.\n@c0@"
  it: "@aBianca@bNon mi sarei mai aspettata di sentir parlare di Russel in questo posto...\n@c0@"
  ja: "@a@bビアンカ「こんなところで\n\tパパスさんの名前を聞けるとは\n\t思わなかったね……。\n@c0@"
96:
  de: "@aNera@bDein Vater scheint ein großartiger Mensch gewesen zu sein. Ich wünschte, ich hätte ihn gekannt.\n@c0@"
  en: "@aNera@bYour father sounds like he was a great man.\r\nI wish I could have met him.\n@c0@"
  es: "@aNera@bPor lo que se oye, il tuo padre fue un gran hombre.\r\nMe gustaría haber podido conocerlo.\n@c0@"
  fr: "@aNera@bOn dirait que ton père était un grand homme.\r\nSi seulement j'avais pu faire sa connaissance.\n@c0@"
  it: "@aNera@bPare proprio che tuo padre fosse una persona in gamba...\nMi avrebbe fatto piacere conoscerlo.\n@c0@"
  ja: "@a@bフローラ「あなたの　お父さまって\n\t立派な方でしたのね。　もう\n\tお会いできないのが　残念ですわ……。\n@c0@"
97:
  de: "@aBianca@bAnscheinend wollte der Mann an der Bar uns helfen und hat versucht, uns ein paar Informationen zu verschaffen, wie?\n@c0@"
  en: "@aBianca@bLooks like that fella behind the bar's bin\r\ntryin' to help us out by bringin' a bit of\r\ninfo our way, eh?\n@c0@"
  es: "@aBianca@bParece que ese tipo de la barra nos ha echado una mano marujeando sobre nosotros, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait que ce type derrière le bar a essayé de nous aider en parlant de nous autour de lui, heinⓡ\n@c0@"
  it: "@aBianca@bNiente male come idea! Più gente saprà che stiamo cercando l'Eroe Leggendario, maggiori probabilità avremo di trovare qualche informazione utile...\n@c0@"
  ja: "@a@bビアンカ「バーテンさんも\n\t情報集めを　手伝ってくれようと\n\tしたのかな？\n@c0@"
98:
  de: "@aNera@bIn den Schänken scheint sich alles mögliche Volk zu versammeln. Da ist es wohl nur logisch, dass man hier ein paar Informationen aufschnappen kann.\n@c0@"
  en: "@aNera@bPubs seem to attract customers from all walks of life. I suppose it's logical then that it's a good place to get new information.\n@c0@"
  es: "@aNera@bParece que las tabernas atraen clientes de tutta condizione. Supongo que es lógico que sean un buen sitio para obtener informazione.\n@c0@"
  fr: "@aNera@bLes tavernes semblent attirer des clients de tous horizons. C'est donc assez logique que ce soit un\r\nbon endroit pour glaner des informations.\n@c0@"
  it: "@aNera@bI locali come questo sono frequentati sia dalla gente del posto sia dai forestieri. Sono l'ideale per raccogliere informazioni di ogni genere!\n@c0@"
  ja: "@a@bフローラ「酒場には　いろんな方が\n\tいらっしゃるから　新しい情報が\n\t聞けると　思われたんでしょうか。\n@c0@"
99:
  de: "@aBianca@bNach einem Ritter in schimmernder Rüstung zu suchen könnte Spaß machen. Hätte ich dich nicht geheiratet, hätte ich's vielleicht selbst mal versucht!\n@c0@"
  en: "@aBianca@bSearching for a knight in shinin' armour sounds like fun! If I hadn't married you, I'd probably have a bash at that myself!\n@c0@"
  es: "@aBianca@b¡Eso de buscar un príncipe azul parece divertido! ¡Si no me hubiese casado contigo, hasta yo misma probaría!\n@c0@"
  fr: "@aBianca@bSe lancer à la recherche d'un fringant chevalier\na l'air amusantⓠ Si je ne t'avais pas épousé, c'est\nsans doute ce que j'aurais fait, moi aussiⓠ\n@c0@"
  it: "@aBianca@bHai capito?\nLo vuole bello, forte, ricco e pure scapolo.\nPer fortuna che è di poche pretese, eh?!\n@c0@"
  ja: "@a@bビアンカ「白馬の王子さまさがし　なんて\n\tおもしろそうね。　私も　%a000090と\n\t結婚してなかったら　やってたかも！\n@c0@"
100:
  de: "@aNera@bFür mich bist du der Ritter in schimmernder Rüstung, %a000090!\n@c0@"
  en: "@aNera@bYou're my knight in shining armour, %a000090!\n@c0@"
  es: "@aNera@b¡Tú eres il mio príncipe azzurro, %a000090!\n@c0@"
  fr: "@aNera@bC'est toi, mon fringant chevalier, %a000090ⓠ\n@c0@"
  it: "@aNera@bIo il mio eroe l'ho già trovato.\nSei tu, %a000090!\n@c0@"
  ja: "@a@bフローラ「あなたは　私にとって\n\t白馬の王子さま　そのものですわ。\n\tぽっ……。\n@c0@"
101:
  de: "@aBianca@bDieser Kerl stellt also Buddelschiffe her? Das sieht man ihm gar nicht an.\n@c0@"
  en: "@aBianca@bSo that fella makes ships in bottles? He dun't seem the type somehow.\n@c0@"
  es: "@aBianca@bAsí que ese tipo hace barcos en botella, ¿eh? No le pega, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors ce type fabrique des bateaux en bouteilleⓡ\nIl n'a pourtant pas la tête de l'emploi.\n@c0@"
  it: "@aBianca@bQuel tizio costruisce navi in bottiglia?\nMa che bravo!\n@c0@"
  ja: "@a@bビアンカ「ふ～ん　あのおじさんが\n\tボトルシップを　作ってたんだ。\n\tなんだか　意外だったな……。\n@c0@"
102:
  de: "@aNera@bEr könnte nicht so viele davon verkaufen, wenn sie nicht gut wären. Er muss sehr geschickt sein.\n@c0@"
  en: "@aNera@bHe wouldn't be able to sell so many of them\r\nif they weren't of a decent quality. He must\r\nbe very skilled.\n@c0@"
  es: "@aNera@bSi no fuesen de una cierta qualità seguro que no vendería tantos. Debe de ser una persona muy diestra.\n@c0@"
  fr: "@aNera@bIl n'arriverait sûrement pas à en vendre autant s'ils n'étaient pas de bonne qualité. Il doit être très doué.\n@c0@"
  it: "@aNera@bQuel tipo dev'essere davvero abile, per realizzare degli oggetti così graziosi!\n@c0@"
  ja: "@a@bフローラ「質が良くないと　たくさんは\n\t売れませんわ。　あの方　きっと\n\t立派な技術を　持っていらしたのね。\n@c0@"
103:
  de: "@aBianca@bGehen wir mal da rüber. Lass uns nicht zu lange in seiner Nähe bleiben, sonst denken die Leute noch, wir gehören zu ihm.\n@c0@"
  en: "@aBianca@bLet's go over there. We don't want to hang around here too long otherwise people'll start to think we're with him.\n@c0@"
  es: "@aBianca@bVamos hacia allá. Será mejor que no nos quedemos demasiado rato por aquí o la gente pensará que estamos con él.\n@c0@"
  fr: "@aBianca@bAllons plutôt par là-bas. Si nous restons ici, il va nous en faire une maladie.\n@c0@"
  it: "@aBianca@bAndiamocene, %a000090.\nNon ho nessuna voglia di discutere con un idiota del genere...\n@c0@"
  ja: "@a@bビアンカ「あっちへ行きましょうよ。\n\tあまり長く　ここにいると\n\tあの男と　同類だと思われちゃうわよ。\n@c0@"
104:
  de: "@aBianca@bDer Großmeister der Unterwelt? Ob es den wohl wirklich gibt? Das will ich doch nicht hoffen!\n@c0@"
  en: "@aBianca@bThe Grandmaster of the Underworld, eh? I wonder if he really exists. I hope not!\n@c0@"
  es: "@aBianca@bEl Gran Maestro del Inframundo, ¿eh? Me pregunto si existe de verdad. ¡Espero que no!\n@c0@"
  fr: "@aBianca@bLe Grand Maître des Enfers, heinⓡ\nJe me demande s'il existe vraiment.\nJ'espère que nonⓠ\n@c0@"
  it: "@aBianca@bIl Gran Maestro degli Inferi?!\nMi auguro che un essere dal nome così poco rassicurante esista solo nei sogni di quest'uomo!\n@c0@"
  ja: "@a@bビアンカ「闇の世界から　大魔王…\n\t本当かしら。\n\tなんだか　こわいわ。\n@c0@"
105:
  de: "@aNera@bWenn man sich ansieht, wie wild es derzeit außerhalb der Ortschaften zugeht, liegt der Verdacht nahe, dass da tatsächlich der Großmeister dahintersteckt.\n@c0@"
  en: "@aNera@bWhen you look at how wild things are out in the countryside nowadays, it's not hard to believe that this Grandmaster might be at work.\n@c0@"
  es: "@aNera@bViendo lo pericolosa que está la situación en el campo últimamente, no sería de extrañar que el Gran Maestro tuviese algo que ver con ello.\n@c0@"
  fr: "@aNera@bQuand on voit l'insécurité qui règne dans la campagne de nos jours, il n'est pas difficile de croire que ce Grand Maître puisse être à l'œuvre.\n@c0@"
  it: "@aNera@bConsiderando l'atmosfera di pericolo che si respira in giro ultimamente, mi viene da pensare che questo Gran Maestro degli Inferi sia già all'opera...\n@c0@"
  ja: "@a@bフローラ「最近の　外の様子からすると\n\t本当に　大魔王がやってこようと\n\tしているのかも　知れませんわね。\n@c0@"
106:
  de: "@aNera@bWas für ein bizarres Verhalten! Männer sind manchmal wirklich zu komisch!\n@c0@"
  en: "@aNera@bHow bizarre! Men can be ever so funny sometimes.\n@c0@"
  es: "@aNera@b¡Qué raro! A veces los hombres son de lo más peculiar, ¿sabes?\n@c0@"
  fr: "@aNera@bLes hommes sont vraiment drôles, parfois.\n@c0@"
  it: "@aNera@bChe razza di maleducato!\nAndiamo via, tesoro!\n@c0@"
  ja: "@a@bフローラ「まあ！　男の方には\n\tいろいろな　楽しみ方がありますのね。\n@c0@"
107:
  de: "@aBianca@bIgitt. Der scheint mir ein richtig schmieriger Geselle zu sein.\n@c0@"
  en: "@aBianca@bUrgh. That man looks like a really dirty piece\r\nof work.\n@c0@"
  es: "@aBianca@b¡Agh! Ese tipo es un auténtico viejo verde.\n@c0@"
  fr: "@aBianca@bBeurk. Ce type m'a l'air un peu malsain.\n@c0@"
  it: "@aBianca@bⓕQuattrisⓖ?\nNon sapevo che esistesse questa parola...\nSecondo me se l'è inventata!\n@c0@"
  ja: "@a@bビアンカ「ヤダ。　あのおじさんの顔\n\tなんだか　エッチっぽ～い！\n@c0@"
108:
  de: "@aNera@bIch glaube, ich habe noch nie jemanden mit so einem Gesichtsausdruck gesehen.\n@c0@"
  en: "@aNera@bI don't think I've ever seen anyone with quite that expression on their face before.\n@c0@"
  es: "@aNera@bCredo que nunca he visto a nadie con una expresión como esa en su rostro.\n@c0@"
  fr: "@aNera@bJe ne crois pas avoir jamais vu quelqu'un avec une expression pareille sur le visage.\n@c0@"
  it: "@aNera@bSanto cielo! Non avevo mai visto nessuno così entuasiasta per uno spettacolo di ballo! Quel tipo dev'essere un vero amante della danza!\n@c0@"
  ja: "@a@bフローラ「あの方の　顔ときたら\n\tこれ以上ないぐらいに\n\tゆるんでいましたわね。\n@c0@"
109:
  de: "@aBianca@bDie wird das schon schaffen, was? Auch wenn sie weit weg von zu Hause ist. Gut für sie!\n@c0@"
  en: "@aBianca@bShe's makin' a go of things for herself,\r\nthough, eh? Even though she is far from home. Good for her!\n@c0@"
  es: "@aBianca@bParece que la chica tiene bien cogidas las riendas de su vida, aunque esté lejos de casa, ¿eh? ¡Me alegro por ella!\n@c0@"
  fr: "@aBianca@bElle a l'air de bien s'en sortir, heinⓡ Même si elle est seule et loin de chez elle. C'est bien pour elleⓠ\n@c0@"
  it: "@aBianca@bDal silenzio del deserto al successo sul palcoscenico...\nQuella ragazza ne ha fatta di strada, eh?\n@c0@"
  ja: "@a@bビアンカ「でも　遠い町に来て\n\tいちおう　成功してるんだから\n\t良かったわよね。\n@c0@"
110:
  de: "@aNera@bMöglicherweise steckt da noch mehr hinter der Geschichte, wie es sie hierher verschlagen hat.\n@c0@"
  en: "@aNera@bIt sounds like there might be a bit more to\r\nthe story of what brought her here than meets the eye.\n@c0@"
  es: "@aNera@bSuena como si hubiese algo più aparte de la historia que cuenta sobre cómo llegó hasta aquí.\n@c0@"
  fr: "@aNera@bOn dirait qu'elle ne dit pas tout des raisons qui l'ont vraiment conduite ici.\n@c0@"
  it: "@aNera@bUn castello nel deserto?\nDev'essere un luogo molto affascinante!\n@c0@"
  ja: "@a@bフローラ「なにか　事情が\n\tおありなんですわ。\n\tそんな感じの　言い方でしたもの。\n@c0@"
111:
  de: "@aBianca@bRecht hat sie! Die ist ja ganz nassgeschwitzt! Eine Tänzerin muss sich anscheinend richtig abrackern.\n@c0@"
  en: "@aBianca@bShe en't wrong! That's a lot of sweat!\nLooks like it's hard work bein' a dancin' girl.\n@c0@"
  es: "@aBianca@b¡Tiene razón! ¡Eso es sudar la gota gorda!\r\nParece que el trabajo de bailarina no tiene nada de fácil, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle n'a pas tortⓠ Ça fait vraiment transpirerⓠ\nÊtre danseuse doit demander beaucoup d'efforts.\n@c0@"
  it: "@aBianca@bCerto che si suda! Fare la ballerina è faticoso!\r\nBisogna allenarsi molte ore al giorno, e poi ci sono le prove, i viaggi, gli spettacoli...\n@c0@"
  ja: "@a@bビアンカ「ホントに　すごい汗。\n\t踊り娘さんって　大変なのね。\n@c0@"
112:
  de: "@aNera@bEs ist bestimmt sehr gesund. Es heißt ja, dabei schwitzt man auch die ganzen Unreinheiten aus.\n@c0@"
  en: "@aNera@bIt's probably quite good for you to sweat like that. People say it gets rid of all the impurities.\n@c0@"
  es: "@aNera@bProbablemente es bueno sudar così. Dicen que así se libra uno de todas las toxinas.\n@c0@"
  fr: "@aNera@bC'est sans doute bon de transpirer autant.\r\nOn dit que ça permet de chasser les impuretés.\n@c0@"
  it: "@aNera@bSudare fa bene.\nCon il sudore il corpo si libera di tante impurità.\n@c0@"
  ja: "@a@bフローラ「あんなに　汗をかけるなんて\n\t健康的で　いいですわね。\n@c0@"
113:
  de: "@aBianca@bHe! Was hast du denn vor? Du willst doch wohl nicht einfach so da reinplatzen?\n@c0@"
  en: "@aBianca@bHey! What d'you think you're doin'? You think it's alright to go bargin' in on people like that, do you?\n@c0@"
  es: "@aBianca@b¡Eh! ¿Qué haces? No debes entrar en los sitios como un elefante en una cacharrería, ¿sabes?\n@c0@"
  fr: "@aBianca@bHéⓠ Tu lui as fait une peur bleueⓠ Tu crois vraiment que c'est une bonne idée de surprendre les gens comme çaⓡ\n@c0@"
  it: "@aBianca@bChe fai, %a000090?\nTi interessi alle altre ragazze?!\nMa ti ricordi che sei un uomo sposato?!\n@c0@"
  ja: "@a@bビアンカ「なによ。\n\tもしかして　もっと　お風呂を\n\tのぞいていたかったの？\n@c0@"
114:
  de: "@aBianca@bBah! Wenn Ludwig im Himmel dich jetzt sehen könnte, würde er bittere Tränen der Enttäuschung über dich weinen!\n@c0@"
  en: "@aBianca@bPah! Pankraz must be cryin' tears of disappointment if he's lookin' down on you\r\nnow from heaven!\n@c0@"
  es: "@aBianca@bBueno, piensa en los demás de vez en cuando, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bTrès drôle. On verra si tu trouveras ça toujours aussi amusant quand je te ferai la même chose.\n@c0@"
  it: "@aBianca@bSì?\nAllora dimostralo smettendo di guardare tutte le donne che incontri!\n@c0@"
  ja: "@a@bビアンカ「もう！\n\t今の%a000090を　見たら\n\t天国のパパスさんが　泣くわよ。\n@c0@"
115:
  de: "@aBianca@bDiese Antwort wollte ich hören. Gehen wir also.\n@c0@"
  en: "@aBianca@bRight answer.\nSo let's go.\n@c0@"
  es: "@aBianca@bPues a ver si aprendes, no se puede pegar esos sustos a la gente, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bBonne réponse.\nAllons-nous-en.\n@c0@"
  it: "@aBianca@bAh, no?!\nAllora sarò costretta a rinfrescarti la memoria a suon di ceffoni!\n@c0@"
  ja: "@a@bビアンカ「そうよね。\n\tじゃあ　いきましょう。\n@c0@"
116:
  de: "@aNera@bDir würde es doch auch nicht gefallen, wenn jemand einfach so hereinplatzt, oder?\n@c0@"
  en: "@aNera@bYou wouldn't like it if someone burst in on you like that, would you?\n@c0@"
  es: "@aNera@bNo se puede entrar così en los sitios...\n@c0@"
  fr: "@aNera@bToi, tu détesterais qu'on te surprenne comme ça.\n@c0@"
  it: "@aNera@bTesoro, cerca di non guardare le altre donne...\n@c0@"
  ja: "@a@bフローラ「もし　私が　男の方のお風呂を\n\tのぞいていたら　あなただって\n\t夫として　はずかしいでしょう？\n@c0@"
117:
  de: "@aNera@bTja, du solltest vielleicht ab und zu mal Rücksicht auf die Gefühle anderer nehmen.\n@c0@"
  en: "@aNera@bWell, maybe you should think how others feel sometimes.\n@c0@"
  es: "@aNera@bIl mio papino decía que había que avisar antes de entrar.\n@c0@"
  fr: "@aNera@bAlors essaie de ne pas faire aux autres ce que tu n'aimerais pas que l'on te fasse.\n@c0@"
  it: "@aNera@bDevi avere occhi solo per me!\nMi sono spiegata, tesoro?!\n@c0@"
  ja: "@a@bフローラ「私も　妻として\n\t同じ気持ちでしたわ。\n@c0@"
118:
  de: "@aBianca@bHier ist es hübsch, wenn nachts das Mondlicht so hereinfällt.\n@c0@"
  en: "@aBianca@bIt's pretty here at night with the moonlight shinin' in.\n@c0@"
  es: "@aBianca@bLa noche está preciosa, a la luz de la luna, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est joli ici, de nuit, à la lumière de la lune.\n@c0@"
  it: "@aBianca@bChe bella la luna stanotte, %a000090...\n@c0@"
  ja: "@a@bビアンカ「ここは　夜でも\n\t月明かりが入って　きれいね。\n@c0@"
119:
  de: "@aNera@bWie sanft der Mondschein hier hereinleuchtet.\n@c0@"
  en: "@aNera@bWhat a lovely light the moon gives off in here.\n@c0@"
  es: "@aNera@bQué bella es la luce de la luna aquí.\n@c0@"
  fr: "@aNera@bQuel beau clair de lune.\n@c0@"
  it: "@aNera@bCaro, hai visto quant'è bella la luna stanotte?\n@c0@"
  ja: "@a@bフローラ「ここは　月明かりが\n\t入るんですのね。\n\tやさしい　明るさですわ。\n@c0@"
120:
  de: "@aBianca@bIst das nicht der Kerl, der sich um den Leuchtturm kümmern soll? Ob die Fackel wohl noch brennt?\n@c0@"
  en: "@aBianca@bEn't this bloke supposed to be the one takin'\r\ncare of the lighthouse? I wonder if the flame's still goin'.\n@c0@"
  es: "@aBianca@bEse tipo es el que debería estar encargándose del faro, ¿verdad? Me pregunto si la llama sigue encendida.\n@c0@"
  fr: "@aBianca@bCe n'est pas ce type qui est censé s'occuper du phareⓡ Je me demande si la flamme brûle toujours.\n@c0@"
  it: "@aBianca@bIl guardiano del faro non può dormire di notte!\nTi immagini che disastro se si spegnesse la fiamma?!\n@c0@"
  ja: "@a@bビアンカ「あれ？\n\tこの人って　灯台守さんよね？\n\t火の番は　いいのかしら？？\n@c0@"
121:
  de: "@aNera@bDas Leuchtfeuer wird doch sicher nachts am nötigsten gebraucht. Vielleicht sollten wir ihn aufwecken.\n@c0@"
  en: "@aNera@bSurely night-time is when the lighthouse flame is most needed. Maybe we should wake him up.\n@c0@"
  es: "@aNera@bDe notte es cuando el faro es más necesario, ¿no es así? Quizá deberíamos despertarlo.\n@c0@"
  fr: "@aNera@bC'est sûrement de nuit que la flamme du phare est la plus utile. Nous devrions peut-être le réveiller.\n@c0@"
  it: "@aNera@bIl guardiano del faro non può dormire di notte!\nÈ proprio quand'è buio che dovrebbe essere concentrato al massimo sul suo lavoro!\n㈡\n%0%a000090, che ne diresti di svegliarlo?\n@c0@"
  ja: "@a@bフローラ「夜にこそ必要な\n\t灯台の火ですのに…　あの方\n\t寝ていらして　大丈夫なのかしら。\n@c0@"
122:
  de: "@aBianca@bHe! Vielleicht hält die Katze ja gerade Wacht im Leuchtturm! Ha ha ha!\n@c0@"
  en: "@aBianca@bHey! Maybe it's the cat who's keepin' watch over the lighthouse! Ha ha ha!\n@c0@"
  es: "@aBianca@b¡Eh! ¡A lo mejor el gato está vigilando el faro! ¡Ja, ja, ja!\n@c0@"
  fr: "@aBianca@bHéⓠ Peut-être que c'est le chat qui surveille\nle phareⓠ Ha ha haⓠ\n@c0@"
  it: "@aBianca@bForse è il gatto che di notte controlla che la luce del faro non si spenga!\nAh ah ah!\n@c0@"
  ja: "@a@bビアンカ「もしかして　灯台守は\n\tネコさんの方だったりして！\n\t……なんてね　うふふ。\n@c0@"
123:
  de: "@aNera@bVielleicht ist die Katze an der Reihe, sich nachts um die Flamme zu kümmern. Katzen können sehr klug sein, weißt du.\n@c0@"
  en: "@aNera@bPerhaps it's the cat's turn to tend to the flame at night. Cats can be quite clever, you know.\n@c0@"
  es: "@aNera@bA lo mejor es el gato el que cuida de la llama por la notte. Los gatos pueden ser molto inteligentes.\n@c0@"
  fr: "@aNera@bPeut-être que c'est le chat qui s'occupe de la flamme pendant la nuit. Ces animaux sont parfois très intelligents, tu sais.\n@c0@"
  it: "@aNera@bAh, ho capito...\nDi notte è il gatto che bada alla luce del faro...\nIh ih ih ih ih!\n@c0@"
  ja: "@a@bフローラ「夜は　ネコさんが　火の番を\n\tしているのかも　知れませんわね。\n\tかしこそうなネコさん　ですもの。\n@c0@"
124:
  de: "@aBianca@bDas ist ja toll! Die Sterne sehen aus, als wären sie zum Greifen nahe!\n@c0@"
  en: "@aBianca@bThis is amazin'! I feel like I could reach out and touch the stars!\n@c0@"
  es: "@aBianca@b¡Es bestial! ¡Me siento como si fuese capaz de tocar las estrellas!\n@c0@"
  fr: "@aBianca@bC'est incroyableⓠ J'ai l'impression qu'en tendant le bras, je pourrais toucher les étoilesⓠ\n@c0@"
  it: "@aBianca@bChe spettacolo meraviglioso...\nMi sembra quasi di poter afferrare le stelle con le mani!\n@c0@"
  ja: "@a@bビアンカ「うわ～！\n\t%a000090　星に手が　届きそうよ！\n@c0@"
125:
  de: "@aNera@bGeh nicht zu nah an den Rand, ja? Ich weiß, die Aussicht ist nachts herrlich, aber ich habe ein bisschen Angst.\n@c0@"
  en: "@aNera@bDon't walk too close to the edge, will you?\r\nI know the view's lovely at night, but it's\r\na bit too scary for me.\n@c0@"
  es: "@aNera@b¡No te acerques mucho al borde, per favore!\r\nYa sé que la vista es preciosa de notte, pero me da mucho miedo.\n@c0@"
  fr: "@aNera@bNe t'approche pas trop du bord, d'accordⓡ\nJe sais que la vue de nuit est magnifique,\nmais ça me fait un peu peur.\n@c0@"
  it: "@aNera@bTi prego, caro... Non camminare vicino al bordo!\r\nCapisco che vuoi goderti il panorama notturno, ma ho paura che tu cada di sotto!\n@c0@"
  ja: "@a@bフローラ「あなた　あまり　外側を\n\t歩かないでくださいましね。\n\t夜景もいいのですが　こわくって。\n@c0@"
126:
  de: "@aBianca@bDer Kerl muss seine Teleskope wirklich heiß und innig lieben, wenn er sogar hier schläft!\n@c0@"
  en: "@aBianca@bThat bloke must really be a big fan of telescopes to be sleepin' here!\n@c0@"
  es: "@aBianca@b¡Ese tipo debe de ser muy aficionado a los telescopios para dormir aquí!\n@c0@"
  fr: "@aBianca@bCe type doit vraiment aimer les télescopes pour dormir iciⓠ\n@c0@"
  it: "@aBianca@bSta sognando un cannocchiale?!\nMa allora la sua è una fissazione!\n@c0@"
  ja: "@a@bビアンカ「こんな所で　ねるなんて\n\tよっぽど　望遠鏡が好きなのね。\n@c0@"
127:
  de: "@aNera@bHe he he! Er sieht aus wie ein kleiner Junge!\n@c0@"
  en: "@aNera@bHe he he! He looks just like a little boy!\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! ¡Es come un bambino!\n@c0@"
  fr: "@aNera@bHi hi hiⓠ On dirait un petit garçonⓠ\n@c0@"
  it: "@aNera@bDorme come un angioletto, eh?\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\tあの方　子供みたいですわね。\n@c0@"
128:
  de: "@aBianca@bMeine Güte! Hier drin ist es größer, als es von außen wirkt!\n@c0@"
  en: "@aBianca@bBlimey! This place is bigger than it looks!\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Este sitio es más grande de lo que parece!\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Cet endroit est plus grand\nqu'il n'y paraîtⓠ\n@c0@"
  it: "@aBianca@bAccidenti!\nQuesto posto è più grande di quanto credessi!\n@c0@"
  ja: "@a@bビアンカ「うわ～！\n\t中って　けっこう広いんだね。\n@c0@"
129:
  de: "@aNera@bIch war schon oft mit Papa hier.\n@c0@"
  en: "@aNera@bI've been here lots of times before with Papa.\n@c0@"
  es: "@aNera@bHe estado aquí muchas veces antes con il mio papino.\n@c0@"
  fr: "@aNera@bJe suis déjà venue souvent ici avec papa.\n@c0@"
  it: "@aNera@bSono già stata qui diverse volte insieme a mio padre, sai?\n@c0@"
  ja: "@a@bフローラ「ここへは　何度か　父と\n\tいっしょに　来たことがありますの。\n@c0@"
130:
  de: "@aBianca@bDieses Buddelschiff ist wirklich gut gemacht.\n@c0@"
  en: "@aBianca@bThis ship in a bottle is really well-made.\n@c0@"
  es: "@aBianca@bEste barco en botella está muy bien hecho, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe bateau en bouteille est vraiment bien fait.\n@c0@"
  it: "@aBianca@bQuesta nave in bottiglia è fatta proprio bene.\n@c0@"
  ja: "@a@bビアンカ「このボトルシップって\n\t本当に　良くできてるわよね。\n@c0@"
131:
  de: "@aNera@bDas Schiff in dieser Flasche sieht genauso aus wie Papas Schiff.\n@c0@"
  en: "@aNera@bThe ship inside this bottle looks just like\r\nPapa's ship.\n@c0@"
  es: "@aNera@bEste barco en botella tiene el mismo aspecto que el del mio papino.\n@c0@"
  fr: "@aNera@bLe bateau à l'intérieur de la bouteille ressemble vraiment à celui de papa.\n@c0@"
  it: "@aNera@bQuesta nave in bottiglia è una perfetta riproduzione in scala ridotta di una delle imbarcazioni della flotta di mio padre!\n@c0@"
  ja: "@a@bフローラ「この　ボトルの中の船\n\t父の船に　そっくりですわ。\n@c0@"
132:
  de: "@aBianca@bAch! Wie schade, dass wir es uns nicht leisten können!\n@c0@"
  en: "@aBianca@bOh! What a shame we can't afford it!\n@c0@"
  es: "@aBianca@b¡Qué lástima, no tenemos suficiente dinero!\n@c0@"
  fr: "@aBianca@bOhⓠ Quel dommage qu'on ne puisse pas se l'offrirⓠ\n@c0@"
  it: "@aBianca@bOh, dannazione!\nNon possiamo permettercela...!\nChe peccato...\n@c0@"
  ja: "@a@bビアンカ「ううっ……\n\tお金がないって　悲しいね。\n@c0@"
133:
  de: "@aNera@bWir können es uns nicht leisten? Was soll's. Wir sind ja erst ganz frisch verheiratet. Aller Anfang ist schwer.\n@c0@"
  en: "@aNera@bWe can't afford it? Oh well. We are only\r\njust married, after all. Most people aren't\r\nthat well-off at the beginning.\n@c0@"
  es: "@aNera@b¿No nos lo podemos permitir? Vaya. En fin, nos acabamos de casar. Al principio tutta la gente pasa estrecheces.\n@c0@"
  fr: "@aNera@bNous ne pouvons pas nous l'offrirⓡ Bon, tant pis. Beaucoup de gens ne sont pas très riches au début de leur mariage, après tout.\n@c0@"
  it: "@aNera@bQuesto è un lusso che non possiamo concederci.\nDopotutto ci siamo appena sposati, e dobbiamo comprare cose ben più necessarie...\n@c0@"
  ja: "@a@bフローラ「お金が　足りませんでしたの？\n\t結婚したばかりですし\n\tそういうことも　ありますわよね。\n@c0@"
134:
  de: "@aBianca@bOh weh! Es scheint gerade auszulaufen!\n@c0@"
  en: "@aBianca@bUh-oh! Looks like that's on its way out to sea!\n@c0@"
  es: "@aBianca@b¡Oh, oh! ¡Me temo que va a acabar en el mar!\n@c0@"
  fr: "@aBianca@bOh-ohⓠ On dirait qu'il a pris la merⓠ\n@c0@"
  it: "@aBianca@bOh-oh!\nSembra che la sua nave abbia preso il largo...\n@c0@"
  ja: "@a@bビアンカ「あ～あ。\n\tあの様子じゃ　ボトルシップは\n\t海まで　流れていっちゃうわね。\n@c0@"
135:
  de: "@aNera@bDer Mann tut mir leid, aber er hätte ja bloß etwas besser aufpassen müssen, wenn es ihm so viel bedeutet.\n@c0@"
  en: "@aNera@bI do feel sorry for the man, but he probably should've been a bit more careful with it if it means that much to him.\n@c0@"
  es: "@aNera@bLo siento mucho por el caballero pero, si era tan importante per lui, debería haber sido más cuidadoso.\n@c0@"
  fr: "@aNera@bJe suis désolée pour cet homme, mais il aurait sans doute dû y faire plus attention s'il y tenait vraiment.\n@c0@"
  it: "@aNera@bMi dispiace per lui, ma è solo colpa sua!\r\nSe davvero ci teneva tanto, avrebbe dovuto fare più attenzione!\n@c0@"
  ja: "@a@bフローラ「お気の毒ですけど…\n\t大事なものを　持っているときに\n\tゆだんした　あの方も悪いですわね。\n@c0@"
136:
  de: "@aBianca@bVielleicht sollten wir kurz bei Rodrigo vorbeischauen.\n@c0@"
  en: "@aBianca@bMaybe we should go and pay a visit to Briscoletti.\n@c0@"
  es: "@aBianca@bQuizá deberíamos hacer una visita a don Rimaldi.\n@c0@"
  fr: "@aBianca@bOn devrait peut-être aller rendre une petite\r\nvisite à Oscuroni.\n@c0@"
  it: "@aBianca@bDovremmo passare a salutare il caro mister Fosconi uno di questi giorni.\n@c0@"
  ja: "@a@bビアンカ「ねえ　やっぱりルドマンさんに\n\tごあいさつに　行ったほうが\n\tいいんじゃないかしら。\n@c0@"
137:
  de: "@aBianca@bEr hat uns schließlich eine wundervolle Hochzeit ausgerichtet.\n@c0@"
  en: "@aBianca@bHe did put on a great weddin' for us, after all.\n@c0@"
  es: "@aBianca@bAl fin y al cabo, nos preparó una boda fantástica, ¿sabes?\n@c0@"
  fr: "@aBianca@bAprès tout, il nous a organisé un mariage grandiose.\n@c0@"
  it: "@aBianca@bSì, avrei piacere di rivedere il nostro benefattore...\n@c0@"
  ja: "@a@bビアンカ「あんなに　立派な結婚式も\n\tあげてもらったんだし……。\n@c0@"
138:
  de: "@aBianca@bWas für ein Riesenschiff! Ist das aufregend! Komm, wir gehen schnell an Bord, %a000090!\n@c0@"
  en: "@aBianca@bWhat a huge ship! This is so excitin'!\nLet's hurry up and get on board, %a000090!\n@c0@"
  es: "@aBianca@b¡Qué barco más enorme! ¡Qué emocionante!\n¡Deprisa, subamos a bordo, %a000090!\n@c0@"
  fr: "@aBianca@bQuel bateau gigantesqueⓠ C'est tellement excitantⓠ Dépêchons-nous de monter à bord, %a000090ⓠ\n@c0@"
  it: "@aBianca@bChe nave enorme! Non sto nella pelle!\nMuoviamoci a salire a bordo, %a000090!\n@c0@"
  ja: "@a@bビアンカ「大きな船ね。\n\tなんだか　わくわくするわ。\n\tさあ　乗りましょう　%a000090。\n@c0@"
139:
  de: "@aNera@bDas war ursprünglich Papas Schiff, aber jetzt gehört es auch uns. Warum gehen wir nicht an Bord?\n@c0@"
  en: "@aNera@bThis was Papa's boat originally, but now it's your boat too. Why don't we go aboard?\n@c0@"
  es: "@aNera@bAntes este era el barco del mio papino, pero ahora también es tuyo. ¿Por qué no subimos a bordo?\n@c0@"
  fr: "@aNera@bÀ l'origine, ce bateau était celui de papa,\nmais à présent, il est aussi à toi.\nEt si on montait à bordⓡ\n@c0@"
  it: "@aNera@bHai capito, %a000090?\nPossiamo fare tutto ciò che ci pare!\nDai, saliamo a bordo.\n@c0@"
  ja: "@a@bフローラ「これは　父の船ですけど\n\tあなたの船でも　ありますわ。\n\tさあ　乗ってみてくださいな。\n@c0@"
140:
  de: "@aBianca@bIch hab vor nichts Angst, solange wir beide zusammen sind, %a000090.\n@c0@"
  en: "@aBianca@bI en't scared of nothin' as long as I'm with you, %a000090.\n@c0@"
  es: "@aBianca@bMientras estés conmigo no tendré miedo de nada, %a000090, ¿sabes?\n@c0@"
  fr: "@aBianca@bTant que je suis avec toi, je n'ai peur de rien, %a000090.\n@c0@"
  it: "@aBianca@bNon c'è mostro che possa farmi paura, se tu sei accanto a me, %a000090.\n@c0@"
  ja: "@a@bビアンカ「%a000090と　いっしょだもん。\n\tどんなカクゴだって　もう\n\tできてるわよ。\n@c0@"
141:
  de: "@aNera@bDie Seemonster jagen mir noch mehr Angst ein als sonst. Wir sollten vorsichtig sein.\n@c0@"
  en: "@aNera@bThe sea monsters are scarier than ever lately. We should be careful.\n@c0@"
  es: "@aNera@bÚltimamente los monstruos marinos son más temibili que nunca. Debemos tener cuidado.\n@c0@"
  fr: "@aNera@bLes monstres des mers sont plus effrayants que jamais, en ce moment. Nous devrions faire attention.\n@c0@"
  it: "@aNera@bUltimamente i mostri marini sono più aggressivi che mai.\nDovremo fare attenzione.\n@c0@"
  ja: "@a@bフローラ「ここ数年で　海の魔物たちは\n\tより　恐ろしくなりましたわ。\n\t気をつけて　行きましょうね。\n@c0@"
142:
  de: "@aBianca@bWarst du schon mal auf diesem Schiff, %a000090? Ach ja. Du warst mal mit deinem Vater hier, nicht?\n@c0@"
  en: "@aBianca@bHave you bin on this boat before, %a000090? Oh, right. You were on it once with your dad, eh?\n@c0@"
  es: "@aBianca@b¿Habías estado antes en este barco, %a000090? ¡Ah!, sí. Estuviste una vez aquí con tu padre, ¿verdad?\n@c0@"
  fr: "@aBianca@bÉtais-tu déjà monté sur ce bateau auparavant, %a000090ⓡ Oh, mais oui. Tu l'as pris une fois avec ton père, c'est çaⓡ\n@c0@"
  it: "@aBianca@bSei già stato a bordo di questa nave, se non sbaglio...\nFu diversi anni fa, quando viaggiavi insieme a tuo padre.\n@c0@"
  ja: "@a@bビアンカ「えっ？　%a000090　前にも\n\tこの船に乗ったことがあるの？\n\tそっか　パパスさんと旅してた頃ね。\n@c0@"
143:
  de: "@aNera@bIch weiß noch, wie ich vor langer Zeit mal auf diesem Schiff war. Die Onassettis hatten mich gerade erst aufgenommen und ich war sooo nervös.\n@c0@"
  en: "@aNera@bI remember being on this ship a long time ago. I'd only just been taken in by the Briscolettis and I was so nervous.\n@c0@"
  es: "@aNera@bRecuerdo haber estado en este barco tempo fa. Los Rimaldi acababan de adoptarme y estaba molto nerviosa.\n@c0@"
  fr: "@aNera@bJe me rappelle être montée sur ce bateau il y a très longtemps. Je venais d'être adoptée par les Oscuroni et j'étais très nerveuse.\n@c0@"
  it: "@aNera@bSono stata su questa nave molti anni fa, subito dopo essere stata adottata dalla famiglia Fosconi.\n㈡\nRicordo che ero terrorizzata, perché era la prima volta che salivo su un'imbarcazione...\n@c0@"
  ja: "@a@bフローラ「まだ私が　ルドマンの家に\n\t来たばかりで　不安だった頃\n\tビスタ港から　この船に乗りましたの。\n@c0@"
144:
  de: "@aNera@bDabei trafen wir einen Vater mit seinem Sohn, die zusammen auf Reisen waren. Der Junge war noch klein. Es hat mir irgendwie Mut gemacht, ihn zu sehen.\n@c0@"
  en: "@aNera@bWe met a father and son who were travelling together. The boy was so young. It sort of gave me courage seeing him.\n@c0@"
  es: "@aNera@bConocimos a un padre y un figlio que viajaban juntos. El bambino era muy joven. Verle aquí me dio fuerzas.\n@c0@"
  fr: "@aNera@bJ'ai rencontré un père et son fils qui voyageaient ensemble. Le garçon était si jeune. Ça m'a redonné\r\nun peu de courage de le voir.\n@c0@"
  it: "@aNera@bQuel giorno incontrai un uomo che viaggiava insieme a suo figlio. Vedere un bimbo così piccolo a bordo della nave mi diede coraggio...\n@c0@"
  ja: "@a@bフローラ「その時　父子ふたり旅という\n\t感じの旅人に出会って　こんな小さな\n\t男の子も旅を…　と勇気づけられたわ。\n@c0@"
145:
  de: "@aNera@bEr hatte einen Ausdruck in den Augen, der mir in all den Jahren irgendwie nicht mehr aus dem Sinn gehen wollte.\n@c0@"
  en: "@aNera@bHe had an expression in his eyes that I somehow haven't been able to clear from my mind even after all these years.\n@c0@"
  es: "@aNera@bLa expresión dei sui occhi... no he podido olvidarla en todos estos años.\n@c0@"
  fr: "@aNera@bIl avait dans les yeux une lueur que je n'ai jamais réussi à chasser de mon esprit, même après toutes ces années.\n@c0@"
  it: "@aNera@bQuel bambino aveva lo sguardo più profondo e sincero che avessi mai visto! Lo ricordo ancora, nonostante siano passati tanti anni...\n@c0@"
  ja: "@a@bフローラ「その男の子が\n\tふしぎな目をしていて　それが　なぜか\n\tずっと　心に残っていたのですけど……\n@c0@"
146:
  de: "@aNera@bIch nehme nicht an...\nDieser kleine Junge warst doch wohl nicht du, %a000090?\n@c0@"
  en: "@aNera@bI don't suppose...\nWere you that little boy, %a000090?\n@c0@"
  es: "@aNera@bNon credo que...\n¿Eras tú ese piccolo bambino, %a000090?\n@c0@"
  fr: "@aNera@bCe n'est quand même pas...\nC'était toi, ce petit garçon, %a000090ⓡ\n@c0@"
  it: "@aNera@bUhm...\n...\nEri tu quel bambino, %a000090?\n@c0@"
  ja: "@a@bフローラ「もしかしたら　その子は\n\tあなた　ではなかったかしら？\n@c0@"
147:
  de: "@aNera@bIch wusste es doch! Das bedeutet, der Mann, der mir an Bord geholfen hat, muss dein Vater gewesen sein... mein Schwiegervater!\n@c0@"
  en: "@aNera@bI knew it! That means the man who helped me aboard must've been your father...my father-in-law!\n@c0@"
  es: "@aNera@b¡Lo sabía! Eso quiere decir que el hombre que me ayudó a subir a bordo era il tuo padre... ¡mi suegro!\n@c0@"
  fr: "@aNera@bJ'en étais sûreⓠ Ça veut donc dire que l'homme qui m'a aidée à monter à bord devait être ton père... donc mon beau-pèreⓠ\n@c0@"
  it: "@aNera@bDavvero?!\nAllora l'uomo che mi aiutò a bordo era tuo padre...\r\nMio suocero! Che coincidenza incredibile...!\n@c0@"
  ja: "@a@bフローラ「まあ！　やっぱり。\n\tでは　あの時　私に手を貸して\n\tくださった方が　お父さまなのね……。\n@c0@"
148:
  de: "@aNera@bOh je! Ich hoffe, ich habe dich jetzt nicht eifersüchtig gemacht!\n@c0@"
  en: "@aNera@bOh dear! I hope you're not jealous now, then!\n@c0@"
  es: "@aNera@b¡Vaya! ¡Espero que adesso no te pongas celoso!\n@c0@"
  fr: "@aNera@bOupsⓠ Dans ce cas, j'espère que tu n'es pas jaloux, maintenantⓠ\n@c0@"
  it: "@aNera@bNo?\r\nLo sapevo. Gli occhi di quel bambino erano bellissimi, ma i tuoi lo sono mille volte di più, tesoro!\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\tごめんなさいね　あなた。\n\tヤキモチを　やかせてしまったかしら。\n@c0@"
149:
  de: "@aNera@bDieses Schiff ist schon in Gebrauch, so lange ich denken kann. Papa achtet sehr gut auf seine Sachen.\n@c0@"
  en: "@aNera@bThis boat's been in use for as long as I can remember. Papa certainly takes good care of his possessions.\n@c0@"
  es: "@aNera@bEste barco lleva navegando desde que tengo uso de razone. Il mio papino cuida mucho sus pertenencias.\n@c0@"
  fr: "@aNera@bCe bateau est en circulation depuis aussi longtemps que je me souvienne. Papa prend indéniablement grand soin de ce qui lui appartient.\n@c0@"
  it: "@aNera@bSono anni che questa nave solca i mari, eppure è come nuova! Mio padre non è tipo da economizzare sulle spese di manutenzione.\n@c0@"
  ja: "@a@bフローラ「それにしても　この船は\n\tずいぶん長く　使われていますのよ。\n\t父は　物を大切にするのですわ。\n@c0@"
150:
  de: "@aGriselda@bEs gefällt mir, so reisen zu können. Ganz zu schweigen von den drei ordentlichen Mahlzeiten am Tag und dass ich jetzt einen Leibsklaven habe.\n@c0@"
  en: "@aDebora@bI do enjoy being able to travel like this. Not to mention having three square meals a day and my own personal slave into the bargain.\n@c0@"
  es: "@aStefania@bMe gusta viaggiare así. Con mis tres buenas comidas al día y un esclavo personal.\n@c0@"
  fr: "@aPandora@bJ'aime vraiment voyager comme ça. Sans parler du fait qu'on fait trois bons repas par jour et que j'ai aussi mon esclave personnel, dans l'histoire.\n@c0@"
  it: "@aViola@bGiro il mondo, vivo giornate intense, conosco persone interessanti e ho il mio uomo accanto a me, sempre pronto a esaudire ogni mio desiderio.\n@c0@"
  ja: "@a@bデボラ「こうして　遠くまで遊びに出られるし\n\tおまけに　３食しもべ付き……\n@c0@"
151:
  de: "@aGriselda@bDie Ehe hat durchaus ihre Vorteile, doch, das muss ich schon sagen.\n@c0@"
  en: "@aDebora@bMarriage isn't at all bad.\n@c0@"
  es: "@aStefania@bEsto del matrimonio no está nada mal. Y a ti que no te oiga quejarte, ¿capisci?\n@c0@"
  fr: "@aPandora@bÇa n'est pas si mal que ça, le mariage.\n@c0@"
  it: "@aViola@bCos'altro potrei volere dalla vita?\n@c0@"
  ja: "@a@bデボラ「結婚も　悪くないかもね。\n@c0@"
152:
  de: "@aGriselda@bIch hab gar nichts gegen Hafenstädte an sich, aber die Seeluft ist Gift für mein Haar. Also such uns besser eine Herberge, aber dalli.\n@c0@"
  en: "@aDebora@bI don't mind port towns per se, but I hate the damage the sea air does to my poor hair. So you'd better find us an inn for the night pronto.\n@c0@"
  es: "@aStefania@bNo me molestan las ciudades portuarias per se, ma es que el aire del mar me deja el pelo fatale. Así que ya estás buscando una posada. Presto.\n@c0@"
  fr: "@aPandora@bLes villes portuaires en tant que telles ne me dérangent pas, mais je déteste les ravages que\nl'air marin fait à mes cheveux.\n㈡\nTu as intérêt à nous trouver une auberge\npour la nuit, et pronto.\n@c0@"
  it: "@aViola@bI posti di mare mi piacciono molto, se non fosse per la salsedine che mi rovina la chioma.\n㈡\nSbrigati a trovare una stanza alla locanda, altrimenti i capelli mi diventeranno ispidi come i peli di un Cinghialorco!\n@c0@"
  ja: "@a@bデボラ「港町は　別にキライじゃないけど\n\t潮風で　かみの毛が痛むのがイヤなの。\n\tだから　早く　今日の宿を見つけてよね。\n@c0@"
153:
  de: "@aGriselda@bDem bist du schon einmal begegnet, was?\n@c0@"
  en: "@aDebora@bYou've obviously met him before then, have you?\n@c0@"
  es: "@aStefania@bVeramente ya lo conocías, ¿no?\n@c0@"
  fr: "@aPandora@bDe toute évidence, tu l'avais déjà croisé,\nce type, nonⓡ\n@c0@"
  it: "@aViola@bCaro, cos'ha detto quel tipo?\n@c0@"
  ja: "@a@bデボラ「ふうん　あんた\n\tこのおじさんと知り合いなのね。\n@c0@"
154:
  de: "@aGriselda@bMuss ja so sein, denn du bist ihm ins Wort gefallen, also musst du das, was er zu sagen hat, schon einmal gehört haben.\n@c0@"
  en: "@aDebora@bYou must've done, because you cut him off before he explained himself, so you've clearly heard it all before.\n@c0@"
  es: "@aStefania@bPorque le has cortado antes de que pudiera explicarse, así que chiaramente ya lo habías oído tutto.\n@c0@"
  fr: "@aPandora@bC'est obligé, parce que tu lui as coupé la parole avant qu'il ait eu le temps de s'expliquer, c'est donc que tu as déjà entendu ce qu'il avait à dire.\n@c0@"
  it: "@aViola@bStavo pensando a come proteggere i capelli dall'aria di mare, e non ho prestato attenzione alle sue parole...\n@c0@"
  ja: "@a@bデボラ「だって　何度か話をしたことが\n\tあるような返事じゃないの。\n\tずいぶん　なれなれしいし。\n@c0@"
155:
  de: "@aGriselda@bEin Souvenir... Eigentlich könnten wir doch hier und da ein Andenken mitnehmen. Tragen musst du sie natürlich.\n@c0@"
  en: "@aDebora@bA souvenir... I suppose we could start picking up the odd souvenir here and there. You'll obviously be the one who has to carry them, though.\n@c0@"
  es: "@aStefania@bUn souvenir... Podríamos ir haciéndonos con alguno. Ma... vas listo si te crees que los voy a llevar yo, ¿capisci?\n@c0@"
  fr: "@aPandora@bUn souvenir... J'imagine qu'on pourrait commencer à collectionner ce genre de choses ici et là. Mais c'est toi qui devras les porter, évidemment.\n@c0@"
  it: "@aViola@bSai una cosa?\nPotremmo cominciare a collezionare souvenir dei luoghi che visitiamo!\n㈡\nIo li sceglierò, e tu li pagherai e li porterai.\nSì, ho avuto proprio un'ottima idea.\n@c0@"
  ja: "@a@bデボラ「ふうん……お土産ね。\n\t買ってみるのも　悪くないかもね。\n\tもちろん　持つのは%a000090だけど。\n@c0@"
156:
  de: "@aGriselda@bWie können sie denn hier Besucher erwarten, wenn sie an einem so unzugänglichen Ort bauen?\n@c0@"
  en: "@aDebora@bHow do they expect anyone to be able to visit if they're building it in such an awkward place?\n@c0@"
  es: "@aStefania@b¿Ma, cómo esperan que los visite nadie si construyen en un sitio così? Y menos yo.\n@c0@"
  fr: "@aPandora@bComment ils veulent que les gens puissent s'y rendre s'ils le construisent dans un endroit aussi torduⓡ\n@c0@"
  it: "@aViola@bUn tempio in cima a una montagna?\nQuesta sì che è un'idea balzana.\n@c0@"
  ja: "@a@bデボラ「そんなところに　神殿なんか建てて\n\tいったい　どうやって\n\t行き来するつもりなのかしら。\n@c0@"
157:
  de: "@aGriselda@bAlso ehrlich! Manchmal weiß ich einfach nicht, was in den Köpfen der Leute vor sich geht.\n@c0@"
  en: "@aDebora@bHonestly! I don't know what goes on in people's heads sometimes.\n@c0@"
  es: "@aStefania@b¡Veramente...! A veces no sé dónde tiene la gente la testa.\n@c0@"
  fr: "@aPandora@bFranchementⓠ Parfois, je me demande ce qui peut bien passer par la tête des gens.\n@c0@"
  it: "@aViola@bA meno che non abbiano scelto di costruirlo così in alto per essere più vicini alla dea...\n@c0@"
  ja: "@a@bデボラ「まったく　考えなしっていうか……\n\t頭を使わない人が　多すぎるわ。\n@c0@"
158:
  de: "@aGriselda@bWas er wohl sagen würde, wenn er wüsste, dass unsere Hochzeit hier stattgefunden hat? Da würde ihm das alberne Grinsen vergehen!\n@c0@"
  en: "@aDebora@bI wonder how he'd react if we told him we held our wedding there. That'd wipe the smirk off his face!\n@c0@"
  es: "@aStefania@b¡Ma qué desfachatez! ¡Igual alguien se cae per la borda!\n@c0@"
  fr: "@aPandora@bJe me demande comment il réagirait si on lui disait qu'on s'est mariés ici. Il arrêterait sûrement de ricaner comme un idiotⓠ\n@c0@"
  it: "@aViola@bChissà come reagirebbe quel villanzone maleducato se gli dicessi che ci siamo sposati proprio a bordo della Jolly Ace...\n@c0@"
  ja: "@a@bデボラ「私たちが　そのカジノ船で\n\t結婚式をあげた……　って知ったら\n\tこの男　どんな顔をするかしらね。\n@c0@"
159:
  de: "@aGriselda@bAlso, ich kann's dem Drachengott nicht verübeln, dass er mal eine Pause braucht. Das geht doch jedem mal so.\n@c0@"
  en: "@aDebora@bI can't say I blame the Dragon God for wanting to take a break. It happens to the best of us.\n@c0@"
  es: "@aStefania@bNo me extraña que el Dios Dragón quiera fare una pausa. Nos pasa a todos. Bueno, os pasa.\n@c0@"
  fr: "@aPandora@bJe ne peux pas reprocher au dieu dragon d'avoir\r\neu envie de faire une pause. Ça arrive même\r\naux meilleurs.\n@c0@"
  it: "@aViola@bIo penso che i mostri attacchino gli uomini quando hanno fame. Non esistono ristoranti per mostri, quindi le belve devono sfamarsi con ciò che trovano.\n㈡\nCioè noi umani!\nCerto che potrebbero anche seguire una dieta vegetariana!\n@c0@"
  ja: "@a@bデボラ「私　竜の神さまが\n\t仕事をサボりたくなった気持ち……\n\tなんとなくだけど　わかる気がするわ。\n@c0@"
160:
  de: "@aGriselda@bIch hab kein Interesse daran, Geld zu sparen. Wenn ich mal knapp bei Kasse bin, frag ich einfach Papa.\n@c0@"
  en: "@aDebora@bI've no interest in saving money.\r\nIf I ever need any, I just ask Papa.\n@c0@"
  es: "@aStefania@b¿Para qué voy a querer ahorrar?\r\nSi necesito dinero se lo pido a il mio papino.\n@c0@"
  fr: "@aPandora@bÇa ne m'intéresse pas d'économiser de l'argent. Quand j'en ai besoin, j'ai juste à demander à papa.\n@c0@"
  it: "@aViola@bNon deposito mai soldi in banca.\nSpendo tutto il mio denaro in abiti, cosmetici e altri beni voluttuari.\n@c0@"
  ja: "@a@bデボラ「私　お金には　興味がないの。\n\tだって　ちょっとパパにたのめば\n\tもらえるものだったから。\n@c0@"
161:
  de: "@aGriselda@bDas nervt! Konnte er nicht einfach gehen und es für uns holen, statt uns durch die Weltgeschichte zu schicken?\n@c0@"
  en: "@aDebora@bHow annoying! Couldn't he just go and get it for us rather than sending us off on a wild goose chase?\n@c0@"
  es: "@aStefania@b¡Qué molesto! ¿No puede ir él y traernos lo que sea, en vez de mandarnos a triscar como las cabras?\n@c0@"
  fr: "@aPandora@bC'est pénibleⓠ Il ne pourrait pas tout simplement y aller lui-même et nous le rapporter, plutôt que de nous envoyer nous démener pour rienⓡ\n@c0@"
  it: "@aViola@bChe razza di sfaticato!\nInvece di dirci che c'è qualcosa nascosto tra i fiori, non poteva cercarlo e portarcelo qui?!\n@c0@"
  ja: "@a@bデボラ「まったく……もったいぶらないで\n\t今　ここで　くれればいいのに。\n\t私　めんどうなことは　キライなのよ。\n@c0@"
162:
  de: "@aGriselda@bDann wollte er also ursprünglich Apotheker werden und ist jetzt Seemann... Tja, man kann nie wissen, was das Leben für einen in petto hat.\n@c0@"
  en: "@aDebora@bSo he planned to be a pharmacist and now he's a sailor... Life certainly takes some unexpected turns.\n@c0@"
  es: "@aStefania@bAsí que quería ser boticario y ahora es marinero. La vita da muchas vueltas, sí.\n@c0@"
  fr: "@aPandora@bAlors il avait prévu de devenir herboriste et maintenant, il est marin... La vie prend parfois\r\ndes tours inattendus.\n@c0@"
  it: "@aViola@bSpesso il destino ci porta a prendere strade diverse da quelle che avevamo sognato di percorrere...\n@c0@"
  ja: "@a@bデボラ「くすり師になるつもりが　船乗りに……\n\t人生って　本当に不思議の連続ね。\n@c0@"
163:
  de: "@aGriselda@bIch hätte ja auch nie gedacht, dass ich eines Tages mal hier neben dir stehen würde.\n@c0@"
  en: "@aDebora@bI never imagined I'd be standing here with you now for one thing.\n@c0@"
  es: "@aStefania@bQuién te iba a decir que ibas a poder estar aquí con me.\n@c0@"
  fr: "@aPandora@bPar exemple, je n'aurais jamais imaginé\r\nme retrouver ici avec toi.\n@c0@"
  it: "@aViola@bIo, per esempio, non mi sarei mai sognata di sposare un pappamolle come te, caro il mio %a000090...\n@c0@"
  ja: "@a@bデボラ「今　私が　あんたの横にいるのも\n\tそのうちの１つだけど。\n@c0@"
164:
  de: "@aGriselda@bKannst du dich mal ein bisschen beeilen und zum Ende kommen? An solchen Orten krieg' ich immer Platzangst.\n@c0@"
  en: "@aDebora@bCan you get a move on and wrap things up here? Places like this make me feel claustrophobic.\n@c0@"
  es: "@aStefania@bPresto, haz lo que tengas que hacer aquí. Estos sitios me dan claustrofobia.\n@c0@"
  fr: "@aPandora@bTu ne pourrais pas te dépêcher de régler tes affaires pour qu'on s'en aille d'iciⓡ Ce genre d'endroit me rend claustrophobe.\n@c0@"
  it: "@aViola@bFai quello che devi fare e andiamocene.\nQuesto posto non mi piace per niente...\n@c0@"
  ja: "@a@bデボラ「さっさと　用をすませてくれる？\n\t私　こういう暗くてせまい所はキライなの。\n@c0@"
165:
  de: "@aGriselda@bDu bist doch nicht mehr hinter Schätzen her, was, %a000090? Schließlich hast du den größten von allen doch schon gefunden - mich!\n@c0@"
  en: "@aDebora@bYou're not interested in hunting for treasure any more, are you, %a000090? After all, you've found the greatest treasure there is...me!\n@c0@"
  es: "@aStefania@b¿No te interesa seguir buscando tesoros, %a000090? Va bene, ya tienes il maggiore de todos: ¡yo!\n@c0@"
  fr: "@aPandora@bToi, les chasses au trésor ne t'intéressent plus désormais, hein, %a000090ⓡ Après tout,\ntu as découvert le plus beau des trésors.. moiⓠ\n@c0@"
  it: "@aViola@bA te i tesori non interessano, vero?\nDopotutto hai già trovato quello più prezioso di tutti, cioè me!\n@c0@"
  ja: "@a@bデボラ「%a000090は　もう宝探しなんかに\n\t興味は　ないわよね。\n\t私という宝物を　手に入れたんだから。\n@c0@"
166:
  de: "@aGriselda@bWenn wir in die Wüste gehen, dann brauchen wir Wasser. Und Sonnencreme und Sonnenschirme und...\n@c0@"
  en: "@aDebora@bIf we're going to the desert, we'll need water.\r\nAnd suntan lotion and parasols and...\n@c0@"
  es: "@aStefania@bSi vamos al desierto necesitamos acqua.\r\nY bronceador, y una sombrilla, y...\n@c0@"
  fr: "@aPandora@bSi on va dans le désert, on va avoir besoin d'eau.\r\nEt aussi de la crème solaire, et des parasols, et...\n@c0@"
  it: "@aViola@bSe andremo nel deserto, ci servirà molta acqua. Avrò bisogno anche di una crema protettiva per riparare dal sole la mia pelle di pesca...\n@c0@"
  ja: "@a@bデボラ「砂漠へ行くなら　水がいるわね。\n\tもちろん日焼け止めも　日がさも……。\n@c0@"
167:
  de: "@aGriselda@bEs ist natürlich deine Aufgabe, das alles zu besorgen. Nicht meine. Nur damit das klar ist.\n@c0@"
  en: "@aDebora@bYou'll have to get it all ready, okay? Not me.\r\nJust to be totally clear.\n@c0@"
  es: "@aStefania@bYa puedes ir preparándolo tutto, ¿vale?\r\nConmigo no cuentes, por supuesto.\n@c0@"
  fr: "@aPandora@bC'est toi qui te chargeras de préparer tout ça, d'accordⓡ Pas moi.\nJuste pour qu'il n'y ait pas de malentendus.\n@c0@"
  it: "@aViola@bGià che ci sei, comprami anche qualche vestitino leggero. Colori chiari, mi raccomando, che quelli scuri attirano molto i raggi solari...\n@c0@"
  ja: "@a@bデボラ「用意するのは　あなたの役目よ？\n\tわかってるでしょうけど　言っておくわね。\n\t私は　気がきくから。\n@c0@"
168:
  de: "@aGriselda@bWenn es einen Schrein für den legendären Helden gibt, dann leben hier irgendwo bestimmt noch Nachkommen von ihm. Ist doch klar.\n@c0@"
  en: "@aDebora@bIf there's a shrine to the legendary hero, I suppose there could still be some descendants of his around. Makes sense.\n@c0@"
  es: "@aStefania@bSi hay un altar del héroe legendario, veramante podría quedar algún descendiente suyo, ¿no? Tiene sentido.\n@c0@"
  fr: "@aPandora@bS'il y a là-bas un sanctuaire dédié au héros légendaire, il pourrait encore y avoir quelques-uns de ses descendants dans le coin. Ça paraît logique.\n@c0@"
  it: "@aViola@bUn tempio dedicato all'Eroe Leggendario?\nSe la cosa fosse vera, da quelle parti potremmo trovare informazioni utili su di lui.\n㈡\nChissà, forse lì vive qualche suo discendente...\n@c0@"
  ja: "@a@bデボラ「伝説の勇者の墓が本当にあるなら\n\tそこに　子孫がいても　おかしくないわ。\n\tちょっと考えれば　わかることよね。\n@c0@"
169:
  de: "@aGriselda@bDer schien ja nicht sehr interessiert daran, von dem legendären Helden zu reden.\n@c0@"
  en: "@aDebora@bHe didn't seem that interested in talk of the legendary hero.\n@c0@"
  es: "@aStefania@bSembra que no estaba muy interesado en hablar del héroe legendario.\n@c0@"
  fr: "@aPandora@bIl n'avait pas l'air très intéressé par tout ce qu'on dit sur le héros légendaire.\n@c0@"
  it: "@aViola@bCerto che la faccenda è seria!\n@c0@"
  ja: "@a@bデボラ「このバーテン\n\t勇者の話には　興味なさそうね。\n@c0@"
170:
  de: "@aGriselda@bNicht, dass mir das besonders aufgefallen wäre, wenn ich nicht mit dir verheiratet wäre.\n@c0@"
  en: "@aDebora@bMind you, I doubt I would've taken much notice if I wasn't married to you.\n@c0@"
  es: "@aStefania@bY yo porque estoy casada contigo y te tengo que aguantar, que si no...\n@c0@"
  fr: "@aPandora@bRemarque, je n'y aurais pas prêté beaucoup d'attention moi non plus si je n'avais pas été\r\nmariée avec toi.\n@c0@"
  it: "@aViola@bCioè, la faccenda è seria per te.\nA me la cosa non farebbe né caldo né freddo, ma sei mio marito, e sono costretta a interessarmene...\n@c0@"
  ja: "@a@bデボラ「私も　%a000090と結婚していなければ\n\t勇者の話を聞こうだなんて\n\t考えもしなかったと思うけど。\n@c0@"
171:
  de: "@aGriselda@bIch dachte, der legendäre Held wäre genau das: eine Legende. Aber anscheinend bist du nicht der Einzige, der nach ihm sucht und ihn für real hält.\n@c0@"
  en: "@aDebora@bI thought the legendary hero was just that: a thing of legend. But it seems that you're not the only one looking for him and believing he's real.\n@c0@"
  es: "@aStefania@bCreía que el héroe legendario era eso: legendario. Ma sembra que no eres el único que cree que es real y lo busca. Qué mundo.\n@c0@"
  fr: "@aPandora@bJe croyais que le héros légendaire c'était juste çaⓢ une légende. Mais on dirait que tu n'es pas le seul à croire qu'il existe réellement et à le chercher.\n@c0@"
  it: "@aViola@bSi direbbe che tu non sia l'unica persona al mondo a credere che l'Eroe Leggendario esista davvero. Bah, speriamo di trovarlo presto...\n@c0@"
  ja: "@a@bデボラ「勇者なんて　おとぎ話の主人公だと\n\t思っていたのに……　%a000090のほかにも\n\tさがしている人がいたのね。　おどろいたわ。\n@c0@"
172:
  de: "@aGriselda@bDer Großmeister... Wenn es den wirklich gibt, dann gibt es bestimmt auch einen legendären Helden.\n@c0@"
  en: "@aDebora@bThe Grandmaster... If he really exists, then there's probably a legendary hero out there somewhere too.\n@c0@"
  es: "@aStefania@bEl Gran Maestro... Si existe veramente, es probable que también haya por ahí un héroe legendario.\n@c0@"
  fr: "@aPandora@bLe Grand Maître... S'il existe vraiment, alors il doit bien y avoir aussi un héros légendaire quelque part.\n@c0@"
  it: "@aViola@bIl Gran Maestro degli Inferi...\nDifficile pensare che un essere con questo nome possa essere una persona amichevole...\n@c0@"
  ja: "@a@bデボラ「大魔王　ね……\n\t本当に　そんなものがいるのなら\n\t勇者も　どこかにいるのかもしれないわね。\n@c0@"
173:
  de: "@aNera@bIch habe hier mit Papa und Griselda übernachtet, als ich klein war.\n@c0@"
  en: "@aNera@bI stayed here with Papa and Debora when I was little.\n@c0@"
  es: "@aNera@bCuando era bambina estuve aquí con il mio papino y Stefania.\n@c0@"
  fr: "@aNera@bNous avons dormi ici avec papa et Pandora\r\nquand j'étais petite.\n@c0@"
  it: "@aNera@bUna volta, molti anni fa, venni qui insieme a Viola, e c'era anche nostro padre con noi.\n@c0@"
  ja: "@a@bフローラ「子供のころ　お父様や\n\tデボラ姉さんといっしょに\n\tここに　泊まったことがあるんです。\n@c0@"
174:
  de: "@aNera@bIch glaube, damals sind wir auch mit dem Schiff gekommen.\n@c0@"
  en: "@aNera@bI think we came here by boat that time too.\n@c0@"
  es: "@aNera@bCredo que entonces también vinimos en barco.\n@c0@"
  fr: "@aNera@bJe crois qu'on était arrivés ici par bateau, cette fois-là aussi.\n@c0@"
  it: "@aNera@bArrivammo via mare, a bordo di una delle navi di mio padre.\n@c0@"
  ja: "@a@bフローラ「そういえば　あのときは\n\t船に乗って　この港町に来たのでしたわ。\n@c0@"
175:
  de: "@aGriselda@bNera und ich haben als Kinder hier mal mit Papa übernachtet.\n@c0@"
  en: "@aDebora@bNera and I stayed here with Papa when we were kids.\n@c0@"
  es: "@aStefania@bNera y yo estuvimos aquí con il mio papino cuando éramos pequeñas.\n@c0@"
  fr: "@aPandora@bNera et moi avons dormi ici avec papa\r\nquand nous étions enfants.\n@c0@"
  it: "@aViola@bIo e Nera trascorremmo qualche giorno in questo posto da piccole.\nEravamo in compagnia del nostro paparino.\n@c0@"
  ja: "@a@bデボラ「子供のころ　パパや\n\tフローラといっしょに\n\tここに　泊まったことがあるのよ。\n@c0@"
176:
  de: "@aGriselda@bIch wollte mich nachts rausschleichen, aber Papa hat schon an der Tür auf mich gewartet. Das muss ich ihm lassen: Ihm konnte man nie was vormachen.\n@c0@"
  en: "@aDebora@bI tried to sneak out at night, but Papa was right outside the door. I'll say this for him: he's always been pretty on the ball in that respect.\n@c0@"
  es: "@aStefania@bIntenté escaparme por la notte, pero il mio papino estaba justo en la puerta. He de admitir que para eso es un lince.\n@c0@"
  fr: "@aPandora@bJ'ai essayé de me faufiler dehors au milieu de la nuit, mais papa était juste derrière la porte. Il a toujours été très pointilleux sur la question.\n@c0@"
  it: "@aViola@bRicordo che una notte cercai di sgattaiolare di nascosto fuori dalla mia stanza, ma trovai mio padre ad aspettarmi appena fuori dalla porta.\n㈡\nEh, sì...\nNon è facile farla a Rick Fosconi...\n@c0@"
  ja: "@a@bデボラ「夜中に　こっそり部屋を抜け出したら\n\tドアの外にパパがいて　ビックリしたっけ。\n\t昔から　カンだけはいいのよね。\n@c0@"
177:
  de: "@aGriselda@bAnscheinend gibt's hier abends eine Vorstellung. Wenn du sie sehen willst, dann komme ich mit.\n@c0@"
  en: "@aDebora@bLooks like they put on a show in the evenings.\r\nIf you want to see it, I'll come with you.\n@c0@"
  es: "@aStefania@bSembra que por la noche montan un spettacolo.\r\nY si te crees que vas a verlo solo, vas listo.\n@c0@"
  fr: "@aPandora@bApparemment, il y a un spectacle en soirée.\r\nSi tu veux venir le voir, je t'accompagnerai.\n@c0@"
  it: "@aViola@bSe vuoi andare a vedere lo spettacolo serale, ti consento di farlo.\nOvviamente, io verrò con te...\n@c0@"
  ja: "@a@bデボラ「ふうん　夜にステージがあるのね。\n\t%a000090が見たいっていうなら\n\tいっしょに　見に来てあげてもいいわよ。\n@c0@"
178:
  de: "@aGriselda@bUnd das, während ich direkt neben dir stehe?! Du bist entweder lebensmüde oder dumm wie Brot.\n@c0@"
  en: "@aDebora@bYou must be either brave or stupid, saying that when I'm right by your side.\n@c0@"
  es: "@aStefania@bDebes de ser muy coraggioso o muy bobo para decir eso conmigo a tu lado.\n@c0@"
  fr: "@aPandora@bTu dois être sois très courageux, soit franchement stupide pour dire des choses pareilles alors que je suis juste à côté de toi.\n@c0@"
  it: "@aViola@bDevi essere estremamente coraggioso per aver detto una cosa del genere con me al tuo fianco...\nOppure sei solo molto stupido.\n@c0@"
  ja: "@a@bデボラ「この　私という主人がいるのに\n\tそんな返事をするなんて\n\tいい度胸をしているわね　%a000090？\n@c0@"
179:
  de: "@aGriselda@bDas werd' ich dich nicht so schnell vergessen lassen.\n@c0@"
  en: "@aDebora@bI won't let you forget this in a hurry.\n@c0@"
  es: "@aStefania@bDe esta no te vas de rositas, ten miedo... ¡molto miedo!\n@c0@"
  fr: "@aPandora@bJe ferai en sorte que tu t'en souviennes\r\npendant un bon moment.\n@c0@"
  it: "@aViola@bNon so perché, ma tendo a propendere per la seconda ipotesi.\n@c0@"
  ja: "@a@bデボラ「……あとで　おぼえてなさいよ。\n@c0@"
180:
  de: "@aGriselda@bAls würdest du dich trauen, was anderes zu sagen, wenn du weißt, du musst mir dafür Rede und Antwort stehen. Recht so, %a000090!\n@c0@"
  en: "@aDebora@bAs if you'd dare say otherwise when you have me to answer to! It's good to see you know your place, %a000090.\n@c0@"
  es: "@aStefania@b¡Como para atreverte a decir otra cosa! Me piace moltissimo de que conozcas tu lugar, %a000090.\n@c0@"
  fr: "@aPandora@bComme si tu pouvais oser dire autre chose\nalors que je suis làⓠ C'est bien de voir que tu\nsais où est ta place, %a000090.\n@c0@"
  it: "@aViola@bTi faccio i miei complimenti, %a000090.\nLe hai dato la risposta che mi aspettavo da te.\nBravo. Vedo che stai imparando come ci si comporta.\n@c0@"
  ja: "@a@bデボラ「この　私という主人がいるんだから\n\t当然の返事よね。\n\tわかってきたじゃない　%a000090。\n@c0@"
181:
  de: "@aGriselda@bIch habe niemals Probleme mit meiner Schminke.\n@c0@"
  en: "@aDebora@bI never have problems with my make-up.\n@c0@"
  es: "@aStefania@bVeramente, yo nunca tengo problemas con el maquillaje.\n@c0@"
  fr: "@aPandora@bJe n'ai jamais de soucis avec mon maquillage.\n@c0@"
  it: "@aViola@bA me starebbe bene qualsiasi ombretto.\nLa mia bellezza risplende indipendentemente dai cosmetici che uso.\n@c0@"
  ja: "@a@bデボラ「私は　お化粧の のりが\n\t悪くなるなんてことは　ないわ。\n@c0@"
182:
  de: "@aGriselda@bÜbrigens werde ich heute früh schlafen gehen. All diese neuen Erfahrungen haben mich ganz erschöpft.\n@c0@"
  en: "@aDebora@bBy the way, I've decided to have an early night tonight. All these new experiences have worn me out.\n@c0@"
  es: "@aStefania@bPor cierto, he decidido que esta notte nos vamos a dormir pronto. Tantas cosas nuevas me han dejado agotada.\n@c0@"
  fr: "@aPandora@bÀ ce propos, j'ai décidé d'aller me coucher tôt, ce soir. Toutes ces expériences nouvelles m'ont épuisée.\n@c0@"
  it: "@aViola@bCiò non toglie che anch'io abbia le mie preferenze, ovviamente: nel caso specifico, utilizzerei un velo di giallo erba marcia...\n@c0@"
  ja: "@a@bデボラ「ところで　今日は\n\tちょっと早めに　休むわよ。\n\t慣れないことをして　つかれてるから。\n@c0@"
183:
  de: "@aGriselda@bWie lang ist diese Treppe denn noch? Mir werden langsam die Knie weich!\n@c0@"
  en: "@aDebora@bHow much longer do these stairs go on?\nMy feet are killing me!\n@c0@"
  es: "@aStefania@b¿Ma le queda mucho a esta scala?\r\n¡Los pies me están matando!\n@c0@"
  fr: "@aPandora@bIl y en a encore pour longtemps, avec ces marchesⓡ J'ai horriblement mal aux piedsⓠ\n@c0@"
  it: "@aViola@bQueste scale sono un supplizio per i miei piedi!\nCaro, che ne diresti di portarmi in braccio?\n@c0@"
  ja: "@a@bデボラ「この階段　どこまで続くのよ！？\n\tいいかげん　足が痛くなってきたわ。\n@c0@"
184:
  de: "@aGriselda@bHier zu arbeiten wäre nicht schlecht. Nicht mit drei Mahlzeiten am Tag, einer Siesta, vielen Pausen und einem Leibdiener, der mal für mich einspringen kann.\n@c0@"
  en: "@aDebora@bWorking here wouldn't be too bad. Not with three meals a day, a siesta, plenty of breaks and my own servant to take over every once in a while.\n@c0@"
  es: "@aStefania@bNo estaría mal lavorare aquí. Con tres comidas al día, siesta, descansos y un sirviente personal para que se ocupe de tutto, claro.\n@c0@"
  fr: "@aPandora@bÇa ne serait pas mal de travailler ici. Avec trois repas par jour, une siesta, plein de pauses et mon domestique pour prendre la relève de temps en temps.\n@c0@"
  it: "@aViola@bNo, non potrei mai lavorare qui. Anzi, non potrei lavorare in nessun posto. Non sono fatta per lavorare, preferisco essere servita e riverita.\n@c0@"
  ja: "@a@bデボラ「３食昼寝に　休けいありで\n\t仕事をかわってしてくれる　しもべつきなら\n\tここの仕事も　悪くないかもね。\n@c0@"
185:
  de: "@aGriselda@bIch muss mir keine Sorgen machen, ob ich zu den Auserwählten gehöre oder nicht. Natürlich gehöre ich dazu.\n@c0@"
  en: "@aDebora@bI don't need to worry about whether I'm a chosen one or not. It stands to reason that I would be.\n@c0@"
  es: "@aStefania@bNo tengo por qué preocuparme de si soy una elegida o no. Veramente, no cabe ninguna duda... Lo soy.\n@c0@"
  fr: "@aPandora@bJe n'ai pas besoin de m'inquiéter pour savoir\r\nsi je fais partie des Élus ou non. Il va de soi\r\nque j'en suis une.\n@c0@"
  it: "@aViola@bAnche tu sei un prescelto, caro.\n@c0@"
  ja: "@a@bデボラ「選ばれるかどうかなんて\n\t悩む必要なんか　ないわ。\n\t私なら　選ばれるに決まっているもの。\n@c0@"
186:
  de: "@aGriselda@bAber trotzdem ist mir nicht danach, den ganzen Berg da hochzuklettern.\n@c0@"
  en: "@aDebora@bI still don't feel inclined to climb all the way up to the top of that mountain, though.\n@c0@"
  es: "@aStefania@bMa no tengo ganas de escalar hasta la cima de esa montaña.\n@c0@"
  fr: "@aPandora@bMais ça ne me tente pas pour autant de grimper jusqu'en haut de cette montagne.\n@c0@"
  it: "@aViola@bSei stato prescelto da me per servirmi e riverirmi fino alla fine dei tuoi giorni.\nMa ti rendi conto di quanto sei stato fortunato, eh?!\n@c0@"
  ja: "@a@bデボラ「もっとも　そんな高い山の上になんて\n\t行きたいとは思わないけど。\n@c0@"
187:
  de: "@aGriselda@bDer Ausblick ist ja nicht schlecht. Wär aber noch besser, wenn man nicht die ganzen Stufen hochklettern müsste, um ihn genießen zu können.\n@c0@"
  en: "@aDebora@bThe view's not bad. It would be a lot better if we hadn't had to climb all those stairs to get to it.\n@c0@"
  es: "@aStefania@bNo están mal las vistas. Aunque estarían migliore si no hubiera tenido que subir todos esos escalones.\n@c0@"
  fr: "@aPandora@bLa vue n'est pas mal. Ça serait encore mieux\r\nsi on n'avait pas à grimper toutes ces marches\r\npour en profiter.\n@c0@"
  it: "@aViola@bDa qui si gode una vista fantastica...\nPeccato si debbano fare tante scale per ammirare il panorama.\n㈡\nLa prossima volta che vorrò salire quassù dovrai portarmi sulle spalle, caro.\n@c0@"
  ja: "@a@bデボラ「なかなか　悪くない　ながめね。\n\tこれで　あの長い階段がなければ\n\tもっと　よかったんだけれど。\n@c0@"
188:
  de: "@aGriselda@bEs wird spät. Du suchst uns besser schnell eine Unterkunft. Nichts ist schlimmer als ein saumseliger Mann.\n@c0@"
  en: "@aDebora@bIt's getting late so you'd better hurry up and find us somewhere to stay. Nothing irritates me more than a man who's slow off the mark.\n@c0@"
  es: "@aStefania@bSe hace tarde, así que ya estás buscando un lugar donde quedarnos. ¡Andiamo! No hay nada más molesto que un uomo sin iniciativa.\n@c0@"
  fr: "@aPandora@bIl se fait tard. Tu ferais bien de te dépêcher de\r\nnous trouver un endroit où passer la nuit. Rien ne m'agace davantage qu'un homme long à la détente.\n@c0@"
  it: "@aViola@bForza, pappamolle! Devi trovare un posto elegante e confortevole dove possiamo riposare!\nAvanti, non ho voglia di aspettare!\n@c0@"
  ja: "@a@bデボラ「もう　こんな時間だし\n\tいそいで　今日の宿を探しなさい。\n\t私　グズな男は　キライよ。\n@c0@"
189:
  de: "@aGriselda@bUh! Hat der 'ne Fahne! Wenn du mir je in diesem Zustand nach Hause kommst, kriegst du was zu hören, %a000090.\n@c0@"
  en: "@aDebora@bUgh! He reeks of drink! You won't know what's hit you if you ever come home to me in that state, %a000090.\n@c0@"
  es: "@aStefania@b¡Agh! ¡Apesta a liquore! Como un día me vengas así... de la que te doy, se te quitan las ganas de beber hasta gaseosa, %a000090.\n@c0@"
  fr: "@aPandora@bBeurkⓠ Il pue la boissonⓠ Tu n'imagines même pas\nce qui t'attend si tu reviens un jour à la maison dans un état pareil, %a000090.\n@c0@"
  it: "@aViola@bⓕGrandporcⓖ? Quel tipo dev'esser messo proprio male, se non riesce nemmeno a pronunciare correttamente il nome del posto dove vive!\n@c0@"
  ja: "@a@bデボラ「んもう　お酒くさいわね……！\n\t%a000090は　こんなになるまで\n\t飲んだりしたら　許さないわよ。\n@c0@"
190:
  de: "@aGriselda@bDann solltest du besser sehen, dass du ein bisschen zäher wirst, %a000090.\nEinen Klotz am Bein kann ich nicht brauchen.\n@c0@"
  en: "@aDebora@bYou'd better toughen up a bit then, %a000090.\nI wouldn't want you dragging me down.\n@c0@"
  es: "@aStefania@bYa puedes espabilar, %a000090.\nVeramente, no quiero irme a pique con te.\n@c0@"
  fr: "@aPandora@bDans ce cas, il va falloir que tu t'endurcisses un peu, %a000090.\nJe ne voudrais pas que tu me ralentisses.\n@c0@"
  it: "@aViola@bCerca di sbrigarti a diventare un duro, %a000090. Ne ho già fin sopra i capelli di dover badare a te ovunque andiamo...\n@c0@"
  ja: "@a@bデボラ「%a000090も　より強くなって\n\t私の足を　引っぱらないように\n\tしてちょうだいね。\n@c0@"
191:
  de: "@aGriselda@bKann der seine Heulerei nicht daheim erledigen? Außerdem ist er alt, und wenn er hier draußen bleibt, holt er sich noch den Tod.\n@c0@"
  en: "@aDebora@bCan't he do his crying in private? Besides anything else, he's old and he could catch his death out here.\n@c0@"
  es: "@aStefania@b¿No puede llorar en privado? Encima, es vecchio y podría quedarse en el sitio.\n@c0@"
  fr: "@aPandora@bIl ne pourrait pas se lamenter en priverⓡ\nEn plus du reste, il est vieux et pourrait bien attraper la mort, là-dehors.\n@c0@"
  it: "@aViola@bNo, %a000090.\nStavolta non dirò nulla.\nIl dolore di quest'uomo va rispettato in silenzio...\n@c0@"
  ja: "@a@bデボラ「泣くのは　家でもできるでしょうに。\n\tただでさえ　年をとっているんだから\n\tこんな所で寝たら　身体をこわすわよ。\n@c0@"
192:
  de: "@aGriselda@bIch weiß schon gar nicht mehr, wie oft ich mit Papa im Kasino gewesen bin, aber er hat mich kaum je spielen lassen.\n@c0@"
  en: "@aDebora@bI went to casinos with Papa more times than I can remember, but he hardly ever let me play on anything.\n@c0@"
  es: "@aStefania@bHe ido a casinos con il mio papino muchísimas veces, ma casi nunca me dejaba jugar a nada.\n@c0@"
  fr: "@aPandora@bJ'ai été dans des casinos avec papa un nombre incalculable de fois, mais il ne me laissait presque jamais jouer à quoi que ce soit.\n@c0@"
  it: "@aViola@bIl mio paparino mi ha portata al casinò una montagna di volte, ma non ha mai voluto che giocassi.\n@c0@"
  ja: "@a@bデボラ「パパといっしょに　何度か\n\tカジノへ　行ったことがあるけど\n\tあんまり　遊ばせてもらえなかったのよね。\n@c0@"
193:
  de: "@aGriselda@bDafür werd' ich mich nächstes Mal aber schadlos halten. Die Kosten für die Jetons wirst du übernehmen, %a000090.\n@c0@"
  en: "@aDebora@bI'll make up for that the next time I go, though.\nYou'll have to stump up all the money for the tokens, %a000090.\n@c0@"
  es: "@aStefania@bMe desquitaré la próxima vez que vaya.\r\nMa las fichas las pagas tú, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe me rattraperai la prochaine fois que je m'y rendrai. Il faudra que tu débourses tout l'argent pour les jetons, %a000090.\n@c0@"
  it: "@aViola@bQualche volta mi piacerebbe tentare la sorte al gioco, sai? Cerca di accumulare un po' di soldini, così potrò fare qualche puntata.\n@c0@"
  ja: "@a@bデボラ「でも　今度行ったら\n\t思うぞんぶん　楽しませてもらうわ。\n\tもちろん　お金を出すのは%a000090よ。\n@c0@"
194:
  de: "@aGriselda@bDu hast auch ⓞ'ne gute Frau erwischtⓟ, %a000090. Also streng dich weiterhin schön an, damit du mich auch verdienst.\n@c0@"
  en: "@aDebora@bYou picked a ⓗgood'unⓘ too, %a000090.\nSo you'd better make sure you keep working hard to deserve me.\n@c0@"
  es: "@aStefania@bTú sí que pillaste ⓕuna buena esposaⓖ, %a000090. Así que ya puedes esforzarte per empezar a merecerme, ¿capisci?\n@c0@"
  fr: "@aPandora@bToi aussi, tu as tiré un ⓥbon numéroⓦ, %a000090. Tu as intérêt à continuer de travailler dur pour me mériter.\n@c0@"
  it: "@aViola@bCerca di non restare mai senza soldi, %a000090.\nEsaudire tutti i miei desideri può essere costoso...\n@c0@"
  ja: "@a@bデボラ「私も　あんたには\n\tすぎた女房なんだから\n\tこれからも　もっと　がんばるのよ。\n@c0@"
195:
  de: "@aGriselda@bNa, das hört sich ja ziemlich übel an! Ob sie öfter so schreckliche Sachen träumt?\n@c0@"
  en: "@aDebora@bSounds like quite a dream she's having there!\r\nI wonder if she often has awful dreams.\n@c0@"
  es: "@aStefania@b¡Pues menudo sueño está teniendo!\r\n¿Se hará pipí al finale?\n@c0@"
  fr: "@aPandora@bElle a l'air de faire un sacré cauchemarⓠ\nPour moi, ce serait plutôt d'avoir à préparer le dîner tous les soirsⓠ\n@c0@"
  it: "@aViola@bQuella donna sta sognando che...? Cioè, vuole che il marito stia lontano...? Ma allora...?\nAh, non importa. Non sono affari che ci riguardano.\n@c0@"
  ja: "@a@bデボラ「ふうん　なかなか\n\tおもしろそうな夢を見てるわね　この女。\n\t知らないのは　夫だけ……か。\n@c0@"
196:
  de: "@aGriselda@bMama ist genauso, macht sich immer viel zu viele Sorgen um ihre Kinderchen.\n@c0@"
  en: "@aDebora@bMama's just like that, always worrying far too much about her babies.\n@c0@"
  es: "@aStefania@bLa mia mamma es igual, siempre preocupada por sus niñas. \n@c0@"
  fr: "@aPandora@bMamma est exactement pareilleⓢ elle s'inquiète toujours beaucoup trop pour ses bébés.\n@c0@"
  it: "@aViola@bAnche mia madre si è sempre preoccupata per me e per Nera.\n@c0@"
  ja: "@a@bデボラ「うちのママも　そうだったけれど\n\t子供のことを　心配しすぎなのよ。\n@c0@"
197:
  de: "@aGriselda@bAber vielleicht werde ich ja genauso, wenn ich erst Kinder habe. Meinst du, ich werde auch so, %a000090?\n@c0@"
  en: "@aDebora@bBut maybe I'll end up just the same when I'm a mother. Do you think I will, %a000090?\n@c0@"
  es: "@aStefania@bIgual yo también soy una madre così. ¿Crees que lo seré, %a000090?\n@c0@"
  fr: "@aPandora@bMais peut-être que je finirai comme ça, moi aussi, quand je serai mère. Tu crois que ça sera le cas, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, credi che anch'io diventerò una persona apprensiva quando avremo figli?\n@c0@"
  ja: "@a@bデボラ「でも　私も母親になったら\n\tやっぱり　そうなるのかしら。\n\tどう思う　%a000090？\n@c0@"
198:
  de: "@aGriselda@bHm. So siehst du mich also?\n@c0@"
  en: "@aDebora@bHm. So that's how you see me, is it?\n@c0@"
  es: "@aStefania@bAsí me ves, ¿eh? Allora, ya te enseñaré yo.\n@c0@"
  fr: "@aPandora@bMm. Alors c'est comme ça que tu me vois, heinⓡ\n@c0@"
  it: "@aViola@bNo, ti sbagli.\nI miei bambini saranno tremendamente in gamba, e non mi daranno mai motivo di preoccuparmi.\n@c0@"
  ja: "@a@bデボラ「ふうん……\n\tあんた　私のことを\n\tそういうふうに　見ていたんだ。\n@c0@"
199:
  de: "@aGriselda@bDu hast recht. Meine Kinder werden was ganz Besonderes sein, so wie ich, also brauche ich mir gar keine Sorgen zu machen.\n@c0@"
  en: "@aDebora@bYou're right. Any child of mine will be special like me, so I won't have anything to worry about.\n@c0@"
  es: "@aStefania@bTienes razón. Mis hijos serán excepcionales como yo, así que, veramente, no tendré que preocuparme...\n@c0@"
  fr: "@aPandora@bTu as raison. Mes enfants seront forcément aussi exceptionnels que moi, alors je n'aurai pas à me\r\nfaire de souci.\n@c0@"
  it: "@aViola@bBravo! Risposta esatta!\nI miei bambini saranno tremendamente in gamba, e non mi daranno mai motivo di preoccuparmi.\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\t私の血をひいた子どもは　優秀だから\n\t私が　心配することは　なにもないわ。\n@c0@"
200:
  de: "@aGriselda@bDas erinnert mich daran, wie Nera immer ihre Sachen vergraben und Schatzkarten gezeichnet hat, als sie noch klein war.\n@c0@"
  en: "@aDebora@bThat reminds me of how Nera used to bury her things and draw treasure maps when she was little.\n@c0@"
  es: "@aStefania@bEso me recuerda que, de bambina, Nera enterraba sus cosas y dibujaba mapas del tesoro.\n@c0@"
  fr: "@aPandora@bÇa me rappelle l'époque où Nera enterrait ses affaires et dessinait des cartes au trésor, quand elle était petite.\n@c0@"
  it: "@aViola@bUna mappa del tesoro? Ricordo che da piccola Nera nascondeva una delle sue bambole da qualche parte, e poi disegnava una mappa per ritrovarla...\n@c0@"
  ja: "@a@bデボラ「そういえば　小さい頃のフローラも\n\t宝の地図をかいたり　自分の宝物を\n\tうめたりするのが　好きだったわね。\n@c0@"
201:
  de: "@aGriselda@bOb ich das auch getan habe? Nein, aber mir hat es immer einen Riesenspaß gemacht, ihre Schätze wieder auszugraben! Ha!\n@c0@"
  en: "@aDebora@bDid I do the same? No, but I had a whale of a time digging up her stash! Ha!\n@c0@"
  es: "@aStefania@b¿Que si yo lo hacía? ¡No, ma era genial desenterrar sus cosas! ¡Ja!\n@c0@"
  fr: "@aPandora@bSi j'ai fait la même choseⓡ Non, mais je m'amusais comme une folle à déterrer ce qu'elle avait caché pour le remettre dans son placardⓠ Ha haⓠ\n@c0@"
  it: "@aViola@bA volte spostavo la bambola in un altro punto della casa o del giardino, e lei non riusciva a spiegarsi perché non fosse più dove l'aveva messa!\n㈡\nEra un vero spasso!\n@c0@"
  ja: "@a@bデボラ「え　私？\n\t私は　それをほりかえすのを\n\t楽しんでいたわ。\n@c0@"
202:
  de: "@aGriselda@bAch ja. Wir sind wohl jetzt richtige Flitterwöchner. Das hatte ich schon wieder ganz vergessen.\n@c0@"
  en: "@aDebora@bOh yes. I suppose we're proper newlyweds.\r\nI'd completely forgotten already.\n@c0@"
  es: "@aStefania@b¡Oh!, sí, supongo que somos recién casados.\r\nVeramente, ya se me había olvidado.\n@c0@"
  fr: "@aPandora@bOh, oui. C'est vrai qu'on est jeunes mariés.\r\nJ'avais déjà complètement oublié.\n@c0@"
  it: "@aViola@bLe spose novelle sorridono in maniera inconfondibile perché sanno di aver trovato l'uomo che le servirà e riverirà per tutta la vita...\n@c0@"
  ja: "@a@bデボラ「そういえば　今の私たちって\n\t新婚の夫婦だったのよね。\n\tうっかり　忘れるところだったわ。\n@c0@"
203:
  de: "@aGriselda@bNicht schlecht, dass er an so einem belebten Ort schlafen kann. Diese Fähigkeit wird ihm gut zustatten kommen.\n@c0@"
  en: "@aDebora@bHe's doing well to stay asleep in a busy spot like this. That's a skill that'll stand him in good stead in the future.\n@c0@"
  es: "@aStefania@bSe las apaña bien para dormire en un sitio tan ajetreado. Es una abilità que le será molto útil en el futuro.\n@c0@"
  fr: "@aPandora@bIl a du mérite à rester endormi dans un endroit\r\naussi bruyant. C'est un don qui devrait bien lui servir à l'avenir.\n@c0@"
  it: "@aViola@bRiuscire a dormire in un posto come questo non è roba da poco! Quel ragazzino dovrebbe trovare il modo di mettere a frutto il suo talento...\n㈡\nMagari potrebbe sponsorizzare una fabbrica di materassi...\n@c0@"
  ja: "@a@bデボラ「あの子\n\tこんなさわがしい所で　よく寝られるわね。\n\t……将来　見込みがあるわ。\n@c0@"
204:
  de: "@aGriselda@bSo ein blindes Huhn! Er war so fixiert auf seine Tänzerin, dass er die Schönheit gar nicht bemerkt hat, die direkt neben ihm stand.\n@c0@"
  en: "@aDebora@bStupid buffoon! He was so fixated on that dancing girl that he didn't notice he had a real beauty standing right next to him.\n@c0@"
  es: "@aStefania@b¡Bufón ottuso! Estaba tan obsesionado con esa danzatrice que no se dio cuenta de que tenía al lado la verdadera meraviglia. \n@c0@"
  fr: "@aPandora@bPauvre bouffonⓠ Il était tellement fixé sur cette danseuse qu'il ne s'est même pas rendu compte\nqu'il avait une vraie beauté juste à côté de lui.\n@c0@"
  it: "@aViola@bSe quel tipo si esalta tanto per una ballerina appena carina come lei, cosa farebbe se vedesse me?\nCrollerebbe al suolo fulminato?\n@c0@"
  ja: "@a@bデボラ「私みたいな美人が　そばにいるのに\n\t踊り娘しか　見てなかったわ\n\tあのおじさん。　目が悪いのね。\n@c0@"
205:
  de: "@aGriselda@bIch glaube, die in der Mitte ist die Hübscheste. Allerdings kein Vergleich mit mir.\n@c0@"
  en: "@aDebora@bI suppose the one in the middle is the prettiest.\r\nShe's still not a patch on me, though.\n@c0@"
  es: "@aStefania@bSupongo que la del centro es la más bellina.\r\nAunque no me llega a la altura de los zapatos. Ni descalza.\n@c0@"
  fr: "@aPandora@bC'est vrai que c'est celle du milieu la plus jolie. Mais elle ne fait quand même pas le poids à côté de moi.\n@c0@"
  it: "@aViola@bSì, la ragazza al centro è carina.\nPerò ce ne vorrebbero trenta come lei, per fare una donna splendida come la sottoscritta...\n@c0@"
  ja: "@a@bデボラ「たしかに　真ん中の娘が\n\tいちばん　キレイではあるわね。\n\tそれでも　私のほうが　美しいけど。\n@c0@"
206:
  de: "@aGriselda@bWenn wir in die Wüste gehen, dann brauchen wir Wasser. Und Sonnencreme und Sonnenschirme und...\n@c0@"
  en: "@aDebora@bIf we're going to the desert, we'll need water.\r\nAnd suntan lotion and parasols and...\n@c0@"
  es: "@aStefania@bSi vamos al desierto necesitamos acqua.\r\nY bronceador, y una sombrilla, y...\n@c0@"
  fr: "@aPandora@bSi on va dans le désert, on va avoir besoin d'eau.\r\nEt aussi de la crème solaire, et des parasols, et...\n@c0@"
  it: "@aViola@bSe andremo nel deserto, ci servirà molta acqua. Avrò bisogno anche di una crema protettiva per riparare dal sole la mia pelle di pesca...\n@c0@"
  ja: "@a@bデボラ「砂漠へ行くなら　水がいるわね。\n\tもちろん日焼け止めも　日がさも……。\n@c0@"
207:
  de: "@aGriselda@bEs ist natürlich deine Aufgabe, das alles zu besorgen. Nicht meine. Nur damit das klar ist.\n@c0@"
  en: "@aDebora@bYou'll have to get it all ready, okay? Not me.\r\nJust to be totally clear.\n@c0@"
  es: "@aStefania@bYa puedes ir preparándolo tutto, ¿vale?\r\nConmigo no cuentes, por supuesto.\n@c0@"
  fr: "@aPandora@bC'est toi qui te chargeras de préparer tout ça, d'accordⓡ Pas moi.\nJuste pour qu'il n'y ait pas de malentendus.\n@c0@"
  it: "@aViola@bGià che ci sei, comprami anche qualche vestitino leggero. Colori chiari, mi raccomando, che quelli scuri attirano molto i raggi solari...\n@c0@"
  ja: "@a@bデボラ「用意するのは　あなたの役目よ？\n\tわかってるでしょうけど　言っておくわね。\n\t私は　気がきくから。\n@c0@"
208:
  de: "@aGriselda@bDer Alte hat von deinem Vater geredet, oder? Schade, dass ich ihn nie kennengelernt habe.\n@c0@"
  en: "@aDebora@bThe old man was talking about your father, wasn't he? It's a shame I never got to meet him.\n@c0@"
  es: "@aStefania@bEl vecchio hablaba de tu padre, ¿no? Es una pena que no lo haya conocido. Y él a mí ni te digo.\n@c0@"
  fr: "@aPandora@bCe vieil homme parlait de ton père, n'est-ce pasⓡ Dommage que je n'aie jamais eu l'occasion de le rencontrer.\n@c0@"
  it: "@aViola@bSta parlando di tuo padre, vero?\nMi avrebbe fatto piacere conoscere Russel.\n㈡\nGli avrei chiesto com'è stato possibile che una persona del suo calibro ha avuto per figlio un pappamolle come te. Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「この　おじいさんがいっているのは\n\t%a000090の　パパのことなのね。\n\tそう……　１度　会ってみたかったわ。\n@c0@"
209:
  de: "@aGriselda@bEr scheint nicht groß auf das Gerede der Leute zu achten, aber trotzdem entgeht ihm offenbar nichts. Es könnte nützlich sein, ihn kennenzulernen.\n@c0@"
  en: "@aDebora@bHe doesn't look like he's paying much attention to what people say, but he obviously takes it all in.\r\nHe could be a useful person to know.\n@c0@"
  es: "@aStefania@bNo parece prestar atención a lo que se dice, pero es evidente que lo escucha tutto.\r\nPuede ser un contacto vantaggioso.\n@c0@"
  fr: "@aPandora@bIl ne donne pas l'impression de faire très attention à ce que les gens disent, mais en fait, il entend tout.\n㈡\nC'est le genre de personne qu'il est toujours\nutile de connaître.\n@c0@"
  it: "@aViola@bChissà come mai ha deciso di farci questo favore...\nAh, probabilmente avrà pensato che così avrebbe fatto colpo su di me...\n@c0@"
  ja: "@a@bデボラ「人の話を　聞いていないようで\n\tちゃんと聞いていたのね　このバーテン。\n\tそこそこ　使える男じゃないの。\n@c0@"
210:
  de: "@aGriselda@bRitter in schimmernder Rüstung? Lieber hätte ich einen Leibsklaven, der mir jeden Wunsch von den Augen abliest.\n@c0@"
  en: "@aDebora@bA knight in shining armour? I'd rather have a personal slave who's at my constant beck and call.\n@c0@"
  es: "@aStefania@b¡Ja, qué tontería! Es mucho mejor tener un esclavo privato siempre atento a mis caprichos.\n@c0@"
  fr: "@aPandora@bUn fringant chevalierⓡ Je préfère avoir un esclave personnel constamment prêt à répondre à mes moindres exigences.\n@c0@"
  it: "@aViola@bAnch'io avrei voluto sposare un uomo bello, forte e ricco. Invece, mi sono dovuta accontentare di un pappamolle come te...\n@c0@"
  ja: "@a@bデボラ「白馬の王子さま　ね……\n\tそんなものより　私につくしてくれる\n\tしもべのほうが　ずっといいわ。\n@c0@"
211:
  de: "@aGriselda@bAber lass dir das nicht zu Kopf steigen. Das war nicht als Kompliment gemeint.\n@c0@"
  en: "@aDebora@bDon't let that go to your head, though.\nIt wasn't intended as a compliment.\n@c0@"
  es: "@aStefania@bPero que no se te suba a la tua testa.\r\nNo era un cumplido.\n@c0@"
  fr: "@aPandora@bMais que ça ne te monte pas à la tête. Ça n'était pas destiné à être un compliment.\n@c0@"
  it: "@aViola@bDai, %a000090! Non fare quella faccia!\nStavo solo scherzando!\nInsomma, più o meno...\n@c0@"
  ja: "@a@bデボラ「かんちがい　しないでね。\n\tべつに　あんたがいい　とか\n\t言っているわけじゃ　ないんだから。\n@c0@"
212:
  de: "@aGriselda@bWenn der Buddelschiffe machen kann, ist er bestimmt viel schlauer, als er aussieht.\n@c0@"
  en: "@aDebora@bIf he can make ships in bottles, he's obviously a lot cleverer than he looks.\n@c0@"
  es: "@aStefania@bSi puede meter un barco en una bottiglia, obviamente es mucho más listo de lo que parece.\n@c0@"
  fr: "@aPandora@bS'il arrive à fabriquer des bateaux en bouteille,\r\nc'est qu'il est bien plus malin qu'il n'en a l'air.\n@c0@"
  it: "@aViola@bChe belle le navi in bottiglia!\n%0%a000090, voglio che anche tu impari a costruirle!\n㈡\nNon posso sopportare di essere sposata a un uomo che non sa realizzare ciò che desidero!\n@c0@"
  ja: "@a@bデボラ「ボトルシップを　作れるだなんて\n\t見かけによらず　器用だったのね\n\tこのおじさん。\n@c0@"
213:
  de: "@aGriselda@bDer Großmeister... Wenn es den wirklich gibt, dann gibt es bestimmt irgendwo auch einen legendären Helden.\n@c0@"
  en: "@aDebora@bThe Grandmaster... If he really exists, then there's probably a legendary hero out there somewhere too.\n@c0@"
  es: "@aStefania@bEl Gran Maestro... Si existe veramente, es probable que también haya por ahí un héroe legendario.\n@c0@"
  fr: "@aPandora@bLe Grand Maître... S'il existe vraiment, alors il doit bien y avoir aussi un héros légendaire quelque part.\n@c0@"
  it: "@aViola@bIl Gran Maestro degli Inferi...\nDifficile pensare che un essere con questo nome possa essere una persona amichevole...\n@c0@"
  ja: "@a@bデボラ「大魔王　ね……\n\t本当に　そんなものがいるのなら\n\t勇者も　どこかにいるのかもね。\n@c0@"
214:
  de: "@aGriselda@bGehen wir, %a000090. Mit so einem wollen wir nicht in einen Topf geworfen werden.\n@c0@"
  en: "@aDebora@bLet's be on our way, %a000090.\nWe don't want to be associated with the likes of him.\n@c0@"
  es: "@aStefania@bAndiamo, %a000090.\nNo quiero tener que ver con gente como esta, ¿capisci?\n@c0@"
  fr: "@aPandora@bPassons notre chemin, %a000090.\nJe ne veux pas être associée à des gens comme lui.\n@c0@"
  it: "@aViola@bAndiamo via immediatamente, %a000090.\nVoglio mettere la maggior distanza possibile tra me e quell'uomo!\n@c0@"
  ja: "@a@bデボラ「さっさと行くわよ　%a000090。\n\tこんな男と　同類に\n\t見られたくないでしょう。\n@c0@"
215:
  de: "@aGriselda@bSolche Männer sind doch wirklich reine Platzverschwendung.\n@c0@"
  en: "@aDebora@bMen like him really are a waste of space.\n@c0@"
  es: "@aStefania@bLos hombres como él son veramente un estorbo. Me dispiace, ¿capisci?\n@c0@"
  fr: "@aPandora@bLes hommes tels que lui sont vraiment des bons à rien.\n@c0@"
  it: "@aViola@bSe vedesse ballare me, non si fermerebbe al ⓕquattrisⓖ, ma andrebbe avanti almeno fino al ⓕsettantottisⓖ...\n@c0@"
  ja: "@a@bデボラ「こういうときの　男って\n\t本当に　どうしようもないわね。\n@c0@"
216:
  de: "@aGriselda@bAnscheinend gab es gute Gründe, weshalb sie von zu Hause fortgegangen ist. Es ist eine weite Reise für ein junges Mädchen, das ganz allein unterwegs ist.\n@c0@"
  en: "@aDebora@bSounds like there was a reason she couldn't stay at home. It's a long way for a young girl to come travelling on her own.\n@c0@"
  es: "@aStefania@bSembra que había alguna razón por la que no podía quedarse en casa. Es un largo viaje para una ragazza sola.\n@c0@"
  fr: "@aPandora@bOn dirait qu'il y avait une raison à son départ de chez elle. C'est un long chemin à parcourir pour\r\nune jeune fille qui voyage seule.\n@c0@"
  it: "@aViola@bPer forza ha dovuto lasciare casa sua per venire a lavorare qui! Chi vuoi che avesse come spettatori nel deserto, oltre alla sabbia e agli scorpioni?!\n@c0@"
  ja: "@a@bデボラ「なにか　国にいられない\n\t理由でも　あったのかしら。\n\t遠い町に　女１人でやってくるなんて。\n@c0@"
217:
  de: "@aGriselda@bFiese Sachen wie Schwitzen mach' ich nicht. So was überlasse ich ganz dir, %a000090.\n@c0@"
  en: "@aDebora@bI never do yucky things like sweating.\nI leave all that to you, %a000090.\n@c0@"
  es: "@aStefania@bYo no hago ordinarieces como sudar.\nEso te lo dejo a ti, %a000090. ¿Capisci?\n@c0@"
  fr: "@aPandora@bJe ne fais jamais de choses aussi répugnantes\nque transpirer. Tout ça, c'est bon pour toi, %a000090.\n@c0@"
  it: "@aViola@bIo non sudo mai, perché lascio che sia tu a occuparti di tutti i compiti faticosi, %a000090.\nSei contento, vero?\n@c0@"
  ja: "@a@bデボラ「私は　汗をかくようなことはしないわ。\n\tそういう大変なことは　全部\n\t%a000090にやってもらうから。\n@c0@"
218:
  de: "@aGriselda@bDu bist ein alter Esel, %a000090. Wenn du mich jemals so erschreckst, wird dir das leidtun.\n@c0@"
  en: "@aDebora@bYou're an oaf, %a000090. If you ever come barging in on me like that, you'll be sorry!\n@c0@"
  es: "@aStefania@bNo se puede entrar così en los sitios. La gente sufre accidentes en los baños, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu es vraiment un goujat, %a000090. Si tu t'avises de me surprendre comme ça un jour, je te garantis que tu le regretterasⓠ\n@c0@"
  it: "@aViola@bSe ti pesco di nuovo a guardare un'altra donna, ti chiudo in uno scrigno e getto via la chiave...\n@c0@"
  ja: "@a@bデボラ「のぞきが物足りなかったからって\n\t私のお風呂に来たりしたら\n\t……許さないわよ。\n@c0@"
219:
  de: "@aGriselda@bEs ist wunderschön im Mondlicht. Und die Leute können meine Schönheit dabei genauso gut bewundern wie tagsüber.\n@c0@"
  en: "@aDebora@bIt's lovely in the moonlight. And it means people can enjoy my good looks at night as well as during the day.\n@c0@"
  es: "@aStefania@bMe encanta el chiaro di luna. Y así la gente puede admirarme también de notte, no solo de día.\n@c0@"
  fr: "@aPandora@bC'est très joli au clair de lune. Et ça veut dire que les gens peuvent admirer mon physique avantageux de nuit aussi bien que de jour.\n@c0@"
  it: "@aViola@bAdoro quando c'è la luna piena...\nLa luce lunare mi permette di farmi ammirare in tutta la mia bellezza anche di notte.\n@c0@"
  ja: "@a@bデボラ「すてきな月明かりね。\n\tこれなら　夜でも　私の美しい姿を\n\tみんなに見せてあげられるわ。\n@c0@"
220:
  de: "@aGriselda@bWenn er nachts schläft, ist er als Leuchtturmwärter ja nicht gerade eine Leuchte. Wann will er denn das Feuer am Brennen halten, wenn nicht jetzt?\n@c0@"
  en: "@aDebora@bEr, he's not much of a lighthouse keeper if he sleeps at night. This is when the flame needs to be alight!\n@c0@"
  es: "@aStefania@bMenudo farero, que se duerme de notte. ¡Es cuando debe mantenerlo illuminato!\n@c0@"
  fr: "@aPandora@bEuh, il ne joue pas vraiment son rôle de gardien de phare s'il dort la nuit. C'est à ce moment-là que la flamme doit absolument être entretenueⓠ\n@c0@"
  it: "@aViola@bUn guardiano del faro che dorme di notte, proprio quando è necessaria la massima attenzione affinché la fiamma non si spenga?! Ma questo è matto!\n@c0@"
  ja: "@a@bデボラ「ちょっと……　夜に寝ていたら\n\t灯台守になっていないじゃないの。\n\t灯台の明かりが必要なのは　今なのに。\n@c0@"
221:
  de: "@aGriselda@bSicher hat er es doch nicht seiner Katze überlassen, auf das Leuchtfeuer aufzupassen! So schlau kann keine Katze sein!\n@c0@"
  en: "@aDebora@bSurely he's not left it up to the cat to look after the flame. No cat's that clever!\n@c0@"
  es: "@aStefania@bNo habrá dejado al gato el cuidado de la fiamma... ¡No puede ser un gato tan listo!\n@c0@"
  fr: "@aPandora@bIl n'a quand même pas chargé le chat de surveiller\nla flamme, quand même. Aucun chat n'est assez\nintelligent pour çaⓠ\n@c0@"
  it: "@aViola@bNon sarà mica il gatto a sorvegliare il faro di notte?! I gatti sono animali intelligenti, ma da qui a gestire un faro ce ne corre!\n@c0@"
  ja: "@a@bデボラ「まさか　夜のあいだは\n\tネコが灯台守をしているだなんて……\n\tそんなことは　ありえないわよね。\n@c0@"
222:
  de: "@aGriselda@bDie Sterne sind wunderschön, nicht? Schönes zieht mich magisch an. Das meinen die Leute wohl mit dem Spruch ⓞGleich und gleich gesellt sich gernⓟ.\n@c0@"
  en: "@aDebora@bThe stars are lovely, aren't they? I'm very drawn to pretty things. I suppose like attracts like.\n@c0@"
  es: "@aStefania@bLas estrellas son veramente preciosas. Me gustan las cosas più bellas. Los iguales se atraen, supongo.\n@c0@"
  fr: "@aPandora@bLes étoiles sont très belles, tu ne trouves pasⓡ\nJe suis très attirée par les belles choses.\nQui se ressemble s'assemble, j'imagine.\n@c0@"
  it: "@aViola@bChe belle, le stelle...\nLa loro luce rallegra il cielo notturno proprio come la mia bellezza illumina gli occhi di chi mi guarda...\n@c0@"
  ja: "@a@bデボラ「ステキな星空ね。\n\t私　キレイなものが大好きなの。\n\t私自身が　美しいからだと思うわ。\n@c0@"
223:
  de: "@aGriselda@bEr kann sich nicht mal im Schlaf von seinem geliebten Teleskop trennen. Ihr Männer werdet auch nie erwachsen, was?\n@c0@"
  en: "@aDebora@bHe can't part with his beloved telescope even when he's asleep. You men never grow up, do you?\n@c0@"
  es: "@aStefania@bNo deja su amatto telescopio ni dormido. ¿Es que nunca maduráis los hombres?\n@c0@"
  fr: "@aPandora@bMême en dormant il n'arrive pas à se séparer de son télescope bien-aimé. Vous les hommes, vous ne grandissez jamais, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bQuel tipo ha in testa il cannocchiale persino mentre dorme. Se fossi sua moglie, glielo romperei sulla testa, il cannocchiale!\n@c0@"
  ja: "@a@bデボラ「寝ているときまで　好きな望遠鏡から\n\tはなれようと　しないなんて。\n\t男って　いつまでたっても子供ね。\n@c0@"
224:
  de: "@aGriselda@bMit Papa war ich oft hier.\n@c0@"
  en: "@aDebora@bPapa brought me here lots of times.\n@c0@"
  es: "@aStefania@bIl mio papino me trajo aquí muchas veces.\n@c0@"
  fr: "@aPandora@bPapa m'a déjà emmenée plein de fois ici.\n@c0@"
  it: "@aViola@bConosco questo posto.\nCi sono venuta con Nera e il mio paparino un'infinità di volte.\n@c0@"
  ja: "@a@bデボラ「ここには　何度か　パパと\n\tいっしょに　来たことがあるわ。\n@c0@"
225:
  de: "@aGriselda@bWeißt du, wie man Buddelschiffe baut, %a000090?\n@c0@"
  en: "@aDebora@bDo you know how they make ships in bottles, %a000090?\n@c0@"
  es: "@aStefania@b¿Sabes cómo se meten barcos en bottiglias, %a000090?\n@c0@"
  fr: "@aPandora@bEst-ce que tu sais comment ils fabriquent les bateaux en bouteille, %a000090ⓡ\n@c0@"
  it: "@a@bSai come si costruiscono le navi in bottiglia, %a000090?\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090。\n\tボトルシップって\n\tどうやって作るか　知ってる？\n@c0@"
226:
  de: "@aGriselda@bBei so unwichtigem Kleinkram bist du überraschend gut. Nicht, dass ich mich bei meinem Leibdiener mit weniger zufrieden geben würde, natürlich.\n@c0@"
  en: "@aDebora@bYou're surprisingly good when it comes to trivia.\r\nNot that I'd accept anything less from my personal servant, of course.\n@c0@"
  es: "@aStefania@bDe cose banali sabes un rato largo.\r\nAunque tampoco aceptaría menos de mi criado personal, claro.\n@c0@"
  fr: "@aPandora@bTu es étonnamment doué pour les questions de culture générale. Je n'en attendais de toute façon pas moins de mon domestique personnel, évidemment.\n@c0@"
  it: "@a@bAccidenti! Ma sei un vero pozzo di scienza, eh?\nD'altra parte, se tu fossi stato uno zotico ignorante, non ti avrei scelto come marito...\n@c0@"
  ja: "@a@bデボラ「へえ　意外と物知りだったのね。\n\tもっとも　そのくらいじゃなければ\n\t私のしもべは　つとまらないけど。\n@c0@"
227:
  de: "@aGriselda@bSie führen Teilchen für Teilchen durch den Flaschenhals und bauen sie in der Flasche zusammen. Du hast Glück, dass ich so viel weiß.\n@c0@"
  en: "@aDebora@bThey feed each piece in one by one and assemble them inside the bottle. You're lucky I'm so knowledgeable.\n@c0@"
  es: "@aStefania@bMeten las piezas una a una y las montan ya dentro de la bottiglia. Suerte tienes de que sepa de tutto.\n@c0@"
  fr: "@aPandora@bIls insèrent chaque pièce une par une et les assemblent à l'intérieur de la bouteille. Tu as de la chance que je sois aussi cultivée.\n@c0@"
  it: "@a@bSi infila nella bottiglia lo scafo, con l'albero abbassato e legato a una cordicella. Poi si tira la cordicella e l'albero viene su! E il gioco è fatto!\n@c0@"
  ja: "@a@bデボラ「ボトルの外側から　１つずつ\n\t部品を入れて　中で組み立てるの。\n\tあんた　物知りな主人をもてて幸せよ。\n@c0@"
228:
  de: "@aGriselda@bIch war noch nie so arm, dass ich mir nicht mal ein popeliges Souvenir leisten konnte. Das tust du mir nicht noch einmal an, %a000090!\n@c0@"
  en: "@aDebora@bI've never been so poor that I couldn't afford one measly souvenir. You'd better not make me feel this wretched ever again, %a000090.\n@c0@"
  es: "@aStefania@bNunca había sido tan povera como para no poder comprar un triste souvenir.\n㈡\nPor tu bien, %a000090, espero no volver a sentirme tan miserabile nunca jamás, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe n'ai jamais été pauvre au point de ne pas pouvoir m'offrir un malheureux souvenir moisi.\n㈡\nTu as intérêt à éviter de me mettre à nouveau dans une situation aussi inconfortable, %a000090.\n@c0@"
  it: "@aViola@bMa guarda in che guaio mi sono cacciata decidendo di sposare te, %a000090!\n㈡\nHo sempre vissuto tra agi e ricchezze, e ora ho accanto un uomo tanto povero da non potermi nemmeno regalare un misero souvenir!\n@c0@"
  ja: "@a@bデボラ「お土産のひとつも　買えないなんて\n\tこんなこと　初めての経験だわ。\n\tこれ以上　みじめな思いはさせないでよね。\n@c0@"
229:
  de: "@aGriselda@bWas für ein Trottel! Solche Leute gehen mir echt auf die Nerven.\n@c0@"
  en: "@aDebora@bWhat a klutz! I find people like that so irritating.\n@c0@"
  es: "@aStefania@b¡Qué patán! La gente así es veramente irritante.\n@c0@"
  fr: "@aPandora@bQuel maladroitⓠ Ça m'énerve, les gens comme ça.\n@c0@"
  it: "@aViola@bChe razza d'imbranato!\nÈ quasi peggio di te, caro.\nHo detto QUASI...\n@c0@"
  ja: "@a@bデボラ「まったく　ドジね。\n\t私　ああいう男を見ていると\n\tイライラしてくるの。\n@c0@"
230:
  de: "@aNera@bOh je. Wahrscheinlich hätten wir Papa erst um Erlaubnis fragen sollen, bevor wir versuchten, mit dem Schiff zu fahren.\n@c0@"
  en: "@aNera@bOh dear. We should probably have asked for Papa's permission before trying to take the boat.\n@c0@"
  es: "@aNera@b¡Ay, caro!. Deberíamos haber pedido permiso a il mio papino antes de intentar tomar el barco.\n@c0@"
  fr: "@aNera@bOh là là. On aurait sans doute dû demander l'autorisation à papa avant d'essayer d'emprunter\r\nle bateau.\n@c0@"
  it: "@aNera@bTesoro, forse avremmo dovuto chiedere a mio padre il permesso di prendere la sua nave...\n@c0@"
  ja: "@a@bフローラ「やっぱり　きちんとお父様に\n\t旅の許しを　もらってから\n\tここへ　来るべきではないかと思いますわ。\n@c0@"
231:
  de: "@aGriselda@bWas für ein Dummkopf! Mich nicht zu erkennen!\n@c0@"
  en: "@aDebora@bWhat an oaf! Fancy not recognising me!\n@c0@"
  es: "@aStefania@b¡Individuo goffo! ¡No reconocerme!\n@c0@"
  fr: "@aPandora@bQuel mufleⓠ Ne pas me reconnaître,\ntu te rends compteⓡⓐ\n@c0@"
  it: "@aViola@bNon è possibile...\n...\nNon mi ha riconosciuta!\n㈡\nCome ha potuto dimenticare il mio volto angelico?!\nBah, peggio per lui.\n@c0@"
  ja: "@a@bデボラ「この船員ったら\n\t私を覚えていないだなんて\n\t全く　使えないわね！\n@c0@"
232:
  de: "@aGriselda@bOffenbar müssen wir erst heimgehen und Papa um Erlaubnis bitten, dass wir mit dem Schiff fahren können. Wie umständlich!\n@c0@"
  en: "@aDebora@bLooks like we'll have to go home and ask for Papa's permission to use the boat. What a pain!\n@c0@"
  es: "@aStefania@bSembra que tendremos que ir a casa y pedir permiso a il mio papino para usar el barco. ¡Qué molesto!\n@c0@"
  fr: "@aPandora@bOn dirait qu'il va nous falloir aller à la maison pour demander la permission à papa d'emprunter son bateau. Quelle barbeⓠ\n@c0@"
  it: "@aViola@bAnzi, no! È peggio per noi! Ora dovremo tornare a casa e chiedere al mio paparino il permesso di prendere la nave... Uffà! Che seccatura!\n@c0@"
  ja: "@a@bデボラ「これじゃ　１度サラボナにもどって\n\tパパに　旅の許しをもらわないとダメね。\n\tまったく　めんどうなんだから　もう！\n@c0@"
233:
  de: "@aGriselda@bDas ist Papas Schiff, und das bedeutet, es gehört auch mir. Du kannst es nehmen, wenn du willst.\n@c0@"
  en: "@aDebora@bThis is Papa's boat, which means it's also mine.\r\nYou can use it if you want.\n@c0@"
  es: "@aStefania@bEste es el barco del mio papino. Y por tanto mío.\r\nPuedes usarlo si quieres.\n@c0@"
  fr: "@aPandora@bC'est le bateau de papa, ce qui veut dire qu'il est aussi à moi. Tu peux t'en servir, si tu veux.\n@c0@"
  it: "@aViola@bPuoi fare quello che vuoi con la nave del mio paparino, caro. Anzi, per meglio dire: puoi farci quello che ti ordinerò di fare...\n@c0@"
  ja: "@a@bデボラ「これは　パパの船だけど\n\t私の船でもあるわ。\n\tだから　あんたも乗ってみていいわよ。\n@c0@"
234:
  de: "@aGriselda@bDas ist Papas Schiff, und das bedeutet, es gehört auch mir. Du kannst es nehmen, wenn du willst.\n@c0@"
  en: "@aDebora@bThis is Papa's boat, which means it's also mine.\r\nYou can use it if you want.\n@c0@"
  es: "@aStefania@bEste es el barco del mio papino. Y por tanto mío.\r\nPuedes usarlo si quieres.\n@c0@"
  fr: "@aPandora@bC'est le bateau de papa, ce qui veut dire qu'il est aussi à moi. Tu peux t'en servir, si tu veux.\n@c0@"
  it: "@aViola@bPuoi fare quello che vuoi con la nave del mio paparino, caro. Anzi, per meglio dire: puoi farci quello che ti ordinerò di fare...\n@c0@"
  ja: "@a@bデボラ「これは　パパの船だけど\n\t私の船でもあるわ。\n\tだから　あんたも乗ってみていいわよ。\n@c0@"
235:
  de: "@aGriselda@bDiesem Schiff sieht man sein Alter allmählich an. Es ist über die Jahre wohl viel benutzt worden.\n@c0@"
  en: "@aDebora@bThis boat's certainly starting to show its age.\r\nI suppose it's had a lot of use over the years.\n@c0@"
  es: "@aStefania@bEste barco veramente empieza a acusar la edad.\r\nSe habrá usado molto a lo largo de los años.\n@c0@"
  fr: "@aPandora@bCe bateau commence à donner des signes de fatigue. Il a dû être utilisé de nombreuses fois pendant toutes ces années.\n@c0@"
  it: "@aViola@bQuesta nave ha un bel po' di anni sulle spalle, ma è in condizioni perfette.\n@c0@"
  ja: "@a@bデボラ「それにしても　この船\n\tだいぶ　古くなってきたわね。\n\tずいぶん昔から　使っているから。\n@c0@"
236:
  de: "@aGriselda@bAber keine Sorge. Papa kümmert sich immer gut um seine Sachen, darum ist es bestimmt seetüchtig. Wahrscheinlich.\n@c0@"
  en: "@aDebora@bYou don't need to worry, though. Papa always takes good care of things, so I'm sure it's seaworthy. Probably.\n@c0@"
  es: "@aStefania@bMa non ti preoccupare. Il mio papino siempre cuida bene de las cosas, así que no tendrá problemas para navegar. Vamos, casi seguro.\n@c0@"
  fr: "@aPandora@bMais tu n'as pas à t'inquiéter. Papa prend toujours grand soin de ses affaires, alors je suis sûre qu'il peut prendre la mer. Enfin, je crois.\n@c0@"
  it: "@aViola@bIl mio paparino tiene molto a che le sue imbarcazioni siano sempre in perfetto stato. Sono sicura che non avremo problemi di nessun tipo.\n@c0@"
  ja: "@a@bデボラ「あら　心配しなくても大丈夫よ。\n\tパパは　物を大切にするから　ちゃんと\n\t手入れはしているはずよ。　たぶんね。\n@c0@"
237:
  de: "@aNera@bIch habe früher Schatzkarten gezeichnet. Das ging so weit, dass ich meine Schätze sogar selbst vergraben habe! He he!\n@c0@"
  en: "@aNera@bI used to draw treasure maps when I was his age. I'd even go so far as to bury the treasure myself. He he!\n@c0@"
  es: "@aNera@bCuando yo tenía su edad solía dibujar mapas de tesoros. A veces incluso yo misma enterraba veramente un tesoro. ¡Ji, ji!\n@c0@"
  fr: "@aNera@bQuand j'avais son âge, je dessinais des cartes au trésor. J'étais même allée jusqu'à enterrer moi-même le trésor à trouver. Hi hiⓠ\n@c0@"
  it: "@aNera@bNon ho bisogno di una mappa per trovare il mio tesoro... Ce l'ho qui, al mio fianco.\n%0%a000090, sei tu il mio tesoro.\n\n@c0@"
  ja: "@a@bフローラ「私も　小さい頃　自分で\n\t宝の地図を　かいたりしましたのよ。\n\t自分で　宝物をうめて…　うふふ。\n@c0@"
238:
  de: "@aNera@bAber es war wirklich merkwürdig. Irgendwie ist der Schatz immer wieder in meinem Schrank gelandet.\n@c0@"
  en: "@aNera@bBut it was really very strange. I'd always end up finding the treasure mysteriously back inside my cupboard.\n@c0@"
  es: "@aNera@bMa era rarísimo. Siempre terminaba encontrando el tesoro otra vez en mi armario. Muy misterioso.\n@c0@"
  fr: "@aNera@bMais c'était vraiment très bizarre. Je finissais toujours par retrouver le trésor mystérieusement rangé à sa place dans mon placard.\n@c0@"
  it: "@aNera@bDa piccola, però, anch'io sognavo di trovare un tesoro.\n㈡\nSai cosa facevo?\nNascondevo una delle mie bambole da qualche parte, e poi disegnavo una mappa per ritrovarla...\n@c0@"
  ja: "@a@bフローラ「でも　どういうわけか　いつも\n\tうめたはずの場所から　宝物がなくなって\n\t私のタンスに　もどっているんですの。\n@c0@"
239:
  de: "@aNera@bDas hat mich total verblüfft. Griselda hat gesagt, wahrscheinlich würden mir die Feen Streiche spielen.\n@c0@"
  en: "@aNera@bI was completely baffled by it. Debora said it was probably some faeries up to their tricks.\n@c0@"
  es: "@aNera@bEra veramente desconcertante. Stefania decía que serían trucos de las hadas. \n@c0@"
  fr: "@aNera@bÇa me plongeait dans des abîmes de perplexité. Pandora me disait que c'était sûrement les fées\r\nqui me jouaient des tours.\n@c0@"
  it: "@aNera@bPerò a volte trovavo la bambola in un luogo diverso da dove l'avevo messa. Non ho mai capito come fosse possibile una cosa del genere...\n@c0@"
  ja: "@a@bフローラ「あれは　本当に不思議でしたわ。\n\t姉さんは　妖精のしわざじゃないか　って\n\t言っていましたけど……。\n@c0@"
240:
  de: "@aGriselda@bAls ich noch klein war, bin ich mit diesem Schiff mal mit Papa und Nera von Kleinhaven aus gesegelt.\n@c0@"
  en: "@aDebora@bWhen I was little, I once sailed on this boat from Littlehaven with Papa and Nera.\n@c0@"
  es: "@aStefania@bCuando era una bambina, una vez partí en este barco desde Puerto Securus con il mio papino y Nera.\n@c0@"
  fr: "@aPandora@bQuand j'étais petite, j'ai navigué une fois sur ce bateau depuis le Petit Havre avec papa et Nera.\n@c0@"
  it: "@aViola@bAnni fa, quand'ero ancora una bambina, feci una crociera su questa nave. Ero con il mio paparino e mia sorella.\n㈡\nRicordo che dovevamo salpare da Cala Disorte...\n@c0@"
  ja: "@a@bデボラ「まだ　私が小さかった頃\n\tビスタ港から　パパやフローラと一緒に\n\tこの船に乗ったことがあるのよ。\n@c0@"
241:
  de: "@aGriselda@bDas war meine erste Schiffsreise, und ich konnte es kaum abwarten. Ich bin gerannt und in einen einschüchternd aussehenden Krieger gelaufen.\n@c0@"
  en: "@aDebora@bIt was my first time on a boat, so I was desperate to get on. I was running and I bumped into a tough-looking warrior.\n@c0@"
  es: "@aStefania@bEra la prima volta que navegaba, estaba ansiosa. Iba corriendo y me di de bruces con un soldato de aspecto fiero.\n@c0@"
  fr: "@aPandora@bC'était la première fois que prenais le bateau et j'étais très impatiente de monter à bord. Je courais et je suis rentrée dans un guerrier à l'air costaud.\n@c0@"
  it: "@aViola@bNon ero mai stata per mare prima di allora, e avevo una voglia matta di salire a bordo!\n㈡\nCorsi così velocemente che andai a sbattere contro un uomo alto e forte. A occhio e croce, direi che era un guerriero.\n@c0@"
  ja: "@a@bデボラ「船に乗るのが　初めてだったから\n\t早く乗ってみたくて。　走っていったら　\n\tいかついおじさん戦士に　ぶつかったの。\n@c0@"
242:
  de: "@aGriselda@bAber es war seine Schuld. Er stand da stocksteif, ganz geblendet von meiner Schönheit. Und dabei war ich nicht mal halb so alt wie er!\n@c0@"
  en: "@aDebora@bIt was his fault, though. He was standing stock-still, dazzled by my beauty. No matter that I was less than half his age!\n@c0@"
  es: "@aStefania@bMa fue culpa suya. Estaba ahí plantado, paralizado per la mia belleza. ¡Aunque me doblara la edad!\n@c0@"
  fr: "@aPandora@bMais c'était sa faute. Il se tenait là, immobile comme une souche, ébloui par ma beauté, même si j'avais moins de la moitié de son âgeⓠ\n@c0@"
  it: "@aViola@bOvviamente, la colpa era sua, che era fermo e immobile come un salame davanti alla passerella della nave...\n@c0@"
  ja: "@a@bデボラ「その戦士ったら　年がいもなく\n\t私の美しさに　見とれて\n\tボーッとしてるから　ぶつかったのよ。\n@c0@"
243:
  de: "@aGriselda@bDaran musste ich denken, als wir beide uns das erste Mal begegnet sind. Es war ein richtiges Déjà-vu-Erlebnis.\n@c0@"
  en: "@aDebora@bI was reminded of that the first time we ever met.\r\nI just had a feeling of déjà vu.\n@c0@"
  es: "@aStefania@bMe recuerda a la prima volta que nos vimos tú y yo.\r\nTuve una sensación de déjà vu.\n@c0@"
  fr: "@aPandora@bJ'ai repensé à ça la première fois qu'on s'est rencontrés J'ai eu une impression de déjà-vu.\n@c0@"
  it: "@aViola@bNon so perché, ma la prima volta che ti ho visto m'è tornato alla mente quel lontano episodio.\n㈡\nPer qualche inspiegabile motivo, mi hai ricordato quel giorno a Cala Disorte...\n@c0@"
  ja: "@a@bデボラ「初めて　あんたを見た時\n\tなぜか　その時のことを　思い出したの。\n\tトロそうなところが　似てるからかしら。\n@c0@"
244:
  de: "@aGriselda@bWir sollten ihn seinen Gedanken überlassen. Mehr können wir für ihn nicht tun.\n@c0@"
  en: "@aDebora@bWe should leave him to his thoughts.\nThat's about all we can do for him.\n@c0@"
  es: "@aStefania@bDeberíamos dejarlo in pace. \r\nEs cuanto podemos hacer por él.\n@c0@"
  fr: "@aPandora@bOn devrait le laisser à ses pensées. C'est à peu\r\nprès tout ce qu'on peut faire pour lui.\n@c0@"
  it: "@aViola@bLasciamolo in pace, caro.\nTemo che non possiamo far nulla per aiutarlo...\n@c0@"
  ja: "@a@bデボラ「１人にしておいてあげましょう。\n\t私たちにできることは\n\tそれくらいしか　ないわ。\n@c0@"
245:
  de: "@aGriselda@bWas ist denn? Warum siehst du so bekümmert aus?\n@c0@"
  en: "@aDebora@bWhat's wrong?\nWhy are you looking so troubled?\n@c0@"
  es: "@aStefania@b¿Qué pasa? ¿Por qué estás tan preoccupato?\n@c0@"
  fr: "@aPandora@bQu'est-ce qu'il y a qui ne va pasⓡ\nPourquoi tu as l'air si troubléⓡ\n@c0@"
  it: "@aViola@bCos'hai da guardarmi così, %a000090?\nSei sorpreso di sentirmi parlare in questo modo?\n㈡\nBeh, nel caso non te ne fossi ancora accorto, ti informo che sotto la mia scorza dura batte il cuore di una donna sensibile!\n@c0@"
  ja: "@a@bデボラ「……何なの？　その\n\t珍しいものでも　見るような顔は。\n@c0@"
