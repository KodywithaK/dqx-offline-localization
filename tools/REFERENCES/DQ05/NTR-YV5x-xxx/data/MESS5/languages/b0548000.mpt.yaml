0:
  de: "@a%0%a001240@bSieh nur, Papa! Ein Truhen-&-Tücken-Brett!\n@c0@"
  en: "@a%0%a001240@bLook, Dad! It's a Treasures & Trapdoors board!\n@c0@"
  es: "@a%0%a001240@b¡Mira, papi! ¡Es un tablero de Tesoros y Trampas!\n@c0@"
  fr: "@a%0%a001240@bPapa, regardeⓠ C'est un jeu de TNTⓠ\n@c0@"
  it: "@a%0%a001240@bGuarda, papà!\nUna Tavola della Sorte!\n@c0@"
  ja: "@a@b%a001240「見て　お父さん！\n\tすごろく場があるよ。\n@c0@"
1:
  de: "@a%0%a001240@bIch liebe T&T, genauso wie du! Hast du mich deshalb hierher gebracht?\n@c0@"
  en: "@a%0%a001240@bI love T 'n' T just as much as you do! Is that why you brought me here?\n@c0@"
  es: "@a%0%a001240@b¡Me encanta el T y T, como a ti! Por eso me has traído aquí, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bJe suis comme toi, j'adore le TNT. C'est pour ça que tu m'as amené iciⓡ\n@c0@"
  it: "@a%0%a001240@bLa Tavola della Sorte è il mio gioco preferito!\nScommetto che mi hai portato qui per farmi una sorpresa!\n@c0@"
  ja: "@a@b%a001240「ボクも　お父さんと同じで\n\tすごろく大好きだよ！\n\tだから　ここに来たんだよね？\n@c0@"
2:
  de: "@a%0%a001250@bHast du ein T&T-Ticket, Papa? Ich würde so gern mal spielen!\n@c0@"
  en: "@a%0%a001250@bHave you got a T 'n' T ticket, Dad?\nI'd love to have a go!\n@c0@"
  es: "@a%0%a001250@b¿Tienes un boleto de T y T, papi?\n¡Me encantaría probar!\n@c0@"
  fr: "@a%0%a001250@bTu as un ticket de TNT, papaⓡ\nJ'aimerais bien faire une partieⓠ\n@c0@"
  it: "@a%0%a001250@bPapino, ce l'hai un biglietto della Sorte?\nVorrei tanto fare una partita!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tすごろく券　持ってる？\n\tわたし　すごろくで　遊びたい！\n@c0@"
3:
  de: "@a%0%a001250@bAch ja! Wir haben ja eine T&T-Freikarte und können so oft spielen, wie wir wollen! Das geht doch in Ordnung, oder?\n@c0@"
  en: "@a%0%a001250@bOf course! We've got a free pass so we can play as many times as we like! That's okay, right?\n@c0@"
  es: "@a%0%a001250@b¡Claro! ¡Tenemos un abono, así que podemos jugar todas las veces que queramos, ¿verdad?!\n@c0@"
  fr: "@a%0%a001250@bMais bien sûrⓠ On a le laissez-passer, alors on peut jouer autant de fois qu'on veutⓠ On peut, disⓡ\n@c0@"
  it: "@a%0%a001250@bChe sbadata che sono!\nAbbiamo il Passepartout della Sorte, quindi possiamo giocare tutte le volte che vogliamo!\n@c0@"
  ja: "@a@b%a001250「あっ　パスがあるから\n\t大丈夫だね。\n\tい～っぱい　遊んでもいい？\n@c0@"
4:
  de: "@a%0%a001250@bHmm. Gar nicht so einfach. Welchen Weg nehm ich denn jetzt...?\n@c0@"
  en: "@a%0%a001250@bHmm. This is a tricky one.\nI wonder which way to move.\n@c0@"
  es: "@a%0%a001250@bMmm. Este es complicadillo.\nNo sé hacia dónde moverme.\n@c0@"
  fr: "@a%0%a001250@bMmm. C'est délicat. Je ne sais pas trop par où aller.\n@c0@"
  it: "@a%0%a001250@bUhm...\nLa situazione è complicata...\nDa che parte vado?\n@c0@"
  ja: "@a@b%a001250「う～ん…　あそこって\n\tああなってるんだ……。\n\tちょっと　むずかしいね　ここ。\n@c0@"
5:
  de: "@aSancho@bAls iss mit Señor Ludwig auf Reisen war, haben wir viele T&T-Bretter gesehen. Aber gespielt wir haben nie, weißt du.\n@c0@"
  en: "@aSancho@bWhen I ees travelling weeth señor Pankraz, we find many boards of T 'n' T. But we never estop to play, you know.\n@c0@"
  es: "@aSancho@bCuando viajaba con el señor Teudis encontramos chorrocientas veces tableros de T y T, pero nunca nos paramos a jugar.\n@c0@"
  fr: "@aSancho@bQuand je v-voyageais avec le señor P-Petros,\r\non a vu beaucoup de jeux de TNT, mais on ne\r\ns'est j-jamais arrêtés pour jouer, tu sais.\n@c0@"
  it: "@aSancho@bYo y el señor Russel abbiamo trovato muchas Tavolas della Sorte durante los nuestros viaggios, ma no ce siamo mai fermatos por giocare.\n@c0@"
  ja: "@a@bサンチョ「パパスさまと　旅したときも\n\tすごろく場は　なん度か見かけましたが\n\t遊んだことは　ありませんでしたね。\n@c0@"
6:
  de: "@aSancho@bEs ist gut so. Es ist wie eine Fiesta. Deine Onkel Sancho mag Fiestas fast genauso sehr wie Paella!\n@c0@"
  en: "@aSancho@bI no put the espoon een. Ees good. Ees like the\r\nfiesta. Sancho, he likes the fiesta almost as\r\nmuch as the paella!\n@c0@"
  es: "@aSancho@b¡Órale, chanfle, y todo lo demás! Es como una fiesta. ¡A Sancho, la fiesta le gusta tanto como los burritos!\n@c0@"
  fr: "@aSancho@bT-Tu fais ce que tu veux. C'est bueno. Et c'est un peu comme oune fiesta. Et Sancho, il aime la fiesta presque autant que la p-paella.\n@c0@"
  it: "@aSancho@bNo me voglio intromettere, ma es bueno.\nSì sì sì.\nEs bueno como la fiesta, bueno como la paella.\n@c0@"
  ja: "@a@bサンチョ「いえいえ　こんな時に　などと\n\tとがめはしませんよ。\n\t私も　すごろく　やってみたいですし。\n@c0@"
7:
  de: "@aOtto@bDas ist aber ein großes T&T-Brett. Wer auch immer es errichtet hat, war ein großer Baumeister.\n@c0@"
  en: "@aTuppence@bThis is a big T 'n' T board. Quite an achievement for whoever built it, I'd say.\n@c0@"
  es: "@aAlazar@bEste tablero de T y T es grande de verdad. La persona que lo construyó merece reconocimiento.\n@c0@"
  fr: "@aInnocent@bCe jeu de TNT est immense. Je tire mon chapeau à celui qui l'a construit.\n@c0@"
  it: "@aSimon@bQuesta Tavola della Sorte è bella grande.\nComplimenti a chi l'ha costruita!\n@c0@"
  ja: "@a@bピピン「大きな　すごろく場ですねえ。\n\tうん　こりゃ　りっぱだ。\n@c0@"
8:
  de: "@aOtto@bIhr müsst es mich versuchen lassen, %a000090! Ich habe ein glückliches Händchen, vielleicht kann ich ja etwas Nützliches für uns gewinnen!\n@c0@"
  en: "@aTuppence@bYou must let me try, %a000090! I've got lucky fingers, you know. I'll win us something good, trust me!\n@c0@"
  es: "@aAlazar@b¡Tenéis que dejarme probar, %a000090! Tengo mucha suerte. ¡Seguro que ganamos algo bueno!\n@c0@"
  fr: "@aInnocent@bLaissez-moi essayer, %a000090ⓠ J'ai souvent la main heureuse. Je vais gagner quelque chose de bien, vous pouvez me croire.\n@c0@"
  it: "@aSimon@bMi lasci provare, Maestà!\nSento di avere la mano fortunata!\nSono certo che andrà bene, si fidi di me!\n@c0@"
  ja: "@a@bピピン「%a000090さま　ぜひ　ボクに！\n\tボクの　この黄金のウデで\n\tいい目を出してみせますよ！\n@c0@"
9:
  de: "@aBianca@bIch bin nicht besonders gut bei diesen T&T-Brettern. Ich habe einfach kein Glück.\n@c0@"
  en: "@aBianca@bI'm not really very good at T 'n' T. I never seem to roll a good throw.\n@c0@"
  es: "@aBianca@bNo se me da muy bien el T y T. Casi nunca consigo una buena tirada, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne suis pas vraiment forte au TNT.\r\nJe n'ai pas de chance aux dés.\n@c0@"
  it: "@aBianca@bNon sono fortunata alla Tavola della Sorte...\nNon esce mai il numero che mi serve!\n@c0@"
  ja: "@a@bビアンカ「私　あんまり　すごろくって\n\t得意じゃないのよね。\n\tいい目を　なかなか出せないんだもん。\n@c0@"
10:
  de: "@aBianca@bEs kann ja nicht schaden, hin und wieder eine Pause einzulegen. Wir könnten doch ein kleines Spiel machen, bevor wir weiterziehen, was meinst du?\n@c0@"
  en: "@aBianca@bIt can't hurt to let our hair down every once in a while. We could have a game here before movin'\r\non, eh?\n@c0@"
  es: "@aBianca@bNo está mal soltarse el pelo de vez en cuando. Podríamos jugar una partidita antes de continuar, ¿no?\n@c0@"
  fr: "@aBianca@bÇa ne fait pas de mal de se reposer de temps\nen temps. On pourrait faire une partie avant\nde continuer, nonⓡ\n@c0@"
  it: "@aBianca@bRilassarci un po' non ci farà certo male, no?\nPotremmo fare una partitina prima di proseguire il viaggio...\n@c0@"
  ja: "@a@bビアンカ「たまには　息ぬきも必要よね。\n\t少しだけ　遊んでいきましょうか。\n@c0@"
11:
  de: "@aNera@bIch liebe T&T! Das Würfeln ist besonders lustig!\n@c0@"
  en: "@aNera@bI absolutely adore T 'n' T. It's so much fun\r\nrolling the dice!\n@c0@"
  es: "@aNera@bMe encanta el T y T. ¡Es molto divertente lanzar los dados!\n@c0@"
  fr: "@aNera@bJ'adore le TNTⓠ C'est tellement amusant de lancer\nle déⓠ\n@c0@"
  it: "@aNera@bAdoro la Tavola della Sorte!\nLanciare i dadi mi dà un brrrivido pazzesco!\n@c0@"
  ja: "@a@bフローラ「私　すごろく好きなんです。\n\tサイコロを振るのって\n\t楽しいですわよね。\n@c0@"
12:
  de: "@aNera@bZu schade, dass nur einer von uns auf das Brett darf. Es ist ja so nervenaufreibend, vom Rand aus zuzusehen!\n@c0@"
  en: "@aNera@bIt's a shame that only one of us can go up on\r\nthe board. It's so tense having to watch from\r\nthe sidelines!\n@c0@"
  es: "@aNera@bQué lástima que sólo uno de nosotros pueda subirse al tablero. ¡Veramente se pasa muy mal mirando desde la barrera!\n@c0@"
  fr: "@aNera@bC'est dommage qu'une seule personne de l'équipe puisse aller sur le plateau. C'est stressant de devoir regarder depuis le bordⓠ\n@c0@"
  it: "@aNera@bPeccato che sulla Tavola possa salire una sola persona...\nOsservare il gioco dall'esterno è una vera sofferenza.\n@c0@"
  ja: "@a@bフローラ「すごろくって　ひとりしか\n\t台の上にあがれないのが　残念だわ。\n\t外で見てると　ハラハラして……。\n@c0@"
13:
  de: "@a%0%a001240@bDu hast hier mal ein böses Monster besiegt, oder, Papa? Du bist ja so stark!\n@c0@"
  en: "@a%0%a001240@bYou defeated a bad monster here once, didn't you, Dad? You're cool!\n@c0@"
  es: "@a%0%a001240@bAquí derrotaste una vez a un monstruo malvado, ¿verdad papi? ¡Eres genial!\n@c0@"
  fr: "@a%0%a001240@bC'est vrai qu'autrefois, tu as battu un monstre ici, papaⓡ T'es trop fortⓠ\n@c0@"
  it: "@a%0%a001240@bUna volta qui hai sconfitto un mostro cattivo, non è vero?\nPapà, sei troppo forte!\n@c0@"
  ja: "@a@b%a001240「お父さんは　昔\n\tここで悪いヤツを　やっつけたんだね。\n\tかっこいいよね　お父さんって！\n@c0@"
14:
  de: "@a%0%a001250@bHat man das Skelett einfach hier zurückgelassen? Armes Ding!\n@c0@"
  en: "@a%0%a001250@bHas that skeleton been left here all on his own?\nPoor thing!\n@c0@"
  es: "@a%0%a001250@b¿Han dejado ahí solo a ese esqueleto?\nPobrecito.\n@c0@"
  fr: "@a%0%a001250@bOn a laissé ce squelette tout seul iciⓡ Le pauvreⓠ\n@c0@"
  it: "@a%0%a001250@bMa quello scheletro è stato lasciato qui da solo?\nPovero piccolo!\n@c0@"
  ja: "@a@b%a001250「あの魔物さん\n\t置いてきぼりなの？\n\tちょっと　かわいそう……。\n@c0@"
15:
  de: "@aSancho@bMan kann um diese Brett herumgehen, si? Es ist gar nisst schlecht zu wissen, was man machen muss, bevor das Spiel losgeht, no?\n@c0@"
  en: "@aSancho@bYou can walk all around thees board, sí?\r\nEes a good idea to esee what you must do\r\nbefore you estart the game, no?\n@c0@"
  es: "@aSancho@bSe puede caminar por todo el tablero, ¿sí?\nNomás que es una buena idea enterarse de lo que hay que hacer antes de empezar la partida.\n@c0@"
  fr: "@aSancho@bOn peut marcher autour du p-plateau, siⓡ\nC'est oune buena idée pour regarder ce qu'il\nfaut faire avant de c-commencer à jouer, noⓡ\n@c0@"
  it: "@aSancho@b¿Chico, por qué no fai un giro intornos alla Tavola?\nEn esto modo, antes que cominci la partita saprai già cosa fare.\n@c0@"
  ja: "@a@bサンチョ「ぐるっと歩いてゆけそうですよ。\n\tコースの下見がてら\n\t一周してみますか？\n@c0@"
16:
  de: "@a%0%a001240@bWow! Das alles hat er ganz allein gemacht?!\n@c0@"
  en: "@a%0%a001240@bWow! He made this place all on his own?\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¿Ha construido esto él solo?\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Il a construit ce jeu tout seulⓡ\n@c0@"
  it: "@a%0%a001240@bHa realizzato questa Tavola della Sorte tutto da solo?!\nComplimenti!\n@c0@"
  ja: "@a@b%a001240「うわ～　すごいね！\n\tあのおじさんが\n\tひとりで　つくったの！？\n@c0@"
17:
  de: "@a%0%a001250@bWäre es nicht schlauer gewesen, eine Treppe zum Rausklettern zu bauen?\n@c0@"
  en: "@a%0%a001250@bWouldn't it have been easier to build some\nstairs so he could get out, rather than\nbuilding a T 'n' T board?\n@c0@"
  es: "@a%0%a001250@b¿Y no habrías sido más fácil construir unas escaleras para salir de aquí que un tablero de T y T?\n@c0@"
  fr: "@a%0%a001250@bÇa n'aurait pas été plus simple de construire des escaliers pour sortir plutôt que ce jeuⓡ\n@c0@"
  it: "@a%0%a001250@bInvece di creare una Tavola della Sorte, non poteva costruire una scala per uscire da qui?!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tすごろく場つくるより階段つくるほうが\n\t絶対　カンタンよね？\n@c0@"
18:
  de: "@aSancho@bDiese Señor hat aus dem Nissts etwas erschaffen. Und es ist auch noch eine gute Qualität...\n@c0@"
  en: "@aSancho@bThees man, he make esometheeng from notheeng, eh?\nEes a good quality, thees.\n@c0@"
  es: "@aSancho@bEste hombre construyó algo partiendo de la nada.\nEso está padrísimo.\n@c0@"
  fr: "@aSancho@bCet hombre, il a fait quelque chose à p-partir de rien. C'est f-fort.\n@c0@"
  it: "@aSancho@bEsto hombre ha costruito una cosa muy buena partendo dal nullaa.\nEs una persona muy en gamba.\n@c0@"
  ja: "@a@bサンチョ「ころんでも　ただでは起きない\n\tとは　まさに　あの方のことですね。\n\t本当に　たくましい。\n@c0@"
19:
  de: "@aOtto@bManche Leute hätten wahrscheinlich einfach aufgegeben, wenn sie in solch ein Loch gefallen wären.\n@c0@"
  en: "@aTuppence@bSome people would have probably just given up the ghost if they fell down a hole like that.\n@c0@"
  es: "@aAlazar@bAlgunas personas se hubiesen dejado morir después de caer en un hoyo como ese.\n@c0@"
  fr: "@aInnocent@bCertaines personnes auraient sûrement baissé les bras si elles étaient tombées dans un trou comme celui-là.\n@c0@"
  it: "@aSimon@bDi solito, quando si precipita in una buca del genere, non si trova nulla, se non le ossa degli sfortunati che vi sono caduti prima...\n@c0@"
  ja: "@a@bピピン「落ちて　そのまま　しかばねに\n\tなる人だって　いたでしょうに……\n@c0@"
20:
  de: "@aOtto@bZum Glück hat es stattdessen jemanden wie ihn erwischt. Kommt, machen wir ein bisserl Gaudi!\n@c0@"
  en: "@aTuppence@bWe're lucky that it was someone like him instead. Now, let's have some fun!\n@c0@"
  es: "@aAlazar@bQué suerte que hayamos topado con una persona así. ¡Venga, vamos a divertirnos!\n@c0@"
  fr: "@aInnocent@bOn a de la chance que ce soit lui qui soit tombé ici. Maintenant, allons nous amuserⓠ\n@c0@"
  it: "@aSimon@bNoi, invece, abbiamo trovato questo simpatico signore e la sua Tavola della Sorte.\nMaestà, che ne dice di fare una partitina?\n@c0@"
  ja: "@a@bピピン「落ちた人が　あんな人で\n\tラッキーでしたよね。　さあ\n\tさっそく　遊ばせてもらいましょう！\n@c0@"
21:
  de: "@aBianca@bKomischer Kauz, was? Da baut er ein T&T-Brett, weil er in ein Loch gefallen ist!\n@c0@"
  en: "@aBianca@bHe certainly rolls with the times, eh? Fancy buildin' a T 'n' T board just because he got stuck in a hole!\n@c0@"
  es: "@aBianca@bEsto sí que es adaptarse a la situación, ¿eh? ¡Mira que construir un tablero de T y T solo por haberse caído en un hoyo!\n@c0@"
  fr: "@aBianca@bOn peut dire qu'il sait s'adapter à la situation.\nIl a construit un jeu de TNT juste parce qu'il est\nresté coincé dans un trouⓠ\n@c0@"
  it: "@aBianca@bMa ci pensi?! Ha costruito una Tavola della Sorte per non annoiarsi in fondo a questa voragine!\nQuesto tipo è un genio... oppure è matto da legare!\n@c0@"
  ja: "@a@bビアンカ「出られなくなっちゃったから\n\tすごろく場つくっちゃった　なんて\n\tのんきな人ねえ。\n@c0@"
22:
  de: "@aNera@bIch kann gut verstehen, dass er irgendetwas tun musste, um seine Langeweile zu bekämpfen.\n㈡\nIch habe mich all die Jahre als Statue auch fürchterlich gelangweilt...\n@c0@"
  en: "@aNera@bIt's understandable that he felt the need to do something to ease his boredom. I was so bored I could have cried during those years as a statue.\n@c0@"
  es: "@aNera@bEs comprensible que haya querido construir algo para aliviar il suo aburrimiento.\n㈡\nEn los anni que pasamos como estatua yo me aburría tanto que quería llorar.\n@c0@"
  fr: "@aNera@bJe comprends qu'il ait eu envie de faire quelque chose pour passer le temps.\n㈡\nMoi, je me suis ennuyée à mourir quand j'ai été pétrifiée pendant toutes ces années.\n@c0@"
  it: "@aNera@bQuel tipo ha realizzato una Tavola della Sorte per combattere la noia.\nE allora?! Cosa c'è di strano?!\n㈡\nQuand'ero una statua, contavo pecore immaginarie, pur di far passare il tempo! Sono arrivata ad avere un gregge da novantasei miliardi di ovini!\n@c0@"
  ja: "@a@bフローラ「きっと　たいくつで\n\t仕方がなかったんでしょうね。\n\t私も　石だったとき　そうでしたわ。\n@c0@"
23:
  de: "@aGriselda@bIch habe nichts gegen T&T, aber besonders gut bin ich darin nicht. Wenn meine Schönheit doch nur den Würfel beeindrucken würde...\n@c0@"
  en: "@aDebora@bI don't dislike T 'n' T, but I'm not very good at it.\r\nIf only beauty could influence the roll of a die!\n@c0@"
  es: "@aStefania@bNo es que no me guste il T y T, es que no se me da molto bene.\n㈡\n¡Ay, si la bellezza pudiese influir en la tirada del dado...!\n@c0@"
  fr: "@aPandora@bCe n'est pas que je n'aime pas le TNT, mais je ne\nsuis pas très bonne. Si seulement la beauté pouvait influencer le lancer de déⓠ\n@c0@"
  it: "@aViola@bNon sono molto fortunata quando gioco alle Tavole della Sorte... Quel dannato dado non vuole saperne di piegarsi alla mia volontà!\n㈡\nCome farà a resistere al mio fascino?!\n@c0@"
  ja: "@a@bデボラ「すごろくは　キライじゃないけど\n\t得意でもないの。　サイコロの目にも\n\t私の美しさが　通用すればいいのに。\n@c0@"
24:
  de: "@aGriselda@bEs tut gut, ab und zu frische Luft zu schnappen. Komm zu mir, wenn du mal eine Pause einlegen willst.\n@c0@"
  en: "@aDebora@bIt's good to come up for air sometimes. Come and hang around with me here for a while if you want to take a break from the game.\n@c0@"
  es: "@aStefania@bConviene salir a tomar el aire de vez en cuando. Si quieres hacer una pausa en el juego, ven aquí con me un attimo.\n@c0@"
  fr: "@aPandora@bC'est bien de sortir prendre l'air, de temps en temps. Viens ici avec moi quand tu as envie de faire une pause dans le jeu.\n@c0@"
  it: "@aViola@bOgni tanto fa bene prendere una boccata d'aria, caro. Vieni a farmi un po' di compagnia, se vuoi prenderti una pausa dal gioco...\n@c0@"
  ja: "@a@bデボラ「たまには　息ぬきも悪くないわね。\n\t私はここにいるから\n\t好きなだけ　遊んできてもいいわよ。\n@c0@"
25:
  de: "@aGriselda@bWarum hat er denn keine Treppe gebaut, wenn er solch ein begabter Handwerker ist? Männer und Logik...\n@c0@"
  en: "@aDebora@bIf he was going to build something, why didn't he build some stairs so he could get out? I don't see his logic at all!\n@c0@"
