86:
  de: "@a@b*: Es scheint wirklich wärmer zu werden. Hoffentlich kann ich auf meinen Feldern jetzt endlich das Getreide sprießen lassen.\n@c0@"
  en: "@a@b*: It certainly seems to be gettin' warmer. Hopefully now I'll finally be able to get my crops a-growin'.\n@c0@"
  es: "@a@b*: Parece que la temperatura es más agradable. Espero que por fin mis cultivos empiecen a crecer.\n@c0@"
  fr: "@a@b*ⓢ Le temps commence à se radoucir, on dirait.\nJe vais peut-être enfin pouvoir faire pousser mes cultures.\n@c0@"
  it: "@a@b*: Finalmente è arrivato il caldo!\nOra le mie piante cresceranno forti e rigogliose!\n@c0@"
  ja: "@a@b＊「オラも　昔は　サンタローズ名産の\n\t聖なる原石を　もとめて\n\t洞くつ掘ったもんよ。\n@c0@"
87:
  de: "@a@b*: Ich glaube, bald werde ich sogar Wasser aus dem Brunnen holen müssen.\n@c0@"
  en: "@a@b*: I'll be needin' some water from the well before long, I'd say.\n@c0@"
  es: "@a@b*: Creo que voy a necesitar un poco de agua del pozo dentro de poco.\n@c0@"
  fr: "@a@b*ⓢ D'ici peu, je vais avoir besoin de l'eau du puits.\n@c0@"
  it: "@a@b*: Tra non molto avrò bisogno di un bel po' d'acqua dal pozzo per annaffiarle a dovere.\n@c0@"
  ja: "@a@b＊「でっけえ　岩　掘り出しては\n\tぶちわって　原石さがしてなあ。\n\tなつかしい話だべ。\n@c0@"
88:
  de: "@a@b*: Miau!\n@c0@"
  en: "@a@b*: Meow!\n@c0@"
  es: "@a@b*: ¡Miau!\n@c0@"
  fr: "@a@b*ⓢ Miaouⓠ\n@c0@"
  it: "@a@b*: Miao!\n@c0@"
  ja: "@a@b＊「ずいぶん　あたたかくなって\n\tきたわい。　こりゃ～　今年も\n\t豊作だぞぉ。\n@c0@"
89:
  de: "@a@b*: Steinach ist bloß ein klitzekleines Dorf. Wenn dir der Sinn nach Schlössern und so steht, dann musst du nach Tifortu. Das liegt im Osten.\n@c0@"
  en: "@a@b*: Whealbrook here's only a tiny village. If it's castles and the like you're after, you'll have to go to Coburg. Off to the east, it is.\n@c0@"
  es: "@a@b*: Arroyofrío no es más que una aldea. Si lo que quieres son castillos y cosas así, tienes que ir a Trastámara. Está hacia el este.\n@c0@"
  fr: "@a@b*ⓢ Ruycelieu n'est qu'un tout petit village. Pour qui aime les châteaux et tout ça, il faut aller à Cobourg. C'est à l'est.\n@c0@"
  it: "@a@b*: Valcava è solo un piccolo villaggio.\nSe hai voglia di vedere qualche bel castello maestoso, ti consiglio di andare a Coburg, a est.\n@c0@"
  ja: "@a@b＊「あとで　井戸の水でも\n\tくんで来るかいな……。\n@c0@"
90:
  de: "@a@b*: Du bist doch der Sohn vom Ludwig, wenn ich mich nicht irre.\n@c0@"
  en: "@a@b*: You're Pankraz's son, if I'm not mistaken.\n@c0@"
  es: "@a@b*: Eres el hijo de Teudis, si no me equivoco.\n@c0@"
  fr: "@a@b*ⓢ Tu es le fils de Petros, si je ne me trompe pas.\n@c0@"
  it: "@a@b*: Se non sbaglio, tu sei il figlio di Russel.\n@c0@"
  ja: "@a@b＊「にゃ～ん！\n@c0@"
91:
  de: "@a@b*: Das ist vielleicht nur ein Gerücht, aber es heißt, dass er da draußen irgendwo einen mächtigen Feind habe.\n@c0@"
  en: "@a@b*: This might just be hearsay, but it sounds like he's got an almighty enemy out there somewhere.\n@c0@"
  es: "@a@b*: A lo mejor no es más que un rumor, pero parece que tiene un enemigo muy poderoso en alguna parte.\n@c0@"
  fr: "@a@b*ⓢ Ce ne sont peut-être que des racontars, mais il semblerait qu'il ait un ennemi très puissant quelque part.\n@c0@"
  it: "@a@b*: Qualcuno mi ha confidato che tuo padre ha dei nemici forti e pericolosi, sai?\nMa forse sono solo dicerie...\n@c0@"
  ja: "@a@b＊「ここは　サンタローズの村。\n\t東に行くと　ラインハットの\n\tお城が　ありますわ。\n@c0@"
92:
  de: "@a@b*: Wenn du doch nur ein wenig größer wärst, könntest du ihm helfen.\n@c0@"
  en: "@a@b*: If only you were more grown up, you'd be able to help him out.\n@c0@"
  es: "@a@b*: Si fueses mayor, quizá podrías ayudarle.\n@c0@"
  fr: "@a@b*ⓢ Si tu avais été un peu plus âgé, tu aurais sûrement pu l'aider.\n@c0@"
  it: "@a@b*: Tuttavia, se queste voci fossero fondate, sarebbe tuo dovere aiutarlo! Però dovrai crescere ancora un po', prima di potergli dare una mano...\n@c0@"
  ja: "@a@b＊「パパスどのの\n\tむすこさんじゃな。\n@c0@"
93:
  de: "@a@b*: Du hast doch wohl nicht vor, schon wieder diese Höhle zu erkunden? Dein Vater hat nach dir gesucht, weißt du.\n@c0@"
  en: "@a@b*: You're not thinkin' of explorin' that cave again, are you? Your father was lookin' for you, you know.\n@c0@"
  es: "@a@b*: No estarás pensando en explorar otra vez esa cueva, ¿eh? Tu padre te estaba buscando, ¿sabes?\n@c0@"
  fr: "@a@b*ⓢ Tu n'envisages pas d'explorer de nouveau cette caverne, j'espèreⓡ Ton père te cherche, tu sais.\n@c0@"
  it: "@a@b*: Non vorrai mica esplorare la caverna di nuovo, vero?\nTuo padre ti sta cercando ovunque!\n@c0@"
  ja: "@a@b＊「これは　ウワサじゃが\n\tパパスどのには\n\tとんでもない敵がいるそうじゃ。\n@c0@"
94:
  de: "@a@b*: Du solltest die Höhle vergessen und erst mal rausfinden, was dein Vater von dir will.\n@c0@"
  en: "@a@b*: You should forget about the cave and go and see what it is he wants.\n@c0@"
  es: "@a@b*: Deberías olvidarte de la cueva e ir a ver lo que quiere.\n@c0@"
  fr: "@a@b*ⓢ Oublie cet endroit et va plutôt voir ce qu'il veut.\n@c0@"
  it: "@a@b*: Scordati della grotta, per il momento, e vai a sentire cos'ha da dirti.\n@c0@"
  ja: "@a@b＊「坊やが　もっと大きければ\n\tきっと　父の助けを\n\tできただろうにのう……。\n@c0@"
95:
  de: "@a@b*: Hm? Du musst da drinnen nach irgendwas suchen? Tja, und was machst du, wenn er ohne dich loszieht?\n@c0@"
  en: "@a@b*: Hm? You need to look for somethin' in there, you say? Well, what are you goin' to do if he ends up leavin' without you?\n@c0@"
  es: "@a@b*: ¿Eh? ¿Que tienes que buscar algo ahí dentro, dices? ¿Y qué harás si tu padre se marcha sin ti?\n@c0@"
  fr: "@a@b*ⓢ Heinⓡ Tu dois aller chercher quelque chose\ndans la caverne, dis-tuⓡ Mais qu'est-ce que tu feras si ton père part sans toiⓡ\n@c0@"
  it: "@a@b*: Che cosa? Devi cercare qualcosa lì dentro? Questo non è il momento adatto, piccolo. Cosa faresti se tuo padre andasse via senza di te?\n@c0@"
  ja: "@a@b＊「やあ！　また　洞くつ探検かい？\n\tお父上が　坊やを\n\tさがしていたぞ。\n@c0@"
96:
  de: "@a@b*: Um das, was sich in dieser Höhle verbirgt, kannst du dir später immer noch Sorgen machen. Jetzt lauf erst mal zurück zu deinem Papa. Na los!\n@c0@"
  en: "@a@b*: You worry about what's in the cave after you've been and seen your dad. Go on now, run along!\n@c0@"
  es: "@a@b*: Ya vendrás a visitar la cueva después de hablar con Teudis. ¡Andando!\n@c0@"
  fr: "@a@b*ⓢ Tu t'occuperas de ce qu'il y a dans la caverne une fois que tu seras allé voir ton père.\nAlors vas-y viteⓠ\n@c0@"
  it: "@a@b*: Vai dal tuo papà, e in fretta!\nAlla caverna penserai dopo...\n@c0@"
  ja: "@a@b＊「洞くつになんか　行かずに\n\t父上のところに　行っておやり。\n@c0@"
97:
  de: "@a@b*: Ah, hallo, %a000090. Ich habe gerade dafür gebetet, dass dein Vater eine sichere Reise haben möge.\n@c0@"
  en: "@a@b*: Ah, hello there, %a000090. I was just prayin' for your father's safety on his journey.\n@c0@"
  es: "@a@b*: Vaya, hola, %a000090. Estaba rezando para que no hubiese percances en el viaje de tu padre.\n@c0@"
  fr: "@a@b*ⓢ Ah, bonjour %a000090. J'étais justement en train de prier pour que le voyage de ton père se passe bien.\n@c0@"
  it: "@a@b*: Ciao, %a000090. Stavo pregando la dea affinché non faccia mai mancare la sua protezione a quel giramondo di tuo padre.\n@c0@"
  ja: "@a@b＊「え？　洞くつで　さがし物があるって？\n\tそんなこと言って　お父上に\n\tおいて行かれても　しらないぞ。\n@c0@"
98:
  de: "@a@b*: Der König von Tifortu ist ja schon ein bisschen dreist. Deinen Vater einfach so zu sich zu bestellen, ohne auch nur zu fragen.\n@c0@"
  en: "@a@b*: The King of Coburg's got a bit of a cheek, summonin' your father without so much as a by your leave.\n@c0@"
  es: "@a@b*: Vaya frescura la del rey de Trastámara, convocando a tu padre sin ni siquiera pedirle permiso.\n@c0@"
  fr: "@a@b*ⓢ Le roi de Cobourg est un peu sans-gêne de convoquer ton père comme ça, au pied levé.\n@c0@"
  it: "@a@b*: Il Re di Coburg ha chiesto a Russel di presentarsi al Castello di Coburg con la massima urgenza...\n@c0@"
  ja: "@a@b＊「さがし物は\n\t用事がすんだ後にして　今は\n\t父上のところに　行っておやり。\n@c0@"
99:
  de: "@a@b*: Wenn er sich mit ihm treffen will, dann soll er doch selber durch Wälder und Wiesen ziehen!\n@c0@"
  en: "@a@b*: If he's the one who wants to meet, then he's the one who should go trekkin' across country to do it!\n@c0@"
  es: "@a@b*: ¡Si es él el que está interesado en reunirse con tu padre, debería ser él quien cruzase el país!\n@c0@"
  fr: "@a@b*ⓢ Puisque c'est lui qui veut le voir, il n'a qu'à faire lui-même le déplacementⓠ\n@c0@"
  it: "@a@b*: Se quel pigraccio d'un sovrano aveva tanta fretta di vedere tuo padre, poteva anche prendersi la briga di venire qui, dico bene?\n@c0@"
  ja: "@a@b＊「おお　%a000090。　ちょうど　今\n\tお父上の　旅の安全を\n\tお祈りしていたところじゃよ。\n@c0@"
100:
  de: "@aLudwig@bDa bist du ja, %a000090.\nWo warst du? Ich hab überall nach dir gesucht.\n@c0@"
  en: "@aPankraz@bThere you are, %a000090.\nWhere have you been? I've been looking all over for you.\n@c0@"
  es: "@aTeudis@b¡Ah!, %a000090, ahí estás.\n¿Dónde te habías metido? Te he estado buscando por todos lados.\n@c0@"
  fr: "@aPetros@bTe voilà, %a000090.\nOù étais-tu passéⓡ Je t'ai cherché partout.\n@c0@"
  it: "@aRussel@bOh, eccoti qui, %a000090.\nMa dov'eri finito?\nTi ho cercato ovunque...\n@c0@"
  ja: "@a@b＊「パパスさんを　呼びつけるなんて\n\tラインハットの国王も\n\tごうまんな人よねっ。\n@c0@"
101:
  de: "@aLudwig@bAber egal. Ist jetzt nicht so wichtig.\nIch habe nur ein Gebet gesprochen, ehe wir uns wieder auf den Weg machen.\n@c0@"
  en: "@aPankraz@bNever mind. It doesn't matter now.\nI was just saying a prayer before setting off again.\n@c0@"
  es: "@aTeudis@bEs igual. Ahora ya no importa.\r\nEstaba rezando una oración antes de ponerme en marcha.\n@c0@"
  fr: "@aPetros@bPeu importe. Tu es là, c'est l'essentiel.\r\nJe faisais juste une petite prière avant de partir.\n@c0@"
  it: "@aRussel@bAh, non importa.\nIo stavo recitando una preghiera alla dea prima di mettermi in viaggio.\n@c0@"
  ja: "@a@b＊「用が　あるなら\n\t自分から　来ればいいのに……。\n@c0@"
102:
  de: "@aLudwig@bDas solltest du auch tun. Ich warte dann am Dorfeingang auf dich.\n@c0@"
  en: "@aPankraz@bYou should do the same. I'll be waiting for you at the town entrance.\n@c0@"
  es: "@aTeudis@bDeberías hacer lo mismo. Te espero en la entrada del pueblo.\n@c0@"
  fr: "@aPetros@bTu devrais en faire autant. Je t'attendrai à l'entrée du village.\n@c0@"
  it: "@aRussel@bSe ne hai voglia, puoi farlo anche tu.\nTi aspetterò all'ingresso del villaggio.\n@c0@"
  ja: "@a@bパパス「おお　%a000090か！\n\t今まで　どこに　いたんだ！？\n\tずいぶん　さがしたぞ。\n@c0@"
103:
  de: "@a@b*: Ich hab gehört, dass Ludwig rüber zum Schloss Tifortu gerufen wurde.\n@c0@"
  en: "@a@b*: I hear Pankraz has bin summoned over to Coburg Castle.\n@c0@"
  es: "@a@b*: He oído que han llamado a Teudis para que vaya al Castillo de Trastámara.\n@c0@"
  fr: "@a@b*ⓢ Il paraît que Petros a été convoqué au château de Cobourg.\n@c0@"
  it: "@a@b*: Ho sentito dire che tuo padre è stato convocato al Castello di Coburg.\n@c0@"
  ja: "@a@bパパス「まあ　いい。\n\t父さんは　旅立つ前に　神に\n\tお祈りをしていたところだ。\n@c0@"
104:
  de: "@a@b*: Er ist hier in der Gegend ziemlich bekannt dafür, dass er so stark ist, also wollen sie vielleicht deshalb, dass er kommt.\n@c0@"
  en: "@a@b*: He's more than a little bit famous around these parts for how strong he is, so I s'pose that's why they want him.\n@c0@"
  es: "@a@b*: Por aquí es famoso por su fuerza, supongo que por eso lo han hecho llamar.\n@c0@"
  fr: "@a@b*ⓢ Il est sacrément connu pour sa force, dans le coin. Je suppose que c'est pour ça qu'ils veulent le voir.\n@c0@"
  it: "@a@b*: Chissà cosa vorranno da lui...\n@c0@"
  ja: "@a@bパパス「お前も　祈っておくと\n\tいいだろう。　父さんは\n\t村の入口で　待っているからな。\n@c0@"
105:
  de: "@a@b*: Oh, nicht schon wieder! Irgendeiner hat was Merkwürdiges in mein Gästebuch geschrieben.\n@c0@"
  en: "@a@b*: Oh, not again! Someone's gone and written something strange here in my guest book.\n@c0@"
  es: "@a@b*: ¡Otra vez no! Alguien ha escrito algo extraño en el libro de huéspedes.\n@c0@"
  fr: "@a@b*ⓢ Oh, nonⓠ Ça recommenceⓠ Quelqu'un a encore écrit des choses bizarres dans mon livre d'or.\n@c0@"
  it: "@a@b*: Ci risiamo!\nQualcuno ha scritto un altro messaggio sul mio quaderno!\n@c0@"
  ja: "@a@b＊「パパスさんが\n\tラインハットの城に\n\t呼ばれたそうだね。\n@c0@"
106:
  de: "@a@b*: Also, was steht denn da...\n@c0@"
  en: "@a@b*: Now what's this all about...\n@c0@"
  es: "@a@b*: ¿Qué significa todo esto?\n@c0@"
  fr: "@a@b*ⓢ Tiens, écoute ça...\n@c0@"
  it: "@a@b*: Leggiamo un po' cosa dice...\n@c0@"
  ja: "@a@b＊「パパスさんの　強さは\n\tかなり有名だから　それで\n\t呼ばれたのかねえ。\n@c0@"
107:
  de: "@a@b*: ⓞVielen herzlichen Dank, %a000090.\nIch kann's kaum erwarten, dich eines Tages wiederzusehen! Liebste Grüße, Zuckerchen.ⓟ\n@c0@"
  en: "@a@b*: ⓗThank you so much, %a000090.\nCan't wait to meet again one day!\nSweet wishes, Honeyⓘ\n@c0@"
  es: "@a@b*: ⓕMuchísimas gracias, %a000090.\n¡Estoy deseando volverte a ver!\nMis mejores deseos, Dulceⓖ.\n@c0@"
  fr: "@a@b*ⓢ ⓥMerci infiniment, %a000090.\nJ'ai hâte qu'on se revoie un jourⓠ\nTendres bises, Candyⓦ\n@c0@"
  it: "@a@b*: ⓕGrazie di cuore, %a000090. Spero di rivederti prestissimo. Un saluto dalla tua amica Amandina.ⓖ\n@c0@"
  ja: "@a@b＊「ありゃ？　宿帳に　また\n\tいたずら書きが　あるぞ。\n@c0@"
108:
  de: "@a@b*: Was für ein Schwachsinn!\n@c0@"
  en: "@a@b*: What a load of nonsense!\n@c0@"
  es: "@a@b*: ¡Qué bobada es esta!\n@c0@"
  fr: "@a@b*ⓢ C'est vraiment n'importe quoiⓠ\n@c0@"
  it: "@a@b*: Che vorrà dire?\nBah!\nIo non ci capisco niente!\n@c0@"
  ja: "@a@b＊「なになに……。\n@c0@"
109:
  de: "@a@b*: Du bist also Ludwigs Sohn, Junge?\n@c0@"
  en: "@a@b*: So you're Pankraz's son are you, boy?\n@c0@"
  es: "@a@b*: Así que tú eres el hijo de Teudis, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Alors comme ça, tu es le fils de Petros, mon garçonⓡ\n@c0@"
  it: "@a@b*: Tu sei il figlio di Russel, se non sbaglio...\n@c0@"
  ja: "@a@b＊「%a000090　ありがとう\n\tまた　いつか会いたいわね。\n\t　　　　　　　　　　　　ベラより。\n@c0@"
110:
  de: "@a@b*: Wo ich so drüber nachdenke, fällt mir ein, dass es irgendwo mal einen König Ludwig gegeben hat.\n@c0@"
  en: "@a@b*: Come to think of it, I seem to remember there bein' a King Pankraz of somewhere or other once.\n@c0@"
  es: "@a@b*: Ahora que lo pienso, me parece recordar haber oído una vez no sé qué sobre un rey que se llamaba Teudis.\n@c0@"
  fr: "@a@b*ⓢ Tiens, d'ailleurs maintenant que j'y pense... je crois me souvenir qu'il existait un roi Petros quelque part, autrefois.\n@c0@"
  it: "@a@b*: Sai che una volta c'era un sovrano di nome Russel?\n@c0@"
  ja: "@a@b＊「なんだ　こりゃ……？\n@c0@"
111:
  de: "@a@b*: Aber das hat natürlich nix mit deinem Vater zu tun!\n@c0@"
  en: "@a@b*: Not that that has anythin' to do with your dad, of course!\n@c0@"
  es: "@a@b*: ¡Claro que no tendrá nada que ver con tu padre!\n@c0@"
  fr: "@a@b*ⓢ Mais rien à voir avec ton père, évidemmentⓠ\n@c0@"
  it: "@a@b*: Si tratta certo di un caso di omonimia.\nNon credo proprio che tuo padre sia un re!\n@c0@"
  ja: "@a@b＊「へえ　坊やの父さんは\n\tパパスさんと　いうのか……。\n@c0@"
112:
  de: "@a@b*: Mein Vater hat das Glas gefunden, das ihm abhanden gekommen war. Doch das, wonach Ludwig sucht, ist wohl nicht so leicht zu finden.\n@c0@"
  en: "@a@b*: My old man found the glass he was after, but it doesn't look like the thing Pankraz is lookin' for is so easily found.\n@c0@"
  es: "@a@b*: Mi viejo encontró el cristal que buscaba, pero no parece que Teudis esté buscando algo tan fácil de encontrar.\n@c0@"
  fr: "@a@b*ⓢ Mon vieux père a trouvé le verre qu'il cherchait, mais on dirait que ce que cherche Petros est moins facile à trouver.\n@c0@"
  it: "@a@b*: Mio padre ha trovato il bicchiere che stava cercando. Volesse il cielo che anche Russel fosse tanto fortunato nella sua ricerca...\n@c0@"
  ja: "@a@b＊「そういえば昔　どこかの国に\n\tパパスという国王がいたなあ。\n@c0@"
113:
  de: "@a@b*: Ich hab gehört, dass es etwas mit einem legendären Helden zu tun hat oder so.\n@c0@"
  en: "@a@b*: I heard it was somethin' to do with a legendary hero or the like.\n@c0@"
  es: "@a@b*: Dicen que tiene algo que ver con no sé qué héroe legendario o algo así.\n@c0@"
  fr: "@a@b*ⓢ J'ai entendu dire que ça avait à voir avec un héros légendaire, ou quelque chose comme ça.\n@c0@"
  it: "@a@b*: Se non sbaglio, sta inseguendo qualcosa che ha a che fare con un eroe della leggenda, o roba del genere.\n@c0@"
  ja: "@a@b＊「まあ　坊やの父さんとは\n\t別人だろうけどね。\n@c0@"
114:
  de: "@a@b*: Tut mir leid! Was red' ich denn, wieso langweile ich ein Kind mit so 'nem Geschwätz für Erwachsene!\n@c0@"
  en: "@a@b*: Sorry! Listen to me, borin' a kid with grown-up stuff like that!\n@c0@"
  es: "@a@b*: ¡Lo siento! ¡No sé qué hago agobiándote con cosas de mayores!\n@c0@"
  fr: "@a@b*ⓢ Excuse-moiⓠ Voilà que j'ennuie un pauvre gosse avec des histoires de grandes personnesⓠ\n@c0@"
  it: "@a@b*: Oh, scusami.\nNon volevo annoiarti con questi discorsi da adulti.\n@c0@"
  ja: "@a@b＊「おじさんが　探してたグラスは\n\t見つかったけど　パパスさんの\n\t探しものは　大変だねえ。\n@c0@"
115:
  de: "@a@b*: Ach du meine Güte! Schon wieder ein leerer Topf!\n@c0@"
  en: "@a@b*: Dear, oh dear, oh dear! Not another empty pot!\n@c0@"
  es: "@a@b*: ¡Oh, caramba, otra vez no! ¡Me han vuelto a vaciar el cazo!\n@c0@"
  fr: "@a@b*ⓢ Mon dieu, mon dieuⓠ Encore une marmite videⓠ\n@c0@"
  it: "@a@b*: Ma com'è possibile?!\nUn altro tegame s'è svuotato come per magia!\n@c0@"
  ja: "@a@b＊「なんでも\n\t伝説の勇者ってヤツを\n\t探してるとか……。\n@c0@"
116:
  de: "@a@b*: Das alles ist wirklich sehr merkwürdig!\n@c0@"
  en: "@a@b*: This is all very odd!\n@c0@"
  es: "@a@b*: ¡Todo esto es muy raro!\n@c0@"
  fr: "@a@b*ⓢ Tout cela est vraiment très étrangeⓠ\n@c0@"
  it: "@a@b*: Questa proprio non me la spiego...\n@c0@"
  ja: "@a@b＊「おっと　坊やには\n\tむずかしい話だったかな。\n@c0@"
117:
  de: "@a@b*: Ich hab beschlossen, mal so richtig zu schlemmen. Die alte Zicke hält mir das eh immer vor, also kann ich mir die Schelte auch mal redlich verdienen!\n@c0@"
  en: "@a@b*: I decided to have a feast. That's what the old dragon thought I'd done anyway, so I may as well get some pleasure out of the ear-bashin'!\n@c0@"
  es: "@a@b*: He decidido darme un festín. De todos modos, es lo que esa vieja pelleja piensa que hago. Así que, ya que me llevo la bronca, pues que sea por algo.\n@c0@"
  fr: "@a@b*ⓢ J'ai décidé de m'offrir un festin. C'est ce dont elle était persuadée, de toute façon. Quitte à me faire chauffer les oreilles, autant me faire plaisirⓠ\n@c0@"
  it: "@a@b*: Quella serpe di mia moglie mi avrebbe incolpato lo stesso, così stavolta la pentola l'ho svuotata sul serio! Ben le sta!\n@c0@"
  ja: "@a@b＊「あらあら？　ひとつだけだと\n\t思ったら　こっちの　おなべも\n\tからっぽだわ。\n@c0@"
118:
  de: "@a@b*: Ach, wär ich doch bloß so begabt wie mein Vater, was die Herstellung von Arzneien angeht! Tja, eines Tages...\n@c0@"
  en: "@a@b*: If only I was as good as my old man at makin' medicine. One of these days...\n@c0@"
  es: "@a@b*: Si fuese tan hábil como mi padre elaborando medicinas, un día de estos...\n@c0@"
  fr: "@a@b*ⓢ Si seulement j'étais aussi doué que mon vieux père pour fabriquer des remèdes. Un de ces jours...\n@c0@"
  it: "@a@b*: Vorrei saper preparare i medicinali come fa mio padre. Chissà, forse un giorno diventerò in gamba quanto lui...\n@c0@"
  ja: "@a@b＊「いったい\n\tどうしたことかしら……。\n@c0@"
119:
  de: "@aHerr Unterlieger@bAlso hat man Ludwig nach Schloss Tifortu gerufen, ja?\n@c0@"
  en: "@aMr Rockefeller@bSo Pankraz has been called to Coburg Castle, eh?\n@c0@"
  es: "@aSr. Roca@bAsí que han hecho llamar a Teudis desde el Castillo de Trastámara, ¿eh?\n@c0@"
  fr: "@aGauthier Krazé@bAlors comme ça, Petros a été appelé au château de Cobourgⓡ\n@c0@"
  it: "@aJohn Travolto@bE così Russel è stato convocato al Castello di Coburg, eh?\n@c0@"
  ja: "@a@b＊「ヨメのやつが\n\tわしを　うたがうから\n\t本当に　食べてやったわい！\n@c0@"
120:
  de: "@aHerr Unterlieger@bDort herrscht gerade ein ziemliches Durcheinander, was die Thronnachfolge angeht. Ihr solltet besser vorsichtig sein.\n@c0@"
  en: "@aMr Rockefeller@bThere's all sorts of kerfuffle there at the moment about who's goin' to succeed to the throne. You want to be careful.\n@c0@"
  es: "@aSr. Roca@bPues tienen montado un follón monumental con lo de la sucesión al trono. Será mejor que te andes con ojo.\n@c0@"
  fr: "@aGauthier Krazé@bIl y a pas mal d'agitation là-bas, en ce moment, à cause des problèmes de succession au trône.\r\nSoyez prudents.\n@c0@"
  it: "@aJohn Travolto@bSo che stanno discutendo della successione al trono, e l'atmosfera a corte è un po' tesa...\n@c0@"
  ja: "@a@b＊「ああ　オレも早く\n\t親方のような　一人前のくすり師に\n\tなりてえなあ……。\n@c0@"
121:
  de: "@aLudwig@bFertig, %a000090?\nGut, dann lass uns aufbrechen. Man hat mich nach Schloss Tifortu gerufen.\n@c0@"
  en: "@aPankraz@bAll done, %a000090?\nGood, then we'll get going. I've been summoned to Coburg Castle.\n@c0@"
  es: "@aTeudis@b¿Has acabado, %a000090?\nMuy bien, en marcha pues. Me han hecho llamar desde el Castillo de Trastámara.\n@c0@"
  fr: "@aPetros@bÇa y est, %a000090ⓡ\nBien, alors c'est parti. J'ai été convoqué au château de Cobourg.\n@c0@"
  it: "@aRussel@bSei pronto, %a000090?\nAllora si parte per il Castello di Coburg!\nMi hanno convocato a corte, sai?\n@c0@"
  ja: "@a@b＊「そうかい　パパスのだんなが\n\tラインハットの城にねえ……。\n@c0@"
122:
  de: "@aLudwig@bKeine Angst, es ist nicht weit. Überhaupt nicht mit der langen Seereise zu vergleichen, auf die ich dich mitgenommen habe.\n@c0@"
  en: "@aPankraz@bDon't worry, it's not too far. Nothing like the long sea voyage I took you on before.\n@c0@"
  es: "@aTeudis@bNo te preocupes, no está lejos de aquí. No es como el viaje por mar al que me acompañaste.\n@c0@"
  fr: "@aPetros@bNe t'inquiète pas, ça n'est pas très loin.\r\nRien à voir avec le long voyage en mer que je t'ai fait faire il y a peu.\n@c0@"
  it: "@aRussel@bNon ci metteremo molto ad arrivare a destinazione. Sarà un viaggio più breve di quello che abbiamo fatto per mare qualche tempo fa.\n@c0@"
  ja: "@a@b＊「あそこの城は　王位継承問題で\n\tけっこう　ゆれてるらしい。\n\t気をつけるこったな。\n@c0@"
123:
  de: "@aLudwig@bUnd wenn wir diesen kurzen Ausflug hinter uns haben, werden wir uns für eine Weile hier niederlassen.\n@c0@"
  en: "@aPankraz@bAnd once this little trip's over with, I think we'll settle down for a while.\n@c0@"
  es: "@aTeudis@bY cuando acabemos esta pequeña excursión, sentaremos la cabeza un tiempo.\n@c0@"
  fr: "@aPetros@bEt une fois ce petit voyage terminé, je crois que nous nous poserons pendant un moment.\n@c0@"
  it: "@aRussel@bE quando saremo tornati a casa, ti prometto che non ci muoveremo per un bel po' di tempo.\n@c0@"
  ja: "@a@bパパス「おお来たか　%a000090。\n\t今度の行き先は\n\tラインハットのお城だ。\n@c0@"
124:
  de: "@aLudwig@bDu musstest meinetwegen schon genug durchmachen. Es wird Zeit, dass du dich ein wenig amüsierst, meinst du nicht auch?\n@c0@"
  en: "@aPankraz@bI've put you through enough. It's time you had a bit of fun, don't you think?\n@c0@"
  es: "@aTeudis@bTe he hecho pasar por demasiado. Ya es hora de que puedas disfrutar un poco de la vida, ¿no crees?\n@c0@"
  fr: "@aPetros@bJe t'en ai assez fait endurer. Il est temps que tu t'amuses un peu, tu ne crois pasⓡ\n@c0@"
  it: "@aRussel@bTi ho fatto girare come una trottola ultimamente, e credo che ora tu abbia diritto a riposarti e a divertirti, come tutti gli altri bambini.\n@c0@"
  ja: "@a@bパパス「前の船旅とちがって\n\tそんなに長い旅には\n\tならないだろう。\n@c0@"
125:
  de: "@aLudwig@bAlso dann! Ziehen wir los!\n@c0@"
  en: "@aPankraz@bRight, then! Let's be off!\n@c0@"
  es: "@aTeudis@b¡Muy bien! ¡En marcha, pues!\n@c0@"
  fr: "@aPetros@bParfait. Alors on y vaⓠ\n@c0@"
  it: "@aRussel@bE ora basta parlare.\nForza! Si parte!\n@c0@"
  ja: "@a@bパパス「この旅が終ったら\n\t父さんは　少し\n\t落ち着くつもりだ。\n@c0@"
126:
  de: "@a@b*: Gute Reise, Ludwig!\n@c0@"
  en: "@a@b*: Have a good trip, Pankraz!\n@c0@"
  es: "@a@b*: ¡Buen viaje, Teudis!\n@c0@"
  fr: "@a@b*ⓢ Bon voyage, Petrosⓠ\n@c0@"
  it: "@a@b*: Fai buon viaggio, Russel!\n@c0@"
  ja: "@a@bパパス「お前には　いろいろ\n\t淋しい思いをさせたが\n\tこれからは遊んであげるぞ。\n@c0@"
127:
  de: "@aLudwig@bIch bin Ludwig Humburg, aus Steinach.\n@c0@"
  en: "@aPankraz@bI am Pankraz Gotha of Whealbrook.\n@c0@"
  es: "@aTeudis@bSoy Teudis Pankraz, de Arroyofrío.\n@c0@"
  fr: "@aPetros@bJe suis Petros Gotha, de Ruycelieu.\n@c0@"
  it: "@aRussel@bSono Russel Denim, da Valcava.\n@c0@"
  ja: "@a@bパパス「さて　行くとするかっ！\n@c0@"
128:
  de: "@aLudwig@bKönig James hat mich zu sich gerufen, daher bin ich auf dem Weg nach Schloss Tifortu. Bitte lasst mich passieren!\n@c0@"
  en: "@aPankraz@bI've been summoned by King James, and am on my way to Coburg Castle at his request. Please allow me to pass!\n@c0@"
  es: "@aTeudis@bEl rey Pipe me ha hecho llamar, y a petición suya voy camino al castillo de Trastámara. ¡Franquéeme el paso!\n@c0@"
  fr: "@aPetros@bJ'ai été convoqué par le roi Jean et me rends au château de Cobourg à sa requête. Je vous demande l'autorisation de passerⓠ\n@c0@"
  it: "@aRussel@bRe Michel mi ha convocato al Castello di Coburg.\nChiedo il permesso di passare.\n@c0@"
  ja: "@a@b＊「いってらっしゃい\n\tパパスさん！\n@c0@"
129:
  de: "@aGregor der Grenzer@bAh! Also Ihr seid Ludwig?\nIch freue mich, zu machen Eure Bekanntschaft.\n@c0@"
  en: "@aCheckpoint Charlie@bAh! So you're Pankraz, are you?\n@c0@"
  es: "@aAndrea Duana@b¡Ah! Así que eres Teudis, ¿eh?\n@c0@"
  fr: "@aGarde-frontière@bAhⓠ C'est donc vous, Petrosⓡ\n@c0@"
  it: "@aGuardia di Coburg@bAh! Tu sei Russel?\n@c0@"
  ja: "@a@bパパス「私は　サンタローズに住む\n\tパパスという者だ。\n@c0@"
130:
  de: "@aGregor der Grenzer@bMir wurde gesagt, dass Ihr kommen würdet. Bitte geht durch!\n@c0@"
  en: "@aCheckpoint Charlie@bI had word that you'd be coming. Please pass on through!\n@c0@"
  es: "@aAndrea Duana@bMe avisaron de que venías. ¡Por favor, adelante!\n@c0@"
  fr: "@aGarde-frontière@bOn m'a prévenu de votre arrivée.\nPassez, je vous en prieⓠ\n@c0@"
  it: "@aGuardia di Coburg@bSono stato informato del tuo arrivo.\nPrego, passa pure.\n@c0@"
  ja: "@a@bパパス「ラインハット国王に呼ばれ\n\tお城に　うかがう途中である。\n\tどうか　通されたい！\n@c0@"
131:
  de: "@aLudwig@bWir werden bald im Königreich von Tifortu sein, %a000090.\n@c0@"
  en: "@aPankraz@bWe'll be in the Kingdom of Coburg before long, %a000090.\n@c0@"
  es: "@aTeudis@bPronto estaremos en el Reino de Trastámara, %a000090.\n@c0@"
  fr: "@aPetros@bNous serons bientôt au royaume de Cobourg, %a000090.\n@c0@"
  it: "@aRussel@bTra poco arriveremo a Coburg, %a000090.\n@c0@"
  ja: "@a@b＊「おお！　あなたが\n\tパパスどのですか！？\n@c0@"
132:
  de: "@aLudwig@bEs heißt, von da droben hat man eine tolle Aussicht auf den Fluss.\n@c0@"
  en: "@aPankraz@bPeople say the view of the river from up top is quite something.\n@c0@"
  es: "@aTeudis@bSe dice que las vistas del río desde lo alto son impresionantes.\n@c0@"
  fr: "@aPetros@bLes gens disent qu'on a une vue magnifique sur la rivière, depuis le sommet.\n@c0@"
  it: "@aRussel@bDa lì si gode una spettacolare vista del fiume.\n@c0@"
  ja: "@a@b＊「連絡は　受けています。\n\tどうぞ　お通りください！\n@c0@"
133:
  de: "@aLudwig@bKomm schon! Wir haben zwar nicht viel Zeit, aber das sollten wir uns nicht entgehen lassen.\n@c0@"
  en: "@aPankraz@bCome on! We don't have much time, but it'll be fun to go and have a look.\n@c0@"
  es: "@aTeudis@b¡Vamos! No sobra tiempo, pero será divertido echar un vistazo.\n@c0@"
  fr: "@aPetros@bViensⓠ Nous n'avons pas beaucoup de temps, mais ce sera amusant d'aller jeter un œil.\n@c0@"
  it: "@aRussel@bLa nostra non è una gita di piacere, ma spero che avremo qualche minuto di tempo per fare i turisti!\n@c0@"
  ja: "@a@bパパス「%a000090。　ここから先は\n\tラインハットの国だ。\n@c0@"
134:
  de: "@aLudwig@bDa wären wir. Mal sehen...\n@c0@"
  en: "@aPankraz@bHere we are. Let's see...\n@c0@"
  es: "@aTeudis@bAquí estamos. A ver...\n@c0@"
  fr: "@aPetros@bNous y sommes. Voyons un peu...\n@c0@"
  it: "@aRussel@bEccoci qua.\nAllora, vediamo un po'...\n@c0@"
  ja: "@a@bパパス「この上からの　川のながめは\n\tなかなかのものらしいぞ。\n@c0@"
135:
  de: "@aLudwig@bÄh... Dürfte ich mich erkundigen, ob mit Euch alles in Ordnung ist, alter Mann?\n@c0@"
  en: "@aPankraz@bErm... I hope you don't mind my asking, but are you alright there, old man?\n@c0@"
  es: "@aTeudis@bEjem... Disculpe, ¿se encuentra bien, anciano?\n@c0@"
  fr: "@aPetros@bHum... Pardonnez-moi cette question, vieil homme, mais... tout va bienⓡ\n@c0@"
  it: "@aRussel@bEhm...\nAmico, ti senti bene?\n@c0@"
  ja: "@a@bパパス「よし！　あまり　時間はないが\n\tお前にも　見せてやろう。\n@c0@"
136:
  de: "@a@b*: Oh ja. Kümmert Euch nicht um mich. Ich sehe mir nur an, wie der Fluss vorbeifließt, und überlege mir, was die Zukunft wohl für unser Reich bereithält.\n@c0@"
  en: "@a@b*: Oh yes. Don't mind me. I'm just watching the river go by and thinking about what the future holds for our kingdom.\n@c0@"
  es: "@a@b*: ¡Oh!, sí. No se preocupe. Sólo contemplaba el río y pensaba en lo que el futuro deparará a nuestro reino.\n@c0@"
  fr: "@a@b*ⓢ Oh, oui. Ne vous inquiétez pas pour moi.\nJe regardais simplement la rivière en réfléchissant à l'avenir de notre royaume.\n@c0@"
  it: "@a@b*: Oh, sì. Sto benissimo.\nSto osservando lo scorrere del fiume, e rifletto sul futuro del nostro amato Regno.\n@c0@"
  ja: "@a@bパパス「どれ。\n\tよいしょ……と。\n@c0@"
137:
  de: "@aLudwig@bAha... Nun, passt auf, dass Ihr Euch keine Erkältung holt, wenn Ihr zu lange hier oben rumsteht.\n@c0@"
  en: "@aPankraz@bI see... Well, be careful not to catch a cold from standing up here too long.\n@c0@"
  es: "@aTeudis@bYa veo... Bueno, cuídese, no vaya a pillar un resfriado por estar al fresco mucho tiempo.\n@c0@"
  fr: "@aPetros@bJe vois... Bon, faites attention à ne pas tomber malade en restant trop longtemps ici.\n@c0@"
  it: "@aRussel@bAh, ehm...\nSì, ho capito.\nBeh, buona riflessione, allora...\n@c0@"
  ja: "@a@bパパス「もし……。\n\tどうか　されたか　ご老人？\n@c0@"
138:
  de: "@aLudwig@bEntschuldigt bitte!\n@c0@"
  en: "@aPankraz@bDo excuse us!\n@c0@"
  es: "@aTeudis@bPerdón.\n@c0@"
  fr: "@aPetros@bVeuillez nous excuserⓠ\n@c0@"
  it: "@aRussel@bScusa il disturbo, e arrivederci!\n@c0@"
  ja: "@a@b＊「ほっといてくだされ。　わしは\n\t川の流れを見ながら　この国の\n\tゆく末を　案じているだけじゃて……。\n@c0@"
139:
  de: "@aLudwig@bWir müssen uns beeilen! Wir sollten schon längst in Tifortu sein!\n@c0@"
  en: "@aPankraz@bWe must hurry! We're supposed to be in Coburg by now!\n@c0@"
  es: "@aTeudis@b¡Venga, deprisa! ¡Ya deberíamos estar en Trastámara!\n@c0@"
  fr: "@aPetros@bDépêchons-nousⓠ Nous devrions déjà être à Cobourg, à l'heure qu'il estⓠ\n@c0@"
  it: "@aRussel@bDobbiamo sbrigarci!\nA quest'ora avremmo già dovuto essere a Coburg!\n@c0@"
  ja: "@a@bパパス「ふむ……。\n\tあまり　風にあたると　身体に\n\t毒ですぞ。\n@c0@"
140:
  de: "@a@b*: Halt!\nWeshalb tut Ihr wünschen, zu betreten Schloss Tifortu?\n@c0@"
  en: "@a@b*: Halt!\nWhat business do you have in Coburg Castle?\n@c0@"
  es: "@a@b*: ¡Alto!\r\n¿Qué os trae al castillo de Trastámara?\n@c0@"
  fr: "@a@b*ⓢ Halte-làⓠ\nQue venez-vous faire au château de Cobourgⓡ\n@c0@"
  it: "@a@b*: Altolà!\nCosa vi porta al Castello di Coburg?\n@c0@"
  ja: "@a@bパパス「では　ごめん！\n@c0@"
141:
  de: "@aLudwig@bIch heiße Ludwig. Ich wurde vom König aus Steinach hergerufen.\n@c0@"
  en: "@aPankraz@bMy name is Pankraz. I was summoned from Whealbrook by the King.\n@c0@"
  es: "@aTeudis@bMe llamo Teudis. Soy de Arroyofrío y me ha mandado llamar el Rey.\n@c0@"
  fr: "@aPetros@bJe m'appelle Petros. J'arrive de Ruycelieu sur convocation du roi.\n@c0@"
  it: "@aRussel@bIl mio nome è Russel, e vengo da Valcava.\nSono stato convocato qui da re Michel.\n@c0@"
  ja: "@a@bパパス「おっと　いかん！\n\tラインハットに　行くんだったな……。\n@c0@"
142:
  de: "@a@b*: Ah! Entschuldigt, Sir.\nDer König erwartet Euch bereits.\n@c0@"
  en: "@a@b*: Ah! My apologies, good sir.\nThe King is expecting you.\n@c0@"
  es: "@a@b*: ¡Ah! Disculpe, buen señor.\r\nEl Rey le espera.\n@c0@"
  fr: "@a@b*ⓢ Ahⓠ Toutes mes excuses, Monsieur.\nLe roi vous attend.\n@c0@"
  it: "@a@b*: Ah! Ti chiedo scusa.\nIl Re ti sta aspettando.\n@c0@"
  ja: "@a@b＊「待てっ！\n\tわが城に　なに用だっ！？\n@c0@"
143:
  de: "@a@b*: Bitte folgt mir.\n@c0@"
  en: "@a@b*: Please, follow me.\n@c0@"
  es: "@a@b*: Síganme, por favor.\n@c0@"
  fr: "@a@b*ⓢ Veuillez me suivre.\n@c0@"
  it: "@a@b*: Seguitemi, per favore.\n@c0@"
  ja: "@a@bパパス「私は　サンタローズに住む\n\tパパスという者だ。\n\t国王に呼ばれ　来たのだが。\n@c0@"
144:
  de: "@a@b*: Eure Majestät!\nLudwig aus Steinach erbittet eine Audienz.\n@c0@"
  en: "@a@b*: Your Majesty!\nPankraz of Whealbrook requests an audience.\n@c0@"
  es: "@a@b*: ¡Majestad!\r\nTeudis de Arroyofrío solicita audiencia.\n@c0@"
  fr: "@a@b*ⓢ Votre Majestéⓠ\nPetros, de Ruycelieu, demande audience.\n@c0@"
  it: "@a@b*: Maestà, Russel Denim di Valcava le chiede udienza.\n@c0@"
  ja: "@a@b＊「おお！　あなたが\n\tパパスどのですか！？\n\tこれは　失礼いたしました。\n@c0@"
145:
  de: "@aKönig von Tifortu@bDanke. Ich werde ihn empfangen.\nDu darfst wegtreten.\n@c0@"
  en: "@aKing of Coburg@bThank you. I will see him.\nYou may leave.\n@c0@"
  es: "@aRey de Trastámara@bGracias, lo recibiré.\r\nPuede retirarse.\n@c0@"
  fr: "@aRoi de Cobourg@bJe vais le recevoir, merci.\nVous pouvez disposer.\n@c0@"
  it: "@aRe Michel@bFallo passare.\nPuoi andare.\n@c0@"
  ja: "@a@b＊「国王が　お待ちかねです。\n\tさあ　こちらへっ！\n@c0@"
146:
  de: "@a@b*: Zu Befehl, Eure Majestät!\n@c0@"
  en: "@a@b*: At once, Your Majesty!\n@c0@"
  es: "@a@b*: ¡Al punto, Majestad!\n@c0@"
  fr: "@a@b*ⓢ À vos ordres, Votre Majestéⓠ\n@c0@"
  it: "@a@b*: Subito, Maestà.\n@c0@"
  ja: "@a@b＊「王さま！\n\tパパスどのを　お連れしました！\n@c0@"
147:
  de: "@aKönig von Tifortu@bNun, Ludwig. Euer Ruf eilt Euch voraus.\nIch habe viel von Eurer Tapferkeit gehört.\n@c0@"
  en: "@aKing of Coburg@bWell, Pankraz. Your reputation precedes you.\nI have heard much about your bravery.\n@c0@"
  es: "@aRey de Trastámara@bBien, Teudis, su reputación le precede.\r\nHe oído hablar mucho de su valentía.\n@c0@"
  fr: "@aRoi de Cobourg@bEh bien, Petros. Votre réputation vous précède.\nJ'ai beaucoup entendu parler de votre bravoure.\n@c0@"
  it: "@aRe Michel@bSalve, Russel.\nHo sentito molto parlare di te.\nIn giro si dice che sei un uomo forte e coraggioso.\n@c0@"
  ja: "@a@b王「ふむ。　ごくろうであった。\n\tそのほうは　さがってよいぞ。\n@c0@"
148:
  de: "@aKönig von Tifortu@bAus diesem Grund ich habe Euch hergerufen, zu bitten Euch um einen Gefallen... Ich, äh... Ähm!\n@c0@"
  en: "@aKing of Coburg@bAs such, I have summoned you here to ask you a favour...\nI, er... Ahem!\n@c0@"
  es: "@aRey de Trastámara@bTanto es así que le he hecho llamar para pedirle un favor.\r\nYo, eh... ¡Ejem!\n@c0@"
  fr: "@aRoi de Cobourg@bC'est pour cette raison que je vous ai convoqué. Pour vous demander une petite faveur...\nJe, euh... humⓠ\n@c0@"
  it: "@aRe Michel@bPer questo motivo, ti ho convocato qui al mio cospetto. Voglio chiederti un favore.\nEcco, io... Ehm...\n@c0@"
  ja: "@a@b＊「はっ！　失礼いたします。\n@c0@"
149:
  de: "@aKönig von Tifortu@bBitte tretet näher an den Thron heran.\nWachen, wegtreten!\n@c0@"
