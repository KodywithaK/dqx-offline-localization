252:
  de: "@a@b*: Ich reise normalerweise herum und kaufe und verkaufe, weißt du. Aber die Ungeheuer, denen ich in letzter Zeit begegnet bin, sind ziemlich zäh.\n@c0@"
  en: "@a@b*: Usually I travel about buying and selling stuff, you know. But the monsters I've been running into lately are so tough.\n@c0@"
  es: "@a@b*: Viajo mucho, comprando y vendiendo. Pero últimamente no puedo con los monstruos que me encuentro.\n@c0@"
  fr: "@a@b*ⓢ D'habitude, je voyage ça et là pour acheter et vendre des marchandises. Mais les monstres que j'ai croisés récemment sont étrangement forts.\n@c0@"
  it: "@a@b*: Compro e vendo merci di ogni genere, e giro il mondo in lungo e in largo.\nAnzi! Lo giravo in lungo e un largo...\n㈡\nPurtroppo, ultimamente viaggio meno di quanto facevo un tempo, perché i mostri sono diventati più aggressivi...\n@c0@"
  ja: "@a@b■防具屋チャート\n@c0@"
253:
