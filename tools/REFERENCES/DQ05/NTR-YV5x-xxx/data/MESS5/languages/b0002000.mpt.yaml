  en: "@a@b*: Oh, I know! I bet Prince Harry got him with one of his tricks! Ha ha ha! Poor fellow!\n@c0@"
  es: "@a@b*: ¡Oh, ya sé! ¡Seguro que es una treta del príncipe Froilán! ¡Ja, ja! ¡Pobre tipo!\n@c0@"
  fr: "@a@b*ⓢ Oh, mais je saisⓠ Je parie que le prince Harry lui a encore joué un de ses toursⓠ\nHa ha haⓠ Pauvre bougreⓠ\n@c0@"
  it: "@a@b*: Probabilmente il principe Robert gli avrà giocato uno dei suoi scherzetti...\nPovero Russel!\n@c0@"
  ja: "@a@b＊「坊や　変わったことが　あったら\n\t父上の　パパスどのに\n\t知らせるのだよ。\n@c0@"
240:
  de: "@a@b*: Du und dein Vater, ihr reist gerne, nicht war?\n@c0@"
  en: "@a@b*: You and your father like travelling, don't you?\n@c0@"
  es: "@a@b*: A tu padre y a ti os gusta viajar, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Toi et ton père, vous aimez les voyages, nonⓡ\n@c0@"
