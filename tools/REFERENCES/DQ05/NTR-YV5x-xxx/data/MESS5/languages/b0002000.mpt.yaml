  en: "@a@b*: This globe here was made by a great adventurer. Have a look at it. Maybe you'll recognise a place or two!\n@c0@"
  es: "@a@b*: Este globo lo creó un gran aventurero. Míralo, ¡quizá reconozcas uno o dos lugares!\n@c0@"
  fr: "@a@b*ⓢ Cette mappemonde a été fabriquée par un grand aventurier. Observe-la bien. Tu reconnaîtras\npeut-être un ou deux endroitsⓠ\n@c0@"
  it: "@a@b*: Questo mappamondo è stato realizzato da un famoso avventuriero. Dagli un'occhiata, e vedi se riesci a riconoscere qualche posto.\n@c0@"
  ja: "@a@b＊「どうせ　また　ヘンリー王子の\n\tいたずらにでも　ひっかかった\n\tのだろう。　わっはっはっ。\n@c0@"
242:
