  ja: "@a@bパパス「とにかく　王子を\n\t助け出さないとっ！\n\tついて来い　%a000090！\n@c0@"
248:
  de: "@a@b*: Aber meine Mutti hat gesagt, dass ich da nicht hin darf. Sie hat gesagt, das wär zu gefährlich.\n@c0@"
  en: "@a@b*: But my mum said I mustn't go there.\nShe said it's too dangerous.\n@c0@"
  es: "@a@b*: Pero mi madre no me deja ir.\r\nDice que es muy peligroso.\n@c0@"
  fr: "@a@b*ⓢ Mais ma maman dit que je ne dois pas y aller.\nElle dit que c'est trop dangereux.\n@c0@"
