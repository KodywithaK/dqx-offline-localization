  ja: "@a@bパパス「いいか　%a000090。\n\tこのことは誰にも言うな。　さわぎが\n\t大きくなるだけだからな……。\n@c0@"
247:
  de: "@a@b*: Ich habe gehört, dass nordöstlich von hier eine richtig große Ruine steht.\n@c0@"
  en: "@a@b*: I heard there's a really big ruin north-east of here.\n@c0@"
