244:
  de: "@aLudwig@bJetzt hör mir gut zu, %a000090. Davon darf niemand erfahren. Es wäre eine Katastrophe, wenn die Leute das herausfinden.\n@c0@"
  en: "@aPankraz@bNow listen to me, %a000090. No one must know of this. It'd be a disaster if people were to find out.\n@c0@"
  es: "@aTeudis@bEscúchame, %a000090. Nadie debe enterarse. Si esto se supiera sería un desastre.\n@c0@"
  fr: "@aPetros@bBon, écoute-moi bien, %a000090.\nPersonne ne doit être au courant.\nSi les gens l'apprenaient, ce serait un désastre.\n@c0@"
  it: "@aRussel@bAscoltami bene, %a000090.\nNessuno deve sapere cos'è successo.\nSarebbe un dramma per il Regno di Coburg.\n@c0@"
