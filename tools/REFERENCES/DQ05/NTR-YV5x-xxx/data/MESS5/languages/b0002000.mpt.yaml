  en: "@a@b*: So it was the Winter Queen behind it all from the very beginning? I wonder who she is...\n@c0@"
  es: "@a@b*: Así que desde el principio era la Reina de las Nieves la que estaba detrás de todo, ¿eh? Me pregunto quién será...\n@c0@"
  fr: "@a@b*ⓢ Alors c'est la reine de l'Hiver qui était derrière tout ça depuis le débutⓡ\nJe me demande qui elle est...\n@c0@"
  it: "@a@b*: Quindi era stata la Regina dell'Inverno ad architettare il tutto...?\nMi chiedo chi fosse quell'essere...\n@c0@"
  ja: "@a@b＊「ふ～ん。　雪の女王というのが\n\tウラで糸を引いてたの？\n\tいったい　何者かしら……。\n@c0@"
29:
  de: "@a@b*: Also wird der Schnee jetzt schmelzen? Der Göttin sei Dank!\n@c0@"
  en: "@a@b*: So all the snow will goo away now?\r\nThank the Gooddess!\n@c0@"
  es: "@a@b*: ¿Así que ahora desaparecerá loda la nieve?\r\n¡Gracias a la Diosa!\n@c0@"
  fr: "@a@b*ⓢ Alors toute la neige va partir, maintenantⓡ\nGlouée soit la Déesseⓠ\n@c0@"
  it: "@a@b*: Allora adesso la neve slurparirà?\nOh, che bello! Sia ringraziata la dea!\n@c0@"
  ja: "@a@b＊「やったあー！\n\tこれで　やっと　春になるよ！\n@c0@"
30:
  de: "@a@b*: Dann solltest du jetzt schleimigst zu Marmela schlurfen und ihr die Flöte geben. Trödel blub nicht rum!\n@c0@"
  en: "@a@b*: Boing along and give Treacle the flute, then. Or you'll be accoozed of dawdling.\n@c0@"
  es: "@a@b*: Anda, ve de un bringlop a dar la flauta a Mielⓓ hay que estar siempre al lodo y ser diligente.\n@c0@"
  fr: "@a@b*ⓢ Va d'un bond voir Mélissa, dans ce cas.\nOu tu risques d'être aglusé d'avoir traîné.\n@c0@"
  it: "@a@b*: Sbrigati a slurportare il flauto ad Adusya!\nAvanti! Cosa stai aspettando?\n@c0@"
  ja: "@a@b＊「さあ　早く　ポワンさまに\n\tフルートを　わたしてあげて！\n@c0@"
31:
  de: "@a@b*: Also hat jemand versucht, uns frühzeitig in ein frostiges Grab zu befördern, ja?\n@c0@"
  en: "@a@b*: So someone was trying to freeze us all into early graves, were they?\n@c0@"
  es: "@a@b*: Así que alguien intentaba enterrarnos a todos en una tumba helada, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Alors comme ça, quelqu'un essayait de nous refroidir avant l'heure, heinⓡ\n@c0@"
  it: "@a@b*: E così qualcuno ha provato a farci finire tutti in una gigantesca bara di ghiaccio, eh?\n@c0@"
  ja: "@a@b＊「こんどの事件は　だれかが\n\t世界を凍らせようとしたのかも\n\t知れんな。\n@c0@"
32:
  de: "@a@b*: Na, ich hoffe doch, dass es jetzt ausgestanden ist. Nicht, dass uns noch größere Probleme bevorstehen...\n@c0@"
  en: "@a@b*: Well I hope this is the end of all the trouble now. I'd hate to think it was the start of even bigger problems...\n@c0@"
  es: "@a@b*: Espero que esto deje atrás todos los problemas. No me gustaría que fuese el preludio de problemas aún mayores...\n@c0@"
  fr: "@a@b*ⓢ J'espère que c'est la fin des ennuis, cette fois. Je n'aimerais pas me dire qu'ils ne font qu'en présager d'autres...\n@c0@"
  it: "@a@b*: Beh, speriamo che i guai siano finiti.\nVorrei trascorrere il resto della mia vita serenamente... e al calduccio!\n@c0@"
  ja: "@a@b＊「これが　よくないことの起こる\n\t前兆で　なければよいが……。\n@c0@"
33:
  de: "@a@b*: Du bist sehr tapfer, für jemanden in deinen jungen Jahren. Also geht dieser lange Winter endlich zu Ende? Dann lass uns zum Geschäft kommen...\n@c0@"
  en: "@a@b*: You're certainly brave for a young'un. So this long winter's finally drawing to a close, eh? Better get down to business then...\n@c0@"
  es: "@a@b*: Eres muy valiente para tu edad. Así que este largo invierno llegará a su fin, ¿eh? Entonces será mejor ponerse manos a la obra...\n@c0@"
  fr: "@a@b*ⓢ Vous êtes vraiment courageux, pour un jeunot.\nAlors ce long hiver touche à sa fin, heinⓡ Il va falloir que je me remette au travail, dans ce cas...\n@c0@"
  it: "@a@b*: Sei davvero in gamba, ragazzino! Eh, sì!\r\nNoi piccoletti siamo i migliori! Forza, prepariamoci ad accogliere la primavera come si deve!\n@c0@"
  ja: "@a@b＊「お若いの。　お手柄でしたな。\n\t長かった冬も　これで\n\t終ることでしょう。　ところで……\n@c0@"
34:
  de: "@a@b*: Unglaublich! Du hast es tatsächlich geschafft, den Frühlingsboten zurückzuholen!\n@c0@"
  en: "@a@b*: Unbelievable! You really did get the Herald of Spring back!\n@c0@"
  es: "@a@b*: ¡Increíble! ¡Has traído de vuelta el Heraldo de la Primavera!\n@c0@"
  fr: "@a@b*ⓢ Incroyableⓠ Tu as vraiment rapporté le Messager du Printempsⓠ\n@c0@"
  it: "@a@b*: Non ci posso credere!\nSei riuscito a recuperare il Richiamo della Primavera!\n@c0@"
  ja: "@a@b■防具屋チャートへ\n@c0@"
35:
  de: "@a@b*: In dir steckt mehr, als es den Anschein hat!\n@c0@"
  en: "@a@b*: There's more to you than meets the eye!\n@c0@"
  es: "@a@b*: ¡Eres una caja de sorpresas!\n@c0@"
  fr: "@a@b*ⓢ Tu caches bien ton jeu, on diraitⓠ\n@c0@"
  it: "@a@b*: Sei davvero un guerriero di alta levatura!\nE se te lo dico io, ci puoi credere...\n@c0@"
  ja: "@a@b＊「どひゃ～！\n\tフルートを　取りもどしたですって？\n@c0@"
36:
  de: "@a@b*: Es geht doch nichts über ein schönes, heißes Bad! Bei anderen wird ja die Haut ganz runzlig, wenn sie zu lange drin bleiben, aber nicht bei mir!\n@c0@"
  en: "@a@b*: Aaah, nothing like a good soak! Some people go wrinkly if they stay in too long, but not me!\n@c0@"
  es: "@a@b*: ¡No hay nada como un buen chapuzón! Hay a quien se le arruga la piel si se queda mucho rato dentro, pero a mí eso no me pasa.\n@c0@"
  fr: "@a@b*ⓢ Aaah, faire trempette est un vrai plaisirⓠ Certains ont la peau qui plisse s'ils restent dans l'eau trop longtemps, mais je n'ai pas ce problèmeⓠ\n@c0@"
  it: "@a@b*: Aaah, che bello fare il bagno! Ad alcune persone si raggrinzisce la pelle, se restano in acqua troppo a lungo, ma io non ho questo problema...\n@c0@"
  ja: "@a@b＊「あなた　見かけによらず\n\tやりますね！\n@c0@"
37:
  de: "@a@b*: Hast du jemals von der Unterwelt gehört? Brrr, da unten ist es kalt. Da friert man bis auf die Knochen.\n@c0@"
  en: "@a@b*: Have you ever heard of the underworld? Brrr, it's cold down there. Bone-rattlingly cold!\n@c0@"
  es: "@a@b*: ¿Has oído hablar del Inframundo? Brrr, hace un frío allí... ¡Se te hielan los huesos!\n@c0@"
  fr: "@a@b*ⓢ As-tu déjà entendu parler du monde souterrainⓡ Brrr, il y fait vraiment froid.\nÀ en claquer des dentsⓠ\n@c0@"
  it: "@a@b*: Hai mai sentito parlare del Regno degli Inferi?\nLì fa un freddo incredibile!\nTi entra fin dentro le ossa!\n@c0@"
  ja: "@a@b＊「ああ　いい湯だなっと……。\n@c0@"
38:
  de: "@a@b*: Ich will nicht dorthin zurück. Niemals!\nIn der Unterwelt gibt's keine Bäder!\n@c0@"
  en: "@a@b*: I don't want to go back there. Not ever!\nThey don't have baths in the underworld!\n@c0@"
  es: "@a@b*: ¡No quiero volver allí jamás!\r\n¡En el Inframundo no te puedes bañar!\n@c0@"
  fr: "@a@b*ⓢ Je ne veux pas y retourner. Jamaisⓠ\nIls ne connaissent pas les bains, dans les Enfersⓠ\n@c0@"
  it: "@a@b*: Non voglio tornare negli inferi!\nLì non si può nemmeno fare un bagno caldo!\nÈ una c-ossa scandal-ossa!\n@c0@"
  ja: "@a@b＊「あんた　魔の世界を\n\t知ってるかい？\n\tそりゃ　寒い所でよぉ……。\n@c0@"
39:
  de: "@a@b*: Ich hatte so lange keine Kunden mehr, da dachte ich fast schon, der Frühling wär früh dran, als du nach Feenaue gekommen bist.\n@c0@"
  en: "@a@b*: I hadn't had a customer in such a long time, I thought spring had come early when you first came to Faerie Lea.\n@c0@"
  es: "@a@b*: Hacía tanto tiempo que no tenía un cliente que, cuando llegaste a Hadavilla, pensé que ya era primavera en el Cante Inglés.\n@c0@"
  fr: "@a@b*ⓢ Ça faisait si longtemps que je n'avais pas eu de client que j'ai cru que le printemps était arrivé en avance, quand je vous ai vu pour la première fois.\n@c0@"
  it: "@a@b*: Prima non avevo nemmeno un cliente, e l'inverno non voleva saperne di andarsene.\nPoi sei arrivato tu e hai portato la primavera!\n@c0@"
  ja: "@a@b＊「おらあ　もう　あんな所には\n\t帰りたくないねっ。\n@c0@"
40:
  de: "@a@b*: Und jetzt ist er da. Aber du gehst wieder, was? Der Frühling ist gekommen, und mein einziger Kunde reist ab! Verschwenden wir also keine Zeit.\n@c0@"
  en: "@a@b*: And now it has come. But you're going, I suppose. Spring's arrived, and my only customer's leaving! Best not waste any time, eh?\n@c0@"
  es: "@a@b*: Y ahora ya es primavera de verdad. Pero supongo que te vas. ¡Llega la primavera y se va mi único cliente! Será mejor no perder el tiempo ¿no?...\n@c0@"
  fr: "@a@b*ⓢ Et cette fois, il est là pour de bon.\nMais vous, vous partez, je suppose...\n㈡\n*ⓢ Le printemps est arrivé, et mon unique client s'en vaⓠ Mieux vaut ne pas perdre de temps, heinⓡ\n@c0@"
  it: "@a@b*: Bah, speriamo che con la primavera gli affari migliorino...\n@c0@"
  ja: "@a@b＊「あんたは　久しぶりのお客さんで\n\tうれしかったんだが\n\tこれで　帰っちまうのかい？\n@c0@"
41:
  de: "@a@b*: Marmela sieht alles. Sie hat zugeschaut, als du gegen die Winterkönigin gekämpft hast.\n@c0@"
  en: "@a@b*: Treacle sees everything. She was watching when you fought the Winter Queen.\n@c0@"
  es: "@a@b*: Miel lo ve todo. Te estaba observando mientras te enfrentabas a la Reina de las Nieves.\n@c0@"
  fr: "@a@b*ⓢ Mélissa voit tout. Elle t'a regardé combattre la reine de l'Hiver.\n@c0@"
  it: "@a@b*: Nulla sfugge agli occhi vigili di Adusya.\nTi ha visto mentre combattevi contro la Regina dell'Inverno.\n@c0@"
  ja: "@a@b＊「ざんねんじゃが　たっしゃでな。\n\tさて……と。\n@c0@"
42:
  de: "@a@b*: Du hast uns und unsere Feenwelt gerettet. Danke, %a000090.\n@c0@"
  en: "@a@b*: You saved us and our faerie world.\nThank you, %a000090.\n@c0@"
  es: "@a@b*: Has salvado nuestro mundo de las hadas.\nGracias, %a000090.\n@c0@"
  fr: "@a@b*ⓢ Tu nous as sauvés, nous et notre monde féerique. Merci, %a000090.\n@c0@"
  it: "@a@b*: Ci hai salvati, %a000090. Hai salvato il Regno delle Fate e tutte le creature che lo abitano.\nGrazie di cuore!\n@c0@"
  ja: "@a@b■よろず屋チャートへ\n@c0@"
43:
  de: "@a@b*: Ach du meine Güte! Du hast ihn zurückgebracht! Den Frühlingsboten! Tja, Menschen sind manchmal wohl doch zu etwas nütze.\n@c0@"
  en: "@a@b*: Oh, my! You got it back! The Herald of Spring!\nI suppose humans have their uses sometimes.\n@c0@"
  es: "@a@b*: ¡Cielos! ¡Has recuperado el Heraldo de la Primavera!\n㈡\n*: Supongo que a veces los humanos sí sirven para algo.\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Tu l'as récupéréⓠ Le Messager du Printempsⓠ Les humains servent donc parfois à quelque chose.\n@c0@"
  it: "@a@b*: Ci hai riportato il Richiamo della Primavera!\nAllora voi umani non siete così inutili come si dice in giro...\n@c0@"
  ja: "@a@b＊「あなた方の　たたかいは\n\tポワンさまも　心の目で\n\tごらんになって　おいででした。\n@c0@"
44:
  de: "@a@b*: Die Feen sind verantwortlich für den Wechsel der Jahreszeiten.\n@c0@"
  en: "@a@b*: The faeries are responsible for the passing of the seasons.\n@c0@"
  es: "@a@b*: Las hadas son las responsables del ciclo de las estaciones.\n@c0@"
  fr: "@a@b*ⓢ Ce sont les fées qui sont responsables des changements de saisons.\n@c0@"
  it: "@a@b*: Le fate sovrintendono al susseguirsi delle stagioni.\n@c0@"
  ja: "@a@b＊「あなたは　この国の\n\t救い主ですわ。\n\tどうも　ありがとうございました。\n@c0@"
45:
  de: "@a@b*: Wenn der Winter noch länger gedauert hätte, wäre die Welt vielleicht komplett zugefroren.\n@c0@"
  en: "@a@b*: If winter had gone on much longer, the world might have frozen over completely.\n@c0@"
  es: "@a@b*: Si el invierno hubiera durado mucho más, puede que el mundo se hubiese helado del todo.\n@c0@"
  fr: "@a@b*ⓢ Si l'hiver avait duré plus longtemps, le monde aurait entièrement gelé.\n@c0@"
  it: "@a@b*: Se l'inverno fosse durato ancora un po', il mondo sarebbe diventato una distesa gelata triste e senza vita.\n@c0@"
  ja: "@a@b＊「まあ！　あなたが\n\tフルートを　とりもどしたの？\n\t人間も　時には役に立つのね。\n@c0@"
46:
  de: "@a@b*: Im Frühling hat man hier eine atemberaubende Aussicht.\n@c0@"
  en: "@a@b*: The view from here in springtime is breathtaking.\n@c0@"
  es: "@a@b*: En primavera, la vista desde aquí es increíble.\n@c0@"
  fr: "@a@b*ⓢ Au printemps, la vue que l'on a d'ici est à couper le souffle.\n@c0@"
  it: "@a@b*: In primavera, da qui si gode una vista meravigliosa...\n@c0@"
  ja: "@a@b＊「ここは　季節をつかさどる\n\t妖精の国。\n@c0@"
47:
  de: "@a@b*: Sobald Marmela den Frühlingsboten bläst, weht eine warme Brise all die hübschen kleinen Blütenblätter und Knospen der neuen Jahreszeit herbei.\n@c0@"
  en: "@a@b*: As soon as Treacle blows the Herald of Spring, a warm breeze will bring all the pretty little petals and buds of the new season.\n@c0@"
  es: "@a@b*: En cuanto Miel empiece a tocar el Heraldo de la Primavera, una brisa cálida abrirá las florecillas y los pétalos de la nueva estación aparecerán.\n@c0@"
  fr: "@a@b*ⓢ Dès que Mélissa se met à jouer avec le Messager du Printemps, une brise tiède apporte les jolis pétales et les bourgeons de la nouvelle saison.\n@c0@"
  it: "@a@b*: Quando Adusya suona il Richiamo della Primavera, una brezza fresca e delicata porta i colori e i profumi della nuova stagione.\n@c0@"
  ja: "@a@b＊「あのまま　春を告げられなければ\n\t世界は　冷え切って\n\tしまっていたことでしょう……。\n@c0@"
48:
  de: "@a@b*: Jetzt können wir den Frühling rufen, so wie es unsere Aufgabe ist. Danke, %a000090.\n@c0@"
  en: "@a@b*: Now we can call spring like we're supposed to. Thank you, %a000090.\n@c0@"
  es: "@a@b*: Ahora ya podemos invocar la primavera, como es nuestra misión. Gracias, %a000090.\n@c0@"
  fr: "@a@b*ⓢ À présent, nous pouvons appeler le printemps comme nous sommes censées le faire.\nMerci, %a000090.\n@c0@"
  it: "@a@b*: Ora possiamo finalmente chiamare la primavera!\nGrazie, %a000090.\n@c0@"
  ja: "@a@b＊「ここから　ながめる\n\t春の景色は　とても美しいのよ。\n@c0@"
49:
  de: "@aMarmela@bHeilige Elfen! Der Frühlingsbote!\n@c0@"
  en: "@aTreacle@bSpritely saints! The Herald of Spring!\n@c0@"
  es: "@aMiel@b¡Por todos los duendes! ¡El Heraldo de la Primavera!\n@c0@"
  fr: "@aMélissa@bPar le mielⓠ Le Messager du Printempsⓠ\n@c0@"
  it: "@aAdusya@bSanto cielo!\nMa quello è il Richiamo della Primavera!\n@c0@"
  ja: "@a@b＊「ポワンさまが　フルートを吹けば\n\tたちまち　あたたかい風が\n\t春の花々を　運ぶでしょう。\n@c0@"
50:
  de: "@aMarmela@bKomm, %a000090.\nLass mich dein Gesicht betrachten...\n@c0@"
  en: "@aTreacle@bCome, %a000090.\nLet me take a good look at your face...\n@c0@"
  es: "@aMiel@bVen, %a000090.\nDeja que te mire bien...\n@c0@"
  fr: "@aMélissa@bApproche, %a000090.\nLaisse-moi te regarder de près...\n@c0@"
  it: "@aAdusya@bAvvicinati, %a000090.\nLascia che io guardi meglio il tuo volto.\n@c0@"
  ja: "@a@b＊「これで　世界に\n\t春を告げることができます。\n\tありがとうございました。\n@c0@"
51:
  de: "@aMarmela@bWir hätten von niemandem mehr verlangen können, %a000090.\n@c0@"
  en: "@aTreacle@bWe couldn't have asked for more from anyone, %a000090.\n@c0@"
  es: "@aMiel@bNos has dado todo lo que podíamos pedir, %a000090.\n@c0@"
  fr: "@aMélissa@bNous n'aurions pas pu demander davantage à quiconque, %a000090.\n@c0@"
  it: "@aAdusya@bNessuno avrebbe saputo fare meglio di te, %a000090.\n@c0@"
  ja: "@a@bポワン「まあ！　それは　まさしく\n\t春風のフルート！\n@c0@"
52:
  de: "@aMarmela@bEndlich kann ich die Pflicht der Feen erfüllen:\nDiesem langen, bitteren Winter ein Ende setzen und den Frühling in die Welt rufen.\n@c0@"
  en: "@aTreacle@bAt last I can fulfil the duty of the faeries: to call an end to this long, harsh winter and summon spring into the world.\n@c0@"
  es: "@aMiel@bAhora puedo cumplir la obligación de las hadas: poner fin a este largo y riguroso invierno e invocar la primavera en el mundo.\n@c0@"
  fr: "@aMélissa@bJe peux enfin accomplir le devoir des féesⓢ mettre fin à ce long et rude hiver et appeler le printemps sur le monde.\n@c0@"
  it: "@aAdusya@bOra potrò finalmente celebrare il rito che, da sempre, spetta a noi fate: allontanare l'inverno e chiamare la primavera.\n@c0@"
  ja: "@a@bポワン「さあ　%a000090。　\n\tあなたの　お顔を\n\tよく見せてくださいな。\n@c0@"
53:
  de: "@aMarmela@bIch weiß wirklich nicht, wie wir dir danken können. Außer, vielleicht, mit einem Versprechen...\n@c0@"
  en: "@aTreacle@bI really don't know how we can thank you.\nExcept, perhaps, to promise you this...\n@c0@"
  es: "@aMiel@bNo sé cómo darte las gracias.\r\nSalvo con esta promesa...\n@c0@"
  fr: "@aMélissa@bJe ne sais vraiment pas comment nous pourrions te remercier. Sauf peut-être en te faisant cette promesse...\n@c0@"
  it: "@aAdusya@bNon so proprio come possiamo ringraziarti.\nAnzi, un'idea ce l'ho...\nVoglio farti una promessa.\n@c0@"
  ja: "@a@bポワン「%a000090や\n\tよくやってくれました。\n@c0@"
54:
  de: "@aMarmela@bWenn du jemals in Schwierigkeiten geraten solltest ⓚⓛ ich meine, wenn du etwas älter bist ⓚⓛ, dann komm wieder in unser Land.\n@c0@"
  en: "@aTreacle@bIf you ever find yourself in trouble ⓚⓛ when you are a little older, I mean ⓚⓛ come to our land again.\n@c0@"
  es: "@aMiel@bSi alguna vez tienes problemas, cuando seas mayor, puedes volver a nuestro país.\n@c0@"
  fr: "@aMélissa@bSi jamais un jour tu as des ennuis, lorsque tu seras plus âgé, je veux dire... reviens nous voir.\n@c0@"
  it: "@aAdusya@bSe nel corso della tua vita ti trovassi in difficoltà, vieni a trovarci.\n@c0@"
  ja: "@a@bポワン「これで　やっと　世界に\n\t春を告げることが　できますわ。\n@c0@"
55:
  de: "@aMarmela@bWir werden tun, was in unserer Macht steht, um uns für deine Tapferkeit zu revanchieren. Also denk an uns, %a000090.\n@c0@"
  en: "@aTreacle@bWe will do whatever we can to repay you for your bravery. So remember us, %a000090.\n@c0@"
  es: "@aMiel@bHaremos cuanto esté en nuestra mano para compensarte por tu coraje. No nos olvides, %a000090.\n@c0@"
  fr: "@aMélissa@bNous ferons tout ce qui sera en notre pouvoir pour te récompenser de ton courage. Ne nous oublie pas, %a000090.\n@c0@"
  it: "@aAdusya@bFaremo tutto ciò che è in nostro potere per aiutarti.\nQuesta è la promessa che ti faccio.\nNon dimenticarti di noi, %a000090.\n@c0@"
  ja: "@a@bポワン「なんて　お礼を言えば\n\tいいのやら……。\n\tそうだわ　約束しましょう。\n@c0@"
56:
  de: "@aMarmela@bUnd nun wird es Zeit, dass du in die Welt zurückkehrst, in die du gehörst.\n@c0@"
  en: "@aTreacle@bAnd now it's time for you to return to the world where you belong.\n@c0@"
  es: "@aMiel@bHa llegado la hora de que regreses a tu mundo.\n@c0@"
  fr: "@aMélissa@bLe temps est maintenant venu pour toi de rentrer dans le monde auquel tu appartiens.\n@c0@"
  it: "@aAdusya@bÈ giunto il momento che tu torni nel tuo mondo, mio piccolo e valoroso amico.\n@c0@"
  ja: "@a@bポワン「あなたが　大人になり\n\tもし　なにかに困ったとき\n\t再び　この国を訪ねなさい。\n@c0@"
