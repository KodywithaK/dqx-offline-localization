  en: "@a@b*: I heard a bit of a commotion from the far side of the castle just now...\n@c0@"
  es: "@a@b*: Acabo de oír jaleo al otro lado del castillo...\n@c0@"
  fr: "@a@b*ⓢ Je viens d'entendre du raffut à l'autre bout du château...\n@c0@"
  it: "@a@b*: Mi è sembrato di sentire degli strani rumori provenire dall'altro lato del castello...\n@c0@"
  ja: "@a@b＊「おい！　モタモタしてねえで\n\tはやく　王子をイカダへ！\n@c0@"
237:
  de: "@a@b*: Wenn du in Schwierigkeiten geraten bist, Junge, dann solltest du das besser deinem Vater beichten, nicht mir!\n@c0@"
  en: "@a@b*: If you've gone and got yourself in trouble, lad, you'd better go and own up to your father, not me!\n@c0@"
  es: "@a@b*: ¡Si te has metido en algún lío, chico, ve a contárselo a tu padre, no a mí!\n@c0@"
  fr: "@a@b*ⓢ Si tu t'es mis dans le pétrin, gamin, tu ferais mieux d'aller voir ton père, pas moiⓠ\n@c0@"
  it: "@a@b*:Ragazzino, credo che ti convenga andare di corsa da tuo padre.\n@c0@"
  ja: "@a@b＊「へいっ！\n@c0@"
238:
  de: "@a@b*: Dein Vater ist eben wie ein Blitz aus dem Schloss geflitzt. Ich frage mich, was da...\n@c0@"
  en: "@a@b*: Your father just shot out of the castle like a rocket. I wonder what's...\n@c0@"
  es: "@a@b*: Tu padre ha salido del castillo disparado. Qué habrá...\n@c0@"
  fr: "@a@b*ⓢ Ton père vient de sortir en trombe du château.\nJe me demande ce que...\n@c0@"
  it: "@a@b*: Tuo padre è appena uscito dal castello, e sembrava avere una gran fretta.\nNon sarà mica successo qualcosa di brutto?\n@c0@"
  ja: "@a@b＊「うらの方で\n\tさわがしかったようだが\n\tどうかしたのだろうか……。\n@c0@"
239:
