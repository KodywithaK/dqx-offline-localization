  it: "@aSimon@bSaranno anche spettri, ma il Conte e la Contessa non hanno rinunciato al loro spuntino a base di tè e pasticcini. Ah, che raffinatezza... Noblesse oblige!\n@c0@"
  ja: "@a@bピピン「死ぬと　味がしないんですか？\n\tたいへんだ！　生きてるうちに\n\tおいしいもの　食べとかなくちゃ！\n@c0@"
133:
  de: "@aBianca@bWie lustig, wieder hier zu sein.\n@c0@"
  en: "@aBianca@bFancy comin' back here! Dun't you worry, though.\n@c0@"
  es: "@aBianca@b¡Qué curioso, estar aquí de nuevo! Pero no te preocupes.\n@c0@"
  fr: "@aBianca@bÇa fait drôle de revenir iciⓠ Mais ne t'inquiète pas.\n@c0@"
  it: "@aBianca@bNon pensavo che sarei tornata qui, sai?\n@c0@"
  ja: "@a@bビアンカ「こんなときに\n\tこの場所へ来るなんて……\n\tでも　安心して。\n@c0@"
134:
  de: "@aBianca@bIch habe nicht vergessen, wie viel Spaß es damals gemacht hat, das Schloss zu erforschen.\n@c0@"
  en: "@aBianca@bI still en't forgotten how good it was to come explorin' here with you when we were kids.\n@c0@"
  es: "@aBianca@bAún no he olvidado lo bien que nos lo pasamos de niños tú y yo explorando por aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'ai pas oublié à quel point c'était amusant de venir explorer cet endroit quand on était enfants.\n@c0@"
  it: "@aBianca@bAncora ricordo quanto ci divertimmo quando esplorammo questo posto la prima volta da piccoli.\nFu un'avventura indimenticabile!\n@c0@"
  ja: "@a@bビアンカ「私　%a000090と　ここを\n\t冒険したときの気持ち\n\t少しも　なくしてないからね！\n@c0@"
135:
  de: "@aNera@bHätte es solch ein Schloss bei Mostroferrato gegeben, hätte ich als Kind bestimmt dort gespielt.\n@c0@"
  en: "@aNera@bIf there was a castle like this near Mostroferrato, I know I would've had to explore it when I was little.\n@c0@"
  es: "@aNera@bSi hubiese habido un castello como este cerca de Mostroferrato, seguro que hubiese ido a explorarlo de piccola.\n@c0@"
  fr: "@aNera@bS'il y avait eu un château comme celui-ci près de Mostroferrato, je suis sûre que je l'aurais exploré quand j'étais petite.\n@c0@"
  it: "@aNera@bSe dalle parti di Mostroferrato ci fosse stato un castello come questo, da piccola sarei scappata di casa pur di esplorarlo!\n@c0@"
  ja: "@a@bフローラ「サラボナの近くにも\n\tこのような　お城があったら\n\t私　絶対　冒険していましたわ。\n@c0@"
136:
  de: "@aNera@bUps! So was sollte ich besser nicht sagen, wenn die Kinder in der Nähe sind...\n@c0@"
  en: "@aNera@bOops! I'd better not let the children hear me say things like that.\n@c0@"
  es: "@aNera@b¡Huy! Será mejor que los bambini no me oigan decir estas cosas.\n@c0@"
  fr: "@aNera@bOupsⓠ Il ne faut pas que les enfants m'entendent dire des choses pareilles.\n@c0@"
  it: "@aNera@bOps!\nSpero proprio che i bambini non mi abbiano sentita...\n@c0@"
  ja: "@a@bフローラ「あら　今のは\n\t子供たちには　聞かせられない\n\tセリフでしたわね。\n@c0@"
137:
  de: "@a%0%a001240@bKennst du diesen Ort, Papa? Echt? Vielleicht sollte ich das Schloss ja auch mal bei Nacht erkunden!\n@c0@"
  en: "@a%0%a001240@bDo you know this place, Dad? That's cool! Maybe I should go off adventuring of a night too!\n@c0@"
  es: "@a%0%a001240@b¿Conoces este sitio, papi? ¡Es genial! ¡Pues a lo mejor yo también me voy de aventuras por la noche!\n@c0@"
  fr: "@a%0%a001240@bTu es déjà venu dans cet endroit, papaⓡ\nC'est génialⓠ Peut-être que je devrais\nl'explorer de nuit, moi aussiⓠ\n@c0@"
  it: "@a%0%a001240@bChe forte questo posto!\nUna di queste notti verrò a esplorarlo da solo!\n@c0@"
  ja: "@a@b%a001240「お父さん　ここ知ってるの？\n\tいいなあ。　ボクも　夜中に\n\tこっそり出かけて　冒険したいな。\n@c0@"
138:
  de: "@aBianca@bDas glaube ich nicht! Dein Vater und ich sind damals nur hierher gekommen, weil wir gute Gründe dafür hatten!\n@c0@"
  en: "@aBianca@bOi! I dun't think so! Your dad and I only came here adventurin' for good reason, I'll have you know.\n@c0@"
  es: "@aBianca@b¡Eh, nada de eso! Si papá y yo vinimos aquí de aventuras fue por una buena causa, que lo sepas.\n@c0@"
  fr: "@aBianca@bSûrement pasⓠ Ton père et moi, nous étions venus ici parce que nous avions une bonne raison de le faire. Mets-toi bien ça dans la tête.\n@c0@"
  it: "@aBianca@bNon credo proprio, giovanotto! Io e tuo padre venimmo qui solo perché... Uhm, ecco... Perché fummo costretti dalle circostanze. Già, proprio così... Ehm...\n@c0@"
  ja: "@a@bビアンカ「だーめっ！\n\tお母さんたちが　冒険したのは\n\tちゃんと用があったからなの！\n@c0@"
139:
  de: "@a%0%a001240@bOh!\n@c0@"
  en: "@a%0%a001240@bHuh!\n@c0@"
  es: "@a%0%a001240@b¡Mmm!\n@c0@"
  fr: "@a%0%a001240@bPfffⓠ\n@c0@"
  it: "@a%0%a001240@bSarà anche vero, ma non l'hai detto in maniera molto convinta...\n@c0@"
  ja: "@a@b%a001240「ぶー……。\n@c0@"
140:
  de: "@a%0%a001250@bIch kann die kleinen Vögel zwitschern hören. Sie sagen, dass alles in Ordnung ist hier im Schloss.\n@c0@"
  en: "@a%0%a001250@bI can hear the little birds singing. They're saying that all is well here at the castle now.\n@c0@"
  es: "@a%0%a001250@bOigo a los pajaritos cantar. Dicen que todo va bien ahora en el castillo.\n@c0@"
  fr: "@a%0%a001250@bJ'entends les petits oiseaux qui chantent. Ils disent que tout va bien au château, maintenant.\n@c0@"
  it: "@a%0%a001250@bGli uccellini stanno cantando!\nDicono che ora al castello le cose vanno bene!\n@c0@"
  ja: "@a@b%a001250「小鳥さんが　歌ってるよ。\n\tこのお城は　もう\n\tだいじょうぶ　なんだって。\n@c0@"
141:
  de: "@aSancho@bIss kann nisst glauben, dass du und Bianca damals ganz alleine die Stadt verlassen habt, Chico.\n@c0@"
  en: "@aSancho@bI no believe you and Bianca, you went out of the town alone like thees all those years ago, friend.\n@c0@"
  es: "@aSancho@bNo puedo creer que tú y Bianca os fuerais de la ciudad solos hace tantos años, chamaco.\n@c0@"
  fr: "@aSancho@bJe n'arrive toujours p-pas à croire qu'à l'époque, B-B-Bianca et toi, vous aviez quitté la v-ville tout seuls comme ça, chico.\n@c0@"
  it: "@aSancho@bNo riesco a credere que tu y la señorita Bianca usciste dal villaggio da solo cuando eravate piccolos... ¡Foste muy incoscientes!\n@c0@"
  ja: "@a@bサンチョ「まあ　今となっては\n\t怒るわけにも　いきませんが……\n@c0@"
142:
  de: "@aSancho@bAber es ist in Ordnung. Jetzt es ist zu spät, um wütend zu sein, no? Und du bist ja auch keine kleine Muchacho mehr.\n@c0@"
  en: "@aSancho@bBut ees okay. Ees no esometheeng to be angry about now. Ees too long ago. And you are no the boy you were then.\n@c0@"
  es: "@aSancho@bPero no me voy a enojar por eso ahora. Ya hace chorrocientos años de eso. Y tú ya no eres un chamaquito.\n@c0@"
  fr: "@aSancho@bMais ça va. Je ne vais pas me mettre en c-colère. C'est du p-passé, maintenant. Tu n'es plus le muchacho que tu étais.\n@c0@"
  it: "@aSancho@bAh, todo es bien quello que finisce bien.\nL'importante es que no ve sia successo nada...\n㈡\n¡Y que %a001240 y %a001250 no prendano esempio da uno sconsiderato como ti!\n@c0@"
  ja: "@a@bサンチョ「子供がふたりで　町の外を\n\t出歩くなんて…　このサンチョは\n\t想像だに　しませんでしたよ。\n@c0@"
143:
  de: "@aSancho@bIss bin nie mit Señor Ludwig an diese Ort gewesen. Iss habe das Castillo immer für eine Ruine gehalten.\n@c0@"
  en: "@aSancho@bI never came to thees place weeth señor Pankraz. I believed ees just an old ruin.\n@c0@"
  es: "@aSancho@bNunca pasé por aquí con el señor Teudis. Creía que eran solo ruinas viejas nomás.\n@c0@"
  fr: "@aSancho@bJe ne suis jamais v-venu ici avec le señor P-Petros. Je croyais que ce n'étaient que des r-ruines.\n@c0@"
  it: "@aSancho@bYo no sono mai venuto aquí con el señor Russel.\nPiensavo que ce fossero solo vecchias rovinas...\n@c0@"
  ja: "@a@bサンチョ「ここには　パパスさまとは\n\t来ませんでしたね。\n\t何もない古城と　聞いていましたから。\n@c0@"
144:
  de: "@aOtto@bGibt es hier Geister?\n@c0@"
  en: "@aTuppence@bAre there ghosts here?\n@c0@"
  es: "@aAlazar@b¿Hay fantasmas aquí?\n@c0@"
  fr: "@aInnocent@bIl y a des fantômes iciⓡ\n@c0@"
  it: "@aSimon@bMa qui ci sono degli spettri?\n@c0@"
  ja: "@a@bピピン「ここって　ゆうれいが\n\t出たんですか？\n@c0@"
145:
  de: "@aOtto@bWenn es denn so sein sollte, würde ich am liebsten einem hübschen weiblichen Geist begegnen...\n@c0@"
  en: "@aTuppence@bI suppose I'd consider a beautiful female ghost if I had to. You can't accuse me of being closed-minded.\n@c0@"
  es: "@aAlazar@bSupongo que, en caso de necesidad, no estaría mal una fantasmita bien guapa. No se puede decir que sea estrecho de miras.\n@c0@"
  fr: "@aInnocent@bRemarquez, je pourrais tout à fait m'accommoder d'une jolie fantôme. Ah, on ne pourra pas m'accuser de ne pas avoir les idées larges.\n@c0@"
  it: "@aSimon@bMi spiace, ma i fantasmi non mi stanno molto simpatici.\nNemmeno se sono fantasmi donna e di bell'aspetto!\n@c0@"
  ja: "@a@bピピン「ゆうれいでも　美人だったら\n\t考えてもいいなあ。\n\tボク　心は広いですから。\n@c0@"
146:
  de: "@aBianca@bIch schätze, dass es die bösen Geister waren, die den Ort damals so gruselig gemacht haben. Jetzt habe ich kein bisschen Angst, selbst nachts nicht.\n@c0@"
  en: "@aBianca@bI reckon it was the bad ghosts that made it so scary last time. Walkin' around now, even of a night, dun't scare me at all.\n@c0@"
  es: "@aBianca@bCreo que la culpa de que diese tanto miedo entonces era de los fantasmas malos. Ahora no me da ningún miedo pasar por aquí, ni de noche, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que c'étaient les méchants fantômes qui rendaient cet endroit si terrifiant, autrefois.\n㈡\nAujourd'hui, ça ne me fait plus peur de m'y promener, même la nuit.\n@c0@"
  it: "@aBianca@bErano gli spettri cattivi a rendere questo posto sinistro e minaccioso.\nVenirci ora non mi fa alcun effetto.\n@c0@"
  ja: "@a@bビアンカ「あの時こわかったのは\n\t悪いお化けたちが　いたからなのかな？\n\t今はこうして夜来ても　平気だもんね。\n@c0@"
147:
  de: "@aNera@bDu und Bianca wart bereits als Kinder hier, nicht? Ich wünschte, ich wäre dabei gewesen.\n@c0@"
  en: "@aNera@bYou and Bianca came adventuring here in the middle of the night once, didn't you? I wish I'd been there.\n@c0@"
  es: "@aNera@bTú y Bianca vinisteis aquí una vez de aventuras durante la notte, ¿vero? Me hubiera gustado estar allí.\n@c0@"
  fr: "@aNera@bAutrefois, Bianca et toi étiez venus ici en plein milieu de la nuit, c'est çaⓡ J'aurais bien aimé être là.\n@c0@"
  it: "@aNera@bTu e Bianca veniste qui da soli, nel cuore della notte, eh?!\nAvrei voluto essere al posto suo... Argh!\n㈡\nNon sono gelosa.\nNon sono gelosa!\nNon sono gelosaaa!!!\n@c0@"
  ja: "@a@bフローラ「昔　あなたとビアンカさんが\n\tここを　夜中に冒険したのよね。\n\t私　本当に　うらやましかったわ。\n@c0@"
148:
  de: "@a%0%a001240@bIch finde, dass %a001250 und ich groß genug sind, um solch einen Ort alleine zu erkunden!\n@c0@"
  en: "@a%0%a001240@bI reckon %a001250 and I are big and brave enough to explore somewhere like this on our own!\n@c0@"
  es: "@a%0%a001240@b¡Yo creo que %a001250 y yo ya somos lo suficientemente mayores y valientes como para explorar un sitio así nosotros solos!\n@c0@"
  fr: "@a%0%a001240@bÀ mon avis, %a001250 et moi, on est assez grands et assez courageux pour explorer un endroit comme celui-là tout seulsⓠ\n@c0@"
  it: "@a%0%a001240@bCredo proprio che io e %a001250 siamo grandi abbastanza da esplorare un posto del genere da soli...\n㈡\nUhm, forse no.\nSarà anche mia sorella gemella, ma %a001250 è ancora troppo piccola per queste cose!\n@c0@"
  ja: "@a@b%a001240「このお城くらいだったら\n\tボクと%a001250だけで　冒険できるよ\n\tきっと！\n@c0@"
149:
  de: "@a%0%a001250@bAls du ein kleiner Junge warst, waren hier bestimmt eine Menge böser Geister, nicht wahr? Wie gruselig!\n@c0@"
  en: "@a%0%a001250@bWhen you were here as a boy, there were lots of evil ghosts, weren't there? How scary!\n@c0@"
  es: "@a%0%a001250@bCuando viniste aquí de niño había un montón de fantasmas malos, ¿a que sí? ¡Qué miedo!\n@c0@"
  fr: "@a%0%a001250@bLorsque tu es venu ici quand tu étais petit, il y avait plein de méchants fantômes, nonⓡ Ça devait être horribleⓠ\n@c0@"
  it: "@a%0%a001250@bMa è vero che qui tanto tempo fa c'erano moltissimi fantasmi malvagi?!\nIo sarei morta dalla paura!\n㈡\nRipensandoci, sarebbe stata la cosa sbagliata da fare. Se fossi morta, sarei diventata io stessa uno spettro e mi sarei spaventata da sola per l'eternità!\n@c0@"
  ja: "@a@b%a001250「お父さんが　ここを\n\t冒険したときって　悪いお化けさんが\n\t出たんでしょ？　こわくなかった？\n@c0@"
150:
  de: "@aSancho@bDu und Bianca, ihr seid mitten in die Nacht hierher gekommen, si? Dabei warst du erst eine kleine Muchacho...\n@c0@"
  en: "@aSancho@bYou and Bianca, you came here to thees place een the middle of the night, sí? When you were just a leettle boy.\n@c0@"
  es: "@aSancho@bTú y Bianca estuvisteis aquí en mitad de la noche, ¿no es eso? Entonces no eras más que un chamaquito.\n@c0@"
  fr: "@aSancho@bB-Bianca et toi étiez v-venus explorer cet endroit en pleine n-nuit, noⓡ Quand v-vous étiez des muchachos.\n@c0@"
  it: "@aSancho@bTu y la señorita Bianca veniste aquí da solo cuando eravate piccoli, de nascostos da todos.\n@c0@"
  ja: "@a@bサンチョ「夜中に　ビアンカさんとふたりで\n\tここを　冒険したそうですね。\n@c0@"
151:
  de: "@aSancho@bWeißt du, iss habe geglaubt, dass du eine brave, kleine Niño warst, aber no. Du bist wirkliss der Sohn von Señor Ludwig. Iss bin ja so glückliss!\n@c0@"
  en: "@aSancho@bYou know, I believed you were a well-behaved young boy, but no. You are truly the eson of señor Pankraz. I, I am eso happy!\n@c0@"
  es: "@aSancho@bYo creía que eras un chamaquito obediente, pero no: en verdad eras el hijo del señor Teudis. ¡Qué padrísimo!\n@c0@"
  fr: "@aSancho@bTu sais quoiⓡ Je croyais que tu étais oun petit\ng-garçon bien sage, mais non. Tu es le digne\nfils du señor P-Petros. J-Je suis si contentⓠ\n@c0@"
  it: "@aSancho@b¡Fino a quel momentos, yo ero convinto que tu fossi un bambino tranquillo, ma me esbagliavo! Eri già muy coraggioso y fuerte... ¡Y anche incosciente!\n@c0@"
  ja: "@a@bサンチョ「おっとりした子だと\n\t思っていましたのに　やはり\n\tパパスさまのお子だと感心しましたよ。\n@c0@"
152:
  de: "@aOtto@bBrrr... Ein bisschen frisch hier, net wahr? Oh... Bin ich etwa der Einzige, der friert?\n@c0@"
  en: "@aTuppence@bBrrr... There's a bit of a chill in the air here. Oh...\r\nI'm the only one feeling it, am I?\n@c0@"
  es: "@aAlazar@bBrrr... Hace un poquillo de fresco aquí... Vaya, ¿soy el único que lo nota?\n@c0@"
  fr: "@aInnocent@bBrrr... Le fond de l'air est frais, ici. Oh... Je suis le seul à le sentir, c'est çaⓡ\n@c0@"
  it: "@aSimon@bOh, che freddo che c'è qui dentro!\r\nEhm... Forse non sto tremando per il freddo, ma per la paura!\n@c0@"
  ja: "@a@bピピン「ううっ……\n\tここ　寒気がしますよね。\n\tえっ？　ボクだけですか？？\n@c0@"
153:
  de: "@aBianca@bIch kann nichts Unheimliches feststellen. Wie beruhigend.\n@c0@"
  en: "@aBianca@bI can't sense anything sinister here now.\nThat's a relief.\n@c0@"
  es: "@aBianca@bNo noto nada siniestro aquí ahora mismo.\n¡Qué alivio!\n@c0@"
  fr: "@aBianca@bLe château ne donne plus cette sensation sinistre, aujourd'hui. C'est rassurant. \n@c0@"
  it: "@aBianca@bL'atmosfera è così tranquilla...\n@c0@"
  ja: "@a@bビアンカ「邪悪な気配は\n\t感じられないわね。　良かった。\n@c0@"
154:
  de: "@a%0%a001240@bEs wäre bestimmt klasse, diesen Ort mit anderen Kindern in meinem Alter zu erkunden.\n@c0@"
  en: "@a%0%a001240@bIt'd be really fun to come exploring here just with kids of my own age.\n@c0@"
  es: "@a%0%a001240@bQué divertido sería venir a explorar aquí con niños de mi edad.\n@c0@"
  fr: "@a%0%a001240@bCe serait vraiment marrant d'explorer ce château avec des copains de mon âge.\n@c0@"
  it: "@a%0%a001240@bSarebbe bellissimo se potessi venire a giocare qui con dei bambini della mia età...\nCi divertiremmo un mondo!\n@c0@"
  ja: "@a@b%a001240「あ～あ…　ボクも\n\tこういうところ　子供だけで\n\t冒険できたらなあ。\n@c0@"
155:
  de: "@aBianca@bSieht ein bisschen sauberer aus als letztes Mal, stimmt's? Vielleicht haben die beiden Turteltauben ja aufgeräumt...\n@c0@"
  en: "@aBianca@bThe place looks a bit tidier than the last time\r\nwe came, eh? Maybe those two lovebirds\r\nfixed it up a bit.\n@c0@"
  es: "@aBianca@bEsto está más limpito que la última vez, ¿eh? A lo mejor aquellos tortolitos se decidieron arreglarlo un poco.\n@c0@"
  fr: "@aBianca@bCet endroit semble plus propre que la dernière fois. Peut-être que nos deux tourtereaux ont fait quelques réparations.\n@c0@"
  it: "@aBianca@bHanno fatto ordine qui dentro, eh?\nLa prima volta che venimmo qui era un vero macello...\n@c0@"
  ja: "@a@bビアンカ「前に来たときより　このお城\n\t少しだけ　きれいになってない？\n\tあの恋人たちが　そうじしたのかな？\n@c0@"
156:
  de: "@aBianca@bEs war gut, dass wir vor all den Jahren %a001210 gerettet haben, indem wir hierher gekommen sind. Ohne dich hätt' ich das nie geschafft, %a000090.\n@c0@"
  en: "@aBianca@bWe did a good job of rescuin' %a001210 by comin' here all those years back. I couldn't have done it without you, %a000090.\n@c0@"
  es: "@aBianca@bEl rescate de %a001210, cuando vinimos aquí hace años, nos salió muy bien. No hubiera podido hacerlo sin ti, %a000090.\n@c0@"
  fr: "@aBianca@bNous nous étions bien débrouillés lorsque nous avions sauvé %a001210 en venant ici. Je n'aurais pas pu le faire sans toi, %a000090.\n@c0@"
  it: "@aBianca@bSenza di te, non sarei mai riuscita a sconfiggere gli spettri e a salvare %a001210.\nFosti davvero gentile ad aiutarmi, %a000090.\n@c0@"
  ja: "@a@bビアンカ「しかし　あの時は　%a001210を\n\t助けるためとはいえ　よくできたわよ。\n\t%a000090が　来てくれたおかげね。\n@c0@"
157:
  de: "@aNera@bAlte Gemäuer riechen immer so seltsam. Vielleicht ist es ja nur Schimmel... Aber eigentlich riecht es gar nicht so schlecht.\n@c0@"
  en: "@aNera@bOld buildings always have a certain smell to them. Maybe it's just mould, I don't know. But it's not a\r\nbad smell.\n@c0@"
  es: "@aPlease do not copy or print this pag@bLos edificios antiguos siempre tienen un olor speziale. Como a moho, o algo parecido. No es desagradable.\n@c0@"
  fr: "@aNera@bLes vieilles maisons ont toujours une certaine odeur. C'est peut-être l'humidité, je ne sais pas trop.\r\nMais ce n'est pas une odeur désagréable.\n@c0@"
  it: "@aNera@bSento odore di muffa. Questo castello è molto bello, ma dovrebbero ventilare meglio gli ambienti.\r\nO almeno usare un buon deodorante!\n@c0@"
  ja: "@a@bフローラ「古い建物　特有のにおいが\n\tしますわね。　カビくさいというか…\n\tでもこのニオイ　嫌いじゃないですわ。\n@c0@"
158:
  de: "@aNera@bIch würde glatt umkommen vor Sorge, wenn ich wüsste, dass %a001240 und %a001250 hier allein rumstreifen.\n@c0@"
  en: "@aNera@bI can't imagine how worried I'd be at the thought of %a001240 and %a001250 here all alone.\n@c0@"
  es: "@aNera@bSolo de pensar en %a001240 y %a001250 aquí solos me muero veramente de inquietud.\n@c0@"
  fr: "@aNera@bJe n'imagine même pas combien je serais inquiète si %a001240 et %a001250 venaient là seuls.\n@c0@"
  it: "@aNera@bSe %a001250 e %a001240 venissero qui da soli, li manderei a letto senza cena fino al raggiungimento della maggiore età!\n@c0@"
  ja: "@a@bフローラ「もし　このお城を冒険したのが\n\t%a001240と%a001250だったらと思うと\n\t気が気ではありませんわ。\n@c0@"
159:
  de: "@aNera@bDu wärst doch auch besorgt, oder? So muss Ludwig sich gefühlt haben, als du als kleiner Junge hierher kamst.\n@c0@"
  en: "@aNera@bYou'd be worried too, right? That's probably just how Pankraz felt when you came here as a boy.\n@c0@"
  es: "@aNera@bTú también estarías preocupado, ¿vero? Eso es lo que debía sentir Teudis cuando viniste aquí de niño.\n@c0@"
  fr: "@aNera@bTu serais inquiet toi aussi, nonⓡ C'est sans doute ce que Petros a ressenti quand tu es venu ici tout seul.\n@c0@"
  it: "@aNera@bImmagino che concordi con me che un bambino non dovrebbe venire da solo in un posto del gener...\nAh, sto parlando con la persona sbagliata...\n@c0@"
  ja: "@a@bフローラ「あなたも　同じ想いでしょ？\n\tお父さまのパパスさまも\n\t同じ想いだったと　思いますわ。\n@c0@"
160:
  de: "@a%0%a001240@bSind die bösen Geister eigentlich alle weg? Falls nicht, werd' ich's ihnen schon zeigen!\n@c0@"
  en: "@a%0%a001240@bAre all the bad ghosts gone now? If I see any, I'll soon send them packing!\n@c0@"
  es: "@a%0%a001240@b¿Se han ido ya todos los fantasmas malos? ¡Como vea uno, se va a enterar!\n@c0@"
  fr: "@a%0%a001240@bTous les méchants fantômes sont partis, maintenantⓡ Si j'en vois un, il a pas intérêt\nà traîner trop longtemps par iciⓠ\n@c0@"
  it: "@a%0%a001240@bTutti i fantasmi malvagi sono andati via, non è vero? Peccato! Se ne avessi incontrato uno l'avrei fatto diventare il fantasma di un fantasma!\n@c0@"
  ja: "@a@b%a001240「悪いお化け　もういないのかな？\n\tいたら　ボクが　やっつけてやるのに！\n@c0@"
161:
  de: "@a%0%a001240@bSieh nur! Da ist ein riesiges Spinnennetz. Ist es nicht großartig?\n@c0@"
  en: "@a%0%a001240@bLook! There's a huge spider's web up there. Wow!\nIt looks amazing.\n@c0@"
  es: "@a%0%a001240@b¡Mira qué telaraña más grande hay ahí! ¡Es genial!\n@c0@"
  fr: "@a%0%a001240@bRegardeⓠ Il y a une grosse toile d'araignée là-haut. Waouhⓠ C'est impressionnantⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto posto è una favola!\nCi vorrebbero settimane per esplorarlo tutto!\n@c0@"
  ja: "@a@b%a001240「見て！　あんなところに\n\tおっきなクモの巣があるよ。\n\tきれいだねー。\n@c0@"
162:
  de: "@a%0%a001240@bIn Humburg gibt es keine Geister. Leider...\nDas wär echt spaßig!\n@c0@"
  en: "@a%0%a001240@bWe don't have any ghosts in Gotha.\nIt would be fun if we did.\n@c0@"
  es: "@a%0%a001240@bEn Pankraz no hay ningún fantasma.\n¡Qué pena!, sería divertido.\n@c0@"
  fr: "@a%0%a001240@bOn n'a pas de fantômes à Gotha. Ce serait drôle\ns'il y en avait.\n@c0@"
  it: "@a%0%a001240@bA Denim non ci sono fantasmi, che io sappia.\nSarebbe divertente se ce ne fosse almeno uno, così potrei dargli la caccia!\n@c0@"
  ja: "@a@b%a001240「グランバニアには\n\tゆうれい　いないよね。\n\tいたら　おもしろいのになあ。\n@c0@"
163:
  de: "@a%0%a001240@bIch glaube, wenn wir hier Verstecken spielen würden, hättest du keine Chance gegen mich.\n@c0@"
  en: "@a%0%a001240@bI reckon I could stay undiscovered here for ages if we had a game of hide-and-seek.\n@c0@"
  es: "@a%0%a001240@bSeguro que, si jugase al escondite aquí, no me encontrarían en un siglo.\n@c0@"
  fr: "@a%0%a001240@bJe suis sûr que personne ne me trouverait\nsi on faisait une partie de cache-cache.\n@c0@"
  it: "@a%0%a001240@bSe giocassimo a nascondino qui dentro, non mi troverebbero mai!\n@c0@"
  ja: "@a@b%a001240「ボク　ここで　かくれんぼしたら\n\t絶対に　見つからない自信あるよ！\n@c0@"
164:
  de: "@a%0%a001250@bDas Schloss ist gar nicht unheimlich. Na ja, die ganzen bösen Geister sind ja auch nicht mehr da.\n@c0@"
  en: "@a%0%a001250@bThis castle's not scary. Not now all the nasty ghosts have gone away.\n@c0@"
  es: "@a%0%a001250@bEste castillo no da ningún miedo, ahora que los fantasmas malvados se han ido.\n@c0@"
  fr: "@a%0%a001250@bCe château ne fait pas peur. Surtout maintenant que tous les méchants fantômes sont partis.\n@c0@"
  it: "@a%0%a001250@bCredevo che questo castello avesse un'atmosfera più sinistra... Forse i fantasmi cattivi se la sono portata via con loro quando l'hanno abbandonato...!\n@c0@"
  ja: "@a@b%a001250「このお城　こわくないの。\n\t悪いお化けさん　もう　いないから。\n@c0@"
165:
  de: "@a%0%a001250@bHier gibt es so viele Treppen und Flure. Da kann man sich bestimmt leicht verlaufen.\n@c0@"
  en: "@a%0%a001250@bThere are so many stairs and corridors here.\nI'm worried I'm going to get lost.\n@c0@"
  es: "@a%0%a001250@bHay muchas escaleras y pasillos aquí.\nMe da un poco de miedo perderme.\n@c0@"
  fr: "@a%0%a001250@bIl y a tellement d'escaliers et de couloirs ici...\nJ'ai peur de me perdre.\n@c0@"
  it: "@a%0%a001250@bQuesto posto è pieno di scale e di corridoi...\nSe non stiamo attenti, finiremo per perderci!\n@c0@"
  ja: "@a@b%a001250「このお城　階段とか\n\tろうかが　いっぱいね。\n\t迷子に　なっちゃいそう……。\n@c0@"
166:
  de: "@a%0%a001250@bDu hast damals gute Arbeit geleistet, Papa. Die Leute sind dir sehr dankbar.\n@c0@"
  en: "@a%0%a001250@bYou did well here, Dad. The people seem really grateful to you.\n@c0@"
  es: "@a%0%a001250@bDebiste de hacer algo bueno aquí, papá. Parece que la gente te está muy agradecida.\n@c0@"
  fr: "@a%0%a001250@bC'est bien ce que tu as fait ici, papa. Les gens te sont tous vraiment reconnaissants.\n@c0@"
  it: "@a%0%a001250@bPapà, dobbiamo restare qui ancora molto tempo?\n@c0@"
  ja: "@a@b%a001250「お父さん　えらかったんだね。\n\tこのお城にいた人たち　みんな\n\tありがとうって　言ってるよ。\n@c0@"
167:
  de: "@a%0%a001250@bMeine Lieblingsburg ist natürlich Humburg. Da sind ja alle meine Freunde. Und wärmer ist es dort auch.\n@c0@"
  en: "@a%0%a001250@bMy favourite castle of all is Gotha, of course. That's where all my friends are. And it's much warmer than here too.\n@c0@"
  es: "@a%0%a001250@bMi castillo favorito es el de Pankraz, claro. Todos mis amigos están allí. Y, además, hace mucho más calor.\n@c0@"
  fr: "@a%0%a001250@bMon château préféré, c'est celui de Gotha. C'est là que sont tous mes amis. En plus, il fait bien plus chaud qu'ici.\n@c0@"
  it: "@a%0%a001250@bQuesto castello è bellissimo, ma preferisco quello di Denim. Lì conosco tante persone, e poi fa anche meno freddo!\n@c0@"
  ja: "@a@b%a001250「私　お城は　やっぱり\n\tグランバニアが　いちばん好き。\n\tみんなもいるし　あったかいもん。\n@c0@"
168:
  de: "@aSancho@bDas ist wirkliss eine große Castillo, no? Es ist wie eine gigantische Paella. Schade, dass wir schon gehen müssen...\n@c0@"
  en: "@aSancho@bYou no theenk ees a really beeg castle?\r\nEes like a giant paella. Ees a waste\r\nto leave eet.\n@c0@"
  es: "@aSancho@bEs un castillo enorme nomás, como una enchilada gigante. Qué pena tener que irse.\n@c0@"
  fr: "@aSancho@bT-Tu ne trouves pas que c'est oun castel vraiment gigantesqueⓡ C'est comme oune énorme paella.\nC'est du g-gâchis de laisser ça.\n@c0@"
  it: "@aSancho@b¡Caramba, que castillo grande!\nAnzi...\n¡Caramba, que castillo gigantesco!\n@c0@"
  ja: "@a@bサンチョ「こうして　歩いてみると\n\tいやはや　本当に大きなお城ですねえ。\n\tほうっておくのは　もったいないです。\n@c0@"
169:
  de: "@aSancho@bWenn man diese Castillo wieder aufbauen wollte, bräuchte man viel, viel Zeit, no? Si. Viele, viele Jahre.\n@c0@"
  en: "@aSancho@bTo restore thees castle to eets former glory, ees gonna take muchos, muchos time, eh?\r\nSí. Many, many years.\n@c0@"
  es: "@aSancho@bPara que el castillo vuelva a su gloria de antes, van a tener que pasar siglos, ¿eh?\nMucho, mucho tiempo.\n@c0@"
  fr: "@aSancho@bPour r-restaurer ce castel, il faudrait muchas muchas années, heinⓡ Si. Beaucoup de tiempo.\n@c0@"
  it: "@aSancho@bPor reportare esto castillo al suo esplendore originario servirebbe mucho tiempo...\r\n¡Y muchissimo dinero!\n@c0@"
  ja: "@a@bサンチョ「このお城を修理して\n\tもとのきれいな状態にもどすには…\n\tはて　何年かかることやら。\n@c0@"
170:
  de: "@aOtto@bOtto-Schloss... Nein, das hört sich net wichtig genug an. Schloss von Otto dem Großen? Hmm... Irgendwann fällt mir noch was ein...\n@c0@"
  en: "@aTuppence@bTuppence Castle... No, not grand enough. Great Tuppence Castle? Hmm... I know! I could call it Tupptaten Towers!\n@c0@"
  es: "@aAlazar@bCastillo Alazar... No, no suena lo bastante imponente. ¿Gran Castillo Alazar? Mmm... ¡Ya sé! ¡Lo llamaré Torres Alazar!\n@c0@"
  fr: "@aInnocent@bChâteau d'Innocent... Non, ce n'est pas encore assez. Le Grand château d'Innocentⓡ Mmm... Je saisⓠ\nLes Tours d'Innopattⓠ\n@c0@"
  it: "@aSimon@bⓕCastello di Simonⓖ. No, forse è meglio ⓕManiero di Sir Simonⓖ.\nSì, direi che suona proprio bene.\n@c0@"
  ja: "@a@bピピン「ピピン城…　いや地味だな。\n\tグレートピピン城……？\n\tキャッスル・オブ・ピピン……\n@c0@"
171:
  de: "@aOtto@bTschuldigung! Ich habe nur überlegt, welchen Namen ich meinem zukünftigen Schloss geben könnt'.\n@c0@"
  en: "@aTuppence@bSorry! I was just trying to figure out what name I'll give my castle in the future.\n@c0@"
  es: "@aAlazar@b¡Lo siento! Estaba pensando en cómo iba a llamar a mi futuro castillo.\n@c0@"
  fr: "@aInnocent@bDésoléⓠ J'essayais juste de trouver un nom pour mon futur château. \n@c0@"
  it: "@aSimon@bMaestà, mi donerebbe un castello come ricompensa per il prezioso aiuto che le sto fornendo?\nChiedo troppo?\n@c0@"
  ja: "@a@bピピン「いえ　将来　ボクの城に\n\tどんな名前をつけようか\n\tさっきから　考えてるんです。\n@c0@"
172:
  de: "@aOtto@bPasst auf, wo Ihr hintretet, ja, %a000090? Diese Dielenbretter sind an manchen Stellen vielleicht etwas morsch...\n@c0@"
  en: "@aTuppence@bWatch where you're walking, won't you, %a000090? The floorboards might be a bit weak in places.\n@c0@"
  es: "@aAlazar@bCuidado por dónde pisáis, ¿eh, %a000090? Hay sitios en que el suelo podría ceder.\n@c0@"
  fr: "@aInnocent@bFaites attention où vous mettez les pieds, %a000090ⓠ Ce plancher me semble un peu fatigué par endroits.\n@c0@"
  it: "@aSimon@bFaccia attenzione a dove mette i piedi, Maestà! Non mi pare che il pavimento sia in ottime condizioni...\nNon vorrei scendere di sotto senza usare le scale!\n@c0@"
  ja: "@a@bピピン「%a000090さま　足もとに\n\t気をつけてくださいね。　いつ\n\t床がぬけても　おかしくないですよ。\n@c0@"
173:
  de: "@aGriselda@bDie Stadt ist ja ein bisschen mickrig, aber immerhin gibt es hier ein paar Geschäfte, also ist es nicht so übel.\n@c0@"
  en: "@aDebora@bIt's a bit of a small town, but it has a few shops, so it's not so bad.\n@c0@"
  es: "@aStefania@bEste sitio es un po' piccolo, ma tiene unas cuantas tiendas... No está mal.\n@c0@"
  fr: "@aPandora@bC'est une petite ville, mais il y a quelques magasins, alors ça n'est pas trop mal.\n@c0@"
  it: "@aViola@bIl villaggio è tutt'altro che grande.\nSperiamo che ci sia qualche negozio alla moda...\n@c0@"
  ja: "@a@bデボラ「小さい町だけど\n\tお店はひととおり　そろっているし\n\tまあ　悪くはないわね。\n@c0@"
174:
  de: "@aGriselda@bWenn du hier etwas erledigen musst, bitte schön, aber wenn es nur ein Nostalgietrip ist, dann wird er wohl warten müssen, bis das alles vorbei ist.\n@c0@"
  en: "@aDebora@bIf there are things you need to do here, that's fair enough, but if this is just a trip down memory lane, you'll have to wait until it's all over.\n@c0@"
  es: "@aStefania@bSi tienes cosas que hacer aquí, va bene, ma si solo es nostalgia, deja la nostalgia para más tarde.\n@c0@"
  fr: "@aPandora@bSi tu as des choses à faire ici, très bien, mais s'il ne s'agit que d'une promenade sentimentale dans le passé, tu vas devoir attendre que tout soit terminé.\n@c0@"
  it: "@aViola@bSe hai qualcosa da fare qui, accomodati pure, ma se sei venuto solo per ricordare il passato, ti chiederei di rinviare a tempi migliori...\n@c0@"
  ja: "@a@bデボラ「この町に　用があるならともかく…\n\t思い出にひたるだけなら　後にしてね。\n\t全部終わったら　また来ればいいのよ。\n@c0@"
175:
  de: "@aGriselda@bLeute wie er verschwinden immer als Erste, wenn es brenzlig wird...\n@c0@"
  en: "@aDebora@bPeople like him are always the first to do a runner when the going gets tough.\n@c0@"
  es: "@aStefania@bLas personas come él son las primeras que salen corriendo cuando el asunto pone feo.\n@c0@"
  fr: "@aPandora@bLes gens comme lui sont toujours les premiers à prendre leurs jambes à leur cou quand les choses\r\nse corsent.\n@c0@"
  it: "@aViola@bA sentire come parla sembrerebbe un tipo coraggioso, ma non vorrei fosse il classico fanfarone che se la dà a gambe di fronte al primo pericolo.\n@c0@"
  ja: "@a@bデボラ「こういうことを　言う男にかぎって\n\tいちばん最初に　逃げ出すのよね。\n@c0@"
176:
  de: "@aGriselda@bDa hat er aber Glück gehabt, dass er nach seiner Desertation wieder Soldat werden durfte!\n㈡\nDer Herrscher von Tifortu muss noch viel nachsichtiger sein, als ich es bin.\n@c0@"
  en: "@aDebora@bHe was lucky to be forgiven if he deserted the army! The ruler of Coburg must be a more lenient soul than I am.\n@c0@"
  es: "@aStefania@b¡Si desertó del ejército, tuvo buona fortuna de que le perdonasen! El líder de Trastámara debe de ser más benévolo que io.\n@c0@"
  fr: "@aPandora@bIl a eu de la chance d'être pardonné s'il a déserté l'arméeⓠ Le dirigeant de Cobourg est bien plus indulgent que moi.\n@c0@"
  it: "@aViola@bUn disertore?! Non ho alcun rispetto per chi abbandona la propria patria! Quel tipo meriterebbe di finire in galera per trent'anni, come minimo!\n@c0@"
  ja: "@a@bデボラ「兵士だった時に　脱走をしたなんて\n\tよく　許されたわね。　よほど\n\t人のいい　王さまなんじゃない。\n@c0@"
177:
  de: "@aOtto@bÄhm, warum schaut Ihr mich jetzt an? Ich habe nicht vor, zu desertieren.\n@c0@"
  en: "@aTuppence@bEr, wh-why are you looking at me when you say that? I have n-no intention of deserting.\n@c0@"
  es: "@aAlazar@bEhhh, ¿por qué me miras así mientras dices eso? Yo no tengo intención de desertar.\n@c0@"
  fr: "@aInnocent@bEuh, pourquoi vous me regardez comme ça en disant çaⓡ Je n'ai pas l'intention de déserter.\n@c0@"
  it: "@aSimon@bSono d'accordo con lei, regina Viola.\nMa si può sapere perché mi guarda in quel modo?!\nIo non ho alcuna intenzione di disertare...\n@c0@"
  ja: "@a@bピピン「ど　どうしてそこで　こっちを\n\t見るんですか！？　デボラ様。\n\tボクは　脱走なんかしませんからっ。\n@c0@"
178:
  de: "@aGriselda@bEs wäre wohl etwas viel für ihn, wenn wir ihm deinen Stammbaum und meine zenithianischen Wurzeln erklären würden...\n@c0@"
  en: "@aDebora@bI should think he'd be a bit overwhelmed if we told him about your bloodline and about me being descended from the Zenithians.\n@c0@"
  es: "@aStefania@bCredo que se quedaría abrumado al saber de tu linaje y de mi ascendencia de Zenithia.\n@c0@"
  fr: "@aPandora@bIl risquerait d'être un peu dépassé si on lui parlait de ta lignée et du fait que je suis une descendante des Zénithiens.\n@c0@"
  it: "@aViola@bScommetto che resterebbe a bocca aperta se le dicessimo da quale stirpe discendi e che io ho sangue zenithiano nelle vene ...\n@c0@"
  ja: "@a@bデボラ「%a000090が　その血をひいていて\n\t私が　天空の子孫とか…\n\tぐうぜんと言うには　できすぎよね。\n@c0@"
179:
  de: "@aGriselda@bMit so etwas Trivialem wie Kochen muss ich mich glücklicherweise nicht beschäftigen. Wozu gibt es Köche?\n@c0@"
  en: "@aDebora@bI don't need to bother myself with cooking.\nThat's what people have chefs for.\n@c0@"
  es: "@aStefania@bNo tengo por qué pensar en cucinare. Para eso están los chefs, ¿vero?\n@c0@"
  fr: "@aPandora@bJe n'ai pas besoin de m'ennuyer aux fourneaux. C'est pour ça que les gens ont des cuisiniers.\n@c0@"
  it: "@aViola@bNon so cucinare, e nemmeno voglio imparare a farlo.\nCi pensa il mio caro maritino a preparare da mangiare...\n@c0@"
  ja: "@a@bデボラ「私は　料理なんてしなくていいの。\n\t作るのは　シェフの仕事だから。\n@c0@"
180:
  de: "@a%0%a001240@bKannst du denn überhaupt nicht kochen, Mama? Ich würde gern mal etwas essen, das du gekocht hast.\n@c0@"
  en: "@a%0%a001240@bCan't you cook at all, Mum? I'd love to taste a homemade dish of yours, even just the once.\n@c0@"
  es: "@a%0%a001240@b¿No sabes cocinar nada, mami? Me encantaría probar un plato casero, solo una vez.\n@c0@"
  fr: "@a%0%a001240@bTu sais cuisiner, mamanⓡ J'adorerais goûter à un de tes plats maison, même rien qu'une fois.\n@c0@"
  it: "@a%0%a001240@bMamma, ma non sai cucinare proprio niente?\nMi piacerebbe assaggiare qualcosa preparato da te...\n@c0@"
  ja: "@a@b%a001240「えっ　お母さん　料理できないの？\n\tぼく…　１度でいいから　お母さんの\n\t手作りの料理　食べてみたかったな。\n@c0@"
181:
  de: "@aGriselda@bNatürlich kann ich kochen! Na, wenn du unbedingt möchtest, werde ich dir irgendwann mal etwas Leckeres zaubern.\n@c0@"
  en: "@aDebora@bOf course I can cook! I suppose I could make you something one day if you really want me to.\n@c0@"
  es: "@aStefania@b¡Claro que sé cocinar! Si tantas ganas tienes, supongo que podría preparar algo algún giorno.\n@c0@"
  fr: "@aPandora@bBien sûr que je sais cuisinerⓠ Je pourrais effectivement te préparer quelque chose un jour,\nsi tu en as vraiment envie.\n@c0@"
  it: "@aViola@bMa certo che so cucinare, %a001240!\nDimmi cosa vuoi che la tua mammina ti prepari, e io lo farò!\n@c0@"
  ja: "@a@bデボラ「あら　できないんじゃないのよ。\n\tまあ　%a001240が食べたいなら\n\tそのうち　何か　作ってあげるわ。\n@c0@"
182:
  de: "@a@bGriselda wirft %a000090 einen vielsagenden Blick zu. Sieht ganz so aus, als müsste er sich die Schürze umbinden...\n@c0@"
  en: "@a@bDebora gives %a000090 a meaningful glance.\nIt seems that he's going to be the one doing the cooking...\n@c0@"
  es: "@a@bStefania le echa a %a000090 una mirada de lo más significativa.\nParece que va a ser él quien cocine...\n@c0@"
  fr: "@a@bPandora lance à %a000090 un regard lourd de sens. Apparemment, c'est lui qui va devoir se coller à la cuisine...\n@c0@"
  it: "@a@bViola lancia a %a000090 uno sguardo d'intesa.\nScommettiamo che sarà lui a preparare il piatto desiderato da %a001240?\n@c0@"
  ja: "@a@bデボラは　ちらっと　%a000090を見た。\nどうやら　デボラの代わりに　料理を\n作ることに　なりそうだ……。\n@c0@"
183:
  de: "@aGriselda@bHier hat Bianca als kleines Mädchen gewohnt, nicht? Ein bisschen gewöhnlich für meinen Geschmack, aber es könnte schlimmer sein.\n@c0@"
  en: "@aDebora@bThis inn is where Bianca lived as a little girl, isn't it? It's a bit common for my tastes, but it could be worse, I suppose.\n@c0@"
  es: "@aStefania@bEn questa posada vivía Bianca cuando era bambina, ¿no? Es un po' vulgar para mi gusto, pero podría ser peor, credo.\n@c0@"
  fr: "@aPandora@bCette auberge est celle où Bianca vivait quand elle était enfant, nonⓡ C'est un peu quelconque à mon goût, mais ça pourrait être pire.\n@c0@"
  it: "@aViola@bQuesta è la locanda dove Bianca viveva quand'era piccola, vero? Non è un granché come posto, ma ne esistono di peggiori...\n@c0@"
  ja: "@a@bデボラ「この宿屋って　ビアンカが\n\t子供の頃に　住んでいた家だったのよね。\n\tしょみん的だけど　悪くないんじゃない。\n@c0@"
184:
  de: "@aGriselda@bEs riecht ziemlich gut. Das könnte der perfekte Hintergrund für ein schönes Mittagsschläfchen sein.\n@c0@"
  en: "@aDebora@bIt smells quite nice. Could be the perfect accompaniment to a nice afternoon siesta.\n@c0@"
  es: "@aStefania@b¡Huele que alimenta! Es ideale per una buona siesta.\n@c0@"
  fr: "@aPandora@bÇa sent très bon. Parfait pour accompagner une petite siesta d'après-midi.\n@c0@"
  it: "@aViola@bNon so se a te faccia lo stesso effetto, ma a me questo profumino fa venire sonno...\nYaaawn...\n@c0@"
  ja: "@a@bデボラ「けっこう　いいにおいがするのね。\n\tこのマクラを使って　お昼寝したら\n\t気持ちがよさそうだわ。\n@c0@"
185:
  de: "@aGriselda@bSie ist eine Anhängerin des Ordens vom Zugzwang? Hm... Korol haben wir zwar besiegt, aber Gefolgsleute wie sie scheint es immer noch überall zu geben...\n@c0@"
  en: "@aDebora@bSo she's a follower of the Order of Zugzwang?\r\nHmm... We might've defeated Korol, but there are still believers like her dotted about the place.\n@c0@"
  es: "@aStefania@b¿Así que es seguidora de la Orden de Zugzwang?\nMmm... Aunque hemos derrotado a Korol, aún tiene seguidores dappertutto.\n@c0@"
  fr: "@aPandora@bAlors elle est adepte de l'Ordre du Zugzwangⓡ Mmm... Nous avons peut-être vaincu Korol, mais il reste encore ça et là quelques adeptes comme elle.\n@c0@"
  it: "@aViola@bMa è una seguace della Setta di Zugzwang?!\n㈡\nÈ incredibile! C'è gente che presta fede alle menzogne di Krocorov anche dopo che abbiamo tolto di mezzo quel pazzo criminale!\n@c0@"
  ja: "@a@bデボラ「このおばさんも　光の教団の……？\n\tイブールは倒したけど\n\t信者は　こうしてまだ　残っているのね。\n@c0@"
186:
  de: "@aGriselda@bDu musst jede Menge Kindheitserinnerungen an diesen Ort haben, %a000090.\n@c0@"
  en: "@aDebora@bThis inn must be full of memories from your younger years, %a000090.\n@c0@"
  es: "@aStefania@bVeramente, esta posada te debe de traer muchos recuerdos de cuando eras joven, ¿eh, %a000090?\n@c0@"
  fr: "@aPandora@bTu dois avoir plein de souvenirs d'enfance dans cette auberge, %a000090.\n@c0@"
  it: "@aViola@b%0%a000090, immagino che questa locanda ti ricordi la tua infanzia...\n@c0@"
  ja: "@a@bデボラ「この宿には　%a000090が\n\tまだ　みじゅくだった頃の思い出が\n\tつまってるのね。\n@c0@"
187:
  de: "@aGriselda@bWie er wohl reagieren würde, wenn wir ihm erzählen, dass %a001240 der legendäre Held ist? Nicht, dass ich das vorhätte...\n@c0@"
  en: "@aDebora@bI wonder how he'd react if we told him %a001240 was the legendary hero. Not that I'm planning on finding out.\n@c0@"
  es: "@aStefania@bMe pregunto qué haría si le dijésemos que %a001240 es el héroe legendario. Ma no tengo previsto comprobarlo.\n@c0@"
  fr: "@aPandora@bJe me demande comment il réagirait s'il apprenait %G1240%Xqu'%Yque %Z%a001240 est le héros légendaire. Mais je n'ai pas l'intention de le découvrir.\n@c0@"
  it: "@aViola@bCome reagirebbe se gli rivelassimo che %a001240 è l'Eroe Leggendario? Ah, non lo scopriremo mai, perché non ho alcuna intenzione di dirglielo!\n@c0@"
  ja: "@a@bデボラ「%a001240が勇者だとわかったら\n\tこの男　どんな反応をするのかしら？\n\tためしてみようとは　思わないけど。\n@c0@"
188:
  de: "@aGriselda@bEs ist schon spät. Vielleicht sollten wir heute hier übernachten. Los, besorg uns ein Zimmer!\n@c0@"
  en: "@aDebora@bIt's getting late now. Maybe we should stay here for the night. Hurry up and find us a room!\n@c0@"
  es: "@aStefania@bSe está haciendo tarde. Quizá deberíamos quedarnos a pasar la notte. ¡Vamos, busca una habitación, presto!\n@c0@"
  fr: "@aPandora@bIl commence à se faire tard. On devrait peut-être rester ici pour la nuit. Dépêche-toi de nous trouver une chambreⓠ\n@c0@"
  it: "@aViola@bChe ne dici di pernottare qui?\nOrmai s'è fatto tardi...\nForza, pelandrone! Sbrigati a trovare una stanza!\n@c0@"
  ja: "@a@bデボラ「そろそろ　夜もふけてきたし\n\t今日は　ここに泊まる？\n\tだったら　急いで　宿をとってね。\n@c0@"
189:
  de: "@aGriselda@bWenn du hier etwas erledigen musst, bitte schön, aber wenn es nur ein Nostalgietrip ist, dann wird er wohl warten müssen, bis das alles vorbei ist.\n@c0@"
  en: "@aDebora@bIf there are things you need to do here, that's fair enough, but if this is just a trip down memory lane, you'll have to wait until it's all over.\n@c0@"
  es: "@aStefania@bSi tienes cosas que hacer aquí, va bene, ma si solo es nostalgia, deja la nostalgia para más tarde.\n@c0@"
  fr: "@aPandora@bSi tu as des choses à faire ici, très bien, mais s'il ne s'agit que d'une promenade sentimentale dans le passé, tu vas devoir attendre que tout soit terminé.\n@c0@"
  it: "@aViola@bSe hai qualcosa da fare qui, accomodati pure, ma se sei venuto solo per ricordare il passato, ti chiederei di rinviare a tempi migliori...\n@c0@"
  ja: "@a@bデボラ「この町に　用があるならともかく…\n\t思い出にひたるだけなら　後にしてね。\n\t全部終わったら　また来ればいいのよ。\n@c0@"
190:
  de: "@aGriselda@bWie er wohl reagieren würde, wenn wir ihm erzählen, dass %a001240 der legendäre Held ist? Nicht, dass ich das vorhätte...\n@c0@"
