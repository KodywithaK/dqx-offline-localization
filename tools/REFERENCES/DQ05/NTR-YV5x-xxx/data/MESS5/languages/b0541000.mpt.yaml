191:
  de: "@aGriselda@bIrgendwie konnte ich diese Frau nicht richtig erkennen. Aber vielleicht bin ich auch einfach nur müde...\n@c0@"
  en: "@aDebora@bI couldn't quite seem to focus on that woman properly. I must be tired or something.\n@c0@"
  es: "@aStefania@bTengo dificultad para ver bene esa donna. Debe de ser el cansancio.\n@c0@"
  fr: "@aPandora@bJe la voyais un peu floue, cette femme.\r\nJe dois être un peu fatiguée.\n@c0@"
  it: "@aViola@b%0%a000090, chi era quella donna?\nNon sono riuscita a vederla bene.\nDevo avere gli occhi un po' stanchi...\n@c0@"
  ja: "@a@bデボラ「なんだか　あの女の人の姿が\n\tハッキリと　見えないんだけど……。\n\t私　つかれているのかしら。\n@c0@"
192:
  de: "@aGriselda@bSo viele Leute sind auf den Orden vom Zugzwang reingefallen. Ich verstehe das nicht.\n@c0@"
  en: "@aDebora@bSo many people have been taken in by the Order of Zugzwang. I just don't understand it.\n@c0@"
  es: "@aStefania@bLa Orden de Zugzwang se ha llevado a muchas personas. Non lo posso entender.\n@c0@"
  fr: "@aPandora@bTellement de gens ont été enrôlés par l'Ordre du Zugzwang. C'est quelque chose que je ne comprends vraiment pas.\n@c0@"
  it: "@aViola@bMi pare incredibile che quei dannati della Setta di Zugzwang siano risciti a fare tanti proseliti...\nÈ proprio vero che il mondo è pieno di creduloni!\n@c0@"
  ja: "@a@bデボラ「光の教団に　だまされる人って\n\t本当に　多いのね……。\n\t私には　それが理解できないわ。\n@c0@"
193:
  de: "@aGriselda@bSo viele Leute sind auf den Orden vom Zugzwang reingefallen. Ich verstehe das nicht.\n@c0@"
