  it: "@a%0%a001250@bHo sonno...\nNo, non ho sonno.\nAnzi sì, ma solo un pochino...\n@c0@"
  ja: "@a@b%a001250「ふわぁ……。\n\tううん。　してない。\n\t今の　あくびじゃないです。\n@c0@"
70:
