  ja: "@a@b%a001250「お父さん　大丈夫？\n\tわたしが　そばに\n\tついててあげるからね。\n@c0@"
78:
  de: "@a%0%a001240@bDer Azimuth ist der höchste Berg der Welt. Gut, was ich alles weiß, nicht?\n@c0@"
