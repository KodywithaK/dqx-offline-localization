  ja: "@a@bフローラ「この宿には　%a000090さんの\n\t思い出が　あふれているんでしょうね。\n\t私　少し　ヤキモチをやきそうですわ。\n@c0@"
54:
  de: "@a%0%a001240@bWarst du in diesem Zimmer auch mit Großvater, Papa? Ich wünschte, ich wäre dabei gewesen...\n@c0@"
