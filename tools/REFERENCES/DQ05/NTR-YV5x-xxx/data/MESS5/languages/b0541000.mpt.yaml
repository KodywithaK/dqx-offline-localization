  ja: "@a@bサンチョ「あの頃は　楽しかったですね。\n\tパパスさまがいて　宿屋には\n\tビアンカさんの家族もいて……。\n@c0@"
71:
  de: "@aSancho@bSi. Aber mit die Zeit verändert siss alles. Das kann man nisst verhindern, Chico.\n@c0@"
  en: "@aSancho@bSí. The times, they change, you know.\r\nEes notheeng you can do to estop eet.\n@c0@"
  es: "@aSancho@bLos tiempos cambian a morir.\n¡Eso que ni qué!\n@c0@"
  fr: "@aSancho@bSi. Les temps changent, tu sais.\nEt on ne peut rien y f-faire.\n@c0@"
