  es: "@aAlazar@bA lo mejor abro un día mi propia posada.\nCuando haya encontrado una esposa bien guapa para que me ayude, claro.\n@c0@"
  fr: "@aInnocent@bPeut-être qu'un jour, j'ouvrirai ma propre auberge. Après avoir trouvé la charmante femme qui m'accompagnera dans cette entreprise, bien sûr.\n@c0@"
  it: "@aSimon@bIl giorno che lascerò l'esercito, aprirò una pensioncina tutta mia.\n㈡\nLa chiamerò la ⓕLocanda del Soldatoⓖ. Anzi, dell'ⓕex-soldatoⓖ, perché a quel punto sarò già in congedo...\n@c0@"
  ja: "@a@bピピン「ボクも　かわいいお嫁さんを\n\tもらって　いつか宿屋をつがないとな。\n@c0@"
