  ja: "@a@bピピン「こうして　いろんな宿屋を\n\t見てまわるのは　勉強になりますよ。\n@c0@"
51:
  de: "@aOtto@bVielleicht mache ich irgendwann ja meine eigene Herberge auf. Natürlich erst, wenn ich eine nette Frau gefunden habe, die mir hilft...\n@c0@"
