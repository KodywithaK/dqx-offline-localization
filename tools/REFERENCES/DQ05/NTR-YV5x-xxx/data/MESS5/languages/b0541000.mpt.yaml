195:
  de: "@aGriselda@bIch hoffe nur, dass man nicht genauso gespenstig wird wie die beiden hier, wenn man die Krone trägt... Nein, bestimmt nicht.\n@c0@"
  en: "@aDebora@bYou don't think that wearing that crown makes you transparent or anything, do you? No, surely not...\n@c0@"
  es: "@aStefania@b¿Crees que el llevar esa corona ti fai transparente o algo así? No, no puede ser.\n@c0@"
  fr: "@aPandora@bTu ne crois pas que le fait de porter cette couronne rend transparent ou un truc comme ça, heinⓡ\nNon, c'est impossible...\n@c0@"
  it: "@aViola@bCaro, credi che ci sia da fidarsi a prendere questa corona...? Mi piace da impazzire, ma non vorrei che mi trasformasse in un fantasma, o roba del genere...\n@c0@"
  ja: "@a@bデボラ「この王冠をかぶったら　身体が\n\tすきとおったりなんか　しないわよね？\n\tまあ　そんなことが　あるわけないけど。\n@c0@"
196:
  de: "@aGriselda@bWarum blitzt es denn die ganze Zeit? Ich erschrecke mich jedes Mal.\n@c0@"
  en: "@aDebora@bWhat's going on with all this lightning?\nIt keeps giving me a fright.\n@c0@"
  es: "@aStefania@b¡¿Qué pasa con todas estas luces?!\nMe inquietan un po'.\n@c0@"
  fr: "@aPandora@bQu'est-ce qui se passe avec tous ces éclairsⓡ\nÇa me fait sursauter à chaque fois.\n@c0@"
  it: "@aViola@bMa che bisogno c'è di lampeggiare in quel modo, eh?!\nMi fa venire il mal di testa!\n@c0@"
  ja: "@a@bデボラ「なんなのよ　この稲妻はっ！\n\tいきなり　びっくりするじゃない！\n@c0@"
197:
  de: "@aGriselda@bEs muss schrecklich sein, nichts mehr schmecken zu können. Selbst mit Geld kann man sich keinen Geschmack kaufen.\n@c0@"
  en: "@aDebora@bIt must be terrible not being able to taste anything. Even money can't buy taste.\n@c0@"
  es: "@aStefania@bDebe de ser terribile no poder notar ningún sapore. El gusto es algo que no se compra con dinero.\n@c0@"
  fr: "@aPandora@bÇa doit être terrible de perdre le goût. Même l'argent ne peut racheter ça.\n@c0@"
  it: "@aViola@bBeati loro che non ingrassano!\nIo devo stare attentissima a cosa mangio, se non voglio perdere la mia splendida linea...\n@c0@"
  ja: "@a@bデボラ「味覚がないのは　お気の毒ね。\n\t味覚は　お金で　買えないしね。\n@c0@"
198:
  de: "@aGriselda@bWas machen wir eigentlich in diesem stinkenden alten Schloss? Los, lass uns weiterziehen.\n@c0@"
  en: "@aDebora@bWhat are we doing at this stinky old castle?\nLet's hurry up and leave.\n@c0@"
  es: "@aStefania@b¿Se puede saber qué hacemos en este castello apestoso?\nVámonos, de prisa.\n@c0@"
  fr: "@aPandora@bQu'est-ce qu'on fait dans ce vieux château puantⓡ Dépêchons-nous de partir.\n@c0@"
  it: "@aViola@bScusa, mi diresti perché siamo venuti in questo castello? Senti che puzza di muffa che c'è!\nForza, andiamo via...\n@c0@"
  ja: "@a@bデボラ「こんな　古びたお城に\n\tいったい　何の用が　あるっていうの？\n\t早く　外へ出ましょう。\n@c0@"
199:
  de: "@aGriselda@bBilde ich mir das nur ein, oder ist es tatsächlich plötzlich kalt geworden?\n@c0@"
  en: "@aDebora@bIs it me, or has it suddenly gone cold?\n@c0@"
  es: "@aStefania@b¿Soy yo la única que ha notado fredo de golpe?\n@c0@"
  fr: "@aPandora@bC'est moi ou il fait froid, tout d'un coupⓡ\n@c0@"
  it: "@aViola@bÈ solo una mia impressione, o l'aria s'è fatta improvvisamente gelida?!\n@c0@"
  ja: "@a@bデボラ「なんだか　少し寒いわね。\n\t人が　いないせいかしら。\n@c0@"
200:
  de: "@aGriselda@bEs ist schöner hier, als ich dachte. Aber wohnen wollte ich hier trotzdem nicht. Viel zu altmodisch...\n@c0@"
  en: "@aDebora@bIt's nicer in here than I thought. I wouldn't want to live here, though. Far too old-fashioned.\n@c0@"
  es: "@aStefania@bAquí se está mejor de lo que pensaba. Pero no me gustaría vivir aquí. Es demasiado antiquato.\n@c0@"
  fr: "@aPandora@bC'est plus agréable que je ne l'aurais cru, ici.\r\nMais je n'aimerais pas y vivre pour autant.\r\nC'est bien trop démodé.\n@c0@"
  it: "@aViola@bQuesto castello non mi piace affatto.\nNon lo vorrei nemmeno se me lo regalassero...\n㈡\nPerò, se me lo regalassero, lo venderei e con il ricavato ci comprerei la villa dei miei sogni!\n@c0@"
  ja: "@a@bデボラ「思ったより　中はキレイなのね。\n\t古くさいし　住みたいとは　思わないけど。\n@c0@"
201:
  de: "@aOtto@bIn Anbetracht der Größe ist das ein sehr lebhaftes kleines Städtchen. Nur schade, dass es nicht noch ein paar hübsche Damen mehr gibt...\n@c0@"
  en: "@aTuppence@bIt's quite a lively little town considering its size.\r\nIf only there were a few more beauties about\r\nfor me to enjoy.\n@c0@"
  es: "@aAlazar@bA pesar de su tamaño, es una aldea bastante animada.\n㈡\nNo estaría mal que hubiese unas cuantas bellezas más para alegrarme el día.\n@c0@"
  fr: "@aInnocent@bElle est assez animée pour une petite ville. Il faudrait juste un peu plus de jolies jeunes filles à admirer.\n@c0@"
  it: "@aSimon@bIl villaggio è piccolo, ma è proprio carino.\nChissà se le abitanti sono socievoli!\nEh eh eh! Ehm...\n@c0@"
  ja: "@a@bピピン「小さいわりに\n\tにぎわいのある町ですね。\n\tこれで　もっと美人が多ければなあ。\n@c0@"
202:
  de: "@aGriselda@bIch hör' wohl nicht richtig, Otto! Reicht es etwa nicht, solch eine Schönheit wie mich vor Augen zu haben?\n@c0@"
  en: "@aDebora@bI beg your pardon, Tuppence! Is it not enough to be accompanied by a beauty such as I?\n@c0@"
  es: "@aStefania@b¡A ver qué es lo que dices, Alazar! ¿Es que no te basta ir acompañado de una bellezza come io?\n@c0@"
  fr: "@aPandora@bExcuse-moi, Innocentⓡⓐ Ça n'est donc pas suffisant d'être accompagné par une jolie femme telle que moiⓡ\n@c0@"
  it: "@aViola@bDimmi un po', bellimbusto da strapazzo che non sei altro... Non ti basta essere in compagnia di una sfolgorante bellezza come me?!\n@c0@"
  ja: "@a@bデボラ「あら　ピピン。\n\t私のような美人の　供をしているのに\n\tそれでは不足なの？\n@c0@"
203:
  de: "@aOtto@bIch, ähm, ja! Ja, natürlich. Das genügt vollkommen!\n@c0@"
  en: "@aTuppence@bEr, I, er, yes! Yes, of course.\nMore than enough!\n@c0@"
  es: "@aAlazar@bMmm, ¡sí, claro! Faltaría más. ¡Más que suficiente!\n@c0@"
  fr: "@aInnocent@bEuh, je... euh siⓠ Si, bien sûr.\nC'est largement suffisantⓠ\n@c0@"
  it: "@aSimon@bCome?!\nEhm, certo che mi basta... Ecco, il fatto è che lei e re %a000090 siete spos...\n㈡\nEhm, bella giornata, vero?\nForse appena un tantinello calda... \n@c0@"
  ja: "@a@bピピン「い　いえ　とんでもありませんっ。\n\t美人はもう　じゅうぶんでありますですっ！\n@c0@"
