0:
  de: "@aBianca@bPuh! Hier komme ich mir glatt wieder vor wie ein kleines Mädchen. Die Leute sind zwar anders, aber sonst ist alles beim Alten geblieben.\n@c0@"
  en: "@aBianca@bBlimey! This certainly takes me back. The folk here might be different to before, but the place en't changed a bit.\n@c0@"
  es: "@aBianca@b¡Cuernos! Qué recuerdos... Puede que la gente no sea la misma de antes, pero el sitio no ha cambiado nada de nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bNom d'un petit pépinⓠ Ça ne me rajeunit pas. Les gens ne sont plus les mêmes, mais l'endroit n'a pas changé.\n@c0@"
  it: "@aBianca@bAccidenti!\nNon vedo molte facce note in giro, ma il villaggio è esattamente come lo ricordavo!\n@c0@"
  ja: "@a@bビアンカ「うわ～　なつかしい！\n\t住んでる人は　変わっても\n\t町は　あまり変わってないみたいね。\n@c0@"
1:
  de: "@aBianca@bMeine Familie lebt hier zwar nicht mehr, aber es ist trotzdem schön, wieder hier zu sein.\n@c0@"
  en: "@aBianca@bMy family en't around here any more, but it's still nice to be back for a while.\n@c0@"
  es: "@aBianca@bMi familia ya no está por aquí, pero me ha gustado volver.\n@c0@"
  fr: "@aBianca@bMa famille ne vit plus ici, mais c'est agréable\r\nd'y passer un moment.\n@c0@"
  it: "@aBianca@bLa mia famiglia non vive più qui da tempo, ma questo luogo avrà sempre un posto speciale nel mio cuore...\n@c0@"
  ja: "@a@bビアンカ「私の家は　もう　ないけど\n\tせっかく寄ったんだから\n\tゆっくりしていきましょうよ。\n@c0@"
2:
  de: "@aNera@bDieses hübsche Städtchen besitzt eine ganz besondere Atmosphäre!\n@c0@"
  en: "@aNera@bThere's a really nice, friendly atmosphere here.\r\nWhat a lovely town!\n@c0@"
  es: "@aNera@bQué ambiente más encantador y piacevole.\n¡Qué bella ciudad!\n@c0@"
  fr: "@aNera@bL'atmosphère est vraiment agréable et douce, ici. C'est une très jolie villeⓠ\n@c0@"
  it: "@aNera@bChe bel paesino!\nSi respira un'atmosfera cordiale e accogliente!\n@c0@"
  ja: "@a@bフローラ「この町　とても\n\tあたたかい雰囲気があって\n\t私　好きですわ。\n@c0@"
3:
  de: "@aNera@bBianca würde dem Ort bestimmt liebend gerne einen Besuch abstatten. Aber es ist ganz schön weit von Utensiel.\n@c0@"
  en: "@aNera@bBianca would probably love to make a trip\r\nback here every once in a while. It's quite\r\na way from Stockenbarrel.\n@c0@"
  es: "@aNera@bEstoy sicura de que a Bianca le encantaría regresar aquí de vez en cuando. Está bastante lejos de Clavis.\n@c0@"
  fr: "@aNera@bBianca aimerait sûrement revenir ici de temps\r\nen temps. Mais ce n'est pas tout près de Saint Éloi.\n@c0@"
  it: "@aNera@bChissà se Bianca torna qui spesso...\nBlankenburg è abbastanza distante da Aprianuam...\n@c0@"
  ja: "@a@bフローラ「ビアンカさんも　この町\n\tご覧になりたいでしょうね。\n\t山奥の村からは　ずいぶん遠いもの。\n@c0@"
4:
  de: "@a%0%a001240@bWir waren schon einmal mit Sancho hier. Die Herberge hier ist riesengroß.\n@c0@"
  en: "@a%0%a001240@bI remember coming here before with Sancho.\nThe inn here's really big.\n@c0@"
  es: "@a%0%a001240@bRecuerdo haber pasado antes por aquí con Sancho.\nTienen una posada enorme.\n@c0@"
  fr: "@a%0%a001240@bJe me souviens être venu ici avec Sancho.\nL'auberge est vraiment grande.\n@c0@"
  it: "@a%0%a001240@bSono già venuto qui, sai?\nMi ci ha portato lo zio Sancho.\nRicordo che la locanda del villaggio è molto grande...\n@c0@"
  ja: "@a@b%a001240「ここには　サンチョと\n\t来たことがあるよ。\n\t大きな宿屋があるんだよね。\n@c0@"
5:
  de: "@a%0%a001250@bSieh nur, Papa. Sind die Blumen an der Kirche nicht hübsch?\n@c0@"
  en: "@a%0%a001250@bLook, Dad! Aren't the flowers at the church pretty?\n@c0@"
  es: "@a%0%a001250@b¡Mira, papi! ¡Qué preciosas son las flores de la iglesia!\n@c0@"
  fr: "@a%0%a001250@bRegarde, papaⓠ Les fleurs de l'église sont vraiment jolies.\n@c0@"
  it: "@a%0%a001250@bPapà, guarda quanto sono belli i fiori vicino alla chiesa!\n@c0@"
  ja: "@a@b%a001250「お父さん　見て！\n\t教会のところ　お花がきれい。\n@c0@"
6:
  de: "@aSancho@bIss kann miss noch gut erinnern. Wir sind mit Señor Ludwig hier gewesen. Und damals lebte auch noch die Familia von Señora Bianca hier.\n@c0@"
  en: "@aSancho@bI remember eet eso well. We came here weeth señor Pankraz. And that time, señora Bianca's family, they were here also.\n@c0@"
  es: "@aSancho@bLo recuerdo como si fuera ayer. Vine aquí con el señor Teudis. Y en aquella ocasión venía con nosotros la familia de la señora Bianca.\n@c0@"
  fr: "@aSancho@bJ-Je m'en souviens très bien. On était venus ici\r\navec le señor P-Petros. À cette época, la famille\r\nde la señora B-Bianca était là aussi.\n@c0@"
  it: "@aSancho@bMe sembra ieri que venni aquí con el señor Russel...\nRecuerdo que c'era anche la familia della señora Bianca.\n@c0@"
  ja: "@a@bサンチョ「あの頃は　楽しかったですね。\n\tパパスさまがいて　宿屋には\n\tビアンカさんの家族もいて……。\n@c0@"
7:
  de: "@aSancho@bSi. Aber mit die Zeit verändert siss alles. Das kann man nisst verhindern, Chico.\n@c0@"
  en: "@aSancho@bSí. The times, they change, you know.\r\nEes notheeng you can do to estop eet.\n@c0@"
  es: "@aSancho@bLos tiempos cambian a morir.\n¡Eso que ni qué!\n@c0@"
  fr: "@aSancho@bSi. Les temps changent, tu sais.\r\nEt on ne peut rien y f-faire.\n@c0@"
  it: "@aSancho@bInveces no era ieri, ma muchos años fa.\n¡El tiempo vola, chico!\n@c0@"
  ja: "@a@bサンチョ「月日が　たてば\n\tいろいろなことが　変わってしまうのは\n\t仕方のないことなんでしょうか。\n@c0@"
8:
  de: "@aBianca@bDanke, %a000090. Es bedeutet mir sehr viel, noch mal hier zu sein, bevor wir zu unserem letzten Kampf antreten.\n@c0@"
  en: "@aBianca@bThanks, %a000090. It means a lot that you've brought me here before we head into our final battle.\n@c0@"
  es: "@aBianca@bGracias, %a000090. Significa mucho para mí que me hayas traído aquí antes de nuestra última batalla, ¿sabes?\n@c0@"
  fr: "@aBianca@bMerci, %a000090. Ça me fait vraiment plaisir que tu m'aies amenée ici avant que nous allions livrer notre dernier combat.\n@c0@"
  it: "@aBianca@bTi ringrazio, %a000090.\nTi sono grata per avermi portata qui prima della battaglia finale.\n@c0@"
  ja: "@a@bビアンカ「%a000090　ありがとうね。\n\t最後の戦いの前に\n\tこの場所へ　つれてきてくれて。\n@c0@"
9:
  de: "@a%0%a001250@bIch liebe Wittenhausen! Ich weiß zwar nicht warum, aber ich tue es!\n@c0@"
  en: "@a%0%a001250@bI really love Roundbeck!\nI don't know why, but I just do!\n@c0@"
  es: "@a%0%a001250@b¡Me encanta Golfo Blanco!\n¡No sé por qué, pero me encanta!\n@c0@"
  fr: "@a%0%a001250@bJ'adore Blanchecombeⓠ Je ne sais pas pourquoi,\nmais j'adoreⓠ\n@c0@"
  it: "@a%0%a001250@bChe bella che è Blankenburg!\nNon so perché, ma mi sembra di respirare aria di casa!\n@c0@"
  ja: "@a@b%a001250「わたし　この町　大好き。\n\tなんでか　よくわからないけど。\n@c0@"
10:
  de: "@aSancho@bHast du viele Erinnerungen an diese Ort, Chico? Deine Onkel Sancho auf jede Fall. \n@c0@"
  en: "@aSancho@bYou have many memories from thees place, eh, friend? Sí. Your Uncle Sancho, he has many memories from here too.\n@c0@"
  es: "@aSancho@bEste sitio te trae recuerdos, ¿eh, chamaco? Sí, a tito Sancho también le trae muchos recuerdos.\n@c0@"
  fr: "@aSancho@bT-Tu dois avoir p-plein de souvenirs de cet endroit, hein, chicoⓡ Si. Ton oncle S-Sancho, il en a beaucoup aussi.\n@c0@"
  it: "@aSancho@bChico, lo zio Sancho ha muchos recuerdos de esto luego...\n¿Escommetto que es lo mismo anche por ti, eh?\n@c0@"
  ja: "@a@bサンチョ「%a000090王も　ここには\n\tいろんな思い出が　ありますよね。\n\t私も　そうですよ。\n@c0@"
11:
  de: "@a%0%a001240@bGlaubst du, dass es je eine Welt ohne Waffen geben wird? Das wäre doch schön, oder?\n@c0@"
  en: "@a%0%a001240@bDo you think there'll ever be a world without weapons? It would be nice if there could be.\n@c0@"
  es: "@a%0%a001240@b¿Crees que alguna vez viviremos en un mundo sin armas? Qué genial sería.\n@c0@"
  fr: "@a%0%a001240@bTu crois qu'un jour le monde sera débarrassé de toutes les armesⓡ Ce serait bien si ça arrivait.\n@c0@"
  it: "@a%0%a001240@bMi piacerebbe vivere in un mondo senza armi...\n@c0@"
  ja: "@a@b%a001240「武器のいらない世界って\n\tつくれると思う？　そうなったら\n\tすごくいいと思うんだけど……。\n@c0@"
12:
  de: "@aSancho@bDiese Señor, er sieht nisst besonders glückliss aus, auch wenn seine Geschäft gut geht. Si, das kann iss verstehen.\n@c0@"
  en: "@aSancho@bThees señor, he no look eso happy, even though he esells everytheeng een hees eshop. Sí, I understand how he feels eso well.\n@c0@"
  es: "@aSancho@bEste señor no parece feliz, y eso que vende todito lo que tiene en su tienda.\nTito Sancho comprende bien cómo se siente.\n@c0@"
  fr: "@aSancho@bCe s-señor, il n' a pas l'air très heureux, même s'il vend t-toute sa marchandise. Je c-comprends ce qu'il r-ressent.\n@c0@"
  it: "@aSancho@bEs verdad: todo el mundo es en subbuglios.\nEsperiamo que prestos riusciremo a reportare la paz...\n@c0@"
  ja: "@a@bサンチョ「商品が売れているのに\n\tくらい顔ですね。\n\t気持ちは　じゅうぶん　わかりますが。\n@c0@"
13:
  de: "@aBianca@bWar das nicht der Kerl, der vor all den Jahren aus Tifortu weggelaufen ist? Scheint ganz so, als würde er bald wieder das Gleiche tun!\n@c0@"
  en: "@aBianca@bEn't he the bloke who did a runner from Coburg all them years back? Sounds like he's plannin' on doin' the same kind of thing again!\n@c0@"
  es: "@aBianca@b¿No es ese el tipo que se largo por piernas de Trastámara hace tantos años? ¡Parece que tiene pensado volver a hacer lo mismo!\n@c0@"
  fr: "@aBianca@bCe n'est pas lui qui a fui Cobourg il y a quelques annéesⓡ On dirait qu'il compte refaire le même coupⓠ\n@c0@"
  it: "@aBianca@bMa quello non è il tipo che andò via da Coburg tanti anni fa? Chissà se s'è trasferito qui stabilmente o è solo di passaggio...\n@c0@"
  ja: "@a@bビアンカ「あの人　昔　ラインハットから\n\t逃げてきた人じゃない。\n\t今度も　逃げて身を守るつもりかしら？\n@c0@"
14:
  de: "@aNera@bDie Leute sind doch überall gleich. Sie scheinen einfach nicht zu verstehen, was es wirklich mit dem Orden vom Zugzwang auf sich hat.\n@c0@"
  en: "@aNera@bThe people are just like in so many other places.\r\nThey don't seem to realise the true nature of the Order of Zugzwang.\n@c0@"
  es: "@aNera@bLas personas son parecidas a las de cualquier otro lugar.\n㈡\nSembra que no se dan cuenta de la verdadera naturaleza de la Orden de Zugzwang.\n@c0@"
  fr: "@aNera@bLes gens sont partout pareils. Ils ne semblent pas réaliser la véritable nature de l'Ordre du Zugzwang.\n@c0@"
  it: "@aNera@bSono contenta di vedere che ci sono altre persone che hanno deciso di non credere alle false promesse della Setta di Zugzwang!\n@c0@"
  ja: "@a@bフローラ「この町にも……\n\tみなさん　光の教団の実態が\n\tどんなものか　ご存じないのね……。\n@c0@"
15:
  de: "@aSancho@bEs ist schon komisch, was die Leute manchmal sagen, si?\n@c0@"
  en: "@aSancho@bEes estrange, no, these theengs people are esaying?\n@c0@"
  es: "@aSancho@bQué cosas tan raras dice la gente, ¿no?\n@c0@"
  fr: "@aSancho@bC-C'est bizarre ce que les gens disent, noⓡ\n@c0@"
  it: "@aSancho@b¿Chico, hai sentitos?\n@c0@"
  ja: "@a@bサンチョ「考えてみれば\n\tおかしな話ですよ。\n@c0@"
16:
  de: "@aSancho@bWenn diese Orden vom Zugzwang die Menschen vor dem Großmeister der Unterwelt rettet, heißt das doch, dass es gibt eine Verbindung, no?\n@c0@"
  en: "@aSancho@bEef thees Order of Zugzwang ees gonna esave people from the Grandmaster of the Underworld,\r\neet means they are connected, no?\n@c0@"
  es: "@aSancho@bSi esa Orden de Zugzwang va a salvarlos del Gran Maestro del Inframundo, pues es que están conectados.\n@c0@"
  fr: "@aSancho@bSi l'Ordre du Z-Zugzwang va sauver le monde du Grand Maître des Enfers, ça veut d-dire qu'il y a un l-lien entre eux, noⓡ\n@c0@"
  it: "@aSancho@b¿Come fanno los seguaces della Setta de Zugzwang a sapere del ⓕmaestro infernaleⓖ?\n㈡\n¿Forse esiste un collegamentos tra la setta y quella creatura malefica?\n@c0@"
  ja: "@a@bサンチョ「教団に頼めば　大丈夫だなんて…\n\tそれって　魔王と教団が　つるんでる\n\tってことじゃないですか。\n@c0@"
17:
  de: "@aOtto@bJawohl. Ich vertraue auch nur mir selbst, wenn es um meinen Schutz geht. Äh, aber natürlich schütze ich zuerst Euch, %a000090!\n@c0@"
  en: "@aTuppence@bYep. I'm all for protecting myself by myself. Er, after I've protected you, of course, %a000090!\n@c0@"
  es: "@aAlazar@bYo también me inclino más por lo de cuidarme yo solito. Estooo... ¡pero después de cuidar de vos, claro está, %a000090!\n@c0@"
  fr: "@aInnocent@bAh ça, je suis bien d'accord. Je préfère me protéger tout seul. Euh, mais bien sûr, ma protection passe après la vôtre, %a000090ⓠ\n@c0@"
  it: "@aSimon@bSono d'accordo con lui! Anch'io conto solo sulle mie forze per salvarmi! Ehm, ovviamente dopo aver salvato lei, re %a000090!\n@c0@"
  ja: "@a@bピピン「ボクも　自分の身くらいは自分で…\n\tいやっ　もちろん　自分より\n\t%a000090王を　お守りしますよ！\n@c0@"
18:
  de: "@aBianca@bBei der Göttin! Er war das Kind, das vor all den Jahren %a001210 geärgert hat! Sieh nur, wie alt er geworden ist!\n@c0@"
  en: "@aBianca@bCrikey! He's the kid who was bullyin' %a001210 all them years ago! He looks really middle-aged now!\n@c0@"
  es: "@aBianca@b¡Rayos! ¡Es el niño que estaba martirizando a %a001210 hace tantos años! ¡Tiene aspecto de viejales!\n@c0@"
  fr: "@aBianca@bÇa alorsⓠ C'est le gamin qui embêtait %a001210\nil y a toutes ces annéesⓠ Il a pris un coup de vieuxⓠ\n@c0@"
  it: "@aBianca@bAccidenti! Ma quello non è il tizio che torturava %a001210 tanti anni fa?!\nDiamine, quant'è invecchiato!\n@c0@"
  ja: "@a@bビアンカ「あの人　昔　%a001210ちゃんを\n\tいじめていた人よね。　あらあら\n\tずいぶん　おじさんになっちゃって！\n@c0@"
19:
  de: "@a%0%a001240@bHier hast du doch damals %a001210 gerettet, nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bThis is where you rescued %a001210 from being bullied, isn't it, Dad?\n@c0@"
  es: "@a%0%a001240@bAquí es donde rescataste a %a001210 cuando lo martirizaban, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bC'est là que tu as sauvé %a001210 de ses bourreaux, pas vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, è qui che salvasti %a001210?\n@c0@"
  ja: "@a@b%a001240「ここで　いじめられてた\n\t%a001210を　お父さんたちが\n\t助けてあげたんだよね。\n@c0@"
20:
  de: "@a%0%a001240@bVielleicht finden wir ja noch eine Säbelzahnkatze. Ich hätte nämlich auch gern eine, weißt du?\n@c0@"
  en: "@a%0%a001240@bI wonder if we might find another great sabrecat around the place. I wouldn't mind having one of\nmy own.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si encontraremos otro dientes de sable por aquí. No me importaría tener uno para mí.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si on pourrait trouver un autre smilodon dans le coin. J'aimerais bien en avoir\nun à moi.\n@c0@"
  it: "@a%0%a001240@bSe troviamo un altro Koguar, possiamo tenerlo?\nMi piacerebbe tanto averne uno tutto per me!\nLo chiamerei Gattobaldo!\n@c0@"
  ja: "@a@b%a001240「もう１匹　いないかな\n\tキラーパンサー。\n\tボクも　自分のが　ほしいなー。\n@c0@"
21:
  de: "@aSancho@bIss will gar nisst an diese Zeit denken. Es war eine schlimme Zeit.\n@c0@"
  en: "@aSancho@bI no want to theenk about thees time.\r\nEet was a bad time.\n@c0@"
  es: "@aSancho@bNo quiero ni pensar en esos tiempos.\nFueron malos tiempos.\n@c0@"
  fr: "@aSancho@bJ-Je ne veux pas r-repenser à cette époque.\r\nÇa a été très dur.\n@c0@"
  it: "@aSancho@bNo voglio más pensare al passato...\nPreferisco concentrarme sul presentes.\n@c0@"
  ja: "@a@bサンチョ「……あの頃のことは　\n\t本当に　思い出したくありません。\n\tいやな時期でしたよ。\n@c0@"
22:
  de: "@aOtto@bÄhm... Warum seht Ihr mich so an, %a000090?\n@c0@"
  en: "@aTuppence@bUm... Why are you looking at me like that, %a000090?\n@c0@"
  es: "@aAlazar@bMmm... ¿Por qué me miras así, %a000090?\n@c0@"
  fr: "@aInnocent@bMmm... Pourquoi est-ce que vous me regardez comme ça, %a000090ⓡ\n@c0@"
  it: "@aSimon@bPerché mi guarda così, Maestà?\nMi fa un torto, se ritiene che io sia un vigliacco!\nNon sono mai scappato di fronte a nessun nemico!\n㈡\nPerò una volta sono fuggito da un tipo che voleva menarmi perché avevo guardato la sua fidanzata con troppa insistenza...\n@c0@"
  ja: "@a@bピピン「……%a000090さま。\n\tどうして　そこで\n\tボクのほうを見るんですか？\n@c0@"
23:
  de: "@aBianca@bWas würde er bloß tun, wenn er ihm tatsächlich begegnen würde... Ihn zum Armdrücken herausfordern?\n@c0@"
  en: "@aBianca@bI wonder what he'd do if he actually did meet him. Challenge him to an arm wrestlin' match or the like?\n@c0@"
  es: "@aBianca@bMe pregunto qué haría si lo conociese de verdad. ¿Lo retaría a un pulso o algo así?\n@c0@"
  fr: "@aBianca@bJe me demande ce qu'il ferait s'il le rencontrait vraiment. Il lui proposerait un bras de fer ou quoiⓡ\n@c0@"
  it: "@aBianca@bUn tipo darebbe il braccio destro per incontrare l'Eroe Leggendario, eh? Caro, abbiamo per caso bisogno di un braccio destro? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「会って　どうするつもりかしら。\n\tまさか　チカラくらべを\n\tするつもりとか！？\n@c0@"
24:
  de: "@a%0%a001240@bBitte erzähl dem Mann nichts über mich, ja, Papa? Er würde nur viel zu viel Aufhebens von mir machen.\n@c0@"
  en: "@a%0%a001240@bCan you not tell that man about me, Dad? I reckon he'd probably make way too much of a fuss.\n@c0@"
  es: "@a%0%a001240@b¿No le vas a decir nada sobre mí a ese hombre, papi? No, supongo que armaría demasiado jaleo si lo supiera.\n@c0@"
  fr: "@a%0%a001240@bTu ne peux pas lui dire que c'est moi, papaⓡ\nRemarque, c'est vrai qu'il en ferait sûrement\ntoute une montagne.\n@c0@"
  it: "@a%0%a001240@bPapà, non dire in giro chi sono veramente.\nNon ho tempo per firmare autografi!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tあの人には　ボクのことだまっててね。\n\tだって　大さわぎされそうなんだもん。\n@c0@"
25:
  de: "@aBianca@bIch kann mich noch sehr gut an diesen Garten und den Teich erinnern. Mama und ich waren immer sehr glücklich hier.\n@c0@"
  en: "@aBianca@bI really remember this garden and this pond.\r\nBein' here makes me think about all the happy\r\ntimes with Mum.\n@c0@"
  es: "@aBianca@bMe acuerdo bien de este jardín y del estanque.\nRecuerdo los momentos felices que pase aquí con mamá, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me souviens très bien de ce jardin et de cet étang. Ça me rappelle les jours heureux avec maman.\n@c0@"
  it: "@aBianca@bRicordo ogni pietra, ogni filo d'erba...\nQuesti luoghi mi fanno tornare alla mente i bellissimi momenti che ho trascorso qui con mia madre... Sob!\n@c0@"
  ja: "@a@bビアンカ「この庭も池も　なつかしいわ。\n\tここにいると　つい母さんのことばかり\n\t思い出しちゃう……。\n@c0@"
26:
  de: "@a%0%a001240@bDer Azimuth ist der höchste Berg der Welt. Gut, was ich alles weiß, nicht?\n@c0@"
  en: "@a%0%a001240@bMt Azimuth is the highest mountain in the world, you know. I know these things!\n@c0@"
  es: "@a%0%a001240@bEl monte Acimut es la montaña más alta del mundo, ¿lo sabías? ¡Yo sé mucho de esas cosas!\n@c0@"
  fr: "@a%0%a001240@bLe mont Azimut est la plus grande montagne au monde. Ça, j'ai bien retenuⓠ\n@c0@"
  it: "@a%0%a001240@bSapevi che il Monte Azimuth è la montagna più alta del mondo? Scommetto che non immaginavi che tuo figlio è tanto ferrato in geografia, eh?\n@c0@"
  ja: "@a@b%a001240「セントベレス山って\n\t世界で　いちばん高いんだよ！\n\tボク　知ってるもんっ。\n@c0@"
27:
  de: "@aBianca@bWirklich unglaublich, dass du von dieser Linie abstammst, nicht? Und dass in mir das Blut von Zenithia fließt!\n@c0@"
  en: "@aBianca@bWho would've thought that you're part of\r\nthat bloodline, eh? And that I've got the\r\nblood of a Zenithian!\n@c0@"
  es: "@aBianca@bQuién iba a pensar que formabas parte de ese clan, ¿eh? ¡Y que yo tengo sangre de Zenithia!\n@c0@"
  fr: "@aBianca@bQui aurait pu imaginer que tu faisais partie de cette lignéeⓡ Et que j'avais du sang zénithien dans les veinesⓠ\n@c0@"
  it: "@aBianca@bChi avrebbe mai immaginato che tu discendi da quel gruppo di persone e che io ho sangue zenithiano, eh?!\n@c0@"
  ja: "@a@bビアンカ「%a000090が　その血を\n\tひいていたなんてね。　私が天空の血を\n\tひいていたのにも　ビックリだけど。\n@c0@"
28:
  de: "@aNera@bIch glaube, unser Sohn ist nur deshalb der legendäre Held, weil dein besonderes Blut sich mit meinen Zenithia-Genen vermischt hat. Ja, so muss es sein.\n@c0@"
  en: "@aNera@bThe reason our son is the legendary hero is probably because your special bloodline mixed with my Zenithian heritage. It must be.\n@c0@"
  es: "@aNera@bProbablemente, il nostro bambino es el héroe legendario por la mezcla de tu linaje especial y mi herencia zenithia. Esa debe de ser la razón.\n@c0@"
  fr: "@aNera@bSi notre fils est le héros légendaire, c'est sans doute parce qu'il descend d'une lignée spéciale par tes ancêtres et qu'il a hérité de mon sang zénithien.\n@c0@"
  it: "@aNera@bDall'unione tra te, che discendi dai guardiani del varco per Nadiria, e me, che ho sangue zenithiano, è nato %a001240, l'Eroe Leggendario.\n㈡\nEd è nata anche %a001250, che leggendaria non è, ma a cui voglio un bene dell'anima...\n@c0@"
  ja: "@a@bフローラ「私たちの子供が勇者なのは\n\tあなたの特別な血と　私の天空の血が\n\tあわさったからね　きっと……。\n@c0@"
29:
  de: "@a%0%a001240@bIst diese Gruppe, die das Tor zu Nadiria bewacht, eigentlich berühmt? Irgendwo hab ich nämlich schon mal von ihnen gehört...\n@c0@"
  en: "@a%0%a001240@bDo you think this clan of people guarding the seal\nto Nadiria are famous? I feel like I've heard of them somewhere before.\n@c0@"
  es: "@a%0%a001240@b¿Crees que el clan de gente que protege el sello a Nadiria es famoso? Me parece que he oído hablar de ellos en algún lado.\n@c0@"
  fr: "@a%0%a001240@bTu crois que ce clan chargé de garder cette porte menant aux Enfers est connuⓡ J'ai l'impression d'avoir déjà entendu parler d'eux.\n@c0@"
  it: "@a%0%a001240@bGià, i guardiani del varco per Nadiria...\n@c0@"
  ja: "@a@b%a001240「魔界の封印を守っている一族\n\tって　有名なのかな？　前にも\n\tどこかで　同じ話を聞いたよね。\n@c0@"
30:
  de: "@a%0%a001250@bIch verstehe manchmal, was Monster sagen, weißt du. Die meisten von ihnen sind gar nicht böse...\n@c0@"
  en: "@a%0%a001250@bI can understand a bit of what monsters say, you know. Most of them are good, not evil.\n@c0@"
  es: "@a%0%a001250@bPuedo entender un poco de lo que hablan los monstruos, ¿sabes? Y la mayoría son buenos, no malos.\n@c0@"
  fr: "@a%0%a001250@bJ'arrive à comprendre un peu ce que les monstres disent, tu sais. Et même que la plupart d'entre eux sont gentils, contrairement à ce qu'on dit.\n@c0@"
  it: "@a%0%a001250@bAnch'io capisco un po' il linguaggio dei mostri.\nÈ per questo che so che molti di loro sono buoni...\n@c0@"
  ja: "@a@b%a001250「わたし　魔物さんたちの\n\t言ってること　すこしなら　わかるよ。\n\tみんな　本当は　いい子なの。\n@c0@"
31:
  de: "@aBianca@bIch hab noch nie in meinem Leben gekocht. Das muss ich unbedingt nachholen, wenn wieder Frieden in der Welt herrscht.\n@c0@"
  en: "@aBianca@bI en't cooked a meal in as long as I can remember.\r\nI'll have to make up for it once things are back to normal again.\n@c0@"
  es: "@aBianca@bNo recuerdo la última vez que me puse a cocinar.\nTendré que compensarlo cuando todo vuelva a la normalidad, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa fait une éternité que je n'ai pas préparé un repas moi-même. Il faudra que je me rattrape quand les choses seront revenues à la normale.\n@c0@"
  it: "@aBianca@bIn cucina sono un vero disastro, però so tenere in ordine la casa e rammendare abiti...\n㈡\nCon tutto quello che abbiamo avuto da fare ultimamente, però, non ho avuto tempo per dedicarmi alle faccende domestiche!\n@c0@"
  ja: "@a@bビアンカ「うっ…　私　最近\n\tゴハン　作ってないよね。\n\t平和になったら　いっぱい作るからね。\n@c0@"
32:
  de: "@aNera@bWahrscheinlich kocht sie nur deshalb den lieben langen Tag, um ihr Leid zu verdrängen, glaubst du nicht auch?\n@c0@"
  en: "@aNera@bDo you think that she cooks all day long just to forget about what's going on?\n@c0@"
  es: "@aNera@b¿Crees que cocina tutto il giorno solo para olvidar lo que sucede?\n@c0@"
  fr: "@aNera@bTu crois qu'elle cuisine toute la journée juste pour oublier ce qui se passeⓡ\n@c0@"
  it: "@aNera@bAll'Abbazia ho imparato a cucinare, tenere in ordine la casa, rammendare abiti, tosare il prato, accudire gli animali e a fare mille altre cose!\n@c0@"
  ja: "@a@bフローラ「あの方\n\tああやって　一日じゅう\n\tお料理なさっているのかしら？\n@c0@"
33:
  de: "@aOtto@bMeine Mutter ist nicht nur eine gute Köchin, sondern auch eine fleißige Hausfrau.\n㈡\nSie hat die Herberge stets hübsch und sauber gehalten. Welch mühselige Arbeit...\n@c0@"
  en: "@aTuppence@bMy mother is more than just a whizz in the kitchen. She always kept the inn nice and tidy too. It must be hard work.\n@c0@"
  es: "@aAlazar@bMi madre no solo es un hacha en la cocina. Además, siempre tiene la posada en perfecto orden de revista. Debe de ser un trabajo duro.\n@c0@"
  fr: "@aInnocent@bMa mère n'est pas seulement un cordon bleu, car l'auberge est toujours propre et bien rangée aussi. Elle doit vraiment travailler dur.\n@c0@"
  it: "@aSimon@bMia madre è imbattibile nello sbrigare faccende di casa! Ha vinto il premio ⓕRamazza d'oro di Denimⓖ per quattro anni consecutivi!\n@c0@"
  ja: "@a@bピピン「ボクの母は　ゴハンだけでなく\n\t宿屋の仕事もキチンとやってましたよ。\n\t大変だったろうなあ……。\n@c0@"
34:
  de: "@aBianca@bFast wie früher. Es ist zwar alles etwas gealtert, aber ich bin froh, dass die Herberge so gut in Schuss ist.\n@c0@"
  en: "@aBianca@bThis takes me back. The old place has aged a bit, but it's good to see them keepin' it nice.\n@c0@"
  es: "@aBianca@bQué recuerdos... El sitio está un poco más viejo, pero me gusta ver que lo mantienen en buen estado, ¿sabes?\n@c0@"
  fr: "@aBianca@bCela me rappelle mon enfance. Cette auberge a un peu vieilli, mais je suis contente de voir qu'ils s'en occupent bien. \n@c0@"
  it: "@aBianca@bQuanti ricordi...\nIl villaggio non è cambiato quasi per niente da quando vivevo qui...\n@c0@"
  ja: "@a@bビアンカ「なつかしいな。\n\t少し　古くなったみたいだけど\n\tきれいに　してくれているのね……。\n@c0@"
35:
  de: "@aNera@bIch muss einfach immer an Bianca denken, wenn wir hier sind.\n@c0@"
  en: "@aNera@bI can't help thinking about Bianca all the time whenever we're here.\n@c0@"
  es: "@aNera@bSempre que pasamos por aquí no puedo evitar pensar en Bianca.\n@c0@"
  fr: "@aNera@bJe ne peux pas m'empêcher de penser à Bianca quand nous sommes ici.\n@c0@"
  it: "@aNera@bQuando veniamo qui non posso fare a meno di pensare a Bianca...\n㈡\nNon sono gelosa di lei, ma non posso dimenticare che resterà sempre una parte importante della tua vita...\n@c0@"
  ja: "@a@bフローラ「私　ここに来ると\n\tビアンカさんのことばかり\n\t考えてしまって……。\n@c0@"
36:
  de: "@a%0%a001240@bDie Zimmer in dieser Herberge sind wirklich groß. Echt toll!\n@c0@"
  en: "@a%0%a001240@bThe rooms in this inn are really big. It's cool!\n@c0@"
  es: "@a%0%a001240@bLas habitaciones de esta posada son enormes. ¡Genial!\n@c0@"
  fr: "@a%0%a001240@bLes chambres de cette auberge sont vraiment grandes. C'est génialⓠ\n@c0@"
  it: "@a%0%a001240@bLe stanze di questa locanda sono grandissime!\n@c0@"
  ja: "@a@b%a001240「ここの宿屋さん\n\tお部屋が　ひろいんだもん。\n\tボク　大好き！\n@c0@"
37:
  de: "@aSancho@bStändig warte iss darauf, dass die kleine Señorita Bianca um die Ecke gelaufen kommt. Ah, diese Erinnerungen...\n@c0@"
  en: "@aSancho@bYou know, being here een thees place like thees, I theenk the young señorita Bianca, eshe gonna come running around the corner any minute.\n@c0@"
  es: "@aSancho@bDe estar aquí me entró la sensación de que la joven señorita Bianca iba a doblar aquella esquina en cualquier momento.\n@c0@"
  fr: "@aSancho@bT-Tu sais, quand je suis là comme ça, j'ai l'impression que la señorita B-Bianca va apparaître à t-tout moment.\n@c0@"
  it: "@aSancho@bMe recuerdo cuando Bianca, da piccola, scorrazzava feliz por estas estanzas...\n@c0@"
  ja: "@a@bサンチョ「こうしてると　今にも\n\tちいさいビアンカさんが\n\t顔を出しそうなんですが……。\n@c0@"
38:
  de: "@aBianca@bHach... riecht das gut! Lustig, dass die Trauben meiner Mutter zu Wittenhausens großer regionaler Spezialität geworden sind!\n@c0@"
  en: "@aBianca@bWhat a great smell! How funny that Mum's grapes ended up bein' Roundbeck's big local speciality!\n@c0@"
  es: "@aBianca@b¡Qué bien huele! ¡Es curioso que las uvas de mi madre se convirtiesen en la especialidad local de Golfo Blanco!\n@c0@"
  fr: "@aBianca@bQuelle bonne odeurⓠ C'est drôle que les raisins de maman aient fini par devenir la grande spécialité de Blanchecombeⓠ\n@c0@"
  it: "@aBianca@bChe buon profumo! Aspetta un attimo...\nRiconosco quest'odore! Ma certo! È l'uva che coltivava mia madre! Questa sì che è una sorpresa!\n@c0@"
  ja: "@a@bビアンカ「いいにおい……。\n\tお母さんの育てたぶどうが\n\tこの町の　名物になっていたのね……。\n@c0@"
39:
  de: "@aNera@bDer Duft wirkt so entspannend! Ich könnte auf der Stelle einschlafen.\n@c0@"
  en: "@aNera@bThat smell relaxes you in an instant. I think it could send me to sleep right in the middle of the day!\n@c0@"
  es: "@aNera@bEse odore te relaja en un momento. ¡Credo que podría hacerme dormir en mitad del día!\n@c0@"
  fr: "@aNera@bCette odeur vous détend en une seconde. Je crois qu'elle pourrait me faire dormir même au beau milieu de la journéeⓠ\n@c0@"
  it: "@aNera@bChe profumo rilassante!\nSolo a sentirlo mi viene voglia di schiacciare un pisolino...\n@c0@"
  ja: "@a@bフローラ「ほっとする　においですね。\n\tこれがあったら　私\n\t昼間でも　ねられそうですわ。\n@c0@"
40:
  de: "@a%0%a001240@bHm, das riecht ja nach Trauben! Hoffentlich ist es nicht ganz klebrig...\n@c0@"
  en: "@a%0%a001240@bWow! It smells of grapes!\nI wonder if it's all sticky...\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¡Si huele a uvas!\nMe pregunto si será pegajosa también...\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Ça sent le raisinⓠ Je me demande s'il est collant...\n@c0@"
  it: "@a%0%a001240@bQuesto cuscino profuma d'uva!\nMi vien voglia di mangiarlo!\n@c0@"
  ja: "@a@b%a001240「うわ　本当に\n\tぶどうのニオイがする。\n\tベトベトしないのかな　これ……？\n@c0@"
41:
  de: "@aOtto@bDas riecht herrlich. Hoffentlich vergesse ich mich nicht im Schlaf und verschlinge aus Versehen mein Kissen!\n@c0@"
  en: "@aTuppence@bIt smells so good that I'm afraid I might forget myself during my sleep and gobble it up!\n@c0@"
  es: "@aAlazar@b¡Huele tan bien que me temo que mientras duerma me voy a despistar y me la voy a zampar!\n@c0@"
  fr: "@aInnocent@bÇa sent tellement bon que j'aurais peur de ne pas me contrôler pendant mon sommeil et de le manger en dormantⓠ\n@c0@"
  it: "@aSimon@bUn cuscino aromatizzato all'uva?!\r\nCome mai hanno scelto proprio l'uva?\r\nPerché non le mele? Le pere? Le arance?\n@c0@"
  ja: "@a@bピピン「においに　つられて\n\t寝ながら　食べてしまわないように\n\t気をつけないといけませんね。\n@c0@"
42:
  de: "@aBianca@bIch kann nicht glauben, dass sie eine Anhängerin des Ordens vom Zugzwang ist. Und das Geschäft scheint auch nicht gut zu laufen. Die arme Frau.\n@c0@"
  en: "@aBianca@bI can't believe she's a follower of the Order of Zugzwang. And it dun't look like business is\r\ngood, neither. I hope she's okay.\n@c0@"
  es: "@aBianca@bNo puedo creer que sea una adepta de la Orden de Zugzwang. Y no parece que el negocio le vaya demasiado bien.\n㈡\nEspero que no le pase ninguna desgracia, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'arrive pas à croire que ce soit une disciple de l'Ordre du Zugzwang. En plus, les affaires n'ont pas l'air d'être florissantes. J'espère qu'elle va bien.\n@c0@"
  it: "@aBianca@bMa è una seguace della Setta di Zugzwang!\nOh, poverina!\nQuanto mi dispiace per lei...\n@c0@"
  ja: "@a@bビアンカ「あの　おかみさんが\n\t教団の信者になっていたなんて……。\n\t経営も気になるわね。　大丈夫かな。\n@c0@"
43:
  de: "@aNera@bOje. Es überrascht mich, dass der Orden vom Zugzwang seinen Einfluss bis hierhin ausgeweitet hat.\n@c0@"
  en: "@aNera@bOh dear. I'm surprised to hear the Order of Zugzwang's influence has made it here as well.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Es una sorpresa saber que la influencia de la Orden de Zugzwang è arrivata hasta aquí.\n@c0@"
  fr: "@aNera@bPar la Déesse. Je suis surprise que l'Ordre du Zugzwang ait étendu son emprise jusqu'ici.\n@c0@"
  it: "@aNera@bLa Setta di Zugzwang continua a fare proseliti, eh? Per fortuna a questa donna gli affari non vanno benissimo, e non può foraggiare quei ciarlatani!\n@c0@"
  ja: "@a@bフローラ「まあ。\n\tこんなところにも　教団の信者さんが？\n@c0@"
44:
  de: "@a%0%a001250@bDiese Frau war sehr nett zu uns, als wir damals mit Sancho hier waren. Und da hat sie auch gar nichts von Zugzwang gesagt...\n@c0@"
  en: "@a%0%a001250@bThat woman was really nice to us when we came here with Sancho. She didn't mention anything about Zugzwang then.\n@c0@"
  es: "@a%0%a001250@bEsa mujer se portó muy bien con nosotros cuando vinimos con Sancho. Entonces no dijo ni una palabra sobre Zugzwang.\n@c0@"
  fr: "@a%0%a001250@bCette dame avait vraiment été gentille avec nous quand nous étions venus ici avec Sancho. À l'époque, elle n'avait pas parlé du Zugzwang.\n@c0@"
  it: "@a%0%a001250@bQuando venimmo qui con lo zio Sancho, quella signora fu molto gentile.\nMi regalò anche una tavoletta di cioccolato!\n@c0@"
  ja: "@a@b%a001250「あのおばさん　サンチョと\n\t来たときは　やさしい人だったよ。\n\t教団のことなんて　言ってなかった。\n@c0@"
45:
  de: "@aSancho@bIss traue miss kaum, es dir zu sagen, Chico, aber selbst in Humburg gibt es ein paar Leute, die an diese Orden vom Zugzwang glauben...\n@c0@"
  en: "@aSancho@bI no like to tell you thees, but even een Gotha, there are esome people who believe een thees Order of Zugzwang, you know.\n@c0@"
  es: "@aSancho@bNo quería decírtelo, pero pues hasta en Pankraz hay gente que cree en esta Orden de Zugzwang...\n@c0@"
  fr: "@aSancho@bÇa ne me r-réjouit pas de te l'apprendre, mais même à G-Gotha, il y a des gens qui croient à cet Ordre du Z-Zugzwang, tu sais.\n@c0@"
  it: "@aSancho@bChico, purtroppos anche a Denim ce sono alcunos seguaces della Setta de Zugzwang...\n@c0@"
  ja: "@a@bサンチョ「はずかしながら\n\tグランバニアにも　教団の信者が\n\tいるようなんですよ。\n@c0@"
46:
  de: "@aOtto@bEin Freund von mir hat dem Orden vom Zugzwang sein ganzes Erspartes gegeben. Wie dumm von ihm!\n@c0@"
  en: "@aTuppence@bDear me. A colleague of mine was giving all of\r\nhis earnings to the Order of Zugzwang as well.\r\nWhat a fool!\n@c0@"
  es: "@aAlazar@b¡Oh, cielos! Un compañero mío también donaba todo lo que ganaba a la Orden de Zugzwang.\n¡Qué bobo!\n@c0@"
  fr: "@aInnocent@bL'un de mes collègues donnait toute sa solde à l'Ordre du Zugzwang, lui aussi. Quel imbécileⓠ\n@c0@"
  it: "@aSimon@bUn mio commilitone ha devoluto la paga di un anno alla Setta di Zugzwang. Se verrò promosso, lo metterò di corvée alle latrine, quell'idiota!\n@c0@"
  ja: "@a@bピピン「そういや　この前　ボクの同僚も\n\t給料を全部　光の教団に\n\t寄付していましたよ。　バカですよね。\n@c0@"
47:
  de: "@aBianca@bWeißt du noch, wie wir beide früher immer Verstecken gespielt haben, %a000090?\n@c0@"
  en: "@aBianca@bComin' here reminds me of all those times you and I used to play hide-and-seek together, %a000090.\n@c0@"
  es: "@aBianca@bEste sitio me recuerda a los tiempos en que tú y yo jugábamos al escondite, %a000090.\n@c0@"
  fr: "@aBianca@bEn revenant ici, ça me rappelle toutes ces parties de cache-cache qu'on a faites ensemble, %a000090.\n@c0@"
  it: "@aBianca@bRicordi quando giocavamo a nascondino, %a000090? Ah, quanto ci divertivamo...!\nEh, sì... Erano tempi sereni, quelli...\n@c0@"
  ja: "@a@bビアンカ「ここに来ると　%a000090と\n\tよく　かくれんぼしたの　思い出すわ。\n@c0@"
48:
  de: "@a%0%a001240@bWarum verbringt %a001250 eigentlich immer so viel Zeit im Bad? Ich brauche nur drei Sekunden!\n@c0@"
  en: "@a%0%a001240@bWhy does %a001250 always spend so long in the bath? I'm in and out like a flash.\n@c0@"
  es: "@a%0%a001240@b¿Por qué %a001250 pasa siempre tanto tiempo en el baño? Yo entro y salgo en un segundo.\n@c0@"
  fr: "@a%0%a001240@bPourquoi est-ce que %a001250 passe toujours autant de temps dans le bainⓡ Moi, c'est fait en un clin d'œil.\n@c0@"
  it: "@a%0%a001240@bPerché %a001250 trascorre sempre tanto tempo in bagno? Che problema ha?! Non ha ancora capito come si aprono e chiudono i rubinetti?!\n@c0@"
  ja: "@a@b%a001240「%a001250ってね\n\tおフロが　長いんだよ。\n\tボクは　パパパッて入っちゃうけど。\n@c0@"
49:
  de: "@a%0%a001250@bIch mag diese Herberge. Die Betten sind weich, es gibt ein Bad, und überall riecht es so gut.\n@c0@"
  en: "@a%0%a001250@bI really like this inn. The beds are soft, they have a bath, and the whole place smells really good.\n@c0@"
  es: "@a%0%a001250@bEsta posada me gusta mucho. Las camas son blandas, tienen baño y todo huele muy bien.\n@c0@"
  fr: "@a%0%a001250@bJ'adore cette auberge. Les lits sont moelleux, ils ont des bains et ça sent bon partout.\n@c0@"
  it: "@a%0%a001250@bMi piace questa locanda: le stanze sono pulite e ordinate, e i letti comodi.\nE non è nemmeno troppo cara!\n@c0@"
  ja: "@a@b%a001250「ここの宿屋さんね…\n\tベッドがフカフカだし　おフロもあるし\n\tいいにおいがするから　好き。\n@c0@"
50:
  de: "@aOtto@bEs ist sehr interessant, sich all die verschiedenen Herbergen anzusehen, die es auf der Welt so gibt.\n@c0@"
  en: "@aTuppence@bIt's interesting to see all the different types of inns dotted around the world.\n@c0@"
  es: "@aAlazar@bEs interesante comparar los distintos tipos de posadas que hay por el mundo.\n@c0@"
  fr: "@aInnocent@bC'est intéressant de voir les différents types d'auberge de par le monde.\n@c0@"
