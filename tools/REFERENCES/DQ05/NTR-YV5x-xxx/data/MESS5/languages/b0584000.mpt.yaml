  it: "@aSancho@b¿Y se prende el nuestro dinero y después se la fila?\n@c0@"
  ja: "@a@bサンチョ「ポケットに　ぜったい\n\t入りきらないくらいの　お金を\n\t預けてみるっていうのは　どうです？\n@c0@"
33:
  de: "@aOtto@bIch hätt' in meinen Taschen auch noch jede Menge Platz, wenn Ihr welchen braucht!\n@c0@"
  en: "@aTuppence@bThere's plenty of space in my pocket if you\r\nneed more!\n@c0@"
  es: "@aAlazar@bSi necesitáis más espacio, podéis usar mi bolsillo.\n@c0@"
