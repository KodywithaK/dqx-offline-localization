  ja: "@a@b%a001250「お金なかったの？\n\tじゃあ　今日のごはんは\n\tすこしで　いいです……。\n@c0@"
48:
  de: "@aOtto@bKeine Sorge, %a000090. Von mir erfährt keine Menschenseele, dass Ihr net mal genug Geld hattet, um Euch ein paar Krümel Schokolade zu kaufen!\n@c0@"
  en: "@aTuppence@bDon't worry, %a000090. I won't tell anyone you didn't even have enough money to buy some chocolate!\n@c0@"
  es: "@aAlazar@bNo os preocupéis, %a000090. Me llevaré el secreto de que no teníais para chocolate a la tumba.\n@c0@"
  fr: "@aInnocent@bNe vous inquiétez pas, %a000090. Je ne répéterai à personne que vous n'aviez même pas assez d'argent pour vous offrir du chocolatⓠ\n@c0@"
  it: "@aSimon@bNon tema, Maestà. Non dirò a nessuno che il Re di Denim non ha nemmeno i soldi per comprare un po' di cioccolato. Questo sarà il nostro piccolo segreto...\n@c0@"
  ja: "@a@bピピン「ボク　%a000090王が\n\tチョコ代も　払えなかったなんて\n\t誰にも　言いませんからっ！\n@c0@"
49:
  de: "@aBianca@bDie Laternen sind so hübsch, findest du nicht? Richtig elegant.\n@c0@"
  en: "@aBianca@bThe lanterns look so pretty, dun't you think?\r\nAll elegant, like.\n@c0@"
  es: "@aBianca@bQué bonitos son los faroles, ¿no crees?\r\nElegantes y todo eso.\n@c0@"
  fr: "@aBianca@bCes lanternes sont jolies, tu ne trouves pasⓡ\nC'est très élégant.\n@c0@"
  it: "@aBianca@bHai visto come sono belle quelle lanterne?\nDonano un tocco d'eleganza a tutto l'ambiente...\n@c0@"
  ja: "@a@bビアンカ「幻想的で　きれい……\n\tとうろう流しなんて　風流ね。\n@c0@"
50:
  de: "@aNera@bDiese Laternen dienen vermutlich dem Gedenken an dahingeschiedene Schleime, meinst du nicht?\n@c0@"
  en: "@aNera@bThose lanterns were probably made to commemorate departed slimes, don't you think?\n@c0@"
  es: "@aNera@bProbablemente son faroles in ricordo de los limos fallecidos, ¿no crees?\n@c0@"
  fr: "@aNera@bCes lanternes ont probablement été fabriquées en hommage aux gluants disparus, tu ne crois pasⓡ\n@c0@"
  it: "@aNera@bSecondo me quelle lanterne sono state realizzate per commemorare gli Slime defunti...\n@c0@"
  ja: "@a@bフローラ「あの　とうろうは　きっと\n\tスライムを　とむらっているのですね。\n@c0@"
51:
  de: "@a%0%a001240@bDas Schloss sieht nachts noch hübscher aus. Ob das wohl an den Schleimlaternen liegt?\n@c0@"
  en: "@a%0%a001240@bThe castle looks even prettier of a night. Maybe it's the slime lanterns that do it.\n@c0@"
  es: "@a%0%a001240@bEl castillo todavía está más bonito por la noche. Quizás sea por los farolillos en forma de limo.\n@c0@"
  fr: "@a%0%a001240@bLe château est encore plus beau de nuit. Peut-être que ce sont les lanternes en forme de gluants qui donnent cet effet.\n@c0@"
  it: "@a%0%a001240@bIl castello sembra ancora più bello di notte.\nForse sono le lanterne-Slime a dargli quest'atmosfera così particolare...\n@c0@"
  ja: "@a@b%a001240「夜のメダル王の\n\tお城って　きれいだね。\n\tスライムの　あかりのせいかな？\n@c0@"
52:
  de: "@a%0%a001250@bOh! Schau dir nur all die vorbeischwimmenden Schleimlaternen an! Sind die nicht hübsch?\n@c0@"
  en: "@a%0%a001250@bOoh! Look at all the slime lanterns floating by.\nThey look so pretty!\n@c0@"
  es: "@a%0%a001250@b¡Oooh!, Mira los farolillos limosos flotando.\n¡Son preciosos!\n@c0@"
  fr: "@a%0%a001250@bOohⓠ Regarde toutes les lanternes en forme de gluants qui sont suspendues partout. Elles sont tellement joliesⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto quanto sono belle le lanterne-Slime?\nPerché non le usiamo anche al Castello di Denim?\n@c0@"
  ja: "@a@b%a001250「スライムさんの　あかりが\n\tいっぱい　流れてる。\n\tうふふ　かわいい～。\n@c0@"
53:
  de: "@aSancho@bSí. Die schwimmenden Laternen, sie sind so hübsch.\n@c0@"
  en: "@aSancho@bSí. The floating lanterns, they are eso beautiful.\n@c0@"
  es: "@aSancho@b¡Ándale! Los farolillos flotantes son tan bellos.\n@c0@"
  fr: "@aSancho@bSi. Les lanternes f-flottantes sont muy belles.\n@c0@"
  it: "@aSancho@bLas lanternas fluttuantes sono bellissimas, chico...\n@c0@"
  ja: "@a@bサンチョ「ちょっと　変わってますが\n\tあれは　とうろう流しですね。\n\t風流なもんです。\n@c0@"
54:
  de: "@aOtto@bNa, also wirklich! Es gehört sich doch net, Müll in den Fluss zu werfen! ... Oder hab ich was net mitgekriegt?\n@c0@"
  en: "@aTuppence@bI say! Surely it's not the done thing to throw rubbish in the river like that!? ...Or am I missing something?\n@c0@"
  es: "@aAlazar@b¡Vaya! No habría que tirar porquería al río así ¿verdad?\nMe parece que no me estoy enterando de nada.\n@c0@"
  fr: "@aInnocent@bMais enfinⓠ Ça ne se fait pas de jeter ses déchets dans la rivière comme çaⓠ ... Euh, j'ai raté un trucⓡ\n@c0@"
  it: "@aSimon@bMaestà, ha visto che strani pesci ci sono in questo fiume? Non lo dica al signor Sancho, altrimenti li pescherà e ci preparerà una paella mostruosa...\n@c0@"
  ja: "@a@bピピン「ダメじゃないですか。\n\t川に　ゴミを　流したりしちゃ！\n\t……えっ　ちがうって！？\n@c0@"
55:
  de: "@aBianca@bSieht mir nicht allzu anstrengend aus.\n@c0@"
  en: "@aBianca@bIt dun't look like hard work to me.\n@c0@"
  es: "@aBianca@bA mí no me parece que sea un trabajo muy cansado, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa ne m'a pas l'air très fatigant comme travail.\n@c0@"
  it: "@aBianca@bSe lo dice lui...\nA me sembra un'occupazione di tutto riposo...\n@c0@"
  ja: "@a@bビアンカ「そんなに　きつい仕事には\n\t見えないんだけど……。\n@c0@"
56:
  de: "@aNera@bDieser arme alte Mann, dass er sich dafür zu dieser Nachtzeit nach draußen begeben muss.\n@c0@"
  en: "@aNera@bThat poor old man, having to come out\r\nat this time of night to do that.\n@c0@"
  es: "@aNera@bPobre hombre, tener que salir a estas horas de la notte para hacer eso.\n@c0@"
  fr: "@aNera@bPauvre homme... Devoir sortir à une heure aussi tardive pour faire ça...\n@c0@"
  it: "@aNera@bLo capisco, sai?\nNon dev'essere facile per un uomo della sua età uscire ogni notte per occuparsi delle lanterne...\n@c0@"
  ja: "@a@bフローラ「あのように　お年をめした方が\n\t夜どおし　とうろう流しなんて\n\tたいへんですわ。\n@c0@"
57:
  de: "@a%0%a001240@bEr ist es also, der die Laternen ins Wasser setzt.\n@c0@"
  en: "@a%0%a001240@bSo he's the one who sets the lanterns afloat.\n@c0@"
  es: "@a%0%a001240@bAsí que él es el que pone los farolillos a flotar.\n@c0@"
  fr: "@a%0%a001240@bAlors c'est lui qui fait flotter les lanternes.\n@c0@"
  it: "@a%0%a001240@bQuindi il suo lavoro è mettere in acqua le lanterne...?\nChissà quanto lo pagano...\n@c0@"
  ja: "@a@b%a001240「ふ～ん…\n\tあれが　とうろう流し　なんだ。\n@c0@"
58:
  de: "@a%0%a001250@bIch würde auch gern mal eine Laterne schwimmen lassen.\n@c0@"
  en: "@a%0%a001250@bI'd like to try setting a lantern afloat one day.\n@c0@"
  es: "@a%0%a001250@bA mí me gustaría echar un farolillo al agua un día.\n@c0@"
  fr: "@a%0%a001250@bJ'aimerais bien essayer de faire flotter une lanterne, un jour.\n@c0@"
  it: "@a%0%a001250@bMi piacerebbe imparare a far galleggiare le lanterne-Slime...\nPapà, credi che sia una cosa difficle?\n@c0@"
  ja: "@a@b%a001250「わたしも　とうろう\n\t流してみたいな……。\n@c0@"
59:
  de: "@aOtto@bIch mache mir Sorgen, dass der alte Mann womöglich stolpert und selbst mit davonschwimmt. Das belastet mich ziemlich, wisst Ihr.\n@c0@"
  en: "@aTuppence@bI'm rather worried that old man might put a foot wrong and end up being carried away himself.\r\nIt's rather stressful for me, you know.\n@c0@"
  es: "@aAlazar@bMe preocupa que el abuelo pierda pie y acabe él siendo arrastrado por la corriente.\nMe estresa bastante la idea.\n@c0@"
  fr: "@aInnocent@bJe m'inquiète pour ce vieil homme. Il pourrait trébucher et être lui-même emporté. C'est assez stressant pour moi, vous savez.\n@c0@"
  it: "@aSimon@bGuardare quell'anziano signore alle prese con le lanterne mi mette addosso un'ansia incredibile.\nChe dice, Maestà? Sono troppo apprensivo?!\n@c0@"
  ja: "@a@bピピン「一歩　まちがうと\n\tあのおじいさんが　流れていきそうで\n\tちょっと　こわいですね。\n@c0@"
60:
  de: "@aBianca@bGlaubst du, hier ist wirklich ein großer Schatz verborgen?\n@c0@"
  en: "@aBianca@bD'you reckon there really is some\r\ngreat treasure hidden here?\n@c0@"
  es: "@aBianca@b¿Tú crees que de verdad habrá un gran tesoro oculto aquí?\n@c0@"
  fr: "@aBianca@bTu crois vraiment qu'il y a un grand trésor\ncaché iciⓡ\n@c0@"
  it: "@aBianca@bCredi davvero che qui sia nascosto un grande tesoro?\n@c0@"
  ja: "@a@bビアンカ「本当に　ここに\n\tそんなに　すごい　名産品が\n\tかくされているのかしら？\n@c0@"
61:
  de: "@aBianca@bWir könnten ein bisschen herumfragen und sehen, ob wir was herausfinden können.\n@c0@"
  en: "@aBianca@bWe could try askin' around and\r\nseein' if we get any clues.\n@c0@"
  es: "@aBianca@bPodríamos preguntar por ahí a ver si nos dan alguna pista, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn pourrait poser des questions aux gens d'ici pour essayer de trouver des indices.\n@c0@"
  it: "@aBianca@bProviamo a fare qualche domanda in giro, amore.\nChissà che non scopriamo qualche indizio utile...\n@c0@"
  ja: "@a@bビアンカ「とりあえず　いろいろな人に\n\t話を　きいてみましょう。\n@c0@"
62:
  de: "@aNera@bIch glaube nicht, dass dieser große Schatz so leicht zu finden sein wird.\n@c0@"
  en: "@aNera@bI don't imagine we'll be able to acquire this\nⓗgreat treasureⓘ all that easily.\n@c0@"
  es: "@aNera@bNo me parece que hacerse con ese ⓕgran tesoroⓖ vaya a ser facile.\n@c0@"
  fr: "@aNera@bJe ne suis pas sûre qu'on réussira à mettre la main sur ce ⓥgrand trésorⓦ aussi facilement.\n@c0@"
  it: "@aNera@bNon credo che riusciremo a mettere facilmente le mani su questo fantomatico ⓕgrande tesoroⓖ...\n@c0@"
  ja: "@a@bフローラ「幻の名産品なんて\n\tそんな　すごそうなもの\n\tかんたんには　いただけませんわよね。\n@c0@"
63:
  de: "@aNera@bEs wäre schön, wenn wir etwas zur Sammlung des Museums beisteuern könnten. Sehen wir uns doch danach um, vielleicht werden wir ja fündig.\n@c0@"
  en: "@aNera@bIt would be a lovely thing to add to the museum's collection. Let's see if we can find it.\n@c0@"
  es: "@aNera@bSería un objeto precioso para agregar a la collezione del museo. Vamos a intentar dar con ello.\n@c0@"
  fr: "@aNera@bCe serait une jolie pièce à ajouter à la collection du musée. Voyons si nous pouvons la trouver.\n@c0@"
  it: "@aNera@bSarebbe bello aggiungerlo alla collezione di oggetti del Museo, non credi?\nSecondo me vale la pena cercarlo...\n@c0@"
  ja: "@a@bフローラ「博物館館長の　あなたも\n\tステキだと思いますわ。\n\tがんばって　見つけましょう。\n@c0@"
64:
  de: "@a%0%a001240@bHier soll's irgendwo einen seltenen Schatz geben? Den find' ich!\n@c0@"
  en: "@a%0%a001240@bSo there's some kind of rare treasure hidden here? Then I'm going to find it!\n@c0@"
  es: "@a%0%a001240@bAsí que por aquí hay un minitesoro singular escondido. ¡Voy a encontrarlo!\n@c0@"
  fr: "@a%0%a001240@bAlors il y a une sorte de trésor caché iciⓡ\nEh bien, je vais le trouver, alorsⓠ\n@c0@"
  it: "@a%0%a001240@bSe c'è un tesoro nascosto da queste parti, lo troverò!\n@c0@"
  ja: "@a@b%a001240「ここに\n\t幻の名産品があるんだよね？\n\tよし！　ボク　ぜったい見つけるぞっ！\n@c0@"
65:
  de: "@a%0%a001250@bWas das wohl für ein seltener Schatz ist? Wie aufregend!\n@c0@"
  en: "@a%0%a001250@bI wonder what the rare treasure could be.\nHow exciting!\n@c0@"
  es: "@a%0%a001250@b¿Qué será ese minitesoro singular?\n¡Qué emocionante!\n@c0@"
  fr: "@a%0%a001250@bJe me demande ce que ce trésor peut bien être. Comme c'est excitantⓠ\n@c0@"
  it: "@a%0%a001250@bUn tesoro, eh?\nUhm...\nChissà di che si tratta...\n@c0@"
  ja: "@a@b%a001250「幻の名産品って　なにかな？\n\tわくわく　しちゃう～。\n@c0@"
66:
  de: "@aSancho@bQué? Ein seltener Schatz? Dieses Schloss, es ist klein. Es wird nisst schwer sein, ihn zu finden.\n@c0@"
  en: "@aSancho@bQué? A rare treasure?\r\nThees castle, ees esmall.\r\nEes gonna be a cinch to find eet.\n@c0@"
  es: "@aSancho@b¿Cómo? ¿Un minitesoro singular?\nEste castillo es bien chiquito.\nVa a ser retefacilísimo dar con él.\n@c0@"
  fr: "@aSancho@bQuéⓡ Oun trésorⓡ Ce château est p-p-petit.\nÇa va être du g-gâteau de le trouver.\n@c0@"
  it: "@aSancho@b¿Un tesoro aquí?\n¡Esto castillo es minuscolo!\n¡Trovare el tesoro sarà un juego da niños!\n@c0@"
  ja: "@a@bサンチョ「幻の名産品ですか……。\n\tちいさな　お城ですから\n\tすぐに　見つかりそうなものですが。\n@c0@"
67:
  de: "@aOtto@bAm besten reden wir zuerst mit möglichst vielen Leuten und versuchen, Hinweise zu sammeln.\n@c0@"
  en: "@aTuppence@bI suppose the best way to start is by talking to lots of people and seeing if we can find any clues.\n@c0@"
  es: "@aAlazar@bSupongo que podemos empezar por preguntar a un montón de gente y ver si logramos alguna pista.\n@c0@"
  fr: "@aInnocent@bLe meilleur moyen de commencer est de parler\r\nà beaucoup de gens pour voir si on peut trouver\r\ndes indices.\n@c0@"
  it: "@aSimon@bMaestà, secondo me la cosa migliore da fare è chiedere informazioni in giro e vedere se riusciamo a scoprire qualcosa di interessante... \n@c0@"
  ja: "@a@bピピン「とりあえず　いろいろな人に\n\t話を　聞いてみましょう。\n@c0@"
68:
  de: "@aBianca@bMir scheint fast, als käme der Mann nicht aus dieser Gegend. Nun, wenn er nichts weiß, dann weiß er eben nichts.\n@c0@"
  en: "@aBianca@bIt's almost like that bloke's not from 'round here.\r\nI s'pose it's fair enough that he dun't know, though.\n@c0@"
  es: "@aBianca@bCasi parece que ese tipo no sea de por aquí, ¿sabes?\r\nSupongo que tiene derecho a no saberlo.\n@c0@"
  fr: "@aBianca@bOn dirait presque que ce type n'est pas d'ici.\r\nMais bon, il est tout à fait envisageable qu'il ne\r\nsoit pas au courant.\n@c0@"
  it: "@aBianca@bSecondo me anche quel tipo sta cercando il tesoro. Dev'essere per questo motivo che non ha voluto dirci niente di utile: teme che lo troviamo prima di lui!\n@c0@"
  ja: "@a@bビアンカ「まあ　あの人は\n\t旅人って感じだもんね。\n\t知らなくても　ムリはないか……。\n@c0@"
69:
  de: "@aNera@bAnscheinend wissen nicht alle über diesen Schatz Bescheid, nach dem wir suchen.\n@c0@"
  en: "@aNera@bIt looks like this treasure we're looking for isn't something that everyone knows about.\n@c0@"
  es: "@aNera@bParece que no tutto il mondo ha oído hablar de ese tesoro que andamos buscando.\n@c0@"
  fr: "@aNera@bIl semblerait que le trésor que nous cherchons ne\r\nsoit pas forcément connu de tout le monde.\n@c0@"
  it: "@aNera@bNon è facile ottenere informazioni sul tesoro che stiamo cercando, eh?\nSecondo me ci conviene insistere...\n@c0@"
  ja: "@a@bフローラ「幻の名産とは　誰もが知っている\n\t…という品では　ないのですね。\n@c0@"
70:
  de: "@a%0%a001240@bIch möcht' ja mal wissen, was der Mann hier macht. Ob er seine ganze Zeit damit verbringt, Schokomünzen zu futtern?\n@c0@"
  en: "@a%0%a001240@bI wonder what that man's doing here.\nDo you think he just spends all his days\neating chocolate medalliyums?\n@c0@"
  es: "@a%0%a001240@b¿Qué estará haciendo ese hombre aquí?\n¿Crees que se pasa la vida comiendo medallones de chocolate?\n@c0@"
  fr: "@a%0%a001240@bJe me demande ce que cet homme fait ici.\nTu crois qu'il passe toutes ses journées à\nmanger des médailles en chocolatⓡ\n@c0@"
  it: "@a%0%a001240@bQuel signore aveva le labbra sporche di cioccolato!\nSecondo me si era appena sbafato una deliziosa medaglia...\n@c0@"
  ja: "@a@b%a001240「あの人　ここで\n\t何してるのかな？　ずっと\n\tメダル型チョコ　食べてたりして！\n@c0@"
71:
  de: "@a%0%a001250@bWenn er noch nie davon gehört hat, dann ist das vielleicht etwas ganz, ganz Altes.\n@c0@"
  en: "@a%0%a001250@bIf he's never heard of it, maybe that means it's really old.\n@c0@"
  es: "@a%0%a001250@bSi nunca ha oído hablar de él, es que igual es muy antiguo.\n@c0@"
  fr: "@a%0%a001250@bS'il n'en a jamais entendu parler, c'est peut-être\nque ce trésor est vraiment très vieux.\n@c0@"
  it: "@a%0%a001250@bChissà dov'è nascosto il tesoro...\n@c0@"
  ja: "@a@b%a001250「知らない人がいるってことは\n\tすごく古いものなのかな？\n@c0@"
72:
  de: "@aOtto@bMehr kann uns der wohl net sagen. Fragen wir jemand anderen.\n@c0@"
  en: "@aTuppence@bLooks like we won't be getting any more information out of him. Let's try someone else.\n@c0@"
  es: "@aAlazar@bMe parece que no le vamos a sonsacar más información. Probemos con otro.\n@c0@"
  fr: "@aInnocent@bOn dirait qu'on n'arrivera pas à obtenir plus d'informations de sa part. Essayons ailleurs.\n@c0@"
  it: "@aSimon@bNon credo che riusciremo a ottenere informazioni da quel tizio, Sire.\nProviamo a chiedere a qualcun altro...\n@c0@"
  ja: "@a@bピピン「どうやら　あの人からは\n\tこれ以上情報を　聞けないようです。\n\tさっ　次へ行きましょう。\n@c0@"
73:
  de: "@aBianca@bRätselhaftes Ding? Was kann das nur sein?\n@c0@"
  en: "@aBianca@bPuzzling little thing? I wonder what it is!\n@c0@"
  es: "@aBianca@b¿Minicosa rara? ¡Me pregunto qué será!\n@c0@"
  fr: "@aBianca@bCe truc qui est apparu comme par enchantementⓡ\nJe me demande ce que c'estⓠ\n@c0@"
  it: "@aBianca@bUno strano oggetto?\nDi cosa si tratterà?\n@c0@"
  ja: "@a@bビアンカ「アレ？\n\tアレって　なにかしら？？\n@c0@"
74:
  de: "@aNera@bEr hat es der Frau in der Herberge gegeben? Es kann wohl kaum ein sehr kostbarer Schatz sein, wenn er ihn einfach so weggegeben hat!\n@c0@"
  en: "@aNera@bHe gave it to the woman at the inn? It can't be that great a treasure if he just gave it away!\n@c0@"
  es: "@aNera@b¿Que se la dio a la donna de la posada? ¡Si se la dio tan alegremente, no debe de ser un tesoro muy grande!\n@c0@"
  fr: "@aNera@bIl l'a donné à la dame de l'aubergeⓡ Ça ne doit\npas être un si grand trésor que ça, s'il n'hésite pas\nà le donner.\n@c0@"
  it: "@aNera@bSe lo ha dato alla donna che gestisce la locanda, non può certo trattarsi di un tesoro prezioso! A meno che re Minikin non sia incredibilmente generoso...\n@c0@"
  ja: "@a@bフローラ「おかみさんに　あげた？\n\t幻の名産品って　そんなに　気軽に\n\tあげられるような　物なのかしら？\n@c0@"
75:
  de: "@a%0%a001240@bEr hat's einfach so weggegeben? Dann hätte er's doch auch gleich uns geben können!\n@c0@"
  en: "@a%0%a001240@bHe gave it away just like that!?\nIf only he'd given it to us!\n@c0@"
  es: "@a%0%a001240@b¿Lo dio así como así?\nSi nos lo hubiese dado a nosotros...\n@c0@"
  fr: "@a%0%a001240@bIl l'a donné, comme çaⓡ Si seulement c'était à nous qu'il l'avait donnéⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, se fossimo passati prima, forse lo avrebbe dato a noi!\n@c0@"
  ja: "@a@b%a001240「そんなに　かんたんに\n\tあげられるものなの？\n\tボクたちに　くれれば良かったのに！\n@c0@"
76:
  de: "@a%0%a001250@bWas kann das nur sein?\n@c0@"
  en: "@a%0%a001250@bI wonder what it is exactly...\n@c0@"
  es: "@a%0%a001250@bMe pregunto qué será exactamente...\n@c0@"
  fr: "@a%0%a001250@bJe me demande ce que c'est exactement...\n@c0@"
  it: "@a%0%a001250@bMi chiedo cosa sia questo ⓕstrano oggettoⓖ...\n@c0@"
  ja: "@a@b%a001250「アレって　なんだろう……。\n@c0@"
77:
  de: "@aSancho@bWo liegt sie wohl, diese rückwärtige Domäne? Wenn er dort etwas eindellen kann, dieser Schatz, dann ist er sisser ziemliss hart, no?\n@c0@"
  en: "@aSancho@bWhere ees thees rear dominium?\nBut eef he has a pain there, thees treasure, eet must be esometheeng hard, no?\n@c0@"
  es: "@aSancho@b¿Dónde está ese minidominio posterior?\nPues, nomás que si te duele el minidominio posterior, tiene que ser porque es algo reteduro.\n@c0@"
  fr: "@aSancho@bC'est quoi le p-p-postérieur dominienⓡ Si le trésor\nlui a causé oune d-douleur à cet endroit, c'est que ça doit être quelque chose de t-très dur, noⓡ\n@c0@"
  it: "@aSancho@bSi l'oggetto era escomodo por las suas ⓕregales tergasⓖ, deve trattarse de una cosa muy dura...\n@c0@"
  ja: "@a@bサンチョ「シリが　痛いとは…\n\tあれとは　どうやら\n\tかたい物のようですね……。\n@c0@"
78:
  de: "@aOtto@bIch dacht', wir hätten keine Chance, an den Schatz ranzukommen, wo er doch so selten sein soll, aber allmählich schöpf' ich wieder Hoffnung!\n@c0@"
  en: "@aTuppence@bI thought we had no chance of getting hold of it, what with it supposedly being so rare, but now I'm full of hope!\n@c0@"
  es: "@aAlazar@bAl ser tan singular, pensé que nos sería imposible echarle el guante, pero ahora tengo esperanzas.\n@c0@"
  fr: "@aInnocent@bJe croyais qu'on n'avait aucune chance de mettre\nla main dessus, vu que c'est un trésor exceptionnel, mais maintenant, je suis plein d'espoirⓠ\n@c0@"
  it: "@aSimon@bL'istinto mi dice che potremmo essere tanto fortunati da mettere le mani su quest'oggetto misterioso...\n@c0@"
  ja: "@a@bピピン「幻と　いうから　かんたんに\n\tもらえないかと思ってましたが……\n\tこれなら　期待できそうです！\n@c0@"
79:
  de: "@aBianca@bSie redet sicher von dem Schatz, von dem wir gehört haben, nicht, %a000090?\n@c0@"
  en: "@aBianca@bShe must be talkin' about the treasure we heard about, eh, %a000090?\n@c0@"
  es: "@aBianca@bDebe de referirse a ese tesoro del que hemos oído hablar, ¿no, %a000090?\n@c0@"
  fr: "@aBianca@bElle doit faire référence au trésor dont nous avons entendu parler, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bUn fermacarte?! Un tagliere?!\nMa siamo sicuri che quest'oggetto sia un tesoro, %a000090?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tアレって　幻の名産品じゃないのかな？\n@c0@"
80:
  de: "@aBianca@bWenn wir schon so weit gekommen sind, dann sollten wir jetzt auch versuchen, das Ding zu finden!\n@c0@"
  en: "@aBianca@bWe should try and find the thing now we've trailed after it this far!\n@c0@"
  es: "@aBianca@b¡Ya que llevamos tanto tiempo detrás de él, deberíamos intentar encontrarlo!\n@c0@"
  fr: "@aBianca@bIl faudrait essayer de trouver cet objet,\nmaintenant que nous avons fait tout ce cheminⓠ\n@c0@"
  it: "@aBianca@bOra sì che sono curiosa!\nForza, troviamo quest'affare e vediamo di che si tratta!\n@c0@"
  ja: "@a@bビアンカ「でも　とりあえず　最後まで\n\tゆくえを　追ってみましょうか。\n@c0@"
81:
  de: "@aNera@bEs klingt, als würde dieser Schatz wirklich die Runde machen. Ich bin so gespannt darauf, was es sein könnte!\n@c0@"
  en: "@aNera@bIt sounds like this treasure is really doing the rounds. I'm so curious about what it is!\n@c0@"
