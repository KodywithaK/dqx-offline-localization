0:
  de: "@aBianca@bDa wären wir wieder! Wie viele Minimedaillen wir wohl inzwischen haben?\n@c0@"
  en: "@aBianca@bHere again, eh? I wonder how many mini medals we've got now.\n@c0@"
  es: "@aBianca@b¿Otra vez por aquí? Me pregunto cuántas minimedallas tenemos ya.\n@c0@"
  fr: "@aBianca@bNous voilà de retour ici, heinⓡ Je me demande combien de mini médailles on possède actuellement.\n@c0@"
  it: "@aBianca@bRieccoci qui!\nMi chiedo quante minimedaglie abbiamo adesso...\n@c0@"
  ja: "@a@bビアンカ「またここ？\n\tそういえば　ちいさなメダルは\n\tいくつ　たまってたかしら……。\n@c0@"
1:
  de: "@aBianca@bHier ist es immer so heiß. Ich wette, vor lauter Hitze werden wir nachts kein Auge zutun.\n@c0@"
  en: "@aBianca@bIt's always so hot here. I bet it's impossible tryin' to sleep of a night.\n@c0@"
  es: "@aBianca@bAquí siempre hace muchísimo calor. Seguro que dormir es imposible, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl fait toujours tellement chaud, ici. Je parie que c'est impossible de fermer l'œil de la nuit.\n@c0@"
  it: "@aBianca@bQui fa sempre un caldo incredibile, eh?\nAccidenti, sto fondendo!\n@c0@"
  ja: "@a@bビアンカ「このへんは　暑いから\n\t夜は　寝苦しいかもしれないわね。\n@c0@"
2:
  de: "@aNera@bIn diesem winzigen abgelegenen Schloss auf seiner Insel im Süden, ganz für sich, ist man gleich in einer ganz anderen Welt.\n@c0@"
  en: "@aNera@bThis tiny castle tucked away on its own island in the south is like a little world all of its own.\n@c0@"
  es: "@aNera@bEste piccolo castello apachurrado en su propia isla en el sur, es come un mondo aparte.\n@c0@"
  fr: "@aNera@bCe petit château, blotti seul sur son île du sud, est un peu comme un petit monde à part.\n@c0@"
  it: "@aNera@bQuesto piccolo castello piazzato su un'isoletta dei mari del sud sembra un mondo a sé...\nC'è un'atmosfera particolarissima, non trovi?\n@c0@"
  ja: "@a@bフローラ「ここは　南の島の\n\t小さなお城　という感じで\n\tほかとは　別世界のようですわね。\n@c0@"
3:
  de: "@aNera@bMinimedaillen sind so hübsch und niedlich. Ich kann gut verstehen, warum man sie gern sammeln möchte.\n@c0@"
  en: "@aNera@bMini medals are so pretty and sweet. I can understand why people start collecting them.\n@c0@"
  es: "@aNera@bLas minimedallas son tan bellas y dolci. Veramente, entiendo por qué la gente empieza a coleccionarlas.\n@c0@"
  fr: "@aNera@bLes mini médailles sont si mignonnes. Je comprends pourquoi les gens les collectionnent.\n@c0@"
  it: "@aNera@bLe minimedaglie sono degli oggetti graziosissimi.\nNon mi stupisce che ci sia gente che le colleziona...\n@c0@"
  ja: "@a@bフローラ「ちいさなメダルって\n\tかわいらしくて　キレイですものね。\n\t集めたくなる気持ちも　わかりますわ。\n@c0@"
4:
  de: "@a%0%a001240@bIch weiß was, Papa!\nWarum laufen wir nicht um die Wette?\nWer als Erster das Schloss umrundet!\n@c0@"
  en: "@a%0%a001240@bI know, Dad! Why don't we have a race and see who can run around the castle the fastest?\n@c0@"
  es: "@a%0%a001240@b¡Ya sé, papi! ¿Por qué no echamos una carrera a ver quién puede dar la vuelta al castillo más rápido?\n@c0@"
  fr: "@a%0%a001240@bJe sais, papaⓠ Et si on faisait la course pour savoir qui arrivera à faire le tour du château en premierⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, facciamo una corsa?\nVediamo chi è il più veloce a fare il giro del castello!\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\tお城のまわり　かけっこしよう！\n\tどっちが速いか　競争しようよ！\n@c0@"
5:
  de: "@a%0%a001240@bEin winziges Schloss auf einer winzigen kleinen Insel. Es sieht aus wie ein Spielzeug!\n@c0@"
  en: "@a%0%a001240@bA tiny little castle on a tiny little island.\nIt looks just like a toy!\n@c0@"
  es: "@a%0%a001240@bUn castillito en una islita.\nParece de juguete.\n@c0@"
  fr: "@a%0%a001240@bUn tout petit château sur une toute petite île.\nOn dirait un jouetⓠ\n@c0@"
  it: "@a%0%a001240@bUn castello piccolo piccolo su un'isola piccina piccina...\nEh eh eh!\nSembra di stare in una favola!\n@c0@"
  ja: "@a@b%a001240「ちっちゃな島に\n\tちっちゃなお城。\n\tおもちゃみたいだね。\n@c0@"
6:
  de: "@a%0%a001250@bHier blitzt und blinkt alles. Meine Augen werden schon ganz müde!\n@c0@"
  en: "@a%0%a001250@bEvery single thing here seems to glisten and shine.\nMy eyes are starting to get worn out!\n@c0@"
  es: "@a%0%a001250@bTodo aquí parece relucir.\n¡Se me está cansando la vista!\n@c0@"
  fr: "@a%0%a001250@bIci, on dirait que tous les objets brillent et scintillent. Ça commence même à me fatiguer les yeuxⓠ\n@c0@"
  it: "@a%0%a001250@bMamma mia, che splendore!\nQui brilla tutto!\nMi fanno quasi male gli occhi...\n@c0@"
  ja: "@a@b%a001250「ここって　なんでも\n\tかんでも　ピカピカね。\n\tちょっと目が　いたくなっちゃった。\n@c0@"
7:
  de: "@a%0%a001250@bHm. Ganz schön heiß hier, was?\n@c0@"
  en: "@a%0%a001250@bHuh. It's a bit hot here, isn't it?\n@c0@"
  es: "@a%0%a001250@bMmm. Hace calor aquí dentro, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bPfff. Il fait un peu chaud, ici, nonⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ho caldo...\n@c0@"
  ja: "@a@b%a001250「ふう…\n\tちょっと　暑いね　ここ……。\n@c0@"
8:
  de: "@aSancho@bDas Schloss, es ist klein, aber mit Liebe gebaut. Was mit Liebe gemacht ist, kann ruhig klein sein. Nur nisst die Paella! Die Paella, sie muss immer groß sein!\n@c0@"
  en: "@aSancho@bThees castle, ees esmall, but ees made well, sí? Eef esometheeng ees made well, ees okay to be esmall.\r\nBut no the paella. The paella, eet must be beeg!\n@c0@"
  es: "@aSancho@bEste castillitito es chiquito, pero está bien hecho.\nSi algo está bien hecho, pues da igual su tamaño...\n㈡\nMenos con los frijoles. Los frijoles tienen que ser grandototes, nomás.\n@c0@"
  fr: "@aSancho@bCe château est p-petit, mais il est bien fait, noⓡ Quand oune chose est bien c-construite, ça n'est\np-pas grave si elle est petite.\n㈡\nSauf la paella. La paella, ça doit toujours\nêtre grandⓠ\n@c0@"
  it: "@aSancho@bEsto castillo es minuscolo, chico, ma es muy bello.\n¿Sabe como se dice?\nⓕNel pentolon piccolo ce está la paella buenaⓖ...\n@c0@"
  ja: "@a@bサンチョ「ずいぶん　こぢんまりと\n\tまとまったお城ですねえ。\n@c0@"
9:
  de: "@aSancho@bDieser Ort, er liegt mitten im Meer. Hier, es gibt jeden Tag frischen Fisch, no? Sí, ist perfekt für Paella.\n@c0@"
  en: "@aSancho@bThees place, ees een the middle of the esea. Every day they gonna have the fresh feesh, no? Sí, ees perfect for the paella.\n@c0@"
  es: "@aSancho@bEste sitio está en medio del mar. Tendrán pescado fresco toditos los días. Sí: ideal para unos burritos marineros.\n@c0@"
  fr: "@aSancho@bCet endroit est au milieu de la m-m-mer.\nTous les jours, ils ont du p-poisson frais, noⓡ\nSi, c'est p-parfait pour la paella.\n@c0@"
  it: "@aSancho@b¡Esta es un'isola, y yo adoro las isolas!\nLas isolas sono circondatas dal mar, quindi cada día se puede aver pesce fresco.\n㈡\n¡L'ideale por preparare una deliciosa paella!\n@c0@"
  ja: "@a@bサンチョ「海の真ん中だと\n\t毎日　しんせんな魚が食べられて\n\tよろしいですなあ。\n@c0@"
10:
  de: "@aOtto@bFür ein Schloss ist es ziemlich klein. Ich glaub', mein eigenes Schloss werd' ich lieber etwas größer planen.\n@c0@"
  en: "@aTuppence@bIt's rather on the small side for a castle. I think I'll be setting my sights somewhat higher when I build mine.\n@c0@"
  es: "@aAlazar@bPara ser un castillo, es bastante canijo. Cuando construya mi propio castillo, aspiro a algo un poco más grande.\n@c0@"
  fr: "@aInnocent@bIl est plutôt petit, pour un château. Le jour où je construirai le mien, je viserai plus grand, je crois.\n@c0@"
  it: "@aSimon@bCome mai hanno edificato un castello tanto piccolo, Maestà? Avranno voluto risparmiare sulle spese di costruzione e di manutenzione?\n@c0@"
  ja: "@a@bピピン「そうだよなあ。\n\tお城っていっても　ピンキリだ。\n\tボクは　もっと　上を目指すぞ！\n@c0@"
11:
  de: "@aOtto@bIch bin ganz beeindruckt, dass man auf dieser winzigen Insel überleben kann. Ihr etwa net?\n@c0@"
  en: "@aTuppence@bI'm rather impressed at how anyone could manage to survive out here on this island, aren't you?\n@c0@"
  es: "@aAlazar@bMe sorprende que alguien pueda sobrevivir en esta isla, ¿y a vos?\n@c0@"
  fr: "@aInnocent@bJe suis impressionné que des gens aient pu survivre sur une île aussi isolée, pas vousⓡ\n@c0@"
  it: "@aSimon@bChissà come dev'essere vivere su un'isoletta del genere... Uhm... Temo che finirei per annoiarmi: io preferisco i posti un po' più vivaci e popolati.\n@c0@"
  ja: "@a@bピピン「こんな　ふべんな島で\n\tよく　暮らせるものですね。\n\t感心しちゃいますよ。\n@c0@"
12:
  de: "@aBianca@bSein Eifer ist bewundernswert, aber können sich Schleime durch Übung denn überhaupt größer machen?\n@c0@"
  en: "@aBianca@bYou can't knock him for bein' ambitious, but can slimes even make themselves bigger through trainin'?\n@c0@"
  es: "@aBianca@bAmbición no le falta, pero ¿los limos pueden crecer a base de entrenarse?\n@c0@"
  fr: "@aBianca@bOn ne peut pas lui en vouloir d'être ambitieux, mais les gluants peuvent-ils vraiment devenir plus costauds en s'entraînantⓡ\n@c0@"
  it: "@aBianca@bCredi che gli Slime possano diventare più grandi con l'allenamento?\n@c0@"
  ja: "@a@bビアンカ「こころざしの高さは\n\tみとめるけど　スライムって\n\tきたえると　大きくなるのかな？\n@c0@"
13:
  de: "@aNera@bWie lustig, einen Schleim im Training zu sehen! Aber wenn er dem auf dem Dach nacheifern will, dann würde ich sagen, Essen macht den Meister.\n@c0@"
  en: "@aNera@bHow funny to see a slime in training! But if it wants to be like the one on the roof, I'd say eating a lot would be the answer.\n@c0@"
  es: "@aNera@b¡Qué curioso ver a un limo entrenarse! Pero, si quiere ser como el del tejado, credo que la solución es mangiare mucho.\n@c0@"
  fr: "@aNera@bC'est marrant de voir un gluant s'entraînerⓠ Mais\ns'il veut ressembler à celui qui est sur le toit, il\nferait sans doute mieux de beaucoup manger.\n@c0@"
  it: "@aNera@bNon sono sicura che questo Slime abbia tutte le rotelle a posto...\n@c0@"
  ja: "@a@bフローラ「身体を　きたえていたのね。\n\t屋根のようになるなら　たくさん\n\t食べるのが　近道だと思うんですけど。\n@c0@"
14:
  de: "@a%0%a001240@bDas war Training? Sah mir aber mehr nach flummiartigem Herumgehüpfe aus.\n@c0@"
  en: "@a%0%a001240@bThat was training? It looked more like bouncing about to me.\n@c0@"
  es: "@a%0%a001240@b¿Eso es entrenar? A mí me parecía más que estaba dando brincos.\n@c0@"
  fr: "@a%0%a001240@bÇa, c'était de l'entraînementⓡ Pour moi, ça ressemblait juste à des bonds.\n@c0@"
  it: "@a%0%a001240@bTroppo forte!\nPapà, anch'io voglio allenarmi come fa quello Slime!\n@c0@"
  ja: "@a@b%a001240「あれって　きたえてたの？\n\tもしかして…　ウサギとび？？\n@c0@"
15:
  de: "@a%0%a001250@bWas für ein schlauer kleiner Schleim! Vielleicht fange ich auch an zu trainieren, damit ich groß und stark werde!\n@c0@"
  en: "@a%0%a001250@bWhat a clever little slime! Maybe I'll start training so I can be big and strong too!\n@c0@"
  es: "@a%0%a001250@b¡Qué limito tan listo! Quizás yo también empiece a entrenar para ser grande y fuerte.\n@c0@"
  fr: "@a%0%a001250@bQu'il est intelligent, ce petit gluantⓠ Peut-être que\nje devrais aussi commencer à m'entraîner pour devenir grande et forteⓠ\n@c0@"
  it: "@a%0%a001250@bChe Slime intelligente!\nAnch'io comincerò ad allenarmi, così diventerò grande e forte!\n@c0@"
  ja: "@a@b%a001250「すご～い。\n\tあのスライムさん　おりこうさんだね。\n\tわたしも　きたえて　強くなります！\n@c0@"
16:
  de: "@aSancho@bIss hätte mir nie träumen lassen, dass iss je einem Schleim mit einem Traum begegnen würde! Iss bin wirkliss beeindruckt!\n@c0@"
  en: "@aSancho@bI never imagine I would meet a slime weeth dreams! Ees amazing!\n@c0@"
  es: "@aSancho@bNunca pensé que encontraría un limo con aspiraciones. ¡Está padrísimo!\n@c0@"
  fr: "@aSancho@bJ-Je n'aurai jamais imaginé c-croiser oun gluant avec des rêvesⓠ C'est incroyableⓠ\n@c0@"
  it: "@aSancho@bAnche quello Slime ha compreso que es necessario impegnarse al maximo por realizzare los proprio sueños...\n@c0@"
  ja: "@a@bサンチョ「いやはや　こころざしの高い\n\tスライムも　いたもんですねえ。\n@c0@"
17:
  de: "@aOtto@bVielleicht sollt' ich auch ein bisserl trainieren. Ich kann mich ja wohl net von einem mickrigen kleinen Schleim in den Schatten stellen lassen.\n@c0@"
  en: "@aTuppence@bMaybe I should put in a bit of training. It wouldn't do to be bested by a measly little slime.\n@c0@"
  es: "@aAlazar@bIgual yo debería entrenar un poco. No me gustaría que un limo limoso me ganara.\n@c0@"
  fr: "@aInnocent@bPeut-être que je devrais m'entraîner un peu.\r\nÇa ne serait pas terrible de se faire surpasser\r\npar un minuscule gluant.\n@c0@"
  it: "@aSimon@bUhm, forse dovrei prendere esempio da quello Slime e dedicare un po' più di tempo al mio addestramento...\n@c0@"
  ja: "@a@bピピン「ボクも　スライムに負けないように\n\tきたえなくちゃ！\n@c0@"
18:
  de: "@aBianca@bDa hat er recht. Die Schokomünzen sind köstlich.\n@c0@"
  en: "@aBianca@bHe's right there. Them chocolate medalliyums\r\nare delicious.\n@c0@"
  es: "@aBianca@b¡Está justo ahí! Esos medallones de chocolate están para chuparse los dedos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a raison. Les médailles en chocolat sont\r\nun vrai régal.\n@c0@"
  it: "@aBianca@bHa ragione!\nLe medaglie di cioccolato sono davvero deliziose!\n@c0@"
  ja: "@a@bビアンカ「そうなのよね！\n\tメダル型チョコって　おいしいのよね！\n@c0@"
19:
  de: "@aBianca@bÄhm... Tut mir leid, %a000090. Um ehrlich zu sein, ich hab mir mit meinem Ersparten welche gekauft und konnte mich nicht zurückhalten. Sie sind alle weg.\n@c0@"
  en: "@aBianca@bEr... Sorry, %a000090. Truth is, I used my own savings to buy some, and I ended up wolfin' down the lot!\n@c0@"
  es: "@aBianca@bEstooo... Lo siento, %a000090. Lo cierto es que me he gastado mis ahorros en unos y, al final, me los he zampado todos.\n@c0@"
  fr: "@aBianca@bEuh... Désolée, %a000090. En fait, j'ai utilisé mes propres économies pour m'en acheter quelques-unes, et j'ai fini par toutes les engloutirⓠ\n@c0@"
  it: "@aBianca@bBeh, %a000090?! Cos'hai da guardare?! Sono a dieta, è vero, ma ogni tanto mi concedo uno strappo!\nE poi il cioccolato tiene su di morale, non lo sai?\n@c0@"
  ja: "@a@bビアンカ「あっ　ごめんね　%a000090。\n\t私　ヘソクリで　チョコ買って\n\t食べちゃったんだ……。\n@c0@"
20:
  de: "@aNera@bIch glaube, man muss schon ziemlich tapfer sein, um die ganze Zeit im Pyjama herumzulaufen.\n@c0@"
  en: "@aNera@bI think you'd need to be quite brave to wander about in your pyjamas all the time.\n@c0@"
  es: "@aNera@bCredo que hay que tener molto coraggio para andar todo el tiempo en pijama por ahí.\n@c0@"
  fr: "@aNera@bJe trouve qu'il faut être assez courageux pour\r\nse balader en pyjama tout le temps.\n@c0@"
  it: "@aNera@bCerto che bisogna avere un bel coraggio ad andarsene in giro in pigiama, non credi?\n@c0@"
  ja: "@a@bフローラ「ず～っと　パジャマのままで\n\t外を　歩くのって　少し\n\t勇気がいりますわよね。\n@c0@"
21:
  de: "@a%0%a001240@bIn Schokomünzen könnt' ich mich reinlegen! Aber Sancho hat gesagt, wir dürfen höchstens zwei auf einmal essen.\n@c0@"
  en: "@a%0%a001240@bI love chocolate medalliyums! But Sancho said we can only eat a maximum of two at a time.\n@c0@"
  es: "@a%0%a001240@b¡Me encantan los medallones de chocolate! Pero Sancho solo nos deja comer dos al día.\n@c0@"
  fr: "@a%0%a001240@bJ'adore les médailles en chocolatⓠ Mais Sancho dit qu'on ne peut pas en manger plus de deux à la fois.\n@c0@"
  it: "@a%0%a001240@bAdoro le medaglie di cioccolato! Però non le mangio come lo zio Sancho, che le aggiunge alla paella.\nA me piacciono da sole, non insieme al pesce...\n@c0@"
  ja: "@a@b%a001240「ボクも　メダル型チョコ大好き！\n\tでも　サンチョは　１回に\n\t２枚までしか　食べちゃダメだって。\n@c0@"
22:
  de: "@a%0%a001250@bIch esse gern Schokolade, aber hinterher nörgelt Sancho immer so lange herum, dass ich mir die Zähne putzen soll.\n@c0@"
  en: "@a%0%a001250@bI like eating chocolate, but Sancho's always such a nag afterwards trying to get me to clean my teeth.\n@c0@"
  es: "@a%0%a001250@bMe encanta comer chocolate, pero Sancho luego me da la brasa para que me lave los dientes.\n@c0@"
  fr: "@a%0%a001250@bJ'adore manger du chocolat. Mais après, Sancho\nest toujours pénible parce qu'il veut que je me brosse les dents.\n@c0@"
  it: "@a%0%a001250@bIl cioccolato è buono.\n@c0@"
  ja: "@a@b%a001250「わたしも　チョコは好きだけど\n\t食べたあと　サンチョが\n\t歯みがきしなさいって　うるさいの。\n@c0@"
23:
  de: "@a%0%a001250@bIch glaube, heute ist mir das die Mühe nicht wert.\n@c0@"
  en: "@a%0%a001250@bI don't think I'll bother having any today.\n@c0@"
  es: "@a%0%a001250@bAsí que creo que, por hoy, paso.\n@c0@"
  fr: "@a%0%a001250@bAlors comme je n'ai pas envie de m'embêter aujourd'hui, je ne vais pas en manger.\n@c0@"
  it: "@a%0%a001250@bL'importante è ricordarsi di lavarsi i denti accuratamente dopo averlo mangiato!\nMe l'ha detto lo zio Sancho...\n@c0@"
  ja: "@a@b%a001250「だから\n\t今日は　いらないです……。\n@c0@"
24:
  de: "@aSancho@bDu sammelst doch auch diese Minimedaillen, nisst wahr, Chico?\n@c0@"
  en: "@aSancho@bYou collect these mini medals too, sí, friend?\n@c0@"
  es: "@aSancho@b¿Tú también coleccionas minimedallas, chamaco?\n@c0@"
  fr: "@aSancho@bTu c-c-collectionnes ces mini médailles aussi, chicoⓡ\n@c0@"
  it: "@aSancho@bChico, no dirme que anche tu collezioni las minimedaglias...\n@c0@"
  ja: "@a@bサンチョ「ちいさなメダルというと\n\t坊っちゃんも　たしか\n\t集めてましたよね？\n@c0@"
25:
  de: "@aSancho@bIss glaube, es gibt noch einen Señor, der diesen dummen Schnickschnack sammelt. Die ganze Welt ist loco geworden!\n@c0@"
  en: "@aSancho@bI no believe another señor, he ees collecting thees estupid bric-a-brac. The whole world, ees loco!\n@c0@"
  es: "@aSancho@bNo me puedo creer que otro señor esté coleccionando esas fruslerías. ¡Qué loco mundo!\n@c0@"
  fr: "@aSancho@bJe n'arrive pas à c-croire qu'oun autre señor collectionne tout ce stoupide bric-à-brac.\nTout le monde est loco, siⓠ\n@c0@"
  it: "@aSancho@b¡Yo no entiendo por qué todo el mundo está loco por estos oggettinos muy estupidos! ¿Que ce troverà la gente de tanto carino en las minimedaglias? ¡Mah!\n@c0@"
  ja: "@a@bサンチョ「あんなガラクタを\n\tほかにも集めている人が　いるとは。\n\t世の中　わからないもんですね。\n@c0@"
26:
  de: "@aOtto@bPrügelpyjamas? Das klingt mir doch ganz nach der standesgemäßen Nachtkleidung für einen strammen jungen Krieger wie mich!\n@c0@"
  en: "@aTuppence@bPowjamas? They sound like just the kind of nightwear for a strapping young warrior like me!\n@c0@"
  es: "@aAlazar@b¿Pijama acolchado? Parecen la prenda de noche ideal para un valiente y apuesto soldado como yo.\n@c0@"
  fr: "@aInnocent@bUn pyjama de combatⓡ On dirait le vêtement de nuit idéal pour un jeune et solide guerrier comme moiⓠ\n@c0@"
  it: "@aSimon@bPigiama da guerra?!\nAh, cosa non s'inventerebbero gli stilisti pur di vendere!\n@c0@"
  ja: "@a@bピピン「せんしのパジャマ！？\n\tまるで　ボクのために用意された\n\tアイテムじゃないですかっ。　ねっ？\n@c0@"
27:
  de: "@aBianca@bÄhm, glaubst du, wir können der Bank hier trauen? Auf mich wirkt das ein wenig zwielichtig.\n@c0@"
  en: "@aBianca@bUm, d'you reckon the bank here's above board, %a000090? It smells a bit fishy to me.\n@c0@"
  es: "@aBianca@bMmm, ¿tú crees que este banco es del todo limpio, %a000090? A mí me huele un poco a chamusquina, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm. Tu crois que cette banque est réglo, %a000090ⓡ Moi, elle me semble un peu louche.\n@c0@"
  it: "@aBianca@b%0%a000090, credi ci si possa fidare di questa ⓕbancaⓖ?\nSiamo sicuri che sia una cosa legale?\n@c0@"
  ja: "@a@bビアンカ「ちょっと　%a000090。\n\tここの銀行って　大丈夫なのかな？\n\tなんだか　不安になる銀行よね。\n@c0@"
28:
  de: "@aNera@bEr scheint ein vertrauenswürdiger Mann zu sein. Es ist gut zu wissen, dass er so gut auf das Geld seiner Kunden achtet.\n@c0@"
  en: "@aNera@bHe seems like a trustworthy fellow. It's nice to know he takes such good care of his customers' money.\n@c0@"
  es: "@aNera@bParece un sujeto digno de confianza. Veramente, tranquiliza saber que cuida tan bien del dinero de sus clientes.\n@c0@"
  fr: "@aNera@bIl m'a l'air d'être digne de confiance.\r\nC'est rassurant de voir qu'il prend autant\r\nsoin de l'argent de ses clients.\n@c0@"
  it: "@aNera@bIl mio istinto mi dice che possiamo fidarci di questo tizio.\nMi pare una persona onesta.\n@c0@"
  ja: "@a@bフローラ「あの方が　大切に\n\tしまってくださるそうですから\n\t安心ですわね。\n@c0@"
29:
  de: "@a%0%a001240@bDer klang mir viel zu einladend. Ich bin mir nicht sicher, ob ich ihm trauen sollte oder nicht.\n@c0@"
  en: "@a%0%a001240@bThere was something a bit too jolly about him.\nI'm not sure if I trust him or not.\n@c0@"
  es: "@a%0%a001240@bEstaba demasiado alegre.\nNo sé si fiarme de él.\n@c0@"
  fr: "@a%0%a001240@bIl avait quelque chose d'un peu trop jovial.\nJe ne suis pas sûr qu'il faille lui faire confiance.\n@c0@"
  it: "@a%0%a001240@bPapà, fossi in te non mi fiderei di quel tipo...\nHa lo sguardo troppo furbo.\n@c0@"
  ja: "@a@b%a001240「最後の　ムフフ\n\tっていうのが　気になるんだよね。\n\tアレがなかったら　信じられるのに。\n@c0@"
30:
  de: "@a%0%a001250@bDer hat mich ganz nervös gemacht. Es ist fast, als würden wir auf die Probe gestellt, ob wir anderen Leuten vertrauen oder nicht.\n@c0@"
  en: "@a%0%a001250@bI feel all nervous now. It's like we're being put to the test to see if we trust in people.\n@c0@"
  es: "@a%0%a001250@b¡Estoy nerviosísima! Es como si nos estuvieran poniendo a prueba para ver si confiamos en la gente.\n@c0@"
  fr: "@a%0%a001250@bJe me sens nerveuse, maintenant.\nC'est comme si c'était un test pour\nvoir si on fait confiance aux gens.\n@c0@"
  it: "@a%0%a001250@bFidarsi o non fidarsi?\nQuesto è il problema!\nPapà, che ne dici?\n@c0@"
  ja: "@a@b%a001250「人を信じる心　っていうのを\n\tためされているみたいで\n\tドキドキします……。\n@c0@"
31:
  de: "@aSancho@bSoll das ein Witz sein? Oder hat dieser Señor das etwa ernst gemeint?\n@c0@"
  en: "@aSancho@bEes a joke? Or thees señor, he ees eserious?\n@c0@"
  es: "@aSancho@b¿Será una broma? ¿O el señor habla de veras?\n@c0@"
  fr: "@aSancho@bC'est oune b-blagueⓡ Ou bien ce señor, il est\nv-vraiment sérieuxⓡ\n@c0@"
  it: "@aSancho@b¿Chico, piensi que ce podemos fidar de esto señor?\n@c0@"
  ja: "@a@bサンチョ「う～む…　あれが\n\tじょうだんなのか　本気なのか……。\n@c0@"
32:
  de: "@aSancho@bWenn wir ihn bitten, unsere Monedas für uns aufzubewahren, dann läuft er doch nisst weg, oder?\n@c0@"
  en: "@aSancho@bEef we ask heem to put a galleon of garbanzos een hees pocket, ees no gonna go, eh?\n@c0@"
  es: "@aSancho@bSi le damos un galeón de frijoles, no se irá ¿verdad?\n@c0@"
