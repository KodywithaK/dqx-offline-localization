  fr: "@aNera@bNous achèterons du chocolat la prochaine fois\r\nque nous viendrons.\n@c0@"
  it: "@aNera@bAh, non c'è problema.\nCompreremo il cioccolato la prossima volta che verremo qui.\n@c0@"
  ja: "@a@bフローラ「チョコは\n\tまた今度に　しましょうね。\n@c0@"
47:
  de: "@a%0%a001250@bKönnen wir sie uns wirklich nicht leisten? Ich könnte doch heute nur ganz wenig zu Abend essen, wenn das hilft?\n@c0@"
  en: "@a%0%a001250@bCouldn't we afford it? Well, I don't mind having a small dinner today if that helps.\n@c0@"
  es: "@a%0%a001250@b¿No nos lo podemos permitir? Bueno, hoy puedo cenar poco si sirve de ayuda.\n@c0@"
  fr: "@a%0%a001250@bOn ne pouvait pas se la payerⓡ Tu sais, on peut dîner léger aujourd'hui, si ça peut t'aider.\n@c0@"
