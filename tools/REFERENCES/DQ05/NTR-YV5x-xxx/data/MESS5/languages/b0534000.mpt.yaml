0:
  de: "@aBianca@bPuh, ist das lange her. Hier haben mir damals die netten Leute geholfen, als ich ohnmächtig wurde.\n@c0@"
  en: "@aBianca@bBlimey! It's bin a long time since we were last here. This is where them nice folk helped me when I fainted.\n@c0@"
  es: "@aBianca@b¡Cuernos! Hace un montón de tiempo que no venimos por aquí. Aquí es donde me ayudaron cuando me desmayé, qué majos.\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Ça fait un moment qu'on n'était pas venus ici. C'est ici que tous ces gens accueillants m'ont aidée quand je me suis évanouie.\n@c0@"
  it: "@aBianca@bAmore, ricordi?\nAnni fa, quando arrivammo qui, persi i sensi e fui soccorsa dai gentilissimi abitanti del luogo.\n@c0@"
  ja: "@a@bビアンカ「わあ　なつかしいなあ。\n\t私　ここで　たおれたときに\n\t助けてもらったよね。\n@c0@"
1:
  de: "@aNera@bDas letzte Mal, als wir hier waren, war ich mit %a001240 und %a001250 schwanger. Wirklich unglaublich, wenn man bedenkt, wie groß sie heute schon sind.\n@c0@"
  en: "@aNera@bThe last time we were here, I was still pregnant with %a001240 and %a001250. It's hard to believe now when you see how they've grown.\n@c0@"
  es: "@aNera@bLa última volta que estuvimos aquí aún estaba embarazada de %a001240 y %a001250. Ahora que han crecido tanto, es difficile de creer.\n@c0@"
  fr: "@aNera@bLa dernière fois que nous sommes venus ici,\nj'étais encore enceinte des jumeaux, %a001240\net %a001250.\n㈡\nC'est difficile à croire quand on voit à quel point ils ont grandi.\n@c0@"
  it: "@aNera@bRicordi, tesoro? Venimmo qui quando ero incinta di %a001240 e %a001250.\nNe sono passati di anni da allora, eh?\n@c0@"
  ja: "@a@bフローラ「前に来たときは　%a001240も\n\t%a001250も　お腹の中にいたのよね。\n\tそれがもう　あんなに　大きくなって。\n@c0@"
2:
  de: "@a%0%a001240@bDas ist Bussolingen! Ich war hier schon oft mit Sancho und %a001250, weißt du.\n@c0@"
  en: "@a%0%a001240@bThis is Battenberg! I know because I've been here lots of times before with Sancho and %a001250.\n@c0@"
  es: "@a%0%a001240@b¡Esto es Habsburgo! Lo sé porque he estado muchas veces aquí con Sancho y %a001250.\n@c0@"
  fr: "@a%0%a001240@bC'est le hameau Técarloⓠ Je le sais parce qu'on est venus ici souvent avec Sancho et %a001250.\n@c0@"
  it: "@a%0%a001240@bQuesto posto si chiama Neviternia.\nLo so perché ci sono già venuto con lo zio Sancho e con %a001250.\n@c0@"
  ja: "@a@b%a001240「ここ　チゾットだよね！\n\tボク　何回も　来たことあるよ。\n\tサンチョと　%a001250と！\n@c0@"
3:
  de: "@a%0%a001240@bIch hab schon vor Jahren zu Sancho gesagt, wie gerne ich dir die Aussicht von hier zeigen würde.\n@c0@"
  en: "@a%0%a001240@bI said to Sancho ages ago how I wished I could show you the view from here.\n@c0@"
  es: "@a%0%a001240@bHace mucho le decía a Sancho cuánto me gustaría enseñarte el paisaje desde aquí.\n@c0@"
  fr: "@a%0%a001240@bIl y a longtemps déjà, j'ai dit à Sancho que j'avais envie de te montrer la vue qu'on a d'ici.\n@c0@"
  it: "@a%0%a001240@bTanto tempo fa dissi allo zio Sancho che mi avrebbe fatto piacere mostrarti lo splendido panorama che si gode da qui...\n@c0@"
  ja: "@a@b%a001240「ずっと前ね　サンチョに\n\tこのながめを　お父さんにも\n\t見せてあげたいって言ったんだ。\n@c0@"
4:
  de: "@a%0%a001240@bUnd dann hat er angefangen zu weinen! Dabei hatte ich doch gar nichts Schlimmes gesagt!\n@c0@"
  en: "@a%0%a001240@bIt made him cry! I'm not sure what I said that was\nso bad.\n@c0@"
  es: "@a%0%a001240@b¡Y Sancho se ponía a llorar! No sé qué tenía de malo lo que decía...\n@c0@"
  fr: "@a%0%a001240@bÇa l'a fait pleurerⓠ Je ne sais pas bien ce que j'ai dit de si grave, pourtant.\n@c0@"
  it: "@a%0%a001240@bPer tutta risposta, lui scoppiò in lacrime!\nMi guardò, sussurrò ⓕYo... Yo me commuovos...ⓖ e iniziò a piangere come una fontana!\n@c0@"
  ja: "@a@b%a001240「そしたら\n\tサンチョ　泣いてたよ。\n\t悪いこと　言っちゃったかなあ……。\n@c0@"
5:
  de: "@a%0%a001250@bIch steh nicht so gerne am Rand, Papa. Können wir etwas weiter weg gehen?\n@c0@"
  en: "@a%0%a001250@bI don't like being too close to the edge, Dad.\nCan we walk where the path's safer?\n@c0@"
  es: "@a%0%a001250@bNo me gusta estar tan cerca del borde, papá.\nVamos a un sitio más seguro, por favor.\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas être trop près du bord, papa.\nOn peut marcher là où le chemin est moins dangereuxⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, non mi sento tranquilla a stare vicino al bordo del precipizio... Per favore, camminiamo lungo la parte più sicura del sentiero...\n@c0@"
  ja: "@a@b%a001250「お父さん　わたし\n\tはしっこ　苦手なの。\n\t危なくないところ　歩いてね。\n@c0@"
6:
  de: "@aSancho@bIss weiß, von hier hat man eine schöne Aussicht, aber es ist viel zu gefährliss so nah an den Klippen, Chico.\n@c0@"
  en: "@aSancho@bI know ees a very nice view from here, but ees\r\nno esafe to walk too close on the edges of the cliffs.\n@c0@"
  es: "@aSancho@bSí, el paisaje es bien bello desde acá, pero no es seguro acercarse tanto al borde del precipicio.\n@c0@"
  fr: "@aSancho@bJe sais que la v-v-vue est très belle, d'ici,\r\nmais ce n'est pas p-prudent de marcher\r\naussi près du bord d'oune falaise.\n@c0@"
  it: "@aSancho@bSì, el panoramas es muy bello, ma no dovremmo avvicinarce troppos al precipizios...\n@c0@"
  ja: "@a@bサンチョ「下が　気になるのは\n\tよーくわかりますが　あんまり\n\tガケのほうを歩くと　危ないですよ！\n@c0@"
7:
  de: "@aOtto@bBrrr. Gute Güte, ist es hier kalt. Da erscheint einem selbst die heißeste Wüste verlockend.\n@c0@"
  en: "@aTuppence@bBrrr. This place is freezing. Even the scorching desert is starting to seem like a soft option\r\ncompared to this.\n@c0@"
  es: "@aAlazar@bBrrr... Aquí se hiela uno. Comparado con esto, hasta el desierto abrasador es una opción deseable.\n@c0@"
  fr: "@aInnocent@bBrrr. On gèle, ici. Même le désert brûlant commence\r\nà me paraître une option plus douce, à côté.\n@c0@"
  it: "@aSimon@bBrrrrr! Santa dea, che freddo infame!\nQuasi quasi rimpiango il caldo infernale del deserto di Faraonia...\n@c0@"
  ja: "@a@bピピン「うう　寒い……。\n\tここに来ると　しゃくねつの砂漠も\n\tいとしく感じますね。\n@c0@"
8:
  de: "@aSancho@bDas erste Mal war iss mit Señor Ludwig und seine kleine Baby hier und dann noch einmal alleine.\n@c0@"
  en: "@aSancho@bThe first time, I come here together weeth señor\r\nPankraz and hees young bebé.\r\nThe next time, Uncle Sancho, he ees all alone.\n@c0@"
  es: "@aSancho@bLa primera vez que vine acá iba con el señor Teudis y su chamaquito.\nLa vez siguiente, tito Sancho estaba solo.\n@c0@"
  fr: "@aSancho@bLa première fois que je suis venu ici, c'était avec le s-señor Petros et son petit bébé. La fois suivante, tonton Sancho était tout seul.\n@c0@"
  it: "@aSancho@bLa primera vez que yo venni aquí ero con el señor Russel.\r\nDespués soy tornatos en esto luego da solo...\n@c0@"
  ja: "@a@bサンチョ「はじめは\n\tパパスさまと　ちいさい坊っちゃん。\n\tその次は　ひとりっきりで。\n@c0@"
9:
  de: "@aSancho@bSpäter bin iss mit %a001240 und %a001250 in Bussolingen gewesen.\n@c0@"
  en: "@aSancho@bThen, the next time I pass through thees Battenberg, ees together weeth %a001240 and %a001250.\n@c0@"
  es: "@aSancho@bEn la ocasión siguiente que pasamos por este Habsburgo, venía con %a001240 y %a001250.\n@c0@"
  fr: "@aSancho@bLa fois d'après, je suis v-v-venu au hameau Técarlo avec %a001240 et %a001250.\n@c0@"
  it: "@aSancho@bSuccessivamentes, soy venuto a Neviternia con %a001240 y %a001250.\n@c0@"
  ja: "@a@bサンチョ「それから\n\t%a001240さま　%a001250さまと\n\tこのチゾットを通りました。\n@c0@"
10:
  de: "@aSancho@bUnd jetzt bin iss wieder hier. Wo ist die Zeit nur hin, eh? Du bist so schnell gewachsen, Chico. Das ist... (Schluchz)\n@c0@"
  en: "@aSancho@bAnd now we are here again. The time, where does eet go? You grow up eso fast! Ees, ees... (sob)\n@c0@"
  es: "@aSancho@bY aquí estamos de nuevo. ¿Adónde se va el tiempo, híjole? ¡Qué rápido se hace uno mayor! Es, es... (snif)\n@c0@"
  fr: "@aSancho@bEt nous y revoilà. Le temps p-p-passe à oune vitesseⓠ Vous avez grandi si rapidementⓠ\nC'est, c'est... (snif)\n@c0@"
  it: "@aSancho@b¡Ma cada vez que soy venuto aquí, ho siempre trovato la neves! ¡Siempre! ¡En todos los periodos del año! Es una cosa incredibiles...\n@c0@"
  ja: "@a@bサンチョ「そして今　また\n\t大きくなった　坊っちゃんと。\n\t……ご立派になって。　うっうっ……。\n@c0@"
11:
  de: "@a%0%a001240@bIch wusste es! Ich wusste, dass das Bussolingen ist!\n@c0@"
  en: "@a%0%a001240@bI already knew that!\nI knew this was Battenberg!\n@c0@"
  es: "@a%0%a001240@b¡Ya lo sabía!\n¡Ya sabía que era Habsburgo!\n@c0@"
  fr: "@a%0%a001240@bJe le savais déjàⓠ\nJe savais qu'on était au hameau Técarloⓠ\n@c0@"
  it: "@a%0%a001240@bAh, lo sapevo già che questo posto si chiama Neviternia!\n@c0@"
  ja: "@a@b%a001240「ボク　もう　知ってるもーん。\n\tここは　チゾットだよ！\n@c0@"
12:
  de: "@a%0%a001240@bEr lügt! Es sind schon länger Monster hier. Ich hab welche gesehen, als ich das letzte Mal hier war.\n@c0@"
  en: "@a%0%a001240@bHe's lying! There have been monsters here a while now. I saw them the last time I was here.\n@c0@"
  es: "@a%0%a001240@b¡No es verdad! Ya hace tiempo que hay monstruos por aquí. La última vez que vine los vi.\n@c0@"
  fr: "@a%0%a001240@bIl dit n'importe quoiⓠ Ça fait un moment qu'il y a des monstres, ici. Je les ai vus la dernière fois que je suis venu.\n@c0@"
  it: "@a%0%a001240@bI mostri c'erano anche la prima volta che venimmo qui.\nForse quel signore parla di tanti anni fa...\n@c0@"
  ja: "@a@b%a001240「あの人　ウソツキだよ！\n\tだって　ボクが前に来たときも\n\t魔物が出たもん！\n@c0@"
13:
  de: "@a%0%a001250@bSelbst wenn es keine Monster gäbe, glaube ich nicht, dass viele Leute hierher kämen. Die Kletterei ist wirklich anstrengend.\n@c0@"
  en: "@a%0%a001250@bEven if there were no monsters, it's such a difficult climb up here that I doubt many people would visit.\n@c0@"
  es: "@a%0%a001250@bAunque no hubiera monstruos, es tan difícil llegar hasta aquí que no creo que recibieran muchos visitantes.\n@c0@"
  fr: "@a%0%a001250@bMême s'il n'y avait pas de monstres, la montée est si rude pour arriver jusqu'ici que ça m'étonnerait que beaucoup de gens y viennent.\n@c0@"
  it: "@a%0%a001250@bAnche se non ci fossero mostri in giro, arrivare a Neviternia è comunque una faticaccia!\n@c0@"
  ja: "@a@b%a001250「魔物さんが　いなくても\n\t登るの　つかれるから\n\tみんなきっと　来ないよ……。\n@c0@"
14:
  de: "@aOtto@bEuch würde es selbst nichts ausmachen, eine Rüstung aus Eisen oder Stein zu tragen, nicht wahr, %a000090?\n@c0@"
  en: "@aTuppence@bYou could wear iron armour or even stone\narmour as if it were light as a feather, couldn't\nyou, %a000090?\n@c0@"
  es: "@aAlazar@bAunque llevaseis una armadura de hierro o de piedra, para vos sería ligera como una pluma, ¿verdad, %a000090?\n@c0@"
  fr: "@aInnocent@bVous pourriez porter une armure de fer ou\nmême de pierre comme s'il s'agissait de plume,\nn'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, sono certo che nessuna maschera è troppo pesante per una persona dal fisico forte e allenato come il suo!\n@c0@"
  ja: "@a@bピピン「%a000090さまは　鉄のよろいでも\n\t石のよろいでも　なーんだって\n\t軽々　運べますよね！\n@c0@"
15:
  de: "@a%0%a001250@bKomisch, dass seine Eisenmaske so schwer ist...\n@c0@"
  en: "@a%0%a001250@bIt's weird that that iron mask of his is so heavy.\n@c0@"
  es: "@a%0%a001250@bQué extraño que esa celada de hierro sea tan pesada.\n@c0@"
  fr: "@a%0%a001250@bC'est bizarre que son masque de fer soit si lourd.\n@c0@"
  it: "@a%0%a001250@bNon pensavo che esistessero maschere così pesanti da non poter essere indossate...\nNon sarà che il tipo è un po' deboluccio...?\n@c0@"
  ja: "@a@b%a001250「てっかめんが　あんなに\n\t重いなんて　おかしいよね。\n@c0@"
16:
  de: "@aBianca@bHa ha! Wir sehen nur deshalb so jung aus, weil wir all die Jahre Steinstatuen waren und nicht gealtert sind!\n@c0@"
  en: "@aBianca@bHa ha! We only look young for it because we were turned to stone all them years!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Si parecemos tan jóvenes es por los años que nos pasamos convertidos en estatuas!\n@c0@"
  fr: "@aBianca@bHa haⓠ Si on a l'air aussi jeunes, c'est juste\nparce qu'on a été pétrifiés pendant des annéesⓠ\n@c0@"
  it: "@aBianca@bAh, che belle parole!\nNon si potrebbe fare complimento migliore a una donna...\n@c0@"
  ja: "@a@bビアンカ「あはは。　それって\n\t石になってたおかげよね。\n@c0@"
17:
  de: "@a%0%a001240@bIch bin mittlerweile viel herumgekommen und weiß, wie die Dinge laufen. Die Väter von anderen Jungs sind meistens wirklich älter als du...\n@c0@"
  en: "@a%0%a001240@bNow I've travelled so much, I've realised how things normally are. People's dads are usually older than you are.\n@c0@"
  es: "@a%0%a001240@bDespués de viajar mucho me he dado cuenta de cómo son las cosas normalmente. Los papás suelen ser más viejos que tú.\n@c0@"
  fr: "@a%0%a001240@bAprès avoir beaucoup voyagé, j'ai compris comment sont les choses, normalement. Les papas des autres sont souvent plus vieux que toi.\n@c0@"
  it: "@a%0%a001240@bIl mio papà si mantiene giovane perché i suoi figli non gli danno nessuna preoccupazione!\nNon è vero, papino?\n@c0@"
  ja: "@a@b%a001240「ボク　いっぱい旅をしたから\n\tわかるよ……。　お父さんって\n\tふつう　もう少し　年とってるよね。\n@c0@"
18:
  de: "@a%0%a001250@bMir ist es egal, ob du alt oder jung bist, Papa. Hauptsache, wir sind zusammen!\n@c0@"
  en: "@a%0%a001250@bI don't care whether you're young or old as long as we can be together, Dad.\n@c0@"
  es: "@a%0%a001250@bNo me importa que seas viejo o joven mientras podamos estar juntos, papá.\n@c0@"
  fr: "@a%0%a001250@bDu moment qu'on est ensemble, ça m'est bien égal que tu sois jeune ou vieux, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, ma come fai a sembrare tanto giovane?\nForse usi le cremine di bellezza della mamma?\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんと\n\tいられるなら　若くても　年とってても\n\tどっちでも　いいよ。\n@c0@"
19:
  de: "@aSancho@bKümmer diss gar nisst um diese Señor, Chico. Er hat keine Manieren...\n@c0@"
  en: "@aSancho@bYou no take no notice of thees señor.\nHe no esay the nice theengs, eh?\n@c0@"
  es: "@aSancho@bNo hagas caso a este señor, chamaco.\nEso que dice no es bonito.\n@c0@"
  fr: "@aSancho@bNe fais p-p-pas attention à ce que dit ce señor.\nIl n'est pas t-t-très gentil, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, quantos años sono passatos da cuando lo zio Sancho era giovane! ¡Ahora me esto invecchiando, però ho acquistato el fascinos dell'hombre maturo!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん。\n\t気にしちゃいけませんよ。\n\tあの人も　悪気があるわけじゃ……。\n@c0@"
20:
  de: "@a%0%a001240@bHoffentlich liebt dich Mama auch richtig...\n@c0@"
  en: "@a%0%a001240@bHopefully Mum loves you like she should do, Dad.\n@c0@"
  es: "@a%0%a001240@bEspero que mamá te quiera como es debido, papi.\n@c0@"
  fr: "@a%0%a001240@bEspérons que maman t'aime comme il faut, papa.\n@c0@"
  it: "@a%0%a001240@bHo capito!\n@c0@"
  ja: "@a@b%a001240「お母さんも　お父さんを\n\tちゃんと　愛してるといいな。\n@c0@"
21:
  de: "@a%0%a001240@bSonst würde sie schneller altern, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bIf not, does that mean she'll age really quickly?\n@c0@"
  es: "@a%0%a001240@bSi no, igual se hace vieja muy rápido, ¿no?\n@c0@"
  fr: "@a%0%a001240@bSinon, tu crois que ça veut dire qu'elle vieillirait\ntrès très viteⓡ\n@c0@"
  it: "@a%0%a001240@bLa mamma è giovane e bella perché ti vuole bene!\nSe non ti amasse, sarebbe una vecchia signora piena di rughe, esatto?\n@c0@"
  ja: "@a@b%a001240「じゃないと\n\tおばあさんに　なっちゃうよ？\n@c0@"
22:
  de: "@aBianca@bDas heißt, dass es deine Schuld ist, wenn ich mal alt werde, %a000090! Du musst immer dafür sorgen, dass ich jung und schön bleibe!\n@c0@"
  en: "@aBianca@bThat means it's your fault if I start agein', %a000090! You make sure you keep me good\nand young, eh?\n@c0@"
  es: "@aBianca@bEso quiere decir que, si me hago vieja, la culpa es tuya, %a000090. A ver si me mantienes bien fresca y lozana, ¿eh?\n@c0@"
  fr: "@aBianca@bAutrement dit, ce sera de ta faute si je commence\nà vieillir, %a000090ⓠ Tu as intérêt à me garder jeune et belle, heinⓡ\n@c0@"
  it: "@aBianca@bCapito, %a000090?\nSe desideri avere accanto a te una donna eternamente giovane, fai in modo che io ti voglia sempre bene!\n@c0@"
  ja: "@a@bビアンカ「じゃあ　私が　年をとったら\n\tそれは　%a000090のせいね。\n\t若いままでいさせてね　%a000090。\n@c0@"
23:
  de: "@aNera@bIch habe dich all die Jahre über geliebt, als ich eine Statue war. Vielleicht bin ich ja deshalb nicht älter geworden.\n@c0@"
  en: "@aNera@bI carried on loving you even during all those years I was turned to stone. That must be why I didn't age.\n@c0@"
  es: "@aNera@bYo seguí amándote incluso en los años en que estaba convertida en pietra. Será por eso que no me hice vecchia.\n@c0@"
  fr: "@aNera@bJ'ai continué à t'aimer même pendant toutes ces années où j'ai été pétrifiée. Ça doit être pour ça\r\nque je n'ai pas vieilli.\n@c0@"
  it: "@aNera@bAllora resterò giovane per tutta la mia vita, perché so già che non smetterò mai di amarti e che ti starò sempre vicino, tesoro mio!\n@c0@"
  ja: "@a@bフローラ「私　石になっていた間も\n\tずっと　あなたのことを　愛し続けて\n\tいたから　年をとらなかったのね。\n@c0@"
24:
  de: "@a%0%a001250@bWird man denn wirklich groß und stark, wenn man viel isst? Dann sollte %a001240 auf jeden Fall mehr Gemüse essen!\n@c0@"
  en: "@a%0%a001250@bI wonder if eating lots really does make you big and strong. %0%a001240 should definitely eat more vegetables.\n@c0@"
  es: "@a%0%a001250@b¿Será verdad que, si comes mucho, te haces grande y fuerte? %0%a001240 debería comer más verduras, pues.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si ça rend vraiment grand et costaud de manger beaucoup. %0%a001240 devrait vraiment manger plus de légumes, en tout cas.\n@c0@"
  it: "@a%0%a001250@bMa questo è terrorismo psicologico! A quel povero bambino non piacciono le carote, e allora?!\nCrescerà sano e forte anche se mangerà altro!\n@c0@"
  ja: "@a@b%a001250「……いっぱい食べたら\n\t大きくて　力持ちに　なれるのかな。\n\t%a001240も　野菜を食べればいいのに。\n@c0@"
25:
  de: "@a%0%a001240@bEs ist mir egal, ob etwas gesund oder gut für mich ist. Wenn ich's nicht mag, mag ich's halt nicht.\n@c0@"
  en: "@a%0%a001240@bIt doesn't make any difference to me knowing that something's good for me. If I don't like it, I don't like it.\n@c0@"
  es: "@a%0%a001240@bNo me importa que una cosa sea buena para mí. Si no me gusta, pues no me gusta.\n@c0@"
  fr: "@a%0%a001240@bPour moi, savoir que quelque chose est bon pour moi ou pas ne fait aucune différence. Si je n'aime pas ça, je n'aime pas ça.\n@c0@"
  it: "@a%0%a001240@bMica servono solo le carote per crescere! Guarda lo zio Sancho: è cresciuto mangiando quintali di paella!\nUhm, in realtà, più che ⓕcresciutoⓖ si è ⓕallargatoⓖ...\n@c0@"
  ja: "@a@b%a001240「……身体にいいって\n\t言われても……。\n\tきらいなものは　きらいだよ。\n@c0@"
26:
  de: "@aSancho@bAls du eine kleine Baby warst, Chico, hast du auch vieles nisst gegessen. Du mochtest nisst mal meine Paella! Es war wirkliss schwer mit dem Kochen...\n@c0@"
  en: "@aSancho@bWhen you are just a leettle bebé, friend, you no like eso many foods. You no even like the paella!\r\nUf, ees eso hard for the cooking.\n@c0@"
  es: "@aSancho@bCuando eras un bebe, chamaco, había muchas comidas que no te gustaban ni tantito. ¡Ni siquiera la enchilada!\n㈡\nQué duro para el cocinero...\n@c0@"
  fr: "@aSancho@bQuand tu étais bébé, chico, tu n'aimais pas\ng-g-grand-chose. Même pas la paellaⓠ\nPfff, c'était difficile de c-c-cuisiner.\n@c0@"
  it: "@aSancho@b¿Chico, sabe que da piccolos avevi gustos difíciles nel mangiare?\n¡Nemmenos a ti te gustavan las carotas!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんも　小さい頃\n\t好き嫌いが多くて　お料理が\n\t大変でしたよ。\n@c0@"
27:
  de: "@aOtto@bBei mir ist es immer dasselbe. Ich versuche, meinen Ekel zu überwinden und alles brav aufzuessen, obwohl mein Kopf Nein sagt...\n@c0@"
  en: "@aTuppence@bIt's always the same for me. I try to overcome a dislike of something and eat it against my better judgement...\n@c0@"
  es: "@aAlazar@bSiempre me pasa lo mismo. Intento superar mi disgusto por algo de comer y me lo como, a mi pesar...\n@c0@"
  fr: "@aInnocent@bPour moi, c'est toujours la même chose. J'essaie de surmonter mon dégoût de quelque chose et je le mange en dépit du bon sens...\n@c0@"
  it: "@aSimon@bNemmeno a me piacevano le carote da piccolo, poi mia madre mi disse che, se non le avessi mangiate, non sarei mai cresciuto.\n@c0@"
  ja: "@a@bピピン「食わずギライを　直そうと思って\n\t勇気を出して　食べてみると……\n@c0@"
28:
  de: "@aOtto@bUnd dann muss ich es wieder ausspucken! Manchmal sollte man wirklich auf sein Bauchgefühl hören.\n@c0@"
  en: "@aTuppence@bAnd, lo and behold, the taste of it makes me gag! Sometimes you have to trust your intuition on these matters.\n@c0@"
  es: "@aAlazar@bY, ¿quién lo iba a decir?, ¡el sabor me da náuseas! A veces hay que confiar en la intuición en estos temas.\n@c0@"
  fr: "@aInnocent@bEt bien évidemment, son seul goût me donne un\nhaut-le-cœurⓠ Il faut parfois suivre son instinct\nen la matière. \n@c0@"
  it: "@aSimon@bCosì me le sono fatte piacere. Chissà, forse, se non le avessi mangiate, non sarei diventato il giovanotto bello e prestante che sono oggi...\n@c0@"
  ja: "@a@bピピン「……　……\n\tやっぱり不味かったりするんです。\n\tこういう勘は　さえてるんだけどなあ。\n@c0@"
29:
  de: "@aBianca@bIch hoffe, dass die Kinder viel Gutes zu sich nehmen, damit sie groß und stark werden.\n@c0@"
  en: "@aBianca@bI hope the kids'll eat plenty of good food an' grow up to be big an' strong.\n@c0@"
  es: "@aBianca@bEspero que nuestros hijos coman bien y se hagan grandes y fuertes.\n@c0@"
  fr: "@aBianca@bJ'espère que les enfants mangeront plein de bonnes choses et grandiront pour devenir grands et forts.\n@c0@"
  it: "@aBianca@bForse qui cucinano le carote in modo orribile, ecco perché quel bambino non vuole mangiarle!\n@c0@"
  ja: "@a@bビアンカ「子どもたちには\n\tたくさん食べて　すくすくと\n\t育ってほしいわ。\n@c0@"
30:
  de: "@aNera@bDie Kochkünste einer Mutter werden ganz schön auf die Probe gestellt, wenn die Kinder Dinge essen sollen, die sie nicht mögen...\n@c0@"
  en: "@aNera@bIt's a real test for a mother's cooking skills, trying to get her children to eat things they don't usually like.\n@c0@"
  es: "@aNera@bLas habilidades de una mamma se ponen a prueba cuando tiene que hacer que su hijo coma cosas que no le gustan.\n@c0@"
  fr: "@aNera@bC'est une épreuve pour les talents de cuisinière d'une mère, d'essayer de faire manger à ses\r\nenfants des choses qu'ils n'aiment pas d'habitude.\n@c0@"
  it: "@aNera@bPer una madre è sempre difficile convincere i figli a mangiare frutta e verdura...\n@c0@"
  ja: "@a@bフローラ「嫌いなものを　どうやって\n\tおいしく食べさせるかが　母親の\n\t料理のウデの見せどころですわね。\n@c0@"
31:
  de: "@a%0%a001240@bDie Erwachsenen tun immer so, als würden sie alles essen. Dabei stimmt das gar nicht!\n@c0@"
  en: "@a%0%a001240@bAdults always pretend to us kids that they're never fussy about food. That's so cheeky!\n@c0@"
  es: "@a%0%a001240@bLos mayores siempre fingen que no tienen manías con la comida. ¡Qué caradura!\n@c0@"
  fr: "@a%0%a001240@bLes grandes personnes essaient toujours de faire croire aux enfants qu'ils ne sont jamais difficiles à propos de la nourriture. C'est drôlement gonfléⓠ\n@c0@"
  it: "@a%0%a001240@b%0%a001250 odia le carote, i peperoni, le cipolle e anche il pesce. Io, invece, mangio praticamente di tutto!\n@c0@"
  ja: "@a@b%a001240「大人ってさ　子どもの前で\n\t好き嫌いのないフリを　するよね。\n\tそれって　ズルイよ。\n@c0@"
32:
  de: "@aBianca@bWir sollten mit gutem Beispiel vorangehen und alles aufessen, was wir vorgesetzt bekommen. Damit meine ich vor allem dich, %a000090!\n@c0@"
  en: "@aBianca@bWe need to set an example to the kids an' not be fussy about what foods we eat. I'm directin' that comment at you, by the way, %a000090!\n@c0@"
  es: "@aBianca@bTenemos que dar ejemplo a los niños y no tener manías con la comida, ¿sabes? ¡Sí, te lo digo precisamente a ti, %a000090!\n@c0@"
  fr: "@aBianca@bIl faut qu'on donne l'exemple aux enfants en n'étant pas difficiles avec la nourriture. Et à ce propos, ce commentaire s'adresse à toi, %a000090ⓠ\n@c0@"
  it: "@aBianca@b%0%a000090, nemmeno a te piacevano le carote quando eri piccolo. Chissà come mai tanti bambini odiano quei deliziosi ortaggi...\n@c0@"
  ja: "@a@bビアンカ「子どもたちの　お手本になるよう\n\t好き嫌いは　今のうちに　直さなきゃ。\n\tねっ　%a000090。\n@c0@"
33:
  de: "@aNera@bDu bist auch manchmal ein wenig pingelig beim Essen, nicht wahr, Liebling? Und wenn ich für dich kochen würde? Meinst du, es ginge dann besser?\n@c0@"
  en: "@aNera@bYou can be a bit fussy with your food, can't you, darling? Do you think you might eat some of the things you dislike if I cook them for you?\n@c0@"
  es: "@aNera@bTú tienes unas cuantas manías con la comida, ¿vero, caro? ¿Crees que, si las cocino yo, comerías algunas de las cosas que te disgustan?\n@c0@"
  fr: "@aNera@bTu es parfois difficile pour la nourriture, hein, mon chériⓡ Tu crois que tu mangerais certaines choses que tu n'aimes pas si je les cuisinais pour toiⓡ\n@c0@"
  it: "@aNera@bSe non ricordo male, mi hai raccontato che anche tu, da piccolo, avevi gusti difficili. Per fortuna, crescendo sei diventato meno schizzinoso...\n@c0@"
  ja: "@a@bフローラ「あなたも　好き嫌いが\n\t多いのよね。　私の手料理なら\n\t食べてくださるのかしら？\n@c0@"
34:
  de: "@a%0%a001240@bMann, ein Bussolinger Kompass! Der ist echt wertvoll, denn normalerweise kann man die Dinger gar nicht mehr kaufen!\n@c0@"
  en: "@a%0%a001240@bWow! A Batten binnacle! These things were all sold out and impossible to get hold of before.\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¡Una bitácora de Habs! Estos cacharros estaban agotados y no había forma de hacerse con uno.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Une boussole de Técarloⓠ\nAvant, il était impossible de s'en procurer une,\nil n'y en avait plus une seule en réserve.\n@c0@"
  it: "@a%0%a001240@bNon ci posso credere! Una bussola delle nevi!\nPensavo che fosse impossibile procurarsene una!\n@c0@"
  ja: "@a@b%a001240「うわ～！\n\tチゾットのコンパスだ！\n\tこれ　売り切れで買えなかったんだよ！\n@c0@"
35:
  de: "@aSancho@bDiese Kompasse werden gar nisst mehr hergestellt, so viel iss weiß. Der Künstler, der sie machte, ist zu alt. Wir haben viel Glück, no?\n@c0@"
  en: "@aSancho@bThe people, they are esaying you no find these binnacles no more. The artisan who ees making them, he ees too old. We are lucky, eh?\n@c0@"
  es: "@aSancho@bLa gente dice pues que es imposible encontrar estas bitácoras. El artesano que las hacía es ya muy viejito. Qué suerte la nuestra, ¿eh?\n@c0@"
  fr: "@aSancho@bLes gens d-d-disent que c'est impossible de trouver ces boussoles, de nos jours. L'artisan qui les\nf-fabrique est trop vieux. On a de la chance, heinⓡ\n@c0@"
  it: "@aSancho@bChico, siamo estatos fortunatos... ¡Es quasi imposible procurarse una bussola delle nevi, por qué el processo de fabbricaziones es muy lungos!\n@c0@"
  ja: "@a@bサンチョ「職人の方が　お年だとかで\n\tもう　入荷できないだろうと\n\t言われてたんです。　良かったですね。\n@c0@"
36:
  de: "@a%0%a001250@bOhhh! Den Bussolinger Kompass können wir gut gebrauchen, wenn wir uns mal in einer Höhle oder sonstwo verlaufen!\n@c0@"
  en: "@a%0%a001250@bOoh! We could use a Batten binnacle to find our way when we get lost in caves and places!\n@c0@"
  es: "@a%0%a001250@b¡Oooh! ¡Podemos usar una bitácora de Habs para orientarnos si nos perdemos en las cuevas y eso!\n@c0@"
  fr: "@a%0%a001250@bOohⓠ Une boussole de Técarlo pourrait nous être bien utile pour retrouver notre chemin si on se perd dans les grottes ou dans d'autres endroitsⓠ\n@c0@"
  it: "@a%0%a001250@bForse potremmo usare la bussola delle nevi per non perderci quando ci troviamo in posti difficili da attraversare, no?\n@c0@"
  ja: "@a@b%a001250「チゾットのコンパスは\n\t洞くつとかで　迷ったときに\n\t使えるんだって！\n@c0@"
37:
  de: "@a%0%a001240@bWir werden unseren Bussolinger Kompass nie verlieren. Dafür ist der viel zu wertvoll!\n@c0@"
  en: "@a%0%a001240@bYeah, we'd never lose our Batten binnacle!\nIt's far too useful.\n@c0@"
  es: "@a%0%a001240@b¡Sí, nosotros nunca perderíamos nuestra bitácora de Habs!\nEs muy útil.\n@c0@"
  fr: "@a%0%a001240@bOuais, nous, on ne perdra jamais notre boussole de Técarloⓠ C'est bien trop utile.\n@c0@"
  it: "@a%0%a001240@bNoi non perderemo mai la nostra bussola delle nevi!\nÈ un oggetto troppo prezioso!\n@c0@"
  ja: "@a@b%a001240「うん。　ボクたち　絶対\n\tコンパスなくさないよね！\n@c0@"
38:
  de: "@aSancho@bDiese alte Hombre sieht wirkliss müde aus. Wir sollten ihn schlafen lassen, no?\n@c0@"
  en: "@aSancho@bThees old man, he looks eso tired.\nWe leave heem to esleep, no?\n@c0@"
  es: "@aSancho@bEste viejito parece muy cansado.\nVamos a dejarle que duerma, ¿ok?\n@c0@"
  fr: "@aSancho@bCe vieil homme a l'air si fatigué.\nOn va le laisser d-d-dormir, noⓡ\n@c0@"
  it: "@aSancho@bChico, por favor, no disturbare esta señora...\n@c0@"
  ja: "@a@bサンチョ「おつかれの　ご様子ですね。\n\t寝かせておいて　あげましょう。\n@c0@"
39:
  de: "@aBianca@bOb er großartig war oder nicht, spielt doch keine Rolle. Sie konnten ja wohl kaum so tun, als wenn nichts geschehen wäre, oder?\n@c0@"
  en: "@aBianca@bWhether he's quite a man or not, they could\r\nhardly just get on with things and not even\r\nbother lookin', eh?\n@c0@"
  es: "@aBianca@bY, aunque no fuera un gran hombre, no iban a seguir tan tranquilos como si no hubiera pasado nada, ¿no?\n@c0@"
  fr: "@aBianca@bQue ça ait été quelqu'un ou pas, ils pouvaient difficilement faire comme si de rien n'était\net ne pas le rechercher du tout, nonⓡ\n@c0@"
  it: "@aBianca@bSì, è vero: è un uomo di grandissimo valore!\nDico bene, caro? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「立派というか…　ああいう\n\tいなくなりかたしたら　さがさずには\n\tいられない　ってものよね。\n@c0@"
40:
  de: "@aNera@bWir haben es vielen Leuten zu verdanken, dass wir heute wieder zusammen sind. Das dürfen wir nie vergessen.\n@c0@"
  en: "@aNera@bThe only reason we can be together again today is because of everyone's efforts to find us. We mustn't forget that.\n@c0@"
  es: "@aNera@bLa única razón por la que estamos juntos hoy es por tutto il mondo que se ha esforzado en encontrarnos. No debemos olvidarlo.\n@c0@"
  fr: "@aNera@bLa seule raison pour laquelle nous sommes tous réunis, c'est que tout le monde a uni ses efforts pour nous retrouver. Nous ne devons pas l'oublier.\n@c0@"
  it: "@aNera@bSe oggi la nostra famiglia è di nuovo riunita, lo dobbiamo ai generosi sforzi compiuti da tante persone. Non dimentichiamolo mai, amore mio...\n@c0@"
  ja: "@a@bフローラ「こうしていられるのは　みんなが\n\t私たちを　さがしてくれたから……\n\tそれを　忘れずにいなくてはね。\n@c0@"
41:
  de: "@a%0%a001240@bDu wurdest direkt nach meiner Geburt in eine Statue verwandelt, nicht wahr, Papa? Das war also vor... ja, genau ⓚⓛ vor acht Jahren!\n@c0@"
  en: "@a%0%a001240@bYou were turned into a statue right after I was born, Dad. So that makes it...yep! About eight years!\n@c0@"
  es: "@a%0%a001240@bTe convirtieron en estatua justo después de nacer yo, papi. Eso son... ¡sí, ocho años más o menos!\n@c0@"
  fr: "@a%0%a001240@bTu as été transformé en statue juste après ma naissance, papa. Alors ça fait... ouiⓠ\nPresque huit ansⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, se non sbaglio tu fosti trasformato in una statua subito dopo la mia nascita, cioè otto anni fa.\nSì, i conti tornano...\n@c0@"
  ja: "@a@b%a001240「ボクが　生まれてすぐ\n\tお父さん　石になったから……\n\tえっと　ほんとだ！　８年だね！\n@c0@"
42:
  de: "@a%0%a001250@bIch habe ja nicht nur nach dir gesucht, Papa, sondern auch nach Mama. Es war schrecklich, keine Mutter zu haben.\n@c0@"
  en: "@a%0%a001250@bI wasn't only looking for you, Dad. I was looking for Mum too. It was horrible not having a mum.\n@c0@"
  es: "@a%0%a001250@bNo solo te buscaba a ti, papá. También buscaba a mamá. No tener mamá era una cosa horrible.\n@c0@"
  fr: "@a%0%a001250@bCe n'est pas seulement toi que je cherchais, papa.\nJe cherchais aussi maman. C'était horrible de ne pas avoir de maman.\n@c0@"
  it: "@a%0%a001250@bPapà, quando io e %a001240 ti cercavamo, speravamo di trovare anche la mamma.\nLa mia mammina mi mancava tantissimo...\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんだけじゃなくて\n\tお母さんも　さがしてたよ。\n\tお母さんいなくて　さみしかった……。\n@c0@"
43:
  de: "@aBianca@bEs tut mir leid, %a001250. Ich verspreche dir, euch nie wieder alleine zu lassen.\n@c0@"
  en: "@aBianca@bI'm sorry, %a001250. I promise not to leave you again, ever.\n@c0@"
  es: "@aBianca@bLo siento, %a001250. Te prometo que nunca volveré a dejarte sola, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis désolée, %a001250. Je promets de ne plus jamais te quitter.\n@c0@"
  it: "@aBianca@b%0%a001250, piccola mia!\nTi prometto che non ci separeremo mai più!\n@c0@"
  ja: "@a@bビアンカ「ごめんね。\n\tもう　二度と　%a001250をおいて\n\tいなくなったりしないからね。\n@c0@"
44:
  de: "@a%0%a001250@bIch habe ja nicht nur nach dir gesucht, Papa, sondern auch nach Mama. Es war schrecklich, keine Mutter zu haben.\n@c0@"
  en: "@a%0%a001250@bI wasn't only looking for you, Dad. I was looking for Mum too. It was horrible not having a mum.\n@c0@"
  es: "@a%0%a001250@bNo solo te buscaba a ti, papá. También buscaba a mamá. No tener mamá era una cosa horrible.\n@c0@"
  fr: "@a%0%a001250@bCe n'est pas seulement toi que je cherchais, papa.\nJe cherchais aussi maman. C'était horrible de ne pas avoir de maman.\n@c0@"
  it: "@a%0%a001250@bPapà, quando io e %a001240 ti cercavamo, speravamo di trovare anche la mamma.\nLa mia mammina mi mancava tantissimo...\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんだけじゃなくて\n\tお母さんも　さがしてたよ。\n\tお母さんいなくて　さみしかった……。\n@c0@"
45:
  de: "@aNera@bEs war auch für mich grausam, ohne euch zu sein, %a001250. Aber von nun an werde ich immer bei euch bleiben.\n@c0@"
  en: "@aNera@bIt was horrible for me to be without you too, %a001250. But we'll be together for always from now on.\n@c0@"
  es: "@aNera@bFue espantoso per me estar separada di te, %a001250. Pero a partir de hoy siempre estaremos in sieme.\n@c0@"
  fr: "@aNera@bPour moi aussi, c'était horrible d'être séparée de toi, %a001250. Mais désormais, nous serons\ntoujours tous ensemble.\n@c0@"
  it: "@aNera@bAnch'io sognavo di starti vicina, %a001250.\nOra che ci siamo ritrovate, resteremo sempre insieme!\n@c0@"
  ja: "@a@bフローラ「%a001250…　お母さんも\n\tあなたたちがいなくて　さみしかった。\n\tこれからは　ずっと　いっしょよ。\n@c0@"
46:
  de: "@aOtto@bHach, wenn ich ihm nur sagen könnte, dass die Person, von der er da spricht, genau vor ihm steht... Das wäre ein Spaß!\n@c0@"
  en: "@aTuppence@bI wish I could point out to him that the person\r\nhe's talking about is right in front of him. That\r\nwould be fun!\n@c0@"
  es: "@aAlazar@bMe gustaría poder decirle que la persona de quien habla está justo delante suyo. ¡Qué risa!\n@c0@"
  fr: "@aInnocent@bSi seulement je pouvais lui dire que la personne dont il parle se trouve juste devant lui. Ça serait drôleⓠ\n@c0@"
  it: "@aSimon@bMi piacerebbe dire a quell'uomo che la persona di cui parla è proprio davanti a lui.\nChissà che faccia farebbe, eh?\n@c0@"
  ja: "@a@bピピン「ボク　一度でいいから\n\tここにおわすお方を　どなたと心得る！\n\tってやつ　やってみたいんです！\n@c0@"
47:
  de: "@a%0%a001250@bPuh. Hier drinnen kann ich mich ein wenig entspannen. Draußen hab ich ganz schön Angst, wegen all der Abgründe und so.\n@c0@"
  en: "@a%0%a001250@bPhew. I can relax a bit in here. It's too scary outside, what with all the big drops and everything.\n@c0@"
  es: "@a%0%a001250@b¡Ufff! Por fin puedo descansar un poco. Qué miedo he pasado ahí fuera, con esos acantilados y tal.\n@c0@"
  fr: "@a%0%a001250@bPfiou. Je peux enfin me détendre un peu, ici.\nTout est trop effrayant dehors, avec toutes ces grandes falaises et tout ça.\n@c0@"
  it: "@a%0%a001250@bEra ora! Qui dentro potrò finalmente rilassarmi!\nLì fuori non mi sentivo affatto sicura, con tutti i precipizi che ci sono...\n@c0@"
  ja: "@a@b%a001250「ここなら　ゆっくりできるの。\n\tお外は　高くて　こわいから\n\tゆっくりできないの……。\n@c0@"
48:
  de: "@a%0%a001240@bDieser Mann hat uns Saft gegeben, als wir das letzte Mal hier waren.\n@c0@"
  en: "@a%0%a001240@bThat man gave us some juice the last time we\nwere here.\n@c0@"
  es: "@a%0%a001240@bLa última que pasamos por aquí ese hombre nos dio un poco de zumo.\n@c0@"
  fr: "@a%0%a001240@bLa dernière fois qu'on est venu, ce monsieur nous a offert un jus de fruit.\n@c0@"
  it: "@a%0%a001240@bQuell'uomo è molto gentile, sai?\nUna volta mi ha offerto un succo di fragola...\n@c0@"
  ja: "@a@b%a001240「あの人　前に来たとき\n\tジュースくれたんだよ！\n@c0@"
49:
  de: "@aSancho@bWir haben keine Zeit, etwas zu trinken und Paella zu essen, si? No, wir haben Wisstigeres zu tun...\n@c0@"
  en: "@aSancho@bEes no the time for esitting down for the\r\ndreenks and the paella, eh? For now, we\r\nhave eso much to do.\n@c0@"
  es: "@aSancho@bAhorita no es momento de sentarse a comer burritos y guacamole, ¿eh? Tenemos mucho que hacer.\n@c0@"
  fr: "@aSancho@bCe n'est pas le moment de s'asseoir pour b-b-boire et manger, heinⓡ Nous avons b-b-beaucoup de choses à faire, pour l'instant.\n@c0@"
  it: "@aSancho@bEs un peccatos que no podemos fermarce por bere qualcosas y mangiare una buena paella...\nAbbiamo troppas cosas da fare.\n@c0@"
  ja: "@a@bサンチョ「酒場で一杯　というのは\n\tまだ　先になりそうですな。\n\t今は　目的がありますし。\n@c0@"
50:
  de: "@a%0%a001240@bMit den zwei Königinnen meint er Mama und Großmutter, richtig? Aber wir werden sie doch retten, oder, Papa?\n@c0@"
  en: "@a%0%a001240@bTwo generations means Mum and Grandma, right? But we'll go the rescue, won't we, Dad?\n@c0@"
  es: "@a%0%a001240@bDos generaciones, eso es mamá y la abuela, ¿no? Pero las rescataremos, ¿eh, papi?\n@c0@"
  fr: "@a%0%a001240@bDeux générations, ça veut dire maman et\ngrand-mère, c'est çaⓡ Mais on va les sauver,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bSta parlando di mamma e di nonna, non è vero?\nNon preoccuparti, papà! Vedrai che le troveremo!\n@c0@"
  ja: "@a@b%a001240「２代って　お母さんと\n\tおばあちゃんのことだよね。\n\t絶対　助けてあげようね　お父さん！\n@c0@"
51:
  de: "@a%0%a001250@bIch war wirklich traurig, keine Mama zu haben. Du musst auch sehr traurig gewesen sein, ohne deine Mutter aufzuwachsen...\n@c0@"
  en: "@a%0%a001250@bI was really sad being without a mum. You must've been sad growing up without your mum too, Dad.\n@c0@"
  es: "@a%0%a001250@bEstaba muy triste sin una mamá. Seguro que tú también estabas triste sin tu mamá, ¿no, papi?\n@c0@"
  fr: "@a%0%a001250@bC'était vraiment très dur de ne pas avoir de maman. Toi aussi, papa, tu as dû être triste de grandir sans ta maman.\n@c0@"
  it: "@a%0%a001250@bPapà, so bene cosa voglia dire crescere senza avere accanto la propria mamma. Vedrai che presto potrai riabbracciare nonna Mada...\n@c0@"
  ja: "@a@b%a001250「わたし　お母さんいなくて\n\tさみしかったから…　お父さんも\n\tお母さんいなくて　さみしかったね。\n@c0@"
52:
  de: "@aSancho@bVielleisst es ist Schicksal. Du und deine Padre, ihr habt den gleissen Weg...\n@c0@"
  en: "@aSancho@bMaybe ees esome kind of destiny.\nYou and your father, you travel the esameⓚⓛ\n@c0@"
  es: "@aSancho@bA lo mejor es el mero destino.\nTu padre y tú, el mismo...\n@c0@"
  fr: "@aSancho@bPeut-être que c'est oune sorte de destinée.\r\nTon p-p-père et toi vous voyagez de la même...\n@c0@"
  it: "@aSancho@b¡Que destinos crudeles! Tu y el señor Russel siete entrambos estatos separatos dalle vostre mujeres...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「これも運命なんでしょうか。\n\tパパスさまと　坊っちゃん\n\tおふたりとも　同じ道を……\n@c0@"
53:
  de: "@aSancho@bNo! Iss werde nisst zulassen, dass du das gleisse Schicksal erleidest wie deine Padre, Chico! Darum reisen wir ja zusammen!\n@c0@"
  en: "@aSancho@bNo! I no allow you to esuffer the esame fate\r\nlike your father, friend! Ees for thees we are travelling now.\n@c0@"
  es: "@aSancho@b¡No! ¡No dejaré que sufras el mismo destino que tu padre, chamaco! Por eso luchamos ahorita, nomás.\n@c0@"
  fr: "@aSancho@bNoⓠ Je ne p-p-permettrai pas qu'il t'arrive la même chose qu'à ton père, chicoⓠ C'est pour ça qu'on voyage, aujourd'hui.\n@c0@"
  it: "@aSancho@bCredime, chico: farò del mio meglios por aiutarte nella tua ricercas.\n¡Vedrai, ce la faremo!\n@c0@"
  ja: "@a@bサンチョ「いやいや…\n\tここで　断ち切らなくては！\n\tそのために　旅しているんです。\n@c0@"
54:
  de: "@aBianca@bSieht nicht so aus, als würde es Städte oder Dörfer in der Nähe geben. Am besten bleiben wir hier.\n@c0@"
  en: "@aBianca@bIt dun't look like there are any other towns or villages 'round these parts, so we should probably try and rest here.\n@c0@"
  es: "@aBianca@bParece que no hay ningún otro pueblo por aquí, así que deberíamos quedarnos a descansar aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait qu'il n'y a aucune autre ville ou village, dans le coin. Je crois qu'on devrait essayer de se reposer ici.\n@c0@"
  it: "@aBianca@bNon credo che ci siano altri villaggi da queste parti.\nForse faremmo meglio a fermarci qui, se vogliamo riposare un po'.\n@c0@"
  ja: "@a@bビアンカ「このあたりに　町や村は\n\tないようだから　休んでいくなら\n\tここしかないわね。\n@c0@"
55:
  de: "@aNera@bEs ist schön, dass sich hier all die Jahre nichts verändert hat.\n@c0@"
  en: "@aNera@bIt's nice to see this place is the same as always.\n@c0@"
  es: "@aNera@bEs bonito ver que este sitio está igual que siempre, veramente.\n@c0@"
  fr: "@aNera@bC'est agréable de voir que cet endroit n'a pas changé d'un pouce.\n@c0@"
  it: "@aNera@bQuesto posto non è cambiato affatto dall'ultima volta che venni qui...\n@c0@"
  ja: "@a@bフローラ「ここは　いつ来ても\n\t変わっていなくて　ホッとしますわね。\n@c0@"
56:
  de: "@a%0%a001240@bWir haben hier oft übernachtet, als wir dich und Mama gesucht haben.\n@c0@"
  en: "@a%0%a001240@bWe used to stay here a lot back when we were searching for you and Mum.\n@c0@"
  es: "@a%0%a001240@bCuando os buscábamos a ti y a mamá a menudo dormíamos aquí.\n@c0@"
  fr: "@a%0%a001240@bOn s'arrêtait souvent ici à l'époque où on vous cherchait, maman et toi.\n@c0@"
  it: "@a%0%a001240@bLo sai? Venimmo qui diverse volte quando cercavamo te e la mamma.\n@c0@"
  ja: "@a@b%a001240「ここの宿屋　石になった\n\tお父さんたちを　さがしてるとき\n\tボクたちも　よく泊まったんだよ。\n@c0@"
57:
  de: "@aSancho@bDiese Ort gehört zum Königreiss Humburg.\n@c0@"
  en: "@aSancho@bThees place, ees the territory of Gotha.\n@c0@"
  es: "@aSancho@bEsto es el territorio de Pankraz.\n@c0@"
  fr: "@aSancho@bCet endroit se trouve sur le territoire de Gotha.\n@c0@"
  it: "@aSancho@bAquí ce troviamo nel territorios de Denim.\n@c0@"
  ja: "@a@bサンチョ「このあたりは\n\tグランバニアの領土です。\n@c0@"
58:
  de: "@aSancho@bEs ist doch nett zu sehen, wie das Volk so lebt, no?\n@c0@"
  en: "@aSancho@bEes good to esee how all the people een the kingdom leeve, no?\n@c0@"
  es: "@aSancho@bEstá bueno saber cómo viven todas las personas del reino, ¿no?\n@c0@"
  fr: "@aSancho@bC'est bueno de voir comment vivent les gens dans\nt-t-tout le royaume, noⓡ\n@c0@"
  it: "@aSancho@bⓆ Deeenim... Ⓡ\nⓆ Tierra de mi corazooon...! Ⓡ\nⓆ Tierra de hombres de valooor...! Ⓡ\n@c0@"
  ja: "@a@bサンチョ「民の暮らしを　よく\n\tごらんになると　いいですよ。\n@c0@"
59:
  de: "@aOtto@bWer hätte gedacht, dass ich mitten im Nirgendwo solch ein hübsches Mädel antreffen würde? Vielleicht ist das Schicksal...\n@c0@"
  en: "@aTuppence@bWho would've expected to find a lovely bunny girl out in the sticks like this? Maybe it's fate...\n@c0@"
  es: "@aAlazar@b¿Quién iba a esperar encontrar una preciosa conejita aquí perdida en el quinto pino? Quizá sea el destino...\n@c0@"
  fr: "@aInnocent@bQui s'attendrait à trouver une aussi charmante serveuse dans un endroit aussi perdu, heinⓡ\nC'est peut-être le destin...\n@c0@"
  it: "@aSimon@bAccidenti, che sventol... Ehm, volevo dire che non avrei mai immaginato di incontrare una fanciulla così graziosa in questo luogo remoto...\n@c0@"
  ja: "@a@bピピン「こんな山奥で　バニーさんに\n\tめぐり会えるだなんて！\n\tこれは　運命ですか！？\n@c0@"
60:
  de: "@a%0%a001240@bJuchhu! Das Angebot gilt immer noch.\n@c0@"
  en: "@a%0%a001240@bCool! They've still got their campaign going.\n@c0@"
  es: "@a%0%a001240@b¡Genial! Aún tienen la oferta esa.\n@c0@"
  fr: "@a%0%a001240@bSuperⓠ Ils font encore leur offre spéciale.\n@c0@"
  it: "@a%0%a001240@bChe fortuna!\nNon hanno ancora interrotto la promozione!\n@c0@"
  ja: "@a@b%a001240「まだ　キャンペーン\n\tやってるんだ！\n@c0@"
61:
  de: "@a%0%a001240@bAls wir mit Sancho hier waren, konnten wir es nicht nutzen, weil wir ja nur zu dritt waren.\n@c0@"
  en: "@a%0%a001240@bWe couldn't make use of it when we were here with Sancho because there were only three of us.\n@c0@"
  es: "@a%0%a001240@bCuando estuvimos con Sancho no pudimos aprovecharla porque solo éramos tres.\n@c0@"
  fr: "@a%0%a001240@bLa dernière fois qu'on est venus avec Sancho, on n'a pas pu en profiter parce qu'on n'était que trois.\n@c0@"
  it: "@a%0%a001240@bQuando sono stato qui con mia sorella e lo zio Sancho non abbiamo potuto approfittarne, perché eravamo in tre.\n@c0@"
  ja: "@a@b%a001240「前に来たときは\n\t３人だったから　キャンペーンの\n\t対象にならなかったんだ。\n@c0@"
62:
  de: "@aOtto@bWie schön, solch ein entzückendes Wesen hier anzutreffen! Genau das Richtige nach einem langen und anstrengenden Tag.\n@c0@"
  en: "@aTuppence@bHow lovely it is to see a bunny girl here! Just the kind of refreshment you need after a long journey.\n@c0@"
  es: "@aAlazar@b¡Qué agradable encontrar una conejita aquí! Es justo lo que necesito para relajarme después de un largo viaje.\n@c0@"
  fr: "@aInnocent@bC'est très agréable de trouver une jolie serveuse dans un endroit pareilⓠ Exactement le genre de vision rafraîchissante qu'il faut après un long voyage.\n@c0@"
  it: "@aSimon@bVedere quella bella figliola mi ha fatto istantaneamente recuperare tutte le energie spese per arrivare fin qui...\n@c0@"
  ja: "@a@bピピン「いいなあ　バニーさんは！\n\t長旅の疲れも　ふっとびますね！\n@c0@"
63:
  de: "@aOtto@bWie schön, solch ein entzückendes Wesen hier anzutreffen! Genau das Richtige nach einem langen und anstrengenden Tag.\n@c0@"
