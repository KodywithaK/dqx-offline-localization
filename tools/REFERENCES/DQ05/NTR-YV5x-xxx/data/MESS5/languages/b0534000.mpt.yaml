  it: "@aNera@bNon credevo che superare una montagna fosse tanto dura... Perché la nostra amata dea non ci ha creati con un bel paio d'ali?\n@c0@"
  ja: "@a@bフローラ「私　さっきから　ずっと\n\tナナメになっている気がしますわ。\n\t山道って　大変ですのね。\n@c0@"
157:
  de: "@a%0%a001240@bHa ha! Das ist wirklich lustig. Hier kann man noch nicht mal aufrecht stehen.\n@c0@"
  en: "@a%0%a001240@bHa ha! These paths are really funny. It's impossible to stand up straight.\n@c0@"
  es: "@a%0%a001240@b¡Ja, ja! Estos caminos son muy divertidos. No hay forma de mantenerse derecho.\n@c0@"
  fr: "@a%0%a001240@bHa haⓠ Ces sentiers sont vraiment rigolos.\nC'est impossible de se tenir droit.\n@c0@"
  it: "@a%0%a001240@bQuesti sentieri sono una cosa impossibile!\nPerò sarebbe divertentissimo scorrazzare qui, se non avessimo cose più importanti da fare...\n@c0@"
  ja: "@a@b%a001240「えへへ。\n\tまっすぐ立てないよ　この道。\n\tおもしろいね！\n@c0@"
158:
  de: "@a%0%a001250@bIch mag diesen Weg nicht. Ich meine immer, ich würde runterfallen.\n@c0@"
  en: "@a%0%a001250@bI don't like this path. I keep thinking I'm going to fall.\n@c0@"
  es: "@a%0%a001250@bEste camino no me gusta. Me da la impresión de que me voy a caer.\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas ce sentier. Je n'arrête pas de me dire que je vais tomber.\n@c0@"
  it: "@a%0%a001250@bMamma mia, che paura!\nMi sembra incredibile che io non sia ancora caduta di sotto...!\n@c0@"
  ja: "@a@b%a001250「この道\n\tすべりそうで　こわい……。\n@c0@"
159:
  de: "@aBianca@bDu willst doch nicht wirklich da hinauf, oder, %a000090? Müssten wir uns nicht langsam auf den Weg nach Nadiria machen?\n@c0@"
  en: "@aBianca@bYou're not really plannin' on doin' this climb, are you, %a000090? Dun't we need to get a move on to Nadiria?\n@c0@"
  es: "@aBianca@bNo estarás pensando en escalar esto, ¿verdad, %a000090? ¿No teníamos que ponernos en marcha hacia Nadiria?\n@c0@"
  fr: "@aBianca@bTu n'envisages pas sérieusement d'escalader cette montagne, %a000090ⓡ On n'est pas censés aller à Nadiria, plutôtⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, ma che hai intenzione di fare?!\nNon dovremmo andare a Nadiria?\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　本当に\n\tこの山道を　のぼるつもり？\n\t先を　急がなくていいの？\n@c0@"
160:
  de: "@aNera@bIch dachte, wir würden schnurstracks nach Nadiria gehen?\n@c0@"
  en: "@aNera@bI thought we were supposed to be going\r\nstraight to Nadiria.\n@c0@"
  es: "@aNera@bPensaba que íbamos a ir directos a Nadiria, veramente.\n@c0@"
  fr: "@aNera@bJe croyais qu'on était censés aller directement\r\nà Nadiria.\n@c0@"
  it: "@aNera@bCredevo che la nostra destinazione fosse Nadiria...\nForse ho capito male?\n@c0@"
  ja: "@a@bフローラ「私は　すぐ　魔界へ\n\t行くものと思っていましたわ。\n@c0@"
161:
  de: "@a%0%a001240@bDie Berge sind großartig! Ich liebe das Klettern!\n@c0@"
  en: "@a%0%a001240@bMountain paths are fun! I love climbing!\n@c0@"
  es: "@a%0%a001240@b¡Los caminos de montaña son divertidos! ¡Me encanta escalar!\n@c0@"
  fr: "@a%0%a001240@bC'est rigolo, les chemins de montagneⓠ\nJ'adore l'escaladeⓠ\n@c0@"
  it: "@a%0%a001240@bAdoro la montagna! Da grande diventerò scalatore professionista o allevatore di stambecchi, o qualsiasi altra cosa che abbia a che fare con i monti!\n@c0@"
  ja: "@a@b%a001240「坂道って　楽しいよね！\n\tボク　大好きっ！\n@c0@"
162:
  de: "@aSancho@bDer Gebetsring... hah...?\nDas ist gut... hah... si?\nSehr... hah... gut...\n@c0@"
  en: "@aSancho@bThe prayer ring...hahh...?\nEes good...hahh...sí?\nVery...hahh...good...\n@c0@"
  es: "@aSancho@b¿El anillo... ahh... de oración...?\nEs bueno... aahh. Muy bueno... aahh nomás...\n@c0@"
  fr: "@aSancho@bLa bague de prière... haan...ⓡ\nC'est b-b-bien... han... noⓡ\nTrès... haan... bien...\n@c0@"
  it: "@aSancho@bHaaahhh... L'anello dellaaah fede... Haaahhh...\nSì, es muy bello...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「いのりの指輪　でしたか……\n\tぜえぜえ……　それは\n\tよかったですね　はあはあ………。\n@c0@"
163:
  de: "@aNera@bIch kann nicht glauben, dass Papa mir wirklich einen Boten bis hierher nachgeschickt hat!\n@c0@"
  en: "@aNera@bI can't believe Papa sent a messenger all the way out here!\n@c0@"
  es: "@aNera@b¡Non posso credere que il mio papino haya enviado un mensajero hasta aquí!\n@c0@"
  fr: "@aNera@bJe n'arrive pas à croire que papa nous ait envoyé un messager jusqu'iciⓠ\n@c0@"
  it: "@aNera@bNon riesco a credere che mio padre abbia mandato un fattorino fin qui!\n@c0@"
  ja: "@a@bフローラ「お父さまったら\n\tこんな所にまで\n\t使者を　よこすなんて……。\n@c0@"
164:
  de: "@a%0%a001240@bWir haben ein Geschenk von Großvater Onassetti bekommen? Das ist ja nett!\n@c0@"
  en: "@a%0%a001240@bWe got a present from Grandpa Briscoletti? Cool!\n@c0@"
  es: "@a%0%a001240@b¿Un regalo del abuelo Rimaldi? ¡Genial!\n@c0@"
  fr: "@a%0%a001240@bOn a reçu un cadeau de grand-père Oscuroniⓡ Chouetteⓠ\n@c0@"
  it: "@a%0%a001240@bChe bello!\nNonno Rick ci ha mandato un regalo!\n@c0@"
  ja: "@a@b%a001240「ルドマンおじいちゃんからの\n\tプレゼントなの？　いいなあ～。\n@c0@"
165:
  de: "@a%0%a001250@bDer Mann war auch schon bei unserem letzten Besuch hier. Ob er all die Jahre auf dich gewartet hat?\n@c0@"
  en: "@a%0%a001250@bThat man was here when we came through last time. I wonder if he's been waiting for you all those years.\n@c0@"
  es: "@a%0%a001250@bEse hombre ya estaba aquí la última vez que pasamos por aquí. ¿Te habrá estado esperando todos estos años?\n@c0@"
  fr: "@a%0%a001250@bCet homme était là quand on est passés, la dernière fois. Je me demande s'il t'a attendu pendant toutes ces années.\n@c0@"
  it: "@a%0%a001250@bSono certa di aver già visto quell'uomo la prima volta che passai da queste parti... Credi che ti abbia aspettato qui per tutti questi anni?!\n@c0@"
  ja: "@a@b%a001250「あの人　前に通ったときも\n\tいました。　お父さんのこと\n\t何年も　待っていたの？\n@c0@"
166:
  de: "@aNera@bWas für ein wundervolles Geschenk! Wie großzügig von Papa!\n@c0@"
  en: "@aNera@bWhat a wonderful thing to send to us.\r\nHow generous of Papa!\n@c0@"
  es: "@aNera@b¡Qué gesto tan generoso! Il mio papino es así.\n@c0@"
  fr: "@aNera@bQuel merveilleux cadeau. C'est vraiment généreux\nde la part de papaⓠ \n@c0@"
  it: "@aNera@bChe splendido pensiero che ha avuto il mio papà!\nÈ sempre stato una persona generosa...\n@c0@"
  ja: "@a@bフローラ「こんな　高価なものを\n\t私たちのために……\n\tありがとう　お父さま……。\n@c0@"
167:
  de: "@a%0%a001250@bOhhh! Fließende Kleider sind doch eigentlich sehr teuer, oder? Großvater Onassetti ist wirklich großzügig.\n@c0@"
  en: "@a%0%a001250@bOoh! Flowing dresses are really expensive, aren't they? Grandpa Briscoletti's really generous.\n@c0@"
  es: "@a%0%a001250@b¡Oooh! Los vestidos vaporosos son muy caros, ¿verdad? Qué generoso el abuelo Rimaldi.\n@c0@"
  fr: "@a%0%a001250@bOohⓠ C'est très cher les robes flottantes, heinⓡ Grand-père Oscuroni est vraiment très généreux.\n@c0@"
  it: "@a%0%a001250@bOooh! Le vesti d'acqua sono abiti costosissimi!\nNonno Rick è stato davvero generoso!\n@c0@"
  ja: "@a@b%a001250「すご～い！\n\t水のはごろもって　高いんでしょ？\n\tルドマンおじいちゃん　ふとっぱらね。\n@c0@"
168:
  de: "@aBianca@bAlso, hier ist's mir wirklich nicht ganz geheuer. Was meinst du, wie dieses Skelett wohl hierher gekommen ist?\n@c0@"
  en: "@aBianca@bThis place is givin' me the willies. How d'you suppose that skeleton ended up over there?\n@c0@"
  es: "@aBianca@bEste sitio me pone la piel de gallina. ¿Cómo crees que ha llegado ese esqueleto hasta ahí?\n@c0@"
  fr: "@aBianca@bCet endroit me donne la chair de poule.\nComment crois-tu que ce squelette a atterri iciⓡ\n@c0@"
  it: "@aBianca@bQuesto posto mi fa venire i brividi!\nCome avrà fatto quello scheletro a finire lì?!\n@c0@"
  ja: "@a@bビアンカ「ここって　なんだか\n\tこわいわよね。　あっちに落ちている\n\tガイコツは　どうしたのかしら……。\n@c0@"
169:
  de: "@aNera@bHier fühlt es sich schrecklich kalt an. Vielleicht bilde ich es mir auch nur ein, aber mir ist, als spürte ich hier etwas Böses.\n@c0@"
  en: "@aNera@bThere's a horrible cold feeling to this place.\r\nI'm probably just imagining things, but it feels sort of sinister.\n@c0@"
  es: "@aNera@bEste lugar me produce una sensación horribilemente fría.\n㈡\nQuizá es solo mi imaginación, pero me parece bastante siniestro.\n@c0@"
  fr: "@aNera@bIl se dégage de ce lieu une impression glaciale.\r\nJ'ai peut-être un peu trop d'imagination, mais\r\nça a un côté sinistre.\n@c0@"
  it: "@aNera@bQuesto posto ha un'aria così fredda, così sinistra...\n@c0@"
  ja: "@a@bフローラ「この部屋　寒気がしますわ。\n\tうすぐらいし　なんだか\n\t気味が悪いです……。\n@c0@"
170:
  de: "@a%0%a001240@bIch erinnere mich nicht, hier gewesen zu sein, als wir mit Sancho unterwegs waren.\n@c0@"
  en: "@a%0%a001240@bI don't remember coming here when we were\nwith Sancho.\n@c0@"
  es: "@a%0%a001240@bNo recuerdo haber estado aquí antes con Sancho.\n@c0@"
  fr: "@a%0%a001240@bJe ne me souviens pas être venu ici avec Sancho.\n@c0@"
  it: "@a%0%a001240@bNon ricordo di essere stato qui quando eravamo con lo zio Sancho...\n@c0@"
  ja: "@a@b%a001240「前に　サンチョと\n\t来たときは　ここには来なかったよ。\n@c0@"
171:
  de: "@aBianca@bMir gefällt das Lachen der alten Frau gar nicht. Sie klingt wie eine Hexe oder so.\n@c0@"
  en: "@aBianca@bI dun't much like the sound of that old woman's laugh. She sounds like a witch or somethin'.\n@c0@"
  es: "@aBianca@bNo me gusta demasiado el sonido de la risa de esa vieja. Parecía una bruja o algo así, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'aime pas beaucoup le rire de cette vieille femme. On dirait une sorcière, ou un truc du genre.\n@c0@"
  it: "@aBianca@bSanto cielo! Hai sentito quant'è sinistra la risata di quella vecchia?!\nSembra una strega malvagia!\n@c0@"
  ja: "@a@bビアンカ「なんか　笑い方が不気味な\n\tおばあさんよね……。\n@c0@"
172:
  de: "@aNera@bIch sollte das vermutlich nicht sagen, aber mir ist diese alte Frau nicht sehr sympathisch. Ich fühle mich bei ihr ein wenig unbehaglich.\n@c0@"
  en: "@aNera@bI probably shouldn't really say so, but I'm not all that taken with the old woman. She makes me feel a bit uneasy.\n@c0@"
  es: "@aNera@bQuizá no debería decir esto, pero esa anciana, veramente, no me resulta muy agradable. Me hace sentir un poco incómoda.\n@c0@"
  fr: "@aNera@bJe ne devrais pas dire ça, mais je n'apprécie pas vraiment cette vieille femme. Elle me met mal à l'aise.\n@c0@"
  it: "@aNera@bQuell'anziana signora mi mette a disagio.\nQualcosa mi dice che è meglio non fidarsi di lei...\n@c0@"
  ja: "@a@bフローラ「こんなことを　言っては\n\tいけないんですけど……\n\t私　あのおばあさん　苦手ですわ。\n@c0@"
173:
  de: "@a%0%a001240@bHe he he. Sei vorsichtig, Papa. He he he.\n@c0@"
  en: "@a%0%a001240@bHeh heh heh. Be careful, Dad. Heh heh heh!\n@c0@"
  es: "@a%0%a001240@bJe, je, je. Ten cuidado, papá. ¡Je, je, je!\n@c0@"
  fr: "@a%0%a001240@bHé hé hé. Attention, papa. Hé hé héⓠ\n@c0@"
  it: "@a%0%a001240@bⓕWah wah wah wah wahⓖ?!\nEmbè?! Che c'è da ridere?!\n@c0@"
  ja: "@a@b%a001240「イッヒッヒー！\n\tお父さん　気をつけてね！\n\tイッヒッヒッヒ！\n@c0@"
174:
  de: "@a%0%a001250@bIch bin ja wirklich müde, aber hier möchte ich auf keinen Fall bleiben!\n@c0@"
  en: "@a%0%a001250@bI'm really tired, but I definitely don't want to\nrest here!\n@c0@"
  es: "@a%0%a001250@b¡Estoy muy cansada, pero no quiero descansar aquí, eso seguro!\n@c0@"
  fr: "@a%0%a001250@bJe suis vraiment fatiguée, mais je n'ai absolument pas envie de passer la nuit iciⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, sono stanca morta, ma preferirei non fermarmi qui a riposare...\n@c0@"
  ja: "@a@b%a001250「つかれたけど……\n\tここでお泊まりするのは　イヤです。\n@c0@"
175:
  de: "@aBianca@bSie war doch gar nicht so übel. Jetzt tut's mir leid, dass ich sie verdächtigt habe.\n@c0@"
  en: "@aBianca@bShe wasn't a bad old stick, after all. I feel bad for doubtin' her now.\n@c0@"
  es: "@aBianca@bAl final ha resultado ser una vieja bastante maja. Siento haber dudado de ella.\n@c0@"
  fr: "@aBianca@bFinalement, elle n'était pas méchante. J'ai un peu honte d'avoir douté d'elle, maintenant.\n@c0@"
  it: "@aBianca@bQuella vecchina è davvero una persona adorabile!\nMi sento in colpa per aver dubitato di lei.\n@c0@"
  ja: "@a@bビアンカ「悪いおばあさんじゃ\n\tなかったのね。\n\tうたがったりして　悪かったな……。\n@c0@"
176:
  de: "@aNera@bIch habe ein ganz schlechtes Gewissen, dass ich so eine nette alte Dame verdächtigt habe. Bevor ich über andere urteile, muss ich wohl noch viel lernen.\n@c0@"
  en: "@aNera@bI feel so guilty for doubting such a kind old lady. It looks like I still have a lot to learn when it comes to judging others.\n@c0@"
  es: "@aNera@bMe siento culpabile por haber dudado de esa amable anciana. Aún tengo mucho que aprender sobre los prejuicios.\n@c0@"
  fr: "@aNera@bJe me sens terriblement coupable d'avoir douté\r\nd'une si gentille vieille dame. J'ai encore beaucoup\r\nà apprendre en matière de jugement.\n@c0@"
  it: "@aNera@bChe signora gentile, eh?\nE io che l'avevo giudicata male...!\n@c0@"
  ja: "@a@bフローラ「あんなに　親切な方を\n\tこわがるなんて…　私も\n\t人としての修業が　足りませんわね。\n@c0@"
177:
  de: "@a%0%a001240@bMann, hab ich gut geschlafen. Was ist los, Papa? Du hast ja ganz rote Augen.\n@c0@"
  en: "@a%0%a001240@bAaah, that was a good sleep. What's wrong, Dad? Your eyes are all red.\n@c0@"
  es: "@a%0%a001240@bAaah, qué bien he dormido. ¿Qué te pasa, papá? Tienes los ojos rojos.\n@c0@"
  fr: "@a%0%a001240@bAaah, j'ai bien dormi. Qu'est-ce qui ne va pas, papaⓡ Tu as les yeux tout rouges.\n@c0@"
  it: "@a%0%a001240@bAh, che bella dormita che ho fatto!\nPapà, come mai hai gli occhi tutti arrossati?\nNon hai riposato bene?\n@c0@"
  ja: "@a@b%a001240「あー　よく寝たっ。\n\tどうしたの？\n\tお父さん　目が赤いよ？\n@c0@"
178:
  de: "@aOtto@bIch habe davon geträumt, Bleistifte zu spitzen. Was das wohl zu bedeuten hat?\n@c0@"
  en: "@aTuppence@bI kept dreaming about sharpening pencils last night. Very bizarre!\n@c0@"
  es: "@aAlazar@bMe he pasado la noche soñando con afilar palos. ¡Qué raro!\n@c0@"
  fr: "@aInnocent@bToute la nuit, j'ai rêvé que je taillais des crayons. Bizarreⓠ\n@c0@"
  it: "@aSimon@bLa notte scorsa ho fatto un incubo tremendo!\nHo sognato di essere imprigionato nella bottega di un arrotino...\n@c0@"
  ja: "@a@bピピン「ゆうべは　ずっと\n\tエンピツをけずってる夢を\n\t見てたんですよ。　へんだなあ。\n@c0@"
179:
  de: "@aSancho@bWas für eine Glück. Es war nett, uns hier übernachten zu lassen. Schließliss sind wir nur auf Durchreise.\n@c0@"
  en: "@aSancho@bWe, we are eso lucky.\r\nWe are just the passers-by.\r\nEes eso kind to let us estay here.\n@c0@"
  es: "@aSancho@b¡Híjole, qué suerte tuvimos!\nSolo estamos de paso.\nQué amable, dejar que nos quedemos aquí.\n@c0@"
  fr: "@aSancho@bOn a de la chance. Nous, on ne fait que p-p-passer. C'est gentil de sa p-p-part de nous avoir hébergés.\n@c0@"
  it: "@aSancho@b¡Ay, que fortunas que abbiamo avuto!\nDobbiamo ringraziare quell'anima buena que ce ha permesso de trascorrere la noche al calduccios...\n@c0@"
  ja: "@a@bサンチョ「ゆきずりの旅人を\n\t泊まらせてくださるとは…\n\tいやはや　本当に　ありがたいですね。\n@c0@"
180:
  de: "@aBianca@bDieses eigentümliche Lachen würde wohl jedem einen Schauer über den Rücken jagen!\n@c0@"
  en: "@aBianca@bThat strange laugh is enough to give anyone\r\na fright!\n@c0@"
  es: "@aBianca@b¡Esa risa rara puede asustar a cualquiera!\n@c0@"
  fr: "@aBianca@bCe rire bizarre ficherait la frousse à n'importe quiⓠ\n@c0@"
  it: "@aBianca@bMa no, la risata di quella vecchina non è inquietante...\nÈ terrificante!\n@c0@"
  ja: "@a@bビアンカ「あの笑い方は\n\tあらぬ誤解を　まねきそうよね。\n@c0@"
181:
  de: "@aNera@bAaaah! Jetzt habe ich Angst! Das Lachen dieser alten Frau ist wirklich schauerlich!\n@c0@"
  en: "@aNera@bWaaah! I'm frightened! That old woman's laugh really is scary!\n@c0@"
  es: "@aNera@b¡Aaah! ¡Tengo miedo! ¡La risa de questa anciana es terrorífica!\n@c0@"
  fr: "@aNera@bOuaaaahⓠ J'ai peurⓠ Le rire de cette vieille femme est vraiment effrayantⓠ\n@c0@"
  it: "@aNera@bE come si fa a non badare a una risata tanto spaventosa?!\nOgni volta che la sento tremo di paura!\n@c0@"
  ja: "@a@bフローラ「ヒーーーーッ！\n\tやっぱり　こわいですわ。\n\tあの方は　笑顔が　こわいです～～！\n@c0@"
182:
  de: "@a%0%a001240@bHe he he!\n@c0@"
  en: "@a%0%a001240@bHeh heh heh!\n@c0@"
  es: "@a%0%a001240@b¡Je, je, je!\n@c0@"
  fr: "@a%0%a001240@bHé hé héⓠ\n@c0@"
  it: "@a%0%a001240@bⓕWah wah wah wah wahⓖ!\n@c0@"
  ja: "@a@b%a001240「イッヒッヒッヒ！\n@c0@"
183:
  de: "@a%0%a001240@bWas meinst du, Papa? Kann ich auch so gruselig lachen wie sie? He he he!\n@c0@"
  en: "@a%0%a001240@bWhat do you reckon, Dad? Am I doing a good impression of her or not? Heh heh heh!\n@c0@"
  es: "@a%0%a001240@b¿Qué te parece, papi? ¿Crees que la imito bien? ¡Je, je, je!\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce que tu en dis, papaⓡ Je l'imite bienⓡ\nHé hé héⓠ\n@c0@"
  it: "@a%0%a001240@bChe ne dici, papà?\nSono bravo a imitare quella signora?\nSenti qua: ⓕWah wah wah wah wahⓖ!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\t似てる？　ねえねえ。\n\tイッヒッヒー！\n@c0@"
184:
  de: "@aOtto@bWenn die Leut' alt werden, weiß man manchmal gar nimmer, ob sie Mann oder Frau sind. Woran das wohl liegt?\n@c0@"
  en: "@aTuppence@bIt's sometimes a bit tricky to tell whether people are male or female when they get old. I wonder why.\n@c0@"
  es: "@aAlazar@bCuando la gente se hace vieja, a veces es difícil saber si son hombres o mujeres. No sé por qué será...\n@c0@"
  fr: "@aInnocent@bAvec l'âge, il devient parfois difficile de savoir si les gens sont des hommes ou des femmes.\r\nJe me demande pourquoi.\n@c0@"
  it: "@aSimon@bNon ho nulla contro le donne anziane...\nÈ solo che preferisco le ragazze giovani, meglio ancora se belle e nubili!\n@c0@"
  ja: "@a@bピピン「おばあさんになると　おじいさんと\n\t見分けが　つかなくなりますよね。\n\tなぜなんでしょう？？\n@c0@"
185:
  de: "@aBianca@bMeinst du wirklich, dass wir für so etwas Zeit haben?\n@c0@"
  en: "@aBianca@bAre you sure we've really got time for this\r\nkind of thing?\n@c0@"
  es: "@aBianca@b¿Seguro que tenemos tiempo para esto?\n@c0@"
  fr: "@aBianca@bTu es sûr qu'on a le temps pour ce genre de chosesⓡ\n@c0@"
  it: "@aBianca@bAmore, non credo che abbiamo tempo per questo genere di cose...\n@c0@"
  ja: "@a@bビアンカ「う～ん…\n\tこんなコトしてる場合じゃないと\n\t思うんだけどなあ……。\n@c0@"
186:
  de: "@aNera@bWir sollten uns das für später aufbewahren, %a000090. Wir müssen uns auf unsere Aufgabe konzentrieren.\n@c0@"
  en: "@aNera@bWe should save the trip down memory lane for later, %a000090. We need to focus on the job in hand.\n@c0@"
  es: "@aNera@bMa deberíamos dejar este desvío nostálgico para otro momento, %a000090. Veramente, tenemos que concentrarnos en la misión.\n@c0@"
  fr: "@aNera@bNous devrions remettre à plus tard ce petit voyage dans les souvenirs, %a000090. Nous devons nous concentrer sur notre objectif. \n@c0@"
  it: "@aNera@b%0%a000090, non sarebbe meglio rimandare il nostro ⓕviaggio tra i ricordiⓖ a un'altra volta?\nAdesso dobbiamo concentrarci sulla nostra missione!\n@c0@"
  ja: "@a@bフローラ「あなた　思い出には\n\tあとからでも　ひたれますわ。\n\t今は　先を　急ぎましょう。\n@c0@"
187:
  de: "@a%0%a001250@bDiese Höhle ist nicht allzu schlimm, finde ich. Hier kann man ganz gut rumspazieren.\n@c0@"
  en: "@a%0%a001250@bI don't mind this cave because it's not too hard to walk about in.\n@c0@"
  es: "@a%0%a001250@bEsta cueva no me da miedo, no es complicado moverse por ella.\n@c0@"
  fr: "@a%0%a001250@bÇa ne me dérange pas d'être dans cette grotte, parce qu'il n'est pas trop difficile d'y marcher.\n@c0@"
  it: "@a%0%a001250@bQuesta grotta non è tanto male, vero?\nSi riesce a procedere senza troppe difficoltà.\n@c0@"
  ja: "@a@b%a001250「この洞くつは\n\t歩きやすいから　大丈夫です。\n@c0@"
188:
  de: "@aSancho@bEh, wo ist die Ausgang?\nDa lang? No, diese Risstung...\n@c0@"
  en: "@aSancho@bEh, where ees the exit?\nEes thees way? No, ees thees way...\n@c0@"
  es: "@aSancho@bHíjole, ¿por dónde es la salida?\n¿Es por allá? No, es por acá...\n@c0@"
  fr: "@aSancho@bHé, où est la s-s-sortieⓡ Par iciⓡ No, c'est par là...\n@c0@"
  it: "@aSancho@b¿Donde está l'uscitas?\n¿Da esta partes?\n¿Oppure da quella partes là?\n@c0@"
  ja: "@a@bサンチョ「フウ……フウ……\n\t出口は　どっちでしたかな？\n@c0@"
189:
  de: "@a%0%a001240@bWir haben uns total verlaufen, als wir mit Sancho hier waren. Das war vielleicht schlimm.\n@c0@"
  en: "@a%0%a001240@bWe got really lost when we came here with Sancho.\nIt was a right pain.\n@c0@"
  es: "@a%0%a001240@bCuando vinimos aquí con Sancho nos perdimos del todo.\nQué fastidio.\n@c0@"
  fr: "@a%0%a001240@bOn s'est complètement perdus quand on est venus ici avec Sancho. Une vraie catastrophe.\n@c0@"
  it: "@a%0%a001240@bQuando venimmo qui con lo zio Sancho ci perdemmo un'infinità di volte.\nA momenti impazzivamo!\n@c0@"
  ja: "@a@b%a001240「前に　サンチョと通ったときは\n\t道に迷っちゃって　大変だったんだよ。\n@c0@"
190:
  de: "@aOtto@bWenn ich wählen könnte, würde ich sagen, dass mir Türme besser gefallen als Höhlen.\n@c0@"
  en: "@aTuppence@bIf I had to state a preference, I'd say towers are more my cup of tea than caves.\n@c0@"
  es: "@aAlazar@bSi tengo que elegir una opción, prefiero las torres a las cuevas.\n@c0@"
  fr: "@aInnocent@bSi on me demandait mon avis, je dirais que je préfère de loin les tours aux grottes.\n@c0@"
  it: "@aSimon@bLe caverne non sono male, ma preferisco di gran lunga le torri.\n@c0@"
  ja: "@a@bピピン「どっちかって言えば\n\t洞くつよりは　塔のほうが\n\tボクは　好きですね。\n@c0@"
191:
  de: "@aOtto@bIch mag es, wenn man den Himmel sehen kann, wisst Ihr.\n@c0@"
  en: "@aTuppence@bI suppose I just like being able to see the sky.\n@c0@"
  es: "@aAlazar@bSupongo que me gusta ver el cielo.\n@c0@"
  fr: "@aInnocent@bJe crois que c'est juste parce que j'aime bien pouvoir voir le ciel.\n@c0@"
  it: "@aSimon@bLe torri sono alte, eleganti, slanciate!\r\nProprio come le ragazze che piacciono a me!\r\nEh eh eh! Ehm...\n@c0@"
  ja: "@a@bピピン「やっぱり　空が見えると\n\t気持ちいいじゃないですか。\n@c0@"
192:
  de: "@aBianca@bDas letzte Mal, als ich hier war, ging's mir gar nicht gut. Na ja, ich war ja auch schwanger.\n@c0@"
  en: "@aBianca@bIt was a bit tough on me the last time I was here, tryin' to get through this place bein' pregnant and all.\n@c0@"
  es: "@aBianca@bLa última vez que pasamos por aquí recuerdo que fue complicado, estando embarazada y tal, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'était un peu dur pour moi, la dernière fois, d'essayer de traverser cet endroit alors que\r\nj'étais enceinte.\n@c0@"
  it: "@aBianca@bRicordo quanta fatica feci quando venimmo qui durante la mia gravidanza...\nTemevo che non ce l'avrei fatta...\n@c0@"
  ja: "@a@bビアンカ「昔　来たときは　大変だったな。\n\t%a001240たちが　お腹にいたから\n\tなんだか　つかれやすかったし……。\n@c0@"
193:
  de: "@aNera@bAls wir das letzte Mal hier hochkletterten, war ich schwanger. Warst du eigentlich sehr böse, dass ich dir das damals verheimlicht habe?\n@c0@"
  en: "@aNera@bDid it make you angry that I hid the fact I was pregnant when we climbed up here all those\r\nyears ago?\n@c0@"
  es: "@aNera@b¿Te molestó que te ocultase la mia gravidanza la primera vez que pasamos por aquí, hace años?\n@c0@"
  fr: "@aNera@bÇa t'a mis en colère que je t'aie caché ma grossesse quand on a escaladé ces montagnes, il y a toutes\nces annéesⓡ\n@c0@"
  it: "@aNera@bRicordi quando venimmo qui tanti anni fa?\nNon ti avevo detto di essere incinta...\nLa cosa ti fece arrabbiare molto?\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた　怒る？\n\t昔　%a001240たちが　お腹にいたのに\n\tそれをかくして　山道にのぼったこと。\n@c0@"
194:
  de: "@aNera@bDas kann ich verstehen. Aber ich war mir sicher, dass alles gut gehen würde. Ich weiß nicht warum, aber ich wusste es einfach.\n@c0@"
  en: "@aNera@bI can understand that. But I had faith that everything was going to be alright.\r\nI can't explain it, but I just knew.\n@c0@"
  es: "@aNera@bLo comprendo. Pero tenía la sicurezza de que todo iba a salir bien.\nNo puedo explicar por qué, ma lo sabía.\n@c0@"
  fr: "@aNera@bJe comprends, mais j'avais la certitude absolue que tout allait bien se passer. Impossible d'expliquer pourquoi, mais je le savais.\n@c0@"
  it: "@aNera@bTi capisco. Però ero certa che né io né i bambini che avevo in grembo avremmo corso rischi.\nPer fortuna la mia convinzione si rivelò corretta!\n@c0@"
  ja: "@a@bフローラ「そうよね。　でも　あのときは\n\tなんとなく　大丈夫っていう\n\t確信があったの。　ふしぎだけど……。\n@c0@"
195:
  de: "@aNera@bTut mir leid, dass ich dir nichts gesagt hab. Aber ich war mir sicher, dass alles gut gehen würde. Ich weiß nicht warum, aber ich wusste es einfach.\n@c0@"
  en: "@aNera@bSorry I didn't tell you. But I had faith that everything was going to be alright.\r\nI can't explain it, but I just knew.\n@c0@"
  es: "@aNera@bLamento no habértelo dicho. Pero tenía la sicurezza de que todo iba a salir bien.\nNo puedo explicar por qué, ma lo sabía.\n@c0@"
  fr: "@aNera@bJe suis désolée de ne pas te l'avoir dit, mais j'avais la certitude absolue que tout allait bien se passer. Impossible d'expliquer pourquoi, mais je le savais.\n@c0@"
  it: "@aNera@bMeglio così, tesoro. Vedi, ero certa che né io né i bambini che avevo in grembo avremmo corso rischi.\nPer fortuna la mia convinzione si rivelò corretta!\n@c0@"
  ja: "@a@bフローラ「ごめんなさいね。\n\tでも　きっと　大丈夫だって\n\t確信があったの。　ふしぎだけど……。\n@c0@"
196:
  de: "@a%0%a001240@bSieh nur, Papa! Da ragt ein Felsen heraus!\n@c0@"
  en: "@a%0%a001240@bLook out, Dad! There's a rock sticking out there.\n@c0@"
  es: "@a%0%a001240@b¡Cuidado, papi! Hay una roca que sobresale ahí.\n@c0@"
  fr: "@a%0%a001240@bAttention, papaⓠ Il y a un rocher qui dépasse, là.\n@c0@"
  it: "@a%0%a001240@bPapà, lì c'è una roccia sporgente!\n@c0@"
  ja: "@a@b%a001240「お父さん　気をつけて！\n\tそこ　石が　でっぱってるよ！\n@c0@"
197:
  de: "@a%0%a001250@b%0%a001240 findet solche Orte ganz großartig. Ich weiß auch nicht, warum...\n@c0@"
  en: "@a%0%a001250@b%0%a001240 really likes places like this. He gets all excited by them for some reason.\n@c0@"
  es: "@a%0%a001250@bA %a001240 le gustan los sitios así. Siempre se alborota, no sé por qué.\n@c0@"
  fr: "@a%0%a001250@b%0%a001240 adore les endroits comme celui-ci.\nÇa le rend tout fou, je ne sais pas pourquoi.\n@c0@"
  it: "@a%0%a001250@b%0%a001240 adora i posti come questo!\nSi diverte un mondo!\n@c0@"
  ja: "@a@b%a001250「%a001240って\n\tこういう場所　好きなのよね。\n\tわくわく　するみたい。\n@c0@"
198:
  de: "@aOtto@bDer Göttin sei Dank, diese Höhle ist aus Stein! Das ist mir viel lieber als diese Erdlöcher, wo es klamm und feucht ist.\n@c0@"
  en: "@aTuppence@bThis cave is all rock, so it's not so bad. The ones that are more earthy are all damp and nasty.\n@c0@"
  es: "@aAlazar@bComo esta cueva es de roca, no está mal. Las que son de tierra son húmedas y desagradables.\n@c0@"
  fr: "@aInnocent@bIl n'y a que de la roche, dans cette caverne, alors ça va. Celles où il y a de la terre sont bien plus humides et désagréables.\n@c0@"
  it: "@aSimon@bQuesta caverna non è tanto male, perché è fatta tutta di roccia. Quelle terrose e piene di fango, invece, non le sopporto proprio!\n@c0@"
  ja: "@a@bピピン「ここは　岩の洞くつだからいいけど\n\t土の中のような　ジメジメした洞くつ\n\tって　苦手なんですよ。\n@c0@"
199:
  de: "@aOtto@bWenn ich aus solch einer Höhle komme, meine ich immer, ich würd' nach Schimmel stinken und hätt' ein grünes Gesicht! \n@c0@"
  en: "@aTuppence@bI always feel like I smell of mould when I've been in a cave like that. I keep checking my skin to make sure I haven't turned green!\n@c0@"
  es: "@aAlazar@bEsas cuevas siempre me dan la impresión de oler a moho. ¡No hago más que mirar si se me ha puesto la piel verde!\n@c0@"
  fr: "@aInnocent@bJ'ai toujours l'impression de sentir le moisi, quand je sors d'une grotte comme ça. Je n'arrête pas de vérifier que ma peau n'est pas devenue toute verteⓠ\n@c0@"
  it: "@aSimon@bMi danno l'impressione che potrei sprofondare nel sottosuolo da un momento all'altro!\n@c0@"
  ja: "@a@bピピン「カビくさくって　肌が\n\tみどりに　なるような気がしませんか？\n@c0@"
200:
  de: "@a%0%a001240@bIch bin nie ganz alleine gereist. Wie das wohl ist?\n@c0@"
  en: "@a%0%a001240@bI've never travelled about on my own.\nI wonder what it's like.\n@c0@"
  es: "@a%0%a001240@bNunca he viajado solo.\nMe pregunto qué se sentirá.\n@c0@"
  fr: "@a%0%a001240@bJe n'ai jamais voyagé tout seul. Je me demande\nce que ça fait.\n@c0@"
  it: "@a%0%a001240@bDev'essere una vera noia viaggiare da soli...\n@c0@"
  ja: "@a@b%a001240「ボクも　ひとりきりで\n\t旅をしたことって　ないなあ。\n\tどんなふう　なんだろう？\n@c0@"
201:
  de: "@aSancho@bDieser Padre ist sehr tapfer, dass er alleine reist. Aber er hat ja die Göttin ⓚⓛ sie gibt auf ihn acht.\n@c0@"
  en: "@aSancho@bThees padre, he ees brave travelling all alone.\nEes because the Goddess, eshe watches over heem.\n@c0@"
  es: "@aSancho@bEste padrecito es bien bravo.\nEs por la Diosa, que le protege, nomás.\n@c0@"
  fr: "@aSancho@bCe p-p-prêtre est courageux de voyager tout seul. Mais c'est grâce à la Déesse, elle v-v-veille sur lui.\n@c0@"
  it: "@aSancho@bEsto sacerdote es muy coraggioso a viaggiare da solo...\n¡Que la dea lo protegga siempre!\n@c0@"
  ja: "@a@bサンチョ「よく　神父さま　ひとりで\n\tこんなところまで……。\n\tこれも　神さまのおかげですかね？\n@c0@"
202:
  de: "@a%0%a001250@bAls wir das letzte Mal hier waren, war dieser Mann ganz alleine. Man fühlt sich bestimmt sehr einsam, wenn man ganz ohne Gefährten unterwegs ist.\n@c0@"
  en: "@a%0%a001250@bThat man was all on his own the last time we\nwere here. It must be lonely travelling without\nany companions.\n@c0@"
  es: "@a%0%a001250@bEse hombre estaba completamente solo la última vez que estuvimos aquí. Debe de ser triste no tener compañeros de viaje.\n@c0@"
  fr: "@a%0%a001250@bLa dernière fois qu'on est venus ici, cet homme était déjà tout seul. Ça doit être dur de voyager sans aucun compagnon.\n@c0@"
  it: "@a%0%a001250@bMa quel signore non si annoia a viaggiare da solo?\nUhm, forse la dea è accanto a lui e gli fa compagnia...\n@c0@"
  ja: "@a@b%a001250「あの人　前にも\n\tひとりで　旅してたの。\n\tひとりの旅って　さみしいよね……。\n@c0@"
203:
  de: "@aBianca@bAls wir das letzte Mal hier waren, trug ich unsere Kinder unter dem Herzen.\n@c0@"
  en: "@aBianca@bThe last time we were here, I was carryin' our babies inside me.\n@c0@"
  es: "@aBianca@bLa última vez que estuvimos aquí nuestros hijos estaban en mi barriguita.\n@c0@"
  fr: "@aBianca@bLa dernière fois qu'on est venus ici, j'attendais\r\nnos bébés.\n@c0@"
  it: "@aBianca@bVenimmo qui anche quando ero incinta dei nostri figli, ricordi?\n@c0@"
  ja: "@a@bビアンカ「前に　ふたりで\n\tここを通ったときは\n\tふたりが　お腹にいたのよね……。\n@c0@"
204:
  de: "@aBianca@bIch habe mich damals ein wenig übernommen, aber sie sind ja trotzdem gesund zur Welt gekommen, der Göttin sei Dank.\n@c0@"
  en: "@aBianca@bI probably overdid it a bit then, but they were still born healthy, thank the Goddess.\n@c0@"
  es: "@aBianca@bA lo mejor me pasé un poco, pero aún así nacieron sanos, gracias a la Diosa, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai sans doute un peu trop forcé, à ce moment là, mais, la Déesse soit louée, ils sont quand même nés\r\nen bonne santé.\n@c0@"
  it: "@aBianca@bForse fui imprudente ad affrontare una fatica simile, ma la dea ci protesse, e la gravidanza proseguì senza problemi...\n@c0@"
  ja: "@a@bビアンカ「あの時は　ムチャしたけど\n\tふたりとも　元気に生まれてくれて\n\t本当に　よかった……。\n@c0@"
205:
  de: "@aBianca@bWas machen wir hier, %a000090? Macht es dir Angst, nach Nadiria zu gehen?\n@c0@"
  en: "@aBianca@bWhat are we doin' here, %a000090? Are you feelin' a bit nervous about goin' to Nadiria?\n@c0@"
  es: "@aBianca@b¿Qué hacemos aquí, %a000090? ¿Estás nervoso porque vamos a Nadiria?\n@c0@"
  fr: "@aBianca@bQu'est-ce qu'on fait ici, %a000090ⓡ\nTu redoutes un peu d'aller à Nadiria, c'est çaⓡ\n@c0@"
  it: "@aBianca@bChe ci facciamo qui, %a000090?\nNon ti senti ancora pronto per andare a Nadiria?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tこんな所に　何の用なの？\n\t魔界へ行くの　こわくなっちゃった？\n@c0@"
206:
  de: "@a%0%a001240@bEs ist wirklich lustig, in all diese Löcher zu hüpfen!\n@c0@"
  en: "@a%0%a001240@bIt's really good fun chucking yourself down holes in this place!\n@c0@"
  es: "@a%0%a001240@b¡Qué divertido es tirarse por estos agujeros!\n@c0@"
  fr: "@a%0%a001240@bC'est vraiment rigolo de sauter à travers les trous, dans cet endroitⓠ\n@c0@"
  it: "@a%0%a001240@bAdoro questo posto!\nSaltare giù da queste rupi è un vero spasso!\n@c0@"
  ja: "@a@b%a001240「ここってさ\n\tひゅーって落っこちるのが\n\tおもしろいんだよねっ！\n@c0@"
207:
  de: "@a%0%a001250@bIch mag diesen Ort nicht. Klettern ist doof, und dieses Runterspringen macht mir auch Angst.\n@c0@"
  en: "@a%0%a001250@bI don't like it here. I don't like climbing and I'm scared of all the dropping down too.\n@c0@"
  es: "@a%0%a001250@bEste sitio no me gusta. No me gusta escalar y además me da miedo tirarme por los agujeros.\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas être ici. Je n'aime pas l'escalade et j'ai peur quand il faut sauter pour descendre.\n@c0@"
  it: "@a%0%a001250@bOdio questo posto!\nSaltare giù da queste rupi mi mette addosso un'ansia tremenda!\n@c0@"
  ja: "@a@b%a001250「ここ　苦手。\n\tのぼるのもイヤだけど\n\t落ちるのって　こわい……。\n@c0@"
208:
  de: "@aSancho@bDiese Höhle...\nIst so...\n@c0@"
  en: "@aSancho@bThees cave...\nEes, ees eso...\n@c0@"
  es: "@aSancho@bEsta cueva...\nEs, es...\n@c0@"
  fr: "@aSancho@bCette c-c-caverne... Elle est si... si...\n@c0@"
  it: "@aSancho@bEsta caverna me recuerda qualcosas...\n@c0@"
  ja: "@a@bサンチョ「この洞くつは……。\n@c0@"
209:
  de: "@aSancho@bNo! Iss werde jetzt nisst sentimental! Komm, Chico. Wir müssen weiter.\n@c0@"
  en: "@aSancho@bNo! I no let myself become esentimental now.\nCome. We must keep moving.\n@c0@"
  es: "@aSancho@b¡No! No me puedo poner sentimental ahora, híjole.\nÁndale. Tenemos que seguir.\n@c0@"
  fr: "@aSancho@bNoⓠ Ce n'est pas le m-m-moment d'être sentimental. Viens. On doit c-c-continuer.\n@c0@"
  it: "@aSancho@bPerò no me recuerdo cosa.\n¡Vamonos!\n@c0@"
  ja: "@a@bサンチョ「いえいえ。\n\tちょっとした　感傷ですよ。\n\tさあ　行きましょう！\n@c0@"
210:
  de: "@aSancho@bDie Stärke von Humburg liegt in seine Natur. Sie beschützt das Castillo. Es hat die perfekte Lage, no?\n@c0@"
  en: "@aSancho@bThe estrength of Gotha, eet comes from the nature.\r\nEet protects the castle. Ees a good location, sí?\n@c0@"
  es: "@aSancho@bLa fuerza de Pankraz surge de la naturaleza.\nProtege el castillo. Está en un sitio padre, ¿verdad?\n@c0@"
  fr: "@aSancho@bLa force de Gotha vient de la n-n-nature.\nC'est elle qui p-protège le château.\nC'est oun bon emplacement, noⓡ\n@c0@"
  it: "@aSancho@bLa natura protegge el Castillo de Denim.\nSe trova en una posizione tale da essere praticamentes inespugnabiles.\n@c0@"
  ja: "@a@bサンチョ「グランバニアの強みは\n\t自然が　城を守ってくれることです。\n\tまったく　いい土地ですよ。\n@c0@"
211:
  de: "@aOtto@bIch lasse den Damen den Vortritt, wenn es gilt, irgendwo hinunterzuspringen. Ich bin halt ein Gentleman...\n@c0@"
  en: "@aTuppence@bIt has to be ladies first when we're doing all this dropping down from a great height. I mean, it's\r\nonly polite, after all.\n@c0@"
  es: "@aAlazar@bEn esto de tirarse desde mucha altura se debería aplicar lo de ⓕlas damas primeroⓖ. Es una cuestión de cortesía, al fin y al cabo.\n@c0@"
  fr: "@aInnocent@bQuand il s'agit de sauter d'une hauteur pareille, honneur aux dames. Simple question de politesse, voyez-vous.\n@c0@"
  it: "@aSimon@bIl galateo dice ⓕprima le donneⓖ...\nMa il gentil sesso ha la precedenza anche quando si tratta di saltare in un precipizio...?\n@c0@"
  ja: "@a@bピピン「高い所から　落ちる時は\n\t必ず　レディーファーストで。\n\tでないと　嫌われますよ？\n@c0@"
212:
  de: "@aBianca@bVorsicht, dass du nicht dauernd Sachen überall fallen lässt, %a000090! Ich kann mich allerdings nicht daran erinnern, das da verloren zu haben.\n@c0@"
  en: "@aBianca@bYou should be careful not to go droppin' things about the place, %a000090! I dun't remember droppin' that, mind.\n@c0@"
  es: "@aBianca@b¡Ten cuidado de no ir perdiendo cosas por ahí, %a000090! Aunque no recuerdo haber perdido eso, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu devrais faire attention à ne pas laisser tomber tes affaires partout, %a000090ⓠ Remarque,\nje ne me souviens pas avoir perdu ça.\n@c0@"
  it: "@aBianca@bDi' un po', ma siamo sicuri di averlo perso noi quell'affare?\n@c0@"
  ja: "@a@bビアンカ「%a000090　落とし物しないように\n\t気をつけないと　ダメだよ。\n\tでも　そんなの　落としたっけ？？\n@c0@"
213:
  de: "@aNera@bWas für ein netter alter Mann, dass er unsere Habseligkeiten für uns findet! Aber ich bin gar nicht sicher, dass wir das überhaupt verloren haben.\n@c0@"
  en: "@aNera@bWhat a nice old man, finding our belongings for us like that. I'm not sure we dropped it in the first place, mind you.\n@c0@"
  es: "@aNera@bQué anciano más encantador, que nos devuelve lo que perdemos. Aunque no estoy sicura de haber perdido eso, la verdad.\n@c0@"
  fr: "@aNera@bQuel vieil homme charmant. Il a retrouvé certaines\r\nde nos affaires. Pourtant, je ne me rappelle pas avoir perdu ça.\n@c0@"
  it: "@aNera@bChe gentile quel signore a restituirci ciò che avevamo distrattamente smarrito! Anche se non sono certa che quella roba l'avessimo persa noi...\n@c0@"
  ja: "@a@bフローラ「親切な方でしたわね。\n\t落とし物を　拾ってくださるなんて。\n\tでも　そんなの　落としたかしら？\n@c0@"
214:
  de: "@a%0%a001240@bHast du es fallen gelassen, Papa? Ich bestimmt nicht.\n@c0@"
  en: "@a%0%a001240@bDid you drop it, Dad? I know I didn't.\n@c0@"
  es: "@a%0%a001240@b¿Se te ha caído a ti, papi? A mí seguro que no.\n@c0@"
  fr: "@a%0%a001240@bC'est toi qui l'as perdu, papaⓡ En tout cas, je sais que ce n'est pas moi.\n@c0@"
  it: "@a%0%a001240@bPapà, l'avevi perso tu quel biglietto?\n@c0@"
  ja: "@a@b%a001240「えっ？\n\tお父さんが　落としたの？\n\tボクは　落としてないよ。\n@c0@"
215:
  de: "@aOtto@bAch ja, stimmt! Es gehört mir! Ich habe es fallen gelassen! ... Ähm, nein. War nur ein kleiner Scherz meinerseits.\n@c0@"
  en: "@aTuppence@bOoh, yes! That's mine! I dropped it!\n...Actually, no. I'm fibbing.\n@c0@"
  es: "@aAlazar@b¡Ah, sí! ¡Eso es mío! ¡Lo había perdido!\n... Bueno, no es verdad, es un farol.\n@c0@"
  fr: "@aInnocent@bOoh, ouiⓠ C'est à moi, je l'ai laissé tomberⓠ\n... Euh, non en fait. C'est un mensonge.\n@c0@"
  it: "@aSimon@bEhi! Quella è roba mia!\nL'ho persa l'ultima volta che sono venuto qui!\nNah, sto scherzando...\n@c0@"
  ja: "@a@bピピン「それを　落としたのは　ボクです！\n\t……すみません　ウソです。\n@c0@"
216:
  de: "@a%0%a001250@bEiner von uns lügt.\n@c0@"
  en: "@a%0%a001250@bThere's a liar in our midst.\n@c0@"
  es: "@a%0%a001250@bAlguien está mintiendo aquí.\n@c0@"
  fr: "@a%0%a001250@bIl y a un menteur parmi nous.\n@c0@"
  it: "@a%0%a001250@bQualcuno qui ha detto una bugia, eh?!\n@c0@"
  ja: "@a@b%a001250「……この中に\n\tウソつきな人が　いる。\n@c0@"
217:
  de: "@aSancho@bDiese Mann, er macht siss Sorgen, dass jemand etwas Wertvolles verloren haben könnte. Das ist so nett von ihm.\n@c0@"
  en: "@aSancho@bThees man, he worries that esomeone has lost esometheeng of value. He, he ees eso kind.\n@c0@"
  es: "@aSancho@bEste hombre se preocupa porque alguien ha perdido algo de valor. Qué amable.\n@c0@"
  fr: "@aSancho@bCet homme s'inquiète que quelqu'un ait p-p-perdu\r\noun objet de valeur. C'est t-t-très gentil à lui.\n@c0@"
  it: "@aSancho@bEs muy gentil, quell'hombre, a preoccuparse que no perdiamo nessun oggettos de valores...\n@c0@"
  ja: "@a@bサンチョ「落とし物を　拾ってくれるなんて\n\t親切な方も　いらっしゃったもんです。\n@c0@"
218:
  de: "@aBianca@b%0%a000090! Dieses Fließende Kleid gehört doch gar nicht uns! Du kannst doch keine solchen Lügen erzählen!\n@c0@"
  en: "@aBianca@b%0%a000090! That flowin' dress en't ours! You mustn't tell lies like that!\n@c0@"
  es: "@aBianca@b¡%0%a000090! ¡Ese vestido vaporoso no es nuestro! ¡No está bien que digas mentiras!\n@c0@"
  fr: "@aBianca@b%0%a000090ⓠ Cette robe flottante n'est pas à toiⓠ Tu ne dois pas dire des mensonges, comme çaⓠ\n@c0@"
  it: "@aBianca@b%0%a000090! Quella veste d'acqua non è nostra!\nNon si dicono le bugie! Però è carina, eh...?\nBeh, per questa volta ti perdono, va'...\n@c0@"
  ja: "@a@bビアンカ「%a000090　このはごろもは\n\t私たちのじゃないわよ。\n\tあんなこと言って…　ダメじゃない！\n@c0@"
219:
  de: "@aNera@bDu solltest wirklich nicht so schwindeln. Das macht man nicht. Du weißt doch, dass dieses Fließende Kleid gar nicht uns gehört.\n@c0@"
  en: "@aNera@bYou really shouldn't tell fibs like that. It's wicked. You know that flowing dress doesn't really belong to us.\n@c0@"
  es: "@aNera@bNo deberías decir mentiras, caro mio. Es de mala persona. Sabes que ese vestido vaporoso no nos pertenece.\n@c0@"
  fr: "@aNera@bTu ne devrais pas dire de mensonges, tu sais.\r\nC'est mal. Tu sais très bien que cette robe\r\nflottante ne nous appartient pas, en réalité.\n@c0@"
  it: "@aNera@bChe bugiardo che sei!\nSai meglio di me che quella veste d'acqua non è nostra!\n@c0@"
  ja: "@a@bフローラ「あなた　いいかげんなこと\n\t言っては　いけませんわよ。\n\t私たちのはごろもでは　ありませんわ。\n@c0@"
