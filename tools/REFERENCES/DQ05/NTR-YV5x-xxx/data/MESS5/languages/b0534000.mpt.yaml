64:
  de: "@a%0%a001240@bWas meint sie damit? Etwa, dass man das Leben in vollen Zügen genießen sollte?\n@c0@"
  en: "@a%0%a001240@bI don't really get it, but is she basically saying just to live life to the full with no regrets?\n@c0@"
  es: "@a%0%a001240@bNo lo entiendo bien, pero dice más o menos que vivamos la vida plenamente, ¿no?\n@c0@"
  fr: "@a%0%a001240@bJe n'ai pas tout compris, mais en gros,\nelle dit qu'il faut vivre à fond et ne pas\navoir de regrets, c'est çaⓡ\n@c0@"
  it: "@a%0%a001240@bHa detto che bisogna godersi la vita, vero?\nSono d'accordo con lei, però voglio prima portare a termine la mia missione!\n@c0@"
  ja: "@a@b%a001240「よくわからないけど\n\tようするに　こうかいしないように\n\tやれるだけ　やれって　ことだよね。\n@c0@"
65:
  de: "@a%0%a001250@bDie alte Dame ist wirklich nett, das sieht man sofort.\n@c0@"
  en: "@a%0%a001250@bThat old woman's really nice. You can tell as soon as you set eyes on her.\n@c0@"
  es: "@a%0%a001250@bEsa anciana es muy amable. Eso se nota nada más verla.\n@c0@"
  fr: "@a%0%a001250@bElle est vraiment gentille, cette vieille dame.\nÇa se voit au premier coup d'œil.\n@c0@"
  it: "@a%0%a001250@bMi piace il modo di pensare di quella signora, ma non dovremmo dimenticare che la vita è fatta anche di doveri, non solo di piaceri.\n@c0@"
  ja: "@a@b%a001250「あの　おばあさん\n\tやさしい人だね。\n\tそんな感じがする……。\n@c0@"
66:
  de: "@aSancho@bMeine Leben hat einen Sinn, weil iss auf Señora Magda, Señor Ludwig, Señorita %a001230 und natürliss auf diss aufpasse, Chico!\n@c0@"
  en: "@aSancho@bMy life, eet has the meaning because I am looking for señora Mada, señor Pankraz, señora %a001230 and you, friend.\n@c0@"
  es: "@aSancho@bMi vida tiene sentido por encontrar a la señora Perséfone, al señor Teudis, a la señorita %a001230 y a ti, chamaco.\n@c0@"
  fr: "@aSancho@bMoi, ma vie a du sens parce que je la passe à rechercher la señora Magdalena, le señor Petros,\nla señorita %a001230 et toi, chico.\n@c0@"
  it: "@aSancho@b¡Por todas las paellas! Yo no soy d'accordos con quella donna: la vida no es un turtelen...\r\n¡La vida es un pentolon de paella!\n@c0@"
  ja: "@a@bサンチョ「私の人生は　マーサさま\n\tパパスさま　坊っちゃん　%a001230さま\n\tと　さがし続ける人生ですよ……。\n@c0@"
67:
  de: "@a%0%a001240@bJuchhu! Ich hatte immer gehofft, eines Tages den Sonderpreis einheimsen zu können.\n@c0@"
  en: "@a%0%a001240@bYay! I always hoped I'd be able to get the special prize one day.\n@c0@"
  es: "@a%0%a001240@b¡Bien! Sabía que algún día conseguiría el regalo especial.\n@c0@"
  fr: "@a%0%a001240@bYoupiⓠ J'avais toujours espéré pouvoir avoir leur cadeau spécial un jour.\n@c0@"
  it: "@a%0%a001240@bEvviva!\nAbbiamo avuto il premio!\nAbbiamo avuto il premio!\n@c0@"
  ja: "@a@b%a001240「やったあ！\n\tボク　これもらうの\n\tずっと　夢だったんだ！\n@c0@"
68:
  de: "@a%0%a001240@bIch dachte mir, wenn ich Mama oder Papa finde, sind wir ja zu viert!\n@c0@"
  en: "@a%0%a001240@bI always thought to myself how I just needed to find Mum or Dad and then there'd be four of us!\n@c0@"
  es: "@a%0%a001240@b¡Siempre pensaba que bastaría con encontrar a mamá o a papá y entonces ya seríamos cuatro!\n@c0@"
  fr: "@a%0%a001240@bJe me disais toujours qu'il fallait juste que je retrouve papa et maman et que, comme ça,\non serait quatreⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto è l'unico motivo per cui volevo trovare te o la mamma: formare un gruppo di quattro persone e usufruire della promozione! Eh eh eh eh eh! Scherzo!\n@c0@"
  ja: "@a@b%a001240「あと　お父さんか\n\tお母さんがいれば　４人なのにって\n\tずっと　思ってた……。\n@c0@"
69:
  de: "@a%0%a001250@bWir können das Angebot nur nutzen, weil wir dich gefunden haben, Papa! Es ist wie eine Belohnung für %a001240 und mich!\n@c0@"
  en: "@a%0%a001250@bWe only qualify because we found you, Dad! It'll be like a prize to %a001240 and I for all our hard work!\n@c0@"
  es: "@a%0%a001250@b¡Solo podemos lograrlo porque te hemos encontrado, papi! ¡Para %a001240 y para mí es como un premio por todo lo que hemos trabajado!\n@c0@"
  fr: "@a%0%a001250@bC'est parce qu'on t'a enfin retrouvé qu'on a pu l'avoir, papaⓠ C'est un peu comme la récompense de tous nos efforts, à %a001240 et moiⓠ\n@c0@"
  it: "@a%0%a001250@bChe bello averti ritrovato, papà!\nNon solo siamo tornati insieme, ma abbiamo anche potuto sfruttare questa promozione! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「これが　もらえたのって\n\tお父さんが帰ってきてくれたからよね。\n\t%a001240と　がんばったショウコよね。\n@c0@"
70:
  de: "@aSancho@bEs ist so traurig für %a001240 und %a001250. Jedes Mal, wenn sie von diese Angebot hören, sehe iss, wie ihre kleinen Herzen brechen.\n@c0@"
  en: "@aSancho@bEes eso esad for %a001240 and %a001250. Every time when they hear about thees offer, I esee their leettle hearts breaking.\n@c0@"
  es: "@aSancho@bQué tristeza para %a001240 y %a001250... Siempre que oían lo de la oferta, se les rompía el corazón.\n@c0@"
  fr: "@aSancho@bC'est tellement t-t-triste pour %a001240 et %a001250. Chaque fois qu'ils entendent parler de cette offre, je vois leur p-p-petit cœur se briser.\n@c0@"
  it: "@aSancho@bCada vez que %a001240 y %a001250 sentivano hablar de esta promoziones diventavano muy tristes...\n@c0@"
  ja: "@a@bサンチョ「ここのキャンペーンのことを\n\t聞くたび　%a001240さまも\n\t%a001250さまも　うつむかれて……。\n@c0@"
71:
  de: "@aSancho@bSie sagen nissts, aber iss weiß, dass es für sie sehr schwer war ohne ihre Madre.\n@c0@"
  en: "@aSancho@bThey no esay eet, but I know ees been eso hard for them weethout their mother.\n@c0@"
  es: "@aSancho@bAunque pues no decían nada, yo sé que fue difícil para ellos estar sin su amá.\n@c0@"
  fr: "@aSancho@bIls ne le d-d-disent pas, mais je sais que c'est très dur pour eux sans leur madre.\n@c0@"
  it: "@aSancho@bDicevano que no podevano esfruttarla por qué la mamma y el papà no erano con loro...\n@c0@"
  ja: "@a@bサンチョ「クチには　出されませんでしたが\n\tご両親のいない　さみしさを\n\tこらえて　いらっしゃったんでしょう。\n@c0@"
72:
  de: "@a%0%a001240@bLass uns hier bleiben, Papa! Ich wollte immer schon zu viert herkommen, um diesen Sonderpreis zu ergattern!\n@c0@"
  en: "@a%0%a001240@bLet's stay here, Dad! I always wanted to have a group of four so we could get the special prize.\n@c0@"
  es: "@a%0%a001240@b¡Quedémonos, papi! Siempre he querido estar en un grupo de cuatro para conseguir el regalo especial.\n@c0@"
  fr: "@a%0%a001240@bAllez, papa, on resteⓠ J'ai toujours voulu être un groupe de quatre pour pouvoir gagner leur\ncadeau spécial.\n@c0@"
  it: "@a%0%a001240@bPapà, perché non pernottiamo qui? C'è un premio speciale per le comitive composte da quattro o più persone che trascorrono la notte in questa locanda!\n@c0@"
  ja: "@a@b%a001240「お父さん　４人で　泊まろうよ。\n\tボク　みんなで　泊まるの\n\t夢だったんだ。\n@c0@"
73:
  de: "@a%0%a001250@bDer Orden vom Zugzwang... Das hört sich ja gruselig an! Der Name gefällt mir gar nicht!\n@c0@"
  en: "@a%0%a001250@bThe Order of Zugzwang... It's such a scary name!\nI don't like the sound of it one bit.\n@c0@"
  es: "@a%0%a001250@bLa Orden de Zugzwang... ¡Qué miedo da ese nombre!\nNo me gusta cómo suena, nada de nada.\n@c0@"
  fr: "@a%0%a001250@bL'Ordre du Zugzwang... C'est un nom qui fait peurⓠ\nJe n'aime pas ça du tout.\n@c0@"
  it: "@a%0%a001250@bLa Setta di Zugzwang...\nChe brutto nome! Solo a sentirlo mi tremano le gambe...\n@c0@"
  ja: "@a@b%a001250「光の教団……\n\tいやっ　こわい名前！\n\tすごく　いやな感じがする……。\n@c0@"
74:
  de: "@aOtto@bEine richtige Schönheit? Tja, mir würde es nichts ausmachen, sie mal kennenzulernen...\n@c0@"
  en: "@aTuppence@bA real beauty? Well, I wouldn't mind running into her!\n@c0@"
  es: "@aAlazar@b¿Una preciosidad? ¡Vaya, no me importaría cruzarme con ella!\n@c0@"
  fr: "@aInnocent@bUne vraie beautéⓡ Eh bien, ça ne me dérangerait pas de faire sa connaissanceⓠ\n@c0@"
  it: "@aSimon@bLa Gran Sacerdotessa della Setta di Zugzwang è una donna incredibilmente bella?! Voglio entrare a far parte di quel gruppo! Ora! Subito! Di corsa!\n@c0@"
  ja: "@a@bピピン「ものすごい美人！？\n\tああっ　それは\n\tぜひとも　見てみたいっ！\n@c0@"
75:
  de: "@aSancho@bBevor sie nisst Señorita Bianca oder Señora Magda gesehen haben, wissen sie gar nisst, was eine risstige Schönheit ist, eh, Chico?\n@c0@"
