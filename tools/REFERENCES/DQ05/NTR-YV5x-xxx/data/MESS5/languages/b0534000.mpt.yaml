276:
  de: "@aGriselda@bIch bin vollkommen ausgetrocknet! Besorg mir sofort was zu trinken, %a000090!\n㈡\nJa, du, %a000090, und komm bloß nicht auf die Idee, eins der Kinder loszuschicken!\n@c0@"
  en: "@aDebora@bI'm absolutely parched! Get me some water, %a000090. And I mean you, so don't go asking the kids to do it for you.\n@c0@"
  es: "@aStefania@b¡Estoy sedienta! Tráeme acqua, %a000090. Y te lo digo a tiⓓ no pidas a los bambini que lo hagan, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe meurs de soifⓠ Va me chercher de l'eau, %a000090. Et c'est à toi que je demande, alors n'envoie pas les enfants s'en charger à ta place.\n@c0@"
  it: "@aViola@bHo sete, %a000090. Vammi a prendere un bel bicchiere d'acqua fresca, e mettici anche un bel cucchiaio di zucchero e una scorzetta di limone...\n@c0@"
  ja: "@a@bデボラ「のどが　カラカラよ……。\n\t%a000090　水をくんできて。\n\t子どもに行かせないで　自分でね。\n@c0@"
277:
  de: "@aGriselda@bKomisch, bei einem Brunnen in der Wüste würde man doch eigentlich erwarten, dass er voll mit heißem Wasser wäre. Zum Glück ist er das nicht...\n@c0@"
  en: "@aDebora@bIt's funny, you might expect a well in a desert to be full of hot water, but it's not!\n@c0@"
  es: "@aStefania@bEs curioso, lo normal sería que un pozo en el desierto estuviese lleno de acqua calda, ¡pero no es así!\n@c0@"
  fr: "@aPandora@bC'est amusant. On pourrait s'attendre à ce qu'un puits dans le désert soit rempli d'eau chaude,\nmais nonⓠ\n@c0@"
  it: "@aViola@bMa tu guarda! Credevo che l'acqua di questo pozzo fosse calda, e invece è bella fresca...\nQuesta sì che è una piacevole sorpresa!\n@c0@"
  ja: "@a@bデボラ「砂漠にある井戸だからって\n\tお湯が　わいているわけじゃないのね。\n@c0@"
278:
  de: "@aGriselda@bZuerst ist es heiß, dann ist es wieder kalt... Oh ja, es ist immer wieder ein Vergnügen, durch die Wüste zu wandern.\n@c0@"
  en: "@aDebora@bOne minute it's hot, the next minute it's cold...\nOh yes, it's always a pleasure to be in the desert.\n@c0@"
  es: "@aStefania@bPrimero hace fredo, luego hace calore...\nSiempre es un placer estar en el desierto.\n@c0@"
  fr: "@aPandora@bÀ un moment il fait chaud, la seconde d'après il fait froid... Oui, vraiment, c'est toujours un plaisir d'être dans le désert.\n@c0@"
  it: "@aViola@bCaldo, poi freddo, poi ancora, caldo, poi sempre più freddo... Oh, ma quanto mi sto divertento in questo dannatissimo deserto!\n@c0@"
  ja: "@a@bデボラ「暑くなったり　寒くなったり……\n\t砂漠って　あいかわらず　きびしい所ね。\n@c0@"
279:
  de: "@aGriselda@bMir ist kalt. Wärme mich ein bisschen, ja, %a000090? Aber nimm mir bloß nichts von meiner Körperwärme weg, sonst hast du ein Problem.\n@c0@"
  en: "@aDebora@bI'm freezing. Warm me up, will you, %a000090? Just don't go stealing any of my body heat, though, otherwise you'll be in trouble.\n@c0@"
  es: "@aStefania@bMe estoy helando. ¡Venga, %a000090, dame calorcito! Pero no te lleves mi propio calore corporale o te arrepentirás, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe suis gelée. Réchauffe-moi tu veux, %a000090ⓡ Mais ne t'avise pas de me voler de ma chaleur, ou c'est pour toi que ça va chauffer.\n@c0@"
  it: "@aViola@bBrrrrr! Sto gelando, %a000090...\nAbbracciami, così potrò prendere un po' del tuo calore corporeo...\n@c0@"
  ja: "@a@bデボラ「寒いわ……。\n\tねえ　%a000090　あたためてよ。\n\t私の体温を　うばったら　怒るわよ。\n@c0@"
280:
  de: "@aGriselda@bKomm auch her, %a001240. Und du, %a001250. Wir können uns alle gegenseitig wärmen.\n@c0@"
  en: "@aDebora@bYou come over here too, %a001240. And you, %a001250. We'll be able to keep warm if we all stick together.\n@c0@"
  es: "@aStefania@bVen aquí también, %a001240. Y tú, %a001250. Si nos ponemos tutti juntos conservaremos el calor.\n@c0@"
  fr: "@aPandora@bToi aussi, viens là %a001240. Et toi, %a001250. Si nous restons tous ensemble, nous nous tiendrons chaud.\n@c0@"
  it: "@aViola@bVenite anche voi, %a001240 e %a001250.\nSe staremo tutti insieme, sentiremo meno freddo...\n@c0@"
  ja: "@a@bデボラ「%a001240　%a001250。\n\tあなたたちも　こっちへいらっしゃい。\n\tみんなでいれば　寒くないから。\n@c0@"
281:
  de: "@a%0%a001240 und %0%a001250@bOh, wie gemütlich! Ja, es wird gleich viel wärmer.\n@c0@"
  en: "@a%0%a001240 & %0%a001250@bCosy!\nYes, it's much warmer like this.\n@c0@"
  es: "@a%0%a001240 y %a001250@b¡Qué cómodo!\nSe está mucho mejor así.\n@c0@"
  fr: "@a%0%a001240 et %0%a001250@bOn est bienⓠ\nOui, il fait plus chaud comme ça.\n@c0@"
  it: "@a%0%a001240 e %a001250@bOh, sì!\nChe bel calduccio!\nCosì si sta molto meglio!\n@c0@"
  ja: "@a@b%a001240「やった～っ。\n%a001250「はい　とっても　あったかいです。\n@c0@"
282:
  de: "@aGriselda@bEs ist eigentlich ganz gemütlich hier. Aber wir können trotzdem nicht bleiben. Besorge uns bitte schnell eine Herberge.\n@c0@"
  en: "@aDebora@bIt's quite comfortable here, I suppose. We can't stay here, though, so you'd better hurry up and find us an inn for the night.\n@c0@"
  es: "@aStefania@bSe está muy cómodo, sí. Ma no podemos quedarnos aquí, así que date prisa en encontrar una posada para pasar la notte.\n@c0@"
  fr: "@aPandora@bC'est assez confortable, ici. Mais on ne peut pas y dormir, alors tu as intérêt à te dépêcher de nous trouver une auberge pour la nuit.\n@c0@"
  it: "@aViola@bQuesto posto non è niente male, ma dubito che possiamo restare a dormire qui.\nAvanti, sbrigati a trovare una sistemazione per la notte...\n@c0@"
  ja: "@a@bデボラ「少しだけ　マシになったわね。\n\tでも　ここで休むわけにはいかないから\n\t急いで　今日の宿を　探してよ。\n@c0@"
283:
  de: "@aGriselda@bAua! Was glotzt du denn so blöd?\nSteh nicht untätig rum und hilf mir gefälligst!\n@c0@"
  en: "@aDebora@bOuch! What are you looking at?\nDon't just stand there! Give me a hand!\n@c0@"
  es: "@aStefania@b¡Aaay! ¿Ma qué miras?\n¡No te quedes ahí! ¡Échame una mano!\n@c0@"
  fr: "@aPandora@bAïeⓠ Qu'est-ce que tu regardesⓡ Ne reste pas làⓠ Donne-moi un coup de mainⓠ\n@c0@"
  it: "@aViola@bSenti, caro, invece di star lì impalato a guardarmi, perché non mi dai una mano?!\nGrazie.\n@c0@"
  ja: "@a@bデボラ「いたたた……。\n\tなにを　見ているのよ！\n\tボーッとしてないで　手を貸しなさいよ。\n@c0@"
284:
  de: "@aGriselda@bWir werden... bald... in Nadiria... sein. Hah... Ich bin... vollkommen... erschöpft.\n@c0@"
  en: "@aDebora@bWe'll be...in Nad...iria before...long.\nHaah... I'm ab...solutely...ex...hausted.\n@c0@"
  es: "@aStefania@bLlegaremos... pronto... a Nadiria.\nAhhh... Sonno... completamente... stanca.\n@c0@"
  fr: "@aPandora@bNous serons à... Nadi... ria... bientôt.\r\nHaan... Je suis to... talement... épuisée.\n@c0@"
  it: "@aViola@bHaaahhh... Sono stanca mortaaahhh...\nSpero che presto arriveremo a Nadiriaaah...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bデボラ「そろそろ…　魔界に行くわ…よ。\n\tいいかげ…ん…に　つかれ…て…きたわ。\n@c0@"
285:
  de: "@aGriselda@bIst es nicht unglaublich, dass Papa einen Boten hierher geschickt hat? Er liebt sein kleines Mädchen wirklich über alles!\n@c0@"
  en: "@aDebora@bCan you believe Papa, sending a messenger all this way? He really is besotted with his little girl.\n@c0@"
  es: "@aStefania@bNo puedo creer que il mio papino haya enviado un mensajero hasta aquí... Está realmente loco per la sua bambina.\n@c0@"
  fr: "@aPandora@bTu arrives à le croireⓢ papa qui nous envoit un messager jusqu'iciⓡ Il est vraiment fou de sa fille adorée.\n@c0@"
  it: "@aViola@bIl mio paparino deve volermi proprio una montagna di bene, per aver mandato un suo dipendente fin qua!\nE forse vuole un po' di bene anche a te, caro...\n@c0@"
  ja: "@a@bデボラ「もうっ　パパったら…\n\tこんな所にまで　使者をよこすなんて。\n\t私が　かわいくてしかたないんだわ。\n@c0@"
286:
  de: "@aGriselda@bDas teile ich mir mit %a001250. Das macht dir doch nichts aus, oder?\n㈡\nImmerhin ist es ein Geschenk von Papa. Und dir würde es sowieso nicht stehen!\n@c0@"
  en: "@aDebora@bThis is for %a001250 and I to share. You don't mind, do you? It's a present from Papa, after all.\nAnd I don't think it would suit you!\n@c0@"
  es: "@aStefania@bEsto es para %a001250 y para mí. Es un regalo del mio papino.\n¡Y no creo que te siente bien!\n@c0@"
  fr: "@aPandora@bC'est pour %a001250 et moi, nous la partagerons. Ça ne t'ennuie pasⓡ Après tout, c'est un cadeau de papa. Et je ne crois pas que ça t'iraitⓠ\n@c0@"
  it: "@aViola@bIo e %a001250 useremo il regalo che ci ha mandato il mio paparino.\nNon è roba per te, mi sono spiegata?!\n@c0@"
  ja: "@a@bデボラ「これは　私と%a001250のモノね。\n\t文句はないわよね？\n\tパパからの　プレゼントだし。\n@c0@"
287:
  de: "@aNera@bÄhm, Liebling, ich möchte mich ja nicht einmischen, aber dieser Bergpfad führt uns ganz gewiss nicht nach Nadiria.\n㈡\nWir sollten uns wirklich langsam auf den Weg machen.\n@c0@"
  en: "@aNera@bUm, darling, sorry to interfere, but this mountain path won't lead us to Nadiria. I really think we need to be on our way.\n@c0@"
  es: "@aNera@bNo quiero entrometerme, caro mio, pero este camino de montaña no nos lleva a Nadiria. Credo que tenemos que darnos un poco de prisa.\n@c0@"
  fr: "@aNera@bHum, désolée de me mêler de ça, mais ce chemin de montagne ne nous conduira pas à Nadiria. Je pense vraiment que nous devrions repartir.\n@c0@"
  it: "@aNera@bTesoro, dubito che questo sentiero di montagna conduca a Nadiria. Non credi che dovremmo dirigerci verso la nostra destinazione?\n@c0@"
  ja: "@a@bフローラ「あの…　あなた。\n\tこの山道から　魔界へ行けるわけでは\n\tありませんし…　今は　先を急がないと。\n@c0@"
288:
  de: "@aGriselda@bIch gerate schon außer Atem, wenn ich diesen Pfad nur sehe. Was machen wir eigentlich hier?\n@c0@"
  en: "@aDebora@bI always feel exhausted just looking at this path. What are we doing here, anyway?\n@c0@"
  es: "@aStefania@bSolo con mirar este camino me siento stanca. ¿Se puede saber qué hacemos aquí?\n@c0@"
  fr: "@aPandora@bJe me sens déjà épuisée rien qu'en regardant ce chemin. Qu'est-ce qu'on fait là, d'ailleursⓡ\n@c0@"
  it: "@aViola@bMi basta guardare questo sentiero per sentirmi completamente senza forze...\nMa poi, mi spieghi che siamo venuti a fare qui?!\n@c0@"
  ja: "@a@bデボラ「あいかわらず\n\t見ているだけで　つかれる山道ね。\n\tで　ここに　何の用があるわけ？\n@c0@"
289:
  de: "@aGriselda@bHier gibt's nichts für uns zu schaffen. Los, verschwinden wir.\n@c0@"
  en: "@aDebora@bThere's nothing for us in this nasty place.\nHurry up and get moving!\n@c0@"
  es: "@aStefania@bEn este sitio horribile no hay nada para nosotros.\n¡Andiamo, en marcha ya!\n@c0@"
  fr: "@aPandora@bIl n'y a rien pour nous dans cet horrible endroit. Dépêchons-nous de partirⓠ\n@c0@"
  it: "@aViola@bCredo che qui non ci sia nulla d'interessante.\nMeglio così, almeno potremo andarcene subito...\n@c0@"
  ja: "@a@bデボラ「こんな　うす気味悪い所に\n\t用はないでしょう？\n\tほら　もう　外へ出るわよ！\n@c0@"
290:
  de: "@aGriselda@bWolltest du aus einem bestimmten Grund mit der alten Frau reden, %a000090? Du suchst doch hoffentlich keinen Mutterersatz...\n@c0@"
  en: "@aDebora@bDid you want to talk to that old woman for some reason, %a000090? You're not looking for a mother substitute, I hope!\n@c0@"
  es: "@aStefania@b¿Por qué querías hablar con esa vecchia signora, %a000090? ¡Espero que no estés buscando una sustituta para la tua mamma!\n@c0@"
  fr: "@aPandora@bTu voulais parler à cette vieille femme pour une raison particulière, %a000090ⓡ Tu ne cherches pas une mère de substitution, j'espèreⓠ\n@c0@"
  it: "@aViola@bPerché ti sei messo a parlare con quella donna, %a000090?\nTi ricordava qualche tua vecchia zia?!\n@c0@"
  ja: "@a@bデボラ「あの　おばあさんと\n\t話がしたかったの？\n\t%a000090って　もしかしてマザコン？\n@c0@"
291:
  de: "@aGriselda@bMir reicht's. Ich hab die Nase voll.\nWir gehen. Sofort.\n@c0@"
  en: "@aDebora@bI've had enough, I really have.\nWe're leaving. Now.\n@c0@"
  es: "@aStefania@bVeramente estoy más que harta, ¿capisci?\nNos vamos. Ahora.\n@c0@"
  fr: "@aPandora@bJ'en ai assez, vraiment. On s'en va. Tout de suite.\n@c0@"
  it: "@aViola@bNe ho abbastanza di questo posto.\nAndiamocene subito.\nSono stata sufficientemente chiara?\n@c0@"
  ja: "@a@bデボラ「もう　イヤ。\n\tもう　たくさん。\n\tさっさと　行くわよ。\n@c0@"
292:
  de: "@aGriselda@bSo schaurig könnte ich nicht mal lachen, wenn ich es wollte.\n@c0@"
  en: "@aDebora@bI couldn't laugh in such a creepy way if I tried.\n@c0@"
  es: "@aStefania@bVeramente, soy incapaz de reír de esa forma tan terrorífica.\n@c0@"
  fr: "@aPandora@bMême si je le voulais, je n'arriverais pas à avoir un rire aussi effrayant.\n@c0@"
  it: "@aViola@bCon una risata come la sua, c'è da augurarsi che quella donna sia sempre triste!\n@c0@"
  ja: "@a@bデボラ「私には　あんな　はしたない\n\t笑い方は　できないわ。\n@c0@"
293:
  de: "@aGriselda@bVielleicht liege ich ja falsch, %a000090, aber ich werde das Gefühl nicht los, dass du mir diese ganzen Strapazen absichtlich zumutest.\n@c0@"
  en: "@aDebora@bI hope I'm wrong about this, %a000090, but I can't help feeling like you're trying to wear me out on purpose.\n@c0@"
  es: "@aStefania@bEspero estar equivocada, %a000090, ma me da la sensación de que me estás cansando a posta... Más te vale que no sea así, ¿capisci?\n@c0@"
  fr: "@aPandora@bJ'espère me tromper, %a000090, mais je ne peux pas m'empêcher de penser que tu essaies de m'épuiser exprès.\n@c0@"
  it: "@aViola@bSpero tanto di sbagliarmi, %a000090, ma ho la vaga sensazione che tu non abbia la minima idea di cosa fare...\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090。\n\tまさかとは思うけど\n\t私をつかれさせて　楽しんでいるの？\n@c0@"
294:
  de: "@aGriselda@bAls wir das letzte Mal hier waren, trug ich %a001240 und %a001250 unter dem Herzen.\n@c0@"
  en: "@aDebora@bThe last time we came by here, I was carrying %a001240 and %a001250.\n@c0@"
  es: "@aStefania@bLa última volta que pasamos por aquí aún estaba embarazada de %a001240 y %a001250.\n@c0@"
  fr: "@aPandora@bLa dernière fois que nous sommes venus ici, j'attendais %a001240 et %a001250.\n@c0@"
  it: "@aViola@bRicordo quando ero incinta di %a001240 e %a001250 e venimmo in questo posto...\n@c0@"
  ja: "@a@bデボラ「前に　ここを通った時には\n\t%a001240と　%a001250が\n\tおなかの中に　いたのよね。\n@c0@"
295:
  de: "@aGriselda@bWelch ein Glück, dass mir bei dieser ganzen Kletterei nichts zugestoßen ist.\n@c0@"
  en: "@aDebora@bIt's lucky that I didn't fall or anything when I was climbing up and down these mountains.\n@c0@"
  es: "@aStefania@bTuve buona fortuna de no caerme mientras subíamos y bajábamos por estas montañas.\n@c0@"
  fr: "@aPandora@bC'est une chance que je ne sois pas tombée pendant que je passais mon temps à monter et descendre ces montagnes.\n@c0@"
  it: "@aViola@bPer fortuna non caddi mentre scendevamo e salivamo queste montagne... Se fosse capitata una cosa del genere... Ah, non voglio nemmeno pensarci!\n@c0@"
  ja: "@a@bデボラ「山道で　ころんだりしなくて\n\t本当に　良かったわ。\n@c0@"
296:
  de: "@aNera@bDiese Höhle weckt alte Erinnerungen. Als wir das erste Mal hier durchkamen, war ich überglücklich, mit dir zusammen auf Reisen zu sein.\n@c0@"
  en: "@aNera@bBeing back in this cave really takes me back.\r\nThe first time we passed through here, I was so excited that we were travelling around together.\n@c0@"
  es: "@aNera@bVolver a esta caverna me hace ricordare...\nLa prima volta que pasamos por aquí estaba tan emocionada de viajar contigo...\n@c0@"
  fr: "@aNera@bRevenir dans cette grotte me rappelle des souvenirs. La première fois que nous sommes passés par ici, j'étais folle de joie que nous voyagions ensemble.\n@c0@"
  it: "@aNera@bQuesta grotta mi ricorda quando iniziammo a viaggiare insieme, tanti anni fa...\nEro così emozionata...\n@c0@"
  ja: "@a@bフローラ「この洞くつ…　なつかしいですわね。\n\t昔は　あなたについていくのだけで\n\tせいいっぱい　でしたわ。\n@c0@"
297:
  de: "@aNera@bLiebling, ich weiß, dieser Ort weckt nostalgische Gefühle, aber wir sollten uns wirklich beeilen.\n@c0@"
  en: "@aNera@bDarling, I feel just as sentimental about this place as you do. It's time we made haste now, though.\n@c0@"
  es: "@aNera@bCaro mio, este sitio me pone tan sentimental como a ti, ma debemos darnos prisa.\n@c0@"
  fr: "@aNera@bMon chéri, je me sens aussi sentimentale que toi\r\nvis-à-vis de cet endroit. Mais nous devons néanmoins nous dépêcher, cette fois.\n@c0@"
  it: "@aNera@bTesoro, so che anche a te questo posto suscita bei ricordi, ma non abbiamo tempo da perdere ora...\nDobbiamo andare...\n@c0@"
  ja: "@a@bフローラ「あなた。　昔をなつかしく思うのは\n\t私も　いっしょですけれど　そろそろ\n\t先を急いだほうが　いいですわ。\n@c0@"
298:
  de: "@aGriselda@bWas machen wir hier? Wir haben doch nichts hier zu schaffen, oder? Dann nichts wie ab nach Nadiria!\n@c0@"
  en: "@aDebora@bWhat are we doing here? We don't need to be here, right? So let's hurry up and head to Nadiria.\n@c0@"
  es: "@aStefania@b¿Qué estamos haciendo aquí? No tendríamos que estar aquí, ¿no? Venga, andiamo presto hacia Nadiria.\n@c0@"
  fr: "@aPandora@bQu'est-ce qu'on fait làⓡ On n'a rien à y faire, nonⓡ Alors dépêchons-nous de filer vers Nadiria.\n@c0@"
  it: "@aViola@bPerché siamo qui?!\nNon dovremmo andare a Nadiria?!\n@c0@"
  ja: "@a@bデボラ「この洞くつに　何か用があるの？\n\tないわよね？　だったら早く\n\t魔界へ行くわよ。\n@c0@"
299:
  de: "@aGriselda@bIch weiß, Nadiria wird kein Zuckerschlecken, aber diese Höhle ist eine Zumutung! Ich gehe!\n@c0@"
  en: "@aDebora@bI know Nadiria isn't going to be a bundle of laughs, but I'd rather be there than stuck in this cave.\r\nI'm going!\n@c0@"
  es: "@aStefania@bYa sé que Nadiria no va a ser muy divertente que digamos, pero prefiero estar allí que incastrata en esta cueva.\n㈡\n¡Me largo!\n@c0@"
  fr: "@aPandora@bJe sais que ça ne va pas être une franche rigolade, à Nadiria, mais je préfère encore être là-bas plutôt que coincée dans cette grotte. Je m'en vaisⓠ\n@c0@"
  it: "@aViola@bSo che a Nadiria ci aspettano pericoli di ogni genere, ma preferisco andare lì che restare in questa caverna. Forza, andiamo.\n@c0@"
  ja: "@a@bデボラ「魔界も　楽しい場所じゃないけど\n\t洞くつにいるは　もっとイヤなのよ。\n\t私は　早く外に出たいの。\n@c0@"
300:
  de: "@aGriselda@bMir ist nicht aufgefallen, dass du etwas fallen gelassen hast. Aber du bist ja immer so tollpatschig!\n@c0@"
  en: "@aDebora@bI didn't notice you dropping anything.\nYou're always so clumsy!\n@c0@"
  es: "@aStefania@bNo me he dado cuenta de que perdieses nada.\n¡Ma qué torpe eres!\n@c0@"
  fr: "@aPandora@bJe n'avais même pas vu que tu avais laissé tomber des choses. Tu es toujours si maladroitⓠ\n@c0@"
  it: "@aViola@bCos'è che hai fatto cadere stavolta, eh?\nNon mi sono accorta di nulla!\n@c0@"
  ja: "@a@bデボラ「あら？　あんた　いつのまに\n\t落とし物なんて　したのよ？\n\tあいかわらず　ドジね。\n@c0@"
301:
  de: "@aGriselda@bIch weiß, ich sollte nicht an dir zweifeln, aber ich hoffe doch sehr, dass du eben nicht gelogen hast.\n@c0@"
  en: "@aDebora@bI know I shouldn't doubt you, but I do hope you weren't lying just then.\n@c0@"
  es: "@aStefania@bVeramente no debería dudar de ti, ma espero que no estuvieses mintiendo...\n@c0@"
  fr: "@aPandora@bJe sais que je ne devrais pas douter de toi, mais j'espère que tu n'étais pas en train de mentir, à l'instant.\n@c0@"
  it: "@aViola@bCaro, so che sei una gran brava persona, ma...\nNon è che stavolta hai mentito, eh?!\n@c0@"
  ja: "@a@bデボラ「まさかとは思うけど\n\tあんた　ウソをついていたりは\n\tしてないでしょうね……？\n@c0@"
302:
  de: "@aGriselda@bIch wusste, dass du ehrlich bist. Du hast ja auch zu deinen Gefühlen gestanden und mich geheiratet. Ob er den ganzen Kram wirklich gefunden hat?\n@c0@"
  en: "@aDebora@bI knew you were honest. You were true to your feelings and chose to marry me, after all.\r\nDo you think he really did find all those things?\n@c0@"
  es: "@aStefania@bSabía que eras honrado. Al fin y al cabo, confiaste en tus sentimientos y te casaste con me.\n㈡\n¿Ma será vero que ese uomo se ha encontrado todas esas cosas?\n@c0@"
  fr: "@aPandora@bJe savais que tu étais honnête. Tu l'as été dans tes sentiments et tu as choisi de m'épouser, après tout. Tu crois vraiment qu'il a trouvé toutes ces chosesⓡ\n@c0@"
  it: "@aViola@bSo che sei buono e onesto, caro.\nMagari a volte un po' fessacchiotto, ma sei una brava persona.\n@c0@"
  ja: "@a@bデボラ「私を　選んだだけあって\n\tやっぱり　あんたは　正直者ね。\n\tでも　本当に　落とし物だったのかしら？\n@c0@"
303:
  de: "@aGriselda@bHier hat sich in all den Jahren nichts verändert. Genau wie meine Schönheit. Ich bin immer noch so schön wie früher!\n@c0@"
  en: "@aDebora@bThis place is just the same as it was all those years ago. Much like my beauty. It hasn't faded one bit in all this time.\n@c0@"
  es: "@aStefania@bEste sitio no ha cambiado niente en todos estos años. Como la mia bellezza. No ha perdido intensidad en tutto este tiempo.\n@c0@"
  fr: "@aPandora@bCet endroit est le même qu'il y a toutes ces années. Comme ma beauté. Elle ne s'est pas fanée une seule seconde pendant tout ce temps.\n@c0@"
  it: "@aViola@bQuesto posto non è cambiato affatto in tanti anni.\nProprio come me: il tempo passa, ma la mia bellezza resta inalterata...\n@c0@"
  ja: "@a@bデボラ「ここも　昔から　変わらないわね。\n\t私の美しさも　あの頃から\n\tちっとも　そこなわれては　いないけど。\n@c0@"
304:
  de: "@aGriselda@bKönntest du mich vielleicht vorwarnen, wenn du in ein Loch springst? Ich würde vorher gerne meine Schuhe ausziehen, sonst breche ich mir noch den Absatz ab...\n@c0@"
  en: "@aDebora@bYou couldn't give a shout or something to warn me when you're about to jump down a hole, could you?\r\nI need to take my shoes off or I might break a heel.\n@c0@"
  es: "@aStefania@bPodrías dar un grito o algo para avisarme de que vas a tirarte por uno de esos bucos, ¿no?\n㈡\nTengo que quitarme los zapatos si no quiero romper los tacones.\n@c0@"
  fr: "@aPandora@bTu ne pourrais pas crier ou faire quelque chose pour me prévenir quand tu sautes dans un trou, franchementⓡ\n㈡\nIl faut que je retire mes chaussures si je ne veux pas me casser un talon.\n@c0@"
  it: "@aViola@bCaro, potresti avvertirmi quando dobbiamo saltare in un buco?\n㈡\nSe mi avverti con un minimo di anticipo, posso togliere le scarpe, così non correrò il rischio di spezzare un tacco...\n@c0@"
  ja: "@a@bデボラ「落とし穴に落ちる時は　前もって\n\t声をかけてよ。　クツをぬいでおかないと\n\tヒールが　ダメになっちゃうわ。\n@c0@"
