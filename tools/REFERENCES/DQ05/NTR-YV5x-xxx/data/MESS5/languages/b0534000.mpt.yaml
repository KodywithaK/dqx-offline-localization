  it: "@aSancho@b¿Siamo seguros que quella veste es nuestra? ¿Si ce fosse caduta, ce ne saremmo accortos, no? ¡No es uno spillos minuscolos, ma un abito muy grande!\n@c0@"
  ja: "@a@bサンチョ「水のはごろもを　落としたら\n\tわかりそうなもんですが……。\n\t本当に　私たちの落とし物ですか？\n@c0@"
224:
  de: "@aBianca@bUi! Sieh dir nur all die Sachen an, die wir gekriegt haben! Ehrlichkeit währt eben doch am längsten!\n@c0@"
  en: "@aBianca@bWow! Look at all these things we've got! Just goes to show honesty's the best policy!\n@c0@"
  es: "@aBianca@b¡Vaya! ¡Mira todo lo que tenemos! ¡Parece que ser honrado compensa!\n@c0@"
  fr: "@aBianca@bWaouhⓠ Regarde tout ce que nous avons reçuⓠ\nÇa prouve bien que l'honnêteté est toujours récompenséeⓠ\n@c0@"
  it: "@aBianca@bSanto cielo, quanta roba!\nLo vedi?\nL'onestà paga sempre!\n@c0@"
  ja: "@a@bビアンカ「わ～　こんなに\n\tたくさん　もらっちゃったね。\n\t正直に答えて　よかった！\n@c0@"
225:
  de: "@aNera@bIch hoffe, wir tun das Richtige, wenn wir all diese Sachen von dem Alten annehmen. War das nicht großzügig von ihm?!\n@c0@"
  en: "@aNera@bI do hope it's alright for us to take all these things off that old man. Wasn't he generous!\n@c0@"
  es: "@aNera@bEspero que sea correcto que nos llevemos tutto lo que nos ha dado ese anciano. ¡Qué persona más generosa!\n@c0@"
  fr: "@aNera@bJ'espère que ça ne pose pas de problème d'accepter tout ce que ce vieil homme nous a offert.\nQuelle générositéⓠ\n@c0@"
  it: "@aNera@bAvremo fatto bene ad accettare tutte queste cose da quel povero vecchio? Forse non ne aveva bisogno, ma è stato comunque fin troppo generoso...\n@c0@"
  ja: "@a@bフローラ「こんなにたくさん\n\tいただいて　よかったのかしら。\n\tふとっぱらな方　ですこと。\n@c0@"
226:
  de: "@a%0%a001250@bWar das vielleicht eine Art Test?\n@c0@"
  en: "@a%0%a001250@bWere we being tested?\n@c0@"
  es: "@a%0%a001250@b¿Es que nos estaba poniendo a prueba?\n@c0@"
  fr: "@a%0%a001250@bEt si c'était un testⓡ\n@c0@"
  it: "@a%0%a001250@bForse quell'uomo voleva metterci alla prova, non credi?\n@c0@"
  ja: "@a@b%a001250「わたしたち　試されたの……？\n@c0@"
227:
  de: "@a%0%a001240@bWir haben also all die Sachen bekommen, weil wir die Wahrheit gesagt haben? Ah, verstehe. Lügen zahlen sich also wirklich nicht aus, was?\n@c0@"
  en: "@a%0%a001240@bSo we got all that stuff because we told the truth? I get it. That means lying doesn't pay.\n@c0@"
  es: "@a%0%a001240@b¿Así que hemos conseguido todas esas cosas por decir la verdad? Ya lo entiendo. Eso quiere decir que la mentira no compensa.\n@c0@"
  fr: "@a%0%a001240@bAlors on a eu tout ça rien que parce qu'on a dit la véritéⓡ Je comprends. Ça veut dire que le mensonge ne paie pas.\n@c0@"
  it: "@a%0%a001240@bAbbiamo ricevuto tutta questa roba solo perché abbiamo detto la verità?\nEh eh eh! L'onestà paga, eh?\n@c0@"
  ja: "@a@b%a001240「正直に答えたから　もらえたの？\n\tそっか　やっぱり　ウソって\n\tついちゃいけないんだね。\n@c0@"
228:
  de: "@aOtto@bAh, jetzt verstehe ich, was er im Sinn hatte! Gute Göttin. Ich wäre darauf hereingefallen und hätte das T&T-Ticket genommen!\n@c0@"
  en: "@aTuppence@bAh, I see what he was up to! Dear me. I would've fallen at the first hurdle and taken the T 'n' T ticket!\n@c0@"
  es: "@aAlazar@b¡Ya sé lo que pretendía! ¡Oh, cielos! ¡Yo habría caído a la primera, me habría quedado el boleto de T y T!\n@c0@"
  fr: "@aInnocent@bAh, je vois où il voulait en venirⓠ Mince, alors. J'aurais plongé à la première occasion et pris\nle ticket de TNT, c'est sûrⓠ\n@c0@"
  it: "@aSimon@bÈ andata bene, va'!\r\nProbabilmente, io non sarei stato del tutto sincero, e avrei accettato subito il biglietto della Sorte!\n@c0@"
  ja: "@a@bピピン「なるほど　そういうことでしたか！\n\tく～　ボクひとりだったら　きっと\n\tすごろく券で　はいって言ってますよ。\n@c0@"
229:
  de: "@aSancho@bDiese Mann, er ist ein wenig komisch, no? Vielleisst ist er loco?\n@c0@"
  en: "@aSancho@bThees man, he ees estrange maybe?\nYou theenk he ees loco?\n@c0@"
  es: "@aSancho@b¡Qué extraño es este hombre!\n¿No te parece que se le zafó un tornillo?\n@c0@"
  fr: "@aSancho@bIl est étrange, cet homme, noⓡ\nTu crois qu'il est f-f-fouⓡ\n@c0@"
  it: "@aSancho@b¿Que hombre estrano, eh?\nNo, no es estrano...\n¡Es totalmentes loco!\n@c0@"
  ja: "@a@bサンチョ「う～ん…　なんというか\n\t変わった方もいらっしゃるものですね。\n@c0@"
230:
  de: "@a%0%a001240@bHundert Jahre! Das ist ganz schön viel! Dann ist er ja fast so was wie ein Gott des Berges!\n@c0@"
  en: "@a%0%a001240@bOne hundred years! That's amazing! He's kind of like a god of the mountains, then!\n@c0@"
  es: "@a%0%a001240@b¡Cien años! ¡Eso es fantástico! ¡Pues debe de ser como un dios de las montañas!\n@c0@"
  fr: "@a%0%a001240@bCent ansⓠ C'est incroyableⓠ C'est un peu comme\nun dieu de la montagne, alorsⓠ\n@c0@"
  it: "@a%0%a001240@bHa vissuto più di cent'anni tra i monti?!\nAllora è vero che l'aria di montagna fa bene alla salute!\n@c0@"
  ja: "@a@b%a001240「１００年も！？　すごいやっ！\n\t山の神さまみたいな人だね。\n@c0@"
231:
  de: "@aBianca@bAls wir das letzte Mal hier durchkamen, waren wir praktisch in den Flitterwochen, weißt du noch, %a000090?\n@c0@"
  en: "@aBianca@bWhen we come through here before, it was sort of like a honeymoon, eh, %a000090?\n@c0@"
  es: "@aBianca@bLa otra vez que pasamos por aquí, era como nuestra luna de miel, ¿a que sí, %a000090?\n@c0@"
  fr: "@aBianca@bQuand nous avons traversé cet endroit, c'était un peu comme notre lune de miel, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, ricordi la prima volta che venimmo qui?\nPer me fu come essere in luna di miele...\n@c0@"
  ja: "@a@bビアンカ「昔　%a000090と　ふたりで\n\tここを通ったときは\n\t新婚旅行気分だったわよね。\n@c0@"
232:
  de: "@aBianca@bIch liebe dich immer noch, aber wie Flitterwochen kommt mir das hier gar nicht vor!\n@c0@"
  en: "@aBianca@bI still feel the same way about you, but it certainly dun't feel like a honeymoon this time!\n@c0@"
  es: "@aBianca@b¡Yo aún siento lo mismo por ti, pero esta vez ni luna de miel ni nada!\n@c0@"
  fr: "@aBianca@bJe ressens toujours la même chose pour toi,\nmais cette fois, ça n'est certainement pas\nune lune de mielⓠ\n@c0@"
  it: "@aBianca@bTi voglio bene quanto e più di allora, sai?\nPerò questo nostro nuovo viaggio non sembra affatto una luna di miele!\n@c0@"
  ja: "@a@bビアンカ「気持ちは　変わらないけど\n\tさすがに今は　新婚旅行気分って\n\tわけには　いかないね。\n@c0@"
233:
  de: "@aBianca@bAn Plätzen wie diesen fällt es mir schwer zu glauben, dass es Orte wie Zenithia und Nadiria überhaupt gibt.\n@c0@"
  en: "@aBianca@bBein' here makes it hard to imagine that places like Zenithia and Nadiria really exist.\n@c0@"
  es: "@aBianca@bDesde aquí es difícil imaginar que hay sitios como Zenithia y Nadiria, ¿sabes?\n@c0@"
  fr: "@aBianca@bDifficile d'imaginer que des endroits comme Zénithia\r\net Nadiria existent vraiment, quand on se trouve ici.\n@c0@"
  it: "@aBianca@bQuando sono qui mi sembra impossibile che esistano luoghi come Zenithia e Nadiria...\n@c0@"
  ja: "@a@bビアンカ「こうして　ここにいると\n\t天空とか魔界とか　そんなものが\n\tあること　信じられなくなるわ。\n@c0@"
234:
  de: "@aNera@bDas letzte Mal in dieser Höhle hatte ich große Angst. Ich mochte all das Herumgehopse überhaupt nicht...\n@c0@"
  en: "@aNera@bI was so scared the last time we were here in this cave. I didn't think all the leaping about could be\r\nat all safe.\n@c0@"
  es: "@aNera@bLa última volta que estuvimos en esta cueva tenía mucho miedo. Pensaba que esto de saltar aquí y allá no era muy sicuro.\n@c0@"
  fr: "@aNera@bJ'avais si peur la dernière fois que nous sommes venus dans cette grotte. Je trouvais que ce n'était pas très sûr de sauter comme ça.\n@c0@"
  it: "@aNera@bQuesta caverna mi fa venire le palpitazioni, con tutti i salti che bisogna fare per venirne fuori!\n@c0@"
  ja: "@a@bフローラ「昔　来たときは　この洞くつが\n\t本当に　こわかったわ。　こんなに\n\t飛びおりて　大丈夫かしらって……。\n@c0@"
235:
  de: "@aNera@bIn Humburg scheint alles in Ordnung zu sein. Trotzdem sollten wir dort hin und wieder nach dem Rechten sehen.\n@c0@"
  en: "@aNera@bGotha Castle seems to be doing alright. But we should stop in from time to time to make sure.\n@c0@"
  es: "@aNera@bParece que en el castillo de Pankraz tutto va bene. Pero deberíamos pasar de vez en cuando para asegurarnos.\n@c0@"
  fr: "@aNera@bTout a l'air d'aller au château de Gotha, mais nous devrions nous y arrêter de temps en temps pour nous en assurer.\n@c0@"
  it: "@aNera@bSono certa che le cose al Castello di Denim vanno bene, ma non sarebbe meglio farci un salto ogni tanto? Così, giusto per stare più tranquilli...\n@c0@"
  ja: "@a@bフローラ「グランバニアのお城は\n\t大丈夫よね。　でも　ときどきは\n\t様子を見にいきましょう。\n@c0@"
236:
  de: "@a%0%a001240@bAls wir nach dir gesucht haben, sind wir auch durch diese Höhle gekommen.\n@c0@"
  en: "@a%0%a001240@bWe came through this cave to Battenberg when we were looking for you.\n@c0@"
  es: "@a%0%a001240@bCuando te estábamos buscando pasamos por esta cueva que va a Habsburgo.\n@c0@"
  fr: "@a%0%a001240@bOn a traversé cette caverne jusqu'au hameau Técarlo quand on te cherchait.\n@c0@"
  it: "@a%0%a001240@bQualche anno fa, durante uno dei viaggi che facemmo per trovarti, attraversammo questa grotta per raggiungere Neviternia.\n@c0@"
  ja: "@a@b%a001240「お父さんを　探しに行く時\n\tボクたち　この洞くつを　ぬけて\n\tチゾットにも　行ったんだよ。\n@c0@"
237:
  de: "@a%0%a001240@bEs ist wie ein Labyrinth hier. Wir haben uns unzählige Mal verlaufen!\n@c0@"
  en: "@a%0%a001240@bIt's like a labyrinth in here, though. We got lost more times than I could count!\n@c0@"
  es: "@a%0%a001240@bPero es como un laberinto. ¡Nos perdimos un millón de veces!\n@c0@"
  fr: "@a%0%a001240@bC'est comme un labyrinthe, à l'intérieur.\nOn s'est perdus un paquet de foisⓠ\n@c0@"
  it: "@a%0%a001240@bÈ peggio di un labirinto!\nRicordo che ci mettemmo una vita per trovare l'uscita!\n@c0@"
  ja: "@a@b%a001240「ここって　迷路みたいだから\n\tいっぱい　迷っちゃった。\n@c0@"
238:
  de: "@a%0%a001240@bJuchhu! Ich bin so glücklich, dass du bei uns bist, Papa!\n@c0@"
  en: "@a%0%a001240@bYippee! I'm so happy you're here with us\nthis time, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Yupiii! ¡Qué contento estoy de que esta vez estés con nosotros, papi!\n@c0@"
  fr: "@a%0%a001240@bYoupiⓠ Je suis si content que tu sois avec nous, cette fois, papaⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, sono troppo felice che stavolta sei con noi!\n@c0@"
  ja: "@a@b%a001240「エヘヘ……。\n\tお父さんが　いっしょだと\n\tうれしいねっ！\n@c0@"
239:
  de: "@a%0%a001250@bIch war schon einmal hier, mit Sancho und %a001240.\n@c0@"
  en: "@a%0%a001250@bI came here before with Sancho and %a001240.\n@c0@"
  es: "@a%0%a001250@bYa había estado antes aquí con Sancho y %a001240.\n@c0@"
  fr: "@a%0%a001250@bJe suis déjà venue ici avec Sancho et %a001240.\n@c0@"
  it: "@a%0%a001250@bSono già stata qui, sai?\nEro in viaggio con lo zio Sancho e %a001240.\n@c0@"
  ja: "@a@b%a001250「前は　ここに\n\tサンチョと%a001240と　来たの。\n@c0@"
240:
  de: "@a%0%a001250@bLeider hat keiner von beiden einen besonders guten Orientierungssinn. Du kannst dir also vorstellen, wie oft wir uns verlaufen haben...\n@c0@"
  en: "@a%0%a001250@bNeither of them has any sense of direction at all,\nso it was a real trial.\n@c0@"
  es: "@a%0%a001250@bNo tienen sentido de la orientación, ni uno ni otroⓓ fue muy complicado.\n@c0@"
  fr: "@a%0%a001250@bIls n'ont ni l'un ni l'autre le moindre sens de l'orientation, c'était une véritable épreuve.\n@c0@"
  it: "@a%0%a001250@bFu difficilissimo trovare l'uscita...\nContinuavamo a perdere l'orientamento!\n@c0@"
  ja: "@a@b%a001250「ふたりとも　すごい\n\t方向オンチだから　大変だったの。\n@c0@"
241:
  de: "@a%0%a001250@b%0%a001240 und ich waren schon mal hier, als wir noch in Mamas Bauch waren, oder?\n@c0@"
  en: "@a%0%a001250@b%0%a001240 and I came here once when we were inside Mum's tummy, didn't we?\n@c0@"
  es: "@a%0%a001250@b%0%a001240 y yo pasamos por aquí una vez en la tripa de mamá, ¿a que sí?\n@c0@"
  fr: "@a%0%a001250@b%0%a001240 et moi, on est déjà venus ici une fois quand on était dans le ventre de maman, heinⓡ\n@c0@"
  it: "@a%0%a001250@bIo e %a001240 siamo venuti qui quando eravamo nella pancia della mamma, non è vero?\n@c0@"
  ja: "@a@b%a001250「ここって　わたしと%a001240が\n\tお腹にいたときも来たよね。\n@c0@"
242:
  de: "@a%0%a001250@bIch glaube, ich kann mich daran erinnern, wie Mama uns jedes Mal beschützt hat, wenn sie in ein Loch sprang.\n@c0@"
  en: "@a%0%a001250@bI have this feeling that I remember Mum trying to protect us from being hurt each time she jumped down a hole.\n@c0@"
  es: "@a%0%a001250@bTengo la sensación de que recuerdo que mamá intentaba protegernos cada vez que saltaba por un agujero.\n@c0@"
  fr: "@a%0%a001250@bJ'ai l'impression que je me souviens que maman essayait de nous protéger pour qu'on ne soit pas blessés chaque fois qu'elle sautait dans le vide.\n@c0@"
  it: "@a%0%a001250@bRicordo che lei ci proteggeva ogni volta che doveva saltare da una rupe! Però non so se è successo davvero oppure ho solo sognato che lo faceva...\n@c0@"
  ja: "@a@b%a001250「飛びおりるとき　お母さんが\n\t一生けんめい　わたしたちを\n\tかばってくれていたような気がする。\n@c0@"
243:
  de: "@aSancho@bIss mag diese Ort nisst. Immer wenn iss hierher komme, verlaufe iss miss.\n@c0@"
  en: "@aSancho@bI no like thees place. Every time I am coming here, I esure I get lost.\n@c0@"
  es: "@aSancho@bEste sitio no me gusta ni tantito. Cada vez que paso por aquí me pierdo, seguro.\n@c0@"
  fr: "@aSancho@bJe n'aime p-p-pas cet endroit. Chaque fois que\r\nje viens ici, je me p-p-perds.\n@c0@"
  it: "@aSancho@bNo me gusta esto posto...\n¡Cada vez que vengo aquí, perdo un mucchios de tiempo por trovare l'uscitas!\n@c0@"
  ja: "@a@bサンチョ「いやはや　ここは\n\t何度通っても　道を\n\tまちがえそうになりますよ。\n@c0@"
244:
  de: "@aOtto@bIch besitze wirklich überhaupt keinen Orientierungssinn. Vertraut bloß net auf mich, hört Ihr?\n@c0@"
  en: "@aTuppence@bI'm totally useless when it comes to remembering directions. Don't go relying on me, will you?\n@c0@"
  es: "@aAlazar@bSoy un inútil para recordar direcciones. Será mejor que no os fieis de mí.\n@c0@"
  fr: "@aInnocent@bJ'ai un sens de l'orientation parfaitement déplorable. Ne comptez pas sur moi surtout, d'accordⓡ\n@c0@"
  it: "@aSimon@bIl mio senso dell'orientamento è pessimo. Consiglio vivamente di non fare affidamento su di me, se vogliamo avere qualche speranza di uscire da qui...\n@c0@"
  ja: "@a@bピピン「ボクって　道とか　方向とか\n\tおぼえるのダメなんです。\n\tたよりにしないでくださいね。\n@c0@"
245:
  de: "@aGriselda@bHier soll ich mal zusammengebrochen sein? Nie im Leben! Daran kann ich mich überhaupt nicht erinnern!\n@c0@"
  en: "@aDebora@bI collapsed here once? No, I never did!\nI don't remember anything of the sort.\n@c0@"
  es: "@aStefania@b¿Que me desmayé aquí? ¡No, es mentira!\nEso nunca ha pasado, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe me suis écroulée ici, une foisⓡ Non. Jamaisⓠ\nJe ne me rappelle rien de tel.\n@c0@"
  it: "@aViola@bIo sarei svenuta qui una volta?!\nMa niente affatto!\nSecondo me ti confondi con qualcun altro...\n@c0@"
  ja: "@a@bデボラ「私が　ここで倒れたですって？\n\tウソでしょう？　そんなの　知らないわよ。\n\tあ　でも……。\n@c0@"
246:
  de: "@aGriselda@bOh, Moment mal... Wenn ich mir diesen Ort so ansehe, kommen tatsächlich ein paar Erinnerungen hoch. Alles hat sich gedreht...\n@c0@"
  en: "@aDebora@bOh, but wait a minute... Now I come to think of it, this place does bring back a strange memory of the whole world spinning around.\n@c0@"
  es: "@aStefania@bEspera un momento... Ahora que lo pienso, este sitio me hace pensar en il mondo entero dando vueltas.\n@c0@"
  fr: "@aPandora@bOh, mais attend une minute... Maintenant que j'y pense, cet endroit me rappelle effectivement un drôle de souvenir dans lequel le monde entier tournoyait.\n@c0@"
  it: "@aViola@bOh, aspetta!\nOra che ci penso, mi viene in mente che una volta ebbi un leggerissimo mancamento da queste parti...\n@c0@"
  ja: "@a@bデボラ「そういえば…　私を中心に\n\t世界中が　回転してたってことは\n\t記憶にあるような　気がするわね。\n@c0@"
247:
  de: "@aGriselda@bNa, die ganzen Jahre, als ich eine Statue war, stand die Zeit still. Ich fühle mich überhaupt nicht so alt, wie ich bin! Hach, ist das alles kompliziert...\n@c0@"
  en: "@aNera@bI suppose it's because time stood still for me when I was a statue all those years. I don't feel my age at all. Oh, it's all so complicated!\n@c0@"
  es: "@aNera@bSupongo que será porque el tiempo se detuvo per me tutti quelle anni. No siento la edad que tengo. ¡Qué difficile es tutto!\n@c0@"
  fr: "@aPandora@bJ'imagine que c'est parce que le temps s'est arrêté pour moi pendant ces années passées en statue. Je ne sens pas du tout mon âge. Oh, c'est si compliquéⓠ\n@c0@"
  it: "@aViola@bIl fatto che il tempo per me si sia fermato durante il periodo in cui ero stata trasformata in statua non c'entra per niente.\n@c0@"
  ja: "@a@bフローラ「それは…　石になっていたせいで\n\t私の中の時間が　止まっていた……\n\tと　いうことかしら？　ふくざつですわ。\n@c0@"
248:
  de: "@aGriselda@bIch werde immer jung und schön aussehen, egal was geschieht. Das hat nichts damit zu tun, dass ich all die Jahre eine Statue war.\n@c0@"
  en: "@aDebora@bI'll always look young and beautiful, no matter what happens. It's got nothing to do with me having been turned to stone all those years.\n@c0@"
  es: "@aStefania@bYo siempre seré joven y bella, pase lo que pase. No tiene nada que ver con haber pasado años convertida en pietra, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe serai toujours jeune et belle, quoi qu'il arrive. Ça n'a rien à voir avec le fait que j'ai été transformée en statue pendant toutes ces années.\n@c0@"
  it: "@aViola@bIn realtà è la mia bellezza sfolgorante a farmi apparire più giovane di quanto non sia realmente... Ho sempre dimostrato meno dei miei anni.\n@c0@"
  ja: "@a@bデボラ「石になっていたからじゃ　ないわよ。\n\t私の美しさは　ずっと変わらないの。\n\tどんなことが　あってもね。\n@c0@"
249:
  de: "@aGriselda@bHeißt das etwa, dass ich dich nicht mehr liebe, falls ich jemals altern sollte?\n@c0@"
  en: "@aDebora@bSo if I ever start to age, that'll mean I don't love you any more?\n@c0@"
  es: "@aStefania@bAsí que, si empiezo a envejecer, ¿significará que ya no te quiero?\n@c0@"
  fr: "@aPandora@bAlors si jamais je commence un jour à vieillir,\nça voudra dire que je ne t'aime plusⓡ\n@c0@"
  it: "@aViola@bQuindi io comincerò a invecchiare nel momento in cui dovessi allontanarmi da te o smettere di amarti?\nAllora non c'è problema, %a000090.\n@c0@"
  ja: "@a@bデボラ「つまり　私が　年をとったら\n\t%a000090への　愛が\n\tさめたってこと？\n@c0@"
250:
  de: "@aGriselda@bDann musst du dafür sorgen, dass ich immer zufrieden mit dir bin, damit ich keinen Grund dazu habe. Verstanden, %a000090?\n@c0@"
  en: "@aDebora@bYou'll just have to make sure you stay loyal to me like you vowed so that never happens.\nGot it, %a000090?\n@c0@"
  es: "@aStefania@bPues tendrás que serme fiel siempre para que eso no suceda. ¿Capisci, %a000090?\n@c0@"
  fr: "@aPandora@bTu vas devoir faire en sorte que ça n'arrive jamais en me restant fidèle comme tu me l'as promis.\nCompris, %a000090ⓡ\n@c0@"
  it: "@aViola@bContinua a volermi bene, a servirmi e a riverirmi e vedrai che ti starò sempre accanto, giovane e bella come il giorno che ci siamo visti per la prima volta...\n@c0@"
  ja: "@a@bデボラ「そうならないように\n\t私への　忠誠を　忘れないことよ。\n\tいいわね？　%a000090。\n@c0@"
251:
  de: "@aGriselda@bEs gibt viele Dinge, die ich nicht besonders appetitlich finde.\n@c0@"
  en: "@aDebora@bThere are plenty of things I don't find very appetising to look at.\n@c0@"
  es: "@aStefania@bVeramente, hay muchas cosas que no me parecen muy aptecibles.\n@c0@"
  fr: "@aPandora@bIl y a plein de choses que je ne trouve pas très appétissantes à regarder.\n@c0@"
  it: "@aViola@bA me piacciono tutti i cibi, però di solito non mangio quelli grassi.\n@c0@"
  ja: "@a@bデボラ「見た目で　食べられないものって\n\t意外と　多いのよ。\n@c0@"
252:
  de: "@aGriselda@bDa hilft nur eins: mir die Augen verbinden und mich füttern. Das würde dir sicher gefallen, was, %a000090?\n@c0@"
  en: "@aDebora@bFeeding them to me blindfolded is probably the best way to make me eat them. You'd enjoy that, no doubt, %a000090?\n@c0@"
  es: "@aStefania@bLa única forma de hacer que me las comiese sería vendándome gli occhi. Eso te encantaría, ¿eh, %a000090?\n@c0@"
  fr: "@aPandora@bPour me forcer à les manger, le meilleur moyen serait de me les donner alors que j'ai les yeux bandés.\nEt ce serait plutôt marrant, nonⓡ\n@c0@"
  it: "@aViola@b%0%a000090, ricorda di prepararmi solo piatti leggeri e poco calorici, d'accordo?\nSai, ci tengo alla mia linea...\n@c0@"
  ja: "@a@bデボラ「だから　目かくしして\n\t食べさせれば　いいのよ。\n\t%a000090　そういうの　好きでしょ。\n@c0@"
253:
  de: "@aGriselda@bIch würde alles essen, wenn es gut für meine Linie ist.\n@c0@"
  en: "@aDebora@bI'd eat anything if someone told me it was good for my figure.\n@c0@"
  es: "@aStefania@bSi alguien me dice que qualque cosa es buena para mi silueta, la comería sicuro.\n@c0@"
  fr: "@aPandora@bJe pourrais manger n'importe quoi si on me disait\r\nque ça rend belle.\n@c0@"
  it: "@aViola@bRecentemente ho sentito dire che aggiungere carne di mostro alla propria alimentazione aiuta a mantenersi giovani e belle.\n@c0@"
  ja: "@a@bデボラ「美容によい　と言われれば\n\tどんな　ゲテモノだって\n\tへっちゃらよ。\n@c0@"
254:
  de: "@aGriselda@bIn Schleimen steckt zum Beispiel viel gesundes Kollagen. Sollen wir mal einen Bissen probieren, %a001250?\n@c0@"
  en: "@aDebora@bI should think slimes are full of collagen, for example. Shall we try a bite of one, %a001250?\n@c0@"
  es: "@aStefania@bPor ejemplo, credo que los limos tienen mucho colágeno. ¿Probamos un bocadito de uno, %a001250?\n@c0@"
  fr: "@aPandora@bPar exemple, je suis certaine que les gluants sont pleins de collagène. Si on essayait d'en goûter un, %a001250ⓡ\n@c0@"
  it: "@aViola@bPer esempio, gli Slime sono ricchi di collagene, una sostanza che fa molto bene alla pelle.\nChe ne mangiarci uno Slime alla brace, %a001250?\n@c0@"
  ja: "@a@bデボラ「スライムなんか\n\tコラーゲンたっぷりで　よさそうよ。　\n\t%a001250も　一緒に　かじってみる？\n@c0@"
255:
  de: "@a%0%a001250@bA-Aber... Du bist doch schon schön genug, Mama! Du darfst keinen Schleim essen!\n@c0@"
  en: "@a%0%a001250@bB-But... You're already b-beautiful enough, Mum! Please don't try eating a slime!\n@c0@"
  es: "@a%0%a001250@bP-pero... ¡Tú ya eres muy guapa, mami! ¡Por favor, no te comas un limo!\n@c0@"
  fr: "@a%0%a001250@bM-Mais... Tu es déjà assez belle, mamanⓠ S'il te plaît, n'essaie pas de manger de gluantⓠ\n@c0@"
  it: "@a%0%a001250@bMamma! Ma che dici?! Tu sei già bellissima! Non hai bisogno di mangiare uno Slime!\nTi prego, non mangiare quelle creaturine blobbose!\n@c0@"
  ja: "@a@b%a001250「お　お母さんは　これ以上\n\tキレイになる必要は　ないからっ！\n\tスライムは　かじらないでくださいっ！\n@c0@"
256:
  de: "@aGriselda@bHa ha! Du Dummerchen, %a001250, ich mach doch nur Spaß. Manchmal bist du ziemlich blauäugig, genau wie dein Vater.\n@c0@"
  en: "@aDebora@bHa ha! You silly thing, %a001250! I was only joking. You're very gullible at times, aren't you?\nJust like your father.\n@c0@"
  es: "@aStefania@b¡Ja, ja! ¡No seas boba, %a001250! Solo era una broma. A veces eres una ingenua, ¿no?\nIgual que il tuo papino.\n@c0@"
  fr: "@aPandora@bHa haⓠ Mais non, %a001250ⓠ Je plaisantais, c'est tout. Tu es si naïve, parfoisⓠ Comme ton père.\n@c0@"
  it: "@aViola@bAh ah ah! Sei proprio una sciocchina, %a001250! Ti stavo solo prendendo in giro! Non mangerei mi uno Slime: sono troppo viscidi e flaccidi...\n@c0@"
  ja: "@a@bデボラ「あらあら　%a001250ったら。\n\tなんて　正直な　娘なのかしら。\n\t%a000090も　見習いなさいよ。\n@c0@"
257:
  de: "@aGriselda@bEs ist doch nur natürlich, dass unser Volk mich gesucht hat, als ich entführt wurde. Und wahrscheinlich haben sie dich gleich mit gesucht.\n@c0@"
  en: "@aDebora@bIt stands to reason that our people would come looking for me when I went missing. And they were probably looking for you while they were at it too.\n@c0@"
  es: "@aStefania@bEs normale que nuestro pueblo me buscase cuando desaparecí, ¿no? Y claro, ya que estaban en ello, también te buscaban a ti.\n@c0@"
  fr: "@aPandora@bIl allait de soit que les gens que nous connaissions\r\nme chercheraient lorsque j'ai disparu. Et ils ont\r\naussi dû te chercher, pendant qu'ils y étaient.\n@c0@"
  it: "@aViola@bQuando sono scomparsa, molte persone si sono messe alla mia ricerca.\n㈡\nGià che c'erano, hanno dato un'occhiata in giro per vedere se trovavano anche te.\n@c0@"
  ja: "@a@bデボラ「この私が　いなくなったんですもの\n\t国民たちがさがすのは　当然よ。\n\t%a000090は　あくまで　おまけなの。\n@c0@"
258:
  de: "@a%0%a001250@bPapa habe ich auch gesucht, aber am meisten habe ich dich vermisst, Mama. Es war schrecklich, keine Mutter zu haben.\n@c0@"
  en: "@a%0%a001250@bI was looking for Dad too, but it was you I missed most, Mum. It was horrible not having a mum.\n@c0@"
  es: "@a%0%a001250@bYo también buscaba a papá, pero a ti te echaba más de menos, mami. No tener mamá era una cosa horrible.\n@c0@"
  fr: "@a%0%a001250@bJ'ai aussi cherché papa, mais c'est toi qui me manquait le plus, maman. C'était horrible de ne\npas avoir de maman.\n@c0@"
  it: "@a%0%a001250@bPapà, quando io e %a001240 ti cercavamo, speravamo di trovare anche la mamma.\nLa mia mammina mi mancava tantissimo...\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんもだけど\n\tお母さんを　いちばんに　さがしてたよ。\n\tお母さんいなくて　さみしかった……。\n@c0@"
259:
  de: "@aGriselda@bIch weiß, %a001250. Du bist ein kluges kleines Mädchen. Genau wie ich.\n@c0@"
  en: "@aDebora@bI know, %a001250. You're a wise little girl, aren't you? A lot like me.\n@c0@"
  es: "@aStefania@bLo sé, %a001250. Eres una niña molto inteligente, ¿a que sí? Como yo.\n@c0@"
  fr: "@aPandora@bJe sais, %a001250. Tu es une petite fille très sensée. Tout comme moi.\n@c0@"
  it: "@aViola@bLo so, %a001250.\nAnche tu mi sei mancata tantissimo.\nPer fortuna ora siamo tornati tutti insieme!\n@c0@"
  ja: "@a@bデボラ「わかっているわよ　%a001250。\n\tあなたの　その利口さが　好きよ。\n\t私に　似たのかしらね。\n@c0@"
260:
  de: "@aGriselda@bWir werden die verlorene Zeit nachholen, und ich werde dir eine Menge beibringen, versprochen!\n@c0@"
  en: "@aDebora@bI'll have to teach you lots of things to make up for the time we were apart.\n@c0@"
  es: "@aStefania@bTendré que enseñarte muchas cosas para compensar por gli anni que estuvimos separadas.\n@c0@"
  fr: "@aPandora@bIl va falloir que je t'apprenne plein de choses pour compenser tout le temps où nous avons été séparées.\n@c0@"
  it: "@aViola@bAdesso potrò finalmente insegnarti tante cose importanti che ti aiuteranno ad affrontare meglio la vita...\n㈡\nCome il modo corretto di truccarsi, lo stile di abbigliamento più adeguato per qualsiasi circostanza e altre cose del genere. Sei contenta?\n@c0@"
  ja: "@a@bデボラ「はなれていたぶん　これからは\n\tいろいろ　教えてあげるわね。\n@c0@"
261:
  de: "@aGriselda@bIch glaube kaum, dass es hier besonders viele andere Übernachtungsmöglichkeiten gibt. Wir werden wohl hierbleiben müssen.\n@c0@"
  en: "@aDebora@bI doubt there are many other places around here to rest. Looks like we'll be staying here for the night.\n@c0@"
  es: "@aStefania@bNon credo que haya muchos otros sitios por aquí para descansar. Parece que tendremos que pasar la notte aquí, ¿capisci?\n@c0@"
  fr: "@aPandora@bÇa m'étonnerait qu'il existe beaucoup d'autres endroits où loger, par ici. Nous allons devoir passer la nuit ici, on dirait.\n@c0@"
  it: "@aViola@bNon credo che ci siano molte altre locande in questa zona.\nForse faremmo meglio a fermarci qui...\n@c0@"
  ja: "@a@bデボラ「このあたりには\n\t他に休める場所が　ないし\n\t今日　泊まるのは　ここで決まりかしら。\n@c0@"
262:
  de: "@a%0%a001250@bDer Orden vom Zugzwang... Das hört sich ja gruselig an! Der Name gefällt mir gar nicht!\n@c0@"
  en: "@a%0%a001250@bThe Order of Zugzwang... It's such a scary name!\nI don't like the sound of it one bit.\n@c0@"
  es: "@a%0%a001250@bLa Orden de Zugzwang... ¡Qué miedo da ese nombre!\nNo me gusta cómo suena, nada de nada.\n@c0@"
  fr: "@a%0%a001250@bL'Ordre du Zugzwang... C'est un nom qui fait peurⓠ\nJe n'aime pas ça du tout.\n@c0@"
  it: "@a%0%a001250@bLa Setta di Zugzwang...\nChe brutto nome! Solo a sentirlo mi tremano le gambe...\n@c0@"
  ja: "@a@b%a001250「光の教団……\n\tいやっ　こわい名前！\n\tすごく　いやな感じがする……。\n@c0@"
263:
  de: "@aOtto@bOh! Wenn sie wirklich so schön ist, wär ich fast versucht, dem Orden vom Zugzwang beizutreten!\n@c0@"
  en: "@aTuppence@bOoh! If she's as beautiful as she sounds, I might be tempted to join the Order of Zugzwang myself!\n@c0@"
  es: "@aAlazar@b¡Oooh! ¡Si es tan guapa como suena, no sé si podré resistir la tentación de unirme a la Orden de Zugzwang!\n@c0@"
  fr: "@aInnocent@bOohⓠ Si elle est aussi belle qu'on le dit, je pourrais bien être tenté de rejoindre l'Ordre du Zugzwangⓠ\n@c0@"
  it: "@aSimon@bSe la Gran Sacerdotessa della Setta di Zugzwang è bella come dicono, potrei prendere in considerazione l'idea di entrare a far parte del suo culto...\n@c0@"
  ja: "@a@bピピン「ああっ　そんな美人になら\n\tボクも　ぜひ　したがいたいっ！\n@c0@"
264:
  de: "@aSancho@bDas erinnert miss daran, wie schön Griselda ist. Si, iss frage miss, wo sie gerade ist...\n@c0@"
  en: "@aSancho@bThees breengs to my mind how beautiful Debora ees. Sí, I wonder where ees eshe now...\n@c0@"
  es: "@aSancho@bEsto me recuerda lo guapa que es Stefanía, híjole. ¿Pues y dónde estará ahora la chamaquita?\n@c0@"
  fr: "@aSancho@bCela me r-r-rappelle à quel point Pandora est\r\nb-b-belle. Si, je me demande où elle peut être...\n@c0@"
  it: "@aSancho@bChico, esto piensando alla señorita Viola...\nLa tua mujer es una donna incredibilmentes bella...\n@c0@"
  ja: "@a@bサンチョ「そういえば　デボラさまは\n\tそんな感じの　美人でしたね。\n\tデボラさまは　今　どこに……。\n@c0@"
265:
  de: "@a%0%a001250@bManchmal habe ich Angst, aber ich werde mein Bestes geben. Es wäre doch schrecklich, wenn die Welt zugrunde gehen würde.\n㈡\nDann würde ich ja all die Menschen, die ich so gern habe, nie mehr wieder sehen.\n@c0@"
  en: "@a%0%a001250@bI'm scared sometimes, but I'm going to try my hardest. It would be horrible if the world ended.\nI wouldn't be able to see the people I love.\n@c0@"
  es: "@a%0%a001250@bA veces tengo miedo, pero lo intentaré con todas mis fuerzas. Sería horrible que se acabase el mundo.\nNo podría volver a ver a las personas que quiero.\n@c0@"
  fr: "@a%0%a001250@bJ'ai peur, parfois, mais je vais faire de mon mieux. Ce serait horrible si la fin du monde arrivait. Je ne pourrais plus voir tous les gens que j'aime.\n@c0@"
  it: "@a%0%a001250@bSe il mondo venisse distrutto, scomparirebbero tutte le persone che mi sono care.\nSarebbe una cosa orribile!\n@c0@"
  ja: "@a@b%a001250「こわいけど　わたし　がんばります。\n\t世界がなくなって　大好きな人たちに\n\t会えなくなるの　もう…　イヤなの。\n@c0@"
266:
  de: "@aNera@bDiesem Orden vom Zugzwang hast du das Handwerk gelegt, aber scheinbar reicht das nicht aus.\n@c0@"
  en: "@aNera@bYou put a stop to the Order of Zugzwang, but that obviously wasn't the end of it.\n@c0@"
  es: "@aNera@bAunque pudiste detener a la Orden de Zugzwang, sembra que eso no bastó.\n@c0@"
  fr: "@aNera@bTu as mis un terme à l'Ordre du Zugzwang, mais de toute évidence, tout n'est pas encore terminé.\n@c0@"
  it: "@aNera@bEliminare la Setta di Zugzwang non è bastato...\n@c0@"
  ja: "@a@bフローラ「光の教団は　%a000090さんたちが\n\tほろぼしましたけど\n\tあれで　終わりでは　ないのですよね。\n@c0@"
267:
  de: "@aNera@bWir haben wohl keine andere Wahl, als nach Nadiria zu gehen.\n@c0@"
  en: "@aNera@bI'm afraid we have no choice but to go to Nadiria.\n@c0@"
  es: "@aNera@bCredo que no tenemos más opción que ir a Nadiria, caro mio.\n@c0@"
  fr: "@aNera@bJe crains que nous n'ayons pas d'autre choix\r\nque de nous rendre à Nadiria.\n@c0@"
  it: "@aNera@bSe vogliamo salvare il mondo, dobbiamo recarci a Nadiria.\nSarà dura, ma vedrai che ce la faremo...\n@c0@"
  ja: "@a@bフローラ「やはり　私たちは\n\t魔界へ　行かなければ……。\n@c0@"
268:
  de: "@aGriselda@bDiesem Orden vom Zugzwang hast du das Handwerk gelegt, aber den Hauptverantwortlichen haben wir immer noch nicht in die Finger bekommen.\n@c0@"
  en: "@aDebora@bYou put a stop to the Order of Zugzwang, but I still say we need to teach whoever's responsible for this a lesson!\n@c0@"
  es: "@aStefania@b¡Detuviste a la Orden de Zugzwang, ma yo digo que tenemos que dar una lección al responsabile de tutto!\n@c0@"
  fr: "@aPandora@bTu as mis un terme à l'Ordre du Zugzwang, mais il nous reste encore à donner une bonne leçon aux responsables de tout celaⓠ\n@c0@"
  it: "@aViola@bAver tolto di mezzo la Setta di Zugzwang non è stato sufficiente per riportare la pace.\n@c0@"
  ja: "@a@bデボラ「光の教団は　%a000090たちが\n\tほろぼしたけれど…　私の怒りは\n\tおさまってなんか　いないわ。\n@c0@"
269:
  de: "@aGriselda@bDa bleibt uns wohl keine andere Wahl, als nach Nadiria zu gehen.\n@c0@"
  en: "@aDebora@bWe have no choice but to go to Nadiria.\n@c0@"
  es: "@aStefania@bNo tenemos otra opzione que ir a Nadiria, ¿capisci?\n@c0@"
  fr: "@aPandora@bNous n'avons pas le choixⓢ nous devons aller\nà Nadiria\n@c0@"
  it: "@aViola@bTemo che non abbiamo altra scelta che andare a Nadiria...\n@c0@"
  ja: "@a@bデボラ「だから　私たちは　魔界へ行くの。\n\tわかったわね。\n@c0@"
270:
  de: "@aGriselda@bEs ist schon spät, lass uns doch hierbleiben. Ich brauche meinen Schönheitsschlaf.\n@c0@"
  en: "@aDebora@bIt's getting late now, so I think we'd better stay here for the night. I need my beauty sleep.\n@c0@"
  es: "@aStefania@bSe está haciendo tardeⓓ será mejor que nos quedemos aquí a pasar la notte. Mi bellezza necesita un sueño reparador, ¿capisci?\n@c0@"
  fr: "@aPandora@bIl se fait tard. Je crois que nous ferions bien de passer la nuit ici. J'ai besoin de repos pour être belle.\n@c0@"
  it: "@aViola@bS'è fatto tardi, caro.\nDirei di fermarci qui, così avrò il tempo per fare il mio sonno di bellezza...\n@c0@"
  ja: "@a@bデボラ「もう　夜もおそいし\n\t今夜は　ここに　泊まるわよ。\n\t夜更かしは　美容に　良くないから。\n@c0@"
