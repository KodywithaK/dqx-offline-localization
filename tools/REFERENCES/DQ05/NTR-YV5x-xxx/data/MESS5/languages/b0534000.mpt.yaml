  it: "@a%0%a001250@bLa Setta di Zugzwang...\nChe brutto nome! Solo a sentirlo mi tremano le gambe...\n@c0@"
  ja: "@a@b%a001250「光の教団……\n\tいやっ　こわい名前！\n\tすごく　いやな感じがする……。\n@c0@"
102:
  de: "@aSancho@bWeißt du, Chico, deine Onkel Sancho glaubt an den Himmel und all die heiligen Dinge. Aber die Göttin würde nie Geld verlangen, no. Hier ist etwas faul...\n@c0@"
  en: "@aSancho@bYou know, Sancho, he believes een these holy theengs. But the Goddess, eshe no take the money. Ees no right. I no like eet.\n@c0@"
  es: "@aSancho@bSabes, tito Sancho cree en esas cosas sagradas. Pero la Diosa no acepta dinero.\nNo está bien y no me gusta.\n@c0@"
  fr: "@aSancho@bTu sais, tonton Sancho croit au s-s-sacré. Mais la Déesse, elle ne p-p-prend pas d'argent, ça non.\r\nÇa ne me plaît pas. Je n'aime p-p-pas ça du tout.\n@c0@"
  it: "@aSancho@bAnche yo pienso que esta Setta de Zugzwang cerca solo de espillare quattrinos alla gente...\n@c0@"
  ja: "@a@bサンチョ「私も　神さまは信じてますが\n\tお金を集めるっていうのはねえ。\n\tどうも　うさんくさいですよ。\n@c0@"
103:
  de: "@aOtto@bEine weibliche Priesterin. Hm, ja, das kann ich mir sehr gut vorstellen...\n@c0@"
  en: "@aTuppence@bA female priest. Hmm, what a pretty picture!\n@c0@"
  es: "@aAlazar@b¡Una sacerdotisa! ¡Mmm, la idea me encanta!\n@c0@"
  fr: "@aInnocent@bUne prêtresse. Mmm, l'image est plaisanteⓠ\n@c0@"
  it: "@aSimon@bUna donna a capo di una setta religiosa?!\nCerto che l'emancipazione femminile ne ha fatti di passi in avanti, eh?!\n@c0@"
  ja: "@a@bピピン「女の大神官か。\n\tううっ　想像しちゃうなあ……。\n@c0@"
104:
  de: "@aBianca@bEs reicht aber nicht, wenn wir lediglich dem Orden vom Zugzwang das Handwerk legen.\n@c0@"
  en: "@aBianca@bIt en't enough for us to just put a stop to the Order of Zugzwang.\n@c0@"
  es: "@aBianca@bNo es suficiente con que le paremos los pies a la Orden de Zugzwang.\n@c0@"
  fr: "@aBianca@bOn ne doit pas se contenter de mettre un terme\r\naux actions de l'Ordre du Zugzwang.\n@c0@"
  it: "@aBianca@bLa sconfitta della Setta di Zugzwang non è stata la tappa conclusiva del nostro viaggio...\n@c0@"
  ja: "@a@bビアンカ「いくら　光の教団を\n\tほろぼしても　それだけじゃ\n\t意味が　ないのよね。\n@c0@"
105:
  de: "@aBianca@bNein, wir müssen auch in Nadiria selbst für Ordnung sorgen!\n@c0@"
  en: "@aBianca@bNope. We have to see things through and go to Nadiria too.\n@c0@"
  es: "@aBianca@bTenemos que terminar el trabajo e ir también a Nadiria, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bNon. Il faut qu'on règle tout ça et qu'on aille aussi\r\nà Nadiria.\n@c0@"
  it: "@aBianca@bDovremo andare a Nadiria, altrimenti i nostri sforzi saranno stati inutili...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　私たちは\n\t魔界へ　行かないと……。\n@c0@"
106:
  de: "@a%0%a001240@bDie Welt wird nicht zugrunde gehen. Nicht, wenn wir es verhindern können!\n@c0@"
  en: "@a%0%a001240@bThe world won't come to an end. Not with us working so hard to stop that from happening.\n@c0@"
  es: "@a%0%a001240@bEl mundo no se va a terminar, porque nosotros estamos haciendo todo lo posible para que eso no pase.\n@c0@"
  fr: "@a%0%a001240@bIl n'y aura pas de fin du monde. Pas avec tous les efforts qu'on fait pour que ça n'arrive pas.\n@c0@"
  it: "@a%0%a001240@bNon ci sarà nessuna fine del mondo!\nCi pensiamo noi a salvarlo!\n@c0@"
  ja: "@a@b%a001240「世界は　終わらないよ。\n\tそのために　お父さんも\n\tボクも　がんばってるんだから。\n@c0@"
107:
  de: "@aBianca@bSelbst die Strapazen einer Wüstendurchquerung können mir nichts anhaben, wenn ich euch alle an meiner Seite weiß.\n@c0@"
  en: "@aBianca@bEven crossing the treacherous desert is bearable with all of you by my side.\n@c0@"
  es: "@aBianca@bSi te tengo a mi lado, ni siquiera me importa cruzar el desierto, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand je suis à tes côtés, je peux tout endurer. Même la traversée d'un désert aride.\n@c0@"
  it: "@aBianca@bIl deserto non mi sembra più tanto inospitale, se tu sei al mio fianco...\n@c0@"
  ja: "@a@bビアンカ「前は　つらかった砂漠も\n\t今は　%a000090たちと　いっしょだから\n\tいくらでも　がんばれるわ。\n@c0@"
108:
  de: "@aNera@bEs ist unfassbar, wie stark die Sonne scheint. Und doch sind wir wieder hier.\n@c0@"
  en: "@aNera@bI can't believe how strong the sun is!\r\nAnd yet we made it here again.\n@c0@"
  es: "@aNera@b¡Non posso credere que el sol sea tan intenso!\nMa hemos conseguido llegar aquí de nuevo.\n@c0@"
  fr: "@aNera@bLe soleil tape incroyablement fortⓠ\nEt pourtant, nous avons réussi à revenir jusqu'ici.\n@c0@"
  it: "@aNera@bChe calore insopportabile...!\n@c0@"
  ja: "@a@bフローラ「この　ギラギラとした\n\t強い日差し…　私たち　また\n\tここに　来られたのね。\n@c0@"
109:
  de: "@a%0%a001240@bMann, ist verglühe ja fast. Ich glaub, mir war noch nie so heiß in meinem Leben. Wie gern würd ich jetzt ein Bad nehmen!\n@c0@"
  en: "@a%0%a001240@bArgh! I'm boiling! I don't think I've ever been this hot in my life. I want a bath!\n@c0@"
  es: "@a%0%a001240@b¡Argh! ¡Estoy asado! ¡Creo que nunca he pasado tanto calor en mi vida! ¡Necesito un baño!\n@c0@"
  fr: "@a%0%a001240@bArghⓠ Je cuisⓠ Je crois que je n'ai jamais eu aussi chaud de ma vie. Je veux un bain fraisⓠ\n@c0@"
  it: "@a%0%a001240@bArgh! Sto fondendo!\nFa un caldo pazzesco!\nVoglio fare una doccia fresca!\n@c0@"
  ja: "@a@b%a001240「うわ～っ　あっつーい。\n\t汗で　身体がべとべとだよ。\n\t水浴びしたいなあ。\n@c0@"
110:
  de: "@a%0%a001250@bAua! Mir ist Sand in die Augen geflogen!\n@c0@"
  en: "@a%0%a001250@bOuch! I've got sand in my eyes.\n@c0@"
  es: "@a%0%a001250@b¡Aaay! Me ha entrado arena en los ojos.\n@c0@"
  fr: "@a%0%a001250@bOuilleⓠ J'ai du sable dans les yeux.\n@c0@"
  it: "@a%0%a001250@bFput! Fput!\nHo la bocca piena di fabbia...\nFput! Non ne poffo più di quefto deferto!\n@c0@"
  ja: "@a@b%a001250「いたた…\n\t目に　砂が　入っちゃった……。\n@c0@"
111:
  de: "@aSancho@bChico... Hah...\nDu gehst... hah... so schnell... hah...\n@c0@"
  en: "@aSancho@bFriend...hahh...\nYou walking...hahh...eso fast...hahh...\n@c0@"
  es: "@aSancho@bChamaco... ahh...\nCaminas... ahh... demasiado aprisa... ahh...\n@c0@"
  fr: "@aSancho@bCh-chico... haan...\r\nTu marches... haan... si v-v-vite... haan...\n@c0@"
  it: "@aSancho@bChico... Haaahhh...\nCammini troppos veloces...\nHaaahhh...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん……ぜえ。\n\tもう少しだけ　ゆっくり……\n\t歩いて……ぜえぜえ……。\n@c0@"
112:
  de: "@aSancho@bEs ist... hah... so heiß... hah... dass iss... gar nisst atmen kann... hah...\n@c0@"
  en: "@aSancho@bEes...hahh...eso hot...hahh...\nI...hahh... I no...hahh...can breathe...\n@c0@"
  es: "@aSancho@bHace... mucho calor... ahh...\nNo... ahh... No puedo... ahh... respirar...\n@c0@"
  fr: "@aSancho@bQué... haan... calor... haan...\nJe... haan... n'arrive p-p-pas... haan...à respirer...\n@c0@"
  it: "@aSancho@bNo ce la faccio... Haaahhh...\n... A tenere el tuo passos...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「こう暑いと……ぜえ\n\t息が……きれて……\n\tも　もうダメです……！\n@c0@"
113:
  de: "@aOtto@bSonnenbräune ist längst aus der Mode gekommen. Mir wäre es lieb, wenn wir unser Ziel schnell erreichen, bevor ich mir noch die Haut verbrenne...\n@c0@"
  en: "@aTuppence@bIt's not fashionable any more to have a tan. I'd appreciate it if we could move on to our next destination before I catch the sun.\n@c0@"
  es: "@aAlazar@bEl bronceado ya no está de moda. Espero que podamos llegar donde quiera que vayamos antes de que me ponga moreno.\n@c0@"
  fr: "@aInnocent@bLe bronzage n'est plus à la mode. Ce serait bien si\r\non pouvait atteindre notre prochaine destination avant que je prenne un coup de soleil.\n@c0@"
  it: "@aSimon@bIl sole picchia, ma per fortuna ho messo la mia bella cremina protettiva! Quest'anno l'abbronzatura non è di moda. Va lo stile ⓕgotic-pallidⓖ, che fa tanto chic.\n@c0@"
  ja: "@a@bピピン「もう黒いのは　はやりませんよ。\n\t日焼けしないうちに\n\t次の目的地へ　行きましょう。\n@c0@"
114:
  de: "@a%0%a001240@bDer arme Hund muss ja umkommen vor Hitze! Aber vielleicht ist er dran gewöhnt, wenn er hier lebt...\n@c0@"
  en: "@a%0%a001240@bThat dog must be so hot! Or maybe it's used to the heat because it lives here.\n@c0@"
  es: "@a%0%a001240@b¡Qué calor debe de tener ese perro! Claro que a lo mejor está acostumbrado porque vive aquí.\n@c0@"
  fr: "@a%0%a001240@bIl doit avoir drôlement chaud, ce chienⓠ\nMais peut-être qu'à force de vivre ici, il s'est habitué à la chaleur.\n@c0@"
  it: "@a%0%a001240@bChissà se anche quel cane ha caldo... Uhm, forse no...\nMagari ha sempre vissuto qui, ed è abituato alle alte temperature...\n@c0@"
  ja: "@a@b%a001240「あの犬は　暑くないのかな？\n\tそれとも　もう　なれちゃったのかな？\n@c0@"
115:
  de: "@a%0%a001250@bDer Hund ist wirklich nett. Er bleibt die ganze Zeit hier, damit der alte Mann nicht so einsam ist.\n@c0@"
  en: "@a%0%a001250@bThat dog's really nice. He stays here all the time so the old man doesn't get lonely.\n@c0@"
  es: "@a%0%a001250@bEse perro es muy simpático. Se queda todo el día aquí para que el pobre anciano no se sienta solo.\n@c0@"
  fr: "@a%0%a001250@bCe chien est vraiment gentil. Il reste ici tout le temps pour tenir compagnie au vieil homme.\n@c0@"
  it: "@a%0%a001250@bChe cane premuroso!\nSta sempre qui per tenere compagnia a quel vecchietto!\n@c0@"
  ja: "@a@b%a001250「あの犬さん　やさしいの。\n\tおじいさんが　さみしくないように\n\tずっと　いてあげるんだって。\n@c0@"
116:
  de: "@a%0%a001240@bIst zwar nicht groß hier, aber man hat alles, was man braucht! Wie eine geheime Höhle!\n@c0@"
  en: "@a%0%a001240@bThis place is quite small, but they have everything! It's like a secret den!\n@c0@"
  es: "@a%0%a001240@b¡Este sitio es pequeño, pero tienen de todo! ¡Es como una cabaña secreta!\n@c0@"
  fr: "@a%0%a001240@bÇa n'est pas très grand, ici, mais ils ont tout ce qu'il faut. C'est comme une cachette secrèteⓠ\n@c0@"
  it: "@a%0%a001240@bL'ambiente è piccolo, ma qui dentro c'è di tutto!\nSembra un rifugio segreto!\n@c0@"
  ja: "@a@b%a001240「このおうちって　小さいのに\n\tなんでもそろってて　すごいよね。\n\tかくれ家みたい。\n@c0@"
117:
  de: "@a%0%a001240@bHey! Wenn wir wieder in Humburg sind, könntest du mir doch auch eine geheime Höhle bauen, Papa!\n@c0@"
  en: "@a%0%a001240@bHey! When we get home to Gotha, we could build a secret den for me, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Eh, cuando volvamos a Pankraz, podríamos construir una cabaña secreta para mí, papi!\n@c0@"
  fr: "@a%0%a001240@bHéⓠ Quand on rentrera chez nous, à Gotha,\non pourrait me construire une cachette secrète\nà moi aussi, hein, papaⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, quando torneremo a Denim mi aiuterai a costruire un rifugio segreto? Vorrei tanto avere un posto come questo tutto per me!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん\n\tこの旅が終わったら　ボクと\n\tヒミツのかくれ家　つくろうよ！\n@c0@"
118:
  de: "@a%0%a001250@bAhhh. Endlich etwas Abkühlung. Das tut gut...\n@c0@"
  en: "@a%0%a001250@bAaah. It's nice and cool in here. What a relief.\n@c0@"
  es: "@a%0%a001250@bAaah. Qué fresco se está aquí. Es un alivio...\n@c0@"
  fr: "@a%0%a001250@bAah. Il fait frais, ici. Quel soulagement.\n@c0@"
  it: "@a%0%a001250@bAh, senti che bel freschetto c'è qui dentro!\nChe meraviglia...!\n@c0@"
  ja: "@a@b%a001250「はあ～……\n\tこのお家の中　すずしい～……。\n\t気持ちいい～。\n@c0@"
119:
  de: "@a%0%a001240@bJa, stimmt! Ich glaube, ich hab auf dem Weg einen großen Turm gesehen. Aber wie kommen wir dahin?\n@c0@"
  en: "@a%0%a001240@bOh yes! I think I did see a big tower somewhere along the way. I wonder how you get to it, though.\n@c0@"
  es: "@a%0%a001240@b¡Ah, sí! Creo que he visto una torre gigantesca mientras veníamos hacia aquí. Pero no sé cómo se llegará a ella.\n@c0@"
  fr: "@a%0%a001240@bOh, ouiⓠ Je crois bien avoir vu une grande tour quelque part, sur le chemin. Mais je me demande comment on fait pour y accéder.\n@c0@"
  it: "@a%0%a001240@bAh, sì! Mentre venivamo qui ho visto una torre altissima.\nChissà come si fa ad arrivarci...\n@c0@"
  ja: "@a@b%a001240「たしかに　すごく高い塔を\n\t見たような……。　でも　どうしたら\n\tあそこまで　行けるんだろ？\n@c0@"
120:
  de: "@aSancho@bBis hoch in die Himmel? Das ist sehr, sehr hoch, no, Chico? Das ist keine Ort für Sancho. Iss warte unten und mach eine Paella.\n@c0@"
  en: "@aSancho@bRight up to the heavens?\nEes very, very tall, no? Ees no the place for Sancho. I wait at the bottom and eat paella.\n@c0@"
  es: "@aSancho@b¿Hasta los cielos?\nEso es bien alto, ¿no? Al tito Sancho no le gusta. Prefiero esperar abajo comiendo enchilada.\n@c0@"
  fr: "@aSancho@bJ-Jusqu'aux cieuxⓡ C'est t-t-très grand, noⓡ\nÇa n'est pas oun endroit pour Sancho. J'attendrai\nen bas en m-m-mangeant oune paella.\n@c0@"
  it: "@aSancho@b¿Una torre que arriva fino en cielo?\r\n¡Ce vorranno años por salire fino en cima!\r\nSi vuoi provarce, yo te aspetto de sottos...\n@c0@"
  ja: "@a@bサンチョ「天空に通ずるとは　これまた\n\tすごい　高さが　ありそうですね。\n\tそこを　のぼるのは　ちょっと……。\n@c0@"
121:
  de: "@a%0%a001240@bHuch! Ich hätte nicht gedacht, dass hier unten jemand ist!\n@c0@"
  en: "@a%0%a001240@bYikes! I didn't expect to find anyone down here!\n@c0@"
  es: "@a%0%a001240@b¡Uy! ¡No creía que hubiese nadie aquí abajo!\n@c0@"
  fr: "@a%0%a001240@bMinceⓠ Je ne m'attendais pas à trouver quelqu'un iciⓠ\n@c0@"
  it: "@a%0%a001240@bGasp!\nCosa ci fa questo tizio quaggiù?!\n@c0@"
  ja: "@a@b%a001240「ビックリした！\n\tこんなところに　人がいるなんて\n\t思わなかったよ。\n@c0@"
122:
  de: "@a%0%a001250@bIch hab gerade einen Tropfen abbekommen. Das Wasser ist echt kalt, nicht?\n@c0@"
  en: "@a%0%a001250@bI got dripped on just now.\nWell water is really cold, isn't it?\n@c0@"
  es: "@a%0%a001250@bMe acaba de caer una gota.\nEl agua de pozo está muy fría, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bJe viens de recevoir une goutte. L'eau est vraiment froide ici, nonⓡ\n@c0@"
  it: "@a%0%a001250@bL'acqua del pozzo è bella fresca...\n@c0@"
  ja: "@a@b%a001250「さっき　お水に\n\tさわっちゃった。　井戸の\n\tお水って　冷たいのね。\n@c0@"
123:
  de: "@aBianca@bIn einem Brunnen ist es angenehm kühl. Ich frage mich, wie es wäre, hier zu leben...\n@c0@"
  en: "@aBianca@bIt's nice and cool down a well. I wonder what it'd be like to live here.\n@c0@"
  es: "@aBianca@bQué fresco se está dentro de un pozo. ¿Cómo sería vivir aquí?\n@c0@"
  fr: "@aBianca@bIl fait bon et frais au fond des puits. Je me demande comment ça serait de vivre ici.\n@c0@"
  it: "@aBianca@bI pozzi sono freschi e riparano dal sole. Tutto sommato, non dev'essere male vivere qui sotto.\r\nPeccato solo che il panorama lasci a desiderare...\n@c0@"
  ja: "@a@bビアンカ「井戸の中は　やっぱり\n\t冷えるわね。　こんなところに\n\t住んでて　大丈夫なのかしら？\n@c0@"
124:
  de: "@aNera@bEs ist schwer, sich in einem Brunnen zu entspannen. Ich habe einfach zu viel Angst, dass ich das Trinkwasser verschmutzen könnte.\n@c0@"
  en: "@aNera@bIt's hard to relax down a well. I'm too worried I might be making the drinking water all dirty.\n@c0@"
  es: "@aNera@bVeramente, es difícil relajarse dentro de un pozo. Me preocupa ensuciar el acqua potable.\n@c0@"
  fr: "@aNera@bC'est difficile d'être détendue, au fond d'un puits. J'ai peur de salir l'eau que les gens vont boire.\n@c0@"
  it: "@aNera@bSe questo fosse un pozzo dei desideri, lancerei una moneta per far avverare il sogno di averti sempre accanto a me, tesoro mio...\n@c0@"
  ja: "@a@bフローラ「井戸の中って落ちつきませんわ。\n\t大切な飲み水を　汚してしまわないかと\n\t心配で……。\n@c0@"
125:
  de: "@a%0%a001240@bEs ist kalt geworden. Kann ich mich mit deinem Umhang zudecken, Papa?\n@c0@"
  en: "@a%0%a001240@bIt's gone a bit cold now. Can I cover myself up with your cape, Dad?\n@c0@"
  es: "@a%0%a001240@bHace un poco de frío ahora. ¿Me puedo tapar con tu capa, papá?\n@c0@"
  fr: "@a%0%a001240@bIl fait un peu froid, maintenant. Je peux me couvrir avec ta cape, papaⓡ\n@c0@"
  it: "@a%0%a001240@bSbaglio o adesso fa un po' freschino?\n@c0@"
  ja: "@a@b%a001240「なんだか寒気がする……。\n\tお父さん　マントの中に\n\t入ってもいい？\n@c0@"
126:
  de: "@a%0%a001250@bIch bin müde. Und mir ist kalt...\n@c0@"
  en: "@a%0%a001250@bI'm sleepy. And cold. Huh!\n@c0@"
  es: "@a%0%a001250@bTengo sueño. Y frío. ¡Jo!\n@c0@"
  fr: "@a%0%a001250@bJ'ai sommeil. Et j'ai froid. Pfffⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, ho sonno...\nPapà, ho freddo...\nPapà, ho fame...\n㈡\nEh eh eh!\nSono una lagna, vero?\n@c0@"
  ja: "@a@b%a001250「眠いし…　寒いし……。\n\tもう　ダメ……。\n@c0@"
127:
  de: "@aSancho@bTagsüber ist die Wüste unerträgliss heiß und nachts unerträgliss kalt.\n@c0@"
  en: "@aSancho@bThe desert ees eso hot een the day.\nBut ees eso cold een the night.\n@c0@"
  es: "@aSancho@bEn el desierto hace mucho calor de día.\nPero de noche hace tremendo frío.\n@c0@"
  fr: "@aSancho@bLe d-d-désert est si chaud le jour, mais si\r\nf-f-froid la noche.\n@c0@"
  it: "@aSancho@bEl desierto es muy caliente durantes el día, ma es muy freddos de noche...\n@c0@"
  ja: "@a@bサンチョ「砂漠ってのは\n\t昼間は　うーんと暑いですが\n\t夜には　うーんと冷えるんです。\n@c0@"
128:
  de: "@aSancho@bWir müssen eine Bleibe für die Notte finden, Chico. Sonst werden wir alle noch krank.\n@c0@"
  en: "@aSancho@bWe must find esomewhere to estay the night, friend. Otherwise, maybe we all catch the esneezes.\n@c0@"
  es: "@aSancho@bTenemos que encontrar un sitio para pasar la noche, chamaco, o atraparemos un catarro.\n@c0@"
  fr: "@aSancho@bOn doit t-t-trouver oun endroit où passer la nuit, chico. Sinon, on va t-t-tous attraper un rhume.\n@c0@"
  it: "@aSancho@bChico, dobbiamo trovare un luego riparato por dormire, altrimenti ce buscheremo un raffreddores.\n@c0@"
