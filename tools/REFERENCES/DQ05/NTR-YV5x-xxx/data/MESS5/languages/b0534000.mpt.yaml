223:
  de: "@aSancho@bGlaubst du nisst, wir hätten gemerkt, wenn wir diese Kleid verloren hätten? Bist du sisser, dass es uns gehört?\n@c0@"
  en: "@aSancho@bEef we drop thees dress, you no theenk we notice?\r\nAre you esure eet belongs to us?\n@c0@"
