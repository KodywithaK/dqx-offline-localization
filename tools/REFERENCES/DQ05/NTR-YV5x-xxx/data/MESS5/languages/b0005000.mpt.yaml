90:
  de: "@a@b*: Anscheinend kann es nur von einem legendären Helden benutzt werden. Das ist alles sehr mysteriös!\n@c0@"
  en: "@a@b*: Apparently, it can only be used by some kind of legendary hero. It's all very mysterious!\n@c0@"
  es: "@a@b*: Al parecer, solo puede usarla un héroe legendario. ¡Qué misterioso!\n@c0@"
  fr: "@a@b*ⓢ Apparemment, elle ne peut être utilisée que par une sorte de héros légendaire.\nTout ça est très mystérieuxⓠ\n@c0@"
  it: "@a@b*: La leggenda vuole che sia un'arma speciale che può essere impugnata solo da un eroe misterioso...\n@c0@"
  ja: "@a@b＊「して　その剣は\n\t勇者にしか　装備できぬと。\n\tなるほどのう……。\n@c0@"
91:
  de: "@a@b*: Das muss das Schwert sein, das Ludwig damals so viel Kopfzerbrechen gemacht hat, weil er nicht damit kämpfen konnte.\n@c0@"
  en: "@a@b*: That must've been the sword Pankraz was scratchin' his head about all those years back, wonderin' why he couldn't fight with it.\n@c0@"
  es: "@a@b*: Esa debe de ser la espada con la que se rascaba Teudis la cabeza, preguntándose por qué no podía luchar con ella.\n@c0@"
  fr: "@a@b*ⓢ Ce doit être l'épée sur laquelle Petros s'était posé tant de questions parce qu'il ne parvenait pas à s'en servir.\n@c0@"
  it: "@a@b*: Quella spada fece impazzire il povero Russel tanto tempo fa. Non riusciva a capire per quale motivo non potesse usarla in battaglia.\n@c0@"
  ja: "@a@b＊「かつて　パパスどのが　なぜ自分に\n\t装備できぬかと　なげいておったのは\n\tその剣じゃったのか。\n@c0@"
92:
  de: "@a@b*: Ich habe ihn noch nie so ratlos gesehen wie damals.\n@c0@"
  en: "@a@b*: I'd never seen him look that troubled before.\n@c0@"
  es: "@a@b*: Nunca lo había visto tan preocupado.\n@c0@"
  fr: "@a@b*ⓢ Jamais je ne l'avais vu aussi dubitatif.\n@c0@"
  it: "@a@b*: Ricordo che si è scervellato invano per anni cercando di risolvere questo mistero...\n@c0@"
  ja: "@a@b＊「パパスどのの　あんなに\n\tくやしそうな姿を見たのは\n\tその時が　初めてじゃったのう。\n@c0@"
93:
  de: "@a@b*: Meine Güte! Ihr wollt den legendären Helden suchen? Ist das denn eine gute Idee?\n@c0@"
  en: "@a@b*: Good heavens! You're goin' off in search of the legendary hero!? Are you sure that's wise?\n@c0@"
  es: "@a@b*: ¡Cielo santo! ¿Vas a buscar al héroe legendario? ¿Te parece una buena idea?\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Tu vas partir à la recherche de ce héros légendaireⓡ Tu es sûr de ce que tu faisⓡ\n@c0@"
  it: "@a@b*: %H0860%XVuoi%YVolete%Z trovare l'Eroe Leggendario?!\nOh, mia buona dea!\nMa %H0860%Xparli sul serio%Yparlate sul serio%Z?!\n@c0@"
  ja: "@a@b＊「まあ！　伝説の勇者さまを\n\tさがし出すですって！？\n\t本気なの？\n@c0@"
94:
  de: "@a@b*: Da fällt mir ein, ich habe vor kurzem drüben in Wittenhausen Gerede von einem legendären Helden gehört.\n@c0@"
  en: "@a@b*: Actually, I seem to remember hearin' some talk about the legendary hero over in Roundbeck long ago.\n@c0@"
  es: "@a@b*: En realidad, recuerdo haber oído algo acerca del héroe legendario en Golfo Blanco, hace tiempo.\n@c0@"
  fr: "@a@b*ⓢ Je me souviens avoir entendu parler de ce héros légendaire il y a bien longtemps, alors que je séjournais à Blanchecombe.\n@c0@"
  it: "@a@b*: Uhm, forse posso %H0860%Xaiutarti%Yaiutarvi%Z...\nSe non ricordo male, molto tempo fa sentii parlare dell'Eroe Leggendario a Blankenburg...\n@c0@"
  ja: "@a@b＊「そうなの……。　そういえば昔\n\tアルカパの町で　勇者さまの\n\t話を聞いたことがあるわ。\n@c0@"
95:
  de: "@a@b*: Da hat Eure alte Freundin Bianca gelebt. Was wohl aus ihr geworden ist?\n@c0@"
  en: "@a@b*: That's where that old friend of yours, Bianca, lived. I wonder how she's doin' now.\n@c0@"
  es: "@a@b*: Ahí vivía esa vieja amiga tuya, Bianca. Me pregunto cómo le irá.\n@c0@"
  fr: "@a@b*ⓢ C'est là que ta vieille amie Bianca habitait. Je me demande comment elle va d'ailleurs.\n@c0@"
  it: "@a@b*: È il villaggio dove viveva la tua vecchia amica Bianca. Ti ricordi di lei, vero?\nChissà come sta adesso...\n@c0@"
  ja: "@a@b＊「アルカパといえば　%a000090の\n\tおさななじみの　ビアンカさんも\n\tいたわね。　お元気かしら。\n@c0@"
96:
  de: "@a@b*: Ich wusste ja, dass Ihr nur einen Witz gemacht habt. Wenn er schon ein Teil der Legende ist, dann ist er bestimmt schon tot.\n@c0@"
  en: "@a@b*: I knew you were jokin'. If he's part of legend already, then he's probably already dead, after all.\n@c0@"
  es: "@a@b*: Sabía que era broma. Al fin y al cabo, si es parte de una leyenda ya estará muerto, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Je savais que tu plaisantais. Si ce héros est devenu légendaire, c'est probablement parce qu'il est mort.\n@c0@"
  it: "@a@b*: Ah, %H0860%Xstavi%Ystavate%Z scherzando...\nDel resto, se quell'eroe è leggendario probabilmente è già morto, no?\n@c0@"
  ja: "@a@b＊「そうよね　冗談よね。\n\t伝説なんて言うくらいだから\n\tもうとっくに死んでいるはずよ。\n@c0@"
97:
  de: "@a@b%0%a000120 untersucht das Schwert, das im Boden steckt.\n@c0@"
  en: "@a@b%0%a000120 examines the sword stuck in the ground.\n@c0@"
  es: "@a@b%0%a000120 examina la espada clavada en el suelo.\n@c0@"
  fr: "@a@b%0%a000120 examine l'épée figée dans le sol.\n@c0@"
  it: "@a@b%0%a000120 esamina la spada conficcata nel terreno.\n@c0@"
  ja: "@a@b%a000120は　地面に　\nつき立てられた剣を　調べた。\n@c0@"
98:
  de: "@a@bAber es ist schwer wie Blei und %a000120 kann es nicht herausziehen.\n@c0@"
  en: "@a@bBut it's as heavy as lead, and %a000120 can't pull it out.\n@c0@"
  es: "@a@bPero pesa como el plomo y %a000120 no logra extraerla.\n@c0@"
