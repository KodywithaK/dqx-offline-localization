99:
  de: "@a@b%0%a000090 untersucht das Schwert, das im Boden steckt.\n@c0@"
  en: "@a@b%0%a000090 examines the sword stuck in the ground.\n@c0@"
  es: "@a@b%0%a000090 examina la espada clavada en el suelo.\n@c0@"
  fr: "@a@b%0%a000090 examine l'épée figée dans le sol.\n@c0@"
  it: "@a@b%0%a000090 esamina la spada conficcata nel terreno.\n@c0@"
