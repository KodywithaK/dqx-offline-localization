112:
  de: "@a@bⓞLieber %a000090,\nwenn du diesen Brief liest, bedeutet das, dass ich nicht mehr bei dir bin.\n@c0@"
  en: "@a@bⓗDear %a000090,\nIf you're reading this letter, it must mean I'm no longer by your side.\n@c0@"
  es: "@a@bⓕQuerido %a000090,\nSi estás leyendo esta carta significa que ya no estoy a tu ladoⓖ.\n@c0@"
  fr: "@a@bⓥCher %a000090,\nSi tu lis cette lettre, cela signifie que je ne suis plus à tes côtés.\n@c0@"
  it: "@a@bⓕCarissimo %a000090,\nse stai leggendo questa lettera, vuol dire che non sono più al tuo fianco.ⓖ\n@c0@"
  ja: "@a@b“%a000090よ。　お前がこの手紙を読んで\n　いるということは　何らかの理由で　私は\n　もう　お前のそばにいないのだろう。\n@c0@"
113:
  de: "@a@bDu weißt es sicher inzwischen: Ich bin auf Reisen gegangen, um meine geliebte Frau Magda zu finden, die Schurken in die Hände gefallen ist.\n@c0@"
  en: "@a@bⓗYou probably know already, but the reason I've been travelling is to search for my beloved wife, Mada, who fell into the hands of evil.\n@c0@"
  es: "@a@bⓕProbablemente ya lo sepas, pero el motivo de mis viajes es la búsqueda de mi amada esposa, Perséfone, que cayó en manos del malⓖ.\n@c0@"
  fr: "@a@bTu le sais probablement déjà, mais la quête que j'avais entreprise avait pour objectif de retrouver ma femme adorée, Magda, capturée par un monstre.\n@c0@"
  it: "@a@bⓕCome forse già saprai, ho viaggiato per anni per trovare la mia amatissima moglie, Mada, caduta nelle mani di un essere malvagio.ⓖ\n@c0@"
  ja: "@a@b“すでに　知っているかもしれんが\n　私は　邪悪な手にさらわれた　妻の\n　マーサを助けるため　旅をしている。\n@c0@"
114:
  de: "@a@bMeine Frau, deine Mutter, hatte ein paar geheimnisvolle Kräfte.\n@c0@"
  en: "@a@bⓗMy wife, your mother, had some mysterious powers.\n@c0@"
  es: "@a@bⓕMi mujer, tu madre, tenía poderes misteriososⓖ.\n@c0@"
  fr: "@a@bMa femme, c'est-à-dire ta mère, avait des pouvoirs mystérieux.\n@c0@"
  it: "@a@bⓕMia moglie, tua madre, è una donna dotata di una forza misteriosa.ⓖ\n@c0@"
  ja: "@a@b“私の妻　お前の母には\n　とても　不思議な力が　あった。\n@c0@"
115:
  de: "@a@bIch verstehe es nicht ganz, aber diese Kräfte werden offenbar von denen in der dunklen Welt von Nadiria begehrt.\n@c0@"
  en: "@a@bⓗI don't really understand it, but it seems these powers are coveted by those in the dark world of Nadiria.\n@c0@"
  es: "@a@bⓕNo lo entiendo bien, pero parece que los moradores del oscuro mundo de Nadiria codiciaban esos poderesⓖ.\n@c0@"
  fr: "@a@bJe n'ai pas encore tout compris, mais il semblerait que ses pouvoirs aient attiré l'attention de certains habitants du monde maléfique de Nadiria.\n@c0@"
  it: "@a@bⓕGli abitanti del mondo oscuro di Nadiria desiderano impossessarsi del potere di Mada, del quale io stesso so poco o nulla.ⓖ\n@c0@"
  ja: "@a@b“私には　よく分からぬが\n　その能力は　魔界にも\n　通じるものらしい。\n@c0@"
116:
  de: "@a@bIch glaube, sie ist wegen ihrer Kräfte dorthin verschleppt worden.\n@c0@"
  en: "@a@bⓗIt's my belief that she was carried off there because of her powers.\n@c0@"
  es: "@a@bⓕCreo que por este motivo fue raptadaⓖ.\n@c0@"
  fr: "@a@bJe pense qu'on l'a enlevée et emmenée là-bas pour ses pouvoirs.\n@c0@"
  it: "@a@bⓕSono giunto alla conclusione che tua madre è stata rapita proprio a causa delle particolarissime capacità che ella possiede.ⓖ\n@c0@"
  ja: "@a@b“たぶん妻は　その能力ゆえに\n　魔界へ　連れ去られたのであろう。\n@c0@"
117:
  de: "@a@bLieber %a000090, du musst meine Suche nach dem legendären Helden fortsetzen!\n@c0@"
  en: "@a@bⓗDear %a000090! You must continue my search for the legendary hero!\n@c0@"
  es: "@a@bⓕ¡Querido %a000090, debes proseguir mi búsqueda del héroe legendario!ⓖ.\n@c0@"
  fr: "@a@bCher %a000090, tu dois poursuivre ma quête du héros légendaireⓠ\n@c0@"
  it: "@a@bⓕ%0%a000090, figlio mio! Devi continuare la mia ricerca! Trova l'Eroe Leggendario!ⓖ\n@c0@"
  ja: "@a@b“%a000090よ！\n　伝説の勇者を　さがすのだ！\n@c0@"
118:
  de: "@a@bDer Einzige, der nach Nadiria gelangen und Magda aus den Klauen des Bösen retten kann...\n@c0@"
  en: "@a@bⓗIt seems that the only one who can enter Nadiria and rescue Mada from the clutches of evil...\n@c0@"
  es: "@a@bⓕParece que el único que puede entrar en Nadiria y rescatar a Perséfone de las garras del mal...ⓖ\n@c0@"
  fr: "@a@bJ'en suis arrivé à la conclusion que la seule personne qui pourra pénétrer dans Nadiria et tirer Magda des griffes du Mal...\n@c0@"
  it: "@a@bⓕSolo il valoroso che riuscirà a mettere piede a Nadiria potrà salvare Mada dalle forze malvagie che l'hanno rapita!ⓖ\n@c0@"
  ja: "@a@b“私の調べたかぎり\n　魔界に入り　邪悪な手から　妻を\n　取りもどせるのは……\n@c0@"
119:
  de: "@a@b... ist anscheinend derjenige, der die Zenithia-Ausrüstung verwenden kann: der legendäre Held.\n@c0@"
  en: "@a@bⓗ...is he who can make use of the Zenithian Equipment: the legendary hero.\n@c0@"
  es: "@a@bⓕ... es aquel capaz de usar el Equipo de Zenithia: el héroe legendarioⓖ.\n@c0@"
  fr: "@a@b... est celui qui pourra se servir de l'Équipement zénithienⓢ le héros légendaire.\n@c0@"
  it: "@a@bⓕSolo l'Eroe Leggendario può usare l'Equipaggiamento Zenithiano. Solo lui!ⓖ.\n@c0@"
  ja: "@a@b“天空の武器と防具を　身につけた\n　勇者だけなのだ。\n@c0@"
120:
  de: "@a@bIch habe die ganze Welt durchwandert und habe das Zenithiaschwert ausfindig machen können.\n@c0@"
  en: "@a@bⓗI travelled all the world and managed to locate the Zenithian Sword.\n@c0@"
  es: "@a@bⓕRecorrí el mundo y logré localizar la Espada de Zenithiaⓖ.\n@c0@"
  fr: "@a@bAprès avoir parcouru le monde entier, je suis parvenu à trouver l'Épée zénithienne.\n@c0@"
  it: "@a@bⓕHo girato il mondo in lungo e in largo, e sono riuscito a trovare la Spada Zenithiana.ⓖ\n@c0@"
  ja: "@a@b“私は　世界中を旅して\n　天空のつるぎを　見つけることができた。\n@c0@"
121:
  de: "@a@bAber den legendären Helden habe ich nicht gefunden.\n@c0@"
  en: "@a@bⓗBut still I've been unable to locate the legendary hero.\n@c0@"
  es: "@a@bⓕPero aún no he podido dar con el héroe legendarioⓖ.\n@c0@"
  fr: "@a@bEn revanche, je n'ai pas réussi à trouver le héros légendaire.\n@c0@"
  it: "@a@bⓕMa non sono ancora riuscito a scoprire chi sia l'Eroe Leggendario...ⓖ\n@c0@"
  ja: "@a@b“しかし　いまだ\n　伝説の勇者は　見つからぬ……。\n@c0@"
122:
  de: "@a@b%0%a000090, mein Sohn. Du musst die verbleibenden Stücke der Zenithia-Ausrüstung und den legendären Helden finden und meine liebe Magda retten!\n@c0@"
  en: "@a@bⓗ%0%a000090, my son. You must gather the remaining pieces of the Zenithian Equipment, find the legendary hero, and save dear Mada!\n@c0@"
  es: "@a@bⓕ%0%a000090, hijo mío. ¡Debes reunir las restantes piezas del Equipo de Zenithia, hallar al héroe legendario y salvar a mi amada Perséfone!ⓖ.\n@c0@"
  fr: "@a@b%0%a000090, mon fils. Tu dois récupérer les derniers éléments de l'Équipement zénithien, trouver le héros légendaire et sauver ma chère Magdaⓠ\n@c0@"
  it: "@a@bⓕ%0%a000090, devi trovare gli altri pezzi dell'Equipaggiamento Zenithiano, scoprire chi sia l'Eroe Leggendario e salvare la nostra cara Mada!ⓖ\n@c0@"
  ja: "@a@b“%a000090よ！　残りの防具を　さがし出し\n　勇者を見つけ　そして　わが妻マーサを\n　助け出すのだ。\n@c0@"
