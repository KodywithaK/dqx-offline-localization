  de: "@a@b*: Ihr wollt also etwas über den legendären Helden wissen? Dann seid Ihr bei mir genau richtig!\n@c0@"
  en: "@a@b*: You want to know about the legendary hero, do you? Then you've come to the right place!\n@c0@"
  es: "@a@b*: %H0860%XQuieres%YQueréis%Z saber del héroe legendario, ¿eh? ¡Pues este sitio es que ni pintado!\n@c0@"
  fr: "@a@b*ⓢ Vous voulez en savoir plus sur le héros légendaire, c'est çaⓡ Alors, vous avez frappé à la bonne porteⓠ\n@c0@"
  it: "@a@b*: %H0860%XVuoi%YVolete%Z avere informazioni sull'Eroe Leggendario, non è così? %H0860%XHai%YAvete%Z chiesto alla persona giusta!\n@c0@"
  ja: "@a@b＊「なに？　伝説の勇者について\n\t話を聞きたいだと！？\n\tよし！　話してやろう。\n@c0@"
212:
  de: "@a@b*: Vor langer Zeit erstand der Fürst der Unterwelt, Es... Dingsbums, wieder auf und machte sich daran, die Welt zu vernichten.\n@c0@"
  en: "@a@b*: Long, long ago, the Lord of the Underworld, Es...something or other, was resurrected, and set about destroying the world.\n@c0@"
  es: "@a@b*: Hace la tira, el Señor del Inframundo, Es..., como se llamara, va y resucita, y se pone a cargárselo todo.\n@c0@"
  fr: "@a@b*ⓢ Il y a très très longtemps, le Seigneur des Enfers, Es... euh... Es-quelque-chose, fut ressuscité et entreprit de détruire notre monde.\n@c0@"
  it: "@a@b*: Tanto tempo fa, il perfido Signore degli Inferi progettò di distruggere il mondo. Si chiamava Es...\nUhm... No, il nome preciso non lo ricordo.\n@c0@"
  ja: "@a@b＊「だいぶ昔の話だが……　闇の帝王\n\tエスなんたらが復活し　世界を\n\tほろぼそうとしたことがあったんだ。\n@c0@"
213:
  de: "@a@b*: Aber dann hat der legendäre Held ihn mithilfe der Zenithia-Ausrüstung besiegt und uns alle gerettet.\n@c0@"
  en: "@a@b*: But then the legendary hero, with the Zenithian Equipment on his side, defeated him and saved us all.\n@c0@"
  es: "@a@b*: Pero entonces llega el héroe legendario con el Equipo de Zenithia, se lo carga y nos salva a todos.\n@c0@"
  fr: "@a@b*ⓢ Mais le héros légendaire, doté de l'Équipement zénithien, le vainquit et nous sauva tous.\n@c0@"
  it: "@a@b*: Il piano, però, fu sventato dall'Eroe Leggendario che, indossato l'Equipaggiamento Zenithiano, sconfisse il Signore degli Inferi e salvò l'umanità.\n@c0@"
  ja: "@a@b＊「しかし　天空の武器防具を身につけた\n\t勇者がな　そのエスなんたらをたおし\n\t世界を救ったっちゅうことだ。\n@c0@"
214:
  de: "@a@b*: Er hatte vier Ausrüstungsstücke: das Zenithiaschwert, die Zenithiarüstung, den Zenithiaschild und den Zenithiahelm.\n@c0@"
  en: "@a@b*: He had four items altogether: the Zenithian Sword, the Zenithian Armour, the Zenithian Shield and the Zenithian Helm.\n@c0@"
  es: "@a@b*: Tenía cuatro chismes: la Espada, la Armadura, el Escudo y el Yelmo de Zenithia.\n@c0@"
  fr: "@a@b*ⓢ Il avait 4 objets avec luiⓢ l'Épée zénithienne, l'Armure zénithienne, le Bouclier zénithien et le Casque zénithien.\n@c0@"
  it: "@a@b*: L'Eroe Leggendario era equipaggiato con la Spada Zenithiana, l'Armatura Zenithiana, lo Scudo Zenithiano e l'Elmo Zenithiano.\n@c0@"
  ja: "@a@b＊「ちなみに　勇者の武器防具とは\n\t天空の剣　天空のよろい　天空の盾\n\t天空のかぶと　の４つだったそうだ。\n@c0@"
215:
  de: "@a@b*: Wie? Was danach aus ihm wurde?\n@c0@"
  en: "@a@b*: Hm? What happened to him after that?\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Que qué le pasó después?\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Ce qu'il est devenu ensuiteⓡ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici? Mi chiedi%Ydite? Mi chiedete%Z dove sia finito l'Eroe Leggendario dopo aver compiuto quell'impresa?\n@c0@"
  ja: "@a@b＊「え？　そのあとの勇者かい？\n@c0@"
216:
  de: "@a@b*: Manche sagen, er sei nach Zenithia oben im Himmel zurückgekehrt, aber ich weiß nicht, ob das stimmt.\n@c0@"
  en: "@a@b*: Some say he returned to Zenithia up in the sky, but I don't know if that's what really happened or not.\n@c0@"
  es: "@a@b*: Unos dicen que volvió a Zenithia, en el cielo, pero yo qué sé. A saber.\n@c0@"
  fr: "@a@b*ⓢ Certains disent qu'il est reparti à Zénithia, dans les cieux, mais je ne sais pas si c'est effectivement ce qui s'est passé.\n@c0@"
  it: "@a@b*: Qualcuno sostiene che sia tornato su in cielo, a Zenithia.\nIo, però, non ne sarei tanto convinto...\n@c0@"
  ja: "@a@b＊「う～ん　一説には\n\t天空にもどったとも　言われてるけど\n\tそこまでは知らんなあ。\n@c0@"
217:
  de: "@a@b*: Das war alles vor langer Zeit, darum glaube ich nicht, dass er noch lebt.\n@c0@"
  en: "@a@b*: It was all a long time ago, anyway, so I very much doubt he'd still be alive now.\n@c0@"
  es: "@a@b*: Fue hace mogollón de años, así que lo más seguro es que haya palmado.\n@c0@"
  fr: "@a@b*ⓢ Mais ça remonte à très longtemps, maintenant.\nÇa m'étonnerait qu'il soit encore en vie.\n@c0@"
  it: "@a@b*: A essere sincero, potrebbe anche essere morto!\nDopotutto, gli avvenimenti di cui %H0860%Xti%Yvi%Z ho parlato risalgono a moltissimi anni fa.\n@c0@"
  ja: "@a@b＊「まあ　大昔のことだし\n\tどっちにしても　もう生きては\n\tいないと思うぞ。\n@c0@"
218:
  de: "@a@b*: Einen seiner Nachkommen werdet Ihr aber wohl noch irgendwo auftreiben können, wenn Ihr Glück habt.\n@c0@"
  en: "@a@b*: I s'pose you might be able to find one of his descendants somewhere if you were lucky.\n@c0@"
  es: "@a@b*: Si %H0860%Xtienes%Ytenéis%Z suerte, igual %H0860%Xencuentras%Yencontráis%Z a alguno de sus descendientes.\n@c0@"
  fr: "@a@b*ⓢ Si vous avez de la chance, vous pourrez\npeut-être tomber sur l'un de ses descendants.\n@c0@"
  it: "@a@b*: Non escludo, però, che abbia lasciato dei discendenti, da qualche parte.\n㈡\n%H0860%XPotresti%YPotreste%Z provare a cercarli.\nSe esistessero davvero, sarebbero certamente in grado di %H0860%Xdarti%Ydarvi%Z qualche informazione in più...\n@c0@"
  ja: "@a@b＊「勇者の子孫くらいなら\n\tどこかにいるかも知れんがな。\n@c0@"
219:
  de: "@a@b*: Mein Traum ist es, eine legendäre Waffe in die Hände zu bekommen und zum stärksten Krieger der Welt zu werden.\n@c0@"
  en: "@a@b*: It's my dream to get hold of a legendary weapon and become the strongest warrior in the world!\n@c0@"
  es: "@a@b*: ¡Sueño con conseguir un arma legendaria y convertirme en el mayor guerrero del mundo!\n@c0@"
  fr: "@a@b*ⓢ Je rêve de mettre la main sur une arme légendaire et de devenir le plus grand guerrier\nau mondeⓠ\n@c0@"
  it: "@a@b*: Un giorno troverò un'arma leggendaria e diventerò il più forte guerriero del mondo!\n@c0@"
  ja: "@a@b＊「私の夢は　伝説の武器を手に入れて\n\t地上最強の戦士に　なることなのだ。\n@c0@"
220:
  de: "@a@b*: Ich frage mich, wohin es den ollen Weißi und seine Familie wohl verschlagen hat.\n@c0@"
  en: "@a@b*: I wonder where it is old Whitey and his family moved on to.\n@c0@"
  es: "@a@b*: Adónde se habrán marchado el viejo Doptada y su familia...\n@c0@"
  fr: "@a@b*ⓢ Je me demande où ce vieil Al et sa famille ont bien pu déménager.\n@c0@"
  it: "@a@b*: Chissà che fine hanno fatto il vecchio Whitblanche e la sua famiglia...\n@c0@"
  ja: "@a@b＊「ダンカンさんの一家は\n\tどこへ　行ってしもうたん\n\tじゃろうなあ。\n@c0@"
221:
  de: "@a@b*: Ich hatte eigentlich gehofft, ich könnte seine Tochter wiedersehen. Ach, schade!\n@c0@"
  en: "@a@b*: I was hoping to see that daughter of his again. What a shame!\n@c0@"
  es: "@a@b*: Esperaba poder ver a su hija. ¡Es una lástima!\n@c0@"
  fr: "@a@b*ⓢ J'espérais aussi revoir sa fille.\nC'est vraiment dommageⓠ\n@c0@"
  it: "@a@b*: Mi dispiace non averlo potuto incontrare.\nMi avrebbe anche fatto piacere rivedere sua figlia!\n@c0@"
  ja: "@a@b＊「あの　かわいい娘さんにも\n\t会いたかったのう。\n\tざんねんじゃわい……。\n@c0@"
222:
  de: "@a@b*: Tut uns 'nen Gefallen! Tut einfach so, als hättet Ihr uns nich' gesehen, ja?\n@c0@"
  en: "@a@b*: Do us a favour!\nJust pretend you ain't seen us, will ya?\n@c0@"
  es: "@a@b*: ¡%H0860%XHaznos%YHacednos%Z un favor!\n%H0860%XHaz como si no nos hubieras%YHaced como si no nos hubierais%Z visto, ¿vale?\n@c0@"
  fr: "@a@b*ⓢ Faites-nous une fleurⓠ\nDites que vous ne nous avez pas trouvés.\n@c0@"
  it: "@a@b*: Peffavo', %H0860%Xse ci hai visti, fai%Yse ci avete visti, fate%Z finta che non ci %H0860%Xhai%Yavete%Z visti...\n@c0@"
  ja: "@a@b＊「お願いです！\n\tどうか　見のがしてください！\n@c0@"
223:
  de: "@a@b*: Häh? Ihr wollt gar nix von uns? Na dann, der Göttin sei Dank!\n@c0@"
  en: "@a@b*: Eh? You ain't here to come after us?\nWell, thank the Goddess for that then, eh!\n@c0@"
  es: "@a@b*: ¿Eh? ¿Que no %H0860%Xhas%Yhabéis%Z venido a por nosotros?\n¡Jo, pues gracias a la Diosa!\n@c0@"
  fr: "@a@b*ⓢ Heinⓡ Vous n'êtes pas à notre rechercheⓡ\nQue la Déesse soit remerciéeⓠ\n@c0@"
  it: "@a@b*: Come? Non ci %H0860%Xstai%Ystate%Z inseguitando?\nAh, meglio accossì...\n@c0@"
  ja: "@a@b＊「え？　私たちをつかまえに\n\t来たんじゃないのですか！？\n\tああ　よかった……。\n@c0@"
224:
  de: "@a@b*: Ich bin Sigurd, und das is' meine Siglinde. Wir lieben uns. Aber unsere Leut' sin' dagegen. Unsere Herkunft wär verschieden oder was.\n@c0@"
  en: "@a@b*: I'm Dave and this is Vicky. The fing is, we're in love. But our families don't agree wiv it. Say we're not of the same class or somefin'.\n@c0@"
  es: "@a@b*: Yo soy Simón y ella Sonia. El caso es... Nos queremos. Pero nuestras familias no lo aceptan. Que si no somos de la misma clase, que si bla, bla, bla.\n@c0@"
  fr: "@a@b*ⓢ Je m'appelle Serge et voici Jeanne. Nous nous aimons, mais nos familles ne sont pas d'accord.\n㈡\n*ⓢ Elles disent que nous n'appartenons pas à la même classe ou quelque chose dans ce genre.\n@c0@"
  it: "@a@b*: Questa qua è Paola, e io so' Francesco.\nCi amiamo, ma la sua famiglia non ci vogliono farci sposarci. Dice che so' troppo zoticone per lei.\n@c0@"
  ja: "@a@b＊「じつは　私たちは　身分ちがいの\n\t恋をしてしまい……\n@c0@"
225:
  de: "@aSiglinde@bJa. Aber wir können einfach nicht ohne einander leben, darum sind wir weggelaufen.\n@c0@"
  en: "@aVicky@bYes. And yet we couldn't bear to part ways,\nso we ran away togever.\n@c0@"
  es: "@aSonia@bSí. Pero no podíamos separarnos, así que nos fugamos.\n@c0@"
  fr: "@aJeanne@bOui, et nous ne supportions pas l'idée d'être séparés, alors nous nous sommes enfuis.\n@c0@"
  it: "@aPaola@bÈ vero.\nMa ci vogliamo davvero bene, e non abbiamo alcuna intenzione di separarci! Così siamo scappati.\n@c0@"
  ja: "@a@b＊「それでも　はなれられなくて\n\t家出してしまったのです。\n@c0@"
226:
  de: "@aSigurd@bWir wollten sogar zusammen abnippeln. Aber dann ha'm wir das hier gefunden. Jetz' sind wir glücklich und froh wie der Mops im Paletot!\n@c0@"
  en: "@aDave@bWe even thought about doin' ourselves in, like. But then we found this place and thought it wouldn't be a bad pad. We're 'appy as Larry now!\n@c0@"
  es: "@aSimón@bHasta pensamos en suicidarnos, pero descubrimos esto y oye, podía ser una casa bien chula. ¡Y felices como las lombrices!\n@c0@"
  fr: "@aSerge@bNous avons même pensé à nous tuer. Puis nous avons découvert cet endroit. Nous nous sommes dit que ce ne serait pas si mal comme petit nid d'amour.\n㈡\nDepuis, nous sommes très heureuxⓠ\n@c0@"
  it: "@aFrancesco@bSì, sì! Abbiamo fuggiuto! Ci volevamo pure tirare 'nu colpo, poi abbiamo trovato questo posto che ci ha piaciuto e mo' siamo felici assai!\n@c0@"
  ja: "@a@b＊「はじめは　２人で死ぬつもりでしたが\n\tその時　この城を見つけて　ここなら\n\t幸せに　暮らしていけると思いました。\n@c0@"
227:
  de: "@aSiglinde@bEs ist wirklich verrückt, wisst Ihr.\n@c0@"
  en: "@aVicky@bIt's really quite bizarre, you know.\n@c0@"
  es: "@aSonia@bEs de lo más extraño.\n@c0@"
  fr: "@aJeanne@bC'est très étrange, vous savez.\n@c0@"
  it: "@aPaola@bLa vita è davvero strana e imprevedibile, %H0860%Xsai%Ysapete%Z?\n@c0@"
  ja: "@a@b＊「とても　ふしぎなこと\n\tなのですが……\n@c0@"
228:
  de: "@aSiglinde@bAls wir hierherkamen, war es fast, als wollte das Schloss, dass wir bleiben. Als würde es uns irgendwie willkommen heißen.\n@c0@"
  en: "@aVicky@bWhen we first arrived here, it was almost like the castle wanted us to stay. Like it was welcoming us somehow.\n@c0@"
  es: "@aSonia@bCuando llegamos, casi creíamos que el castillo quería que nos quedáramos. Como si nos diera la bienvenida.\n@c0@"
  fr: "@aJeanne@bQuand nous sommes arrivés, c'était comme si le château voulait que nous restions. Comme s'il nous accueillait.\n@c0@"
  it: "@aPaola@bQuando siamo arrivati qui, abbiamo avuto l'impressione che il castello volesse farci restare.\nCi siamo sentiti subito come a casa nostra.\n@c0@"
  ja: "@a@b＊「初めて　このお城に入った時\n\tお城が　私たちを　あたたかく迎えて\n\tくれたような　そんな気がして……。\n@c0@"
229:
  de: "@aSiglinde@bIch kann kaum glauben, dass wir uns je umbringen wollten. Wir könnten gar nicht glücklicher sein.\n@c0@"
  en: "@aVicky@bI can't believe we ever thought about ending it all. We couldn't be happier now.\n@c0@"
  es: "@aSonia@bNo puedo creer que pensáramos en acabar con todo de una vez. No podríamos ser más felices.\n@c0@"
  fr: "@aJeanne@bEt dire qu'on a pensé à mettre fin à nos jours...\r\nNous ne pourrions pas être plus heureux.\n@c0@"
  it: "@aPaola@bE pensare che avevamo deciso di farla finita...\nOra, invece, stiamo scoppiando di felicità!\n@c0@"
  ja: "@a@b＊「死のうと考えたことが\n\tまるでウソのように　今は\n\t幸せですわ。　ぽっ……。\n@c0@"
230:
  de: "@a@bDie Inschrift auf dem Grabstein lautet: \nⓞHier ruht Graf Krypto, dessen Tage leider gezählt waren.ⓟ\n@c0@"
  en: "@a@bThe inscription on the gravestone reads,\nⓗHere lies Count Uptaten, whose number is now sadly upⓘ.\n@c0@"
  es: "@a@bLa inscripción en la lápida reza:\nⓕAquí yace el conde Alverres, víctima de los reveses de la vidaⓖ.\n@c0@"
  fr: "@a@bLa pierre tombale porte l'inscription suivanteⓢ\nⓥCi-gît le comte Karpatt, qui ne compte désormais plus les jours.ⓦ\n@c0@"
  it: "@a@bSulla lapide c'è scritto:\nⓕQui giace il Conte De' Functis. Non contate di rivederlo nel mondo dei vivi...ⓖ\n@c0@"
  ja: "@a@b“エリック王　ここに眠る”\nと　墓石に　きざまれている。\n@c0@"
231:
  de: "@a@bDie Inschrift auf dem Grabstein lautet:\nⓞHier ruht die Frau, die für den Grafen immer die Nummer eins war.ⓟ\n@c0@"
  en: "@a@bThe inscription on the gravestone reads,\nⓗHere lies Miss Count, now sadly out for the countⓘ.\n@c0@"
  es: "@a@bLa inscripción en la lápida reza:\nⓕAquí yace la Condesa, cuya vida dio un triste vuelcoⓖ.\n@c0@"
  fr: "@a@bLa pierre tombale porte l'inscription suivanteⓢ\nⓥCi-gît la comtesse Karpatt, qui elle aussi a eu son compte.ⓦ\n@c0@"
  it: "@a@bL'iscrizione sulla lapide recita:\nⓕQui giace la Contessa De' Functis. Vestevà sempve nei nostvi cuovi.ⓖ\n@c0@"
  ja: "@a@b“ソフィア王妃へ　永遠の愛を”\nと　墓石に　きざまれている。\n@c0@"
232:
  de: "@a@b*: Hier ist es so schön ruhig und entspannend. Aah! Nun ja...\n@c0@"
  en: "@a@b*: This place is so quiet and relaxing. Aah!\nAnyhow...\n@c0@"
  es: "@a@b*: Esto es muy tranquilo y relajante. ¡Aah!\r\nAunque...\n@c0@"
  fr: "@a@b*ⓢ Cet endroit est si calme et si reposant. Aaahⓠ\nEnfin...\n@c0@"
  it: "@a@b*: Questo posto è così calmo e tranquillo...\n@c0@"
  ja: "@a@b＊「ここは　静かで\n\tくつろげますなあ……。\n\tところで……\n@c0@"
233:
  de: "@a@b*: Das ist Kleinhaven. Ihr sucht wohl ein Schiff, was? Tja, da könnt Ihr lange warten.\n@c0@"
  en: "@a@b*: This is Littlehaven. Come here to catch a boat, have ya? I'm afraid you're in for a long wait.\n@c0@"
  es: "@a@b*: Esto es Puerto Securus. %H0860%XVienes%YVenís%Z en busca de un barco, ¿no? Me temo que %H0860%Xte%Yos%Z va a tocar esperar bastante.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue au Petit Havre. Vous voulez prendre un bateau en partanceⓡ Vous risquez d'attendre longtemps. \n@c0@"
  it: "@a@b*: Questa è Cala Disorte.\n%H0860%XTe voi imbarca'%YVe volete imbarca'%Z, eh? Allora me sa che %H0860%Xte%Yve%Z toccherà aspetta' un ber pezzo...\n@c0@"
  ja: "@a@b■宿屋チャートへ\n@c0@"
234:
  de: "@a@b*: Anweisung des Königs von Tifortu, wisst Ihr. Der Hafen darf ab sofort nur auf königlichen Befehl genutzt werden.\n@c0@"
  en: "@a@b*: Orders from the King of Coburg, see. The harbour's only allowed to be used by royal command from now on.\n@c0@"
  es: "@a@b*: Órdenes del rey de Trastámara. Desde ahora solo puede usarse el muelle por decreto real.\n@c0@"
  fr: "@a@b*ⓢ Le roi de Cobourg a donné des ordres.\nDésormais, il faut une autorisation royale pour pouvoir s'amarrer ici.\n@c0@"
  it: "@a@b*: Er porto sta sotto er controllo diretto der Re de Cobburg. Se a lui nunn'je va, 'e navi nun salpeno e nunn'attraccheno.\n@c0@"
  ja: "@a@b＊「ここは　ビスタの港だ。\n\t船に　乗りに来たのかい？\n\tでも　船は　来ないぜっ。\n@c0@"
235:
  de: "@a@b*: Also legen hier keine Schiffe mehr an.\n@c0@"
  en: "@a@b*: So we ain't got no boats comin' in to dock here no more.\n@c0@"
  es: "@a@b*: Así que ya no atracan barcos en el muelle.\n@c0@"
  fr: "@a@b*ⓢ Plus aucun bateau ne vient accoster ici.\n@c0@"
  it: "@a@b*: E siccome adesso sta ner periodo che nunn'je va, da qua nun se parte.\n@c0@"
  ja: "@a@b＊「ラインハット王からの命令で\n\t王家が　必要なとき以外は\n\tこの港を使えないんだよ。\n@c0@"
236:
  de: "@a@b*: Also ehrlich! Wo soll das alles enden? Was in Tifortu los ist, ist eine Schande.\n@c0@"
  en: "@a@b*: Honestly! What is the world coming to?\nThe situation in Coburg is a disgrace.\n@c0@"
  es: "@a@b*: ¡Hay que ver! ¿Adónde vamos a ir a parar?\nLo de Trastámara es una tragedia.\n@c0@"
  fr: "@a@b*ⓢ Sincèrementⓠ Où va-t-onⓡ Je vous le demande.\nLa situation à Cobourg me fait tout simplement honte.\n@c0@"
  it: "@a@b*: Che mondo... Che mondo!\nLa situazione a Coburg è drammatica!\n@c0@"
  ja: "@a@b＊「そんなわけで　どの船も\n\tこのビスタの港には\n\t寄りつかねえって　わけよ。\n@c0@"
237:
  ja: "@a@b＊「まったく　いやな世の中だよ。\n\tラインハットの国は\n\tどうなっちまうのかねえ……。\n@c0@"
