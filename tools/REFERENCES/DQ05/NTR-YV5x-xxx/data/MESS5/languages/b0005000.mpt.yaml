100:
  de: "@a@bEs ist schwer wie Blei! Aber mit etwas Mühe lässt es sich vielleicht bewegen.\n@c0@"
  en: "@a@bIt's as heavy as lead! But it might move with enough encouragement.\n@c0@"
  es: "@a@bPesa como el plomo, pero podría moverse con un poco de fuerza de voluntad.\n@c0@"
  fr: "@a@bElle est extrêmement lourdeⓠ Mais il arrivera\npeut-être à la sortir s'il y met vraiment du sien.\n@c0@"
  it: "@a@bLa lama sembra incollata al suolo, e la spada non si muove di un millimetro.\n%0%a000090 decide di fare un utlimo tentativo...\n@c0@"
  ja: "@a@b剣は　なまりのように　重い！\nしかし　もう少し　がんばれば\nなんとか　引き出せそうだ！\n@c0@"
101:
