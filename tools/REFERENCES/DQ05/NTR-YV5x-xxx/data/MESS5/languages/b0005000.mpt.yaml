  de: "@a@b*: Bitte sehr. Guten Durst!\n@c0@"
  en: "@a@b*: Here you are. Enjoy!\n@c0@"
  es: "@a@b*: Aquí va.\n¡Salud!\n@c0@"
  fr: "@a@b*ⓢ Et voilàⓠ\nÀ la vôtreⓠ\n@c0@"
  it: "@a@b*: Ecco qua!\nSpero che %H0860%Xti%Yvi%Z piaccia.\n@c0@"
  ja: "@a@b＊「はい　どうぞ。\n\tゆっくりして行ってね。\n@c0@"
177:
  de: "@a@b*: Kann ich sonst etwas für Euch tun?\nAh, der legendäre Held? Momentchen!\n@c0@"
  en: "@a@b*: Then what can I do for you?\nThe legendary hero, eh? Just a sec!\n@c0@"
  es: "@a@b*: ¿Entonces qué puedo hacer por ti?\nEl héroe legendario, ¿eh? ¡Un momento!\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce que je peux faire pour vous, alorsⓡ\nLe héros légendaireⓡ Ah, je vois.\n@c0@"
  it: "@a@b*: Allora cosa posso fare per %H0860%Xte%Yvoi%Z?\nChe cosa? L'Eroe Leggendario...?\nUhm...\n@c0@"
  ja: "@a@b＊「じゃあ　どんなご用かしら？\n\tふ～ん　伝説の勇者の話……。\n\tちょっと待ってね。\n@c0@"
178:
  de: "@a@b*: Darüber weiß mein Vater bestens Bescheid. Am besten fragt Ihr ihn selbst.\n@c0@"
  en: "@a@b*: It's my dad who knows all about that.\nWhy don't you go on in and pick his brains?\n@c0@"
  es: "@a@b*: De eso sabe mogollón mi viejo.\n¿Por qué no vas a darle la brasa a él?\n@c0@"
  fr: "@a@b*ⓢ C'est à mon père qu'il faut demander.\nEssayez donc de lui tirer les vers du nez.\n@c0@"
  it: "@a@b*: Io non ne so nulla, ma magari mio padre potrebbe %H0860%Xaiutarti. Dovresti%Yaiutarvi. Dovreste%Z andare a parlare con lui...\n@c0@"
  ja: "@a@b＊「勇者の話なら　お父さんが\n\tくわしいと思うわ。\n\t奥にいるから聞いてみたら？\n@c0@"
179:
