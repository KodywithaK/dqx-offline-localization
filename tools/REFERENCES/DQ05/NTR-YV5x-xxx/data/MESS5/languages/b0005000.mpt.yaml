  en: "@a@b%0%a000090 acquires the Zenithian Sword!\n@c0@"
  es: "@a@b¡%0%a000090 obtiene la Espada de Zenithia!\n@c0@"
  fr: "@a@b%0%a000090 récupère l'Épée zénithienneⓠ\n@c0@"
