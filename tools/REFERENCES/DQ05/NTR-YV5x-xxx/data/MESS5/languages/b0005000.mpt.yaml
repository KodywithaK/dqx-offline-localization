139:
  de: "@a@b*: Ach, das ist eine traurige Geschichte da drüben!\n@c0@"
  en: "@a@b*: What a sorry old state of affairs!\n@c0@"
  es: "@a@b*: Menudo marronazo, %H0860%Xtú,%Y%Z ¿no?\n@c0@"
  fr: "@a@b*ⓢ C'est une situation vraiment horribleⓠ\n@c0@"
  it: "@a@b*: Coburg sta vivendo anni molto travagliati.\n@c0@"
  ja: "@a@b＊「まいっちゃったよなあ……。\n@c0@"
140:
  de: "@a@b*: Ich hatte gehört, dass der verzogene Prinz verschwunden ist und sein Bruder König wurde, also bin ich in Tifortu die Armee eingetreten.\n@c0@"
  en: "@a@b*: I heard about that brat of a prince disappearin' and his brother becomin' king, so I went over to Coburg to sign up.\n@c0@"
  es: "@a@b*: Oí que el príncipe niñato ese se esfumó y que su hermano se hizo rey, así que fui a Trastámara a ver qué se cocía.\n@c0@"
  fr: "@a@b*ⓢ J'avais entendu dire que le prince avait disparu et que c'était son frère qui était devenu roi. C'est pour ça que je suis allé m'engager à Cobourg.\n@c0@"
  it: "@a@b*: Tutto ebbe inizio alcuni anni fa, quando decisi di arruolarmi nell'esercito del Regno.\n㈡\nL'erede al trono era sparito nel nulla, e suo fratello fu incoronato re.\n@c0@"
  ja: "@a@b＊「わがまま王子が　いなくなって\n\t弟が王位をついだと聞いたから\n\tあの城の兵士になったのに……。\n@c0@"
141:
  de: "@a@b*: Aber nun zieht die Mutter des Jungen, die Königinwitwe, alle Fäden! Das wird nicht gut ausgehen, Ihr werdet sehen!\n@c0@"
  en: "@a@b*: But it's actually the kid's mother, the Queen Dowager, who's pullin' all the strings! That place is on the road to ruin, you mark my words!\n@c0@"
  es: "@a@b*: ¿Pero no va y es la Reina Madre, la vieja del mocoso, la que mueve el cotarro? ¡Ese sitio va de cabeza al infierno, %H0860%Xóyeme lo que te digo%Yde verdad de la buena%Z!\n@c0@"
  fr: "@a@b*ⓢ Mais en fait, c'est la mère du gamin, la reine douairière, qui tire les ficellesⓠ Le royaume va aller de mal en pis, vous pouvez me croire.\n@c0@"
  it: "@a@b*: In realtà, il potere finì nelle mani della Regina Madre, e lì è rimasto!\nQuella donna sta portando Coburg alla rovina...\n@c0@"
  ja: "@a@b＊「実権をにぎってるのは　王さまの母親の\n\t太后さまで　これがとんでもないんだ！\n\tあの城も　もう　おしまいだな。\n@c0@"
142:
  de: "@aHarry@b...\n@c0@"
  en: "@aPrince Harry@b............\n@c0@"
  es: "@aFroilán@b...\n@c0@"
  fr: "@aHarry@b............\n@c0@"
