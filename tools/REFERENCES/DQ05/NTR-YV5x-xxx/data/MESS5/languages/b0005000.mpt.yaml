  ja: "@a@b%a000090は　天空のつるぎを\n手に入れた！\n@c0@"
103:
  de: "@a@bAber die Hand, in der er es hält, hat keine Kraft mehr und sein Körper ist schwer wie Blei.\n@c0@"
  en: "@a@bBut the hand he holds it with is drained of strength, and his body feels as heavy as lead.\n@c0@"
  es: "@a@bPero las manos con que la sostiene parecen débiles, y siente como si su cuerpo fuera de plomo.\n@c0@"
  fr: "@a@bMais le bras avec lequel il la tient semble s'être vidé de ses forces et %a000090 se sent si lourd qu'il peut à peine bouger.\n@c0@"
  it: "@a@bImprovvisamente, %a000090 sente che le forze lo abbandonano, e non riesce a impugnare saldamente la spada...\n@c0@"
  ja: "@a@b……しかし　剣をもつ手に\nこれ以上　力が入らず　身体が\nなまりのように　重くなった。\n@c0@"
104:
  de: "@a@bEs sieht nicht so aus, als könnte %a000090 sich mit dem Zenithiaschwert ausrüsten.\n@c0@"
