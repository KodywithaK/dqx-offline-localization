  en: "@a@b%0%a000090 gives an almighty heave and pulls the Zenithian Sword from the ground!\n@c0@"
  es: "@a@b¡%0%a000090 da un fortísimo tirón y arranca la Espada de Zenithia del suelo!\n@c0@"
  fr: "@a@b%0%a000090 rassemble toutes ses forces et sort l'Épée zénithienne du solⓠ\n@c0@"
  it: "@a@b%0%a000090 dà un violento strattone, e riesce a estrarre la Spada Zenithiana!\n@c0@"
