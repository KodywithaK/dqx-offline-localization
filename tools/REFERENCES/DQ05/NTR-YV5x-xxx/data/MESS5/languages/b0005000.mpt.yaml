  en: "@a@b*: My dad knows a thing or two about the legendary hero. Ask him as much as you like.\n@c0@"
  es: "@a@b*: Mi viejo sabe un par de cosillas sobre el héroe legendario, ¿que no? Fríelo a preguntas cuanto quieras.\n@c0@"
  fr: "@a@b*ⓢ Mon père sait quelques petites choses sur le héros légendaire. N'hésitez pas à lui poser toutes vos questions.\n@c0@"
  it: "@a@b*: Può darsi che mio padre sappia qualcosa di quest'Eroe Leggendario.\n%H0860%XTi%YVi%Z consiglio di chiedere a lui.\n@c0@"
  ja: "@a@b＊「勇者の話なら　お父さんが\n\tくわしいと思うわ。\n\tどうぞ　ゆっくりしていってね。\n@c0@"
