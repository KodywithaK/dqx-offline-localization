  es: "@a@b*: Solo %H0860%Xtienes%Ytenéis%Z que adentrar%H0860%Xte%Yos%Z en la cueva con una balsa, y al final %H0860%Xllegarás%Yllegaréis%Z hasta él. ¡Está limado!\n@c0@"
  fr: "@a@b*ⓢ Il faut juuuste prendre un radeau et aller tout au fooond de la caverne. C'est glong, mais vous ne pouvez pas vous perdreⓠ\n@c0@"
