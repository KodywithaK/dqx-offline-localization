143:
  de: "@a@b*: Dieser Kerl ist aus Tifortu abgehauen, wisst Ihr.\n@c0@"
  en: "@a@b*: This fella run away from Coburg, y'know.\n@c0@"
  es: "@a@b*: Este tipo huyó de Trastámara, ¿sab%H0860%Xes%Yéis%Z?\n@c0@"
  fr: "@a@b*ⓢ Ce type a fui Cobourg, vous savez.\n@c0@"
  it: "@a@b*: Quel tipo è scappato da Coburg.\n@c0@"
  ja: "@a@b＊「こいつ　ラインハット城から\n\t逃げだして来たんだぜ。\n@c0@"
144:
  de: "@a@b*: Man hört so dies und jenes, aber ich hatte keine Ahnung, dass es dort schon so schlimm steht.\n@c0@"
  en: "@a@b*: I'd heard a few rumours, but I had no idea the place had got so bad.\n@c0@"
  es: "@a@b*: Había oído rumores, pero no tenía ni idea de que la cosa estuviera así de mal.\n@c0@"
  fr: "@a@b*ⓢ J'avais entendu dire que la vie n'était pas facile là-bas, mais je ne pensais pas que c'était à ce point.\n@c0@"
  it: "@a@b*: Sapevo che il Regno stava attraversando una fase difficile, ma non pensavo che la situazione fosse addirittura disperata!\n@c0@"
  ja: "@a@b＊「ウワサには聞いてたけど　あの城が\n\tそれほど　ひどくなってるとは\n\t知らなかったな。\n@c0@"
145:
  de: "@a@b*: Ich reise umher auf der Suche nach legendären Waffen.\n@c0@"
  en: "@a@b*: I'm travelling the world in search of legendary weapons.\n@c0@"
  es: "@a@b*: Viajo por todo el mundo en busca de armas legendarias.\n@c0@"
  fr: "@a@b*ⓢ Je parcours le monde à la recherche d'armes légendaires.\n@c0@"
  it: "@a@b*: Giro per il mondo alla ricerca di armi leggendarie.\n@c0@"
  ja: "@a@b＊「私は　伝説の武器を求めて\n\t旅をしている。\n@c0@"
146:
  de: "@a@b*: Ich bin nach Wittenhausen gekommen, weil ich von einem Mann gehört habe, der hier wohnt und sich mit Legenden auskennt.\n@c0@"
  en: "@a@b*: I came to Roundbeck because I heard there was a man living here who knows a thing or two about legends.\n@c0@"
  es: "@a@b*: Vine a Golfo Blanco porque había oído que aquí vive un hombre que sabe bastante sobre leyendas.\n@c0@"
  fr: "@a@b*ⓢ Je suis venu à Blanchecombe parce qu'on m'a dit qu'un des habitants connaissait quelques légendes.\n@c0@"
  it: "@a@b*: Sono venuto a Blankenburg proprio per parlare con un esperto di miti e leggende che, stando a quanto mi hanno detto, vive da queste parti...\n@c0@"
  ja: "@a@b＊「この町に　伝説にくわしい男が\n\t住んでいるらしいのだが……。\n@c0@"
147:
  de: "@a@b*: Ich bin eine Wandernonne. Ich kann gewisse Dinge spüren, wisst Ihr.\n@c0@"
  en: "@a@b*: I'm a travelling nun. I can sense certain things, you know.\n@c0@"
  es: "@a@b*: Soy una monja viajera. Puedo presentir ciertas cosas.\n@c0@"
  fr: "@a@b*ⓢ Je suis une religieuse itinérante.\nJe peux sentir certaines choses. Je vous assureⓠ\n@c0@"
  it: "@a@b*: Io sono una suora errante, e giro il mondo per portare a tutti la parola della dea.\n@c0@"
  ja: "@a@b＊「私は　旅の尼。\n\t私には感じることが出来ます。\n@c0@"
148:
  de: "@a@b*: Und gerade jetzt spüre ich, dass das Siegel der Göttin, das die dunkle Welt fernhalten soll, immer schwächer wird.\n@c0@"
  en: "@a@b*: And right now I'm sensing that the seal placed by the Goddess to close off the dark world is gradually weakening.\n@c0@"
  es: "@a@b*: Y ahora mismo presiento que el sello que la Diosa colocó para cerrar el mundo de las tinieblas se debilita.\n@c0@"
  fr: "@a@b*ⓢ À cet instant, je sens que le sceau placé par la Déesse sur l'entrée du monde des ténèbres tend à s'affaiblir.\n@c0@"
  it: "@a@b*: Recentemente ho sognato che il sigillo apposto dalla dea per chiudere il varco per il mondo oscuro si stava disintegrando...\n@c0@"
  ja: "@a@b＊「かつて神が閉ざしたという魔界。\n\tその封印の力が\n\tしだいに弱まりつつあります。\n@c0@"
149:
  de: "@a@b*: Wenn das Siegel bricht, wird die Welt von neuem in finsterste Dunkelheit gestürzt. Brrr!\n@c0@"
  en: "@a@b*: If that seal were to break, the world would once again be plunged into utter darkness. Brrr!\n@c0@"
  es: "@a@b*: Si ese sello se rompiera, el mundo volvería a sumirse en la oscuridad más absoluta. Brrr...\n@c0@"
  fr: "@a@b*ⓢ Si ce sceau venait à disparaître, le monde serait à nouveau plongé dans les ténèbres. Brrrⓠ\n@c0@"
  it: "@a@b*: Per fortuna era solo un incubo! Se quel sigillo fosse davvero infranto, il mondo verrebbe avvolto dalle tenebre per l'eternità. Sarebbe una tragedia!\n@c0@"
  ja: "@a@b＊「もし封印が破られれば　世界は\n\t再び　闇におおいつくされる\n\tことでしょう。　ああ！\n@c0@"
150:
  de: "@a@b*: Ich bin ein alter Freund von Weißi, der damals hier die Herberge geführt hat.\n㈡\n*: Nach all den Jahren wollte ich mal wieder bei ihm vorbeischauen.\n@c0@"
  en: "@a@b*: I'm an old friend of Whitey who used to run the inn. I came back after all these years to pay him a visit.\n@c0@"
  es: "@a@b*: Soy un viejo amigo de Doptada, el que llevaba la posada. Vine tras todos estos años para visitarlo.\n@c0@"
  fr: "@a@b*ⓢ Je suis un vieil ami d'Al, l'ancien propriétaire de l'auberge. Après toutes ces années, je me suis décidé à revenir ici pour lui rendre visite.\n@c0@"
  it: "@a@b*: Sono un vecchio amico del signor Whitblanche, il precedente proprietario della locanda.\n㈡\n*: Era da parecchio che non avevo notizie di lui, così avevo deciso di fargli una visita.\n@c0@"
  ja: "@a@b＊「わしは　昔この宿をやってた\n\tダンカンさんの知り合いでの。\n\t久しぶりに会いに来たのじゃ。\n@c0@"
151:
  de: "@a@b*: Aber er hat die Bude wohl aus gesundheitlichen Gründen verkauft und ist in ein Bergdorf hinter dem Meer gezogen, weit weg von hier.\n@c0@"
  en: "@a@b*: But I'm told he had problems with his health so he sold up and moved to a village in the mountains far across the sea from here.\n@c0@"
  es: "@a@b*: Pero me han dicho que tenía problemas de salud, así que vendió la posada y se fue a una aldea en las montañas, al otro lado del mar.\n@c0@"
  fr: "@a@b*ⓢ Mais on m'a dit qu'il avait eu des problèmes de santé et qu'il avait vendu pour s'installer par-delà les océans, dans un village de montagne.\n@c0@"
  it: "@a@b*: Però ho saputo che ha avuto problemi di salute.\n㈡\n*: Pare che abbia ceduto la sua attività e che si sia trasferito in un villaggio tra i monti, dall'altro lato dell'oceano.\n@c0@"
  ja: "@a@b＊「けど　ダンカンさんは身体を悪くして\n\t宿屋をやめ　はるか海の向こうの\n\t山奥の村に引っこして行ったらしい。\n@c0@"
152:
  de: "@a@b*: Ich hatte eigentlich gehofft, ich könnte seine Tochter wiedersehen. Ach, schade!\n@c0@"
  en: "@a@b*: I was hoping to see that daughter of his again. What a shame!\n@c0@"
  es: "@a@b*: Esperaba poder ver a su hija. ¡Es una lástima!\n@c0@"
  fr: "@a@b*ⓢ J'espérais aussi revoir sa fille.\nC'est vraiment dommageⓠ\n@c0@"
  it: "@a@b*: Mi dispiace non averlo potuto incontrare.\nMi avrebbe anche fatto piacere rivedere sua figlia!\n@c0@"
  ja: "@a@b＊「あの　かわいい娘さんにも\n\t会いたかったのう。\n\tざんねんじゃわい……。\n@c0@"
153:
  de: "@a@b*: Ihr reist umher auf der Suche nach jemandem, sagt Ihr?\n@c0@"
  en: "@a@b*: You're on a journey in search of someone,\r\nyou say?\n@c0@"
  es: "@a@b*: ¿Que %H0860%Xandas%Yandáis%Z buscando a alguien?\n@c0@"
  fr: "@a@b*ⓢ Vous voyagez à la recherche de quelqu'un,\nc'est çaⓡ\n@c0@"
  it: "@a@b*: %H0860%XHai detto che stai%YAvete detto che state%Z cercando qualcuno, non è così?\n@c0@"
  ja: "@a@b＊「誰かを　おさがしの旅ですか？\n@c0@"
154:
  de: "@a@b*: Das erinnert mich an einen König, der vor langer, langer Zeit auf der Suche nach seiner Königin durch die Welt gezogen ist.\n@c0@"
  en: "@a@b*: That reminds me of a king who was travellin' the world lookin' for his queen long, long ago.\n@c0@"
  es: "@a@b*: Eso me recuerda a un rey que se pateó medio mundo buscando a su reina, hace la tira.\n@c0@"
  fr: "@a@b*ⓢ Cela me rappelle un roi qui parcourait le monde à la recherche de sa reine, il y a bien longtemps.\n@c0@"
  it: "@a@b*: Eh, se ne sentono diverse, di storie del genere.\nMolti anni fa seppi di un re che stava cercando la moglie, sparita chissà dove.\n@c0@"
  ja: "@a@b＊「そういえば昔\n\tさらわれた王妃をさがして\n\t旅に出た王さまが　いたとか。\n@c0@"
155:
  de: "@a@b*: Ich habe nichts davon gehört, dass er sie gefunden hätte, also sucht er sie vielleicht bis zum heutigen Tage. Ist das nicht romantisch?\n@c0@"
  en: "@a@b*: I never did hear of him findin' her, so maybe he's still searchin' to this day.\r\nAah, how romantic!\n@c0@"
  es: "@a@b*: No me han dicho nada de que la haya encontrado, así que igual sigue por ahí, el tío.\r\n¡Qué romántico!\n@c0@"
  fr: "@a@b*ⓢ Je n'ai jamais entendu dire qu'il l'avait retrouvée. Il est peut-être toujours à sa recherche.\nComme c'est romantiqueⓠ\n@c0@"
  it: "@a@b*: Per quanto ne so, non è mai riuscito a trovarla.\nMagari quel povero re sta ancora cercando la sua regina...\n@c0@"
  ja: "@a@b＊「その後　見つけたとは聞きませんから\n\t今も　さがしているのでしょう。\n\tロマンティックな話ですね。\n@c0@"
156:
  de: "@a@b*: Mein Sohn war nach Tifortu gezogen, um dort zu arbeiten, aber jetzt ist er wieder zu Hause. \n@c0@"
  en: "@a@b*: My son went off to work in Coburg, but he's back home again now.\n@c0@"
  es: "@a@b*: Mi chaval se fue a trabajar a Trastámara, pero ya ha vuelto.\n@c0@"
  fr: "@a@b*ⓢ Mon fils était parti travailler à Cobourg, mais il est vite revenu.\n@c0@"
  it: "@a@b*: Mio figlio emigrò a Coburg per cercare lavoro, ma adesso è tornato a casa.\n@c0@"
  ja: "@a@b＊「ラインハットに　おつとめに\n\t出ていた　うちの息子が\n\t帰ってきたんだよ。\n@c0@"
157:
  de: "@a@b*: Er hatte den Kopf voller großer Ideen, wie er ein Vermögen machen wollte und so weiter. Tja, daraus ist wohl nichts geworden.\n@c0@"
  en: "@a@b*: He was full of all sorts of big ideas about makin' his fortune and the like. So much for that!\n@c0@"
  es: "@a@b*: Se largó con la cabeza llena de grandes ideas, de pasta y demás chorradas. ¡Y ahí lo tienes!\n@c0@"
  fr: "@a@b*ⓢ Il avait de grands projets. Il comptait faire fortune. Il a vite déchantéⓠ\n@c0@"
  it: "@a@b*: Era pieno di sogni, speranze e buona volontà, ma non è riuscito a fare fortuna in quel posto.\nChe peccato...\n@c0@"
  ja: "@a@b＊「えらくなるまで　帰らないぞ！\n\tなんて言って　家をとび出したのに\n\tなさけないよね。\n@c0@"
158:
  de: "@a@b*: Aber ich freue mich ja, dass er wieder da ist. Eltern sind doch alle gleich, nicht wahr?\n@c0@"
  en: "@a@b*: Still, I must admit it's a relief to have him back. That's the thing with bein' a parent.\n@c0@"
  es: "@a@b*: Aunque me he quedado más tranquila ahora que ha vuelto. Es lo que tiene ser madre.\n@c0@"
  fr: "@a@b*ⓢ Enfin, je dois reconnaître que j'ai été soulagée de le voir revenir. C'est ça quand on est une mèreⓠ\n@c0@"
  it: "@a@b*: Però sono contenta di riaverlo a casa.\nPer una madre, non c'è nulla di meglio che avere il proprio figlio accanto a sé!\n@c0@"
  ja: "@a@b＊「でも　あたしゃ　ホッとしたわ。\n\tこれが　親心なのかねえ……。\n@c0@"
159:
  de: "@a@b*: Bianca, sagt Ihr? Nein, tut mir leid, ich kenne keine Bianca.\n@c0@"
  en: "@a@b*: Bianca, you say? No, I'm afraid I dun't know anyone of that name.\n@c0@"
  es: "@a@b*: ¿Bianca? Ni repajolera idea, no me suena.\n@c0@"
  fr: "@a@b*ⓢ Bianca, vous ditesⓡ\nDésolée, mais je ne connais personne de ce nom.\n@c0@"
  it: "@a@b*: Bianca, %H0860%Xhai%Yavete%Z detto?\nNo, mi spiace.\nNon conosco nessuna ragazza che si chiami così.\n@c0@"
  ja: "@a@b＊「え？　ビアンカ？\n\t知らないね　そんな子は。\n@c0@"
160:
  de: "@a@b*: Mein Mann und ich haben dieses Haus von einem Herrn Weißner gekauft, vor... oh, das muss jetzt sieben Jahre her sein.\n@c0@"
  en: "@a@b*: My old man and I bought this place from a man called Whitaker...ooh, seven years back now, it was.\n@c0@"
  es: "@a@b*: Mi padre y yo le compramos esto a un tipo... Doptada se llamaba. Hará... yo qué sé, serán siete años, ya.\n@c0@"
  fr: "@a@b*ⓢ Mon mari et moi, on a acheté cette auberge à un certain Alba... Ça fait bien 7 ans, maintenant.\n@c0@"
  it: "@a@b*: Io e mio marito abbiamo comprato questo posto circa sette anni fa da un certo signor Whitblanche.\nSì, si chiamava Whitblanche.\n@c0@"
  ja: "@a@b＊「あたしら夫婦は　７年ほど前\n\tダンカンっていう人から　ここを\n\t買いとって　宿を始めたのさ。\n@c0@"
161:
  de: "@a@b*: Bleibt doch über Nacht und nutzt unser Sonderangebot! Wer zwei oder mehr Nächte bleibt, bekommt ein Andenken.\n@c0@"
  en: "@a@b*: Why dun't you stay the night? We've got a special offer on at the moment where you get a souvenir if you stay two nights or more!\n@c0@"
  es: "@a@b*: ¿Por qué no %H0860%Xte quedas%Yos quedáis%Z a dormir aquí? Tenemos una oferta brutal: ¡si te quedas dos noches o más te llevas un recuerdo!\n@c0@"
  fr: "@a@b*ⓢ Pourquoi vous ne passez pas la nuit iciⓡ\nNous avons une offre spéciale en ce moment.\nÀ partir de 2 nuits, on vous offre un souvenir.\n@c0@"
  it: "@a@b*: %H0860%XTi%YVi%Z va di prendere una stanza?\nIn questo periodo abbiamo una promozione: offriamo un omaggio a chi passa due o più notti qui!\n@c0@"
  ja: "@a@b＊「それより　泊まっておゆきよ。\n\t今なら　２泊以上　ご利用の\n\tお客さまに　記念品をプレゼント！\n@c0@"
162:
  de: "@a@b*: Sucht mich auf jeden Fall auf, wenn Ihr zweimal hier übernachtet habt, ja?\n@c0@"
  en: "@a@b*: Make sure you come and see me after two nights stayin' here, won't you?\n@c0@"
  es: "@a@b*: %H0860%XVen%YVenid%Z a verme si %H0860%Xte quedas%Yos quedáis%Z más de una noche.\n@c0@"
  fr: "@a@b*ⓢ Revenez me voir lorsque vous aurez séjourné\n2 nuits ici. N'oubliez pasⓠ\n@c0@"
  it: "@a@b*: %H0860%XTorna%YTornate%Z a parlare con me dopo che %H0860%Xavrai%Yavrete%Z trascorso due notti da noi, d'accordo?\n@c0@"
  ja: "@a@b＊「ぜひ　２回以上お泊りになって\n\t私に声を　かけてちょうだいね。\n@c0@"
163:
  de: "@a@b*: Hm? Ihr habt bereits zweimal übernachtet? Da seid Ihr ja ein richtig guter Kunde!\n@c0@"
  en: "@a@b*: Hm? You've stayed two nights already?\nWhat a good customer you are!\n@c0@"
  es: "@a@b*: ¿Mmm? ¿%H0860%XTe has%YOs habéis%Z quedado ya dos noches?\n¡Así me gusta la clientela!\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Vous avez déjà passé 2 nuits iciⓡ\nQuel%A0110%X bon client%Z%B0110%Xle bonne cliente%Z vous faitesⓠ\n@c0@"
  it: "@a@b*: Allora, vediamo un po'... Sì, %H0860%Xhai%Yavete%Z già passato due notti presso la nostra locanda.\nAverne, di clienti come %H0860%Xte%Yvoi%Z!\n@c0@"
  ja: "@a@b＊「え？　もう　２回以上　ご利用？\n\tまいど　ごひいきに！\n@c0@"
