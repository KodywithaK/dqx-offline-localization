  es: "@a@b*: Y sé que Teudis tenía en la cueva un lugar la lima de ingloptante.\n@c0@"
  fr: "@a@b*ⓢ Et aussi, je sais que Petros avait un endroit à lui auquel il tenait beaucoup dans la gluotte.\n@c0@"
  it: "@a@b*: E so anche che Russel aveva uno slimecondiglio slimegreto nella caverna.\n@c0@"
  ja: "@a@b＊「それから　洞くつの奥に\n\tパパスさんの　大事な部屋が\n\tあったのも　知ってるもん。\n@c0@"
