  es: "@aStefania@b¿Buscas al suo ⓕpadreⓖ, %a000090?\nEntonces date prisa en llegar a casa del alguacil Marcial.\n@c0@"
  fr: "@aPandora@bJe suppose que je peux m'accommoder de cet endroit pour ce soir. Mais tu as intérêt à nous trouver une auberge décente dès demain.\n@c0@"
  it: "@aViola@bChe cosa?!\nIO dovrei dormire QUI?!\n㈡\nPer stavolta passi, caro il mio %a000090, ma fai in modo che domani io abbia una sistemazione degna di me!\n@c0@"
  ja: "@a@bデボラ「今日は　ここでガマンしてあげる。\n\tでも　次は　もう少し\n\tちゃんとした宿を　探してよね。\n@c0@"
327:
  de: "@aGriselda@bBist du etwa auf der Suche nach ihrem ⓞPapaⓟ, %a000090? Falls ja, sollten wir schnell zum Haus dieses Büttels gehen.\n@c0@"
  en: "@aDebora@bAre you looking for her ⓗpaⓘ, %a000090?\nIf you are, then hurry on over to this Bailiff\nBails's place.\n@c0@"
  es: "@aStefania@bAsí que al mostro no le asustan los spaventapasseri... ¡Da igual! ¡Seguro que yo logro aterrarlo y someterlo!\n@c0@"
  fr: "@aPandora@bTu cherches ⓥle pèreⓦ, %a000090ⓡ\nSi c'est le cas, tu ferais bien de te dépêcher d'aller\nchez ce bailli Gruau.\n@c0@"
  it: "@aViola@bHai capito, %a000090?\nSe vogliamo parlare con suo padre, dobbiamo andare a casa di Mastro Brusko.\n@c0@"
  ja: "@a@bデボラ「あんた\n\tその　お父っつぁんに　用なの？\n\t用がないなら　さっさと行くわよ。\n@c0@"
328:
  de: "@aGriselda@bAlso lässt sich das Monster von den Vogelscheuchen nicht ins Bockshorn jagen... Egal. Dann werde ich es in Angst und Schrecken versetzen, bis es sich fügt!\n@c0@"
