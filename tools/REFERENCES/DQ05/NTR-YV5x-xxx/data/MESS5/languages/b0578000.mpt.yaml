  es: "@aStefania@bMa... ¿por qué cree que te has ofrecido a ayudarle? ¿De qué está hablando?\n@c0@"
  fr: "@aPandora@bEn voilà un qui n'est plus dans la course. Mmmⓡ Quelle courseⓡ La course pour devenir l'un de\nmes domestiques, évidemment.\n@c0@"
  it: "@aViola@bNon vorrei tra i miei servitori quel villanzone nemmeno se fosse l'ultimo uomo rimasto al mondo!\n@c0@"
  ja: "@a@bデボラ「はい　失格。\n\tえ？　なにって　しもべ候補のことよ。\n\tさっきの若者　しもべ失格よ。\n@c0@"
330:
  de: "@aGriselda@bWie kommt er denn darauf, dass ich ihm helfen würde? Was denkt sich der Kerl eigentlich?!\n@c0@"
  en: "@aDebora@bWhat makes him think I offered to help him out? What's he blathering on about?\n@c0@"
  es: "@aStefania@bMe parece que vi una grotta al oeste de aquí. Quizás ahí se haya escondido il mostro.\n@c0@"
  fr: "@aPandora@bQu'est-ce qui lui fait croire que je lui ai proposé de l'aiderⓡ Qu'est-ce qu'il raconteⓡ\n@c0@"
  it: "@aViola@bNon ci ho capito un'acca...\n@c0@"
  ja: "@a@bデボラ「この人　私のこと見て\n\t助っ人って言ったわ。　か弱い私を見て。\n\t一体どういうことかしら。\n@c0@"
331:
