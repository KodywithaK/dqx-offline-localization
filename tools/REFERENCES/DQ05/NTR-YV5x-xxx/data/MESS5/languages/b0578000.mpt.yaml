  de: "@aBianca@bDiese alte Frau wirkt recht gelassen. Vielleicht hat sie ja keine Angst.\n@c0@"
  en: "@aBianca@bThat old woman seems relatively calm.\r\nMaybe she en't scared.\n@c0@"
  es: "@aNera@bParece que las personas de este pueblo opinan que %a001210 es una especie di mostro.\n@c0@"
  fr: "@aBianca@bCette vieille femme semble plutôt calme.\r\nPeut-être qu'elle n'a pas peur.\n@c0@"
  it: "@aBianca@bUn porco come animale domestico?!\nChe razza di idea!\n@c0@"
  ja: "@a@bビアンカ「あの　おばあさんは\n\tやけに冷静ね。　私たちが\n\tこわくないのかしら？\n@c0@"
112:
  de: "@aNera@bDie Leute hier im Dorf scheinen %a001210 als eine Art Ungeheuer zu betrachten.\n@c0@"
  en: "@aNera@bThe people here in this village seem to think of %a001210 as some kind of monster.\n@c0@"
  es: "@a%0%a001240@bCómo, ¿que no deberíamos haber permitido que %a001210 nos acompañara? Eso no habría estado bien, ¿verdad?\n@c0@"
  fr: "@aNera@bOn dirait que les gens de ce village considèrent %a001210 comme un monstre.\n@c0@"
  it: "@aNera@bGli abitanti del villaggio sono terrorizzati da %a001210.\n㈡\nAl posto loro, anch'io ne avrei paura: è pur sempre la belva che ha devastato i campi e rubato il cibo del villaggio...\n@c0@"
  ja: "@a@bフローラ「この村の人にとっては\n\t%a001210ちゃんは\n\t化け物なんですね……。\n@c0@"
113:
  de: "@a%0%a001240@bWas denn, hätten wir denn %a001210 etwa zurücklassen sollen? Das hätten wir doch nicht tun können, oder?\n@c0@"
  en: "@a%0%a001240@bWhat, shouldn't we have let %a001210 come with us? No, that wouldn't have been right, would it?\n@c0@"
  es: "@aBianca@bAl menos los críos no tienen miedo ni nada, ¿eh?\n@c0@"
  fr: "@a%0%a001240@bPeut-être qu'on n'aurait pas dû laisser %a001210\nnous accompagner. Non, ça n'aurait pas été juste, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001240@bForse non avremmo dovuto portare %a001210 con noi... Ma no! Cosa dico?\nQuesta bestiolina è amica nostra!\n@c0@"
  ja: "@a@b%a001240「%a001210を\n\t仲間にしちゃ　いけなかったの？\n\tそんなこと　ないよね？\n@c0@"
114:
  de: "@aBianca@bZumindest die Kinder lassen sich von der ganzen Geschichte nicht aus der Ruhe bringen!\n@c0@"
  en: "@aBianca@bAt least kids en't phased by it all, eh?\n@c0@"
  es: "@aNera@bSembra que ese ragazzo te ve como a una especie de héroe, %a000090. ¡Ji, ji, ji!\n@c0@"
  fr: "@aBianca@bAu moins, les enfants ne semblent pas très intimidés par tout ça, heinⓡ\n@c0@"
  it: "@aBianca@bI ragazzini sembrano più incuriositi che spaventati...\n@c0@"
  ja: "@a@bビアンカ「子どもは　むじゃきで\n\tいいわね……。\n@c0@"
115:
  de: "@aNera@bFür diesen kleinen Jungen scheinst du ja fast so etwas wie ein Held zu sein, %a000090. He he he!\n@c0@"
  en: "@aNera@bLooks like you're something of a hero in that little boy's eyes, %a000090. He he he!\n@c0@"
  es: "@a%0%a001240@bAl niño no le damos miedo, ¡pero sí a los adultos!\n@c0@"
  fr: "@aNera@bOn dirait qu'aux yeux de ce petit garçon, tu as quelque chose d'un héros, %a000090. Hi hi hi.\n@c0@"
  it: "@aNera@bQuel bimbo ti considera una specie di eroe, %a000090, e ha ragione! È merito tuo, se questa gente si è liberata dalla minaccia del ⓕmostroⓖ.\n@c0@"
  ja: "@a@bフローラ「あなたは　あの子にとっての\n\tヒーローに　なってしまったかも\n\t知れませんわね。　うふふ。\n@c0@"
116:
  de: "@a%0%a001240@bDer kleine Junge hat keine Angst vor uns, bloß die Erwachsenen!\n@c0@"
  en: "@a%0%a001240@bThe little boy isn't scared of us, but the adults are!\n@c0@"
  es: "@a%0%a001250@b¿Domador? ¿Qué quiere decir?\n@c0@"
  fr: "@a%0%a001240@bLe petit garçon n'a pas peur de nous, alors que\nles adultes, ouiⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, hai visto?\nI bambini sono meno spaventati degli adulti.\n@c0@"
  ja: "@a@b%a001240「小さい子は　ボクたちのこと\n\tこわがらないんだね。\n@c0@"
117:
  de: "@a%0%a001250@bBändigerer? Was meint er denn?\n@c0@"
  en: "@a%0%a001250@bTamerer? What does he mean?\n@c0@"
  es: "@aBianca@bCreo que será mejor que evitemos este sitio a partir de ahora, ¿vale?\n@c0@"
  fr: "@a%0%a001250@bDresseurⓡ Qu'est-ce qu'il veut direⓡ\n@c0@"
  it: "@a%0%a001250@bCredo che i bambini del villaggio abbiano capito che %a001210 non era un mostro feroce, ma solo una povera bestiolina affamata...\n@c0@"
  ja: "@a@b%a001250「お兄ちゃんって\n\tお父さんのこと？\n@c0@"
118:
  de: "@aBianca@bVielleicht sollten wir um dieses Dorf in Zukunft lieber einen Bogen machen, was?\n@c0@"
  en: "@aBianca@bMaybe it'd be better if we steered clear of this place from now on, eh?\n@c0@"
  es: "@aNera@b¡Oh, cielos! Parece que no somos benvenutti aquí. Creo que deberíamos esfumarnos.\n@c0@"
  fr: "@aBianca@bPeut-être qu'il vaudrait mieux qu'on débarrasse le plancher, maintenant, tu ne crois pasⓡ\n@c0@"
  it: "@aBianca@bQualcosa mi dice che d'ora in poi sarà meglio tenersi alla larga da questo villaggio...\n@c0@"
  ja: "@a@bビアンカ「%a000090　私　思うんだけど…\n\tもう　この村には\n\t来ないほうが　いいんじゃない？\n@c0@"
119:
  de: "@aNera@bOh je. Hier werden wir ja nicht gerade mit offenen Armen aufgenommen. Vielleicht sollten wir uns hier ein wenig rar machen.\n@c0@"
  en: "@aNera@bOh dear. We don't seem all that welcome here. I think we should probably make ourselves scarce.\n@c0@"
  es: "@a%0%a001240@bNo quiero quedarme aquí más tiempo, papá.\n@c0@"
  fr: "@aNera@bEh bien. Nous n'avons plus l'air d'être les bienvenus ici. Je crois que nous devrions plier bagages.\n@c0@"
  it: "@aNera@bMi pare di capire che non siamo più i benvenuti. Andiamocene, prima che ci inseguano col forcone!\nE stavolta non sarebbe solo un modo di dire!\n@c0@"
  ja: "@a@bフローラ「なんだか　村の方たちに\n\t申しわけないですわ……。\n\t村を　出ましょうよ。\n@c0@"
120:
  de: "@a%0%a001240@bIch möchte weg hier, Papa.\n@c0@"
  en: "@a%0%a001240@bI don't want to stay here any more, Dad.\n@c0@"
  es: "@aBianca@b¡Qué tipo más insolente! Cree que trajiste a %a001210 expresamente para asustar a los aldeanos, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bJe ne veux plus rester ici, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, andiamocene.\nQuesto posto non mi piace più!\n@c0@"
  ja: "@a@b%a001240「お父さん…\n\tボク　もう　この村にいたくないよ。\n@c0@"
121:
  de: "@aBianca@bWas für ein grässlicher Mann! Der glaubt anscheinend, du hättest %a001210 überhaupt erst dazu angestiftet, das Dorf zu terrorisieren.\n@c0@"
  en: "@aBianca@bWhat a horrible man! It looks like he thinks you got %a001210 to terrorise the village from square one.\n@c0@"
  es: "@aNera@b¡Qué grosero, pensar algo così di te! ¡Es una persona ruin!\n@c0@"
  fr: "@aBianca@bQuel horrible bonhommeⓠ Apparemment, il pense que c'est toi qui a ordonné à %a001210 de terroriser le village depuis le début.\n@c0@"
  it: "@aBianca@bChe razza di malfidato!\nCrede che eravamo stati noi a ordinare a %a001210 di terrorizzare il villaggio!\n@c0@"
  ja: "@a@bビアンカ「あの人　ひどいわ。\n\tまるで　%a000090が　%a001210を使って\n\t村を　おそわせたみたいじゃない！\n@c0@"
122:
  de: "@aNera@bWie unhöflich von ihm, so etwas von dir zu denken! Was für ein übler Charakter!\n@c0@"
  en: "@aNera@bHow rude of him to think something like that of you! What a nasty character!\n@c0@"
  es: "@a%0%a001240@bPero si hicimos todo ese trayecto...\nadentrándonos en la cueva...\n@c0@"
  fr: "@aNera@bC'est très mal élevé de sa part de penser une chose pareille de toiⓠ Quel vilain personnageⓠ\n@c0@"
  it: "@aNera@bGrazie per la riconoscenza, eh?!\nMa come si permette di pensare una cosa del genere?!\n@c0@"
  ja: "@a@bフローラ「かんちがい　とはいえ\n\tあのように　%a000090さんのことを\n\tぶじょくするなんて　許せませんわ！\n@c0@"
123:
  de: "@a%0%a001240@bAber wir sind doch bis ganz zur Höhle gelaufen... Und bis in die Höhle rein...\n@c0@"
  en: "@a%0%a001240@bBut we went all that way...\nRight down inside the cave...\n@c0@"
  es: "@a%0%a001240@bY además...\n@c0@"
  fr: "@a%0%a001240@bMais on est allés jusque là-bas...\nEt on est entrés dans la grotte...\n@c0@"
  it: "@a%0%a001240@bSiamo andati fino alla caverna...\n@c0@"
  ja: "@a@b%a001240「グルって……。\n\tボクたち　がんばって\n\t洞くつの奥まで行って……\n@c0@"
124:
  de: "@a%0%a001240@bUnd wir...\n@c0@"
  en: "@a%0%a001240@bAnd we...\n@c0@"
  es: "@a%0%a001240@b...\n@c0@"
  fr: "@a%0%a001240@bEt on...\n@c0@"
  it: "@a%0%a001240@bLi abbiamo liberati dal mostro...\n@c0@"
  ja: "@a@b%a001240「そしたら　そこに……。\n@c0@"
125:
  de: "@a%0%a001240@b...\n@c0@"
  en: "@a%0%a001240@b............\n@c0@"
  es: "@a%0%a001250@b¡Increíble! ¿Cómo puede ser tan desagradecido?\n@c0@"
  fr: "@a%0%a001240@b............\n@c0@"
  it: "@a%0%a001240@bE adesso pensano che li abbiamo imbrogliati?!\nChe malpensanti che sono!\n@c0@"
  ja: "@a@b%a001240「…………。\n@c0@"
126:
  de: "@a%0%a001250@bDas glaube ich ja nicht! Wie kann er denn nur so undankbar sein?\n@c0@"
  en: "@a%0%a001250@bUnbelievable! How could he be so ungrateful?\n@c0@"
  es: "@aSancho@bPuede que un día este señor y sus cuates lo lleguen a entender.\n@c0@"
  fr: "@a%0%a001250@bC'est incroyableⓠ Comment peut-il être aussi ingratⓡ\n@c0@"
  it: "@a%0%a001250@bNon ci posso credere!\nNon voglio avere più niente a che fare con queste persone!\n@c0@"
  ja: "@a@b%a001250「む～～っ！\n\tあのおじさん　ひどいの……\n\tうえ～～ん。\n@c0@"
127:
  de: "@aSancho@bVielleisst werden dieser Señor und seine Amigos es eines Tages verstehen.\n@c0@"
  en: "@aSancho@bMaybe one day, thees señor and hees amigos, they gonna understand.\n@c0@"
  es: "@aSancho@bPero ahorita nomás están enfadados porque sus cultivos están hechos un desastre. Es mejor que nos marchemos.\n@c0@"
  fr: "@aSancho@bPeut-être qu'oun jour, ce señor et ses amigos,\r\nils comprendront.\n@c0@"
  it: "@aSancho@bChico, pienso que un día capiranno que no l'abbiamo embrogliatos...\n@c0@"
  ja: "@a@bサンチョ「いつか　きっと\n\tわかってもらえますよ。\n@c0@"
128:
  de: "@aSancho@bAber jetzt sind sie nur wütend, weil ihre Felder verwüstet und ihre Ernten vernisstet sind. Wir gehen besser.\n@c0@"
  en: "@aSancho@bBut now they are just angry because their fields, they are een a mess. Ees better we go now.\n@c0@"
  es: "@aAlazar@b¡Basta! ¡Nadie habla así al rey %a000090! ¡Quisiera ponerlo en su sitio, Majestad!\n@c0@"
  fr: "@aSancho@bM-Mais pour le moment, ils sont juste en c-c-colère\r\nà cause de leurs champs r-ravagés. On f-ferait mieux de s'en aller.\n@c0@"
  it: "@aSancho@bPerò ahora sono ancoras troppos arrabbiatos.\nSarebbe inutiles cercare de espiegare como está realmentes la faccendas...\n@c0@"
  ja: "@a@bサンチョ「長年　畑を荒らされて\n\tみんな　気が立ってるんです。\n\tねっ　今は　行きましょう？\n@c0@"
129:
  de: "@aOtto@bDas reicht! So redet keiner mit König %a000090! Dem würd' ich gern ein paar Manieren beibringen, Eure Majestät!\n@c0@"
  en: "@aTuppence@bEnough! No one speaks to King %a000090 like that! I'd like to cut him down to size, Your Majesty!\n@c0@"
  es: "@aBianca@bEsto de verdad que me hunde, ¿sabes?\n@c0@"
  fr: "@aInnocent@bAssezⓠ Personne ne parle au roi %a000090\nsur ce tonⓠ J'aimerais lui rabattre son caquet,\nVotre Majestéⓠ\n@c0@"
  it: "@aSimon@bNon permetterò che ci si rivolga a re %a000090 in questo modo! Maestà, col suo permesso, vorrei mozzare la lingua a questo marrano!\n@c0@"
  ja: "@a@bピピン「くっ！　%a000090王に\n\tなんたる　ぶじょく！\n\tたたっ斬ってやりたいです……！\n@c0@"
130:
  de: "@aBianca@bJetzt ist mir ganz mies zumute.\n@c0@"
  en: "@aBianca@bI feel really down in the dumps now.\n@c0@"
  es: "@aNera@bSembra que va a ser molto difficile hacer que estas personas comprendan la situación.\n@c0@"
  fr: "@aBianca@bJ'ai vraiment le moral dans les chaussettes, maintenant.\n@c0@"
  it: "@aBianca@bLe apparenze sono contro di noi...\n@c0@"
  ja: "@a@bビアンカ「私　なんだか\n\t悲しくなってきちゃったわ……。\n@c0@"
131:
  de: "@aNera@bEs wird ein schönes Stück Arbeit werden, diese Leute dazu zu bringen, die Situation zu verstehen.\n@c0@"
  en: "@aNera@bIt looks like it'll be an uphill struggle trying to get these people to understand the situation.\n@c0@"
  es: "@a%0%a001240@b¿Tan raro es llevar un monstruo?\n@c0@"
  fr: "@aNera@bCe sera une bataille de longue haleine pour essayer de faire comprendre la situation à ces gens.\n@c0@"
  it: "@aNera@bCredo sia impossibile convincere la gente del villaggio che %a001210 non è un mostro cattivo e che non gli abbiamo ordinato di devastare i campi...\n@c0@"
  ja: "@a@bフローラ「やはり　村の人全員に\n\tわかってもらうのは\n\tむずかしそうですわね……。\n@c0@"
132:
  de: "@a%0%a001240@bIst es denn wirklich so merkwürdig, ein Monster bei sich zu haben?\n@c0@"
  en: "@a%0%a001240@bIs it really so weird to have a monster with you?\n@c0@"
  es: "@a%0%a001250@bNo es una bestia. ¡Es %a001210!\n@c0@"
  fr: "@a%0%a001240@bC'est vraiment si bizarre d'avoir un monstre\navec soiⓡ\n@c0@"
  it: "@a%0%a001240@bNon avevo idea che avere un mostro per amico potesse procurare tanti guai...\n@c0@"
  ja: "@a@b%a001240「魔物たちと\n\t友だちになれるのって\n\tそんなに　変なのかな……？\n@c0@"
133:
  de: "@a%0%a001250@bDas ist kein Löwenvieh. Das ist %a001210!\n@c0@"
  en: "@a%0%a001250@bHe's not a beast. He's %a001210!\n@c0@"
  es: "@aAlazar@b¡Siempre igual! ¡Esta gente rara vez pone un pie afuera, y sin embargo nos han visto andando por ahí con %a001210!\n@c0@"
  fr: "@a%0%a001250@bC'est pas une bestiole. C'est %a001210ⓠ\n@c0@"
  it: "@a%0%a001250@b%0%a001210 non è un mostro cattivo!\n@c0@"
  ja: "@a@b%a001250「化け物じゃないもん。\n\t%a001210ちゃん　だもん……。\n@c0@"
134:
  de: "@aOtto@bTypisch! Die Leute hier tun kaum einen Schritt aus dem Dorf hinaus, aber natürlich hat uns prompt jemand mit %a001210 herumlaufen sehen!\n@c0@"
  en: "@aTuppence@bTypical! The people here hardly ever take a step outside, and yet they've seen us walking around with %a001210!\n@c0@"
  es: "@aBianca@b¡Ni siquiera dijimos que queríamos ese maldito espantapájaros!\n@c0@"
  fr: "@aInnocent@bBen voyonsⓠ Les gens d'ici ne mettent jamais\nle nez hors du village et ils nous ont quand même\nvus avec %a001210ⓠ\n@c0@"
  it: "@aSimon@bMaestà, bisogna comunque riconoscere che è alquanto inusuale andare in giro in compagnia di un Koguar...\n@c0@"
  ja: "@a@bピピン「あんまり　外を出歩かなさそうな\n\t連中なのに　まったく\n\tこういうときばっかり……！\n@c0@"
135:
  de: "@aBianca@bWir haben nicht mal gesagt, dass wir die blöde Vogelscheuche haben wollten!\n@c0@"
  en: "@aBianca@bWe didn't even say we wanted the\r\nstupid scarecrow!\n@c0@"
  es: "@aNera@bEstas personas veramente nos tienen muchísimo miedo, ¿verdad?\n@c0@"
  fr: "@aBianca@bOn n'a même pas dit qu'on le voulait, leur stupide épouvantailⓠ\n@c0@"
  it: "@aBianca@bLo spaventamostri?\nE che ci facciamo con uno spaventamostri?!\n@c0@"
  ja: "@a@bビアンカ「かかしのことなんて\n\tなんにも　言っていないのにね……。\n@c0@"
136:
  de: "@aNera@bDie Leute hier haben wirklich eine Todesangst vor uns, nicht?\n@c0@"
  en: "@aNera@bThe people here really are petrified of us,\r\naren't they?\n@c0@"
  es: "@a%0%a001240@b¿Eh? ¿Nos podemos quedar el horrorizacuervos? ¿De verdad?\n¡Yujuu!\n@c0@"
  fr: "@aNera@bLes gens d'ici sont vraiment pétrifiés quand ils nous voient, heinⓡ\n@c0@"
  it: "@aNera@bDeve avere una gran paura di noi, per aver deciso di regalarci il suo ⓕpregiatissimoⓖ spaventamostri pur di non vederci più!\n@c0@"
  ja: "@a@bフローラ「なんだか　すごく\n\tおそれられていますわね　私たち。\n@c0@"
137:
  de: "@a%0%a001240@bHäh? Wir kriegen die Schreckensscheuche? Wirklich? Jippieh!\n@c0@"
  en: "@a%0%a001240@bHuh? We can have the terrorcrow? Really?\nWahoo!\n@c0@"
  es: "@a%0%a001240@bBueno, me gustaría que me entusiasmara pero, con lo malos que han sido todos, se le quitan a uno las ganas.\n@c0@"
  fr: "@a%0%a001240@bHeinⓡ On peut prendre l'épouvanteurⓡ Vraimentⓡ Youpiⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, davvero possiamo prendere lo spaventamostri?\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「えっ？\n\tかかし　持ってっていいの？\n\tやった～！\n@c0@"
138:
  de: "@a%0%a001240@bTja, ich wünschte, ich könnte mich so richtig darüber freuen, aber dass die Leute hier so gemein zu uns sind, hat mir irgendwie die ganze Freude verdorben.\n@c0@"
  en: "@a%0%a001240@bWell, I wish I could get excited about it, but with everyone being so mean, it's kind of taken the enjoyment out of it.\n@c0@"
  es: "@a%0%a001250@b¡No, gracias! ¡No queremos nada de ti!\n@c0@"
  fr: "@a%0%a001240@bEnfin, j'aurais sans doute pu être encore plus enthousiaste, mais vu que tout le monde a été\ntrès méchant, ça gâche un peu le plaisir.\n@c0@"
  it: "@a%0%a001240@bPerò il modo in cui ci tratta questa gente non è forte per niente!\n@c0@"
  ja: "@a@b%a001240「……なんて\n\tよろこべるような　気分じゃないよ。\n@c0@"
139:
  de: "@a%0%a001250@bNein, vielen Dank auch! Von Euch wollen wir gar nichts haben!\n@c0@"
  en: "@a%0%a001250@bNo thank you! We don't want anything from you!\n@c0@"
  es: "@aBianca@bSí, es un espantapájaros espantoso.\r\nPreferiría no tocarlo si lo puedo evitar, ¿sabes?\n@c0@"
  fr: "@a%0%a001250@bNon, merciⓠ On ne veut rien qui vienne de vousⓠ\n@c0@"
  it: "@a%0%a001250@bIo non voglio lo spaventamostri!\nVoglio che si scusino con noi e con %a001210!\n@c0@"
  ja: "@a@b%a001250「こっちこそ　おことわりなの！\n\tこんな村　来るんじゃなかった……。\n@c0@"
140:
  de: "@aBianca@bTja, das ist wirklich eine Vogelscheuche zum Fürchten. Die würde ich lieber nicht anfassen, wenn's nicht sein muss.\n@c0@"
  en: "@aBianca@bYeah, it's a scary-lookin' scarecrow, alright.\r\nI'd rather not touch it unless I have to.\n@c0@"
  es: "@aNera@bEse espantapájaros veramente no da tanto miedo cuando una se acostumbra. Desde luego, tiene personalità.\n@c0@"
  fr: "@aBianca@bC'est sûr qu'il fiche la frousse, leur épouvantail.\r\nJe préférerais ne pas avoir à le toucher, à moins\r\nd'y être obligée.\n@c0@"
  it: "@aBianca@bQuesto spaventamostri è orribile!\nMa perché mi fa tanta impressione, eh?\nSono una donna, io, mica un mostro!\n@c0@"
  ja: "@a@bビアンカ「う～ん…\n\tかなり　こわい顔の　かかしよね。\n\tあんまり　さわりたくないかも。\n@c0@"
141:
  de: "@aNera@bDiese Vogelscheuche ist gar nicht mehr so Furcht einflößend, wenn man sich erst mal an sie gewöhnt hat. Auf jeden Fall hat sie Charakter.\n@c0@"
  en: "@aNera@bThat scarecrow's not so scary once you get used to it. At least it has a bit of character.\n@c0@"
  es: "@a%0%a001240@bVámonos, papá.\n@c0@"
  fr: "@aNera@bUne fois qu'on s'y est habitué, il ne fait plus si peur, cet épouvantail. Au moins, il est un peu original.\n@c0@"
  it: "@aNera@bPiù lo guardo, più lo spaventamostri mi sembra simpatico.\nNon mi spiacerebbe averne uno in giardino, sai?\n@c0@"
  ja: "@a@bフローラ「このかかし…\n\t見なれると　こわくないですわね。\n\t味があって　かわいいですわ。\n@c0@"
142:
  de: "@a%0%a001240@bGehen wir, Papa.\n@c0@"
  en: "@a%0%a001240@bLet's get going, Dad.\n@c0@"
  es: "@aSancho@bMmm... Verás, cada vez que mire ese espantapájaros me acordaré de este día y de todito lo que sucedió aquí.\n@c0@"
  fr: "@a%0%a001240@bAllons-y, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, andiamo via.\n@c0@"
  ja: "@a@b%a001240「さあ　行こう。　お父さん……。\n@c0@"
143:
  de: "@aSancho@bHmm... Weißt du, immer wenn iss mir jetzt diese Schreckensscheusse angucke, werde iss an diesen Tag denken und an alles, was hier passiert ist.\n@c0@"
  en: "@aSancho@bHmm... You know, whenever I look at thees escarecrow now, I gonna remember thees day\r\nand everytheeng that happened here.\n@c0@"
  es: "@aBianca@bEsto ha resultado un poco desagradable, ¿sabes? Pero está bien que nos hayamos reunido con %a001210.\n@c0@"
  fr: "@aSancho@bMmm... Tu sais, chaque fois que je r-regarderai cet épouvantail, m-maintenant, je repenserai à ce qui s'est passé ici.\n@c0@"
  it: "@aSancho@bChico, pienso que ce recuerderemo de esta avventura a Punta Campestre por un bel pezzos...\n@c0@"
  ja: "@a@bサンチョ「ふう…　このかかしを見るたびに\n\t今日のことを　思い出しそうですねえ。\n@c0@"
144:
  de: "@aBianca@bDas hat ja gar kein gutes Ende genommen, was? Immerhin ist es schön, %a001210 wieder bei uns zu haben.\n@c0@"
  en: "@aBianca@bThis has turned out a bit nasty, eh? Still, it's nice to have bin reunited with %a001210.\n@c0@"
  es: "@aNera@bEstá en estado de shock porque siente que le has traicionado. Ma espero que en algún momento se le pase.\n@c0@"
  fr: "@aBianca@bTout ça s'est plutôt mal fini, heinⓡ Mais c'est quand même une bonne chose d'avoir retrouvé %a001210.\n@c0@"
  it: "@aBianca@bMi spiace che le cose siano andate in questo modo...\nBeh, perlomeno abbiamo ritrovato %a001210...\n@c0@"
  ja: "@a@bビアンカ「あと味の悪いことに\n\tなっちゃったわね。　%a001210ちゃんに\n\tまた会えたのは　うれしかったけど。\n@c0@"
145:
  de: "@aNera@bEr ist nur enttäuscht, weil er glaubt, du hättest ihn betrogen. Sicher besinnt er sich bald eines Besseren und vertraut uns wieder.\n@c0@"
  en: "@aNera@bHe's in shock because he feels like you must have betrayed him. Hopefully he'll come round and\r\ntrust us sooner or later, though.\n@c0@"
  es: "@a%0%a001240@b¡Argh! Esto empieza a fastidiarme de verdad, papá.\n@c0@"
  fr: "@aNera@bIl est sous le choc parce qu'il pense que tu l'as trahi. Espérons qu'il finira par changer d'avis et par nous croire, un jour ou l'autre.\n@c0@"
  it: "@aNera@bSono dispiaciuta che gli abitanti di Punta Campestre non si fidino più di noi. Forse in futuro capiranno come sono andate davvero le cose...\n@c0@"
  ja: "@a@bフローラ「あなたを　信用していた分\n\tショックが　大きかったのでしょう。\n\tいずれ　きっとわかってもらえますわ。\n@c0@"
146:
  de: "@a%0%a001240@bAah! Allmählich werd' ich richtig böse, Papa!\n@c0@"
  en: "@a%0%a001240@bArgh! This is really starting to annoy me, Dad!\n@c0@"
  es: "@aSancho@bNo nos conviene quedarnos aquí ahorita.\nLa gente no se fía de nosotros.\n@c0@"
  fr: "@a%0%a001240@bGrrrⓠ Ça commence vraiment à m'énerver, papaⓠ\n@c0@"
  it: "@a%0%a001240@bOra comincio davvero a innervosirmi!\nMa come si permette di parlarci in questo modo?!\n@c0@"
  ja: "@a@b%a001240「お父さん\n\tボク　くやしいよ……！\n@c0@"
147:
  de: "@aSancho@bWir sollten nisst länger hier bleiben. Die Leute, sie haben kein Vertrauen mehr in uns.\n@c0@"
  en: "@aSancho@bEes no good for us to estay here now.\nThe people, they can no trust us.\n@c0@"
  es: "@aBianca@bPreferiría devolver el dinero que nos dio el alguacil, ¿no te parece?\n@c0@"
  fr: "@aSancho@bÇa n'est p-pas oune bonne chose de r-rester ici, maintenant. Les gens ne nous f-font plus confiance.\n@c0@"
  it: "@aSancho@bChico, lascia estare.\nAhora es imposible convincere estas personas que no l'abbiamo engannatas. Vamonos, chico.\n@c0@"
  ja: "@a@bサンチョ「今は　この村にいても\n\tいやな思いをするだけです。\n\tここは　だまって去りましょう。\n@c0@"
148:
  de: "@aBianca@bIch würde Büttel Bert sein Geld lieber zurückgeben, du nicht?\n@c0@"
  en: "@aBianca@bI'd rather just give back the money the Bailiff give us, wouldn't you?\n@c0@"
  es: "@aNera@bNo hay forma di parlare con estas personas. Si nos dejasen explicarnos...\n@c0@"
  fr: "@aBianca@bJe préfèrerais tout simplement rendre l'argent que le bailli nous a donné, pas toiⓡ\n@c0@"
  it: "@aBianca@bSono tentata di non accettare la ricompensa, sai?\nPreferirei restituirla a questo villano.\n@c0@"
  ja: "@a@bビアンカ「村長さんから　もらった　\n\tお金を　つき返してやりたいわね。\n@c0@"
149:
  de: "@aNera@bMit diesen Leuten kann man einfach nicht reden. Wenn sie uns nur mal ausreden lassen würden.\n@c0@"
  en: "@aNera@bThere's no talking to these people. If only they'd give us the chance to explain.\n@c0@"
  es: "@a%0%a001240@b¡Así no es! ¡No lo entiende!\n@c0@"
  fr: "@aNera@bImpossible de parler à ces gens. Si seulement ils nous laissaient nous expliquer.\n@c0@"
  it: "@aNera@bCerta gente ha la testa più dura di una pietra!\nNon vuole proprio saperne di ascoltarci!\n@c0@"
  ja: "@a@bフローラ「まるで　言葉の通じない人と\n\t話をしているみたいですわ。\n\t信じてもらえないってツライですわね。\n@c0@"
150:
  de: "@a%0%a001240@bDas war's noch nicht! Er versteht es einfach nicht!\n@c0@"
  en: "@a%0%a001240@bThat's not the end of it! He doesn't understand!\n@c0@"
  es: "@a%0%a001250@bQué... (snif) Qué malo es...\n@c0@"
  fr: "@a%0%a001240@bMais non, ce n'est pas finiⓠ Il ne comprend rienⓠ\n@c0@"
  it: "@a%0%a001240@bSono senza parole...\nMa perché non vuole rendersi conto di come sono andate davvero le cose?!\n@c0@"
  ja: "@a@b%a001240「ぜんぜん\n\tわかってないじゃないか……！\n@c0@"
151:
  de: "@a%0%a001250@bEr... (schnüff) er is' so gemein!\n@c0@"
  en: "@a%0%a001250@bHe's... (sniff) He's so mean...\n@c0@"
  es: "@aSancho@bEs porque no tienen oro y llevan una vida bien arrastrada. No pueden pensar bien.\n@c0@"
  fr: "@a%0%a001250@bIl est... (snif) Il est si méchant...\n@c0@"
  it: "@a%0%a001250@bQuell'uomo è cattivo!\nSob!\nNon lo voglio più vedere! Sob!\n@c0@"
  ja: "@a@b%a001250「うっ…　ぐすっ……\n\tひっく……。\n@c0@"
152:
  de: "@aSancho@bDas ist, weil sie arm sind und so ein schweres Leben haben. Sie können nisst mehr klar denken.\n@c0@"
  en: "@aSancho@bEes because they have no money, and\r\nthey leeve esuch a hard life. They can no\r\ntheenk estraight.\n@c0@"
  es: "@aSancho@bNo podemos hacer nada. Nomás es la naturaleza humana.\n@c0@"
  fr: "@aSancho@bC'est parce qu'ils n'ont p-pas d'argent et qu'ils ont\r\noune vie t-très dure. Ils ne peuvent pas p-penser comme il faut.\n@c0@"
  it: "@aSancho@bEsta es la situación más incredibile que me sia mai capitata...\n@c0@"
  ja: "@a@bサンチョ「お金が　なかったり\n\tうんと　ひどい目にあうと\n\t心も　ゆがむものです。\n@c0@"
153:
  de: "@aSancho@bDa können wir nissts tun. Das liegt in der Natur des Menschen.\n@c0@"
  en: "@aSancho@bEes notheeng we can do. Ees the nature of humans.\n@c0@"
  es: "@aAlazar@bLes solucionamos el problema de los monstruos, dejamos que nos cubran de insultos, ¿y solo nos dan mil quinientas monedas de oro?\n@c0@"
  fr: "@aSancho@bOn ne peut rien y faire... nada.\r\nC'est la n-nature humaine.\n@c0@"
  it: "@aSancho@b¡Ay, no me importa! ¡Yo so que no abbiamo fatto nada de esbagliato, chico! ¡Nosotros siamo a puesto con las nuestras coscienzas!\n@c0@"
  ja: "@a@bサンチョ「……しょうがないんです。\n\t人間は　弱いものですから。\n@c0@"
154:
  de: "@aOtto@bWir lösen ihnen ihr Monsterproblem und lassen uns von ihnen beschimpfen, und alles, was wir dafür kriegen, sind fünfzehnhundert Goldmünzen!\n@c0@"
  en: "@aTuppence@bWe sort out their monster problem, and let them hurl abuse at us, and they only give us fifteen hundred gold coins?\n@c0@"
  es: "@aAlazar@b¡Esto es explotación con todas las letras! ¡Explotación total!\n@c0@"
  fr: "@aInnocent@bOn règle leur problème de monstre et on les laisse nous aboyer des insultes à la figure, et ils ne nous donnent que 1500 pièces d'orⓡ\n@c0@"
  it: "@aSimon@bCi siamo sforzati di comprendere il loro assurdo dialetto...\nLi abbiamo liberati dal ⓕmostroⓖ...\n㈡\nAbbiamo persino permesso loro di insultarci in tutti i modi possibili e immaginabili...\n@c0@"
  ja: "@a@bピピン「魔物を退治して\n\tそのうえ　好き放題　言われて\n\tたったの　１５００ゴールド！？\n@c0@"
155:
  de: "@aOtto@bDas nenn' ich Ausbeutung! Die pure Ausbeutung!\n@c0@"
  en: "@aTuppence@bIt's exploitation, that's what it is! Total exploitation!\n@c0@"
  es: "@aBianca@bEs agradable que alguien nos dé las gracias por fin, ¿eh?\n@c0@"
  fr: "@aInnocent@bC'est de l'exploitation, voilà ce que c'estⓠ\nDe l'exploitation pure et simpleⓠ\n@c0@"
  it: "@aSimon@bE ci ricompensano con appena millecinquecento monete?!\nPidocchiosi! Sono dei dannati spilorci!\n㈡\nScusi lo sfogo, Maestà, ma quando ci vuole ci vuole!\n@c0@"
  ja: "@a@bピピン「安すぎます！\n\tぜんぜん　わりに合いませんよ！\n@c0@"
156:
  de: "@aBianca@bEs ist schön, endlich ein paar Dankesworte zu hören, nicht?\n@c0@"
  en: "@aBianca@bIt's nice to finally hear a few words of thanks, eh?\n@c0@"
  es: "@aBianca@bAunque la verdad es que me siento bastante culpable. Al fin y al cabo, por culpa de %a001210 casi se mueren de hambre, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa fait du bien d'entendre enfin quelques mots de remerciement, nonⓡ\n@c0@"
  it: "@aBianca@bOh, finalmente una parola di gratitudine!\n@c0@"
  ja: "@a@bビアンカ「う…　いや……\n\tあらためてお礼を言われると\n\tなんだか…　ね……。\n@c0@"
157:
  de: "@aBianca@bAber irgendwie habe ich auch ein schlechtes Gewissen. Wegen unserem %a001210 wäre das Dorf schließlich beinahe verhungert.\n@c0@"
  en: "@aBianca@bI do feel a bit guilty, mind. Our %a001210 almost had this place on the brink of starvation, after all.\n@c0@"
  es: "@aNera@bEs buono. Al menos una persona de Puebla del Heno nos está veramente agradecida por lo que hicimos.\n@c0@"
  fr: "@aBianca@bIl faut dire que je me sens quand même un peu coupable. Notre %a001210 a presque provoqué\nune famine ici, après tout.\n@c0@"
  it: "@aBianca@bComunque, un po' mi sento colpevole: dopotutto %a001210 aveva effettivamente ridotto questo villaggio alla fame!\n@c0@"
  ja: "@a@bビアンカ「うちの%a001210が　この村を\n\tうえ死に　寸前まで　追いつめたのは\n\t事実なんだし……。\n@c0@"
158:
  de: "@aNera@bDas ist nett. Wenigstens eine Person hier in Bauernsiepen ist uns dankbar für das, was wir getan haben.\n@c0@"
  en: "@aNera@bThat's nice. At least one person here in Hay feels grateful to us for what we did.\n@c0@"
  es: "@aNera@bYa me siento mejor. Empecemos de cero y sigamos con il nosotro viaggio.\n@c0@"
  fr: "@aNera@bC'est gentil. Il y a au moins une personne à Chaumes qui nous est reconnaissante pour ce que nous avons fait.\n@c0@"
  it: "@aNera@bQuella donna ha capito che siamo persone per bene.\nQuesta è la ricompensa più preziosa che potessimo ricevere!\n@c0@"
  ja: "@a@bフローラ「良かったですわ。\n\tひとりだけでも　この村に\n\tわかってくれる人が　いてくださって。\n@c0@"
159:
  de: "@aNera@bJetzt geht's mir schon viel besser. Vergessen wir die ganze Geschichte einfach und setzen unsere Reise fort.\n@c0@"
  en: "@aNera@bI feel much better now. Let's just wipe the slate clean and get on with our journey.\n@c0@"
  es: "@a%0%a001240@b¡Por fin! Por fin, alguien que nos aprecia.\n@c0@"
  fr: "@aNera@bJe me sens beaucoup mieux, à présent. Mettons nos affaires en ordre et continuons notre voyage.\n@c0@"
  it: "@aNera@bLe cose non sono andate come speravamo, ma l'importante è che a Punta Campestre sia tornata la serenità. Forza, rimettiamoci in viaggio...\n@c0@"
  ja: "@a@bフローラ「やっと　胸のつかえが\n\tとれましたわ。　これで\n\t新たな気持ちで　旅立てますわね。\n@c0@"
160:
  de: "@a%0%a001240@bEndlich! Endlich mal jemand, der zu schätzen weiß, was wir getan haben!\n@c0@"
  en: "@a%0%a001240@bAt last! Finally someone who appreciates us.\n@c0@"
  es: "@a%0%a001240@bEmpezaba a estar muy fastidiado.\n@c0@"
  fr: "@a%0%a001240@bEnfinⓠ Enfin quelqu'un qui nous apprécie.\n@c0@"
  it: "@a%0%a001240@bPrego!\nOh, finalmente una persona che ha capito come stanno le cose!\n@c0@"
  ja: "@a@b%a001240「よかった　ひとりだけでも\n\tわかってくれる人がいて……。\n@c0@"
161:
  de: "@a%0%a001240@bLangsam wurde ich schon richtig böse.\n@c0@"
  en: "@a%0%a001240@bI was starting to get really annoyed.\n@c0@"
  es: "@a%0%a001250@b¿Has oído eso, papi? Ha dicho ⓕgraciasⓖ.\n@c0@"
  fr: "@a%0%a001240@bJe commençais à être vraiment en colère.\n@c0@"
  it: "@a%0%a001240@bOra mi sento un pochino meglio...\n@c0@"
  ja: "@a@b%a001240「ボク　すっごく\n\tイライラしてたんだけど\n\tやっと　スッキリしたよ！\n@c0@"
162:
  de: "@a%0%a001250@bHast du das gehört, Papa? Sie hat sich bedankt.\n@c0@"
  en: "@a%0%a001250@bDid you hear that, Dad? She said thanks.\n@c0@"
  es: "@a%0%a001250@bQué bonito oírlo por fin, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bTu as entendu ça, papaⓡ Elle nous a dit merci.\n@c0@"
  it: "@a%0%a001250@bPapà, hai sentito?\nQuella donna ci ha detto ⓕcraziaⓖ!\n@c0@"
  ja: "@a@b%a001250「お父さん…\n\tあの人　ありがとうって……。\n@c0@"
163:
  de: "@a%0%a001250@bDas ist schön, wenn's endlich mal jemand sagt, nicht?\n@c0@"
  en: "@a%0%a001250@bIt's nice to finally hear it, isn't it?\n@c0@"
  es: "@aSancho@bEsa señora es bien amable, ¿no?\n@c0@"
  fr: "@a%0%a001250@bC'est agréable de l'entendre enfin, heinⓡ\n@c0@"
  it: "@a%0%a001250@bCredo che volesse dire ⓕgrazieⓖ, ma va bene lo stesso. Finalmente qualcuno ci ha dimostrato un briciolo di gratitudine!\n@c0@"
  ja: "@a@b%a001250「うれしいね。\n\tよかったね　お父さん……。\n@c0@"
164:
  de: "@aSancho@bDiese Señora, sie ist so freundliss, no?\n@c0@"
  en: "@aSancho@bThees señora, eshe ees eso kind, no?\n@c0@"
  es: "@aAlazar@bTodo eso está muy bien, ¡pero yo esperaba al menos una fiesta en nuestro honor! No, esto me deja frío, lo siento.\n@c0@"
  fr: "@aSancho@bC-Cette señora est muy gentille, noⓡ\n@c0@"
  it: "@aSancho@bQue gentile esta señora, chico...\nCuando torneremo aquí le porterò un pentolon de paell...\n㈡\nNo.\nEl pentolon de paella glielo manderò por posta, por qué no metterò más piede a Punta Campestre...\n@c0@"
  ja: "@a@bサンチョ「人の　なさけが\n\t身にしみますなあ。　ええ　ええ……。\n@c0@"
165:
  de: "@aOtto@bDas ist ja alles ganz gut und schön, aber ich hätt' doch wenigstens ein Festmahl zu unseren Ehren erwartet! Das reißt mich jetzt net vom Hocker!\n@c0@"
  en: "@aTuppence@bThat's all very well, but I was at least expecting a feast or something in our honour! No, that cuts no\r\nice with me, I'm afraid.\n@c0@"
  es: "@aBianca@bEstar aquí me recuerda un poco a mi casa, ¿sabes?\n@c0@"
  fr: "@aInnocent@bC'est bien joli, tout ça, mais j'espérais au moins\nune fête en notre honneurⓠ Non, je regrette,\nmais ça ne suffit pas.\n@c0@"
  it: "@aSimon@bMaestà, che dice? Accettiamo le scuse di questa bifolca? Ma sì, accettiamole pure...\nNoi gente di Denim siamo persone magnanime!\n@c0@"
  ja: "@a@bピピン「本当なら　村をあげての\n\t宴でも　開いてほしいところです。\n\tボクは　なっとく　いきませんね！\n@c0@"
166:
  de: "@aBianca@bWenn ich hier bin, muss ich immer an zu Hause denken.\n@c0@"
  en: "@aBianca@bComin' here always reminds me of home somehow.\n@c0@"
  es: "@aBianca@b¿Crees que este lugar tiene algo que ver con el inframundo, %a000090? Yo no lo tengo muy claro.\n@c0@"
  fr: "@aBianca@bQuand je viens ici, ça me rappelle toujours un peu\r\nla maison.\n@c0@"
  it: "@aBianca@bNon so perché, ma quando vengo qui mi torna in mente casa mia...\n@c0@"
  ja: "@a@bビアンカ「こんな　いなかの村に来ると\n\t山奥の村を　思い出すわね。\n@c0@"
167:
  de: "@aBianca@bMeinst du, der Ort hat irgendwas mit der Unterwelt zu tun, %a000090? Ich bin da gar nicht so sicher.\n@c0@"
  en: "@aBianca@bD'you think this place has somethin' to do with the underworld, %a000090? I en't too sure meself.\n@c0@"
  es: "@aNera@bResulta difficile credere que exista algo como el Gran Maestro del Inframundo estando en un lugar tan calmo como questo.\n@c0@"
  fr: "@aBianca@bTu crois que cet endroit a quelque chose à voir\navec le monde souterrain, %a000090ⓡ\nJe n'en sais trop rien moi-même.\n@c0@"
  it: "@aBianca@b%0%a000090, credi che questo posto sia collegato in qualche modo con il Regno degli Inferi?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tこの村　魔界と何か関係があるの？\n\tそんな感じ　しないけど……。\n@c0@"
168:
  de: "@aNera@bAn einem so friedlichen Ort kommt es einem ganz unwahrscheinlich vor, dass es so was wie den Großmeister der Unterwelt geben soll.\n@c0@"
  en: "@aNera@bIt seems impossible to believe there's any such thing as the Grandmaster of the Underworld when you're in a place as peaceful as this.\n@c0@"
  es: "@aNera@b¿Verdad que es muy reconfortante el borboteo dell'acqua?\n@c0@"
  fr: "@aNera@bIl est difficile de croire qu'il existe un Grand Maître des Enfers quand on se trouve dans un lieu aussi paisible que celui-ci.\n@c0@"
  it: "@aNera@bQuando mi trovo in posti così tranquilli, mi riesce difficile pensare che possa esistere una creatura perfida come il Gran Maestro degli Inferi...\n@c0@"
  ja: "@a@bフローラ「こんな　おだやかな村にいると\n\t闇の大魔王のことが　まるで\n\tウソのようですわ。\n@c0@"
169:
  de: "@aNera@bDas Plätschern des Wassers im Fluss klingt so beruhigend, findest du nicht?\n@c0@"
  en: "@aNera@bThe bubbling of the water in the stream's such a comforting sound, isn't it?\n@c0@"
  es: "@a%0%a001240@bEste lugar diminuto, pero también muy bonito.\n@c0@"
  fr: "@aNera@bLe bruit de l'eau qui court est tellement apaisant,\ntu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bIl suono dell'acqua è davvero rilassante...\nPotrei ascoltarlo per giorni interi...\n@c0@"
  ja: "@a@bフローラ「せせらぎの音が\n\t心地いいですわね。\n@c0@"
170:
  de: "@a%0%a001240@bDas ist ein winziger Ort, aber eigentlich ganz nett.\n@c0@"
  en: "@a%0%a001240@bThis place is really tiny, but it's quite pretty,\nI suppose.\n@c0@"
  es: "@a%0%a001250@bMira en el estanque... ¿No es bonito?\n¡Ji, ji, ji!\n@c0@"
  fr: "@a%0%a001240@bCet endroit est vraiment petit, mais très joli,\nje trouve.\n@c0@"
  it: "@a%0%a001240@bIl posto è piccolo, ma non mi sembra affatto male...\n@c0@"
  ja: "@a@b%a001240「ちっちゃいけど\n\t緑が多くて　きれいな村だよね。\n@c0@"
171:
  de: "@a%0%a001250@bSieh mal den Teich! Ist das nicht hübsch? Heh heh heh!\n@c0@"
  en: "@a%0%a001250@bLook in the pond... Isn't it pretty?\nHeh heh heh!\n@c0@"
  es: "@aSancho@b¿Tenemos algo que hacer acá, chamaco?\n@c0@"
  fr: "@a%0%a001250@bRegarde dans la mare... Ça n'est pas joliⓡ Hi hi hiⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto quant'è bello questo stagno?\n@c0@"
  ja: "@a@b%a001250「エヘヘ　お池がきれい。\n\t……すてきね？\n@c0@"
172:
  de: "@aSancho@bGibt es hier etwas für uns zu tun, Chico?\n@c0@"
  en: "@aSancho@bEes esometheeng for us to do here, friend?\n@c0@"
  es: "@aSancho@b¡Mira esos campos! ¡La verdura está creciendo bien rápido!\n@c0@"
  fr: "@aSancho@bOn doit f-faire quelque chose ici, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, abbiamo qualcosas da fare aquí?\n@c0@"
  ja: "@a@bサンチョ「こんな　へんぴな村に\n\tどんな　ご用事です？\n@c0@"
173:
  de: "@aSancho@bSieh dir nur die Felder an! Das Gemüse, es wächst so schnell!\n@c0@"
  en: "@aSancho@bLook at these fields! The greens, they are growing eso fast!\n@c0@"
  es: "@aAlazar@bVámonos a otro lado, ¿eh, %a000090?\nNo estoy yo hecho para el campo.\n@c0@"
  fr: "@aSancho@bR-Regarde ces champsⓠ Les légumes p-poussent\nà toute vitesseⓠ\n@c0@"
  it: "@aSancho@bMe gusta muchos guardare los campos coltivatos...\nMe fanno pensare que la tierra es la madre que nutre todos los hombres del mundo...\n@c0@"
  ja: "@a@bサンチョ「おや　みごとな畑だ。\n\t野菜が　あんなにすくすく\n\t育ってますよ！\n@c0@"
174:
  de: "@aOtto@bGehen wir woanders hin, %a000090, ja? Ich hab's eigentlich net so mit dem Landleben.\n@c0@"
  en: "@aTuppence@bLet's head off somewhere else, eh, %a000090?\nI'm not really a country sort of chap.\n@c0@"
  es: "@aAlazar@bAquí no hay absolutamente nada, ¿verdad?\n@c0@"
  fr: "@aInnocent@bSi on allait ailleurs, hein, %a000090ⓡ Je ne suis pas vraiment un gars de la campagne.\n@c0@"
  it: "@aSimon@bMaestà, che ne direbbe di andarcene in un posto più movimentato e meno agreste?\nLa campagna è tanto bella, ma anche assai noiosa!\n@c0@"
  ja: "@a@bピピン「%a000090さま。\n\t早く　ほかの町へ行きましょう。\n\tボク　いなかって　ハダに合わなくて。\n@c0@"
175:
  de: "@aOtto@bHier ist wirklich überhaupt nichts los, was?\n@c0@"
  en: "@aTuppence@bThere's absolutely nothing here, is there?\n@c0@"
  es: "@aBianca@bEn realidad no querías venir aquí, ¿verdad, %a000090?\n@c0@"
  fr: "@aInnocent@bIl n'y a vraiment rien du tout ici, heinⓡ\n@c0@"
  it: "@aSimon@bQui non c'è nulla.\nNiente.\nNada, come direbbe il buon Sancho.\n@c0@"
  ja: "@a@bピピン「なんにもない所だなあ……。\n@c0@"
176:
  de: "@aBianca@bEigentlich wolltest du doch gar nicht hierher, oder, %a000090?\n@c0@"
  en: "@aBianca@bYou din't really want to come here, did you, %a000090?\n@c0@"
  es: "@aNera@bEn realidad no querías venir aquí, ¿vero, %a000090?\n㈡\nEs decir... Lo siento, caro. Era solo... solo un presentimiento.\n@c0@"
  fr: "@aBianca@bTu ne voulais pas vraiment venir ici, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, mi spiegheresti per quale oscuro motivo siamo venuti qui?\n@c0@"
  ja: "@a@bビアンカ「ホントは　%a000090\n\tこの村に　来たくなかったでしょ？\n@c0@"
177:
  de: "@aNera@bDu hattest eigentlich nicht geplant hierherzukommen, nicht wahr? Ich meine... Tut mir leid, Liebling. Es war nur so ein... ein Gefühl.\n@c0@"
  en: "@aNera@bYou didn't really intend to come here, did you?\r\nI mean... Sorry, darling. It was just...just a feeling.\n@c0@"
  es: "@a%0%a001240@b¿Qué ocurre, papá? Tienes una cara rara.\n@c0@"
  fr: "@aNera@bTu n'avais pas réellement l'intention de venir ici,\ndis-moiⓡ Je veux dire... Pardon, mon chéri.\nC'était... C'était juste une impression.\n@c0@"
  it: "@aNera@bCaro, perché siamo venuti in questo posto?\nNon c'è un solo motivo che giustifichi la nostra presenza qui!\n@c0@"
  ja: "@a@bフローラ「あなた　本当は　この村に\n\t来たくなかったんじゃありません？\n\tいえ…　なんとなく……。\n@c0@"
178:
  de: "@a%0%a001240@bWas ist denn, Papa? Du wirkst irgendwie komisch.\n@c0@"
  en: "@a%0%a001240@bWhat's wrong, Dad? You look funny.\n@c0@"
  es: "@a%0%a001240@bEsa anciana parece estar muy bien ahora.\nYa no está doblada por la mitad.\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qui ne va pas, papaⓡ\nTu as l'air tout drôle.\n@c0@"
  it: "@a%0%a001240@bChe ti prende, papà?\nHai una strana espressione...\n@c0@"
  ja: "@a@b%a001240「……あれ？\n\tお父さん　へんな顔してるよ。\n\tどうかしたの？\n@c0@"
179:
  de: "@a%0%a001240@bDer alten Dame scheint es jetzt richtig gut zu gehen. Sie geht nicht vornübergebeugt und gar nichts.\n@c0@"
  en: "@a%0%a001240@bThat old lady seems really well now.\nShe's not bent over double or anything.\n@c0@"
  es: "@aSancho@bAhorita todo el mundo sonríe. Hay muy buen ambiente, ¿no?\n@c0@"
  fr: "@a%0%a001240@bCette vieille femme a l'air d'aller très bien, maintenant. Elle n'est pas toute courbée, ni rien.\n@c0@"
  it: "@a%0%a001240@bNon ho capito cos'ha detto, ma dal tono della voce mi è sembrata contenta...\n@c0@"
  ja: "@a@b%a001240「元気な　おばあさんだね。\n\t背中　まっすぐだったよ！\n@c0@"
180:
  de: "@aSancho@bAll die Leute hier, sie haben ein Lässeln auf dem Gesisst, eh? Jetzt ist die Stimmung hier gut, no?\n@c0@"
  en: "@aSancho@bAll the people, they have esmiles on their\r\nfaces, eh? Ees a good atmosphere here\r\nnow, no?\n@c0@"
  es: "@a%0%a001240@b¿Eh? ¿Ciudaⓘ? ¿Qué significa eso?\n@c0@"
  fr: "@aSancho@bT-Tous les gens ont le s-sourire, siⓡ L'ambiance est n-nettement meilleure maintenant, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que bueno! ¡Ahora los abitantes de Punta Campestre sono tranquillos y rilassatos!\n¡Gracias, mia amata dea, gracias!\n@c0@"
  ja: "@a@bサンチョ「みなさん　いい笑顔だ。\n\t心のやさしい村なんでしょうね。\n@c0@"
181:
  de: "@a%0%a001240@bHäh? Feine Pinkel? Was soll das denn heißen?\n@c0@"
  en: "@a%0%a001240@bHuh? Inhabitabents? What does that mean?\n@c0@"
  es: "@aAlazar@b¡Estaba a punto de preguntarlo!\n¿Qué hacemos aquí, %a000090?\n@c0@"
  fr: "@a%0%a001240@bHeinⓡ Des Jean Dlavilleⓡ\nQu'est-ce que ça veut direⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, ma riesci sempre a capire cosa dicono gli abitanti di questo posto?\n@c0@"
  ja: "@a@b%a001240「う～ん　なんの用だろ？\n\t社会見学……？？\n@c0@"
182:
  de: "@aOtto@bDas wollte ich auch grad' fragen! Was tun wir hier, %a000090?\n@c0@"
  en: "@aTuppence@bJust what I was about to ask!\nWhat are we doing here, %a000090?\n@c0@"
  es: "@aBianca@b¡Pero qué encanto! Yo lo sé todo de la vida rural. ¡Seguro que podría enseñarle un par de cosas sobre el arado!\n@c0@"
  fr: "@aInnocent@bC'est exactement la question que je me posaisⓠ Qu'est-ce qu'on fait ici, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, stavo giusto per chiederglielo...\nChe ci facciamo in questo ⓕpaeselloⓖ?\n@c0@"
  ja: "@a@bピピン「ボクが　ききたいところですよ！\n\t%a000090さま　本当に\n\tなんの用なんですか！？\n@c0@"
183:
  de: "@aBianca@bNa, vielen Dank auch! Ich kenn' mich aus mit dem Landleben. Dem könnt' ich über das Pflügen noch das eine oder andere beibringen!\n@c0@"
  en: "@aBianca@bBlimmin' charmin'! I know all about livin' in the\r\ncountry. I reckon I could teach him a thing or two about ploughin'!\n@c0@"
  es: "@aNera@bCuando estuve en la abadía solíamos trabajar la terra. Sé manejar la azada y el rastrillo, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu parles d'un accueilⓠ J'ai vécu à la campagne,\nmoi aussi. Je parie que je pourrais lui apprendre\nun ou deux trucs sur les semis, justementⓠ\n@c0@"
  it: "@aBianca@bMagari avessimo tempo per pensare al prosciutto...\n@c0@"
  ja: "@a@bビアンカ「こう見えても\n\tいなか暮らしが　長かったからね。\n\t畑仕事は　得意中の得意なのにな！\n@c0@"
184:
  de: "@aNera@bWir haben im Stift auch auf den Feldern gearbeitet. Ich kann eine Hacke von einer Harke unterscheiden, weißt du.\n@c0@"
  en: "@aNera@bWe used to work the fields at the abbey when I was staying there. I know how to handle a hoe and a rake, you know.\n@c0@"
  es: "@a%0%a001240@b¿Boba? Es que esta gente habla rarísimo.\n@c0@"
  fr: "@aNera@bQuand j'étais à l'abbaye, on travaillait dans\r\nles champs. Je sais me servir d'une houe et\r\nd'un râteau, tu sais.\n@c0@"
  it: "@aNera@bNon c'è che dire: il cibo che viene dalla campagna è buono e genuino. Mio padre si fa sempre portare alimenti freschi da alcuni contadini amici suoi...\n@c0@"
  ja: "@a@bフローラ「昔　修道院でしていましたから…\n\t私だって　畑をたがやすことくらい\n\tできますわ。\n@c0@"
185:
  de: "@a%0%a001240@bSpeck? Mit Speck werd' ich genauso gut fertig wie mit Grünzeug, da geh ich jede Wette ein!\n@c0@"
  en: "@a%0%a001240@bCodswallop? I can wallop fish just as well as he can, I'll bet.\n@c0@"
  es: "@a%0%a001250@bPero en los campos hay ratones. Si no tienes cuidado, podrías hacerles daño con la azada o lo que sea.\n@c0@"
  fr: "@a%0%a001240@bComment ça, ⓥc'te rigoladeⓦⓡⓐ Je parie que je peux me débrouiller aussi bien que lui.\n@c0@"
  it: "@a%0%a001240@bIo non ho mai visto porci in città...\nForse li tengono nascosti dentro le case?\n@c0@"
  ja: "@a@b%a001240「ボクって　都会もん？\n\t畑を　たがやすの\n\tボクにも　できそうなんだけどな。\n@c0@"
186:
  de: "@a%0%a001250@bAber es leben Mäuse in den Feldern. Wenn wir nicht aufpassen, könnten wir ihnen mit einer Harke oder so weh tun.\n@c0@"
  en: "@a%0%a001250@bThere are mice in the fields, though. You might hurt them with a hoe or something if you're not careful.\n@c0@"
  es: "@aSancho@bNomás que no es fácil usar una azada.\nEs un trabajo duro.\n@c0@"
  fr: "@a%0%a001250@bIl y a des mulots, dans les champs. Si on ne fait pas attention, on risque de les blesser avec la houe.\n@c0@"
  it: "@a%0%a001250@bPapà, vogliamo comprare un maialino?\nMa non per farci il prosciutto, eh!\nLo vorrei come animale da compagnia...\n@c0@"
  ja: "@a@b%a001250「畑をたがやすと\n\tミミズさんが　出てくるのよ。\n\tクワで傷つけたら　かわいそうなの。\n@c0@"
187:
  de: "@aSancho@bEs ist nisst so leisst, eine Hacke risstig zu benutzen, weißt du. Das ist harte Arbeit.\n@c0@"
  en: "@aSancho@bEes no eso easy to use a hoe, you know.\r\nEes hard work.\n@c0@"
  es: "@aBianca@b¡Vamos, %a000090!\nNo pasará nada por echarle una mano a este tipo, ¿sabes?\n@c0@"
  fr: "@aSancho@bÇa n'est pas f-facile d'utiliser oune houe, tu sais. C'est oun t-travail très dur.\n@c0@"
  it: "@aSancho@bNo me interessano los puercos.\n¡No ce posso mica mettere el maiale nella paella!\n¿O forse sì?\n@c0@"
  ja: "@a@bサンチョ「クワを使うのは\n\tけっこう　コツがいるんです。\n\tあれで　重労働なんですよ。\n@c0@"
188:
  de: "@aBianca@bKomm schon, %a000090.! Es kann nicht schaden, dem Mann ein wenig zu helfen.\n@c0@"
  en: "@aBianca@bCome on, %a000090!\nIt wouldn't hurt to lend the bloke a hand.\n@c0@"
  es: "@aNera@b¡Vaya! Esta gente de la città ha pasado unos cuantos tragos duros. %0%a000090 ha vivido cosas que ni te las imaginas.\n@c0@"
  fr: "@aBianca@bAllez, %a000090ⓠ Ça ne coûterait rien de donner un coup de main à ce type.\n@c0@"
  it: "@aBianca@bTutto sommato, potrebbe essere un'idea per il futuro, %a000090!\nPotremmo aprire un salumificio a Denim!\n@c0@"
  ja: "@a@bビアンカ「もう　%a000090ってば\n\tなさけないなあ。\n\t畑仕事くらい　手伝ってあげなさいよ。\n@c0@"
189:
  de: "@aNera@bAlso! Auch wir Stadtleute haben es nicht immer leicht, wisst Ihr! %0%a000090 hatte schon mehr auszuhalten, als Ihr Euch träumen lassen würdet!\n@c0@"
  en: "@aNera@bWell! We city folk have had our fair share of hardships, you know! %0%a000090 has been through more than you could possibly imagine.\n@c0@"
  es: "@a%0%a001250@bNaide ha dicho naide, ¿verdaⓘ?\n@c0@"
  fr: "@aNera@bEh bien, les gens de la ville ont eux aussi leur lot d'épreuves, vous savezⓠ %0%a000090 a surmonté plus de choses que vous ne l'imaginez.\n@c0@"
  it: "@aNera@bEhm, temo proprio che non abbiamo tempo per metterci ad allevare maiali...\n@c0@"
  ja: "@a@bフローラ「むっ…！　都会もんに\n\t見えても　%a000090さんは　今まで\n\tいっぱい　苦労してるのよ……。\n@c0@"
190:
  de: "@a%0%a001250@bIch wette, wenn wir es wollten, dann könnten wir es auch!\n@c0@"
  en: "@a%0%a001250@bⓙE din't say ⓗdin'tⓘ, did 'e?\n@c0@"
  es: "@aSancho@bLas verduras que cultivas tú mismo siempre saben padrísimo.\n@c0@"
  fr: "@a%0%a001250@bL'est guère aimable, ou j'me trompeⓡ\n@c0@"
  it: "@a%0%a001250@bPapà?!\nMica vorrai metterti ad allevare maiali per poi farne prosciutti, vero?!\n@c0@"
  ja: "@a@b%a001250「だべだべ　言ってるだべ……。\n@c0@"
191:
  de: "@aSancho@bWeißt du, das Gemüse, was du selbst anbaust, schmeckt immer am besten!\n@c0@"
  en: "@aSancho@bYou know, the greens you grow yourself, they always taste the best.\n@c0@"
  es: "@aSancho@bUn día tienes que cultivar algo, chamaco.\n@c0@"
  fr: "@aSancho@bTu sais, les légumes qu'on fait p-pousser soi-même ont t-toujours oun meilleur goût.\n@c0@"
  it: "@aSancho@bChico, estavo pensando que cuando termineremo el nuestro viaggio me retirerò en campagna.\n@c0@"
  ja: "@a@bサンチョ「自分で育てた野菜は\n\tとびっきり　おいしいんです。\n@c0@"
192:
  de: "@aSancho@bDu musst es irgendwann auch mal versuchen, Chico!\n@c0@"
  en: "@aSancho@bYou must try to grow esometheeng one day, friend.\n@c0@"
  es: "@aAlazar@b¡Exactamente! ¡Soy un tipo de ciudad de los pies a la cabeza, y la idea de trabajar el campo no me vuelve loco precisamente!\n@c0@"
  fr: "@aSancho@bTu d-devrais essayer de faire pousser\r\nquelque chose, oun jour, chico.\n@c0@"
  it: "@aSancho@bColtiverò verduras y me ne andrò a pescare al fiume. Lo zio Sancho ha bisogno de un poco de tranquilidad...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんも　いっぺん\n\t何か　育ててみちゃどうです？\n@c0@"
193:
  de: "@aOtto@bWo er recht hat, hat er recht! Ich bin eben ein Stadtmensch, und mit Feldarbeit kann man mich net grad' hinterm Ofen hervorlocken.\n@c0@"
  en: "@aTuppence@bHe's got that right! I'm a city fellow through and through, and the thought of working the fields doesn't exactly thrill me!\n@c0@"
  es: "@aBianca@bEs una posada sencillita, ¿verdad? Pero es bonito quedarse en sitios así de vez en cuando, ¿sabes?\n@c0@"
  fr: "@aInnocent@bLà-dessus, il a raison. Je suis citadin jusqu'au bout des ongles et l'idée d'aller travailler dans les champs ne m'enchante guèreⓠ\n@c0@"
  it: "@aSimon@bNon credo di essere tagliato per allevare maiali.\nQuando voglio del prosciutto, preferisco comprarlo bell'e pronto in negozio.\n@c0@"
  ja: "@a@bピピン「そのとおりです。\n\t都会育ちのボクにとっては\n\t畑仕事なんて　とても　とても……！\n@c0@"
194:
  de: "@aBianca@bEs ist eine ganz einfache kleine Herberge, nicht? Aber manchmal ist so etwas genau das Richtige.\n@c0@"
  en: "@aBianca@bIt's a simple little inn, eh? Still, it's nice to stay at places like this every once in a while.\n@c0@"
  es: "@aNera@bEstá un poco estropeada, ma tiene un aspetto muy hogareño, ¿vero?\n@c0@"
  fr: "@aBianca@bC'est une auberge toute simple, heinⓡ Mais c'est quand même agréable de dormir dans des endroits comme ça de temps en temps.\n@c0@"
  it: "@aBianca@bQuesta locanda è semplice e spartana, ma per me va più che bene!\nSono una persona di miti pretese, io.\n@c0@"
  ja: "@a@bビアンカ「そぼくな宿って感じね。\n\tたまには　こういうところも\n\tいいかもしれないわね。\n@c0@"
195:
  de: "@aNera@bHier ist es etwas schäbig, aber man fühlt sich gleich wie zu Hause, findest du nicht?\n@c0@"
  en: "@aNera@bIt's a bit run-down, but it has a lovely homely feel to it, doesn't it?\n@c0@"
  es: "@a%0%a001240@bMmm... ¿Lo estáis oliendo?\n¡Seguro que aquí la comida es deliciosa!\n@c0@"
  fr: "@aNera@bC'est un peu défraîchi, mais on s'y sent un peu comme chez soi, tu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bL'aspetto non è quello di una locanda di lusso, ma l'atmosfera sembra tranquilla e rilassata...\n@c0@"
  ja: "@a@bフローラ「さびれては　いますけど\n\tあたたかい感じがしますわ。\n@c0@"
196:
  de: "@a%0%a001240@bHmm... Riechst du das? Ich wette, hier schmeckt das Essen einfach köstlich!\n@c0@"
  en: "@a%0%a001240@bMmm... Can you smell that?\nI bet dinner here tastes delicious!\n@c0@"
  es: "@aSancho@bSí, sí. Esta posada me simpatiza mucho.\nEn un sitio poco formal está uno más relajadito.\n@c0@"
  fr: "@a%0%a001240@bMmm... Tu sens cette odeurⓡ Je parie que les\nrepas sont succulents, iciⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti, che profumino!\nChissà come si mangia bene qui!\n@c0@"
  ja: "@a@b%a001240「わ～！\n\tなんか　いいにおいがする。\n\tきっと　ここのゴハン　おいしいよ！\n@c0@"
197:
  de: "@aSancho@bSí, sí. Hier gefällt es mir. Wenn es nisst so förmliss ist, kann man siss viel besser entspannen, no?\n@c0@"
  en: "@aSancho@bSí, sí. Thees ees my kind of inn.\nYou can relax when ees no eso formal, no?\n@c0@"
  es: "@aBianca@bSi te casas por amor, te da igual dónde vivas. O eso es lo que yo pienso, ¿me entiendes?\n@c0@"
  fr: "@aSancho@bSi, si. C'est t-tout à fait mon style d'auberge. Quand ce n'est p-pas guindé, on peut se d-détendre, noⓡ\n@c0@"
  it: "@aSancho@b¡Esta locanda me gusta!\nEs un luego tranquillo y senza pretesas, l'ideal por reposare en santa paz.\n@c0@"
  ja: "@a@bサンチョ「私は　こういう宿　好きですね。\n\tかざらない感じが\n\tくつろげるって　もんですよ。\n@c0@"
198:
  de: "@aBianca@bWenn man jemanden aus Liebe heiratet, ist es egal, wo man lebt. Das ist jedenfalls meine Meinung.\n@c0@"
  en: "@aBianca@bIf you marry someone for love, then it dun't matter where you live. That's what I think, anyhow.\n@c0@"
  es: "@aNera@bNo me quejaría mientras fossi con la gente que amo. Es lo único que me importa.\n@c0@"
  fr: "@aBianca@bQuand on épouse quelqu'un par amour, peu importe où on vit. Enfin, c'est ce que je pense, en tout cas.\n@c0@"
  it: "@aBianca@bNon importa dove si vive: ciò che conta è avere accanto a sé la persona che si ama.\nIo, almeno, la penso così...\n@c0@"
  ja: "@a@bビアンカ「好きで　結婚したんなら\n\t住む場所なんて　関係ないじゃない。\n\t私は　そう思うけど？\n@c0@"
199:
  de: "@aNera@bIch würde mich niemals beklagen, solange ich nur mit den Menschen zusammen bin, die mir am Herzen liegen. Nur das ist mir wichtig.\n@c0@"
  en: "@aNera@bI'd never complain as long as I was with the people\r\nI love. That's all that matters to me.\n@c0@"
  es: "@a%0%a001240@bPero aquí puedes trepar a los árboles, chapotear en el estanque... ¿Qué tiene de malo?\n@c0@"
  fr: "@aNera@bJe ne me plaindrai jamais tant que je serai avec les gens que j'aime. C'est tout ce qui compte pour moi.\n@c0@"
  it: "@aNera@bPotrei vivere anche in capo al mondo, a patto di stare sempre insieme a te, tesoro...\n@c0@"
  ja: "@a@bフローラ「私は　愛する家族と\n\tいっしょにいられれば　それだけで\n\tしあわせなんですけど……。\n@c0@"
200:
  de: "@a%0%a001240@bAber hier kann man auf Bäume klettern, im Teich herumplanschen... Was will man mehr?\n@c0@"
  en: "@a%0%a001240@bBut you can climb trees here, splash about in the pond... What's not to like?\n@c0@"
  es: "@aAlazar@b¡Oh!, sí, entiendo lo que siente la pobre muchacha.\nEste sitio nos afecta demasiado a los urbanitas.\n@c0@"
  fr: "@a%0%a001240@bMais ici, on peut grimper aux arbres, sauter dans la mare... Qu'est-ce qu'on pourrait ne pas aimerⓡ\n@c0@"
  it: "@a%0%a001240@bMa qui ci si può arrampicare sugli alberi, correre nei campi...\nPerché a quella donna non piace vivere qui?\n@c0@"
  ja: "@a@b%a001240「木のぼりもできるし\n\t池で　水遊びだってできるよ。\n\tなんで　イヤなんだろ？\n@c0@"
201:
  de: "@aOtto@bAch ja, ich weiß genau, wie's dem armen Mädel zumute ist. Uns Stadtbewohnern wird hier einfach viel zu viel abverlangt.\n@c0@"
  en: "@aTuppence@bOh yes, I know just how the poor girl feels.\nThis place takes too much of a toll on us urbanites.\n@c0@"
  es: "@aBianca@b¡Ni siquiera dijimos que queríamos ese maldito espantapájaros!\n@c0@"
  fr: "@aInnocent@bOui, je comprends ce que ressent cette pauvre femme. Ce genre d'endroit est bien trop pénible\r\npour nous autres citadins.\n@c0@"
  it: "@aSimon@bCapisco cosa vuol dire quella donna: trasferirsi in campagna può essere un vero choc per chi ha sempre vissuto in città...\n@c0@"
  ja: "@a@bピピン「わかるなあ　その気持ち。\n\t都会育ちには　この村は\n\tダメージが　大きすぎますよっ。\n@c0@"
202:
  de: "@aBianca@bWir haben nicht mal gesagt, dass wir die blöde Vogelscheuche haben wollten!\n@c0@"
  en: "@aBianca@bWe didn't even say we wanted the\r\nstupid scarecrow!\n@c0@"
  es: "@aNera@bEstá deseando librarse de él, ¿vero?\nBene, ¿nos lo llevamos, o no?\n@c0@"
  fr: "@aBianca@bOn n'a même pas dit qu'on le voulait, leur stupide épouvantailⓠ\n@c0@"
  it: "@aBianca@bLo spaventamostri?\nE che ci facciamo con uno spaventamostri?!\n@c0@"
  ja: "@a@bビアンカ「かかしのことなんて\n\tなんにも　言っていないのにね……。\n@c0@"
203:
  de: "@aNera@bEr scheint ganz erpicht darauf, sie loszuwerden, was? Und? Nehmen wir sie nun oder nicht?\n@c0@"
  en: "@aNera@bHe really is keen to get rid of it, isn't he?\nWell? Shall we take it or not?\n\n@c0@"
  es: "@a%0%a001240@b¿Eh? ¿Nos podemos quedar el horrorizacuervos? ¿De verdad?\n¡Yujuu!\n@c0@"
  fr: "@aNera@bIl veut vraiment s'en débarrasser, heinⓡ\nAlorsⓡ On l'emmène ou pasⓡ\n@c0@"
  it: "@aNera@bTesoro, che ne dici di prenderlo?\nChissà, potrebbe persino tornarci utile...\n@c0@"
  ja: "@a@bフローラ「私たちに　押しつけるなんて\n\tよほど　いらない　かかしなのね。\n\tどうします？　持っていきましょうか？\n@c0@"
204:
  de: "@a%0%a001240@bHäh? Wir kriegen die Schreckensscheuche? Wirklich? Jippieh!\n@c0@"
  en: "@a%0%a001240@bHuh? We can have the terrorcrow? Really?\nWahoo!\n@c0@"
  es: "@aBianca@bPareces algo perplejo, %a000090.\nNo es que me extrañe, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bHeinⓡ On peut prendre l'épouvanteurⓡ Vraimentⓡ Youpiⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, davvero possiamo prendere lo spaventamostri?\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「えっ？\n\tかかし　持ってっていいの？\n\tやった～！\n@c0@"
205:
  de: "@aBianca@bDu siehst etwas überrumpelt aus, %a000090. Nicht, dass ich's dir verdenken könnte.\n@c0@"
  en: "@aBianca@bYou look a bit perplexed, %a000090.\nNot that I blame you, mind.\n@c0@"
  es: "@a%0%a001240@b¡Son muy amables! ¡Genial!\n@c0@"
  fr: "@aBianca@bTu sembles un peu perplexe, %a000090.\nJe ne peux pas t'en blâmer, remarque.\n@c0@"
  it: "@aBianca@bBleah!\nSi sente il ⓕprofumoⓖ di sterco...\nEccome, se si sente!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tふくざつそうな　顔してるわね。\n\tまあ…　わかるけど……。\n@c0@"
206:
  de: "@a%0%a001240@bSie sind froh, uns begrüßen zu dürfen, hat er gesagt! Klasse!\n@c0@"
  en: "@a%0%a001240@bWe're always welcome, he said! Great!\n@c0@"
  es: "@aAlazar@bAunque sean muy amables, ¿de verdad quiero estar aquí? Mmm...\n@c0@"
  fr: "@a%0%a001240@bIl est toujours content de nous recevoir, il a ditⓠ Superⓠ\n@c0@"
  it: "@a%0%a001240@bBeh, per fortuna adesso qui i forestieri sono i benvenuti...\n@c0@"
  ja: "@a@b%a001240「大かんげい　だって！\n\tうれしいね。\n@c0@"
207:
  de: "@aOtto@bFür ihn mag's ja eine Ehre sein, mich begrüßen zu dürfen, aber leg' ich überhaupt Wert darauf, hier begrüßt zu werden? Hmm...\n@c0@"
  en: "@aTuppence@bI may be welcome, but do I wish to be here? Hmm...\n@c0@"
  es: "@aBianca@bSí, es un espantapájaros espantoso.\r\nPreferiría no tocarlo si lo puedo evitar, ¿sabes?\n@c0@"
  fr: "@aInnocent@bIl est peut-être content de me recevoir, mais moi, est-ce que j'ai envie d'être làⓡ Mmm...\n@c0@"
  it: "@aSimon@bMaestà, le confesso che questo posto m'intristisce un po'. Preferisco le realtà più vivaci, più movimentate...\nNon sono fatto per la vita di campagna.\n@c0@"
  ja: "@a@bピピン「かんげいされても\n\tボクは……！\n@c0@"
208:
  de: "@aBianca@bTja, das ist wirklich eine Vogelscheuche zum Fürchten. Die würde ich lieber nicht anfassen, wenn's nicht sein muss.\n@c0@"
  en: "@aBianca@bYeah, it's a scary-lookin' scarecrow, alright.\r\nI'd rather not touch it unless I have to.\n@c0@"
  es: "@aNera@bEse espantapájaros veramente no da tanto miedo cuando una se acostumbra. Desde luego, tiene personalità.\n@c0@"
  fr: "@aBianca@bC'est sûr qu'il fiche la frousse, leur épouvantail.\r\nJe préférerais ne pas avoir à le toucher, à moins\r\nd'y être obligée.\n@c0@"
  it: "@aBianca@bQuesto spaventamostri è orribile!\nMa perché mi fa tanta impressione, eh?\nSono una donna, io, mica un mostro!\n@c0@"
  ja: "@a@bビアンカ「う～ん…\n\tかなり　こわい顔の　かかしよね。\n\tあんまり　さわりたくないかも。\n@c0@"
209:
  de: "@aNera@bDiese Vogelscheuche ist gar nicht mehr so Furcht einflößend, wenn man sich erst mal an sie gewöhnt hat. Auf jeden Fall hat sie Charakter.\n@c0@"
  en: "@aNera@bThat scarecrow's not so scary once you get used to it. At least it has a bit of character.\n@c0@"
  es: "@a%0%a001240@b¡Este horrorizacuervos es de lo mejor! ¡Me encanta!\n@c0@"
  fr: "@aNera@bUne fois qu'on s'y est habitué, il ne fait plus si peur, cet épouvantail. Au moins, il est un peu original.\n@c0@"
  it: "@aNera@bPiù lo guardo, più lo spaventamostri mi sembra simpatico.\nNon mi spiacerebbe averne uno in giardino, sai?\n@c0@"
  ja: "@a@bフローラ「このかかし…\n\t見なれると　こわくないですわね。\n\t味があって　かわいいですわ。\n@c0@"
210:
  de: "@a%0%a001240@bDiese Schreckensscheuche ist die beste! Ich find' sie klasse!\n@c0@"
  en: "@a%0%a001240@bThis terrorcrow is the best! I love it!\n@c0@"
  es: "@aSancho@bSi han hecho un espantapájaros tan aterrador, deben tener acá un monstruo bien espantoso.\n@c0@"
  fr: "@a%0%a001240@bCet épouvanteur est vraiment terribleⓠ Je l'adoreⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto spaventamostri è troppo forte!\nMi piace tantissimo!\n@c0@"
  ja: "@a@b%a001240「やっぱり　カッコイイよ\n\tこのかかし！\n\tボク　好きだなあ！\n@c0@"
211:
  de: "@aSancho@bWenn sie so eine fürssterlisse Schreckensscheuche anfertigen, gibt es hier bestimmt ein ganz fürssterlisses Monster.\n@c0@"
  en: "@aSancho@bTo make esuch a frightening escarecrow, they must have a very escary monster here.\n@c0@"
  es: "@aBianca@bBueno, está bien que por fin se dé cuenta de que estaban todos equivocados, ¿sabes?\n@c0@"
  fr: "@aSancho@bPour f-f-fabriquer oun épouvantail aussi\nt-terrible, ils doivent avoir des m-monstres\nvraiment effrayants, ici, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que paura!\n¿Certo que ce ne vuole de fantasia por fare un espaventamostros tanto espaventoso, eh?\n@c0@"
  ja: "@a@bサンチョ「こんな　こわいかかしを\n\t作るなんて　よほど　おそろしい魔物が\n\tいたんでしょうねえ。\n@c0@"
212:
  de: "@aBianca@bTja, gut, dass er endlich eingesehen hat, dass sie bei uns total auf dem Holzweg waren.\n@c0@"
  en: "@aBianca@bWell, it's good that he's finally realised they were all in the wrong.\n@c0@"
  es: "@aNera@bBene, al menos se ha dado cuenta de que no querías hacerles daño.\n@c0@"
  fr: "@aBianca@bEh bien, c'est au moins une bonne chose qu'il ait enfin réalisé qu'ils étaient tous dans le faux.\n@c0@"
  it: "@aBianca@bCe ne ha messo di tempo, ma finalmente ha capito di essersi sbagliato, eh?!\nBeh, meglio tardi che mai...\n@c0@"
  ja: "@a@bビアンカ「なんにしても\n\t自分たちだけで　それに\n\t気づいたなんて　えらいわよね。\n@c0@"
213:
  de: "@aNera@bWenigstens hat er endlich verstanden, dass du ihnen kein Unrecht getan hast.\n@c0@"
  en: "@aNera@bWell at least he's finally realised you didn't do\r\nthem wrong.\n@c0@"
  es: "@a%0%a001240@bPapá, no sería... ¿Lo era?\n@c0@"
  fr: "@aNera@bEh bien, il a enfin réalisé que tu ne leur avais pas joué de mauvais tour.\n@c0@"
  it: "@aNera@bOh, finalmente si è reso conto di non essere stato imbrogliato!\n@c0@"
  ja: "@a@bフローラ「あなた　よかったですわね。\n\tわかってくださって……。\n@c0@"
214:
  de: "@a%0%a001240@bPapa, das warst doch nicht... Warst das etwa...?\n@c0@"
  en: "@a%0%a001240@bDad, it wasn't...was it?\n@c0@"
  es: "@a%0%a001240@b¡Vaya! Eres increíble, papi. ¡El mejor!\n@c0@"
  fr: "@a%0%a001240@bPapa, ça n'était pas... siⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, questo signore mi sembra pentito...\n@c0@"
  ja: "@a@b%a001240「……あれ？\n\tお父さん　もしかして？\n@c0@"
215:
  de: "@a%0%a001240@bUi! Du bist klasse, Papa! Einsame Spitze!\n@c0@"
  en: "@a%0%a001240@bWow! You're amazing, Dad. The best!\n@c0@"
  es: "@a%0%a001250@b¿Les has librado del monstruo, papi?\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Tu es incroyable, papa. Le meilleurⓠ\n@c0@"
  it: "@a%0%a001240@bÈ bello quando le persone riconoscono i propri errori, non è vero?\n@c0@"
  ja: "@a@b%a001240「お父さんて　やっぱり\n\tりっぱな人なんだねっ。\n\tすごいや！\n@c0@"
216:
  de: "@a%0%a001250@bDu hast das Ungeheuer für sie verscheucht, Papa, oder?\n@c0@"
  en: "@a%0%a001250@bYou got rid of the monster for them, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Y lo pasaste muy mal? Bueno, al menos ahora te puede entender.\n@c0@"
  fr: "@a%0%a001250@bC'est toi qui les a débarrassés du monstre, papaⓡ\n@c0@"
  it: "@a%0%a001250@bE così questo tizio ha capito di essersi sbagliato nel giudicarti...\n@c0@"
  ja: "@a@b%a001250「追い出されたのって\n\tお父さん……？\n@c0@"
217:
  de: "@a%0%a001250@bUnd es war wirklich nicht leicht für dich? Na, wenigstens versteht er dich jetzt.\n@c0@"
  en: "@a%0%a001250@bAnd it was a really hard time for you? Well, at least he understands you now.\n@c0@"
  es: "@aSancho@bEl tiempo lo cura todito.\nSí, sí. Está bien.\n@c0@"
  fr: "@a%0%a001250@bEt ça a été un mauvais moment à passer pour toiⓡ Eh bien, au moins il te comprend, maintenant.\n@c0@"
  it: "@a%0%a001250@bMeglio così.\nMi dispiacerebbe se qualcuno pensasse che il mio papino è un imbroglione!\n@c0@"
  ja: "@a@b%a001250「そう…　つらかったのね。\n\tでも　わかってもらえて　よかったね。\n@c0@"
218:
  de: "@aSancho@bDie Zeit heilt alle Wunden, Chico, weißt du. Sí, sí. So ist es.\n@c0@"
  en: "@aSancho@bTime ees the healer of all theengs, you know.\nSí, sí. Ees good.\n@c0@"
  es: "@aAlazar@bEn realidad, no sé lo que está insinuando.\n¡Pero, no me importa! No tiene nada que ver conmigo.\n@c0@"
  fr: "@aSancho@bLe t-temps apaise toutes les b-blessures, tu sais.\r\nSi, si. C'est bien.\n@c0@"
  it: "@aSancho@bComo dice el proverbio, ⓕel tiempo guarisce todos los malosⓖ, chico...\nTodo es bien quello que finisce bien.\n@c0@"
  ja: "@a@bサンチョ「時が　解決する問題も\n\tあるんですねえ。\n\tよかった　よかった。\n@c0@"
219:
  de: "@aOtto@bAlso, mir ist ja net so ganz klar, worauf er jetzt hinaus will. Aber egal! Hat ja nichts mit mir zu tun, was?\n@c0@"
  en: "@aTuppence@bI, I don't really see what he's driving at, personally. Still, never mind! Nothing to do with me, is it?\n@c0@"
  es: "@a%0%a001250@bVerás, por lo común los monstruos no son malos.\nCasi todos son buenos.\n@c0@"
  fr: "@aInnocent@bPersonnellement, je ne vois pas où il veut en venir. Enfin, peu importeⓠ Ça n'a rien à voir avec moi, n'est-ce pasⓡ\n@c0@"
  it: "@aSimon@bMaestà, sono certo che, nella sua infinità nobiltà d'animo, lei aveva già perdonato questo zotico...\n@c0@"
  ja: "@a@bピピン「どうも　いまひとつ　事情が\n\t飲みこめないんですが…　ま　いっか！\n\tボクには　関係なさそうだし。\n@c0@"
220:
  de: "@a%0%a001250@bDie meisten Monster sind gar nicht von Grund auf böse, weißt du. Eigentlich sind sie sogar fast ganz lieb.\n@c0@"
  en: "@a%0%a001250@bMost monsters aren't bad at all, you know.\nThey're nearly all good.\n@c0@"
  es: "@aSancho@b¿El monstruo que atacó la aldea era %a001210? Sí, ahorita encaja todo.\n@c0@"
  fr: "@a%0%a001250@bLa plupart des monstres ne sont pas du tout méchants, tu sais. Ils sont presque tous gentils.\n@c0@"
  it: "@a%0%a001250@bSono pochi i mostri cattivi. Anzi, sono pochissimi!\nVorrei tanto che la gente se ne rendesse conto...\n@c0@"
  ja: "@a@b%a001250「悪い魔物さんは\n\tちょっとしか　いないのよ。\n\tみんな　ほんとはいい子なの。\n@c0@"
221:
  de: "@aSancho@bDieses Monster, das das Dorf angegriffen hat, das war %a001210? Sí, jetzt ergibt das alles einen Sinn.\n@c0@"
  en: "@aSancho@bThees monster attacking the village, eet was %a001210? Sí, thees makes esense now.\n@c0@"
  es: "@aBianca@bEstá todo muy tranquilo. Supongo que todas las aldeítas son así por la noche.\n@c0@"
  fr: "@aSancho@bCe m-monstre qui attaquait le v-village, c'était %a001210ⓡ Si, je c-comprends mieux, maintenant.\n@c0@"
  it: "@aSancho@bEl mostro responsabile por la devastazion de los campos era %a001210... ¡Ay, que brutta cosa!\nPer fortuna todo se es resolto bien...\n@c0@"
  ja: "@a@bサンチョ「村を　おそったっていうのは\n\tもしや　%a001210ですか？\n\tああ　それで！\n@c0@"
222:
  de: "@aBianca@bEs ist so still hier. Darin sind kleine Dörfer sich wohl alle gleich.\n@c0@"
  en: "@aBianca@bIt's so quiet here. I s'pose all little villages are like this of a night.\n@c0@"
  es: "@aNera@bVeramente, solo se oye el borboteo de la corriente y el cri-cri de los grillos.\n@c0@"
  fr: "@aBianca@bTout est tellement silencieux, ici. Je suppose que tous les petits villages sont comme ça, pendant la nuit.\n@c0@"
  it: "@aBianca@bDi notte c'è una calma incredibile...\n@c0@"
  ja: "@a@bビアンカ「しずかな村ねえ……。\n\tいなかの夜って　こんなものなのかな。\n@c0@"
223:
  de: "@aNera@bAlles, was man hört, ist das Rauschen des Flusses und das Konzert der Zikaden.\n@c0@"
  en: "@aNera@bAll you can hear is the murmuring of the stream and the sound of the crickets.\n@c0@"
  es: "@a%0%a001240@bParece que todos están durmiendo. Aaaaah...\nAhora yo también tengo sueño.\n@c0@"
  fr: "@aNera@bTout ce qu'on entend, c'est le murmure de l'eau\r\net le chant des grillons.\n@c0@"
  it: "@aNera@bChe silenzio...\nSi sente solo il frinire dei grilli...\n@c0@"
  ja: "@a@bフローラ「聞こえてくるのは\n\tせせらぎの音と\n\t虫の鳴き声だけですわね。\n@c0@"
224:
  de: "@a%0%a001240@bOffenbar schlafen schon alle. Aaaaah... Jetzt bin ich auch müde.\n@c0@"
  en: "@a%0%a001240@bIt looks like everyone's asleep. Aaaaahh...\nI'm sleepy too, now.\n@c0@"
  es: "@a%0%a001250@b¡Vaya! ¡Mira las estrellas!\nEstán preciosas hoy también.\n@c0@"
  fr: "@a%0%a001240@bTout le monde dort, on dirait. Aaaaah...\nMoi aussi, j'ai sommeil, maintenant.\n@c0@"
  it: "@a%0%a001240@bL'intero villaggio sta dormendo...\nYaaawn...\nÈ venuto sonno anche a me!\n@c0@"
  ja: "@a@b%a001240「……もう　みんな\n\t寝てるみたいだね。\n\tふぁ…　うん　ボクも眠いかも。\n@c0@"
225:
  de: "@a%0%a001250@bUi! Sieh dir nur die Sterne an! Sie sehen heute wieder wunderschön aus.\n@c0@"
  en: "@a%0%a001250@bWow! Look at the stars!\nThey're so beautiful again tonight.\n@c0@"
  es: "@aSancho@bEstas noches en calma a veces están padrísimas, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bWaouhⓠ Regarde les étoilesⓠ Elles sont encore\nsi belles, ce soir.\n@c0@"
  it: "@a%0%a001250@bStanotte le stelle sembrano persino più belle del solito...\n@c0@"
  ja: "@a@b%a001250「今日も　お星さまが\n\tきれいです…　ふわぁ……。\n@c0@"
226:
  de: "@aSancho@bSo ruhige Nässte, die sind auch mal ganz nett, nisst?\n@c0@"
  en: "@aSancho@bThese quiet nights, they are okay\r\nesometimes, no?\n@c0@"
  es: "@aAlazar@bDar vueltas de esta forma es una pesadez.\n¿Por qué no contamos historias de fantasmas o lo que sea?\n@c0@"
  fr: "@aSancho@bCes nuits t-t-tranquilles, c'est bien, de temps\nen temps, noⓡ\n@c0@"
  it: "@aSancho@bChico, que noche tranquilla...\n@c0@"
  ja: "@a@bサンチョ「たまには　こういう\n\tしずかな夜も　いいもんですねえ。\n@c0@"
227:
  de: "@aOtto@bEinfach so herumzuwandern ist wirklich gähnend langweilig. Warum erzählen wir uns net ein paar G'spensterg'schichten oder so?\n@c0@"
  en: "@aTuppence@bJust walking around like this is thoroughly dull.\nWhy don't we tell ghost stories or something?\n@c0@"
  es: "@aAlazar@b¿Y si os entretengo con el sorprendente relato del valor de Alazar? ¿Mmm? ¡Ah!, ¿no os interesa?\n@c0@"
  fr: "@aInnocent@bC'est vraiment ennuyeux de déambuler comme ça.\nEt si on se racontait des histoires de fantômesⓡ\n@c0@"
  it: "@aSimon@bMaestà, apprezzo la calma di questi luoghi, ma le confesso di preferire le sfavillanti luci della città.\n@c0@"
  ja: "@a@bピピン「ただ　歩いてるだけだと\n\tたいくつ　ですよね。\n\tこわい話でも　しましょうか？\n@c0@"
228:
  de: "@aOtto@bOder wie wär's, wenn ich ein paar der spannenden Abenteuer von Otto dem Tollkühnen zum Besten geben würd'? Hm? Ach, die wollt Ihr lieber net hör'n?\n@c0@"
  en: "@aTuppence@bOr how about I regale you with the amazing\r\ntales of Tuppence's bravery? Hm? Oh, you're\r\nnot interested?\n@c0@"
  es: "@aBianca@bQué campesinos más precavidos, con esa forma de cerrar las puertas.\n@c0@"
  fr: "@aInnocent@bOu bien je pourrais vous régaler des incroyables aventures d'Innocent le preuxⓡ Heinⓡ Oh, ça ne vous intéresse pasⓡ\n@c0@"
  it: "@aSimon@bIn città c'è più vita, più movimento...\nE ci sono molte più fanciulle.\nGià, molte più fanciulle...\n@c0@"
  ja: "@a@bピピン「それとも　ボクの\n\tすばらしい人生をお話ししますか？\n\tえ　いらない？\n@c0@"
229:
  de: "@aBianca@bDas ist ungewöhnlich vorsichtig für Leute auf dem Lande, ihre Türen abzuschließen.\n@c0@"
  en: "@aBianca@bThey're pretty cautious for country folk, havin' their doors locked like that.\n@c0@"
  es: "@aNera@bSupongo que es normale que las puertas estén cerradas con llave a estas horas. Al fin y al cabo, los campesinos se levantan veramente temprano.\n@c0@"
  fr: "@aBianca@bIls sont plutôt méfiants pour des gens de la campagne, à fermer leurs portes à clef, comme ça.\n@c0@"
  it: "@aBianca@bAd Aprianuam non chiudiamo mai le porte a chiave...\n@c0@"
  ja: "@a@bビアンカ「いなかなのに　用心深いのね。\n\tちゃんと　戸じまりするなんて。\n@c0@"
230:
  de: "@aNera@bEs ist verständlich, dass ihre Türen zu dieser Zeit verschlossen sind. Bauern müssen schließlich früh raus.\n@c0@"
  en: "@aNera@bI suppose it's fair enough that their doors are\r\nlocked at this sort of time. Farmers do get up\r\nearly, after all.\n@c0@"
  es: "@a%0%a001240@bEstá cerrado. ¿Por qué no volvemos por la mañana, papá?\n@c0@"
  fr: "@aNera@bÇa me semble assez normal que les portes soient fermées à cette heure-ci. Les fermiers se lèvent\r\ntrès tôt, après tout.\n@c0@"
  it: "@aNera@bMi pare normale che di notte le porte siano chiuse, no?\nLa prudenza non è mai troppa...\n@c0@"
  ja: "@a@bフローラ「この時間では　カギが\n\tかかっていても　しかたありませんわ。\n\t農村の朝は　早いものですし。\n@c0@"
231:
  de: "@a%0%a001240@bEs ist abgeschlossen. Wollen wir nicht lieber morgen früh wiederkommen, Papa?\n@c0@"
  en: "@a%0%a001240@bIt's locked. Why don't we come back in the\nmorning, Dad?\n@c0@"
  es: "@aSancho@bAhorita es muy tarde para hacer visitas, chamaco.\nVolveremos mañana, ¿ok?\n@c0@"
  fr: "@a%0%a001240@bC'est fermé. Pourquoi on ne reviendrait pas\ndemain matin, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, la porta è chiusa a chiave.\nCredo ci convenga tornare domattina...\n@c0@"
  ja: "@a@b%a001240「カギがかかってるね。\n\tお父さん　今日は　もう　ねようよ。\n@c0@"
232:
  de: "@aSancho@bEs ist sehr spät, um jemanden zu besuchen, Chico. Wir kommen morgen wieder, sí?\n@c0@"
  en: "@aSancho@bEes late now to pay esomeone a visit, friend.\nWe come back tomorrow, sí?\n@c0@"
  es: "@aNera@b¡Mamma mia, poverino!\n@c0@"
  fr: "@aSancho@bIl est t-tard pour rendre visite à quelqu'un, chico. Revenons plutôt d-demain, noⓡ\n@c0@"
  it: "@aSancho@bChico, ahora es tarde.\nTorneremo mañana...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　おじゃまするには\n\tおそい時間ですよ。\n\tまた　明日　出直しましょう。\n@c0@"
233:
  de: "@aNera@bAch herrje, der arme Mann!\n@c0@"
  en: "@aNera@bOh dear, the poor man!\n@c0@"
  es: "@aNera@bEspero que llegue bien a casa. Dopo tanto tempo, puede que haya olvidado el camino.\n@c0@"
  fr: "@aNera@bOh, le pauvre hommeⓠ\n@c0@"
  it: "@aNera@bBeh, adesso potrà tornare a casa sua...\n@c0@"
  ja: "@a@bフローラ「それは　それは\n\t申し訳ないことをしてしまいましたわ。\n@c0@"
234:
  de: "@aNera@bIch hoffe nur, er kommt heil und gesund wieder nach Hause. Vielleicht hat er ja nach all der Zeit den Weg vergessen.\n@c0@"
  en: "@aNera@bI, I hope he gets home alright. Maybe he's forgotten his way after such a long time.\n@c0@"
  es: "@a%0%a001240@b¿Diez años? ¡No puede ser!\n@c0@"
  fr: "@aNera@bJ'espère qu'il rentrera chez lui sain et sauf.\r\nPeut-être qu'il a oublié le chemin du retour,\r\naprès tout ce temps.\n@c0@"
  it: "@aNera@bAmmesso che ricordi la strada che deve fare e non si perda un'altra volta!\n@c0@"
  ja: "@a@bフローラ「あの方　迷わずに\n\tちゃんと　おうちへ\n\t帰りつけると　いいんですけど……。\n@c0@"
235:
  de: "@a%0%a001240@bZehn Jahre?! Kann ja gar nicht sein!\n@c0@"
  en: "@a%0%a001240@bTen years!? No way!\n@c0@"
  es: "@a%0%a001250@b¿Mmm? ¿No había alguien hablándonos?\nMe he quedado traspuesta.\n@c0@"
  fr: "@a%0%a001240@bDix ansⓡⓐ Naaaaaanⓠ\n@c0@"
  it: "@a%0%a001240@bQuel signore ci ha cercati per dieci anni?!\nPapà, gli devi dei soldi, per caso?!\n@c0@"
  ja: "@a@b%a001240「１０年も　さがしてたの？\n\tすごすぎるよっ！\n@c0@"
236:
  de: "@a%0%a001250@bHm? Hat da jemand mit uns geredet? Ich bin eingeschlafen.\n@c0@"
  en: "@a%0%a001250@bHm? Was someone just talking to us?\nI fell asleep.\n@c0@"
  es: "@aAlazar@b¡Puerto Polaris está a kilómetros de aquí!\n@c0@"
  fr: "@a%0%a001250@bMmmⓡ On nous a parléⓡ Je m'étais endormie.\n@c0@"
  it: "@a%0%a001250@bPapà, chi è quel signore...?\nMi ha svegliata...\nYaaawn...\n@c0@"
  ja: "@a@b%a001250「ん？　だれかいたの？\n\tわたし　ねてました……。\n@c0@"
237:
  de: "@aOtto@bBakenmünde ist doch ewig weit von hier!\n@c0@"
  en: "@aTuppence@bLodestar Harbour's miles off!\n@c0@"
  es: "@aAlazar@bEn mi opinión, es un sirviente bastante inútil. Yo lo echaría.\n@c0@"
  fr: "@aInnocent@bMais Port-Lanterne est à des kilomètres d'iciⓠ\n@c0@"
  it: "@aSimon@bGrandport?!\nSi è perso mentre andava a Grandport?!\n@c0@"
  ja: "@a@bピピン「ポートセルミとは　ぜんぜん\n\tちがう場所じゃないか！\n@c0@"
238:
  de: "@aOtto@bAls Diener taugt er ja net viel, wenn Ihr mich fragt. Ich tät' ihn rauswerfen.\n@c0@"
  en: "@aTuppence@bHe's a pretty useless manservant, if you ask me.\nI'd let him go.\n@c0@"
  es: "@aBianca@b¿Nos quedamos aquí esta noche? Creo que pasaremos una noche muy tranquila, ¿sabes?\n@c0@"
  fr: "@aInnocent@bJe ne le trouve pas très efficace comme serviteur. Moi, je lui donnerais congé.\n@c0@"
  it: "@aSimon@bBeh?! Che c'è di strano?!\nPuò capitare a tutti di perdersi, no?\nIo non ne farei un dramma...\n@c0@"
  ja: "@a@bピピン「役立たずの使者も\n\tあったもんですねえ。\n@c0@"
239:
  de: "@aBianca@bWollen wir heute Nacht hier bleiben? Bei dieser Stille können wir sicher gut schlafen.\n@c0@"
  en: "@aBianca@bShall we stay here tonight? I reckon we'd get a pretty quiet night's sleep.\n@c0@"
  es: "@aNera@bEs un po' lúgubre, ma non credo que sea malo pasar una noche en un sitio así de vez en cuando.\n@c0@"
  fr: "@aBianca@bEst-ce qu'on reste ici, cette nuitⓡ\nJe parie qu'on dormira très paisiblement.\n@c0@"
  it: "@aBianca@bChe ne dici di trascorrere la notte qui?\n@c0@"
  ja: "@a@bビアンカ「今夜は　ここに泊まる？\n\tしずかに　眠れそうよ。\n@c0@"
240:
  de: "@aNera@bEs ist ein wenig einsam, aber es kann ja nicht schaden, gelegentlich an einem solchen Ort zu übernachten.\n@c0@"
  en: "@aNera@bIt feels a bit desolate, but I suppose it can't hurt to stay over in a place like this every once in a while.\n@c0@"
  es: "@a%0%a001240@bMmm... ¿Lo estáis oliendo?\n¡Seguro que aquí la comida es deliciosa!\n@c0@"
  fr: "@aNera@bL'endroit n'est pas très réjouissant, mais ça n'est pas grave de dormir de temps à autre dans des lieux comme ici.\n@c0@"
  it: "@aNera@bNon sarà una sistemazione principesca, ma sarà sempre meglio che trascorrere la notte all'aperto.\nQui potremo riposare tranquilli...\n@c0@"
  ja: "@a@bフローラ「さびしい感じが　しますけど\n\tたまには　こういうところに泊まるのも\n\t悪くないですわ。\n@c0@"
241:
  de: "@a%0%a001240@bHmm... Riechst du das? Ich wette, hier schmeckt das Essen einfach köstlich!\n@c0@"
  en: "@a%0%a001240@bMmm... Can you smell that?\nI bet dinner here tastes delicious!\n@c0@"
  es: "@aSancho@bSí, sí. Esta posada me simpatiza mucho.\nEn un sitio poco formal está uno más relajadito.\n@c0@"
  fr: "@a%0%a001240@bMmm... Tu sens cette odeurⓡ Je parie que les\nrepas sont succulents, iciⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti, che profumino!\nChissà come si mangia bene qui!\n@c0@"
  ja: "@a@b%a001240「わ～！\n\tなんか　いいにおいがする。\n\tきっと　ここのゴハン　おいしいよ！\n@c0@"
242:
  de: "@aSancho@bSí, sí. Hier gefällt es mir. Wenn es nisst so förmliss ist, kann man siss viel besser entspannen, no?\n@c0@"
  en: "@aSancho@bSí, sí. Thees ees my kind of inn.\nYou can relax when ees no eso formal, no?\n@c0@"
  es: "@aAlazar@b¡¿Cómo?! ¿Nos quedamos esta noche aquí?\n¡Oh, no!, las camas parecen duras como piedras.\n@c0@"
  fr: "@aSancho@bSi, si. C'est t-tout à fait mon style d'auberge. Quand ce n'est p-pas guindé, on peut se d-détendre, noⓡ\n@c0@"
  it: "@aSancho@b¡Esta locanda me gusta!\nEs un luego tranquillo y senza pretesas, l'ideal por reposare en santa paz.\n@c0@"
  ja: "@a@bサンチョ「私は　こういう宿　好きですね。\n\tかざらない感じが\n\tくつろげるって　もんですよ。\n@c0@"
243:
  de: "@aOtto@bWas?! Wir wollen hier übernachten? Oh nein! Das Bett wirkt hart wie ein Brett!\n@c0@"
  en: "@aTuppence@bWhat!? We're spending the night here?\r\nOh no, the beds look as hard as rocks.\n@c0@"
  es: "@aBianca@bA lo mejor el monstruo que ha estado atacando Puebla del Heno se oculta en esta cueva, ¿sabes?\n@c0@"
  fr: "@aInnocent@bQuoiⓡⓐ On passe la nuit iciⓡ Oh non,\nles lits ont l'air durs comme du bois.\n@c0@"
  it: "@aSimon@bMaestà, vuole proprio pernottare qui? Non preferirebbe una sistemazione meno spartana?\nLo dico per lei, sa? Per me un posto vale l'altro...\n@c0@"
  ja: "@a@bピピン「まさか　今夜は　ここに！？\n\tうう…　ベッドが\n\tかたそうなんですけど……。\n@c0@"
244:
  de: "@aBianca@bVielleicht versteckt sich das Monster, das Bauernsiepen heimsucht, hier in dieser Höhle.\n@c0@"
  en: "@aBianca@bMaybe the monster who's bin attackin' Hay hangs out in this cave.\n@c0@"
  es: "@aNera@bIl mostro estará enojado porque nos hemos metido en la sua guarida.\n@c0@"
  fr: "@aBianca@bPeut-être que le monstre qui s'en prend à Chaumes se terre dans cette grotte.\n@c0@"
  it: "@aBianca@bForse il mostro che terrorizza gli abitanti di Punta Campestre ha la sua tana in questa caverna...\n@c0@"
  ja: "@a@bビアンカ「この洞くつね　カボチの畑を\n\tあらす　化け物がひそんでるのは……。\n@c0@"
245:
  de: "@aNera@bWahrscheinlich ist das Monster ziemlich aggressiv, weil wir in seine Höhle eingedrungen sind.\n@c0@"
  en: "@aNera@bThe monster will probably be quite aggressive because we've strayed into its lair.\n@c0@"
  es: "@aNera@bTen cuidado, caro mio.\n@c0@"
  fr: "@aNera@bLe monstre risque d'être très agressif s'il se sent pris au piège dans sa tanière.\n@c0@"
  it: "@aNera@bSono certa che il mostro ci attaccherà non appena avrà scoperto che siamo entrati nella sua tana...\n@c0@"
  ja: "@a@bフローラ「自分のすみかに\n\t入ってこられたら　化け物さんも\n\t凶暴になるかも知れませんわ……。\n@c0@"
246:
  de: "@aNera@bSei bloß vorsichtig, Liebling.\n@c0@"
  en: "@aNera@bDo take care, darling.\n@c0@"
  es: "@a%0%a001240@bLos aldeanos trabajan todos mucho labrando sus tierras. Deberíamos librarlos de ese monstruo.\n@c0@"
  fr: "@aNera@bSois prudent, mon chéri.\n@c0@"
  it: "@aNera@bFacciamo attenzione, tesoro...\n@c0@"
  ja: "@a@bフローラ「あなた…　気をつけて。\n@c0@"
247:
  de: "@a%0%a001240@bDie Dörfler hier rackern sich richtig ab, um ihre Pflanzen anzubauen. Wir sollten das Ungeheuer für sie verscheuchen.\n@c0@"
  en: "@a%0%a001240@bThe villagers are all working really hard to grow stuff. We should see this monster off for them.\n@c0@"
  es: "@a%0%a001250@bMe pregunto qué clase de monstruo será.\nSeguro que no es malo.\n@c0@"
  fr: "@a%0%a001240@bLes villageois travaillent vraiment très dur pour faire pousser leurs cultures. On devrait chasser\nce monstre pour eux.\n@c0@"
  it: "@a%0%a001240@bPapà, dobbiamo fare il possibile per aiutare gli abitanti del villaggio... Non è giusto che un mostro saccheggi i campi che coltivano con tanta fatica!\n@c0@"
  ja: "@a@b%a001240「村の人たち　がんばって\n\t畑を　たがやしてたんだ。\n\t悪い魔物　やっつけてあげようね！\n@c0@"
248:
  de: "@a%0%a001250@bWas das wohl für ein Monster ist? Bestimmt ist es im Grunde ganz gutmütig.\n@c0@"
  en: "@a%0%a001250@bI wonder what kind of monster it is.\nIt's probably not a bad one.\n@c0@"
  es: "@aSancho@b¡Eres un hombre noble, chamaco!\nAtiendes las peticiones de auxilio incluso de los desconocidos.\n@c0@"
  fr: "@a%0%a001250@bJe me demande de quel genre de monstre il s'agit.\nIl n'est sans doute pas méchant.\n@c0@"
  it: "@a%0%a001250@bMi chiedo che tipo di mostro sia responsabile degli attacchi...\n@c0@"
  ja: "@a@b%a001250「どんな魔物さんかな？\n\tいい子かな？　悪い子かな？？\n@c0@"
249:
  de: "@aSancho@bDu... Du bist so ein feiner Mann, Chico! Du reagierst sogar auf Hilfegesuche von Wildfremden.\n@c0@"
  en: "@aSancho@bYou, you are esuch a fine man, friend!\r\nYou accept thees cry for help, even\r\nfrom estrangers.\n@c0@"
  es: "@aSancho@bSí, de tal palo, tal astilla. Eres igualito que tu apá.\n@c0@"
  fr: "@aSancho@bT-Tu es oun tellement b-brave homme, chicoⓠ\nTu acceptes de répondre à t-tous les appels au\ns-s-secours, même s'ils viennent d'oun étranger.\n@c0@"
  it: "@aSancho@b¡Chico, sei un hombre dal corazon muy bueno!\n¡Hai dimostrato de avere mucha generosità accettando de aiutare questos poverettos!\n@c0@"
  ja: "@a@bサンチョ「%a000090王　ごりっぱです。\n\t他国の民の願いまで\n\t聞き届けようとは！\n@c0@"
250:
  de: "@aSancho@bDu bist ganz genau wie dein Papá.\n@c0@"
  en: "@aSancho@bSí, from esuch a log, esuch cheeps. You are just like your papá.\n@c0@"
  es: "@aAlazar@bSí, necesito aporrear unos cuantos monstruos para edificar la Leyenda de Alazar. ¡Bien, manos a la obra!\n@c0@"
  fr: "@aSancho@bSi, tel padre, tel fils. Tu es c-comme ton père.\n@c0@"
  it: "@aSancho@bSei proprio como tuo padre...\n¡El sangre bueno no dice bugias!\n@c0@"
  ja: "@a@bサンチョ「そういう　やさしいところ\n\tパパスさまに　そっくりですよ。\n@c0@"
251:
  de: "@aOtto@bJa, ein kleines Monstergefecht käm' mir grad' recht. Damit lässt sich die Legende von Otto dem Tollkühnen noch ein wenig auspolstern. Also los!\n@c0@"
  en: "@aTuppence@bYes, I'll need a bit of monster-bashing to flesh out the Legend of Tuppence. Right, let's get on with it!\n@c0@"
  es: "@aBianca@bEstos huesos desparramados por el suelo dan un poco de yuyu, ¿eh?\n@c0@"
  fr: "@aInnocent@bSuperⓠ Il me fallait justement un peu d'écrabouillage de monstres pour alimenter la légende d'Innocent. Parfait, allons-yⓠ\n@c0@"
  it: "@aSimon@bMaestà, Simon è pronto per affrontare qualsiasi mostro!\nSono ai suoi ordini, Sire!\n@c0@"
  ja: "@a@bピピン「ボクの伝説には　とうぜん\n\t魔物退治も　必要だな。\n\tよし！　がんばるぞ！\n@c0@"
252:
  de: "@aBianca@bAll diese Knochen, die hier verstreut sind, wirken nicht gerade beruhigend, was?\n@c0@"
  en: "@aBianca@bAll them bones scattered about the place are a bit of a worry, eh?\n@c0@"
  es: "@aNera@bEs desconcertante ver tutti estos huesos esparcidos por aquí, ¿verdad?\n@c0@"
  fr: "@aBianca@bTous ces ossements éparpillés un peu partout\nne sont guère rassurants, heinⓡ\n@c0@"
  it: "@aBianca@bSanta dea, che spettacolo inquietante!\nQueste ossa sparse in giro non lasciano presagire niente di buono...\n@c0@"
  ja: "@a@bビアンカ「ねえ　さっきから\n\t気になってるんだけど…\n\tいやに　骨が　いっぱい落ちてない？\n@c0@"
253:
  de: "@aNera@bEs ist recht beängstigend, all diese Knochen hier verstreut zu sehen, findest du nicht?\n@c0@"
  en: "@aNera@bIt's rather disconcerting seeing all the bones strewn about in here, isn't it?\n@c0@"
  es: "@a%0%a001240@bAquí dentro hay montones de huesoso humanos, ¿verdad?\n¿Diríais... Diríais que se los ha comido el monstruo?\n@c0@"
  fr: "@aNera@bC'est assez déconcertant de voir tous ces\nossements dispersés un peu partout, nonⓡ\n@c0@"
  it: "@aNera@bOh, mamma mia!\nCome avranno fatto a finire qui tutte queste ossa?!\nNo, preferisco non saperlo...\n@c0@"
  ja: "@a@bフローラ「このあたりは\n\t骨が　たくさん落ちていて\n\tなんだか　不気味ですわ……。\n@c0@"
254:
  de: "@a%0%a001240@bHier drin gibt's aber jede Menge menschliche Knochen, nicht? Glaubst... Glaubst du, den Rest hat das Ungeheuer gefressen?\n@c0@"
  en: "@a%0%a001240@bThere are lots of human bones in here, aren't there? Do you... Do you think the monster ate them?\n@c0@"
  es: "@aBianca@bLos caminos son un poco peligrosos por aquí, ¿eh?\r\nVigila dónde pones los pies.\n@c0@"
  fr: "@a%0%a001240@bIl y a beaucoup d'ossemements humains, là-dedans, nonⓡ Tu crois... Tu crois que c'est le monstre qui les a mangésⓡ\n@c0@"
  it: "@a%0%a001240@bAccidenti, quante ossa!\nPapà, credi che siano i resti degli ⓕspuntiniⓖ del mostro?\n@c0@"
  ja: "@a@b%a001240「この洞くつ…　人の骨が\n\tいっぱい　落ちてるけど\n\tその魔物が　食べたんじゃないよね？\n@c0@"
255:
  de: "@aBianca@bPass auf, wo du hintrittst, ja? Die Wege hier sehen etwas gefährlich aus.\n@c0@"
  en: "@aBianca@bThe paths are a bit dodgy in here, eh?\r\nMind where you're walkin', won't you?\n@c0@"
  es: "@aBianca@b¿Aún conservas la cinta que te di cuando éramos niños?\n@c0@"
  fr: "@aBianca@bLes chemins n'ont pas l'air très sûrs ici.\nAttention où tu mets les pieds, d'accordⓡ\n@c0@"
  it: "@aBianca@bNon è facile avanzare qui dentro...\nFacciamo attenzione a dove mettiamo i piedi!\n@c0@"
  ja: "@a@bビアンカ「道が　悪いわね……。\n\t%a000090　落ちないように\n\t気をつけてね。\n@c0@"
256:
  de: "@aBianca@bHast du noch das Band, das ich dir gegeben habe, als wir noch klein waren?\n@c0@"
  en: "@aBianca@bHave you still got that ribbon I give you back when we were kids?\n@c0@"
  es: "@aBianca@bMe alegro de saber que aún la tienes después de tantos años.\n@c0@"
  fr: "@aBianca@bTu as toujours ce ruban que je t'avais offert quand nous étions enfantsⓡ\n@c0@"
  it: "@aBianca@bSenti, ricordi il fiocco che ti diedi tanti anni fa?\nCe l'hai ancora?\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a000090。\n\t子供のころ　あなたにあげた\n\t私のリボンって　まだ持ってる？\n@c0@"
257:
  de: "@aBianca@bDas ist gut. Ich freue mich, dass du es all die Jahre behalten hast.\n@c0@"
  en: "@aBianca@bThat's good. It's nice to know you've kept it\r\nall these years.\n@c0@"
  es: "@aBianca@b¡Pero si la tienes ahí mismo! ¡Deja de tomarme el pelo, caradura!\n@c0@"
  fr: "@aBianca@bC'est bien. Ça me fait plaisir de savoir que tu l'as gardé pendant toutes ces années.\n@c0@"
  it: "@aBianca@bDavvero?\nMi fa piacere che tu l'abbia conservato per tutto questo tempo, sai?\n@c0@"
  ja: "@a@bビアンカ「うれしい。\n\tだいじに　持っててくれたのね。\n@c0@"
258:
  de: "@aBianca@bAber da ist es doch! Du willst mich wohl auf den Arm nehmen, du alter Hanswurst!\n@c0@"
  en: "@aBianca@bBut you've got it right there! Stop teasin' me, you cheeky monkey!\n@c0@"
  es: "@aNera@bMe siento un po' mareada de recorrer estos caminos con hoyos per todas partes.\n@c0@"
  fr: "@aBianca@bMais si, je le vois, làⓠ Arrête de te payer ma tête, gros farceurⓠ\n@c0@"
  it: "@aBianca@bMa se ce l'hai lì!\nSei proprio un burlone!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「もう　私たちの持ち物の中に\n\tちゃんとあるじゃない！\n\t%a000090ったら　いいかげんね。\n@c0@"
259:
  de: "@aNera@bDieser Weg mit den vielen Löchern verunsichert mich ein wenig.\n@c0@"
  en: "@aNera@bWalking along this path with all these holes everywhere is starting to make me feel rather faint.\n@c0@"
  es: "@aNera@bTengo miedo de caerme, ma procuraré no quedarme atrás.\n@c0@"
  fr: "@aNera@bMarcher sur ce chemin plein de trous commence à me donner un peu le vertige.\n@c0@"
  it: "@aNera@bChe atmosfera da brividi...\nAvanzare qui dentro è tutt'altro che una passeggiata di piacere...\n@c0@"
  ja: "@a@bフローラ「道のあちこちに\n\t穴があいていて…\n\t私　少し　クラクラしていますわ。\n@c0@"
260:
  de: "@aNera@bIch habe wirklich Angst, ich könnte fallen, aber ich tue, was ich kann, um mit dir mitzuhalten, Liebling.\n@c0@"
  en: "@aNera@bI'm really worried about falling, but I'll do my best to keep up with you.\n@c0@"
  es: "@a%0%a001240@b¿Has visto ese pelo rubio que hay por el suelo? Es probable que sea del monstruo.\n@c0@"
  fr: "@aNera@bJ'ai vraiment peur de tomber, mais je vais faire tout mon possible pour ne pas te ralentir.\n@c0@"
  it: "@aNera@bHo paura di cadere!\r\nNon mi è facile tenere il tuo passo, ma cercherò di farcela...\n@c0@"
  ja: "@a@bフローラ「私　落ちるのは\n\t苦手なんですけど…　あなたに\n\tついてゆくため　がんばりますわ。\n@c0@"
261:
  de: "@a%0%a001240@bSind dir die goldenen Haare aufgefallen, die hier und dort auf dem Boden liegen? Die sind bestimmt von dem Monster.\n@c0@"
  en: "@a%0%a001240@bHave you noticed the golden hairs on the ground here and there? They're probably from the monster.\n@c0@"
  es: "@a%0%a001250@bPapi, ese lazo que llevas a todas partes... ¿es importante o algo así?\n@c0@"
  fr: "@a%0%a001240@bTu as remarqué les poils dorés qu'on voit de temps\nen temps sur le solⓡ Ils doivent sûrement venir\ndu monstre.\n@c0@"
  it: "@a%0%a001240@bCi sono molti peli dorati qui intorno.\nSecondo me provengono dalla pelliccia del mostro...\n@c0@"
  ja: "@a@b%a001240「金色の毛が　地面に\n\tときどき落ちてるよ。\n\tたぶん……魔物のだよね？\n@c0@"
262:
  de: "@a%0%a001250@bDu, hör mal, das Band, das du immer bei dir trägst, Papa? Ist das irgendwie wichtig oder so?\n@c0@"
  en: "@a%0%a001250@bYou know that ribbon you always carry around, Dad? Is it really important or something?\n@c0@"
  es: "@a%0%a001250@bYo puedo encontrar el camino a la salida. ¡Fui dejando envoltorios de caramelos para señalar el trayecto!\n@c0@"
  fr: "@a%0%a001250@bDis, tu sais ce ruban que tu as toujours sur toiⓡ\nIl est vraiment importantⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, quel fiocco che porti sempre con te è un oggetto importante?\nHo notato che non te ne separi mai...\n@c0@"
  ja: "@a@b%a001250「そういえば　お父さん\n\tずっと　リボン持ってたよね？\n\tあれって　大事なものなの？\n@c0@"
263:
  de: "@a%0%a001250@bIch kann uns wieder hier herausführen! Ich habe überall das Einwickelpapier von Süßigkeiten fallen lassen, um unseren Weg zu kennzeichnen!\n@c0@"
  en: "@a%0%a001250@bI can lead us back out of here. I've been dropping sweet wrappers to mark the trail!\n@c0@"
  es: "@a%0%a001250@b¿Eh? ¡Oh, oh! Está demasiado oscuro como para verlos.\nNo se me había ocurrido.\n@c0@"
  fr: "@a%0%a001250@bJe pourrai nous faire ressortir de cet endroit\nsans problème. J'ai semé des noisettes pour\nmarquer le cheminⓠ\n@c0@"
  it: "@a%0%a001250@bSarà facilissimo uscire da questo posto...\nBasterà seguire a ritroso le gocce di sudore che sto versando da quando siamo entrati!\n@c0@"
  ja: "@a@b%a001250「帰り道　わかります。\n\tわたし　お菓子ちぎって\n\tまいてきたの。　ほら……\n@c0@"
264:
  de: "@a%0%a001250@bWas? Oh je! Es ist zu dunkel, um sie zu sehen! Daran hatte ich nicht gedacht.\n@c0@"
  en: "@a%0%a001250@bHuh? Uh-oh! It's too dark to see them!\nI didn't think of that.\n@c0@"
  es: "@aSancho@b¡Ándale! Es por acá. De vez en cuando veo huellas de las patas del monstruo o algo de su pelo por el suelo.\n@c0@"
  fr: "@a%0%a001250@bHeinⓡ Oh-ohⓠ Il fait trop noir pour les voirⓠ\nJe n'avais pas pensé à ça.\n@c0@"
  it: "@a%0%a001250@bSì, lo confesso: sto sudando freddo!\nHo paura che ci troveremo davanti una belva ferocissima!\n@c0@"
  ja: "@a@b%a001250「……グスッ。\n\tくらくて　お菓子のめじるし\n\t見えないの……。\n@c0@"
265:
  de: "@aSancho@bSí. Hier entlang ist es risstig. Manssmal sehe ich die Spuren von den Pfoten des Monsters oder ein paar seiner Haare auf dem Boden.\n@c0@"
  en: "@aSancho@bSí. Thees ees the right way. Esometimes I esee the marks of the monster's feet, or esome of eets hair on the ground.\n@c0@"
  es: "@aAlazar@bCuando matemos a esta bestia, %a000090. ¿qué tal si hacemos una capa u otra cosa con su piel?\n@c0@"
  fr: "@aSancho@bSi. C'est le b-bon chemin. Parfois, je vois des\r\nt-t-traces du monstre ou des touffes de p-poils sur le sol.\n@c0@"
  it: "@aSancho@bChico, yo pienso que estiamo sulla estrada giusta.\nEl terreno es pieno de las improntas del mostro y de los suos pelos...\n@c0@"
  ja: "@a@bサンチョ「あちこちに　足あとやら\n\t魔物の毛やらが　落ちてます。\n\tここで　まちがいないようですね。\n@c0@"
266:
  de: "@aOtto@bSobald wir die Bestie erschlagen haben, %a000090, könnten wir aus seinem Fell doch einen Mantel oder so was machen, was meint Ihr?\n@c0@"
  en: "@aTuppence@bOnce we've slain this beast, %a000090, what say we make a cloak or something from its coat?\n@c0@"
  es: "@aAlazar@bSeguro que os quedaba fenomenal.\n@c0@"
  fr: "@aInnocent@bQuand nous aurons vaincu cette bête, %a000090, nous pourrions peut-être utiliser\nsa peau pour en faire un manteau, par exemple. \n@c0@"
  it: "@aSimon@bMaestà, vorrei farmi un bel cappotto con la pelliccia del mostro...\n@c0@"
  ja: "@a@bピピン「%a000090さま。\n\t魔物のヤツをたおしたら\n\t毛皮で　マントを作りましょう！\n@c0@"
267:
  de: "@aOtto@bDas würd' Euch bestimmt wunderbar stehen.\n@c0@"
  en: "@aTuppence@bI bet it'd look absolutely sensational on you.\n@c0@"
  es: "@aBianca@b¡Uuuy! Espero que ese soldado no se haya caído de cabeza, ¿sabes?\n@c0@"
  fr: "@aInnocent@bJe parie que ça serait absolument sensationnel\r\nsur vous.\n@c0@"
  it: "@aSimon@bSono certo che mi starebbe proprio bene.\nO forse crede che un mantello mi slancerebbe di più?\nAllora, Sire? Meglio un cappotto o un mantello?\n@c0@"
  ja: "@a@bピピン「きっと　%a000090さまに\n\tにあいますよ～。\n@c0@"
268:
  de: "@aBianca@bHoppla! Ich hoffe, der Soldat ist nicht auf den Kopf gefallen.\n@c0@"
  en: "@aBianca@bOops! I hope that soldier en't fallen on his head.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Espero que ese soldado esté bene.\n@c0@"
  fr: "@aBianca@bOupsⓠ J'espère que ce soldat n'est pas tombé\nsur la tête.\n@c0@"
  it: "@aBianca@bAhia! Poveretto...\nDici che si sarà fatto male?\n@c0@"
  ja: "@a@bビアンカ「悪いことしたわね。\n\tあの戦士さん　頭から落ちたり\n\tしていないと　いいんだけど。\n@c0@"
269:
  de: "@aNera@bOh je! Hoffentlich ist dem Soldaten nichts passiert!\n@c0@"
  en: "@aNera@bOh dear! I hope that soldier's alright.\n@c0@"
  es: "@a%0%a001240@b¡Oh, oh! ¿Eso hemos hecho? ¿Qué vamos a hacer, papá? Estará bien, ¿no crees?\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ J'espère qu'il ne s'est rien cassé.\n@c0@"
  it: "@aNera@bAccidenti, che capitombolo!\nSperiamo che non si sia fatto nulla...\n@c0@"
  ja: "@a@bフローラ「まあ！　あの戦士さん\n\t打ち所が悪くて　死んだりしていないと\n\tいいのですけれど……。\n@c0@"
270:
  de: "@a%0%a001240@bOh je! Waren wir das? Was machen wir denn jetzt, Papa? Es geht ihm doch bestimmt gut, oder?\n@c0@"
  en: "@a%0%a001240@bUh-oh! Did we do that? What are we going to do, Dad? He'll be alright, won't he?\n@c0@"
  es: "@a%0%a001250@b¡Lo sentimos! ¡No era nuestra intención!\n¡No te hagas fantasma para perseguirnos!\n@c0@"
  fr: "@a%0%a001240@bOupsⓠ Boulette... Qu'est-ce qu'on va faire, papaⓡ\nIl va s'en sortir, heinⓡ\n@c0@"
  it: "@a%0%a001240@bOh-oh!\nNon siamo stati noi, vero?\nEhm...\n@c0@"
  ja: "@a@b%a001240「ボクたちのせい……だよね？\n\tどうしよう　お父さん！？\n\t生きてるよね？　生きてるよねっ！？\n@c0@"
271:
  de: "@a%0%a001250@bEs tut uns leid! Das haben wir nicht gewollt! Kommt nicht als Gespenst zurück, um bei uns zu spuken!\n@c0@"
  en: "@a%0%a001250@bWe're sorry! We didn't mean it!\nDon't come back as a ghost and haunt us!\n@c0@"
  es: "@aSancho@bEsta sorpresa fue demasiado, ¿ok?\n¡Ese señor me da miedo!\n@c0@"
  fr: "@a%0%a001250@bOn est désolésⓠ On ne l'a pas fait exprèsⓠ\nNe revenez surtout pas nous hanter quand\nvous serez un fantôme, d'accordⓡ\n@c0@"
  it: "@a%0%a001250@bOps!\nEhm, non l'avremo mica spaventato...?\n@c0@"
  ja: "@a@b%a001250「ごめんなさい　ごめんなさい\n\tオバケに　ならないで……！\n@c0@"
272:
  de: "@aSancho@bDas ist zu viel, diese Überraschung, no? Dieser Señor, er macht mir Angst!\n@c0@"
  en: "@aSancho@bEes too much, thees esurprise, no?\nThees señor, he, he escare me!\n@c0@"
  es: "@aAlazar@b¡Está bien! Cualquier cosa que le haya pasado, la guardaré en secreto. ¡Podéis contar conmigo!\n@c0@"
  fr: "@aSancho@bC'était t-t-trop, comme surprise, noⓡ\nIl m'a fait p-peur, ce señorⓠ\n@c0@"
  it: "@aSancho@bCapisco que uno se puede espaventar cuando ce se revolge a lui all'improvvisos, ma me pare que esto señor esagera...\n@c0@"
  ja: "@a@bサンチョ「それにしても\n\tおどろきすぎですよ。\n\tこっちまで　おどろきました。\n@c0@"
273:
  de: "@aOtto@bSch... Schon gut! Egal, was ihm passiert ist, ich werd's keinem weitersagen! Ihr könnt Euch auf mich verlassen!\n@c0@"
  en: "@aTuppence@bIt's, it's alright! Whatever's happened to him, I won't tell a soul! You can count on me!\n@c0@"
  es: "@aBianca@bParece que los soldados son gente robusta.\r\nAunque no esperaba que se desmayase, la verdad.\n@c0@"
  fr: "@aInnocent@bEuh... Tout va bienⓠ Quoi qu'il lui soit arrivé,\nje ne le dirai à personne, jamaisⓠ Vous pouvez compter sur moiⓠ\n@c0@"
  it: "@aSimon@bOh...!\nEhm... Non tema, Maestà: non dirò a nessuno che cos'ha fatto a quel poveretto...\n@c0@"
  ja: "@a@bピピン「だ　大丈夫です！\n\tもし　あの人に　なにかあっても\n\tボク　絶対　誰にも言いませんからっ！\n@c0@"
274:
  de: "@aBianca@bSoldaten sind offenbar hart im Nehmen. Nicht dass ich erwartet hätte, dass er in Ohnmacht sinkt.\n@c0@"
  en: "@aBianca@bLooks like soldiers are made of pretty stern stuff.\r\nI didn't expect him to faint, mind.\n@c0@"
  es: "@aNera@bMe alegro de que se encuentre bene. Pero me pregunto por dónde andará merodeando ese mostro...\n@c0@"
  fr: "@aBianca@bC'est costaud, un soldat, on dirait. Mais je ne m'attendais pas à le voir tomber dans les pommes.\n@c0@"
  it: "@aBianca@bA momenti quel tipo ci restava secco...\nNon mi sembra che abbia i nervi d'acciaio, eh?\nDi pastafrolla, al limite...\n@c0@"
  ja: "@a@bビアンカ「さすが　戦士だけあって\n\t丈夫だったみたいね。　まあ\n\t気絶してるとは　思わなかったけど。\n@c0@"
275:
  de: "@aNera@bIch bin froh, dass ihm nichts passiert ist. Aber ich frage mich, wo diese schreckliche Bestie lauert...\n@c0@"
  en: "@aNera@bI'm glad he's alright. I wonder where this almighty beast is lurking, though...\n@c0@"
  es: "@a%0%a001240@bNo hay monstruo que esté a la altura de mi padre, por muy fuerte que sea. ¿Verdad, papá?\n@c0@"
  fr: "@aNera@bJe suis contente qu'il n'ait rien. Mais je me demande où est le terrible monstre dont il parle... \n@c0@"
  it: "@aNera@bPer fortuna sta bene!\nA proposito del mostro, dove si nasconderà quella belva?\n@c0@"
  ja: "@a@bフローラ「ごぶじで　良かったですわ。\n\tそれにしても　トラのような\n\t化け物さんって　いったい……？\n@c0@"
276:
  de: "@a%0%a001240@bGegen meinen Papa kommt kein Ungeheuer an, egal wie stark es ist. Stimmt's nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bNo monster could be a match for my Dad, no matter how strong. Right, Dad?\n@c0@"
  es: "@aSancho@bNo es buena idea venir aquí solito.\nEse señor debe estar mal de la azotea, ¿no?\n@c0@"
  fr: "@a%0%a001240@bIl n'y a pas un monstre qui résiste à mon papaⓠ\nMême les plus costaudsⓠ Hein, papaⓠ\n@c0@"
  it: "@a%0%a001240@bNessun mostro ci fa paura!\nDico bene, papà?\n@c0@"
  ja: "@a@b%a001240「どんな強い魔物でも\n\tお父さんには　ぜったい\n\tかなわないもん！　ねっ！\n@c0@"
277:
  de: "@aSancho@bEs ist keine gute Idee, allein hierher zu kommen. Dieser Señor, vielleisst ist er un poco loco.\n@c0@"
  en: "@aSancho@bEes no a good idea to come here alone.\nThees señor, maybe he ees a leettle loco, no?\n@c0@"
  es: "@aAlazar@bMira el cuello. Lo tiene un poco torcido, ¿verdad?\nSe lo habrá hecho al caer.\n@c0@"
  fr: "@aSancho@bÇa n'est pas oune bonne idée de v-venir ici tout seul.\nCe señor, il est oun peu loco, noⓡ\n@c0@"
  it: "@aSancho@b¿Esto señor es venuto aquí todo solo nonostantes sapesse que ce está un mostro muy espaventoso?\n¡Alloras es totalmentes loco!\n@c0@"
  ja: "@a@bサンチョ「ひとりきりで　ここまで\n\tやって来るとは　むぼうな人ですねえ。\n@c0@"
278:
  de: "@aOtto@bSeht Euch nur den Hals an. Er sieht etwas verdreht aus, nicht? Das ist sicher beim Fallen passiert.\n@c0@"
  en: "@aTuppence@bLook at his neck. It looks a bit twisted, doesn't it?\nHe must have done that when he fell.\n@c0@"
  es: "@aBianca@b¿Crees que ese dientes de sable podía ser...?\n@c0@"
  fr: "@aInnocent@bRegardez son cou. Il a l'air un peu tordu, nonⓡ\nIl a dû se faire ça en tombant.\n@c0@"
  it: "@aSimon@bNon c'è mostro che possa spaventare il prode Simon, Maestà!\nNon tema, Sire! Alla belva ci penso io!\n@c0@"
  ja: "@a@bピピン「あれ？　あの戦士の首\n\tちょっと　ねじれてませんか？\n\t落ちた時に　やったのかな。\n@c0@"
279:
  de: "@aBianca@bDiese riesige Säbelzahnkatze, das war doch wohl nicht...\n@c0@"
  en: "@aBianca@bYou dun't think that giant sabrecat could've bin...\n@c0@"
  es: "@aBianca@bBah, supongo que las posibilidades son pequeñísimas. No me hagas caso.\n@c0@"
  fr: "@aBianca@bTu ne crois quand même pas que ce gigantesque smilodon pourrait être...\n@c0@"
  it: "@aBianca@bMa quel Koguar è...\n@c0@"
  ja: "@a@bビアンカ「あのキラーパンサー\n\tもしかして　もしかすると……\n@c0@"
280:
  de: "@aBianca@bAch was. Das wäre doch allzu unwahrscheinlich. Schon gut, ich hab nichts gesagt.\n@c0@"
  en: "@aBianca@bNah. I s'pose the chances of that are pretty slim, really. Just ignore me.\n@c0@"
  es: "@aNera@bHa sido extraño. Parecía que el monstruo se estaba conteniendo y no nos atacaba con tutta la sua forza.\n@c0@"
  fr: "@aBianca@bNon... La probabilité est quand même bien mince.\r\nOublie ce que j'ai dit.\n@c0@"
  it: "@aBianca@bNo, non è possibile.\nDevo essermi sbagliata...\n@c0@"
  ja: "@a@bビアンカ「う～ん…　でも　%a000090が　\n\t生き別れになったって　言ってたし…\n\tあっ　ごめん　考え事してた。\n@c0@"
281:
  de: "@aNera@bDas war ja merkwürdig. Das Ungeheuer schien sich etwas zurückzuhalten, statt uns mit aller Macht anzugreifen.\n@c0@"
  en: "@aNera@bThat was strange. That monster seemed to be holding back a little and not attacking with its full might.\n@c0@"
  es: "@a%0%a001240@b¿Por qué no nos ataca ese monstruo?\n@c0@"
