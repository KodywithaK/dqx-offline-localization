  es: "@aStefania@bEste bambino no debería estar corriendo por ahí.\n¡No pude permitrse que le entre hambre!\n@c0@"
  fr: "@aPandora@bÇa ne sert à rien de partir pour chercher de la nourriture dans ce coin. Ça revient à signer son propre arrêt de mort.\n@c0@"
  it: "@aViola@bSe questa povera gente dovesse emigrare sarebbe un dramma... Non credo che troverebbero facilmente un'altra area fertile come questa.\n@c0@"
  ja: "@a@bデボラ「山まで　食べ物を探しに行くって\n\t意味じゃないわよね　今のは。\n\t自ら　死を選ぼうってこと……？\n@c0@"
325:
  de: "@aGriselda@bDu solltest den Jungen davon abhalten, so wild herumzulaufen. Sonst bekommt er nachher noch Hunger!\n@c0@"
  en: "@aDebora@bYou should stop this boy from running around.\r\nHe can't afford to build up an appetite!\n@c0@"
