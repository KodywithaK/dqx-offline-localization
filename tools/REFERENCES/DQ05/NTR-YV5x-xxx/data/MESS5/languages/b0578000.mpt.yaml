  ja: "@a@bデボラ「%a000090。\n\tもちろん　この　のどかな村に\n\t用があって　来たのよね？\n@c0@"
323:
  de: "@aGriselda@bDie Felder sehen furchtbar aus, das ist mal sicher. Vielleicht kommt das Monster hierher wüten, weil es auch nichts mehr zu fressen hat.\n@c0@"
