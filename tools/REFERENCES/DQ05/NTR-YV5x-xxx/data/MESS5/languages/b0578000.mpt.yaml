  it: "@aSancho@b¡Insieme a ti no ce se annoia mai!\n@c0@"
  ja: "@a@bサンチョ「運命というやつかも\n\tしれませんねえ。\n@c0@"
321:
  de: "@aOtto@bUnsere Aufgabe hier ist schon getan, oder net? Das ist doch der ideale Moment, um Hintertür zu wirken! Ach, kommt schon! Hintertür! Hintertür!\n@c0@"
  en: "@aTuppence@bOur task here's done already, isn't it?\nIt's the perfect excuse to cast Evac!\nCome on! Evac! Evac!\n@c0@"
  es: "@aStefania@b%0%a000090, espero que tengas una buena razón para haberme traído al pompino d'il mondo.\n@c0@"
  fr: "@aInnocent@bNotre mission ici est terminée, n'est-ce pasⓡ\nC'est l'occasion idéale de lancer le sort Évac'ⓠ\nAllezⓠ Évac'ⓠ Évac'ⓠ\n@c0@"
