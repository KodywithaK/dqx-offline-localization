  de: "@a%0%a001250@bEs tut ihm wirklich leid. Er hat's doch nicht böse gemeint. Die Leute hier sollten's ihm nicht länger übel nehmen.\n@c0@"
  en: "@a%0%a001250@bHe's really sorry. He didn't mean it.\nThe people here should forgive him.\n@c0@"
