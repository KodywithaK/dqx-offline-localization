  ja: "@a@bデボラ「あんた\n\tこの子の　走りを　止めなさい。\n\tおなかを　空かせないように　するのよ！\n@c0@"
326:
  de: "@aGriselda@bFür heute Nacht werd ich hiermit wohl vorliebnehmen müssen. Aber morgen suchst du uns besser eine anständige Herberge.\n@c0@"
