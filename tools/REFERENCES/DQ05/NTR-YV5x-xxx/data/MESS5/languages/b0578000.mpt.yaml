  es: "@a%0%a001240@bTienes mucha suerte, papi. Tienes muchos monstruos de mascota. Yo ni siquiera tengo un perro.\n@c0@"
  fr: "@a%0%a001240@bDans ces montagnes, sans personne...\n%0%a001210 a vraiment dû se sentir seul.\n@c0@"
