  es: "@aStefania@bAquí no hay nada. ¡Ni un ruido!\nDemasiado calmo para mi gusto. El silencio me pone nerviosa.\n@c0@"
  fr: "@aPandora@bC'était le fameux monstreⓡ\nJe ne suis pas sûre que tu sois de taille à le battre.\n@c0@"
  it: "@aViola@bQuello era il mostro?!\nAccidenti! Sembra davvero feroce!\nHo paura che potresti lasciarci le penne, caro...\n㈡\nUhm, non ti ho detto una cosa molto incoraggiante, vero?\n@c0@"
  ja: "@a@bデボラ「あら　今のは　化け物……？\n\tあんなだと　ひざまずかせるのは\n\tむずかしそうね。\n@c0@"
334:
  de: "@aGriselda@bHier ist nichts zu sehen und zu hören. Nicht das kleinste Geräusch! Es ist viel zu ruhig, wenn du mich fragst. Eine unheimliche Stille.\n@c0@"
  en: "@aDebora@bThere's nothing to this place. Not even a sound!\r\nIt's far too quiet if you ask me. The silence is creepy.\n@c0@"
  es: "@aStefania@b¡Típicos campesinos, mira que cerrar a questa hora! Esto no pasa en Mostroferrato.\n@c0@"
  fr: "@aPandora@bIl n'y a rien, ici. Même pas un bruitⓠ C'est bien trop tranquille, si tu veux mon avis. Un tel silence fait froid dans le dos.\n@c0@"
  it: "@aViola@bQuesto silenzio non mi piace affatto...\nNon si sente nemmeno un rumore...\nStiamo in guardia, %a000090.\n@c0@"
  ja: "@a@bデボラ「ここは　何もない村だけど\n\t音までないとは　思わなかったわ。\n\t本当に　静かね……　怖いくらいに。\n@c0@"
335:
  de: "@aGriselda@bTypisch Landeier, die Türen zu dieser Zeit schon abzuschließen! In Mostroferrato würde dir das nicht passieren.\n@c0@"
  en: "@aDebora@bTypical country folk, locking their doors at this hour! You'd never find that in Mostroferrato.\n@c0@"
  es: "@aStefania@b¿Vamos a quedarnos aquí? Si es así, yo me pido ese letto con tan buena pinta. Tú duerme donde sea.\n@c0@"
  fr: "@aPandora@bC'est typique des gens de la campagne de verrouiller leurs portes à une heure pareilleⓠ On ne verrait jamais ça à Mostroferrato.\n@c0@"
  it: "@aViola@bStrano che sia chiuso a chiave...\nDi solito gli abitanti dei paesini di campagna non prendono questa precauzione.\n@c0@"
  ja: "@a@bデボラ「こんな時間に　カギをかけるだなんて\n\tさすがに　イナカなのね。\n\tサラボナでは　ありえないわ。\n@c0@"
336:
  de: "@aGriselda@bÜbernachten wir hier? Dann nehme ich das bequem aussehende Bett da drüben. Du kannst doch überall schlafen, nicht?\n@c0@"
  en: "@aDebora@bAre we going to stay here? If we are, I'm taking\r\nthat decent-looking bed over there. You'll sleep anywhere, right?\n@c0@"
  es: "@aStefania@bNunca me ha preocupado llamar la atenzione, ma no me gusta cómo miran aquí. Parece que me tienen miedo.\n@c0@"
  fr: "@aPandora@bEst-ce qu'on va rester iciⓡ Si c'est le cas, je prends le lit là-bas, celui qui a l'air correct. Toi, tu peux dormir n'importe où, de toute façon, nonⓡ\n@c0@"
  it: "@aViola@bQuesta non è certo la migliore sistemazione che abbia mai avuto in vita mia, ma non è nemmeno la peggior... No, no: ripensandoci, è proprio la peggiore...\n@c0@"
  ja: "@a@bデボラ「ふわぁぁ～……　ここに泊まるの？\n\tなら　私　そっちのキレイな　ベッドね。\n\tあんたは　どこででも　ねられるでしょ？\n@c0@"
337:
  de: "@aGriselda@bViel Aufmerksamkeit hat mir noch nie etwas ausgemacht, aber es gefällt mir nicht, wie uns hier alle anstarren. Als hätten sie Angst vor mir.\n@c0@"
  en: "@aDebora@bI've never had a problem with getting lots of attention, but I don't like the way they stare here. It's like they're scared of me.\n@c0@"
  es: "@aStefania@b¡Ma non è possibile! Después de lo que hemos hecho para solventare el suo problema, ¡así nos lo agradecen!\n@c0@"
  fr: "@aPandora@bÇa ne m'a jamais posé de problème d'attirer l'attention, mais je n'aime pas la façon dont ils me dévisagent, ici. C'est comme s'ils avaient peur de moi.\n@c0@"
  it: "@aViola@bSono abituata a sentirmi addosso gli sguardi ammirati degli uomini, ma stavolta credo di non essere al centro dell'attenzione per la mia bellezza...\n@c0@"
  ja: "@a@bデボラ「注目を　集めるのは\n\tキライじゃないけど　この視線は……\n\tまるで　この私を　恐れているみたいね。\n@c0@"
338:
  de: "@aGriselda@bNa, reizend! Nach allem, was wir durchgemacht haben, um ihr Problem für sie zu lösen, ist das der Dank?!\n@c0@"
  en: "@aDebora@bCharming! After we went to all that effort to figure out their problem for them, this is the thanks we get!\n@c0@"
  es: "@aStefania@b¡Ja, ja! ¡Vale la pena hablar otra vez con él solo para verle reaccionar così!\n@c0@"
  fr: "@aPandora@bAh c'est charmantⓠ Après tous les efforts qu'on a faits pour résoudre leur problème à leur place,\nc'est tous les remerciements qu'on aⓠ\n@c0@"
  it: "@aViola@bMa come?!\nAbbiamo risolto il loro problema con il mostro e ci ringraziano così?!\n@c0@"
  ja: "@a@bデボラ「せっかく　原因を\n\t取りのぞいて　あげたっていうのに……\n\tこんな扱いを受けるのは　頭にくるわね。\n@c0@"
339:
  de: "@aGriselda@bHa ha! Es hat sich wirklich gelohnt, noch mal mit ihm zu reden ⓚⓛ seine Reaktion, ha ha!\n@c0@"
  en: "@aDebora@bHa ha! It's almost worth talking to him again just to see him react like that!\n@c0@"
  es: "@aStefania@b¡Ma %a001210 no le haría ningún daño! Blandengue... No se puede tener tanto miedo.\n@c0@"
  fr: "@aPandora@bHa haⓠ Ça vaudrait presque le coup de lui parler\nà nouveau rien que pour le voir réagir comme çaⓠ\n@c0@"
  it: "@aViola@bAh ah ah! Che buffo!\nGuarda come si spaventa!\nDai, caro! Parliamogli ancora! È troppo divertente!\n@c0@"
  ja: "@a@bデボラ「私ったら　嫌がられてるのに\n\tもういちど　声をかけたくなっちゃう。\n\tだって　おもしろいんだもん。\n@c0@"
340:
  de: "@aGriselda@bAber %a001210 würde ihm doch nie was tun! Er muss doch deswegen nicht um sein Leben fürchten, der alte Dummkopf.\n@c0@"
  en: "@aDebora@bBut %a001210 wouldn't do him any harm! He needn't be afraid for his life like that, the silly man.\n@c0@"
  es: "@aStefania@bSembra que no le gusta que nos hiciésemos amici de %a001210. Aunque ¿qué importa lo que opine?\n@c0@"
  fr: "@aPandora@bMais %a001210 ne lui ferait aucun malⓠ Il ne devrait pas craindre pour sa vie comme ça, l'idiot.\n@c0@"
  it: "@aViola@b%0%a001210 non farebbe male a una mosca!\nCioè, in combattimento è assolutamente letale, ma non se la prenderebbe mai con degli innocenti.\n@c0@"
  ja: "@a@bデボラ「%a001210は　いい子なのに……\n\tまぁ　いいわ。\n\t命だけは　助けてあげましょ。\n@c0@"
341:
  de: "@aGriselda@bMan hält wohl nichts davon, dass wir Freunde sind, %a001210. Aber das ist uns vollkommen egal, nicht?\n@c0@"
  en: "@aDebora@bHe doesn't seem to think we should've befriended %a001210. Not that we should care what he thinks.\n@c0@"
  es: "@aStefania@b%0%a001210 es ya de la famiglia. Y la famiglia es lo primero.\n@c0@"
  fr: "@aPandora@bIl semble penser que nous n'aurions pas dû devenir amis avec %a001210. Mais ce qu'il pense nous est égal, de toute façon. \n@c0@"
  it: "@aViola@bMica dovevamo chiedere a lei se prendere con noi %a001210 o un altro animale!\n@c0@"
  ja: "@a@bデボラ「仲間にしちゃ悪いような　言い方ね。\n\tでも　気にすることないわ。\n@c0@"
342:
  de: "@aGriselda@b%0%a001210 ist jetzt einer von uns. Und was die Leute sagen, schert uns nicht.\n@c0@"
  en: "@aDebora@b%0%a001210's one of us now. We don't need to take any notice of what anyone else says.\n@c0@"
  es: "@aStefania@bQué inocentes son los bambini. No conocen el timore.\n@c0@"
  fr: "@aPandora@b%0%a001210 est l'un des nôtres, désormais.\nNous n'avons pas besoin de nous occuper\nde ce que disent les autres.\n@c0@"
  it: "@aViola@bChe le piaccia o meno, ora %a001210 fa parte del nostro gruppo!\nPunto e basta!\n@c0@"
  ja: "@a@bデボラ「%a001210は　私の　仲間なの。\n\tだれの　指図も　受ける必要はないのよ。\n@c0@"
343:
  de: "@aGriselda@bKinder sind so unschuldig. Und sie kennen keine Furcht.\n@c0@"
  en: "@aDebora@bChildren are so innocent.\nThey know no fear, either.\n@c0@"
  es: "@aStefania@bNo tiene por qué suplicar, me largo encantada. Andiamo, %a000090.\n@c0@"
  fr: "@aPandora@bLes enfants sont si innocents.\nIls ignorent la peur.\n@c0@"
  it: "@aViola@bNo, stavolta proprio non ho capito cos'ha detto.\nE, se proprio devo essere sincera, non m'importa nemmeno di saperlo...\n@c0@"
  ja: "@a@bデボラ「子供って　素直よね。\n\t怖いもの知らずでも　あるけど。\n@c0@"
344:
  de: "@aGriselda@bEr muss nicht gleich betteln. Mich hält hier gar nichts. Gehen wir, %a000090.\n@c0@"
  en: "@aDebora@bThere's no need for him to beg. I'll gladly stay away. Let's go, %a000090.\n@c0@"
  es: "@aStefania@b¡Qué uomo más grosero! Tenemos molto dinero, para que lo sepas. No necesitamos le tue moneditas.\n@c0@"
  fr: "@aPandora@bIl n'a pas besoin de supplier. Je serai très contente de partir d'ici. Allons-nous-en, %a000090.\n@c0@"
  it: "@aViola@bAndiamo via, %a000090.\nQui non ci vogliono...\n@c0@"
  ja: "@a@bデボラ「頼まれたって　もうこの村には\n\t来てあげやしないわ。\n\t行くわよ　%a000090。\n@c0@"
345:
  de: "@aGriselda@bWas für ein unhöflicher Kerl! Wir haben mehr als genug Geld. Wir brauchen diese Kinkerlitzchen gar nicht!\n@c0@"
  en: "@aDebora@bWhat a rude little man! We have plenty of money, thank you very much. We don't need your grubby\r\nsmall change.\n@c0@"
  es: "@aStefania@bMe importa bien poco lo que piensen de nosotros. No hemos hecho niente malo.\n@c0@"
  fr: "@aPandora@bQuel grossier petit hommeⓠ Nous avons tout l'argent qu'il nous faut, merci. Nous n'avons pas besoin de votre mitraille ridicule.\n@c0@"
  it: "@aViola@bChe razza di scostumato!\nNon mi serve la sua ricompensa!\nNon mi ci voglio sporcare le mani!\n㈡\nFammi il piacere, %a000090, prendila tu...\n@c0@"
  ja: "@a@bデボラ「失礼な男。\n\tお金を　持ってる私たちが\n\tそんな　せこい商売するはずないわ！\n@c0@"
346:
  de: "@aGriselda@bIst mir doch schnurzpiepegal, was die von uns denken. Wir haben nichts Böses getan.\n@c0@"
  en: "@aDebora@bI couldn't care less what they think of us.\nWe haven't done anything wrong.\n@c0@"
  es: "@aStefania@bNo tienes miedo, ¿no?\n¡Eh! ¿Per qué miras a esa cosa y luego me miras a mí?\n@c0@"
  fr: "@aPandora@bJe me moque royalement de ce qu'ils pensent de nous. Nous n'avons rien fait de mal.\n@c0@"
  it: "@aViola@bNon m'importa un fico secco di ciò che questa gentaglia irriconoscente pensa di noi!\nNon abbiamo fatto niente di male!\n@c0@"
  ja: "@a@bデボラ「気にすることはないわ。\n\t別に　私たちは\n\t後ろ暗いことなんて　何も　してないし。\n@c0@"
347:
  de: "@aGriselda@bDu hast überhaupt keine Angst, oder? Hey! Warum schaust du mich und dieses Ding so an?!\n@c0@"
  en: "@aDebora@bYou're not scared at all, are you?\r\nHey! Why are you eyeing me up next to that thing?\n@c0@"
  es: "@aStefania@bEs más gañán per creer eso ahora que per haber confiado en nostoros al principio.\n@c0@"
  fr: "@aPandora@bTu n'as pas peur du tout, n'est-ce pasⓡ\nHéⓠ Pourquoi tu me regardes en même\ntemps que cette choseⓡ\n@c0@"
  it: "@aViola@bSai, caro?\nTrovo una certa rassomiglianza tra te e lo spaventamostri... Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「全然　こわくないわよねえ　あんた。\n\t……なに　私と　かかし　見比べてるの？\n@c0@"
348:
  de: "@aGriselda@bIch würde sagen, es ist sehr viel trotteliger von ihm, die gemeinen Gerüchte über uns zu glauben, als uns vertraut zu haben.\n@c0@"
  en: "@aDebora@bI'd say it's more loopy of him to believe the nasty rumours about us than it was for him to have trusted us in the first place.\n@c0@"
  es: "@aStefania@b¡Ni lo necesito ni lo quiero!\nQue se queden con il suo dinero.\nAndiamo, %a000090. ¡Presto!\n@c0@"
  fr: "@aPandora@bÀ mon avis, c'est plus idiot de sa part de croire les vilaines rumeurs qui courent sur nous que de nous avoir fait confiance au départ.\n@c0@"
  it: "@aViola@bNe ho abbastanza! Li abbiamo liberati dal mostro, no?! E allora la piantassero! Se credono che li abbiamo ingannati, il problema è loro, non nostro!\n@c0@"
  ja: "@a@bデボラ「勝手に信じて　勝手な思いこみで\n\tうたがいを　かけてくるほうが\n\tよっぽど　バカなんじゃないかしら。\n@c0@"
349:
  de: "@aGriselda@bIch brauche und ich will es nicht! Sie können ihr dummes Geld behalten. Wir gehen, %a000090. Sofort!\n@c0@"
  en: "@aDebora@bI don't need it and I don't want it!\nThey can keep their stupid money.\nWe're leaving, %a000090. Right now!\n@c0@"
  es: "@aStefania@bAl menos hay alguien aquí que no es un completo stupido. ¡Ja! ¡Vaya panda de gañanes!\n@c0@"
  fr: "@aPandora@bJe n'en ai pas besoin et je n'en veux pasⓠ\nIls peuvent se le garder, leur stupide argent.\nOn s'en va, %a000090. Tout de suiteⓠ\n@c0@"
  it: "@aViola@bNon voglio il suo denaro! È vero che avrei potuto comprarci tanti bei vestitini, ma non accetto soldi da un cafone come quello! Andiamocene, %a000090!\n@c0@"
  ja: "@a@bデボラ「いらないわよ！　こんなお金！！\n\tとっとと　出て行くわよ！\n\tほらっ　行くわよ　%a000090！！\n@c0@"
350:
  de: "@aGriselda@bWenigstens eine Person ist hier noch nicht völlig verblödet. Mann! Was für ein hoffnungsloser Haufen von Landeiern!\n@c0@"
  en: "@aDebora@bAt least there's one person here that isn't a complete idiot. Huh! What a load of bumpkins!\n@c0@"
  es: "@aStefania@bNo creo que aquí pueda trobare un vestido bonito per me.\n@c0@"
  fr: "@aPandora@bIl y a au moins une personne ici qui n'est pas totalement stupide. Pfffⓠ Quelle bande de péquenaudsⓠ\n@c0@"
  it: "@aViola@bToh! Sembra che anche in questa mandria di burini deficienti e malfidati ci sia una persona intelligente!\nDev'essere l'eccezione che conferma la regola...\n@c0@"
  ja: "@a@bデボラ「この村にも　ちゃんと\n\t真実が見える人が　いたってわけね。\n\t……少し　救われたわね。\n@c0@"
351:
  de: "@aGriselda@bIch glaube nicht, dass ich hier ein hübsches neues Kleid finden werde...\n@c0@"
  en: "@aDebora@bI don't imagine I'd have much luck finding myself a nice new outfit here.\n@c0@"
  es: "@aStefania@bEste estanque mi piace molto. Cerca de casa teníamos uno parecidoⓓ yo solía ir mucho cuando hacía novillos.\n@c0@"
  fr: "@aPandora@bJe ne crois pas que je réussirai à me trouver\r\nde jolis vêtements neufs ici.\n@c0@"
  it: "@aViola@bDubito che qui troverò qualche negozio d'abbigliamento di mio gusto...\n@c0@"
  ja: "@a@bデボラ「この村だと　オシャレな洋服を\n\tさがすのは　大変そうね。\n@c0@"
352:
  de: "@aGriselda@bDieser Teich ist sehr hübsch. Wir hatten zu Hause auch so einen. Da habe ich früher immer die Schule geschwänzt...\n@c0@"
  en: "@aDebora@bThis pond's quite nice. We had a bit of water like this near our house, so I used to bunk off my studies and hang around there a lot.\n@c0@"
  es: "@aStefania@b¿Cosa pasa?\n¡Pareces un pez fuera del acqua!\n@c0@"
  fr: "@aPandora@bCette mare est assez jolie. On avait un peu ça près de notre maison, alors je lâchais souvent mes études pour aller passer du temps au bord de l'eau.\n@c0@"
  it: "@aViola@bCarino, questo stagno.\nSe avessimo un po' di tempo, ne approfitterei per fare un bel bagno tonificante...\n@c0@"
  ja: "@a@bデボラ「そこの池　キレイね。\n\t私の家も　すぐ近くに　池があったから\n\t習い事さぼって　よく遊んでたわ。\n@c0@"
353:
  de: "@aGriselda@bWas ist los mit dir? Du siehst aus wie ein Fisch auf dem Trockenen.\n@c0@"
  en: "@aDebora@bWhat's wrong with you?\nYou look like a fish out of water.\n@c0@"
  es: "@aStefania@bNo vas a dejar que se ría de ti, ¿no? ¡Vamos, coge la azada y demuéstrale cómo se hace! ¡Pronto!\n@c0@"
  fr: "@aPandora@bQu'est-ce qu'il y a qui ne va pasⓡ Tu ressembles\nà un poisson qu'on a sorti de l'eau.\n@c0@"
  it: "@aViola@bChe succede, %a000090?\nC'è qualcosa che non va?\n@c0@"
  ja: "@a@bデボラ「どうしたの　あんた。\n\t小魚が　豆鉄砲くらったような　顔して。\n@c0@"
354:
  de: "@aGriselda@bDu wirst doch wohl nicht zulassen, dass er sich weiter über uns lustig macht, oder? Pflügen ⓚⓛ na, das kann er haben!\n@c0@"
  en: "@aDebora@bYou're not going to let him mock you like that, are you? Get ploughing and show him how it's done!\n@c0@"
  es: "@aStefania@bAunque a ti no te importe que se rían di te, causa mala impresión di me. ¡Vamos, coge la azada y demuéstrale cómo se hace!\n@c0@"
  fr: "@aPandora@bTu ne vas pas le laisser se moquer de toi comme ça, j'espèreⓡ Mets-toi à labourer et montre-lui comment on faitⓠ\n@c0@"
  it: "@aViola@bAl posto tuo, non sprecherei fiato a rispondere a un buzzurro del genere. A dirla tutta, non sono nemmeno certa di aver capito cos'ha detto...\n@c0@"
  ja: "@a@bデボラ「あんた　笑われっぱなしでいいの？\n\t畑仕事　手伝って　見返してやりなさいよ。\n@c0@"
355:
  de: "@aGriselda@bDir macht es vielleicht nichts aus, ausgelacht zu werden, aber mir schon. Pflügen ⓚⓛ na, das kann er haben!\n@c0@"
  en: "@aDebora@bYou may not mind being laughed at, but it reflects badly on me. Get ploughing and show him how\r\nit's done!\n@c0@"
  es: "@aStefania@bMmm... Qué bien huele.\nMe ha entrado hambre.\nEsta notte nos quedamos aquí, ¿capisci?\n\n@c0@"
  fr: "@aPandora@bPeut-être que ça t'est égal qu'on se moque de toi, mais ça rejaillit sur moi. Alors mets-toi à labourer\net montre-lui comment on faitⓠ\n@c0@"
  it: "@aViola@bMaiali in città...?\nMa che sta dicendo?!\nNon ci starà mica prendendo in giro?!\n@c0@"
  ja: "@a@bデボラ「あんたが　笑われると\n\t私も　頭にくるのよね～。\n\t畑仕事　手伝って　見返しなさいよ。\n@c0@"
356:
  de: "@aGriselda@bHmm... Hier riecht es gut. Und hungrig bin ich auch. Sollen wir heute Nacht hier bleiben?\n@c0@"
  en: "@aDebora@bMmm... Something smells nice.\r\nIt's making me feel hungry.\r\nShall we stay here tonight?\n@c0@"
  es: "@aStefania@bSi viviese aquí tendrían que aprire una tienda de ropa.\nY de cosméticos. Y un casino, claro.\n@c0@"
  fr: "@aPandora@bMmm... Il y a quelque chose qui sent bon. Ça me donne faim. Si on restait ici, cette nuitⓡ\n@c0@"
  it: "@aViola@bOh, che profumino delizioso!\nA giudicare dall'aroma, si tratta di cibi delicati e poveri di grassi... Ho deciso: stanotte dormiamo qui!\n@c0@"
  ja: "@a@bデボラ「ゴハンの　いいにおいがするわ。\n\tおなか空いてきちゃった……。\n\t今日は　ここで　泊まりましょ？\n@c0@"
357:
  de: "@aGriselda@bWenn ich hier leben müsste, würde ich ein Bekleidungsgeschäft eröffnen. Und ein Kosmetikstudio. Ach ja, ein Kasino natürlich auch.\n@c0@"
  en: "@aDebora@bIf I lived here, I'd have to open a clothes shop.\r\nAnd a cosmetics shop. Oh, and a casino, of course.\n@c0@"
  es: "@aStefania@bSi no hubiese sido por el mostro, no habríamos podido conseguir un horrorizacuervos de souvenir.\n@c0@"
  fr: "@aPandora@bSi j'avais vécu ici, j'aurais ouvert une boutique de vêtements. Et une boutique de cosmétiques.\r\nOh, et un casino, évidemment.\n@c0@"
  it: "@aViola@bCaro, che ne diresti di aprire un negozio di alta moda da queste parti?\nNon avremmo concorrenti per miglia e miglia!\n㈡\nBeh, forse non avremmo nemmeno clienti, ma quello non sarebbe un problema: tutti i vestiti li prenderei io!\n@c0@"
  ja: "@a@bデボラ「私が　この町に　住んだら\n\t洋服のお店と　化粧品のお店と\n\tカジノを　作ることにするわ。\n@c0@"
358:
  de: "@aGriselda@bWenn das Monster nicht gewesen wäre, gäb's keine Schreckensscheuche, und wir hätten noch nicht mal ein Andenken an Bauernsiepen.\n@c0@"
  en: "@aDebora@bIf it hadn't been for the monster, there wouldn't even be a terrorcrow for us to have as a souvenir.\n@c0@"
  es: "@aStefania@b¡¿Solo has venido aquí para que te den las gracias?! Entonces, ¡andiamo presto!\n@c0@"
  fr: "@aPandora@bSans le monstre, nous n'aurions même pas eu un épouvanteur à garder en souvenir.\n@c0@"
  it: "@aViola@bE così ora possiamo portarci a casa uno spaventamostri come souvenir...\nOccupati tu del trasporto, caro...\n@c0@"
  ja: "@a@bデボラ「化け物　さわぎがなければ\n\tこの村の　名産品って\n\tなにもなかったのね。\n@c0@"
359:
  de: "@aGriselda@bBist du nur hierher gekommen, damit die Leute dir dankbar sind? Wenn das alles ist, können wir ja schnell wieder verschwinden!\n@c0@"
  en: "@aDebora@bDid you come here just so you'd be shown a bit of gratitude? If that's all, then let's get going!\n@c0@"
  es: "@aStefania@b¿Piensas llevarte ese horrorizacuervos?\nA veces haces cosas molto extrañas.\n@c0@"
  fr: "@aPandora@bTu es venu ici juste pour recevoir un peu de reconnaissanceⓡ Si c'est ça, on peut repartirⓠ\n@c0@"
  it: "@aViola@bCaro, che ne diresti di andarcene? Sono certa che abbiamo cose più importanti da fare che star qui a conversare mentre respiriamo profumo di sterco...\n@c0@"
  ja: "@a@bデボラ「あんた　かんげいされたいために\n\tこの村に来たの？\n\t用がないなら　もう　行きましょ？\n@c0@"
360:
  de: "@aGriselda@bDu nimmst dieses Ungetüm von Schreckensscheuche mit?! Manchmal bist du wirklich merkwürdig, weißt du...\n@c0@"
  en: "@aDebora@bYou're taking that scarecrow with you?\nYou do some very odd things at times, you know.\n@c0@"
  es: "@aStefania@bEntre unas cosas y otras, no lo has pasado molto bene, ¿no?\n@c0@"
  fr: "@aPandora@bTu emmènes cet épouvantail avec toiⓡ Tu sais que tu fais parfois des choses vraiment bizarres...\n@c0@"
  it: "@aViola@bHai intenzione di prendere lo spaventamostri?\nPer me va bene, tanto lo porti tu...\n@c0@"
  ja: "@a@bデボラ「かかし……　持っていくの？\n\tあんたの　その　よくわからない\n\t行動の方が　こわいわ。\n@c0@"
361:
  de: "@aGriselda@bIhr seid wohl nicht so besonders miteinander ausgekommen, was?\n@c0@"
  en: "@aDebora@bYou've had a bit of a hard time of it with one thing or another, haven't you?\n@c0@"
  es: "@aStefania@bTutto será distinto ahora que estás casado con me.\n@c0@"
  fr: "@aPandora@bÇa a régulièrement été un peu dur pour toi,\nn'est-ce pasⓡ\n@c0@"
  it: "@aViola@bVa bene, va bene: scuse accettate.\nTutti possono sbagliare, no?\n@c0@"
  ja: "@a@bデボラ「あんたって\n\tいろいろ苦労しているのね。\n@c0@"
362:
  de: "@aGriselda@bAber das sollte jetzt kein Problem mehr sein. Schließlich bist du mit mir verheiratet.\n@c0@"
  en: "@aDebora@bIt should all be a breeze now that you're married to me, though.\n@c0@"
  es: "@aStefania@b¿Qué estamos haciendo aquí? Non credo que Nimzo vaya a presentarse en un sitio come este. Vamos a alguna otra parte più interesante.\n@c0@"
  fr: "@aPandora@bMais maintenant que nous sommes mariés, ça devrait te passer au-dessus de la tête.\n@c0@"
  it: "@aViola@bTranne te: non azzardarti a commettere errori quando esegui i miei ordini.\nLo dico per il TUO bene, caro...\n@c0@"
  ja: "@a@bデボラ「でも　私と結婚したから\n\tもう　苦労なんて　しないはずよ。\n@c0@"
363:
  de: "@aGriselda@bWas machen wir hier? Ich glaube nicht, dass Nimzo sich hier blicken lassen würde. Lass uns gehen.\n@c0@"
  en: "@aDebora@bWhat are we doing here? I don't imagine this is the kind of place Nimzo will show up. Let's go somewhere more interesting.\n@c0@"
  es: "@aStefania@b¡Típicos campesinos, mira que cerrar a questa hora! Esto no pasa en Mostroferrato.\n@c0@"
  fr: "@aPandora@bQu'est-ce qu'on fait làⓡ Je ne crois pas que Nimzo se montrera dans ce genre de lieu. Allons dans un endroit plus intéressant.\n@c0@"
  it: "@aViola@bPerché non andiamo in qualche posto un po' più interessante?\nQui non abbiamo nulla di importante da fare...\n@c0@"
  ja: "@a@bデボラ「あんた　こんな村に　なにか用？\n\t魔王が　出るわけでもないし……。\n\tもっと　面白そうな町へ　行きましょうよ。\n@c0@"
364:
  de: "@aGriselda@bTypisch Landeier, die Türen zu dieser Zeit schon abzuschließen! In Mostroferrato würde dir das nicht passieren.\n@c0@"
  en: "@aDebora@bTypical country folk, locking their doors at this hour! You'd never find that in Mostroferrato.\n@c0@"
  es: "@aStefania@bMira y aprende. Aparte de lo de perderse, claro. Así es como debe comportarse un sirviente, ¿capisci?\n@c0@"
  fr: "@aPandora@bC'est typique des gens de la campagne de verrouiller leurs portes à une heure pareilleⓠ On ne verrait jamais ça à Mostroferrato.\n@c0@"
  it: "@aViola@bStrano che sia chiuso a chiave...\nDi solito gli abitanti dei paesini di campagna non prendono questa precauzione.\n@c0@"
  ja: "@a@bデボラ「こんな時間に　カギをかけるだなんて\n\tさすがに　イナカなのね。\n\tサラボナでは　ありえないわ。\n@c0@"
365:
  de: "@aGriselda@bSieh ihn dir gut an ⓚⓛ du kannst viel von ihm lernen. Außer das mit dem Verlaufen natürlich. Genauso sollte ein guter Diener sein.\n@c0@"
  en: "@aDebora@bWatch and learn. Apart from the getting lost part, I mean. That's how a servant should behave.\n@c0@"
  es: "@aStefania@bMmm... Qué bien huele.\nMe ha entrado hambre.\nEsta notte nos quedamos aquí, ¿capisci?\n\n@c0@"
  fr: "@aPandora@bPrends-en de la graine. Sauf pour la partie où il s'est perdu, bien sûr. C'est comme ça que doit\r\nse comporter un domestique.\n@c0@"
  it: "@aViola@bDieci anni! Ci ha cercati per dieci anni! Questa sì che è dedizione al dovere, caro il mio %a000090!\nImpara da lui, come si comporta un uomo devoto!\n@c0@"
  ja: "@a@bデボラ「あんたも　見習いなさい。\n\t道に迷うところ以外は……　ね。\n\t今のが　しもべの　あるべき姿よ。\n@c0@"
366:
  de: "@aGriselda@bHmm... Hier riecht es gut. Und hungrig bin ich auch. Sollen wir heute Nacht hier bleiben?\n@c0@"
  en: "@aDebora@bMmm... Something smells nice.\r\nIt's making me feel hungry.\r\nShall we stay here tonight?\n@c0@"
  es: "@aStefania@bNo te alejes, ¿capisci? No quiero que ese mostro venga y me ataque.\n@c0@"
  fr: "@aPandora@bMmm... Il y a quelque chose qui sent bon. Ça me donne faim. Si on restait ici, cette nuitⓡ\n@c0@"
  it: "@aViola@bOh, che profumino delizioso!\nA giudicare dall'aroma, si tratta di cibi delicati e poveri di grassi... Ho deciso: stanotte dormiamo qui!\n@c0@"
  ja: "@a@bデボラ「ゴハンの　いいにおいがするわ。\n\tおなか空いてきちゃった……。\n\t今日は　ここで　泊まりましょ？\n@c0@"
367:
  de: "@aGriselda@bBleib in meiner Nähe, ja? Nicht, dass mich das Monster noch angreift oder so...\n@c0@"
  en: "@aDebora@bStay a bit closer, will you? I don't want that monster coming and attacking me.\n@c0@"
  es: "@aStefania@bTodos esos huesos del suelo...\nSon de verdad, ¿no?\n@c0@"
  fr: "@aPandora@bRapproche-toi un peu, tu veuxⓡ Je ne voudrais\npas que ce monstre vienne m'attaquer.\n@c0@"
  it: "@aViola@bVai avanti tu, caro, così il mostro attaccherà te e non me, nel caso fosse nei paraggi.\n㈡\nPotrei farlo fuori a occhi chiusi, ma ho paura di spezzarmi un'unghia...\n@c0@"
  ja: "@a@bデボラ「あんた　もう少し　くっつきなさい。\n\t化け物が　私に　おそいかかってきたら\n\tあぶないじゃない。\n@c0@"
368:
  de: "@aGriselda@bAll diese Knochen auf dem Boden... Die sind echt, oder? Igitt!\n@c0@"
  en: "@aDebora@bThose bones dotted about the place...\nThey're the real thing, aren't they?\n@c0@"
  es: "@aStefania@bHay agujeros por tutti partes.\nCuidado con donde pisas.\n@c0@"
  fr: "@aPandora@bTous ces ossements dispersés un peu partout...\nCe sont des vrais, heinⓡ\n@c0@"
  it: "@aViola@bQueste ossa sparse in giro sono solo un effetto scenografico, caro?\nRispondimi di sì, anche se è una pietosa menzogna...\n@c0@"
  ja: "@a@bデボラ「このあたりに　ちらばっている\n\t骨って　オモチャ　じゃないわよね？\n@c0@"
369:
  de: "@aGriselda@bHier sind überall Löcher. Pass auf, wo du hintrittst!\n@c0@"
  en: "@aDebora@bThere are holes all over the place.\nYou'd better watch where you're walking.\n@c0@"
  es: "@aStefania@bSi vamos a caer por un agujero, tú vas primero. ¡Y más te vale que frenes la mia caída o te enteras! ¿Capisci?\n@c0@"
  fr: "@aPandora@bIl y a des trous partout. Tu as intérêt à regarder où tu mets les pieds.\n@c0@"
  it: "@aViola@bCi sono buche ovunque...\nSarà meglio procedere con estrema cautela...\n@c0@"
  ja: "@a@bデボラ「そこいらじゅう　穴だらけね。\n\t足もとに　気をつけなさいよ。\n@c0@"
370:
  de: "@aGriselda@bWenn wir in ein Loch fallen, fällst du zuerst. Dann falle ich wenigstens weich. Blaue Flecken stehen mir nämlich gar nicht!\n@c0@"
  en: "@aDebora@bIf we're going to fall down a hole, you're going first. And you're going to break my fall! I won't look too kindly on you if you don't.\n@c0@"
  es: "@aStefania@b¿Estará bien ese soldado? Es un mezza calzetta. Tú podrías caerte cien veces y sobrevivir.\n@c0@"
  fr: "@aPandora@bSi on doit tomber dans un trou, tu passes le premier. Et ensuite, tu amortis ma chuteⓠ Ça risque de mal se passer pour toi si tu ne le fais pas.\n@c0@"
  it: "@aViola@bPrendimi per mano, così se cadrò in una buca potrai tenermi.\n㈡\nSe invece fossi tu a cadere, ricordati di mollare istantaneamente la presa. Non vorrai mica che precipiti con te, vero?!\n@c0@"
  ja: "@a@bデボラ「穴に落ちるなら　あんたが先よ。\n\tそして　私を抱きとめるの。\n\t失敗は　許さないから　そのつもりでね。\n@c0@"
371:
  de: "@aGriselda@bOb's dem Soldaten wohl gut geht? Er ist eine ziemliche Memme, nicht? Du könntest bestimmt hundertmal runterfallen und wärst immer noch putzmunter.\n@c0@"
  en: "@aDebora@bDo you think that soldier's alright? He's a bit of a wimp, isn't he? I reckon you could fall down a hundred times and still live to tell the tale.\n@c0@"
  es: "@aStefania@bMa, ¡fue él quien nos asustó y no al revés! ¡Si me vuelve a asustar de ese modo le devuelvo al agujero!\n@c0@"
  fr: "@aPandora@bTu crois que ce soldat va bienⓡ C'est un peu une mauviette, nonⓡ Je parie que tu pourrais tomber une centaine de fois sans te casser le cou.\n@c0@"
  it: "@aViola@bSanto cielo, che imbranato!\nE io che chiamavo te ⓕpappamolleⓖ!\nCaro, potrai mai perdonarmi?\n@c0@"
  ja: "@a@bデボラ「今の　大丈夫だったかしら。\n\tあんたなら　１００回くらい　落ちても\n\t生きてそうだけど……。\n@c0@"
372:
  de: "@aGriselda@bEr ist derjenige, der uns einen Schrecken eingejagt hat, nicht umgekehrt! Wenn du mich so erschreckt hättest, hätte ich dich zurück ins Loch geschubst!\n@c0@"
  en: "@aDebora@bHe's the one who gave us a fright, not the other way around! I'd have chucked you down the hole again if you made me jump like that!\n@c0@"
  es: "@aStefania@b¿Este es el famoso mostro? Mmm... Tener una criatura espléndida como esta de mascota seguro que me da estatus.\n@c0@"
  fr: "@aPandora@bC'est lui qui nous a fichu la frousse, pas l'inverseⓠ Je t'aurais repoussé dans le trou si tu m'avais causé une frayeur pareilleⓠ\n@c0@"
  it: "@aViola@bChe colpa abbiamo noi se questo tipo sobbalza per un nonnulla? Farebbe meglio a starsene a casa, attaccato alla sottana della madre...\n@c0@"
  ja: "@a@bデボラ「おどろいたのは　こっちの方よ。\n\t相手が　あんただったら　罰として\n\tもう一度　穴から　落としてたわ。\n@c0@"
373:
  de: "@aGriselda@bDas also ist das berühmte Ungeheuer? Hmm... Eine prachtvolle Kreatur wie diese im Gefolge zu haben, das würde mir wahrscheinlich gut stehen.\n@c0@"
  en: "@aDebora@bSo that's the famous monster? Hmm... Having a magnificent creature like that as a pet would probably reflect quite well on me.\n@c0@"
  es: "@aStefania@bEl poverino se las ha tenido que arreglar solo tutti questi anni.\n@c0@"
  fr: "@aPandora@bAlors c'est le fameux monstreⓡ Mmm... Posséder une créature aussi magnifique comme animal domestique me mettrait sans doute à mon avantage.\n@c0@"
  it: "@aViola@bÈ quello il mostro feroce che ha seminato il terrore a Punta Campestre?\n㈡\nMa che carino! È bello, forte, maestoso...\nNon mi dispiacerebbe averlo come animale da compagnia...\n@c0@"
  ja: "@a@bデボラ「あれが　ウワサの化け物なの？\n\tあんな　りっぱなトラを　ペットにしたら\n\t私の　いい引き立て役に　なりそうね。\n@c0@"
374:
  de: "@aGriselda@bDer arme Kleine musste all die Jahre alleine zurechtkommen.\n@c0@"
  en: "@aDebora@bThe poor baby's had to fend for himself all\r\nthese years.\n@c0@"
  es: "@aStefania@bPero eso ya se ha acabado. Yo me haré cargo de él de ahora en adelante.\n@c0@"
  fr: "@aPandora@bLe pauvre chaton a dû se débrouiller tout seul pendant toutes ces années.\n@c0@"
  it: "@aViola@bI guai per %a001210 sono finiti!\n@c0@"
  ja: "@a@bデボラ「この子　何年もの間　ずっと\n\tひとりで　生きてきたのね……。\n@c0@"
375:
  de: "@aGriselda@bAber jetzt ist alles in Ordnung. Ich werde mich um ihn kümmern.\n@c0@"
  en: "@aDebora@bIt's all okay now, though. I'm going to take good care of him from now on.\n@c0@"
  es: "@aStefania@b%0%a001210 es ya de la famiglia.\n@c0@"
  fr: "@aPandora@bMais tout va bien, maintenant. Je vais prendre bien soin de lui, désormais.\n@c0@"
  it: "@aViola@bOra ci penserò io ad aver cura di quella cara bestiolina!\n㈡\nPer meglio dire: io ti dirò cosa fare per accudirla, %a000090, e tu eseguirai i miei ordini senza discutere...\n@c0@"
  ja: "@a@bデボラ「でも　もう　大丈夫。\n\tこれからは　私が　たっぷりと\n\tかわいがってあげるわ。\n@c0@"
376:
  de: "@aGriselda@b%0%a001210 ist jetzt einer von uns.\n@c0@"
  en: "@aDebora@b%0%a001210's one of us now.\n@c0@"
  es: "@aStefania@bNo importa lo que digan los paletos de Puebla del Heno. Tu debes protegerlo a cualquier precio, ¿capisci, %a000090?\n@c0@"
  fr: "@aPandora@b%0%a001210 est l'un des nôtres, à présent.\n@c0@"
  it: "@aViola@b%0%a001210 è un membro del gruppo a tutti gli effetti.\n@c0@"
  ja: "@a@bデボラ「この子は　もう\n\t大切な　仲間だからね。\n@c0@"
377:
  de: "@aGriselda@bGanz egal, was diese Eselsköpfe von Bauernsiepen dazu sagen. Du musst ihn beschützen, hörst du, %a000090?\n@c0@"
  en: "@aDebora@bIt doesn't matter what the bumpkins in Hay make of it. You have to protect him no matter what, %a000090.\n@c0@"
  es: "@aStefania@bNo creerás que esto es Nadiria, ¿no?\n¡Allora, andiamo!\n@c0@"
  fr: "@aPandora@bPeu importe ce qu'en penseront les péquenauds de Chaumes. Tu dois le protéger à tout prix, %a000090.\n@c0@"
  it: "@aViola@bNon importa quello che diranno o faranno gli abitanti di Punta Campestre, %a000090: hai il dovere di difendere quella splendida creaturina!\n@c0@"
  ja: "@a@bデボラ「カボチ村の　人たちに\n\tなんて言われようと　%a000090に\n\tしっかりと　まもってもらいましょう。\n@c0@"
378:
  de: "@aGriselda@bDu glaubst doch wohl nicht, dass das hier Nadiria ist, oder? Dann nichts wie weg!\n@c0@"
  en: "@aDebora@bYou don't think this is Nadiria, presumably?\nThen let's move on!\n@c0@"
  es: "@aStefania@bVeramente está en los huesos, ¿no? Será porque no come adecuadamente.\n@c0@"
  fr: "@aPandora@bTu ne crois pas que nous sommes à Nadiria, j'imagineⓡ Alors partonsⓠ\n@c0@"
  it: "@aViola@bCaro, non penserai mica che questa sia Nadiria, vero?\nPerfetto. Allora andiamo via...\n@c0@"
  ja: "@a@bデボラ「あんた　ここが\n\t魔界とは　思ってないわよね？\n\tここには　もう　用はないわ。\n@c0@"
379:
  de: "@aGriselda@bSie ist sehr mager, nicht? Wahrscheinlich, weil sie nicht genug zu essen bekommt.\n@c0@"
  en: "@aDebora@bShe's very skinny, isn't she? Must be because she's not eating a decent diet.\n@c0@"
  es: "@aStefania@bSupongo que tendremos que pasar la notte aquí.\nPero que no vuelva a suceder, ¿capisci?\n@c0@"
  fr: "@aPandora@bElle est vraiment maigre, nonⓡ Ça doit être\nparce qu'elle ne mange pas assez équilibré.\n@c0@"
  it: "@aViola@bHai visto? È magra come un chiodo...\nChissà da quanto tempo non fa un pasto degno di questo nome...\n@c0@"
  ja: "@a@bデボラ「いまの娘　ずいぶんやせてたわね。\n\tきっと　ロクなものを\n\t食べていないせいだわ……。\n@c0@"
380:
  de: "@aGriselda@bHeute Nacht müssen wir wohl hier bleiben. Aber dass uns das morgen nicht noch mal passiert, hörst du?\n@c0@"
  en: "@aDebora@bI suppose we'll just have to stay here tonight.\r\nJust make sure this doesn't happen again tomorrow.\n@c0@"
  es: "@aStefania@bEsa vecchia tiene valor. Seguro que en época era un terremoto como yo.\n@c0@"
  fr: "@aPandora@bJ'imagine qu'on va devoir passer la nuit ici. Fais en sorte que ça ne se reproduise pas demain, c'est tout.\n@c0@"
  it: "@aViola@bPer stanotte mi arrangerò a dormire qui, ma domani dovrai trovare una sistemazione degna di me! Mi sono spiegata, %a000090?!\n@c0@"
  ja: "@a@bデボラ「しかたがないから\n\t今日は　ここに泊まりましょう。\n\tでも　明日は　他の場所にしてね。\n@c0@"
381:
  de: "@aGriselda@bDie alte Frau hat Mut. Ich wette, als junges Ding war sie ganz schön temperamentvoll.\n@c0@"
  en: "@aDebora@bThat old woman has courage. I'll bet she was a feisty girl like me back in her day.\n@c0@"
  es: "@aStefania@bDeberíamos llevárnoslo como ricompensa.\r\nPodría ser útil.\n@c0@"
  fr: "@aPandora@bCette vieille femme a du courage. Je parie que c'était une fille téméraire, comme moi, quand elle était jeune.\n@c0@"
  it: "@aViola@bUn porco come animale domestico?\nUhm...\nPerché no? Potrei lanciare una nuova moda...\n@c0@"
  ja: "@a@bデボラ「このおばあさん　度胸があるわね。\n\t若い頃は　きっと　私みたいに\n\tしっかりした女だったに　ちがいないわ。\n@c0@"
382:
  de: "@aGriselda@bVielleicht sollten wir sie als Belohnung nehmen. Eventuell kann sie uns mal nützlich sein.\n@c0@"
  en: "@aDebora@bMaybe we should take it as our reward.\r\nIt could come in useful.\n@c0@"
  es: "@aStefania@b¡Urg! Ma no quiero cargar con él.\nEse es il tuo lavoro, %a000090, ¿capisci?\n@c0@"
  fr: "@aPandora@bPeut-être qu'on devrait le prendre en guise de récompense. Ça pourrait nous être utile.\n@c0@"
  it: "@aViola@bDirei di prenderlo come ricompensa per l'egregio lavoro che abbiamo svolto.\nChissà che un giorno o l'altro non ci torni utile...\n@c0@"
  ja: "@a@bデボラ「……まあ　お礼ってことで\n\tもらっていきましょうか。\n\t物事は　何でも　前向きに考えないとね。\n@c0@"
383:
  de: "@aGriselda@bHuh! Ich will mich mit dem scheußlichen Ding aber nicht abschleppen. Das ist deine Sache, %a000090. Verstanden?\n@c0@"
  en: "@aDebora@bUrgh! I don't want to carry it, though.\nThat's your job, %a000090. Got it?\n@c0@"
  es: "@aStefania@bTú te ocupas de esto, ¿capisci?\n@c0@"
  fr: "@aPandora@bMais... beurkⓠ Je ne veux pas le porter moi-même. C'est ton boulot, %a000090. Comprisⓡ\n@c0@"
  it: "@aViola@bCi pensi tu a portarlo, %a000090?\nOh, scusa... Ho fatto una domanda inutile.\nÈ ovvio che lo porterai tu!\n@c0@"
  ja: "@a@bデボラ「あ　私は　そんなもの\n\t持ちたくなんかないから　持っていくなら\n\t%a000090が持つのよ。　わかったわね。\n@c0@"
384:
  de: "@aGriselda@bDarum kannst du dich kümmern, ja?\n@c0@"
  en: "@aDebora@bYou take care of this, okay?\n@c0@"
  es: "@aStefania@bÈ normale, lo único que saben es que %a001210 destruyó sus cultivos, así que sienten timore al verlo con nosotros.\n@c0@"
  fr: "@aPandora@bTu t'en occupes, d'accordⓡ\n@c0@"
  it: "@aViola@bCaro, occupatene tu.\nOh, ma perché te l'ho detto?\nSai già che questi compiti toccano a te, no?\n@c0@"
  ja: "@a@bデボラ「……これは　あんたが\n\t管理してちょうだいね。\n@c0@"
385:
  de: "@aGriselda@bSie sehen wohl nur, dass %a001210 ihre Ernte zerstört hat, und darum haben sie solche Angst, wenn sie sehen, dass wir ihn bei uns haben.\n@c0@"
  en: "@aDebora@bI suppose all they see is that %a001210 destroyed their crops, so it stands to reason that they're scared to see us with him.\n@c0@"
  es: "@aStefania@bPodrás encargarte de un mostro o dos, ¿no, %a000090? Yo me sentaré a ver qué tal lo haces.\n@c0@"
  fr: "@aPandora@bJe suppose que tout ce qu'ils voient, c'est que %a001210 a détruit leurs récoltes, alors ça paraît logique qu'ils aient peur en nous voyant avec lui. \n@c0@"
  it: "@aViola@bPer loro %a001210 è solo il mostro che ha devastato i loro raccolti, quindi ne sono terrorizzati...\n@c0@"
