0:
  de: "@aBianca@bHier ist ja wirklich gar nichts los! Da lobe ich mir doch das gute alte Utensiel!\n@c0@"
  en: "@aBianca@bThis place is dull as ditchwater!\r\nNot like good old Stockenbarrel.\n@c0@"
  es: "@aBianca@b¡Esto es una balsa de aceite!\r\nNo es como Clavis.\n@c0@"
  fr: "@aBianca@bCet endroit est déprimantⓠ Rien à voir avec ce bon vieux village de Saint Éloi.\n@c0@"
  it: "@aBianca@bChe barba, questo posto!\nAd Aprianuam c'è molta più vita!\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\tずいぶん　活気のない村ね。\n\t山奥の村とは　大ちがいだわ。\n@c0@"
1:
  de: "@aNera@bOh je. Die Felder sind ja in einem furchtbaren Zustand. Was kann da nur passiert sein?\n@c0@"
  en: "@aNera@bOh dear. What a terrible state the fields are in here. I wonder what happened.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Los campos están en un estado lamentabile aquí. Me pregunto qué habrá sucedido.\n@c0@"
  fr: "@aNera@bOh, par la Déesse. Les champs sont dans un état lamentable. Je me demande ce qui s'est passé.\n@c0@"
  it: "@aNera@bSanta dea!\nGuarda in che condizioni sono i campi!\nCosa sarà successo?\n@c0@"
  ja: "@a@bフローラ「%a000090さん　見てください。\n\t畑が　あんなに　あらされて……。\n\tなにか　あったのかしら？\n@c0@"
2:
  de: "@a%0%a001240@bDie Leute hier wirken nicht sehr wohlgenährt, findest du nicht? Ich finde, sie machen einen hungrigen Eindruck.\n@c0@"
  en: "@a%0%a001240@bThe people here don't look very well, do they?\nDo you think they're hungry?\n@c0@"
  es: "@a%0%a001240@bAquí la gente no tiene buen aspecto, ¿verdad?\n¿Crees que pasan hambre?\n@c0@"
  fr: "@a%0%a001240@bLes gens d'ici n'ont pas l'air d'aller très bien, heinⓡ Tu crois qu'ils ont faimⓡ\n@c0@"
  it: "@a%0%a001240@bGli abitanti del posto non hanno un bell'aspetto, sai?\nSembrano che non mangino da settimane!\n@c0@"
  ja: "@a@b%a001240「なんだか　みんな\n\t元気がないなあ……。\n\tおなか　すいてるのかな？\n@c0@"
3:
  de: "@a%0%a001240@bDu weißt aber auch alles, Papa, nicht? Ich hätte nie erwartet, hier draußen ein Dorf zu finden.\n@c0@"
  en: "@a%0%a001240@bYou know everything, don't you, Dad? I'd never have expected to find a village all the way out here.\n@c0@"
  es: "@a%0%a001240@bTú lo sabes todo, ¿no, papá? Yo nunca habría esperado encontrar una aldea aquí.\n@c0@"
  fr: "@a%0%a001240@bTu sais vraiment tout, hein, papaⓡ Je ne me serais jamais attendu à trouver un village dans un endroit aussi isolé.\n@c0@"
  it: "@a%0%a001240@bPapà, sei già stato in questo villaggio, vero?\nScommetto di sì!\nTu hai girato tutto il mondo!\n@c0@"
  ja: "@a@b%a001240「お父さん　もの知りだね。\n\tこんな所に村があるなんて\n\tボク　知らなかったよ。\n@c0@"
4:
  de: "@a%0%a001250@bAh, die frische Landluft!\n@c0@"
  en: "@a%0%a001250@bIsn't the smell of the country great?\n@c0@"
  es: "@a%0%a001250@b¡Qué bien huele el campo!\n@c0@"
  fr: "@a%0%a001250@bÇa sent drôlement bon, la campagne, heinⓡ\n@c0@"
  it: "@a%0%a001250@bAh, che buono il profumo dell'erb...\nBleah!\nDevono aver concimato da poco...\n@c0@"
  ja: "@a@b%a001250「土のにおいって\n\tほっとするね。\n@c0@"
5:
  de: "@a%0%a001250@bViele Felder hier im Dorf wirken, als hätte sie jemand zertrampelt oder so. Ob das wohl überall so aussieht?\n@c0@"
  en: "@a%0%a001250@bA lot of the fields in this village look like they've been trampled over or something. I wonder if they're all like it.\n@c0@"
  es: "@a%0%a001250@bParece como si hubieran pisoteado muchos de los sembrados de la aldea. ¿Estarán todos así?\n@c0@"
  fr: "@a%0%a001250@bOn dirait qu'une bonne partie des champs de ce village a été piétinée. Je me demande s'ils sont tous comme ça.\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto? I campi sono quasi tutti rovinati...\nSembra che qualcuno si sia divertito a calpestarli...\n@c0@"
  ja: "@a@b%a001250「この村の畑　あれてるね。\n\tぜんぶ　そうなのかな……。\n@c0@"
6:
  de: "@aSancho@bIss mag dieses Dorf. Es ist klein und bescheiden. Dein Onkel Sancho, er gärtnert gern bei der Arbeit ⓚⓛ eh? No, no! Iss meine, er arbeitet gern im Garten.\n@c0@"
  en: "@aSancho@bI like thees village. Ees esmall and esimple.\nYour Uncle Sancho, he likes esoiling een the plantⓚⓛ\nEh? No, no. I mean, planting een the esoil.\n@c0@"
  es: "@aSancho@bMe gusta esta aldea. Es chiquita y sencilla.\nA tu tito Sancho le gusta templar la sierra... ¡Caramba! No, no, quiero decir sembrar la tierra.\n@c0@"
  fr: "@aSancho@bCe village me p-plaît. Il est petit et simple.\r\nTonton Sancho aime b-bien cultiver la terre.\n@c0@"
  it: "@aSancho@bNei locales de los villaggios piccolos y semplices como esto, el cibo es genuino, y las porziones muy abbondantes. ¡Ay, que fame!\n@c0@"
  ja: "@a@bサンチョ「ずいぶん　そぼくな村ですね。\n\t私も　土いじりは\n\t好きなんですが……。\n@c0@"
7:
  de: "@aSancho@bSie ist seltsam, die Stimmung hier, no? Wir müssen jemanden fragen, was hier los ist.\n@c0@"
  en: "@aSancho@bEes estrange, no, the atmosphere here?\nWe must ask esomeone what ees happening.\n@c0@"
  es: "@aSancho@bAquí hay un ambiente reteraro, ¿no?\nTenemos que preguntar qué está sucediendo.\n@c0@"
  fr: "@aSancho@bL'atmosphère est oun peu espéciale, ici, noⓡ\nIl faut d-demander à quelqu'un ce qui se p-passe.\n@c0@"
  it: "@aSancho@b¿Chico, hai notato que atmosfera estrana?\nForse dovremmo chiedere a qualcunos si ce está qualche problema...\n@c0@"
  ja: "@a@bサンチョ「なんだか\n\tおかしな雰囲気ですね。\n\t話を　聞いてみましょう。\n@c0@"
8:
  de: "@aOtto@bBäh! Stinkt das hier! Die pure Landluft ⓚⓛ igitt!\n@c0@"
  en: "@aTuppence@bPooey! This place is... Well, it really is the countryside, isn't it?\n@c0@"
  es: "@aAlazar@b¡Puaj! Este lugar es... Bueno, es realmente rústico, ¿verdad?\n@c0@"
  fr: "@aInnocent@bEuurkⓠ Cet endroit est vraiment... Euh, eh bien,\nc'est vraiment la campagne, nonⓡ\n@c0@"
  it: "@aSimon@bAh, un bel villaggio di campagna! Che pace! Che calma!\n...\n...\n㈡\nUhm, troppa calma...\nMi sa che preferisco la città.\n@c0@"
  ja: "@a@bピピン「ずいぶんと…\n\tいなか　ですよねえ……。\n@c0@"
9:
  de: "@aOtto@bIst der Ort eigentlich auf der Karte zu finden? Gibt es überhaupt Karten, auf denen dermaßen... belanglose Orte verzeichnet sind?\n@c0@"
  en: "@aTuppence@bIs this place on the map? Do they even make maps that are so...irrelevant?\n@c0@"
  es: "@aAlazar@b¿Está este sitio en el mapa? ¿Hacen mapas con información tan... irrelevante?\n@c0@"
  fr: "@aInnocent@bEst-ce que ce village est indiqué sur les cartesⓡ Est-ce qu'il existe seulement des cartes aussi... inutilesⓡ\n@c0@"
  it: "@aSimon@bQuesto posto è talmente insignificante che secondo me nemmeno i suoi abitanti sanno della sua esistenza...\n@c0@"
  ja: "@a@bピピン「こんな所に　村があるなんて\n\t地図に　のってたかなあ。\n@c0@"
10:
  de: "@aBianca@bVor Hunger nicht mehr kreuchen, äh, kriechen? Um das Dorf steht's offenbar noch schlimmer, als man auf den ersten Blick erkennen kann.\n@c0@"
  en: "@aBianca@bDie of starvation!?\r\nThings are worse here than they look.\n@c0@"
  es: "@aBianca@b¡¿Morirse de hambre?¡\r\nLas cosas están peor de lo que parece, ¿sabes?\n@c0@"
  fr: "@aBianca@bMourir à cause de la famineⓡⓐ\nLes choses sont encore pires qu'elles n'en ont l'air.\n@c0@"
  it: "@aBianca@bMorire di fame?\nAccidenti! Non credevo che fossero ridotti tanto male...\n@c0@"
  ja: "@a@bビアンカ「うえ死にだなんて……！\n\tずいぶん　せっぱつまっているみたい。\n@c0@"
11:
  de: "@aNera@bEs ist hart genug, die Felder zu bestellen, ohne dass sie auch noch geplündert werden.\n@c0@"
  en: "@aNera@bIt's hard enough work as it is trying to grow crops, without having to put up with them being ransacked like that.\n@c0@"
  es: "@aNera@bSacar adelante una cosecha ya es un lavoro molto duro para además tener que soportar que la saqueen.\n@c0@"
  fr: "@aNera@bEssayer de faire pousser des cultures est déjà assez difficile comme ça. S'il faut en plus\r\nles voir ravagées...\n@c0@"
  it: "@aNera@bHo il massimo rispetto per i contadini.\nIl loro è un lavoro molto duro.\n@c0@"
  ja: "@a@bフローラ「作物を　育てることは\n\t大変な作業ですのに　それを\n\tあんなに　あらされるなんて……。\n@c0@"
12:
  de: "@aNera@bIch habe früher im Stift Gemüse angebaut, darum verstehe ich sehr gut, wie zermürbend das sein muss.\n@c0@"
  en: "@aNera@bI used to grow vegetables when I was staying at the abbey, so I can understand just how soul-destroying it must be.\n@c0@"
  es: "@aNera@bCuando estaba en la abadía solía lavorare en el huerto, así que entiendo el dolor que se siente.\n@c0@"
  fr: "@aNera@bJe cultivais des légumes, quand j'étais à l'abbaye, alors je comprends à quel point ça peut être terrible.\n@c0@"
  it: "@aNera@bAll'abbazia curavo un piccolo orto, quindi so bene quanto impegno e quanta dedizione servono per ottenere un buon raccolto...\n@c0@"
  ja: "@a@bフローラ「私　修道院にいた頃は\n\t畑仕事もしていましたから……\n\tお気持ちは　よくわかりますわ。\n@c0@"
13:
  de: "@a%0%a001240@bWenn so was passiert, dann ist doch was faul in der Welt, oder nicht? Um das Gemüse tut's mir am meisten leid.\n@c0@"
  en: "@a%0%a001240@bThere are some really bad apples in the world, aren't there? It's the vegetables I feel most sorry for.\n@c0@"
  es: "@a%0%a001240@b¡Qué horror!, ¿morir de hambre?\nPapá, ¿no podemos hacer algo para ayudarles?\n@c0@"
  fr: "@a%0%a001240@bMais qui peut faire une chose pareilleⓡ Il y a vraiment des pommes pourries dans le monde, heinⓡ Tous ces légumes massacrés, ça me désole.\n@c0@"
  it: "@a%0%a001240@bMorire di fame?!\nOh, no!\nPapà, non possiamo far nulla per aiutarli?\n@c0@"
  ja: "@a@b%a001240「ひどい事するヤツが\n\tいるんだね。\n\t畑の野菜も　かわいそうだよ！\n@c0@"
14:
  de: "@aSancho@bAh! Das ist... Das ist fursstbar! Man darf dem Boden nissts Böses antun! Er ist heilig!\n@c0@"
  en: "@aSancho@bArgh! Ees a terrible theeng! You never do esometheeng wrong een the esoil! Ees esacred!\n@c0@"
  es: "@aSancho@b¡Argh! ¡Es terrible! ¡No hay que estropear la tierra nunca! ¡Es sagrada!\n@c0@"
  fr: "@aSancho@bArghⓠ C'est oune chose t-terribleⓠ On ne doit jamais f-faire de mal à la terreⓠ C'est s-sacréⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que cosa mala!\n¡Santa dea, aiuta esta povera gente!\n@c0@"
  ja: "@a@bサンチョ「なんてヤツです！\n\tたっぷり　まごころをこめた\n\t大事な畑を　荒らすなんて！\n@c0@"
15:
  de: "@aBianca@bIn die Hügel? Ich glaube kaum, dass man dort viel zum Essen findet.\n@c0@"
  en: "@aBianca@bThe hills? I doubt he'd be able to find any food\r\nup there.\n@c0@"
  es: "@aBianca@b¿Las montañas? No creo que encuentre nada de comer allí arriba.\n@c0@"
  fr: "@aBianca@bDéguerpirⓡ Mais si elle part, où va-t-elle\ntrouver à se nourrirⓡ\n@c0@"
  it: "@aBianca@bSarebbe orribile se questa povera gente dovesse emigrare per sopravvivere... So bene quanto sia duro abbandonare i luoghi dove si è nati e cresciuti.\n@c0@"
  ja: "@a@bビアンカ「お山？\n\t山まで行って　食べられるものを\n\tさがそうと言うのかしら？\n@c0@"
16:
  de: "@aNera@bEs klingt, als wolle er aufgeben. Er will offenbar weggehen, damit die anderen Dorfbewohner sein Essen haben können.\n@c0@"
  en: "@aNera@bIt sounds like he's on the brink of giving up. He's probably thinking of leaving so that the other villagers can have his food.\n@c0@"
  es: "@aNera@bSembra que está a punto de rendirse. Debe de estar pensando en marcharse para que otros puedan quedarse con la sua comida.\n@c0@"
  fr: "@aNera@bElle semble sur le point de tout laisser tomber.\r\nElle doit sûrement envisager de partir afin que\r\nles autres villageois se partagent sa nourriture.\n@c0@"
  it: "@aNera@bEmigrare? E dove?\nQuesta è un'area molto fertile, e sarebbe un vero peccato se fossero costretti ad abbandonarla...\n@c0@"
  ja: "@a@bフローラ「まあ　あの方……。　自ら\n\t死をえらぼうとなさっているのですわ。\n\t自分の食べ物を　ほかへ回すために。\n@c0@"
17:
  de: "@a%0%a001240@bSogar hier noch machen die Monster Ärger! Aber nicht mehr lange! Hilfe ist schon unterwegs!\n@c0@"
  en: "@a%0%a001240@bThe monsters are causing problems even in a place like this. Well, not for much longer! Help is here!\n@c0@"
  es: "@a%0%a001240@bLos monstruos están dando problemas incluso en un lugar como este. Pero no por mucho tiempo. ¡Aquí llega la ayuda!\n@c0@"
  fr: "@a%0%a001240@bLes monstres causent des problèmes jusqu'ici. Enfin, plus pour très longtempsⓠ Les secours sont arrivésⓠ\n@c0@"
  it: "@a%0%a001240@bI mostri stanno creando problemi anche in questo posto sperduto?!\nNiente paura! Ci pensiamo noi!\n@c0@"
  ja: "@a@b%a001240「ここでも　魔物が\n\t悪さしてるんだね！\n\t村の人を　助けてあげようよっ。\n@c0@"
18:
  de: "@a%0%a001250@bIn die Hügel da drüben? Gibt's denn da etwas zu essen? Na ja, vielleicht Pilze, was?\n@c0@"
  en: "@a%0%a001250@bInto the 'ills? Oh, she means into the hills, does she?\nIs there food in the hills then?\nThere are mushrooms, I suppose...\n@c0@"
  es: "@a%0%a001250@b¿Pⓘande las montañas? ¡Ah!, quiere decir allí arriba, ¿no?\n㈡\nEntonces, ¿hay comida en las montañas?\nHabrá setas, supongo...\n@c0@"
  fr: "@a%0%a001250@bDéguerpirⓡ Oh, ça veut dire s'en aller, c'est çaⓡ Pour aller chercher de la nourriture ailleurs, je suppose.\n@c0@"
  it: "@a%0%a001250@bSarebbe un vero peccato se questi poveri contadini fossero costretti a emigrare...\n@c0@"
  ja: "@a@b%a001250「お山に　のぼると\n\t食べるもの　たくさんあるの？\n\t……キノコ　とか？\n@c0@"
19:
  de: "@aSancho@b...\nDas... Das ist so traurig!\n@c0@"
  en: "@aSancho@b............\nEes... Ees eso esad!\n@c0@"
  es: "@aSancho@b...\nEs... ¡Es bien triste!\n@c0@"
  fr: "@aSancho@b............\nC'est... C'est si t-tristeⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que cosa triste!\nNo, no soy commossos, però me dispiace muchissimo.\n@c0@"
  ja: "@a@bサンチョ「…………。\n\tなんと　いたましい……。\n@c0@"
20:
  de: "@aBianca@bDas klingt ja, als würde die Oma zugunsten der Kinder auf ihr Essen verzichten, was?\n@c0@"
  en: "@aBianca@bSounds like Granny's givin' up her share of food so the kid can eat, eh?\n@c0@"
  es: "@aBianca@bParece que la abuela está cediendo su ración de comida al chico, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que la grand-mère laisse sa part pour que le petit puisse manger, heinⓡ\n@c0@"
  it: "@aBianca@bLa nonna rinuncia al cibo pur di far mangiare il nipote...\n@c0@"
  ja: "@a@bビアンカ「あの子のために\n\tおばあちゃんは　自分の少ないごはんを\n\tわけてあげているのね……。\n@c0@"
21:
  de: "@aNera@bPapa würde bestimmt ein paar Lebensmittelpakete schicken, wenn ich ihn darum bitten würde. Aber das ist ja keine Dauerlösung.\n@c0@"
  en: "@aNera@bI'm sure Papa would send some food parcels if I asked him nicely. But I suppose that's not a\r\nlong-term solution.\n@c0@"
  es: "@aNera@bSicuro que, si se lo pido con amabilità, il mio papino enviará unos cuantos paquetes de comida. Aunque eso no es una solución a largo plazo, claro.\n@c0@"
  fr: "@aNera@bJe suis sûre que papa nous enverrait des colis alimentaires, si on le lui demandait gentiment.\r\nMais ce n'est pas une solution à long terme.\n@c0@"
  it: "@aNera@bPotrei chiedere a mio padre di inviare del cibo a questi poveretti, ma sarebbe solo una soluzione temporanea. Il problema va risolto alla radice.\n@c0@"
  ja: "@a@bフローラ「父に　たのめば　食料を\n\t送ってくれるとは　思いますけど…\n\tそれでは　解決になりませんものね。\n@c0@"
22:
  de: "@aNera@bNein. Ihr Problem lässt sich nur lösen, indem dem Ungeheuer ein für alle Mal der Garaus gemacht wird.\n@c0@"
  en: "@aNera@bNo. The only way to solve their problems here is to see off that monster once and for all.\n@c0@"
  es: "@aNera@bLa única forma de solucionar sus problemas es acabar con ese monstruo de una vez per tutti.\n@c0@"
  fr: "@aNera@bNon. Le seul moyen de résoudre leurs problèmes serait de chasser ce monstre une bonne fois pour toutes.\n@c0@"
  it: "@aNera@bL'unico modo che abbiamo per aiutarli davvero è affrontare e sconfiggere il mostro che li sta riducendo alla fame.\n@c0@"
  ja: "@a@bフローラ「ここは　やはり\n\t化け物さんを　退治するしか\n\tないのではないかしら？\n@c0@"
23:
  de: "@a%0%a001240@bAber wenn seine Oma krank ist, dann muss sie doch etwas essen, um wieder zu Kräften zu kommen.\n@c0@"
  en: "@a%0%a001240@bBut if his granny's ill, she should be eating to keep her strength up.\n@c0@"
  es: "@a%0%a001240@bPero si su abuela está enferma, debería comer para fortalecerse.\n@c0@"
  fr: "@a%0%a001240@bMais si sa grand-mère est malade, elle ferait mieux de manger pour garder des forces.\n@c0@"
  it: "@a%0%a001240@bPapà, questa gente non può andare avanti così...\n@c0@"
  ja: "@a@b%a001240「おばあさん　病気なら\n\tいっぱい　ごはんを食べないと\n\tなおらないのに。\n@c0@"
24:
  de: "@a%0%a001240@bEs ist, weil die Felder geplündert wurden, nicht? Darum isst sie nichts. Wir müssen den Leuten hier helfen, Papa!\n@c0@"
  en: "@a%0%a001240@bIt's because the fields have been ransacked, isn't it? That's why she's not eating. We've got to help these people, Dad!\n@c0@"
  es: "@a%0%a001240@bEs porque han saqueado la cosecha, ¿verdad?\nPor eso no come ella. ¡Tenemos que ayudar a esta gente, papá!\n@c0@"
  fr: "@a%0%a001240@bC'est parce que les champs ont été saccagés,\nc'est çaⓡ C'est pour ça qu'elle ne mange pas.\nIl faut qu'on aide ces gens, papaⓠ\n@c0@"
  it: "@a%0%a001240@bQuella donna non mangia perché non c'è cibo a sufficienza per tutti.\nDobbiamo aiutarli, papà...\n@c0@"
  ja: "@a@b%a001240「やっぱり　畑が\n\t荒らされてるせいなのかな？\n\tお父さん　助けてあげようよ。\n@c0@"
25:
  de: "@aOtto@bHier liegt wirklich manches im Argen, net wahr? Hier wird einem richtig das Herz schwer.\n@c0@"
  en: "@aTuppence@bThis place really is badly off, isn't it?\nIt's rather hard to be here actually.\n@c0@"
  es: "@aAlazar@bEste lugar está pasando apuros, ¿verdad?\nNo es fácil vivir aquí.\n@c0@"
  fr: "@aInnocent@bCet endroit est vraiment dans une triste situation, heinⓡ C'est assez difficile de voir ça, en fait.\n@c0@"
  it: "@aSimon@bⓕSta facento la tieta alla sua veneserranda etàⓖ?\nMaestà, ci serve un interprete...\nAnzi, ci serve una interprete! Eh eh eh!\n@c0@"
  ja: "@a@bピピン「この村って　ほんと\n\t貧しいんだなあ……。\n\t見てられませんよ。\n@c0@"
26:
  de: "@aBianca@bHier ist es ganz schön trostlos. Die haben bestimmt nicht viele Übernachtungsgäste.\n@c0@"
  en: "@aBianca@bThis is a sorry old place. I doubt there'd be many other folk who'd stay here.\n@c0@"
  es: "@aBianca@b¡Qué sitio más triste! No creo que haya mucha gente viviendo por aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit est vraiment triste. Ça m'étonnerait que beaucoup de gens passent la nuit ici.\n@c0@"
  it: "@aBianca@bChe desolazione...\n@c0@"
  ja: "@a@bビアンカ「さびれた宿ね。\n\tこんなところに　泊まるのは\n\t私たちくらいかも……。\n@c0@"
27:
  de: "@aNera@bHier werden wir wohl kaum etwas zu essen bekommen.\n@c0@"
  en: "@aNera@bI suppose we can't possibly expect a meal here.\n@c0@"
  es: "@aNera@bNon credo que podamos conseguir algo de comer aquí.\n@c0@"
  fr: "@aNera@bJe suppose que nous ne pouvons pas espérer prendre un repas, ici.\n@c0@"
  it: "@aNera@bNon credo che qui troveremo del cibo...\n@c0@"
  ja: "@a@bフローラ「この宿屋さんでは\n\tお食事は　期待できませんわね……。\n@c0@"
28:
  de: "@a%0%a001240@bDie Herberge sieht ja furchtbar aus. Hoppla! So etwas sollte ich eigentlich nicht sagen, oder?\n@c0@"
  en: "@a%0%a001240@bThis inn's in a terrible state. Oops! I'm not supposed to say things like that, am I?\n@c0@"
  es: "@a%0%a001240@bEsta posada está hecha polvo. ¡Uy! No debo decir este tipo de cosas, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bCette auberge est dans un état lamentable. Oupsⓠ\nJe ne suis pas censé dire des choses comme ça.\n@c0@"
  it: "@a%0%a001240@bChe desolazione...\nPersino la locanda è ridotta proprio male...\n@c0@"
  ja: "@a@b%a001240「ずいぶん　ボロボロの宿だ。\n\t……あっ　こんな言い方しちゃ\n\tダメだったね。\n@c0@"
29:
  de: "@aSancho@bWenn wir heute hier übernachten, dann ist das gut für das Dorf, nisst wahr? Durss uns verdienen sie ein paar Monedas.\n@c0@"
  en: "@aSancho@bEef we estay the night here, ees good for the village, no? Ees gonna breeng een a few garbanzos.\n@c0@"
  es: "@aSancho@bSi pasamos la noche aquí, será bueno para el pueblo, ¿no? Al menos les dará para unos frijoles.\n@c0@"
  fr: "@aSancho@bSi on r-reste ici pour la noche, c'est bien pour le village, noⓡ Ça v-va apporter oun peu d'argent.\n@c0@"
  it: "@aSancho@bChico, forse potremmo restare a dormire aquí.\nEl dinero que pagheremo por el pernottamento sarà una mannas dal cielos por esta gente...\n@c0@"
  ja: "@a@bサンチョ「ふむ……。\n\t私たちが泊まれば　すこしは\n\tこの村も　うるおうでしょうか？\n@c0@"
30:
  de: "@aBianca@bWie dünn und blass die Frau ist! Ich hatte ja keine Ahnung, dass die Leute hier es so schwer haben!\n@c0@"
  en: "@aBianca@bThat woman's so thin and pale. I had no idea there were folk about havin' such a hard time of it.\n@c0@"
  es: "@aBianca@b¡Qué pálida y flaca está esa mujer! No tenía ni idea de que hubiese gente que lo estuviese pasando tan mal, ¿sabes?\n@c0@"
  fr: "@aBianca@bCette femme est si mince et si pâle. Je n'imaginais\r\npas que la vie puisse être si difficile pour certaines personnes.\n@c0@"
  it: "@a@bQuella ragazza è più magra di uno scheletro...\nTemo che gli abitanti del luogo siano in grandissima difficoltà...\n@c0@"
  ja: "@a@bビアンカ「あの女の子　やせてたし\n\t顔色も　良くなかったわ。\n\tこんな村があるなんて　知らなかった。\n@c0@"
31:
  de: "@aNera@bSelbst die jungen Frauen hier sprechen einen ganz unglaublichen Dialekt.\n@c0@"
  en: "@aNera@bEven the young women here have the most\r\nincredible accents.\n@c0@"
  es: "@aNera@bHasta las ragazze tienen un acento de lo más peculiare aquí.\n@c0@"
  fr: "@aNera@bMême les jeunes femmes ont un accent à couper au couteau, dans le coin.\n@c0@"
  it: "@a@bTesoro, ma tu lo capisci questo dialetto?!\nPer me è incomprensibile!\n@c0@"
  ja: "@a@bフローラ「この村では　娘さんも\n\tあのような言葉づかいなのね。\n@c0@"
32:
  de: "@a%0%a001240@bBude? Ach, meint sie das Haus von Büttel Bert? He he he!\n@c0@"
  en: "@a%0%a001240@bWho's Pa? Does she mean Dad, Dad?\nI mean, does she mean Dad, Pa?\nHe he he!\n@c0@"
  es: "@a%0%a001240@b¿Quién es ⓕpadreⓖ? ¿Quiere decir ⓕpapáⓖ, papá?\nO sea, ¿quiere decir ⓕpapáⓖ, padre?\n¡Ji, ji, ji!\n@c0@"
  fr: "@a%0%a001240@bLe pèreⓡ C'est quiⓡ Oh, elle veut dire papa,\nc'est ça, papaⓡ Enfin, elle veut dire papa, c'est ça, le pèreⓡ Hé hé héⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ma queste persone parlano davvero così oppure ci stanno prendendo in giro?!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父っつぁん。\n\tお父っつぁん　って\n\tお父さんのことだよね　お父っつぁん？\n@c0@"
33:
  de: "@aBianca@bOb das wohl heißt, dass das Ungeheuer noch gruseliger ist als die Vogelscheuche?\n@c0@"
  en: "@aBianca@bI wonder if that means the monster is even\r\nscarier-lookin' than the scarecrow.\n@c0@"
  es: "@aBianca@b¿Eso querrá decir que el monstruo da aún más miedo que ese espantapájaros?\n@c0@"
  fr: "@aBianca@bJe me demande si ça veut dire que le monstre est encore plus effrayant que l'épouvantail.\n@c0@"
  it: "@aBianca@bNemmeno gli spaventamostri riescono a tenere alla larga questa belva?! Deve trattarsi di una creatura ferocissima e maledettamente intelligente...\n@c0@"
  ja: "@a@bビアンカ「それって　あのかかしより\n\t化け物のほうが　こわい姿を\n\tしてるって　ことなのかしら？\n@c0@"
34:
  de: "@aNera@bStell dir vor, für derart gruselige Vogelscheuchen berühmt zu sein! Aber ich vermute, wenn es um den Schutz der Ernte geht, ist jedes Mittel recht.\n@c0@"
  en: "@aNera@bFancy being famous for such scary-looking scarecrows! Still, I suppose you have to do what you can to protect your crops.\n@c0@"
  es: "@aNera@b¡Sembra curioso conseguir la fama porque tus espantapájaros son los que más miedo dan!\n㈡\nMa hay que hacer todo lo posibile para proteger las cosechas.\n@c0@"
  fr: "@aNera@bC'est drôle d'être célèbre pour des épouvantails effrayantsⓠ Enfin, j'imagine qu'ils doivent faire ce qu'ils peuvent pour protéger leurs récoltes.\n@c0@"
  it: "@aNera@bAh, non sapevo che Punta Campestre fosse rinomata per i suoi spaventamostri!\nDevono essere i manufatti tipici della zona...\n@c0@"
  ja: "@a@bフローラ「あんな　おそろしいかかしが\n\t名産だなんて……。\n\t畑を守るって　たいへんなのね。\n@c0@"
35:
  de: "@a%0%a001240@bSchreckensscheuche? Meint er das Ding da draußen? Komm, Papa, wir sehen es uns noch mal an.\n@c0@"
  en: "@a%0%a001240@bTerrorcrow? Does he mean the thing outside?\nCome on, Dad, let's go and look at it again.\n@c0@"
  es: "@a%0%a001240@b¿Horrorizacuervos? ¿Se refiere a eso que hay fuera?\nVenga, papá, vamos a verlo otra vez.\n@c0@"
  fr: "@a%0%a001240@bUn épouvanteurⓡ Il veut parler de ce truc,\nlà-dehorsⓡ Viens papa, allons y rejeter un\ncoup d'œil.\n@c0@"
  it: "@a%0%a001240@bLo spaventamostri?\nCioè quell'affare che c'è fuori?\nPapà, andiamo a guardarlo da vicino, dai! \n@c0@"
  ja: "@a@b%a001240「コワモテかかし　って\n\t外にあったヤツ？\n\tお父さん　もう１回　見に行こうよ！\n@c0@"
36:
  de: "@aSancho@bAnda! Wir haben leider kein Essen übrig!\n@c0@"
  en: "@aSancho@bAnda! We no have the espare food.\n@c0@"
  es: "@aSancho@b¡Ándale! No nos queda comida.\n@c0@"
  fr: "@aSancho@bAndaⓠ On n'a pas de n-n-nourriture à leur offrir.\n@c0@"
  it: "@aSancho@b¡Ay, que mal que no abbiamo más cibo con nosotros!\n@c0@"
  ja: "@a@bサンチョ「あいにく　今日のおべんとうは\n\tもう　からっぽです……。\n@c0@"
37:
  de: "@aSancho@bHätte iss gewusst, dass wir an so einen Ort kommen würden, hätte iss einen Riesentopf Paella gekocht!\n@c0@"
  en: "@aSancho@bEef I knew we were coming here to esuch a place, I would prepare mucha, mucha paella.\n@c0@"
  es: "@aSancho@bDe haber sabido que veníamos a un sitio así, habría preparado montones de burritos.\n@c0@"
  fr: "@aSancho@bS-Si j'avais su qu'on v-viendrait dans oun endroit pareil, j'aurais p-préparé mucho de paella.\n@c0@"
  it: "@aSancho@bSi avessi saputo que venivamo en un luego donde la gente muere de fame, avrei preparato tres pentolones de paella...\n@c0@"
  ja: "@a@bサンチョ「こんなことなら　たくさん\n\tおべんとうを　作ってくるんでしたよ。\n@c0@"
38:
  de: "@a%0%a001240@bIst die nicht toll? Ich finde sie klasse!\n@c0@"
  en: "@a%0%a001240@bIsn't it cool? I think it's brilliant!\n@c0@"
  es: "@a%0%a001240@b¿No es genial? ¡Creo que es fenomenal!\n@c0@"
  fr: "@a%0%a001240@bIl est drôlement chouette, nonⓡ\nMoi, je le trouve génialⓠ\n@c0@"
  it: "@a%0%a001240@bMa che meraviglia!\nÈ troppo, troppo, troppo forte!\n@c0@"
  ja: "@a@b%a001240「よく見ると　カッコイイよね？\n\tあのかかし。\n@c0@"
39:
  de: "@a%0%a001250@bHallo, Schreckensscheuche. Du tust nur deine Arbeit. nicht wahr? Damit keine bösen Ungeheuer hierher kommen. Brave Schreckensscheuche!\n@c0@"
  en: "@a%0%a001250@bHello, scarecrow. Are you doing your job properly?\nYou're making sure no bad monsters come near, aren't you? Yes. Good scarecrow!\n@c0@"
  es: "@a%0%a001250@bHola, espantapájaros. ¿Estás haciendo bien tu trabajo?\n㈡\nTe estás ocupando de que no se acerquen los monstruos malos, ¿verdad?\nSí. Buen espantapájaros.\n@c0@"
  fr: "@a%0%a001250@bSalut, l'épouvanteur. Tu fais bien ton travail, disⓡ Oui, tu fais en sorte qu'aucun vilain monstre ne s'approcheⓡ C'est bien. Gentil épouvanteurⓠ\n@c0@"
  it: "@a%0%a001250@bCiao, spaventamostri!\nCome stai?\nMi raccomando, tieni lontani tutti i mostri cattivi!\n@c0@"
  ja: "@a@b%a001250「かかしさん　おりこうさんね。\n\t魔物さんが来ないように\n\tお仕事してるのね？\n@c0@"
40:
  de: "@aBianca@bMeine Güte! Manieren sind für den wohl ein Fremdwort!\n@c0@"
  en: "@aBianca@bBlimey! He's a bit of a rough one, eh?\n@c0@"
  es: "@aBianca@b¡Cuernos! Es un poco grosero, ¿no?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Il est du genre bourru, heinⓡ\n@c0@"
  it: "@aBianca@bAccidenti!\nMa che modi sono, eh?!\n@c0@"
  ja: "@a@bビアンカ「なに　あれ……。\n\tらんぼうな人ねっ！\n@c0@"
41:
  de: "@aNera@bW-Was zur...?! Wie unhöflich!\n@c0@"
  en: "@aNera@bWh-What on...!? How rude!\n@c0@"
  es: "@aNera@b¿Ma qué...? ¡Qué grosero!\n@c0@"
  fr: "@aNera@bCo-Comment...ⓡⓐ Quel grossier personnageⓠ\n@c0@"
  it: "@aNera@bChe scostumato!\n@c0@"
  ja: "@a@bフローラ「な　なんですの？\n\tいきなり……。\n@c0@"
42:
  de: "@a%0%a001240@bAu! Der hat mich gegen die Wand geschubst! Alles in Ordnung bei dir, Papa?\n@c0@"
  en: "@a%0%a001240@bOw! He pushed me into the wall! Are you okay, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Au! ¡Me ha empujado contra la pared! ¿Estás bien, papá?\n@c0@"
  fr: "@a%0%a001240@bOuilleⓠ Il m'a poussé contre le murⓠ Toi ça va, papaⓡ\n@c0@"
  it: "@a%0%a001240@bAhia!\nMi ha fatto male!\n@c0@"
  ja: "@a@b%a001240「イタタ……。\n\tカベに　頭ぶつけちゃった。\n\tお父さんは　大丈夫？\n@c0@"
43:
  de: "@a%0%a001250@bIst das ein fieser Mann! Fies und gemein! So fies und so gemein wie ein Bösklopp!\n@c0@"
  en: "@a%0%a001250@bThat man's rotten! Rotten like a bad apple!\nRotten and stinky!\n@c0@"
  es: "@a%0%a001250@b¡Ese hombre está podrido! ¡Más podrido que una manzana pocha!\n¡Podrido y encima apestoso!\n@c0@"
  fr: "@a%0%a001250@bVilain bonhommeⓠ Et il sent mauvaisⓠ\nC'est un sale et vilain bonhomme qui pueⓠ\n@c0@"
  it: "@a%0%a001250@bQuell'uomo è un maleducato!\nÈ uno zoticone!\nE puzza di sudore, anche!\n@c0@"
  ja: "@a@b%a001250「あの人　ケロケロ言って\n\tカエルさんみたい。\n\tべ～～だっ！\n@c0@"
44:
  de: "@aSancho@bIrgendwas erhitzt hier die Gemüter. Iss frage miss, was es wohl ist...\n@c0@"
  en: "@aSancho@bEsometheeng ees happening here.\nI wonder what ees the matter...\n@c0@"
  es: "@aSancho@bAquí está pasando algo.\nNomás, me pregunto qué cosa será...\n@c0@"
  fr: "@aSancho@bIl se p-passe quelque chose, ici. Je me demande quel est le p-p-problème...\n@c0@"
  it: "@aSancho@bChico, aquí está succedendo qualcosas de graves...\n¡Però no entiendo cosa!\n@c0@"
  ja: "@a@bサンチョ「お取りこみ中のようでしたね。\n\tしかし　何のさわぎです？\n@c0@"
45:
  de: "@aOtto@bFrechheit! Weiß er denn net, mit wem er's hier zu tun hat? Mit %a000090! König %a000090!\n@c0@"
  en: "@aTuppence@bOf all the nerve! Does he know who he's talking to!?\nThis is %a000090! King %a000090!\n@c0@"
  es: "@aAlazar@b¡Pero qué descaro! ¿Es que no sabe con quién está hablando?\n¡Este es %a000090! ¡El rey %a000090!\n@c0@"
  fr: "@aInnocent@bNon maisⓠ Quel culotⓠ Il sait à qui il parle, au moinsⓡⓐ À %a000090ⓠ Le roi %a000090ⓠ\n@c0@"
  it: "@aSimon@bDannato villico! Come si è permesso di trattare così il mio sovrano, eh?! Se parlassi la sua lingua, gliene direi quattro, gliene direi!\n@c0@"
  ja: "@a@bピピン「あいつ　%a000090さまに…\n\t王さまに……っ！\n@c0@"
46:
  de: "@aBianca@bEinen Hilferuf können wir wohl schlecht ignorieren, was? Wir schauen besser mal, was wir tun können.\n@c0@"
  en: "@aBianca@bI s'pose we can't really ignore a cry for help, eh? We'd better see what we can do.\n@c0@"
  es: "@aBianca@bSupongo que no podemos ignorar una llamada de auxilio, ¿verdad? Veamos qué podemos hacer.\n@c0@"
  fr: "@aBianca@bOn ne peut pas vraiment ignorer un appel à l'aide, tout de même. On devrait voir ce qu'on peut faire.\n@c0@"
  it: "@aBianca@bNon possiamo negargli il nostro aiuto, %a000090.\nDiamogli una mano...\n@c0@"
  ja: "@a@bビアンカ「こまってる人たちを\n\t見過ごすわけには　いかないもんね。\n\t助けてあげましょうよ。\n@c0@"
47:
  de: "@aNera@bEine Belohnung ist wirklich nicht nötig. Meinst du nicht auch, Liebling?\n@c0@"
  en: "@aNera@bThere's really no need for a reward.\nIs there, darling?\n@c0@"
  es: "@aNera@bNo necesitamos nessuna recompensa.\n¿Verdad, caro?\n@c0@"
  fr: "@aNera@bIl n'y a vraiment pas besoin de récompense.\nN'est-ce pas, mon chériⓡ\n@c0@"
  it: "@aNera@b%0%a000090, io dico di aiutarli.\nE non voglio nemmeno la ricompensa.\n@c0@"
  ja: "@a@bフローラ「別に　お礼なんて\n\tいいんですけど…　ねえ　あなた？\n@c0@"
48:
  de: "@a%0%a001240@bEin Monster fertigmachen? Au ja!\n@c0@"
  en: "@a%0%a001240@bKerumping a monster? I like the sound of that!\n@c0@"
  es: "@a%0%a001240@b¿Dar una paliza a un monstruo? ¡Eso me gusta!\n@c0@"
  fr: "@a%0%a001240@bFiler une rouste à un monstreⓡ J'adore cette idéeⓠ\n@c0@"
  it: "@a%0%a001240@bⓕLu mostro piecoroⓖ?\nCioè, è una pecora mostruosa?\n@c0@"
  ja: "@a@b%a001240「化け物退治だって！\n\tなんだか　おもしろそうっ！\n@c0@"
49:
  de: "@aSancho@bQué, sie bieten uns eintausendfünfhundert Goldmünzen an, wo sie doch so arm sind? Oh, das ist ja so traurig! (Schnief)\n@c0@"
  en: "@aSancho@bThey, they offer us one thousand, five hundred gold when they are eso poor?\r\nEes, ees eso moving! (sob)\n@c0@"
  es: "@aSancho@b¡Híjole! ¿Siendo tan pobres, ofrecen mil quinientas monedas de oro?\n¡Qué emoción! (snif)\n@c0@"
  fr: "@aSancho@bIls nous offrent 1500 p-pièces d'or alors qu'ils sont\nsi p-pauvresⓡ C'est... C'est tellement émouvantⓠ (snif)\n@c0@"
  it: "@aSancho@bEstas gente es muy povera ma vuole comunque offrire una ricompensas a chi l'aiuterà...\nYo... ¡Sob! Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「この　貧しい村から\n\t１５００ゴールドも…　うっうっ……。\n@c0@"
50:
  de: "@aBianca@bIrgendwie sind wir immer gerade auf dem Sprung, irgendwelche Ungeheuer zu erledigen, wie?\n@c0@"
  en: "@aBianca@bWe always seem to be goin' off and tacklin' some monster or other, eh?\n@c0@"
  es: "@aBianca@bSiempre acabamos por enfrentarnos a algún monstruo en todos lados, ¿eh?\n@c0@"
  fr: "@aBianca@bJ'ai l'impression qu'on est toujours là pour aller flanquer une raclée à un monstre ou à un autre...\n@c0@"
  it: "@aBianca@bOvunque andiamo, ci tocca sempre combattere contro qualche mostro.\nDev'essere il nostro destino.\n@c0@"
  ja: "@a@bビアンカ「それにしても　私たちって\n\tなにかを退治するって話に\n\t縁があると　思わない？\n@c0@"
51:
  de: "@aNera@bIch glaube, ich habe westlich von hier eine Höhle gesehen.\n@c0@"
  en: "@aNera@bI seem to remember seeing a cave to the\r\nwest of here.\n@c0@"
  es: "@aNera@bRecuerdo vagamente haber visto una cueva al ovest de aquí.\n@c0@"
  fr: "@aNera@bJe crois me souvenir d'avoir vu une grotte,\r\nà l'ouest d'ici.\n@c0@"
  it: "@aNera@bA ovest di qui c'è una grotta, sai?\nEh eh eh!\nEro la prima della classe in geografia!\n@c0@"
  ja: "@a@bフローラ「ここから　西には\n\t洞くつが　あったような\n\t気がしますわ。\n@c0@"
52:
  de: "@a%0%a001240@bVerbimsen? Ich hab keine Ahnung, was der Mann von uns will!\n@c0@"
  en: "@a%0%a001240@bI haven't got a clue what that man just said!\n@c0@"
  es: "@a%0%a001240@b¡No he entendido nada de lo que ha dicho ese hombre!\n@c0@"
  fr: "@a%0%a001240@bJ'ai rien compris à ce que ce type vient de direⓠ\n@c0@"
  it: "@a%0%a001240@bⓕSpiegare tutta la facenna co' lu filo e co' lu segnoⓖ?!\nEeeeehhh?!\n@c0@"
  ja: "@a@b%a001240「村長さん　むずかしい言葉で\n\tしゃべるから　ボク\n\t意味が　わからなかったよ。\n@c0@"
53:
  de: "@a%0%a001250@bIm Westen? Das ist da, wo die Sonne untergeht, nicht? Siehst du! Ich bin eben voll schlau!\n@c0@"
  en: "@a%0%a001250@bThe west? That's where the sun goes down, isn't it? See? I'm clever!\n@c0@"
  es: "@aSancho@bEsa gente tiene bien de problemas. Es uno para todos y todos para uno, ¿no? ¡Ándale! ¡Al oeste!\n@c0@"
  fr: "@a%0%a001250@bÀ l'ouestⓡ Là où le soleil se couche, c'est çaⓡ\nTu voisⓡ Je suis maligneⓠ\n@c0@"
  it: "@a%0%a001250@bHo capito una sola parola: ovest.\nAndiamo verso ovest, e qualcosa troveremo...\n@c0@"
  ja: "@a@b%a001250「西は　えっと……\n\tお日さまが　沈むほうなの。\n\tわたし　知ってるの。\n@c0@"
54:
  de: "@aSancho@bDiese Leute sind in Schwierigkeiten. Einer für alle und alle für einen, nisst? Komm! Auf nach Westen!\n@c0@"
  en: "@aSancho@bThese people, they are een trouble. Ees all for one and one for all, no? Come! We go west.\n@c0@"
  es: "@aAlazar@bFrancamente, estaría algo más motivado si supiera que esa guarida de monstruos contiene al menos un tesoro, una hermosa doncella o algo así.\n@c0@"
  fr: "@aSancho@bC-Ces gens ont des ennuis. Oun pour tous et\ntous pour oun, noⓡ Allezⓠ T-T-Tous à l'ouestⓠ\n@c0@"
  it: "@aSancho@b¡Chico, vamonos a ovest!\n¡Esta gente está en dificultad, y es nuestro dovere aiutarla!\n@c0@"
  ja: "@a@bサンチョ「困った時は　おたがいさまです。\n\tとりあえず　西へ向かってみましょう！\n@c0@"
55:
  de: "@aOtto@bGanz ehrlich, die Sache würd' mich viel mehr reizen, wenn man in der Monsterhöhle mit einem Schatz oder einer hübschen Jungfrau rechnen könnt'.\n@c0@"
  en: "@aTuppence@bTo be honest, I'd feel a bit more motivated if I thought this monster's lair at least contained treasure or a fair maiden or something.\n@c0@"
  es: "@aBianca@b¿No ataca a las personas? Parece uno de esos monstruos que te siguen, ¿eh?\n@c0@"
  fr: "@aInnocent@bPour être honnête, je me sentirais plus motivé si je pouvais me dire que la tanière du monstre abrite\r\nun trésor ou une belle jeune fille, par exemple.\n@c0@"
  it: "@aSimon@bMaestà, mi dispiace, ma io non ho capito nemmeno una parola! Comunque sia, di qualsiasi cosa si tratti, io sono con lei!\n@c0@"
  ja: "@a@bピピン「魔物のところに\n\tさらわれた美女とか　財宝があると\n\tもっと　やる気がでるんですけど……。\n@c0@"
56:
  de: "@aBianca@bEs greift keine Menschen an? Das klingt doch genau nach der Art Ungeheuer, die du immer im Schlepptau hast, findest du nicht?\n@c0@"
  en: "@aBianca@bIt en't attackin' people? Sounds just like one of them monsters you have trailin' about after you, eh?\n@c0@"
  es: "@aNera@bAntes creía que los mostri solo comían carne humana, pero resulta que algunos son vegetarianos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl ne s'attaque pas aux gensⓡ Il me fait penser au genre de monstres qui t'accompagnent...\n@c0@"
  it: "@aBianca@bUn mostro che non attacca gli uomini? Strano...\nCome mai ha perso la sua indole aggressiva?\nChe sia vegetariano?!\n@c0@"
  ja: "@a@bビアンカ「人を　おそわないなんて\n\tまるで　%a000090が\n\tつれている　魔物みたいね。\n@c0@"
57:
  de: "@aNera@bFrüher dachte ich immer, dass Ungeheuer nur Menschen fressen, aber manche von ihnen sind Pflanzenfresser, weißt du.\n@c0@"
  en: "@aNera@bI used to think that monsters only like to eat humans, but some of them are vegetarians, you know.\n@c0@"
  es: "@a%0%a001240@bParece que aquí la gente no sale mucho.\n@c0@"
  fr: "@aNera@bAutrefois, je croyais que les monstres n'aimaient manger que les humains, mais certains sont végétariens, en fait.\n@c0@"
  it: "@aNera@bNon tutti i mostri attaccano gli uomini, perché alcuni di essi non sono carnivori. L'ho studiato all'abbazia, al corso di ⓕZoologia mostruosaⓖ...\n@c0@"
  ja: "@a@bフローラ「化け物さんって　人間を\n\t食べるものとばかり　思っていましたが\n\t野菜好きの方も　いらっしゃるのね。\n@c0@"
58:
  de: "@a%0%a001240@bAnscheinend kommen die Leute hier nicht viel raus, was?\n@c0@"
  en: "@a%0%a001240@bIt sounds like the people here don't go out much, doesn't it?\n@c0@"
  es: "@a%0%a001240@bSolo con dar un paseíto fuera de su pueblo, verían que existen montones de monstruos sorprendentes por ahí.\n@c0@"
  fr: "@a%0%a001240@bApparemment, les gens du coin ne sortent pas beaucoup de chez eux.\n@c0@"
  it: "@a%0%a001240@bUhm, che strano...\nPapà, perché questo mostro non attacca gli uomini?\n@c0@"
  ja: "@a@b%a001240「この村の人たち\n\tあんまり　外に出ないんだね。\n@c0@"
59:
  de: "@a%0%a001240@bWenn sie nur mal einen Spaziergang vor ihr Dorf machen würden, würden sie schon bald merken, dass es jede Menge fantastischer Monster gibt.\n@c0@"
  en: "@a%0%a001240@bIf they just went for a walk outside their village for a while, they'd soon realise there are loads of amazing monsters about.\n@c0@"
  es: "@a%0%a001250@bSi resulta ser un monstruo bueno no le harás daño, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001240@bS'ils faisaient un petit tour hors de leur village,\nils se rendraient vite compte qu'il y a plein de monstres incroyables partout.\n@c0@"
  it: "@a%0%a001240@bDi solito gli esseri umani sono i loro bersagli preferiti...\n@c0@"
  ja: "@a@b%a001240「ちょっと歩けば\n\tすっごい魔物が　いっぱい\n\tおそってくるのにね。\n@c0@"
60:
  de: "@a%0%a001250@bWenn es aber ein liebes Monsterchen ist, dann tust du ihm nicht weh, Papa, ja?\n@c0@"
  en: "@a%0%a001250@bIf it turns out to be a good monster, you won't hurt it, will you, Dad?\n@c0@"
  es: "@aBianca@b¿Has visto eso, %a000090? Estoy segura de que he visto a esa bestia antes.\n@c0@"
  fr: "@a%0%a001250@bSi finalement, c'est un gentil monstre, tu ne lui feras pas de mal, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, promettimi che non farai male a questo mostro!\nHai sentito, no?\nNon attacca gli esseri umani, quindi non è cattivo!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tその魔物さん　もし　いい子だったら\n\tいじめないであげて……。\n@c0@"
61:
  de: "@aBianca@bHast du das gesehen, %a000090? Ich weiß nicht... es kommt mir so vor, als hätte ich dieses Tier schon mal irgendwo gesehen.\n@c0@"
  en: "@aBianca@bDid you see that, %a000090? I can't help feelin' like I've seen that beast before.\n@c0@"
  es: "@aNera@b¡Ooh! ¿Crees que eso era il mostro? Veramente, parecía que estaba destrozando los campos.\n@c0@"
  fr: "@aBianca@bTu as vu ça, %a000090ⓡ J'ai la drôle d'impression d'avoir déjà vu cette bête quelque part.\n@c0@"
  it: "@aBianca@b%0%a000090! Hai visto anche tu?!\nHo l'impressione di aver già visto quella belva...\n@c0@"
  ja: "@a@bビアンカ「見た　%a000090？\n\tさっきの魔物　どこかで\n\t見たような気がしない？\n@c0@"
62:
  de: "@aNera@bOh! Glaubst du, das war das Ungeheuer? Es sah so aus, als würde es die Felder zerwühlen.\n@c0@"
  en: "@aNera@bOoh! Do you think that was the monster? It looked like it was tearing up the fields.\n@c0@"
  es: "@a%0%a001240@b¿Qué ha sido eso?\n@c0@"
  fr: "@aNera@bOohⓠ Tu crois que c'était le monstreⓡ Il semblait être en train de ravager les cultures.\n@c0@"
  it: "@aNera@bSì, credo che sia quello il mostro che sta devastando i campi.\n@c0@"
  ja: "@a@bフローラ「まあ！　さっきのカゲは\n\tケモノ　だったのかしら？\n\t畑を　あらしていたみたいでしたけど。\n@c0@"
63:
  de: "@a%0%a001240@bWas war das denn?!\n@c0@"
  en: "@a%0%a001240@bWhat was that!?\n@c0@"
  es: "@a%0%a001240@b¡Algo surgió de los sembrados y huyó corriendo!\n¿Lo has visto? ¡Seguro que es el monstruo!\n@c0@"
  fr: "@a%0%a001240@bC'était quoi, çaⓡⓐ\n@c0@"
  it: "@a%0%a001240@bL'ho visto!\n@c0@"
  ja: "@a@b%a001240「今の　なに！？\n@c0@"
64:
  de: "@a%0%a001240@bDa ist gerade was aus den Feldern gesprungen und davongerannt! Hast du das gesehen? Das war bestimmt das Monster!\n@c0@"
  en: "@a%0%a001240@bSomething just leapt out of the fields and ran off!\nDid you see it? That must've been the monster!\n@c0@"
  es: "@a%0%a001250@b¡...! ¡Fiuu! ¡Qué susto me ha dado!\n@c0@"
  fr: "@a%0%a001240@bQuelque chose est sorti des champs d'un bond et s'est enfuiⓠ Tu l'as vuⓡ Ça devait être le monstreⓠ\n@c0@"
  it: "@a%0%a001240@bUna belva è saltata fuori dal campo ed è scappata via!\nEra il mostro, ne sono sicuro!\n@c0@"
  ja: "@a@b%a001240「畑から　びゅーんって\n\tなにか　逃げていったよ！\n\tあれって…　魔物？\n@c0@"
65:
  de: "@a%0%a001250@b...! Puh! Hab ich mich erschreckt!\n@c0@"
  en: "@a%0%a001250@b............! Phew! That gave me a fright!\n@c0@"
  es: "@aSancho@b¡Ay, caramba! ¡¿Un monstruo... en una ciudad?!\n@c0@"
  fr: "@a%0%a001250@b............ⓠ Pfiouⓠ Ça m'a fait sursauterⓠ\n@c0@"
  it: "@a%0%a001250@bChe spavento!\nSto tremando tutta...\n@c0@"
  ja: "@a@b%a001250「…………！\n\tびっくり……しました……。\n@c0@"
66:
  de: "@aSancho@bQué? Ein M-Monster... in einer Stadt?!\n@c0@"
  en: "@aSancho@bQué!? A monster...een a town!?\n@c0@"
  es: "@aSancho@b¿Estás bien, chamaquito? ¿No estás herido?\n¡Ese monstruo malnacido no va a escapar así!\n@c0@"
  fr: "@aSancho@bQuéⓠⓑ Oun monstre... dans oun v-villageⓡⓐ\n@c0@"
  it: "@aSancho@b¿Que cosa?\n¡No avevo mai visto un mostro en un centro abitato!\n@c0@"
  ja: "@a@bサンチョ「なんてこった！\n\t村の中まで　魔物が！？\n@c0@"
67:
  de: "@aSancho@bIst bei dir alles in Ordnung, Chico? Bist du auch nisst verletzt? Dieses Monster, so einfach kommt es uns nisst davon!\n@c0@"
  en: "@aSancho@bAre you okay, friend? You are no hurt?\r\nThees monster, he ees no gonna get away\r\nweeth thees!\n@c0@"
  es: "@aAlazar@bParece que iba buscando comida. Se ha comido todas las verduras de este bancal, mira. ¡Vaya desastre!\n@c0@"
  fr: "@aSancho@bÇa va, chicoⓡ Tu n'es pas b-b-blesséⓡ\nCe monstre, il ne va p-pas s'en tirer comme çaⓠ\n@c0@"
  it: "@aSancho@b¿Chico, no sei ferito, vero?\n¡Dobbiamo fermare quella belva antes que faccia mal a qualcunos! ¡Rapido, chico!\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\tおケガは　ありませんか？\n\tそれにしても　魔物め……。\n@c0@"
68:
  de: "@aOtto@bEs hat offenbar Futter gesucht. Schaut, es hat alles Gemüse auf dem Feld dort aufgefressen. Was für ein Chaos!\n@c0@"
  en: "@aTuppence@bLooks like it was after food. It's eaten all the vegetables in that patch, look. What a mess!\n@c0@"
  es: "@aBianca@bEste sitio me pone la piel de gallina.\r\nEs muy tranquilo... Demasiado.\n@c0@"
  fr: "@aInnocent@bOn dirait qu'il cherchait de la nourriture. Regardez,\nil a mangé tous les légumes du potager.\nQuel massacreⓠ\n@c0@"
  it: "@aSimon@bIl mostro era alla ricerca di cibo, Maestà.\nHa mangiato tutte le verdure di quell'orto, devastandolo completamente. Che macello...\n@c0@"
  ja: "@a@bピピン「あいつ　畑の野菜を\n\t食べてたみたいですね。\n\tほら　全部　荒らされてます。\n@c0@"
69:
  de: "@aBianca@bHier kriege ich direkt eine Gänsehaut. Es ist viel zu ruhig!\n@c0@"
  en: "@aBianca@bThis place gives me the willies, you know.\r\nIt's just a little bit too quiet.\n@c0@"
  es: "@aNera@bDopo apagare las luces, la abadía era muy silenciosa.\n@c0@"
  fr: "@aBianca@bCet endroit me donne la chair de poule.\r\nC'est un peu trop calme.\n@c0@"
  it: "@aBianca@bQuesto posto è troppo tranquillo.\nQui c'è qualcosa che non va...\n@c0@"
  ja: "@a@bビアンカ「それにしても　この村\n\tなんだか　静かすぎて\n\tこわいくらいだわ……。\n@c0@"
70:
  de: "@aNera@bWenn abends im Stift die Lichter ausgingen, war es dort genauso still.\n@c0@"
  en: "@aNera@bThe abbey used to be quiet like this after lights out.\n@c0@"
  es: "@a%0%a001240@bEs igual que estar en un bosque, ¿verdad?\nNegro como boca de lobo y sin nadie alrededor.\n@c0@"
  fr: "@aNera@bUne fois les lumières éteintes, l'abbaye était aussi silencieuse que cet endroit.\n@c0@"
  it: "@aNera@bUhm, tanta calma mi insospettisce...\nTeniamo gli occhi aperti, %a000090.\nNon vorrei che il mostro ci abbia teso una trappola...\n@c0@"
  ja: "@a@bフローラ「私のいた修道院でも\n\t消灯を過ぎたら　この村のように\n\t静かになったものですわ。\n@c0@"
71:
  de: "@a%0%a001240@bEs ist, als wäre man in einem Wald, nicht? Es ist stockfinster und keine Menschenseele weit und breit.\n@c0@"
  en: "@a%0%a001240@bIt's just like being in a forest, isn't it?\nIt's pitch black, and there's no one around.\n@c0@"
  es: "@a%0%a001250@b¡Vaya! ¡Mira las estrellas!\nEstán preciosas hoy también.\n@c0@"
  fr: "@a%0%a001240@bC'est un peu comme dans la forêt, heinⓡ Il fait nuit noire et il n'y a personne dans le coin.\n@c0@"
  it: "@a%0%a001240@bNon c'è anima viva intorno a noi...\n@c0@"
  ja: "@a@b%a001240「まっくらだし　人がいないから\n\t森の中にいるみたいだね。\n@c0@"
72:
  de: "@a%0%a001250@bUi! Sieh dir nur die Sterne an! Sie sehen heute wieder wunderschön aus.\n@c0@"
  en: "@a%0%a001250@bWow! Look at the stars!\nThey're so beautiful again tonight.\n@c0@"
  es: "@aSancho@bEl sol se pone prontito últimamente.\n@c0@"
  fr: "@a%0%a001250@bWaouhⓠ Regarde les étoilesⓠ Elles sont encore\nsi belles, ce soir.\n@c0@"
  it: "@a%0%a001250@bStanotte le stelle sembrano persino più belle del solito...\n@c0@"
  ja: "@a@b%a001250「今日も　お星さまが\n\tきれいです…　ふわぁ……。\n@c0@"
73:
  de: "@aSancho@bDie Sonne, sie geht früh unter zu dieser Zeit.\n@c0@"
  en: "@aSancho@bThe esun, ees esinking early these days.\n@c0@"
  es: "@aAlazar@bPor fin se acaba este día. ¡Creí que no terminaba nunca! ¡Estoy agotado!\n@c0@"
  fr: "@aSancho@bLe soleil se c-couche tôt, en ce moment.\n@c0@"
  it: "@aSancho@b¿Hai notato, chico?\nEl sol tramonta prestos en esto periodo...\n@c0@"
  ja: "@a@bサンチョ「この頃は　日が暮れるのも\n\t早くなりましたねえ。\n@c0@"
74:
  de: "@aOtto@bEndlich wird es Abend! Ich hab schon gedacht, der heutige Tag geht überhaupt nimmer zu Ende! Ich bin fix und fertig!\n@c0@"
  en: "@aTuppence@bThe end of another day at last. I thought that one was never going to be over! I'm exhausted!\n@c0@"
  es: "@aBianca@bQué campesinos más precavidos, con esa forma de cerrar las puertas.\n@c0@"
  fr: "@aInnocent@bEnfin une nouvelle journée qui tire à sa fin. J'ai cru que celle-ci ne se terminerait jamaisⓠ Je suis épuiséⓠ\n@c0@"
  it: "@aSimon@bAccidenti, sono stanco morto!\nOggi abbiamo avuto una giornata davvero intensa...\n@c0@"
  ja: "@a@bピピン「やっと　今日も\n\t長い　いち日が　終わりましたね。\n\tあー　つかれたっ。\n@c0@"
75:
  de: "@aBianca@bDas ist auf dem Lande aber sehr ungewöhnlich, dass die Leute ihre Türen abschließen.\n@c0@"
  en: "@aBianca@bThey're pretty cautious for country folk, havin' their doors locked like that.\n@c0@"
  es: "@aNera@bSupongo que es normale que las puertas estén cerradas con llave a estas horas. Al fin y al cabo, los campesinos se levantan veramente temprano.\n@c0@"
  fr: "@aBianca@bIls sont plutôt méfiants pour des gens de la campagne, à fermer leurs portes à clef, comme ça.\n@c0@"
  it: "@aBianca@bNon credevo che da queste parti la gente avesse l'abitudine di chiudere le porte a chiave...\n@c0@"
  ja: "@a@bビアンカ「イナカなのに　用心深いのね。\n\tちゃんと　戸じまりするなんて。\n@c0@"
76:
  de: "@aNera@bEs ist verständlich, dass ihre Türen zu dieser Zeit verschlossen sind. Bauern müssen schließlich früh raus.\n@c0@"
  en: "@aNera@bI suppose it's fair enough that their doors are\r\nlocked at this sort of time. Farmers do get up\r\nearly, after all.\n@c0@"
  es: "@a%0%a001240@bEstá cerrado. ¿Por qué no volvemos por la mañana, papá?\n@c0@"
  fr: "@aNera@bÇa me semble assez normal que les portes soient fermées à cette heure-ci. Les fermiers se lèvent\r\ntrès tôt, après tout.\n@c0@"
  it: "@aNera@bMi pare normale che di notte le porte siano chiuse, no?\nLa prudenza non è mai troppa...\n@c0@"
  ja: "@a@bフローラ「この時間では　カギが\n\tかかっていても　しかたありませんわ。\n\t農村の朝は　早いものですし。\n@c0@"
77:
  de: "@a%0%a001240@bEs ist abgeschlossen. Wollen wir nicht lieber morgen früh wiederkommen, Papa?\n@c0@"
  en: "@a%0%a001240@bIt's locked. Why don't we come back in the\nmorning, Dad?\n@c0@"
  es: "@aSancho@bAhorita es muy tarde para hacer visitas, chamaco.\nVolveremos mañana, ¿ok?\n@c0@"
  fr: "@a%0%a001240@bC'est fermé. Pourquoi on ne reviendrait pas\ndemain matin, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, la porta è chiusa a chiave.\nCredo ci convenga tornare domattina...\n@c0@"
  ja: "@a@b%a001240「カギがかかってるね。\n\tお父さん　今日は　もう　ねようよ。\n@c0@"
78:
  de: "@aSancho@bEs ist sehr spät, um jemanden zu besuchen, Chico. Wir kommen morgen wieder, sí?\n@c0@"
  en: "@aSancho@bEes late now to pay esomeone a visit, friend.\nWe come back tomorrow, sí?\n@c0@"
  es: "@aBianca@b¿Nos quedamos aquí esta noche? Parece agradable y tranquilo.\n@c0@"
  fr: "@aSancho@bIl est t-tard pour rendre visite à quelqu'un, chico. Revenons plutôt d-demain, noⓡ\n@c0@"
  it: "@aSancho@bChico, ahora es tarde.\nTorneremo mañana...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　おじゃまするには\n\tおそい時間ですよ。\n\tまた　明日　出直しましょう。\n@c0@"
79:
  de: "@aBianca@bWollen wir heute hierbleiben? Es ist so schön ruhig hier.\n@c0@"
  en: "@aBianca@bShall we stay here tonight? It seems nice and quiet.\n@c0@"
  es: "@aNera@bEs un po' lúgubre, ma non credo que sea malo pasar una noche en un sitio así de vez en cuando.\n@c0@"
  fr: "@aBianca@bEt si on restait ici pour la nuitⓡ Ça a l'air calme et paisible.\n@c0@"
  it: "@aBianca@bChe ne dici di restare qui stanotte?\nMi sembra un posto tranquillo...\n@c0@"
  ja: "@a@bビアンカ「今夜は　ここに泊まる？\n\tしずかに　ねむれそうよ。\n@c0@"
80:
  de: "@aNera@bEs ist ein wenig einsam, aber es kann ja nicht schaden, gelegentlich an einem solchen Ort zu übernachten.\n@c0@"
  en: "@aNera@bIt feels a bit desolate, but I suppose it can't hurt to stay over in a place like this every once in a while.\n@c0@"
  es: "@a%0%a001240@b¿Vamos a dormir aquí esta noche?\nBueno, está bien.\n@c0@"
  fr: "@aNera@bL'endroit n'est pas très réjouissant, mais ça n'est pas grave de dormir de temps à autre dans des lieux comme ici.\n@c0@"
  it: "@aNera@bNon sarà una sistemazione principesca, ma sarà sempre meglio che trascorrere la notte all'aperto.\nQui potremo riposare tranquilli...\n@c0@"
  ja: "@a@bフローラ「さびしい感じが　しますけど\n\tたまには　こういうところに泊まるのも\n\t悪くないですわ。\n@c0@"
81:
  de: "@a%0%a001240@bMöchtest du heute hier übernachten? Von... Von mir aus...\n@c0@"
  en: "@a%0%a001240@bAre we sleeping here tonight?\nI, I suppose it'll be alright.\n@c0@"
  es: "@a%0%a001250@bNo me importa dónde nos quedemos,\n¡Solo quiero una cama!\n@c0@"
  fr: "@a%0%a001240@bOn dort ici cette nuitⓡ\nCe... Ce sera très correct.\n@c0@"
  it: "@a%0%a001240@bPapà, dormiremo qui stanotte?\n@c0@"
  ja: "@a@b%a001240「今日　ここに泊まるの？\n\tこういうところって　ちょっと\n\tドキドキするよね？\n@c0@"
82:
  de: "@a%0%a001250@bMir ist es egal, wo ich schlafe. Hauptsache, ich kriege ein Bett.\n@c0@"
  en: "@a%0%a001250@bI don't care where I sleep now.\nI just want a bed!\n@c0@"
  es: "@aAlazar@b¿Aquí? ¿En serio? Vaya. Entonces mejor me olvido de cenar esta noche.\n@c0@"
  fr: "@a%0%a001250@bJe me moque de l'endroit où on dort.\nJ'ai juste envie d'un litⓠ\n@c0@"
  it: "@a%0%a001250@bNon m'importa dove dormiamo, basta che andiamo a letto subito...\nSto crollando dal sonno... Yaaawn...\n@c0@"
  ja: "@a@b%a001250「もう　どこでも　いいです。\n\tはやく　眠りたいの……。\n@c0@"
83:
  de: "@aOtto@bHier?! Meint Ihr das ernst? Na schön. Dann gibt's wohl kein Abendessen heute.\n@c0@"
  en: "@aTuppence@bHere!? Are you serious? Oh, well. No chance of a meal tonight then, I suppose.\n@c0@"
  es: "@aBianca@bMe da la sensación de que todos nos miran. Creo que nos tienen miedo, ¿sabes?\n@c0@"
  fr: "@aInnocent@bIciⓡⓐ Vous êtes sérieuxⓡ Bon... Pas de dîner ce soir, alors, je le crains.\n@c0@"
  it: "@aSimon@bMaestà, vuole pernottare qui?\nSperavo in una sistemazione più consona al mio rang...\n㈡\nEhm... Al suo rango, Sire, al suo rango...\n@c0@"
  ja: "@a@bピピン「まさか　今夜は　ここに！？\n\tうう…　今夜のごはんは\n\t期待できないぞ……。\n@c0@"
84:
  de: "@aBianca@bEs kommt mir vor, als würden alle uns anstarren. Weißt du, ich glaube, sie haben ein bisschen Angst vor uns.\n@c0@"
  en: "@aBianca@bI feel like everyone's lookin' at us. I think they're a bit scared of us, you know.\n@c0@"
  es: "@aBianca@bCreo que les asusta que %a001210 esté con nosotros después de haber destrozado sus campos.\n@c0@"
  fr: "@aBianca@bJ'ai l'impression que tout le monde nous regarde.\r\nOn doit les effrayer un peu, à mon avis.\n@c0@"
  it: "@aBianca@bMi sento addosso gli sguardi di tutti gli abitanti del posto!\nCredo che abbiano paura di noi...\n@c0@"
  ja: "@a@bビアンカ「なんか　視線を感じるわ。\n\tみんな　私たちを\n\t恐れてるみたいよ……。\n@c0@"
85:
  de: "@aBianca@bIch glaube, sie haben Angst, weil wir %a001210 bei uns haben. Schließlich war es %a001210, der ihre Felder zerwühlt hat.\n@c0@"
  en: "@aBianca@bI think they're all scared because we have %a001210 with us and he's the one who tore up their fields.\n@c0@"
  es: "@aBianca@bPero no tenía mala intención, ¿verdad? Espero que acaben por perdonarle.\n@c0@"
  fr: "@aBianca@bJe crois qu'ils ont tous peur car %a001210 nous accompagne et c'est lui qui a ravagé leurs champs.\n@c0@"
  it: "@aBianca@bProbabilmente sono spaventati perché %a001210 è con noi. Li capisco... Dopotutto, stiamo passeggiando con il ⓕmostroⓖ che ha saccheggiato il loro raccolto!\n@c0@"
  ja: "@a@bビアンカ「みんなが　恐がってるのは\n\t畑あらしをした　%a001210が\n\tいっしょに　いるからかしら……。\n@c0@"
86:
  de: "@aBianca@bAber er hat es doch nicht böse gemeint! Vielleicht nehmen sie es ihm nicht mehr übel, wenn sie das wissen.\n@c0@"
  en: "@aBianca@bBut he didn't mean to cause any harm, eh? Hopefully they'll come 'round and forgive him.\n@c0@"
  es: "@aNera@bSembra que los aldeanos nos están evitando.\n@c0@"
  fr: "@aBianca@bMais il n'avait pas l'intention de faire de mal à quiconque, n'est-ce pasⓡ J'espère qu'ils réussiront à lui pardonner.\n@c0@"
  it: "@aBianca@bSperiamo di riuscire a spiegare come stanno le cose!\nDel resto, %a001210 non ha ucciso né ferito nessuno...\n@c0@"
  ja: "@a@bビアンカ「でも　%a001210だって\n\t悪気があって　したわけじゃないのよ。\n\tどうにか　許してもらえないかしら。\n@c0@"
87:
  de: "@aNera@bIch habe das Gefühl, die Dorfbewohner weichen uns aus.\n@c0@"
  en: "@aNera@bI feel like the villagers are avoiding us.\n@c0@"
  es: "@aNera@bSupongo que están un poco resentidos porque %a001210 destrozó la sua cosecha.\n@c0@"
  fr: "@aNera@bJ'ai le sentiment que les villageois nous évitent.\n@c0@"
  it: "@aNera@bHo la nettissima sensazione che gli abitanti del villaggio non nutrano molta simpatia per noi.\n@c0@"
  ja: "@a@bフローラ「村の方たちに\n\tさけられているような　気が\n\tしますわ。\n@c0@"
88:
  de: "@aNera@bSicher nehmen sie es %a001210 übel, dass er ihre Ernte zerstört hat.\n@c0@"
  en: "@aNera@bI suppose they're feeling a bit bitter because of %a001210 destroying their crops.\n@c0@"
  es: "@aNera@bPoverino %a001210. Cuando se perdió, no pudo volver a la natura porque estaba demasiado domesticado. No podía atacar a las personas.\n@c0@"
  fr: "@aNera@bIls doivent être un peu amers. Après tout,\nc'est %a001210 qui a détruit leurs récoltes.\n@c0@"
  it: "@aNera@bImmagino che ce l'abbiano a morte con %a001210, ⓕlu mostro piecuroⓖ che ha devastato i loro campi.\nSentito? Sto imparando a parlare il loro dialetto!\n@c0@"
  ja: "@a@bフローラ「やはり　畑を荒らした\n\t%a001210さんを\n\tうらんでいるのでしょうか……。\n@c0@"
89:
  de: "@aNera@bDer arme %a001210. Als er dich verloren hatte, war er zu zahm für die Wildnis geworden. Er konnte keine Menschen mehr angreifen.\n@c0@"
  en: "@aNera@bPoor %a001210. When he lost you, he couldn't go back to the wild because he was too tame. He couldn't attack people.\n@c0@"
  es: "@aNera@bPer eso acabó destrozando sus cosechas. Algo tenía que hacer para conseguir mangiare.\n@c0@"
  fr: "@aNera@bPauvre %a001210. Quand il t'a perdu, il n'a pas pu retourner à la vie sauvage, il était trop apprivoisé.\nIl lui était impossible d'attaquer des gens.\n@c0@"
  it: "@aNera@bCredo di aver capito cosa sia successo a %a001210. Dopo la tua scomparsa, non sapeva cosa fare: era troppo docile per stare con gli altri mostri...\n@c0@"
  ja: "@a@bフローラ「%a000090さんと　出会って\n\t邪悪な心のぬけた%a001210は\n\t群れにも帰れず　人もおそえず……\n@c0@"
90:
  de: "@aNera@bUnd darum hat er stattdessen ihre Ernte zerstört, denn Irgendwie musste er schließlich etwas zu fressen auftreiben.\n@c0@"
  en: "@aNera@bSo that's why he ended up destroying their crops instead. He had to find food somehow.\n@c0@"
  es: "@a%0%a001240@bLos aldeanos nos miran mal.\nEso no me gusta.\n@c0@"
  fr: "@aNera@bC'est pour ça qu'il s'est mis à détruire les récoltes.\r\nIl fallait bien qu'il se nourrisse d'une manière ou d'une autre.\n@c0@"
  it: "@aNera@bE, nel contempo, aveva imparato a non aggredire gli esseri umani. Per questo si è limitato a rubare cibo ai contadini di Punta Campestre.\n@c0@"
  ja: "@a@bフローラ「生きるために　つい\n\t畑の作物を　食べてしまって\n\tいたのでしょうね……。\n@c0@"
91:
  de: "@a%0%a001240@bDie Dorfbewohner schauen uns so finster an. Das... Das gefällt mir gar nicht.\n@c0@"
  en: "@a%0%a001240@bThe villagers are giving us evil stares.\nI, I don't like it.\n@c0@"
  es: "@a%0%a001240@bNo son muy acogedores, ¿verdad? Y eso que venimos a decirles que sus campos van a estar bien.\n@c0@"
  fr: "@a%0%a001240@bLes villageois nous regardent d'un sale œil.\nJ-Je n'aime pas trop ça.\n@c0@"
  it: "@a%0%a001240@bNon mi piace come ci stanno guardando gli abitanti del villaggio...\nMi sembrano freddi, diffidenti... Impauriti, persino.\n@c0@"
  ja: "@a@b%a001240「村の人たちが\n\tこっちを　ジロジロ見てる。\n\t……こわいよ。\n@c0@"
92:
  de: "@a%0%a001240@bSie nehmen uns nicht gerade mit offenen Armen auf, was? Ich meine, immerhin sind wir hier, um ihnen zu sagen, dass ihre Felder von nun an sicher sind.\n@c0@"
  en: "@a%0%a001240@bThey're not being very welcoming, are they? I mean, we came to tell them their fields are going to be okay.\n@c0@"
  es: "@a%0%a001250@bQuiero volver al carromato, papi.\n@c0@"
  fr: "@a%0%a001240@bIls ne sont pas très accueillants, heinⓡ On est quand même venus leur dire que leurs champs ne seraient plus détruits.\n@c0@"
  it: "@a%0%a001240@bSinceramente, mi aspettavo un'accoglienza un po' più calorosa...\n@c0@"
  ja: "@a@b%a001240「もう　村の畑は\n\tだいじょうぶだよって\n\t教えてあげにきたのに……。\n@c0@"
93:
  de: "@a%0%a001250@bIch will zurück zum Wagen, Papa.\n@c0@"
  en: "@a%0%a001250@bI want to go back to the wagon, Dad.\n@c0@"
  es: "@aSancho@bNo me gusta nada este ambiente.\nYo, yo... ¿Qué piensas que hagamos, chamaco?\n@c0@"
  fr: "@a%0%a001250@bJe voudrais retourner dans le chariot, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, sbrighiamoci a tornare al carro...\n@c0@"
  ja: "@a@b%a001250「お父さん　わたし\n\t馬車に　もどりたい……。\n@c0@"
94:
  de: "@aSancho@bMir gefällt die Stimmung hier nisst. Iss... Iss... Was wollen wir tun, Chico?\n@c0@"
  en: "@aSancho@bI no like the atmosphere here.\nI, I... What eshould we do, friend?\n@c0@"
  es: "@aBianca@bNo tiene sentido intentar hacerle entender que %a001210 no ataca a las personas. Está demasiado histérico para prestar atención, ¿sabes?\n@c0@"
  fr: "@aSancho@bJe... Je n'aime p-pas l'atmosphère de cet endroit. Je... Qu'est-ce qu'on f-fait, chicoⓡ\n@c0@"
  it: "@aSancho@bEsta atmosfera no me gusta por nada.\n¿Que facciamo, chico?\n@c0@"
  ja: "@a@bサンチョ「なにやら　イヤな空気が\n\tただよっていますね。\n\tこういうときは…　どうしましょうか？\n@c0@"
95:
  de: "@aBianca@bEs hat gar keinen Zweck, ihm zu erklären, dass %a001210 keine Menschen angreifen würde. Er ist viel zu aufgelöst, um auf Erklärungen zu hören.\n@c0@"
  en: "@aBianca@bThere's no point tryin' to tell him %a001210 wouldn't attack people. He's in too much of a tizz to listen properly.\n@c0@"
  es: "@aNera@bNon capisco per qué las personas tienen miedo de %a001210. Es muy tranquilo y tierno.\n@c0@"
  fr: "@aBianca@bInutile d'essayer de lui expliquer que %a001210 n'attaquerait jamais un homme. Il est dans\ntous ses états, il n'écouterait rien.\n@c0@"
  it: "@aBianca@bAh, spiegargli che %a001210 non attaccherebbe mai un uomo sarebbe solo tempo sprecato!\nCon la paura che ha, non ci ascolterebbe nemmeno...\n@c0@"
  ja: "@a@bビアンカ「あの　あわてようじゃ\n\t%a001210は　人を　おそわないって\n\t言っても　聞いてくれそうにないわね。\n@c0@"
96:
  de: "@aNera@bIch verstehe nicht, warum die Leute solche Angst vor %a001210 haben. Er ist doch so lieb und ruhig.\n@c0@"
  en: "@aNera@bI can't understand why people are so afraid of %a001210. He's so quiet and sweet.\n@c0@"
  es: "@a%0%a001240@b¡Pero %a001210 nunca haría daño a un humano!\n@c0@"
  fr: "@aNera@bJe ne comprends pas pourquoi les gens sont effrayés à ce point par %a001210.\nIl est si doux et si calme.\n@c0@"
  it: "@aNera@bMa perché hanno paura di %a001210?\nÈ docile come un agnellino!\n㈡\nUhm, meglio non dirlo, altrimenti lo fanno arrosto, vista la fame che hanno da queste parti!\n@c0@"
  ja: "@a@bフローラ「%a001210ちゃんは　こんなに\n\tかわいくて　おとなしいのに…　なぜ\n\tあんなに　おびえているのかしら？\n@c0@"
97:
  de: "@a%0%a001240@bAber %a001210 würde nie einem Menschen was zuleide tun!\n@c0@"
  en: "@a%0%a001240@bBut %a001210 would never hurt a human!\n@c0@"
  es: "@a%0%a001240@bAunque dejó sus cultivos un poco revueltos, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bMais %a001210 ne ferait jamais de mal\nà un être humainⓠ\n@c0@"
  it: "@a%0%a001240@b%0%a001210 non attacca gli esseri umani!\n@c0@"
  ja: "@a@b%a001240「%a001210は　人間を\n\tおそわないのに！\n@c0@"
98:
  de: "@a%0%a001240@bAllerdings hat er ihre Felder ziemlich verwüstet, was?\n@c0@"
  en: "@a%0%a001240@bAlthough, he did make a bit of mess of their fields, didn't he?\n@c0@"
  es: "@a%0%a001250@bEstá muy arrepentido. No era su intención.\nEsta gente debería perdonarle.\n@c0@"
  fr: "@a%0%a001240@bBon, c'est sûr, il a quand même fait pas mal de dégâts dans leurs champs...\n@c0@"
  it: "@a%0%a001240@bÈ vero, ha messo a soqquadro i loro campi, ma non ha torto un capello a nessuno!\n@c0@"
  ja: "@a@b%a001240「そりゃ　この村の畑は\n\t荒らしてたみたいだけどさ。\n@c0@"
