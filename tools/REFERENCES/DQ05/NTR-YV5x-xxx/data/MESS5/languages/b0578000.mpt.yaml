  ja: "@a@b%a001250「ね？　ホントに\n\t悪い魔物さんって\n\tちょっとしか　いないのよね？\n@c0@"
319:
  de: "@aSancho@bWenn iss mit dir auf Reisen bin, Chico, dann passiert eine seltsame Sache nach der anderen. Und als iss mit Señor Ludwig unterwegs war, war es das Gleisse.\n@c0@"
