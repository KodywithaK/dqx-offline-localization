  en: "@aDebora@bI've got a feeling I saw a cave to the west of here. Maybe that's where the monster's hiding out.\n@c0@"
  es: "@aStefania@bQuizás no ataque a la gente, ma les quita la comida, y al final es lo mismo.\n@c0@"
  fr: "@aPandora@bJ'ai l'impression d'avoir vu une grotte, à l'ouest d'ici. Peut-être que c'est là que se cache le monstre.\n@c0@"
  it: "@aViola@bSe non ricordo male, a ovest di qui c'è una grotta...\nE se fosse quello il nascondiglio del mostro?\n@c0@"
  ja: "@a@bデボラ「そういえば　ここから西に\n\t洞くつが　あったような気がするわ。\n\t魔物は　そこから来ているのかもね。\n@c0@"
332:
  de: "@aGriselda@bEs greift vielleicht keine Menschen an, aber es greift ihr Essen an, und das läuft aufs Gleiche hinaus.\n@c0@"
  en: "@aDebora@bIt may not be attacking people, but it's attacking their food, which amounts to the same thing.\n@c0@"
  es: "@aStefania@b¿Ese era el famoso mostro?\nNon credo que des la talla para luchar contra él.\n@c0@"
  fr: "@aPandora@bIl n'attaque peut-être pas les gens, mais il attaque leur nourriture, ce qui revient au même.\n@c0@"
  it: "@aViola@bMagari il mostro non attacca direttamente gli esseri umani ma, rubando loro tutto il cibo, li condanna a una morte lenta e dolorosa. Il risultato non cambia...\n@c0@"
  ja: "@a@bデボラ「人は　おそわないかもしれないけれど\n\t畑を荒らして　苦しめているんだから\n\t結局　魔物は　魔物なのよね。\n@c0@"
333:
  de: "@aGriselda@bWar das etwa das berüchtigte Monster? Ich glaube ja nicht, dass du mit dem fertig wirst...\n@c0@"
