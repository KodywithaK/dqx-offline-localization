  ja: "@a@bサンチョ「坊っちゃんや　パパスさまと\n\tこうして　旅をしておりますと\n\tふしぎな体験ばかりです。\n@c0@"
320:
  de: "@aSancho@bVielleisst ist es ja Schicksal...\n@c0@"
  en: "@aSancho@bMaybe ees all destiny...\n@c0@"
  es: "@aAlazar@bAquí ya hemos acabado nuestra tarea, ¿verdad?\n¡Es la excusa perfecta para lanzar Telehuida!\n¡Vamos! ¡Telehuida! ¡Telehuida!\n@c0@"
