52:
  de: "@aNera@bWir können später noch reden. Zunächst mal solltest du den Helm aufprobieren.\n@c0@"
  en: "@aNera@bWe can talk later. First and foremost, you need to try on that helmet.\n@c0@"
  es: "@aNera@bPodemos hablar più tarde. Lo primero es probarse ese yelmo.\n@c0@"
  fr: "@aNera@bNous pourrons discuter plus tard.\r\nIl faut surtout que tu essaies ce casque.\n@c0@"
  it: "@aNera@bParleremo dopo.\nOra prova a indossare l'elmo...\n@c0@"
  ja: "@a@bフローラ「話は　後ですわ。\n\tとりあえず　そのカブトを\n\tかぶってみてくださいな。\n@c0@"
53:
  de: "@aBianca@bDie Königin schien etwas enttäuscht zu sein, nicht? Wir sollten vielleicht zu ihr gehen und mit ihr reden.\n@c0@"
  en: "@aBianca@bThe Queen seemed a bit disappointed, eh? We should probably go and have a word with her.\n@c0@"
  es: "@aBianca@bLa Reina parecía un poco decepcionada, ¿eh? Creo que deberíamos ir a hablar un momento con ella.\n@c0@"
  fr: "@aBianca@bLa reine a eu l'air un peu déçue, heinⓡ\nNous devrions peut-être aller échanger\nquelques mots avec elle.\n@c0@"
  it: "@aBianca@bLa Regina mi è sembrata molto delusa...\nCredo che dovremmo scambiare qualche perola con lei...\n@c0@"
  ja: "@a@bビアンカ「なんだか　女王さまを\n\tガッカリ　させちゃったみたいね。\n\t様子を　見に行ったほうがいいかしら。\n@c0@"
54:
  de: "@aBianca@bIch dachte beinahe schon, du wärst es, %a000090.\n@c0@"
  en: "@aBianca@bI was startin' to think that it really might be you, %a000090.\n@c0@"
  es: "@aBianca@bEstaba empezando a pensar que podías ser tú, %a000090.\n@c0@"
  fr: "@aBianca@bJe commençais vraiment à me dire que c'était\npeut-être toi, %a000090.\n@c0@"
  it: "@aBianca@bPer un attimo avevo pensato che l'Eroe Leggendario fossi tu, %a000090.\n@c0@"
  ja: "@a@bビアンカ「私　%a000090なら\n\tもしかしてって　思ってたんだけど……\n@c0@"
55:
  de: "@aBianca@bAber mit dem Zenithiaschwert kannst du dich ja auch nicht ausrüsten, also kann das nicht sein. Trotzdem finde ich, du bist etwas ganz Besonderes.\n@c0@"
  en: "@aBianca@bBut you can't equip the Zenithian Sword neither, so it can't be. Still, I do feel like there's somethin' a bit special about you.\n@c0@"
  es: "@aBianca@bPero tampoco puedes equipar la Espada de Zenithia, así que es imposible. Aunque aún tengo la sensación de que tienes algo especial, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais tu ne peux pas t'équiper de l'Épée zénithienne non plus, alors ce n'est pas possible. Cela dit, je crois toujours que tu as quelque chose d'un peu spécial.\n@c0@"
  it: "@aBianca@bEvidentemente, le cose non stanno così.\nDel resto, non puoi nemmeno impugnare la Spada Zenithiana...\n㈡\nEppure sento che in te c'è qualcosa di speciale...\n@c0@"
  ja: "@a@bビアンカ「天空のつるぎも　装備できないし\n\tやっぱり　ちがうのかな。　%a000090は\n\t特別な人って　感じがするんだけど。\n@c0@"
56:
  de: "@aNera@bIhre Majestät versucht offenbar ebenfalls, den legendären Helden zu finden. Ihre Methode ist nur ein wenig anders als unsere.\n@c0@"
  en: "@aNera@bIt seems that Her Majesty is trying to find the legendary hero too. Her method is just a bit different to ours.\n@c0@"
  es: "@aNera@bAl parecer, Su Majestad también intenta encontrar al héroe legendario. Solo que il suo método es un poco distinto del nostro.\n@c0@"
  fr: "@aNera@bIl semblerait que la reine essaie elle aussi de\r\ntrouver le héros légendaire. Sa méthode est\r\njuste un peu différente de la nôtre.\n@c0@"
  it: "@aNera@bPare proprio che anche la regina Cleo stia cercando l'Eroe Leggendario.\n㈡\nLei, però, non gira tutto il mondo per trovarlo, come facciamo noi, ma lo aspetta qui, nella comodità del suo palazzo. Mica scema, Sua Maestà!\n@c0@"
  ja: "@a@bフローラ「あの女王さまは\n\tこうして　勇者さまを\n\tさがしていらっしゃるのかしら……。\n@c0@"
57:
  de: "@aNera@bVielleicht sollten wir noch einmal mit ihr sprechen, bevor wir wieder aufbrechen, Liebling?\n@c0@"
  en: "@aNera@bPerhaps we should go and speak with her again before we leave, darling?\n@c0@"
  es: "@aNera@b¿No crees que deberíamos hablar con ella antes de partire, caro?\n@c0@"
  fr: "@aNera@bPeut-être que nous devrions retourner lui parler avant de partir, nonⓡ\n@c0@"
  it: "@aNera@bTesoro, secondo me vale la pena andare a fare quattro chiacchiere con la regina Cleo, prima di andarcene... Che ne dici?\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた。\n\tもう一度　女王さまに\n\tお話を　うかがいに行きませんこと？\n@c0@"
58:
  de: "@aBianca@bWir sollten ihr die Situation wohl lieber erklären. Man kann nie wissen. Vielleicht kann sie uns weiterhelfen.\n@c0@"
  en: "@aBianca@bI reckon we should tell her the situation. You never know. She might be able to help out.\n@c0@"
  es: "@aBianca@bCreo que deberíamos explicarle la situación. ¡Nunca se sabe, a lo mejor hasta nos puede echar una mano!\n@c0@"
  fr: "@aBianca@bJe crois qu'on devrait tout lui expliquer.\r\nOn ne sait jamais, elle pourrait peut-être nous\r\ndonner un coup de main.\n@c0@"
  it: "@aBianca@bCredo che dovremmo raccontarle come stanno le cose, senza nasconderle nulla.\nNon si sa mai, potrebbe essere in grado di aiutarci...\n@c0@"
  ja: "@a@bビアンカ「ねえ　話してみましょうよ。\n\t女王さまは　きっと　私たちの\n\tちからになってくださるわ。\n@c0@"
59:
  de: "@aNera@bDu bist sehr vorsichtig, nicht wahr, Liebling? Ich bin sicher, dass man Ihrer Majestät trauen kann.\n@c0@"
  en: "@aNera@bYou're being rather cautious aren't you, darling?\r\nI'm sure that Her Majesty can be trusted.\n@c0@"
  es: "@aNera@bEstas siendo muy cauteloso, ¿no crees, caro?\r\nEstoy segura de que podemos confiar en Su Majestad.\n@c0@"
  fr: "@aNera@bTu es plutôt sur tes gardes, hein, mon chériⓡ\nMais je suis sûre que Sa Majesté est digne\nde confiance.\n@c0@"
  it: "@aNera@bCaro, secondo me vale la pena raccontare tutto alla regina Cleo.\nSento che possiamo fidarci di lei.\n@c0@"
  ja: "@a@bフローラ「あなたって　用心深いのね。\n\tでも　アイシスさまは\n\t信頼できるお方だと　思いますわよ。\n@c0@"
60:
  de: "@aBianca@bKönig Ludwig... der mit seinem kleinen Sohn nach seiner Frau sucht... Das kann kein Zufall sein.\n@c0@"
  en: "@aBianca@bKing Pankraz... Searchin' for his wife with his infant child... That can't just be a coincidence.\n@c0@"
  es: "@aBianca@bEl rey Teudis... Buscando a su esposa con su hijo pequeño... No puede ser una simple coincidencia.\n@c0@"
  fr: "@aBianca@bLe roi Petros... parti, accompagné de son fils, à la recherche de sa femme... ça ne peut pas être une simple coïncidence.\n@c0@"
  it: "@aBianca@bRe Russel, che gira il mondo con suo figlio piccolo, alla ricerca della moglie scomparsa...\nNo, questa non può essere una semplice coincidenza.\n@c0@"
  ja: "@a@bビアンカ「パパス王…　王妃を助けるため\n\t子供を連れての旅……。\n\tぐうぜんとは　思えない話ね。\n@c0@"
61:
  de: "@aNera@bDas klingt ganz nach dir und deinem Vater. Glaubst du, du bist womöglich ein Prinz?\n@c0@"
  en: "@aNera@bThat sounds just like you and your father.\r\nDo you think you could be a prince?\n@c0@"
  es: "@aNera@bEso parece la storia de tu padre y tú.\r\n¿Crees que puedes ser un príncipe?\n@c0@"
  fr: "@aNera@bCette histoire ressemble à la tienne. Tu crois qu'il est possible que tu sois un princeⓡ\n@c0@"
  it: "@aNera@bMi ricorda tanto la storia tua e di tuo padre...\nMa allora sei un principe, %a000090?\n@c0@"
  ja: "@a@bフローラ「あなたの　おいたちに\n\tそっくりですわね。\n\tあなたって　王子さま　なのかしら？\n@c0@"
62:
  de: "@aBianca@bWir sollten nach Humburg im Osten reisen und der Sache auf den Grund gehen.\n@c0@"
  en: "@aBianca@bWe should head off to that Gotha place in the east and see what it's all about.\n@c0@"
  es: "@aBianca@bDeberíamos ir a ese sitio, Pankraz, al este, a ver de qué va todo esto, ¿sabes?\n@c0@"
  fr: "@aBianca@bNous devrions nous rendre à Gotha, à l'est,\r\net voir de quoi il retourne.\n@c0@"
  it: "@aBianca@b%0%a000090, dirigiamoci a est, verso il Regno di Denim. Chissà che lì non riusciamo a trovare qualche informazione utile...\n@c0@"
  ja: "@a@bビアンカ「とにかく　その　東の国\n\tグランバニアへ　行ってみましょう。\n@c0@"
63:
  de: "@aNera@bDas Königreich Humburg im Osten... Wenn wir dort hingingen, könnten wir vermutlich alles Mögliche herausfinden.\n@c0@"
  en: "@aNera@bThe eastern kingdom of Gotha... We could probably find out all kinds of things if we went there.\n@c0@"
  es: "@aNera@bEl reino oriental de Pankraz... Un viaggio allí nos revelaría numerosos datos.\n@c0@"
  fr: "@aNera@bLe royaume de Gotha, à l'est... Nous pourrions sans doute y trouver bon nombre de renseignements.\n@c0@"
  it: "@aNera@bIl Regno di Denim, a est.\nQuella sarà la nostra prossima destinazione, %a000090.\n㈡\nSono certa che lì troveremo le risposte a tutte le nostre domande!\n@c0@"
  ja: "@a@bフローラ「東の国　グランバニア……。\n\t行けば　いろいろなことが\n\tわかりそうですわね。\n@c0@"
64:
  de: "@aBianca@bIch dachte, es wäre immer noch glühend heiß, aber nachts kann es in der Wüste ziemlich kalt werden, findest du nicht?\n@c0@"
  en: "@aBianca@bI thought it'd still be boilin' hot, but it gets pretty cold in the desert of a night, eh?\n@c0@"
  es: "@aBianca@bPensaba que todavía haría un calor que te mueres, pero parece que de noche refresca en el desierto, ¿eh?\n@c0@"
  fr: "@aBianca@bJe pensais qu'il ferait toujours une chaleur étouffante, mais l'air est plutôt froid la nuit,\r\ndans le désert.\n@c0@"
  it: "@aBianca@bIl deserto è molto freddo di notte, eh?\nPare quasi incredibile che di giorno faccia un caldo bestiale!\n@c0@"
  ja: "@a@bビアンカ「暑いかと思っていたけど\n\t砂漠って　夜は　こんなに\n\t冷えこむのね。\n@c0@"
65:
  de: "@aNera@bEs ist nachts so still in der Wüste. Es ist, als wären wir in eine ganz lautlose Welt geraten.\n@c0@"
  en: "@aNera@bIt's so quiet in the desert at night. It feels like we've entered a world devoid of all sound.\n@c0@"
  es: "@aNera@bEl deserto es tan silencioso de noche... Es como entrar en un mondo desprovisto en absoluto de sonido.\n@c0@"
  fr: "@aNera@bLe désert est si calme, la nuit. On a l'impression d'entrer dans un monde où il n'y a aucun bruit.\n@c0@"
  it: "@aNera@bDi notte il deserto è incredibilmente silenzioso.\nSembra un luogo totalmente privo di vita...\n@c0@"
  ja: "@a@bフローラ「砂漠の夜って　静かですのね。\n\tまるで　音のない世界に\n\t入りこんだかのようですわ。\n@c0@"
66:
  de: "@aBianca@bOffenbar kommen wir nachts nicht in das Schloss hinein. Vielleicht sollten wir lieber irgendwo übernachten.\n@c0@"
  en: "@aBianca@bLooks like we can't get inside the castle of a night.\r\nWe should probably get some shut-eye anyway.\n@c0@"
  es: "@aBianca@bParece que no vamos a poder entrar en el castillo de noche. No estaría mal echar una cabezadita, ¿sabes?\n@c0@"
  fr: "@aBianca@bApparemment, on n'a pas le droit d'entrer dans le château la nuit. Quoi qu'il en soit, on devrait\r\npeut-être faire un petit somme.\n@c0@"
  it: "@aBianca@bUhm, di notte non lasciano entrare visitatori al castello... Che ne diresti di andare a dormire?\nTorneremo qui domattina.\n@c0@"
  ja: "@a@bビアンカ「夜は　お城に入れないのね。\n\t今夜は　もう休みましょうよ。\n@c0@"
67:
  de: "@aNera@bWenn sie uns nicht ins Schloss lassen, können wir nicht viel dagegen tun. Wir sollten vermutlich irgendwo übernachten.\n@c0@"
  en: "@aNera@bIf they won't let us inside the castle, there's not much we can do. We should probably rest for\r\nthe night.\n@c0@"
  es: "@aNera@bSi no nos permiten entrar en il castello, no podemos hacer nada más. Será mejor que descansemos.\n@c0@"
  fr: "@aNera@bS'ils ne nous laissent pas entrer dans le château,\r\nil n'y a pas grand-chose d'autre à faire que d'aller se reposer.\n@c0@"
  it: "@aNera@bSe non possiamo entrare al castello, direi che non ci resta altro da fare che trovare un posto dove trascorrere la notte...\n@c0@"
  ja: "@a@bフローラ「お城に　入れないのでは\n\tしかたないですわ。\n\t私たちも　今夜は　休みましょうか。\n@c0@"
68:
  de: "@aBianca@bIch fühle mich tatsächlich ein wenig fiebrig. Vielleicht habe ich mich erkältet.\n@c0@"
  en: "@aBianca@bI do feel pretty feverish at the minute. Maybe I've gone and caught a cold.\n@c0@"
  es: "@aBianca@bMe encuentro mal, como si tuviese fiebre. A lo mejor he pillado un resfriado, ¿sabes?\n@c0@"
  fr: "@aBianca@bPuisqu'on en parle, je me sens un peu fiévreuse.\r\nJ'ai peut-être pris froid.\n@c0@"
  it: "@aBianca@bIl raffreddore è proprio l'ultima cosa di cui avrei bisogno!\r\nSpero proprio di non prendermi un'infreddatura...\n@c0@"
  ja: "@a@bビアンカ「最近　私　ちょっと\n\t熱っぽい気がするのよね。\n\tカゼひいちゃったかな……。\n@c0@"
69:
  de: "@aNera@bHatschi!\n@c0@"
  en: "@aNera@bAtchoo!\n@c0@"
  es: "@aNera@b¡Atchísss!\n@c0@"
  fr: "@aNera@bAtchoumⓠ\n@c0@"
  it: "@aNera@bEtcì!\n@c0@"
  ja: "@a@bフローラ「ハックション！\n@c0@"
70:
  de: "@aNera@bBrr. Mir ist tatsächlich schon die ganzen letzten Tage ein wenig fröstelig. \n@c0@"
  en: "@aNera@bBrrr. I have been feeling a bit of a chill these last few days, actually.\n@c0@"
  es: "@aNera@bBrrr... La verità es que he pasado un poco de frío estos últimos días.\n@c0@"
  fr: "@aNera@bBrrr. En fait, j'ai des frissons depuis\r\nquelques jours.\n@c0@"
  it: "@aNera@bTroppo tardi...\nTemo di essermelo già buscato...\n@c0@"
  ja: "@a@bフローラ「いやですわ。\n\t最近　どうも　寒気がしますの。\n@c0@"
71:
  de: "@aBianca@bEs klingt tatsächlich so, als warten sie schon seit einer ganzen Weile, nicht? Vielleicht zeigt sich der legendäre Held gar nicht mehr zu unseren Lebzeiten.\n@c0@"
  en: "@aBianca@bSounds like they've bin waitin' a pretty long time, eh? I s'pose it's possible that the legendary hero won't show his face durin' our lifetimes.\n@c0@"
  es: "@aBianca@bParece que han estado un montón de tiempo esperando, ¿eh? Supongo que el héroe legendario podría no asomar la nariz en toda nuestra vida.\n@c0@"
  fr: "@aBianca@bIl semblerait qu'ils attendent depuis un bon bout de temps, heinⓡ Si ça se trouve, le héros légendaire\nne réapparaîtra pas de notre vivant.\n@c0@"
  it: "@aBianca@bChissà da quanto tempo attendono l'arrivo dell'Eroe Leggendario...\nBeh, speriamo di trovarlo in fretta...\n@c0@"
  ja: "@a@bビアンカ「もう何百年も　待ってるなんて。\n\t私たちが　生きている間に\n\t勇者は　現れてくれるのかしら……。\n@c0@"
72:
  de: "@aNera@bSo viele Menschen erwarten ihn voller Sehnsucht, und doch ist er noch nicht erschienen. Vielleicht steht es um die Welt doch noch nicht gar so schlimm.\n@c0@"
  en: "@aNera@bSo many people are waiting desperately for him, and yet still he doesn't appear. Maybe that means the world isn't in such bad shape after all.\n@c0@"
  es: "@aNera@bTantas personas desesperadas aguardándole, y aún así no aparece. Quizá eso signifique que il mondo no está en tan mala situazione.\n@c0@"
  fr: "@aNera@bIl y a tant de gens qui attendent désespérément\r\nson retour... et malgré tout, il ne vient pas. Peut-être que le monde ne va pas si mal, après tout.\n@c0@"
  it: "@aNera@bSe l'Eroe Leggendario non s'è fatto vedere, vuol dire che il mondo non è in pericolo, esatto?\nForse è un bene che non sia ancora tornato tra noi...\n@c0@"
  ja: "@a@bフローラ「これほど　望まれているのに\n\t勇者さまが　現れないなんて。\n\tまだ　世界は大丈夫ということなの？\n@c0@"
73:
  de: "@aBianca@bEs ist recht kühl. Noch ein, zwei Kleidungsschichten wären jetzt nicht verkehrt.\n@c0@"
  en: "@aBianca@bIt is pretty chilly. Another layer or two definitely wouldn't hurt.\n@c0@"
  es: "@aBianca@bHace un poco de frío. Una o dos capas más de ropa no estarían de más, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai qu'il fait froid. Une couche ou deux\r\nen plus ne seraient pas superflues.\n@c0@"
  it: "@aBianca@bCon il freddo che fa, non si può andare in giro vestiti leggeri!\n@c0@"
  ja: "@a@bビアンカ「たしかに　もう１枚\n\t着たくなるような　寒さよね。\n@c0@"
74:
  de: "@aNera@bMir ist selbst ein wenig kühl, muss ich sagen.\n@c0@"
  en: "@aNera@bI'm feeling a bit cold now myself, I must say.\n@c0@"
  es: "@aNera@bA decir verità, tengo un poco de frío.\n@c0@"
  fr: "@aNera@bJe dois dire que moi aussi, j'ai un peu froid, maintenant.\n@c0@"
  it: "@aNera@bAnch'io ho freddo, eppure pensavo di essermi coperta a sufficienza...\n@c0@"
  ja: "@a@bフローラ「私も　少し　身体が\n\t冷えてきてしまいましたわ。\n@c0@"
75:
  de: "@aBianca@bSteine in Form einer Rose? Das klingt merkwürdig. Wenn's geht, sollten wir versuchen, so eine zu finden.\n@c0@"
  en: "@aBianca@bRocks in the shape of a rose? That sounds weird. We'll have to have a look for one of those if we get the chance.\n@c0@"
  es: "@aBianca@b¿Piedras con forma de rosa? ¡Qué cosa más rara! Si tenemos ocasión deberíamos buscar una de esas, ¿sabes?\n@c0@"
  fr: "@aBianca@bDes pierres en forme de rosesⓡ Ça m'a l'air bizarre. On devrait essayer d'en trouver une, à l'occasion.\n@c0@"
  it: "@aBianca@bRocce a forma di rosa?\nDevono essere bellissimie! Mi piacerebbe trovarne una, sai?\n@c0@"
  ja: "@a@bビアンカ「バラの形をした石なんて\n\tふしぎよね。　時間があったら\n\tさがしてみましょうよ。\n@c0@"
76:
  de: "@aNera@bIch habe schon einmal eine gesehen. Das sind wirklich merkwürdige Dinger.\n@c0@"
  en: "@aNera@bI've seen one of those before.\r\nThey really are curious things.\n@c0@"
  es: "@aNera@bLas he visto antes.\r\nSon objetos molto curiosi.\n@c0@"
  fr: "@aNera@bJ'en ai déjà vu. Ce sont vraiment de\r\ndrôles de pierres.\n@c0@"
  it: "@aNera@bSì, una volta ho visto una rosa del deserto.\nÈ un oggetto davvero particolare...\n@c0@"
  ja: "@a@bフローラ「私も　以前見かけたことが\n\tありますけど…　それはもう\n\t神秘的な石でしたわ。\n@c0@"
77:
  de: "@aBianca@bUns kann er nichts vormachen, was? Es ist doch ganz klar, dass er ganz krank ist vor Sorge um sie.\n@c0@"
  en: "@aBianca@bHe can't fool us, eh? It's pretty obvious how worried he is about her.\n@c0@"
  es: "@aBianca@bNo puede engañarnos, ¿eh? Está claro que está preocupado por ella.\n@c0@"
  fr: "@aBianca@bOn ne nous la fait pas à nous, heinⓡ\nÇa saute aux yeux qu'il s'inquiète pour sa fille.\n@c0@"
  it: "@aBianca@bPuò fare la faccia feroce quanto gli pare, ma gli leggo negli occhi che muore dalla voglia di avere notizie di sua figlia.\n@c0@"
  ja: "@a@bビアンカ「あの人　ムリしちゃって。\n\t心配してるのが　みえみえよね。\n@c0@"
78:
  de: "@aNera@bMit der Zeit wird die Kluft zwischen ihnen sicher verschwinden. Eltern und Kinder können einander nicht ewig böse sein.\n@c0@"
  en: "@aNera@bI'm sure time will heal this rift between them eventually. A parent and child can't stay angry\r\nat each other forever.\n@c0@"
  es: "@aNera@bEstoy segura de que il tempo acabará por curar este distanciamiento entre ellos. Un enfado entre padre e hija no puede durar eternamente.\n@c0@"
  fr: "@aNera@bJe suis sûre que le temps finira par combler cet abîme qui les sépare. Un parent et son enfant ne peuvent pas rester fâchés éternellement.\n@c0@"
  it: "@aNera@bMi spiace per quell'uomo.\r\nSono certa che riuscirebbe a recuperare il rapporto con sua figlia, se solo fosse meno orgoglioso...\n@c0@"
  ja: "@a@bフローラ「親子の問題なら\n\tいつか　きっと　時間が\n\t解決してくれるはずですわ。\n@c0@"
79:
  de: "@aBianca@bJa, ich hatte schon davon gehört, wie heiß es hier am Tag ist und wie kalt es nachts werden kann, aber so schlimm hätte ich es mir nicht vorgestellt.\n@c0@"
  en: "@aBianca@bYeah, I'd heard about how hot it gets in the day and how cold it gets at night, but I still never imagined it'd be this bad.\n@c0@"
  es: "@aBianca@bSí, había oído por ahí que hacía mucho calor de día y mucho frío de noche, pero no pensaba que fuese tanto...\n@c0@"
  fr: "@aBianca@bOui, j'avais déjà entendu dire combien il faisait chaud le jour et froid la nuit, mais je ne pensais\r\npas que c'était à ce point-là.\n@c0@"
  it: "@aBianca@bHa ragione.\nIo non riuscirei a restare qui più di qualche giorno...\n@c0@"
  ja: "@a@bビアンカ「私も　昼の暑さや\n\t夜の寒さを　聞いてはいたけど\n\tここまでとは　思わなかったわ。\n@c0@"
80:
  de: "@aNera@bVermutlich kann sich der Körper im Laufe der Zeit an alle möglichen seltsamen Klimaverhältnisse gewöhnen.\n@c0@"
  en: "@aNera@bYour body can probably become accustomed to living in all kinds of strange climates, given enough time.\n@c0@"
  es: "@aNera@bVeramente, el cuerpo, con tempo suficiente, probablemente puede acostumbrarse a vivir en toda clase de climas, por extraños que sean.\n@c0@"
  fr: "@aNera@bAvec le temps, le corps doit pouvoir s'habituer\r\nà toutes sortes de climats.\n@c0@"
  it: "@aNera@bMa no, abitare nel deserto non dev'essere poi tanto male... Secondo me è tutta questione di abitudine.\n㈡\nIo, però, preferisco il clima temperato di Mostroferrato!\n@c0@"
  ja: "@a@bフローラ「どんなところでも\n\t住めば　身体が\n\tなれてゆくのかも知れませんわね。\n@c0@"
81:
  de: "@aBianca@bDieser Kerl denkt offenbar selbst im Schlaf noch an den legendären Helden!\n@c0@"
  en: "@aBianca@bLooks like that bloke has the hero on his mind constantly, even when he's asleep!\n@c0@"
  es: "@aBianca@b¡Parece que ese tipo está siempre pensando en el héroe!, hasta cuando duerme\n@c0@"
  fr: "@aBianca@bOn dirait que ce type est constamment obsédé par le héros légendaire... même dans son sommeilⓠ\n@c0@"
  it: "@aBianca@bQuel tipo non riesce a togliersi dalla mente l'Eroe Leggendario nemmeno quando dorme, eh?\nÈ proprio un chiodo fisso!\n@c0@"
  ja: "@a@bビアンカ「あの人は　寝ても覚めても\n\t勇者のことを　考えているのね。\n@c0@"
82:
  de: "@aNera@bWir können nur hoffen, dass der verzweifelte Wunsch dieser Menschen, den legendären Helden zu sehen, ihn erreicht, so dass er sich endlich zeigt.\n@c0@"
  en: "@aNera@bWe can only hope that the desperation of the people here to see the legendary hero will call out to him and prompt him to show his face.\n@c0@"
  es: "@aNera@bNo podemos más que esperar que la disperazione de estas personas por ver al héroe legendario actúe como reclamo para que aparezca.\n@c0@"
  fr: "@aNera@bIl ne reste plus qu'à espérer que le héros légendaire entendra le désespoir de tous ces gens qui l'attendent et qu'il pointera le bout de son nez.\n@c0@"
  it: "@aNera@bSarebbe bello se l'Eroe Leggendario fosse colpito dalla devozione di queste persone e decidesse di mostrarsi a loro...\n@c0@"
  ja: "@a@bフローラ「この国の方々の　想いが\n\t早く　勇者さまに\n\t伝わるといいですわね。\n@c0@"
83:
  de: "@aGriselda@bIch hab die Nase voll von all dem wirbelnden Sand hier! Er ist einfach überall! In meinem Haar und ⓚⓛ schau mal, sogar in meinen Kleidern!\n@c0@"
  en: "@aDebora@bI'm sick of all this sand swirling about the place!\nIt's all over my hair and ⓚⓛ look ⓚⓛ it's even got inside my clothes somehow!\n@c0@"
  es: "@aStefania@b¡Estoy ya cansada de tanta arena!\r\nLa tengo por todo el capello y... ¡Pero si hasta se me ha metido por dentro de la ropa!\n@c0@"
  fr: "@aPandora@bJ'en ai marre de tout ce sable qui tourbillonne partoutⓠ J'en ai plein les cheveux et regarde,\nil en est même rentré dans mes vêtementsⓠ\n@c0@"
  it: "@aViola@bNe ho abbastanza di questa sabbia! Mi sta rovinando il trucco, i capelli! Si infila nelle scarpe, nei vestiti, dappertutto! Argh! Non ne posso più!\n@c0@"
  ja: "@a@bデボラ「もう　なんなのよ　この砂嵐！\n\t見てよ　かみの毛だけじゃなくて\n\t服の中まで　砂だらけになっちゃったわ。\n@c0@"
84:
  de: "@aGriselda@bDu wolltest doch unbedingt herkommen! Dann besorg uns wenigstens eine anständige Übernachtungsmöglichkeit.\n@c0@"
  en: "@aDebora@bYou're the one who said we should come here, so you'd better hurry up and fix this by finding us somewhere decent to stay the night.\n@c0@"
  es: "@aStefania@bFuiste tú quien quería venir aquí, así que ya vas presto a buscarnos un sitio decente para pasar la notte, o si no...\n@c0@"
  fr: "@aPandora@bC'est toi qui as dit qu'on devait venir ici, alors tu as intérêt à te dépêcher d'arranger les choses et à nous trouver un endroit décent où passer la nuit.\n@c0@"
  it: "@aViola@bL'idea di venire qui è stata tua, quindi sbrigati a trovare un posto decente dove possiamo trascorrere la notte.\n@c0@"
  ja: "@a@bデボラ「ここへ来たい　って言ったのは\n\t%a000090なんだから　グズグズしてないで\n\tはやく今日の宿を探してよ。\n@c0@"
85:
  de: "@aGriselda@bAber mit Badewanne, verstanden?\n@c0@"
  en: "@aDebora@bAnd it'd better have a bath too. Got it?\n@c0@"
  es: "@aStefania@b¡Y que tenga baño! ¿Capisci?\n@c0@"
  fr: "@aPandora@bEt il vaudrait mieux pour toi que je puisse\ny prendre un bain, comprisⓡ\n@c0@"
  it: "@aViola@bE assicurati che abbia anche una vasca da bagno, perché ho bisogno di darmi una rinfrescata e di rimettermi in ordine!\n@c0@"
  ja: "@a@bデボラ「当然　お風呂つきの所よ？\n\tわかっているでしょうけど。\n@c0@"
86:
  de: "@aGriselda@bWie albern von Papa, uns bis hierher einen Boten nachzuschicken! Er hängt wirklich sehr an mir, weißt du.\n@c0@"
  en: "@aDebora@bHow ridiculous of Papa to send a messenger all this way! He really is besotted with me, you know.\n@c0@"
  es: "@aStefania@b¡Qué ridículo que il mio papino mandara a un mesajero hasta aquí! Es que se le cae la baba conmigo.\n@c0@"
  fr: "@aPandora@bC'est vraiment ridicule de la part de papa d'avoir envoyé un messager jusqu'iciⓠ\nIl m'adore vraiment, tu sais.\n@c0@"
  it: "@aViola@bIl mio paparino non finisce mai di stupirmi. Adesso ha persino mandato un suo uomo di fiducia qui per farmi sentire la sua vicinanza! Che caro che è...\n㈡\nMa non azzardarti a dirgli che ho avuto delle parole gentili per lui! Non voglio compromettere la mia immagine di donna dura e insensibile!\n@c0@"
  ja: "@a@bデボラ「もう　パパったら\n\tこんな所にまで　使者をよこして…\n\t本当に　私がかわいくてたまらないのね。\n@c0@"
87:
  de: "@aGriselda@bDann hat mir Papa also etwas Taschengeld geschickt. Tja, es kann nicht schaden, es anzunehmen. Aber du kannst dich drum kümmern, %a000090.\n@c0@"
  en: "@aDebora@bSo Papa sent me some pocket money. Well, I suppose it can't hurt to accept it. You can take care of it, though, %a000090.\n@c0@"
  es: "@aStefania@bAsí que il mio papino me manda dinero. Va bene, no me cuesta nada aceptar. Pero encárgate tú, %a000090.\n@c0@"
  fr: "@aPandora@bAlors comme ça, papa m'a envoyé de l'argent de pocheⓡ Bon, il n'y a pas de mal à accepter.\nMais c'est toi qui va t'occuper de ça, %a000090.\n@c0@"
  it: "@aViola@bIl mio paparino ci ha mandato dei soldi.\nBeh, qualche spicciolo in più ci farà comodo...\n㈡\nTu occupati di portare il denaro, %a000090.\nIo penserò a spenderlo...\n@c0@"
  ja: "@a@bデボラ「おこづかいを　送ってくれたのね。\n\tお金は　いくらあってもジャマにならないし\n\t%a000090が　持っておいて。\n@c0@"
88:
  de: "@aGriselda@bSo ein Trottel, ohne genug Wasser in der Wüste herumzuwandern. Aber wenn wir ihn hier liegen lassen, kriege ich sicher kein Auge zu. Hilf ihm lieber.\n@c0@"
  en: "@aDebora@bWhat a fool, travelling in the desert without enough water. I won't be able to sleep well if we just leave him, though, so you'd better help him out.\n@c0@"
  es: "@aStefania@bQué stolto, viajar por el desierto sin agua suficiente. Pero si lo dejamos no podré dormire, así que será mejor echarle una mano.\n@c0@"
  fr: "@aPandora@bQuel crétin. Voyager dans le désert sans avoir assez d'eau... Mais si on le laisse là, je n'arriverai pas à dormir tranquille. Tu ferais mieux de l'aider.\n@c0@"
  it: "@aViola@bBisogna essere proprio furbi, a girare per il deserto senz'acqua a sufficienza. Non se lo meriterebbe, ma cerchiamo di dare una mano a quest'intelligentone...\n@c0@"
  ja: "@a@bデボラ「水も持たずに　砂漠を旅するだなんて\n\tどうしようもないわね。　見捨てるのも\n\t寝覚めが悪いし　助けてあげなさいよ。\n@c0@"
89:
  de: "@aGriselda@bFrechheit ⓚⓛ uns Geld abknöpfen zu wollen, obwohl wir ihn vor dem sicheren Tod bewahrt haben! Aber solche Leute bringen's weit.\n@c0@"
  en: "@aDebora@bThe cheek of him, trying to make money out of the people who saved him from the brink of death!\r\nStill, it's his sort who do well in this world.\n@c0@"
  es: "@aStefania@b¡Pero qué desvergüenza, intentar sacar dinero a los que le salvaron la vita!\r\nAunque es la gente così la que prospera en este mundo.\n@c0@"
  fr: "@aPandora@bIl est sacrément gonflé d'essayer de se faire\nde l'argent avec les gens qui l'ont sauvé\nd'une mort certaineⓠ\n㈡\nN'empêche, ce sont les gens comme lui\nqui réussissent en ce monde.\n@c0@"
  it: "@aViola@bNon vorrà mica venderci qualcosa?! Se ci provasse, dovrebbe almeno farci un sostanzioso sconto, considerando che gli abbiamo appena salvato la vita!\n@c0@"
  ja: "@a@bデボラ「命の恩人に　商売をするだなんて\n\tいい度胸を　しているわね　このおじさん。\n\tでも　こういうタイプが　成功するのよね。\n@c0@"
90:
  de: "@aGriselda@bEs ist viel zu heiß für eine Schatzsuche, Hut hin oder her.\n@c0@"
  en: "@aDebora@bIt's far too hot for treasure hunting, hat or no hat.\n@c0@"
  es: "@aStefania@bHace demasiado calor para buscar ricchezzas, con sombrero o sin él.\n@c0@"
  fr: "@aPandora@bIl fait bien trop chaud pour une chasse au trésor, chapeau ou pas.\n@c0@"
  it: "@aViola@bCappello o non cappello, fa troppo caldo per andarsene in giro a caccia di oggetti particolari.\n@c0@"
  ja: "@a@bデボラ「たとえ　ぼうしを　かぶっていても\n\tこの日差しの中で　さがし物をするなんて\n\tじょうだんじゃないわ。\n@c0@"
91:
  de: "@aGriselda@bWenn du losziehen willst, %a000090, dann bitte ohne mich.\n@c0@"
  en: "@aDebora@bIf you want to go off and do it, %a000090, you can go on your own.\n@c0@"
  es: "@aStefania@bSi tú quieres ir, %a000090, te vas solito.\n@c0@"
  fr: "@aPandora@bSi tu veux partir pour tenter ta chance, %a000090, tu peux y aller tout seul.\n@c0@"
  it: "@aViola@b%0%a000090, non mi dirai che anche tu vuoi metterti a cercare rose con questo clima infame...?\n@c0@"
  ja: "@a@bデボラ「あ　%a000090。\n\tもし　やりたいと思ったのなら\n\tあんただけで　行ってきなさいよ。\n@c0@"
92:
  de: "@aGriselda@bPapa hat mir vor Ewigkeiten mal so eine gezeigt. Sie sind wirklich hübsch.\n@c0@"
  en: "@aDebora@bPapa showed me one of those ages ago.\nThey're quite pretty, actually.\n@c0@"
  es: "@aStefania@bIl mio papino me enseñó una hace tiempo. Son preciosas.\n@c0@"
  fr: "@aPandora@bPapa m'en a montré une un jour, il y a très longtemps. C'est assez joli, en fait.\n@c0@"
  it: "@aViola@bUna volta il mio paparino mi ha mostrato una rosa del deserto.\nSono oggetti molto carini.\n@c0@"
  ja: "@a@bデボラ「昔　パパに\n\t見せてもらったことがあるけど\n\tけっこう　ステキな石だったわよ。\n@c0@"
93:
  de: "@aGriselda@bDu könntest versuchen, eine für mich zu finden, wenn du magst. Aber ich warte hier. Ich will keinen Sonnenbrand riskieren.\n@c0@"
  en: "@aDebora@bYou could try to find one for me if you like. I'll wait here, though. I don't want to risk getting sunburnt.\n@c0@"
  es: "@aStefania@bTe convendría encontrarme una. Ma yo te espero aquí, no quiero acabar bruciata con el sole.\n@c0@"
  fr: "@aPandora@bTu pourrais essayer d'en trouver une pour moi,\r\nsi tu voulais. Mais je t'attendrai ici. Je ne veux\r\npas risquer un coup de soleil.\n@c0@"
  it: "@aViola@bSe proprio vuoi trovarne qualcuna, ti do il permesso di andare a cercarle. Io resterò qui a riposare, così non mi prenderò un'insolazione.\n@c0@"
  ja: "@a@bデボラ「気が向いたら　探してみるといいわ。\n\tあ　私は　日焼けするのがイヤだから\n\t町の中で待っているわね。\n@c0@"
94:
  de: "@aGriselda@bIch hab mich manchmal mit Mama und Papa so gestritten, dass ich's zu Hause nicht mehr ausgehalten hab. Dann bin ich zu Lothar getürmt.\n@c0@"
  en: "@aDebora@bI've had a few rows with Mama and Papa in the past where I ended up leaving home. I always just went and hid at Crispin's for a while.\n@c0@"
  es: "@aStefania@bAlgunas veces me enfadaba tanto con il mio papino y la mamma que me iba de casa. Siempre me escondía donde Crispín.\n@c0@"
  fr: "@aPandora@bAutrefois, j'ai eu quelques disputes avec papa et mamma au cours desquelles j'ai fini par claquer\nla porte de la maison.\n㈡\nEn fait, j'allais juste me cacher chez Gaëtan\npendant un moment.\n@c0@"
  it: "@aViola@bDa piccola litigavo spesso con i miei genitori e, quando le discussioni si facevano roventi, scappavo a casa di quel mollaccione di Candido.\n㈡\nTornavo da mamma e papà dopo qualche ora, dopo aver dato loro il tempo di capire che a discutere con me c'è solo da rimetterci...\n@c0@"
  ja: "@a@bデボラ「私も　しょっちゅう\n\tパパやママとケンカして　家出をしては\n\tアンディの家に　かくれていたわよ。\n@c0@"
95:
  de: "@aGriselda@bBei all dem Gerede von dem legendären Helden glaube ich allmählich, dass es ihn wirklich mal gegeben hat.\n@c0@"
  en: "@aDebora@bThere's so much talk of the legendary hero.\r\nI'm starting to believe that he really did exist once upon a time.\n@c0@"
  es: "@aStefania@bSe habla mucho del héroe legendario.\r\nEmpiezo a pensar que existió de verità.\n@c0@"
  fr: "@aPandora@bLes gens parlent vraiment beaucoup du héros légendaire. Je commence à croire qu'il a vraiment existé dans des temps très anciens.\n@c0@"
  it: "@aViola@bChissà, forse l'Eroe Leggendario è esistito davvero, e ha lasciato una traccia del suo passaggio in quest'area...\n@c0@"
  ja: "@a@bデボラ「ここまでたくさん　勇者の話が\n\t残されているっということは　やっぱり昔\n\t勇者は　本当に　いたのかもしれないわね。\n@c0@"
96:
  de: "@aGriselda@bEin legendärer Held, ein Großmeister der Unterwelt, ein Land namens Zenithia... Bist du sicher, dass das nicht bloß ein Märchen ist?\n@c0@"
  en: "@aDebora@bA legendary hero, a Grandmaster of the Underworld, a land called Zenithia...\r\nAre you sure this isn't just a faerie tale?\n@c0@"
  es: "@aStefania@bUn héroe legendario, un gran maestro del Inframundo, un sitio llamado Zenithia...\r\nVeramente, suena como un cuento de hadas...\n@c0@"
  fr: "@aPandora@bUn héros légendaire, un Grand Maître des Enfers, une terre appelée Zénithia... Tu es sûr que tout ça n'est pas juste un conte de féesⓡ\n@c0@"
  it: "@aViola@bL'Eroe Leggendario, Zenithia...\nNon so se credere davvero alla loro esistenza o pensare che si tratti solo di fantasie...\n@c0@"
  ja: "@a@bデボラ「勇者に　大魔王に　天空人……\n\tこれって　本当におとぎ話じゃないのよね？\n@c0@"
97:
  de: "@aGriselda@bEs ist schön, es zum Unterschied mal wieder behaglich zu haben. Die Hitze hier in der Gegend wird mir einfach zu viel.\n@c0@"
  en: "@aDebora@bIt's nice to finally be somewhere comfortable again.\r\nI really can't stand the heat around here.\n@c0@"
  es: "@aStefania@bMenos mal que te has dado prisa en encontrar un sitio cómodo per me.\r\nNo soporto este calor.\n@c0@"
  fr: "@aPandora@bC'est agréable de se retrouver enfin dans un lieu confortable. Je ne supporte vraiment pas la\r\nchaleur d'ici.\n@c0@"
  it: "@aViola@bOh, finalmente un luogo fresco!\nNon ne potevo più di sabbie roventi e caldo soffocante!\n@c0@"
  ja: "@a@bデボラ「ようやく　まともな所に\n\t来られたみたいね。\n\tあの暑さは　本当にたまらなかったのよ。\n@c0@"
98:
  de: "@aGriselda@bDann hat unsere Reise hierher uns nichts gebracht als die Erkenntnis, dass er tatsächlich gelebt hat. Hmpf! Wo er jetzt ist, will ich wissen!\n@c0@"
  en: "@aDebora@bSo all we've established by coming here is that the legendary hero really existed. Huh! I want to know where he is now!\n@c0@"
  es: "@aStefania@bAsí que viniendo aquí solo hemos sacado en claro que el héroe legendario existió. ¡Bah! ¡Lo que quiero saber es dove está!\n@c0@"
  fr: "@aPandora@bAlors tout ce qu'on a établi en venant ici, c'est que le héros légendaire existait vraiment. Pfffⓠ Moi, ce que je veux, c'est savoir où il se trouve en ce moment.\n@c0@"
  it: "@aViola@bOra che abbiamo appurato che l'Eroe Leggendario è esistito davvero, c'è un altro problema da risolvere: dove sarà finito, questo misterioso guerriero?\n@c0@"
  ja: "@a@bデボラ「ここまで来て　得られたのは\n\t勇者が本当にいた　っていう手がかりだけ？\n\t今　どこにいるのかが知りたいのに。\n@c0@"
99:
  de: "@aGriselda@bDann wurde er also nur deshalb König, weil er mit dem legendären Helden befreundet war?\n@c0@"
  en: "@aDebora@bSo he became king just on the strength of being friends with the legendary hero?\n@c0@"
  es: "@aStefania@bMa, ¿llegó a rey solo por ser amigo del héroe legendario?\n@c0@"
  fr: "@aPandora@bAlors il est devenu roi rien que parce qu'il était ami avec le héros légendaireⓡ\n@c0@"
  it: "@aViola@bHai capito che furbastro?!\nHa fondato un regno tutto suo solo perché era amico dell'Eroe Leggendario!\n@c0@"
  ja: "@a@bデボラ「ふうん　勇者のお供をしただけで\n\t王様になれるのね。\n@c0@"
100:
  de: "@aGriselda@bTja, ich hab einen eigenen Leibdiener, also... Mir gefällt's zwar auch so, wie's ist, aber ich hätte nichts dagegen, Königin zu werden.\n@c0@"
  en: "@aDebora@bWell, I have my own personal servant so...\r\nI don't mind carrying on as we are, but it could be quite nice to become a queen.\n@c0@"
  es: "@aStefania@bVa bene, yo ya tengo un sirviente personal...\r\nVeramente, lo menos que podrías hacer es convertirme en reina.\n@c0@"
  fr: "@aPandora@bRemarque, j'ai bien mon domestique personnel, alors... Ça ne m'ennuie pas de continuer comme ça, mais c'est vrai que ça pourrait être pas mal de devenir reine.\n@c0@"
  it: "@aViola@bCaro, che ne diresti di diventare re di qualche posto? Non mi dispiacerebbe affatto diventare la ⓕRegina Violaⓖ...\n@c0@"
  ja: "@a@bデボラ「私には　いちおう　しもべがいるし\n\t別に　このままでもいいけど……\n\t女王になるのも　悪くないわね。\n@c0@"
101:
  de: "@aGriselda@bWenn auf der Welt Frieden herrscht, braucht der legendäre Held sich nicht blicken zu lassen. Das heißt, wir lernen ihn nicht kennen.\n@c0@"
  en: "@aDebora@bIf the world's at peace, then there's no need for the legendary hero to show his face. That means we won't get to meet him.\n@c0@"
  es: "@aStefania@bSi el mondo está en paz el héroe legendario no tendrá por qué mostrarse. Y entonces no lo conoceremos.\n@c0@"
  fr: "@aPandora@bSi le monde est en paix, ça ne sert à rien que le\r\nhéros légendaire se montre. Ça veut dire qu'on\r\nn'est pas près de faire sa connaissance.\n@c0@"
  it: "@aViola@bSe il detto è veritiero, preferisco che l'Eroe Leggendario non si faccia vedere: vorrebbe dire che il mondo non corre alcun rischio!\n@c0@"
  ja: "@a@bデボラ「世界が平和なら\n\t勇者が出てくる必要は　ないものね。\n\tでも　それじゃ　勇者には会えないのよね。\n@c0@"
102:
  de: "@aGriselda@bDer Held wird wahrscheinlich irgendwann den legendären Helm hier abholen. Aber ich werd' hier jedenfalls nicht rumhängen, bis er auftaucht!\n@c0@"
  en: "@aDebora@bThe hero will probably return here one day for the legendary helm. But there's no way I'm hanging around to wait for him!\n@c0@"
  es: "@aStefania@bEs probabile que el héroe vuelva algún día a por el yelmo legendario, ¡pero que no cuente con que yo me quede a esperarlo!\n@c0@"
  fr: "@aPandora@bLe héros reviendra sans doute un jour ici pour récupérer le casque légendaire. Mais pas question que je traîne sur place à l'attendreⓠ\n@c0@"
  it: "@aViola@bSarà anche vero che prima o poi l'Eroe Leggendario tornerà a prendere il suo elmo, ma non ho alcuna intenzione di restare qui ad aspettarlo!\n@c0@"
  ja: "@a@bデボラ「いつか勇者が　伝説のカブトを取りに\n\tここへ　戻ってくるのかもしれないけど……\n\t私は　こんな所で待つなんて　絶対イヤよ。\n@c0@"
103:
  de: "@aGriselda@bIgitt! Hier ist es überall zu heiß, aber in diesem Raum ist es nicht nur heiß, sondern es müffelt auch noch nach Schweiß. Wie eklig!\n@c0@"
  en: "@aDebora@bUrgh. It's too hot all over this place, but this room's not only hot, it smells of sweat too. Disgusting!\n@c0@"
  es: "@aStefania@bPuaj. Ya es malo el calor, pero es que este sitio además apesta a sudore. ¡Qué ripugnante!\n@c0@"
  fr: "@aPandora@bBeurk. Il fait trop chaud partout, ici, mais en plus cette pièce sent la transpiration. C'est répugnantⓠ\n@c0@"
  it: "@aViola@bArgh! C'è una puzza di sudore insopportabile qui dentro! Per forza, dico io!\nCome si fa ad allenarsi con questo caldo?!\n@c0@"
  ja: "@a@bデボラ「この国って　ただでさえ暑苦しいのに\n\tこの部屋は　暑い上に　汗くさいわね。\n\tもう少し　なんとかならないものかしら。\n@c0@"
104:
  de: "@aGriselda@bIch kann's Ihrer Majestät nicht verübeln, dass sie nicht in dieser Hitze rumsitzen will. Sie ist wahrscheinlich irgendwo, wo's schön kühl ist.\n@c0@"
  en: "@aDebora@bI don't blame Her Majesty for not wanting to sit about here in this heat. She's probably gone off to find a nice, cool spot somewhere.\n@c0@"
  es: "@aStefania@bNo culpo a Su Majestad por no querer sentarse aquí con este calore. Estará buscando un sitio más rinfrescante.\n@c0@"
  fr: "@aPandora@bJe ne peux pas blâmer Sa Majesté de ne pas vouloir rester assise ici par cette chaleur.\n㈡\nElle est sans doute partie chercher un petit coin\nde fraîcheur quelque part.\n@c0@"
  it: "@aViola@bLa Regina dev'essere una donna molto intelligente: invece di starsene qui a patire il caldo, se n'è andata a godersi il fresco in giardino!\n@c0@"
  ja: "@a@bデボラ「この暑さだし　女王だって\n\tこんな所に　いたくはないわよね。\n\t自分だけ　すずしい所に行ってるのかも。\n@c0@"
105:
  de: "@aGriselda@bIch wünschte, der legendäre Held würde endlich mal zu Potte kommen und sich zeigen. Der hat Nerven, mich hier warten zu lassen!\n@c0@"
  en: "@aDebora@bI wish the legendary hero would pull his finger out and show his face. The nerve of him, keeping me waiting like this!\n@c0@"
  es: "@aStefania@bYa podría el héroe legendario asomar la testa. ¡Ma qué descaro, hacerme esperar de este modo!\n@c0@"
  fr: "@aPandora@bSi seulement le héros légendaire pouvait lever la main et nous montrer à quoi il ressemble. Il ne manque pas de culot de nous faire attendre comme çaⓠ\n@c0@"
  it: "@aViola@bMa l'Eroe Leggendario non farebbe meglio ad arrivare prima che la minaccia si concretizzi?\n㈡\nMeglio prepararsi per tempo, no?\nFare le cose all'ultimo minuto è sempre rischioso...\n@c0@"
  ja: "@a@bデボラ「もう　勇者もグズグズしてないで\n\tさっさと　出てくればいいのよ！\n\t私を　待たせるなんて　許せないわ。\n@c0@"
106:
  de: "@aGriselda@bWie lieb von ihnen, einen Garten mitten in der Wüste anzulegen, um mich willkommen zu heißen. Von Königin Kleohutra kannst du noch was lernen!\n@c0@"
  en: "@aDebora@bHow lovely of them to build a garden like this in the middle of the desert to welcome me. You could learn a lot from Queen Cleohatra.\n@c0@"
  es: "@aStefania@bQué bien que hayan construido un giardino así en medio del desierto para darme la bienvenida. ¡A ver si aprendes de la reina Leopatra!\n@c0@"
  fr: "@aPandora@bComme c'est charmant de leur part de construire un jardin pareil au milieu du désert pour m'accueillir. Cette reine Toutankhanon a beaucoup à t'apprendre.\n@c0@"
  it: "@aViola@bLa regina Cleo ha realizzato un giardino nel deserto per il suo popolo... E tu cosa costruirai per me, brutto pigrone che non sei altro?!\n@c0@"
  ja: "@a@bデボラ「砂漠の真ん中に　こんな庭園を作って\n\t私を　歓迎してくれるだなんて。\n\tあんたも　ここの女王を見習いなさいよ。\n@c0@"
107:
  de: "@aGriselda@bSie beglückt sie mit diesem Garten? Das klingt so, als hätte sie mehr getan, als ihn nur anzulegen. Meinst du, sie hat irgendwelche besonderen Kräfte?\n@c0@"
  en: "@aDebora@bShe blessed them with this garden?\r\nSounds like she did more than just pay for it.\r\nDo you think she has some kind of special power?\n@c0@"
  es: "@aStefania@b¿Ella los bendice con este giardino?\r\nParece que hace algo más que poner dinero.\r\n¿Crees que tendrá alguna clase de poder especial?\n@c0@"
  fr: "@aPandora@bElle leur a offert ce jardinⓡ On dirait qu'elle ne\ns'est pas contentée de le payer de sa poche.\nTu crois qu'elle a des pouvoirs spéciauxⓡ\n@c0@"
  it: "@aViola@bChissà come avrà fatto a creare un giardino proprio in mezzo al deserto...\nAvrà sfruttato una sorgente sotterranea?\n㈡\nO forse è dotata di un pollice verde grande quanto tutto il Regno di Coburg?!\n@c0@"
  ja: "@a@bデボラ「女王の力で　この庭園を……？\n\tお金じゃない　何か　特別な力が\n\tここの女王には　あるっていうの？\n@c0@"
108:
  de: "@aGriselda@bSie denkt wahrscheinlich an die Dornen der Rosen. Aber Blumen, die nichts als zarte Blütenblätter haben, sind langweilig, stimmt's nicht, %a000090?\n@c0@"
  en: "@aDebora@bI suppose she means that roses have thorns.\nBut flowers with soft petals alone are no fun, right, %a000090?\n@c0@"
  es: "@aStefania@bSembra que quiere decir que las rosas tienen espinas.\n㈡\nMa a ti no te gustaría una flor solo con pétalos delicados, ¿eh, %a000090?\n@c0@"
  fr: "@aPandora@bCela doit vouloir dire que les roses ont des épines. Mais les fleurs qui n'ont que de doux pétales manquent de piquant, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@bIo sono come una rosa, %a000090. Le ⓕspineⓖ del mio carattere mi fanno sembrare ostica e scorbutica, ma sotto sotto sono dolce e delicata...\n@c0@"
  ja: "@a@bデボラ「トゲがある……　ってことかしら？\n\tでも　キレイなだけの花じゃ\n\tつまらないでしょう？　ね　%a000090。\n@c0@"
109:
  de: "@aGriselda@bSchwer vorstellbar, dass das hier jemals was anderes gewesen sein soll als eine Wüste.\n@c0@"
  en: "@aDebora@bI find it hard to believe that this desert was ever covered in greenery.\n@c0@"
  es: "@aStefania@bMe cuesta creer que este deserto estuviera cubierto de follaje.\n@c0@"
  fr: "@aPandora@bJ'ai du mal à croire que ce désert ait jamais pu\r\nêtre recouvert de végétation.\n@c0@"
  it: "@aViola@bA vederla ora, stento a credere che Faraonia un tempo sia stata una terra fertile...\n@c0@"
  ja: "@a@bデボラ「この砂漠が\n\t昔は　緑豊かな土地だったなんて\n\tとてもじゃないけど　信じられないわ。\n@c0@"
110:
  de: "@aGriselda@bDas Grab des legendären Helden? Tja, wo wir schon hier sind, können wir es uns wohl genauso gut mal ansehen.\n@c0@"
  en: "@aDebora@bThe legendary hero's grave? I suppose we may as well go and have a look while we're here.\n@c0@"
  es: "@aStefania@b¿El sepulcro del héroe legendario? Ya que estamos aquí podríamos ir a echar un vistazo, ¿capisci?\n@c0@"
  fr: "@aPandora@bLa tombe du héros légendaireⓡ On ferait peut-être bien d'aller y jeter un œil tant qu'on est là.\n@c0@"
  it: "@aViola@bCaro, perché non chiediamo alla regina Cleo di portarci a vedere la tomba dell'Eroe Leggendario?\n@c0@"
  ja: "@a@bデボラ「勇者の墓……　ね。\n\tせっかくだから\n\t見に行ってあげてもいいわよ。\n@c0@"
111:
  de: "@aGriselda@bWas ist denn, %a000090? Jetzt ist keine Zeit für ein Schwätzchen! Wir werden Ihre Majestät noch aus den Augen verlieren, wenn wir nicht aufpassen!\n@c0@"
  en: "@aDebora@bWhat are you playing at, %a000090? There's no time for chat now. We'll lose sight of Her Majesty if we're not careful.\n@c0@"
  es: "@aStefania@b¿A qué juegas, %a000090? No hay tiempo para chiacchieratta. Si no tenemos cuidado perderemos de vista a Su Majestad.\n@c0@"
  fr: "@aPandora@bÀ quoi tu joues, %a000090ⓡ On n'a pas le temps de discuter. On va perdre de vue Sa Majesté si l'on n'y prend pas garde.\n@c0@"
  it: "@aViola@b%0%a000090, parleremo dopo.\nSe ci perdiamo tempo in chiacchiere, non riusciremo a star dietro alla Regina.\n@c0@"
  ja: "@a@bデボラ「私と　おしゃべりしたいの？\n\t今は　そんな場合じゃないでしょ！\n\t早く行かないと　女王を見失うわよ！\n@c0@"
112:
  de: "@aGriselda@bKannst du mal für eine Sekunde aufhören, mich so anzustarren, und den Helm aufprobieren?\n@c0@"
  en: "@aDebora@bCan you stop staring at me for one second and try on that helmet?\n@c0@"
  es: "@aStefania@b¿Puedes dejar de mirarme un secondo y ponerte ese yelmo?\n@c0@"
  fr: "@aPandora@bTu pourrais arrêter de me contempler pendant une seconde et essayer ce casque, ouiⓡ\n@c0@"
  it: "@aViola@bAllora?!\nLo vuoi provare quell'elmo oppure no?!\n@c0@"
  ja: "@a@bデボラ「もう……　私にみとれていないで\n\tさっさと　そのカブトを　かぶりなさいよ。\n@c0@"
113:
  de: "@aGriselda@bWenn doch nur du dich als der legendäre Held entpuppt hättest! Aber das wäre wohl zu einfach gewesen.\n@c0@"
  en: "@aDebora@bIf only you'd turned out to be the legendary hero.\r\nI don't suppose it could ever be that simple, though.\n@c0@"
  es: "@aStefania@bSi hubieras resultado ser el héroe legendario...\r\nMa mírate, qué chiste. Demasiado facile.\n@c0@"
  fr: "@aPandora@bSi seulement ça avait pu être toi, le héros légendaire. Mais les choses ne sont jamais aussi simples,\r\nje suppose.\n@c0@"
  it: "@aViola@bAh, sarebbe stato tutto più facile se tu fossi stato l'Eroe Leggendario...\n@c0@"
  ja: "@a@bデボラ「%a000090が　伝説の勇者だったら\n\t話が早かったんだけど……\n\tそれじゃ　話が出来すぎだものね。\n@c0@"
114:
  de: "@aGriselda@bNa ja. Königin Kleohutra scheint ja Ahnung zu haben, also sollten wir uns vielleicht anhören, was sie sonst noch so zu sagen hat.\n@c0@"
  en: "@aDebora@bOh well. Queen Cleohatra seems fairly clued up, so we should go and see what else she has to say.\n@c0@"
  es: "@aStefania@bBueno. La regina Leopatra parece saber bastante. Deberíamos ir a ver qué más tiene que decir.\n@c0@"
  fr: "@aPandora@bTant pis. La reine Toutankhanon a quand même l'air d'avoir pas mal d'informations, on devrait aller voir ce qu'elle pourrait nous apprendre d'autre.\n@c0@"
  it: "@aViola@bBah, non importa... Andiamo a parlare con la regina Cleo: mi sembra bene informata, e chissà che non possa darci qualche informazione utile...\n@c0@"
  ja: "@a@bデボラ「まあいいわ。\n\tあの女王　他にもいろいろ知っていそうだし\n\tちょっと　話を聞きに行きましょうか。\n@c0@"
115:
  de: "@aGriselda@bEs wäre so schön gewesen, wenn du diesen Helm hättest aufsetzen können.\n@c0@"
  en: "@aDebora@bIt would've been so wonderful if you'd been able to put on that helmet.\n@c0@"
  es: "@aStefania@bHubiera sido meraviglioso que te valiera ese yelmo.\n@c0@"
  fr: "@aPandora@bÇa aurait vraiment été merveilleux que tu sois capable de porter ce casque.\n@c0@"
  it: "@aViola@bSarebbe stato fantastico se tu avessi potuto indossare l'elmo...\n@c0@"
  ja: "@a@bデボラ「あ～あ　%a000090が\n\tあのカブトをかぶれたら　面白かったのに。\n@c0@"
116:
  de: "@aGriselda@bStell dir das nur vor! Mein Leibsklave der legendäre Held! Schon bei dem Gedanken daran wird mir ganz anders.\n@c0@"
  en: "@aDebora@bImagine that! My personal slave the legendary hero! Just the thought of it gives me the shivers.\n@c0@"
  es: "@aStefania@b¡Imagina! ¡Il mio esclavo personal el héroe legendario! Solo de pensarlo se me pone la carne de gallina.\n@c0@"
  fr: "@aPandora@bImagine un peuⓠ Mon esclave personnel, le héros légendaireⓠ J'en ai des frissons rien que d'y penser.\n@c0@"
  it: "@aViola@bMa ci pensi?! L'Eroe Leggendario sarebbe stato mio marito! Sarei stata l'invidia di tutte le donne del mondo! Ah, troppo bello per essere vero...\n@c0@"
  ja: "@a@bデボラ「だって　伝説の勇者が\n\t自分のしもべだなんて……\n\t考えただけでも　最高に気分がいいわ。\n@c0@"
117:
  de: "@aGriselda@bBist du nicht ein bisschen übervorsichtig? Erzähl ihr doch einfach, was los ist. Schluss mit der Zauderei.\n@c0@"
  en: "@aDebora@bYou're being a bit overly cautious, aren't you?\r\nJust tell her the situation. No more messing around.\n@c0@"
  es: "@aStefania@b¿No te estás pasando de cauto?\r\nExplícale la situación y deja de hacer el tonto, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu es un peu trop méfiant, tu ne crois pasⓡ\nDis-lui simplement les choses telles qu'elles sont. Arrête de tourner autour du pot.\n@c0@"
  it: "@aViola@bScusa, ma perché non le dici tutto?\nSe la Regina conoscesse esattamente la tua storia, forse potrebbe darci qualche indicazione preziosa...\n@c0@"
  ja: "@a@bデボラ「あんた　意外と用心深いのね。\n\tいいから　女王に話をしなさい。\n\t口ごたえは　許さないわよ。\n@c0@"
118:
  de: "@aGriselda@bLudwig? Hieß so nicht auch dein Vater? Aber dass du ein Prinz bist, kann doch einfach nicht sein.\n@c0@"
  en: "@aDebora@bPankraz? Wasn't that the name of your father too? There's no way you could be a prince, though.\n@c0@"
  es: "@aStefania@b¿Teudis? ¿No se llamaba así il tuo papino? ¿Pero cómo vas a ser tú príncipe?\n@c0@"
  fr: "@aPandora@bPetrosⓡ Ce n'était pas aussi le nom de ton pèreⓡ Mais il n'est pas possible que tu sois un prince.\n@c0@"
  it: "@aViola@bMa Russel non è il nome di tuo padre? Ah, dev'essere solo una coincidenza. Non penso tu sia figlio di un re. Di principesco non hai proprio niente...\n@c0@"
  ja: "@a@bデボラ「パパスって……\n\tあんたのパパと　同じ名前よね？\n\tでも　あんたが王子だなんて　ないわよね。\n@c0@"
119:
  de: "@aGriselda@bJetzt hab ich den Sand aber gründlich satt. Ich will in dieses östliche Königreich, nach Humburg. Am besten kommst du auch gleich mit.\n@c0@"
  en: "@aDebora@bI'm fed up with the sight of sand now.\r\nI'm leaving for the eastern kingdom of Gotha.\r\nYou'd better come along too.\n@c0@"
  es: "@aStefania@bYa estoy harta de ver arena.\r\nMe marcho al reino orientale de Pankraz.\r\nY más te vale que vengas conmigo, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe suis fatiguée de voir du sable partout. Je pars pour le royaume de Gotha, à l'est. Tu as intérêt à venir aussi.\n@c0@"
  it: "@aViola@bNon ne posso più di vedere intorno a me quest'infinita distesa di sabbia. Che ne diresti di andarcene a est, verso il Regno di Denim?\n@c0@"
  ja: "@a@bデボラ「砂ばっかりの景色にも　あきてきたし\n\t次は　東の　グランバニアへ行くから\n\tあんたも　しっかり　ついてくるのよ。\n@c0@"
120:
  de: "@aGriselda@bTagsüber ist es so heiß, dass einem glatt die Haut versengt, und nachts schlottert man vor Kälte. Ich hasse die Wüste!\n@c0@"
  en: "@aDebora@bIt's so hot in the daytime that it feels like your skin's on fire, but at night it's freezing. I hate being in the desert!\n@c0@"
  es: "@aStefania@bHace tanto calor de día que parece que te arde la pelle, pero de noche te hielas.\n¡Odio el desierto!\n@c0@"
  fr: "@aPandora@bEn journée, il fait si chaud qu'on a l'impression d'avoir la peau en feu, mais de nuit, on gèle.\nJe déteste être dans le désertⓠ\n@c0@"
  it: "@aViola@bNel deserto, di giorno si muore di caldo e di notte il freddo ti entra fin dentro le ossa. Non accetterei di vivere qui nemmeno se mi coprissero d'oro!\n@c0@"
  ja: "@a@bデボラ「昼間は　ハダが焼けるほどだったのに\n\t夜になったら　この寒さ……。\n\t砂漠って　とんでもないところだわ。\n@c0@"
121:
  de: "@aGriselda@bWir müssen es morgen noch mal versuchen. Es ist spät, und selbst ich brauche gelegentlich eine kleine Rast..\n@c0@"
  en: "@aDebora@bWe'll have to try again tomorrow.\r\nIt's late, and even I need a rest sometimes.\n@c0@"
  es: "@aStefania@bHabrá que intentarlo domani.\r\nEs tarde, y hasta yo tengo que descansar.\n@c0@"
  fr: "@aPandora@bIl faudra qu'on réessaie demain. Il est tard et même moi j'ai besoin de me reposer de temps en temps.\n@c0@"
  it: "@aViola@bForza, caro.\nNon perdiamo tempo.\nAndiamo a riposare, torneremo qui domani.\n@c0@"
  ja: "@a@bデボラ「また明日　出直すわよ。\n\tもう遅いし　さすがに私も疲れたから。\n@c0@"
122:
  de: "@aGriselda@bIgitt! Eine Erkältung kann ich nicht brauchen!\n@c0@"
  en: "@aDebora@bYuck! I don't want to catch a cold!\n@c0@"
  es: "@aStefania@b¡Agh! ¡No quiero pillar un resfriado!\n@c0@"
  fr: "@aPandora@bBeurkⓠ Je ne veux pas attraper un rhumeⓠ\n@c0@"
  it: "@aViola@bNon voglio prendermi un raffreddore!\n@c0@"
  ja: "@a@bデボラ「キャッ！　もうっ　イヤねえ……\n\tこっちに　カゼを　うつさないでほしいわ。\n@c0@"
123:
  de: "@aGriselda@bIn letzter Zeit ging's mir ohnehin nicht so gut.\n@c0@"
  en: "@aDebora@bI've already been feeling a bit under the weather just lately.\n@c0@"
  es: "@aStefania@bYa hace tiempo que no me siento muy allá. Tutto es culpa tuya.\n@c0@"
  fr: "@aPandora@bDéjà que je ne me sens pas tout à fait en forme\r\nces derniers temps.\n@c0@"
  it: "@aViola@bTi ordino di fare in modo che io non mi ammali!\nMi hai capito, caro il mio %a000090?\n@c0@"
  ja: "@a@bデボラ「ただでさえ　最近　疲れていて\n\tあまり調子が　良くないんだから。\n@c0@"
124:
  de: "@aGriselda@bEs treiben sich viel mehr Monster herum als früher, und ich würde die Welt nicht gerade friedlich nennen, also zeig dich endlich, Held, wo du auch sein magst!\n@c0@"
  en: "@aDebora@bThere are quite a few more monsters about now than there used to be, and I'd hardly call the world peaceful, so come out, hero, wherever you are!\n@c0@"
  es: "@aStefania@bAhora hay bastantes más mostri que antes y no es que il mondo sea un remanso de pace. ¡Vamos, héroe, sal de donde te escondas!\n@c0@"
  fr: "@aPandora@bIl y a aujourd'hui beaucoup plus de monstres qu'auparavant qui rôdent partout, et je ne dirais pas vraiment que le monde est en paix.\n㈡\nAlors où que tu sois, héros légendaire, montre-toiⓠ\n@c0@"
  it: "@aViola@bCosa aspetta l'Eroe Leggendario a farsi vedere?!\nForse gli serve un invito ufficiale?!\nUna richiesta in carta bollata?!\n@c0@"
  ja: "@a@bデボラ「魔物もずいぶんふえてきたし\n\tとても　世界が平和とは　思えないわ。\n\t勇者も　さっさと　出てきなさいよね。\n@c0@"
125:
  de: "@aGriselda@bWas für ein Idiot. Warum hat er sich nicht richtig vorbereitet? Solche Leute gehen mir wirklich auf die Nerven.\n@c0@"
  en: "@aDebora@bWhat an idiot. Why didn't he come properly prepared? People like that really get on my nerves.\n@c0@"
  es: "@aStefania@bQué stulto. ¿Por qué no vino bien preparado? Esa gente me pone inferma.\n@c0@"
  fr: "@aPandora@bQuel imbécile. Pourquoi il ne s'est pas préparé correctement avant de venirⓡ Les gens comme lui\nme tapent vraiment sur les nerfs.\n@c0@"
  it: "@aViola@bSolo un idiota potrebbe andarsene in giro per il deserto vestito in quel modo.\nBah, peggio per lui...\n@c0@"
  ja: "@a@bデボラ「まぬけな男ね。\n\t用意くらい　ちゃんとしておきなさいよ。\n\t見ているこっちが　イライラしてくるわ。\n@c0@"
126:
  de: "@aGriselda@bPapa hat mir vor Ewigkeiten mal so eine gezeigt. Sie sind wirklich hübsch.\n@c0@"
  en: "@aDebora@bPapa showed me one of those ages ago.\nThey're quite pretty, actually.\n@c0@"
  es: "@aStefania@bIl mio papino me enseñó una hace tiempo. Son preciosas.\n@c0@"
  fr: "@aPandora@bPapa m'en a montré une un jour, il y a très longtemps. C'est assez joli, en fait.\n@c0@"
  it: "@aViola@bUna volta il mio paparino mi ha mostrato una rosa del deserto.\nSono oggetti molto carini.\n@c0@"
  ja: "@a@bデボラ「昔　パパに\n\t見せてもらったことがあるけど\n\tけっこう　ステキな石だったわ。\n@c0@"
127:
  de: "@aGriselda@bDu könntest versuchen, eine für mich zu finden, wenn du magst. Aber ich warte hier. Mir ist es zu kalt.\n@c0@"
  en: "@aDebora@bYou could try to find one for me if you like. I'll wait here, though. It's too cold for me.\n@c0@"
  es: "@aStefania@bTe convendría encontrarme una. Ma yo te espero aquí, hace demasiado fredo.\n@c0@"
  fr: "@aPandora@bTu pourrais essayer d'en trouver une pour moi,\r\nsi tu voulais. Mais je t'attendrai ici. Il fait bien trop froid pour moi.\n@c0@"
  it: "@aViola@bSe proprio vuoi trovarne qualcuna, ti do il permesso di andare a cercarle. Io resterò qui a riposare, così non mi prenderò un'infreddatura.\n@c0@"
  ja: "@a@bデボラ「気が向いたら　探してみれば？\n\t寒いのはイヤだから\n\t私は行きたくないけど。\n@c0@"
128:
  de: "@aGriselda@bStarrsinniger Trottel! Kein Wunder, dass ihm seine Tochter davongelaufen ist.\n@c0@"
  en: "@aDebora@bStubborn fool! No wonder his daughter decided to run away from home.\n@c0@"
  es: "@aStefania@b¡Stulto testardo! No me extraña que la sua figlia huyera de casa.\n@c0@"
  fr: "@aPandora@bQuelle vieille tête de muleⓠ Pas étonnant que sa fille ait décidé de s'enfuir de la maison.\n@c0@"
  it: "@aViola@bMa senti che razza di maleducato!\nAvrei proprio voglia di rispondergli per le rime...\n@c0@"
  ja: "@a@bデボラ「まったく　ガンコなおじさんね。\n\tこれじゃ　あの娘だって\n\t家出のひとつも　したくなって当然だわ。\n@c0@"
129:
  de: "@aGriselda@bRecht hat er. Hier würde ich ganz bestimmt nicht leben wollen.\n@c0@"
  en: "@aDebora@bI couldn't agree more.\r\nThere's no way I'd ever live here.\n@c0@"
  es: "@aStefania@bNo podría estar más de acuerdo.\r\nVeramente, yo aquí no viviría ni loca.\n@c0@"
  fr: "@aPandora@bJe suis tout à fait d'accord.\r\nJe ne pourrais jamais vivre ici.\n@c0@"
  it: "@aViola@bConcordo in pieno: non vivrei qui nemmeno se mi pregassero in ginocchio...\n@c0@"
  ja: "@a@bデボラ「同感だわ。\n\t私　こんなところに住むなんて\n\t絶対にイヤよ。\n@c0@"
130:
  de: "@aGriselda@bImmer nur Held hier, Held da. Der ist ja förmlich besessen von seinem Helden, %a000090.\n@c0@"
  en: "@aDebora@bIt's all ⓗhero, hero, heroⓘ, non-stop, night and day.\nHe could give you a run for your money, %a000090, he's that obsessed.\n@c0@"
  es: "@aStefania@bTodo el día ⓕhéroe, héroe, héroeⓖ, sin parar ni un momento.\n㈡\nQué ossessione, %a000090, podría aburrir a un muerto.\n@c0@"
  fr: "@aPandora@bOn n'entend que ça en permanence, ⓥle héros, le héros, le hérosⓦ, de jour comme de nuit. En terme d'obsession, tu es battu, %a000090.\n@c0@"
  it: "@aViola@bHai sentito, %a000090?\nSembra che tu non sia il solo a essere ossessionato dall'Eroe Leggendario...\n@c0@"
  ja: "@a@bデボラ「寝ても　さめても　勇者勇者……\n\t%a000090といい勝負だわ。\n@c0@"
