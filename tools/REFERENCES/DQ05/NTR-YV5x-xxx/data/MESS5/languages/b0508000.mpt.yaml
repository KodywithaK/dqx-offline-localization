0:
  de: "@aBianca@bDas war bestimmt nicht leicht, das Schloss so weit hier draußen zu bauen.\n@c0@"
  en: "@aBianca@bThey did a good job of buildin' a castle all the way out here.\n@c0@"
  es: "@aBianca@bMenudo trabajazo, construir un castillo aquí, tan lejos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIls ont du mérite d'avoir construit un château\r\ndans un coin aussi reculé.\n@c0@"
  it: "@aBianca@bMa tu guarda!\nE chi se l'aspettava di trovare un castello proprio qui...?\n@c0@"
  ja: "@a@bビアンカ「こんな所に　お城なんて\n\t本当に　よく建てられたと\n\t思っちゃうわ。\n@c0@"
1:
  de: "@aBianca@bBei dieser Hitze klappe ich gleich zusammen! Irgendwann blicken wir bestimmt auf unsere heißen Flitterwochen zurück und lachen uns kaputt, was?\n@c0@"
  en: "@aBianca@bI feel like I'm about to collapse in all this heat! I s'pose we'll look back on our ⓗhot honeymoonⓘ one day and laugh, though, eh?\n@c0@"
  es: "@aBianca@b¡Yo creo que me voy a desmayar con este calor! ¡Seguro que un día recordaremos nuestra ⓕluna de miel calienteⓖ y nos echaremos unas risas!\n@c0@"
  fr: "@aBianca@bJe crois que je vais finir par m'évanouir, avec cette chaleurⓠ Plus tard, on rigolera bien en repensant à cette ⓥlune de miel torrideⓦⓠ\n@c0@"
  it: "@aBianca@bQuesto caldo mi sta facendo impazzire!\nAmore, promettimi che il prossimo viaggio che faremo sarà in cima a una montagna, tra le nevi eterne...\n@c0@"
  ja: "@a@bビアンカ「それにしても　あまりの暑さで\n\tたおれそう……。　それはそれで\n\t新婚旅行の　思い出になるかしら。\n@c0@"
2:
  de: "@aNera@bIch würde mir das Schloss gern etwas näher ansehen, aber bei all dem herumfliegenden Sand kann ich kaum die Augen offenhalten.\n@c0@"
  en: "@aNera@bI'd love to have a proper look at the castle, but\r\nI can hardly keep my eyes open with all this sand flying about.\n@c0@"
  es: "@aNera@bMe gustaría poder ver el castillo mejor, pero el viento levanta tanta arena que apenas puedo mantener mis occhi abiertos.\n@c0@"
  fr: "@aNera@bJ'adorerais aller voir le château de plus près, mais j'arrive à peine à garder les yeux ouverts avec tout ce sable qui vole.\n@c0@"
  it: "@aNera@bMi piacerebbe ammirare per bene il castello, ma con tutta la sabbia che il vento fa volare riesco a malapena a tenere gli occhi socchiusi...\n@c0@"
  ja: "@a@bフローラ「お城を　よく見たいんですけど\n\t砂嵐が　ひどくて\n\t目を　開けていられませんわ。\n@c0@"
3:
  de: "@aNera@bEs muss sehr schwer gewesen sein, das Schloss hier zu erbauen.\n@c0@"
  en: "@aNera@bIt must have been terribly hard work for the people who built this here.\n@c0@"
  es: "@aNera@bDebe de haber sido un lavoro muy duro construir este castillo aquí.\n@c0@"
  fr: "@aNera@bLa construction de ce château a dû être extrêmement pénible.\n@c0@"
  it: "@aNera@bCostruire un castello in questo posto non dev'essere stato affatto facile...\nDevono aver fatto una sudata mica da ridere!\n@c0@"
  ja: "@a@bフローラ「このお城を\n\t建てられた方々は　大変な苦労を\n\tなさったことでしょうね。\n@c0@"
4:
  de: "@aNera@bSchickt mir doch Papa einen Boten bis hierher nach! Er ist wirklich ein alter Sorgenheini, nicht?\n@c0@"
  en: "@aNera@bFancy Papa sending a messenger all the way out here! He really is a worrywart, isn't he?\n@c0@"
  es: "@aNera@b¡Qué curioso que il mio papino haya enviado un mensajero hasta aquí! Se angustia por nada, ¿verdad?\n@c0@"
  fr: "@aNera@bC'est incroyable que papa ait envoyé un messager iciⓠ Il est vraiment très inquiet, heinⓡ\n@c0@"
  it: "@aNera@bUn messaggero inviato da mio padre?\nCome avrà fatto a sapere che eravamo qui?!\n@c0@"
  ja: "@a@bフローラ「お父さまったら\n\tこんな所にまで　使者をよこして…\n\t本当に　心配性なんだから……。\n@c0@"
5:
  de: "@aNera@bEr hat uns noch etwas Geld geschickt. Wir sollten so höflich sein, es anzunehmen. Das würde ihn bestimmt glücklich machen.\n@c0@"
  en: "@aNera@bHe's sent us some money. We should accept it gracefully. I'm sure that would make him\r\nreally happy.\n@c0@"
  es: "@aNera@bNos ha enviado algo de dinero. Credo que deberíamos aceptarlo y agradecérselo, eso le hará veramente feliz.\n@c0@"
  fr: "@aNera@bIl nous a envoyé de l'argent. Nous devrions l'accepter. Je suis sûre que ça lui ferait\r\nvraiment plaisir.\n@c0@"
  it: "@aNera@bMio padre ci ha mandato del denaro!\nÈ stato davvero gentile, non credi?\n@c0@"
  ja: "@a@bフローラ「お金が入っていましたのね。\n\t父の気持ちですから　ここは\n\t受けとっておくことにしましょう。\n@c0@"
6:
  de: "@aBianca@bDer arme Mann! Wir sollten ihm helfen, etwas Wasser zu finden.\n@c0@"
  en: "@aBianca@bThat poor man! We should help him find some water.\n@c0@"
  es: "@aBianca@b¡Pobre hombre! Deberíamos echarle una mano y encontrar un poco de agua, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bPauvre hommeⓠ Nous devrions essayer de l'aider\nà trouver de l'eau.\n@c0@"
  it: "@aBianca@bPoveretto...\nAmore, dobbiamo aiutarlo a trovare dell'acqua.\n@c0@"
  ja: "@a@bビアンカ「大変！　えっと…\n\t水は　どこにあったかしら？\n\tつれていって　あげましょうよ。\n@c0@"
7:
  de: "@aNera@bOh je! Wir können ihn doch nicht einfach dort liegen lassen. Wir müssen etwas Wasser für ihn finden.\n@c0@"
  en: "@aNera@bOh dear! We can't just leave him lying there.\r\nWe must try to find him some water.\n@c0@"
  es: "@aNera@b¡Oh, vaya! No podemos dejarlo ahí sin más.\r\nDebemos intentar encontrar acqua para él.\n@c0@"
  fr: "@aNera@bC'est terribleⓠ Nous ne pouvons pas le laisser comme ça. Il faut essayer de lui trouver de l'eau.\n@c0@"
  it: "@aNera@bSanta dea!\nNon possiamo abbandonarlo qui!\nBisogna che lo aiutiamo a trovare dell'acqua!\n@c0@"
  ja: "@a@bフローラ「まあ！　こんなところで\n\t行き倒れては　大変ですわ。\n\t水を　飲ませてあげなくては……。\n@c0@"
8:
  de: "@aBianca@bNa, das ist doch ein Geschäftsmann, wie er leibt und lebt! Will mit seinen Rettern gleich wieder Geschäfte machen.\n@c0@"
  en: "@aBianca@bHe's a sharp one, eh? Leapin' up to do business with the folk who just saved his life!\n@c0@"
  es: "@aBianca@bQué tipo más espabilado, ¿eh? ¡Le ha faltado tiempo para intentar hacer negocio con los mismos que le han salvado la vida!\n@c0@"
  fr: "@aBianca@bIl ne perd pas le nord, heinⓡ Sitôt remis, il essaie de faire affaire avec ceux qui lui ont sauvé la vieⓠ\n@c0@"
  it: "@aBianca@bUn mercante girovago, eh?\nScommetto che ora cercherà di venderci qualcuna delle sue cianfrusaglie...\n@c0@"
  ja: "@a@bビアンカ「助けた恩人相手に\n\t商売を　はじめるなんて\n\tしっかり　してるわよね。\n@c0@"
9:
  de: "@aNera@bHoffen wir, dass ihm so etwas nicht noch einmal widerfährt.\n@c0@"
  en: "@aNera@bHere's hoping that he doesn't end up in such a sorry state again.\n@c0@"
  es: "@aNera@bEspero que nunca vuelva a encontrarse en una condizione tan lamentable.\n@c0@"
  fr: "@aNera@bIl ne reste plus qu'à espérer qu'il ne se retrouve\r\nplus dans un état pareil.\n@c0@"
  it: "@aNera@bSperiamo che questa brutta esperienza gli serva di lezione e che non si cacci più in una situazione del genere...\n@c0@"
  ja: "@a@bフローラ「あの方が　もう\n\t行き倒れないことを　祈りますわ。\n@c0@"
10:
  de: "@aBianca@bJa, es ist wirklich nicht besonders schlau, bei dieser Hitze ohne Hut herumzulaufen.\n@c0@"
  en: "@aBianca@bYeah, it definitely dun't sound like a good idea, goin' huntin' about without a hat in this heat.\n@c0@"
  es: "@aBianca@bDesde luego, no parece una buena idea salir a explorar por ahí ahora mismo sin un sombrero.\n@c0@"
  fr: "@aBianca@bEffectivement, ce n'est pas une bonne idée de partir faire des recherches sans chapeau sous ce soleil.\n@c0@"
  it: "@aBianca@bAndarsene in giro con questo sole senza un copricapo è davvero una pessima idea!\n@c0@"
  ja: "@a@bビアンカ「たしかに　ぼうしなしで\n\tこの暑さの中　さがし物をするのは\n\tむずかしいわよね。\n@c0@"
11:
  de: "@aNera@bIch würde denken, dass es selbst mit Hut zu heiß für eine Schatzsuche ist. Ich wäre dem jedenfalls nicht gewachsen.\n@c0@"
  en: "@aNera@bI should think it's too hot for treasure hunting even with a hat. I certainly wouldn't feel up to it.\n@c0@"
  es: "@aNera@bYo creo que fa demasiado caldo para ir a la caza de tesoros, incluso con un sombrero. Desde luego, yo no estaría dispuesta a ello.\n@c0@"
  fr: "@aNera@bJe trouve qu'il fait trop chaud pour partir à la chasse au trésor, même avec un chapeau.\r\nMoi, je n'en aurais aucune envie, en tout cas.\n@c0@"
  it: "@aNera@bC'è da farsi andare il cervello in ebollizione, a starsene senza cappello con questo caldo!\n@c0@"
  ja: "@a@bフローラ「ぼうしを　かぶっていても\n\tつらい日差しですものね。\n\tさがし物は　ムリですわ。\n@c0@"
12:
  de: "@aBianca@bSteine in Form einer Rose? Das klingt merkwürdig. Wenn's geht, sollten wir versuchen, so eine zu finden.\n@c0@"
  en: "@aBianca@bRocks in the shape of a rose? That sounds weird. We'll have to have a look for one of those if we get the chance.\n@c0@"
  es: "@aBianca@b¿Piedras con forma de rosa? ¡Qué cosa más rara! Si tenemos ocasión deberíamos buscar una de esas, ¿sabes?\n@c0@"
  fr: "@aBianca@bDes pierres en forme de rosesⓡ Ça m'a l'air bizarre. On devrait essayer d'en trouver une, à l'occasion.\n@c0@"
  it: "@aBianca@bRocce a forma di rosa?\nDevono essere bellissime!\nMi piacerebbe trovarne una, sai?\n@c0@"
  ja: "@a@bビアンカ「バラの形をした石なんて\n\tふしぎよね。　時間があったら\n\tさがしてみましょうよ。\n@c0@"
13:
  de: "@aNera@bIch habe schon einmal eine gesehen. Das sind wirklich merkwürdige Dinger.\n@c0@"
  en: "@aNera@bI've seen one of those before.\r\nThey really are curious things.\n@c0@"
  es: "@aNera@bLas he visto antes.\r\nSon objetos molto curiosi.\n@c0@"
  fr: "@aNera@bJ'en ai déjà vu. Ce sont vraiment de\r\ndrôles de pierres.\n@c0@"
  it: "@aNera@bSì, una volta ho visto una rosa del deserto.\nÈ un oggetto davvero particolare...\n@c0@"
  ja: "@a@bフローラ「私も　以前見かけたことが\n\tありますけど…　それはもう\n\t神秘的な石でしたわ。\n@c0@"
14:
  de: "@aBianca@bIch hatte ja auch manchmal Streit mit meinem Vater, aber nie so heftig, dass ich wütend rausstürmen und davonlaufen wollte.\n@c0@"
  en: "@aBianca@bI've had my share of rows with my own dad, but it's never got to the point where I've stormed out and run away.\n@c0@"
  es: "@aBianca@bMi padre y yo nos hemos tirado los trastos a la cabeza muchas veces, pero nunca he llegado al punto de dar un portazo y largarme, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai eu mon lot de disputes avec papa, mais je n'en suis jamais arrivée à m'enfuir de la maison.\n@c0@"
  it: "@aBianca@bAnche a me è capitato di litigare con mio padre, ma non mi è mai venuto in mente di andarmene di casa.\n㈡\nSecondo me, le persone intelligenti riescono sempre ad appianare le loro divergenze d'opinioni con il dialogo...\n@c0@"
  ja: "@a@bビアンカ「私も　父さんとは　何度か\n\tケンカしたけど　家出するほど\n\tはげしいケンカは　したことないな。\n@c0@"
15:
  de: "@aNera@bIch habe noch nie mit meinen Eltern gestritten. Warum sollte ich auch?\n@c0@"
  en: "@aNera@bI've never once had an argument with either of my parents. Is that not the norm?\n@c0@"
  es: "@aNera@bJamás he tenido ni una sola discussione con ninguno de mis padres. ¿Acaso no es lo habituale?\n@c0@"
  fr: "@aNera@bJe ne me suis jamais disputée avec mes parents.\nCe n'est pas comme ça que c'est censé se passer dans une familleⓡ\n@c0@"
  it: "@aNera@bIo non ho mai litigato con i miei genitori, sai? Siamo sempre andati d'amore e d'accordo, nonostante mio padre sia una persona incredibilmente cocciuta!\n@c0@"
  ja: "@a@bフローラ「私は　両親とは　一度も\n\tケンカしたことがありませんの。\n\tこれって　おかしいかしら？\n@c0@"
16:
  de: "@aBianca@bEs wäre doch praktisch, wenn der legendäre Held tatsächlich hier wäre! Aber damit dürfen wir wohl nicht rechnen.\n@c0@"
  en: "@aBianca@bWouldn't it be handy if the legendary hero was actually here? I doubt we'll get that lucky, though.\n@c0@"
  es: "@aBianca@bQué práctico sería que el héroe legendario estuviese aquí mismo, ¿verdad? Pero no creo que tengamos tanta suerte, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa nous simplifierait vraiment la tâche si le héros légendaire se trouvait ici, heinⓡ Mais je doute qu'on ait autant de chance.\n@c0@"
  it: "@aBianca@bSarebbe bello se l'Eroe Leggendario vivesse proprio da queste parti, ma temo che non saremo tanto fortunati...\n@c0@"
  ja: "@a@bビアンカ「ついでに　勇者も\n\tここにいてくれれば　いいんだけど\n\tそういうわけには　いかないわよね。\n@c0@"
17:
  de: "@aNera@bDie Leute reden zwar überall von dem legendären Helden, aber hier noch mehr als sonst, findest du nicht?\n@c0@"
  en: "@aNera@bWe hear talk of the legendary hero wherever we go, but they speak of him an awful lot here, don't they?\n@c0@"
  es: "@aNera@bHemos oído hablar sobre el héroe legendario dovunque, pero aquí se habla sobre él mucho más, ¿verdad?\n@c0@"
  fr: "@aNera@bNous entendons parler du héros légendaire partout où nous allons, mais encore plus ici, nonⓡ\n@c0@"
  it: "@aNera@bDev'esserci un legame molto forte tra questo posto e l'Eroe Leggendario...\n@c0@"
  ja: "@a@bフローラ「勇者さまについては\n\tいろいろな場所で　語られていますが\n\tここは　とくに多いようですわね。\n@c0@"
18:
  de: "@aBianca@bAha. Ich wusste gar nicht, dass der legendäre Held zenithianischer Herkunft ist. Wie man einen Zenithianer wohl kennenlernen kann?\n@c0@"
  en: "@aBianca@bOh, right. I didn't know the legendary hero was the child of a Zenithian. I wonder how you'd go about meetin' 'em.\n@c0@"
  es: "@aBianca@b¡Ah!, claro. No sabía que el héroe legendario fuese hijo de una habitante de Zenithia. Me pregunto cómo hace una para conocerlos, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh, je ne savais pas que le héros légendaire était l'enfant d'une Zénithienne. Je me demande comment\r\non va bien pouvoir les retrouver.\n@c0@"
  it: "@aBianca@bNon avevo idea che l'Eroe Leggendario fosse figlio di una Zenithiana...\n㈡\nOra che lo sappiamo, però, il nostro problema resta insoluto: come facciamo a trovarlo?\n@c0@"
  ja: "@a@bビアンカ「勇者って　天空人の\n\t子供だったのね。　でも　天空人には\n\tどうやったら　会えるのかしら？\n@c0@"
19:
  de: "@aNera@bNatürlich. Der legendäre Held stammt von einem Zenithianer ab.\n@c0@"
  en: "@aNera@bOf course. The legendary hero had the blood of\r\na Zenithian.\n@c0@"
  es: "@aNera@bAhora está claro. El héroe legendario veramente tiene sangre de Zenithia.\n@c0@"
  fr: "@aNera@bNous aurions dû nous douter que le héros\r\nlégendaire avait du sang zénithien.\n@c0@"
  it: "@aNera@bCerto, è cosa risaputa che nelle vene dell'Eroe Leggendario scorre sangue zenithiano...\n@c0@"
  ja: "@a@bフローラ「伝説の勇者さまは　天空の血を\n\tひいていらっしゃったのですね。\n@c0@"
20:
  de: "@aBianca@bHier drin ist es herrlich kühl und erfrischend. Ich fühle mich wie neugeboren.\n@c0@"
  en: "@aBianca@bIt's lovely and cool and refreshin' in here. I feel like I've got a new lease of life all of a sudden.\n@c0@"
  es: "@aBianca@bAquí se está muy bien y hace fresquito. Me siento como si hubiese revivido, ¿sabes?\n@c0@"
  fr: "@aBianca@bLa fraîcheur de cet endroit est vraiment appréciable. J'ai l'impression de reprendre\r\ndu poil de la bête, tout à coup.\n@c0@"
  it: "@aBianca@bAh, che bel freschetto che c'è qui!\nMi sembra di rinascere!\n@c0@"
  ja: "@a@bビアンカ「お城の中は\n\tひんやりして　涼しいわね。\n\t生きかえった　気分だわ。\n@c0@"
21:
  de: "@aNera@bHier ist es aber wirklich makellos sauber, nicht? Es ist kaum ein Körnchen Sand zu sehen.\n@c0@"
  en: "@aNera@bThey keep this place incredibly clean, don't they? There's hardly a speck of sand to be seen.\n@c0@"
  es: "@aNera@bEste sitio está extraordinariamente pulito, ¿no crees? No se ve ni una mota de arena.\n@c0@"
  fr: "@aNera@bCet endroit est particulièrement bien entretenu, n'est-ce pasⓡ Il n'y a pas un grain de sable\nqui traîne.\n@c0@"
  it: "@aNera@bMa come faranno a tenere questo posto così pulito?!\nNon c'è un granello di sabbia in giro a pagarlo oro!\n@c0@"
  ja: "@a@bフローラ「お城の中　ずいぶん\n\tきれいに　してありますのね。\n\t砂も　ほとんど　落ちていませんわ。\n@c0@"
22:
  de: "@aBianca@bWie schade. Es wird schwer sein, die Nachkommen des legendären Helden zu finden, wenn wir nicht wissen, was aus ihm geworden ist.\n@c0@"
  en: "@aBianca@bThat's a shame. It's goin' to be hard to find the legendary hero's descendants if we dun't know\r\nwhat happened to 'em.\n@c0@"
  es: "@aBianca@b¡Qué lástima! Va a ser difícil encontrar a los descendientes del héroe legendario si no sabemos lo que les pasó.\n@c0@"
  fr: "@aBianca@bC'est dommage. On va avoir du mal à trouver les descendants du héros légendaire si on ne sait pas\r\nce qu'ils sont devenus.\n@c0@"
  it: "@aBianca@bPeccato che non possa aiutarci! Sarà difficile scoprire dove sono i discendenti dell'Eroe Leggendario, se non sappiamo che fine ha fatto lui...\n@c0@"
  ja: "@a@bビアンカ「残念だわ。　勇者の子孫が　\n\tその後　どうなったかが　わからないと\n\t探しようがないじゃない……。\n@c0@"
23:
  de: "@aNera@bVielleicht leben die Nachkommen des legendären Helden einfach irgendwo ganz unauffällig mit ihren Nachbarn zusammen.\n@c0@"
  en: "@aNera@bMaybe the legendary hero's descendants are just living quietly somewhere like normal people. \n@c0@"
  es: "@aNera@bQuizá los descendientes del héroe legendario están llevando una vita tranquila como personas normales.\n@c0@"
  fr: "@aNera@bPeut-être que les descendants du héros légendaire mènent une vie paisible quelque part, comme\r\ndes gens normaux.\n@c0@"
  it: "@aNera@bForse gli eredi dell'Eroe Leggendario vivono tranquillamente da qualche parte, senza avere idea di chi fosse il loro mitico antenato!\n@c0@"
  ja: "@a@bフローラ「勇者さまの子孫たちは\n\tどこかで　ひっそりと\n\t暮らしているのかしら……。\n@c0@"
24:
  de: "@aBianca@bMeine Güte. Nicht schlecht, was? Erst reist er als Kumpel des legendären Helden durch die Welt und dann baut er sich auch noch ein Schloss.\n@c0@"
  en: "@aBianca@bBlimey. He did well, eh? First he was mates with the legendary hero, and then he built his own castle!\n@c0@"
  es: "@aBianca@b¡Cuernos! Le fue bastante bien, ¿eh? ¡Primero fue amigo del héroe legendario, y luego se construyó su propio castillo!\n@c0@"
  fr: "@aBianca@bIl s'en est sacrément bien sorti, heinⓡ D'abord,\nil fait copain-copain avec le héros légendaire et ensuite, il construit son propre châteauⓠ\n@c0@"
  it: "@aBianca@bAccidenti, che tipo!\nNon solo era amico dell'Eroe Leggendario, ma si è anche costruito un regno tutto suo! Niente male, eh?\n@c0@"
  ja: "@a@bビアンカ「さすがね。\n\t勇者の　お供ともなると\n\t一国一城の　あるじになれるのね。\n@c0@"
25:
  de: "@aNera@bSicher ist das der Grund, weshalb die Leute hier so viel von dem legendären Helden reden. Der Erbauer des Schlosses war mit ihm befreundet.\n@c0@"
  en: "@aNera@bThat must be why there's so much talk about the legendary hero here. The person who built the castle was a friend of his.\n@c0@"
  es: "@aNera@bEsa desde de ser la razón por la que se habla tanto aquí del héroe legendario. La persona que construyó il castello era amigo suyo.\n@c0@"
  fr: "@aNera@bC'est sans doute pour ça que les gens d'ici parlent autant du héros légendaire. Celui qui a construit ce château était l'un de ses amis.\n@c0@"
  it: "@aNera@bEcco perché qui si parla tanto dell'Eroe Leggendario...\nIl fondatore del Regno di Faraonia era un suo amico!\n@c0@"
