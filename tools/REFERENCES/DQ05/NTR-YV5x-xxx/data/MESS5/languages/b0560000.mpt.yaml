0:
  de: "@a%0%a001240@bHast du den kleinen Raum am Eingang gesehen, Papa? Was der wohl für einen Zweck hat?\n@c0@"
  en: "@a%0%a001240@bDid you see that little room by the entrance, Dad? What do you think it's for?\n@c0@"
  es: "@a%0%a001240@bPapi, ¿has visto esa pequeña sala junto a la entrada? ¿Para qué servirá?\n@c0@"
  fr: "@a%0%a001240@bTu te souviens de cette petite pièce près de l'entrée, papaⓡ À ton avis, elle sert à quoiⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, hai visto la piccola stanza vicino all'ingresso?\nHai idea di cosa si tratti?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\t門のところに小部屋があるみたいだよ。\n\tいったい　何の部屋だろう……。\n@c0@"
1:
  de: "@a%0%a001240@bDieses Gebäude ist unglaublich. Wie haben sie es bloß geschafft, so etwas auf einem Berggipfel zu erbauen!\n@c0@"
  en: "@a%0%a001240@bThis building's incredible. I can't imagine how\nthey managed to build something so huge on\ntop of a mountain!\n@c0@"
  es: "@a%0%a001240@bEste edificio es increíble. ¡No se me ocurre cómo consiguieron construir algo tan grande en la cima de una montaña!\n@c0@"
  fr: "@a%0%a001240@bCe bâtiment est incroyable. J'ai du mal à comprendre comment ils ont réussi à construire quelque chose d'aussi gros en haut d'une montagne.\n@c0@"
  it: "@a%0%a001240@bChe edificio incredibile!\nCome avranno fatto a costruire una cosa del genere in cima a una montagna?!\n@c0@"
  ja: "@a@b%a001240「すごく　りっぱな建物だね。\n\tこんな　高い山の頂上に\n\tどうやって　造ったんだろ？\n@c0@"
2:
  de: "@a%0%a001240@bBrrr. Ein bisschen frisch hier, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bBrrr. It's a bit c-c-cold here, isn't it, D-D-Dad?\n@c0@"
  es: "@a%0%a001240@bBrrr... Hace bastante frío, ¿no crees papá?\n@c0@"
  fr: "@a%0%a001240@bBrrr. Il fait un peu f-froid, tu ne trouves pas,\np-papaⓡ\n@c0@"
  it: "@a%0%a001240@bSto gelando!\nFa un freddo cane!\n@c0@"
  ja: "@a@b%a001240「あう～　ぶるぶる……。\n\tお…お父さん　なんだか寒いね。\n@c0@"
3:
  de: "@a%0%a001240@bWahrscheinlich weil wir hier so weit oben sind. Über den Wolken. Brrr.\n@c0@"
  en: "@a%0%a001240@bI s-s-suppose it's because we're high up.\nWe're even above the c-c-clouds. Brrr.\n@c0@"
  es: "@a%0%a001240@bI-imagino que es por la altitud.\nEstamos por encima de las n-n-nubes Brrr...\n@c0@"
  fr: "@a%0%a001240@bJe s-s-suppose que c'est parce qu'on est haut.\nOn est même au-dessus des n-n-nuages. Brrr.\n@c0@"
  it: "@a%0%a001240@bDev'essere l'altitudine...\nSiamo addirittura sopra le nuvole!\n@c0@"
  ja: "@a@b%a001240「やっぱ　高い所は\n\t寒いんだな。　雲の上だもんなあ……。\n\tぶるぶるぶる……。\n@c0@"
4:
  de: "@a%0%a001250@bHah, hah, hah... Komisch. Ich bin außer Atem, obwohl ich gar nichts tue...\n@c0@"
  en: "@a%0%a001250@bHahh, hahh, hahh... It's weird. Why am I so out of breath even though I'm not...hahh...doing anything?\n@c0@"
  es: "@a%0%a001250@bAaah, aaah, aaah... ¡Qué raro! ¿Por qué me cuesta tanto respirar si no... aaah... estoy haciendo nada?\n@c0@"
  fr: "@a%0%a001250@bHan, han, han... C'est bizarre. Pourquoi je suis\nsi essoufflée alors que... han... je ne fais rienⓡ\n@c0@"
  it: "@a%0%a001250@bHaaahhh... Haaahhh... Come maaahi mi mancaaah il fiaaahto... nonostaaahnte non stia faaahcendo niente...? Haaahhh... Haaahhh...\n@c0@"
  ja: "@a@b%a001250「すーはー　すーはー\n\tあの……　なんにもしてないのに\n\t息が…苦しいの……。\n@c0@"
5:
  de: "@a%0%a001250@bHah, hah, hah...\n@c0@"
  en: "@a%0%a001250@bHahh, hahh, hahh...\n@c0@"
  es: "@a%0%a001250@bAaah, aaah, aaah...\n@c0@"
  fr: "@a%0%a001250@bHan, han, han...\n@c0@"
  it: "@a%0%a001250@bHaaahhh...\n...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@b%a001250「すーはー　すーはー……。\n@c0@"
6:
  de: "@a%0%a001250@bSieh nur, Papa! Unter uns ist eine Wolke! So hoch bin ich noch nie in meinem Leben gewesen!\n@c0@"
  en: "@a%0%a001250@bLook, Dad! There's a cloud underneath us!\nI've never been this high up before.\n@c0@"
  es: "@a%0%a001250@b¡Eh, papi! ¡Hay una nube debajo de nosotros!\nNunca había estado a tanta altura.\n@c0@"
  fr: "@a%0%a001250@bRegarde papaⓠ Il y a un nuage en dessousⓠ\nJ'ai jamais été aussi haut.\n@c0@"
  it: "@a%0%a001250@bGuarda, papà!\nSotto di noi ci sono le nuvole...!\nBrrr! Che paura! Non ero mai stata tanto in alto!\n@c0@"
  ja: "@a@b%a001250「お父さん　見て！\n\t雲が　下にあるよ。\n\tわたし　こんな高いところ　初めて。\n@c0@"
7:
  de: "@aSancho@bEine gigantisse Tempel auf die Gipfel des Azimuth? Wirkliss unglaubliss!\n@c0@"
  en: "@aSancho@bA giant temple on the top of Mt Azimuth?\r\nEes, ees amazing!\n@c0@"
  es: "@aSancho@b¿Un templo gigante en la cima del Monte Azimut?\n¡Es reteraro!\n@c0@"
  fr: "@aSancho@bUn temple g-géant en haut du m-mont Azimutⓡ\nC'est incroyableⓠ\n@c0@"
  it: "@aSancho@b¿Un tempio gigante en cima al Monte Azimuth?\r\n¡Es incredibile!\n@c0@"
  ja: "@a@bサンチョ「ウワサに聞く\n\tセントベレス山の頂きに　よもや\n\tこれほどの　神殿があるとは……。\n@c0@"
8:
  de: "@aSancho@bSiehst du? Iss bin immer noch eine junge Mann. Es gibt noch so viel auf der Welt, das iss nisst kenne!\n@c0@"
  en: "@aSancho@bYou esee? I am estill just a young man.\r\nThere ees eso much I no know about the world!\n@c0@"
  es: "@aSancho@b¿Lo ves? Pues soy un hombre joven todavía.\n¡Me queda mucho por conocer del mundo!\n@c0@"
  fr: "@aSancho@bT-Tu voisⓡ J-Je suis encore oun jeune hombre. Il y a tant de choses que je ne c-connais pasⓠ\n@c0@"
  it: "@aSancho@b¿Quantas cosas estupefacentes que yo ancora no conosco ce saranno al mundo?\n@c0@"
  ja: "@a@bサンチョ「このサンチョ　まだまだ\n\t未熟者でした。　世の中には\n\t知らないことが　なんと多いことか。\n@c0@"
9:
  de: "@aOtto@bDieser Zenithdrache ist schon unglaublich... Dass er einfach so über den Wolken fliegen kann.\n@c0@"
  en: "@aTuppence@bThat Zenith Dragon is rather spectacular, being able to fly up above the clouds like this.\n@c0@"
  es: "@aAlazar@bEl Dragón de Zenithia es todo un espectáculo, qué forma de surcar los cielos.\n@c0@"
  fr: "@aInnocent@bQue ce Dragon du Zénith soit capable de voler\r\nau-dessus des nuages, c'est incroyable.\n@c0@"
  it: "@aSimon@bIl Drago di Zenithia è una creatura davvero portentosa.\nRiesce persino a volare al di sopra delle nuvole!\n@c0@"
  ja: "@a@bピピン「雲の上まで飛べるとは\n\tさすがは　マスタードラゴン！\n@c0@"
10:
  de: "@aOtto@bEs ist kaum vorstellbar, dass er vor kurzem noch der komische Dr. Ache war, mit dem wir so viel Zeit verbracht haben.\n@c0@"
  en: "@aTuppence@bIt's hard to believe He's the same creature as that funny Dr Agon we were spending our time with not so long ago.\n@c0@"
  es: "@aAlazar@bResulta difícil creer que sea la misma criatura que el Dr. Agón con el que íbamos hace nada.\n@c0@"
  fr: "@aInnocent@bJ'ai du mal à croire que c'est la même créature\r\nque ce drôle de Dr Agon qui nous accompagnait\r\nil y a encore peu de temps.\n@c0@"
  it: "@aSimon@bMi riesce difficile pensare che si fosse trasformato nel Dottor Agon, imbranato e un po' tontolone, che abbiamo fatto scendere da quel carrello...\n@c0@"
  ja: "@a@bピピン「あれが　ついこの間まで\n\tプサンさんだったとは\n\tまったく　信じられませんよ。\n@c0@"
11:
  de: "@a%0%a001240@bIst das... meine Rüstung?\n@c0@"
  en: "@a%0%a001240@bIs that... Is that armour mine?\n@c0@"
  es: "@a%0%a001240@b¿Esa...? ¿Esa armadura es para mí?\n@c0@"
  fr: "@a%0%a001240@bCette... Cette armure est à moiⓡ\n@c0@"
  it: "@a%0%a001240@bQuella è la mia armatura?\n@c0@"
  ja: "@a@b%a001240「あっ　あのよろいは\n\tボクの……？\n@c0@"
12:
  de: "@a%0%a001240@bPapa! Was machst du da? Wenn das die Zenithiarüstung ist, müssen wir sie uns holen!\n@c0@"
  en: "@a%0%a001240@bDad! What are you doing? If that's the Zenithian Armour, then we have to have it!\n@c0@"
  es: "@a%0%a001240@b¡Papá! ¿Qué estás haciendo? ¡Si es la Armadura de Zenithia, tenemos que conseguirla!\n@c0@"
  fr: "@a%0%a001240@bPapaⓡ Qu'est-ce que tu faisⓡ\nSi c'est l'Armure zénithienne,\nil faut qu'on la récupèreⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ma che fai?!\nSe quella è davvero l'Armatura Zenithiana, allora dobbiamo assolutamente impossessarcene!\n@c0@"
  ja: "@a@b%a001240「どうしたの　お父さん！\n\t伝説の勇者のよろいなら\n\t絶対　手に入れなきゃ！\n@c0@"
13:
  de: "@a%0%a001240@b... Oh, verstehe. Du willst dich erst gut vorbereiten, damit wir auch garantiert gewinnen, was? Ja, das ist wirklich klug...\n@c0@"
  en: "@a%0%a001240@b...Oh, I get it. You're planning on going away to get ready first so that we definitely win, right?\nThat's really clever.\n@c0@"
  es: "@a%0%a001240@b... ¡Ah!, ya entiendo. Tienes pensado prepararnos primero para asegurar la victoria, ¿verdad?\n¡Qué inteligente!\n@c0@"
  fr: "@a%0%a001240@b... Oh, je comprends. Tu veux d'abord qu'on aille se préparer pour être sûrs de remporter la victoire, c'est çaⓡ C'est super malin.\n@c0@"
  it: "@a%0%a001240@bAh, ho capito! Vuoi tornare più tardi, dopo che ci saremo preparati in maniera adeguata, non è così? Ottima mossa!\n@c0@"
  ja: "@a@b%a001240「……って　わかった！\n\t準備を　ととのえてから\n\tたたかうんだね？　さっすがー！\n@c0@"
14:
  de: "@a%0%a001250@bPuh. Diesem Kampf konnten wir gerade noch mal entgehen.\n@c0@"
  en: "@a%0%a001250@bPhew. Looks like we managed to avoid a bit of a\nfight there.\n@c0@"
  es: "@a%0%a001250@b¡Uff! Parece que nos hemos conseguido librar de una batalla tremenda.\n@c0@"
  fr: "@a%0%a001250@bPfiou. J'ai l'impression qu'on a évité un sacré combat.\n@c0@"
  it: "@a%0%a001250@bC'è mancato poco!\nPer fortuna siamo riusciti a evitare lo scontro...\n@c0@"
  ja: "@a@b%a001250「今の人を　おこらせずに\n\tすんだみたい。　ほっ……。\n@c0@"
15:
  de: "@aSancho@bDiese Señor, er hat nisst verstanden, dass wir gar nisst von hier sind, eh?\n@c0@"
  en: "@aSancho@bThees señor, he no realise we are no from thees place like heem, eh?\n@c0@"
  es: "@aSancho@bPues este cuate no se dio cuenta de que no somos de aquí, como él, ¿no?\n@c0@"
  fr: "@aSancho@bC-Ce señor, il ne réalise pas qu'on n'est p-pas d'ici comme lui.\n@c0@"
  it: "@aSancho@b¿Esto señor no se es accorto que nosotros siamo intrusos, eh?\n@c0@"
  ja: "@a@bサンチョ「ふむ。　今の者\n\tわれわれが　地上から来たとは\n\t気づいていなかったようです。\n@c0@"
16:
  de: "@aSancho@bDu bist so klug geworden, Chico. Si, du bist eine wahre Meister der Taktik.\n@c0@"
  en: "@aSancho@bYou have become very clever like thees, friend.\r\nSí, you are a master of the tactics now.\n@c0@"
  es: "@aSancho@bEres muy inteligente, chamaco.\nAhora nomás que eres un maestro de la táctica.\n@c0@"
  fr: "@aSancho@bT-Tu es devenu très m-malin, chico.\r\nSi, t-tu es oun maître de la tactique.\n@c0@"
  it: "@aSancho@bHai evitato un escontro inutile, chico.\nNo sei solo un grande guerrero, ma anche un excelente estratega...\n@c0@"
  ja: "@a@bサンチョ「まず　探りを入れるとは\n\t%a000090王も　なかなかの\n\t策士に　なりましたな。\n@c0@"
17:
  de: "@a%0%a001240@bWarum sollen wir denn keine Seele mehr haben? Das versteh ich nicht...\n@c0@"
  en: "@a%0%a001240@bWhy should we be soulless?\nThat's a bit of a weird thing to say.\n@c0@"
  es: "@a%0%a001240@b¿Por qué se supone que no debemos tener alma?\nEs una cosa un poco rara.\n@c0@"
  fr: "@a%0%a001240@bPourquoi on n'aurait pas d'âmeⓡ\nC'est bizarre de dire ça.\n@c0@"
  it: "@a%0%a001240@bⓕSenzaspiritoⓖ?!\nMa che dice quel tipo?!\nIo lo spirito ce l'ho, e me lo tengo ben stretto!\n@c0@"
  ja: "@a@b%a001240「たましいが\n\tどうのこうのって　言ってたね。\n\tなんのことだろう？\n@c0@"
18:
  de: "@a%0%a001250@bWar dieser Soldat ein Monster? Dann muss dieser Tempel ja... Hmm.\n@c0@"
  en: "@a%0%a001250@bWas that soldier a monster?\nThen that means this temple is... Hmm.\n@c0@"
  es: "@a%0%a001250@b¿Ese soldado era un monstruo?\nEso quiere decir que este templo es... Mmm...\n@c0@"
  fr: "@a%0%a001250@bCe soldat était un monstreⓡ\nDans ce cas, ce temple est... mmm.\n@c0@"
  it: "@a%0%a001250@bQuella guardia sembrava un mostro...\nTemo che questo tempio ci riserverà non poche sorprese...\n@c0@"
  ja: "@a@b%a001250「あの兵士さん\n\t魔物さんだったの？\n\tじゃあ　この神殿は　やっぱり……。\n@c0@"
19:
  de: "@aOtto@bBei der Göttin. Der Herr war aber ganz schön aufgebracht, was?\n@c0@"
  en: "@aTuppence@bDear me. He was rather alarming, wasn't he?\n@c0@"
  es: "@aAlazar@bMadre mía. Era un tanto alarmante, ¿verdad?\n@c0@"
  fr: "@aInnocent@bEh bien, il n'était pas vraiment rassurant, heinⓡ\n@c0@"
  it: "@aSimon@bBrrrrr!\nChe creatura inquietante!\n@c0@"
  ja: "@a@bピピン「いや～　おそろしい魔物でした。\n@c0@"
20:
  de: "@a%0%a001240@bDas ist also die Rüstung, die der legendäre Held getragen hat. Wow! Sie ist so schön!\n@c0@"
  en: "@a%0%a001240@bSo this is the armour the legendary hero wore!\nWow! It's so cool!\n@c0@"
  es: "@a%0%a001240@b¡Es la armadura que llevaba el héroe legendario!\n¡Vaya! ¡Es genial!\n@c0@"
  fr: "@a%0%a001240@bC'est donc l'armure que le héros légendaire portaitⓠ Waouhⓠ C'est vraiment génialⓠ\n@c0@"
  it: "@a%0%a001240@bAllora quest'armatura è stata indossata dall'Eroe Leggendario?!\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「これが　伝説の勇者が\n\t身につけていた　よろいかあ！\n\tめちゃくちゃ　かっこいいねっ！\n@c0@"
21:
  de: "@a%0%a001250@bGehört die Rüstung jetzt auch %a001240, Papa? Das ist ungerecht! ... Ähm, ich meine natürlich, das ist wunderbar...\n@c0@"
  en: "@a%0%a001250@bDoes this armour belong to %a001240 now too? That's so unfair! ...Um, I mean, how lovely!\n@c0@"
  es: "@a%0%a001250@b¿Ahora esta armadura también pertenece a %a001240? ¡No es justo! ... Mmm, quiero decir, ¡qué suerte!\n@c0@"
  fr: "@a%0%a001250@bL'armure appartient à %a001240 aussi, alorsⓡ C'est vraiment pas justeⓠ ... Euh, enfin, c'est superⓠ\n@c0@"
  it: "@a%0%a001250@bAdesso questa bellissima armatura appartiene a %a001240, non è vero?\nUffà! Non è giusto! Anch'io ne voglio una!\n@c0@"
  ja: "@a@b%a001250「この　よろいも\n\tお兄ちゃんのなの？　ズルイ……。\n\tううん　なんでもないです。\n@c0@"
22:
  de: "@aSancho@bAn eine solche Platz hätte iss die legendäre Rüstung nisst vermutet.\n@c0@"
  en: "@aSancho@bI no expect to find the legendary armour een a\r\nplace like thees.\n@c0@"
  es: "@aSancho@bPues no esperaba encontrar la armadura legendaria en un sitio como este.\n@c0@"
  fr: "@aSancho@bJ-Je ne m'attendais pas à t-trouver l'armure légendaire d-dans oun endroit comme ça.\n@c0@"
  it: "@aSancho@bNo me sarei mai aspettato che l'Armatura Zenithiana fosse custodita aquí...\n@c0@"
  ja: "@a@bサンチョ「伝説のよろいが\n\tこんなところに　あったとは……。\n\tさがしても　見つからないわけです。\n@c0@"
23:
  de: "@aOtto@bUff! Sie ist ganz schön schwer, net? Hm, das bedeutet wohl, dass ich net das Zeug für solch eine Rüstung hab...\n@c0@"
  en: "@aTuppence@bOof! It's rather heavy, isn't it? I suppose that just means I'm not cut out for this kind of armour.\n@c0@"
  es: "@aAlazar@b¡Uuf! Es muy pesada, ¿no? Imagino que entonces no está hecha para mí.\n@c0@"
  fr: "@aInnocent@bEh bienⓠ Elle est plutôt lourde, heinⓡ Je suppose\nque ça signifie juste que je ne suis pas fait pour\nla porter.\n@c0@"
  it: "@aSimon@bDiamine, quanto pesa! Non riuscirei mai a indossare quest'armatura in battaglia! Temo proprio di non essere tagliato per il ruolo di Eroe Leggendario...\n@c0@"
  ja: "@a@bピピン「お…重たい　よろいですね。\n\tボクには　これを身につける\n\t資格がないってことでしょうか……。\n@c0@"
24:
  de: "@a%0%a001240@bEr glaubt wohl, wir gehören hierhin.\n@c0@"
  en: "@a%0%a001240@bLooks like he thinks we're part of the following.\n@c0@"
  es: "@a%0%a001240@bParece que cree que somos miembros del culto.\n@c0@"
  fr: "@a%0%a001240@bOn dirait qu'il croit que nous sommes aussi\ndes adeptesⓡ\n@c0@"
  it: "@a%0%a001240@bCrede che siamo qui per pregare...\n@c0@"
  ja: "@a@b%a001240「ボクたちを　信者と\n\tまちがえているみたいだね。\n@c0@"
25:
  de: "@a%0%a001250@bWas ist das für ein Ort? All die Leute hier sehen so seltsam aus...\n@c0@"
  en: "@a%0%a001250@bWhat is this place? It's full of lots of really\nstrange-looking people.\n@c0@"
  es: "@a%0%a001250@b¿Qué lugar es este? Está repleto de gente extraña.\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce que c'est que cet endroitⓡ\nIl y a plein de gens vraiment bizarres.\n@c0@"
  it: "@a%0%a001250@bHai visto come sono strane le persone che si trovano qui dentro?\n@c0@"
  ja: "@a@b%a001250「なに　あそこ？\n\tへんな人たちが　いっぱい　いるよ。\n@c0@"
26:
  de: "@aSancho@bEr kann siss wohl nisst vorstellen, dass auch noch andere Leute hierher kommen, eh?\n@c0@"
  en: "@aSancho@bHe can no imagine any other people, they gonna come eenside, eh?\n@c0@"
  es: "@aSancho@bNo se imagina que otra gente pueda entrar, ¿eh?\n@c0@"
  fr: "@aSancho@bIl n'a p-pas pensé que d'autres gens p-pouvaient entrer, heinⓡ\n@c0@"
  it: "@aSancho@bAquí possono entrare solo los seguaces della Setta de Zugzwang.\n@c0@"
  ja: "@a@bサンチョ「まさか　ほかの人間が\n\tここに入ってくるとは\n\t想像もつかないんでしょうね。\n@c0@"
27:
  de: "@aSancho@bWir müssen so tun, als gehören wir dazu, sonst er wird noch misstrauiss.\n@c0@"
  en: "@aSancho@bWe must pretend we are worshippers eso he no theenk we are esuspicious.\n@c0@"
  es: "@aSancho@bAhorita debemos hacernos pasar por seguidores del culto para que no sospeche, nomás.\n@c0@"
  fr: "@aSancho@bOn doit f-faire semblant de v-venir prier,\r\nsinon ce sera louche.\n@c0@"
  it: "@aSancho@bSi ce comportiamo como fanno las altras personas, no sospetteranno de nosotros...\n@c0@"
  ja: "@a@bサンチョ「ここは　ひとつ\n\t信者のふりをして　入りこみましょう。\n@c0@"
28:
