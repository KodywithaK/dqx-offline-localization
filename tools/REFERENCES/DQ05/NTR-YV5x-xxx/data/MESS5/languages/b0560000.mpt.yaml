  ja: "@a@bサンチョ「今は　とにかく\n\t%a001230さまを　もとの姿に\n\tもどすことを　考えましょう。\n@c0@"
57:
  de: "@aSancho@bSi, diese Señora Magda war nur eine Monster. Aber trotzdem... Wenigstens du bist jetzt sisser, dass deine Madre in die Unterwelt ist.\n@c0@"
  en: "@aSancho@bSí, thees señora Mada, eshe was just a monster. But estill... Now you can be esure your madre, eshe ees een the underworld.\n@c0@"
  es: "@aSancho@bPues esta señora Perséfone, nomás que era un puro monstruo. Pero aún así... ¡Ahorita estamos seguros de que tu madrecita está en el inframundo!\n@c0@"
  fr: "@aSancho@bSi, cette señora Magdalena, c'était oun m-monstre. Mais... tu peux être s-sûr que ta madre est dans le mundo souterrain.\n@c0@"
  it: "@aSancho@bEsta señora no era Mada, ma un mostro.\nAhora siamo seguros que tua madre está nel Regno de los Inferos.\n@c0@"
  ja: "@a@bサンチョ「にせ者でしたが　あれは\n\tたしかに　マーサさまのお姿でした。\n\tやはり　マーサさまは　魔界に……。\n@c0@"
58:
  de: "@aOtto@bDer Gottkönig Korol... Irgendwann werden wir unsere Kräfte bestimmt im Kampf mit ihm messen müssen.\n@c0@"
  en: "@aTuppence@bThe God-King, Korol... No doubt the time will come when we have to pit our strength against him.\n@c0@"
  es: "@aAlazar@bEl dios-rey, Korol... Sin duda llegará el momento en que deberemos enfrentarnos a él.\n@c0@"
  fr: "@aInnocent@bLe dieu-roi Korol... À un moment ou à un autre, nous devrons l'affronter.\n@c0@"
  it: "@aSimon@bIl ⓕDivino Re Krocorovⓖ...\nPrima o poi ce lo troveremo di fronte, e temo che non sarà un incontro piacevole!\n@c0@"
  ja: "@a@bピピン「イブール……。　ボクたち\n\tその　イブールとかいう教祖とも\n\tたたかうことに　なるんでしょうか？\n@c0@"
59:
  de: "@a%0%a001240@bDann war es also dieser Korol, der Mama verflucht und in eine Statue verwandelt hat?\n@c0@"
  en: "@a%0%a001240@bNo way! So this Korol character placed a curse on Mum as well as turning her into a statue?\n@c0@"
  es: "@a%0%a001240@b¡Imposible! ¿Ese tal Korol lanzó una maldición sobre mamá y la convirtió en estatua?\n@c0@"
  fr: "@a%0%a001240@bN'importe quoiⓠ Alors ce Korol a transformé maman\nen statue et en plus, il lui a jeté une malédictionⓡ\n@c0@"
  it: "@a%0%a001240@bChe cosa?!\nQuesto Krocorov ha lanciato una maledizione sulla mamma e ha trasformato anche lei in una statua?!\n@c0@"
  ja: "@a@b%a001240「お母さん\n\t石に　されたうえに　呪いまで……？\n@c0@"
60:
  de: "@a%0%a001240@bGlaubst du, der Fluch wird aufgehoben, wenn es uns gelingt, ihn zu besiegen?\n@c0@"
  en: "@a%0%a001240@bDo you think the curse will be lifted if we manage to defeat him?\n@c0@"
  es: "@a%0%a001240@b¿Si logramos derrotarle conseguiremos acabar con la maldición?\n@c0@"
  fr: "@a%0%a001240@bTu crois que la malédiction disparaîtra si on le batⓡ\n@c0@"
  it: "@a%0%a001240@bForse, se lo sconfiggessimo, la maledizione verrebbe cancellata...\n@c0@"
  ja: "@a@b%a001240「そのイブールってヤツを\n\tたおせば　お母さんの呪いを\n\tといてあげられるのかな？\n@c0@"
61:
  de: "@a%0%a001250@bAlso ist das wirklich Mama, ja?\n@c0@"
  en: "@a%0%a001250@bSo...that really is Mum, then?\n@c0@"
  es: "@a%0%a001250@bEntonces, ¿es mamá de verdad?\n@c0@"
  fr: "@a%0%a001250@bAlors... c'est vraiment mamanⓡ\n@c0@"
  it: "@a%0%a001250@bAllora quella è davvero la mamma...\n@c0@"
  ja: "@a@b%a001250「じ　じゃあ　やっぱり\n\tあれが　お母さん……？\n@c0@"
62:
  de: "@aOtto@bUnd sie haben net g'merkt, dass der legendäre Held schon vor Jahren geboren wurde? Diese Monster können ziemlich ignorant sein...\n@c0@"
  en: "@aTuppence@bFancy not even realising that the legendary hero was born years ago. These monster types are terribly ignorant.\n@c0@"
  es: "@aAlazar@bEs curioso que no supieran que el héroe legendario ya había nacido. Estos monstruos están en la parra.\n@c0@"
  fr: "@aInnocent@bIl n'a même pas réalisé que le héros légendaire était déjà né il y a quelques années. C'est fou ce que les monstres sont stupides.\n@c0@"
  it: "@aSimon@bQuesti mostri sono incredibilmente ignoranti!\nNon sapevano nemmeno che l'Eroe Leggendario è nato qualche anno fa!\n@c0@"
  ja: "@a@bピピン「勇者が　生まれているのを\n\tいまだに　知らないなんて\n\t魔物って　意外と　マヌケなんですね。\n@c0@"
63:
  de: "@a%0%a001250@bIst das nicht der Junge aus dem Haus, in dem du als Statue standest, Papa? Es ist schön, dass wir ihn retten konnten!\n@c0@"
  en: "@a%0%a001250@bIsn't that boy the one from the house where you stayed when you were a statue, Dad? It's great that we were able to rescue him.\n@c0@"
  es: "@a%0%a001250@bPapá, ¿no es ese el chico de la casa en la que estuviste cuando eras estatua? Qué bien que hayamos podido rescatarlo.\n@c0@"
  fr: "@a%0%a001250@bCe garçon, il n'habitait pas la maison où tu es resté pendant des années quand tu étais une statueⓡ C'est génial qu'on ait pu le sauver.\n@c0@"
  it: "@a%0%a001250@bPapà!\nQuello è il ragazzo che fu rapito dalla casa a cui vendettero la tua statua! L'abbiamo trovato!\n@c0@"
  ja: "@a@b%a001250「今の人　石にされた\n\tお父さんがいた　あの　おうちの人？\n\t助けてあげられて　良かったね。\n@c0@"
64:
  de: "@aSancho@bDas sind großartige Neuigkeiten! Der Padre von diese Muchacho, er wird ja so glückliss sein! (Schnüff)\n@c0@"
  en: "@aSancho@bEes, ees eso wonderful news! Hees papá, he ees gonna be eso, eso happy! (sniff)\n@c0@"
  es: "@aSancho@b¡Pues nomás que son buenas noticias! ¡El papá de este chamaquito se va a poner bien contento! (snif)\n@c0@"
  fr: "@aSancho@bC'est oune bonne nouvelleⓠ Le papá de ce muchacho v-va être si heureuxⓠ (sanglot)\n@c0@"
  it: "@aSancho@b¡Ay, que buena notizia! ¡El padre de quel niño sarà muy feliz de rivedere suo figlio!\r\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あの家の父上の　よろこぶ姿が\n\t目に浮かぶようですよ！\n@c0@"
65:
  de: "@aOtto@bAber es könnte ganz schön gefährlich für ihn werden, alleine von hier nach Hause zu gehen...\n@c0@"
  en: "@aTuppence@bIt could be quite tricky for him to get home from here, though, couldn't it? I wonder how he'll manage.\n@c0@"
  es: "@aAlazar@bPuede resultarle complicado llegar a casa desde aquí, ¿verdad? Me pregunto cómo lo va a conseguir.\n@c0@"
  fr: "@aInnocent@bIl risque d'avoir du mal à rentrer chez lui d'ici, nonⓡ Je me demande comment il va faire.\n@c0@"
  it: "@aSimon@bLa strada verso casa sarà lunga e faticosa, ma la voglia di rivedere la sua famiglia gli darà tutte le energie di cui avrà bisogno!\n@c0@"
  ja: "@a@bピピン「でも　ここから帰るのは\n\tかなり　大変だと思いますよ。\n\tどうするんでしょう？\n@c0@"
66:
  de: "@a%0%a001240@bEine geheime Treppe? Die müssen wir sofort finden!\n@c0@"
  en: "@a%0%a001240@bA hidden staircase? We should go and find it\nright away!\n@c0@"
  es: "@a%0%a001240@b¿Una escalera oculta? ¡Debemos encontrarla lo antes posible!\n@c0@"
  fr: "@a%0%a001240@bUn escalier cachéⓡ Il faut qu'on aille le chercher tout de suiteⓠ\n@c0@"
  it: "@a%0%a001240@bUna scala nascosta, eh?\nAndiamo subito a controllare!\n@c0@"
  ja: "@a@b%a001240「聞いた　お父さん？\n\tさっそく　さがしてみようよ！\n@c0@"
67:
  de: "@a%0%a001250@bWarst du schon einmal hier, Papa? Hm, das dachte ich mir.\n@c0@"
  en: "@a%0%a001250@bHave you been to this place before, Dad?\nHmm, I had a feeling you had.\n@c0@"
  es: "@a%0%a001250@b¿Ya has estado aquí papá?\nMmm, tenía ese presentimiento.\n@c0@"
  fr: "@a%0%a001250@bTu es déjà venu ici avant, papaⓡ\nMmm, je pense que oui.\n@c0@"
  it: "@a%0%a001250@bPapà, conosci questo posto?\nHo la sensazione che tu ci sia già stato...\n@c0@"
  ja: "@a@b%a001250「お父さん　もしかして\n\tこの場所のこと　前から知ってた？\n\tううん　なんとなく　そんな気がして。\n@c0@"
68:
  de: "@aSancho@bDer Altar? Er meint die Ort, wo ist die Statue von %a001230, no?\n@c0@"
  en: "@aSancho@bThe estage?\nHe means the place where ees the estatue of señora %a001230, no?\n@c0@"
  es: "@aSancho@b¿En el altar?\nIgual pues quiere decir en el lugar donde estaba la estatua de la señora %a001230, ¿no?\n@c0@"
  fr: "@aSancho@bLe palierⓡ Il veut p-parler de l'endroit où se trouve la s-statue de la señora %a001230ⓡ\n@c0@"
  it: "@aSancho@b¿El palco?\n¿Pienso que voglia dire el luego donde está la estatua della señora %a001230, no?\n@c0@"
  ja: "@a@bサンチョ「あの台とは\n\t%a001230さまの　石像のある\n\tあの高壇のことでしょうね。\n@c0@"
69:
  de: "@a%0%a001250@bDu musst den Leuten danken und ihnen sagen, dass das doch selbstverständlich war. Wo bleiben denn deine Manieren?\n@c0@"
  en: "@a%0%a001250@bYou have to accept people's thanks gracefully and tell them it was no trouble. That's manners.\n@c0@"
  es: "@a%0%a001250@bHay que aceptar el agradecimiento de la gente y decirles que no pasa nada. Eso es educación.\n@c0@"
  fr: "@a%0%a001250@bIl faut accepter que les gens nous remercient.\nEt on doit leur répondre que ce n'est rien.\nC'est ça les bonnes manières.\n@c0@"
  it: "@a%0%a001250@bLe parole di queste persone mi riempiono di gioia!\nÈ bello poter essere d'aiuto agli altri!\n@c0@"
  ja: "@a@b%a001250「お礼を言われたら\n\tいえいえ　どういたしましてって\n\t言わなくちゃ。\n@c0@"
70:
  de: "@aSancho@bGeopfert? Si, wenn der Tempel fertig geworden wäre, alle Sklaven wären umgebracht worden...\n@c0@"
  en: "@aSancho@bEsacrificed? Sí, when the temple ees completed, all the eslaves, they gonna be keelled.\n@c0@"
  es: "@aSancho@b¿Sacrificado? ¡Ándale!, cuando se terminara el templo nomás que iban a acabar con toditos los pobres esclavos.\n@c0@"
  fr: "@aSancho@bSacrifiésⓡ Si, quand le temple aurait été fini,\ntout le mundo aurait été tué.\n@c0@"
  it: "@aSancho@bSì, claro. A lavoros ultimatos, los eschiavos no sarebbero servitos más a nada, y los avrebbero matados todos...\n@c0@"
  ja: "@a@bサンチョ「イケニエとは……\n\t神殿ができたら　ここにいる者たちを\n\tみな殺しにするつもりだったんですね。\n@c0@"
71:
  de: "@aOtto@bSie ist bestimmt eine hübsche Frau, wenn sie ein wenig zurechtgemacht ist. Das kann man an den Wangenknochen erkennen, wisst Ihr...\n@c0@"
  en: "@aTuppence@bI'd wager that she's rather a lovely specimen when she's smartened up a bit. It's all in the cheek bones, you know.\n@c0@"
  es: "@aAlazar@bApuesto a que en cuanto se adecente estará guapísima. Tiene buenos pómulos.\n@c0@"
  fr: "@aInnocent@bJe dois admettre qu'elle ne serait pas mal\r\ndu tout si elle s'arrangeait un peu. Tout est\r\ndans les pommettes, vous savez.\n@c0@"
  it: "@aSimon@bMa che carina! Maestà, ha visto che fanciulla graz...\r\nEhm, forse non è il momento adatto per parlare di certe cose...\n@c0@"
  ja: "@a@bピピン「さっきの…\n\tかわいい女の子でしたね。　きっと\n\tきれいにしたら　見ちがえますよ。\n@c0@"
72:
  de: "@a%0%a001240@bDie meisten Leute scheinen ein wenig verwirrt zu sein. Ich hoffe, es geht ihnen bald besser.\n@c0@"
  en: "@a%0%a001240@bQuite a few people seem to be a bit dazed.\nI hope they'll be alright.\n@c0@"
  es: "@a%0%a001240@bAlgunos parecen un tanto adormilados.\nEspero que estén bien.\n@c0@"
  fr: "@a%0%a001240@bIl y en a pas mal qui ont l'air bien secoués.\nJ'espère qu'ils vont aller mieux.\n@c0@"
  it: "@a%0%a001240@bTornare in sé dopo essere stati privati della propria volontà dev'essere un'esperienza sconcertante.\n㈡\nImmagino che ci vorrà un po' di tempo prima che queste persone si riprendano del tutto...\n@c0@"
  ja: "@a@b%a001240「ぼんやりしてる人も\n\t多いみたいだけど　大丈夫かなあ……。\n@c0@"
73:
  de: "@aSancho@bEs ist so traurig... All diese Señores und Señoras ⓚⓛ sie sind so lange angelogen worden...\n@c0@"
  en: "@aSancho@bEes, ees eso esad... These señores and señoras, they have been lied to for eso long.\n@c0@"
  es: "@aSancho@bPues qué triste... A estos pobres los engañaron todito el tiempo.\n@c0@"
  fr: "@aSancho@bC'est t-trop triste... Ces señors et ces señoras, on leur a m-menti pendant si longtemps.\n@c0@"
  it: "@aSancho@bSarà una delusion muy grande por estos señores y señoras escoprire que la Setta de Zugzwang los aveva engannatos...\n㈡\n\n¡Però almenos sono vivos y liberos!\n@c0@"
  ja: "@a@bサンチョ「ムリもありません。\n\tきっと　もう　何年も　いつわりの夢を\n\t見せられていたんでしょう。\n@c0@"
74:
  de: "@a%0%a001250@bDie Leute hier müssen also wichtig gewesen sein...\n@c0@"
  en: "@a%0%a001250@bThe people up here must've been the important\nones, then.\n@c0@"
  es: "@a%0%a001250@bEsta gente de aquí arriba debía de ser muy importante.\n@c0@"
  fr: "@a%0%a001250@bCes personnes devaient être des gens importants.\n@c0@"
  it: "@a%0%a001250@bPovero illuso...\n@c0@"
  ja: "@a@b%a001250「こういう台に　あがってる人は\n\tえらい人だったのね。\n@c0@"
75:
  de: "@aOtto@bWenn Korol sich seiner angenommen hat, hat er bestimmt viele schlimme Dinge getan...\n@c0@"
  en: "@aTuppence@bIf Korol took a liking to him, that probably means he did lots of evil things here.\n@c0@"
  es: "@aAlazar@bSi Korol le tomó simpatía, es probable que haya hecho cosas bastante desagradables.\n@c0@"
  fr: "@aInnocent@bSi Korol s'est pris d'affection pour lui, c'est\r\nsans doute qu'il a dû faire plein de choses\r\npeu recommandables ici.\n@c0@"
  it: "@aSimon@bKrocorov ha sfruttato questa povera gente per i suoi biechi scopi. Per quell'essere infame ⓕbeneⓖ è una parola priva di qualsiasi significato...\n@c0@"
  ja: "@a@bピピン「イブールに　気に入られたと\n\tいうことは　あの人　ここで\n\t悪いこと　いっぱいしたんでしょうね。\n@c0@"
76:
  de: "@a%0%a001240@bDie Treppe war direkt am Altar. Nicht sehr gut versteckt, wenn man bedenkt, dass es eine Geheimtreppe sein soll!\n@c0@"
  en: "@a%0%a001240@bSo the stairs were right in the middle of the stage. That's a bit easy to find, considering it was supposed to be a hidden staircase!\n@c0@"
  es: "@a%0%a001240@bEntonces las escaleras estaban en el centro del altar. Eran fáciles de encontrar para ser unas escaleras ocultas.\n@c0@"
  fr: "@a%0%a001240@bAlors l'escalier était au beau milieu du palier.\nIl était plutôt facile à trouver pour un escalier secretⓠ\n@c0@"
  it: "@a%0%a001240@bLe scale erano proprio al centro del palco.\nSe proprio volevano tenerle segrete, avrebbero dovuto nasconderle meglio!\n@c0@"
  ja: "@a@b%a001240「台の真ん中に　階段かあ。\n\tかくし階段っていうわりには\n\tわかりやすかったよね？\n@c0@"
77:
  de: "@a%0%a001250@bWir müssen uns beeilen und Mama helfen. Ich werde mich auch ganz besonders anstrengen.\n@c0@"
  en: "@a%0%a001250@bWe have to hurry up and help Mum.\nI'm going to try really hard to do my bit.\n@c0@"
  es: "@a%0%a001250@bDebemos darnos prisa y ayudar a mamá.\nMe voy a esforzar mucho.\n@c0@"
  fr: "@a%0%a001250@bIl faut qu'on se dépêche d'aller aider maman.\nJe vais faire de mon mieux.\n@c0@"
  it: "@a%0%a001250@bSbrighiamoci a trovare la mamma!\nHo una voglia matta di abbracciarla!\n@c0@"
  ja: "@a@b%a001250「はやく　お母さんを助けなきゃ。\n\tわたし　いっぱい　がんばるね。\n@c0@"
78:
  de: "@aSancho@bDu musst vorsisstig sein, Chico. Deine Onkel Sancho, er hat keine gute Gefühl bei die Sache, weißt du.\n@c0@"
  en: "@aSancho@bYou must be careful, friend. Your Uncle Sancho, he has a bad feeling, you know.\n@c0@"
  es: "@aSancho@bPues nomás ten cuidado, chamaquito. El pobre Sancho tiene un presentimiento bien extraño.\n@c0@"
  fr: "@aSancho@bT-Tu dois faire attention, chico. Ton oncle Sancho,\r\nil a oun mauvais p-pressentiment.\n@c0@"
  it: "@aSancho@bChico, fai attenziones...\nLo zio Sancho siente puzza de bruciatos...\n@c0@"
  ja: "@a@bサンチョ「%a000090王\n\t気をつけてくださいね。\n\tただならぬ気配を　感じますよ。\n@c0@"
79:
  de: "@a%0%a001240@bEr muss ein ganz schöner Feigling sein, wenn er eine geheime Treppe gebaut hat und sich hier unten versteckt!\n@c0@"
  en: "@a%0%a001240@bHe must be a right coward to have built a secret staircase and hidden himself down here!\n@c0@"
  es: "@a%0%a001240@b¡Hay que ser un verdadero cobarde para construir una escalera secreta y esconderse ahí abajo!\n@c0@"
  fr: "@a%0%a001240@bIl doit être sacrément lâche pour avoir construit\nun escalier secret et s'être caché en basⓠ\n@c0@"
  it: "@a%0%a001240@bPenso che la scala segreta ci porterà nella tana di quel vigliacco di Krocorov...\n@c0@"
  ja: "@a@b%a001240「かくし階段をつくって\n\tこんな場所に　かくれてるなんて\n\tきっと　いくじがないヤツだね！\n@c0@"
80:
  de: "@a%0%a001250@bWas ist los, Papa? Du siehst besorgt aus.\n@c0@"
  en: "@a%0%a001250@bWhat's wrong, Dad? You look a bit troubled.\n@c0@"
  es: "@a%0%a001250@b¿Qué ocurre, papá? Pareces preocupado.\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce qu'il y a, papaⓡ Tu as l'air un peu perturbé.\n@c0@"
  it: "@a%0%a001250@bChe ti prende, papà?\nNon ti senti bene?\n@c0@"
  ja: "@a@b%a001250「どうしたの　お父さん？\n\tなんだか　顔つきが\n\t変わったみたい……。\n@c0@"
81:
  de: "@a%0%a001250@bNatürlich... Es war hier, wo du vor all den Jahren als Sklave gefangen gehalten wurdest.\n@c0@"
  en: "@a%0%a001250@bOf course... This is the place where you were made to work as a slave all those years ago.\n@c0@"
  es: "@a%0%a001250@bClaro... Aquí te hicieron trabajar como un esclavo hace tantos años.\n@c0@"
  fr: "@a%0%a001250@bMais oui... C'est là où tu as dû travailler en tant qu'esclave pendant toutes ces années.\n@c0@"
  it: "@a%0%a001250@bHo capito...\nQuesto è il posto dove lavorasti come schiavo tanti anni fa.\n@c0@"
  ja: "@a@b%a001250「そう…　お父さん\n\t昔　ここで　働かされていたのね……。\n@c0@"
82:
  de: "@aSancho@bUnd das ist die Ort, wo du...\n@c0@"
  en: "@aSancho@bAnda! Ees thees place you were...\n@c0@"
  es: "@aSancho@b¡Ándale! Este es el lugar donde...\n@c0@"
  fr: "@aSancho@bAndaⓠ C'est là où tu...\n@c0@"
  it: "@aSancho@b¡Ay de todos los ay!\n¿Esto es el luego maledettos donde tu lavorasti como eschiavo, chico?\n@c0@"
  ja: "@a@bサンチョ「そうでしたか…\n\t%a000090王は　以前　ここで……。\n@c0@"
83:
  de: "@aSancho@bSi, und jetzt du bist wieder hier. Das ist wohl Schicksal, no?\n@c0@"
  en: "@aSancho@bSí, but now you are back again.\r\nEes esome kind of destiny, no?\n@c0@"
  es: "@aSancho@bClaro, pero volviste.\nPues nomás que es cosa del destino, ¿no?\n@c0@"
  fr: "@aSancho@bSi, mais tu es revenu. On p-peut dire que ça faisait p-partie de ton destin, noⓡ\n@c0@"
  it: "@aSancho@bY ahora tu sei de nuevo aquí.\nEl destino te ha chiesto de tornare por escrivere la palabra ⓕfinⓖ a quel capitolo orribile della tua vida.\n@c0@"
  ja: "@a@bサンチョ「しかし　その場所に\n\tまた　もどってくるとは　これも\n\tきっと　何かの因縁でしょう。\n@c0@"
84:
