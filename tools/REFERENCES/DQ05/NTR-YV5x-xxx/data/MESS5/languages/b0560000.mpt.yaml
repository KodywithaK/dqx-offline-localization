138:
  de: "@aSancho@bIss...!\nDas ist...!\nSeñora Magda!\n@c0@"
  en: "@aSancho@bI...!\nEes...!\nSeñora Madaaa!\n@c0@"
  es: "@aSancho@b¡...!\n¡Pero...!\n¡Señora Perséfone!\n@c0@"
  fr: "@aSancho@bJe...ⓠ\nC'est...ⓠ\nSeñora Magdalenaⓠ\n@c0@"
  it: "@aSancho@b¡Ma...!\n...\n¡Señora Maaadaaaaa!\n@c0@"
  ja: "@a@bサンチョ「ぬおおおっ！\n\tマ…　マーサさまぁ！！\n@c0@"
139:
  de: "@aSancho@bIhre Worte, so voller Liebe...\nDu darfst ihre Worte nisst vergessen, Chico. Niemals!\n@c0@"
  en: "@aSancho@bHer words, eso full of love...\r\nYou no forget these words, friend. Never!\n@c0@"
  es: "@aSancho@bSus palabras, llenitas de amor...\nNo olvides esas palabras, chamaquito. ¡Jamás!\n@c0@"
  fr: "@aSancho@bSes paroles... Il y a tellement d'amor...\nN'oublie j-jamais ces mots, chico. Jamaisⓠ\n@c0@"
  it: "@aSancho@bHa detto dellas cosa bellissimas, chico.\nNo dimenticarlas.\nNo dimenticare mai que cosa te ha detto...\n@c0@"
  ja: "@a@bサンチョ「なんという慈愛に満ちた\n\tお言葉！　%a000090王！　今のお言葉\n\t生涯　忘れてはなりませんぞ！\n@c0@"
140:
  de: "@aOtto@bNatürlich. Eine Mutter sorgt immer zuerst für die Sicherheit ihrer Kinder.\n@c0@"
  en: "@aTuppence@bAh yes. A mother always puts the safety and needs of her children first.\n@c0@"
  es: "@aAlazar@b¡Ah, sí! Una madre siempre busca la seguridad de sus hijos.\n@c0@"
  fr: "@aInnocent@bOui, une mère fait toujours passer le bien-être\r\nde ses enfants en premier.\n@c0@"
  it: "@aSimon@bOgni madre ha a cuore la salvezza dei propri figli più di qualsiasi altra cosa al mondo.\n@c0@"
  ja: "@a@bピピン「そうなんですよね。\n\t母というものは　いつでも子供のことを\n\tいちばんに　考えてくれるんです。\n@c0@"
141:
  de: "@aOtto@bMeine Mutter ist da net anders.\n@c0@"
  en: "@aTuppence@bMy mother's just the same.\n@c0@"
  es: "@aAlazar@bMi madre es igual.\n@c0@"
  fr: "@aInnocent@bMa mère est pareille.\n@c0@"
  it: "@aSimon@bMaestà, io...\n...\n...\n@c0@"
  ja: "@a@bピピン「ボクの　母も……。\n@c0@"
142:
  de: "@a%0%a001240@bJetzt weiß ich gar nicht mehr, was wir tun sollen.\n@c0@"
  en: "@a%0%a001240@bNow I'm totally confused about what we should do.\n@c0@"
  es: "@a%0%a001240@bAhora no tengo ni idea de lo que debemos hacer.\n@c0@"
  fr: "@a%0%a001240@bJe ne sais pas trop ce qu'on doit faire, maintenant.\n@c0@"
  it: "@a%0%a001240@bOra non so proprio cosa dobbiamo fare.\n@c0@"
  ja: "@a@b%a001240「……なんだか\n\tボク　どうしていいのか\n\tわからなくなってきたよ。\n@c0@"
143:
  de: "@a%0%a001240@bIch meine, ich verstehe, wie du dich fühlst. Aber ich weiß auch, was Großmutter meint.\n@c0@"
  en: "@a%0%a001240@bI mean, I can understand how you feel, Dad.\nBut I can see where Grandma's coming from too.\n@c0@"
  es: "@a%0%a001240@bEs decir, entiendo como te sientes, papá.\nPero también entiendo la postura de la abuela.\n@c0@"
  fr: "@a%0%a001240@bJe peux comprendre ce que tu ressens, papa,\nmais je vois aussi pourquoi grand-mère dit ça.\n@c0@"
  it: "@a%0%a001240@bPapà, penso di capire cosa provi...\nMa forse nonna Mada ha ragione...\n@c0@"
  ja: "@a@b%a001240「だって　お父さんの気持ちも\n\tおばあちゃんの気持ちも\n\tどっちも　よくわかるんだもん……。\n@c0@"
144:
  de: "@a%0%a001250@bOh! Wie gerne würde ich Großmutter treffen!\n@c0@"
  en: "@a%0%a001250@bOh! I really wish I could get to meet Grandma.\n@c0@"
  es: "@a%0%a001250@b¡Oh! Ojalá pudiera estar con la abuela.\n@c0@"
  fr: "@a%0%a001250@bOh, je voudrais tellement rencontrer grand-mère.\n@c0@"
  it: "@a%0%a001250@bMi piacerebbe tantissimo poter incontrare nonna Mada...\n@c0@"
  ja: "@a@b%a001250「わたし　おばあちゃんに\n\t会いたいよ…　ぐすん……。\n@c0@"
145:
  de: "@aSancho@bDiesmal iss werde gar nissts sagen. Du musst selbst wissen, was du tun möchtest.\n@c0@"
  en: "@aSancho@bThees time I no gonna esay anytheeng.\r\nYou theenk for yourself what you gonna do.\n@c0@"
  es: "@aSancho@bPues ahorita me callo.\nYa tendrás que pensar lo que hay que hacer.\n@c0@"
  fr: "@aSancho@bCette fois, j-je ne vais rien dire. C'est à toi de\r\nd-décider ce que tu dois faire.\n@c0@"
  it: "@aSancho@bYo no te dico nada, chico.\nEsta a ti decidere cosa fare.\n@c0@"
  ja: "@a@bサンチョ「今回ばかりは　このサンチョ\n\tなにも　申しません。　どうすべきかは\n\tご自分で　お考えください。\n@c0@"
146:
  de: "@aSancho@bDenk bloß nisst, iss würde nisst mit dir fühlen, no? Aber du bist die König von Humburg. Du kannst diss nisst ewig auf deine Onkel Sancho verlassen.\n@c0@"
  en: "@aSancho@bBut you no theenk I am cold, okay?\r\nYou are the king of Gotha, My Majesty.\r\nYou can no rely on your Uncle Sancho forever.\n@c0@"
  es: "@aSancho@bPero no pienses que no me importa, ¿ok?\nEs el rey de Pankraz, Majestad.\nNo puede depender siempre de su tito Sancho, nomás.\n@c0@"
  fr: "@aSancho@bMais ne p-pense pas que c'est p-par froideur, heinⓡ\nT-Tu es le roi de G-Gotha, Ma Majesté. Tu ne peux pas te reposer sur ton oncle S-Sancho éternellement.\n@c0@"
  it: "@aSancho@bSei un hombre adulto, y sei anche el Rey de Denim.\nHai muchas responsabilidades verso la tua familia y versos los tuos sudditos.\n㈡\nMa comprendo muy bien los tuos sentimentos de figlio...\n¿Que vuoi fare, chico?\n@c0@"
  ja: "@a@bサンチョ「冷たいようですが\n\t%a000090王は　グランバニアの\n\t王なんですから……。\n@c0@"
147:
  de: "@aOtto@bWenn ich wieder in Humburg bin, werde ich als Allererstes meine Mutter besuchen.\n@c0@"
  en: "@aTuppence@bI'll have to give my old mum a nice shoulder rub when I go home to Gotha.\n@c0@"
  es: "@aAlazar@bCuando regrese a Pankraz le voy a dar un abrazo bien fuerte a mi madre.\n@c0@"
  fr: "@aInnocent@bIl faudra que je serre ma mère dans mes bras quand je rentrerai à Gotha.\n@c0@"
  it: "@aSimon@bQuando tornerò a Denim, abbraccerò mia madre e le dirò che le voglio bene.\n@c0@"
  ja: "@a@bピピン「グランバニアに　もどったら\n\t母さんの肩でも\n\tたたいてこようと思います。\n@c0@"
148:
  de: "@aOtto@bWahrscheinlich macht sie sich große Sorgen um mich, da ist es das Mindeste, dass ich ihr einen Besuch abstatte.\n@c0@"
  en: "@aTuppence@bI'm probably causing her no end of worry and stress at the moment, so it's the least I can do.\n@c0@"
  es: "@aAlazar@bSeguramente le haya causado una gran preocupación, es lo menos que puedo hacer.\n@c0@"
  fr: "@aInnocent@bElle doit se faire un sang d'encre, en ce moment. Alors, c'est le moins que je pourrai faire.\n@c0@"
  it: "@aSimon@bÈ il minimo che possa fare per ripagarla delle preoccupazioni che le ho dato per essere partito per questo viaggio...\n@c0@"
  ja: "@a@bピピン「そうでなくても　ボクは\n\t母さんに　心配ばかりかけている\n\t気がしますから……。\n@c0@"
149:
  de: "@aBianca@bAah... Das ist der Tempel, in dem ich so viele Jahre als Statue verbracht habe.\n@c0@"
  en: "@aBianca@bAah... This is the temple I spent all them years in, stood stock-still as a statue.\n@c0@"
  es: "@aBianca@bAh... En este templo me pasé un montón de años en forma de estatua.\n@c0@"
  fr: "@aBianca@bAah... C'est le temple dans lequel j'ai passé toutes ces années sous forme de statue.\n@c0@"
  it: "@aBianca@bQuesto è il tempio in cui ho trascorso tanti anni, trasformata in una statua di pietra...\n@c0@"
  ja: "@a@bビアンカ「……この神殿は\n\t私が　石像として\n\t何年も　すごした場所ね。\n@c0@"
150:
  de: "@aBianca@bHa ha! Das hört sich vielleicht seltsam an, aber ich werde fast ein wenig sentimental, wenn ich hier bin.\n@c0@"
  en: "@aBianca@bHa ha! This'll probably sound quite daft, but I almost feel a bit sentimental about the place.\n@c0@"
  es: "@aBianca@b¡Ja, ja! A lo mejor suena raro, pero me emociona un poco este sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bHa haⓠ Ça va sûrement paraître assez idiot, mais j'ai comme un petit pincement au cœur.\n@c0@"
  it: "@aBianca@bHah!\nSo che suona stupido, ma credo di essermi affezionata a questo posto...\n@c0@"
  ja: "@a@bビアンカ「うふふ。　バカげてるって\n\t思うかもしれないけど　私には\n\tちょっと　なつかしい場所だわ。\n@c0@"
151:
  de: "@aNera@bIch kann mich kaum an die Jahre erinnern, die ich hier als Statue verbracht habe.\n@c0@"
  en: "@aNera@bI hardly remember anything at all about those years I spent here as a statue.\n@c0@"
  es: "@aNera@bApenas recuerdo niente de los anni que pasé aquí come una estatua.\n@c0@"
  fr: "@aNera@bJe me souviens à peine de toutes ces années que\r\nj'ai passées ici sous forme de statue.\n@c0@"
  it: "@aNera@bNon ricordo nulla degli anni che ho trascorso sotto forma di statua.\n@c0@"
  ja: "@a@bフローラ「私　石像になって\n\tこの神殿にいたことは\n\tほとんど　おぼえていませんの。\n@c0@"
152:
  de: "@aNera@bWahrscheinlich habe ich die meiste Zeit geschlafen.\n@c0@"
  en: "@aNera@bMaybe I was asleep most of the time.\n@c0@"
  es: "@aNera@bA lo mejor estuve dormida tutto ese tempo.\n@c0@"
  fr: "@aNera@bPeut-être que j'ai dormi la plupart du temps.\n@c0@"
  it: "@aNera@bPer me è stato come dormire un sonno lunghissimo e profondo...\n@c0@"
  ja: "@a@bフローラ「私ったら　寝てたのかしら……？\n@c0@"
153:
  de: "@a%0%a001240@bWas ist los, Papa? Was machen wir hier?\n@c0@"
  en: "@a%0%a001240@bWhat's up, Dad? What are we doing here?\n@c0@"
  es: "@a%0%a001240@b¿Qué ocurre, papi? ¿Qué estamos haciendo aquí?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'il y a, papaⓡ Qu'est-ce qu'on fait iciⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, perché siamo qui?\n@c0@"
  ja: "@a@b%a001240「お父さん　どうしたの？\n\tこの神殿に　何か　あるの？\n@c0@"
154:
  de: "@a%0%a001240@bWir haben Mama doch gerettet, sollten wir dann nicht langsam gehen?\n@c0@"
  en: "@a%0%a001240@bWe've rescued Mum now, so we don't have anything left to do here, right?\n@c0@"
  es: "@a%0%a001240@bYa hemos rescatado a mamá, no nos queda nada que hacer aquí, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bOn a sauvé maman, maintenant, alors on n'a plus rien à faire ici, nonⓡ\n@c0@"
  it: "@a%0%a001240@bOra che la mamma è di nuovo con noi, non abbiamo altro da fare in questo posto...\n@c0@"
  ja: "@a@b%a001240「……お母さんも助けたし\n\tこの神殿には　もう\n\tなんにも　ないんじゃないかな？\n@c0@"
155:
  de: "@a%0%a001250@bAn diesem Ort haben wir Mama wiedergefunden... Aber trotzdem gefällt es mir hier nicht besonders...\n@c0@"
  en: "@a%0%a001250@bThis is the place we had our reunion with Mum.\nBut I'd still rather not come here.\n@c0@"
  es: "@a%0%a001250@bAquí es donde nos reunimos con mamá.\nPero prefiero no entrar.\n@c0@"
  fr: "@a%0%a001250@bC'est là qu'on a retrouvé maman, mais j'aurais préféré ne par revenir ici.\n@c0@"
  it: "@a%0%a001250@bQuesto è il luogo dove abbiamo ritrovato la mamma...\nLo odio!\nOdio questo posto con tutte le mie forze!\n@c0@"
  ja: "@a@b%a001250「ここは　お母さんと\n\t会えた場所だけど……\n\tもう　あんまり　来たくないな。\n@c0@"
156:
  de: "@a%0%a001250@bJetzt, wo sie wieder bei uns ist, werde ich nämlich nur ungern an die traurigen Tage erinnert, als wir ohne sie auskommen mussten.\n@c0@"
  en: "@a%0%a001250@bNow she's with us again, I don't see the point in being reminded of those sad times without her.\n@c0@"
  es: "@a%0%a001250@bAhora ha vuelto con nosotros, no tiene sentido recordar todo el tiempo que no estuvo a nuestro lado.\n@c0@"
  fr: "@a%0%a001250@bMaintenant qu'elle est à nouveau avec nous, je ne vois pas l'intérêt de se souvenir de tout ce temps passé sans elle.\n@c0@"
  it: "@a%0%a001250@bOra che siamo di nuovo tutti insieme, non voglio più pensare ai lunghi anni in cui siamo stati separati!\n@c0@"
  ja: "@a@b%a001250「だって　もう　お母さんは\n\t帰ってきてくれたんだし　ここに来ると\n\tさみしかったこと　思い出しちゃうし。\n@c0@"
157:
  de: "@aSancho@bWir haben keine Zeit zu verschenken, Chico. Wenn man auf Reisen ist, man muss immer eine Ziel vor Augen haben...\n@c0@"
  en: "@aSancho@bWe no have time to walk like a dog, friend.\r\nWhen you are travelling, you must always\r\nknow where you are going and go there.\n@c0@"
  es: "@aSancho@bAhorita no es momento de deambular como gallina descabezada.\n㈡\nCuando viajas hay que saber adónde ir y, esto, pues ir allá directamente.\n@c0@"
  fr: "@aSancho@bOn n'a pas le temps de se p-promener, chico.\r\nQuand on voyage, on doit t-toujours se fixer\r\noun objectif et s'y t-tenir.\n@c0@"
  it: "@aSancho@bChico, no abbiamo tiempo da perdere.\r\nPiensa a quale sarà la nuestra próxima destinación y andiamoci subitos. ¡Rapido!\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\t寄り道をしているヒマは　ありません。\n\t旅立ったからには　先を急ぎましょう。\n@c0@"
158:
  de: "@aOtto@bIch habe natürlich Gerüchte über diesen Orden vom Zugzwang gehört. Und ich hatte immer schon ein merkwürdiges Gefühl dabei...\n@c0@"
  en: "@aTuppence@bI'd heard rumours about the Order of Zugzwang, of course. I always had a feeling there was something suspicious about them.\n@c0@"
  es: "@aAlazar@bClaro que había escuchado rumores sobre la Orden de Zugzwang. Siempre tuve la sensación de que ocultaban algo sospechoso.\n@c0@"
  fr: "@aInnocent@bJ'avais entendu des rumeurs sur l'Ordre du Zugzwang, bien sûr. Mais je me suis toujours douté qu'il y avait quelque chose de suspect là-dedans.\n@c0@"
  it: "@aSimon@bNon ho mai avuto simpatia per la Setta di Zugzwang.\nHo sempre pensato che fosse losca e malvagia...\n@c0@"
  ja: "@a@bピピン「光の教団って　ボクも\n\tウワサを聞いたことは　ありましたが\n\tあやしいと思ってたんですよ。　うん。\n@c0@"
159:
  de: "@aGriselda@bHier habe ich also all die Jahre als Statue verbracht.\n@c0@"
  en: "@aDebora@bSo this is where I spent all those years as a statue.\n@c0@"
  es: "@aStefania@bEntonces, fue aquí donde pasé todos esos anni convertida en estatua.\n@c0@"
  fr: "@aPandora@bAlors c'est ici que j'ai passé toutes ces années\r\nsous forme de statue.\n@c0@"
  it: "@aViola@bQui ho trascorso tanti anni, dopo essere stata trasformata in una statua di pietra...\n@c0@"
  ja: "@a@bデボラ「ここが　私が　石像として\n\t過ごした場所ね。\n@c0@"
160:
  de: "@aGriselda@bIch kann mich nicht besonders gut erinnern, aber irgendwie habe ich den Eindruck, als hätten alle vor mir auf den Knien gelegen...\n@c0@"
  en: "@aDebora@bI don't remember it very clearly, but I have this impression that everyone was kneeling before me.\n@c0@"
  es: "@aStefania@bNon lo ricordo bene, ma tengo la impresión de que todos se postraban ante mí.\n@c0@"
  fr: "@aPandora@bJe ne m'en souviens pas très clairement, mais\r\nj'ai cette impression vague que tout le monde s'agenouillait devant moi.\n@c0@"
  it: "@aViola@bNon ricordo nulla di quel periodo, se non che ogni giorno moltissime persone si inginocchiavano dinanzi a me...\n@c0@"
  ja: "@a@bデボラ「よく　覚えてないけど\n\tみんな　私の前に\n\tひざまずいていた気がするわ。\n@c0@"
