  es: "@aDarwin@b¿Cómo han evolucionado los humanos y otros seres de la forma en que lo han hecho? ¿Podrán alguna vez convertirse en seres más poderosos?\n@c0@"
  fr: "@aDarwin@bPourquoi les êtres humains et les autres créatures ont-ils évolué de cette manièreⓡ Et auraient-ils pu devenir plus puissants encoreⓡ\n@c0@"
  it: "@aMack Kihe@bQuale percorso evolutivo hanno seguito gli uomini e le altre creature che vivono nel nostro mondo?\nCome si evolveranno in futuro?\n@c0@"
  ja: "@a@b＊「今は　牢から　出してもらい\n\tこうして　手あつい　かんごを。\n@c0@"
283:
  de: "@aDarwin@bOffenbar gab es einst ein Geheimnis, mit dessen Hilfe sich die Mysterien der Evolution entschlüsseln lassen. Vielleicht die Hand der Göttin?\n@c0@"
  en: "@aDarwin@bIt seems there was once a secret that unlocked these mysteries of evolution. Perhaps it was the hand of the Goddess.\n@c0@"
  es: "@aDarwin@bParece que en un tiempo hubo un secreto que desvelaba los misterios de la evolución. O quizá fuera la mano de la Diosa.\n@c0@"
