  fr: "@aProfesseur Fulbert Fumeux@bPeuhⓠ Vous êtes peut-être %H0860%X%A0110%Xhabillé comme un aventurier%Z%B0110%Xhabillée comme une aventurière%Z%Y%R0000%Xhabillées comme des aventurières%Yhabillés comme des aventuriers%Z%Z, mais vous n'êtes %H0860%X%A0110%Xqu'un lâche%Z%B0110%Xqu'une lâche%Z%Yque des lâches%Z.\n@c0@"
  it: "@aProfessor Pitagora@bBah! Mi %H0860%X%A0110%Xsembravi più coraggioso, ma evidentemente sei solo un capperino da niente%Z%B0110%Xsembravi più coraggiosa, ma evidentemente sei solo una capperina da niente%Z%Y%R0000%Xsembravate più coraggiose, ma evidentemente siete solo delle capperine da niente%Ysembravate più coraggiosi, ma evidentemente siete solo dei capperini da niente%Z%Z...\n@c0@"
  ja: "@a@bベネット「夜になると　その草は\n\tぼんやり光ると　言われとる。\n@c0@"
188:
  de: "@aProfessor Emsich@bIhr haltet meine Forschungen auf. Ich muss Euch bitten zu gehen.\n@c0@"
  en: "@aProfessor Toilen Trubble@bNow, you're getting in the way of my research.\r\nI'll have to ask you to leave.\n@c0@"
  es: "@aProfesor Fumata@bEstás interrumpiendo mi investigación.\r\nDebo pedirte que te vayas.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bEn plus, vous me dérangez dans mes recherches.\nJe dois vous demander de partir.\n@c0@"
  it: "@aProfessor Pitagora@bVia! Fuori dal mio laboratorio!\nNon voglio scapperare nemmeno un secondo di più con gente come %H0860%Xte%Yvoi%Z!\n@c0@"
  ja: "@a@bベネット「どうじゃ？\n\tもう　いっぺん　言おうかの？\n@c0@"
189:
  de: "@aProfessor Emsich@bAaaaaaaah. Ich bin so müüüüüüüde...\n@c0@"
  en: "@aProfessor Toilen Trubble@bAaaaaah. I'm so sleeeeeepy...\n@c0@"
  es: "@aProfesor Fumata@bAaaaaah. Qué sueño tengoooo...\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bOuuuh. Je suis si fatiguéééé...\n@c0@"
  it: "@aProfessor Pitagora@bAaaaaah... Che sooonno...\n@c0@"
  ja: "@a@bベネット「よろしい！\n@c0@"
190:
