375:
  de: "@a@b*: Aber ich werde hart an mir arbeiten und zur besten Wahrsagerin aller Zeiten werden. Sogar noch besser als die Mystische Mridula drüben in Fortuna!\n@c0@"
  en: "@a@b*: But I'm going to work hard and become the best fortune-teller ever, you'll see. Even better than that Mystic Mridula over in Fortuna.\n@c0@"
  es: "@a@b*: ¡Pero ya verás payo! Vⓘia ser la mejoⓘ adivina de toⓘa Fortuna. Y vendrán reyes y de toⓘ a consurtarme.\n@c0@"
  fr: "@a@b*ⓢ Mais je vais travailler dur et devenir la plus grande des voyantes. Je serai même meilleure qu'Irma Cristal, la voyante de Bonaventure.\n@c0@"
  it: "@a@b*: Ma un giorno diventerò una truccatrice di grido!\nE quando sarò famosa, andrò a Fortuna e curerò il look di tutte le ballerine della città!\n@c0@"
  ja: "@a@bこ　これは……。\n%a000120は　たまらず　せきこんだ！\n@c0@"
376:
  de: "@a@b*: Oh! Ihr seid noch nicht bereit dazu? Gut, dann warte ich hier, bis es so weit ist.\n@c0@"
  en: "@a@b*: Oh, you're not quite prepared?\nOkay. I'll be waiting here when you're ready.\n@c0@"
  es: "@a@b*: ¡Ayyy!, ¿que te da canguele?\nBueno, payo, no ti preocupes, yo tⓘespero por aquí hasta que te se pase.\n@c0@"
