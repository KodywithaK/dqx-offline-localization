  ja: "@a@b＊「本当に　もう\n\tヘンリーさまと　奥さまは\n\t仲がよくて……。\n@c0@"
280:
  de: "@a@b*: Das sind die Räumlichkeiten von Darwin, dem Psarologen.\n@c0@"
  en: "@a@b*: These are Darwin the Psarologist's quarters.\n@c0@"
  es: "@a@b*: Estos son los aposentos de Darwin el Psarólogo.\n@c0@"
  fr: "@a@b*ⓢ Ce sont les quartiers de Darwin le Psarologue.\n@c0@"
  it: "@a@b*: Questo è l'alloggio di Mack Kihe.\n@c0@"
  ja: "@a@b＊「ひとり者には　目の毒だな。\n\tわっはっはっ。\n@c0@"
281:
  de: "@a@b*: Guten Tag. Mein Name ist Darwin. Ich beschäftige mich mit der Erforschung aller Lebewesen.\n@c0@"
  en: "@a@b*: Hello there. The name's Darwin. I spend my time researching all about living things.\n@c0@"
  es: "@a@b*: ¡Eh, hola! Me llamo Darwin. Paso el tiempo investigando sobre los seres vivos.\n@c0@"
  fr: "@a@b*ⓢ Bonjour. Darwin, pour vous servir. Ma vie entière est consacrée à l'étude des êtres vivants.\n@c0@"
  it: "@a@b*: Ehilà, salve! Io sono Mack Kihe, valente studioso di tutti gli esseri viventi.\n@c0@"
  ja: "@a@b＊「おお！　あんたは！\n\tわしですじゃ。\n\t地下牢にいた　ジジですじゃ。\n@c0@"
282:
  de: "@aDarwin@bWie wurden Menschen und andere zu dem, was sie sind? Und könnte aus ihnen auch etwas Mächtigeres werden?\n@c0@"
