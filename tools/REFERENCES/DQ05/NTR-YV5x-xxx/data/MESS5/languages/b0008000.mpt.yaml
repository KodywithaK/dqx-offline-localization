  ja: "@a@bデール「やや！　あなたはっ！\n\t兄から　あなたのことを\n\tいろいろと聞きました。\n@c0@"
297:
  de: "@aKanzler@bWir haben Euch einfach alles zu verdanken, lieber %a000090! Alles!\n@c0@"
  en: "@aChancellor@bWe owe absolutely everything to you, dear %a000090! Everything!\n@c0@"
  es: "@aCanciller@b¡Se lo debemos todo, querido %a000090! ¡Todo!\n@c0@"
