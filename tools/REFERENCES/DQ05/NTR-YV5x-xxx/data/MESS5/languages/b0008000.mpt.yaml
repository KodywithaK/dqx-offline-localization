372:
  de: "@a@b*: Oh je! Gesundheit! Alles in Ordnung?\n@c0@"
  en: "@a@b*: Oh! It's just as the spirits told me:\nⓗThe mighty warrior of old,\nShall sneeze as if he had a coldⓘ!\n@c0@"
  es: "@a@b*: ¡Justo lo que mⓘhan disho los ispíritus!\nⓕEl payo que nos va a sarvar,\nal flamenco alérgico seráⓖ.\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ C'est exactement ce que les esprits viennent de me direⓢ ⓥTout à coup, le puissant guerrier,\nVa éternuer comme s'il était enrhuméⓦⓠ\n@c0@"
  it: "@a@b*: Oh, piccolo mio!\nChe ti succede?\nAh, ho capito...\n@c0@"
