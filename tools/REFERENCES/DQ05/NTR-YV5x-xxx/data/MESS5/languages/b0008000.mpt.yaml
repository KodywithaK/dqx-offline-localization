373:
  de: "@a@b*: Ich habe als Wahrsagerin gerade erst angefangen und neige dazu, es mit dem Weihrauch etwas zu übertreiben.\n@c0@"
  en: "@a@b*: I'm still only a trainee fortune-teller, you see, and I tend to wave too much incense about the place.\n@c0@"
  es: "@a@b*: Estoy estudiando paⓘ adivina, ¿sabes? Pero no me se da muⓘ bien y me se va la mano con las palabras mágicas.\n@c0@"
  fr: "@a@b*ⓢ En fait, je ne suis encore qu'une apprentie voyante et j'ai tendance à abuser un peu de l'encens.\n@c0@"
  it: "@a@b*: È colpa mia. Vedi, io non sono una vera chiaroveggente. In realtà sto studiando per diventare truccatrice, ma ho problemi con la cipria.\n㈡\n*: Ne uso talmente tanta che faccio starnutire chiunque mi stia vicino!\n@c0@"
  ja: "@a@b＊「ぱふぱふぱふ……。\n@c0@"
374:
  de: "@a@b*: Da kriegen die Leute dann oft einen Niesanfall. Deshalb will sich auch keiner von mir die Zukunft voraussagen lassen.\n@c0@"
  en: "@a@b*: It gets right up people's noses, and they end up sneezing everywhere. That's why nobody wants me to tell their fortune.\n@c0@"
  es: "@a@b*: En vez de que me hablen los ispíritus mⓘarranco por soleares.\n@c0@"
  fr: "@a@b*ⓢ Du coup, ça vient chatouiller le nez des gens et ils finissent tous par éternuer sans pouvoir s'arrêter. C'est pour ça que je ne trouve pas de volontaires.\n@c0@"
