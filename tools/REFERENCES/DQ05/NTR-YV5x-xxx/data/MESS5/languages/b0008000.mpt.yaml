  it: "@a@b*: Ma davvero?! Vedo che %H0860%X%A0110%Xsei ben informato%Z%B0110%Xsei ben informata%Z%Y%R0000%Xsiete bene informate%Ysiete bene informati%Z%Z, eh?\n@c0@"
  ja: "@a@b＊「闇が　この世界を\n\tむしばもうと　しています。\n@c0@"
164:
  de: "@a@b*: Es gibt ihn schon seit etwa einhundert Jahren. Stunktrunk, so nennen ihn die, die darüber Bescheid wissen.\n@c0@"
  en: "@a@b*: It's been around for about a hundred years now. ⓗLife is but a drinkⓘ, that's what those who know about it say.\n@c0@"
  es: "@a@b*: Lleva unos cien años en el mercado. ⓕLa vida es bebercioⓖ, dicen los que la conocen.\n@c0@"
  fr: "@a@b*ⓢ Elle a été mise au point il y a une centaine d'années. ⓥL'amer à boireⓦ, c'est comme ça que l'appellent ceux qui en ont déjà bu.\n@c0@"
  it: "@a@b*: Si tratta di una ricetta antichissima. Chi l'ha assaggiata, ne descrive il gusto con una sola parola: ⓕSbleurghⓖ. In altre parole, è una ciofeca.\n@c0@"
  ja: "@a@b＊「しかし　おそれることは\n\tありません。\n@c0@"
165:
  de: "@a@b*: Das ist ein so heftiges Gesöff, dass man damit sogar Monster in die Flucht schlagen kann!\n@c0@"
  en: "@a@b*: It's such potent stuff that it even has the power to frighten monsters away!\n@c0@"
  es: "@a@b*: ¡Es tan fuerte que con ella se puede espantar a los monstruos!\n@c0@"
  fr: "@a@b*ⓢ Elle est si forte qu'elle peut même faire peur aux monstresⓠ\n@c0@"
  it: "@a@b*: È un intruglio talmente orribile che riesce persino a tenere lontani i mostri, %H0860%X%A0110%Xamico mio%Z%B0110%Xamica mia%Z%Y%R0000%Xamiche mie%Yamici miei%Z%Z!\n@c0@"
  ja: "@a@b＊「その時は　きっと\n\t伝説の勇者さまが　現われ\n\t世界を　お救いくださるでしょう。\n@c0@"
166:
  de: "@a@b*: In der Schänke bekommt man ihn nicht mehr. Heutzutage ist er fast gar nicht mehr zu kriegen.\n@c0@"
  en: "@a@b*: You can't buy it at the pub any more. It's pretty much impossible to get hold of nowadays.\n@c0@"
  es: "@a@b*: Ya no se vende en la taberna. Hoy en día es casi imposible conseguirla.\n@c0@"
  fr: "@a@b*ⓢ On ne peut plus en commander à la taverne.\nEn fait, c'est presque impossible d'en trouver de nos jours.\n@c0@"
  it: "@a@b*: Non è una bevanda che si vende nei locali pubblici.\nAnzi, credo che oggi come oggi sia del tutto impossibile procurarsene. Per fortuna, dico io! \n@c0@"
  ja: "@a@b＊「伝説といえば　お前さん\n\tルラフェンの地酒の伝説を\n\t知ってるかね？\n@c0@"
167:
  de: "@a@b*: (Kleng kleng) Das wird eine wunderbare Rüstung, wenn ich damit fertig bin!\n@c0@"
  en: "@a@b*: (BANG BANG) This is going to be a great piece of armour when I'm finished with it.\n@c0@"
  es: "@a@b*: (¡bang! ¡bang!) Cuando acabe, será una gran pieza de armadura.\n@c0@"
  fr: "@a@b*ⓢ (bang bang) Ce sera une super armure quand elle sera finie.\n@c0@"
  it: "@a@b*: Bang! Bang! Ancora qualche colpetto e avrò finito!\nQuesta sarà un'armatura di altissima qualità!\nEhm, ho detto altissima?\n@c0@"
  ja: "@a@b＊「そうかい。　さすが\n\t旅の若いもんは　ちがうのう。\n@c0@"
168:
  de: "@a@b*: Ihr da! Wenn Ihr eine fantastische Rüstung sucht, kommt abends in meinen Laden und seht Euch mein Sortiment an!\n@c0@"
  en: "@a@b*: You there! If you're after some fantastic\r\narmour, come back to my shop at night\r\nand check out my stock!\n@c0@"
  es: "@a@b*: ¡Eh, hola! Si %H0860%Xbuscas%Ybuscáis%Z una buena armadura, %H0860%Xven%Yvenid%Z a mi tienda por la noche para ver lo que tengo.\n@c0@"
  fr: "@a@b*ⓢ Héⓠ Si vous avez besoin d'une armure qui tienne la route, repassez au magasin la nuit et je vous montrerai ce que j'aiⓠ\n@c0@"
  it: "@a@b*: Ehilà! Salve! Se %H0860%Xti interessa qualche corazza particolare, torna di notte e ti%Yvi interessa qualche corazza particolare, tornate di notte e vi%Z farò vedere della merce davvero straordinaria!\n@c0@"
  ja: "@a@b＊「今から　１００年ほど前に　生まれた\n\t銘酒　‘人生のオマケ’　は……\n@c0@"
169:
  de: "@aProfessor Emsich@bWas ist denn? Was wollt Ihr von mir? Wollt Ihr Euch etwa auch über den Rauch beschweren?\n@c0@"
  en: "@aProfessor Toilen Trubble@bWhat is it? What do you want? You're not another person come here to complain about the smoke,\r\nare you?\n@c0@"
  es: "@aProfesor Fumata@b¿Qué pasa? ¿Qué quieres? No serás otro de esos que viene a quejarse del humo, ¿no?\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bQuoiⓡ Qu'est-ce qu'il y aⓡ Vous venez vous plaindre de la fumée, c'est çaⓡ\n@c0@"
  it: "@aProfessor Pitagora@bHo capito, ho capito.\nAnche %H0860%Xtu sei qui per lamentarti%Yvoi siete qui per lamentarvi%Z del fumo...\nHo già detto che installerò un depuratore! Va bene?!\n@c0@"
  ja: "@a@b＊「その　あまりの　マズさに\n\t魔物さえも　にげだしたという……。\n@c0@"
170:
  de: "@aProfessor Emsich@bPah! Was ich in meinem Haus mache, ist meine Sache. Das geht Euch gar nichts an!\n@c0@"
  en: "@aProfessor Toilen Trubble@bPah! What I do in my own home is up to me.\r\nIt's none of your business!\n@c0@"
  es: "@aProfesor Fumata@b¡Bah! ¡En mi casa hago lo que quiero!\r\n¡No es de tu incumbencia!\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bPeuhⓠ Je fais ce que je veux chez moi.\nCe ne sont pas vos affairesⓠ\n@c0@"
  it: "@aProfessor Pitagora@bMa nessuno può ficcare il naso nei miei esperimenti.\nQuesto è il mio laboratorio, e ci faccio quello che cappero mi ci scappera!\n@c0@"
  ja: "@a@b＊「今じゃあ　下の酒場でも出しとらん。\n\tええか　その酒を手に入れようなどと\n\tけっして　思わんことじゃ。\n@c0@"
171:
  de: "@aProfessor Emsich@bIhr haltet meine Forschungen auf. Ich muss Euch bitten zu gehen.\n@c0@"
  en: "@aProfessor Toilen Trubble@bNow, you're getting in the way of my research.\r\nI'll have to ask you to leave.\n@c0@"
  es: "@aProfesor Fumata@bEstás interrumpiendo mi investigación.\r\nDebo pedirte que te vayas.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bEn plus, vous me dérangez dans mes recherches.\nJe dois vous demander de partir.\n@c0@"
  it: "@aProfessor Pitagora@b%H0860%XE ora, vuoi essere così gentile da portare le tue%YE ora, volete essere così gentili da portare le vostre%Z chiappere fuori da qui?\n%H0860%XSai%YSapete%Z, ho del lavoro da sbrigare...\n@c0@"
  ja: "@a@b＊「トテカン　トテカン……と\n\tいい防具が　できそうだぞ。\n@c0@"
172:
  de: "@aProfessor Emsich@bDann müsst Ihr hier sein, um meine Forschungen zu beobachten. Wie schön, dass Ihr Euch dafür interessiert!\n@c0@"
  en: "@aProfessor Toilen Trubble@bThen you must be here to observe my research.\r\nHow nice of you to take an interest!\n@c0@"
  es: "@aProfesor Fumata@bEntonces has venido a ver mi investigación.\r\n¡Qué amable por tu parte!\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bDans ce cas, vous devez sans doute être là pour regarder ce que je fais. C'est gentil de vous intéresser à mes recherchesⓠ\n@c0@"
  it: "@aProfessor Pitagora@bMa allora %H0860%Xsei qui perché ti%Ysiete qui perché vi%Z interessano le mie ricerche!\nPrego, %H0860%Xaccomodati%Yaccomodatevi%Z pure!\n@c0@"
  ja: "@a@b＊「兄ちゃん！\n\t防具が　ほしかったら\n\t夜　店に来てくんなよ。\n@c0@"
173:
  de: "@aProfessor Emsich@bWenn ich mit meinem aktuellen Projekt Erfolg habe, werde ich einen lange verlorenen Zauber neu beleben.\n@c0@"
  en: "@aProfessor Toilen Trubble@bIf I'm successful with my current project, I'll manage to revive a long-lost spell.\n@c0@"
  es: "@aProfesor Fumata@bSi tengo éxito en mi actual proyecto, reviviré un conjuro perdido hace tiempo.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bSi tout se passe bien, je vais réussir à faire renaître un sort oublié depuis longtemps.\n@c0@"
  it: "@aProfessor Pitagora@bAttualmente sto lavorando a un progetto molto ambizioso.\n㈡\nSe riuscirò a far quadrare questa cappera di formula, potremo tornare a usare un antico incantesimo!\n@c0@"
  ja: "@a@bベネット「なんじゃ　お前さんは？\n\tお前さんも　けむたいとか\n\t文句を　言いに来たのかえ？\n@c0@"
174:
  de: "@aProfessor Emsich@bEinen wirklich wunderbaren Zauber! Damit kann man mühelos zwischen verschiedenen Orten umherreisen, die man bereits besucht hat.\n@c0@"
  en: "@aProfessor Toilen Trubble@bAnd a wonderful spell it is too! It allows you\r\nto travel effortlessly between different places you've visited.\n@c0@"
  es: "@aProfesor Fumata@b¡Es un conjuro maravilloso! Permite viajar sin esfuerzo entre los lugares que has visitado.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bC'est un sort merveilleux, en plusⓠ Il permet de vous rendre très facilement dans tous les endroits où vous êtes déjà allé%H0860%X%A0110%X%Z%B0110%Xe%Z%Y%R0000%Xes%Ys%Z%Z.\n@c0@"
  it: "@aProfessor Pitagora@bE %H0860%Xsapessi%Ysapeste%Z che incantesimo!\nMica roba da due capperi al chilo, eh?\nNiente affatto!\n㈡\nSi tratta di una magia che permette di spostarsi da un luogo all'altro, istantaneamente e senza fatica.\nBello, no?\n@c0@"
  ja: "@a@bベネット「ふん！　わしが\n\tわしの家で　なにをしようと\n\tわしの勝手じゃろう。\n@c0@"
175:
  de: "@aProfessor Emsich@bKönnt Ihr Euch vorstellen, wie praktisch das wäre?\n@c0@"
  en: "@aProfessor Toilen Trubble@bCan you imagine how convenient that would be?\n@c0@"
  es: "@aProfesor Fumata@b¿Puedes imaginar lo útil que resultaría?\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bVous imaginez comme ce serait pratiqueⓡ\n@c0@"
  it: "@aProfessor Pitagora@b%H0860%XCapisci da te%YCapite da voi%Z che sarebbe una scoperta sensazionale!\nAnzi, una ri-scoperta, per essere precisi!\n@c0@"
  ja: "@a@bベネット「研究のジャマじゃ。\n\tさあ　帰ってくれ。\n@c0@"
176:
  de: "@aProfessor Emsich@bAlso, was meint Ihr? Wollt Ihr mir bei meiner Arbeit helfen?\n@c0@"
  en: "@aProfessor Toilen Trubble@bSo, what do you think? Are you willing to help me out with my work?\n@c0@"
  es: "@aProfesor Fumata@bDi, ¿qué te parece? ¿Estás dispuesto a ayudarme en mi trabajo?\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bAlors, qu'en pensez-vousⓡ\nÇa vous dit de m'aider dans mes recherchesⓡ\n@c0@"
  it: "@aProfessor Pitagora@bChe ne %H0860%Xdiresti%Ydireste%Z di aiutarmi nella mia ricerca?\nAnche se non %H0860%Xcapisci%Ycapite%Z un cappero di magia, %H0860%Xpotresti%Ypotreste%Z comunque darmi una mano in qualche modo...\n@c0@"
  ja: "@a@bベネット「すると　わしの研究を\n\t見学に　来たわけじゃな。\n\tなかなか　感心なヤツじゃ。\n@c0@"
177:
  de: "@aProfessor Emsich@bOoh! Wie wunderbar! Dann folgt mir bitte.\n@c0@"
  en: "@aProfessor Toilen Trubble@bOoh! How wonderful!\nThen follow me.\n@c0@"
  es: "@aProfesor Fumata@b¡Oh! ¡Maravilloso!\r\nSígueme, pues.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bOhⓠ C'est fantastiqueⓠ\nSuivez-moi, alors.\n@c0@"
  it: "@aProfessor Pitagora@bFantastico!\nAvanti, %H0860%Xseguimi%Yseguitemi%Z!\n@c0@"
  ja: "@a@bベネット「もし　研究が成功すれば\n\t古い呪文が　ひとつ\n\t復活することに　なるじゃろう。\n@c0@"
178:
  de: "@aProfessor Emsich@bSeht Euch diese Karte hier an.\n@c0@"
  en: "@aProfessor Toilen Trubble@bHave a little look at this map here.\n@c0@"
  es: "@aProfesor Fumata@bEcha un vistazo a este mapa.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bJetez un œil à cette carte.\n@c0@"
  it: "@aProfessor Pitagora@b%H0860%XDai%YDate%Z un'occhiata a questa mappa.\n@c0@"
  ja: "@a@bベネット「それは\n\t知っている場所であれば\n\tまたたく間に　移動できるという……\n@c0@"
179:
  de: "@aProfessor Emsich@bWir sind in Wunnermühl, seht Ihr?\n@c0@"
  en: "@aProfessor Toilen Trubble@bHere we are in Zoomingale, see?\n@c0@"
  es: "@aProfesor Fumata@bEstamos en Telele, ¿ves?\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bIci, c'est Moulinsort, d'accordⓡ\n@c0@"
  it: "@aProfessor Pitagora@bNoi siamo qui a Milleventi...\n@c0@"
  ja: "@a@bベネット「たいそう便利な\n\t呪文なのじゃ！\n@c0@"
180:
  de: "@aProfessor Emsich@bSo, was ich jetzt brauche, ist ein Exemplar von den Sprungblumen, die genau... hier wachsen.\n@c0@"
  en: "@aProfessor Toilen Trubble@bNow, what I need is some of the lunar Zoombloom that can be found growing...right here.\n@c0@"
  es: "@aProfesor Fumata@bLo que necesito es teleflor lunar, que crece... justo aquí.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bMaintenant, ce dont j'ai besoin, c'est une télébore lunaire, qui pousse... ici. \n@c0@"
  it: "@aProfessor Pitagora@bPer continuare il mio esperimento ho bisogno di una certa quantità di erba volalonge, un cappero di vegetale che cresce in questa zona qui.\n@c0@"
  ja: "@a@bベネット「どうじゃ？\n\tこの研究を　手伝ってみたいと\n\t思わぬか？\n@c0@"
181:
  de: "@aProfessor Emsich@bUnd es wäre nett, wenn Ihr sie für mich holen würdet.\n@c0@"
  en: "@aProfessor Toilen Trubble@bAnd I'd like you to go and fetch it for me.\n@c0@"
  es: "@aProfesor Fumata@bQuiero que me la consigas.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bJe voudrais que vous alliez la chercher.\n@c0@"
  it: "@aProfessor Pitagora@bVorrei che %H0860%X%A0110%Xtu, baldo giovanotto, andassi%Z%B0110%Xtu, prode signorina, andassi%Z%Y%R0000%Xvoi, gentili signorine, andaste%Yvoi, baldi, giovanotti, andaste%Z%Z a prendermene un po'.\n@c0@"
  ja: "@a@bベネット「おお！　やってくれるか！\n\tそれでは　わしに　ついてまいれ！\n@c0@"
182:
  de: "@aProfessor Emsich@bIhr könnt sie aber nur nachts pflücken.\n@c0@"
  en: "@aProfessor Toilen Trubble@bYou can only go picking it at night, though.\n@c0@"
