  it: "@aMinistro@bAllora ti consiglio di farci un salto. Visto il lungo viaggio che ti attende, faresti bene a procurarti una copia del ⓕLibro delle Bestieⓖ. Ti sarà utilissimo!\n@c0@"
  ja: "@a@bデール「しかし　旅立つ前に\n\t兄に　会ってやってください。\n\t兄の部屋は　この上です。\n@c0@"
