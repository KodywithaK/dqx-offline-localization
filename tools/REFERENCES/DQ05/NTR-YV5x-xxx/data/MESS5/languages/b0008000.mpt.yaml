  it: "@aProfessor Pitagora@bD'accordo, allora io mi scappero un bel pisolone in attesa che %H0860%Xtu torni%Yvoi torniate%Z con l'erba volalonge.\n@c0@"
  ja: "@a@bベネット「ただし　ルラムーン草は\n\t夜しか　とれんそうじゃ。\n@c0@"
187:
  de: "@aProfessor Emsich@bPah! Euch kleiden wie ein Abenteurer, das könnt Ihr, aber anscheinend seid Ihr doch bloß ein Feigling.\n@c0@"
