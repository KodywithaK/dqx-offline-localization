  fr: "@aProfesseur Fulbert Fumeux@bLe problème, c'est que vous ne pouvez la cueillir que de nuit.\n@c0@"
  it: "@aProfessor Pitagora@b%H0860%XSappi%YSappiate%Z che l'erba volalonge può essere raccolta solo di notte!\n@c0@"
  ja: "@a@bベネット「ちょっと\n\tこの地図を　見てくれぬか。\n@c0@"
183:
  de: "@aProfessor Emsich@bDann beginnt sie zu leuchten und verrät ihren Standort.\n@c0@"
  en: "@aProfessor Toilen Trubble@bThat's when it starts shining and\r\ngiving away its location.\n@c0@"
  es: "@aProfesor Fumata@bEs cuando empieza a brillar y delata su posición.\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bC'est à ce moment-là qu'elle se met à briller et que vous pouvez la repérer.\n@c0@"
  it: "@aProfessor Pitagora@bSolo allora è possibile individuarla.\nQuella cappera di erba brilla nell'oscurità, mentre è praticamente invisibile alla luce del sole...\n@c0@"
  ja: "@a@bベネット「今　わしらが　いる\n\tこの町は　ここじゃろ。\n@c0@"
184:
  de: "@aProfessor Emsich@bAlso, was meint Ihr? Soll ich es noch einmal erklären?\n@c0@"
  en: "@aProfessor Toilen Trubble@bSo, what do you think? Do you need me to\r\nexplain all that again?\n@c0@"
  es: "@aProfesor Fumata@bDi, ¿qué te parece? ¿Necesitas que te lo explique otra vez?\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bAlors, qu'est-ce que vous en ditesⓡ\nVous voulez que je vous réexpliqueⓡ\n@c0@"
  it: "@aProfessor Pitagora@bE questo è quanto. Non c'è altro da aggiungere.\nO forse %H0860%Xvuoi che ti%Yvolete che vi%Z ripeta tutto daccappero?\n@c0@"
  ja: "@a@bベネット「でな。　このあたりに\n\tルラムーン草というのが\n\tはえているらしいのじゃ。\n@c0@"
185:
  de: "@aProfessor Emsich@bWunderbar!\n@c0@"
  en: "@aProfessor Toilen Trubble@bWonderful!\n@c0@"
  es: "@aProfesor Fumata@b¡Estupendo!\n@c0@"
  fr: "@aProfesseur Fulbert Fumeux@bParfaitⓠ\n@c0@"
  it: "@aProfessor Pitagora@bFantastico!\n@c0@"
  ja: "@a@bベネット「ちと　それを\n\tとって来て　もらえんかの。\n@c0@"
186:
