  it: "@aMack Kihe@bRecenti studi suggeriscono che c'è un segreto dietro i misteri dell'evoluzione.\n㈡\nProbabilmente, i cambiamenti attraverso cui sono passati gli esseri viventi sono il frutto di un imperscrutabile disegno divino.\n@c0@"
  ja: "@a@b＊「これも　あんたの　おかげじゃ。\n\tありがとう　ありがとう……。\n@c0@"
284:
  de: "@a@b*: Dies sind die Gemächer der Königinwitwe.\n@c0@"
