0:
  de: "@a@b*: Wat wollt Ihr?\n@c0@"
  en: "@a@b*: What d'you want?\n@c0@"
  es: "@a@b*: ¿Qué %H0860%Xquieres%Yqueréis%Z?\n@c0@"
  fr: "@a@b*ⓢ Vous voulez quoiⓡ\n@c0@"
  it: "@a@b*: %H0860%XSenti 'mpo', perché nun te ne vai%YSentite 'mpo', perché nun ve ne antate%Z via, eh?\n@c0@"
  ja: "@a@b＊「なんか　用だべか？\n@c0@"
1:
  de: "@a@b*: Da drin geht et um wat Wichtiges. Wir wollen nich', dat da wer seine Nase reinsteckt, der nich' von hier ist.\n@c0@"
  en: "@a@b*: Them in there's got important stuffin's a-be discustipatin'. We don't want no one pokin' about who en't from 'round these parts.\n@c0@"
  es: "@a@b*: Esos dⓘahí adentro tienen que discutiⓘ cosas importantes dⓘesas. No queremos forasteros metiendo las narices por aquí.\n@c0@"
  fr: "@a@b*ⓢ Ils sont en train de causer d'affaires importantes, là-dedans.\n㈡\n*ⓢ On n'aime pas trop que les gens qui sont pas du coin s'intéressent à ces trucs-là.\n@c0@"
  it: "@a@b*: Qui dentro si stanno discutento fecenne molto importandi, e nun ce volemo estragni 'ngiro.\n@c0@"
  ja: "@a@b＊「今は　大事な　かいぎ中だけん\n\tよそ者を　いれるわけには\n\tいかねえだよ。\n@c0@"
2:
  de: "@a@b*: Um der Göttin willen, auf den Feldern sieht dat ja mal wieder aus wie bei Hempels unterm Sofa!\n@c0@"
  en: "@a@b*: By that there Goddess, the fields are a proper mess again!\n@c0@"
  es: "@a@b*: ¡Por la Diosa, los campos están otra veⓘ que da pena veⓘlos!\n@c0@"
  fr: "@a@b*ⓢ Par la bonne Déesse, c'est encore le chantier dans les culturesⓠ\n@c0@"
  it: "@a@b*: Santa tea! Li campi sono 'nu porcile!\nMa nel zenzo che sono tutti arruvinati da 'nu mostro piecuro, no che ci tengo lu porco!\n@c0@"
  ja: "@a@b＊「あいやー　また　畑が\n\tあらされとるだ！\n@c0@"
3:
  de: "@a@b*: Wenn dat noch lange so weitergeht, könn' wir vor lauter Kohldampf und Hunger bald nich' mehr kreuchen.\n@c0@"
  en: "@a@b*: If 'e goes on like this much longer, we'll be dyin' of starvination an' 'unger.\n@c0@"
  es: "@a@b*: Como la cosa siga ansín, nos vamos a morir toⓘs de jambre y de necesidaⓘ.\n@c0@"
  fr: "@a@b*ⓢ Si ça continue comme ça, on va tous calancher à cause de la famine.\n@c0@"
  it: "@a@b*: Si la facenna nun se risolve, tra 'mpo' ce ne morimo tutti de fame!\n@c0@"
  ja: "@a@b＊「こんなことが　続けば\n\tオラたちは　うえ死に　だよ。\n@c0@"
4:
  de: "@a@b*: Dat hier is' Bauernsiepen.\n@c0@"
  en: "@a@b*: This 'ere is 'Ay. You fancy folk'd prob'ly call it Hay.\n@c0@"
  es: "@a@b*: Esto es Pueblaⓘl Heno. Vosotros los finolis seguro que decís ⓕPuebla del Henoⓖ.\n@c0@"
  fr: "@a@b*ⓢ Z'êtes à Chaumes. Vous, vous m'avez l'air de venir d'la ville.\n@c0@"
  it: "@a@b*: Chesta è Punta Campestre, lu paesello rianimato 'ntutta la zona circostampe e livitrofa pe' li prudotti de l'agricolturalità.\n@c0@"
  ja: "@a@b＊「ここは　カボチ村じゃぞ。\n@c0@"
5:
  de: "@a@b*: Bloß dat et bald keine Bauern mehr hier gibt, wenn dat hundsgemeine Monster noch lange unsere Felder verwüstet.\n@c0@"
  en: "@a@b*: Only what with that bissly wolf monster scat'n the fields abroad, we en't got much 'ay to gather.\n@c0@"
  es: "@a@b*: Pero claro, con el lobo moⓘstruo ese malo atacando los campos, no tenemos heno paⓘ recogeⓘ.\n@c0@"
  fr: "@a@b*ⓢ Si ça continue comme ça avec c'te monstre qui nous ravage les champs, y va pas nous en rester beaucoup de chaume.\n@c0@"
  it: "@a@b*: Ma da quanno lu pecorone de lu mostro ce arruvina li raccolti, la facenna s'ha fatta grava.\n@c0@"
  ja: "@a@b＊「けんど　化けオオカミのせいで\n\t近頃　作物が　とれんでのう。\n@c0@"
6:
  de: "@a@b*: Ich leb schon mein ganzes Leben hier. Aber ich glaub', nich' mehr lange, und wir müssen uns in die Hügel da drüben verziehen.\n@c0@"
  en: "@a@b*: My 'ole life I's lived 'ere, but I'm thinkin' we'll 'ave to 'ead off into them there 'ills afore long.\n@c0@"
  es: "@a@b*: Toⓘa mi vida la he pasaⓘo aquí, pero va a ser que igual me tengo que ir pⓘande las montañas dentro de poco.\n@c0@"
  fr: "@a@b*ⓢ Toute ma vie, je l'ai passée ici, mais je m'dis qu'on va devoir déguerpir dans pas longtemps.\n@c0@"
  it: "@a@b*: Io me so' sempre vivuta qui, ma si nun se trova 'na soluzione, me sa che me devo da migra' da n'antra parta.\n@c0@"
  ja: "@a@b＊「わしも　そろそろ\n\tお山に　行こうかと思うとるよ。\n@c0@"
7:
  de: "@a@b*: Omi is' die ganze Zeit schon so komisch.\n@c0@"
  en: "@a@b*: Granny's bin actin' all funny lately.\n@c0@"
  es: "@a@b*: Lⓘagüela hace cosas muⓘ raras últimamente.\n@c0@"
  fr: "@a@b*ⓢ Mémé est bizarre en ce moment.\n@c0@"
  it: "@a@b*: 'A nonna se cumporta de 'na manera 'mpo' strana de 'sto periodo.\n@c0@"
  ja: "@a@b＊「最近　うちの　おばあちゃん\n\t変なんだよ。\n@c0@"
8:
  de: "@a@b*: Isst immer nur 'nen Happen von ihrem Essen und gibt den Rest dann mir. Sie sagt, sie wär satt.\n@c0@"
  en: "@a@b*: She only eats one little dollop of 'er food an' then gives the rest to me. Says she's full, she does.\n@c0@"
  es: "@a@b*: No se come más que un cachico de su comida y lo demás me lo da a mí. Dice que está llena.\n@c0@"
  fr: "@a@b*ⓢ Elle mange juste un peu dans sa gamelle et elle me donne le reste. Elle a plus faim, qu'elle me dit.\n@c0@"
  it: "@a@b*: Mancia poco. Poco poco.\nE quello che nun si mancia, me lo fa manciare a me.\n@c0@"
  ja: "@a@b＊「少し食べただけで　オナカが\n\tいっぱいになって　ボクに\n\tごはんを　くれるんだ。\n@c0@"
9:
  de: "@a@b*: Ich hoff' bloß, dat se nich' krank is'.\n@c0@"
  en: "@a@b*: I 'ope she en't sick.\n@c0@"
  es: "@a@b*: Espero que no esté enferma.\n@c0@"
  fr: "@a@b*ⓢ J'espère qu'elle est pas malade.\n@c0@"
  it: "@a@b*: Mica si sta facento la tieta alla sua veneserranda età, eh?\n@c0@"
  ja: "@a@b＊「病気かなあ……。\n@c0@"
10:
  de: "@a@b*: Wuff! Wuff wuff!\n@c0@"
  en: "@a@b*: Arf! Arf arf!\n@c0@"
  es: "@a@b*: ¡Arf! ¡Arf, arf!\n@c0@"
  fr: "@a@b*ⓢ Ouafⓠ Ouafⓠ\n@c0@"
  it: "@a@b*: Arf!\nBau! Bau!\n@c0@"
  ja: "@a@b＊「わんわん！\n@c0@"
11:
  de: "@a@b*: Ich hab mich mein ganzes Leben bloß abgerackert, aber et wird nich' leichter.\n@c0@"
  en: "@a@b*: I bin workin' like billy-o me 'ole life, but things en't gettin' any easier.\n@c0@"
  es: "@a@b*: Llevo toⓘa la vida trabajando comⓘun negro, pero la cosa no mejora.\n@c0@"
  fr: "@a@b*ⓢ Je me suis crevé la paillasse toute ma vie et jamais ça a payé.\n@c0@"
  it: "@a@b*: Io mi ho lavorato tutta la vita come a 'nu ciuccio.\n@c0@"
  ja: "@a@b＊「働いても　働いても\n\tくらしは　楽になんねえ。\n@c0@"
12:
  de: "@a@b*: Warum wurde ich in dat Loch hier geboren? Auf mich verschwendet die Göttin jedenfalls kein Lächeln, dat is' mal sicher.\n@c0@"
  en: "@a@b*: Why was I born in this 'ere dump, eh? The Goddess en't wastin' any of 'Er smiles on me, that's for sure.\n@c0@"
  es: "@a@b*: ¿Por qué fui a naceⓘ en este sitio dejaⓘo de la mano de la Diosa? Endeluego, la Diosa no mⓘa puesto la vida fácil.\n@c0@"
  fr: "@a@b*ⓢ Pourquoi je suis né dans ce trouⓡ Y'a un truc que j'sais, c'est que la Déesse s'est sûrement pas cassé la nénette sur mon cas.\n@c0@"
  it: "@a@b*: Perché la tea nun mi ha faciuto nascere ricco eretitiero?!\n@c0@"
  ja: "@a@b＊「オラ　なんで　こんな村に\n\t生まれちまったんだか……。\n@c0@"
