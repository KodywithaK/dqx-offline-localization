42:
  de: "@a@bSo ein Glück! Wähle irgendeine Ziffer auf dem Würfel und rücke um ebenso viele Felder vor!\n@c0@"
  en: "@a@bWhat luck! You'll be able to pick any number on the die and move forward that number of spaces!\n@c0@"
