  fr: "@a@bQuelle chanceⓠ Vous allez pouvoir choisir n'importe quel chiffre sur le dé et avancer du nombre de cases correspondantⓠ\n@c0@"
  it: "@a@bColpo di fortuna!\nScegli un numero sul dado e avanza degli spazi corrispondenti!\n@c0@"
  ja: "@a@bラッキー！\nこの次は　好きな目を　えらんで\nすすめるぞ！\n@c0@"
43:
  de: "@a@bAus kleinen Eicheln sprießen mächtige Eichen.\n@c0@"
  en: "@a@bMighty oaks from tiny acorns grow.\n@c0@"
  es: "@a@bUn viaje de mil kilómetros se empieza con un paso.\n@c0@"
  fr: "@a@bLes petits ruisseaux font les grandes rivières.\n@c0@"
  it: "@a@bDalle piccole ghiande nascono le querce alte e forti...\n@c0@"
  ja: "@a@b夜空を　やきつくす　火の山\n鋼鉄の　ハンマーを　打ちならせ。\n@c0@"
44:
  de: "@a@bBei der Kraft der mächtigen Göttin, verleihe diesem Sterblichen große Stärke!\n@c0@"
  en: "@a@bBy the power of the mighty Goddess, bestow great strength upon this mortal!\n@c0@"
  es: "@a@b¡Por la gracia de la poderosa Diosa, que a este mortal se le conceda una fuerza irresistible!\n@c0@"
  fr: "@a@bPar le pouvoir de la puissante Déesse, que cet être mortel soit gratifié d'une grande forceⓠ\n@c0@"
  it: "@a@bCreatura mortale, la dea onnipotente ha aumentato la tua forza!\n@c0@"
  ja: "@a@b大地の神々　よりつどいて\nこの者に　ちからを　あたえん！\n@c0@"
45:
  de: "@a@bWilder Blick und flinke Füße. Das Rad der Zeit hält niemand auf.\n@c0@"
  en: "@a@bDarting eyes and fleeting feet. Time and tide wait for no man.\n@c0@"
  es: "@a@bOjos penetrantes y pies fugaces. El tiempo y la marea no paran por nadie.\n@c0@"
  fr: "@a@bYeux perçants et pieds légers. Personne ne peut arrêter la marche du temps.\n@c0@"
  it: "@a@bSguardo rapido e piede veloce!\nOra puoi muoverti più in fretta...\n@c0@"
  ja: "@a@b時は風。　さわやかなる　しらべに\n足どりは　かろやかに。\n@c0@"
46:
  de: "@a@bIm Handumdrehen sollt Ihr die entlegendsten Winkel der Welt sehen! \n@c0@"
  en: "@a@bIn the blink of an eye, you shall see all four corners of the world!\n@c0@"
  es: "@a@b¡En un abrir y cerrar de ojos podrás ver los cuatro rincones del mundo!\n@c0@"
  fr: "@a@bEn un clin d'œil, vous pourrez voir les quatre coins du mondeⓠ\n@c0@"
  it: "@a@bAdesso, solo il vento è più veloce di te...\n@c0@"
  ja: "@a@b夜空の　きらめき。\nその光は　またたくうちに\n三千世界を　かけめぐる。\n@c0@"
47:
  de: "@a@bNiemals müde, niemals schwach. Klettert bis zum Gipfel, mit dem ganzen Berg auf dem Rücken!\n@c0@"
  en: "@a@bNever tire, never weaken. Climb to the summit with the whole mountain on your back!\n@c0@"
  es: "@a@bSin cansancio, sin debilidad. ¡Montaña arriba con el mundo a la espalda!\n@c0@"
  fr: "@a@bJamais de fatigue, jamais de faiblesse. Grimpez au sommet avec la montagne sur votre dosⓠ\n@c0@"
  it: "@a@bMuoviti, corri, combatti.\nNon sai cosa sia la stanchezza...\n@c0@"
  ja: "@a@bつかれ知らぬ　その身体。\n大岩　持ちて　山を登らん。\n@c0@"
48:
  de: "@a@bNeunundneunzig Schläge, neunundneunzig blaue Flecken, einhundert Neuanfänge! Ihr werdet nach jedem Sturz wieder aufstehen.\n@c0@"
  en: "@a@bNinety-nine blows, ninety-nine bruises, a hundred comebacks! You will rise after every fall.\n@c0@"
  es: "@a@b¡Noventa y nueve golpes, noventa y nueve moratones, cien intentos! Te alzarás después de cada caída.\n@c0@"
  fr: "@a@b99 coups, 99 bleus, mais 100 retoursⓠ\nVous vous relèverez après chaque chute.\n@c0@"
  it: "@a@bCadere è possibile, rialzarsi necessario.\nLa forza di risorgere non ti abbandonerà mai!\n@c0@"
  ja: "@a@bこぶし　１００万回。\n打たれても　なお　元気なりし。\n@c0@"
49:
  de: "@a@bWisset, was man wissen kann und was man nicht wissen kann. Und wisset vor allem, dass wahres Wissen darin besteht, den Unterschied zu kennen.\n@c0@"
  en: "@a@bKnow that which can be known, know that which cannot. And most of all, know that true knowledge comes from knowing the difference.\n@c0@"
  es: "@a@bSabe lo que puede saberse, sabe lo que no puede saberse. Y sobre todo, sabe que la verdadera sabiduría es saber distinguir lo uno de lo otro.\n@c0@"
  fr: "@a@bConnaissez tout ce qui peut l'être et aussi ce qui ne le peut pas. Mais sachez surtout que la véritable connaissance, c'est savoir distinguer les deux.\n@c0@"
  it: "@a@bConosci i tuoi limiti, e poi superali.\nLa saggezza rende l'uomo più forte.\n@c0@"
  ja: "@a@bこれを知るを　これ知るとなせ。\n知らざるを　知らざるとなせ。\nこれ　知れるなり。\n@c0@"
50:
  de: "@a@bDie Narren lehren, während die Weisen lernen. Lernt weise, und Ihr werdet Weisheit lernen.\n@c0@"
  en: "@a@bFools teach, while the wise learn. Learn wisely, and wisdom you will learn.\n@c0@"
  es: "@a@bLos tontos enseñan, los sabios aprenden. Aprende sabiamente y sabiduría aprenderás.\n@c0@"
  fr: "@a@bLes fous enseignent tandis que les sages apprennent. Apprenez sagement et vous apprendrez la sagesse.\n@c0@"
  it: "@a@bGli sciocchi insegnano, mentre il saggio impara.\nAscolta, e accresci la tua saggezza.\n@c0@"
  ja: "@a@bおろかなる者は　教えたがり\nかしこき者は　学びたがる。\nなんじ　さらに　学ぶべし。\n@c0@"
51:
  de: "@a@bGibt es so etwas wie Glück überhaupt? Oder ist es Schicksal? Glücklicherweise ist es unser Schicksal, das nie zu erfahren!\n@c0@"
  en: "@a@bCan there be such a thing as luck? Or is it destiny? Luckily, we are destined never to know!\n@c0@"
  es: "@a@b¿Acaso existe algo como la suerte? ¿O será el destino?\r\n¡Por suerte, estamos destinados a no saberlo jamás!\n@c0@"
  fr: "@a@bQu'y a-t-il de mieux de la chanceⓡ À moins qu'il ne s'agisse du destinⓡ Par chance, nous sommes destinés à ne jamais le savoirⓠ\n@c0@"
  it: "@a@bⓕDestinoⓖ è il nome che chi fallisce dà alla propria incapacità. ⓕFortunaⓖ è il nome che l'invidioso dà alla capacità di chi sa dominare gli eventi.\n@c0@"
  ja: "@a@bしあわせの時は　来たれり。\n月よ　星よ　ここに幸あれ。\n@c0@"
52:
  de: "@a@bMöge die Glücksgöttin ein Lied für Euch anstimmen. Fortuna hat gesungen, tanzt den Tanz der Glücklichen!\n@c0@"
  en: "@a@bMay Lady Luck sing for you a tune. Your fortune sung, dance the dance of the lucky!\n@c0@"
  es: "@a@bQue la Diosa Fortuna cante para ti. ¡Y, tras cantar tu fortuna, baila la danza de los afortunados!\n@c0@"
  fr: "@a@bPuisse la chance vous jouer sa mélodie. La chance vous a donné le tonⓡ Eh bien dansez maintenantⓠ\n@c0@"
  it: "@a@bLa fortuna aiuta gli audaci!\n@c0@"
  ja: "@a@b森深き　青き泉。\n幸運の女神　まいおりて　なんじに\n祝福を　あたえん。\n@c0@"
53:
  de: "@a@bFinsternis hüllt den Pfad ein, den die Schwachen beschreiten.\n@c0@"
  en: "@a@bDarkness shrouds the way of the weak.\n@c0@"
  es: "@a@bLa oscuridad envuelve el camino de los débiles.\n@c0@"
  fr: "@a@bL'obscurité assombrit le chemin des faibles.\n@c0@"
  it: "@a@bDebole è colui che soccombe alle tenebre senza reagire...\n@c0@"
  ja: "@a@bちからなく　うなだれる者\n暗き道を　歩まん。\n@c0@"
54:
  de: "@a@bDie Sterne verblassen, Lethargie lauert und die Last ist so unendlich schwer.\n@c0@"
  en: "@a@bThe stars fade, lethargy lurks, and the burden is so very heavy.\n@c0@"
  es: "@a@bLas estrellas se apagan, la apatía acecha y la carga es tan pesada...\n@c0@"
  fr: "@a@bLes étoiles s'éteignent, la léthargie guette et le fardeau est si lourd.\n@c0@"
  it: "@a@bLento è il cammino, pesante il fardello...\nIl corpo è avvolto da una sgradevole sensazione di torpore.\n@c0@"
  ja: "@a@bあまねく星たちの　きらめきは見えず。\n深き眠りは　なまりの重さに。\n@c0@"
55:
  de: "@a@bIn der sengenden Wüste ist die Quelle der Vitalität versiegt. Allenthalben verdorrt das Leben.\n@c0@"
  en: "@a@bThe spring of vitality is dry in the scorching desert. Life withers all around.\n@c0@"
  es: "@a@bLa fuente de la vitalidad se seca en el desierto abrasador. La vida se marchita.\n@c0@"
  fr: "@a@bLa source de vitalité s'assèche dans le désert brûlant. La vie dépérit tout autour.\n@c0@"
  it: "@a@bLa vitalità di un tempo è solo un ricordo, e il corpo avvizzisce e diventa sempre più debole...\n@c0@"
  ja: "@a@bしゃくねつの　さばく。\n生命の泉は　枯れ　見えざるものが\n身体を　むしばむ。\n@c0@"
56:
  de: "@a@bSehet nur! Wenn man anderen Unglück wünscht, und sei es auch nur aus Spaß, so kehrt sich dieser Wunsch ganz schnell gegen einen selbst.\n@c0@"
  en: "@a@bSee how wishing ill fortune on others in jest so quickly comes home to roost.\n@c0@"
  es: "@a@bDesear la desgracia ajena pronto se vuelve en contra de uno.\n@c0@"
  fr: "@a@bSouhaitez, même pour rire, la malchance aux autres et voyez comme on récolte ce que l'on sème.\n@c0@"
  it: "@a@bMadama fortuna ha volto lo sguardo altrove, e neri corvi iniziano a volteggiare sulla tua testa...\n@c0@"
  ja: "@a@b運わるしと　いたずらに　なげく者\nみずから　不運を　まねく者なり。\n@c0@"
57:
  de: "@a@bDie Zeit vergeht wie im Fluge, wenn man sich amüsiert. Und nun ist es an der Zeit, flugs wieder dorthin aufzubrechen, wo alles seinen Anfang nahm!\n@c0@"
  en: "@a@bTime flies when you're having fun. Time to fly back to where things were begun!\n@c0@"
  es: "@a@bEl tiempo vuela cuando te diviertes. ¡Es hora de volar al principio de todo!\n@c0@"
  fr: "@a@bLe temps passe vite quand on s'amuse. Le moment est venu de tout reprendre au débutⓠ\n@c0@"
  it: "@a@bIl tempo vola, quando ci si diverte!\nRicomincia a divertirti... dall'inizio!\n@c0@"
  ja: "@a@b時は　いつわり。\nすぎ去りし日々も　また\nいつわりなりき。\n@c0@"
58:
  de: "@a@b%0%a000120 kehrt zum Startfeld zurück!\n@c0@"
  en: "@a@b%0%a000120 returns to the start of the board!\n@c0@"
  es: "@a@b¡%0%a000120 vuelve al principio del tablero!\n@c0@"
  fr: "@a@b%0%a000120 retourne au début du plateauⓠ\n@c0@"
  it: "@a@b%0%a000120 torna al punto di partenza!\n@c0@"
  ja: "@a@b%a000120は　ふりだしに　もどった！\n@c0@"
59:
  de: "@a@bWenn düst're Augen glitzern bös' im Dunkeln,\nUnd messerscharfe Zähne teuflisch funkeln,\ndann ist's ganz sicher nicht gut munkeln!\n@c0@"
  en: "@a@bThe glistening of dark eyes in the gloom. The glint of razor-edged fangs spells impending doom!\n@c0@"
  es: "@a@bBrillo de oscuros ojos en las tinieblas. ¡Destello de colmillos, sentencia inminente!\n@c0@"
  fr: "@a@bDes yeux luisent dans le noir. Le reflet qui révèle des crocs acérés annonce une fin imminenteⓠ\n@c0@"
  it: "@a@bUn'oscura minaccia ti attende...\nSaprai superarla, o soccomberai al suo furore?\n@c0@"
  ja: "@a@b闇に光る　巨大な眼。\nその下に光るものは　するどいキバ。\n今　闇が　ひきさかれる！\n@c0@"
60:
  de: "@a@bDie wogenden Regenfluten des Wolkenbruchs finden endlich den ruhigen, breiten Strom. Doch stille Wasser sind tief. Womöglich tiefer als die Tiefen der Hölle...\n@c0@"
  en: "@a@bThe torrential rain at last finds the calm, wide river. But still waters run deep. Still deeper than the depths of hell...\n@c0@"
  es: "@a@bLa lluvia torrencial llega por fin a un río ancho y tranquilo. Pero las aguas aún son profundas. Más profundas que el mismo infierno...\n@c0@"
  fr: "@a@bLes pluies torrentielles trouvent enfin le calme d'un large fleuve. Mais ses eaux sont profondes.\r\nPlus profondes que l'enfer...\n@c0@"
  it: "@a@bUn fiume di rabbia cieca ti sbarra il passo.\nTrova il guado che ti permetterà di superarlo, oppure annega nelle sue acque impetuose!\n@c0@"
  ja: "@a@b降りすさむ雨は　やがて大河に。\n河底に　うごめくものは　死の前兆。\n@c0@"
61:
  de: "@a@bEin grässlicher Flügelschlag. Ein spitzer Schnabel und messerscharfe Krallen. Ein Einzelfahrschein zur Hölle!\n@c0@"
  en: "@a@bA hideous beating of wings. A honed beak and razor-sharp talons. A one-way ticket to hell!\n@c0@"
  es: "@a@bUn espantoso batir de alas. Pico afilado y garras como navajas. ¡Un viaje de ida al infierno!\n@c0@"
  fr: "@a@bUn horrible battement d'ailes. Un bec acéré et des serres plus tranchantes qu'un rasoir.\nUn aller simple pour l'enferⓠ\n@c0@"
  it: "@a@bIl frenetico battito d'ali preannuncia l'arrivo di un cuore gonfio d'odio e di artigli affilati come lame...\nDifenditi o perisci!\n@c0@"
  ja: "@a@bおぞましき　はばたきの音。\nとがったクチバシと　するどいツメは\n地獄につづく　招待券。\n@c0@"
62:
  de: "@a@bDas unbehaglich warme Lüftchen, das über dem Grabstein weht. Die feurigen Tiefen rufen.\n@c0@"
  en: "@a@bThe uncomfortable heat of the breeze blowing over the tombstone. The fiery depths beckon.\n@c0@"
  es: "@a@bEl calor molesto de la brisa sobre la lápida. Los abismos ardientes te llaman.\n@c0@"
  fr: "@a@bUne brise à la moiteur désagréable souffle sur la pierre tombale. Les redoutables profondeurs vous appellent.\n@c0@"
  it: "@a@bIl vento caldo della morte...\nDovrai lottare come l'eroe della leggenda, per non farti trascinare nel più profondo degli inferni!\n@c0@"
  ja: "@a@bなまあたたかく　通りすぎる\n墓石からの　風のゆくえ。\n今　死の世界が　しのびよる！\n@c0@"
63:
  de: "@a@bWer zu viel Zeit damit verbringt, seine Groschen zu zählen, läuft Gefahr, das Loch in seiner Börse zu übersehen.\n@c0@"
  en: "@a@bHe who spends too much time counting his pennies may not notice the hole in his purse.\n@c0@"
  es: "@a@bEl que pasa demasiado tiempo contando su dinero no nota el agujero en su bolsillo.\n@c0@"
  fr: "@a@bCelui qui passe trop de temps à compter ses pièces ne remarque pas toujours le trou dans son escarcelle.\n@c0@"
  it: "@a@bStolto è colui che non ha rispetto per il proprio denaro!\n@c0@"
  ja: "@a@b不注意なる者\nおのれのサイフの穴に　気づかず。\n@c0@"
64:
  de: "@a@b%0%a000120 verliert 100 Goldmünzen!\n@c0@"
  en: "@a@b%0%a000120 loses 100 gold coins!\n@c0@"
  es: "@a@b¡%0%a000120 pierde 100 monedas de oro!\n@c0@"
  fr: "@a@b%0%a000120 perd 100 pièces d'orⓠ\n@c0@"
  it: "@a@b%0%a000120 ha perso 100 monete d'oro!\n@c0@"
  ja: "@a@b%a000120は　１００ゴールドを\nうしなった！\n@c0@"
65:
  de: "@a@bRegnet es Sterntaler? %0%a000120%K0120%X'%Ys%Z Geldbeutel fühlt sich plötzlich schwerer an!\n@c0@"
  en: "@a@bPennies from heaven? %0%a000120's purse feels somewhat heavier!\n@c0@"
  es: "@a@b¿Dinero caído del cielo? ¡El bolsillo de %a000120 parece más pesado!\n@c0@"
  fr: "@a@bDe l'or tombé du cielⓡ L'escarcelle %G0120%Xd'%Yde %Z%a000120 paraît un peu plus lourdeⓠ\n@c0@"
  it: "@a@bNon manna, ma denaro dal cielo!\nLa borsa di %a000120 è diventata più pesante!\n@c0@"
  ja: "@a@bそれは　天の恵みか？\n%a000120の　サイフが　すこし\n重くなった！\n@c0@"
66:
  de: "@a@b%0%a000120 erhält 100 Goldmünzen!\n@c0@"
  en: "@a@b%0%a000120 gains 100 gold coins!\n@c0@"
  es: "@a@b¡%0%a000120 gana 100 monedas de oro!\n@c0@"
  fr: "@a@b%0%a000120 gagne 100 pièces d'orⓠ\n@c0@"
  it: "@a@b%0%a000120 ha ottenuto 100 monete d'oro!\n@c0@"
  ja: "@a@b%a000120は　１００ゴールドを\n手に入れた！\n@c0@"
67:
  de: "@a@bDas Kreuchen und Fleuchen legt sich für eine Weile...\n@c0@"
  en: "@a@bThe writhing settles for a while...\n@c0@"
  es: "@a@bLa agitación cesa durante unos momentos...\n@c0@"
  fr: "@a@bL'agitation se calme pendant un moment...\n@c0@"
  it: "@a@bLa quiete che segue alla tempesta...\nO forse è l'attimo di pace che precede un evento nefasto...?\n@c0@"
  ja: "@a@bうごめくものどもに　ひとときの\nねむりを……。\n@c0@"
68:
  de: "@a@bIn der näheren Umgebung ist fürs Erste keine Spur von Monstern mehr zu sehen!\n@c0@"
  en: "@a@bThere doesn't appear to be any trace of monsters in the vicinity for now!\n@c0@"
  es: "@a@b¡Parece que no hay rastro de monstruos en los alrededores!\n@c0@"
  fr: "@a@bIl ne semble pas y avoir de trace de monstres dans les parages pour l'instantⓠ\n@c0@"
  it: "@a@bIn questo momento, non ci sono mostri nei paraggi.\n@c0@"
  ja: "@a@bあたりから　まものたちの気配が\n消えていった！\n@c0@"
69:
  de: "@a@bHinab, hinab, immer weiter hinab... Die Münze, die in den Brunnen fiel, verursacht keinerlei Geräusch. Der tiefe Sturz scheint endlos. \n@c0@"
  en: "@a@bDown, down, down... No sound from the coin dropped in the well. No end to the plummeting depths.\n@c0@"
  es: "@a@bAbajo, abajo, abajo... La moneda lanzada al pozo no devuelve sonido alguno. Es un abismo sin fondo.\n@c0@"
  fr: "@a@bToujours plus bas, plus bas, plus bas... Aucun bruit provoqué par la pièce jetée dans le puits.\r\nAucun fond à ces insondables profondeurs.\n@c0@"
  it: "@a@bPrecipizio senza fine, paura dell'oscurità e dell'ignoto. Giù, ancora più giù, sempre più giù...\nSolo gli eroi sanno trasformare la caduta in volo.\n@c0@"
  ja: "@a@bそれは　ならくの底か？\nなんじを　飲み込む　巨大な穴……\n@c0@"
70:
