0:
  de: "@a%0%a001240@bHast du das gesehen?! Der riesige Felsen ist einfach geschmolzen!\n@c0@"
  en: "@a%0%a001240@bDid you see that!? That huge great rock just melted away into nothing!\n@c0@"
  es: "@a%0%a001240@b¡¿Has visto eso?! ¡Esa roca inmensa ha desparecido como si nada!\n@c0@"
  fr: "@a%0%a001240@bTu as vuⓠⓑ Ce gros rocher a disparu\nd'un seul coupⓠ\n@c0@"
  it: "@a%0%a001240@bHai visto?!\nQuella gigantesca roccia si è fusa come burro in padella!\n@c0@"
  ja: "@a@b%a001240「すごいやっ！\n\t大きな岩が　ドロドロにとけて\n\tなくなっちゃったよ！\n@c0@"
1:
  de: "@aSancho@bSieh nur, Chico! Auf dem Grund des Sees ist ein Castillo!\n@c0@"
  en: "@aSancho@bLook, friend! There ees a castle at the\r\nbottom of the lake!\n@c0@"
  es: "@aSancho@b¡Mira, chamaco! ¡Hay un castillo en el fondo del lago!\n@c0@"
  fr: "@aSancho@bR-Regarde, chicoⓠ Il y a un castel au fond du lacⓠ\n@c0@"
  it: "@aSancho@b¡Mira, chico!\n¡Ce está un castillo en fundo al lago!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　見てください！\n\tほら　湖の底に　お城が沈んでいるのが\n\t見えますよ！\n@c0@"
2:
  de: "@a%0%a001250@bDieser Magmastab ist wirklich beängstigend. Stell dir nur vor, was alles passieren könnte, wenn er in die falschen Hände geriete!\n@c0@"
  en: "@a%0%a001250@bThat magma staff is really frightening. Imagine what damage it could do if it fell into the wrong hands.\n@c0@"
  es: "@a%0%a001250@bEse báculo de magma da miedo. Imagina el daño que podría causar si cayese en las manos equivocadas.\n@c0@"
  fr: "@a%0%a001250@bCe bâton de lave est vraiment terrifiant.\nImagine les dégâts qu'il pourrait causer\ns'il tombait entre de mauvaises mains.\n@c0@"
  it: "@a%0%a001250@bIl bastone di magma è un oggetto potentissimo!\nNon voglio nemmeno pensare a cosa potrebbe succedere se cadesse nelle mani sbagliate...\n@c0@"
  ja: "@a@b%a001250「マグマの杖って　こわいね。\n\tこんな杖　魔物さんに使ったら\n\tかわいそうなの……。\n@c0@"
3:
  de: "@a%0%a001240@bDas hier ist keine normale Höhle. Es ist fast so aus, als wäre sie gebaut worden. Sieh nur! Der Stein da ist ganz gerade gehauen!\n@c0@"
  en: "@a%0%a001240@bThis place doesn't feel like a normal cave.\nIt's like someone made it. See! The rock there\nis cut dead straight!\n@c0@"
  es: "@a%0%a001240@bEsto no parece una cueva normal.\nParece como si alguien la hubiese construido. ¡¿Ves?! ¡Aquella roca tiene un corte recto!\n@c0@"
  fr: "@a%0%a001240@bCet endroit ne ressemble pas à une grotte normale. C'est comme si quelqu'un l'avait fabriquée. Regardeⓠ Là, la roche est parfaitement tailléeⓠ\n@c0@"
  it: "@a%0%a001240@bQuesta non è una grotta naturale. Secondo me è stata scavata da qualcuno... Guarda, alcune rocce sono state tagliate in modo troppo netto e preciso.\n@c0@"
  ja: "@a@b%a001240「洞くつ　っていうより\n\t誰かが　つくった所みたいだね。\n\tほら　石の切り口がまっすぐだよ。\n@c0@"
4:
  de: "@aOtto@bGöttin im Himmel! Wie tief, glaubt Ihr, ist diese Höhle?\n@c0@"
  en: "@aTuppence@bGood heavens! How deep do you suppose\r\nthis cave is?\n@c0@"
  es: "@aAlazar@b¡Cielo santo! ¿Qué profundidad tendrá esta cueva?\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ Je me demande jusqu'où s'enfonce cette grotteⓠ\n@c0@"
  it: "@aSimon@bPerbacco!\nQuanto sarà profonda questa grotta?\n@c0@"
  ja: "@a@bピピン「この洞くつ……。\n\tどこまで続いてるんでしょう？\n@c0@"
5:
  de: "@aSancho@bHier es ist so dunkel wie unter eine Sombrero. Pass auf, wo du hintrittst, Chico. Komm nachher nisst angelaufen, wenn du gefallen bist, si?\n@c0@"
  en: "@aSancho@bEes very dark. You must be careful where you are walking. You no come crying eef you fall over, okay?\r\n@c0@"
  es: "@aSancho@bQué oscuro está esto, híjole. Ten cuidado por dónde andas. Si te caes no llores, ¿eh?\n@c0@"
  fr: "@aSancho@bIl f-fait très sombreⓠ Tu dois faire attention où tu mets les p-pieds. Ne viens pas pleurer si tu tombesⓠ\n@c0@"
  it: "@aSancho@bAquí es muy buio.\nFacciamo attenziones a donde mettiamo los piedes, altrimenti faremo un bel capitombolos...\n@c0@"
  ja: "@a@bサンチョ「暗いですから　足もとに\n\tよーく　お気をつけて！\n\t転んでも　泣いちゃダメですよ！\n@c0@"
6:
  de: "@a%0%a001250@bIch mag die Dunkelheit nicht, aber ich versuche, mir nichts anmerken zu lassen. Na, wenigstens ist das besser als irgendwo hoch oben in der Luft.\n@c0@"
  en: "@a%0%a001250@bI don't really like the dark, but I'll try not to let it get to me. At least it's better than being somewhere\nhigh up.\n@c0@"
  es: "@a%0%a001250@bNo me gusta la oscuridad, pero intentaré superarlo. Siempre es mejor que las alturas.\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas beaucoup le noir, mais je vais essayer de me maîtriser. C'est toujours mieux que d'être en hauteurⓠ\n@c0@"
  it: "@a%0%a001250@bGli ambienti senza luce mi mettono inquietudine, ma cercherò di mantenere la calma. In ogni caso, sono sempre meglio dei luoghi alti. Sai, soffro di vertigini...\n@c0@"
  ja: "@a@b%a001250「わたし　くらいところ\n\t苦手だけど　がんばるね。\n\t高いところよりは　大丈夫だから。\n@c0@"
7:
  de: "@aSancho@bUff! So etwas hatte iss nisst erwartet!\n@c0@"
  en: "@aSancho@bUf! I was no expecting to find esometheeng\r\nlike thees!\n@c0@"
  es: "@aSancho@b¡Ándale! ¡No esperaba encontrar algo así!\n@c0@"
  fr: "@aSancho@bEh bahⓠ Je ne m'attendais pas à t-t-tomber sur quelque chose comme çaⓠ\n@c0@"
  it: "@aSancho@b¿Eh?\n¿Y esta que robas es?\n@c0@"
  ja: "@a@bサンチョ「こりゃあ　たまげた！\n\tえらい物を　見つけましたね。\n\tははあ……。\n@c0@"
8:
  de: "@a%0%a001240@bPapa! Können wir auf dem Ding mal fahren? Das wär bestimmt lustig!\n@c0@"
  en: "@a%0%a001240@bHey, Dad! Can we have a ride on that thing?\nI reckon it'd be a right laugh!\n@c0@"
  es: "@a%0%a001240@b¡Eh, papi! ¿Podemos montarnos en eso?\n¡Seguro que es muy divertido!\n@c0@"
  fr: "@a%0%a001240@bHé, papaⓠ On peut faire un tour là-dessusⓡ\nJe suis sûr que ça serait drôleⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, possiamo fare un giro?\nDai, sarà divertente!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん！\n\tあれに　乗ろうよ！\n\tきっと　何回乗っても　楽しいよ？\n@c0@"
9:
  de: "@a%0%a001250@bSo ein Gefährt hab ich noch nie gesehen.\n@c0@"
  en: "@a%0%a001250@bI've never seen a cart like that before.\n@c0@"
  es: "@a%0%a001250@bNunca había visto una vagoneta así.\n@c0@"
  fr: "@a%0%a001250@bC'est la première fois que je vois un chariot\ncomme ça.\n@c0@"
  it: "@a%0%a001250@bToh!\nUn carrello da miniera!\n@c0@"
  ja: "@a@b%a001250「あれ　トロッコっていうの？\n\t見たの　初めて……。\n@c0@"
10:
  de: "@a%0%a001240@bSieh dir nur all diese Wagen an! Wie soll man sich da für einen entscheiden?\n@c0@"
  en: "@a%0%a001240@bWow! Look at all those carts! How are we supposed to decide which one to get on?\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Mira todos esos vagones! ¿Cómo vamos a decidir en cuál nos montamos?\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde tous ces chariotsⓠ Comment on fait pour choisir celui dans lequel on veut grimperⓡ\n@c0@"
  it: "@a%0%a001240@bUh! Quanti carrelli!\nSu quale vogliamo salire?\n@c0@"
  ja: "@a@b%a001240「うわ～！\n\tトロッコが　いっぱいだよ？\n\tどれに乗ろうか　迷っちゃうよね。\n@c0@"
11:
  de: "@a%0%a001250@bDer Gedanke, mit einem dieser Wagen zu fahren, macht mich ein wenig nervös. Aber es ist auch irgendwie aufregend...\n@c0@"
  en: "@a%0%a001250@bI'm a bit nervous of riding about on these carts.\n...I suppose I'm quite excited too, though.\n@c0@"
  es: "@a%0%a001250@bEso de montar en una vagoneta me pone un poco nerviosa.\n... Aunque también estoy ansiosa por hacerlo.\n@c0@"
  fr: "@a%0%a001250@bÇa m'inquiète un peu de devoir monter dans ces chariots. Bon... c'est vrai que ça m'amuse aussi...\n@c0@"
  it: "@a%0%a001250@bIl pensiero di dover salire su quei carrelli mi innervosisce un po'...\nPerò potrebbe essere divertente farci un giro!\n@c0@"
  ja: "@a@b%a001250「トロッコ　こわいけど\n\tドキドキして…　ちょっと\n\t楽しい…　かな？\n@c0@"
12:
  de: "@aSancho@bDeine Onkel Sancho ist noch nie auf eine solsse Gefährt gefahren. Es ist wunderbar!\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he ees never riding on esometheeng like thees before. Ees, ees eso exciting!\n@c0@"
  es: "@aSancho@bTito Sancho nunca ha montado en una cosa así antes. ¡Qué padre!\n@c0@"
  fr: "@aSancho@bT-Ton oncle Sancho n'est jamais monté sur un t-truc comme ça avant. C-C'est v-vraiment excitantⓠ\n@c0@"
  it: "@aSancho@bEs muy divertente fare un giros su un carrellos...\n¡Ay, que emoción!\n@c0@"
  ja: "@a@bサンチョ「あんな　速い乗り物\n\tこのサンチョ　初めてですよ！\n\tまだ　むねがドキドキしてます。\n@c0@"
13:
  de: "@aOtto@bWir müssen also nur in dieses Gefährt steigen und erreichen prompt unser Ziel? Ha! Na, wenn das so einfach wäre.\n@c0@"
  en: "@aTuppence@bSo all we have to do to reach our goal is clamber aboard a cart and settle down for the ride?\r\nHa! If only it were that simple.\n@c0@"
  es: "@aAlazar@b¿Así que, para alcanzar nuestro objetivo, lo único que tenemos que hacer es subirnos en una vagoneta y ponernos cómodos?\n㈡\n¡Ja! Si fuese tan sencillo...\n@c0@"
  fr: "@aInnocent@bAlors tout ce qu'on a à faire pour atteindre notre but, c'est monter dans ce chariot, et en avantⓡ\nAh, si seulement c'était aussi simpleⓠ\n@c0@"
  it: "@aSimon@bQuindi per raggiungere la nostra meta non dobbiamo fare altro che salire su un carrello?\r\nMi sembra fin troppo semplice...\n@c0@"
  ja: "@a@bピピン「入り口から　ゴールまで\n\tトロッコに乗るだけ！\n\t……だったら　よかったのに。\n@c0@"
14:
  de: "@aSancho@bWeißt du, die Geschwindigkeit macht mir ja gar nissts aus, aber diese Sprünge! Aaah! Das ist irgendwie unheimliss, no?\n@c0@"
  en: "@aSancho@bYou know, I no mind the espeed of the carts eso much now, but these jumps! Anda! Ees escary, eh?\n@c0@"
  es: "@aSancho@bLa velocidad de los vagones pues no me importa, pero estos saltos... ¡Ándale! Qué miedo, ¿eh?\n@c0@"
  fr: "@aSancho@bT-Tu sais, la vitesse ne me dérange pas trop,\nmais ces sautsⓠ Ça r-remue l'estómagoⓠ\n@c0@"
  it: "@aSancho@b¡No es la velocidad que me preoccupa, ma los saltos!\n¡Dea santissima, proteggece tu!\n@c0@"
  ja: "@a@bサンチョ「トロッコの　スピードにも\n\tなれましたが　あの　ジャンプだけは\n\tどうも…　心臓が　バクバクして……。\n@c0@"
15:
  de: "@a%0%a001250@bHm... Also erst geht's hier lang... dann dorthin... die Weichen umstellen... und... Oh! Jetzt hab ich den Faden verloren!\n@c0@"
  en: "@a%0%a001250@bUm... So we go over there... Then up there... Change the points... And... Oh! I'm completely confused!\n@c0@"
  es: "@a%0%a001250@bMmm... Entonces vamos allí... Luego ahí arriba... Cambiamos las agujas... Y... ¡Oh! ¡Estoy hecha un lío!\n@c0@"
  fr: "@a%0%a001250@bMmm... Donc on va là... ensuite, on monte... on change l'aiguillage... et... oh, je suis complètement perdueⓠ\n@c0@"
  it: "@a%0%a001250@bAllora, andiamo di qua...\nPoi proseguiamo di là... Azionamo lo scambio e poi...\nUhm, non ne ho la più pallida idea.\n@c0@"
  ja: "@a@b%a001250「え～と…　ああ行って…\n\tこう行って　ポイントを切りかえて…\n\tあ～ん　わかんない～～！\n@c0@"
16:
  de: "@a%0%a001250@bGlaubst du, wir können einfach so in dieses Gefährt steigen, Papa? Ganz ohne Plan? Was ist, wenn wir uns verirren und nicht mehr hier rausfinden?\n@c0@"
  en: "@a%0%a001250@bDo you think it's safe just to get on these things without a grand plan, Dad? What happens if we get lost and can't find our way out of here?\n@c0@"
  es: "@a%0%a001250@b¿Crees que es seguro subirse en uno de estos sin antes tener un buen plan, papá? ¿Y si nos perdemos y no somos capaces de encontrar la salida?\n@c0@"
  fr: "@a%0%a001250@bPapa, tu ne crois pas qu'on devrait réfléchir un peu avant de monter sur ces trucsⓡ Et si on se perd et qu'on n'arrive pas à retrouver notre cheminⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, credi che facciamo bene a montare su un carrello senza sapere dove ci porterà?\nE se ci perdessimo?\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tてきとうに　行っても大丈夫？\n\t帰れなくなったり　しないよね？\n@c0@"
17:
  de: "@a%0%a001240@bIch weiß! Wir werden einfach jeden einzelnen Wagen ausprobieren ⓚⓛ das macht bestimmt Spaß!\n@c0@"
  en: "@a%0%a001240@bI know! We should have a ride on every single cart there is! It's just so much fun!\n@c0@"
  es: "@a%0%a001240@b¡Ya sé! ¡Vamos a montarnos en todos los vagones! ¡Es muy divertido!\n@c0@"
  fr: "@a%0%a001240@bJe saisⓠ On devrait essayer chacun des chariotsⓠ C'est tellement rigoloⓠ\n@c0@"
  it: "@a%0%a001240@bPotremmo provare tutti i carrelli, no?\nPrima o poi ne troveremo uno che fa al caso nostro...\n@c0@"
  ja: "@a@b%a001240「ねえ　全部の\n\tトロッコに乗ろうね！\n\tわ～い！　たのしいな～～！\n@c0@"
18:
  de: "@aOtto@bJuchhu! Ich hätte nie gedacht, dass das solch einen Spaß machen würde! Oh, Reisen ist wunderbar, wer würde darauf schon freiwillig verzichten wollen?\n@c0@"
  en: "@aTuppence@bYippee! I never imagined such a fantastically fun place existed! It's things like this that make travelling impossible to give up.\n@c0@"
  es: "@aAlazar@b¡Yupiii! ¡No tenía ni idea de que existiese un sitio tan genial! Estas cosas son las que le hacen a uno aficionarse a los viajes.\n@c0@"
  fr: "@aInnocent@bSuperⓠ Je n'aurais jamais pensé qu'il pouvait exister un endroit aussi fantastiqueⓠ\n㈡\nCe sont des choses comme ça qui font qu'une fois qu'on a commencé à voyager, on ne peut plus s'arrêter.\n@c0@"
  it: "@aSimon@bChe forza!\nQuesto posto è un vero spasso!\n@c0@"
  ja: "@a@bピピン「いや～！\n\tこんな楽しい場所が　あったなんて！\n\tこれだから　旅はやめられませんね。\n@c0@"
19:
  de: "@aOtto@bEs wär doch lustig, wenn wir so etwas auch in Humburg hätten, net wahr?\n㈡\nDann würd' der Wachrundgang um die Burg viel schneller vonstatten gehen!\n@c0@"
  en: "@aTuppence@bThink how much fun it would be if we had\r\nsomething like this in Gotha. It would speed\r\npatrol duty up no end.\n@c0@"
  es: "@aAlazar@bSería muy divertido si tuviésemos una cosa así en Pankraz. La patrulla sería mucho más rápida.\n@c0@"
  fr: "@aInnocent@bVous imaginez comme ce serait amusant d'avoir quelque chose dans ce genre à Gotha. Nos patrouilles iraient beaucoup plus vite.\n@c0@"
  it: "@aSimon@bDovremmo installare un sistema di carrelli su rotaia anche a Denim. I giri di pattuglia sarebbero molto più veloci, e infinitamente più divertenti!\n@c0@"
  ja: "@a@bピピン「あれ　グランバニアにも\n\tあるといいですよね。　そしたら\n\t見まわりも　あっという間に……。\n@c0@"
20:
  de: "@aSancho@bBist du auch nisst nass geworden, Chico? Diese Wasserfall war ganz schön gemein, no?\n@c0@"
  en: "@aSancho@bYou no get wet before, friend?\nThees waterfall, he has a mind of hees own, eh?\n@c0@"
  es: "@aSancho@b¿No te has mojado antes, chamaco?\nEsa cascada... parece que lo haga con toda su mala intención.\n@c0@"
  fr: "@aSancho@bT-Tu ne t'es pas fait mouiller, chicoⓡ\nCette chute, elle f-fait ce qu'elle v-veut, heinⓡ\n@c0@"
  it: "@aSancho@bNo me gustano las cascatas sotterraneas.\nL'agua es troppos freddas, y no es buena por la paella...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！\n\tさっきは　ぬれませんでしたか？\n\tまさか　滝につっこむとは…　とほほ。\n@c0@"
21:
  de: "@a%0%a001250@bDiese Wagen gefallen mir von Mal zu Mal mehr. Können wir nicht noch einmal fahren, Papa?\n@c0@"
  en: "@a%0%a001250@bI'm quite keen on these carts now. Can we have a few more goes on them, Dad?\n@c0@"
  es: "@a%0%a001250@bAhora ya me gustan los vagones. ¿Podemos dar unas cuantas vueltas más en ellos, papi?\n@c0@"
  fr: "@a%0%a001250@bJ'aime bien ces chariots, maintenant. On ne peut pas faire encore quelques tours, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, possiamo fare qualche altro giro sui carrelli?\nSono troppo divertenti!\n@c0@"
  ja: "@a@b%a001250「わたしも　トロッコ\n\t少し　おもしろくなってきた。\n\tお父さん　もっと乗ろ？\n@c0@"
22:
  de: "@a%0%a001240@bDas nächste Mal müssen wir Onkel Bastl mitnehmen. Das würde ihm gefallen!\n@c0@"
  en: "@a%0%a001240@bWe'll have to bring Uncle Bertie with us next time. He'd love it here!\n@c0@"
  es: "@a%0%a001240@bLa próxima vez le diremos al tío Agila que se venga. ¡Le va a encantar esto!\n@c0@"
  fr: "@a%0%a001240@bIl faudra qu'on emmène oncle Albert la prochaine fois. Je suis sûr qu'il adorerait.\n@c0@"
  it: "@a%0%a001240@bDobbiamo tornare qui con lo zio Alberto e la cugina Gertrude!\nSono sicuro che si divertirebbero moltissimo!\n@c0@"
  ja: "@a@b%a001240「今度　オジロンおじさんも\n\t連れてきてあげたいな。\n\tすっごく　おもしろいんだもん！\n@c0@"
23:
  de: "@a%0%a001240@bIch hätte nicht gedacht, dass wir hier auf einen Priester treffen würden. Außerdem war er ein wenig seltsam.\n@c0@"
  en: "@a%0%a001240@bI didn't expect to find a priest in here.\nHe was a bit of a strange one.\n@c0@"
  es: "@a%0%a001240@bNo esperaba encontrar un sacerdote aquí.\nEra un poco extraño.\n@c0@"
  fr: "@a%0%a001240@bJe ne m'attendais pas à tomber sur un prêtre ici.\nIl avait l'air un peu bizarre.\n@c0@"
  it: "@a%0%a001240@bChe ci fa qui sotto quel sacerdote?\nForse ha deciso di nascondersi qui perché ha paura dei mostri che ci sono in superficie?\n@c0@"
  ja: "@a@b%a001240「こんなところに　神父さまが\n\tいるなんて　思わなかったよ。\n\tでもちょっと　かわった神父さまだね。\n@c0@"
24:
  de: "@aOtto@bEs wäre nett, wenn wir nun keinen Monstern mehr begegnen würden. Die Reise wäre gleich viel angenehmer.\n@c0@"
  en: "@aTuppence@bIt would be nice if we didn't have to encounter any more monsters now. Much more enjoyable.\n@c0@"
  es: "@aAlazar@bEstaría bien que no nos encontrásemos con ningún otro monstruo. Sería más agradable.\n@c0@"
  fr: "@aInnocent@bCe serait vraiment bien si nous arrêtions de tomber sur des monstres, maintenant. Ce serait plus relaxant.\n@c0@"
  it: "@aSimon@bQuesto viaggio è un'esperienza divertente e istruttiva. Peccato che, ovunque andiamo, incontriamo mostri assetati di sangue...\n@c0@"
  ja: "@a@bピピン「これで　魔物が出なければ\n\tもっと　楽しめるんですけどねえ……。\n@c0@"
25:
  de: "@a%0%a001240@bHast du das gehört? Da fährt ein Wagen! Komm, wir sehen mal nach.\n@c0@"
  en: "@a%0%a001240@bDid you hear that? It's a cart going round!\nWe should go and have a look.\n@c0@"
  es: "@a%0%a001240@b¿Has oído eso? ¡Es el ruido de una vagoneta!\nVamos a echar un vistazo.\n@c0@"
  fr: "@a%0%a001240@bTu as entenduⓡ On dirait un chariot qui tourne en rond. Il faut aller voir.\n@c0@"
  it: "@a%0%a001240@bSento il rumore di un carrello in movimento...\nAndiamo a vedere di che si tratta!\n@c0@"
  ja: "@a@b%a001240「あれ？　なんか音がするよ。\n\tあっ！　トロッコが回ってる！\n\t行ってみようよ！\n@c0@"
26:
  de: "@aSancho@bWir müssen diese Señor helfen. Schnell, Chico!\n@c0@"
  en: "@aSancho@bWe must help thees señor.\nQuick, friend!\n@c0@"
  es: "@aSancho@bTenemos que ayudar a ese señor.\n¡De volada, chamaco!\n@c0@"
  fr: "@aSancho@bIl f-faut aider ce señor. V-Vite, chicoⓠ\n@c0@"
  it: "@aSancho@b¡Dobbiamo aiutare quel pobrecito, chico!\r\n¡Pronto!\r\n¡No ce es tiempo da perdere!\n@c0@"
  ja: "@a@bサンチョ「こりゃいかん！\n\t早く　助けてあげないと！\n\t坊っちゃんっ　行きましょう！\n@c0@"
27:
  de: "@a%0%a001240@bEs müsste ihm doch eigentlich Spaß machen, mit dem Wagen im Kreis zu fahren. Hört sich aber nicht so an...\n@c0@"
  en: "@a%0%a001240@bYou'd think he'd be enjoying going round and round like that. It doesn't sound like it, though.\n@c0@"
  es: "@a%0%a001240@bYo pensaba que debía de encontrar divertido dar vueltas y vueltas así, pero parece que no.\n@c0@"
  fr: "@a%0%a001240@bÇa doit être amusant de tourner en rond comme ça, mais il n'a pas l'air d'apprécier.\n@c0@"
  it: "@a%0%a001240@bIo mi divertirei come un matto a girare su un carrello in quel modo!\nPerché a quel signore non piace?\n@c0@"
  ja: "@a@b%a001240「いいなあ　あの人\n\tぐるぐる回って\n\t楽しそう……　じゃないね。\n@c0@"
28:
  de: "@a%0%a001250@bWie der herumsaust! Allein vom Zuschauen wird mir schon schwindelig.\n@c0@"
  en: "@a%0%a001250@bWatching him whirling around is starting to make me feel dizzy.\n@c0@"
  es: "@a%0%a001250@bMe estoy empezando a marear de verle dar vueltas.\n@c0@"
  fr: "@a%0%a001250@bÀ force de le regarder tourner en rond, je commence à avoir la nausée.\n@c0@"
  it: "@a%0%a001250@bMi viene il mal di stomaco solo a guardare...\nNon voglio nemmeno pensare a come mi sentirei se fossi su quel carrello!\n@c0@"
  ja: "@a@b%a001250「あの人見てたら\n\tなんだか　目が　回ってきちゃった。\n\tうう～………。\n@c0@"
29:
  de: "@aOtto@bWie schrecklich! Tja, so etwas geschieht, wenn man einfach in einen Wagen steigt und die Weichen net richtig stellt.\n@c0@"
  en: "@aTuppence@bHow terrifying! That's what happens if you just clamber on without thinking about lining\r\nyour points up first.\n@c0@"
  es: "@aAlazar@b¡Qué horror! Eso es lo que pasa si no piensas en alinear las vías antes.\n@c0@"
  fr: "@aInnocent@bC'est horribleⓠ Voilà ce qui arrive quand on grimpe dans un chariot sans penser à vérifier l'aiguillage.\n@c0@"
  it: "@aSimon@bEcco cosa succede quando si sale un carrello senza essersi prima assicurati di aver azionato gli scambi in maniera corretta...\n@c0@"
  ja: "@a@bピピン「ポイントの切りかえを\n\t考えないで乗って　あんな目に！？\n\tううっ　おそろしい……！\n@c0@"
30:
  de: "@aSancho@bKaputt! Wir müssen diese Señor helfen!\n@c0@"
  en: "@aSancho@bEes broken!\r\nWe must help thees señor.\n@c0@"
  es: "@aSancho@b¡Está roto!\nTenemos que ayudar a ese señor.\n@c0@"
  fr: "@aSancho@bC'est c-casséⓠ Il f-faut aider ce señor.\n@c0@"
  it: "@aSancho@b¡Es bloccata!\n¡Chico, dobbiamo aiutare quell'hombre!\n@c0@"
  ja: "@a@bサンチョ「こわれちゃいましたね……。\n\tおっと　こうしちゃいられない。\n\tあの人を　助けに行かないと！\n@c0@"
31:
  de: "@a%0%a001250@bOh nein! Das hat einen ganz schönen Knall gegeben. Meinst du, er ist verletzt?\n@c0@"
  en: "@a%0%a001250@bOh no! He took quite a pounding there.\nDo you think he's alright?\n@c0@"
  es: "@a%0%a001250@b¡Oh, no! Se ha llevado un golpe tremendo.\n¿Estará bien?\n@c0@"
  fr: "@a%0%a001250@bOh nonⓠ Il a dû se faire mal. Tu crois qu'il va bienⓠⓑ\n@c0@"
  it: "@a%0%a001250@bCapperi, che botta!\nSperiamo che non si sia fatto troppo male...\n@c0@"
  ja: "@a@b%a001250「あの人　すごい　いきおいで\n\tぶつかっちゃったみたいよ？\n\t大丈夫なの……？？\n@c0@"
32:
  de: "@aOtto@bÄh... Ich werd's auch keinem sagen, keine Sorge. Wenn er den Löffel abgegeben hat, meine ich.\n@c0@"
  en: "@aTuppence@bEr... I w-won't tell anyone, don't worry. If he's kicked the bucket, I mean.\n@c0@"
  es: "@aAlazar@bEjem... Si ha estirado la pata no se lo diré a nadie, no os preocupéis.\n@c0@"
  fr: "@aInnocent@bEuh... Je ne le d-dirai à personne, ne vous inquiétez pas. Enfin, s'il a passé l'arme à gauche, je veux dire.\n@c0@"
  it: "@aSimon@bVisto l'esito della nostra operazione di salvataggio, non ci sarebbe da stupirsi se quel tizio avesse preferito continuare a girare in tondo...\n@c0@"
  ja: "@a@bピピン「ボ　ボク…　あの人が\n\t死んじゃってても\n\t誰にも　言いませんからっ！\n@c0@"
33:
  de: "@a%0%a001240@bIst der Wagen jetzt kaputt? Und fährt nicht mehr im Kreis herum?\n@c0@"
  en: "@a%0%a001240@bIs it broken now? Won't it go round and\nround any more?\n@c0@"
  es: "@a%0%a001240@b¿Ahora está roto? ¿Ya no dará más vueltas?\n@c0@"
  fr: "@a%0%a001240@bIl est casséⓡ Il ne tournera plus en rondⓡ\n@c0@"
  it: "@a%0%a001240@bLa leva dello scambio è bloccata?\nAllora il carrello non girerà più in tondo?\nChe peccato...\n@c0@"
  ja: "@a@b%a001240「こわれちゃったの？\n\tもう　ぐるぐる回れないの？\n@c0@"
34:
  de: "@aSancho@bQué?! Wo sind deine Manieren, Chico? So habe iss diss nisst erzogen, no!\n@c0@"
  en: "@aSancho@bQué!? Ees thees the way I breeng you up, friend?\nNo, ees no!\n@c0@"
  es: "@aSancho@b¡Ay, caramba! ¡Esto no es lo que yo te he enseñado, chamaco!\n¡No señor!\n@c0@"
  fr: "@aSancho@bQuéⓠⓑ C-C'est comme ça que je t'ai élevé, chicoⓡ\nAh ça, nonⓠ\n@c0@"
  it: "@aSancho@b¿Que cosa?\n¡No fare el tonto, chico!\r\n¡Desculpame, Maestà, ma cuando ce vuole ce vuole!\n@c0@"
  ja: "@a@bサンチョ「何してるんです！\n\t私は　坊っちゃんを　そんなふうに\n\t育てた覚えは　ありませんよ！\n@c0@"
35:
  de: "@a%0%a001250@bWir müssen ihm helfen, Papa!\n@c0@"
  en: "@a%0%a001250@bWe have to help him, Dad!\n@c0@"
  es: "@a%0%a001250@b¡Tenemos que ayudarlo, papi!\n@c0@"
  fr: "@a%0%a001250@bIl faut qu'on l'aide, papaⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, dobbiamo aiutarlo!\n@c0@"
  ja: "@a@b%a001250「助けてあげて！\n\tお父さん　がんばって……！\n@c0@"
36:
  de: "@aSancho@bVielleisst es ist ganz gut so. Sonst steigt noch eine andere Señor in diese Wagen und bleibt stecken...\n@c0@"
  en: "@aSancho@bMaybe ees good that ees broken. You never know eef another señor, he ees gonna be estuck on thees cart.\n@c0@"
  es: "@aSancho@bA lo mejor pues está bien que se haya roto. Nunca se sabe, quizá otro señor se podría quedar atrapado de nuevo en esta vagoneta.\n@c0@"
  fr: "@aSancho@bC-Ce n'est peut-être pas plus mal qu'il soit c-cassé.\r\nOn ne sait jamais, quelqu'un d'autre aurait pu se retrouver c-c-coincé sur ce chariot.\n@c0@"
  it: "@aSancho@bPor fortuna l'escambio se es rotto...\nAlmenos, nessun altros correrà el rischio de restare bloccato sul carrello.\n@c0@"
  ja: "@a@bサンチョ「こわれて良かったのかも\n\t知れません。　また　回り続ける人が\n\t出ないとは　限りませんからね。\n@c0@"
37:
  de: "@a%0%a001240@bSieht nicht so aus, als ob man das reparieren könnte... Wie schade.\n@c0@"
  en: "@a%0%a001240@bIt doesn't look like this can be fixed. That's a pity.\n@c0@"
  es: "@a%0%a001240@bParece que no se puede reparar. Qué lástima.\n@c0@"
  fr: "@a%0%a001240@bJe n'ai pas l'impression que ce soit réparable. Dommage.\n@c0@"
  it: "@a%0%a001240@bNon credo che sia possibile sbloccare la leva.\nMi dispiace...\nAnch'io avrei voluto fare qualche giro...\n@c0@"
  ja: "@a@b%a001240「これじゃあ　もう　直せないね。\n\tざんねんだなあ……。\n@c0@"
38:
  de: "@a%0%a001240@bNa, wenigstens ist Dr. Ache nicht verletzt. Und es ist schön, noch jemanden in der Gruppe zu haben.\n@c0@"
  en: "@a%0%a001240@bAt least Dr Agon wasn't hurt. And it's nice to have someone else on the team for a while.\n@c0@"
  es: "@a%0%a001240@bAl menos el Dr. Agón no se ha hecho daño. Y está bien tener una persona nueva en el grupo durante un tiempo.\n@c0@"
  fr: "@a%0%a001240@bAu moins, le Dr Agon n'a pas été blessé. Et puis c'est sympa d'avoir une nouvelle personne dans l'équipe.\n@c0@"
  it: "@a%0%a001240@bSono proprio contento che il Dottor Agon non si sia fatto male e che abbia deciso di unirsi a noi!\n@c0@"
  ja: "@a@b%a001240「とりあえず　プサンさんが\n\tぶじで　良かったね。\n\tおおぜいで歩くのって　たのしいな～！\n@c0@"
39:
  de: "@aSancho@bMadre mía! Jetzt wir haben eine Clown in die Gruppe! Glaubst du, dass er wirkliss eine Zenithianer ist?\n@c0@"
  en: "@aSancho@bAnda! Now we have a clown een the party!\nYou theenk he ees really a Zenithian?\n@c0@"
  es: "@aSancho@b¡Ándale! ¡Ahora tenemos un payaso en el grupo!\n¿De verdad crees que es de Zenithia?\n@c0@"
  fr: "@aSancho@bAndaⓠ Maintenant, on a un c-clown dans l'équipeⓠ\nTu crois vraiment que c'est un Z-Z-Zénithienⓡ\n@c0@"
  it: "@aSancho@bUhm, no me convince...\n¿Piensi davveros que quel tipos sia uno Zenithiano?\n@c0@"
  ja: "@a@bサンチョ「いやはや　とぼけた人が\n\t道連れになったものです。\n\tしかし　天空の民とは……？\n@c0@"
40:
  de: "@a%0%a001250@bÄhm, Papa... Dieser Dr. Ache ist komisch, findest du nicht? Ich weiß zwar nicht wieso, aber irgendwas stimmt nicht mit ihm...\n@c0@"
  en: "@a%0%a001250@bUm, Dad... That Dr Agon is odd, isn't he? I'm not sure what it is, but there's just something a bit weird about him.\n@c0@"
  es: "@a%0%a001250@bMmm, papá... Ese Dr. Agón es raro, ¿no? No estoy segura de qué es, pero hay algo extraño en él, lo presiento.\n@c0@"
  fr: "@a%0%a001250@bMmm, papa... Ce Dr Agon est bizarre, pas vraiⓡ\nJe ne sais pas pourquoi, mais je trouve qu'il y a quelque chose de bizarre chez lui.\n@c0@"
  it: "@a%0%a001250@bPapà, cosa pensi del Dottor Agon?\nA me sembra un tipo strano...\nNon è che ci sta nascondendo qualcosa?\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tあの　プサンって人　ヘンだよ？\n\tなんだか　ふしぎな感じがするの。\n@c0@"
41:
  de: "@aDr. Ache@bWir Zenithianer bleiben in der Regel bis ins hohe Alter fit.\n@c0@"
  en: "@aDr Agon@bWe Zenithians usually live to a ripe old age, y'know.\n@c0@"
  es: "@aDr. Agón@bLos nativillos de Zenithia solemos vivir hasta una edad muy avanzadita.\n@c0@"
  fr: "@aDr Agon@bHabituellement, nous, les Zénithiens, nous vivons très vieux, vous savez.\n@c0@"
  it: "@aDr. Agon@bNoi Zenithiani viviamo molto a lungo...\n@c0@"
  ja: "@a@bプサン「天空の民というのは\n\t長生きなんです。\n@c0@"
42:
  de: "@aDr. Ache@bAber nach zwanzig Jahren auf diesem Unding bin ich so hungrig wie ein Wolf, das kann ich Euch sagen!\n@c0@"
  en: "@aDr Agon@bBut I tell you, twenty years going round on\r\nthat thing, and I'm as hungry as a caterpillar\r\nin a coal mine!\n@c0@"
  es: "@aDr. Agón@b¡Pero, después de veinte añitos dando vueltas ahí, tengo más hambrecilla que un caracol en una cantera de mármol!\n@c0@"
  fr: "@aDr Agon@bMais vingt ans à tourner en rond sur ce chariot...\r\nEn plus, j'ai une faim de loup. Je mangerais un gluant.\n@c0@"
  it: "@aDr. Agon@bMa vent'anni su quel carrello sono davvero troppi!\nSanta fiamma! A furia di girare m'è venuto anche un certo appetito...\n@c0@"
  ja: "@a@bプサン「しかし２０年間　回ってると\n\tさすがに　おなかがへりますね。\n@c0@"
43:
  de: "@aOtto@bIch dachte immer, die Zenithianer wären schöne und kultivierte Wesen. Ich muss zugeben, dass mich der Anblick dieser Person doch ein wenig enttäuscht.\n@c0@"
  en: "@aTuppence@bI always thought the Zenithians were supposed to be a beautiful and cultured race. I must admit that I'm rather taken aback by this character.\n@c0@"
  es: "@aAlazar@bSiempre pensé que los nativos de Zenithia eran bellos y educados. La verdad es que ese personaje me tiene desconcertado.\n@c0@"
  fr: "@aInnocent@bJ'ai toujours cru que les Zénithiens étaient des êtres beaux et cultivés. Je dois dire que je suis un peu surpris.\n@c0@"
  it: "@aSimon@bCredevo che gli Zenithiani fossero individui equilibrati, saggi e di bell'aspetto. Forse questo tizio è l'eccezione che conferma la regola?!\n@c0@"
  ja: "@a@bピピン「天空人さんっていうのは\n\t美男美女ぞろいだと　思ってたのに…\n\tあんな人もいるなんて　ガッカリです。\n@c0@"
44:
  de: "@a%0%a001250@bWarum lassen die Archäologen andere Leute für sich schuften? Das ist doch nicht gerecht!\n@c0@"
  en: "@a%0%a001250@bWhy do the archaeologists send other people in to do their work for them? That doesn't seem right.\n@c0@"
  es: "@a%0%a001250@b¿Por qué los arqueólogos envían a otras personas a hacer su trabajo? No me parece bien.\n@c0@"
  fr: "@a%0%a001250@bPourquoi les archéologues envoient-ils des gens faire leur travail à leur placeⓡ Je trouve que ce n'est pas très juste.\n@c0@"
  it: "@a%0%a001250@bPerché gli archeologi non scavano da soli?\nHanno paura di sporcarsi di terra?\n@c0@"
  ja: "@a@b%a001250「学者さまって　自分で調べないで\n\t人をつかって　発掘させるの？\n\tそんなの…　なんか　ちがう……！\n@c0@"
45:
  de: "@a%0%a001240@bSolch ein lustiger Ort kann unmöglich etwas mit dem Bösen zu tun haben! Bestimmt hat ihn die Göttin erschaffen.\n@c0@"
  en: "@a%0%a001240@bA fun place like this surely can't have been built by someone evil! It must've been the Goddess who did it.\n@c0@"
  es: "@a%0%a001240@b¡Un sitio así de divertido no puede haberlo construido una mala persona! Debe de ser cosa de la Diosa.\n@c0@"
  fr: "@a%0%a001240@bUn endroit aussi amusant ne peut pas avoir été construit par quelqu'un de mauvaisⓠ Ce doit être\nla Déesse qui a eu l'idée.\n@c0@"
  it: "@a%0%a001240@bUn posto così divertente non può che essere stato creato dalla dea. A nessun essere malvagio poteva venire in mente di realizzare uno spasso simile!\n@c0@"
  ja: "@a@b%a001240「こんな楽しいところ\n\t悪いヤツに　つくれるわけないよね？\n\t絶対　神さまが　つくったんだよ！\n@c0@"
46:
  de: "@aSancho@bWie lange ist diese Señor schon hier unten? Oh, ist das traurig...\n@c0@"
  en: "@aSancho@bHow long ees thees señor down here?\nEes esuch a shame for heem.\n@c0@"
  es: "@aSancho@b¿Cuánto tiempo pasó este señor aquí abajo?\nSiento pena por él.\n@c0@"
  fr: "@aSancho@bDepuis c-combien de tiempo ce señor est-il iciⓡ\nJ'ai de la p-peine pour lui.\n@c0@"
  it: "@aSancho@bQuel señor es rimasto aquí sotto mucho tiempo...\n¡Es un miracolo que no es diventato loco!\n@c0@"
  ja: "@a@bサンチョ「あの方は　いったい\n\tいつから　ここに……？\n\tなんというか…　お気のどくですね。\n@c0@"
47:
  de: "@aOtto@bEs ist ja vielleicht ganz lustig, mit den Wagen rumzufahren, aber gefangen möchte ich hier unten net sein.\n@c0@"
  en: "@aTuppence@bIt may be a thrill riding about on the carts, but I certainly wouldn't want to be stuck in here with no way of leaving.\n@c0@"
  es: "@aAlazar@bMontarse en una vagoneta es emocionante, pero no me gustaría quedarme aquí atrapado sin poder salir.\n@c0@"
  fr: "@aInnocent@bC'est peut-être très amusant de faire un tour sur ces chariots, mais je n'aimerais pas rester bloqué dessus comme ça, sans pouvoir descendre.\n@c0@"
  it: "@aSimon@bScorrazzare a bordo di un carrello è divertente, ma restare bloccati su uno di quei cosi per vent'anni filati dev'essere un incubo!\n@c0@"
  ja: "@a@bピピン「いくら　トロッコが楽しくても\n\tこんな洞くつに　閉じこめられるのは\n\tイヤですよ。\n@c0@"
48:
  de: "@a%0%a001240@bGlaubst du, dass Dr. Ache wirklich ein Zenithianer ist?\n@c0@"
  en: "@a%0%a001240@bDo you think Dr Agon really is a Zenithian?\n@c0@"
  es: "@a%0%a001240@b¿Crees que el Dr. Agón es realmente de Zenithia?\n@c0@"
  fr: "@a%0%a001240@bTu crois que le Dr Agon est vraiment un Zénithienⓡ\n@c0@"
  it: "@a%0%a001240@bCredi davvero che il Dottor Agon sia uno Zenithiano?\n@c0@"
  ja: "@a@b%a001240「プサンさんって　ほんとに\n\t天空人なのかな？\n@c0@"
49:
  de: "@a%0%a001240@bEr ist ganz anders als die Zenithianer, die wir bisher getroffen haben. Und Flügel hat er auch keine.\n@c0@"
  en: "@a%0%a001240@bI mean, he's totally different to all the other Zenithians we've met. And he doesn't have\nany wings, either.\n@c0@"
  es: "@a%0%a001240@bEs que es muy distinto de los otros nativos de Zenithia que hemos visto. Y tampoco tiene alas.\n@c0@"
  fr: "@a%0%a001240@bC'est vrai. Il est tellement différent des autres Zénithiens qu'on a rencontrés. Il a même pas d'ailes.\n@c0@"
  it: "@a%0%a001240@bIo non ne sono tanto sicuro. Mi sembra diverso dagli altri Zenithiani che abbiamo incontrato...\nE poi non ha nemmeno le ali!\n@c0@"
  ja: "@a@b%a001240「だって　今まで会った\n\t天空人さんと　ぜんぜん　ちがうよ？\n\tそれに　羽はどうしたのかな。\n@c0@"
50:
  de: "@a%0%a001240@bHmpf. Ich wünschte, ich könnte auch mal mit diesem Wagen im Kreis herumfahren.\n@c0@"
  en: "@a%0%a001240@bHuh. I really wanted a go on that spinning\ncart myself.\n@c0@"
  es: "@a%0%a001240@bMmm. Me hubiese gustado dar una vuelta en esa vagoneta giratorio.\n@c0@"
  fr: "@a%0%a001240@bPfff. J'aurais vraiment aimé faire un tour sur\nce chariot qui tournait en rond.\n@c0@"
  it: "@a%0%a001240@bMi sarebbe piaciuto provare quel carrello che faceva il girotondo...\n@c0@"
  ja: "@a@b%a001240「あーあ…　あの回るトロッコ\n\tボクも　乗りたかったなー。\n@c0@"
51:
  de: "@a%0%a001250@bIrgendwie kann ich mich gar nicht entspannen, wenn Dr. Ache in der Nähe ist. Warum nur?\n@c0@"
  en: "@a%0%a001250@bI can't seem to relax when Dr Agon's about.\nI wonder why.\n@c0@"
  es: "@a%0%a001250@bCuando el Dr. Agón está cerca, no consigo relajarme.\n¿Por qué será?\n@c0@"
  fr: "@a%0%a001250@bJe n'arrive pas à me détendre quand le Dr Agon est dans les parages. Je me demande pourquoi.\n@c0@"
  it: "@a%0%a001250@bNon so spiegarmene il motivo, ma la presenza del Dottor Agon mi inquieta.\n@c0@"
  ja: "@a@b%a001250「なんだか　落ちつかないの\n\tプサンさんが　いると。\n\tなんでだろう……？\n@c0@"
52:
  de: "@a%0%a001250@bWir sollten schnellstens hier verschwinden, Papa.\n@c0@"
  en: "@a%0%a001250@bWe'd better hurry on out of here, Dad.\n@c0@"
  es: "@a%0%a001250@bSerá mejor que nos marchemos cuanto antes, papá.\n@c0@"
  fr: "@a%0%a001250@bOn ferait mieux de se dépêcher de sortir de là, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, sbrighiamoci a uscire da qui.\n@c0@"
  ja: "@a@b%a001250「お父さん\n\tとにかく　先を　いそいで……！\n@c0@"
53:
  de: "@aSancho@bDie Familia von diese Señor Ache muss siss große Sorgen machen, no? Wir müssen ihn so schnell wie mögliss zu ihnen bringen.\n@c0@"
  en: "@aSancho@bThe family of thees señor Agon, they must be eso worried, no? We must take heem to esee\r\nthem quickly.\n@c0@"
  es: "@aSancho@bLa familia de este señor Agón debe de estar bien preocupada. Tenemos que llevarle de vuelta enseguidita.\n@c0@"
  fr: "@aSancho@bLa f-familia du señor Agon doit être inquiète, noⓡ N-Nous devons le r-ramener chez lui.\n@c0@"
  it: "@aSancho@bLos familiares del señor Dottor Agon saranno preoccupatos de no aver avuto noticias del loro congiunto por tanto tiempo...\n@c0@"
  ja: "@a@bサンチョ「プサンさんのご家族も\n\t心配なさってるでしょうね。\n\t早く　連れていってあげましょう。\n@c0@"
54:
  de: "@aSancho@bZwanzig Jahre... Für diss mag das eine lange Zeit sein, Chico, aber wenn du mal so alt bist wie deine Onkel Sancho, weißt du es besser.\n@c0@"
  en: "@aSancho@bTwenty years... Maybe eet feels like a long time to you, friend, but when you are old like your Uncle Sancho, eet goes eso fast.\n@c0@"
  es: "@aSancho@bVeinte años... A ti te parecerá mucho tiempo, chamaco, pero cuando seas viejito como tito Sancho verás que pasan de volada.\n@c0@"
  fr: "@aSancho@bV-Vingt ans... Peut-être que ça te paraît long, chico, mais si tu étais aussi vieux que t-ton oncle Sancho, tu s-saurais que ça passe vite.\n@c0@"
  it: "@aSancho@bVenti años su un carrellos...\r\n¡A propositos! ¡Es una vida que no ho más venti años!\r\nLo zio Sancho está invecchiandos...\n@c0@"
  ja: "@a@bサンチョ「２０年は　坊っちゃんには\n\t長い年月でしょうが\n\tトシを取ると　あっという間ですよ。\n@c0@"
55:
  de: "@aSancho@bAber wahrscheinliss hat man eine andere Eindruck, wenn man zwanzig Jahre auf diese Wagen festsitzt, no?\n@c0@"
  en: "@aSancho@bBut maybe ees no the esame eef you are on a cart all the time, like thees señor Agon, eh?\n@c0@"
  es: "@aSancho@bClaro que no será lo mismo si te la pasas en una vagoneta todo el tiempo como el señor Agón, ¿eh?\n@c0@"
  fr: "@aSancho@bM-Mais peut-être que ce n'est pas p-p-pareil quand on passe tout ce temps sur un ch-chariot, comme le señor Agon.\n@c0@"
  it: "@aSancho@bTodo sommatos, preferisco essere vecchio que trascorrere venti años a girare su un carrello que no se ferma mai...\n@c0@"
  ja: "@a@bサンチョ「プサンさんみたいに\n\tトロッコに乗ったまま　ってのは\n\t特殊だと思いますが。\n@c0@"
56:
  de: "@aOtto@bWirklich unglaublich! Zwanzig Jahre ist er im Kreis herumgefahren, und seine Frisur sitzt immer noch perfekt!\n@c0@"
  en: "@aTuppence@bThat's incredible! Twenty whole years spinning around in circles, and yet he doesn't have a hair\r\nout of place!\n@c0@"
  es: "@aAlazar@b¡Es increíble! ¡Veinte años dando vueltas en círculo y su peinado está perfecto!\n@c0@"
  fr: "@aInnocent@bC'est incroyableⓠ Il a tourné en rond pendant\nvingt ans et sa coiffure n'a pas bougéⓠ\n@c0@"
  it: "@aSimon@bMi sembra incredibile! Il Dottor Agon ha trascorso venti anni a girare in tondo su un carrello e non aveva nemmeno un capello fuori posto!\n@c0@"
  ja: "@a@bピピン「うーむ　すごいっ！\n\t２０年間　回り続けても乱れない\n\tあの　髪のセット！\n@c0@"
57:
  de: "@aOtto@bBei Gelegenheit sollte ich ihn um ein paar Frisiertipps bitten.\n@c0@"
  en: "@aTuppence@bI'll have to remember to pick his brains for some hairstyling tips.\n@c0@"
  es: "@aAlazar@bVoy a tener que pedirle algunos consejos de peluquería.\n@c0@"
  fr: "@aInnocent@bIl faudra que je lui demande des conseils pour ma prochaine coupe. \n@c0@"
  it: "@aSimon@bDevo ricordarmi di chiedergli che lacca usa...\n@c0@"
  ja: "@a@bピピン「これは　ぜひ　プサンさんに\n\t教えてもらわなくては！\n@c0@"
58:
  de: "@aOtto@bWelch ein Glück, dass Dr. Ache zuerst in diesen Wagen gestiegen ist.\n@c0@"
  en: "@aTuppence@bIt's rather fortunate that Dr Agon did decide to have a ride on that cart.\n@c0@"
  es: "@aAlazar@bEs una suerte que el Dr. Agón decidiese montar en esa vagoneta.\n@c0@"
  fr: "@aInnocent@bJe suis plutôt content que ce soit le Dr Agon qui ait décidé de faire un tour sur ce chariot.\n@c0@"
  it: "@aSimon@bCi ho pensato su e sono giunto alla conclusione che il Dottor Agon ha fatto bene a salire su quel carrello.\n@c0@"
  ja: "@a@bピピン「先に　プサンさんが\n\tトロッコで　回っててくれて\n\t助かりましたよ。\n@c0@"
59:
  de: "@aOtto@bAnsonsten hätte ich womöglich das Gefährt gewählt und zwanzig Jahre lang festgesessen!\n@c0@"
  en: "@aTuppence@bOtherwise I might've been the one who ended up stuck on the thing for twenty years solid!\n@c0@"
  es: "@aAlazar@b¡Si no, podría haber sido yo el que me hubiese pasado veinte años enteros atrapado ahí!\n@c0@"
  fr: "@aInnocent@bSinon, c'est peut-être moi qui me serais retrouvé bloqué sur ce chariot pendant vingt ansⓠ\n@c0@"
  it: "@aSimon@bAltrimenti, sarebbe potuto toccare a noi di girare in tondo per vent'anni! Ah ah ah!\r\nEhm...\n@c0@"
  ja: "@a@bピピン「じゃなきゃ　ボクらが\n\t２０年間　回り続けてたかも\n\t知れませんよね。\n@c0@"
60:
  de: "@aDr. Ache@bEiderdaus, das ist ja schon eine Ewigkeit her, dass ich Gelegenheit hatte, mein Mundwerk zu benutzen!\n@c0@"
  en: "@aDr Agon@bGee whillikers, it's been an age since I last had the chance to flap the old facehole!\n@c0@"
  es: "@aDr. Agón@b¡Carambita, hacía un siglo que no tenía oportunidad de charlar un poquitín!\n@c0@"
  fr: "@aDr Agon@bNom d'un petit bonhomme en bois, ça faisait bien longtemps que je n'avais pas eu l'occasion de marcher sur le plancher des vachesⓠ\n@c0@"
  it: "@aDr. Agon@bPer gli ultimi vent'anni non ho detto altro che ⓕAiuto!ⓖ, ⓕVoglio scendere!ⓖ e ⓕAaaaahhh!ⓖ...\n@c0@"
  ja: "@a@bプサン「いやいや　誰かと話すのは\n\tひさしぶりです。\n@c0@"
61:
  de: "@aDr. Ache@bSpreche ich eigentlich richtig? Sagt mir, wenn ich irgendwas Komisches sage, oki-doki? Meine alte Zunge könnte etwas eingerostet sein, dideldum!\n@c0@"
  en: "@aDr Agon@bAm, am I talking properly? Tell me if I'm using any fun-diddly-unny words, will you, friend? I guess the old licker might be a bit rickety-rusty.\n@c0@"
  es: "@aDr. Agón@b¿Estoy hablando bien? Si uso alguna palabrita rara, dímelo, amigo mío. Podría ser que tuviese la lengua un poco oxidadilla.\n@c0@"
  fr: "@aDr Agon@bEuh, je parle correctementⓡ Dites-moi si j'utilise des mots un peu étranges, hein. Je me dis que ma façon de parler doit un peu dater.\n@c0@"
  it: "@aDr. Agon@bSono proprio contento di essere tornato a parlare con qualcuno!\nArdevo dal desiderio di farlo...\n@c0@"
  ja: "@a@bプサン「私　ちゃんとしゃべれてます？\n\tあー　あー　本日は晴天なり\n\tアメンボアカイナ　アイウエオー。\n@c0@"
62:
  de: "@aDr. Ache@bJaja, ich weiß, Ihr seht mich an und denkt, Ihr habt einen jungen Hüpfer vor Euch, aber in Wahrheit bin ich tausend Mal älter als Ihr, mein Lieber!\n@c0@"
  en: "@aDr Agon@bI guess you look at me and see a jolly Joe with a fresh young smile, but I've been alive a thousand times longer than any of you!\n@c0@"
  es: "@aDr. Agón@b¡Seguro que me miras y solo ves a una personilla alegre con una fresca sonrisa, pero he vivido mil veces más que tú!\n@c0@"
  fr: "@aDr Agon@bJe sais qu'en me regardant, vous voyez un fringant zazou, mais je suis mille fois plus vieux que n'importe lequel d'entre vousⓠ\n@c0@"
  it: "@aDr. Agon@bIl mio aspetto giovanile e focoso non deve trarre in inganno: in realtà, sono nato migliaia di anni fa.\n@c0@"
  ja: "@a@bプサン「ぱっと見　若くてかっこいい\n\tナイスガイと思うでしょうが　じつは\n\tあなたの１０００倍　生きてるんです。\n@c0@"
63:
  de: "@aDr. Ache@bHm? Ihr glaubt, ich nehm Euch auf den Arm? Ha ha ha! Ja, warum eigentlich nicht? Glaubt einfach, was Ihr für richtig haltet!\n@c0@"
  en: "@aDr Agon@bHuh? You think I'm joking? Ha ha hah! Sure, why not? If that's the way you lickety-like it!\n@c0@"
  es: "@aDr. Agón@b¿Eh? ¿Que si estoy de broma? ¡Ja, ja, ja! ¡Pues claro! ¡Puedes creer lo que quieras!\n@c0@"
  fr: "@aDr Agon@bCommentⓡ Vous croyez que je plaisanteⓡ Ha ha haⓠ Pourquoi pasⓡ Si ça peut vous rassurerⓠ\n@c0@"
  it: "@aDr. Agon@bDico davvero!\nO forse no?\nEh eh eh! Lo so, sono un burlone...\n@c0@"
  ja: "@a@bプサン「冗談だろうって？　ふふふっ。\n\tそう思うなら　そうなんでしょう。\n@c0@"
64:
  de: "@aDr. Ache@bHmm... Ihr habt schon ganz schön was durchgemacht in Euren jungen Jahren, was, %a000090, alter Freund?\n㈡\nJaja, dem alten Ache könnt Ihr nicht so leicht was vormachen!\n@c0@"
  en: "@aDr Agon@bHmm... You've had your fair share of suffery-duffery-doodling, eh, %a000090, old buddy? Nothing gets past the old Agon peepers, you know!\n@c0@"
  es: "@aDr. Agón@bMmm... Tú también lo has pasado fatalillo a veces, ¿verdad, %a000090, mi querido amigo? ¡El viejo Agón se da cuenta de todito!\n@c0@"
  fr: "@aDr Agon@bMmm... Je me dis que vous avez dû avoir votre lot de souffrances, hein, %a000090ⓡ Rien n'échappe au vieil Agon, vous savezⓠ\n@c0@"
  it: "@aDr. Agon@bDevi aver sofferto molto nel corso della tua vita, %a000090... Lo vedo chiaramente.\nNulla sfugge agli occhi fiammeggianti del dottor Agon!\n@c0@"
  ja: "@a@bプサン「ふむふむ。　%a000090は\n\tずいぶん苦労をしてきたんですね。\n\t目を見れば　わかります。\n@c0@"
65:
  de: "@aDr. Ache@bHey-Dideldi-Du! Was sagt Ihr eigentlich zu meinen schicken Klamotten?\n㈡\nVor zwanzig Jahren war das absolut angesagt, kann ich Euch sagen. Jeder wollte so aussehen wie ich!\n@c0@"
  en: "@aDr Agon@bHow do you like my outfit, then?\nIt used to put the ⓗpiⓘ in pizzazz twenty years ago. Everyone wanted a piece of my style!\n@c0@"
  es: "@aDr. Agón@b¿Qué te parece mi ropa?\nHace veinte años yo era el reyecillo del estilo estilito. ¡Todos querían imitarme!\n@c0@"
  fr: "@aDr Agon@bVous avez vu comme je suis bien habilléⓡ\nC'était vraiment ⓥsmartⓦ il y a vingt ans.\nTout le monde voulait m'imiterⓠ\n@c0@"
  it: "@aDr. Agon@bFarei fuoco e fiamme per un bagno profumato!\nVoglio dire, sono vent'anni che non mi lavo, e devo avere un odore tutt'altro che gradevole...\n@c0@"
  ja: "@a@bプサン「この服　どうです？\n\t２０年前の最新ファッションを\n\t私なりに　アレンジしたんですよ。\n@c0@"
66:
  de: "@aDr. Ache@bⓆ Immerzu im Kreis herum! Ⓠ\nⓇ Im Kreis herum, dideldum! Ⓡ\n@c0@"
  en: "@aDr Agon@bⓆ Round and round we go! Ⓠ\nⓇ Round and round we go-diddly-o! Ⓡ\n@c0@"
  es: "@aDr. Agón@bⓆ ¡Vueltas, vueltitas! Ⓠ\nⓇ ¡Higos y castañitas! Ⓡ\n@c0@"
  fr: "@aDr Agon@bⓆ Et rond, et rondⓠ Ⓠ\nⓆ Et rond, je tourne en rondⓠ Ⓠ\n@c0@"
  it: "@aDr. Agon@bⓆ Gira, gira, gira e rigiraaah...! Ⓠ\nⓇ Gira e rigira, non ti fermareeeh...! Ⓡ\n@c0@"
  ja: "@a@bプサン「クルリン♪　クルリン♪\n@c0@"
67:
  de: "@aDr. Ache@bAch, du jemine. Nach zwanzig Jahren im Kreis herumfahren kann ich einfach nicht anders. Tut mir leid-idum!\n@c0@"
  en: "@aDr Agon@bSorry about that. After twenty years on the old circuit, I just can't relax unless I'm chasing my tail!\n@c0@"
  es: "@aDr. Agón@bLo siento. ¡Después de veinte añitos dando vueltas, no me puedo relajar si no hablo de girar!\n@c0@"
  fr: "@aDr Agon@bExcusez-moi. Après une vingtaine d'années\nà tourner en rond, il n'y a que comme ça que\nj'arrive à me détendreⓠ\n@c0@"
  it: "@aDr. Agon@bNon riesco a togliermi dalla mente questa stupida canzoncina. I vent'anni trascorsi su quel carrello devono avermi mandato in fumo il cervello...\n@c0@"
  ja: "@a@bプサン「いえね。　ずっと\n\tぐるぐる回ってたもんですから\n\t回転していないと　もの足りなくて。\n@c0@"
68:
  de: "@a%0%a001240@bHey! Da ist Dr. Ache. Wie ist er dorthin gekommen?\n@c0@"
  en: "@a%0%a001240@bHey! There's Dr Agon. How did he get there?\n@c0@"
  es: "@a%0%a001240@b¡Eh, ahí está el Dr. Agón! ¿Cómo ha llegado hasta ahí?\n@c0@"
  fr: "@a%0%a001240@bHéⓠ C'est le Dr Agon.\nComment il a fait pour arriver làⓡ\n@c0@"
  it: "@a%0%a001240@bSbaglio o quello è il Dottor Agon?\nCome avrà fatto ad arrivare lì?!\n@c0@"
  ja: "@a@b%a001240「あれ？\n\tプサンさんが　ついてきてるよ。\n\tいったい　いつの間に……。\n@c0@"
69:
  de: "@a%0%a001250@bDu glaubst doch nicht, dass Dr. Ache böse ist, oder, Papa? Wir haben ihn ganz schön lange warten lassen.\n@c0@"
  en: "@a%0%a001250@bYou don't think Dr Agon's angry, do you, Dad?\nWe've kept him waiting quite a while now.\n@c0@"
  es: "@a%0%a001250@b¿Crees que el Dr. Agón está enfadado, papá?\nLe hemos hecho esperar un buen rato.\n@c0@"
  fr: "@a%0%a001250@bTu crois que le Dr Agon est en colère, papaⓡ\nÇa fait un certain temps qu'il nous attend.\n@c0@"
  it: "@a%0%a001250@bPapà, spero che il Dottor Agon non sia arrabbiato...\nL'abbiamo fatto aspettare per un bel pezzo.\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tプサンさん　おこってないかな？\n\t待たせちゃったよね……。\n@c0@"
70:
  de: "@aSancho@bQué? Wo ist...? Diese Señor Ache will wohl gar nisst von hier weg, no?\n@c0@"
  en: "@aSancho@bQué? Where deed...? Thees señor Agon, he no want to leave thees place, eh?\n@c0@"
  es: "@aSancho@b¿Qué? ¿Dónde...? Parece que este señor Agón no quiere marcharse. ¡Híjole!\n@c0@"
  fr: "@aSancho@bQuéⓡ Où il est...ⓡ C-Ce señor Agon, il ne v-veut pas partir ou quoiⓡ\n@c0@"
  it: "@aSancho@bHo como l'impressiones que el señor Dottor Agon no voglia abbandonare esto luego...\r\n¿Forse se es affezionato, sì?\n@c0@"
  ja: "@a@bサンチョ「おや　いつの間にか……。\n\tプサンさんは　よほど　この場所を\n\tはなれたくなかったんでしょうね。\n@c0@"
71:
  de: "@aOtto@bOh. Wie es scheint, hat Dr. Ache auf uns gewartet.\n@c0@"
  en: "@aTuppence@bOh. It looks like Dr Agon's been waiting for us.\n@c0@"
  es: "@aAlazar@b¡Oh! Parece que el Dr. Agón nos ha estado esperando.\n@c0@"
  fr: "@aInnocent@bOh. Il semblerait que le Dr Agon nous attende.\n@c0@"
  it: "@aSimon@bToh!\nIl Dottor Agon ci sta ancora aspettando!\n@c0@"
  ja: "@a@bピピン「プサンさん　ボクたちを\n\t待ってたみたいですね。\n@c0@"
72:
  de: "@aOtto@bEs ist ihm wohl gar net in den Sinn gekommen, dass er Zenithia auch alleine finden könnt'.\n@c0@"
  en: "@aTuppence@bThe thought obviously hasn't even crossed his mind that he could find his way to Zenithia alone.\n@c0@"
  es: "@aAlazar@bNi se le ha pasado por la cabeza que podía ir a buscar el camino a Zenithia por su cuenta.\n@c0@"
  fr: "@aInnocent@bApparemment, l'idée ne lui a même pas traversé l'esprit qu'il pourrait retrouver le chemin de Zénithia tout seul.\n@c0@"
  it: "@aSimon@bOvviamente non gli è passato nemmeno per l'anticamera del cervello che poteva cercare da solo il modo di arrivare a Zenithia... Che razza di pigrone!\n@c0@"
  ja: "@a@bピピン「自力で　天空城に行こうとは\n\tこれっぽっちも　考えなかった\n\tということでしょう……。\n@c0@"
73:
  de: "@aBianca@bIch hatte keine Ahnung, dass hier unten eine Höhle ist.\n@c0@"
  en: "@aBianca@bHa! I had no idea there was a cave like this here.\n@c0@"
  es: "@aBianca@b¡Ja! No tenía ni idea de que hubiera una cueva así por aquí.\n@c0@"
  fr: "@aBianca@bAhⓠ Je n'aurais jamais imaginé qu'il y avait une grotte comme ça ici.\n@c0@"
  it: "@aBianca@bNon sapevo dell'esistenza di questa caverna...\n@c0@"
  ja: "@a@bビアンカ「ふーん。\n\tこんな場所に　こんな洞くつが\n\tあったなんて　知らなかったわ。\n@c0@"
74:
  de: "@aBianca@bWas? Du bist schon mal hier gewesen? Mir kommt es langsam so vor, als warst du schon überall!\n@c0@"
  en: "@aBianca@bEh? You've bin here before, have you? I'm startin' to think you've bin everywhere!\n@c0@"
  es: "@aBianca@b¿Cómo? ¿Que ya has estado antes aquí? ¡Empiezo a creer que has estado en todas partes!\n@c0@"
  fr: "@aBianca@bHeinⓡ Tu es déjà venu iciⓡ Je commence à penser que tu es déjà allé partoutⓠ\n@c0@"
  it: "@aBianca@bScommetto che sei già stato qui, non è vero?\nHah! Comincio a pensare che non esista luogo al mondo che tu non abbia visitato!\n@c0@"
  ja: "@a@bビアンカ「え？　%a000090は\n\tここにも　来たことがあるの？\n\tホントに　世界中　行ってるわね。\n@c0@"
75:
  de: "@aNera@bIch frage mich, wer das gebaut hat. Wirklich ein seltsamer Ort!\n@c0@"
  en: "@aNera@bI wonder who built this. What a curious place!\n@c0@"
  es: "@aNera@bMe pregunto quién habrá construido esto. ¡Veramente, es un sitio molto curioso!\n@c0@"
  fr: "@aNera@bJe me demande qui a bien pu construire cet endroit. C'est vraiment bizarreⓠ \n@c0@"
  it: "@aNera@bChe posto singolare...\nChi l'avrà costruito?\n@c0@"
  ja: "@a@bフローラ「誰が　つくったのかしら？\n\tふしぎな洞くつね。\n@c0@"
76:
  de: "@a%0%a001240@bIch kenne mich bestens aus in dieser Höhle. Ich glaube, ich würde mich selbst mit geschlossenen Augen hier zurechtfinden!\n@c0@"
  en: "@a%0%a001240@bI know my way all around this cave! I reckon I could navigate it even with my eyes closed.\n@c0@"
  es: "@a%0%a001240@b¡Esta cueva me la conozco! Supongo que hasta podría recorrerla con los ojos cerrados.\n@c0@"
  fr: "@a%0%a001240@bJe connais chaque recoin de cette grotteⓠ Je suis sûr que je pourrais même m'y déplacer les yeux fermés.\n@c0@"
  it: "@a%0%a001240@bConosco questa caverna come le mie tasche!\nPotrei attraversarla anche a occhi chiusi!\n@c0@"
  ja: "@a@b%a001240「ボク　この洞くつの道\n\tもう　おぼえちゃった！\n\t目を　つぶってても　出られるよ！\n@c0@"
77:
  de: "@a%0%a001240@bDas ist meine absolute Lieblingshöhle! Die Wagen sind klasse! Findest du doch auch, oder, Papa?\n@c0@"
  en: "@a%0%a001240@bThis is my favourite cave ever! The carts are brilliant. You must think so too, right, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Esta es mi cueva favorita de todas! Los vagones son fantásticos. ¿No crees, papi?\n@c0@"
  fr: "@a%0%a001240@bC'est ma grotte préféréeⓠ Les chariots sont géniaux. Tu ne trouves pas, papaⓡ\n@c0@"
  it: "@a%0%a001240@bQuesta è la grotta più bella del mondo!\nI carrelli sono troppo forti!\n@c0@"
  ja: "@a@b%a001240「ボク　この洞くつ大好き！\n\tだって　トロッコが楽しいんだもん。\n\tお父さんも　そう思うでしょ？\n@c0@"
78:
  de: "@a%0%a001250@bKann ich nicht noch ein wenig hier bleiben und spielen? Schließlich habe ich kein großes Schicksal zu erfüllen wie %a001240, ich bin ja nicht der legendäre Held.\n@c0@"
  en: "@a%0%a001250@bI don't have a big destiny to fulfil like %a001240 because I'm not the legendary hero, so can I play here a bit longer?\n@c0@"
  es: "@a%0%a001250@bNo me espera un destino glorioso como a %a001240 porque no soy el héroe legendario, así que ¿puedo quedarme a jugar un rato?\n@c0@"
  fr: "@a%0%a001250@bJe ne suis pas comme %a001240. Je n'ai pas de destin de héros légendaire à accomplir, moi.\nAlors je peux rester à jouer ici encore un peuⓡ\n@c0@"
  it: "@a%0%a001250@bDato che, a differenza di %a001240, non sono l'Eroe Leggendario e non ho importanti missioni da compiere, posso restare a giocare ancora un po'?\n@c0@"
  ja: "@a@b%a001250「わたしは　%a001240とちがって\n\t勇者じゃないから　使命ないよ。\n\tもうちょっとだけ　遊んじゃダメ？\n@c0@"
79:
  de: "@aSancho@bHah... Hah...\nUno momento, Chico. Hah...\nZeit... für eine Siesta.\n@c0@"
  en: "@aSancho@bHahh... Hahh...\nWait a momento, friend. Hahh...\nEes time...for a siesta.\n@c0@"
  es: "@aSancho@bAah... Aah...\nEspera un momento, chamaco. Aah...\nEs la hora... de la siesta.\n@c0@"
  fr: "@aSancho@bHan... han... A-Attends encore oun m-momento, chico. Han... C'est l'heure... de la siesta.\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh...\nAspettaaah un momentos, chico...\nMe mancaaah... el fiaaahto... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「ぜえぜえ……。\n\t坊っちゃん　ちょ　ちょっと\n\t休みましょう…　ぜえ……。\n@c0@"
80:
  de: "@aSancho@bIss weiß, dass du spielen möchtest, Chico, aber jetzt bitte nisst. Du kannst spielen, wenn deine Onkel Sancho nicht dabei ist, si?\n@c0@"
  en: "@aSancho@bI know you want to play, friend, but ees no a good time. You play when your Uncle Sancho, he ees no here, okay?\n@c0@"
  es: "@aSancho@bYa sé que quieres jugar, chamaco, pero este no es el momento. Juega cuando tu tito Sancho no esté, ¿ok?\n@c0@"
  fr: "@aSancho@bJ-Je sais que tu veux jouer, chico, mais ce n'est pas le momento. Tu ne veux pas jouer quand ton oncle Sancho, il n'est pas làⓡ\n@c0@"
  it: "@aSancho@b¿Chico, sabe donde estiamo andando, sì?\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　ここで遊びたいのは\n\tわかりますが　今は　ダメです。\n\t私のいないときに　してください。\n@c0@"
81:
  de: "@aOtto@bIch frage mich, wie die ganzen Wagen hier angetrieben werden. Wahrscheinlich mit Magie...\n@c0@"
  en: "@aTuppence@bI wonder what actually powers all the carts in here. I suppose it must be magic.\n@c0@"
  es: "@aAlazar@bMe pregunto qué hará que estos vagones se muevan. Debe de ser magia.\n@c0@"
  fr: "@aInnocent@bJe me demande comment tous ces chariots avancent. Ce doit être de la magie.\n@c0@"
  it: "@aSimon@bCome faranno i carrelli a muoversi senza essere trainati da cavalli, buoi, asini, muli o altri animali da tiro? Mah! Mistero!\n@c0@"
  ja: "@a@bピピン「あの　トロッコって\n\tどうやって　動いてるんでしょう？\n\tやっぱり　魔法ですかね？\n@c0@"
82:
  de: "@aBianca@bWir haben jetzt keine Zeit für solche Spielereien, %a000090! Wir müssen nach Nadiria, sonst ist es bald zu spät!\n@c0@"
  en: "@aBianca@bNow's not the time for a joyride, %a000090!\nWe have to get ourselves over to Nadiria before\nit's too late.\n@c0@"
  es: "@aBianca@b¡Ahora no es momento de divertirse, %a000090!\nTenemos que llegar a Nadiria antes de que sea demasiado tarde, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe n'est pas le moment de s'amuser, %a000090ⓠ Nous devons aller à Nadiria avant qu'il ne soit trop tard.\n@c0@"
  it: "@aBianca@bNon abbiamo tempo di fare giretti di piacere, %a000090!\nDobbiamo arrivare a Nadiria il prima possibile!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\t遊んでる場合じゃないわよ。\n\t早く　魔界へ行かなくちゃ！\n@c0@"
83:
  de: "@aBianca@bIch frage mich immer noch, wer diesen Ort erbaut hat und warum. Es soll ja wohl kein Freizeitpark sein, oder?\n@c0@"
  en: "@aBianca@bI can't help wonderin' who built this place and\r\nwhy, mind. It's not just s'posed to be a theme\r\npark, surely?\n@c0@"
  es: "@aBianca@bNo puedo evitar preguntarme quién habrá construido este sitio y por qué. Porque... no será simplemente un parque temático, ¿verdad?\n@c0@"
  fr: "@aBianca@bJe n'arrête pas de me demander qui a bien pu construire cet endroit et pourquoi. Ce n'est quand même pas un simple parc d'attractions, quand mêmeⓡ\n@c0@"
  it: "@aBianca@bA chi sarà mai venuto in mente di realizzare un posto simile?\nE per quale motivo l'avrà fatto?\n@c0@"
  ja: "@a@bビアンカ「それにしても　ここって\n\t誰が　なんのために　つくったのかな？\n\t遊び場…　じゃないわよね。\n@c0@"
84:
  de: "@aNera@bWelch ein wunderbarer Ort! Wenn wir doch nur unsere Mission vergessen und ein bisschen Spaß haben könnten!\n@c0@"
  en: "@aNera@bWhat a delightful place! If only we could just\r\nforget our duties and let our hair down and\r\nenjoy it properly!\n@c0@"
  es: "@aNera@b¡Qué lugar más placevole! ¡Qué bonito sería olvidar nuestras responsabilidades, dejarnos ir y simplemente divertirnos!\n@c0@"
  fr: "@aNera@bQuel endroit fantastiqueⓠ Si seulement nous pouvions oublier nos obligations pour nous détendre et en profiter vraimentⓠ\n@c0@"
  it: "@aNera@bQuesto posto meriterebbe di essere esplorato a fondo! Se non avessimo cose più importanti a cui pensare, mi piacerebbe trascorrerci qualche giorno...\n@c0@"
  ja: "@a@bフローラ「こんな　楽しい場所が\n\tあったなんて！　使命を忘れて\n\t遊びたくなってしまいますわ！\n@c0@"
85:
  de: "@aNera@bWir müssen unbedingt hierher zurückkommen, wenn in der Welt wieder Frieden herrscht. Wir bringen uns was zu essen mit und machen uns einen schönen Tag.\n@c0@"
  en: "@aNera@bWe'll have to all come back here again when the world's at peace. We could bring a picnic and make\r\na day of it.\n@c0@"
  es: "@aNera@bCuando la pace haya vuelto al mondo, tenemos que volver tutti aquí. ¡Podemos organizar un picnic y pasar el día!\n@c0@"
  fr: "@aNera@bIl faudra revenir lorsque le monde sera à nouveau en paix. Nous pourrions apporter de quoi faire un pique-nique et passer une journée agréable.\n@c0@"
  it: "@aNera@bMi piacerebbe tornare qui per un bel picnic, dopo che avremo riportato la pace nel mondo.\nCi divertiremmo tantissimo!\n@c0@"
  ja: "@a@bフローラ「ここは　平和な世界に戻ったら\n\tまた来ましょうね。　おべんとうを\n\t持って　みんなで来たいわ。\n@c0@"
86:
  de: "@a%0%a001250@bGlaubst du, der Mann hat etwas Schlimmes getan, dass er all die Jahre hier unten eingesperrt war?\n@c0@"
  en: "@a%0%a001250@bDo you think that man did something so bad that he really deserves to be shut up in here for so long?\n@c0@"
  es: "@a%0%a001250@b¿Crees que ese hombre ha hecho algo tan malo que merece que lo hayan encerrado todo este tiempo aquí?\n@c0@"
  fr: "@a%0%a001250@bTu crois que cet homme a fait quelque chose de si mal pour avoir mérité de rester enfermé si longtempsⓡ\n@c0@"
  it: "@a%0%a001250@bNon riuscirei mai a vivere qui...\nImpazzirei senza la luce del sole e la possibilità di fare una passeggiata all'aria aperta!\n@c0@"
  ja: "@a@b%a001250「あの人　ずっと\n\tこんな所で　お仕事させられるほど\n\t悪いことしたのかな……。\n@c0@"
87:
  de: "@a%0%a001240@bSolch ein lustiger Ort kann unmöglich etwas mit dem Bösen zu tun haben! Bestimmt hat ihn die Göttin erschaffen.\n@c0@"
  en: "@a%0%a001240@bA fun place like this surely can't have been built by someone evil! It must've been the Goddess who did it.\n@c0@"
  es: "@a%0%a001240@b¡Un sitio así de divertido no puede haberlo construido una mala persona! Debe de ser cosa de la Diosa.\n@c0@"
  fr: "@a%0%a001240@bUn endroit aussi amusant ne peut pas avoir été construit par quelqu'un de mauvaisⓠ Ce doit être\nla Déesse qui a eu l'idée.\n@c0@"
  it: "@a%0%a001240@bUn posto così divertente non può che essere stato creato dalla dea. A nessun essere malvagio poteva venire in mente di realizzare uno spasso simile!\n@c0@"
  ja: "@a@b%a001240「こんな楽しいところ\n\t悪いヤツに　つくれるわけないよね？\n\t絶対　神さまが　つくったんだよ！\n@c0@"
88:
  de: "@aSancho@bWie lange ist diese Señor schon hier unten? Oh, ist das traurig...\n@c0@"
  en: "@aSancho@bHow long ees thees señor down here?\nEes esuch a shame for heem.\n@c0@"
  es: "@aSancho@b¿Cuánto tiempo pasó este señor aquí abajo?\nSiento pena por él.\n@c0@"
  fr: "@aSancho@bDepuis c-combien de tiempo ce señor est-il iciⓡ\nJ'ai de la p-peine pour lui.\n@c0@"
  it: "@aSancho@bQuel señor es rimasto aquí sotto mucho tiempo...\n¡Es un miracolo que no es impazzitos!\n@c0@"
  ja: "@a@bサンチョ「あの方は　いったい\n\tいつから　ここに……？\n\tなんというか…　お気のどくですね。\n@c0@"
89:
  de: "@aOtto@bEs ist ja vielleicht ganz lustig, mit den Wagen rumzufahren, aber gefangen möchte ich hier unten net sein.\n@c0@"
  en: "@aTuppence@bIt may be a thrill riding about on the carts, but I certainly wouldn't want to be stuck in here with no way of leaving.\n@c0@"
  es: "@aAlazar@bMontarse en una vagoneta es emocionante, pero no me gustaría quedarme aquí atrapado sin poder salir.\n@c0@"
  fr: "@aInnocent@bC'est peut-être très amusant de faire un tour sur ces chariots, mais je n'aimerais pas rester bloqué dessus comme ça, sans pouvoir descendre.\n@c0@"
  it: "@aSimon@bScorrazzare a bordo di un carrello è divertente, ma restare bloccati su uno di quei cosi per vent'anni filati dev'essere un incubo!\n@c0@"
  ja: "@a@bピピン「いくら　トロッコが楽しくても\n\tこんな洞くつに　閉じこめられるのは\n\tイヤですよ。\n@c0@"
90:
  de: "@aGriselda@bNormalerweise mag ich keine Höhlen. Die sind immer so dunkel und eng. Aber diese hier ist anders...\n@c0@"
  en: "@aDebora@bI'm not usually keen on caves.\r\nThey're so dark and claustrophobic.\r\nThis one isn't like all the others, though.\n@c0@"
  es: "@aStefania@bLas cuevas me dispiacen.\nSon oscuras y claustrofóbicas.\nMa esta es distinta a las demás.\n@c0@"
  fr: "@aPandora@bJe n'aime pas trop les grottes, en général.\r\nElles sont toujours si sombres et étouffantes.\r\nMais celle-ci n'est pas comme les autres.\n@c0@"
  it: "@aViola@bNon mi piacciono le caverne: sono buie, fredde e puzzano di muffa! Questa, però, è diversa dalle altre... È divertente!\n@c0@"
  ja: "@a@bデボラ「こういう　暗くてせまい所は\n\t来たくなかったんだけど……　ここは\n\t他の場所とは　少し　ちがうみたいね。\n@c0@"
91:
  de: "@aGriselda@bWer hätte gedacht, dass sich hier ein halber Freizeitpark verbirgt! Wer den wohl gebaut hat...\n@c0@"
  en: "@aDebora@bI never expected to find an amusement ground all the way out here! I wonder who built it.\n@c0@"
  es: "@aStefania@b¡No esperaba encontrar un parque de atracciones en questo sitio! ¿Quién lo construiría?\n@c0@"
  fr: "@aPandora@bJe n'aurais jamais pensé trouver un parc d'attractions dans un endroit pareilⓠ Je me demande qui l'a construit.\n@c0@"
  it: "@aViola@bMa chi avrà progettato e costruito questo posto?\nSembra quasi un parco di divertimenti...\n@c0@"
  ja: "@a@bデボラ「こんな　へんぴな場所に　\n\t遊園地があっただなんて　おどろいたわ。\n\tいったい　誰がつくったのかしら？\n@c0@"
92:
  de: "@aGriselda@bWarum wurde das alles hier eigentlich in einer Höhle gebaut? Draußen wär das doch viel lustiger!\n@c0@"
  en: "@aDebora@bWhy would anyone build something like this in a cave? It'd be so much nicer if it was outdoors.\n@c0@"
  es: "@aStefania@b¿Ma per qué construiría alguien una cosa así en una cueva? Estaría mejor en el exterior.\n@c0@"
  fr: "@aPandora@bMais pourquoi avoir construit quelque chose comme ça dans une grotteⓡ Ça aurait été bien plus agréable à l'extérieur.\n@c0@"
  it: "@aViola@bQuesto luogo sarebbe molto più bello se fosse all'aperto, invece che all'interno di una caverna...\n@c0@"
  ja: "@a@bデボラ「どうして　こんな場所に\n\t遊園地をつくったのかしらね。\n\t外で遊べたほうが　気持ちいいでしょうに。\n@c0@"
93:
  de: "@aGriselda@bWas, er war all die Jahre hier und hat gegraben? Vielleicht ist das ja die Strafe für etwas, das er verbrochen hat...\n@c0@"
  en: "@aDebora@bSo he's been stuck in here digging all this time? Maybe it's punishment for doing something he shouldn't have.\n@c0@"
  es: "@aStefania@b¿Así que ha estado aquí atrapado, todo este tiempo? Quizá sea una punizione por hacer lo que no debía.\n@c0@"
  fr: "@aPandora@bAlors il a passé tout ce temps coincé ici à creuserⓡ C'est peut-être une punition pour avoir fait quelque chose qu'il ne devait pas.\n@c0@"
  it: "@aViola@bChissà quali reati ha commesso per essere stato condannato a vivere quaggiù per tanto tempo...\n@c0@"
  ja: "@a@bビアンカ「この人　ずっとこの場所で\n\t発掘を　続けているの……？\n\t何か　悪いことでも　したのかしら。\n@c0@"
94:
  de: "@aGriselda@bStell dir doch nur mal vor, ganz allein in diesem Loch eingesperrt zu sein! Ich würde das nicht aushalten!\n@c0@"
  en: "@aDebora@bImagine being holed up in here all alone like that!\r\nI don't think I could stand it.\n@c0@"
  es: "@aStefania@b¡Qué horror, estar aquí solo enterrado in vita!\nNo creo que yo pudiera soportarlo.\n@c0@"
  fr: "@aPandora@bTu imagines être coincé ici tout seul, comme çaⓠ\nJe crois que je n'aurais jamais pu le supporter.\n@c0@"
  it: "@aViola@bNon potrei mai vivere qua sotto!\nNon credo che riuscirei a resistere più di un'ora o due!\n@c0@"
  ja: "@a@bフローラ「このような場所に　たった１人で\n\t閉じこめられて　発掘をするだなんて……\n\t私には　たえられそうにありません。\n@c0@"
95:
  de: "@aGriselda@bEs ist schrecklich, jemanden dazu zu zwingen, in diesem stinkenden Loch zu schuften. Ich würde bei der ersten Gelegenheit abhauen!\n@c0@"
  en: "@aDebora@bIt's terrible to make someone work in this dank and smelly hole! I'd do my best to escape if it were me.\n@c0@"
  es: "@aStefania@b¡Es terrible hacer trabajar a alguien en este buco húmedo y apestoso! Si fuese yo, me escaparía en cuanto pudiese.\n@c0@"
  fr: "@aPandora@bC'est terrible de faire travailler quelqu'un dans ce trou froid, humide et puantⓠ Si c'était moi, j'aurais fait tout ce que je pouvais pour m'enfuir.\n@c0@"
  it: "@aViola@bNon si può costringere un essere umano a lavorare in queste condizioni! Manca la luce, non c'è aria fresca e ci sono ragni ovunque!\n㈡\nIo avrei tentato la fuga il giorno stesso che mi avessero chiusa qui!\n@c0@"
  ja: "@a@bデボラ「こんな　カビくさい場所に\n\tとじこめられて　仕事をさせられるなんて！\n\t私なら　意地でも　逃げ出してみせるわ。\n@c0@"
