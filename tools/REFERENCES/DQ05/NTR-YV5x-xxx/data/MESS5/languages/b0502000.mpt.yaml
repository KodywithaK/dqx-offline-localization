  es: "@aFroilán@bEs maravilloso volver a ver a María. Pero me fastidia que haya dicho tu nombre antes que el mío.\n@c0@"
  fr: "@aHarry@bC'est merveilleux de revoir Maria. Même si je suis\r\nun peu jaloux qu'elle ait prononcé ton nom avant\r\nle mien...\n@c0@"
