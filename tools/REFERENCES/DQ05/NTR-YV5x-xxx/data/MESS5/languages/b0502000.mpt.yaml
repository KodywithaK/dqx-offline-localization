95:
  de: "@aHarry@bDie werden nicht mehr so selbstzufrieden aus der Wäsche gucken, wenn ich hier fertig bin!\n@c0@"
  en: "@aHarry@bThey won't be looking so pleased with themselves when I'm finished here!\n@c0@"
