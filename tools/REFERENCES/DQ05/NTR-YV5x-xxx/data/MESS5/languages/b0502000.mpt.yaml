  fr: "@aHarry@bMalédictionⓠ Nous n'avons pas de temps à perdre avec çaⓠ Nous devons trouver un autre moyen d'entrer.\n@c0@"
  it: "@aRobert@bDannazione! Ah, non abbiamo tempo per discutere con quest'idiota!\nDovremo trovare un'altra strada...\n@c0@"
  ja: "@a@bヘンリー「一刻を争う時だってのに\n\tじれったいなあ！\n\tくそっ！　ほかから　入ろうぜ！\n@c0@"
92:
  de: "@aHarry@bHe! Jetzt ist keine Zeit für Umwege! Konzentrier dich!\n@c0@"
  en: "@aHarry@bHey! Now's not the time for detours!\nStay focused!\n@c0@"
