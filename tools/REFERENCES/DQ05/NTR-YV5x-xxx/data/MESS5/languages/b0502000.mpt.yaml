  it: "@aRobert@bSono certo che la falsa Regina Madre avesse già il comando del Regno di Coburg quando Valcava fu attaccata...\n@c0@"
  ja: "@a@bヘンリー「きっと　サンタローズに\n\t攻め入った時には　すでに\n\t太后は　入れ替わっていたんだな。\n@c0@"
100:
  de: "@aHarry@bEin Mensch hätte niemals so kaltschnäuzig angeordnet, ein unschuldiges Dorf einfach so zu vernichten.\n@c0@"
  en: "@aHarry@bThere's no way a human would order an innocent village to be destroyed like that.\n@c0@"
  es: "@aFroilán@bUn humano nunca ordenaría la destrucción de un pueblo inocente con tanto ensañamiento.\n@c0@"
  fr: "@aHarry@bIl est foncièrement impossible qu'un être humain\r\nait pu donner l'ordre de détruire ainsi un village innocent.\n@c0@"
  it: "@aRobert@bSolo un mostro assetato di sangue poteva dare l'ordine di mettere a ferro e a fuoco un villaggio abitato solo da gente pacifica e inoffensiva...\n@c0@"
  ja: "@a@bヘンリー「なんの罪もない村を\n\tほろぼせなんて　命令\n\t人間のできることじゃないよ。\n@c0@"
101:
  de: "@aHarry@bDarwin? Ich kann mich nicht daran erinnern, diesen Namen schon einmal gehört zu haben. Ich frage mich, ob die falsche Witwe ihn herbestellt hat.\n@c0@"
