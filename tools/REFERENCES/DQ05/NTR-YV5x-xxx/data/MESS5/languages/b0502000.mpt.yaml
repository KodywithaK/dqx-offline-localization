  it: "@aRobert@bGuarda che non c'è tempo da perdere!\nNon possiamo permetterci distrazioni inutili!\n@c0@"
  ja: "@a@bヘンリー「おいおい。\n\t今は　外に出てる場合じゃないだろ。\n\tしっかりしてくれよな！\n@c0@"
93:
  de: "@aHarry@bUh! Der Gedanke daran, dass so was über Tifortu herrscht... und die ganze Welt!\n@c0@"
  en: "@aHarry@bUrgh! The thought of someone like that ruling over Coburg...and the world!\n@c0@"
