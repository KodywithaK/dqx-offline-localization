  fr: "@aHarry@bJe suppose que les religieuses et les moines, c'est à peu près la même chose. On devrait peut-être leur poser des questions sur la tour.\n@c0@"
  it: "@aRobert@bLe suore sono persone di chiesa proprio come i monaci, no? Potremmo chiedere a loro qualche informazione sulla torre...\n@c0@"
  ja: "@a@bヘンリー「そういえば…\n\t修道女も　修道僧なんだよな。\n\tあの塔のこと　相談してみようぜ。\n@c0@"
35:
