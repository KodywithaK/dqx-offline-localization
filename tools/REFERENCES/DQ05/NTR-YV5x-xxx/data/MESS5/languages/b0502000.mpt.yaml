  fr: "@aMaria@bUn secret permettant de débloquer les mystères de l'évolutionⓡ Ça me fait un peu trop peur pour être bon signe.\n@c0@"
  it: "@aMaria@bUn segreto che svela i misteri dell'evoluzione?\nOh, santa dea!\n@c0@"
  ja: "@a@bマリア「生き物の謎を解く秘法なんて\n\tなんだか　怖いですね。\n@c0@"
104:
  de: "@aMaria@bIch würde sagen, das war wohl eher die Hand des Bösen als die der Göttin.\n@c0@"
  en: "@aMaria@bI'd say it's more likely to be the hand of evil than the hand of the Goddess.\n@c0@"
