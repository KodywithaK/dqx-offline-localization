  fr: "@aHarry@bPeut-être que la fausse douairière essayait de trouver le moyen d'évoluer vers une forme plus puissante.\n@c0@"
  it: "@aRobert@bForse la falsa Regina Madre stava cercando un modo per trasformarsi in un essere più potente...\n@c0@"
  ja: "@a@bヘンリー「まさか　ニセの太后が\n\tもっと　強い存在になるために\n\t研究させていたのか？\n@c0@"
103:
  de: "@aMaria@bEin Geheimnis, mit dessen Hilfe sich die Mysterien der Evolution entschlüsseln lassen? Das klingt mir alles ein wenig zu unheimlich.\n@c0@"
  en: "@aMaria@bA secret unlocking the mysteries of evolution? It all sounds a bit scary for my liking.\n@c0@"
