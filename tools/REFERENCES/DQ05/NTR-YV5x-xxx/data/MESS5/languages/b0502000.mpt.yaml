  it: "@aRobert@bÈ bello averti ancora una volta come compagna di viaggio, Maria.\n@c0@"
  ja: "@a@bヘンリー「マリアさんが　いっしょに\n\t来てくれるなんて　うれしいなあ。\n@c0@"
