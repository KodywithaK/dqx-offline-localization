  fr: "@aHarry@bApparemment, Will est descendu dans la prison pour libérer la vraie douairière.\n@c0@"
  it: "@aRobert@bA quanto pare Fabian è andato alla prigione e ha liberato la vera Regina Madre...\n@c0@"
  ja: "@a@bヘンリー「どうやら　デールのヤツ\n\t地下牢にいた　本物の太后を\n\t連れ出したみたいだな。\n@c0@"
115:
  de: "@aHarry@bKomm, wir suchen Wilbur. Nun mach schon, %a000090!\n@c0@"
