  it: "@aRobert@bSì, magari!\nSogna, Robert, sogna...!\n@c0@"
  ja: "@a@bヘンリー「……なんてな。\n\tそんなワケないよなあ。\n\tもし　そうなら　うれしいけどさ。\n@c0@"
30:
  de: "@aHarry@bDas Mädchen hat recht. Wir dürfen Maria nicht zu Schaden kommen lassen, hörst du, %a000090?\n@c0@"
