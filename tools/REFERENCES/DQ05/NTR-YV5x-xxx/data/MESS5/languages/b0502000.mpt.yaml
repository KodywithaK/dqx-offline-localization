  es: "@aFroilán@b¿Darwin? No recuerdo haber oído ese nombre. ¿Lo llamaría aquí la falsa Reina Madre?\n@c0@"
  fr: "@aHarry@bDarwinⓡ Je ne me souviens pas avoir entendu\nce nom auparavant. Je me demande si c'est la\nfausse douairière qui l'a fait venir ici.\n@c0@"
  it: "@aRobert@bMack Kihe? Ma chi è?\nMai sentito nominare. Forse sarà stata la falsa Regina Madre a farlo venire qui...\n@c0@"
  ja: "@a@bヘンリー「デズモン…？　知らない名だな。\n\tまさか　ニセ太后に呼ばれて\n\tこの城に来たんだろうか？\n@c0@"
102:
  de: "@aHarry@bVielleicht hat die falsche Witwe versucht, einen Weg zu finden, sich in ein stärkeres Wesen zu verwandeln.\n@c0@"
  en: "@aHarry@bMaybe the fake dowager was trying to research a way of evolving into a stronger being.\n@c0@"
