  es: "@aFroilán@b¿Quién hubiera dicho entonces que terminaríamos siendo amigos?\n@c0@"
  fr: "@aHarry@bQui aurait cru à ce moment-là que nous finirions\npar devenir de vieux amis, toi et moiⓡ\n@c0@"
  it: "@aRobert@bChi avrebbe immaginato che saremmo diventati amici per la pelle?\n@c0@"
  ja: "@a@bヘンリー「あの時は　まさか\n\tこんな　長い付き合いになるとは\n\t思いもしなかったけどな。\n@c0@"
145:
  de: "@aHarry@bIch frage mich, ob er den Tempel meint, wenn er von seinem heiligen Land redet. Pah! Dort ist es mehr wie in der Hölle!\n@c0@"
  en: "@aHarry@bI wonder if he's talking about the temple when he mentions a holy land. Pah! That place is more like hell!\n@c0@"
  es: "@aFroilán@bMe pregunto si se refiere al templo cuando habla de una tierra sagrada. ¡Bah! ¡Eso es más bien un infierno!\n@c0@"
  fr: "@aHarry@bJe me demande si c'est au temple qu'il fait allusion quand il parle de terre sacrée. Peuhⓠ Ça ressemble plutôt à l'enferⓠ\n@c0@"
  it: "@aRobert@bChissà se si riferisce al ⓕnostroⓖ tempio, quando parla di un luogo sacro...\nIn quel caso, sarebbe meglio definirlo un inferno!\n@c0@"
  ja: "@a@bヘンリー「聖なる土地って\n\tもしかして　あの神殿のことかよ？\n\tこの世の地獄の　まちがいだろう？\n@c0@"
146:
  de: "@aHarry@bOffenbar benutzen die Banditen diesen Ort nicht mehr als Versteck.\n@c0@"
  en: "@aHarry@bIt looks like the bandits aren't using this place as a hideout any more.\n@c0@"
  es: "@aFroilán@bParece que los bandidos ya no usan este sitio como escondrijo.\n@c0@"
  fr: "@aHarry@bOn dirait que les bandits ne se servent plus de\r\ncet endroit comme cachette, désormais.\n@c0@"
  it: "@aRobert@bSembra che i banditi non usino più questo posto come nascondiglio.\n@c0@"
  ja: "@a@bヘンリー「もう　この場所は\n\t山賊たちのネジロには\n\tなっていないみたいだな。\n@c0@"
147:
  de: "@aHarry@bDu glaubst doch nicht, dass das die Entführer sind, oder? Was kann hier nur passiert sein?\n@c0@"
  en: "@aHarry@bYou don't think these are the kidnappers, do you?\nWhat in the world happened here?\n@c0@"
  es: "@aFroilán@b¿Crees que estos son los secuestradores?\n¿Qué narices habrá pasado aquí?\n@c0@"
  fr: "@aHarry@bTu crois que ce sont les ravisseursⓡ\nQu'est-ce qui a bien pu se passer iciⓡ\n@c0@"
  it: "@aRobert@bCredi che questi fossero i rapitori...?\nMa che accidenti è successo qui, eh?!\n@c0@"
  ja: "@a@bヘンリー「これって　ひょっとして\n\tあの　ゆうかい団の　なれの果てか？\n\tいったい　なにがあったんだろう。\n@c0@"
148:
  de: "@aHarry@bEs ist lange her, dass wir Gelegenheit hatten, so viel frische Luft in der freien Natur zu genießen.\n@c0@"
  en: "@aHarry@bIt's been many a long year since we had the chance to enjoy so much outside air.\n@c0@"
  es: "@aFroilán@bHacía ya muchos años que no teníamos ocasión de disfrutar del aire libre.\n@c0@"
  fr: "@aHarry@bÇa faisait très longtemps que nous n'avions pas eu l'occasion de profiter du grand air.\n@c0@"
  it: "@aRobert@bAvevo dimenticato quanto fosse bello andare in giro liberamente...\n@c0@"
  ja: "@a@bヘンリー「こうして　外の空気を\n\tすうなんて　何年ぶりだろうな？\n@c0@"
149:
  de: "@aHarry@bKomisch. Solche Kleinigkeiten hielt ich früher für selbstverständlich, aber jetzt sind sie mir sehr kostbar geworden.\n@c0@"
  en: "@aHarry@bIt's funny. I used to take little things like that for granted, but now they seem so important.\n@c0@"
  es: "@aFroilán@bEs curioso. Antes daba por descontadas muchas pequeñas cosas que ahora me parecen muy importantes.\n@c0@"
  fr: "@aHarry@bC'est drôle. C'est le genre de choses auxquelles je ne faisais pas attention autrefois, mais elles me semblent tellement importantes aujourd'hui.\n@c0@"
  it: "@aRobert@bChe sensazione strana...\nDavo per scontate tante cose, e solo adesso ho compreso la loro reale importanza.\n@c0@"
  ja: "@a@bヘンリー「なんだか　今は\n\tつまらないことでも　全部\n\tしんせんに　思えてくるよ。\n@c0@"
150:
  de: "@aHarry@bEs ist ja schön und gut, dass du auf die Suche nach deiner Mutter gehen willst, aber wo fangen wir an?\n@c0@"
  en: "@aHarry@bIt's all very well deciding to go off and find your mother, but where do we start?\n@c0@"
  es: "@aFroilán@bTodo eso de salir en busca de tu madre está muy bien, pero ¿por dónde empezamos?\n@c0@"
  fr: "@aHarry@bC'est bien joli de décider de partir à la recherche de ta mère, mais par où commence-t-onⓡ\n@c0@"
  it: "@aRobert@bMi sta bene partire per andare a cercare tua madre, ma...\nDa dove iniziamo?\n@c0@"
  ja: "@a@bヘンリー「お前の母さんを\n\t探すのは　いいとして　まずは\n\tどこに　行ったもんかなあ？\n@c0@"
151:
  de: "@aHarry@bDie Stadt droben im Norden ist vermutlich so gut wie jeder andere Ort.\n@c0@"
  en: "@aHarry@bI suppose that town to the north is as good a place as any.\n@c0@"
  es: "@aFroilán@bSupongo que el pueblo del norte es un lugar tan bueno como cualquier otro.\n@c0@"
  fr: "@aHarry@bJ'imagine que cette ville au nord est un point de départ comme un autre.\n@c0@"
  it: "@aRobert@bForse potremmo cominciare a cercare informazioni nella città a nord...\n@c0@"
  ja: "@a@bヘンリー「とりあえず\n\t北の町を　目ざしてみるか。\n@c0@"
152:
  de: "@aHarry@bIch kann's immer noch kaum glauben, dass wir es geschafft haben, so weit in einem Fass zu reisen!\n@c0@"
  en: "@aHarry@bI still can't believe how we managed to travel so far in a barrel, of all things!\n@c0@"
  es: "@aFroilán@b¡No puedo creer que hayamos llegado tan lejos viajando en un barril!\n@c0@"
  fr: "@aHarry@bJ'ai du mal à croire que nous ayons parcouru une telle distance dans un tonneauⓠ\n@c0@"
  it: "@aRobert@bAncora non riesco a credere che siamo riusciti a resistere tanto a lungo all'interno di un barile...\nUn barile! Ma ti rendi conto?!\n@c0@"
  ja: "@a@bヘンリー「それにしても\n\tよく　あんなタルで\n\tここまで　流れつけたもんだぜ。\n@c0@"
153:
  de: "@aHarry@bWir sind doch ein paar Glückspilze, nicht wahr?\n@c0@"
  en: "@aHarry@bWe must be the luckiest people alive!\n@c0@"
  es: "@aFroilán@b¡Debemos de ser las personas más afortunadas del mundo!\n@c0@"
  fr: "@aHarry@bOn a vraiment de la chance d'être encore en vieⓠ\n@c0@"
  it: "@aRobert@bSiamo davvero fortunati a essere ancora vivi!\n@c0@"
  ja: "@a@bヘンリー「オレたちって\n\tものすごく　運がいいのかもな！\n@c0@"
154:
  de: "@aHarry@bIn Fortuna war ja ganz schön was los, nicht?\n@c0@"
  en: "@aHarry@bThat Fortuna place was certainly lively,\r\nwasn't it?\n@c0@"
  es: "@aFroilán@bEse sitio, Fortuna, estaba realmente animado, ¿eh?\n@c0@"
  fr: "@aHarry@bOn peut dire que Bonaventure est une ville qui bouge, pas vraiⓡ\n@c0@"
  it: "@aRobert@bCerto che Fortuna è una città davvero vivace, no?\n@c0@"
  ja: "@a@bヘンリー「それにしても\n\tオラクルベリーって\n\tにぎやかな　町だったよなあ。\n@c0@"
155:
  de: "@aHarry@bWäre es nicht großartig, wenn Tifortu oder dein Dorf auch so wohlhabend wären? Mann!\n@c0@"
  en: "@aHarry@bCan you imagine if Coburg or your village were that well off? Wow!\n@c0@"
  es: "@aFroilán@b¿Te imaginas que Trastámara o tu pueblo fuesen así de prósperos? ¡Guau!\n@c0@"
  fr: "@aHarry@bTu imagines si Cobourg ou ton village était aussi prospèreⓡ Waouhⓠ\n@c0@"
  it: "@aRobert@bCi sono cose che a Coburg o nel tuo villaggio nemmeno ci sogniamo!\n@c0@"
  ja: "@a@bヘンリー「ラインハットや\n\t%a000090の村も　あんなふうに\n\tさかえていたら　どうするよ？　おい！\n@c0@"
156:
  de: "@aHarry@bHa ha! Ich war etwas besorgt, dass die Qualität bei dem Preis vielleicht nicht die beste wäre, aber Pferd und Wagen sind gar nicht schlecht! \n@c0@"
  en: "@aHarry@bHa ha! I was a bit worried the price might reflect the quality, but this isn't a bad horse and cart!\n@c0@"
  es: "@aFroilán@b¡Ja, ja! ¡Me preocupaba un poco que la calidad fuese acorde con el precio, pero no está mal este carromato y el caballo es genial!\n@c0@"
  fr: "@aHarry@bEh bienⓠ J'avais un peu peur que la qualité soit proportionnelle au prix, mais ce chariot et ce cheval ne sont pas mal du toutⓠ\n@c0@"
  it: "@aRobert@bTemevo che quel tipo ci avesse dato una fregatura, ma il carro e il cavallo non sono affatto male.\nE non li abbiamo nemmeno pagati tanto!\n@c0@"
  ja: "@a@bヘンリー「おお～！\n\t安いから　心配したけど\n\tしっかりした　馬車じゃないか！\n@c0@"
157:
  de: "@aHarry@bJetzt können wir auf unseren Reisen so viele Leute mitnehmen, wie wir wollen.\n@c0@"
  en: "@aHarry@bNow we can bring as many people as we like along on our travels.\n@c0@"
  es: "@aFroilán@bAhora podemos llevar en nuestros viajes a tantas personas y monstruos como queramos.\n@c0@"
  fr: "@aHarry@bMaintenant, nous pouvons emmener autant de personnes que nous voulons dans nos voyages.\n@c0@"
  it: "@aRobert@bOra potremo farci accompagnare nei nostri viaggi da un bel po' di gente!\n@c0@"
  ja: "@a@bヘンリー「これで　もっと\n\t仲間がふえても　安心だな！\n@c0@"
158:
  de: "@aHarry@bDer Tifortu-Kontrollpunkt war doch früher nie so imposant.\n@c0@"
  en: "@aHarry@bThe Coburg checkpoint never used to be so imposing.\n@c0@"
  es: "@aFroilán@bLa aduana de Trastámara no solía ser tan imponente.\n@c0@"
  fr: "@aHarry@bJe ne me souvenais pas que le poste-frontière de Cobourg était aussi imposant.\n@c0@"
  it: "@aRobert@bIn passato, i controlli al valico di frontiera di Coburg non erano tanto severi...\n@c0@"
  ja: "@a@bヘンリー「ラインハットへの関所が\n\tあんなに　ものものしい\n\tふんい気に　なってるなんて……。\n@c0@"
159:
  de: "@aHarry@bEs ist so schrecklich, was mit deinem Dorf passiert ist, %a000090. Ich... Ich weiß nicht, was ich sagen soll.\n@c0@"
  en: "@aHarry@bIt's so awful what happened to your village, %a000090. I...I...don't know what to say.\n@c0@"
  es: "@aFroilán@bEs terrible lo que le ha sucedido a tu aldea, %a000090. No tengo palabras...\n@c0@"
  fr: "@aHarry@bC'est si horrible ce qui est arrivé à ton village, %a000090... Je ne sais pas quoi dire.\n@c0@"
  it: "@aRobert@bQuello che hanno fatto al tuo villaggio è orribile, %a000090.\nIo... Io... Sono sconvolto.\n@c0@"
  ja: "@a@bヘンリー「%a000090の村が\n\tあんなふうに　なってたなんて\n\tオレ…　オレ……。\n@c0@"
160:
  de: "@aHarry@bWie es scheint, hat sich Tifortu bis zur Unkenntlichkeit verändert, seit ich weg bin.\n@c0@"
  en: "@aHarry@bIt sounds like Coburg has changed beyond recognition since I've been away.\n@c0@"
  es: "@aFroilán@bParece que, desde que me fui, Trastámara ha cambiado tanto que está irreconocible.\n@c0@"
  fr: "@aHarry@bOn dirait que Cobourg a changé du tout au tout depuis que je suis parti.\n@c0@"
  it: "@aRobert@bSembra che Coburg sia cambiata tantissimo, rispetto a quando ci vivevo.\n@c0@"
  ja: "@a@bヘンリー「オレがいない間に\n\tラインハットが　\n\tどう変わっちまったのか……。\n@c0@"
161:
  de: "@aHarry@bIch muss herausfinden, was da los ist. Gehen wir zum Schloss!\n@c0@"
  en: "@aHarry@bI have to get to the bottom of what's going on. Let's go to the castle!\n@c0@"
  es: "@aFroilán@bTengo que averiguar lo que está pasando. ¡Vayamos al castillo!\n@c0@"
  fr: "@aHarry@bJe veux en avoir le cœur net. Allons au châteauⓠ\n@c0@"
  it: "@aRobert@bDevo capire cosa sta succedendo!\nAndiamo al castello!\n@c0@"
  ja: "@a@bヘンリー「とにかく　まずは\n\tそれが　知りたいんだ。\n\tラインハット城に　向かおうぜ。\n@c0@"
162:
  de: "@aHarry@bIch wollte eigentlich alles, was mit Tifortu zu tun hat, hinter mir lassen. Aber so leicht ist es wohl doch nicht.\n@c0@"
  en: "@aHarry@bI had planned to forget any ties I ever had to Coburg. But it looks like it's not going to be that easy.\n@c0@"
  es: "@aFroilán@bTenía pensado olvidar todos mis lazos con Trastámara. Pero parece que no va a ser fácil.\n@c0@"
  fr: "@aHarry@bJe m'étais promis d'oublier tout ce qui me liait à Cobourg, mais il semblerait que ce ne soit pas aussi simple que ça.\n@c0@"
  it: "@aRobert@bVolevo dimenticare il mio passato, recidere i legami che avevo con Coburg... Ora, però, mi rendo conto che non sarà un'impresa facile.\n@c0@"
  ja: "@a@bヘンリー「あの国のことは\n\t忘れるつもりだったが……\n\tなかなか　そうも　いかねえや。\n@c0@"
163:
  de: "@aMaria@bGehen wir. Der Turm liegt direkt südlich vom Stift.\n@c0@"
  en: "@aMaria@bOff we go. The tower is just south of the abbey.\n@c0@"
  es: "@aMaría@bVamos, pues. La torre está al sur de la abadía.\n@c0@"
  fr: "@aMaria@bAllons-y. La tour se situe au sud de l'abbaye.\n@c0@"
  it: "@aMaria@bAndiamo.\nLa torre si trova a sud dell'Abbazia.\n@c0@"
  ja: "@a@bマリア「さあ　行きましょう。\n\t神の塔は　修道院から\n\t南東の方角ですわ。\n@c0@"
164:
  de: "@aHarry@bWir müssen wohl irgendeine besondere Verbindung zu Maria haben, wenn wir schon wieder mit ihr auf Reisen sind.\n@c0@"
  en: "@aHarry@bWe must have some special connection with Maria. That's why we've found ourselves travelling with her again.\n@c0@"
  es: "@aFroilán@bDebemos de tener alguna conexión especial con María. Por eso volvemos a viajar juntos.\n@c0@"
  fr: "@aHarry@bIl doit y avoir un lien spécial entre Maria et nous. C'est pour ça que nous voyageons à nouveau ensemble.\n@c0@"
  it: "@aRobert@bCredo che qualcosa di speciale ci leghi a Maria.\nDev'essere per questo motivo che ci ritroviamo a viaggiare con lei...\n@c0@"
  ja: "@a@bヘンリー「マリアと　いっしょに\n\t旅ができるなんて　オレたち\n\tきっと　縁があるんだな。\n@c0@"
165:
  de: "@aHarry@bSolange wir nur darauf achten, dass sie nicht zu Schaden kommt. Das ist die Hauptsache.\n@c0@"
  en: "@aHarry@bAs long as we make sure she doesn't come to any harm. That's the main thing.\n@c0@"
  es: "@aFroilán@bLo principal es que la cuidemos y la mantengamos a salvo.\n@c0@"
  fr: "@aHarry@bLe plus important, c'est qu'il ne lui arrive rien.\n@c0@"
  it: "@aRobert@bDobbiamo fare del nostro meglio perché non le accada nulla di male.\nPer me, questa è la cosa che conta più di ogni altra.\n@c0@"
  ja: "@a@bヘンリー「とにかく　マリアにだけは\n\tケガさせないように　気をつけようぜ。\n@c0@"
166:
  de: "@aHarry@bIch mache mir natürlich Sorgen, was wohl in Tifortu vor sich geht, aber ich glaube, es ist am besten, wenn ich mich dort nicht blicken lasse.\n@c0@"
  en: "@aHarry@bI'm obviously worried about what's happening over in Coburg, but I think it's for the best if I stay away.\n@c0@"
  es: "@aFroilán@bClaro que me preocupa lo que pasa en Trastámara pero creo que será mejor que me mantenga alejado.\n@c0@"
  fr: "@aHarry@bJe suis vraiment inquiet au sujet de ce qui se passe à Cobourg, mais je pense qu'il est préférable que je ne m'en occupe pas.\n@c0@"
  it: "@aRobert@bSono molto preoccupato per quello che sta succedendo a Coburg, ma preferisco non farmi vedere da quelle parti.\n@c0@"
  ja: "@a@bヘンリー「ラインハットが　どうなったか\n\t気にはなるけど　オレは\n\tもどらないほうが　いいだろうし……。\n@c0@"
167:
  de: "@aHarry@bIch werde den Ort einfach vergessen. Ich reise mit dir in der Welt herum, bis ich meinen eigenen Platz im Leben gefunden habe.\n@c0@"
  en: "@aHarry@bI'm just going to forget about the place. I'll keep travelling with you until I figure out my own way in the world.\n@c0@"
  es: "@aFroilán@bVoy a olvidarme de ese lugar. Seguiré viajando contigo hasta que descubra mi papel en el mundo.\n@c0@"
  fr: "@aHarry@bJe vais essayer d'oublier cet endroit. Je continuerai à te suivre jusqu'à ce que je sache ce que je veux faire exactement.\n@c0@"
  it: "@aRobert@bDevo dimenticarmi di quel posto.\nTi accompagnerò nei tuoi viaggi fino a quando non avrò capito cosa fare della mia vita.\n@c0@"
  ja: "@a@bヘンリー「あの国のことは　忘れて\n\tなにか　自分の目的が　みつかるまで\n\t%a000090の旅に　つきあうよ。\n@c0@"
168:
  de: "@aHarry@bHerrliches Wetter heute, findest du nicht? Das Gras duftet einfach herrlich.\n@c0@"
  en: "@aHarry@bLovely weather we've been having, don't you think? The grass smells wonderful.\n@c0@"
  es: "@aFroilán@bEstá haciendo un tiempo magnífico, ¿verdad? El olor a hierba es muy agradable.\n@c0@"
  fr: "@aHarry@bQuel temps magnifiqueⓠ Sens-moi cette bonne odeur d'herbe.\n@c0@"
  it: "@aRobert@bChe tempo meraviglioso...\nSembra che tutto il mondo stia per fiorire!\n@c0@"
  ja: "@a@bヘンリー「それにしても\n\tいい天気だなあ。\n\t草のにおいが　するよ。\n@c0@"
169:
  de: "@aHarry@bEs gibt doch nichts Besseres, als draußen an der frischen Luft herumzulaufen, wenn einem danach ist.\n@c0@"
  en: "@aHarry@bThere's nothing better than being free to walk around outdoors whenever the fancy takes you.\n@c0@"
  es: "@aFroilán@bNo hay nada mejor que ser libre y poder caminar por donde quieras siempre que te apetezca.\n@c0@"
  fr: "@aHarry@bIl n'y a rien de mieux que de pouvoir faire un tour dehors quand on en a envie.\n@c0@"
  it: "@aRobert@bÈ bellissimo essere liberi di uscire a fare una passeggiata ogni volta che se ne ha voglia.\n@c0@"
  ja: "@a@bヘンリー「外を　自由に歩けるって\n\t幸せだなあ。\n@c0@"
170:
  de: "@aHarry@bWenn ich so darüber nachdenke, habe ich damals kaum einen Fuß vor Schloss Tifortu gesetzt. Was für eine Vergeudung!\n@c0@"
  en: "@aHarry@bCome to think of it, I hardly ever set foot outside Coburg Castle back in those days.\r\nWhat a waste!\n@c0@"
  es: "@aFroilán@bA decir verdad, en el pasado apenas salía del Castillo de Trastámara.\r\n¡Cuánto tiempo malgastado!\n@c0@"
  fr: "@aHarry@bQuand j'y repense... je sortais à peine du château de Cobourg quand j'étais petit.\nQuel gâchisⓠ\n@c0@"
  it: "@aRobert@bSai una cosa?\nQuando vivevo a Coburg uscivo raramente dal Castello. Quant'ero sciocco!\n@c0@"
  ja: "@a@bヘンリー「考えてみれば\n\tラインハットの城からも　ほとんど\n\t出してもらえなかったからな。\n@c0@"
171:
  de: "@aHarry@bAaah, ich bin fix und fertig! Das einzig Gute am Sklavendasein war, dass wir einen geregelten Tagesablauf hatten!\n@c0@"
  en: "@aHarry@bAaah, I'm absolutely exhausted! One good thing I can say for being a slave was that we at least had a regular routine!\n@c0@"
  es: "@aFroilán@b¡Estoy completamente exhausto! ¡Una de las cosas positivas de la esclavitud era que al menos teníamos una rutina!\n@c0@"
  fr: "@aHarry@bAaah, je suis sur les rotulesⓠ L'avantage, quand on était esclaves, c'est qu'on faisait de l'exercice tous les joursⓠ\n@c0@"
  it: "@aRobert@bAaah, sono esausto...\nÈ da quando lavoravo come schiavo che non mi sentivo così stanco!\n@c0@"
  ja: "@a@bヘンリー「ふわぁ～　もう　ねむいや。\n\tドレイだった時は　生活リズムだけは\n\t規則正しかったもんな。\n@c0@"
172:
  de: "@aHarry@bWeißt du, das ist vielleicht das erste Mal in meinem Leben, dass ich nachts draußen herumwandere!\n@c0@"
  en: "@aHarry@bYou know, I think this might be the first time in my life that I've ever been out walking at night-time!\n@c0@"
  es: "@aFroilán@b¡Creo que esta es la primera vez en mi vida que he salido a caminar por la noche!\n@c0@"
  fr: "@aHarry@bTu sais quoiⓡ Je crois que c'est la première fois de ma vie que je me promène la nuitⓠ\n@c0@"
  it: "@aRobert@bLa sai una cosa? Credo che questa sia la prima volta in vita mia che esco a fare una passeggiata di notte...\n@c0@"
  ja: "@a@bヘンリー「考えてみれば\n\t夜　外を出歩くのなんて\n\tオレ　生まれて　初めてだよ！\n@c0@"
173:
  de: "@aHarry@bDie Sterne sind einfach wunderschön. Als wir Sklaven waren, hatten wir eigentlich nie so richtig Gelegenheit, sie uns anzusehen.\n@c0@"
  en: "@aHarry@bThe stars are absolutely beautiful. We never had the chance to really look at them back when we were slaves.\n@c0@"
  es: "@aFroilán@bLas estrellas son una preciosidad. Cuando éramos esclavos nunca teníamos ocasión de mirarlas.\n@c0@"
  fr: "@aHarry@bLes étoiles sont vraiment magnifiques. Nous ne pouvions jamais les voir lorsque nous étions esclaves.\n@c0@"
  it: "@aRobert@bIl cielo stellato è uno spettacolo meraviglioso...\nQuando eravamo schiavi, non abbiamo mai avuto mai la possibilità di guardarlo...\n@c0@"
  ja: "@a@bヘンリー「星が　きれいだな。\n\tドレイの頃は　空を見るよゆうなんて\n\tぜんぜん　なかったもんな。\n@c0@"
174:
  de: "@aHarry@bEs wird schon dunkel. Aber wir müssen weiter. Na los, %a000090.\n@c0@"
  en: "@aHarry@bIt's getting dark already. But we have to keep pushing on. Come on, %a000090!\n@c0@"
  es: "@aFroilán@bSe está haciendo de noche, pero tenemos que continuar. ¡Vamos, %a000090!\n@c0@"
  fr: "@aHarry@bIl commence à faire nuit, mais nous devons poursuivre notre route. Allez, %a000090ⓠ\n@c0@"
  it: "@aRobert@bSi sta facendo buio...\nMa per noi non è ancora arrivato il momento di riposare. Forza, %a000090!\n@c0@"
  ja: "@a@bヘンリー「もう日が　暮れちまったか。\n\tでも　先を　急ぎたいな……。\n\t%a000090　たのむぜ！\n@c0@"
175:
  de: "@aHarry@bMein Vater hatte nicht mehr viel Zeit, nachdem das alles geschehen war.\n@c0@"
  en: "@aHarry@bMy father didn't have much time left when it all happened.\n@c0@"
  es: "@aFroilán@bCuando sucedió todo, a mi padre le quedaba poco tiempo de vida.\n@c0@"
  fr: "@aHarry@bLes jours de mon père étaient comptés lorsque tout est arrivé.\n@c0@"
  it: "@aRobert@bA mio padre non restava molto tempo da vivere quando ebbero luogo quei tragici eventi...\n@c0@"
  ja: "@a@bヘンリー「親父が　あの後\n\tながく　なかったなんて……。\n@c0@"
176:
  de: "@aHarry@bIch wünschte nur, ich könnte ihn nur noch einmal sehen. Aber alles Wünschen nutzt ja jetzt auch nichts mehr.\n@c0@"
  en: "@aHarry@bI wish I could meet him again, just once. I suppose there's no use in wishing, though.\n@c0@"
  es: "@aFroilán@bMe gustaría poder volver a verlo una vez más. Aunque lo que yo quiera poco importa...\n@c0@"
  fr: "@aHarry@bJ'aimerais pouvoir le revoir. Juste une fois...\r\nEnfin, je suppose que ce genre de souhait ne peut pas changer grand-chose.\n@c0@"
  it: "@aRobert@bAvrei tanto voluto rivederlo, anche una volta sola.\nOrmai non c'è più nulla da fare. Ed è inutile che io mi porti dietro il peso di questo rimpianto...\n@c0@"
  ja: "@a@bヘンリー「できれば　もう一度\n\t会って　話したかったんだけど……\n\tまあ　しかたないな。\n@c0@"
177:
  de: "@aHarry@bOb der Spiegel, der die Wahrheit enthüllt, wohl noch im Turm ist? Das Tagebuch war ja doch ganz schön alt.\n@c0@"
  en: "@aHarry@bI wonder if this mirror that reveals the truth is even still hidden in the tower. That diary was really ancient, let's face it.\n@c0@"
  es: "@aFroilán@bMe pregunto si el espejo que revela la verdad sigue oculto en la torre. Ese diario era realmente muy antiguo.\n@c0@"
  fr: "@aHarry@bJe me demande si ce miroir qui révèle la vérité se trouve toujours dans la tourⓡ Le journal que nous avons lu n'était pas récent.\n@c0@"
  it: "@aRobert@bMi chiedo se lo specchio che mostra la verità sia ancora nascosto nella torre... Dopotutto, il diario che ne parlava è stato scritto tantissimo tempo fa!\n@c0@"
  ja: "@a@bヘンリー「真実をうつしだす鏡なんて\n\t本当に　まだ塔に　あるのかな？\n\tずいぶん古い　日記だったし…。\n@c0@"
178:
  de: "@aHarry@bDas war wirklich ein merkwürdiges Volk da drin.\n@c0@"
  en: "@aHarry@bThe folk inside were certainly a weird bunch.\n@c0@"
  es: "@aFroilán@bLa gente que había en el castillo era de lo más rarito.\n@c0@"
  fr: "@aHarry@bJe dois reconnaître que les gens du château sont de drôles d'oiseaux.\n@c0@"
  it: "@aRobert@bCerto che al castello tira una brutta aria, eh?\n@c0@"
  ja: "@a@bヘンリー「中に　いる人間は\n\t変わっちまってたけどさ。\n@c0@"
179:
  de: "@aHarry@bAber es war trotzdem schön, mal wieder im Schloss zu sein. Irgendwie fehlt es mir. Schließlich war es mal mein Zuhause.\n@c0@"
  en: "@aHarry@bBut it was still nice to be back in the castle again. I sort of miss the place. It was once my home, after all.\n@c0@"
  es: "@aFroilán@bPero me ha gustado volver a estar allí. Creo que lo echo de menos. Al fin y al cabo, era mi hogar.\n@c0@"
  fr: "@aHarry@bMais ça m'a fait plaisir d'y retourner. Cet endroit me manque parfois. Après tout, c'était quand même chez moi, avant.\n@c0@"
  it: "@aRobert@bCiononostante, mi ha fatto piacere tornare a Coburg. Un po' ne avevo nostalgia, sai? Del resto, è il posto in cui ho trascorso la mia infanzia...\n@c0@"
  ja: "@a@bヘンリー「それでも　やっぱり\n\t城内の様子は　なつかしかったよ。\n\tあそこは　オレの家なんだよな。\n@c0@"
180:
  de: "@aMaria@bIch hoffe nur, dass ich helfen kann, %a000090.\n@c0@"
  en: "@aMaria@bI do hope I'll be able to help you out, %a000090.\n@c0@"
  es: "@aMaría@bEspero poder ayudarte, %a000090.\n@c0@"
  fr: "@aMaria@bJ'espère sincèrement que je serai en mesure de t'aider, %a000090.\n@c0@"
  it: "@aMaria@bSpero proprio di essere in grado di aiutarti, %a000090.\n@c0@"
  ja: "@a@bマリア「私が　%a000090さんたちの\n\tお役に立てると　いいのですけど…。\n@c0@"
181:
  de: "@aHarry@bIch frage mich, ob er wirklich die Kräfte hat, die wir in ihm vermuten. Er sieht eigentlich nur wie ein alter Spiegel aus.\n@c0@"
  en: "@aHarry@bI wonder if it really does have the powers we think it has. It looks just like an old mirror from where I'm standing.\n@c0@"
  es: "@aFroilán@bMe pregunto si realmente tiene los poderes que creemos que tiene. Desde este ángulo me parece tan solo un espejo viejo.\n@c0@"
  fr: "@aHarry@bJe me demande s'il a effectivement le pouvoir qu'on lui attribue. À première vue, on dirait juste un vieux miroir.\n@c0@"
  it: "@aRobert@bChissà se questo specchio è davvero magico...\nA prima vista, mi sembra uguale a tutti gli altri.\n@c0@"
  ja: "@a@bヘンリー「しかし　この鏡に　そんな\n\tふしぎなチカラが　あるのかなあ？\n\tこうして見ると　ただの古い鏡だし。\n@c0@"
182:
  de: "@aHarry@bWir sollten lieber sehen, dass wir wieder nach Tifortu zurückkommen. Hier draußen wird's mir langsam unheimlich.\n@c0@"
  en: "@aHarry@bWe'd better hurry on back to Coburg. It's starting to give me the willies being out here.\n@c0@"
  es: "@aFroilán@bSerá mejor que nos demos prisa en volver a Trastámara. Esto me está poniendo los pelos de punta.\n@c0@"
  fr: "@aHarry@bNous ferions mieux de retourner à Cobourg en vitesse. Je ne suis pas spécialement rassuré ici.\n@c0@"
  it: "@aRobert@bSbrighiamoci a tornare a Coburg.\nQuesto posto non mi piace per niente...\n@c0@"
  ja: "@a@bヘンリー「さあ　ラインハットに\n\t急ごうぜ。　どうも　さっきから\n\t悪い予感が　するんだ。\n@c0@"
183:
  de: "@aMaria@bIch bin so froh, dass ich mit euch beiden mitkommen konnte, %a000090. Es hat mir wirklich gut getan.\n@c0@"
  en: "@aMaria@bI'm so glad I could come along with you both, %a000090. It's cheered me up no end.\n@c0@"
  es: "@aMaría@bMe alegra mucho haber podido acompañaros, %a000090. Me ha hecho más feliz de lo que puedas imaginar.\n@c0@"
  fr: "@aMaria@bJe suis heureuse d'avoir pu vous accompagner tous les deux, %a000090. Ça m'a vraiment remonté le moral.\n@c0@"
  it: "@aMaria@b%0%a000090, sono contenta di aver avuto la possibilità di venire con voi.\nPer me è stata una gioia grandissima!\n@c0@"
  ja: "@a@bマリア「%a000090さんたちに　ついてきて\n\t良かったです。　しずんでいた\n\t気持ちも　少し　軽くなりました。\n@c0@"
184:
  de: "@aHarry@bEs hat keinen Zweck, hier dumm herumzustehen, wenn sich die Türen nicht öffnen wollen. Versuchen wir es anderswo, %a000090.\n@c0@"
  en: "@aHarry@bThere's no point just standing here if the doors won't open. Let's try going somewhere else, %a000090.\n@c0@"
  es: "@aFroilán@bSi las puertas no van a abrirse no tiene sentido quedarse. Vámonos a otro lado, %a000090.\n@c0@"
  fr: "@aHarry@bÇa ne sert à rien de rester plantés là si les portes ne s'ouvrent pas. Essayons d'aller ailleurs, %a000090.\n@c0@"
  it: "@aRobert@bNon ha senso restare qui visto che le porte non si aprono...\nProviamo da qualche altra parte, %a000090.\n@c0@"
  ja: "@a@bヘンリー「扉が　開かないんじゃ\n\tしょうがないな。\n\t%a000090　ほかへ　行こうぜ。\n@c0@"
185:
  de: "@aHarry@bHmpf. Der Schlüssel von Tifortu scheint uns hier ja nicht weiterzuhelfen.\n@c0@"
  en: "@aHarry@bHmph. Looks like the key from Coburg isn't any use here.\n@c0@"
  es: "@aFroilán@bMmm. Parece que la llave de Trastámara no sirve de nada aquí.\n@c0@"
  fr: "@aHarry@bMmpf. On dirait que la clef de Cobourg n'est\r\nd'aucune utilité, ici.\n@c0@"
  it: "@aRobert@bUhm...\nA quanto pare la chiave di Coburg non serve a nulla qui...\n@c0@"
  ja: "@a@bヘンリー「う～ん。\n\tやっぱり　ウチの城のカギじゃ\n\t開かないな……。\n@c0@"
186:
  de: "@aHarry@bIm Tagebuch stand etwas davon, dass der Schlüssel in der Hand von Mönchen sei. Wo wir die wohl finden können?\n@c0@"
  en: "@aHarry@bIt said something in that diary about some monks having the key. I wonder where we can find them.\n@c0@"
  es: "@aFroilán@bEn ese diario decía algo acerca de que unos siervos de la Diosa tenían la llave. ¿Dónde podríamos encontrarlos?\n@c0@"
  fr: "@aHarry@bCe journal disait que des moines possédaient la clef.\r\nJe me demande où ils peuvent se trouver.\n@c0@"
  it: "@aRobert@bSe non sbaglio, avevamo letto che la chiave necessaria era in possesso di alcuni monaci...\nDove possiamo trovarli?\n@c0@"
  ja: "@a@bヘンリー「そういえば　日記には\n\t修道僧が　カギを持ってるって\n\t書いてあったけど　どこにいるんだろ？\n@c0@"
187:
  de: "@aMaria@bIch bin so froh, dass ich helfen konnte. Welche Erleichterung!\n@c0@"
  en: "@aMaria@bI'm so happy that I could be of use to you.\nWhat a relief!\n@c0@"
  es: "@aMaría@bMe alegro de haberos sido de ayuda.\r\n¡Qué alivio!\n@c0@"
  fr: "@aMaria@bJe suis si heureuse d'avoir pu vous être utile.\nQuel soulagementⓠ\n@c0@"
  it: "@aMaria@bSono davvero felice di esservi stata di aiuto!\nSia ringraziata la dea!\n@c0@"
  ja: "@a@bマリア「%a000090さんたちの\n\tお役に立てて　うれしいです。\n\t本当に　よかった……。\n@c0@"
188:
  de: "@aHarry@bIch wusste, dass Maria diese Türen aufbekommen würde! Ich habe immer an sie geglaubt!\n@c0@"
  en: "@aHarry@bI knew Maria would be able to get those doors open! I always believed in her!\n@c0@"
  es: "@aFroilán@b¡Sabía que María lograría abrir esas puertas! ¡Siempre creí en ella!\n@c0@"
  fr: "@aHarry@bJe savais que Maria réussirait à ouvrir ces portesⓠ Je n'ai jamais douté d'elleⓠ\n@c0@"
  it: "@aRobert@bSapevo che Maria sarebbe riuscita ad aprire la porta!\nHo sempre avuto fiducia in lei!\n@c0@"
  ja: "@a@bヘンリー「オレは　マリアなら\n\t絶対にできるって　信じてたぜ！\n@c0@"
189:
  de: "@aHarry@bGehen wir ihn holen! Aber wir sollten vorsichtig vorgehen. Wir müssen schließlich an Maria denken!\n@c0@"
  en: "@aHarry@bLet's go and get it! But we should tread carefully. We have Maria to think of, after all.\n@c0@"
  es: "@aFroilán@b¡Manos a la obra! Aunque hay que tener cuidado: debemos pensar en María.\n@c0@"
  fr: "@aHarry@bAllons chercher ce miroirⓠ Mais avançons prudemment. Nous devons penser à Maria.\n@c0@"
  it: "@aRobert@bForza, sbrighiamoci!\r\nMi raccomando, però! Facciamo attenzione!\r\nNon possiamo far correre rischi a Maria...\n@c0@"
  ja: "@a@bヘンリー「さあ　行こうぜ！\n\tマリアも　いるんだから\n\tしんちょうにな　%a000090。\n@c0@"
190:
  de: "@aHarry@bWorauf warten wir denn noch? Es hat keinen Zweck mehr, noch länger hier herumzuhängen. Komm, auf nach Tifortu!\n@c0@"
  en: "@aHarry@bWhat are we waiting for? There's no point in hanging around here any longer, let's hurry back to Coburg!\n@c0@"
  es: "@aFroilán@b¿A qué estamos esperando? ¡No tiene sentido quedarse aquí, volvamos corriendo a Trastámara!\n@c0@"
  fr: "@aHarry@bQu'est-ce qu'on attendⓡ Ça ne sert à rien de traîner ici plus longtemps. Dépêchons-nous\nde rentrer à Cobourgⓠ\n@c0@"
  it: "@aRobert@bChe cosa stiamo aspettando?\nNon abbiamo più niente da fare qui!\nTorniamo subito a Coburg!\n@c0@"
  ja: "@a@bヘンリー「おい　おい！\n\tこの塔に　もう用はないだろ？\n\t早く　ラインハットへ　もどろうぜ。\n@c0@"
191:
  de: "@aHarry@bHast du das gesehen, %a000090?\n@c0@"
  en: "@aHarry@bDid you see that, %a000090?\n@c0@"
  es: "@aFroilán@b¿Has visto eso, %a000090?\n@c0@"
  fr: "@aHarry@bTu as vu ça, %a000090ⓡ\n@c0@"
  it: "@aRobert@bHai visto, %a000090?\n@c0@"
  ja: "@a@bヘンリー「%a000090　見たよな？\n@c0@"
192:
  de: "@aHarry@bIch auch. Den Mann werde ich so schnell nicht vergessen. Heißt das, die Frau war...?\n@c0@"
  en: "@aHarry@bMe too. I wouldn't forget that man in a hurry. Does that mean the woman was...?\n@c0@"
  es: "@aFroilán@bYo también. No olvidaré a ese hombre fácilmente. ¿Significará esto que esa mujer era...?\n@c0@"
  fr: "@aHarry@bMoi aussi. Je ne suis pas près d'oublier cet homme. Est-ce que ça veut dire que la femme était...ⓡ\n@c0@"
  it: "@aRobert@bAnch'io. Non credo che riuscirò a dimenticare quell'uomo tanto in fretta.\nMa allora la donna era...?\n@c0@"
  ja: "@a@bヘンリー「オレも……\n\tあの人の姿は　忘れないぜ。\n\tすると　あの女の人が　もしかして…？\n@c0@"
193:
  de: "@aHarry@bNein? Oh, dann muss ich es mir wohl eingebildet haben.\n@c0@"
  en: "@aHarry@bNo? Oh... I must have been imagining things.\n@c0@"
  es: "@aFroilán@b¿No? ¡Oh! Serán imaginaciones mías.\n@c0@"
  fr: "@aHarry@bNonⓡ Oh... J'ai dû rêver, alors.\n@c0@"
  it: "@aRobert@bNo? Oh...\nDev'essere stato uno scherzo della mia immaginazione.\n@c0@"
  ja: "@a@bヘンリー「そうか……\n\tじゃあ　オレの見まちがいだな…。\n@c0@"
194:
  de: "@aHarry@bDieser Turm sieht sehr alt aus. Ich hatte keine Ahnung, dass es ihn gibt, hier zwischen all den Bergen.\n@c0@"
  en: "@aHarry@bThis tower looks really ancient. I had no idea it was here, in amongst all these mountains.\n@c0@"
  es: "@aFroilán@bEsta torre parece muy antigua. No tenía ni idea de que estuviera aquí, entre las montañas.\n@c0@"
  fr: "@aHarry@bCette tour paraît vraiment ancienne.\r\nJ'ignorais totalement qu'elle se trouvait là,\r\nau beau milieu de ces montagnes.\n@c0@"
  it: "@aRobert@bNon immaginavo che qui tra le montagne ci fosse una torre.\nA prima vista, sembra molto antica...\n@c0@"
  ja: "@a@bヘンリー「ずいぶん　古い塔だな。\n\tこんな山の中に　塔があったなんて\n\t知らなかったよ。\n@c0@"
195:
  de: "@aHarry@bDas muss der Turm sein, von dem wir in dem Tagebuch gelesen haben! Hier also soll der Spiegel sein.\n@c0@"
  en: "@aHarry@bThis must be the tower we read about in that diary! So this is where the mirror's supposed\r\nto be.\n@c0@"
  es: "@aFroilán@b¡Debe de ser la torre sobre la que leímos en el diario! Así que aquí se supone que está el espejo.\n@c0@"
  fr: "@aHarry@bÇa doit être la tour dont parlait ce journalⓠ\nC'est donc ici que doit se trouver le miroir.\n@c0@"
  it: "@aRobert@bQuesta dev'essere la torre di cui abbiamo letto nel diario!\nSe è così, allora lo specchio è qui dentro.\n@c0@"
  ja: "@a@bヘンリー「これが　あの日記に\n\t書かれていた塔だな。\n\tここに　鏡があるはずなんだけど…。\n@c0@"
196:
  de: "@aMaria@b...\n@c0@"
  en: "@aMaria@b............\n@c0@"
  es: "@aMaría@b...\n@c0@"
  fr: "@aMaria@b............\n@c0@"
  it: "@aMaria@b...\n@c0@"
  ja: "@a@bマリア「……………。\n@c0@"
197:
  de: "@a@bMaria sieht etwas nervös aus.\n@c0@"
  en: "@a@bMaria looks a bit nervous.\n@c0@"
  es: "@a@bMaría parece algo nerviosa.\n@c0@"
  fr: "@a@bMaria semble un peu nerveuse.\n@c0@"
  it: "@a@bMaria sembra un po' nervosa.\n@c0@"
  ja: "@a@bマリアは　少し\nきんちょうしているようだ……。\n@c0@"
198:
  de: "@aHarry@bEr ist alt, aber gut erhalten. Vielleicht hat die Göttin ihn beschützt.\n@c0@"
  en: "@aHarry@bIt's old, but it's certainly stood up well over the years. Maybe it's been protected by the Goddess.\n@c0@"
  es: "@aFroilán@bEs vieja, pero ha resistido muy bien los años. Quizás la proteja la Diosa.\n@c0@"
  fr: "@aHarry@bLe bâtiment est ancien, mais il a vraiment bien supporté l'épreuve du temps. Peut-être qu'il est protégé par la Déesse.\n@c0@"
  it: "@aRobert@bÈ vecchio, ma il tempo non lo ha rovinato affatto.\nForse è stato preservato dalla dea...\n@c0@"
  ja: "@a@bヘンリー「古いわりには　けっこう\n\tしっかりした塔だな。\n\t神さまに　守られてるってワケか？\n@c0@"
199:
  de: "@aMaria@bIch kann eine Art himmlischer Präsenz spüren. Vielleicht stimmt es, dass dieser Ort von der Göttin erschaffen wurde.\n@c0@"
  en: "@aMaria@bI can sense a kind of divine presence. Maybe it's true that this place was created by the Goddess.\n@c0@"
  es: "@aMaría@bSiento una presencia divina. Quizá sea cierto que este sitio fue creado por la Diosa.\n@c0@"
  fr: "@aMaria@bJe perçois une sorte de présence sacrée.\r\nC'est peut-être vrai que cet endroit a été\r\ncréé par la Déesse.\n@c0@"
  it: "@aMaria@bMi sembra quasi di percepire una presenza divina.\nForse è vero che questo posto fu creato dalla dea...\n@c0@"
  ja: "@a@bマリア「なにか　神聖な気配を感じます。\n\t神がおつくりになった　というのは\n\t本当かもしれませんね。\n@c0@"
200:
  de: "@aHarry@bEs muss einen Weg geben, den wir übersehen haben. Wir müssen alles genau untersuchen.\n@c0@"
  en: "@aHarry@bThere must be a way ahead that we've overlooked. We must explore all possibilities.\n@c0@"
  es: "@aFroilán@bDebemos de haber pasado algo por alto. Hay que explorar todas las posibilidades.\n@c0@"
  fr: "@aHarry@bIl doit y avoir un passage que nous n'avons pas vu.\r\nNous devons examiner toutes les possibilités.\n@c0@"
  it: "@aRobert@bDev'esserci un modo per proseguire, solo che non lo abbiamo ancora trovato!\nForza, cerchiamo di spremerci le meningi...\n@c0@"
  ja: "@a@bヘンリー「%a000090　見落としてる通路が\n\tあるかも知れないからな。\n\tよく　見回して　進むんだぞ。\n@c0@"
201:
  de: "@aMaria@bDas ist ganz schön tief, nicht? Sei vorsichtig!\n@c0@"
  en: "@aMaria@bThat's rather a big drop, isn't it?\nTake care not to fall!\n@c0@"
  es: "@aMaría@bEs una buena caída, ¿eh?\r\n¡Cuidado por dónde pisáis!\n@c0@"
  fr: "@aMaria@bÇa fait une drôle de hauteur, heinⓡ\nAttention à ne pas tomberⓠ\n@c0@"
  it: "@aMaria@bBrrr! L'altezza mi dà i brividi!\nAttenzione a non cadere!\n@c0@"
  ja: "@a@bマリア「とても　大きな穴ですね。\n\t落ちないように　気をつけてください。\n@c0@"
202:
  de: "@aHarry@bWirst du nicht müde, Maria? Vielleicht sollten wir uns einen Moment ausruhen.\n@c0@"
  en: "@aHarry@bAren't you getting tired, Maria?\nMaybe we should rest for a while.\n@c0@"
  es: "@aFroilán@b¿No estás cansada, María?\r\nQuizá deberíamos descansar un poco.\n@c0@"
  fr: "@aHarry@bTu n'es pas trop fatiguée, Mariaⓡ\nOn devrait peut-être se reposer un peu.\n@c0@"
  it: "@aRobert@bTi stai stancando, Maria?\nVuoi che ci fermiamo un po'?\n@c0@"
  ja: "@a@bヘンリー「マリア　そろそろ\n\t疲れたんじゃないか？\n\t少し　休もうぜ。\n@c0@"
203:
  de: "@aMaria@bNein, gar nicht. Ich möchte euch nicht aufhalten.\n@c0@"
  en: "@aMaria@bNo, not at all. I don't want to slow you down.\n@c0@"
  es: "@aMaría@bNo, no. No quiero frenaros.\n@c0@"
  fr: "@aMaria@bNon, pas du tout. Je ne veux pas vous ralentir.\n@c0@"
  it: "@aMaria@bNo, non se ne parla.\nNon voglio che rallentiate per causa mia.\n@c0@"
  ja: "@a@bマリア「いいえ　大丈夫です。\n\t私　みなさんの\n\t足手まといには　なりませんわ。\n@c0@"
204:
  de: "@aHarry@bDieser Turm geht mir allmählich auf die Nerven! Für solche Kinkerlitzchen haben wir keine Zeit!\n@c0@"
  en: "@aHarry@bThis tower's starting to get on my nerves!\nWe don't have time for this kind of thing!\n@c0@"
  es: "@aFroilán@b¡Esta torre empieza a enervarme!\r\n¡No tenemos tiempo para estas cosas!\n@c0@"
  fr: "@aHarry@bCette tour commence à me taper sur les nerfsⓠ\nNous n'avons pas le temps pour ce genre de chosesⓠ\n@c0@"
  it: "@aRobert@bQuesta torre sta iniziando a farmi innervosire!\nStiamo perdendo troppo tempo!\n@c0@"
  ja: "@a@bヘンリー「なんだか　やたらと\n\tめんどうくさい造りの塔だな。\n\tこっちは　急いでるってのに！\n@c0@"
205:
  de: "@aHarry@bAch, verflixt! Wie sollen wir denn weiterkommen, wenn der Weg auf einmal verschwunden ist?\n@c0@"
  en: "@aHarry@bOh blast! How are we supposed to go any further with the path gone like this!?\n@c0@"
  es: "@aFroilán@b¡Rayos! ¿Cómo vamos a continuar si el camino desaparece?\n@c0@"
  fr: "@aHarry@bEt flûteⓠ Comment est-on censés avancer s'il n'y a plus de cheminⓡⓐ\n@c0@"
  it: "@aRobert@bOh, dannazione!\nE ora come facciamo?!\n@c0@"
  ja: "@a@bヘンリー「なんだ　ここは！？\n\t通路が　とぎれてて\n\tこれじゃ　先に進めないぞ！\n@c0@"
206:
  de: "@aMaria@bEs geht hier doch darum, dass nur jene, die an das glauben, was sie nicht immer sehen können, die Segnungen der Göttin erfahren.\n@c0@"
  en: "@aMaria@bThe idea behind this place is that only those who believe in things they can't always see receive the blessing of the Goddess.\n@c0@"
  es: "@aMaría@bLa idea subyacente aquí es que solo aquellos que creen en cosas que no siempre pueden ver reciben la bendición de la Diosa.\n@c0@"
  fr: "@aMaria@bLe principe de cet endroit, c'est que seuls ceux qui croient en ce qu'ils ne voient pas peuvent recevoir\r\nla bénédiction de la Déesse.\n@c0@"
  it: "@aMaria@bQuesto luogo è un invito a credere in ciò che non si può vedere. Solo chi ci saprà riuscirci riceverà la benedizione della dea.\n@c0@"
  ja: "@a@bマリア「たしか　この塔の言い伝えでは\n\tおのれの見たものしか　信じぬ者は\n\t神の祝福を受けられないとか……。\n@c0@"
207:
  de: "@aMaria@bAlso ist dies vielleicht eine Art Prüfung. Um zu sehen, ob wir anzweifeln, was uns doch eigentlich direkt vor Augen steht.\n@c0@"
  en: "@aMaria@bSo maybe this is a kind of test. To see if we'll doubt what's actually before our very eyes.\n@c0@"
  es: "@aMaría@bAsí que quizá sea una especie de prueba para ver si dudamos de lo que tenemos delante.\n@c0@"
  fr: "@aMaria@bAlors c'est peut-être une sorte d'épreuve.\r\nPour voir si nous doutons de ce qui se trouve\r\njuste sous nos yeux.\n@c0@"
  it: "@aMaria@bÈ una prova, un modo per vedere se dubiteremo di ciò che ci ritroveremo davanti agli occhi.\n@c0@"
  ja: "@a@bマリア「今こそ　目に見えるものを\n\tうたがってみる時なのかも\n\tしれませんね。\n@c0@"
208:
  de: "@aHarry@bWir haben ihn gefunden! Mit diesem Spiegel werden wir Tifortu aus dem Chaos retten, in das es geraten ist!\n@c0@"
  en: "@aHarry@bWe found it! With this mirror, we'll be able to save Coburg from the chaos it's fallen into!\n@c0@"
  es: "@aFroilán@b¡Lo conseguimos! ¡Con este espejo podremos salvar Trastámara del caos en que está sumida!\n@c0@"
  fr: "@aHarry@bNous l'avons trouvéⓠ Avec ce miroir, nous allons pouvoir sauver le royaume de Cobourg du chaos dans lequel il est plongéⓠ\n@c0@"
  it: "@aRobert@bL'abbiamo trovato!\nGrazie a questo specchio riusciremo a salvare il Regno di Coburg dalla tragedia in cui è precipitato!\n@c0@"
  ja: "@a@bヘンリー「ついに　見つけたぞ！\n\tこの鏡があれば　今のラインハットを\n\t救うことができるはずだ。\n@c0@"
209:
  de: "@aMaria@bWir haben es geschafft, die Prüfung des Turms zu bestehen! Oh große Göttin, wir sind dir dankbar bis in alle Ewigkeit!\n@c0@"
  en: "@aMaria@bWe managed to pass the trial of the tower!\nDear Goddess, we are eternally grateful!\n@c0@"
  es: "@aMaría@b¡Logramos superar la prueba de la torre!\r\n¡Diosa querida, te estaremos siempre agradecidos!\n@c0@"
  fr: "@aMaria@bNous avons réussi à passer l'épreuve de la tourⓠ Chère Déesse, nous te sommes éternellement reconnaissantsⓠ\n@c0@"
  it: "@aMaria@bSiamo riusciti a superare la prova della torre!\nSanta dea, ti ringraziamo della protezione che ci hai accordato!\n@c0@"
  ja: "@a@bマリア「私たち　神の試練を\n\t乗り越えることができたんですね！\n\t神さま…　ありがとうございました。\n@c0@"
210:
  de: "@aHarry@bIch hätte ja nicht gedacht, dass sich direkt vor mir ein Weg befinden könnte, den ich nicht sehen kann.\n@c0@"
  en: "@aHarry@bI didn't expect there to be a path right in front of me that I couldn't see.\n@c0@"
  es: "@aFroilán@bNo esperaba que justo delante tuviera un camino que no podía ver.\n@c0@"
  fr: "@aHarry@bJe ne m'attendais pas à ce qu'il y ait juste en face de moi un chemin que je ne pouvais pas voir.\n@c0@"
  it: "@aRobert@bNon credevo che davanti a me ci fosse una strada che non potessi vedere...\n@c0@"
  ja: "@a@bヘンリー「それにしても\n\t目に見えない通路ってのは\n\tビックリしたな。\n@c0@"
211:
  de: "@aHarry@bJetzt glaube ich, es könnte doch was dran sein an dem Gerede, dass der Turm von der Göttin erschaffen wurde.\n@c0@"
  en: "@aHarry@bNow I'm starting to think there might be some truth in this talk of the tower being created by the Goddess.\n@c0@"
  es: "@aFroilán@bEmpiezo a creer que eso de que la torre es creación de la Diosa va a ser verdad.\n@c0@"
  fr: "@aHarry@bJe commence à me dire qu'il pourrait bien\r\ny avoir du vrai dans cette histoire de tour\r\ncréée par la Déesse.\n@c0@"
  it: "@aRobert@bInizio a pensare che le voci secondo cui la torre è stata creata dalla dea siano vere.\n@c0@"
  ja: "@a@bヘンリー「神がつくった塔　という話も\n\tあながち　作り話じゃなさそうだ。\n@c0@"
212:
  de: "@aMaria@bEs war schrecklich, aber jetzt wissen wir, dass man nur den Mut braucht, einen Fuß vor den anderen zu setzen, dann wird sich ein Weg öffnen.\n@c0@"
  en: "@aMaria@bIt was frightening, but we've proved now that you just need the courage to move forward one step at a time, and a path will open up to you.\n@c0@"
  es: "@aMaría@bHa sido aterrador, pero hemos probado que si demuestras coraje, avanzas paso a paso y el camino se abre ante ti.\n@c0@"
  fr: "@aMaria@bC'était effrayant, mais nous avons prouvé qu'il suffit d'avoir le courage d'avancer d'un pas à la fois pour qu'un chemin s'ouvre devant soi.\n@c0@"
  it: "@aMaria@bÈ stata durissima, ma abbiamo capito che, se sapremo andare avanti un passo alla volta, un nuovo sentiero si aprirà davanti a noi.\n@c0@"
  ja: "@a@bマリア「不安でしたが\n\t勇気をもって　１歩　ふみ出せば\n\t道が　ひらけるものなのですね。\n@c0@"
213:
  de: "@aMaria@bDaraus habe ich etwas gelernt, und ich will versuchen, von jetzt an mein Leben voller Mut zu führen!\n@c0@"
  en: "@aMaria@bI'm going to learn from this, and try to live my life with courage from now on in!\n@c0@"
  es: "@aMaría@bEsto me ha enseñado una valiosa lección. ¡A partir de ahora procuraré ser más valiente!\n@c0@"
  fr: "@aMaria@bJe vais tâcher de retenir la leçon de cette expérience et essayer de vivre ma vie avec\ncourage à partir de maintenantⓠ\n@c0@"
  it: "@aMaria@bQuesto è stato un insegnamento prezioso per me.\r\nD'ora in avanti cercherò di vivere con coraggio!\n@c0@"
  ja: "@a@bマリア「私も　これからは\n\t勇気をもって　生きたいと思います。\n@c0@"
214:
  de: "@aHarry@bTja, wir haben, weswegen wir gekommen sind. Wir sollten nach Tifortu zurückgehen und dieses Kapitel abschließen.\n@c0@"
  en: "@aHarry@bWell, we have what we came for. We should hurry on back to Coburg and put this little episode behind us.\n@c0@"
  es: "@aFroilán@bTenemos lo que vinimos a buscar. Deberíamos volver a Trastámara y dejar atrás este episodio.\n@c0@"
  fr: "@aHarry@bBon, nous avons ce que nous étions venus chercher. Nous devrions nous dépêcher de rentrer à Cobourg et laisser ce petit épisode derrière nous.\n@c0@"
  it: "@aRobert@bBene, abbiamo ottenuto ciò che cercavamo.\r\nDirei che possiamo considerare conclusa quest'esperienza, no? Forza, si torna a Coburg!\n@c0@"
  ja: "@a@bヘンリー「目的のものは　見つけたんだ。\n\t早いとこ　ラインハットに帰って\n\tこの一件を　終わらせようぜ！\n@c0@"
215:
  de: "@aHarry@bEs tut mir leid, dass ich dir und Maria so viel zugemutet habe, %a000090.\n@c0@"
  en: "@aHarry@bSorry I put you and Maria to so much trouble, %a000090.\n@c0@"
  es: "@aFroilán@bSiento haberos metido en tantos líos, %a000090.\n@c0@"
  fr: "@aHarry@bDésolé de vous avoir causé tant d'ennuis,\nà toi et à Maria, %a000090.\n@c0@"
  it: "@aRobert@bMi dispiace di aver causato tanti problemi a te e a Maria, %a000090.\nVolevo dirvi che vi sono grato per... Uhm...\n@c0@"
  ja: "@a@bヘンリー「オレのわがままのせいで\n\t%a000090と　マリアには\n\tホント　苦労かけちまったな。\n@c0@"
216:
  de: "@aHarry@bAber ganz ist die Sache noch nicht ausgestanden. Ich werde meinen Dank für den Moment aufsparen, wenn das alles endgültig vorbei ist.\n@c0@"
  en: "@aHarry@bWe're not quite there yet, though. I'll save my thanks for when this is all done and dusted.\n@c0@"
  es: "@aFroilán@bAunque aún no hemos terminado. Dejaré los agradecimientos para cuando todo haya concluido.\n@c0@"
  fr: "@aHarry@bMais nous n'avons pas encore tout à fait terminé.\r\nJe vais garder mes remerciements pour plus tard,\r\nquand tout sera vraiment fini.\n@c0@"
  it: "@aRobert@bNo. Il nostro compito non si è ancora concluso.\nForse è meglio rimandare ringraziamenti e discorsi di circostanza...\n@c0@"
  ja: "@a@bヘンリー「でも　まだ　終わってない。\n\t礼を言うのは　全てが\n\t片付いてからにするぜ。\n@c0@"
217:
  de: "@aBianca@bEs ist großartig, nach all den Jahren wieder auf Abenteuersuche zu gehen, %a000090.\n@c0@"
  en: "@aBianca@bIt's great to be able to have a little adventure together again after all these years, %a000090!\n@c0@"
  es: "@aBianca@b¡Qué guay volver a vivir una pequeña aventura después de tantos años, %a000090!\n@c0@"
  fr: "@aBianca@bC'est super de pouvoir de nouveau partir ensemble pour une petite aventure après toutes ces années, %a000090ⓠ\n@c0@"
  it: "@aBianca@bSono contenta di poter vivere una nuova avventura insieme a te dopo tanti anni, %a000090!\n@c0@"
  ja: "@a@bビアンカ「再会して　そうそうに　また\n\t%a000090と　冒険ができるなんて…\n@c0@"
218:
  de: "@aBianca@bDu bist ganz schön erwachsen geworden seit dem letzten Mal. Denk nur, was wir jetzt für einen Spaß haben können!\n@c0@"
  en: "@aBianca@bYou've grown up an awful lot since last\r\ntime. Just imagine what kind of fun we \r\ncould have now!\n@c0@"
  es: "@aBianca@bHas crecido, y mucho, desde la última vez. ¡Imagina lo bien que nos lo podemos pasar ahora!\n@c0@"
  fr: "@aBianca@bTu as énormément grandi depuis la dernière fois. Imagine un peu comme on pourrait s'amuser, maintenantⓠ\n@c0@"
  it: "@aBianca@bVedrai, ci divertiremo un mondo!\n@c0@"
  ja: "@a@bビアンカ「%a000090も　ずいぶん\n\t成長したみたいだし　今度は\n\tどんな冒険になるか　楽しみねっ。\n@c0@"
219:
  de: "@aBianca@bHör nicht auf meinen Vater. Er ist krank. Er weiß nicht, was er sagt!\n@c0@"
  en: "@aBianca@bDun't take any notice of what Dad was sayin'.\nHe's ill. He dun't know what he's on about!\n@c0@"
  es: "@aBianca@bNo hagas caso a papá.\r\nEstá enfermo. ¡Se le va un poco la cabeza!\n@c0@"
  fr: "@aBianca@bNe fais pas attention à ce qu'a dit papa.\nIl est malade. Il ne sait plus ce qu'il raconteⓠ\n@c0@"
  it: "@aBianca@bNon far caso alle parole di mio padre...\nA volte non sa nemmeno lui quello che dice!\n@c0@"
  ja: "@a@bビアンカ「%a000090　お父さんの\n\t言ったことは　気にしないでね。\n\t病気だから　気弱になってるのよ。\n@c0@"
220:
  de: "@aBianca@bSein Gemüse ist großartig. Er liefert frisch ins Haus, und alles schmeckt immer ganz köstlich!\n@c0@"
  en: "@aBianca@bThat bloke's veggies taste amazin'. We have him deliver 'em to our place, and they're great!\n@c0@"
  es: "@aBianca@bLas verduras de ese tipo son estupendas. ¡Nos las trae a casa y están buenísimas!\n@c0@"
  fr: "@aBianca@bLes légumes de ce type ont un goût incroyable.\nNous les lui faisons livrer à la maison, et ils sont\ntout simplement délicieuxⓠ\n@c0@"
  it: "@aBianca@bQuel contadino coltiva delle verdure favolose!\nDovresti assaggiarle, sai? Sono una vera delizia.\n@c0@"
  ja: "@a@bビアンカ「さっきの人が　作った\n\t野菜は　とってもおいしいの。\n\tうちにも　届けてもらってるのよ。\n@c0@"
221:
  de: "@aBianca@bAuch wenn er sich noch so sehr beklagt ⓚⓛ was sein Sohn tut, ist wahrscheinlich eine große Hilfe.\n@c0@"
  en: "@aBianca@bThat bloke may moan, but what his son's doin' is probably a big help.\n@c0@"
  es: "@aBianca@bEl tipo se queja, pero lo que hace su hijo es de gran ayuda, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe type a beau râler, ce que fait son fils est sûrement très utile.\n@c0@"
  it: "@aBianca@bNon capisco perché quell'uomo si lamenti tanto!\nSuo figlio ha deciso di intraprendere la via della fede, mica quella del crimine!\n@c0@"
  ja: "@a@bビアンカ「おじさんは\n\tああ言ってるけど　息子さんの\n\tおかげで　助かってるのよね。\n@c0@"
222:
  de: "@aBianca@bEs ist die Aufgabe von uns Utensielern, die Schleuse zu bemannen und zu warten.\n@c0@"
  en: "@aBianca@bIt's up to us folk of Stockenbarrel to man the lock and keep it maintained.\n@c0@"
  es: "@aBianca@bSomos los de Clavis los que nos encargamos de mantener la barrera.\n@c0@"
  fr: "@aBianca@bC'est à nous, habitants de Saint Éloi, d'actionner\r\net d'entretenir l'écluse.\n@c0@"
  it: "@aBianca@bGli abitanti di Aprianuam sorvegliano la Chiusa e provvedono alla sua manutenzione.\n@c0@"
  ja: "@a@bビアンカ「水門を管理するのが\n\t私たち村人の仕事だけど……\n@c0@"
223:
  de: "@aBianca@bIch glaube, es gab nicht viele Leute, die sie sich haben öffnen lassen, um zum See zu fahren.\n@c0@"
  en: "@aBianca@bI dun't think there's many folk who've had\r\nit opened for 'em and bin up to that lake\r\nhe was on about.\n@c0@"
  es: "@aBianca@bNo creo que se la hayamos abierto a muchos para llegar al lago del que hablaba, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne crois pas qu'il y ait beaucoup de monde qui\r\nait demandé à ce qu'elle soit ouverte pour atteindre le lac dont il parle.\n@c0@"
  it: "@aBianca@bLa Chiusa viene sbloccata solo di rado.\r\nNon credo siano molte le persone che hanno visitato il lago di cui parlava quell'uomo...\n@c0@"
  ja: "@a@bビアンカ「水門をあけて\n\t湖にまで出た人は　ほとんど\n\tいないと思うわ。\n@c0@"
224:
  de: "@aBianca@bDiese Katze ist nicht direkt unser Haustier, aber es gefällt ihr anscheinend, sich bei uns herumzutreiben.\n@c0@"
  en: "@aBianca@bThat cat's not exactly a pet of ours, but it seems to like hangin' around our place all the time.\n@c0@"
  es: "@aBianca@bNo es que el gato sea nuestra mascota, pero se pasa el día por nuestra casa.\n@c0@"
  fr: "@aBianca@bCe chat n'est pas vraiment à nous, mais il a l'air d'aimer traîner autour de la maison.\n@c0@"
  it: "@aBianca@bQuel gatto non è mio, ma ama gironzolare intorno a casa nostra.\n@c0@"
  ja: "@a@bビアンカ「あのネコは　うちで\n\t飼ってるわけじゃないんだけど\n\tすっかり　居ついちゃってるの。\n@c0@"
225:
  de: "@aBianca@bDa fällt mir ein ⓚⓛ wie es wohl %a001210 ergangen ist?\n@c0@"
  en: "@aBianca@bCome to think of it, I wonder how %a001210's gettin' along.\n@c0@"
  es: "@aBianca@bAhora que lo pienso, me pregunto cómo le irá a %a001210, ¿sabes?\n@c0@"
  fr: "@aBianca@bMaintenant que j'y pense, je me demande comment va %a001210.\n@c0@"
  it: "@aBianca@bA proposito di felini!\nChissà come sta %a001210...\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a001210ちゃんは\n\tどうしているかしら……。\n@c0@"
226:
  de: "@aBianca@bHach, ist der Alte nicht sympathisch? Er hat wirklich ein Herz aus Gold.\n@c0@"
  en: "@aBianca@bI'm sure he means well deep down, but I wish he wouldn't call me ⓗdarlin'ⓘ.\n@c0@"
  es: "@aBianca@bTiene unas ideas de lo más curiosas este vejete, ¿eh?\n@c0@"
  fr: "@aBianca@bCe vieux monsieur est adorable avec moi.\r\nIl nous a pris sous son aile dès notre arrivée.\n@c0@"
  it: "@aBianca@bA sentirlo parlare sembra un villanzone, ma in realtà è una brava persona...\n@c0@"
  ja: "@a@bビアンカ「あの　おじいさん\n\tふだんは　エッチなこと言ってるけど\n\t根は　純情なのよね。\n@c0@"
227:
  de: "@aBianca@bSo eine Frechheit! Also, ein bisschen höflicher könnten die Leute schon sein! Ich hab gute Lust, der Dame den Kopf zu waschen!\n@c0@"
  en: "@aBianca@bJust because it's a mixed bath, it dun't mean people shouldn't observe some kind of limits!\n@c0@"
  es: "@aBianca@b¡Que sea un baño público no significa que la gente no tenga que comportarse, digo yo!\n@c0@"
  fr: "@aBianca@bQuelle amabilitéⓠ\nMais bon, c'est vrai que ce n'est pas très agréable d'être dérangée quand on se relaxe.\n@c0@"
  it: "@aBianca@bA queste terme possono accedere sia donne sia uomini, quindi si dovrebbe tenere un comportamento rispettoso e corretto. Purtroppo, non tutti lo fanno...\n@c0@"
  ja: "@a@bビアンカ「い　いくら　混浴だからって\n\tわざわざ近づいて　話しかけないの！\n@c0@"
228:
  de: "@aBianca@bWas meinst du, %a000090? Findest du auch, dass meine Haut samtig weich ist?\n@c0@"
  en: "@aBianca@bWhat d'you reckon, %a000090?\nD'you think my skin's lovely?\n@c0@"
  es: "@aBianca@b¿Qué opinas, %a000090?\n¿Te gusta mi piel?\n@c0@"
  fr: "@aBianca@bQu'en dis-tu, %a000090ⓡ\nTu trouves que ma peau est belleⓡ\n@c0@"
  it: "@aBianca@bChe ne dici, %a000090?\nCredi che io abbia una bella pelle?\n@c0@"
  ja: "@a@bビアンカ「%a000090も\n\t私の肌　キレイだと思う？\n@c0@"
229:
  de: "@aBianca@bHa ha! Danke! Das liegt bestimmt nur daran, dass ich seit ⓚⓛ ach, weiß die Göttin, wie lange ⓚⓛ täglich baden gehe.\n@c0@"
  en: "@aBianca@bHa ha! Thanks! I reckon it's all down to havin' one of these baths every day for the last Goddess knows how long.\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Gracias! Creo que es por darme un baño de esos todos los días durante la Diosa sabe cuánto tiempo, ¿sabes?\n@c0@"
  fr: "@aBianca@bHa haⓠ Merciⓠ Je suis sûre que c'est parce que je viens me baigner ici tous les jours depuis... ouh,\nseule la Déesse sait depuis quand.\n@c0@"
  it: "@aBianca@bChe gentile che sei! Grazie!\nSai, credo che sia merito dei bagni termali che faccio ogni giorno.\n@c0@"
  ja: "@a@bビアンカ「うふふ　ありがとう。\n\tきっと　ここの温泉に\n\t毎日　入っていたからね。\n@c0@"
230:
  de: "@aBianca@bTja, wo du recht hast... Ich bin schließlich ziemlich sonnenverbrannt. Und dann all die Schnitte und Kratzer. Ganz zu schweigen von den blauen Flecken...\n@c0@"
  en: "@aBianca@bFair enough. I am a bit sunburnt, after all. And then there's all the cuts and grazes. Not to mention the odd bruise or two...\n@c0@"
  es: "@aBianca@bYa, bueno. Me ha dado demasiado el sol. Y los cortes y los rasguños, además. Por no hablar de los moratones...\n@c0@"
  fr: "@aBianca@bAdmettons. Après tout, je suis un peu marquée par le soleil. Et puis j'ai quelques coupures et des écorchures. Sans parler d'un ou deux bleus...\n@c0@"
  it: "@aBianca@bBrutto cafone che non sei altro!\nMa ti costava tanto dirmi una piccola bugia, eh?!\n@c0@"
  ja: "@a@bビアンカ「そうよね…。\n\t日焼けはしてるし　すり傷やきり傷が\n\tいっぱいあるしね。\n@c0@"
231:
  de: "@aBianca@bOh! Na, nun sieh mal an, wer da plötzlich so erwachsen geworden ist!\n@c0@"
  en: "@aBianca@bHuh! Look who's all grown up all of a sudden!\n@c0@"
  es: "@aBianca@b¡Oh! ¡Pero mira qué grande se ha puesto!\n@c0@"
  fr: "@aBianca@bTsssⓠ Un adulte aussi puéril, franchement...\n@c0@"
  it: "@aBianca@bHa proprio ragione, %a000090.\nQuesto posto è un piccolo paradiso...\n@c0@"
  ja: "@a@bビアンカ「はぁ……\n\t%a000090も　大人になったのね…。\n@c0@"
232:
  de: "@aBianca@bWir sind hierher nach Utensiel gezogen, weil wir dachten, die Bäder würden meinem Vater guttun.\n@c0@"
  en: "@aBianca@bWe moved here to Stockenbarrel because we thought the bath water might do Dad some good.\n@c0@"
  es: "@aBianca@bVinimos a Clavis porque pensamos que los baños le vendrían bien a papá.\n@c0@"
  fr: "@aBianca@bNous avons déménagé ici, à Saint Éloi, car nous pensions que l'eau thermale ferait du bien à papa.\n@c0@"
  it: "@aBianca@bDecidemmo di trasferirci ad Aprianuam perché speravamo che le acque termali potessero giovare alla salute di mio padre...\n@c0@"
  ja: "@a@bビアンカ「ここの温泉が\n\tお父さんの身体に　いいと聞いて\n\tこの村に　引っ越してきたのよ。\n@c0@"
233:
  de: "@aBianca@bIch wäre ja lieber in Wittenhausen geblieben. Dann hätte ich es früher erfahren, wenn du heil und wohlbehalten nach Hause zurückgekehrt wärst.\n@c0@"
  en: "@aBianca@bIn an ideal world, I'd have preferred to stay in Roundbeck so I'd know sooner when you were back safe and sound.\n@c0@"
  es: "@aBianca@bYo hubiera preferido quedarme en Golfo Blanco... Así me hubiera enterado antes de que habías vuelto sano y salvo, ¿sabes?\n@c0@"
  fr: "@aBianca@bDans un monde idéal, j'aurais préféré rester à Blanchecombe. J'aurais su plus tôt que tu étais de retour sain et sauf.\n@c0@"
  it: "@aBianca@bA me, però, sarebbe piaciuto restare a Blankenburg, così avrei saputo prima del tuo ritorno... Ah, non importa. Ormai è inutile parlare di queste cose...\n@c0@"
  ja: "@a@bビアンカ「ホントは　アルカパで\n\t%a000090が　ぶじに　帰ってくるのを\n\t待っていたかったんだけどね。\n@c0@"
234:
  de: "@aBianca@bHa ha! Wo sie recht hat, hat sie recht!\n@c0@"
  en: "@aBianca@bHa ha! She certainly tells it like it is!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Llama al pan pan y al vino vino!\n@c0@"
  fr: "@aBianca@bHa haⓠ On peut dire qu'elle est directeⓠ\n@c0@"
  it: "@aBianca@bMadre natura non l'avrà fatta bella, ma almeno le ha dato il dono della simpatia!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tあのお客さんったら\n\tおせじが　上手よね。\n@c0@"
235:
  de: "@aBianca@bIch habe mich in Wittenhausen wirklich wohlgefühlt, aber hier ist es auch nicht schlecht. Ein bisschen ruhig, vielleicht.\n@c0@"
  en: "@aBianca@bI really liked it back in Roundbeck, but this place en't bad neither. Can be a bit quiet, mind.\n@c0@"
  es: "@aBianca@bMe gustaba bastante Golfo Blanco, pero esto tampoco está mal. Aunque lo veo demasiado tranquilo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'aimais beaucoup Blanchecombe, mais cet endroit n'est pas mal non plus. Même si c'est parfois un peu trop tranquille.\n@c0@"
  it: "@aBianca@bMi piaceva stare a Blankenburg, ma questo posto non è affatto male. Se solo fosse un po' più movimentato, sarebbe perfetto.\n@c0@"
  ja: "@a@bビアンカ「アルカパも　好きだったけど\n\tここも　けっこう　気に入ってるの。\n\tちょっと　静かすぎるけどね。\n@c0@"
236:
  de: "@aBianca@bAch ja. Ein paar Leute aus dem Dorf hatten sich vor einer Weile auch dieser Religion angeschlossen. Was wohl aus ihnen geworden ist?\n@c0@"
  en: "@aBianca@bOh yeah. I remember one of the villagers headin' off to join up with that religion a while back.\r\nI wonder how they're gettin' on.\n@c0@"
  es: "@aBianca@b¡Ah!, sí. Recuerdo que hace poco uno se largó a unirse a la religión esa.\r\nNo sé cómo le irá.\n@c0@"
  fr: "@aBianca@bOh oui. Je me souviens qu'un des villageois est parti rejoindre les adeptes de cette religion il y a un bon moment déjà. Je me demande où il en est.\n@c0@"
  it: "@aBianca@bSì, ne ho sentito parlare. Credo che anche un abitante del villaggio sia partito per unirsi a quella setta. Chissà come se la passa adesso...\n@c0@"
  ja: "@a@bビアンカ「そういえば　この村からも\n\t教団に入るって　旅立った人がいたわ。\n\t今ごろ　どうしてるかな？\n@c0@"
237:
  de: "@aBianca@bEs ist ein bisschen lästig, an der Schänke vorbeilaufen zu müssen, wenn man ins Bad will.\n@c0@"
  en: "@aBianca@bIt's a bit of a pain havin' to traipse past the inn to get to the baths.\n@c0@"
  es: "@aBianca@bEs un peñazo tener que pasar por la posada para ir a los baños, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un peu ennuyeux d'avoir à passer par l'auberge pour rejoindre les bains.\n@c0@"
  it: "@aBianca@bPer accedere ai bagni termali si deve necessariamente passare dalla locanda.\n@c0@"
  ja: "@a@bビアンカ「温泉に入るのに　いちいち\n\t宿屋を通らないと　いけないのが\n\tちょっと　めんどうだけど……\n@c0@"
238:
  de: "@aBianca@bAber die Inhaber der Schänke kümmern sich um die Bäder, also kann man eigentlich nicht meckern.\n@c0@"
  en: "@aBianca@bBut they're the ones takin' care of them, so I s'pose it's fair enough.\n@c0@"
  es: "@aBianca@bPero ellos son los que lo gestionan, así que qué se le va a hacer.\n@c0@"
  fr: "@aBianca@bMais comme ce sont eux qui les entretiennent,\r\nc'est un peu normal.\n@c0@"
  it: "@aBianca@bSecondo me, dovrebbero creare un ingresso indipendente...\n@c0@"
  ja: "@a@bビアンカ「温泉の管理をしてるのが\n\t宿屋さんだから　しかたないよね。\n@c0@"
239:
  de: "@aBianca@bIch glaube, so glücklich war ich schon lange nicht mehr. Du bist wieder da und meinem Vater scheint es auch besser zu gehen. Alles ist gut!\n@c0@"
  en: "@aBianca@bI dun't think I've bin this happy in a long time. You're back on the scene and Dad seems to be gettin' better. It's all good!\n@c0@"
  es: "@aBianca@bHacía mucho que no era tan feliz. Tú has vuelto y papá parece estar mejor. ¡Todo va estupendamente!\n@c0@"
  fr: "@aBianca@bJe crois que ça faisait longtemps que je n'avais pas été aussi heureuse. Tu réapparais et papa semble aller mieux. Tout va très bienⓠ\n@c0@"
  it: "@aBianca@bEra da tempo che non ero così felice...\nTu sei tornato, e mio padre si sente meglio.\nLa vita è bella!\n@c0@"
  ja: "@a@bビアンカ「私は　幸せだよ。\n\tこうして　%a000090とも　会えたし\n\tお父さんも　良くなってきてるしね。\n@c0@"
240:
  de: "@aBianca@bTagsüber in die Schänke zu gehen ist irgendwie was Besonderes. Da scheint es immer ruhiger zu sein als überall sonst, findest du nicht?\n@c0@"
  en: "@aBianca@bThere's somethin' about goin' into a pub durin' the day. It always seems quieter than everywhere else, dun't you think?\n@c0@"
  es: "@aBianca@bEs raro entrar de día en una taberna. Hay un silencio como muy especial, ¿no crees?\n@c0@"
  fr: "@aBianca@bC'est toujours un peu particulier d'aller dans une taverne en journée.\n㈡\nÇa semble beaucoup plus tranquille que n'importe\nquel autre endroit, tu ne trouves pasⓡ\n@c0@"
  it: "@aBianca@bBeh, certo... Di giorno la gente lavora o fa il bagno alle terme. Anche se la taverna fosse aperta, dubito che avrebbe molti clienti...\n@c0@"
  ja: "@a@bビアンカ「昼間の　酒場って\n\t他の場所より　ずっと静かに\n\t感じない？　ふしぎよね。\n@c0@"
241:
  de: "@aBianca@bDas Paradies des Weißen Königs? Das hört sich merkwürdig an. Bei solchem Gerede läuft es mir immer kalt den Rücken runter.\n@c0@"
  en: "@aBianca@bThe White King's Paradise? That sounds a bit serious. This kind of talk really gives me the willies for some reason.\n@c0@"
  es: "@aBianca@b¿El Paraíso del Rey Blanco? Suena grave. No sé por qué, pero estas cosas me dan susto, ¿sabes?\n@c0@"
  fr: "@aBianca@bLe Paradis du Roi blancⓡ Ça a l'air sérieux.\nCe genre de discours me donne toujours la\nchair de poule sans que je sache pourquoi.\n@c0@"
  it: "@aBianca@bⓕIl Paradiso del Re Biancoⓖ?!\nMa senti che razza di nome! Non so perché, ma solo a pronunciarlo mi vengono i brividi...\n@c0@"
  ja: "@a@bビアンカ「光の国なんて……。\n\tこういう話を聞くと　なんだか\n\tこわくなるの。　どうしてかしら…？\n@c0@"
242:
  de: "@aBianca@bDas Blitzende Badesalz, das er meinte, sind die Kristallablagerungen im Badewasser. Es ist alles ganz natürlich, und es gibt nicht allzu viel davon.\n@c0@"
  en: "@aBianca@bThat scintillating sinter he was on about is the crystal deposits left behind in the bath water. It's all natural stuff, and there's not a lot of it.\n@c0@"
  es: "@aBianca@bEsas sales destellantes de las que hablaba son los depósitos de cristales que quedan en los baños. Es un recurso natural, y no hay muchas.\n@c0@"
  fr: "@aBianca@bLes sels scintillants dont il parlait sont les dépôts cristallisés qui restent dans l'eau des bains. Ce sont des sels naturels et il n'y en a pas beaucoup.\n@c0@"
  it: "@aBianca@bI sali da bagno scintillanti di cui parla sono i depositi naturali lasciati dalle acque termali.\nSono molto pregiati, e non è facile procurarsene.\n@c0@"
  ja: "@a@bビアンカ「秘湯の花っていうのは\n\t温泉の結晶なの。　天然のものだから\n\tすこししか　とれないんだけど……。\n@c0@"
243:
  de: "@aBianca@bDafür ist Utensiel weithin bekannt.\n@c0@"
  en: "@aBianca@bIt's the most famous thing about Stockenbarrel by far.\n@c0@"
  es: "@aBianca@bEs de lejos lo que da más fama a Clavis, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est de loin la spécialité la plus connue de Saint Éloi.\n@c0@"
  it: "@aBianca@bSono senz'altro il prodotto tipico più famoso di Aprianuam.\n@c0@"
  ja: "@a@bビアンカ「この村で　ゆいいつ　名産と\n\tよべるものかも知れないわね。\n@c0@"
244:
  de: "@aBianca@bIch wollte mich eigentlich um alles selbst kümmern, aber der Mann sagte, Zimmermannsarbeiten seien zu gefährlich, als dass ich sie allein ausführen könnte.\n@c0@"
  en: "@aBianca@bI had intended to take care of everythin' myself, but that bloke said carpenteerin' is too dangerous for me alone.\n@c0@"
  es: "@aBianca@bYo quería ocuparme de todo sola, pero el tipo ese dijo que la carpintería era demasiado peligrosa.\n@c0@"
  fr: "@aBianca@bJ'avais l'intention de m'occuper de tout moi-même, mais ce type m'a dit que jouer les charpentiers\r\ntoute seule était beaucoup trop dangereux.\n@c0@"
  it: "@aBianca@bQuando ci trasferimmo qui, quel tipo e un suo amico mi aiutarono a costruirmi la casa.\n㈡\nIo avrei fatto tutto da me, ma loro dissero che non era un lavoro che una ragazza avrebbe potuto svolgere da sola.\n@c0@"
  ja: "@a@bビアンカ「私　ひとりで　なんでも\n\tやるつもりだったんだけど　あの人\n\t大工仕事は　あぶない！　…って。\n@c0@"
245:
  de: "@aBianca@bAlso haben wir vereinbart, dass er jeden Tag vorbeikommt und mir etwas zur Hand geht. Aber er macht sich immer Sorgen.\n@c0@"
  en: "@aBianca@bSo we came to an arrangement where he'd\r\ncome and help me out each day. He's a \r\nbit of a worrier, mind!\n@c0@"
  es: "@aBianca@bAsí que llegamos al acuerdo de que él vendría a ayudarme todos los días. ¡Cuánta preocupación!\n@c0@"
  fr: "@aBianca@bAlors nous avons conclu un accord pour qu'il vienne m'aider tous les jours. Il est anxieux par nature, comme tu l'auras constaté.\n@c0@"
  it: "@aBianca@bCosì mi hanno aiutato a tirarla su.\nDevo riconoscere che sono muratori in gamba, anche se dovrebbero rivedere le loro idee sulle donne!\n@c0@"
  ja: "@a@bビアンカ「それで　毎日\n\t手伝ってくれるようになったの。\n\t心配性な人だよね。\n@c0@"
246:
  de: "@aBianca@bEs ist die Aufgabe von uns Utensielern, die Schleuse zu bemannen und zu warten.\n@c0@"
  en: "@aBianca@bIt's up to us folk of Stockenbarrel to man the lock and keep it maintained.\n@c0@"
  es: "@aBianca@bSomos los de Clavis los que nos encargamos de mantener la barrera.\n@c0@"
  fr: "@aBianca@bC'est à nous, habitants de Saint Éloi, d'actionner\r\net d'entretenir l'écluse.\n@c0@"
  it: "@aBianca@bGli abitanti di Aprianuam sorvegliano la Chiusa e provvedono alla sua manutenzione.\n@c0@"
  ja: "@a@bビアンカ「水門を管理するのが\n\t私たち村人の仕事だけど……\n@c0@"
247:
  de: "@aBianca@bIch glaube, es gab nicht viele Leute, die sie sich haben öffnen lassen, um zum See zu fahren.\n@c0@"
  en: "@aBianca@bI dun't think there's many folk who've had\r\nit opened for 'em and bin up to that lake\r\nhe was on about.\n@c0@"
  es: "@aBianca@bNo creo que se la hayamos abierto a muchos para llegar al lago del que hablaba, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne crois pas qu'il y ait beaucoup de monde qui\r\nait demandé à ce qu'elle soit ouverte pour atteindre le lac dont il parle.\n@c0@"
  it: "@aBianca@bLa Chiusa viene sbloccata solo di rado.\r\nNon credo siano molte le persone che hanno visitato il lago di cui parlava quell'uomo...\n@c0@"
  ja: "@a@bビアンカ「水門をあけて\n\t湖にまで出た人は　ほとんど\n\tいないと思うわ。\n@c0@"
248:
  de: "@aBianca@bWenn er nicht da wäre, hätten wir das ganze Bad für uns, nicht? Ha ha! Keine Sorge! Ich mache nur Witze.\n@c0@"
  en: "@aBianca@bIf only he wasn't here, we'd have the whole\r\nbath to ourselves, eh? Ha ha! Don't worry,\r\nI'm only jokin'!\n@c0@"
  es: "@aBianca@bSi no estuviera aquí tendríamos el baño para nosotros solitos, ¿eh? ¡Ja, ja! ¡No te preocupes, era broma!\n@c0@"
  fr: "@aBianca@bSi seulement il n'était pas là, nous aurions les bains pour nous tous seuls, heinⓡ Ha haⓠ\nNe t'inquiète pas, je plaisanteⓠ\n@c0@"
  it: "@aBianca@bSe non ci fosse lui, potremmo fare il bagno da soli...\nTu, io e nessun altro. Che fai, %a000090?\nSei impallidito? Stavo solo scherzando! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「あの人が　いなかったら\n\tふたりっきりで　入れたのにね。\n\tうふふ…　じょうだんよ！\n@c0@"
249:
  de: "@aBianca@bEine Höhle... Ob da drin wohl dein Ring versteckt ist, %a000090?\n@c0@"
  en: "@aBianca@bA cave... I wonder if that's where your ring's hidden, %a000090.\n@c0@"
  es: "@aBianca@bUna cueva... ¿Estará ahí oculto tu anillo, %a000090?\n@c0@"
  fr: "@aBianca@bUne grotte... Je me demande si c'est là que ton anneau est caché, %a000090.\n@c0@"
  it: "@aBianca@bUna caverna, eh?\nChissà, forse il tuo anello è nascosto lì, %a000090...\n@c0@"
  ja: "@a@bビアンカ「洞くつか……\n\t%a000090のさがし物は\n\tそこにあるのかも　知れないわね。\n@c0@"
250:
  de: "@aBianca@bDa drin war wirklich ein Schatz zu entdecken, nicht? Immerhin der Schlüssel zum Glück!\n@c0@"
  en: "@aBianca@bThere certainly was a treasure in there, eh!\r\nThe key to your happiness, no less!\n@c0@"
  es: "@aBianca@bVaya si había un tesoro ahí dentro, ¿eh?\r\n¡La llave de tu felicidad, nada menos!\n@c0@"
  fr: "@aBianca@bEt comment qu'il y avait un trésor, là-dedans, heinⓠ La clef de ton bonheur, rien que çaⓠ\n@c0@"
  it: "@aBianca@bIl tesoro c'era davvero!\nLa chiave per la tua felicità, %a000090!\n@c0@"
  ja: "@a@bビアンカ「宝物　あったね…。\n\tこれで　%a000090も\n\t本当の幸せを　つかめるね。\n@c0@"
251:
  de: "@aBianca@bHa ha! Jetzt willst du schon wieder mit den Leuten reden, während sie schlafen! Du bist manchmal wirklich lustig, %a000090.\n@c0@"
  en: "@aBianca@bHa ha! There you go again, tryin' to speak to folk when they're sleepin'! You're a funny one sometimes, %a000090.\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Que no puedes hablar con la gente cuando está durmiendo! A veces eres muy gracioso, %a000090.\n@c0@"
  fr: "@aBianca@bHa haⓠ Et c'est reparti. Tu essaies encore de parler aux gens pendant qu'ils dormentⓠ Tu es un drôle de larron, parfois, %a000090.\n@c0@"
  it: "@aBianca@bDimmi una cosa, %a000090...\nPerché ce l'hai con le persone che dormono?\nPerché non le lasci riposare in pace, eh?\n@c0@"
  ja: "@a@bビアンカ「うふふ。　あいかわらず\n\t寝てる人にも　話しかけるんだもん。\n\t%a000090ったら　変わってないね。\n@c0@"
252:
  de: "@aBianca@bDiese Frau bleibt bis tief in die Nacht auf, bis ihr Mann nach Hause kommt.\n@c0@"
  en: "@aBianca@bThat woman always stays up into the night until her old man comes home.\n@c0@"
  es: "@aBianca@bEsa mujer siempre se queda despierta hasta que su marido vuelve a casa.\n@c0@"
  fr: "@aBianca@bLa nuit, cette femme ne va jamais se coucher avant que son mari soit revenu.\n@c0@"
  it: "@aBianca@bQuella donna resta sempre sveglia fino a tardi, in attesa che suo marito rientri a casa.\n@c0@"
  ja: "@a@bビアンカ「あのおばさん\n\tダンナさんが　帰ってくるまで\n\tいつも　起きて待ってるのよ。\n@c0@"
253:
  de: "@aBianca@bSie macht einen richtigen Aufstand und nörgelt, wenn er spät kommt, aber ich glaube, sie macht sich einfach nur Sorgen, wenn er nicht da ist.\n@c0@"
  en: "@aBianca@bShe makes all this fuss and moans about him\r\nbein' late, but I think she's just anxious\r\nwhen he's not around.\n@c0@"
  es: "@aBianca@bNo deja de protestar por la hora a la que llega, pero creo que se inquieta cuando él no está, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle fait toujours des histoires et se plaint qu'il rentre tard, mais je crois qu'elle est seulement inquiète quand il n'est pas là.\n@c0@"
  it: "@aBianca@bNon fa altro che lamentarsi perché il suo uomo trascorre tutte le serate fuori. Secondo me, ha ragione: al posto suo, gli avrei già dato il benservito!\n@c0@"
  ja: "@a@bビアンカ「なんだかんだ　言っても\n\tダンナさんが　心配なのね。\n@c0@"
254:
  de: "@aBianca@bEs gibt keine anderen Mädchen in meinem Alter im Dorf. Ich hoffe, sie bleibt eine Weile hier.\n@c0@"
  en: "@aBianca@bThere en't any other girls of my age here in the village. I hope this one hangs around for a while.\n@c0@"
  es: "@aBianca@bEn el pueblo no había otras chicas de mi edad. Espero que esta se quede por aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl n'y a aucune autre fille de mon âge, ici, au village. J'espère que celle-ci restera un peu.\n@c0@"
  it: "@aBianca@bQui al villaggio ci sono poche ragazze della mia età.\nSpero che lei decida di restare da queste parti, così non mi sentirò troppo sola...\n@c0@"
  ja: "@a@bビアンカ「同じ年頃の　女の子って\n\tこの村には　いないから…。\n\tゆっくりしていってくれると　いいな。\n@c0@"
255:
  de: "@aBianca@bEs ist schon länger her, dass junge Leute kamen, um die Bäder zu benutzen. Meist kommen ältere Leute, die hier ihre Leiden kurieren wollen.\n@c0@"
  en: "@aBianca@bIt's bin a while since any young folk came here to visit the baths. It's mostly old people comin' to fix their ailments.\n@c0@"
  es: "@aBianca@bHace la tira que no aparecen jóvenes por los baños. Casi todo son viejos que vienen a tratarse los achaques, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa faisait bien longtemps qu'aucun jeune n'était venu visiter les bains. Ce sont surtout des gens âgés qui viennent soigner leurs maux.\n@c0@"
  it: "@aBianca@bLe terme sono poco frequentate dai giovani.\nLa maggior parte dei clienti è composta da anziani che vengono a curarsi gli acciacchi.\n@c0@"
  ja: "@a@bビアンカ「若い人が　温泉に\n\t入りにきてくれたのって　久しぶり。\n\tいつもは　お年寄りばっかりなのよ。\n@c0@"
256:
  de: "@aBianca@bAch ja. Vor einer Weile haben sich ein paar Leute aus dem Dorf dieser Glaubensgemeinschaft angeschlossen. Was wohl aus ihnen geworden ist?\n@c0@"
  en: "@aBianca@bOh yeah. I remember one of the villagers headin' off to join up with that religion a while back. I hope they're okay.\n@c0@"
  es: "@aBianca@b¡Ah!, sí. Recuerdo que hace poco uno se largó a unirse a la religión esa. Espero que le vaya bien, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh oui. Je me souviens qu'un des villageois est parti rejoindre les adeptes de cette religion il y a un bon moment déjà. J'espère qu'il va bien.\n@c0@"
  it: "@aBianca@bSe non sbaglio, anche un abitante del villaggio è partito per unirsi a quella setta.\r\nSpero che stia bene...\n@c0@"
  ja: "@a@bビアンカ「この村からも　教団に入るって\n\t旅立った人がいるのに……。\n\tその人　大丈夫かしら？\n@c0@"
257:
  de: "@aBianca@bDieser alte Mann setzt sich mit dem, was er sagt, dauernd in die Nesseln. Aber ich bin sicher, dass er es eigentlich gar nicht so böse meint.\n@c0@"
  en: "@aBianca@bThat old man's always comin' out with things a bit over the line. But I'm sure he means well\r\ndeep down.\n@c0@"
  es: "@aBianca@bEse viejo siempre se pasa un poco de la raya, pero seguro que no tiene malas intenciones, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe vieil homme tient toujours des propos un peu tendancieux. Mais je suis sûre qu'au fond, il n'a pas de mauvaises intentions.\n@c0@"
  it: "@aBianca@bSanta dea, cosa devono sopportare le mie orecchie!\nSe quel vecchiaccio avesse sessant'anni di meno, gli striglierei la bocca con il sapone!\n@c0@"
  ja: "@a@bビアンカ「あの　おじいさん\n\tいつもエッチなこと　言ってるけど\n\t根は　純情なんじゃないかしら？\n@c0@"
258:
  de: "@aBianca@bDu hast doch unser Haus gesehen, nicht? Dieser Kerl hatte es im Handumdrehen fertig!\n@c0@"
  en: "@aBianca@bYou've seen my house, right? That bloke had it up in no time!\n@c0@"
  es: "@aBianca@bHas visto mi casa, ¿no? ¡Ese tipo la tuvo lista en un pispás!\n@c0@"
  fr: "@aBianca@bTu as vu ma maison, n'est-ce pasⓡ Ce type l'a construite en un rien de tempsⓠ\n@c0@"
  it: "@aBianca@bHai visto quant'è carina la mia casa?\nBeh, quel tipo e un suo amico l'hanno tirata su in brevissimo tempo!\n@c0@"
  ja: "@a@bビアンカ「私の家　知ってるでしょ？\n\tあの人　あんなに　りっぱな家を\n\tあっという間に　建ててくれたのよ！\n@c0@"
259:
  de: "@aBianca@bDas Handwerkern ist schöner, wenn es jemand anders für einen macht!\n@c0@"
  en: "@aBianca@bSuddenly carpenterin' is more fun than\r\nit sounds!\n@c0@"
  es: "@aBianca@b¡Al final la carpintería va a ser más divertida de lo que parece!\n@c0@"
  fr: "@aBianca@bIl m'a épatéeⓠ\n@c0@"
  it: "@aBianca@bPare che abbiano usato delle tecniche innovative...\nBoh, io non ci capisco nulla. So solo che la casa è solida e bella!\n@c0@"
  ja: "@a@bビアンカ「きっと　急に\n\t大工仕事が　おもしろくなったのね！\n@c0@"
260:
  de: "@aBianca@bMan kann es seiner Frau wohl kaum übelnehmen, wenn sie böse wird. Nach zehn Gläsern ist mit dem sicher nicht mehr viel anzufangen!\n@c0@"
  en: "@aBianca@bYou can hardly blame his missus for bein' angry. He'll be no good to anyone after ten glasses!\n@c0@"
  es: "@aBianca@bNo es de extrañar que su señora esté enfadadísima. ¡Después de diez vasos está para el arrastre!\n@c0@"
  fr: "@aBianca@bDifficile d'en vouloir à sa femme d'être en colère.\nIl ne sera plus bon à rien après dix verresⓠ\n@c0@"
  it: "@aBianca@bIo, invece, non vorrei stare nei panni di sua moglie!\nVoglio dire, dev'essere davvero orribile avere come compagno un uomo che rincasa tanto tardi di sera!\n@c0@"
  ja: "@a@bビアンカ「奥さんが　怒るのも当然よ。\n\t１０ぱいも飲んだら\n\t身体　こわしちゃうわ。\n@c0@"
261:
  de: "@aBianca@bDie schläft nachts immer hier. Was ihr am Haus wohl so gut gefällt, dass sie so gern hier ist?\n@c0@"
  en: "@aBianca@bThat little one's always asleep here of a night. I wonder what it is about our house that it likes so much.\n@c0@"
  es: "@aBianca@bEse pequeñajo siempre duerme aquí. No sé por qué le gustará tanto nuestra casa, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe petit chat vient toujours dormir ici la nuit. Je me demande ce qui lui plaît tant dans notre maison.\n@c0@"
  it: "@aBianca@bQuel gattino dorme sempre vicino casa mia...\nÈ proprio carino, non è vero?\n@c0@"
  ja: "@a@bビアンカ「あの子　夜は\n\tいつも　ここで寝てるの。\n\tそんなに　私の家が好きなのかしら。\n@c0@"
262:
  de: "@aBianca@bKaum zu glauben, dass das jetzt schon über zehn Jahre her ist. Seit damals haben wir beide vieles durchgemacht, was, %a000090?\n@c0@"
  en: "@aBianca@bI can't believe it's bin over ten years.\nAn awful lot's happened to both of us since then, eh, %a000090?\n@c0@"
  es: "@aBianca@bNo pueden haber pasado más de diez años.\nMira que nos han sucedido cosas desde entonces, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bJe n'arrive pas à croire que ça fait plus de dix ans. Il nous est arrivé beaucoup de choses à tous les deux depuis, hein, %a000090ⓡ \n@c0@"
  it: "@aBianca@bNon riesco a credere che siano passati più di dieci anni, %a000090...\nNe sono cambiate di cose da allora, eh?\n@c0@"
  ja: "@a@bビアンカ「あれから　もう１０年以上か…。\n\tその間に　私も%a000090も\n\tいろいろなことがあったね。\n@c0@"
263:
  de: "@aBianca@bWas für eine gewaltige Höhle! Und durch das Licht, das durch die Spalten in den Felsen fällt, ist sie nicht einmal ganz dunkel.\n@c0@"
  en: "@aBianca@bWhat an enormous cave! And it's not even all that dark either, what with the light comin' in through the gaps in the rocks.\n@c0@"
  es: "@aBianca@b¡Qué cueva más enorme! Y con tanta luz que se cuela entre las grietas de las rocas no resulta muy oscura.\n@c0@"
  fr: "@aBianca@bQuelle caverne gigantesqueⓠ Et il n'y fait pas\nsi sombre, finalement, avec la lumière qui filtre\nà travers les trous de la roche.\n@c0@"
  it: "@aBianca@bChe caverna enorme!\nPer fortuna la luce che filtra dalle fenditure delle rocce la illumina un po'...\n@c0@"
  ja: "@a@bビアンカ「こんな　広い空洞があるなんて！\n\t岩のわれ目から　明かりがもれて\n\t暗くないし……。\n@c0@"
264:
  de: "@aBianca@bGanz anders als unser kleines Abenteuer in den Geisterzinnen, nicht? Das war vielleicht eine muffige alte Bude!\n@c0@"
  en: "@aBianca@bQuite a difference to our little adventure at Uptaten Towers, eh? That was a dark old smelly old place if ever there was one!\n@c0@"
  es: "@aBianca@bVaya diferencia con nuestra aventurilla en las Torres Alverres, ¿eh? ¡Eso sí que era un sitio oscuro e infecto!\n@c0@"
  fr: "@aBianca@bÇa fait une vraie différence avec notre petite aventure aux tours Karpattⓠ Difficile de faire plus sombre, vieux et malodorant, comme endroitⓠ\n@c0@"
  it: "@aBianca@bÈ un luogo totalmente diverso dal Palazzo delle Ombre, non credi? Secondo me non esiste al mondo un castello più decrepito e malridotto di quello!\n@c0@"
  ja: "@a@bビアンカ「レヌール城のときの\n\t暗くて　カビくさい場所の冒険とは\n\t大ちがいよね。　うふふ。\n@c0@"
265:
  de: "@aBianca@bDieser Ort ist ein einziges Rätsel. Ich meine, wenn es hier Wege und Treppen gibt, dann muss er doch von Menschen angelegt worden sein.\n@c0@"
  en: "@aBianca@bIt's quite a puzzle really, this place. I mean, the fact that it has paths and stairs probably means the whole thing's man-made.\n@c0@"
  es: "@aBianca@bEste sitio parece un rompecabezas. El que haya caminos y escaleras parece indicar que es obra de alguien, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est une énigme, cet endroit. C'est vrai, le fait qu'on y trouve des sentiers et des escaliers signifie sans doute que tout a été creusé par la main de l'homme.\n@c0@"
  it: "@aBianca@bCi sono scale e sentieri...\nComincio a credere che questo posto sia stato costruito dall'uomo...\n@c0@"
  ja: "@a@bビアンカ「それにしても　ふしぎな場所ね。\n\t道や　階段があるってことは\n\t誰かが　つくった　場所なのかしら。\n@c0@"
266:
  de: "@aBianca@bDu bist ja richtig stark geworden, %a000090! Ich bin wirklich etwas überrascht!\n@c0@"
  en: "@aBianca@bYou've grown up to be pretty strong, %a000090. I must admit, I'm a bit surprised!\n@c0@"
  es: "@aBianca@bTe has hecho muy pero que muy fuerte, %a000090. ¡Debo admitir que estoy sorprendida!\n@c0@"
  fr: "@aBianca@bTu es devenu vraiment fort, %a000090.\nJe dois admettre que je suis un peu surpriseⓠ\n@c0@"
  it: "@aBianca@bSei diventato davvero forte, %a000090.\nNon mi aspettavo che tu fossi tanto in gamba, sai?\n@c0@"
  ja: "@a@bビアンカ「それにしても　%a000090ったら\n\tすごく　たくましくなってるんだもの。\n\tびっくりしちゃった！\n@c0@"
267:
  de: "@aBianca@bDu willst offenbar nicht darüber reden, aber mir ist klar, dass du viel durchgemacht hast, seit wir uns das letzte Mal gesehen haben.\n@c0@"
  en: "@aBianca@bYou dun't seem to want to talk about it much, but I can tell you've bin through an awful lot since we last met.\n@c0@"
  es: "@aBianca@bNo pareces tener ganas de hablar, pero me huelo que las has pasado canutas desde la última vez que nos vimos, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu n'as pas l'air d'avoir très envie d'en parler,\r\nmais je devine que tu as dû traverser beaucoup d'épreuves depuis notre dernière rencontre.\n@c0@"
  it: "@aBianca@bCredo che tu ne abbia passate di tutti i colori dall'ultima volta che c'eravamo visti.\nMa forse non ti va di toccare quest'argomento...\n@c0@"
  ja: "@a@bビアンカ「%a000090は　あんまり\n\t話してくれなかったけど……\n\tいろいろ　苦労したんだね。\n@c0@"
268:
  de: "@aBianca@bIch höre ein lautes Geräusch. Eine Art Brüllen. Wo kommt es nur her? Und was kann das wohl sein?\n@c0@"
  en: "@aBianca@bI can hear a really loud noise comin' from somewhere. Like a roar or somethin'.\r\nI wonder what it is.\n@c0@"
  es: "@aBianca@bOigo un ruido fuerte que sale de algún sitio. Como un rugido o algo.\r\nPero qué será...\n@c0@"
  fr: "@aBianca@bJ'entends un bruit très fort, quelque part. Comme un grondement. Je me demande ce que c'est.\n@c0@"
  it: "@aBianca@bLo senti questo rumore?\nSembra quasi un ruggito...\nDa dove proverrà?\n@c0@"
  ja: "@a@bビアンカ「なんだか　ゴォーー！　って\n\tすごい音が　聞こえるわね。\n\tいったい　なんの音かしら。\n@c0@"
269:
  de: "@aBianca@bIch hätte nie erwartet, dass meine Mutter so früh sterben würde.\n@c0@"
  en: "@aBianca@bI never expected Mum to die so early.\n@c0@"
  es: "@aBianca@bNo esperaba que mamá muriera tan joven.\n@c0@"
  fr: "@aBianca@bJe ne m'attendais pas à ce que maman meure si tôt.\n@c0@"
  it: "@aBianca@bMia madre è morta che era ancora giovane...\n@c0@"
  ja: "@a@bビアンカ「母さんが　あんなに早く\n\t死んじゃうとは　思わなかったな。\n@c0@"
270:
  de: "@aBianca@bDas Leben ist ganz schön unvorhersehbar, nicht, %a000090? Man weiß nie, was im nächsten Moment geschieht.\n@c0@"
  en: "@aBianca@bLife's pretty unpredictable, en't it, %a000090? You never can tell what's 'round the corner.\n@c0@"
  es: "@aBianca@bCómo es la vida, ¿eh, %a000090? Nunca sabes lo que te espera.\n@c0@"
  fr: "@aBianca@bImpossible de savoir ce que la vie nous réserve, n'est-ce pas, %a000090ⓡ On ne sait jamais\nce qui nous attend.\n@c0@"
  it: "@aBianca@bLa vita è imprevedibile, %a000090.\nNon si sa mai cosa ci riservi il domani...\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\t人の未来に　起こることって\n\t分からないことばかりだね。\n@c0@"
271:
  de: "@aBianca@bTja, wir können ja nicht den ganzen Tag hier herumstehen und die Landschaft bewundern. Wir sollten nur aufpassen, damit wir nicht stürzen.\n@c0@"
  en: "@aBianca@bWell, we can't stand here admirin' the scenery all day long. Let's just make sure we don't fall though, eh?\n@c0@"
  es: "@aBianca@bNo podemos quedarnos todo el día admirando el paisaje. Pero habrá que andarse con ojo para no despeñarnos, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bBon, on ne va quand même pas rester toute la journée ici à admirer le paysage. Faisons attention\nà ne pas tomber, surtoutⓠ\n@c0@"
  it: "@aBianca@bNon possiamo certo restare qui impalati ad ammirare il panorama, dico bene? Forza, proseguiamo.\r\nMa stiamo attenti a non cadere...\n@c0@"
  ja: "@a@bビアンカ「さあ　景色に\n\t見とれてばかりも　いられないわ。\n\t落ちないように　気をつけてね。\n@c0@"
272:
  de: "@aBianca@b...\n@c0@"
  en: "@aBianca@b............\n@c0@"
  es: "@aBianca@b...\n@c0@"
  fr: "@aBianca@b............\n@c0@"
  it: "@aBianca@b...\n@c0@"
  ja: "@a@bビアンカ「………………………。\n@c0@"
273:
  de: "@a@bBianca sieht etwas ärgerlich aus.\n@c0@"
  en: "@a@bBianca looks a bit annoyed.\n@c0@"
  es: "@a@bBianca parece un poco enfadada.\n@c0@"
  fr: "@a@bBianca semble un peu contrariée.\n@c0@"
  it: "@a@bBianca sembra un po' seccata.\n@c0@"
  ja: "@a@bビアンカは\nなにやら　ムッとしているらしい……。\n@c0@"
274:
  de: "@aBianca@bNie im Leben werd' ich einem Kerl wie dem den Ring überlassen! Los, komm, wir müssen ihn zuerst finden!\n@c0@"
  en: "@aBianca@bThere's no way I'm goin' to let a lowlife like him find the ring! We'd better hurry up and\r\nget ahead!\n@c0@"
  es: "@aBianca@b¡No pienso permitir que un miserable como ese encuentre el anillo! ¡Corramos para que no se nos adelante!\n@c0@"
  fr: "@aBianca@bIl n'est pas question que je laisse un abruti comme lui trouver l'anneauⓠ On a intérêt à se dépêcher pour prendre de l'avanceⓠ \n@c0@"
  it: "@aBianca@bNon ho la minima intenzione di permettere a quel maleducato di trovare l'anello!\nForza, %a000090! Sbrighiamoci!\n@c0@"
  ja: "@a@bビアンカ「あんな人に　指輪を\n\t見つけられてたまるもんですかっ！\n\tさあ　先を　急ぎましょっ！\n@c0@"
275:
  de: "@aBianca@bMir ist, als würden wir schon seit Ewigkeiten herunterklettern. Viel weiter kann es jetzt doch nicht mehr sein?\n@c0@"
  en: "@aBianca@bIt feels like we've bin climbin' down for ages now. Surely it can't be much further!?\n@c0@"
  es: "@aBianca@bParece que lleváramos años baja que te baja. ¿Quedará mucho, tú?\n@c0@"
  fr: "@aBianca@bJ'ai l'impression que ça fait des heures\nqu'on descend. Il ne doit plus être très\nloin maintenant, nonⓡⓐ\n@c0@"
  it: "@aBianca@bMi sembra che stiamo scendendo da un secolo!\nOrmai non dovrebbe mancare molto...\n@c0@"
  ja: "@a@bビアンカ「それにしても　けっこう\n\t階段を　おりたような気がするけど…\n\tまだ　先は長いのかしら？\n@c0@"
276:
  de: "@aBianca@bEs muss noch einen anderen Ort wie diesen geben, den wir übersehen haben.\n@c0@"
  en: "@aBianca@bThere must be another place like this we've overlooked.\n@c0@"
  es: "@aBianca@bDebemos de haber pasado por alto otro sitio como este, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl doit y avoir un autre endroit comme celui-ci\r\nqu'on n'a pas vu.\n@c0@"
  it: "@aBianca@bDev'esserci un altro luogo simile a questo che non abbiamo preso in considerazione.\n@c0@"
  ja: "@a@bビアンカ「ほかに　それらしい場所って\n\tあったかしら……？\n@c0@"
277:
  de: "@aBianca@bJetzt haben wir alles abgesucht, aber irgendwas müssen wir auf dem Weg übersehen haben.\n@c0@"
  en: "@aBianca@bWe've looked all over the place, but I suppose we must've missed somethin' along the way.\n@c0@"
  es: "@aBianca@bHemos mirado por todas partes, pero algo se nos ha debido de escapar, ¿sabes?\n@c0@"
  fr: "@aBianca@bNous avons regardé partout, mais nous avons forcément dû rater quelque chose.\n@c0@"
  it: "@aBianca@bCredevo che avessimo controllato ovunque, ma evidentemente abbiamo tralasciato qualche posto...\n@c0@"
  ja: "@a@bビアンカ「いろんなところを\n\tさがしたつもりだったけど　まだ\n\t見落とした場所が　あったのね。\n@c0@"
278:
  de: "@aBianca@bWir sollten besser noch einmal nachsehen, aber diesmal etwas sorgfältiger.\n@c0@"
  en: "@aBianca@bWe'd better try lookin' again a bit more carefully this time.\n@c0@"
  es: "@aBianca@bMiremos otra vez con más atención.\n@c0@"
  fr: "@aBianca@bOn ferait mieux d'essayer de chercher un peu\r\nplus attentivement, cette fois.\n@c0@"
  it: "@aBianca@bRimettiamoci all'opera, %a000090.\nE questa volta mettiamoci più attenzione.\n@c0@"
  ja: "@a@bビアンカ「気をつけて\n\tゆっくり　見てまわりましょう。\n@c0@"
279:
  de: "@aBianca@bDann wirst du wohl zu einem ⓞMostroferratanerⓟ oder wie die sich nennen, wenn du heiratest, nicht wahr, %a000090?\n@c0@"
  en: "@aBianca@bI suppose you'll become a ⓗMostroferratianⓘ or whatever once you get married, eh, %a000090?\n@c0@"
  es: "@aBianca@bCuando te cases te convertirás en un ⓕmostroferratinoⓖ o como se diga, ¿no, %a000090?\n@c0@"
  fr: "@aBianca@bJe suppose qu'une fois marié, tu deviendras un ⓥMostroferratienⓦ ou quelque chose comme ça,\nhein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bQuando ti sposerai diventerai un... ⓕMostroferratianoⓖ?\nSi chiamano così gli abitanti di Mostroferrato?\n@c0@"
  ja: "@a@bビアンカ「%a000090は　結婚したら\n\tこの町の人に　なるのね。\n@c0@"
280:
  de: "@aBianca@bBeinahe wären wir auch mal hierher gezogen, weißt du.\n@c0@"
  en: "@aBianca@bThere was a chance we might've come to live here once, y'know.\n@c0@"
  es: "@aBianca@bUna vez estuvimos a esto de venir a vivir aquí.\n@c0@"
  fr: "@aBianca@bÀ une époque, on a failli venir vivre ici, tu sais.\n@c0@"
  it: "@aBianca@bTempo fa, la mia famiglia pensò di trasferirsi qui...\n@c0@"
  ja: "@a@bビアンカ「私たち家族は\n\tこの町に　住んでたかも\n\t知れなかったのよ。\n@c0@"
281:
  de: "@aBianca@bEs ist nicht weit von den Bädern von Utensiel, und man kann hier prima einkaufen gehen.\n@c0@"
  en: "@aBianca@bIt's not far from the baths of Stockenbarrel, and it's great for shoppin'.\n@c0@"
  es: "@aBianca@bNo anda lejos de los baños de Clavis y está muy bien para ir de compras.\n@c0@"
  fr: "@aBianca@bÇa n'est pas très loin des bains de Saint Éloi et il y a plein de boutiques.\n@c0@"
  it: "@aBianca@bNon dista molto dai bagni termali di Aprianuam ed è un bel posto per fare acquisti.\n@c0@"
  ja: "@a@bビアンカ「ここなら\n\t山奥の村の温泉にも　通えるし\n\t買い物も　便利だしね。\n@c0@"
282:
  de: "@aBianca@bAber am Ende sind wir dann doch direkt nach Utensiel gezogen, weil eine ruhige Umgebung Papa und seiner Gesundheit zuträglicher war.\n@c0@"
  en: "@aBianca@bBut it was decided we'd move to Stockenbarrel itself in the end, 'cos it's better for Dad and his health if he's somewhere quiet.\n@c0@"
  es: "@aBianca@bPero al final nos fuimos para Clavis porque a papá le convenía un sitio con menos jaleo, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais on a finalement décidé d'aller s'installer à\r\nSaint Éloi même, parce que c'était mieux pour la\r\nsanté de papa qu'il vive dans un endroit paisible.\n@c0@"
  it: "@aBianca@bAlla fine, però, decidemmo di andare a vivere ad Aprianuam, perché è un villaggio più adatto alle condizioni di salute di mio padre.\n@c0@"
  ja: "@a@bビアンカ「だけど　お父さんの身体には\n\t静かなところが　いいって話になって\n\t山奥の村に　住むことになったの。\n@c0@"
283:
  de: "@aBianca@bIch hoffe, es ist wirklich der Zenithiaschild. Es wäre klasse, wenn du deine Mutter finden würdest.\n@c0@"
  en: "@aBianca@bI hope it really is the Zenithian Shield.\r\nIt would be great if you could find your Mum.\n@c0@"
  es: "@aBianca@bEspero que sea de verdad el Escudo de Zenithia.\r\nEstaría genial que encontrases a tu madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère qu'il s'agit vraiment du Bouclier zénithien. Ça serait super que tu puisses retrouver ta maman.\n@c0@"
  it: "@aBianca@bSpero che sia davvero lo Scudo Zenithiano.\r\nE sarebbe fantastico se tu riuscissi a trovare tua madre...\n@c0@"
  ja: "@a@bビアンカ「本当に　天空の盾だと\n\tいいわね。　%a000090には\n\tお母さんを　見つけてもらいたいし。\n@c0@"
284:
  de: "@aBianca@bLothar ist der, der für Nera schwärmt, stimmt's?\n@c0@"
  en: "@aBianca@bCrispin's the one who fancies Nera, right?\n@c0@"
  es: "@aBianca@bCrispín es el que anda detrás de Nera, ¿no?\n@c0@"
  fr: "@aBianca@bGaëtan, c'est celui qui en pince pour Nera, c'est çaⓡ\n@c0@"
  it: "@aBianca@bCandido è il tipo che ha una cotta per Nera, giusto?\n@c0@"
  ja: "@a@bビアンカ「アンディさんって\n\tたしか　フローラさんのことが\n\t大好きな人よね？\n@c0@"
285:
  de: "@aBianca@bEs klingt, als hätte er sich etwas zu viel zugemutet, weil er sie unbedingt heiraten will.\n@c0@"
  en: "@aBianca@bSounds like he pushed himself a bit too far 'cos he wants to marry her so badly. Poor thing.\n@c0@"
  es: "@aBianca@bParece que con las ganas de casarse se pasó un poco de vueltas. Pobre.\n@c0@"
  fr: "@aBianca@bOn dirait qu'il veut tellement... ardemment l'épouser qu'il a peu surestimé ses forces. Pauvre garçon.\n@c0@"
  it: "@aBianca@bCapisco che ne sia innamorato, ma rischiare la vita per sposarla mi pare un po' eccessivo!\n㈡\nSe morisse, non riuscirebbe comunque a diventare suo marito, no?!\n@c0@"
  ja: "@a@bビアンカ「フローラさんと　結婚したくて\n\tムチャしたのかしら……。\n\tかわいそうに。\n@c0@"
286:
  de: "@aBianca@bDer ist ja ein gewiefter Verkäufer, was? Aber er hat recht. Wir sollten unseren Kram noch mal überprüfen, bevor wir irgendwohin gehen.\n@c0@"
  en: "@aBianca@bHe's a canny salesman, eh? He's right, though.\r\nWe should check over our stuff before we go anywhere.\n@c0@"
  es: "@aBianca@bEs un buen vendedor, ¿eh? Pero tiene razón.\r\nDeberíamos comprobar nuestras cosas antes de ir a ningún sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un malin, ce vendeur, heinⓡ Mais il a raison.\nOn devrait vérifier un peu ce qu'on a avant de partir en expédition.\n@c0@"
  it: "@aBianca@bÈ astuto quel venditore, eh? Però ha ragione: prima di andare da qualche parte, bisogna sempre assicurarsi di avere l'equipaggiamento adatto.\n@c0@"
  ja: "@a@bビアンカ「あのおじさん　商売が上手ね。\n\tでも　たしかに　そのとおりだわ。\n\t持ち物を　かくにんしておきましょ。\n@c0@"
287:
  de: "@aBianca@bHe, bist du denn gar nicht eifersüchtig, weil Nera sich so um einen anderen Kerl kümmert!\n@c0@"
  en: "@aBianca@bHey, it must be makin' you a bit jealous, the idea of Nera lookin' after some other bloke!\n@c0@"
  es: "@aBianca@b¡Eh, seguro que te sienta a cuerno quemado que Nera cuide de otro tipo!\n@c0@"
  fr: "@aBianca@bHé, ça doit te rendre un peu jaloux de voir Nera s'occuper d'un autre typeⓠ\n@c0@"
  it: "@aBianca@bL'idea che Nera stia prestando cure amorevoli a un altro uomo ti fa ingelosire, non è vero?\n@c0@"
  ja: "@a@bビアンカ「フローラさんが\n\tほかの男の人を　看病してるなんて…\n\t%a000090　気になるでしょ？\n@c0@"
288:
  de: "@aBianca@bHa ha ha! Dachte ich mir doch!\n@c0@"
  en: "@aBianca@bHa ha ha! Thought so.\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! Ya lo sabía.\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Je m'en doutais.\n@c0@"
  it: "@aBianca@bAh ah ah!\nLo sapevo.\n@c0@"
  ja: "@a@bビアンカ「うふふ。　正直ね！\n@c0@"
289:
  de: "@aBianca@bPah! Mir brauchst du doch nichts vorzumachen!\n@c0@"
  en: "@aBianca@bPah! You dun't have to lie to me, y'know!\n@c0@"
  es: "@aBianca@b¡Bah! A mí no tienes por qué mentirme, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bPeuhⓠ Tu n'as pas besoin de me mentir, tu saisⓠ\n@c0@"
  it: "@aBianca@bWah ah ah ah ah!\nNon dire sciocchezze, %a000090!\nTi conosco troppo bene: a me non la dai a bere!\n@c0@"
  ja: "@a@bビアンカ「うふふ。　ムリしちゃって！\n@c0@"
290:
  de: "@aBianca@bKlar, den Ring wirst du schon finden. Schließlich hast du ja mich!\n@c0@"
  en: "@aBianca@bYeah, you're bound to find the ring no problem.\r\nI'm here to help you, after all!\n@c0@"
  es: "@aBianca@bYa verás cómo encuentras el anillo ese.\r\nEstoy aquí para ayudarte, ¿no?\n@c0@"
  fr: "@aBianca@bÉvidemment que tu vas trouver le trouver,\ncet anneau. Je suis là pour t'aider, après toutⓠ\n@c0@"
  it: "@aBianca@bLo troverai, l'anello, lo troverai.\nCon il mio aiuto, non potrai fallire!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「そうね　%a000090なら　絶対\n\t水のリングを　手に入れられるよね。\n\tだって　私が　ついてるし！\n@c0@"
291:
  de: "@aBianca@bWas soll das denn heißen? Glaubst du, Nera liebt einen anderen?\n@c0@"
  en: "@aBianca@bWhat d'you suppose that means? Do you think Nera loves someone else?\n@c0@"
  es: "@aBianca@b¿Qué crees que quiere decir? ¿Crees que a Nera le gusta otro?\n@c0@"
  fr: "@aBianca@bÇa veut dire quoi, à ton avisⓡ Tu crois que Nera aime quelqu'un d'autreⓡ\n@c0@"
  it: "@aBianca@bCosa intendeva quella tipa?\nNon è che per caso Nera è innamorata di qualcun altro, eh?\n@c0@"
  ja: "@a@bビアンカ「フローラさんが　悩んでる？\n\tそれって　他に　好きな人が\n\tいるとか？\n@c0@"
292:
  de: "@aBianca@bOder vielleicht will sie dir nur nicht weh tun. Hm. Ich frage mich, was sie damit wohl sagen wollte.\n@c0@"
  en: "@aBianca@bOr maybe she just dun't want you to get hurt.\r\nHm, I wonder what it is that's on her mind.\n@c0@"
  es: "@aBianca@bO quizá es que no quiere que te pase nada.\r\nA saber qué tiene esa en la cabeza.\n@c0@"
  fr: "@aBianca@bOu peut-être qu'elle ne veut simplement pas que tu sois blessé. Mmm, je me demande ce qu'elle pense.\n@c0@"
  it: "@aBianca@bMa no! Cosa vado mai a pensare?! Nera non è mica stupida: nessuna donna sana di mente rinuncerebbe mai a un ⓕbocconcinoⓖ come te... Wah ah ah!\n@c0@"
  ja: "@a@bビアンカ「それとも　ステキな%a000090に\n\tケガを　させたくないから……？\n\tう～ん　どういう悩みなのかしら。\n@c0@"
293:
  de: "@aBianca@bLothar und Nera sind Kindheitsfreunde, nicht?\n@c0@"
  en: "@aBianca@bCrispin and Nera are childhood friends, en't they?\n@c0@"
  es: "@aBianca@bCrispín y Nera son amigos desde niños, ¿no?\n@c0@"
  fr: "@aBianca@bGaëtan et Nera sont des amis d'enfance,\nn'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bCandido e Nera sono amici d'infanzia, vero?\n@c0@"
  ja: "@a@bビアンカ「そういえば\n\tアンディさんと　フローラさんは\n\t幼なじみの関係　なんだっけ？\n@c0@"
294:
  de: "@aBianca@bDa ist es wohl nur natürlich, dass sie sich Sorgen macht, wenn er verletzt wird.\n@c0@"
  en: "@aBianca@bI suppose it's only natural she'd be worried about him gettin' hurt, then.\n@c0@"
  es: "@aBianca@bCómo no va a preocuparse por si le hacen daño.\n@c0@"
  fr: "@aBianca@bJ'imagine que c'est bien naturel qu'elle ait peur\r\nqu'il soit blessé, dans ce cas.\n@c0@"
  it: "@aBianca@bAllora è naturale che Nera si preoccupi per lui.\nAnch'io sarei in ansia se un mio vecchio amico mettesse a rischio la sua vita per me. Ehm...\n@c0@"
  ja: "@a@bビアンカ「そんな人が　ケガをしたら\n\tフローラさんが　心配するのも\n\tムリはないわね。\n@c0@"
295:
  de: "@aBianca@bEs ist wohl kaum Neras Schuld. Es war schließlich ihr Vater, der sich diese gefährliche Aufgabe ausgedacht hat.\n@c0@"
  en: "@aBianca@bIt's hardly Nera's fault. It's her dad who's to blame for comin' up with such a dangerous challenge in the first place.\n@c0@"
  es: "@aBianca@bNo es culpa de Nera. La culpa la tiene su padre por salir con desafíos así de peligrosos, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe n'est pas Nera, la responsable. C'est son père\r\nqui est à blâmer pour avoir organisé un défi aussi dangereux.\n@c0@"
  it: "@aBianca@bNera non ha nessuna colpa.\r\nA suo padre, invece, bisognerebbe tirare le orecchie per aver organizzato una sfida tanto pericolosa!\n@c0@"
  ja: "@a@bビアンカ「本当は　そんな指輪を\n\t取ってこいって　言った人が悪いのに。\n\tフローラさんも　大変ね。\n@c0@"
296:
  de: "@aBianca@bNera ist so hübsch. Und anscheinend auch noch richtig nett.\n@c0@"
  en: "@aBianca@bNera's so pretty. And she seems really sweet too.\n@c0@"
  es: "@aBianca@bNera es muy mona. Y parece un cacho pan, ¿sabes?\n@c0@"
  fr: "@aBianca@bNera est tellement jolie.\r\nEt elle a l'air aussi très douce.\n@c0@"
  it: "@aBianca@bNera è veramente una bella ragazza...\nE sembra anche molto dolce.\n@c0@"
  ja: "@a@bビアンカ「フローラさんって\n\tすごく　かわいい人ね。\n\tそれに　とっても　やさしそうだし…。\n@c0@"
297:
  de: "@aBianca@bIch würde sagen, eigentlich ist sie sogar ein bisschen zu gut für dich, %a000090.\n@c0@"
  en: "@aBianca@bI'd say she might even be a bit too good for you, %a000090!\n@c0@"
  es: "@aBianca@b¡Hasta me parece demasiado buena para ti, %a000090!\n@c0@"
  fr: "@aBianca@bEn fait, elle pourrait même être un peu trop bien\npour toi, %a000090ⓠ\n@c0@"
  it: "@aBianca@bSai una cosa, %a000090?\nQuella donna è troppo perfetta per te!\nIh ih ih! Sto scherzando, amico mio!\n@c0@"
  ja: "@a@bビアンカ「%a000090には　ちょっと\n\tもったいないくらいの人ね。\n@c0@"
298:
  de: "@aBianca@bMeine Güte! Was für schlimme Verbrennungen! So wie er aussieht, wird er mit seinem Fieber wohl eine Weile zu kämpfen haben.\n@c0@"
  en: "@aBianca@bCrikey! What awful burns! I reckon his fever'll be around for a while, judgin' by the look of him.\n@c0@"
  es: "@aBianca@b¡Mi madre! ¡Menudas quemaduras! Por la pinta que tiene, más vale que se vaya acostumbrando a la fiebre, ¿eh?\n@c0@"
  fr: "@aBianca@bBon sangⓠ Quelles brûlures horriblesⓠ À le voir,\nje pense que sa fièvre ne tombera pas avant un bon moment.\n@c0@"
  it: "@aBianca@bAccidenti, che brutte ustioni!\nTemo che gli ci vorrà un pezzo prima di riprendersi del tutto...\n@c0@"
  ja: "@a@bビアンカ「まあ！　なんて　ひどいヤケド。\n\tあれじゃ　とうぶん　熱は\n\t下がらないかも知れないわ……。\n@c0@"
299:
  de: "@aBianca@bDu meine Güte! War das ein Schock! Wie kann sie denn so höflich zu ihren Kunden sein und gleichzeitig so gemein zu ihrem Mann?\n@c0@"
  en: "@aBianca@bBlimey! That was a bit of a shock! How can she be so polite to her customers in one breath and so rotten to her husband the next!?\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Pero qué susto! ¿Cómo puede ser tan educada con sus clientes y volverse una mala pécora así con su marido?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Ça fait un chocⓠ Comment peut-elle être aussi polie avec ses clients et aussi désagréable avec son mari l'instant d'aprèsⓡⓐ\n@c0@"
  it: "@aBianca@bMa come fa a essere tanto gentile con i suoi clienti e, il momento successivo, così acida e arrogante con il marito?!\n@c0@"
  ja: "@a@bビアンカ「あ～　びっくりした。\n\tお客さんには　ていねいなのに\n\tダンナさんには　あんな言い方なのね。\n@c0@"
300:
  de: "@aBianca@bEs lässt sich schwer sagen, ob er nur nett ist oder willensschwach. Auf jeden Fall passen die beiden gut zueinander.\n@c0@"
  en: "@aBianca@bIt's hard to tell whether he's just kind or weak-willed. They certainly go well together, anyway.\n@c0@"
  es: "@aBianca@bNo sé si él es así de bueno o así de calzonazos. Pero hacen buena pareja, ¿sabes?\n@c0@"
  fr: "@aBianca@bDifficile de savoir s'il est juste gentil ou un peu faible. Quoi qu'il en soit, ils vont bien ensemble.\n@c0@"
  it: "@aBianca@bEvidentemente, le loro personalità si equilibrano a vicenda.\nSbaglierò, ma quei due stanno bene insieme.\n@c0@"
  ja: "@a@bビアンカ「おじさんが　気が弱いのか\n\tやさしいのか……。\n\tでも　お似合いの　ご夫婦よね。\n@c0@"
301:
  de: "@aBianca@bIch hoffe, eines Tages finde ich den Richtigen. Aber das ist sicher noch lange hin.\n@c0@"
  en: "@aBianca@bI hope I manage to find someone like that to marry one day. It's a long way off yet, though, I'm sure.\n@c0@"
  es: "@aBianca@bEspero encontrar algún día alguien así para casarme. Aunque para eso falta un montonazo, ya verás.\n@c0@"
  fr: "@aBianca@bJ'espère trouver un jour quelqu'un comme ça\r\nà épouser. Mais ce n'est pas demain la veille,\r\nj'en suis sûre.\n@c0@"
  it: "@aBianca@bUn giorno anch'io troverò la persona con cui vivere felice per il resto della mia vita. Temo, però, che quel giorno sia ancora molto lontano...\n㈡\nSpero di essere ancora viva quando arriverà!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「私も　いつか　そんな人と\n\t結婚できるかしら……。　うふふ。\n\tまだ　とうぶん　先でしょうけどね。\n@c0@"
302:
  de: "@aBianca@bDie Kirche hier ist so groß und so schön!\n@c0@"
  en: "@aBianca@bThe church here is so huge and beautiful!\n@c0@"
  es: "@aBianca@b¡Qué bonita y qué grande es la iglesia de aquí!\n@c0@"
  fr: "@aBianca@bCette église est si grande et si belleⓠ\n@c0@"
  it: "@aBianca@bQuesta chiesa è bellissima!\n@c0@"
  ja: "@a@bビアンカ「この町の教会は\n\tとっても　大きいし　ステキね。\n@c0@"
303:
  de: "@aBianca@bSie gefällt mir wirklich gut. Wenn ich mal heirate, dann hoffentlich in so einer Kirche.\n@c0@"
  en: "@aBianca@bIt really is lovely. I hope I can get married in a place like that.\n@c0@"
  es: "@aBianca@bEs un encanto. Me gustaría casarme en un sitio así, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vraiment splendide. J'espère pouvoir me marier dans un endroit comme ça, un jour.\n@c0@"
  it: "@aBianca@bÈ davvero stupenda! Mi piacerebbe sposarmi qui, quando arriverà il giorno delle mie nozze!\r\nAmmesso che arrivi, è ovvio...\n@c0@"
  ja: "@a@bビアンカ「いいなあ。\n\t私も　いつか　こういうところで\n\t結婚式を　あげたいな。\n@c0@"
304:
  de: "@aBianca@bDieser Onassetti hat sicher Geld wie Heu, wenn er nur einen Steinwurf von seinem Heim ein Ferienhaus unterhält!\n@c0@"
  en: "@aBianca@bThat Briscoletti bloke must be loaded to have\r\na holiday home within spittin' distance of his\r\nactual house!\n@c0@"
  es: "@aBianca@b¡Ese Rimaldi debe de estar forrado para tener una casa de vacaciones al lado de la de diario!\n@c0@"
  fr: "@aBianca@bCe monsieur Oscuroni doit vraiment être plein\naux as pour posséder une résidence secondaire\nà deux pas de la maison où il vitⓠ\n@c0@"
  it: "@aBianca@bHai visto che villa?!\nQuel Fosconi deve avere i soldi che gli escono dalle orecchie!\n@c0@"
  ja: "@a@bビアンカ「敷地内に　別荘まであるなんて\n\tルドマンさんって　本当に\n\tお金持ちなのね。\n@c0@"
305:
  de: "@aBianca@bOh Mann! Was für ein Haus! Kaum zu glauben, dass du bald zu so einer reichen Familie gehörst, %a000090!\n@c0@"
  en: "@aBianca@bWow! What a house! I can't believe you're goin' to be part of such a rich family, %a000090!\n@c0@"
  es: "@aBianca@b¡Vaya! ¡Menuda choza! ¡No me puedo creer que vayas a entrar en una familia tan rica, %a000090!\n@c0@"
  fr: "@aBianca@bWaouhⓠ Quelle maisonⓠ Je n'arrive pas à croire que tu vas faire partie d'une famille aussi riche, %a000090ⓠ\n@c0@"
  it: "@aBianca@bQuesta casa è meravigliosa!\nBuon per te che stai per entrare a far parte di una famiglia tanto ricca, %a000090!\n@c0@"
  ja: "@a@bビアンカ「まあ！　りっぱなお屋敷。\n\tここが　%a000090の　家になるなんて\n\t想像できないわね。\n@c0@"
306:
  de: "@aBianca@bDieser Onassetti nimmt ja kein Blatt vor den Mund, was?\n@c0@"
  en: "@aBianca@bThat Briscoletti certainly dun't mince his words, eh?\n@c0@"
  es: "@aBianca@bEl Rimaldi ese no se anda con rodeos, ¿eh?\n@c0@"
  fr: "@aBianca@bEh bien, il ne mâche pas ses mots, Oscuroni, heinⓡ\n@c0@"
  it: "@aBianca@bQuel Fosconi non ha paura di parlare chiaro, eh?\n@c0@"
  ja: "@a@bビアンカ「ルドマンさんったら\n\t意外と　失礼なこというのね！\n@c0@"
307:
  de: "@aBianca@bOb er wohl wirklich denkt, dass du so was tun würdest?\n@c0@"
  en: "@aBianca@bI wonder if he really thinks you'd\r\ndo somethin' like that...\n@c0@"
  es: "@aBianca@b¿Creerá de verdad que podrías hacer algo así?\n@c0@"
  fr: "@aBianca@bJe me demande s'il croit vraiment que tu serais capable de faire une chose pareille...\n@c0@"
  it: "@aBianca@bCon un suocero del genere, farai meglio a rigare dritto, caro il mio %a000090!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「%a000090が\n\tそんな　いいかげんな男だと\n\t思っているのかしら。\n@c0@"
308:
  de: "@aBianca@bSag's nicht weiter, aber das war vielleicht ein Jammerlappen! Hat die ganze Zeit geheult und gewinselt. Es war gar nicht leicht, den zu versorgen.\n@c0@"
  en: "@aBianca@bDun't tell anyone, but he was a right wimp! He was cryin' and moanin' about the pain, so it was ever so hard tryin' to tend to him.\n@c0@"
  es: "@aBianca@b¡No se lo digas a nadie, pero era un llorica! Se pasaba el día quejándose y no había quien cuidara de él, ¿sabes?\n@c0@"
  fr: "@aBianca@bSurtout, ne le répète pas, mais c'est une vraie mauvietteⓠ\n㈡\nIl n'arrêtait pas de pleurer et de se plaindre de la douleur, c'était un vrai calvaire de le soigner.\n@c0@"
  it: "@aBianca@bResti tra noi, ma quel tipo è proprio un rammollito!\n㈡\nNon faceva altro che piangere e lamentarsi per il dolore, e ho dovuto dargli una botta in testa per farlo star fermo e medicarlo!\n@c0@"
  ja: "@a@bビアンカ「ないしょだけど　あの戦士さん\n\t痛い痛いって　泣いてわめくから\n\t手当てするのが　大変だったのよ。\n@c0@"
309:
  de: "@aBianca@bDu willst doch weiter durch die Weltgeschichte reisen, wenn du verheiratet bist, oder nicht, %a000090?\n@c0@"
  en: "@aBianca@bYou're plannin' on carryin' on with your travels after you get married, right, %a000090?\n@c0@"
  es: "@aBianca@bDespués de casarte piensas seguir con tus viajes, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bTu envisages de continuer tes voyages après ton mariage, %a000090ⓡ\n@c0@"
  it: "@aBianca@bStai pensando di continuare il tuo viaggio dopo che ti sarai sposato, %a000090?\n@c0@"
  ja: "@a@bビアンカ「%a000090は　結婚しても\n\t旅を　続けるの？\n@c0@"
310:
  de: "@aBianca@bDann wird sich Nera wohl ziemliche Sorgen um dich machen.\n@c0@"
  en: "@aBianca@bI suppose Nera will be pretty\r\nworried about you, then.\n@c0@"
  es: "@aBianca@bEntonces, Nera se preocupará un montón por ti, ¿sabes?\n@c0@"
  fr: "@aBianca@bNera risque de se faire pas mal de souci pour toi, dans ce cas.\n@c0@"
  it: "@aBianca@bAllora credo che Nera sarà in pena per te.\n@c0@"
  ja: "@a@bビアンカ「そっか…。\n\tじゃあ　フローラさんが心配だね。\n@c0@"
311:
  de: "@aBianca@bWas? Dann suchst du den Ring nur, um Nera heiraten zu können? Und nicht, weil du den Zenithiaschild haben willst?\n@c0@"
  en: "@aBianca@bEh!? So you're goin' after the ring just so you can marry Nera? And not because you want the Zenithian Shield!?\n@c0@"
  es: "@aBianca@b¿Eh? Entonces, ¿vas a por el anillo solo para casarte con Nera? ¿No quieres el Escudo de Zenithia ese?\n@c0@"
  fr: "@aBianca@bHeinⓡⓐ Alors tu pars à la recherche de l'anneau juste pour pouvoir épouser Neraⓡ Et pas parce\nque tu veux le Bouclier zénithienⓡⓐ\n@c0@"
  it: "@aBianca@bEh?! Quindi stai cercando l'anello solo perché cosi potrai sposare Nera?\r\nE non perché vuoi lo Scudo Zenithiano?!\n@c0@"
  ja: "@a@bビアンカ「えっ？　じゃあ\n\t水のリングは　盾のためじゃなくて\n\tフローラさんとの　結婚のために？\n@c0@"
312:
  de: "@aBianca@bTja... Na ja, ich kann dich schon verstehen. Vielleicht solltest du die Suche nach deiner Mutter einfach aufgeben und deine eigene Familie gründen.\n@c0@"
  en: "@aBianca@bWell... Yeah, I suppose I can see your point. Maybe it's best just to give up lookin' for your mum and settle down to a family of your own.\n@c0@"
  es: "@aBianca@bBueno... Sí, si te entiendo. Quizá sea mejor que dejes de buscar a tu madre y crees una familia propia, ¿sabes?\n@c0@"
  fr: "@aBianca@bDisons que... oui, je crois que je peux\ncomprendre ton raisonnement.\n㈡\nPeut-être que c'est mieux d'abandonner la recherche de ta mère et de t'installer pour\nfonder ta propre famille.\n@c0@"
  it: "@aBianca@bHo capito. Beh, non posso certo darti torto...\nForse è arrivato il momento che tu smetta di cercare tua madre e ti crei una famiglia tutta tua...\n@c0@"
  ja: "@a@bビアンカ「そっか…　そうだよね。\n\tお母さんのことは　あきらめて\n\t幸せな家庭をつくるのも　いいわよね。\n@c0@"
313:
  de: "@aBianca@bWas soll das denn heißen? Glaubst du, Nera liebt einen anderen?\n@c0@"
  en: "@aBianca@bWhat d'you suppose that means? Do you think Nera loves someone else?\n@c0@"
  es: "@aBianca@b¿Qué crees que quiere decir? ¿Crees que a Nera le gusta otro?\n@c0@"
  fr: "@aBianca@bÇa veut dire quoi, à ton avisⓡ Tu crois que Nera aime quelqu'un d'autreⓡ\n@c0@"
  it: "@aBianca@bCosa intendeva quella tipa?\nNon è che per caso Nera è innamorata di qualcun altro, eh?\n@c0@"
  ja: "@a@bビアンカ「フローラさんが　悩んでる？\n\tそれって　他に　好きな人が\n\tいるとか？\n@c0@"
314:
  de: "@aBianca@bOder vielleicht will sie dir nur nicht weh tun. Hm. Ich frage mich, was sie damit wohl sagen wollte.\n@c0@"
  en: "@aBianca@bOr maybe she just dun't want you to get hurt.\r\nHm, I wonder what it is that's on her mind.\n@c0@"
  es: "@aBianca@bO quizá es que no quiere que te pase nada.\r\nA saber qué tiene esa en la cabeza.\n@c0@"
  fr: "@aBianca@bOu peut-être qu'elle ne veut simplement pas que tu sois blessé. Mmm, je me demande ce qu'elle pense.\n@c0@"
  it: "@aBianca@bMa no! Cosa vado mai a pensare?! Nera non è mica stupida: nessuna donna sana di mente rinuncerebbe mai a un ⓕbocconcinoⓖ come te... Wah ah ah!\n@c0@"
  ja: "@a@bビアンカ「それとも　ステキな%a000090に\n\tケガを　させたくないから……？\n\tう～ん　どういう悩みなのかしら。\n@c0@"
315:
  de: "@aBianca@bStell dir nur vor, bloß des Geldes wegen heiraten zu wollen! Als wäre Nera so eine Art Versorgungskasse für ihn.\n@c0@"
  en: "@aBianca@bFancy thinkin' of gettin' married just for the money! It's like Nera's some kind of meal ticket to him.\n@c0@"
  es: "@aBianca@b¡Qué bonito, casarse solo por dinero! Parece que Nera solo es para él una especie de bolsa de oro gigante, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuelle idéeⓠ Vouloir épouser quelqu'un juste pour son argentⓠ On dirait que pour lui, Nera n'est qu'un ticket-repas.\n@c0@"
  it: "@aBianca@bQuell'essere odioso pensa che Nera sia uno scrigno pieno di monetine sonanti! Ma come si fa a sposare qualcuno solo per i suoi soldi, eh?!\n㈡\nGli darei un pugno sul naso, gli darei!\n@c0@"
  ja: "@a@bビアンカ「そんな理由で　結婚を\n\t考えるなんて…。　フローラさんを\n\tなんだと思ってるのかしら。\n@c0@"
316:
  de: "@aBianca@bIch glaube, das ist keine gute Idee, %a000090. Das Zeug ist wirklich stark. Nichts für Leute, die nicht daran gewöhnt sind.\n@c0@"
  en: "@aBianca@bI dun't think this is a good idea, %a000090.\nThat stuff's ever so strong. It en't for them who\nen't used to it.\n@c0@"
  es: "@aBianca@bNo creo que sea buena idea, %a000090.\nEso es muy fuerte. Es para gente acostumbrada, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe ne crois pas que ce soit une bonne idée, %a000090. Ce truc est vraiment très fort.\nÇa n'est pas pour ceux qui n'ont pas l'habitude.\n\n@c0@"
  it: "@aBianca@bVedo che t'è piaciuto, %a000090...\nNe vuoi ancora?\nChiedigli se te ne offre un altro bicchiere! Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「%a000090　もうやめましょ。\n\tあの飲み物は　クセが強いから\n\t飲みなれない人は　つらいわよ。\n@c0@"
317:
  de: "@aBianca@bAlles in Ordnung, %a000090? Das auszutrinken war vermutlich nicht die beste Idee. Sag Bescheid, wenn du anfängst, dich schwummrig zu fühlen.\n@c0@"
  en: "@aBianca@bAre you okay, %a000090? Drinkin' all that probably weren't the best idea. Let me know if you start to feel funny.\n@c0@"
  es: "@aBianca@b¿Estás bien, %a000090? No tendrías que haber bebido tanto. Avísame si te mareas y tal, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bÇa va, %a000090ⓡ Ça n'était sûrement pas une bonne idée de boire tout ça. Dis-moi si tu commences à te sentir bizarre.\n@c0@"
  it: "@aBianca@bAvevi proprio una gran sete, %a000090...\nL'hai mandato giù tutto d'un fiato!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　大丈夫？\n\tそんなに飲んで…\n\t気持ち悪くなったら　言ってよね。\n@c0@"
318:
  de: "@aBianca@bDas ist offenbar seine Taktik bei den Damen. Wenigstens musst du nicht auf solche Mittel zurückgreifen, %a000090.\n@c0@"
  en: "@aBianca@bLooks like that's his tactic with the ladies. At least you dun't have to resort to things like that, %a000090.\n@c0@"
  es: "@aBianca@bParece su táctica con las chicas. Al menos tú no tienes que recurrir a esas cosas, %a000090.\n@c0@"
  fr: "@aBianca@bOn dirait que c'est sa tactique pour aborder les femmes. Au moins toi, tu n'as pas besoin de recourir\nà ce genre de choses, %a000090.\n@c0@"
  it: "@aBianca@bAlla sua salute!\n@c0@"
  ja: "@a@bビアンカ「あの人は　そういう手で\n\t女の人を　口説いてるみたいだけど…\n\t%a000090には　必要ない手ね。\n@c0@"
319:
  de: "@aBianca@bLothar und Nera sind Kindheitsfreunde, nicht?\n@c0@"
  en: "@aBianca@bCrispin and Nera are childhood friends, en't they?\n@c0@"
  es: "@aBianca@bCrispín y Nera son amigos desde niños, ¿no?\n@c0@"
  fr: "@aBianca@bGaëtan et Nera sont des amis d'enfance,\nn'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bCandido e Nera sono amici d'infanzia, vero?\n@c0@"
  ja: "@a@bビアンカ「そういえば\n\tアンディさんと　フローラさんは\n\t幼なじみの関係　なんだっけ？\n@c0@"
320:
  de: "@aBianca@bDa ist es wohl nur natürlich, dass sie sich Sorgen macht, wenn er verletzt wird.\n@c0@"
  en: "@aBianca@bI suppose it's only natural she'd be worried about him gettin' hurt, then.\n@c0@"
  es: "@aBianca@bCómo no va a preocuparse por si le hacen daño.\n@c0@"
  fr: "@aBianca@bJ'imagine que c'est bien naturel qu'elle ait peur\r\nqu'il soit blessé, dans ce cas.\n@c0@"
  it: "@aBianca@bAllora è naturale che Nera si preoccupi per lui.\nAnch'io sarei in ansia se un mio vecchio amico mettesse a rischio la sua vita per me. Ehm...\n@c0@"
  ja: "@a@bビアンカ「そんな人が　ケガをしたら\n\tフローラさんが　心配するのも\n\tムリはないわね。\n@c0@"
321:
  de: "@aBianca@bLothar liebt Nera wirklich, nicht?\n@c0@"
  en: "@aBianca@bCrispin really loves Nera, eh?\n@c0@"
  es: "@aBianca@bMira que Crispín quiere a Nera, ¿eh?\n@c0@"
  fr: "@aBianca@bGaëtan est vraiment amoureux de Nera, heinⓡ\n@c0@"
  it: "@aBianca@bCandido è davvero innamorato di Nera, eh?\n@c0@"
  ja: "@a@bビアンカ「アンディさん　本当に　心から\n\tフローラさんを　愛しているんだわ。\n@c0@"
322:
  de: "@aBianca@bVielleicht sollten besser diese beiden heiraten.\n@c0@"
  en: "@aBianca@bIt seems like it should be the two of them gettin' married, really.\n@c0@"
  es: "@aBianca@bParece que sean ellos los que deban casarse.\n@c0@"
  fr: "@aBianca@bEn fait, c'est plutôt eux deux qui devraient\r\nse marier.\n@c0@"
  it: "@aBianca@bSarebbe bello se quei due ragazzi si sposassero, sai?\n@c0@"
  ja: "@a@bビアンカ「あの人と　フローラさんが\n\tむすばれるのが　いちばん\n\t自然な形じゃないかしら…。\n@c0@"
323:
  de: "@aBianca@bOh! Tut mir leid! Tu einfach so, als hätte ich nichts gesagt!\n@c0@"
  en: "@aBianca@bSorry! Just forget I said anythin'.\n@c0@"
  es: "@aBianca@b¡Lo siento! Olvida lo que he dicho, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bDésoléeⓠ Oublie ce que je viens de dire.\n@c0@"
  it: "@aBianca@bOh, santa dea!\nScusami, non avrei dovuto dire una cosa del genere...\n@c0@"
  ja: "@a@bビアンカ「あっ　ごめんなさい。\n\t今のは　聞かなかったことに\n\tしてちょうだい。\n@c0@"
324:
  de: "@aBianca@bHa ha ha! Ist doch zu komisch zu sehen, wie unterschiedlich die Leute mit ihren Ehegesponsen umgehen!\n@c0@"
  en: "@aBianca@bHa ha ha! It's funny seein' how different folk are with their spouses!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! Es gracioso ver cómo cambia la gente con sus parejas, ¿sabes?\n@c0@"
  fr: "@aBianca@bHa ha haⓠ C'est drôle de voir à quel point les gens sont différents avec leur conjointⓠ\n@c0@"
  it: "@aBianca@bIh ih ih!\nÈ buffo vedere come le persone si comportano quando sono coi rispettivi consorti!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tいろんな夫婦の形があって\n\tおもしろいわね。\n@c0@"
325:
  de: "@aBianca@bNera wird inzwischen schlafen. Ich weiß, du willst sie bestimmt sehen, aber du musst bis morgen warten.\n@c0@"
  en: "@aBianca@bNera will be asleep by now. I know you want to see her, but you'll just have to wait until tomorrow.\n@c0@"
  es: "@aBianca@bNera estará dormida. Sé que quieres verla, pero tendrás que esperar hasta mañana, ¿sabes?\n@c0@"
  fr: "@aBianca@bNera doit dormir, à l'heure qu'il est.\r\nJe sais que tu as envie de la voir,\r\nmais tu vas devoir attendre demain.\n@c0@"
  it: "@aBianca@bA quest'ora Nera starà già dormendo.\nSo che desideri vederla, ma dovrai aspettare fino a domani...\n@c0@"
  ja: "@a@bビアンカ「フローラさんも　寝てるわよ。\n\t顔を見たい気持ちはわかるけど\n\t出直しましょう。\n@c0@"
326:
  de: "@aBianca@bDas ist also Neras ältere Schwester?\n@c0@"
  en: "@aBianca@bSo this is Nera's older sister, is it?\n@c0@"
  es: "@aBianca@bAsí que esta es la hermana mayor de Nera, ¿no?\n@c0@"
  fr: "@aBianca@bAlors c'est la sœur aînée de Nera, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bÈ la sorella maggiore di Nera, non è vero?\n@c0@"
  ja: "@a@bビアンカ「この人が\n\tフローラさんの　お姉さん？\n@c0@"
327:
  de: "@aBianca@bMeine Güte! Die beiden könnten wohl kaum unterschiedlicher sein.\n@c0@"
  en: "@aBianca@bBlimey! I dun't think you could find two folk more different to each other.\n@c0@"
  es: "@aBianca@b¡Rayos! Debe de ser difícil encontrar a dos hermanas más distintas.\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ C'est pourtant difficile de rencontrer des personnes aussi différentes\nl'une de l'autre.\n@c0@"
  it: "@aBianca@bQuelle due ragazze sono come il giorno e la notte: non potrebbero essere più diverse l'una dall'altra.\n@c0@"
  ja: "@a@bビアンカ「うーん……\n\tなんだか　フローラさんとは\n\t正反対の　人みたいだね。\n@c0@"
328:
  de: "@aBianca@bTja, ich hab ja nun 'ne ganze Weile auf dem Lande gelebt, da kann ich's verstehen, dass sie mich für ein Bauerngör hält.\n@c0@"
  en: "@aBianca@bI suppose I have bin livin' in the countryside a while, so I can see why I'd look like a peasant to the likes of her.\n@c0@"
  es: "@aBianca@bHe vivido bastante en el campo, así que entiendo que piense que soy una paleta.\n@c0@"
  fr: "@aBianca@bC'est vrai que j'ai vécu à la campagne pendant un certain temps. Je comprends pourquoi j'ai l'air d'une paysanne, aux yeux de gens comme elle.\n@c0@"
  it: "@aBianca@bCapisco di non essere una ragazza curata, elegante e raffinata come lei...\n@c0@"
  ja: "@a@bビアンカ「たしかに　いなかでの\n\t暮らしが　ながかったから\n\tヤボったいのは　みとめるけど。\n@c0@"
329:
  de: "@aBianca@bAber das muss sie mir ja nicht an den Kopf werfen!\n@c0@"
  en: "@aBianca@bBut there's no need for her to come right out and say it to my face!\n@c0@"
  es: "@aBianca@b¡Pero no tenía por qué venir a restregármelo en las narices!\n@c0@"
  fr: "@aBianca@bMais ça n'est pas une raison pour me le\ncracher à la figure comme çaⓠ\n@c0@"
  it: "@aBianca@bMa se si azzarda a darmi un'altra volta della ⓕcontadinottaⓖ la riduco peggio di un sacco di concime!\n@c0@"
  ja: "@a@bビアンカ「でも　面と向かって\n\t言わなくても　いいとおもうわ。\n@c0@"
330:
  de: "@aBianca@bDu wirst doch wohl Griselda nicht Nera vorziehen wollen, %a000090?\n@c0@"
  en: "@aBianca@bI dun't suppose you actually prefer that Debora over Nera, do you, %a000090?\n@c0@"
  es: "@aBianca@b¿Prefieres a la Stefania esa que a la Nera?\n@c0@"
  fr: "@aBianca@bTu préfères réellement cette Pandora à Nera, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, posso farti una domanda indiscreta? In tutta sincerità, non è che preferiresti sposare Viola invece di Nera?\n@c0@"
  ja: "@a@bビアンカ「%a000090も　じつは\n\tフローラさんより　デボラさんの方が\n\t好みだったり　する？\n@c0@"
331:
  de: "@aBianca@bTatsächlich? Wer hätte das gedacht!\n@c0@"
  en: "@aBianca@bWell, I'll be! Who'd have seen that comin', eh?\n@c0@"
  es: "@aBianca@b¡Vaya! Fíjate tú, ¿quién lo iba a decir?\n@c0@"
  fr: "@aBianca@bEh bien, ça alorsⓠ Qui aurait pu deviner\nune chose pareilleⓡ\n@c0@"
  it: "@aBianca@bMa davvero?!\nQuesta proprio non me l'aspettavo!\n@c0@"
  ja: "@a@bビアンカ「そうなんだー。\n\tなんだか　意外かも。\n@c0@"
332:
  de: "@aBianca@bDachte ich's mir doch, dass du den damenhafteren Typ vorziehst!\n@c0@"
  en: "@aBianca@bYeah, I suppose you prefer the more ladylike type, eh?\n@c0@"
  es: "@aBianca@bSí. Supongo que te gustan más en plan señorita, ¿eh?\n@c0@"
  fr: "@aBianca@bOui, j'imagine que tu as un faible pour les femmes\nun peu plus distinguées, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bCi avrei scommesso!\nSi vede che sei più attratto dalle ragazze educate e di classe...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　%a000090は\n\tおしとやかな　女性が　好みなのね。\n@c0@"
333:
  de: "@aBianca@bDu wirst doch wohl Griselda nicht Nera vorziehen wollen, %a000090?\n@c0@"
  en: "@aBianca@bI dun't suppose you actually prefer that Debora over Nera, do you, %a000090?\n@c0@"
  es: "@aBianca@b¿Prefieres a la Stefania esa que a la Nera?\n@c0@"
  fr: "@aBianca@bTu préfères réellement cette Pandora à Nera, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, posso farti una domanda indiscreta? In tutta sincerità, non è che preferiresti sposare Viola invece di Nera?\n@c0@"
  ja: "@a@bビアンカ「%a000090も　じつは\n\tフローラさんより　デボラさんの方が\n\t好みだったり　する？\n@c0@"
334:
  de: "@aBianca@bTatsächlich? Wer hätte das gedacht!\n@c0@"
  en: "@aBianca@bWell, I'll be! Who'd have seen that comin', eh?\n@c0@"
  es: "@aBianca@b¡Vaya! Fíjate tú, ¿quién lo iba a decir?\n@c0@"
  fr: "@aBianca@bEh bien, ça alorsⓠ Qui aurait pu deviner\nune chose pareilleⓡ\n@c0@"
  it: "@aBianca@bMa davvero?!\nQuesta proprio non me l'aspettavo!\n@c0@"
  ja: "@a@bビアンカ「そうなんだー。\n\tなんだか　意外かも。\n@c0@"
335:
  de: "@aBianca@bDachte ich's mir doch, dass du den damenhafteren Typ vorziehst!\n@c0@"
  en: "@aBianca@bYeah, I suppose you prefer the more ladylike type, eh?\n@c0@"
  es: "@aBianca@bSí. Supongo que te gustan más en plan señorita, ¿eh?\n@c0@"
  fr: "@aBianca@bOui, j'imagine que tu as un faible pour les femmes\nun peu plus distinguées, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bCi avrei scommesso!\nSi vede che sei più attratto dalle ragazze educate e di classe...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　%a000090は\n\tおしとやかな　女性が　好みなのね。\n@c0@"
336:
  de: "@aBianca@bDas wär's dann, %a000090. Mit dem Ring des Wassers in Händen kann dich nichts mehr von einer Ehe mit Nera abhalten.\n@c0@"
  en: "@aBianca@bSo this is it, %a000090. With the Circle of Water, nothin's stoppin' you from marryin' that Nera.\n@c0@"
  es: "@aBianca@bPues ya está, %a000090. Con el Anillo de Agua, nada te impide casarte con Nera.\n@c0@"
  fr: "@aBianca@bCette fois, ça y est, %a000090. Avec l'Anneau\nde l'Eau, plus rien ne t'empêche d'épouser Nera.\n@c0@"
  it: "@aBianca@bEccolo qui, %a000090.\nAdesso che hai trovato l'Anello d'Acqua, potrai sposare Nera...\n@c0@"
  ja: "@a@bビアンカ「いよいよね　%a000090。\n\t水のリングを　持っていけば　\n\tフローラさんとの　結婚が決まるね。\n@c0@"
337:
  de: "@aBianca@bVergiss nicht, mich zur Hochzeit einzuladen, ja? Ich hab dir schließlich geholfen, den Ring zu finden, also schuldest du mir noch was!\n@c0@"
  en: "@aBianca@bMake sure you invite me to the weddin', eh? I did help you find the ring, after all, so you owe me one!\n@c0@"
  es: "@aBianca@bNo te olvides de invitarme a la boda, ¿eh? Te he ayudado a encontrar el anilloⓓ ¡me debes una!\n@c0@"
  fr: "@aBianca@bSurtout, n'oublie pas de m'inviter au mariage, heinⓡ Je t'ai aidé à trouver l'anneau, tu me dois bien çaⓠ\n@c0@"
  it: "@aBianca@bGuarda che voglio essere invitata al matrimonio...\nDopotutto ti ho aiutato a trovare l'anello, quindi sei in debito con me!\n@c0@"
  ja: "@a@bビアンカ「結婚式には　私も呼んでよ。\n\tリングを探すの　手伝ったんだから\n\tそれくらい　いいわよね。\n@c0@"
338:
  de: "@aBianca@bBeinahe wären wir auch mal hierher gezogen, weißt du.\n@c0@"
  en: "@aBianca@bThere was a chance we might've come to live here once, y'know.\n@c0@"
  es: "@aBianca@bUna vez estuvimos a esto de venir a vivir aquí.\n@c0@"
  fr: "@aBianca@bÀ une époque, on a failli venir vivre ici, tu sais.\n@c0@"
  it: "@aBianca@bTempo fa, la mia famiglia pensò di trasferirsi qui...\n@c0@"
  ja: "@a@bビアンカ「私たち家族は\n\tこの町に　住んでたかも\n\t知れなかったのよ。\n@c0@"
339:
  de: "@aBianca@bEs ist nicht weit von den Bädern von Utensiel, und man kann hier prima einkaufen gehen.\n@c0@"
  en: "@aBianca@bIt's not far from the baths of Stockenbarrel, and it's great for shoppin'.\n@c0@"
  es: "@aBianca@bNo anda lejos de los baños de Clavis y está muy bien para ir de compras.\n@c0@"
  fr: "@aBianca@bÇa n'est pas très loin des bains de Saint Éloi et il y a plein de boutiques.\n@c0@"
  it: "@aBianca@bNon dista molto dai bagni termali di Aprianuam ed è un bel posto per fare acquisti.\n@c0@"
  ja: "@a@bビアンカ「ここなら\n\t山奥の村の温泉にも　通えるし\n\t買い物も　便利だしね。\n@c0@"
340:
  de: "@aBianca@bAber am Ende sind wir dann doch direkt nach Utensiel gezogen, weil eine ruhige Umgebung Papa und seiner Gesundheit zuträglicher war.\n@c0@"
  en: "@aBianca@bBut it was decided we'd move to Stockenbarrel itself in the end, 'cos it's better for Dad and his health if he's somewhere quiet.\n@c0@"
  es: "@aBianca@bPero al final nos fuimos para Clavis porque a papá le convenía un sitio con menos jaleo, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais on a finalement décidé d'aller s'installer à\r\nSaint Éloi même, parce que c'était mieux pour la\r\nsanté de papa qu'il vive dans un endroit paisible.\n@c0@"
  it: "@aBianca@bAlla fine, però, decidemmo di andare a vivere ad Aprianuam, perché è un villaggio più adatto alle condizioni di salute di mio padre.\n@c0@"
  ja: "@a@bビアンカ「だけど　お父さんの身体には\n\t静かなところが　いいって話になって\n\t山奥の村に　住むことになったの。\n@c0@"
341:
  de: "@aBianca@bÄhm, %a000090. Liebst du Nera wirklich?\n@c0@"
  en: "@aBianca@bUm, %a000090. Do you really love Nera?\n@c0@"
  es: "@aBianca@bMmm, %a000090. ¿Tú quieres a Nera de verdad?\n@c0@"
  fr: "@aBianca@bHum, %a000090...\nTu es vraiment amoureux de Neraⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, posso farti una domanda molto, ma molto personale...?\nEcco, ehm... Tu ami davvero Nera?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\t%a000090は　本当に\n\tフローラさんを　愛してる？\n@c0@"
342:
  de: "@aBianca@bHa ha ha! Ja, natürlich tust du das. Tut mir leid. Das war eine dumme Frage von mir.\n@c0@"
  en: "@aBianca@bHa ha ha! Yeah, of course you do. Sorry.\r\nThat was a weird thing of me to ask.\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! Claro que sí. Perdona.\r\nQué preguntas hago, ¿eh?\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Oui, bien sûr que oui. Pardon.\nC'était une drôle de question à te poser.\n@c0@"
  it: "@aBianca@bAh ah ah!\nSì, certo che la ami.\nSono stata una stupida a chiedertelo...\n@c0@"
  ja: "@a@bビアンカ「あはは…　そうよね。\n\tごめんね　変なこと聞いて。\n@c0@"
343:
  de: "@aBianca@bHmm, wenn Nera dich jetzt gehört hätte, wäre sie wirklich traurig, weißt du.\n@c0@"
  en: "@aBianca@bHmm. Nera would be really sad if she heard you sayin' that, you know.\n@c0@"
  es: "@aBianca@bMmm. Si te oyera decir eso se pondría muy pero que muy triste, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm. Nera serait très triste si elle apprenait\r\nce que tu dis, tu sais.\n@c0@"
  it: "@aBianca@bUhm...\nNera sarebbe non sarebbe affatto contenta di sentirti dire una cosa simile, sai?\n@c0@"
  ja: "@a@bビアンカ「……%a000090ったら。\n\tそんなこと言うと\n\tフローラさんが　悲しむわよ。\n@c0@"
344:
  de: "@aBianca@bDer Schleier ist bestimmt wunderhübsch! Nera hat echt Glück!\n@c0@"
  en: "@aBianca@bI bet that veil's well nice! Nera's so lucky...\n@c0@"
  es: "@aBianca@b¡Seguro que el velo es una pasada! Qué suerte tiene Nera.\n@c0@"
  fr: "@aBianca@bJe parie que ce voile est magnifiqueⓠ\nNera a tellement de chance...\n@c0@"
  it: "@aBianca@bScommetto che sarà un velo meraviglioso...\nNera è proprio fortunata. \n@c0@"
  ja: "@a@bビアンカ「さぞ　ステキな\n\tヴェール　なんでしょうね。\n\tフローラさんが　うらやましいな。\n@c0@"
345:
  de: "@aBianca@bLothar ist der, der für Nera schwärmt, stimmt's?\n@c0@"
  en: "@aBianca@bCrispin's the one who fancies Nera, right?\n@c0@"
  es: "@aBianca@bCrispín es el que anda detrás de Nera, ¿no?\n@c0@"
  fr: "@aBianca@bGaëtan, c'est celui qui en pince pour Nera, c'est çaⓡ\n@c0@"
  it: "@aBianca@bCandido è il tipo che ha una cotta per Nera, giusto?\n@c0@"
  ja: "@a@bビアンカ「アンディさんって\n\tたしか　フローラさんのことが\n\t大好きな人よね？\n@c0@"
346:
  de: "@aBianca@bEs klingt, als hätte er sich etwas zu viel zugemutet, weil er sie unbedingt heiraten will.\n@c0@"
  en: "@aBianca@bSounds like he pushed himself a bit too far 'cos he wants to marry her so badly. Poor thing.\n@c0@"
  es: "@aBianca@bParece que con las ganas de casarse se pasó un poco de vueltas. Pobre.\n@c0@"
  fr: "@aBianca@bOn dirait qu'il veut tellement... ardemment l'épouser qu'il a peu surestimé ses forces. Pauvre garçon.\n@c0@"
  it: "@aBianca@bCapisco che ne sia innamorato, ma rischiare la vita per sposarla mi pare un po' eccessivo!\n㈡\nSe morisse, non riuscirebbe comunque a diventare suo marito, no?!\n@c0@"
  ja: "@a@bビアンカ「フローラさんと　結婚したくて\n\tムチャしたのかしら……。\n\tかわいそうに。\n@c0@"
347:
  de: "@aBianca@bDieser Onassetti hat's aber mächtig eilig, was? Du hast ihm ja noch nicht mal erzählt, dass du den Ring gefunden hast und so.\n@c0@"
  en: "@aBianca@bThat Briscoletti's jumpin' the gun a bit, eh? You din't even tell him you found the ring or nothin'.\n@c0@"
  es: "@aBianca@bEse Rimaldi parece que tiene prisa, ¿eh? Ni siquiera le habías dicho que tenías el anillo.\n@c0@"
  fr: "@aBianca@bCet Oscuroni brûle un peu les étapes, nonⓡ\nTu ne lui as même pas encore dit que tu\navais trouvé l'anneau.\n@c0@"
  it: "@aBianca@bMister Briscoletti non perde tempo, eh?\r\nNon gli hai nemmeno detto che hai trovato l'anello!\n@c0@"
  ja: "@a@bビアンカ「まだ　水のリングを見つけたとも\n\t言ってないのに　ルドマンさんったら\n\t気が　早いのね。\n@c0@"
348:
  de: "@aBianca@bDa muss er ja recht großes Vertrauen in dich setzen, %a000090, was?\n@c0@"
  en: "@aBianca@bI suppose that means he must believe in you a fair bit, eh, %a000090?\n@c0@"
  es: "@aBianca@bEso es que confía en ti, y mucho, %a000090.\n@c0@"
  fr: "@aBianca@bÇa doit sûrement vouloir dire qu'il a drôlement confiance en toi, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bEvidentemente ha molta fiducia nelle tue capacità, %a000090, e deve aver pensato che saresti un ottimo marito per sua figlia.\n@c0@"
  ja: "@a@bビアンカ「でも　それだけ　%a000090が\n\t信頼されてるってことかしら。\n@c0@"
349:
  de: "@aBianca@bWas soll das denn heißen? Glaubst du, Nera liebt einen anderen?\n@c0@"
  en: "@aBianca@bWhat d'you suppose that means? Do you think Nera loves someone else?\n@c0@"
  es: "@aBianca@b¿Qué crees que quiere decir? ¿Crees que a Nera le gusta otro?\n@c0@"
  fr: "@aBianca@bÇa veut dire quoi, à ton avisⓡ Tu crois que Nera aime quelqu'un d'autreⓡ\n@c0@"
  it: "@aBianca@bCosa intendeva quella tipa?\nNon è che per caso Nera è innamorata di qualcun altro, eh?\n@c0@"
  ja: "@a@bビアンカ「フローラさんが　悩んでる？\n\tそれって　他に　好きな人が\n\tいるとか？\n@c0@"
350:
  de: "@aBianca@bOder vielleicht will sie dir nur nicht weh tun. Hm. Ich frage mich, was sie damit wohl sagen wollte.\n@c0@"
  en: "@aBianca@bOr maybe she just dun't want you to get hurt.\r\nHm, I wonder what it is that's on her mind.\n@c0@"
  es: "@aBianca@bO quizá es que no quiere que te pase nada.\r\nA saber qué tiene esa en la cabeza.\n@c0@"
  fr: "@aBianca@bOu peut-être qu'elle ne veut simplement pas que tu sois blessé. Mmm, je me demande ce qu'elle pense.\n@c0@"
  it: "@aBianca@bMa no! Cosa vado mai a pensare?! Nera non è mica stupida: nessuna donna sana di mente rinuncerebbe mai a un ⓕbocconcinoⓖ come te... Wah ah ah!\n@c0@"
  ja: "@a@bビアンカ「それとも　ステキな%a000090に\n\tケガを　させたくないから……？\n\tう～ん　どういう悩みなのかしら。\n@c0@"
351:
  de: "@aBianca@bIch glaube, die verkaufen hier nicht bloß Alkohol. Die schenken noch ganz andere komische Sachen aus.\n@c0@"
  en: "@aBianca@bI dun't think it's just booze they have on sale here. They have some funny other drinks too.\n@c0@"
  es: "@aBianca@bMe parece que aquí venden algo más que alcohol. También tienen otras bebidas de lo más peculiares, ¿sabes?\n@c0@"
  fr: "@aBianca@bGaëtan et Nera sont des amis d'enfance,\nn'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bVorrei qualcosa di fresco.\nMagari un succo di frutta con ghiaccio...\n@c0@"
  ja: "@a@bビアンカ「このあたりの酒場では\n\tお酒だけでなく　変わった飲み物も\n\t出しているらしいわ。\n@c0@"
352:
  de: "@aBianca@bLothar und Nera sind Kindheitsfreunde, nicht?\n@c0@"
  en: "@aBianca@bCrispin and Nera are childhood friends, en't they?\n@c0@"
  es: "@aBianca@bCrispín y Nera son amigos desde niños, ¿no?\n@c0@"
  fr: "@aBianca@bJ'imagine que c'est bien naturel qu'elle ait peur\r\nqu'il soit blessé, dans ce cas.\n@c0@"
  it: "@aBianca@bCandido e Nera sono amici d'infanzia, vero?\n@c0@"
  ja: "@a@bビアンカ「そういえば\n\tアンディさんと　フローラさんは\n\t幼なじみの関係　なんだっけ？\n@c0@"
353:
  de: "@aBianca@bDa ist es wohl nur natürlich, dass sie sich Sorgen macht, wenn er verletzt wird.\n@c0@"
  en: "@aBianca@bI suppose it's only natural she'd be worried about him gettin' hurt, then.\n@c0@"
  es: "@aBianca@bCómo no va a preocuparse por si le hacen daño.\n@c0@"
  fr: "@aBianca@bSi Nera va jusqu'à de telles extrémités pour s'occuper de lui, peut-être qu'elle... Non, rien.\n@c0@"
  it: "@aBianca@bAllora è naturale che Nera si preoccupi per lui.\nAnch'io sarei in ansia se un mio vecchio amico mettesse a rischio la sua vita per me. Ehm...\n@c0@"
  ja: "@a@bビアンカ「そんな人が　ケガをしたら\n\tフローラさんが　心配するのも\n\tムリはないわね。\n@c0@"
354:
  de: "@aBianca@bWenn Nera sich bei seiner Pflege so sehr engagiert, dann ist sie vielleicht... Ach, nein, schon gut.\n@c0@"
  en: "@aBianca@bIf she's goin' to such lengths to take care of him, maybe Nera... Never mind.\n@c0@"
  es: "@aBianca@bSi Nera se preocupa tanto por cuidarlo quizá es que... Da igual...\n@c0@"
  fr: "@aBianca@bOn dirait qu'il n'y pas que ses brûlures qui font souffrir Gaëtan, heinⓡ\n@c0@"
  it: "@aBianca@bNera ha trascorso molto tempo accanto a Candido...\nNon sarà mica che lei...?\nE lui...?\n㈡\nAh, sciocchezze!\nCerte cose non dovrei nemmeno pensarle!\n@c0@"
  ja: "@a@bビアンカ「そんなになるまで\n\t看病するなんて\n\tフローラさんって……。\n@c0@"
355:
  de: "@aBianca@bSieht so aus, als seien die Verbrennungen nicht das Einzige, was Lothar Schmerzen bereitet, was?\n@c0@"
  en: "@aBianca@bLooks like the burns en't the only thing causin' Crispin some pain, eh?\n@c0@"
  es: "@aBianca@bParece que las quemaduras no eran lo único que le dolía al Crispín, ¿eh?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Ça fait un chocⓠ Comment peut-elle être aussi polie avec ses clients et aussi désagréable avec son mari l'instant d'aprèsⓡⓐ\n@c0@"
  it: "@aBianca@bA quanto pare le scottature di Candido sono molto più profonde di quanto pensassimo, eh?\n㈡\nOh, santa dea! Non volevo mancare di rispetto a quel poverino!\n@c0@"
  ja: "@a@bビアンカ「アンディさんを　\n\t苦しめてるのは　ヤケドの\n\t痛みだけじゃなさそうね……。\n@c0@"
356:
  de: "@aBianca@bDu meine Güte! War das ein Schock! Wie kann sie denn so höflich zu ihren Kunden sein und gleichzeitig so gemein zu ihrem Mann?\n@c0@"
  en: "@aBianca@bBlimey! That was a bit of a shock! How can she be so polite to her customers in one breath and so rotten to her husband the next!?\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Pero qué susto! ¿Cómo puede ser tan educada con sus clientes y volverse una mala pécora así con su marido?\n@c0@"
  fr: "@aBianca@bJ'imagine que c'est leur manière de se répartir les tâches. Mais c'est aussi agréable quand une femme prépare à dîner à son mari de temps en temps, nonⓡ\n@c0@"
  it: "@aBianca@bMa come fa a essere tanto gentile con i suoi clienti e, il momento successivo, così acida e arrogante con il marito?!\n@c0@"
  ja: "@a@bビアンカ「あ～　びっくりした。\n\tお客さんには　ていねいなのに\n\tダンナさんには　あんな言い方なのね。\n@c0@"
357:
  de: "@aBianca@bTja, das klingt doch fair. Es ist aber auch schön, wenn eine Frau ab und an für ihren Mann das Essen kocht, oder?\n@c0@"
  en: "@aBianca@bFair enough, I s'pose. It's quite nice when a wife makes her husband dinner every now and then too, though, eh?\n@c0@"
  es: "@aBianca@bMe parece bien. Aunque no está de más que una mujer le haga a su marido la cena de vez en cuando, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère trouver un jour quelqu'un comme ça\r\nà épouser. Mais ce n'est pas demain la veille,\r\nj'en suis sûre.\n@c0@"
  it: "@aBianca@bQuesta è l'emancipazione femminile, caro il mio %a000090!\n㈡\nFino a qualche tempo fa, la moglie era costretta a stare in casa, ma i tempi stanno cambiando in fretta!\n@c0@"
  ja: "@a@bビアンカ「ああいう形も　アリだけど\n\t私は　やっぱり　ダンナさんに\n\tごはんを　作ってあげるのがいいな。\n@c0@"
358:
  de: "@aBianca@bIch hoffe, eines Tages finde ich den Richtigen. Aber das ist sicher noch lange hin.\n@c0@"
  en: "@aBianca@bI hope I manage to find someone like that to marry one day. It's a long way off yet, though, I'm sure.\n@c0@"
  es: "@aBianca@bEspero encontrar algún día alguien así para casarme. Aunque para eso falta un montonazo, ya verás.\n@c0@"
  fr: "@aBianca@bJe me demande s'il aurait vraiment été autorisé\r\nà épouser Nera s'il avait trouvé l'anneau.\n@c0@"
  it: "@aBianca@bUn giorno anch'io troverò la persona con cui vivere felice per il resto della mia vita. Temo, però, che quel giorno sia ancora molto lontano...\n㈡\nSpero di essere ancora viva quando arriverà!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「私も　いつか　そんな人と\n\t結婚できるかしら……。　うふふ。\n\tまだ　とうぶん　先でしょうけどね。\n@c0@"
359:
  de: "@aBianca@bOb er Nera wohl wirklich hätte heiraten dürfen, wenn er den Ring gefunden hätte?\n@c0@"
  en: "@aBianca@bI wonder if he would've really bin allowed to marry Nera if he'd have found the ring.\n@c0@"
  es: "@aBianca@bNo sé si de verdad le hubieran dejado casarse con Nera de haber encontrado él los anillos.\n@c0@"
  fr: "@aBianca@bMieux vaut ne pas y penserⓠ Heureusement pour elle que les choses n'ont pas tourné de cette manière.\n@c0@"
  it: "@aBianca@bScommetto che mister Fosconi non gli avrebbe concesso di sposare Nera nemmeno se quel tipo gli avesse portato dieci anelli!\n@c0@"
  ja: "@a@bビアンカ「リングを　持ってこられれば\n\t本当に　あんな　おじさんでも\n\t結婚できたのかしら？\n@c0@"
360:
  de: "@aBianca@bDas mag man sich ja gar nicht vorstellen! Zum Glück für sie ist es ja nun anders ausgegangen.\n@c0@"
  en: "@aBianca@bIt dun't bear thinkin' about! Lucky for her it din't turn out that way, anyhow.\n@c0@"
  es: "@aBianca@b¡No quiero ni pensarlo! Suerte para ella que no fuese así, y ya está, ¿sabes?\n@c0@"
  fr: "@aBianca@bCette église est si grande et si belleⓠ\n@c0@"
  it: "@aBianca@bTutto sommato, a Nera è andata di lusso.\nUh, che malalingua che sono!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「う～ん…　とりあえず\n\tフローラさんが　かわいそうなことに\n\tならなくて　良かったわよね。\n@c0@"
361:
  de: "@aBianca@bDie Kirche hier ist so groß und so schön!\n@c0@"
  en: "@aBianca@bThe church here is so huge and beautiful!\n@c0@"
  es: "@aBianca@b¡Qué bonita y qué grande es la iglesia de aquí!\n@c0@"
  fr: "@aBianca@bC'est vraiment splendide. J'espère pouvoir me marier dans un endroit comme ça, un jour.\n@c0@"
  it: "@aBianca@bQuesta chiesa è bellissima!\n@c0@"
  ja: "@a@bビアンカ「この町の教会は\n\tとっても　大きいし　ステキね。\n@c0@"
362:
  de: "@aBianca@bSie gefällt mir wirklich gut. Wenn ich mal heirate, dann hoffentlich in so einer Kirche.\n@c0@"
  en: "@aBianca@bIt really is lovely. I hope I can get married in a place like that.\n@c0@"
  es: "@aBianca@bEs un encanto. Me gustaría casarme en un sitio así, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe monsieur Oscuroni doit vraiment être plein\naux as pour posséder une résidence secondaire\nà deux pas de la maison où il vitⓠ\n@c0@"
  it: "@aBianca@bÈ davvero stupenda! Mi piacerebbe sposarmi qui, quando arriverà il giorno delle mie nozze!\r\nAmmesso che arrivi, è ovvio...\n@c0@"
  ja: "@a@bビアンカ「いいなあ。\n\t私も　いつか　こういうところで\n\t結婚式を　あげたいな。\n@c0@"
363:
  de: "@aBianca@bDieser Onassetti hat sicher Geld wie Heu, wenn er nur einen Steinwurf von seinem Heim ein Ferienhaus unterhält!\n@c0@"
  en: "@aBianca@bThat Briscoletti bloke must be loaded to have\r\na holiday home within spittin' distance of his\r\nactual house!\n@c0@"
  es: "@aBianca@b¡Ese Rimaldi debe de estar forrado para tener una casa de vacaciones al lado de la de diario!\n@c0@"
