  it: "@aRobert@bCi servono le prove della colpevolezza della falsa Regina Madre. Dobbiamo dimostrare che c'è lei dietro tutte le sofferenze patite da Coburg...\n@c0@"
  ja: "@a@bヘンリー「それは　すべて　ニセ太后が\n\tやったことだって　言っても\n\tなっとく　しないだろうな。\n@c0@"
108:
  de: "@aHarry@bWir müssen einfach ihre wahre Identität enthüllen und all dem ein Ende setzen. Dann können wir den alten Mann retten.\n@c0@"
  en: "@aHarry@bWe just have to reveal her true identity and put an end to all this. Then we can rescue the old man.\n@c0@"
  es: "@aFroilán@bDebemos revelar su verdadera identidad y poner fin a todo esto. Entonces podremos rescatar al anciano.\n@c0@"
  fr: "@aHarry@bNous devons seulement révéler sa véritable identité et mettre un terme à cette mascarade. Ensuite, nous pourrons sauver ce vieil homme.\n@c0@"
  it: "@aRobert@bSe vogliamo salvare il mio Regno dobbiamo smascherare quella maledetta strega!\nDopo penseremo a liberare quell'uomo...\n@c0@"
  ja: "@a@bヘンリー「とにかく　今は\n\tニセモノの正体を　あばいてやろうぜ。\n\tじいさんを助けるのは　それからだ。\n@c0@"
109:
  de: "@aMaria@bDieser arme Mann! Seit Jahr und Tag sitzt er hier unten im Dunkeln.\n@c0@"
  en: "@aMaria@bThat poor man, being stuck down here in the dark all those years.\n@c0@"
