  ja: "@a@bマリア「私も　妹ができたみたいで\n\tそれが　うれしいんです。\n\t私には　兄しかいませんでしたから…。\n@c0@"
33:
  de: "@aHarry@bEs ist so schön, Maria wiederzusehen!\nAber ich bin doch etwas eifersüchtig, weil sie dich vor mir genannt hat.\n@c0@"
