  fr: "@aMaria@bCette petite fille semble vraiment me considérer comme sa grande sœur.\n@c0@"
  it: "@aMaria@bQuella ragazza mi considera quasi una sorella maggiore...\n@c0@"
  ja: "@a@bマリア「あの子　私のことを　\n\t本当の姉のように　\n\tしたってくれているんですよ。\n@c0@"
32:
  de: "@aMaria@bEs ist schön, plötzlich zu einer kleinen Schwester zu kommen. Ich hatte bisher nur einen Bruder.\n@c0@"
