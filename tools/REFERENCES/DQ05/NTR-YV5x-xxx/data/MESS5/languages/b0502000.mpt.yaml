0:
  de: "@aHarry@bDer Händler muss das Buch gemeint haben, das den geheimnisvollen Spiegel erwähnt. Das ist auf jeden Fall ein seltsamer Gegenstand.\n@c0@"
  en: "@aHarry@bThat trader must've been talking about the book that mentions the mysterious mirror. It certainly is a curiosity, that's for sure.\n@c0@"
  es: "@aFroilán@bEse comerciante hablaría del libro que menciona el espejo misterioso. Es una cosa curiosa, eso seguro.\n@c0@"
  fr: "@aHarry@bCe marchand devait parler du livre mentionnant le mystérieux miroir. C'est une curiosité, en effet.\r\nC'est le moins qu'on puisse dire.\n@c0@"
  it: "@aRobert@bForse quel mercante parlava del libro in cui è citato lo specchio misterioso... Ma certo! Lo specchio è senz'altro un oggetto particolare, no?!\n@c0@"
  ja: "@a@bヘンリー「あの商人が　言ってる本って\n\tふしぎな鏡の本のことかな…\n\tふ～ん　あの本って　めずらしいんだ。\n@c0@"
1:
  de: "@aHarry@bSie ist nicht die Einzige, die sich rechtzeitig aus dem Staub gemacht hat. Man hat den Eindruck, die halbe Einwohnerschaft sei geflüchtet.\n@c0@"
  en: "@aHarry@bShe's not the only one who got out while she could. This place feels like it's half empty nowadays.\n@c0@"
  es: "@aFroilán@bNo es la única que se marchó mientras podía. Parece que se ha ido todo el mundo.\n@c0@"
  fr: "@aHarry@bElle n'est pas la seule à être partie quand il en était encore temps. Cet endroit semble à moitié vide, aujourd'hui.\n@c0@"
  it: "@aRobert@bNon è certo l'unica ad essersene andata via da Coburg... Un tempo qui c'era il doppio degli abitanti che ci sono oggi.\n@c0@"
  ja: "@a@bヘンリー「ほかにも　出かせぎに\n\t行ってる人が　いるんだろうな。\n\t……城下町が　さびしくなるワケだ。\n@c0@"
2:
  de: "@aHarry@bDas muss ein Teleportal sein. Eine dieser seltsamen Vorrichtungen, mit denen man rasch weite Strecken überwinden kann.\n@c0@"
  en: "@aHarry@bThat must be a teleportal. They're curious things that allow you to travel quickly between two far away places.\n@c0@"
  es: "@aFroilán@bDebe de ser un portal de teletransporte. Son cosas curiosas que te permiten viajar rápidamente entre dos puntos lejanos.\n@c0@"
  fr: "@aHarry@bÇa doit être un téléportail. Ce sont de drôles de passages qui permettent de voyager rapidement\r\nd'un endroit à un autre.\n@c0@"
  it: "@aRobert@bQuello dev'essere un portale di trasporto.\n㈡\nI portali di trasporto sono ingegnosi strumenti che permettono di raggiungere rapidamente luoghi distanti l'uno dall'altro.\n@c0@"
  ja: "@a@bヘンリー「あれは　旅のトビラだな。\n\tはなれた　ふたつの場所を　自由に\n\t行き来できるって　シロモノなんだぜ。\n@c0@"
3:
  de: "@aHarry@bDas erinnert mich an etwas, was ich einmal in einem alten Buch gelesen habe, über Reisen von einem Schloss in ein fernes Land mit einem Teleportal.\n@c0@"
  en: "@aHarry@bIt reminds me of something I read once in an old book about travelling through a teleportal from the castle to another land.\n@c0@"
  es: "@aFroilán@bMe recuerda a algo que leí en un viejo libro acerca de un viaje por un portal desde el castillo a otra tierra.\n@c0@"
  fr: "@aHarry@bÇa me rappelle quelque chose que j'ai lu un jour\r\ndans un vieux livre et qui parlait de voyager du château vers un autre pays grâce à un téléportail.\n@c0@"
  it: "@aRobert@bOra che ci penso, una volta ho letto qualcosa a proposito di un portale di trasporto che portava dal castello a una terra lontana...\n@c0@"
  ja: "@a@bヘンリー「はるか昔　ウチの城から\n\t旅の扉で旅立った人が　いるなんて\n\t歴史のロマンを感じさせるよな。\n@c0@"
4:
  de: "@aHarry@bAch, tut mir leid! Ich fasle ohne Ende!\n@c0@"
  en: "@aHarry@bSorry! Listen to me waffling away!\n@c0@"
  es: "@aFroilán@b¡Lo siento! ¡No digo más que tonterías!\n@c0@"
  fr: "@aHarry@bDésoléⓠ Je suis en train de parler pour ne rien direⓠ\n@c0@"
  it: "@aRobert@bScusami...\nStavo pensando ad alta voce...\n@c0@"
  ja: "@a@bヘンリー「……おっと　こりゃ\n\t似合わないこと言っちまったかな？\n@c0@"
5:
  de: "@aMaria@bIch hatte ja keine Ahnung, dass es so nahe bei dem Stift einen solchen Ort gibt.\n@c0@"
  en: "@aMaria@bI had no idea such a place existed so close to\r\nthe abbey.\n@c0@"
  es: "@aMaría@bNo tenía ni idea de que tan cerca de la abadía hubiera un lugar así.\n@c0@"
  fr: "@aMaria@bJ'ignorais totalement qu'un tel endroit existait aussi près de l'abbaye.\n@c0@"
  it: "@aMaria@bMa tu guarda!\nNon immaginavo che vicino all'Abbazia ci fosse un posto del genere!\n@c0@"
  ja: "@a@bマリア「修道院の近くに\n\tこんな　ほこらがあるなんて\n\t私　ぜんぜん　知りませんでした。\n@c0@"
6:
  de: "@aHarry@bJetzt, da wir den Spiegel des Ra haben, sollten wir uns auf den Weg machen.\n@c0@"
  en: "@aHarry@bWe should get going now that we have Ra's mirror.\n@c0@"
  es: "@aFroilán@bAhora que tenemos el espejo de Ra deberíamos ponernos en marcha.\n@c0@"
  fr: "@aHarry@bNous devrions repartir, maintenant que nous avons le miroir de Râ.\n@c0@"
  it: "@aRobert@bOra che abbiamo lo specchio di Ra, possiamo anche andarcene.\n@c0@"
  ja: "@a@bヘンリー「ラーの鏡も　手に入れたし\n\t手っ取り早く　ここから帰ろうぜ。\n@c0@"
7:
  de: "@aHarry@bDas Volk von Tifortu soll nicht einen Moment länger leiden!\n@c0@"
  en: "@aHarry@bThe people of Coburg mustn't be left to suffer a moment longer!\n@c0@"
  es: "@aFroilán@b¡El pueblo de Trastámara no debe seguir sufriendo ni un día más!\n@c0@"
  fr: "@aHarry@bNous ne devons pas laisser le peuple de Cobourg souffrir plus longtempsⓠ\n@c0@"
  it: "@aRobert@bPiù in fretta torneremo a casa, prima la gente di Coburg smetterà di soffrire!\n@c0@"
  ja: "@a@bヘンリー「今　この時にも\n\tラインハットの国民たちは\n\t悪政に　苦しんでるんだからな。\n@c0@"
8:
  de: "@aMaria@bStell dir nur vor, die weite Strecke nach Tifortu in einem kurzen Moment zurückzulegen!\n@c0@"
  en: "@aMaria@bFancy being able to travel all the way to Coburg in an instant!\n@c0@"
  es: "@aMaría@b¡Está bien esto de poder viajar a Trastámara en un instante!\n@c0@"
  fr: "@aMaria@bC'est drôle de pouvoir rejoindre Cobourg en une fraction de secondeⓠ\n@c0@"
  it: "@aMaria@bIncredibile...!\nBasta un attimo per raggiungere Coburg!\n@c0@"
  ja: "@a@bマリア「このほこらから\n\tラインハットのお城へ\n\t一瞬で　行けるなんて……\n@c0@"
9:
  de: "@aMaria@bDieses Teleportal ist so komfortabel... und so bizarr! Vielleicht ist es das Werk der Göttin.\n@c0@"
  en: "@aMaria@bThis teleportal is so convenient...and so bizarre! Maybe it's the work of the Goddess. \n@c0@"
  es: "@aMaría@bEste portal es muy cómodo... ¡y muy extraño! Quizá sea obra de la Diosa.\n@c0@"
  fr: "@aMaria@bCe téléportail est si pratique... et si étrangeⓠ\nPeut-être que c'est une œuvre de la Déesse.\n@c0@"
  it: "@aMaria@bQuesto portale di trasporto è davvero prodigioso!\nChissà se lo ha creato la dea o se è frutto dell'ingegno degli uomini...\n@c0@"
  ja: "@a@bマリア「なんて　便利……\n\tいえ　ふしぎなことでしょう。\n\t神の　みわざ　なのかしら？\n@c0@"
10:
  de: "@aHarry@bWenn er uns nicht durchlässt, dann können wir wohl nichts tun. Gehen wir weiter, %a000090!\n@c0@"
  en: "@aHarry@bIf he won't let us pass, then I suppose there's nothing we can do. Let's move on, %a000090!\n@c0@"
  es: "@aFroilán@bSi no nos deja pasar no hay nada que hacer. ¡Vamos, %a000090!\n@c0@"
  fr: "@aHarry@bS'il refuse de nous laisser passer, nous ne pouvons rien y faire. Allons-nous-en, %a000090ⓠ\n@c0@"
  it: "@aRobert@bNon perdiamo tempo a discutere, %a000090!\nDai, proseguiamo.\n@c0@"
  ja: "@a@bヘンリー「通してくれないんじゃ\n\tしかたないな……。\n\t%a000090　ほかへ行こうぜ！\n@c0@"
11:
  de: "@aHarry@bAlso dürfen wir nachts nicht passieren. Ach, was soll's. Dann kommen wir eben ein andermal wieder.\n@c0@"
  en: "@aHarry@bSo we're not allowed to pass at night. Oh well. We'll have to come back another time.\n@c0@"
  es: "@aFroilán@bAsí que no se nos permite pasar de noche. Vaya. Tendremos que volver en otro momento.\n@c0@"
  fr: "@aHarry@bAlors comme ça, on n'a pas le droit de passer de nuit. Bon très bien. Nous reviendrons une autre fois.\n@c0@"
  it: "@aRobert@bE perché mai non è possibile passare di notte?\nAh, non importa...\nTorneremo un'altra volta.\n@c0@"
  ja: "@a@bヘンリー「夜は　通してくれないのか。\n\tしかたないな…　出なおそうぜ。\n@c0@"
12:
  de: "@aMaria@bDieser alte Mann muss ein wenig einsam sein, so ganz allein hier draußen.\n@c0@"
  en: "@aMaria@bThat old man must be a bit lonely, stuck out here all on his own.\n@c0@"
  es: "@aMaría@bEse anciano debe de sentirse bastante solo, ahí plantado.\n@c0@"
  fr: "@aMaria@bCe vieil homme doit se sentir un peu seul, coincé ici sans personne.\n@c0@"
  it: "@aMaria@bQuel poveretto se ne sta lì tutto da solo...\nDeve sentirsi molto triste...\n@c0@"
  ja: "@a@bマリア「あのおじいさん\n\tひとりきりで　こんな所にいて\n\tさびしくないのかしら？\n@c0@"
13:
  de: "@aMaria@bWenn er nur zum Stift gehen würde, da würde er jede Menge Leute finden, mit denen er ein Schwätzchen halten kann.\n@c0@"
  en: "@aMaria@bIf only he'd drop in at the abbey, there'd be plenty of people there he could have a chat with.\n@c0@"
  es: "@aMaría@bSi fuera a la abadía tendría mucha gente con la que hablar.\n@c0@"
  fr: "@aMaria@bSi seulement il allait faire un tour à l'abbaye,\r\nil y rencontrerait plein de monde avec qui discuter.\n@c0@"
  it: "@aMaria@bSe andasse all'Abbazia, potrebbe scambiare quattro chiacchiere con qualcuno. Scommetto che non gli dispiacerebbe un po' di compagnia!\n@c0@"
  ja: "@a@bマリア「修道院まで　来てくだされば\n\t話し相手くらいには\n\tなれるんですけれど……。\n@c0@"
14:
  de: "@aHarry@bEs ist schön, einen Ort zu haben, an dem man so willkommen ist, findest du nicht, %a000090?\n@c0@"
  en: "@aHarry@bIt's nice to have a place where we're made to feel so welcome, don't you think, %a000090?\n@c0@"
  es: "@aFroilán@bEs agradable tener un lugar donde nos hacen sentir bienvenidos, ¿eh, %a000090?\n@c0@"
  fr: "@aHarry@bC'est agréable d'avoir un endroit où l'on se sent\nle bienvenu, tu ne trouves pas, %a000090ⓡ\n@c0@"
  it: "@aRobert@bÈ bello avere un posto dove si sa di essere sempre i benvenuti...\n@c0@"
  ja: "@a@bヘンリー「オレたちを　\n\tかんげいしてくれる場所があるって\n\tうれしいな　%a000090。\n@c0@"
15:
  de: "@aHarry@bTut mir leid, %a000090. Eigentlich wollten wir ja deine Mutter suchen, und nun habe ich dich vorerst ganz davon abgebracht.\n@c0@"
  en: "@aHarry@bSorry, %a000090. We're supposed to be looking for your mother, and yet I've gone and distracted you with this instead.\n@c0@"
  es: "@aFroilán@bLo siento, %a000090. Deberíamos estar buscando a tu madre y te distraigo con esto.\n@c0@"
  fr: "@aHarry@bDésolé, %a000090. Nous sommes censés rechercher ta mère, et moi, je te distrais avec tout ça.\n@c0@"
  it: "@aRobert@bScusami, %a000090.\nDovremmo andare in cerca di tua madre, e invece ti sto facendo perdere un sacco di tempo...\n@c0@"
  ja: "@a@bヘンリー「すまないな…　%a000090。\n\t母親をさがす旅があるのに\n\tオレの方を　手伝ってもらって…。\n@c0@"
16:
  de: "@aHarry@bIch hätte mir nie träumen lassen, dass wir am Ende mit Maria zum Turm gehen würden.\n@c0@"
  en: "@aHarry@bI never imagined we'd end up going to the tower with Maria.\n@c0@"
  es: "@aFroilán@bNunca imaginé que terminaría yendo a la torre con María.\n@c0@"
  fr: "@aHarry@bJe n'aurais jamais imaginé que nous finirions\r\npar aller dans la tour avec Maria.\n@c0@"
  it: "@aRobert@bNon avrei mai immaginato che saremmo andati alla torre con Maria...\n@c0@"
  ja: "@a@bヘンリー「マリアといっしょに\n\t神の塔へ　行くことになるなんて\n\t思いもかけなかったな。\n@c0@"
17:
  de: "@aHarry@bTja, eigentlich sind Nonnen doch auch eine Art Mönche. Vielleicht sollten wir sie nach dem Turm fragen.\n@c0@"
  en: "@aHarry@bI suppose nuns are basically the same as monks really. Maybe we should ask them about the tower.\n@c0@"
  es: "@aFroilán@bSupongo que las monjas son básicamente siervas de la Diosa. Podríamos preguntarles acerca de la torre.\n@c0@"
  fr: "@aHarry@bJe suppose que les religieuses et les moines, c'est\r\nà peu près la même chose. On devrait peut-être leur poser des questions sur la tour.\n@c0@"
  it: "@aRobert@bLe suore sono persone di chiesa proprio come i monaci...\r\nPotremmo chiedere a loro informazioni sulla torre!\n@c0@"
  ja: "@a@bヘンリー「そういえば…\n\t修道女も　修道僧なんだよな。\n\tあの塔のこと　聞いてみようぜ。\n@c0@"
18:
  de: "@aMaria@bTja, damit wäre mein Anteil hierbei wohl erledigt. Aber ich würde gern bei euch bleiben, bis ihr findet, weswegen ihr gekommen seid. Wenn es euch recht ist.\n@c0@"
  en: "@aMaria@bI suppose that's my part in this done with. But I'd like to stay with you until you find what you came for, if that's alright.\n@c0@"
  es: "@aMaría@bSupongo que mi papel ya ha terminado. Pero me gustaría quedarme con vosotros hasta que encontréis lo que buscáis, si no os importa.\n@c0@"
  fr: "@aMaria@bJ'imagine que j'ai rempli mon rôle.\n㈡\nMais j'aimerais beaucoup rester avec vous jusqu'à ce que vous trouviez ce que vous cherchez, si vous le voulez bien.\n@c0@"
  it: "@aMaria@bIl mio compito si è concluso.\r\nSe non vi dispiace, però, vorrei rimanere con voi finché non avrete trovato ciò che state cercando...\n@c0@"
  ja: "@a@bマリア「あ　あの…\n\t私　もう　用済みですけど…　でも\n\t最後まで　見とどけさせてください。\n@c0@"
19:
  de: "@aHarry@bNatürlich. Du warst uns eine große Hilfe, Maria. Es wäre uns eine Ehre, wenn du bei uns bliebest. Nicht wahr, %a000090?\n@c0@"
  en: "@aHarry@bOf course. You've been a great help to us, Maria. We'd be honoured to have you. Right, %a000090?\n@c0@"
  es: "@aFroilán@bClaro. Nos has sido de gran ayuda, María. Sería un honor que nos acompañaras. ¿Verdad, %a000090?\n@c0@"
  fr: "@aHarry@bBien sûr. Tu nous as été d'une aide précieuse, Maria.\nNous serions honorés de ta présence.\nN'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aRobert@bPer me va più che bene, Maria! Finora ci sei stata di grande aiuto, e mi farebbe piacere se restassi con noi. Tu che ne dici, %a000090?\n@c0@"
  ja: "@a@bヘンリー「もちろんだよ。\n\t協力してくれた　マリアには\n\tその権利があるさ。　なっ　%a000090。\n@c0@"
20:
  de: "@aHarry@bEs ist schwer, sich vorzustellen, dass einer von uns ein guter Ehemann sein könnte, wo wir beide doch bis vor kurzem noch Sklaven waren!\n@c0@"
  en: "@aHarry@bIt's hard to imagine either of us as good husbands when you think we were both slaves until just recently!\n@c0@"
  es: "@aFroilán@b¡Cuesta imaginarnos como buenos maridos, cuando hasta hace poco éramos esclavos!\n@c0@"
  fr: "@aHarry@bDifficile de nous imaginer comme de bons maris quand on pense qu'on était encore esclaves il y a peuⓠ\n@c0@"
  it: "@aRobert@bDa schiavo a uomo sposato, eh?\nBeh, non è che cambi molto!\n㈡\nDopotutto, anche il matrimonio è una prigione dalla quale è difficile scappare!\nAh ah ah!\n@c0@"
  ja: "@a@bヘンリー「いい亭主になる　だなんて\n\tこの前まで　ドレイをやってた\n\tオレたちには　ピンとこないよな。\n@c0@"
21:
  de: "@aHarry@bAber wir wissen, wie elend man sich fühlt, wenn einem jemand Gewalt antut, also wären wir wenigstens nie so wie ihr brutaler Mann.\n@c0@"
  en: "@aHarry@bBut we know what it feels like to be miserable because of someone else's violence, so at least we'll never be like her brute of a husband.\n@c0@"
  es: "@aFroilán@bPero sabemos lo que es pasarlo mal y sufrir la violencia de otros, así que al menos nunca seremos unos maridos maltratadores.\n@c0@"
  fr: "@aHarry@bMais on sait ce que ça fait d'être malheureux à cause de la violence de quelqu'un d'autre, alors au moins, on ne ressemblera jamais à sa brute de mari.\n@c0@"
  it: "@aRobert@bScherzi a parte, abbiamo provato sulla nostra pelle cosa vuol dire essere maltrattati, e sono certo che saremo dei mariti buoni e comprensivi.\n@c0@"
  ja: "@a@bヘンリー「でも　オレたちは　暴力で\n\t押さえつけられる苦しみを知ってるから\n\tそんな亭主には　きっと　ならないぜ。\n@c0@"
22:
  de: "@aMaria@bIch finde, sie hat recht. Du würdest einen guten Ehemann abgeben, %a000090.\n@c0@"
  en: "@aMaria@bI think she's right. You would make a good husband, %a000090.\n@c0@"
  es: "@aMaría@bCreo que tiene razón. Serías un buen marido, %a000090.\n@c0@"
  fr: "@aMaria@bJe crois qu'elle a raison. Tu ferais un bon mari, %a000090.\n@c0@"
  it: "@aMaria@bPenso che abbia ragione.\nSarai un bravo marito, %a000090.\n@c0@"
  ja: "@a@bマリア「そうですね。　私も\n\t%a000090さんは　いい　だんなさまに\n\tなられると思います。\n@c0@"
23:
  de: "@aMaria@b... Oh! Und du auch, Harry! Ich wollte dich nicht übergehen.\n@c0@"
  en: "@aMaria@b...Oh! And so would you, Harry! I didn't mean to leave you out.\n@c0@"
  es: "@aMaría@b¡Oh! ¡Y tú también, Froilán! No quería dejarte fuera.\n@c0@"
  fr: "@aMaria@b... Ohⓠ Et toi aussi, Harryⓠ Je ne voulais pas te laisser de côté.\n@c0@"
  it: "@aMaria@bE sono certa che anche tu lo sarai, Robert.\nSì, ne sono convinta...\n@c0@"
  ja: "@a@bマリア「……あっ\n\tもちろん　ヘンリーさまもですわ。\n@c0@"
24:
  de: "@aHarry@bAlso wirklich! Du musst dich nicht extra bemühen, mir Komplimente zu machen, weißt du!\n@c0@"
  en: "@aHarry@bI say! There's no need to make a special effort to compliment me, you know!\n@c0@"
  es: "@aFroilán@b¡Vaya! ¡No tienes por qué esforzarte por elogiarme!\n@c0@"
  fr: "@aHarry@bBen voyonsⓠ Pas besoin de te forcer pour me faire un compliment, tu saisⓠ\n@c0@"
  it: "@aRobert@bSono felice che tu abbia la convinzione che sarò un buon marito, perché... io non ne sono affatto certo!\n@c0@"
  ja: "@a@bヘンリー「そ　そんな　取ってつけたように\n\t言ってくれなくても……。\n@c0@"
25:
  de: "@aMaria@bIch hatte mir vor einer Weile eine kleine Statue der Göttin schnitzen lassen.\n@c0@"
  en: "@aMaria@bI had a small statue of the Goddess carved for me a little while back.\n@c0@"
  es: "@aMaría@bHace un tiempo encargué que me esculpieran una estatuilla de la Diosa.\n@c0@"
  fr: "@aMaria@bIl y a peu de temps, on a sculpté une statuette de la Déesse pour moi.\n@c0@"
  it: "@aMaria@bQualche giorno fa le suore dell'Abbazia mi hanno regalato una statuetta della dea che avevano scolpito con le loro mani...\n@c0@"
  ja: "@a@bマリア「私も　この前\n\tひとつだけ　女神像を\n\t彫らせていただいたんです。\n@c0@"
26:
  de: "@aMaria@bEs hat mir solchen inneren Frieden gegeben, sie in den Händen zu halten und zu sehen, wie sie mich anlächelt.\n@c0@"
  en: "@aMaria@bIt made me feel so at peace to hold it in my hands and see Her smiling at me.\n@c0@"
  es: "@aMaría@bSostenerla en las manos y verla sonreír me hacía sentir en paz.\n@c0@"
  fr: "@aMaria@bLa tenir dans mes mains et voir la Déesse me sourire me donnait un tel sentiment de sérénité.\n@c0@"
  it: "@aMaria@bQuando la guardo mi sembra che mi sorrida...\n@c0@"
  ja: "@a@bマリア「みじゅくな　私の手の中にも\n\tおだやかな　お顔の　女神さまが現れ\n\t心が　洗われるようでした。\n@c0@"
27:
  de: "@aMaria@bIch bin ziemlich gut im Kochen und Nähen, weil ich das schon in jungen Jahren für Josef und mich machen musste.\n@c0@"
  en: "@aMaria@bI'm rather good at cooking and sewing myself, because I had to do it for Joshua and I from a young age.\n@c0@"
  es: "@aMaría@bSe me dan bien la cocina y la costura porque desde pequeña tuve que cocinar y coser para Josué y para mí.\n@c0@"
  fr: "@aMaria@bJe me débrouille plutôt bien en cuisine et en couture, car j'ai dû m'en charger pour Joshua et moi dès mon plus jeune âge.\n@c0@"
  it: "@aMaria@bSono brava a cucinare e a cucire, sai? Del resto è naturale, dato che ho dovuto prendermi cura di mio fratello Bonocore fin da quand'ero piccola...\n@c0@"
  ja: "@a@bマリア「小さい頃から　やっていたので\n\tお料理も　ぬい物も　得意なんです。\n\tなにかあったら　言ってくださいね。\n@c0@"
28:
  de: "@aHarry@bIch frage mich, warum Maria so einsam aussieht. Vielleicht deshalb, weil ich nicht in ihrer Nähe bin?\n@c0@"
  en: "@aHarry@bI wonder why Maria seems so lonely.\r\nMaybe it's because I'm not around.\n@c0@"
  es: "@aFroilán@bNo sé por qué María parece tan sola.\r\nQuizá sea porque no estoy yo.\n@c0@"
  fr: "@aHarry@bJe me demande pourquoi Maria a l'air si seule.\r\nC'est peut-être parce que je ne suis pas là.\n@c0@"
  it: "@aRobert@bChissà perché Maria si sente tanto sola...\nForse è perché non le sono accanto...?\n@c0@"
  ja: "@a@bヘンリー「マリアさんが　さみしそう？\n\tそれは　もしかして\n\tオレが　旅に出たから？\n@c0@"
29:
  de: "@aHarry@bÄhm, ach was, natürlich nicht. Das ist es bestimmt nicht. Wenn's doch nur so wäre...\n@c0@"
  en: "@aHarry@bEr, no, I'm sure that's not it.\nIf only it was, though...\n@c0@"
