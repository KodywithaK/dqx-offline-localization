  it: "@aMaria@bQuel poveretto sarà chiuso quaggiù da chissà quanti anni...\n@c0@"
  ja: "@a@bマリア「なん年もの間　こんな\n\t暗い地下牢に　入れられているなんて\n\tおかわいそうに……。\n@c0@"
110:
  de: "@aMaria@bWas für ein schrecklicher Ort, um zu sterben...\n@c0@"
  en: "@aMaria@bWhat a terrible place to die...\n@c0@"
  es: "@aMaría@bQué horrible sitio para morir...\n@c0@"
  fr: "@aMaria@bQuel endroit terrible pour mourir...\n@c0@"
  it: "@aMaria@bChe posto orribile per morire... \n@c0@"
  ja: "@a@bマリア「まあ　こんなところで\n\tお気の毒に……。\n@c0@"
111:
  de: "@aMaria@bMögen all diese armen Seelen ihren Weg von diesen dunklen Tiefen hier zum ewigen Trost der Göttin droben im Licht finden!\n@c0@"
  en: "@aMaria@bMay all these poor souls find their way from these dark depths to the eternal comfort of the Goddess on high!\n@c0@"
  es: "@aMaría@b¡Que estas pobres almas hallen su camino desde esta oscura sima hasta el eterno solaz de la Diosa!\n@c0@"
  fr: "@aMaria@bPuissent toutes ces pauvres âmes trouver leur chemin depuis ces sombres profondeurs jusqu'à la réconfortante demeure céleste de la Déesseⓠ\n@c0@"
  it: "@aMaria@bPossano queste povere anime essere accolte tra le braccia della dea misericordiosa...\n@c0@"
  ja: "@a@bマリア「この　あわれな魂が\n\tまよわず　神さまのもとへ\n\tめされますように……。\n@c0@"
112:
  de: "@aHarry@bWenn hier die Rede davon ist, jemandes Kopf auf einem Silbertablett zu servieren, dann meinen die das wahrscheinlich wörtlich!\n@c0@"
  en: "@aHarry@bWhen they talk about having someone's head on a platter around here, they probably mean it literally!\n@c0@"
  es: "@aFroilán@b¡Cuando por aquí hablan de cortar la cabeza a alguien, probablemente lo digan en serio!\n@c0@"
  fr: "@aHarry@bQuand on parle d'avoir la tête de quelqu'un par ici, j'imagine que ça doit être pris au sens littéralⓠ\n@c0@"
  it: "@aRobert@bOspiti permanenti delle prigioni o del cimitero del Regno, eh? Credo che la Regina Madre sia un po' troppo permalosa...\n@c0@"
  ja: "@a@bヘンリー「ここで言う　クビがとぶって\n\t言葉通りの意味なんだろうな。\n\t……くそっ！\n@c0@"
113:
  de: "@aHarry@bDas liegt daran, dass die falsche Witwe ihren Platz eingenommen hat. Natürlich verhält die sich ganz anders. Schließlich ist es eine ganz andere Person!\n@c0@"
  en: "@aHarry@bThat's because the fake dowager came along. It stands to reason that she's going to change because she's a different person entirely!\n@c0@"
  es: "@aFroilán@bEso es porque llegó la falsa Reina Madre. ¡Tiene sentido que cambiara, ya que es una persona diferente!\n@c0@"
  fr: "@aHarry@bTout ça est dû à l'arrivée de la fausse douairière. Ça semble logique qu'elle ait totalement changé,\npuisque ce n'était pas du tout la même personneⓠ\n@c0@"
  it: "@aRobert@bLe cose sono cambiate perché la Regina Madre non è la stessa persona!\nUna ⓕfalsaⓖ Regina Madre ha preso il suo posto!\n@c0@"
  ja: "@a@bヘンリー「そりゃあ　いつの間にか\n\tニセモノに　入れ替わってんだから\n\t人が変わるのも　当然だぜ。\n@c0@"
114:
  de: "@aHarry@bOffenbar war Wilbur im Gefängnis und hat die echte Witwe befreit.\n@c0@"
  en: "@aHarry@bIt sounds like Wilbur's been down to the jail and freed the real dowager.\n@c0@"
