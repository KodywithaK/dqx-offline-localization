  it: "@aRobert@bLa ragazza ha ragione. Dobbiamo fare in modo che non succeda nulla di male a Maria...\nHai capito, %a000090?\n@c0@"
  ja: "@a@bヘンリー「あの子のいう通りだな。\n\tマリアを連れてるんだから\n\tムリは禁物だぜ　%a000090！\n@c0@"
31:
  de: "@aMaria@bDas Mädchen scheint mich wirklich als ihre große Schwester zu betrachten.\n@c0@"
  en: "@aMaria@bThat little girl really seems to think of me as her big sister.\n@c0@"
