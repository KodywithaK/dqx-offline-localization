  it: "@aMaria@bSiete più seri.\nSembra che qualcosa vi preoccupi...\n@c0@"
  ja: "@a@bマリア「どことなく　カゲを\n\tおびられた　というか……。\n@c0@"
58:
  de: "@aHarry@bIch werde zu dir stehen, Maria! Ich werde dich mit meinem Leben schützen, jetzt und immerdar!\n@c0@"
  en: "@aHarry@bI'm going to stand by you, Maria! I'll protect you with my life, now and forever!\n@c0@"
  es: "@aFroilán@b¡Estaré junto a ti, María! ¡Te protegeré con mi vida, ahora y siempre!\n@c0@"
  fr: "@aHarry@bJe vais rester à tes côtés, Mariaⓠ Je te protégerai de ma vie, maintenant et à jamaisⓠ\n@c0@"
  it: "@aRobert@bNon temere, Maria...\r\nTi difenderò anche a costo della mia vita!\r\nResterò sempre accanto a te!\n@c0@"
  ja: "@a@bヘンリー「マリアは　オレが守るぜ！\n\tできることなら　一生　ずっと……。\n@c0@"
59:
  de: "@aMaria@bWie bitte? Was hast du gesagt, Harry?\n@c0@"
  en: "@aMaria@bSorry? What was that you just said, Harry?\n@c0@"
  es: "@aMaría@b¿Perdón? ¿Qué acabas de decir, Froilán?\n@c0@"
  fr: "@aMaria@bPardonⓡ Qu'est-ce que tu viens de dire, Harryⓡ\n@c0@"
  it: "@aMaria@bChe cosa?\nCos'hai detto, Robert?\n@c0@"
  ja: "@a@bマリア「えっ？　ヘンリーさん\n\tなにか　おっしゃいましたか？？\n@c0@"
60:
  de: "@aHarry@bÄhm... Ha ha. Schon gut. Es war nichts Wichtiges.\n@c0@"
  en: "@aHarry@bEr... Ha, ha. Don't worry. It was nothing important.\n@c0@"
  es: "@aFroilán@bEjem... Ja, ja. Da igual. No era nada.\n@c0@"
  fr: "@aHarry@bEuh... Ha ha. Non, rien. Ça n'était rien d'important.\n@c0@"
  it: "@aRobert@bEhm... Niente.\nNon era niente di importante...\n@c0@"
  ja: "@a@bヘンリー「な　なんでもないぜ。\n\tあ　あはは……。\n@c0@"
61:
  de: "@aHarry@bTja, jetzt ist Maria bei uns, da sollten wir wohl zu diesem Turm gehen.\n@c0@"
  en: "@aHarry@bWell, we have Maria with us now, so I suppose we should get along to that tower.\n@c0@"
  es: "@aFroilán@bBueno, ya tenemos a María. Deberíamos ponernos en marcha hacia esa torre.\n@c0@"
  fr: "@aHarry@bBon, nous avons Maria avec nous, maintenant. J'imagine que nous devrions nous rendre\r\nà cette tour.\n@c0@"
  it: "@aRobert@bMaria è con noi.\nPossiamo dirigerci alla torre.\n@c0@"
  ja: "@a@bヘンリー「まあ　マリアもいることだし\n\t行ってみれば　なんとかなるさ。\n@c0@"
62:
  de: "@aMaria@bIch frage mich, was die Äbtissin wohl damit gemeint hat, ⓞwer zu stolz ist, um an Dinge zu glauben, die er nicht sehen kannⓟ?\n@c0@"
  en: "@aMaria@bI wonder what the Abbess meant by ⓗthose who are too proud to believe in things they cannot seeⓘ.\n@c0@"
  es: "@aMaría@b¿Qué querría decir la abadesa con lo de ⓕLos que son demasiado soberbios para creer en aquello que no venⓖ?\n@c0@"
  fr: "@aMaria@bJe me demande ce que l'Abbesse voulait dire par ⓥceux qui sont trop fiers pour ne pas croire en ce qu'ils ne voient pasⓦ.\n@c0@"
  it: "@aMaria@bⓕChi si dimostrerà incapace di credere in ciò che non vede non verrà toccato dalla benedizione dell'onnipotenteⓖ…?\n㈡\nChissà cosa intendeva dire la madre superiora...\n@c0@"
  ja: "@a@bマリア「おのれの見たことしか　\n\t信じぬ者とは　いったい\n\tどういう意味なのでしょう？\n@c0@"
63:
  de: "@aMaria@bIch weiß, ich habe mich freiwillig für diese Aufgabe gemeldet, aber allmählich mache ich mir Sorgen, dass ich ihrer nicht gewachsen sein könnte.\n@c0@"
  en: "@aMaria@bI know I volunteered myself for this, but I'm starting to worry that I might not be worthy.\n@c0@"
  es: "@aMaría@bSé que me he presentado voluntaria, pero empiezo a temer no ser digna.\n@c0@"
  fr: "@aMaria@bJe sais que je me suis portée volontaire pour cette mission, mais je commence à me demander si j'en suis vraiment digne.\n@c0@"
  it: "@aMaria@bSo bene di essermi offerta io per questo compito, ma inizio a pensare che potrei non esserne all'altezza.\n@c0@"
  ja: "@a@bマリア「自ら　望んだことですが\n\t自分の信仰心が　ためされるようで\n\tきんちょう　しますね。\n@c0@"
64:
  de: "@aHarry@bSo lange ich ein Bett zum Schlafen habe, so lange bin ich zufrieden. Wir haben wieder einen langen Tag vor uns, %a000090!\n@c0@"
  en: "@aHarry@bAs long as I have a bed to sleep in, I'm happy. We've got another long day ahead of us, %a000090!\n@c0@"
  es: "@aFroilán@bYo me conformo con tener una cama donde dormir. ¡Tenemos otro largo día por delante, %a000090!\n@c0@"
  fr: "@aHarry@bDu moment que j'ai un lit pour dormir, je suis heureux. Une autre longue journée nous attend, %a000090ⓠ\n@c0@"
  it: "@aRobert@bAncora non mi sembra vero di essere tornato a dormire su un vero letto! Forza! Ci aspetta un'altra dura giornata, %a000090!\n@c0@"
  ja: "@a@bヘンリー「ベッドで\n\t寝られるってだけで　幸せだよな。\n\t%a000090　今日も　がんばろうぜ！\n@c0@"
65:
  de: "@aHarry@bNach dieser Rast fühle ich mich viel besser. Danke, %a000090.\n@c0@"
  en: "@aHarry@bI feel much better after that rest.\nThanks, %a000090.\n@c0@"
  es: "@aFroilán@bEl descanso me ha sentado fenomenal.\nGracias, %a000090.\n@c0@"
  fr: "@aHarry@bJe me sens beaucoup mieux après ce repos.\nMerci, %a000090.\n@c0@"
  it: "@aRobert@bAvevo proprio bisogno di riposare un po'...\n@c0@"
  ja: "@a@bヘンリー「ゆっくり　休んで\n\tけっこう　元気が出たよ。\n\t%a000090　ありがとうな。\n@c0@"
66:
  de: "@aHarry@bMal ehrlich, ich habe mich noch nicht ganz daran gewöhnt, wieder in einem Bett zu schlafen. Wahrscheinlich, weil ich so lange ein Sklave war.\n@c0@"
  en: "@aHarry@bTo tell you the truth, I'm still not quite used to sleeping in a bed again. I suppose it's because I was a slave for such a long time.\n@c0@"
  es: "@aFroilán@bPara serte sincero, aún no me he acostumbrado a dormir en una cama. Será por tanto tiempo de esclavitud.\n@c0@"
  fr: "@aHarry@bPour être honnête, je ne me suis pas encore tout\r\nà fait réhabitué à dormir dans un lit. C'est sans doute parce que j'ai été esclave très longtemps.\n@c0@"
  it: "@aRobert@bNon mi sono ancora riabituato a dormire su un letto. Dev'essere a causa degli anni trascorsi in schiavitù.\nEravamo costretti a stenderci per terra, ricordi?\n@c0@"
  ja: "@a@bヘンリー「ホント言うと　ドレイ生活が\n\t長かったせいか　まだちょっと\n\tベッドには　なれないんだよな。\n@c0@"
67:
  de: "@aHarry@bUm mich brauchst du dir keine Sorgen zu machen, %a000090. Gehen wir weiter.\n@c0@"
  en: "@aHarry@bYou don't need to worry about me, %a000090. Let's move on.\n@c0@"
  es: "@aFroilán@bNo te preocupes por mí, %a000090. Adelante.\n@c0@"
  fr: "@aHarry@bNe te fais pas de souci pour moi, %a000090.\nAllons-y.\n@c0@"
  it: "@aRobert@bNon devi preoccuparti per me, %a000090.\nDai, muoviamoci.\n@c0@"
  ja: "@a@bヘンリー「オレのことは\n\t気にしなくていいから　%a000090\n\t旅を　続けようぜ。\n@c0@"
68:
  de: "@aHarry@bEs ist Zeit, dass Tifortu aus den Wolken und zurück an die Sonne kommt! Gehen wir Wilbur suchen!\n@c0@"
  en: "@aHarry@bIt's finally time for Coburg to come out of the clouds and back into the sunshine! Let's go and find Wilbur!\n@c0@"
  es: "@aFroilán@b¡Es hora de que termine la larga noche y amanezca en Trastámara! ¡Busquemos a Leonoro!\n@c0@"
  fr: "@aHarry@bL'heure est enfin venue pour Cobourg de sortir\ndes ténèbres pour briller en plein soleilⓠ\nAllons chercher Willⓠ\n@c0@"
  it: "@aRobert@bTra poco su Coburg tornerà a splendere il sole!\nAndiamo da Fabian!\n@c0@"
  ja: "@a@bヘンリー「いよいよ　この国をおおう\n\t暗雲を　晴らす時が来たな。\n\tさあ　デールの所へ　行こうぜ！\n@c0@"
69:
  de: "@aMaria@bSchon komisch, wenn man sich vorstellt, dass Harry tatsächlich ein Prinz aus einem so riesigen Schloss ist.\n@c0@"
  en: "@aMaria@bIt's funny to think that Harry is actually a prince of such an enormous castle.\n@c0@"
  es: "@aMaría@bEs gracioso pensar en Froilán como príncipe de un castillo tan enorme.\n@c0@"
  fr: "@aMaria@bC'est amusant de se dire que Harry est en réalité le prince d'un château aussi gigantesque.\n@c0@"
  it: "@aMaria@bAncora non riesco a credere che Robert sia un principe...\n@c0@"
  ja: "@a@bマリア「ヘンリーさまは\n\tこんなに　大きなお城の\n\t王子さまだったんですよね。\n@c0@"
70:
  de: "@aMaria@bNormalerweise hätte jemand von so niedriger Herkunft wie ich nie eine Chance gehabt, sich mit ihm anzufreunden.\n@c0@"
  en: "@aMaria@bIn the normal run of things, there's no way someone as lowly as I would ever have had the chance to befriend him.\n@c0@"
  es: "@aMaría@bLo normal hubiese sido que alguien de mi humilde condición nunca hubiera podido hacerse amiga suya.\n@c0@"
  fr: "@aMaria@bDans un contexte normal, jamais une personne d'aussi basse extraction que moi n'aurait eu l'occasion de devenir amie avec lui.\n@c0@"
  it: "@aMaria@bDate le mie umili origini, mai e poi mai avrei pensato di conoscere una persona tanto altolocata...\n@c0@"
  ja: "@a@bマリア「本来なら　私なんて\n\tお目にかかることもできないでしょうに\n\tふしぎなご縁も　あるものです。\n@c0@"
71:
  de: "@aHarry@bHier sieht alles so anders aus. Aber damit ist jetzt Schluss! Wir müssen nur die falsche Witwe rauswerfen!\n@c0@"
  en: "@aHarry@bThe place looks so different. But it all ends here! All we have to do is oust that fake dowager!\n@c0@"
  es: "@aFroilán@bEsto ha cambiado mucho... ¡pero se acabó! ¡Solo hay que desenmascarar a la falsa Reina Madre!\n@c0@"
  fr: "@aHarry@bL'endroit semble si différent. Mais c'est bientôt finiⓠ\nTout ce que nous avons à faire, c'est chasser cette fausse reine douairièreⓠ\n@c0@"
  it: "@aRobert@bQui è tutto così diverso rispetto a un tempo...\nMa le cose stanno per cambiare!\nLa falsa Regina Madre ha le ore contate!\n@c0@"
  ja: "@a@bヘンリー「町も　変わっちまったが\n\tそれも　これまでだぜ。\n\tニセモノの正体さえ　あばけば……！\n@c0@"
72:
  de: "@aHarry@bJetzt kann uns keiner mehr aufhalten! Gehen wir, %a000090!\n@c0@"
  en: "@aHarry@bThere's nothing anyone can do to stop us now!\nLet's go, %a000090!\n@c0@"
  es: "@aFroilán@b¡Nadie puede detenernos!\n¡Vamos, %a000090!\n@c0@"
  fr: "@aHarry@bPlus rien ni personne ne pourra nous arrêter\nà présentⓠ Allons-y, %a000090ⓠ\n@c0@"
  it: "@aRobert@bNiente e nessuno potrà fermarci!\nAndiamo, %a000090!\n@c0@"
  ja: "@a@bヘンリー「今のオレたちは　\n\t誰にも　止められないぜ！\n\tさあ　行こう　%a000090っ！\n@c0@"
73:
  de: "@aHarry@bWir haben oft drei Tage lang nichts zu essen bekommen, damals, als wir noch Sklaven waren, weißt du noch, %a000090?\n@c0@"
  en: "@aHarry@bThere were plenty of times when we went without food for three days back when we were slaves, eh, %a000090?\n@c0@"
  es: "@aFroilán@bSiendo esclavos pasamos muchas veces tres días seguidos sin comer, ¿eh, %a000090?\n@c0@"
  fr: "@aHarry@bÇa nous est arrivé plus d'une fois de rester\ntrois jours sans manger, quand nous étions esclaves, hein, %a000090ⓡ\n@c0@"
  it: "@aRobert@bQuando eravamo schiavi, siamo rimasti anche tre o quattro giorni senza mangiare...\nTe ne ricordi, %a000090?\n@c0@"
  ja: "@a@bヘンリー「ドレイを　やってた時だって\n\t３日も　メシぬきなんてなかったぞ。\n\tなっ　%a000090。\n@c0@"
74:
  de: "@aMaria@bIch habe im Stift ein paar böse Gerüchte über Tifortu gehört, aber ich hatte ja keine Ahnung, dass es so schlimm ist.\n@c0@"
  en: "@aMaria@bI heard a few nasty rumours about Coburg back at the abbey, but I had no idea things were this bad.\n@c0@"
  es: "@aMaría@bEn la abadía oí algunos rumores desagradables acerca de Trastámara, pero no tenía ni idea de que las cosas estuviesen tan mal.\n@c0@"
  fr: "@aMaria@bJ'ai entendu de vilaines rumeurs circuler sur Cobourg quand j'étais encore à l'abbaye, mais je n'imaginais pas que la situation était aussi critique.\n@c0@"
  it: "@aMaria@bAll'Abbazia avevo sentito brutte voci riguardo a Coburg, ma non avrei mai immaginato che la situazione fosse così disperata.\n@c0@"
  ja: "@a@bマリア「この国の　悪いウワサは\n\t修道院にいても　伝わってきましたが\n\tこんなにも　ひどいなんて……。\n@c0@"
75:
  de: "@aHarry@bDa warst du aber knickrig, %a000090. Ein paar Münzen hättest du ihr doch sicher geben können?\n@c0@"
  en: "@aHarry@bThat was a bit mean, %a000090. Surely you could afford to give her a few coins?\n@c0@"
  es: "@aFroilán@bEso no ha estado bien, %a000090. Podrías haberle dado unas monedas...\n@c0@"
  fr: "@aHarry@bÇa n'était pas très gentil, %a000090.\nTu pouvais quand même te permettre de lui\ndonner quelques pièces d'or...\n@c0@"
  it: "@aRobert@bDi' un po', %a000090... Ma hai una pietra al posto del cuore, eh?! Avresti anche potuto darle qualche moneta, no? Sei un dannato taccagno!\n@c0@"
  ja: "@a@bヘンリー「%a000090は　冷たいなあ。\n\tちょっとくらい　めぐんでやっても\n\tいいんじゃないか？\n@c0@"
76:
  de: "@aMaria@bWenn ich Geld hätte, würde ich den armen Leuten hier so viel geben, wie ich nur könnte.\n@c0@"
  en: "@aMaria@bIf I had any money, I'd give as much as I could to these poor folk here.\n@c0@"
  es: "@aMaría@bSi yo tuviese dinero daría cuanto pudiera a esta pobre gente.\n@c0@"
  fr: "@aMaria@bSi j'avais de l'argent à moi, j'en donnerais autant que possible à tous ces pauvres gens.\n@c0@"
  it: "@aMaria@bSe avessi del denaro, lo userei per aiutare questa povera gente.\n@c0@"
  ja: "@a@bマリア「私が　お金を持っていれば\n\tあるだけ　あの方たちに\n\tあげられるんですけど……。\n@c0@"
77:
  de: "@aHarry@b...\n@c0@"
  en: "@aHarry@b............\n@c0@"
  es: "@aFroilán@b...\n@c0@"
  fr: "@aHarry@b............\n@c0@"
  it: "@aRobert@b...\n@c0@"
  ja: "@a@bヘンリー「……………。\n@c0@"
78:
  de: "@a@bHarry beißt sich gedankenverloren auf die Lippen.\n@c0@"
  en: "@a@bHarry is biting his lip in thought.\n@c0@"
  es: "@a@bFroilán se muerde el labio, pensativo.\n@c0@"
  fr: "@a@bHarry se mord les lèvres, l'air songeur.\n@c0@"
  it: "@a@bRobert è immerso nei suoi pensieri...\n@c0@"
  ja: "@a@bヘンリーは\nくちびるをかんで　だまっている……。\n@c0@"
79:
  de: "@aMaria@bGöttin, bitte erbarme dich dieser armen leidenden Seelen.\n@c0@"
  en: "@aMaria@bGoddess, please have mercy on these poor suffering souls.\n@c0@"
  es: "@aMaría@bDiosa, ten misericordia de estas pobres almas sufrientes.\n@c0@"
  fr: "@aMaria@bChère Déesse, aie pitié de ces pauvres âmes\r\nen souffrance.\n@c0@"
  it: "@aMaria@bDea misericordiosa, abbi pietà di queste anime in pena!\n@c0@"
  ja: "@a@bマリア「神さま　どうか\n\tあの方たちに　おじひを……。\n@c0@"
80:
  de: "@aHarry@bIch habe in meinen ersten schrecklichen Tagen als Sklave vor Hunger geweint. Es gibt nichts Schlimmeres, als kein Essen zu haben.\n@c0@"
  en: "@aHarry@bI cried with hunger in those first awful days of becoming a slave. There's nothing worse than being without food.\n@c0@"
  es: "@aFroilán@bAquellos primeros días de esclavitud lloré de hambre. No hay nada peor que no tener qué llevarse a la boca.\n@c0@"
  fr: "@aHarry@bJ'ai pleuré de faim lors de mes tout premiers jours d'esclavage. C'était horrible. Il n'y a rien de plus terrible que manquer de nourriture.\n@c0@"
  it: "@aRobert@bI miei primi giorni da schiavo furono orribili...\nNon facevo altro che piangere per la fame che mi attanagliava lo stomaco...\n@c0@"
  ja: "@a@bヘンリー「オレも　ドレイになってすぐは\n\t空腹に　泣かされたよ。\n\t腹がへるって　本当に　つらいよなあ。\n@c0@"
81:
  de: "@aMaria@bDieser arme Junge. Er sieht so schwach und dünn aus...\n@c0@"
  en: "@aMaria@bThat poor boy. He looks so weak and thin...\n@c0@"
  es: "@aMaría@bPobre chico. Parece tan débil y famélico...\n@c0@"
  fr: "@aMaria@bPauvre garçon. Il semble si maigre et si faible...\n@c0@"
  it: "@aMaria@bCredo che quel ragazzino non mangi da giorni... \n@c0@"
  ja: "@a@bマリア「あの男の子……\n\tあんなに　やせて　かわいそうに。\n@c0@"
82:
  de: "@aHarry@bEin Ungeheuer, ausgerechnet im Schlosshof! Ich war völlig überrumpelt ⓚⓛ ich hatte es erst für einen Hund gehalten!\n@c0@"
  en: "@aHarry@bA monster in the castle courtyard of all places! I thought it was a dog, and it took me totally off-guard!\n@c0@"
  es: "@aFroilán@b¡Un monstruo en el mismísimo patio del castillo! ¡Creía que era un perro y me pilló con la guardia baja!\n@c0@"
  fr: "@aHarry@bUn monstre dans la cour du château, vous vous rendez compteⓡⓐ J'ai cru que c'était un chien, il m'a pris totalement par surpriseⓠ\n@c0@"
  it: "@aRobert@bUn mostro nel cortile del castello... Mi sembra impossibile! Credevo che fosse un cane, e mi sono lasciato cogliere di sorpresa!\n@c0@"
  ja: "@a@bヘンリー「まさか　城の中庭に\n\t魔物が　放されてるなんてな。\n\t犬だと思ったから　油断したぜ。\n@c0@"
83:
  de: "@aMaria@bAlles in Ordnung?\n@c0@"
  en: "@aMaria@bAre you alright?\n@c0@"
  es: "@aMaría@b¿Estás bien?\n@c0@"
  fr: "@aMaria@bÇa vaⓡ\n@c0@"
  it: "@aMaria@bCome ti senti?\nÈ tutto a posto?\n@c0@"
  ja: "@a@bマリア「大丈夫でしたかっ？\n@c0@"
84:
  de: "@aMaria@bDu brauchst dir keine Sorgen um mich zu machen. Zum Glück warst du ja da, um mich zu beschützen.\n@c0@"
  en: "@aMaria@bThere's no need to worry about me. Luckily, you were there to protect me.\n@c0@"
  es: "@aMaría@bNo te preocupes por mí. Por suerte, estabas aquí para protegerme.\n@c0@"
  fr: "@aMaria@bInutile de t'inquiéter pour moi. Heureusement,\r\ntu étais là pour me protéger.\n@c0@"
  it: "@aMaria@bIo sto bene...\nPer fortuna c'eri tu a difendermi...\n@c0@"
  ja: "@a@bマリア「私は大丈夫です。\n\t%a000090さんたちが\n\t守ってくださったから…。　ぽっ。\n@c0@"
85:
  de: "@aHarry@bNicht mehr lange, und diese dunkle Zeit geht zu Ende.\n@c0@"
  en: "@aHarry@bIt won't be long before this dark period comes to an end.\n@c0@"
  es: "@aFroilán@bEste oscuro periodo no tardará en llegar a su fin.\n@c0@"
  fr: "@aHarry@bCette période sombre sera terminée très bientôt.\n@c0@"
  it: "@aRobert@bLe cose presto cambieranno.\n@c0@"
  ja: "@a@bヘンリー「そんな暗黒の時代も\n\tもうすぐ　終わりをつげるさ。\n@c0@"
86:
  de: "@aHarry@bDas Licht der Wahrheit, das aus diesem Spiegel heraus leuchtet, wird alles sein, was Tifortu braucht, um die Dunkelheit zu vertreiben!\n@c0@"
  en: "@aHarry@bThe light of truth that shines forth from this mirror will be all that Coburg needs to banish the darkness!\n@c0@"
  es: "@aFroilán@b¡La luz de la verdad que refulge en este espejo bastará para conjurar las tinieblas que asfixian Trastámara!\n@c0@"
  fr: "@aHarry@bLa lumière de vérité qui jaillit de ce miroir sera tout ce dont Cobourg a besoin pour chasser les ténèbresⓠ\n@c0@"
  it: "@aRobert@bQuesto specchio ci mostrerà la verità, e riporteremo pace e giustizia a Coburg!\n@c0@"
  ja: "@a@bヘンリー「この鏡が　照らし出す光で\n\tラインハットをおおう暗闇を\n\t全て　ふり払ってやる！\n@c0@"
87:
  de: "@aMaria@bEs ist Zeit, diesen armen, leidenden Menschen endlich zu helfen.\n@c0@"
  en: "@aMaria@bIt's time to help those poor, suffering people at last.\n@c0@"
  es: "@aMaría@bAl fin el pobre pueblo sufriente recibirá ayuda.\n@c0@"
  fr: "@aMaria@bLe moment est enfin venu d'aider ces pauvres hères et de mettre un terme à leurs souffrances.\n@c0@"
  it: "@aMaria@bFinalmente potremo aiutare coloro che soffrono...\n@c0@"
  ja: "@a@bマリア「さあ　しいたげられた人々を\n\t早く　助けてあげましょう。\n@c0@"
88:
  de: "@aHarry@bEin Schloss ist aus dem Himmel gefallen? Ich wusste nicht mal, dass da oben überhaupt ein Schloss ist. Das klingt alles ziemlich komisch, finde ich.\n@c0@"
  en: "@aHarry@bA castle fell from the sky!? I didn't even know there was a castle up there in the first place. It's all a bit odd if you ask me.\n@c0@"
  es: "@aFroilán@b¿Un castillo caído del cielo? Ni siquiera sabía que había un castillo ahí arriba. Me suena raro, qué quieres que te diga.\n@c0@"
  fr: "@aHarry@bUn château tombé du cielⓡⓐ Je ne savais même pas qu'il pouvait y en avoir un dans un endroit pareil, pour commencer.\n㈡\nC'est quand même un peu étrange, si tu veux\nmon avis.\n@c0@"
  it: "@aRobert@bUn castello caduto dal cielo?!\r\nMa che razza di storia è questa?!\r\nBah, secondo me è una baggianata colossale...\n@c0@"
