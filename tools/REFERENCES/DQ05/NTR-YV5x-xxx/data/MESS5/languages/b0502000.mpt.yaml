  it: "@aRobert@bMi verrebbe voglia di dirgli che la pacchia sta per finire...\n@c0@"
  ja: "@a@bヘンリー「あんな連中が　\n\tデカイ顔してられるのも\n\t今のうちだけだぜ…！\n@c0@"
96:
  de: "@aHarry@bDann ist die falsche Witwe also in Wirklichkeit ein Monster? Wie konnte denn ein Monster unbemerkt hier eindringen?\n@c0@"
