89:
  de: "@aMaria@bIch habe so etwas auch schon mal gehört.\n@c0@"
  en: "@aMaria@bI've heard something like that before myself.\n@c0@"
  es: "@aMaría@bYo había oído algo parecido.\n@c0@"
  fr: "@aMaria@bJ'avais déjà entendu quelque chose comme ça,\r\nmoi aussi.\n@c0@"
  it: "@aMaria@bAvevo già sentito questa storia...\n@c0@"
  ja: "@a@bマリア「さっきの話は　私も　\n\t聞いたことがあります。\n@c0@"
90:
  de: "@aMaria@bVielleicht war es die Göttin. Vielleicht hat sie das Schloss vom Himmel fallen lassen und lässt zu, dass die Monster uns wieder angreifen, um uns zu prüfen.\n@c0@"
  en: "@aMaria@bMaybe the Goddess did it. Maybe she made the castle fall and the monsters attack humans again as a way of testing us.\n@c0@"
  es: "@aMaría@bQuizás sea obra de la Diosa. Quizás hizo caer el castillo y provocó que los monstruos nos atacaran para ponernos a prueba.\n@c0@"
  fr: "@aMaria@bPeut-être que c'est la Déesse qui est responsable.\n㈡\nPeut-être qu'elle a fait tomber le château et\nfait en sorte que les monstres se remettent à attaquer les humains pour nous tester.\n@c0@"
  it: "@aMaria@bForse è stata la dea a far precipitare il castello e a ordinare ai mostri di attaccare gli esseri umani per metterci alla prova...\n@c0@"
  ja: "@a@bマリア「天空の城が　落ち\n\t魔物が　人をおそうようになったのは\n\t神の試練なのかも知れませんね。\n@c0@"
91:
  de: "@aHarry@bVerflixt! Für so etwas haben wir keine Zeit! Wir müssen einen anderen Weg finden.\n@c0@"
