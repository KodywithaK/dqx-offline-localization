  fr: "@aHarry@bJe n'aurais jamais pensé m'en servir un jour pour rentrer en cachette dans mon propre châteauⓠ\nC'est un comble, nonⓡ\n@c0@"
  it: "@aRobert@bNon avrei mai immaginato che lo avrei usato per entrare di nascosto nel mio castello!\n@c0@"
  ja: "@a@bヘンリー「まさか　オレが　ここから\n\t侵入することになるとはね。\n\t皮肉なもんだよ。\n@c0@"
107:
  de: "@aHarry@bEs wird wohl nicht viel bringen, wenn wir erklären, dass an allem nur die falsche Witwe schuld war.\n@c0@"
  en: "@aHarry@bI doubt there's much use in explaining that it was all the fake dowager's doing.\n@c0@"
  es: "@aFroilán@bDudo que sirva de algo explicar que todo fue culpa de la falsa Reina Madre.\n@c0@"
