  ja: "@a@bヘンリー「ニセの太后は　魔物か？\n\tだから　魔物が　気づかれずに\n\tここまで　入りこめるんだろうか…？\n@c0@"
97:
  de: "@aHarry@bEr hat recht. Ein zwielichtiges Gesindel, diese Soldaten.\n@c0@"
