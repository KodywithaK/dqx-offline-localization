  ja: "@a@bヘンリー「再会は　うれしいけど\n\t%a000090の名前を　先に呼ぶなんて\n\tちょっと　くやしいな。\n@c0@"
34:
  de: "@aHarry@bTja, eigentlich sind Nonnen doch auch eine Art Mönche. Vielleicht sollten wir sie nach dem Turm fragen.\n@c0@"
