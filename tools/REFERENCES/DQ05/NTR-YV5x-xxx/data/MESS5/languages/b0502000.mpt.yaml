  it: "@aRobert@bArgh! Il pensiero che una donna tanto crudele possa governare Coburg e il mondo intero mi fa drizzare i capelli in testa!\n@c0@"
  ja: "@a@bヘンリー「あんなヤツに\n\tラインハットを…\n\t世界を　征服させてたまるかっ！\n@c0@"
94:
  de: "@aMaria@bWenn es einen Krieg gibt, werden viele Menschen ihr Leben verlieren. Das müssen wir verhindern!\n@c0@"
  en: "@aMaria@bIf there's a war, lots of people will end up losing their lives. We have to stop it from coming to that!\n@c0@"
