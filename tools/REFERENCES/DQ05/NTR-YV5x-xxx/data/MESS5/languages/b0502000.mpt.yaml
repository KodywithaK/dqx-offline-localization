  it: "@aRobert@bHa ragione.\nQuei guerrieri hanno un aspetto tutt'altro che raccomandabile...\n@c0@"
  ja: "@a@bヘンリー「あいつらを　\n\t気持ち悪いと思えるなら\n\tあの兵士は　まともだな。\n@c0@"
98:
  de: "@aHarry@bIch dachte schon, die Soldaten hier seien alle verrückt geworden. Aber wenigstens einer scheint sich ja einen klaren Kopf bewahrt zu haben.\n@c0@"
  en: "@aHarry@bI was starting to worry that all the soldiers here had gone mad. It's nice to see one with his head still screwed on.\n@c0@"
  es: "@aFroilán@bEmpezaba a creer que todos los soldados habían enloquecido. Me alegro de ver a uno con la cabeza en su sitio.\n@c0@"
  fr: "@aHarry@bJe commençais à me demander si tous les soldats étaient devenus fous. Ça fait plaisir d'en voir au moins un qui a gardé la tête sur les épaules.\n@c0@"
  it: "@aRobert@bStavo iniziando a pensare che tutti i soldati fossero diventati matti. È bello vedere che ce n'è ancora qualcuno con la testa ben salda sulle spalle...\n@c0@"
  ja: "@a@bヘンリー「ひょっとして　城の兵士たちは\n\t全員　おかしくなってるのかと\n\t心配してたけど　安心したよ。\n@c0@"
99:
  de: "@aHarry@bDie falsche Witwe muss schon da gewesen sein, als Steinach angegriffen wurde.\n@c0@"
  en: "@aHarry@bThe fake dowager must have already been in place at the time Whealbrook was attacked.\n@c0@"
