  it: "@aMaria@bNoi esseri umani non dovremmo interessarci di queste cose!\n@c0@"
  ja: "@a@bマリア「私には　神の技というより\n\tむしろ　悪魔の技のような\n\t気がします。\n@c0@"
105:
  de: "@aHarry@bDieser Gang wurde als Fluchtweg für den Notfall angelegt.\n@c0@"
  en: "@aHarry@bThis passage was made so that it could be used as a means of escape in case of some kind of emergency.\n@c0@"
  es: "@aFroilán@bEste pasadizo fue creado como ruta de escape en caso de emergencia.\n@c0@"
  fr: "@aHarry@bCe passage a été conçu pour pouvoir fuir\r\nen cas d'urgence.\n@c0@"
  it: "@aRobert@bQuesto passaggio fu progettato come via di fuga da utilizzare in caso di emergenza.\n@c0@"
  ja: "@a@bヘンリー「この抜け道は　\n\tもともと　何かあった時の脱出用に\n\t作られたものなんだが……。\n@c0@"
106:
  de: "@aHarry@bIch hätte nie gedacht, dass ich ihn mal benutzen würde, um in mein eigenes Schloss zu schleichen! Verkehrte Welt, was?\n@c0@"
