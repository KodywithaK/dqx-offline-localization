0:
  de: "@aBianca@bIrgendwie kommt mir das nicht richtig vor, dieser riesige Wachturm direkt vor einer friedlichen Stadt.\n@c0@"
  en: "@aBianca@bIt dun't seem right somehow, havin' a big lookout tower like this next to a peaceful town.\n@c0@"
  es: "@aBianca@bEsto de una atalaya tan grande junto a un pueblo pacífico me resulta de lo más sospechoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa semble un peu bizarre d'avoir une grande tour\r\nde guet comme celle-ci à côté d'une ville paisible.\n@c0@"
  it: "@aBianca@bChe senso ha costruire una torre di sorveglianza così imponente nei pressi di un pacifico villaggio?!\n@c0@"
  ja: "@a@bビアンカ「平和な町の　すぐとなりに\n\t見はらしの塔だなんて\n\tなんだか　似合わないわね。\n@c0@"
1:
  de: "@aBianca@bWenn ein so großer Bau nötig ist, um Wache zu halten, dann ist Mostroferrato vielleicht in Gefahr.\n@c0@"
  en: "@aBianca@bIf they feel the need for a big thing like this to keep watch, maybe Mostroferrato is in some kind of danger.\n@c0@"
  es: "@aBianca@bSi creen que necesitan una cosa así para vigilar, quizá Mostroferrato corra algún peligro.\n@c0@"
  fr: "@aBianca@bS'ils ressentent le besoin d'avoir un gros truc\r\ncomme ça pour monter la garde, peut-être\r\nque Mostroferrato est en danger, en réalité.\n@c0@"
  it: "@aBianca@bGli abitanti di Mostroferrato devono sentirsi in pericolo, per aver realizzato un punto d'avvistamento come questo...\n@c0@"
  ja: "@a@bビアンカ「こんな塔を建ててまで\n\t見張るってことは　サラボナって\n\t魔物に　ねらわれてるのかな？\n@c0@"
2:
  de: "@aNera@bDieser Turm wurde gebaut, bevor ich geboren wurde.\n@c0@"
  en: "@aNera@bThis tower was built before I was born.\n@c0@"
  es: "@aNera@bEsta torre d'osservazione fue construida antes de nacer yo.\n@c0@"
  fr: "@aNera@bCette tour a été édifiée avant ma naissance.\n@c0@"
  it: "@aNera@bQuesta torre fu costruita prima che io nascessi.\n@c0@"
  ja: "@a@bフローラ「この塔は　私が生まれる前から\n\t建っていましたのよ。\n@c0@"
3:
  de: "@aNera@bMein Vater hat mir erzählt, dass er den Turm gebaut hat, damit wir für Angriffe durch Ungeheuer gerüstet sind. Mehr hat er dazu nie gesagt.\n@c0@"
  en: "@aNera@bAll my father's told me is that he built the tower so we'd be prepared for monsters attacking.\r\nHe never said anything more than that.\n@c0@"
  es: "@aNera@bEl mio papino solo me dijo que la erigió para estar preparados en caso de ataque de monstruos.\r\nNunca dijo più.\n@c0@"
  fr: "@aNera@bTout ce que mon père m'a dit, c'est qu'il avait construit la tour pour que nous soyons prêts\nau cas où les monstres attaqueraient.\n㈡\nIl ne m'a jamais donné d'autre explication.\n@c0@"
  it: "@aNera@bMio padre mi ha detto di aver eretto la torre per difendersi da eventuali attacchi dei mostri, ma non mi ha mai dato troppi dettagli in merito.\n@c0@"
  ja: "@a@bフローラ「お父さまは　魔物の襲撃にそなえ\n\t塔を建てたと　おっしゃってましたけど\n\tくわしいことは　聞かされてませんの。\n@c0@"
4:
  de: "@aBianca@bDieser Herr Onassetti macht sich wohl ständig Sorgen. Es ist mir ganz neu, dass Mostroferrato so gefährdet durch Monster sein soll.\n@c0@"
  en: "@aBianca@bThat Mr Briscoletti sounds like a bit of a worrier. I've never heard anythin' about Mostroferrato bein' a target for monsters.\n@c0@"
  es: "@aBianca@bEl Rimaldi ese parece un poco exagerado. Nunca he oído que Mostroferrato sea un objetivo de los monstruos, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe monsieur Oscuroni m'a l'air de s'inquiéter pour rien. Je n'ai jamais entendu dire que Mostroferrato était la cible des monstres.\n@c0@"
  it: "@aBianca@bCredo che mister Fosconi si preoccupi troppo...\nPerché mai i mostri dovrebbero attaccare Mostroferrato, eh?\n@c0@"
  ja: "@a@bビアンカ「ルドマンさんて　心配性なのね。\n\tサラボナが　魔物に襲撃されたなんて\n\t一度も　聞いたことがないわ。\n@c0@"
5:
  de: "@aNera@bIch mag gar nicht daran denken, aber der Wachturm soll uns vielleicht klarmachen, dass uns tatsächlich irgendwann ein Angriff durch Monster drohen könnte.\n@c0@"
  en: "@aNera@bIt hardly bears thinking about, but I suppose this lookout tower's a symbol of the possibility that monsters might actually attack us one day.\n@c0@"
  es: "@aNera@bNo quiero ni pensarlo, pero supongo que esta atalaya es símbolo de la possibilità de que los monstruos puedan atacarnos algún día.\n@c0@"
  fr: "@aNera@bÇa n'a guère d'importance, mais je suppose que\r\ncette tour de guet symbolise la possibilité qu'un jour, les monstres puissent nous attaquer.\n@c0@"
  it: "@aNera@bForse questa torre è stata costruita per ricordare alla popolazione di Mostroferrato che, un giorno, i mostri potrebbero attaccare il villaggio...\n@c0@"
  ja: "@a@bフローラ「考えたくも　ありませんけど\n\t見張りをするぐらいですから　いつか\n\t魔物が　襲ってくるのかしら……。\n@c0@"
6:
  de: "@aBianca@bEin Mann, der sich selbst in ein Monster verwandelt hat? Ist so was denn überhaupt möglich? Das will ich doch nicht hoffen!\n@c0@"
  en: "@aBianca@bA man who turned himself into a monster? Is that even possible? I certainly hope not!\n@c0@"
  es: "@aBianca@b¿Un tipo que se convirtió en monstruo? ¿Pero eso se puede? ¡Espero que no!\n@c0@"
  fr: "@aBianca@bUn homme qui se serait lui-même transformé en monstreⓡ Est-ce seulement possibleⓡ\nJ'espère bien que nonⓠ\n@c0@"
  it: "@aBianca@bUn uomo che si è trasformato in un mostro?!\nChe sciocchezza!\n@c0@"
  ja: "@a@bビアンカ「自身を　魔物に変えるなんて\n\tそんなことができるのかしら？\n\t本当にできたら　こわいことよね。\n@c0@"
7:
  de: "@aNera@bAls ich klein war, bin ich gern auf den Turm gestiegen. Dann konnte ich hinausschauen und vom Leben in fernen Städten und Schlössern träumen.\n@c0@"
  en: "@aNera@bWhen I was a little girl, I used to love climbing this tower so I could look out and imagine what life must be like in faraway towns and castles.\n@c0@"
  es: "@aNera@bCuando era una bambina me encantaba subir a esta torre e imaginar cómo sería la vida en ciudades y castillos lejanos.\n@c0@"
  fr: "@aNera@bQuand j'étais petite, j'adorais grimper en haut de cette tour pour regarder les alentours et imaginer\r\nla vie dans les villes et les châteaux lointains.\n@c0@"
  it: "@aNera@bDa piccola venivo spesso qui alla torre.\nSalivo in cima e guardavo l'orizzonte, immaginando come vivessero gli abitanti dei paesi lontani...\n@c0@"
  ja: "@a@bフローラ「幼いころ　ここにのぼって\n\t遠くにある町や村や　城のことなどを\n\tあれこれ　想像するのが好きでしたの。\n@c0@"
8:
  de: "@aGriselda@bWas wollen wir denn am Turm?\nHier gibt's doch nichts zu sehen.\n@c0@"
  en: "@aDebora@bWhat are we doing at the tower?\nThere's nothing to see here.\n@c0@"
  es: "@aStefania@bMa, ¿qué hacemos en la torre? Aquí no hay nada que ver, ¿capisci?\n@c0@"
  fr: "@aPandora@bQu'est-ce qu'on fait à la tourⓡ\nIl n'y a rien à voir, ici.\n@c0@"
  it: "@aViola@bMi spieghi perché siamo venuti alla torre?!\nNon abbiamo niente da fare qui!\n@c0@"
  ja: "@a@bデボラ「この塔に　何の用？\n\tこんなところ　何もないわよ。\n@c0@"
9:
  de: "@aGriselda@bPapa kommt von Zeit zu Zeit hierher. Ich würde ja gerne wissen, warum wohl.\n@c0@"
  en: "@aDebora@bPapa comes here from time to time.\nI wonder what for.\n@c0@"
  es: "@aStefania@bEl mio papino viene aquí a veces. Él sabrá por qué.\n@c0@"
  fr: "@aPandora@bPapa vient ici de temps en temps.\r\nJe me demande pourquoi.\n@c0@"
  it: "@aViola@bIl mio paparino viene qui ogni tanto...\nVorrei tanto sapere perché lo fa!\n@c0@"
  ja: "@a@bデボラ「たまに　パパがこの塔に\n\t来てるらしいのよね。\n\tいったい　なにしてるんだか。\n@c0@"
10:
  de: "@aGriselda@bIst doch nur verrücktes Gerede, dass uns irgendwann Monster angreifen. Papa macht sich deswegen ganz verrückt vor Sorge.\n@c0@"
  en: "@aDebora@bIt's just crazy talk saying that monsters will come and attack us one day. Papa's constantly worried about it. I suppose that makes him crazy!\n@c0@"
  es: "@aStefania@bDecir que un giorno van a atacarnos los monstruos es una locura, ¿entendido? Il mio papino siempre andaba con eso. ¡Así que supongo que está loco!\n@c0@"
  fr: "@aPandora@bCe sont des histoires insensées de dire que les monstres nous attaqueront un jour. Papa s'en inquiète constamment. Je suppose qu'il est insenséⓠ\n@c0@"
  it: "@aViola@bNon capisco perché il mio paparino abbia tanta paura che i mostri attacchino il villaggio...\nSecondo me si preoccupa per nulla!\n@c0@"
  ja: "@a@bデボラ「魔物なんて　襲ってこないわよ。\n\tパパったら　そんな心配ばかりしてるから\n\t頭が　ハゲてるのよ。\n@c0@"
11:
  de: "@aGriselda@bUh! Ich würde mich nie in ein Monster verwandeln wollen! Monster können sich doch nicht mal schick machen.\n@c0@"
  en: "@aDebora@bUgh! I'd never want to turn myself into a monster. For one thing, monsters can't dress themselves up and look pretty.\n@c0@"
  es: "@aStefania@b¡Puaj! No querría convertirme en monstruo. Para empezar, no se visten para estar bellinos. A quién me recordarán...\n@c0@"
  fr: "@aPandora@bBeurkⓠ Je n'aimerais pas me transformer un jour en monstre. Déjà, les monstres ça ne peut pas s'habiller correctement pour être joli.\n@c0@"
  it: "@aViola@bNon potrei mai trasformarmi in un mostro.\nSono troppo bella, elegante e raffinata. Non sarei credibile con zanne, artigli, peli e coda!\n@c0@"
  ja: "@a@bデボラ「魔物になんかなったら\n\tオシャレも　できないじゃないのよ。\n\t私は　ごめんだわね。\n@c0@"
