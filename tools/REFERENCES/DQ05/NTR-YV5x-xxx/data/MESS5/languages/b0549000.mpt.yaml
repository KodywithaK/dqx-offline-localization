0:
  de: "@a%0%a001240@bWow! Das ist also das Reich der Feen! Wie anders alles ist...\n@c0@"
  en: "@a%0%a001240@bWow! So this is the Realm of the Faeries! It's really different to our world.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Así que esto es el Reino de las Hadas! Qué distinto es de nuestro mundo.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ C'est donc ça, le royaume des Féesⓠ\nC'est vraiment différent de notre monde.\n@c0@"
  it: "@a%0%a001240@bQuesto è il Regno delle Fate?!\nAccidenti!\nÈ completamente diverso dal nostro mondo!\n@c0@"
  ja: "@a@b%a001240「うわ～　ここが　妖精の国！？\n\tボクたちの世界とは\n\tちょっと　ちがってるみたいだね。\n@c0@"
1:
  de: "@a%0%a001240@bHier gibt es doch auch Monster, oder? Wir sollten vorsichtig sein.\n@c0@"
  en: "@a%0%a001240@bThere are monsters here too, right? We should mind where we go.\n@c0@"
  es: "@a%0%a001240@bAquí también hay monstruos, ¿verdad? Debemos tener cuidado.\n@c0@"
  fr: "@a%0%a001240@bIl y a aussi des monstres ici, pas vraiⓡ\nIl faut faire attention où on va.\n@c0@"
  it: "@a%0%a001240@bAnche qui potremmo incontrare dei mostri, non è vero?\nCi conviene procedere con cautela...\n@c0@"
  ja: "@a@b%a001240「お父さん　ここにも\n\t魔物って　いるんだね。\n\t気をつけなくちゃ……。\n@c0@"
2:
  de: "@a%0%a001250@bSieh nur, Papa! Der Himmel ist weiß! Warum das wohl so ist? Wirklich seltsam!\n@c0@"
  en: "@a%0%a001250@bLook, Dad! The sky's white! Why do you think that is? It's really odd!\n@c0@"
  es: "@a%0%a001250@b¡Mira, papi! ¡El cielo es blanco! ¿Por qué es así? ¡Qué extraño!\n@c0@"
  fr: "@a%0%a001250@bPapa, regardeⓠ Le ciel est tout blancⓠ\nÀ quoi c'est dû, à ton avisⓡ\nC'est vraiment bizarreⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, come mai qui il cielo è bianco?\nÈ una cosa stranissima...\n@c0@"
  ja: "@a@b%a001250「お父さん　見て！\n\t海の色が　白いよ。\n\tどうして？　ふしぎだね。\n@c0@"
3:
  de: "@a%0%a001250@bIst die hübsche Blume da drüben etwa eine Kirschblüte? Ihren Duft kann man selbst hier noch riechen.\n@c0@"
  en: "@a%0%a001250@bIs that pretty pink flower over there a cherry blossom? You can smell it from here.\n@c0@"
  es: "@a%0%a001250@bEsas bonitas flores de allí, ¿son de cerezo? Su perfume llega hasta aquí.\n@c0@"
  fr: "@a%0%a001250@bCette jolie fleur rose, c'est une fleur de cerisierⓡ\nOn peut la sentir d'ici.\n@c0@"
  it: "@a%0%a001250@bQuel fiore rosa laggiù profuma di ciliegie!\nÈ incredibile!\nIl suo aroma arriva fin qui!\n@c0@"
  ja: "@a@b%a001250「あそこに見える　きれいな\n\tピンクのお花って　桜！？\n\tここまで　いいにおいがするね。\n@c0@"
4:
  de: "@aSancho@bIss wusste gar nisst, dass eine solche Platz in die Welt existiert. Qué? Nicht von dieser Welt? Eine andere Welt?\n㈡\nHe he. Du willst miss wohl auf die Arm nehmen, eh, Chico?\n@c0@"
  en: "@aSancho@bI no know esuch places like thees are een the world. Qué? Ees no the world? Ees a different world? Heh heh. You like to trick me, sí?\n@c0@"
  es: "@aSancho@bNo sabía que hubiese sitios así tan especiales en el mundo.\n㈡\n¿Cómo que no es el mundo? ¿Que es otro mundo?\nJe, je. Me tomas la cabellera, nomás.\n@c0@"
  fr: "@aSancho@bJ-Je ne savais p-pas qu'il y avait des endroits comme ça dans le mundo. Quéⓡ C'est oun autre mundoⓡ Hé hé hé. T-Tu me fais m-marcher, noⓡ\n@c0@"
  it: "@aSancho@b¡No avrei mai immaginato que al mundo esistesse un luego come esto!\n㈡\n¿Que? ¿Esto no es el mundo de los humanos ma el Regno de las Fatas? ¡Ah ah ah! Smettila de prendere en giro el povero zio Sancho, chico...\n@c0@"
  ja: "@a@bサンチョ「世界にこんな場所があったとは。\n\tえっ？　ちがう世界ですって？\n\tまたまた　私を　からかって！\n@c0@"
5:
  de: "@a%0%a001240@bWo dieses Feenschloss wohl ist? Ich seh keinen See, der von hohen Bergen umgeben ist...\n@c0@"
  en: "@a%0%a001240@bWhere do you suppose the Faerie Palace is? I can't see any lake surrounded by mountains around here.\n@c0@"
  es: "@a%0%a001240@b¿Dónde estará el Palacio de las Hadas? No veo ningún lago rodeado de montañas por aquí.\n@c0@"
  fr: "@a%0%a001240@bÀ ton avis, il est où le palais des Féesⓡ Je vois pas de lac entouré de montagnes dans le coin.\n@c0@"
  it: "@a%0%a001240@bMa dove sarà la Reggia Fatata?\nQui non vedo laghi circondati da montagne...\n@c0@"
  ja: "@a@b%a001240「妖精の城って　どこだろうね？\n\tここには　山にかこまれた湖なんて\n\t見あたらないけどな……。\n@c0@"
6:
  de: "@a%0%a001240@bDu warst schon einmal hier, als du klein warst, nicht wahr, Papa? Hast du damals auch das Feenschloss gesehen?\n@c0@"
  en: "@a%0%a001240@bYou came here when you were little, right, Dad?\nDid you see the Faerie Palace then?\n@c0@"
  es: "@a%0%a001240@bTú viniste aquí cuando eras niño, ¿verdad, papá?\n¿Y viste el Palacio de las Hadas?\n@c0@"
  fr: "@a%0%a001240@bTu es venu ici quand tu étais petit, pas vrai, papaⓡ Et tu avais visité le palais des Fées, à l'époqueⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, quando venisti qui da piccolo, vedesti la Reggia Fatata?\n@c0@"
  ja: "@a@b%a001240「お父さんは　小さい頃\n\tこのあたりを　歩きまわったんでしょ？\n\t妖精のお城は　なかった？\n@c0@"
7:
  de: "@a%0%a001250@bLa la la la... Ich fühle mich so glücklich hier. Am liebsten würde ich den ganzen Tag lang singen und tanzen!\n@c0@"
  en: "@a%0%a001250@bLa la la la... Being here makes me feel all happy.\nI want to skip about the place!\n@c0@"
  es: "@a%0%a001250@bLa, la, la, la... ¡Qué contenta estoy de estar aquí!\n¡Tengo ganas de saltar y brincar!\n@c0@"
  fr: "@a%0%a001250@bLa la la la... Ça me rend toute joyeuse d'être ici.\nJe veux tout visiterⓠ\n@c0@"
  it: "@a%0%a001250@bLa la la la... Ⓡ\nQuesto posto è meraviglioso!\nMi sento in paradiso!\n@c0@"
  ja: "@a@b%a001250「ランランラン……。\n\tこっちの世界にいると　ウキウキして\n\tスキップしたくなっちゃうの。\n@c0@"
8:
  de: "@a%0%a001250@bKönnen wir nicht ein wenig länger hier bleiben, Papa? Schließlich hat man nicht jeden Tag die Gelegenheit, das Reich der Feen zu erkunden.\n@c0@"
  en: "@a%0%a001250@bCan we stay here a bit longer, Dad? Not many people get the chance to come to the Realm of the Faeries.\n@c0@"
  es: "@a%0%a001250@b¿Podemos quedarnos un poquito más, papi? No todos tienen la ocasión de venir al Reino de las Hadas.\n@c0@"
  fr: "@a%0%a001250@bOn peut rester encore un peu, papaⓡ Ce n'est pas tous les jours qu'on a l'occasion de venir dans le royaume des Fées.\n@c0@"
  it: "@a%0%a001250@bPapà, che ne diresti se ci trasferissimo qui per sempre?\n㈡\nOvviamente, dopo che avremo portato a termine la nostra missione...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tせっかく来たんだから\n\tもう少し　この世界　お散歩しよう？\n@c0@"
9:
  de: "@aSancho@bIss kann es nisst glauben. Diese kleinen Leute, die Feen, sie sind echt!\n@c0@"
  en: "@aSancho@bI no believe eet. These tiny peoples, the faeries, they are real!\n@c0@"
  es: "@aSancho@bNo puedo creérmelo. ¡Esas personas chiquitas, las hadas, son de verdad!\n@c0@"
  fr: "@aSancho@bJ-Je n'arrive pas à y croire. Ces toutes p-petites créatures, ces f-fées, elles existent v-vraimentⓠ\n@c0@"
  it: "@aSancho@bNo credo a los mios ojos...\n¡Las fatas esistono realmentes!\n@c0@"
  ja: "@a@bサンチョ「はあ　しかし　本当に\n\t妖精なんてものが　いたんですねえ。\n@c0@"
10:
  de: "@aSancho@bWarum hast du so viele Geheimnisse vor deine Onkel Sancho, eh, Chico? Vertraust du mir denn nisst? Das macht miss sehr traurig...\n@c0@"
  en: "@aSancho@bEh! Why you have eso many esecrets from your Uncle Sancho, friend? You no trust me?\r\nThees makes me eso esad.\n@c0@"
  es: "@aSancho@b¡Eh! ¿Por qué tienes secretos con tu tito Sancho, chamaco? ¿No te fías de mí?\nEso me pone muy triste...\n@c0@"
  fr: "@aSancho@bHéⓠ Pourquoi t-tu ne dis pas tout à ton oncle Sancho, chicoⓡ T-Tu ne me fais pas c-confianceⓡ Ça me rend t-triste, tu sais.\n@c0@"
  it: "@aSancho@b¿Por qué no avevi mai detto allo zio Sancho que eri estato nel Regno de las Fatas?\n¿Forse piensavi que no te avrei creduto?\n@c0@"
  ja: "@a@bサンチョ「それにしても　%a000090王は\n\t私に　かくし事ばかり。\n\tうっうっ……。\n@c0@"
11:
  de: "@aOtto@bWie seltsam. Wir laufen nun schon eine ganze Weile hier herum, aber es ist immer noch helllichter Tag...\n@c0@"
  en: "@aTuppence@bHow odd. I've just realised that we've been\r\nwalking around for quite a while now, and yet\r\nit's still daytime.\n@c0@"
  es: "@aAlazar@bQué raro. Me acabo de dar cuenta de que ya llevamos horas andando y aún es de día.\n@c0@"
  fr: "@aInnocent@bC'est bizarre. Je viens de me rendre compte que ça fait un bon bout de temps qu'on marche, maintenant, et il fait toujours jour.\n@c0@"
  it: "@aSimon@bStiamo camminando da parecchio tempo, eppure è ancora giorno...\n@c0@"
  ja: "@a@bピピン「おかしいな？\n\tさっきから　歩いてるのに\n\t夜に　なりませんね……。\n@c0@"
12:
  de: "@aOtto@bDiese Feen sind einfach zuckersüß. Ob ich wohl eine von ihnen überzeugen könnt', meine Braut zu werden und mit mir zu leben...?\n@c0@"
  en: "@aTuppence@bFaeries are rather sweet. I wonder if I could persuade one to come and live with me as my bride.\n@c0@"
  es: "@aAlazar@bLas hadas son un encanto. A lo mejor puedo convencer a una para que venga a casarse conmigo.\n@c0@"
  fr: "@aInnocent@bLes fées semblent douces. Je me demande si j'arriverais à en convaincre une de nous suivre et de se marier avec moi.\n@c0@"
  it: "@aSimon@bLe fate sono molto dolci, e anche assai carine!\nForse potrei provare a convincere una di loro a venirmi a trovare a Denim...\n@c0@"
  ja: "@a@bピピン「妖精　かわいかったな。\n\tボクのところに\n\tお嫁に来てくれないかな～。\n@c0@"
13:
  de: "@a%0%a001240@bWas soll das heißen, den Lauf der Zeit zu ändern? Ich verstehe das nicht...\n@c0@"
  en: "@a%0%a001240@bWhat do you suppose it means to change the flow of time? I don't really get it.\n@c0@"
  es: "@a%0%a001240@bCambiar el sentido del tiempo... ¿Qué querrá decir? No lo entiendo.\n@c0@"
  fr: "@a%0%a001240@bD'après toi, ça veut dire quoi changer l'écoulement du tempsⓡ Je comprends pas bien.\n@c0@"
  it: "@a%0%a001240@bCosa vuol dire modificare il flusso del tempo?\nNon credo di aver capito bene...\n@c0@"
  ja: "@a@b%a001240「時の流れを　変える……\n\tって　どういうことなの？\n\t考えても　わからないよ。\n@c0@"
14:
  de: "@a%0%a001240@bMarmela und die anderen Feen dürfen nichts von der vergoldeten Kugel erfahren, richtig?\n@c0@"
  en: "@a%0%a001240@bTreacle and the other faeries can't know about the gold bauble, right?\n@c0@"
  es: "@a%0%a001240@bMiel y las demás hadas no pueden saber lo de la esfera dorada, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bMélissa et les autres fées ne sont pas au courant pour la boule dorée, heinⓡ\n@c0@"
  it: "@a%0%a001240@bAdusya e le altre fate non devono sapere della sfera dorata, dico bene?\n@c0@"
  ja: "@a@b%a001240「ポワンさまたちには\n\tひかるオーブのこと\n\tないしょなんでしょ？\n@c0@"
15:
  de: "@a%0%a001240@bIn Ordnung. Ich wollte nur sichergehen, dass ich nicht aus Versehen ein Geheimnis verrate...\n@c0@"
  en: "@a%0%a001240@bOkay. I didn't want to let you down by not keeping it a secret.\n@c0@"
  es: "@a%0%a001240@bMuy bien. Mantendré el secreto para no decepcionarte.\n@c0@"
  fr: "@a%0%a001240@bD'accord. Je ne voulais pas faire une bêtise en leur disant ce secret.\n@c0@"
  it: "@a%0%a001240@bD'accordo.\nManterrò il segreto.\n@c0@"
  ja: "@a@b%a001240「わかってるよ。\n\tせっかく　教えてもらったのに\n\tガッカリさせたくないもんね。\n@c0@"
16:
  de: "@a%0%a001250@bIch glaube nicht, dass wir hier richtig sind, Papa. Wir sollten zurück zum Feenschloss gehen.\n@c0@"
  en: "@a%0%a001250@bI don't think we're on the right track here, Dad.\nWe should go back to the Faerie Palace.\n@c0@"
  es: "@a%0%a001250@bCreo que no vamos por el buen camino, papá.\nDeberíamos volver al Palacio de las Hadas.\n@c0@"
  fr: "@a%0%a001250@bÀ mon avis, on fait fausse route, papa.\nOn devrait retourner au palais des Fées.\n@c0@"
  it: "@a%0%a001250@bPapà, credo che dovremmo tornare alla Reggia Fatata...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tここじゃないと思うよ。\n\t妖精さんのお城に　もどろう？\n@c0@"
17:
  de: "@a%0%a001250@bIch glaube, ich weiß, was die Herrin der Feen sagen wollte. Du kannst den Lauf der Geschichte ändern, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001250@bI think I understand what the leader of the faeries was saying. You can do it, right, Dad?\n@c0@"
  es: "@a%0%a001250@bCreo que entiendo lo que decía la líder de las hadas. Tú puedes hacerlo, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bJe crois que j'ai compris ce que la reine des Fées\na dit. Tu peux y arriver, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bCredo di aver capito cosa ha detto quella fata.\nPapà, sono certa che ce la farai!\n@c0@"
  ja: "@a@b%a001250「妖精の女王さまの　言ってたこと\n\tなんとなく　わかる気がする……。\n\tお父さんなら　できることなのよ。\n@c0@"
18:
  de: "@a%0%a001240@bDa sind wir wieder! T&T macht dir wirklich Spaß, was, Papa?\n@c0@"
  en: "@a%0%a001240@bHere we are again! You really like T 'n' T,\ndon't you, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Otra vez aquí! El T y T te gusta de verdad, ¿eh, papá?\n@c0@"
  fr: "@a%0%a001240@bEt c'est repartiⓠ Tu adores le TNT, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bRieccoci!\nLa Tavola della Sorte ti piace davvero tanto, eh?\n@c0@"
  ja: "@a@b%a001240「また来たね。\n\tお父さんったら\n\t本当に好きだよねっ　すごろく！\n@c0@"
19:
  de: "@a%0%a001240@bEs gibt doch nur eine Insel hier, richtig? Keine anderen, die irgendwo rumschwimmen...\n@c0@"
  en: "@a%0%a001240@bThere's just one island here, right? There aren't any others floating about the place?\n@c0@"
  es: "@a%0%a001240@bSolo hay una isla aquí, ¿no? No hay otras flotando por ahí, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bIl n'y a qu'une île ici, c'est çaⓡ Il n'y en a pas d'autres dans le coinⓡ\n@c0@"
  it: "@a%0%a001240@bQui c'è una sola isola fluttuante, vero?\nNon ce ne sono altre?\n@c0@"
  ja: "@a@b%a001240「ここって　ひとつの島だよね？\n\tほかに　島ってないのかなあ。\n@c0@"
20:
  de: "@a%0%a001250@bÜber dem Wasser liegt ein feiner, weißer Nebel. Zuerst dachte ich, das Wasser sei weiß!\n@c0@"
  en: "@a%0%a001250@bThere's a white mist just above the water.\nI thought the sea itself was white at first!\n@c0@"
  es: "@a%0%a001250@bEl agua está cubierta por una neblina blanca.\n¡Al principio pensé que el lago era blanco!\n@c0@"
  fr: "@a%0%a001250@bIl y a une brume blanche qui recouvre la surface de l'eau. Au début, j'ai cru que c'était la mer qui était blancheⓠ\n@c0@"
  it: "@a%0%a001250@bIl mare è ricoperto da una fitta nebbiolina...\nPrima avevo avuto l'impressione che persino l'acqua fosse bianca!\n@c0@"
  ja: "@a@b%a001250「よく見ると　海の上に\n\t白いもやが　かかってるのね。\n\tわたし　白い海だと　思っちゃった。\n@c0@"
21:
  de: "@a%0%a001250@bImmer, wenn wir hier sind, fange ich wie wild an zu plaudern...\n@c0@"
  en: "@a%0%a001250@bI seem to become a real chatterbox whenever we come here.\n@c0@"
  es: "@a%0%a001250@bSiempre que venimos aquí me entran muchas ganas de parlotear.\n@c0@"
  fr: "@a%0%a001250@bJ'ai l'impression d'être une vraie pipelette quand on vient ici.\n@c0@"
  it: "@a%0%a001250@bQui mi sento serena e rilassata...\nSono in pace con me stessa e con il mondo.\n@c0@"
  ja: "@a@b%a001250「わたし　ここに来ると\n\tおしゃべりに　なっちゃうみたい。\n@c0@"
22:
  de: "@a%0%a001250@bOh, ein kleiner Vogel! Hallo, kleines Vöglein!\n@c0@"
  en: "@a%0%a001250@bOoh, a little bird! Hello there, birdie!\n@c0@"
  es: "@a%0%a001250@b¡Oooh, un pajarito! ¡Hola, pequeñín!\n@c0@"
  fr: "@a%0%a001250@bOh, un petit oiseauⓠ Petit oiseauⓠ Par iciⓠ\n@c0@"
  it: "@a%0%a001250@bOh, che carino!\nCiao, uccellino!\nCome stai?\n@c0@"
  ja: "@a@b%a001250「あっ　鳥さんだ！\n\tこんにちは～～っ！\n@c0@"
23:
  de: "@aSancho@bQué? Wir müssen hier immer noch etwas erledigen? In Ordnung. Aber rápido, si?\n@c0@"
  en: "@aSancho@bQué? We estill have the theengs to do here?\r\nOkay. Then we do them rápido, sí?\n@c0@"
  es: "@aSancho@b¿Qué? ¿Que aún tenemos cosas que hacer aquí?\nOk. Pero las hacemos de volada, ¿sí?\n@c0@"
  fr: "@aSancho@bQuéⓡ On a encore des t-trucs à faire iciⓡ\nDe acuerdo. Mais on f-fait ça rápido, siⓡ\n@c0@"
  it: "@aSancho@b¿Abbiamo ancora cosas da fare aquí?\n¿Sì? ¡Muy bien!\n¡Mettiamoce all'operas!\n@c0@"
  ja: "@a@bサンチョ「おや？　まだ　ここに\n\t用がありましたっけ？\n\tさあ　早くすませてくださいね。\n@c0@"
24:
  de: "@aSancho@bHast du nisst etwas vergessen, Chico? Es ist immer besser, alles nachzuprüfen, bevor es ist zu spät...\n@c0@"
  en: "@aSancho@bYou no forget esometheeng, friend?\r\nYou must check to make esure.\r\nEes better to be esafe than esorry, no?\n@c0@"
  es: "@aSancho@b¿No te olvidas de nada, chamaco?\nTienes que asegurarte bien, para no lamentarlo después, nomás.\n@c0@"
  fr: "@aSancho@bT-Tu n'as rien oublié, chicoⓡ T-Tu ferais mieux de v-vérifier pour être sûr. Il vaut mieux p-prévenir que guérir, noⓡ\n@c0@"
  it: "@aSancho@b¿Chico, no te sei dimenticato nada? ¿Sei seguro?\r\nMuy bien. Es importante essere siempre preparatos a todas las eventualità.\n@c0@"
  ja: "@a@bサンチョ「ところで　%a000090王。\n\t忘れ物は　ないですよね？\n\t確認は　何回しても　いいんですよ！\n@c0@"
25:
  de: "@aOtto@bIch bin immer sehr aufgeregt, wenn wir hierher kommen. Vielleicht ist es die besondere Magie der Feen, die auf mich wirkt...\n@c0@"
  en: "@aTuppence@bI always feel terribly agitated when we come here. Maybe it's just the magic effect the Realm of the Faeries has on me.\n@c0@"
  es: "@aAlazar@bSiempre que venimos aquí me pongo nerviosísimo. Debe de ser un efecto de la magia del Reino de las Hadas.\n@c0@"
  fr: "@aInnocent@bJe suis toujours dans tous mes états quand on vient ici. C'est peut-être l'effet magique que le royaume des Fées a sur moi.\n@c0@"
  it: "@aSimon@bQuando vengo nel Regno delle Fate mi prende sempre una certa ansia.\nNon mi sento del tutto a mio agio in questo posto...\n@c0@"
  ja: "@a@bピピン「ここには　いつ来ても\n\tトキメキますね。\n\t妖精の世界だからでしょうか？\n@c0@"
26:
