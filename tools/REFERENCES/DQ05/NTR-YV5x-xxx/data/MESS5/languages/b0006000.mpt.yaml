  en: "@a@b*: I just can't fathom what's going on inside her head.\n@c0@"
  es: "@a@b*: No puedo imaginarme qué ideas le rondarán la cabeza.\n@c0@"
  fr: "@a@b*ⓢ Je n'arrive pas à comprendre ce qui lui est passé par la tête.\n@c0@"
  it: "@a@b*: Non riesco proprio a capire cos'abbia in mente quella donna...\n@c0@"
  ja: "@a@b＊「まったく\n\tどうしてしまったのかねえ。\n@c0@"
102:
  de: "@a@b*: Heute wurde wieder so ein armer Kerl zum Tode verurteilt, weil er gegen die derzeitigen Verhältnisse rebelliert hat.\n@c0@"
  en: "@a@b*: Another poor fellow who dared to rebel against the current state of affairs was condemned to death today.\n@c0@"
