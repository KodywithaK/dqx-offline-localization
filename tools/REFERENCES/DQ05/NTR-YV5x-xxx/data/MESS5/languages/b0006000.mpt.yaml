  en: "@aMaria@bWelcome. This is a place for people to pray to the Goddess and learn better ways to live their lives.\n@c0@"
  es: "@aMaría@b¡%H0860%XTe%YOs%Z doy la bienvenida! En este lugar las personas pueden rezar a la Diosa y aprender a reconocer el buen camino.\n@c0@"
  fr: "@aMaria@bBienvenue. Ce lieu est destiné aux gens qui veulent prier la Déesse et apprendre à mieux vivre leur vie.\n@c0@"
  it: "@aMaria@b%H0860%XTi%YVi%Z do il benvenuto in questo luogo dove le persone pregano la dea e imparano a vivere in armonia con il mondo che le circonda.\n@c0@"
  ja: "@a@bマリア「こんにちは。\n\tここでは　誰もが　神に祈り\n\t生き方を　学ぶことができますわ。\n@c0@"
