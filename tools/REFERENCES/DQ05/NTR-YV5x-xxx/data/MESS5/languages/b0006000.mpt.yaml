  es: "@aHermana subcelestial@bSolo una doncella de la Diosa tiene el poder de abrir las puertas.\n@c0@"
  fr: "@aSœur du Firmament@bSeule une servante de la Déesse peut en ouvrir les portes.\n@c0@"
