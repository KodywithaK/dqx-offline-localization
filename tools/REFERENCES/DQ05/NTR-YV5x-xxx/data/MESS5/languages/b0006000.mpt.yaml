  fr: "@aMaria@bMoi, je veux y allerⓠ\n@c0@"
  it: "@aMaria@bCi andrò io!\n@c0@"
  ja: "@a@bマリア「私に　行かせてください！\n@c0@"
187:
  de: "@aNonne von Obendroben@bMaria!\n@c0@"
  en: "@aNun of the Above@bMaria!\n@c0@"
  es: "@aHermana subcelestial@b¡María!\n@c0@"
