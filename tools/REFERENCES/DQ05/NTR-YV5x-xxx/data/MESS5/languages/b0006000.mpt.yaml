95:
  de: "@a@b*: Ich glaube nicht, dass ich Euch schon mal gesehen habe. Seid Ihr neu in der Stadt? Dann nehmt einen guten Rat von mir an.\n@c0@"
  en: "@a@b*: I don't believe I've seen you before. Are you new in town? Then allow me to give you a tip.\n@c0@"
  es: "@a@b*: Creo que no %H0860%Xte había%Yos había%Z visto antes. ¿%H0860%XEres nuevo%YSois nuevos%Z en el pueblo? Pues %H0860%Xdéjame darte%Ydejadme daros%Z un consejo.\n@c0@"
  fr: "@a@b*ⓢ C'est la première fois que je vous vois ou je me trompeⓡ Vous venez d'arriverⓡ Alors laissez-moi vous donner un conseil.\n@c0@"
  it: "@a@b*: Non mi sembra di aver mai visto %H0860%Xla tua faccia%Yle vostre facce%Z prima. Non è molto che %H0860%Xbazzichi%Ybazzicate%Z da queste parti, vero? Voglio %H0860%Xrivelarti%Yrivelarvi%Z un segreto...\n@c0@"
  ja: "@a@b＊「あら　あなた　見かけない顔ね。\n\t新しく　やとわれた人でしょ。\n\tだったら　教えてあげる。\n@c0@"
96:
  de: "@a@b*: Zwar ist König Wilbur offiziell der Herrscher über unser Reich, aber es ist seine Mutter, die Königinwitwe, die alle Fäden in der Hand hält.\n@c0@"
  en: "@a@b*: King Wilbur is the ruler of our kingdom,\r\nbut it's really his mother, the Queen Dowager, who pulls all the strings.\n@c0@"
  es: "@a@b*: El rey Leonoro es el gobernante de nuestro reino, pero en realidad es la Reina Madre la que maneja los hilos.\n@c0@"
  fr: "@a@b*ⓢ Le roi Will est à la tête de notre royaume, mais c'est sa mère, la reine douairière, qui tire les ficelles.\n@c0@"
  it: "@a@b*: Anche se sul trono siede re Fabian, è la Regina Madre a comandare. È lei che prende tutte le decisioni, non quella marionetta del figlio.\n@c0@"
  ja: "@a@b＊「この国の王は　デールさま。\n\tでも実権は　デールさまの母上\n\t太后さまが　にぎっているのよ。\n@c0@"
97:
  de: "@a@b*: Ihr würdet gut daran tun, ihr nicht in die Quere zu kommen. Sonst lässt sie sich Euren Kopf auf einem Silbertablett servieren.\n@c0@"
  en: "@a@b*: You'd be wise not to get on her wrong side.\nShe'll have your head on a platter if you do.\n@c0@"
  es: "@a@b*: Será mejor que no la %H0860%Xhagas%Yhagáis%Z enfandar.\nOrdenará que %H0860%Xte%Yos%Z corten la cabeza.\n@c0@"
  fr: "@a@b*ⓢ Il est préférable de s'en faire une amie plutôt qu'une ennemie ou elle aura votre tête.\n@c0@"
  it: "@a@b*: Non conviene inimicarsela, a meno che non si voglia diventare ospiti permanenti delle prigioni del Regno.\nO del cimitero...\n@c0@"
  ja: "@a@b＊「くれぐれも　太后さまに\n\tさからわないことね。\n\tでないと　クビが　とぶわよ。\n@c0@"
98:
  de: "@a@b*: Die Königinwitwe hat ihren Sohn Wilbur immer verhätschelt.\n@c0@"
  en: "@a@b*: The Queen Dowager always used to dote on her son Wilbur.\n@c0@"
