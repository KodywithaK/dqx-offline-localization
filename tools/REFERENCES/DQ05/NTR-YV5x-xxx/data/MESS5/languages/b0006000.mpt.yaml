  it: "@aSuora di Su'ncyel@bChe cosa? %H0860%XDevi recarti%YDovete recarvi%Z alla Tur Magis per trovare uno specchio misterioso?\nChe la dea %H0860%Xti%Yvi%Z protegga!\n@c0@"
  ja: "@a@b＊「え？　ふしぎな鏡が　まつられている\n\t南の塔に　入りたいと？\n\tそれは　こまりましたね。\n@c0@"
184:
  de: "@aNonne von Obendroben@bNur eine Dienerin der Göttin hat die Macht, die Türen zu öffnen.\n@c0@"
