  it: "@aSuora di Su'ncyel@bNon credo di averti mai %A0110%Xvisto%Z%B0110%Xvista%Z...\nForse sei %A0110%Xun amico%Z%B0110%Xun'amica%Z di %a000090?\n@c0@"
  ja: "@a@b＊「あら　思いがけぬ　お客さま\n\tだこと。　え？　%a000090さんたちの\n\tお仲間ですって？\n@c0@"
181:
