  es: "@aMadre superiora supercelestial@bLos que son demasiado soberbios para creer en aquello que no ven no recibirán la bendición de la Todopoderosa.\n@c0@"
  fr: "@aAbbesse du Firmament@bCeux qui sont trop fiers pour ne pas croire en ce qu'ils ne voient pas ne recevront sûrement pas la bénédiction de la Toute-Puissante.\n@c0@"
  it: "@aMadre superiora@bChi si dimostrerà incapace di credere in ciò che non vede non verrà toccato dalla benedizione dell'onnipotente.\n@c0@"
  ja: "@a@b＊「おのれの　見たことしか\n\t信じぬ者は　その　ごうまんさ故に\n\t神の祝福を受けられないでしょう。\n@c0@"
199:
  de: "@aOberin Obenhin@bNur wer sich ihm voller Mut und Glauben nähert, dem wird sie Gnade erweisen.\n@c0@"
  en: "@aAbbess Abovall@bOnly those who step forward with courage and belief are bestowed with Her mercy.\n@c0@"
  es: "@aMadre superiora supercelestial@bSolo aquellos que avancen con fe y coraje serán dignos de su misericordia.\n@c0@"
  fr: "@aAbbesse du Firmament@bSeuls ceux qui font preuve de courage et qui ont foi en elle bénéficieront de sa miséricorde.\n@c0@"
  it: "@aMadre superiora@bSolo chi saprà procedere dimostrando di possedere fede e coraggio godrà della sua protezione.\n@c0@"
  ja: "@a@b＊「勇気を出して\n\t一歩　ふみ出した者だけが\n\tその祝福を　受けられるとか。\n@c0@"
200:
  de: "@aOberin Obenhin@bIch wünsche Euch eine sichere Reise.\n@c0@"
