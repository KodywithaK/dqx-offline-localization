  en: "@aMaria@bI'm doing well, thank you. Everyone here has treated me so nicely.\n@c0@"
  es: "@aMaría@bEstoy bien, gracias. Todos me han tratado muy bien aquí.\n@c0@"
  fr: "@aMaria@bJe vais très bien, merci. Tout le monde a été si gentil avec moi, ici.\n@c0@"
  it: "@aMaria@bIo sto bene, e di ciò ringrazio la dea.\nQui mi sento come a casa.\n@c0@"
  ja: "@a@bマリア「ええ。　私は元気です。\n\t皆さん　とても\n\tよくしてくださるし……。\n@c0@"
180:
  de: "@aNonne von Obendroben@bIch glaube, wir haben uns noch nicht kennengelernt. Ach, Ihr seid also mit %a000090 bekannt?\n@c0@"
  en: "@aNun of the Above@bI don't believe I've ever seen you before.\nAh, a friend of %a000090's, are you?\n@c0@"
