  en: "@aNun of the Above@bWe treat things with the utmost care, and we have a great love for the land. Those are two of the main principles of our order.\n@c0@"
  es: "@aHermana subcelestial@bTratamos las cosas con un cuidado exquisito y amamos profundamente la tierra. Son los dos principios esenciales de nuestra orden.\n@c0@"
  fr: "@aSœur du Firmament@bNous traitons toute chose avec le plus grand soin et nous aimons profondément notre terre. Ce sont deux des grands principes de notre ordre.\n@c0@"
  it: "@aSuora di Su'ncyel@bAmiamo la natura e tutte le persone e gli oggetti che ci circondano, perché tutto è stato creato dalla nostra dea misericordiosa.\n㈡\nQuesto è il principio su cui si fonda il nostro ordine.\n@c0@"
  ja: "@a@b＊「物を大切に　そして\n\tこの大地を愛すること。　それが\n\tわが修道院の　教えのひとつです。\n@c0@"
173:
  de: "@a@b*: Maria ist sooo hübsch!\n@c0@"
