  ja: "@a@bマリア「まあ！\n\t神さまが　私の願いを\n\t聞きとどけてくださったのかしら。\n@c0@"
178:
  de: "@aMaria@bIch hatte von ganzem Herzen gehofft, dich wiederzusehen, %a000090. Und dich auch, Harry!\n@c0@"
  en: "@aMaria@bI've been hoping with all my heart to see you again, %a000090. And you, Harry!\n@c0@"
