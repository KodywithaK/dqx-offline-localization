  fr: "@aMaria@bJ'espérais de tout mon cœur te revoir, %a000090. Et toi aussi, Harryⓠ\n@c0@"
  it: "@aMaria@bSperavo tanto di rivederti, %a000090!\nE anche te, Robert!\n@c0@"
  ja: "@a@bマリア「%a000090さまと\n\tヘンリーさまには　また\n\tお会いしたいと……。　ぽっ。\n@c0@"
179:
