  en: "@aNun of the Above@bThen you must ask %a000090 to come and show his face here once in a while. \nIt'd be lovely to see him again.\n@c0@"
  es: "@aHermana subcelestial@bEntonces debes decirle a %a000090 que venga a visitarnos de vez en cuando.\nSería maravilloso volver a verle.\n@c0@"
  fr: "@aSœur du Firmament@bDans ce cas, dites-lui de venir nous voir de temps en temps. Nous serions tous ravis de le revoir.\n@c0@"
  it: "@aSuora di Su'ncyel@bPer favore, riferisci a %a000090 di passare a trovarci.\nSaremmo molto felici di rivederlo.\n@c0@"
  ja: "@a@b＊「それなら　ぜひ\n\t%a000090さんたちにも　お顔を\n\t見せていただきたいですわ。\n@c0@"
182:
  de: "@aNonne von Obendroben@bAh! Euch habe ich heute nicht hier erwartet! Oh jemine, aber Ihr seht so traurig aus. Stimmt etwas nicht?\n@c0@"
  en: "@aNun of the Above@bAh! I didn't expect to see you today! Oh dear, but you look so sad. Is something the matter?\n@c0@"
  es: "@aHermana subcelestial@b¡Ah! ¡No esperaba verte hoy! ¡Oh!, vaya, pareces triste. ¿Sucede algo?\n@c0@"
  fr: "@aSœur du Firmament@bAhⓠ Je ne m'attendais pas à vous voir aujourd'huiⓠ\nVous avez l'air bien %H0860%Xtriste, mon enfant%Ytristes, mes enfants%Z.\nQuelque chose vous tracasseⓡ\n@c0@"
  it: "@aSuora di Su'ncyel@bOh, non mi aspettavo di vederti qui oggi!\nHai un'espressione seria, %A0110%Xfratello%Z%B0110%Xsorella%Z...\nDimmi, forse qualcosa ti turba?\n@c0@"
  ja: "@a@b＊「あら　思いがけぬ　お客さま\n\tだこと。　でも　お顔が……。\n\tなにか　おこまりですか？\n@c0@"
183:
  de: "@aNonne von Obendroben@bOh! Ihr müsst in den Hochhinaus-Turm, um einen geheimnisvollen Spiegel zu finden? Du liebe Güte!\n@c0@"
