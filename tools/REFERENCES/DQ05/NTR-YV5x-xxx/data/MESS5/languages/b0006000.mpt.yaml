  it: "@aMadre superiora@bHo saputo che %H0860%Xhai%Yavete%Z intenzione di %H0860%Xrecarti%Yrecarvi%Z alla Tur Magis, a sud dell'abbazia.\n@c0@"
  ja: "@a@b＊「南の塔に　行かれるのですね。\n@c0@"
197:
