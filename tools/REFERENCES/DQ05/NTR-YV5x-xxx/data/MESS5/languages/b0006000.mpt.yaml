  en: "@aQueen Dowager@bIt is I. I'm the one who left Prince Harry for dead all those years ago, I tell you!\n@c0@"
  es: "@aReina Madre@b¿Qué te pasa? ¿Por qué estás vacilando? ¿Es que no crees que sea quien digo que soy? ¡Oh, maldición!\n@c0@"
  fr: "@aReine douairière@bC'est bien moi. C'est moi qui ai fait croire à la mort du prince Harry.\n@c0@"
  it: "@aRegina Madre@bÈ vero, lo ammetto.\nTanti anni fa, feci credere che il principe Robert fosse morto...\n@c0@"
  ja: "@a@b＊「たしかに　１０年前\n\tヘンリーをさらわせ　亡き者に\n\tさせたのは　わらわじゃ。\n@c0@"
92:
  de: "@aKöniginwitwe@bAber ich tat nur, was ich für meinen Sohn für das Beste hielt, damit mein geliebter Wilbur König werden konnte.\n@c0@"
  en: "@aQueen Dowager@bBut I was just doing what was best for my son,\nso that my dear Wilbur could become king.\n@c0@"
  es: "@aReina Madre@bSoy yo. ¡Yo fui la que dio por muerto al príncipe Froilán hace tantos años, te lo aseguro!\n㈡\nPero hice lo que era mejor para mi hijo, para que mi querido Leonoro pudiese ser rey.\n@c0@"
  fr: "@aReine douairière@bMais je ne faisais que mon devoir de mère.\r\nJe voulais que mon cher Will devienne roi.\n@c0@"
  it: "@aRegina Madre@bMa lo feci solo perché volevo il bene di mio figlio Fabian. Volevo che fosse lui a diventare il futuro Re di Coburg!\n@c0@"
  ja: "@a@b＊「しかし　それも　わが息子\n\tデールを　王にさせたかった\n\tあわれな親心から……。\n@c0@"
93:
