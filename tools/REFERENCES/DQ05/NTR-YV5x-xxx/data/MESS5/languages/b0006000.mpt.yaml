  es: "@aHermana subcelestial@bMe pregunto cómo estará aquella chica que vino a hace un tiempo a recibir el curso de economía doméstica de la Diosa.\n@c0@"
  fr: "@aSœur du Firmament@bJe me demande comment va la jeune fille qui était venue ici il y a quelque temps pour faire son éducation domestique et religieuse.\n@c0@"
  it: "@aSuora di Su'ncyel@bA volte penso alla cara fanciulla che era venuta all'abbazia per seguire il corso di preparazione al matrimonio. Chissà come sta adesso...\n@c0@"
  ja: "@a@b＊「しばらく前まで　花嫁修業に\n\tいらしていた　おじょうさまは\n\tお元気かしら……。\n@c0@"
206:
  de: "@aNonne von Obendroben@bIch hoffe wirklich, dass das, was sie hier gelernt hat, ihr im späteren Leben einmal von Nutzen sein wird.\n@c0@"
  en: "@aNun of the Above@bI do hope the things she learnt here will be of some use to her in later life.\n@c0@"
  es: "@aHermana subcelestial@bEspero que lo que aprendió le sirva más adelante en la vida.\n@c0@"
  fr: "@aSœur du Firmament@bJ'espère que ce qu'elle a appris lui servira dans le futur.\n@c0@"
