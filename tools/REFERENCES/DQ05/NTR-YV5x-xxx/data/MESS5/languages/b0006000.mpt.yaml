  fr: "@aSœur du Firmament@bPar la Déesseⓠ Un monstre dans notre paisible sanctuaireⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bOh, santa dea!\nUn mostro qui?!\n@c0@"
  ja: "@a@b＊「あらあら　モンスターが\n\tここにはいってくるなんて！\n@c0@"
208:
