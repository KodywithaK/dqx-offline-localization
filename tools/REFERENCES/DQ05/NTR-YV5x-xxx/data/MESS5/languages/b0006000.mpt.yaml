  es: "@a@b*: Ahora actúa como si él no fuese más que un estorbo.\n@c0@"
  fr: "@a@b*ⓢ Maintenant, elle se comporte comme s'il n'était qu'un simple obstacle sur son chemin.\n@c0@"
  it: "@a@b*: Adesso si comporta come se il figlio fosse solo un essere inutile, un fantoccio senza cervello.\n@c0@"
  ja: "@a@b＊「今では　国王のデールさまを\n\tジャマにさえ思っている\n\tご様子。\n@c0@"
101:
