  it: "@a@b*: Non so quali ragioni ci siano dietro il comportamento della Regina Madre, ma una cosa è certa: non si può andare avanti in questo modo!\n@c0@"
  ja: "@a@b＊「太后さまの命令とはいえ\n\tいったい　いつまで\n\tこんな事が続くのだろうか……。\n@c0@"
