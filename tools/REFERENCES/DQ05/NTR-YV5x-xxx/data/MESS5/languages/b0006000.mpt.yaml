  fr: "@a@b*ⓢ La reine douairière a toujours aimé son fils Will à la folie.\n@c0@"
  it: "@a@b*: La Regina ha sempre stravisto per suo figlio Fabian.\nLo preferiva di gran lunga al povero Robert.\n@c0@"
  ja: "@a@b＊「太后さまも　王妃さまの頃は\n\t息子のデールさまを　あんなに\n\tかわいがっていたのに……。\n@c0@"
99:
  de: "@a@b*: Aber sobald er König und sie von der Königlichen Gemahlin zur Königinwitwe wurde, war ihr Verhalten plötzlich wie ausgewechselt.\n@c0@"
  en: "@a@b*: But as soon as he became king and her role changed from Queen Consort to Queen Dowager, it was like a sudden change came over her. \n@c0@"
  es: "@a@b*: Pero, en cuanto él se proclamó rey y su rol cambió de Reina Consorte a Reina Madre, algo cambió en su comportamiento. \n@c0@"
  fr: "@a@b*ⓢ Pourtant, dès qu'il est monté sur le trône et qu'elle est passée du statut de reine consort à reine douairière, elle a changé du tout au tout.\n@c0@"
  it: "@a@b*: Tuttavia, non appena Fabian è diventato Re e lei ha assunto il titolo di Regina Madre, le cose sono cambiate radicalmente.\n@c0@"
  ja: "@a@b＊「デールさまが　国王になり\n\t自分が太后さまになったとたん\n\t人が　変わってしまって……。\n@c0@"
100:
  de: "@a@b*: Jetzt möchte man meinen, dass er nichts als eine Nervensäge ist, die ihr im Weg steht.\n@c0@"
