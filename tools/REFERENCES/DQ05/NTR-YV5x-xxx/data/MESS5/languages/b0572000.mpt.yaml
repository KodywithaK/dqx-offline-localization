  it: "@aSancho@b¿Chico, conosce el proverbio que dice ⓕGambas mias no es vergogna de fuggir cuando bisognaⓖ?\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\tもしも　つらいようなら\n\t入り口にもどっても　いいんですよ。\n@c0@"
25:
  de: "@aSancho@bDiss wird ganz bestimmt keiner auslachen, das verspresse iss dir.\n@c0@"
  en: "@aSancho@bNo one weell laugh at you, I promise.\n@c0@"
  es: "@aSancho@bNadie se reirá de usted, lo prometo.\n@c0@"
  fr: "@aSancho@bPersonne ne se m-moquera de toi. Je te le p-promets.\n@c0@"
  it: "@aSancho@b¡Si tu siente la necessità de escappare da esto luego, no pienserò nemmenos por un istante que tu sei un vigliaccon!\n@c0@"
  ja: "@a@bサンチョ「だれも　%a000090王のこと\n\t笑ったりしませんからね！\n@c0@"
26:
  de: "@aSancho@bHast du diss verirrt, Chico?\n@c0@"
  en: "@aSancho@bAre you lost, friend?\n@c0@"
  es: "@aSancho@b¿Te has perdido, chamaquito?\n@c0@"
  fr: "@aSancho@bTu es p-perdu, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, ce siamo persos?\n@c0@"
  ja: "@a@bサンチョ「もしや　道に　迷いましたね？\n@c0@"
27:
  de: "@aSancho@bIn solssen Momenten gibt es nur noch eine Möglisskeit. Du musst den Zauber Hintertür wirken!\n@c0@"
  en: "@aSancho@bAt times like thees, there ees only one way to go.\nYou must cast Evac!\n@c0@"
