  it: "@aSancho@b¡Ay, que mal!\nEn estos casos, la unica cosa da fare es lanciare ⓕUscita istantaneaⓖ...\n@c0@"
  ja: "@a@bサンチョ「それじゃ　教えてあげましょう。\n\tリレミトですよ　こういうときは。\n@c0@"
28:
