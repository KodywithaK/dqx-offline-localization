0:
  de: "@aBianca@bEine Höhle hätte ich an einem solchen Ort nicht vermutet.\n@c0@"
  en: "@aBianca@bI didn't expect to find a cave in a place like this.\n@c0@"
  es: "@aBianca@bNo esperaba encontrar una cueva en un lugar así, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne pensais pas trouver une grotte dans un endroit comme celui-là.\n@c0@"
  it: "@aBianca@bUna caverna?\nQuesta proprio non me l'aspettavo...\n@c0@"
  ja: "@a@bビアンカ「どうして　こんな場所に\n\tこんな洞くつが　あるのかしら。\n@c0@"
1:
  de: "@aBianca@bMir gefällt's hier gar nicht. Wir sollten aufpassen, wo wir hintreten, %a000090.\n@c0@"
  en: "@aBianca@bI dun't much like the look of this place. We'd better watch where we're walkin', %a000090.\n@c0@"
  es: "@aBianca@bEste sitio no me gusta, ¿sabes? Será mejor mirar por dónde andamos, %a000090.\n@c0@"
  fr: "@aBianca@bJe n'aime pas trop ce coin. Mieux vaut faire attention où on met les pieds, %a000090.\n@c0@"
  it: "@aBianca@bNon mi piace questo posto, %a000090.\nProcediamo con cautela...\n@c0@"
  ja: "@a@bビアンカ「なんだか　足もとが\n\tあやしいわね。\n\t%a000090　よく見て　進みましょ。\n@c0@"
2:
  de: "@aNera@bSei vorsichtig, Liebling. In dieser Höhle spüre ich ein paar sehr finstere Schwingungen.\n@c0@"
  en: "@aNera@bDo be careful, darling. I can't help feeling some very sinister vibes here in this cave.\n@c0@"
  es: "@aNera@bTen cuidado, caro. No dejo de sentir vibraciones siniestras en questa cueva.\n@c0@"
  fr: "@aNera@bFais bien attention, mon chéri. Cette grotte dégage quelque chose de sinistre.\n@c0@"
  it: "@aNera@bFacciamo attenzione, tesoro...\nPercepisco delle vibrazioni negative in questa grotta...\n@c0@"
  ja: "@a@bフローラ「あなた　気をつけて。\n\tこの洞くつからは\n\tただならぬ気配を　感じますわ。\n@c0@"
3:
  de: "@aNera@bDer Weg hier ist so trügerisch, dass es mich ganz nervös macht, ihn zu gehen!\n@c0@"
  en: "@aNera@bThe path here is so treacherous that just walking along it is enough to make me nervous!\n@c0@"
  es: "@aNera@b¡La senda hasta aquí es tan traicionera que solo di camminare me estoy poniendo nerviosa!\n@c0@"
  fr: "@aNera@bLe chemin est traître et le simple fait de marcher me rend nerveuseⓠ\n@c0@"
  it: "@aNera@bQuesto sentiero è un po' troppo pericoloso per i miei gusti...\nMi fa venire la tremarella alle ginocchia!\n@c0@"
  ja: "@a@bフローラ「それにしても\n\t足もとが　あやしくて…\n\t歩くだけで　ドキドキします……。\n@c0@"
4:
  de: "@a%0%a001240@bKomisch, dass diese Höhle einfach so aus dem Nichts aufgetaucht ist. Bei der Unterwelt muss man auf alles gefasst sein, was?\n@c0@"
  en: "@a%0%a001240@bIt's funny that this cave just popped up out of nowhere. You never can tell with the underworld, can you?\n@c0@"
  es: "@a%0%a001240@bEs curioso que haya aparecido esta cueva como surgida de la nada. En el inframundo, nunca se sabe, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bC'est drôle que cette grotte soit apparue comme ça. On ne sait jamais ce qui peut se passer dans le monde souterrain.\n@c0@"
  it: "@a%0%a001240@bUna caverna sbucata fuori dal nulla...\nIl Regno degli Inferi non finisce mai di sorprendermi!\n@c0@"
  ja: "@a@b%a001240「前までは　なにもなかったのに\n\tこんな洞くつが　出現するなんて\n\t魔界って　ホント　ふしぎだね。\n@c0@"
5:
  de: "@a%0%a001240@bÄhm, Papa... Sind die M-Monster hier in dieser Höhle sehr stark? (Schluck)\n@c0@"
  en: "@a%0%a001240@bUm, Dad... Are the m-monsters here in this cave really strong? (gulp)\n@c0@"
  es: "@a%0%a001240@bMmm, papá... ¿Son muy f-fuertes los monstruos de esta caverna? (glup)\n@c0@"
  fr: "@a%0%a001240@bMmm, papa... Les m-monstres de cette grotte sont\nf-forts, à ton avisⓡ (gloups)\n@c0@"
  it: "@a%0%a001240@bPapà, credi che i mostri che vivono qui dentro siano molto forti...?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん！\n\tこの洞くつの魔物って…\n\tつ　強いよね……　ごくっ。\n@c0@"
6:
  de: "@a%0%a001250@bAu! Mir tut der Kopf weh! Ich verspüre hier drin eine sehr mächtige Präsenz!\n@c0@"
  en: "@a%0%a001250@bOw! My head hurts! I can feel something really powerful in here.\n@c0@"
  es: "@a%0%a001250@b¡Au! ¡Me duele la cabeza! Siento que aquí hay algo muy poderoso.\n@c0@"
  fr: "@a%0%a001250@bOhⓠ J'ai mal à la têteⓠ Je sens quelque chose de vraiment puissant ici.\n@c0@"
  it: "@a%0%a001250@bPercepisco una forza ignota e potentissima...\nMi sta facendo scoppiare la testa...!\n@c0@"
  ja: "@a@b%a001250「ううっ…　あたま　いたい。\n\tすごいチカラを　感じるの……。\n@c0@"
7:
  de: "@a%0%a001250@bÄhm, hörst du das auch oder bilde ich mir das nur ein?\n@c0@"
  en: "@a%0%a001250@bUm, can you hear something, or is it\njust my imagination?\n@c0@"
  es: "@a%0%a001250@bMmm, ¿oyes algo, o es solo mi imaginación?\n@c0@"
  fr: "@a%0%a001250@bEuh, tu as entendu quelque chose aussi ou je me fais des idéesⓡ\n@c0@"
  it: "@a%0%a001250@bMi è sembrato di udire qualcosa...\nMah, forse me lo sono sognato...\n@c0@"
  ja: "@a@b%a001250「あのね。\n\tなにか　ぐごごって　聞こえない？\n@c0@"
8:
  de: "@aSancho@bChico! Warum sind wir in dieser Höhle? Wir waren doch unserem Ziel schon so nahe.\n@c0@"
  en: "@aSancho@bFriend! Why are we een thees cave?\nWe were eso near to our goal.\n@c0@"
  es: "@aSancho@b¡Chamaquito! ¿Qué hacemos en esta cueva?\nYa estábamos bien cerquita de nuestro objetivo.\n@c0@"
  fr: "@aSancho@bChicoⓠ Qu'est-ce qu'on f-fait dans cette g-grotteⓡ\nOn était si près du b-but.\n@c0@"
  it: "@aSancho@b¿Chico, por qué estiamo en esta caverna?\nEravamo vicinos a raggiungere la nuestra destinación...\n@c0@"
  ja: "@a@bサンチョ「ぼ　坊っちゃん！\n\t目指す先は　もう目の前なのに\n\tこの洞くつはっ！？\n@c0@"
9:
  de: "@aSancho@bOnkel Sancho, er mag diese Höhle nisst besonders. Wenn iss vorangehe, dann befürsste iss, iss rutsche und wir landen auf dem Fallenboden.\n@c0@"
  en: "@aSancho@bUncle Sancho, he no like thees cave eso much.\r\nEef I am een the lead, maybe I ees eslipping and walking on the bobo-trap floor.\n@c0@"
  es: "@aSancho@bAl tito Sancho no le gusta demasiado esta cueva...\n㈡\nSi fuera yo adelante, a poco resbalaría y caería en las trampas del suelo.\n@c0@"
  fr: "@aSancho@bTonton Sancho, il n'aime pas mucho cette g-grotte.\r\nSi j-je passe devant, peut-être que je vais glisser et m-marcher là où il ne faut pas.\n@c0@"
  it: "@aSancho@bNo me gusta esta caverna...\nHo paura de finire en un trappolon.\n@c0@"
  ja: "@a@bサンチョ「あわわ…　何ですか　ここは？\n\t私が先頭を行ったら　ぬけない床まで\n\tぬけちまいそうですよ。\n@c0@"
10:
  de: "@aOtto@bJemine! Ja, was ist denn hier los? Warum sind die Ungeheuer so stark?\n@c0@"
  en: "@aTuppence@bDear me! Whatever is going on here? Why are the monsters so strong?\n@c0@"
  es: "@aAlazar@b¡Oh, cielos! ¿Qué demonios pasa aquí? ¿Por qué son los monstruos tan fuertes?\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ Qu'est-ce qui se passe, iciⓡ Pourquoi les monstres sont-ils si fortsⓡ\n@c0@"
  it: "@aSimon@bPer tutti gli spadoni!\nMa che razza di posto è mai questo?!\nNon avevo mai incontrato mostri tanto forti!\n@c0@"
  ja: "@a@bピピン「……なんなんでしょう\n\tここの魔物は…　こんな強い連中\n\tこれまで　見たことないですよ！\n@c0@"
11:
  de: "@aOtto@bAh! Ich glaub', ich hab's! Das ist wie eine Prüfung unseres Könnens vor dem Endkampf!\n@c0@"
  en: "@aTuppence@bAh! I think I've figured it out! This is like a challenge to test our skills before the final battle!\n@c0@"
  es: "@aAlazar@b¡Ah! ¡Creo que lo he descubierto! ¡Es como un reto para probar nuestra habilidad antes de la batalla definitiva!\n@c0@"
  fr: "@aInnocent@bAhⓠ Je crois avoir comprisⓠ C'est un peu une sorte de test avant le combat final.\n@c0@"
  it: "@aSimon@bMaestà, credo che i nostri avversari ci stiano mettendo alla prova prima della battaglia finale...\n@c0@"
  ja: "@a@bピピン「わかりましたっ！\n\tさては　最後の敵をたおす前に\n\tウデだめしってわけですね？\n@c0@"
12:
  de: "@aOtto@bNur schad', dass die Prüfung so schwer ist...\n@c0@"
  en: "@aTuppence@bIt's a shame they have to make the challenge so tricky, mind you...\n@c0@"
  es: "@aAlazar@bLa pena es que hayan tenido que hacer el reto tan complicado...\n@c0@"
  fr: "@aInnocent@bEn même temps, je le trouve un peu trop corsé...\n@c0@"
  it: "@aSimon@bSa che le dico, Sire?\nData l'estrema difficoltà di questo cimento, potremmo anche non arrivarci alla battaglia finale!\n@c0@"
  ja: "@a@bピピン「し　しかし　このウデだめしは\n\tそうとう　キビしいです……。\n@c0@"
13:
  de: "@aBianca@bMoment mal! Sind wir nicht gerade erst hier durchgekommen? Jetzt bin ich ganz durcheinander.\n@c0@"
  en: "@aBianca@bHang on a minute! Didn't we just come through here? Now I'm really confused.\n@c0@"
  es: "@aBianca@b¡Espera un minuto! ¿No hemos venido por ahí? Ahora sí que me he liado.\n@c0@"
  fr: "@aBianca@bAttendsⓠ On n'est pas déjà passés par iciⓡ\nJe ne sais vraiment plus où j'en suis.\n@c0@"
  it: "@aBianca@bAspetta, maritino...\nMa non siamo già passati di qua...?\nNon ci capisco più niente!\n@c0@"
  ja: "@a@bビアンカ「あれっ？\n\tここって　さっきも通った？\n\tもう　ぜんぜん　わからないわ。\n@c0@"
14:
  de: "@aBianca@bWarum sind die Monster hier nur so verflixt stark?!\n@c0@"
  en: "@aBianca@bWhy do all the monsters in this place have to be so blimmin' strong!?\n@c0@"
  es: "@aBianca@b¿Por qué narices tienen que ser tan fuertes todos los monstruos de este lugar?\n@c0@"
  fr: "@aBianca@bPourquoi tous les monstres sont si forts dans\ncette grotteⓠⓑ\n@c0@"
  it: "@aBianca@bMa perché tutti i mostri in cui ci stiamo imbattendo sono così incredibilmente forti, eh?!\n@c0@"
  ja: "@a@bビアンカ「どーしてこう\n\t出てくる敵　出てくる敵\n\tみんな　強いのよ？\n@c0@"
15:
  de: "@aBianca@bMeinst du, da will uns irgendwer prüfen, wie gut wir sind oder so?\n@c0@"
  en: "@aBianca@bDo you think someone somewhere is tryin' to test us or somethin'?\n@c0@"
  es: "@aBianca@b¿Crees que alguien nos está poniendo a prueba o algo así?\n@c0@"
  fr: "@aBianca@bQuelqu'un essaie de nous mettre à l'épreuve\nou quoiⓡ\n@c0@"
  it: "@aBianca@bHo la sensazione che qualcuno stia mettendo alla prova le nostre capacità...\n@c0@"
  ja: "@a@bビアンカ「もしかして　私たち\n\tだれかに　試されてるのかしら？\n@c0@"
16:
  de: "@aNera@bHaah... Haah... Alles in Ordnung, Liebling? Die Ungeheuer hier sind so erschreckend stark!\n@c0@"
  en: "@aNera@bHaah... Haah... Are you alright, darling?\r\nThe monsters in here are so formidable!\n@c0@"
  es: "@aNera@bAhhh... Ahhh... ¿Estás bien, caro?\n¡Aquí los monstruos son formidables!\n@c0@"
  fr: "@aNera@bHan... Han... Tout va bien, mon chériⓡ\nLes monstres de cette grotte sont redoutablesⓠ\n@c0@"
  it: "@aNera@bHaaahhh... Haaahhh... Oh, che faticaaah... Caaahro, stai bene...? Hai visto quaaahnto sono forti i mostri che stiaaahmo incontraaahndo...? Haaahhh...\n@c0@"
  ja: "@a@bフローラ「はあ…　はあ…\n\tあなた　大丈夫ですか？\n\tここの魔物たちは　強くて……。\n@c0@"
17:
  de: "@aNera@bWir gehen immer weiter, und doch ist es, als landeten wir dauernd wieder am gleichen Ort. Hoffentlich haben wir uns nicht verirrt.\n@c0@"
  en: "@aNera@bWe keep on moving forwards and yet it feels like we're always back in the same place. I hope we're not lost.\n@c0@"
  es: "@aNera@bNo paramos de andar hacia adelante ma sembra que estamos siempre en el mismo sitio. Espero que no nos hayamos perdido.\n@c0@"
  fr: "@aNera@bOn ne cesse d'avancer et pourtant, on a l'impression de se retrouver toujours au même endroit. J'espère qu'on est pas perdus.\n@c0@"
  it: "@aNera@bMi spiace dirlo, ma temo che ci siamo persi.\nContinuiamo a camminare, ma mi pare che finiamo per ritrovarci sempre nello stesso posto!\n@c0@"
  ja: "@a@bフローラ「行っても行っても\n\t同じような　場所ばかりで…\n\tこの道でいいのか不安になりますわね。\n@c0@"
18:
  de: "@a%0%a001240@bWenn wir die Monster hier leicht schlagen, dann sind wir unbesiegbar, oder?\n@c0@"
  en: "@a%0%a001240@bIf we manage to beat the monsters here easily, that'll mean we're invincible, right?\n@c0@"
  es: "@a%0%a001240@bSi conseguimos matar a estos monstruos con facilidad, significará que somos invencibles, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bSi nous réussissons à battre les monstres facilement ici, ça veut dire qu'on est invinciblesⓡ\n@c0@"
  it: "@a%0%a001240@bBisogna essere dei guerrieri fenomenali per battere i mostri che infestano questo posto!\nNon ne avevo mai incontrati di così feroci!\n@c0@"
  ja: "@a@b%a001240「もし　ここの魔物たちに\n\t楽に勝てるようになったら\n\t強くなったってことだよね？\n@c0@"
19:
  de: "@a%0%a001240@bDann werde ich mich nicht schlagen lassen! Ich versuch's weiter und immer weiter, bis ich sie besiege!\n@c0@"
  en: "@a%0%a001240@bThen I'm not going to be beaten! I'm going to keep on trying until I get the better of them!\n@c0@"
  es: "@a%0%a001240@b¡Entonces no van a poder conmigo! ¡Seguiré intentándolo hasta acabar con ellos!\n@c0@"
  fr: "@a%0%a001240@bDans ce cas, je ne vais pas me laisser faireⓠ\nJe vais réessayer jusqu'à ce que je les batteⓠ\n@c0@"
  it: "@a%0%a001240@bMa io non mi arrendo!\nContinuerò a lottare fino a quando non li avrò fatti secchi tutti, dal primo all'ultimo!\n@c0@"
  ja: "@a@b%a001240「よ～し！\n\tボク　弱音はかずに　がんばるよ！\n@c0@"
20:
  de: "@a%0%a001240@bSpürst du das auch, Papa? Wir werden von etwas sehr Mächtigem beobachtet. Ich kann es fühlen.\n@c0@"
  en: "@a%0%a001240@bCan you feel it too, Dad? We're being observed by something powerful. I can sense it.\n@c0@"
  es: "@a%0%a001240@b¿No lo notas, papá? Nos está observando algo muy poderoso. Puedo sentirlo.\n@c0@"
  fr: "@a%0%a001240@bTu sens la même chose que moi, papaⓡ\nJ'ai l'impression que quelque chose de\npuissant nous observe. Je le sens.\n@c0@"
  it: "@a%0%a001240@bPapà, credo che qualcuno ci stia osservando...\nAnche tu hai questa sensazione?\n@c0@"
  ja: "@a@b%a001240「お父さんも　感じるでしょ？\n\t強い魔物が　さっきから\n\tボクたちのこと　見てるみたいだよ。\n@c0@"
21:
  de: "@a%0%a001250@bÄhm... Woher sind wir noch mal gekommen? Und wo wollen wir jetzt hin?\n@c0@"
  en: "@a%0%a001250@bUm... Which way did we come from again?\nAnd which way do we go now?\n@c0@"
  es: "@a%0%a001250@bEsto... ¿Por dónde hemos venido?\n¿Y por dónde vamos?\n@c0@"
  fr: "@a%0%a001250@bMmm... D'où est-ce qu'on vient, déjàⓡ\nEt par où on doit allerⓡ\n@c0@"
  it: "@a%0%a001250@bNon mi ricordo da quale parte siamo venuti...\nE non ho la più pallida idea di dove dobbiamo andare!\n@c0@"
  ja: "@a@b%a001250「……えっと　さっきは\n\tどっちから来たの？\n\tこれから　どっちに行くの？\n@c0@"
22:
  de: "@a%0%a001250@bDie Wände sind so hoch, dass man nicht sehen kann, wo wir hinmüssen.\n@c0@"
  en: "@a%0%a001250@bThe walls are so high that it's impossible to see where we need to head for.\n@c0@"
  es: "@a%0%a001250@bLas paredes son tan altas que resulta imposible ver hacia dónde hay que ir.\n@c0@"
  fr: "@a%0%a001250@bLes murs sont si hauts qu'il est impossible de voir quelle direction il faut prendre.\n@c0@"
  it: "@a%0%a001250@bLe pareti sono così alte che non è possibile capire quale direzione dobbiamo prendere...\n@c0@"
  ja: "@a@b%a001250「カベが　高いから\n\tぜんぜん　先が見えないの。\n@c0@"
23:
  de: "@a%0%a001250@bDiese Höhle ist wirklich komisch. Es ist, als würden sich die Wege zwischen den verschiedenen Räumen ständig verändern.\n@c0@"
  en: "@a%0%a001250@bThis cave is really weird. It feels like the paths between the different rooms in it keep changing.\n@c0@"
  es: "@a%0%a001250@bEsta cueva es muy rara. Se diría que las rutas entre sus distintas salas varían continuamente.\n@c0@"
  fr: "@a%0%a001250@bCette grotte est vraiment bizarre. On dirait que les chemins entre les différentes salles n'arrêtent pas de changer.\n@c0@"
  it: "@a%0%a001250@bQuesta caverna è pazzesca!\nSembra quasi che le strade che collegano le stanze cambino ogni volta che le percorriamo!\n@c0@"
  ja: "@a@b%a001250「この洞くつ　なんだか　へん。\n\tだって　お部屋のつながり方が\n\tかわるような　気がするの。\n@c0@"
24:
  de: "@aSancho@bMeine Majestät. Es ist nisst zu spät, um umzukehren, wenn alles loco wird, no?\n@c0@"
  en: "@aSancho@bMy Majesty. Ees never too late to turn back eef theengs are becoming loco, no?\n@c0@"
