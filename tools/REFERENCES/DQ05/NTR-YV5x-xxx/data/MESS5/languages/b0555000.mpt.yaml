0:
  de: "@aBianca@bIrgendwie kommt mir das nicht richtig vor, dieser riesige Wachturm direkt vor einer friedlichen Stadt.\n@c0@"
  en: "@aBianca@bIt dun't seem right somehow, havin' a big lookout tower like this next to a peaceful town.\n@c0@"
  es: "@aBianca@bEsto de una atalaya tan grande junto a un pueblo pacífico me resulta de lo más sospechoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa semble un peu bizarre d'avoir une grande tour\r\nde guet comme celle-ci à côté d'une ville paisible.\n@c0@"
  it: "@aBianca@bChe senso ha costruire una torre di sorveglianza così imponente nei pressi di un pacifico villaggio?!\n@c0@"
  ja: "@a@bビアンカ「平和な町の　すぐとなりに\n\t見はらしの塔だなんて\n\tなんだか　似合わないわね。\n@c0@"
1:
  de: "@aBianca@bWenn ein so großer Bau nötig ist, um Wache zu halten, dann ist Mostroferrato vielleicht in Gefahr.\n@c0@"
  en: "@aBianca@bIf they feel the need for a big thing like this to keep watch, maybe Mostroferrato is in some kind of danger.\n@c0@"
  es: "@aBianca@bSi creen que necesitan una cosa así para vigilar, quizá Mostroferrato corra algún peligro.\n@c0@"
  fr: "@aBianca@bS'ils ressentent le besoin d'avoir un gros truc\r\ncomme ça pour monter la garde, peut-être\r\nque Mostroferrato est en danger, en réalité.\n@c0@"
  it: "@aBianca@bGli abitanti di Mostroferrato devono sentirsi in pericolo, per aver realizzato un punto d'avvistamento come questo...\n@c0@"
  ja: "@a@bビアンカ「こんな塔を建ててまで\n\t見張るってことは　サラボナって\n\t魔物に　ねらわれてるのかな？\n@c0@"
2:
  de: "@aNera@bDieser Turm wurde gebaut, bevor ich geboren wurde.\n@c0@"
  en: "@aNera@bThis tower was built before I was born.\n@c0@"
  es: "@aNera@bEsta torre d'osservazione fue construida antes de nacer yo.\n@c0@"
  fr: "@aNera@bCette tour a été édifiée avant ma naissance.\n@c0@"
  it: "@aNera@bQuesta torre fu costruita prima che io nascessi.\n@c0@"
  ja: "@a@bフローラ「この塔は　私が生まれる前から\n\t建っていましたのよ。\n@c0@"
3:
  de: "@aNera@bMein Vater hat mir erzählt, dass er den Turm gebaut hat, damit wir für Angriffe durch Ungeheuer gerüstet sind. Mehr hat er dazu nie gesagt.\n@c0@"
  en: "@aNera@bAll my father's told me is that he built the tower so we'd be prepared for monsters attacking.\r\nHe never said anything more than that.\n@c0@"
  es: "@aNera@bEl mio papino solo me dijo que la erigió para estar preparados en caso de ataque de monstruos.\r\nNunca dijo più.\n@c0@"
  fr: "@aNera@bTout ce que mon père m'a dit, c'est qu'il avait construit la tour pour que nous soyons prêts\nau cas où les monstres attaqueraient.\n㈡\nIl ne m'a jamais donné d'autre explication.\n@c0@"
  it: "@aNera@bMio padre mi ha detto di aver eretto la torre per difendersi da eventuali attacchi dei mostri, ma non mi ha mai dato troppi dettagli in merito.\n@c0@"
  ja: "@a@bフローラ「お父さまは　魔物の襲撃にそなえ\n\t塔を建てたと　おっしゃってましたけど\n\tくわしいことは　聞かされてませんの。\n@c0@"
4:
  de: "@a%0%a001240@bIch liebe hohe Türme. Da kann man immer so weit sehen!\n@c0@"
  en: "@a%0%a001240@bI love high places. You can always see such a\nlong way!\n@c0@"
  es: "@a%0%a001240@bLas alturas son lo mío. ¡Me gusta divisar el horizonte!\n@c0@"
  fr: "@a%0%a001240@bJ'adore les endroits en hauteur. On peut toujours voir très loin d'en hautⓠ\n@c0@"
  it: "@a%0%a001240@bI posti elevati mi piacciono tantissimo.\nSi gode sempre di una vista fantastica!\n@c0@"
  ja: "@a@b%a001240「ボク　高いところ好きなんだ。\n\tだって　ずっと　遠くまで見わたせて\n\t気持ちいいんだもん。\n@c0@"
5:
  de: "@a%0%a001250@bHier macht mir die Höhe keine Angst... glaube ich.\n@c0@"
  en: "@a%0%a001250@bThis sort of height isn't too scary...I think.\n@c0@"
  es: "@a%0%a001250@bA mí esta altura no me asusta. O eso creo...\n@c0@"
  fr: "@a%0%a001250@bCe n'est pas encore trop haut pour me faire peur... enfin, je crois.\n@c0@"
  it: "@a%0%a001250@bUhm, non siamo troppo in alto...\nTemevo peggio...\n@c0@"
  ja: "@a@b%a001250「これくらいの高さなら\n\tあんまり　こわくない…　かな？\n@c0@"
6:
  de: "@aBianca@bDieser Herr Onassetti macht sich wohl ständig Sorgen. Es ist mir ganz neu, dass Mostroferrato so gefährdet durch Monster sein soll.\n@c0@"
  en: "@aBianca@bThat Mr Briscoletti sounds like a bit of a worrier. I've never heard anythin' about Mostroferrato bein' a target for monsters.\n@c0@"
  es: "@aBianca@bEl Rimaldi ese parece un poco exagerado. Nunca he oído que Mostroferrato sea un objetivo de los monstruos, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe monsieur Oscuroni m'a l'air de s'inquiéter pour rien. Je n'ai jamais entendu dire que Mostroferrato était la cible des monstres.\n@c0@"
  it: "@aBianca@bCredo che mister Fosconi si preoccupi troppo...\nPerché mai i mostri dovrebbero attaccare Mostroferrato, eh?\n@c0@"
  ja: "@a@bビアンカ「ルドマンさんて　心配性なのね。\n\tサラボナが　魔物に襲撃されたなんて\n\t一度も　聞いたことがないわ。\n@c0@"
7:
  de: "@aNera@bIch mag gar nicht daran denken, aber der Wachturm soll uns vielleicht klarmachen, dass uns tatsächlich irgendwann ein Angriff durch Monster drohen könnte.\n@c0@"
  en: "@aNera@bIt hardly bears thinking about, but I suppose this lookout tower's a symbol of the possibility that monsters might actually attack us one day.\n@c0@"
  es: "@aNera@bNo quiero ni pensarlo, pero supongo que esta atalaya es símbolo de la possibilità de que los monstruos puedan atacarnos algún día.\n@c0@"
  fr: "@aNera@bÇa n'a guère d'importance, mais je suppose que\r\ncette tour de guet symbolise la possibilité qu'un jour, les monstres puissent nous attaquer.\n@c0@"
  it: "@aNera@bForse questa torre è stata costruita per ricordare alla popolazione di Mostroferrato che, un giorno, i mostri potrebbero attaccare il villaggio...\n@c0@"
  ja: "@a@bフローラ「考えたくも　ありませんけど\n\t見張りをするぐらいですから　いつか\n\t魔物が　襲ってくるのかしら……。\n@c0@"
8:
  de: "@a%0%a001240@bEs ist wirklich nett von Herrn Onassetti, dass er sich immer solche Sorgen um die Leute macht.\n@c0@"
  en: "@a%0%a001240@bMr Briscoletti is really nice to always worry about other people so much.\n@c0@"
  es: "@a%0%a001240@bDon Rimaldi es muy buena personaⓓ siempre anda preocupado por los demás.\n@c0@"
  fr: "@a%0%a001240@bMonsieur Oscuroni est vraiment gentil de se préoccuper autant des autres.\n@c0@"
  it: "@a%0%a001240@bÈ gentile a preoccuparsi tanto per gli altri, non trovi?\n@c0@"
  ja: "@a@b%a001240「ルドマンさんって　いつも\n\tみんなのこと　考えてるんだね。\n\tえらいなあ……。\n@c0@"
9:
  de: "@aBianca@bEin Mann, der sich selbst in ein Monster verwandelt hat? Ist so was denn überhaupt möglich? Das will ich doch nicht hoffen!\n@c0@"
  en: "@aBianca@bA man who turned himself into a monster? Is that even possible? I certainly hope not!\n@c0@"
  es: "@aBianca@b¿Un tipo que se convirtió en monstruo? ¿Pero eso se puede? ¡Espero que no!\n@c0@"
  fr: "@aBianca@bUn homme qui se serait lui-même transformé en monstreⓡ Est-ce seulement possibleⓡ\nJ'espère bien que nonⓠ\n@c0@"
  it: "@aBianca@bUn uomo che si è trasformato in un mostro?!\nChe sciocchezza!\n@c0@"
  ja: "@a@bビアンカ「自身を　魔物に変えるなんて\n\tそんなことができるのかしら？\n\t本当にできたら　こわいことよね。\n@c0@"
10:
  de: "@aNera@bAls ich klein war, bin ich gern auf den Turm gestiegen. Dann konnte ich hinausschauen und vom Leben in fernen Städten und Schlössern träumen.\n@c0@"
  en: "@aNera@bWhen I was a little girl, I used to love climbing this tower so I could look out and imagine what life must be like in faraway towns and castles.\n@c0@"
  es: "@aNera@bCuando era una bambina me encantaba subir a esta torre e imaginar cómo sería la vida en ciudades y castillos lejanos.\n@c0@"
  fr: "@aNera@bQuand j'étais petite, j'adorais grimper en haut de cette tour pour regarder les alentours et imaginer\r\nla vie dans les villes et les châteaux lointains.\n@c0@"
  it: "@aNera@bDa piccola venivo spesso qui alla torre.\nSalivo in cima e guardavo l'orizzonte, immaginando come vivessero gli abitanti dei paesi lontani...\n@c0@"
  ja: "@a@bフローラ「幼いころ　ここにのぼって\n\t遠くにある町や村や　城のことなどを\n\tあれこれ　想像するのが好きでしたの。\n@c0@"
11:
  de: "@a%0%a001240@bGroßmeister Nimzo... Hm. Am Ende müssen wir bestimmt gegen ihn kämpfen.\n@c0@"
  en: "@a%0%a001240@bGrandmaster Nimzo...\nHm. I bet we'll end up having to fight him.\n@c0@"
  es: "@a%0%a001240@bEl Gran Maestro Nimzo...\nMmm. Seguro que acabamos luchando contra él.\n@c0@"
  fr: "@a%0%a001240@bGrand Maître Nimzo...\nMmm. Je suis sûr qu'on finira par le combattre.\n@c0@"
  it: "@a%0%a001240@bIl Gran Maestro Nimzo, eh? Il nome non promette nulla di buono... Spero proprio che non dovremo affrontare questo tizio!\n@c0@"
  ja: "@a@b%a001240「今　ちょっと　ゾクッとした。\n\tミルドラース…　もしかしたら\n\tボクたち　そいつと　たたかうのかも。\n@c0@"
12:
  de: "@a%0%a001250@bÄhm, Papa ... Ist es in Ordnung, wenn wir nicht zu nah am Rand gehen?\n@c0@"
  en: "@a%0%a001250@bUm, Dad... Is it okay if we don't walk too close\nto the edge?\n@c0@"
  es: "@a%0%a001250@bMmm, papi... ¿No sería mejor que camináramos más alejados del borde?\n@c0@"
  fr: "@a%0%a001250@bMmm, papa... Ça te dérange si on ne marche pas trop près du bordⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ti dispiace se camminiamo lontani dal bordo...?\n@c0@"
  ja: "@a@b%a001250「お父さん　あのね…\n\t階段　あまり　はじっこ歩かないでね。\n@c0@"
13:
  de: "@aSancho@bAlles in Ordnung! Diese Stufen... gar kein Problema. Iss ⓚⓛ Hah ⓚⓛ habe keine Problemas. Hah hah...\n@c0@"
  en: "@aSancho@bEes notheeng! These estairs...ees notheeng!\nI no ⓚⓛ hahh ⓚⓛ even feel eet. Hahh hahh...\nHahh...\n@c0@"
  es: "@aSancho@b¡Si no es nada! ¡Estas escaleras son un ejercicio bien sano, nomás!\n㈡\nYo subo escaleras... ufff... escaleras como esta todos los días. Ándale... Uff, uff...\n¡Uff...!\n@c0@"
  fr: "@aSancho@bC-Ce n'est rienⓠ Ces escaliers... ce n'est r-rien du toutⓠ J-Je ne... han... sens rien du t-tout.\nHan han... Han...\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh...\nLas escaaahlas... Soy senza fiaaahto...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「いやいや…\n\tこのくらいの　階段でしたら\n\tらくらく…　ですよ。　はあはあ……。\n@c0@"
14:
  de: "@aBianca@bOnassetti muss ganz schön viel Kohle haben, wenn er solch einen Turm bauen lassen kann, was?\n@c0@"
  en: "@aBianca@bBriscoletti must be really loaded to be able to afford to build a tower like this, eh?\n@c0@"
  es: "@aBianca@bDon Rimaldi debe de ser rico para poder permitirse construir una torre como esta, ¿no crees?\n@c0@"
  fr: "@aBianca@bOscuroni doit vraiment être plein aux as pour avoir pu se permettre de faire construire une tour comme celle-là, heinⓡ\n@c0@"
  it: "@aBianca@bA giudicare dalla ⓕtorrettaⓖ che si è costruito, mister Fosconi dev'essere immensamente ricco...\n@c0@"
  ja: "@a@bビアンカ「それにしても　こんな塔まで\n\t建てちゃうなんて　ルドマンさんは\n\t本当に　お金持ちよね。\n@c0@"
15:
  de: "@aNera@bIch kann mich einfach nicht entspannen. Immer habe ich das Gefühl, dass etwas Schlimmes passieren wird...\n@c0@"
  en: "@aNera@bI can't seem to relax. I just have this feeling that something bad is about to happen.\n@c0@"
  es: "@aNera@bAlgo me tiene inquieta. Veramente, tengo el presentimiento de que se avecina una desgracia.\n@c0@"
  fr: "@aNera@bJe n'arrive pas à me détendre. J'ai cette terrible impression que quelque chose va mal tourner.\n@c0@"
  it: "@aNera@bNon sono tranquilla.\r\nHo la sgradevolissima sensazione che stia per accadere qualcosa di spiacevole...\n@c0@"
  ja: "@a@bフローラ「落ちつかないわ。\n\tもうすぐ　何かが起こるような\n\tそんな気がしますの……。\n@c0@"
16:
  de: "@a%0%a001240@bWarum haben manche Leute Angst vor Höhen? Ich verstehe das nicht. Mir ist es egal, wie hoch es ist.\n@c0@"
  en: "@a%0%a001240@bWhy do you think some people are so scared of heights? I don't get it. Heights don't bother me at all.\n@c0@"
  es: "@a%0%a001240@b¿Por qué se asusta la gente de las alturas? No lo entiendo. Para mí no suponen ningún problema.\n@c0@"
  fr: "@a%0%a001240@bPourquoi certaines personnes ont le vertigeⓡ\nJe ne comprends pas. Moi, la hauteur, ça ne\nme fait pas peur du tout.\n@c0@"
  it: "@a%0%a001240@bIo non soffro di vertigini.\nLe grandi altezze non mi danno nessun fastidio.\n@c0@"
  ja: "@a@b%a001240「どうして　高いところが\n\tこわい人と　こわくない人がいるの？\n\tボクは　平気なんだけどな。\n@c0@"
17:
  de: "@aBianca@bDas hört sich dringend an, %a000090. Was sollten wir doch noch gleich tun?\n@c0@"
  en: "@aBianca@bSounds like we'd better get a move on, %a000090. What is it we have to do again?\n@c0@"
  es: "@aBianca@bSerá mejor que nos pongamos en marcha, %a000090. ¿Qué era eso que teníamos que hacer?\n@c0@"
  fr: "@aBianca@bJ'ai l'impression qu'il faut qu'on s'active un peu, %a000090. Qu'est-ce qu'on doit faire, déjàⓡ\n@c0@"
  it: "@aBianca@bDirei che è meglio sbrigarci, %a000090...\nA proposito, cos'è che dobbiamo fare?\n@c0@"
  ja: "@a@bビアンカ「ちょっと　%a000090\n\t急いだほうが　よさそうよ。\n\tえっと　何からすれば　いいんだっけ？\n@c0@"
18:
  de: "@aNera@bBitte, Liebling. Du musst Papa helfen!\n@c0@"
  en: "@aNera@bPlease, darling. Do what you can to help Papa!\n@c0@"
  es: "@aNera@bPer favore, amore. ¡Ayuda al mio papino como sea!\n@c0@"
  fr: "@aNera@bJe t'en prie, mon chéri. Fais tout ce que tu peux pour aider papaⓠ\n@c0@"
  it: "@aNera@bTesoro, dobbiamo assolutamente dare una mano a mio padre!\n@c0@"
  ja: "@a@bフローラ「あなた　お願い…\n\t父のために　チカラを貸して……！\n@c0@"
19:
  de: "@aBianca@bWarum wartet er denn am Turm? Was ist denn so besonders an diesem Ort?\n@c0@"
  en: "@aBianca@bWhy would he be waitin' at the tower?\nWhat d'you s'pose is so special about the place?\n@c0@"
  es: "@aBianca@b¿Por qué iba a estar esperándonos en la torre?\n¿Qué tiene de especial esa atalaya?\n@c0@"
  fr: "@aBianca@bPourquoi attendrait-il à la tourⓡ Qu'est-ce que cet endroit a de si spécialⓡ\n@c0@"
  it: "@aBianca@bCome mai sta aspettando alla torre?\nNon riesco a capirlo...\n@c0@"
  ja: "@a@bビアンカ「塔で待ってるなんて\n\tこの塔に　なにかあるのかしら？\n@c0@"
20:
  de: "@a%0%a001240@bWir sollten uns besser beeilen und Herrn Onassetti sagen, dass der Tiegel rot war!\n@c0@"
  en: "@a%0%a001240@bWe'd better hurry up and tell Mr Briscoletti that the jar was red!\n@c0@"
  es: "@a%0%a001240@b¡Démonos prisa, tenemos que contarle a don Rimaldi que la tinaja estaba roja!\n@c0@"
  fr: "@a%0%a001240@bOn ferait mieux de se dépêcher d'aller dire à monsieur Oscuroni que l'amphore est rougeⓠ\n@c0@"
  it: "@a%0%a001240@bDobbiamo tornare subito a Mostroferrato e riferire che l'anfora è rossa!\n@c0@"
  ja: "@a@b%a001240「ツボの色は　赤かったって\n\tはやく　ルドマンさんに伝えなきゃ！\n@c0@"
21:
  de: "@a%0%a001250@bGlaubst du, es ist ein schlechtes Zeichen, dass der Tiegel rot ist? Was passiert denn jetzt?\n@c0@"
  en: "@a%0%a001250@bDo you think it's a bad sign that the jar was red? What's going to happen?\n@c0@"
  es: "@a%0%a001250@b¿Crees que deberíamos preocuparnos porque la tinaja estuviera roja? ¿Qué significará?\n@c0@"
  fr: "@a%0%a001250@bTu crois que c'est mauvais signe que l'amphore soit rougeⓡ Qu'est-ce qui va se passerⓡ\n@c0@"
  it: "@a%0%a001250@bL'anfora rossa è un brutto segno, non è vero?\nCosa credi che succederà?\n@c0@"
  ja: "@a@b%a001250「あの　ツボの色が\n\t赤かったのって　良くないことよね？\n\tこれから　どうなっちゃうの？\n@c0@"
22:
  de: "@aSancho@bNisst so schnell! Hah... Warum diese Eile? Das ist ⓚⓛ hah ⓚⓛ gefährliss hier. Hah... Geh langsamer, sonst ⓚⓛ hah ⓚⓛ rutschst du noch aus, Chico.\n@c0@"
  en: "@aSancho@bNo eso fast! Hahh... Why you hurry?\nEes ⓚⓛ hahh ⓚⓛ dangerous. Hahh...\nEslow down, or maybe ⓚⓛ hahh ⓚⓛ you eslip, no?\n@c0@"
  es: "@aSancho@b¡Híjole, más despacio! ¡Uff...! ¿Por qué tanto apuro?\nEs... uff... peligroso. Uff...\n㈡\nA este ritmo... uff... podríamos dar un traspiés, nomás...\n@c0@"
  fr: "@aSancho@bP-Pas si viteⓠ Han... P-Pourquoi tu vas si v-viteⓡ C-C'est... han... dangereux. Han... Ne va p-pas\nsi vite ou tu risques... han... de glisser, noⓡ\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh...\r\nPiaaahnos... Altrimenti rischiamo de escivolaaahre...\r\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「あ　あんまり急ぐと\n\t足が…　足が　もつれますな。\n@c0@"
23:
  de: "@aOtto@bOb Herr Onassetti wohl am Turm ist, weil etwas geschehen ist?\n@c0@"
  en: "@aTuppence@bI wonder if Mr Briscoletti is at the tower because something's happened.\n@c0@"
  es: "@aAlazar@b¿Habrá ocurrido algo en la torre? ¿Será por eso que don Rimaldi está allí?\n@c0@"
  fr: "@aInnocent@bJe me demande si monsieur Oscuroni nous attend à la tour parce qu'il s'est passé quelque chose.\n@c0@"
  it: "@aSimon@bHo paura che mister Fosconi sia alla torre perché si è verificata una disgrazia...\n@c0@"
  ja: "@a@bピピン「ルドマンさんが\n\t塔にいるということは　何か\n\t動きがあったんでしょうか？\n@c0@"
24:
  de: "@aBianca@bWir müssen uns mehr anstrengen. Wenn wir ihn nicht besiegen, sind Mostroferrato und Utensiel in großer Gefahr.\n@c0@"
  en: "@aBianca@bWe have to try harder. If we dun't fight him off, Mostroferrato and Stockenbarrel will be in\r\nterrible trouble.\n@c0@"
  es: "@aBianca@bPongamos toda la carne en el asador. Si no lo detenemos, Mostroferrato y Clavis estarán en peligro.\n@c0@"
  fr: "@aBianca@bNous devons réessayer. Si nous baissons les bras, Mostroferrato et Saint Éloi seront dans de sales draps.\n@c0@"
  it: "@aBianca@bDobbiamo fare qualcosa! Mostroferrato e Arpianuam sono in pericolo! Quel mostro dev'essere messo in condizione di non nuocere!\n@c0@"
  ja: "@a@bビアンカ「気合い入れていくわよ。\n\tあいつを　やっつけないと　サラボナも\n\t山奥の村も　大変なことになっちゃう。\n@c0@"
25:
  de: "@aNera@bIch würde Papa wirklich gerne zurückzahlen, was er alles für uns getan hat. Das nächste Mal müssen wir uns noch mehr anstrengen!\n@c0@"
  en: "@aNera@bI'd really like to do something to repay Papa for all he's done. We must try harder next time!\n@c0@"
  es: "@aNera@bMe encantaría devolverle el favor al mio papino per lo que ha hecho. ¡La próxima vez tenemos que aplicarnos al massimo!\n@c0@"
  fr: "@aNera@bJ'aimerais beaucoup faire quelque chose pour remercier papa de tout ce qu'il a fait.\nNous devons réessayerⓠ\n@c0@"
