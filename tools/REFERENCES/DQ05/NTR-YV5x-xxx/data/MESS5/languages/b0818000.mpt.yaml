  en: "@a@b*: You would prefer not to record your adventure? Well, that is your decision.\n@c0@"
  es: "@a@b*: ¿%H0860%XPrefieres%YPreferís%Z no conservar %H0860%Xtu%Yvuestra%Z aventura? Bien, la decisión es %H0860%Xtuya%Yvuestra%Z.\n@c0@"
