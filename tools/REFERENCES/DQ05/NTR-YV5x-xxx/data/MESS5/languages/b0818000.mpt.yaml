  en: "@a@b*: I have successfully recorded your adventure log. Do you intend to continue on your adventure at this point, my child?\n@c0@"
  es: "@a@b*: %H0860%XTus%YVuestras%Z aventuras han quedado registradas de forma completamente satisfactoria. ¿%H0860%XDeseas%YDeseáis%Z continuar %H0860%Xtu%Yvuestra%Z aventura desde este punto%H0860%X%A0110%X, hijo%Z%B0110%X, hija%Z%Y%Z?\n@c0@"
  fr: "@a@b*ⓢ J'ai enregistré votre journal.\nAvez-vous l'intention de poursuivre votre aventure, mon enfantⓡ\n@c0@"
