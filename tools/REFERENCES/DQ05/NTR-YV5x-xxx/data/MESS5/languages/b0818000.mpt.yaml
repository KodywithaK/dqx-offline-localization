  en: "@a@b*: In that case, I must overwrite\nⓗ%a000660: %0%a000090 %a000240ⓘ.\nDo you wish me to proceed, my child?\n@c0@"
  es: "@a@b*: En tal caso deberé sobrescribir\n''%a000660: %0%a000090 %a000240''.\n¿%H0860%XQuieres%YQueréis%Z que continúe, %H0860%X%A0110%Xhijo%Z%B0110%Xhija%Z%Y%R0000%Xhijas%Yhijos%Z%Z?\n@c0@"
