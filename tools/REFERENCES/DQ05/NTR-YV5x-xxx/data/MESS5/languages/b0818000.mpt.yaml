  en: "@a@b*: And would you permit me to record your works in an adventure log?\n@c0@"
  es: "@a@b*: ¿Me %H0860%Xpermitirás%Ypermitiréis%Z dejar constancia de %H0860%Xtus%Yvuestras%Z obras en un registro de aventuras?\n@c0@"
  fr: "@a@b*ⓢ Et me permettez-vous d'enregistrer vos aventures dans un journalⓡ\n@c0@"
  it: "@a@b*: Desideri salvare le tue azioni nel diario dell'avventura?\n@c0@"
  ja: "@a@b＊「そして　この冒険の書に\n\t記録しても　よろしいかな？\n@c0@"
4:
