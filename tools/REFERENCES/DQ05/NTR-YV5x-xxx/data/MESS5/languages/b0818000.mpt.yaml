0:
  de: "@a@b*: Alle Lebewesen sind Kinder der Göttin. Was führt Euch in unsere Kirche, mein Kind?\n@c0@"
  en: "@a@b*: All living creatures are children of the Goddess. What brings you to our church, child?\n@c0@"
  es: "@a@b*: Todas las criaturas vivientes son hijas de la Diosa. ¿Qué %H0860%Xte%Yos%Z trae por nuestra iglesia, %H0860%X%A0110%Xhijo mío%Z%B0110%Xhija mía%Z%Y%R0000%Xhijas mías%Yhijos míos%Z%Z?\n@c0@"
  fr: "@a@b*ⓢ Tous les êtres vivants sont des enfants de la Déesse. Alors, qu'est-ce qui vous amène dans cette église, mon enfantⓡ\n@c0@"
  it: "@a@b*: Cosa posso fare per %H0860%Xte, fedele pecorella%Yvoi, fedeli pecorelle%Z del gregge della dea?\n@c0@"
  ja: "@a@b＊「生きとし生けるものは\n\tみな　神の子。\n\tわが教会に　どんな　ご用かな？\n@c0@"
1:
  de: "@a@b*: Was führt Euch mitten in der Nacht in unsere Kirche, Kind?\n@c0@"
  en: "@a@b*: What brings you to our church in the dead of night, child?\n@c0@"
  es: "@a@b*: ¿Qué %H0860%Xte%Yos%Z trae a nuestra iglesia en mitad de la noche, %H0860%X%A0110%Xhijo mío%Z%B0110%Xhija mía%Z%Y%R0000%Xhijas mías%Yhijos míos%Z%Z?\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce qui vous amène dans notre église au milieu de la nuit, mon enfantⓡ\n@c0@"
  it: "@a@b*: Salve, %H0860%Xanima pura devota%Yanime pure devote%Z della dea.\nCosa %H0860%Xti%Yvi%Z porta in questa chiesa nel cuore della notte?\n@c0@"
  ja: "@a@b＊「このような夜ふけに\n\tわが教会を　おとずれるとは。\n\t何か　困りごとかの？\n@c0@"
2:
  de: "@a@b*: Beichtet alles, was Ihr getan habt, der allmächtigen Göttin, Kind.\n@c0@"
  en: "@a@b*: Confess all that you have done before the almighty Goddess, child. \n@c0@"
  es: "@a@b*: %H0860%XConfiesa%YConfesad%Z cuanto %H0860%Xhayas%Yhayáis%Z hecho ante la Diosa todopoderosa, %H0860%X%A0110%Xhijo mío%Z%B0110%Xhija mía%Z%Y%R0000%Xhijas mías%Yhijos míos%Z%Z. \n@c0@"
  fr: "@a@b*ⓢ Confessez tout ce que vous avez fait devant la toute-puissante Déesse, mon enfant.\n@c0@"
  it: "@a@b*: Confessa alla dea onnipotente tutti i tuoi peccati, %A0110%Xfigliolo%Z%B0110%Xfigliola%Z.\n@c0@"
  ja: "@a@b＊「では　神の前に\n\tこれまでの　おこないを\n\t告白なさい。\n@c0@"
3:
