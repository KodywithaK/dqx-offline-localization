  it: "@a@b*: In tal caso, devo sovrascrivere\nⓕ%a000660: %0%a000090 %a000240ⓖ.\nPosso procedere, %A0110%Xfigliolo%Z%B0110%Xfigliola%Z?\n@c0@"
