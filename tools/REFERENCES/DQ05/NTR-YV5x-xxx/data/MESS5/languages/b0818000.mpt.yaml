34:
  de: "@a@b*: Spenden an die Kirche sind ein Ausdruck der Dankbarkeit gegenüber der großen und gütigen Göttin!\n㈡\n*: Aber man darf den Leuten nichts abverlangen, das ihre Mittel übersteigt. Vergebt mir.\n@c0@"
  en: "@a@b*: Donations to the church are an expression of gratitude to the great and benevolent Goddess!\n㈡\n*: But one must not request from people something that is beyond their means. Forgive me.\n@c0@"
  es: "@a@b*: Los donativos a la iglesia son una expresión de agradecimiento a la benevolente y magna Diosa.\n㈡\n*: Pero no se le puede pedir al que no tiene, mis más sinceras disculpas.\n@c0@"
  fr: "@a@b*ⓢ Les dons à l'église sont l'expression de votre gratitude envers la grande et bienfaisante Déesseⓠ\n㈡\n*ⓢ Mais il ne faut jamais demander aux gens plus que ce qu'ils peuvent se permettre. Pardonnez-moi.\n@c0@"
  it: "@a@b*: Le offerte sono un modo per dimostrare la propria gratitudine alla dea!\n㈡\n*: Mi rendo però conto di aver chiesto un contributo superiore alle tue disponibilità, e di ciò domando perdono alla nostra amata dea...\n@c0@"
  ja: "@a@b＊「寄付は　神への感謝の気持ち。\n\tしかし　無理にとは　いわぬ。\n\t今は　あきらめるとしよう……。\n@c0@"
