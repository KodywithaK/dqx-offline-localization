  fr: "@a@b*ⓢ Grande et bienfaisante Déesseⓠ Débarrasse %A0180%Xton fidèle serviteur%Z%B0180%Xta fidèle servante%Z%C0180%X%Z %a000180 de ce poison impieⓠ\n@c0@"
  it: "@a@b*: O dea buona e misericordiosa, libera %A0180%Xil tuo amato figliolo%Z%B0180%Xla tua amata figliola%Z%C0180%X%Z %a000180 dal veleno che devasta il suo corpo!\n@c0@"
