6:
  de: "@a@bAbenteuertagebuch wird gespeichert.\nBitte das System nicht ausschalten und die\nDS-Karte nicht entfernen!\n@c0@"
  en: "@a@bSaving adventure log.\nDo not turn the power OFF\nor remove the DS Game Card!\n@c0@"
  es: "@a@bGuardando registro de aventuras.\r\nNo apagues la consola\r\nni extraigas la tarjeta DS.\n@c0@"
  fr: "@a@bSauvegarde du journal en cours.\nNe pas éteindre la console ni retirer\nla carte de jeu DSⓠ\n@c0@"
  it: "@a@bSalvataggio del diario dell'avventura.\nNon spegnere la console\ne non rimuovere la scheda di gioco DS!\n@c0@"
  ja: "@a@b冒険の書に　記録しています。\n電源を切らないでください。\nカードを引き抜かないでください。\n@c0@"
7:
  de: "@a@b*: Bei der Göttin, was ist bloß geschehen?\nMein Versuch, das Abenteuertagebuch aufzuzeichnen, endete in einem Fehlschlag!\n@c0@"
  en: "@a@b*: By the Goddess, whatever could have happened? It appears that my attempt to record the adventure log has failed!\n@c0@"
  es: "@a@b*: ¡Alabada sea la Diosa! ¿Qué ha podido ocurrir? Parece que no he podido guardar el registro de aventuras.\n@c0@"
  fr: "@a@b*ⓢ Par la Déesse, qu'a-t-il bien pu se passerⓡ\nOn dirait que ma tentative de sauvegarde du journal a échouéⓠ\n@c0@"
  it: "@a@b*: Non ho potuto salvare il diario dell'avventura. Se lo desideri puoi continuare la tua missione, ma ricorda che i tuoi progressi non sono stati salvati.\n@c0@"
  ja: "@a@b＊「あやや　どうしたことじゃ！\n\t記録に　失敗したようじゃ。\n@c0@"
8:
