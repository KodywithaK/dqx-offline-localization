0:
  de: "@aBianca@bDann geht's jetzt also endlich nach Humburg! Bist du aufbruchsbereit, %a000090?\n@c0@"
  en: "@aBianca@bSo we're finally off to Gotha.\nAre you ready to leave, %a000090?\n@c0@"
  es: "@aBianca@bPor fin vamos hacia Pankraz.\n¿Estás listo para partir, %a000090?\n@c0@"
  fr: "@aBianca@bProchaine destinationⓢ Gotha. Enfinⓠ\nEs-tu prêt à partir, %a000090ⓡ\n@c0@"
  it: "@aBianca@bAllora, finalmente si va a Denim!\nSei pronto per partire, %a000090?\n@c0@"
  ja: "@a@bビアンカ「いよいよ\n\tグランバニアへ　向かうのね。\n\t%a000090　忘れ物は　してないよね？\n@c0@"
1:
  de: "@aNera@bEs wird Zeit aufzubrechen. Mach dir keine Sorgen um mich. Die Rast hat mir gutgetan.\n@c0@"
  en: "@aNera@bTime for us to make a move at last. There's\r\nno need to worry about me. I feel fine after\r\nthat rest.\n@c0@"
  es: "@aNera@bEs hora de que empecemos a movernos. Non ti preoccupare per me. Después de descansar me encuentro muy bien.\n@c0@"
  fr: "@aNera@bL'heure est enfin venue de reprendre la route. Inutile de t'inquiéter pour moi. Je me sens bien\r\naprès ce moment de repos.\n@c0@"
  it: "@aNera@bAh, come sto bene!\nDopo essermi riposata, mi sento come rinata!\nAllora, vogliamo andare?\n@c0@"
  ja: "@a@bフローラ「いよいよ　出発ですわね。\n\t私は　大丈夫です。\n\tゆっくり　休ませていただきましたわ。\n@c0@"
2:
  de: "@aBianca@bNach Humburg geht's nur bergab, also dürfte die Reise nicht allzu anstrengend werden.\n@c0@"
  en: "@aBianca@bIt's all downhill to Gotha, so hopefully it shouldn't be too tirin' a journey.\n@c0@"
  es: "@aBianca@bHacia Pankraz es todo cuesta abajo, así que no será un viaje muy cansado, ¿sabes?\n@c0@"
  fr: "@aBianca@bTout le chemin est en descente pour rejoindre Gotha. Normalement, ça ne devrait pas être trop fatigant.\n@c0@"
  it: "@aBianca@bPer fortuna fino a Denim è tutta discesa.\nSarà uno scherzo arrivarci.\n@c0@"
  ja: "@a@bビアンカ「グランバニアへは\n\t下り道だけで\n\tラクだといいんだけどな。\n@c0@"
3:
  de: "@aNera@bEs scheinen sehr viele Ungeheuer unterwegs zu sein. Sei vorsichtig, ja?\n@c0@"
  en: "@aNera@bThere seem to be an awful lot of monsters about. Do be careful, won't you?\n@c0@"
  es: "@aNera@bParece que hay molti mostri. Ten cuidado, mio caro, ¿quieres?\n@c0@"
  fr: "@aNera@bIl semble y avoir énormément de monstres, par ici. Sois très prudent, d'accordⓡ\n@c0@"
  it: "@aNera@bCredo che ci siano molti mostri in questa zona.\nTeniamo gli occhi aperti, tesoro.\n@c0@"
  ja: "@a@bフローラ「魔物が　多いですわね。\n\tあなた　気をつけてくださいな。\n@c0@"
4:
  de: "@aBianca@bHast du die Zeichen bei der Treppe gesehen? Ob die wohl etwas mit Humburg zu tun haben?\n@c0@"
  en: "@aBianca@bDid you see that insignia by the stairs? I wonder if that had somethin' to do with Gotha.\n@c0@"
  es: "@aBianca@b¿Has visto esa insignia junto a las escaleras? Me pregunto si tenía algo que ver con Pankraz.\n@c0@"
  fr: "@aBianca@bTu as vu ce symbole, au pied des escaliersⓡ Je me demande si ça a quelque chose à voir avec Gotha.\n@c0@"
  it: "@aBianca@bHai visto l'insegna vicino alle scale?\nChe sia il simbolo del Regno di Denim?\n@c0@"
  ja: "@a@bビアンカ「階段のところに\n\t紋章が　あったわね。\n\tあれって　グランバニアのものかしら？\n@c0@"
5:
  de: "@aNera@bIch kann's kaum glauben, dass Papa uns einen Boten bis in diese Höhle nachschickt!\n@c0@"
  en: "@aNera@bI can't believe one of Papa's messengers would come all the way out to this cave of all places!\n@c0@"
  es: "@aNera@b¡No puedo creer que uno de los mensajeros del mio papino haya llegado hasta esta mismísima cueva!\n@c0@"
  fr: "@aNera@bJe n'arrive pas à croire que l'un des messagers de papa soit venu jusque dans cette caverneⓠ\n@c0@"
  it: "@aNera@bNon avrei mai immaginato di incontrare un messaggero di mio padre in questa grotta!\n@c0@"
  ja: "@a@bフローラ「さすがに　この洞くつまでは\n\tお父さまの使者も　来ないでしょう。\n@c0@"
6:
  de: "@aBianca@bSo ein Bangemacher, was? Wenn er schon mit guten Ratschlägen um sich wirft, könnte er uns wenigstens sagen, was ihm zugestoßen ist.\n@c0@"
  en: "@aBianca@bHe's a bit of a scaremonger, eh? It would help if he told us what happened to him if he's goin' to dish out advice like that.\n@c0@"
  es: "@aBianca@bEs un poquillo alarmista, ¿no? Si tiene intención de ir repartiendo consejos aquí y allá, estaría bien que nos contase qué le pasó a él, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuel oiseau de mauvais augureⓠ Ce qui nous aiderait, c'est plutôt de savoir ce qui lui est arrivé, au lieu de nous donner ce genre de conseil.\n@c0@"
  it: "@aBianca@bEhm, grazie per il consiglio...\nNon credi che avrebbe pouto spiegarci meglio che cosa gli è successo...?\n@c0@"
  ja: "@a@bビアンカ「そこまで言うなら\n\tどういうめに　あったのか\n\t教えてくれても　いいのにね。\n@c0@"
7:
  de: "@aNera@bEs ist nicht zu ändern. Egal, was der Mann sagt ⓚⓛ wir müssen unseren Weg weitergehen.\n@c0@"
  en: "@aNera@bIt can't be helped. No matter what that man says, we have to keep pushing onwards.\n@c0@"
  es: "@aNera@bNo hay otra opción. Diga lo que diga este uomo, tenemos que seguir avanzando.\n@c0@"
  fr: "@aNera@bNous n'avons pas le choix. Quoi que dise cet homme, nous sommes obligés de continuer.\n@c0@"
  it: "@aNera@bInferno o non inferno, non abbiamo scelta.\nDobbiamo proseguire.\n@c0@"
  ja: "@a@bフローラ「そう言われても　進まなくては\n\tいけないときも　ありますものね。\n\tあなた　行きましょう。\n@c0@"
8:
  de: "@aBianca@bDieser Händler ist anscheinend auch gefallen, was? Wie lästig, den ganzen Weg wieder zurücklaufen zu müssen.\n@c0@"
  en: "@aBianca@bLooks like that peddler fell down too, eh? What a pain havin' to go all the way back again.\n@c0@"
  es: "@aBianca@bParece que ese buhonero se ha caído también, ¿eh? Qué fastidio tener que volver a subir...\n@c0@"
  fr: "@aBianca@bOn dirait que ce type est tombé, lui aussi.\r\nQue c'est pénible d'avoir à remonter tout le\r\nchemin encore une fois.\n@c0@"
  it: "@aBianca@bAnche quel tipo è caduto di sotto...\nCerto che è una bella seccatura dover rifare tutta la strada daccapo.\n@c0@"
  ja: "@a@bビアンカ「商人さんも　落ちたのね。\n\tたしかに　あの場所まで\n\tもどるのは　大変かも……。\n@c0@"
9:
  de: "@aNera@bHuch! Hab ich mich erschreckt! Ob es wohl noch mehr Stellen gibt, die man nur durch einen Weitsprung erreichen kann?\n@c0@"
  en: "@aNera@bOh dear! That was a bit of a shock! I wonder if there are other places you can't reach unless you take a flying leap!\n@c0@"
  es: "@aNera@b¡Vaya! ¡Qué susto! ¿Tú crees que hay otros sitios a los que no se puede arrivare si no es de un salto gigante?\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Quel chocⓠ Je me demande s'il y a d'autres endroits que l'on ne peut atteindre qu'en sautant dans le videⓠⓑ\n@c0@"
  it: "@aNera@bAccipicchia!\nCredi che troveremo altri passaggi che non si possano superare senza fare salti del genere?\n@c0@"
  ja: "@a@bフローラ「び　び　びっくりしましたわ。\n\tほかにも　飛びおりないと\n\t行けない場所が　あるのかしら。\n@c0@"
10:
  de: "@aBianca@bAllmählich gewöhne ich mich an diese Rumspringerei. Wir sollten darauf achten, an welchen Stellen Licht einfällt, meinst du nicht?\n@c0@"
  en: "@aBianca@bI'm startin' to get used to this jumpin' about the place. We'd better watch out for places where the light shines in, eh?\n@c0@"
  es: "@aBianca@bYa me empiezo a acostumbrar a moverme a saltos por todo este sitio. Será mejor que busquemos los lugares por donde entra luz, ¿eh?\n@c0@"
  fr: "@aBianca@bJe commence à m'habituer à ces sauts dans le vide. On a intérêt à faire attention aux endroits où brille la lumière du jour, heinⓡ\n@c0@"
  it: "@aBianca@bComincio ad abituarmi a saltare come una rana, sai?\nCerchiamo di fare attenzione ai punti dove filtra la luce...\n@c0@"
  ja: "@a@bビアンカ「落ちるのにも　ちょっと\n\tなれてきたかな。\n\t外が明るい出口は　要注意ね！\n@c0@"
11:
  de: "@aNera@bAutsch! Ich glaube, ich hab mir bei unserem letzten Fall einen blauen Fleck an meinem... äh, Allerwertesten geholt. \n@c0@"
  en: "@aNera@bOuch! I think I might've bruised my...er, behind, when we dropped down that last time.\n@c0@"
  es: "@aNera@b¡Aaay! Creo que me lastimé el, ejem, trasero, la última volta que nos tiramos.\n@c0@"
  fr: "@aNera@bOuilleⓠ Je crois que je me suis fait un bleu\nau... euh, au derrière, quand nous avons\nsauté la dernière fois.\n@c0@"
  it: "@aNera@bAhia! Che male! Credo di aver sbattuto il...\nEhm, mi hai capito, no?\nHo sbattuto prima, quando sono caduta!\n@c0@"
  ja: "@a@bフローラ「いたたた……。\n\tさっきの着地で　お尻を\n\tぶつけてしまいました……。\n@c0@"
12:
  de: "@aBianca@bIch hoffe, diese ganze Fallerei ist kein Fehler. Wahrscheinlich fänden wir jetzt selbst, wenn wir es wollten, nicht mehr nach Bussolingen zurück.\n@c0@"
  en: "@aBianca@bI hope we're doin' the right thing, droppin' about left, right and centre. We probably couldn't get back to Battenberg now if we wanted to.\n@c0@"
  es: "@aBianca@bEspero que estemos haciendo lo correcto, tirándonos por aquí y por allá.\n㈡\nNo creo que ahora pudiésemos regresar a Habsburgo ni aunque quisiéramos, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère que nous avons raison de sauter comme ça, à droite, à gauche, au milieu...\n㈡\nMême si on le voulait, on ne réussirait sans doute pas à retourner au hameau Técarlo. \n@c0@"
  it: "@aBianca@bPensa che beffa se dovessimo tornare a Neviternia!\nCi metteremmo come minimo un paio d'annetti a ritrovare la strada...\n@c0@"
  ja: "@a@bビアンカ「それにしても　こんなに\n\t飛びおりて　大丈夫なのかな？\n\tもう　チゾットには戻れないかも？\n@c0@"
13:
  de: "@aNera@bIch glaube, mich hat noch keine Höhle so in Trab gehalten wie diese hier. Reisen kann einen ziemlich außer Puste bringen, nicht?\n@c0@"
  en: "@aNera@bI don't think I've ever visited a cave that's had me on tenterhooks as much as this one. Travelling isn't all fun, is it?\n@c0@"
  es: "@aNera@bCredo que nunca he visitado una cueva que me pusiese tan nerviosa. No siempre es divertente viajar, ¿verdad?\n@c0@"
  fr: "@aNera@bJe crois que je n'ai jamais visité de caverne qui me mette autant au supplice. Voyager n'est pas qu'une partie de plaisir, heinⓡ\n@c0@"
  it: "@aNera@bNon ne posso più di questo posto!\nQuand'è che arriviamo?!\n@c0@"
  ja: "@a@bフローラ「私　こんなに\n\t心臓に悪い洞くつは　初めてですわ。\n\t旅って　大変ですのね。\n@c0@"
14:
  de: "@aBianca@bÄhm, %a000090...\nIch glaube, es besteht die Möglichkeit, dass ich vielleicht...\n@c0@"
  en: "@aBianca@bUm, %a000090...\nI think there's a chance I might be...\n@c0@"
  es: "@aBianca@bMmm, %a000090...\nCreo que podría ser que yo...\n@c0@"
  fr: "@aBianca@bHum, %a000090...\nIl se pourrait que je sois...\n@c0@"
  it: "@aBianca@b%0%a000090...\nForse sono...\n@c0@"
  ja: "@a@bビアンカ「ねえ…　%a000090。\n\t私　もしかしたら……。\n@c0@"
15:
  de: "@aBianca@bÄhm. Schon gut.\nIst nicht so wichtig.\n@c0@"
  en: "@aBianca@bUm. Never mind.\nJust forget I said anything.\n@c0@"
  es: "@aBianca@bMmm, da igual.\r\nOlvida lo que he dicho, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bHum. Non, rien.\nOublie ce que je viens de dire.\n@c0@"
  it: "@aBianca@bNo, lascia perdere.\nStavo solo pensando ad alta voce...\n@c0@"
  ja: "@a@bビアンカ「ううん。\n\tなんでもないっ。　ごめんね。\n@c0@"
16:
  de: "@aNera@bDanke, dass du dich die ganze Zeit so um mich sorgst und dich ständig erkundigst, wie es mir geht. Mach dir keine Sorgen. Es geht mir gut, wirklich.\n@c0@"
  en: "@aNera@bThanks for being so considerate of me and asking how I feel all the time. You needn't worry. I feel fine, honestly.\n@c0@"
  es: "@aNera@bGracias por ser tan atento conmigo y preguntarme continuamente cómo estoy. Non ti preoccupare, me encuentro bien, en serio.\n@c0@"
  fr: "@aNera@bMerci de prendre autant soin de moi et de me demander sans cesse comment je vais. Tu n'as\r\npas à t'inquiéter. Je vais bien, vraiment.\n@c0@"
  it: "@aNera@bTi ringrazio per avermi chiesto tante volte come mi sento, ma sto bene.\nLo so che ti preoccupi per me, ma è tutto a posto.\n@c0@"
  ja: "@a@bフローラ「あなたって　やさしいのね。\n\tずっと　話しかけてくださって。\n\t大丈夫。　私は　大丈夫よ。\n@c0@"
17:
  de: "@aBianca@bNach all der Springerei bin ich völlig durcheinander. Ich hab keinen Schimmer, auf welcher Ebene wir jetzt sind.\n@c0@"
  en: "@aBianca@bI've totally lost track of what level we're on after all that jumpin' about.\n@c0@"
  es: "@aBianca@bCon tanto saltar aquí y allí he perdido la cuenta del nivel en el que estamos.\n@c0@"
  fr: "@aBianca@bJe ne sais plus du tout à quel niveau nous nous trouvons, après tous ces sauts.\n@c0@"
  it: "@aBianca@bA furia di saltare, non so più a quale livello ci troviamo.\n@c0@"
  ja: "@a@bビアンカ「とちゅう　飛びおりたりしたから\n\t今　何階にいるのか\n\tよくわからないわね。\n@c0@"
18:
  de: "@aBianca@bAber klar! Dafür haben wir doch dieses Dings! Wie hieß es doch gleich? Ach ja, Bussolinger Kompass!\n@c0@"
  en: "@aBianca@bOf course! Now would probably be a good\r\ntime to use that compass. What was it called? The Batten binnacle?\n@c0@"
  es: "@aBianca@b¡Claro! Este es el momento adecuado para utilizar esa brújula... ¿Cómo era? La bitácora de Habs, ¿no?\n@c0@"
  fr: "@aBianca@bMais bien sûrⓠ C'est sûrement le bon moment pour utiliser cette boussole. Comment elle s'appelle, déjàⓡ La boussole de Técarlo, c'est çaⓡ\n@c0@"
  it: "@aBianca@bChe stupidi che siamo!\nPerché non proviamo a usare la bussola delle nevi?\n@c0@"
  ja: "@a@bビアンカ「そっか！\n\tこういうときに　チゾットのコンパスを\n\t使えばいいんだわ。\n@c0@"
19:
  de: "@aNera@bIch hatte erwartet, dass der Weg nach Humburg bergig sein würde, aber mit so vielen Höhlen hatte ich nicht gerechnet.\n@c0@"
  en: "@aNera@bI was expecting the road to Gotha to be mountainous, but I didn't think it would\r\nbe all caves.\n@c0@"
  es: "@aNera@bEsperaba que el camino a Pankraz fuese veramente escarpado, ma no que todo fuesen cuevas.\n@c0@"
  fr: "@aNera@bJe m'attendais à ce que le chemin vers Gotha soit montagneux, mais pas à ce qu'il soit uniquement constitué de cavernes.\n@c0@"
  it: "@aNera@bImmaginavo che avremmo dovuto affrontare ancora qualche difficoltà prima di arrivare a Denim, ma non mi sarei mai aspettata una cosa del genere!\n@c0@"
  ja: "@a@bフローラ「グランバニアへの道が\n\t山道ではなく　洞くつだったなんて\n\t思いもしませんでしたわ。\n@c0@"
20:
  de: "@aNera@bIch bin total verwirrt... Moment mal! Vielleicht hilft uns ja dieser Bussolinger Kompass weiter!\n@c0@"
  en: "@aNera@bI feel totally losⓚⓛ Wait a minute! Maybe that compass we have, the Batten binnacle, would be of some use!\n@c0@"
  es: "@aNera@bEstoy completamente perd... ¡Aspetta un attimo! ¡A lo mejor esa brújula, la bitácora de Habs, puede servirnos de algo!\n@c0@"
  fr: "@aNera@bJe suis complètement per... Attends une secondeⓠ Peut-être que cette boussole que nous avons, la boussole de Técarlo, pourrait nous être utileⓠ\n@c0@"
  it: "@aNera@bGuardiamo in faccia la realtà: ci siamo persi! Non abbiamo idea di dove andar... Aspetta! Forse la bussola delle nevi può indicarci la strada giusta! \n@c0@"
  ja: "@a@bフローラ「今　どこにいるのか……。\n\tそうですわ！　チゾットのコンパスで\n\tわからないかしら？\n@c0@"
21:
  de: "@aBianca@bSo viele Stufen! Hier werden wir uns doch todsicher verlaufen.\n@c0@"
  en: "@aBianca@bThere are so many stairs here.\r\nWe're bound to get lost.\n@c0@"
  es: "@aBianca@bHay muchas escaleras aquí.\r\nSeguro que nos perdemos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl y a tellement d'escaliers, ici.\r\nOn est obligés de se perdre.\n@c0@"
  it: "@aBianca@bCon tutte le scale che ci sono, sarà inevitabile perdersi...\n@c0@"
  ja: "@a@bビアンカ「この場所は　階段が多くて\n\t迷っちゃいそうだわ。\n@c0@"
22:
  de: "@aNera@bIch bin froh, dass du bei mir bist. Wenn ich alleine wäre, würde ich bestimmt nicht mehr hier heraus finden.\n@c0@"
  en: "@aNera@bI'm glad you're here with me. I'm sure I'd never find my way out of here if I were alone.\n@c0@"
  es: "@aNera@bMe alegro molto de que estemos juntos aquí. Seguro que no podría encontrar sola la salida.\n@c0@"
  fr: "@aNera@bJe suis contente que tu sois là avec moi. Je n'aurais jamais réussi à sortir d'ici toute seule.\n@c0@"
  it: "@aNera@bPer fortuna sei con me.\nSe fossi da sola, non riuscirei mai a uscire da qui!\n@c0@"
  ja: "@a@bフローラ「あなたがいてくださって\n\tよかったわ。　私ひとりだったら\n\tきっと　この洞くつを　でられないわ。\n@c0@"
23:
  de: "@aBianca@bVorsicht, dass du nicht dauernd Sachen überall fallen lässt, %a000090! Ich kann mich allerdings nicht daran erinnern, das da verloren zu haben.\n@c0@"
  en: "@aBianca@bYou should be careful not to go droppin' things about the place, %a000090! I dun't remember droppin' that, mind.\n@c0@"
  es: "@aBianca@b¡Ten cuidado de no ir perdiendo cosas por ahí, %a000090! Aunque no recuerdo haber perdido eso, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu devrais faire attention à ne pas laisser tomber tes affaires partout, %a000090ⓠ Remarque,\nje ne me souviens pas avoir perdu ça.\n@c0@"
  it: "@aBianca@bDi' un po', ma siamo sicuri di averlo perso noi quell'affare?\n@c0@"
  ja: "@a@bビアンカ「%a000090　落とし物しないように\n\t気をつけないと　ダメだよ。\n\tでも　そんなの　落としたっけ？？\n@c0@"
24:
  de: "@aNera@bWas für ein netter alter Mann, dass er unsere Habseligkeiten für uns findet! Aber ich bin gar nicht sicher, dass wir das überhaupt verloren haben.\n@c0@"
  en: "@aNera@bWhat a nice old man, finding our belongings for us like that. I'm not sure we dropped it in the first place, mind you.\n@c0@"
  es: "@aNera@bQué anciano más encantador, que nos devuelve lo que perdemos. Aunque no estoy sicura de haber perdido eso, la verdad.\n@c0@"
  fr: "@aNera@bQuel vieil homme charmant. Il a retrouvé certaines\r\nde nos affaires. Pourtant, je ne me rappelle pas avoir perdu ça.\n@c0@"
  it: "@aNera@bChe gentile quel signore a restituirci ciò che avevamo distrattamente smarrito! Anche se non sono certa che quella roba l'avessimo persa noi...\n@c0@"
  ja: "@a@bフローラ「親切な方でしたわね。\n\t落とし物を　拾ってくださるなんて。\n\tでも　そんなの　落としたかしら？\n@c0@"
25:
  de: "@aBianca@b%0%a000090! Dieses Fließende Kleid gehört doch gar nicht uns! Du kannst doch keine solchen Lügen erzählen!\n@c0@"
  en: "@aBianca@b%0%a000090! That flowin' dress en't ours! You mustn't tell lies like that!\n@c0@"
  es: "@aBianca@b¡%0%a000090! ¡Ese vestido vaporoso no es nuestro! ¡No está bien que digas mentiras!\n@c0@"
  fr: "@aBianca@b%0%a000090ⓠ Cette robe flottante n'est pas à toiⓠ Tu ne dois pas dire des mensonges, comme çaⓠ\n@c0@"
  it: "@aBianca@b%0%a000090! Quella veste d'acqua non è nostra!\nNon si dicono le bugie! Però è carina, eh...?\nBeh, per questa volta ti perdono, va'...\n@c0@"
  ja: "@a@bビアンカ「%a000090　このはごろもは\n\t私たちのじゃないわよ。\n\tあんなこと言って…　ダメじゃない！\n@c0@"
26:
  de: "@aNera@bDu solltest wirklich nicht so schwindeln. Das macht man nicht. Du weißt doch, dass dieses Fließende Kleid gar nicht uns gehört.\n@c0@"
  en: "@aNera@bYou really shouldn't tell fibs like that. It's wicked. You know that flowing dress doesn't really belong to us.\n@c0@"
  es: "@aNera@bNo deberías decir mentiras, caro mio. Es de mala persona. Sabes que ese vestido vaporoso no nos pertenece.\n@c0@"
  fr: "@aNera@bTu ne devrais pas dire de mensonges, tu sais.\r\nC'est mal. Tu sais très bien que cette robe\r\nflottante ne nous appartient pas, en réalité.\n@c0@"
  it: "@aNera@bChe bugiardo che sei!\nSai meglio di me che quella veste d'acqua non è nostra!\n@c0@"
  ja: "@a@bフローラ「あなた　いいかげんなこと\n\t言っては　いけませんわよ。\n\t私たちのはごろもでは　ありませんわ。\n@c0@"
27:
  de: "@aBianca@bUi! Sieh dir nur all die Sachen an, die wir gekriegt haben! Ehrlichkeit währt eben doch am längsten!\n@c0@"
  en: "@aBianca@bWow! Look at all these things we've got! Just goes to show honesty's the best policy!\n@c0@"
  es: "@aBianca@b¡Vaya! ¡Mira todo lo que tenemos! ¡Parece que ser honrado compensa!\n@c0@"
  fr: "@aBianca@bWaouhⓠ Regarde tout ce que nous avons reçuⓠ\nÇa prouve bien que l'honnêteté est toujours récompenséeⓠ\n@c0@"
  it: "@aBianca@bSanto cielo, quanta roba!\nLo vedi?\nL'onestà paga sempre!\n@c0@"
  ja: "@a@bビアンカ「わ～　こんなに\n\tたくさん　もらっちゃったね。\n\t正直に答えて　よかった！\n@c0@"
28:
  de: "@aNera@bIch hoffe, wir tun das Richtige, wenn wir all diese Sachen von dem Alten annehmen. War das nicht großzügig von ihm?!\n@c0@"
  en: "@aNera@bI do hope it's alright for us to take all these things off that old man. Wasn't he generous!\n@c0@"
  es: "@aNera@bEspero que sea correcto que nos llevemos tutto lo que nos ha dado ese anciano. ¡Qué persona más generosa!\n@c0@"
  fr: "@aNera@bJ'espère que ça ne pose pas de problème d'accepter tout ce que ce vieil homme nous a offert.\nQuelle générositéⓠ\n@c0@"
  it: "@aNera@bAvremo fatto bene ad accettare tutte queste cose da quel povero vecchio? Forse non ne aveva bisogno, ma è stato comunque fin troppo generoso...\n@c0@"
  ja: "@a@bフローラ「こんなにたくさん\n\tいただいて　よかったのかしら。\n\tふとっぱらな方　ですこと。\n@c0@"
29:
  de: "@aBianca@bIst ja komisch. Die Treppe nach unten führt bloß hierher.\n@c0@"
  en: "@aBianca@bThat's weird. The stairs down only led here.\n@c0@"
  es: "@aBianca@b¡Qué cosa más rara! Las escaleras de bajada solo conducen hasta aquí.\n@c0@"
  fr: "@aBianca@bC'est bizarre. L'escalier ne menait qu'ici.\n@c0@"
  it: "@aBianca@bChe strano...\nLe scale conducono qui, ma non è possibile proseguire.\n@c0@"
  ja: "@a@bビアンカ「おかしいわね。\n\t下におりる階段は\n\tここだけだったのに……。\n@c0@"
30:
  de: "@aBianca@bOh nein! Müssen wir etwa die ganze Treppe wieder hochsteigen?\n@c0@"
  en: "@aBianca@bOh no! You dun't think we have to climb all the way back up to the top, do you?\n@c0@"
  es: "@aBianca@b¡Oh, no! No vamos a tener que subir otra vez arriba del todo, ¿verdad?\n@c0@"
  fr: "@aBianca@bOh nonⓠ Ne me dis pas que nous allons devoir tout remonter jusqu'au sommetⓠ\n@c0@"
  it: "@aBianca@bOh, no!\nNon dovremo mica risalire fino in cima?!\n@c0@"
  ja: "@a@bビアンカ「はっ…　もしかして\n\tもう一度　上にあがらないと\n\tいけないとか？　ふう……。\n@c0@"
31:
  de: "@aNera@bDas scheint mir eine Sackgasse zu sein. Ob's wohl noch einen anderen Ausweg gibt?\n@c0@"
  en: "@aNera@bIt looks like this is a dead end. I wonder if there's another way out.\n@c0@"
  es: "@aNera@bParece un callejón sin salida. Me pregunto si, veramente, habrá otro camino.\n@c0@"
  fr: "@aNera@bC'est une impasse, on dirait. Je me demande s'il\r\nexiste une autre sortie.\n@c0@"
  it: "@aNera@bQuesto è un vicolo cieco.\nChe dici? Ci sarà un'altra via d'uscita?\n@c0@"
  ja: "@a@bフローラ「行き止まりですわ。\n\tほかに　出口があるのかしら……。\n@c0@"
32:
  de: "@aBianca@bHm! Ich bin doch nicht die ganzen Stufen runtergestiegen, bloß um sie wieder rauflaufen zu müssen!\n@c0@"
  en: "@aBianca@bHuh! I didn't expect to come all this way down only to have to climb all the way back up again!\n@c0@"
  es: "@aBianca@b¡Jo! ¡No esperaba bajar hasta aquí para luego tener que volver a subir otra vez hasta arriba!\n@c0@"
  fr: "@aBianca@bPfffⓠ Je ne m'attendais pas à faire tout ce chemin en descente pour devoir finalement tout remonterⓠ\n@c0@"
  it: "@aBianca@bChe bellezza, eh?!\nAbbiamo fatto tanta fatica per scendere quaggiù... e adesso ci tocca tornare di sopra!\n@c0@"
  ja: "@a@bビアンカ「まさか　一度おりて\n\tもう一度　のぼることになるなんて\n\t思わなかったわよ……。\n@c0@"
33:
  de: "@aBianca@bHier gibt's überall diese Riesenlöcher. Wenn man nur irgendwie rausfinden könnte, welche nach draußen führen.\n@c0@"
  en: "@aBianca@bThere's all these huge holes all over the place.\r\nIf only there was some way of knowin' which of them leads to the way out.\n@c0@"
  es: "@aBianca@bEste sitio está lleno de agujeros enormes.\r\nOjalá hubiese forma de saber cuál de ellos conduce a la salida.\n@c0@"
  fr: "@aBianca@bIl y a tellement de grands trous dans tous les sens, ici. Si seulement il existait un moyen de savoir lesquels d'entre eux mènent à la sortie.\n@c0@"
  it: "@aBianca@bQui è pieno di buchi, ma non c'è modo di capire quali conducono all'uscita...\n@c0@"
  ja: "@a@bビアンカ「大きな穴が　いっぱいね。\n\tどれかが　出口に\n\tつながってたりするのかしら……。\n@c0@"
34:
  de: "@aNera@bIch fand schon den Weg nach Bussolingen schwierig, aber das hier setzt dem Ganzen die Krone auf!\n@c0@"
  en: "@aNera@bI thought the path to Battenberg was difficult, but this is a whole new story.\n@c0@"
  es: "@aNera@bPensaba que el camino hacia Habsburgo era difficile, ma esto es mucho peor.\n@c0@"
  fr: "@aNera@bJe trouvais que le chemin vers le hameau Técarlo était difficile, mais là, c'est une tout autre histoire.\n@c0@"
  it: "@aNera@bCredevo che il sentiero che porta a Neviternia fosse impervio, ma questo è molto peggio!\n@c0@"
  ja: "@a@bフローラ「この洞くつは　チゾットへ\n\t行くときの道とは　また　ちがった\n\tつらさが　ありますわね。\n@c0@"
35:
  de: "@aNera@bWas für gewaltige Löcher! Bestimmt müssen wir doch nicht auch noch in die reinspringen?!\n@c0@"
  en: "@aNera@bWhat enormous holes! Surely we're not going to have to jump down one of those too!?\n@c0@"
  es: "@aNera@b¡Qué agujeros más enormes! ¡No pretenderás que saltemos dentro, ¿verdad?!\n@c0@"
  fr: "@aNera@bQuels trous gigantesquesⓠ Nous n'allons pas devoir\ny sauter encore une foisⓡⓐ\n@c0@"
  it: "@aNera@bChe buchi enormi!\nPer favore, non dirmi che dobbiamo saltarci dentro...!\n@c0@"
  ja: "@a@bフローラ「あんなに　大きな穴が…\n\tまさか　あそこからも\n\t飛びおりないと　いけないのかしら。\n@c0@"
36:
  de: "@aBianca@bToll! Dass du den gefunden hast!\n@c0@"
  en: "@aBianca@bBrilliant! Fancy you findin' this!\n@c0@"
  es: "@aBianca@b¡Genial! ¡Qué bien que hayas encontrado esto!\n@c0@"
  fr: "@aBianca@bGénialⓠ Tu imaginais trouver ça làⓡⓐ\n@c0@"
  it: "@aBianca@bFantastico!\nAvresti mai immaginato di trovare un oggettino del genere in un posto come questo?\n@c0@"
  ja: "@a@bビアンカ「すっご～い！\n\tよく　こんな場所が　あるって\n\tわかったわね。\n@c0@"
37:
  de: "@aNera@bWie wundervoll von dir, so etwas an einem solchen Ort aufzutreiben!\n@c0@"
  en: "@aNera@bYou're truly amazing, being able to find something in a place like this!\n@c0@"
  es: "@aNera@b¡Es incredibile que seas capaz de encontrar algo en un lugar así!\n@c0@"
  fr: "@aNera@bTu es vraiment incroyable pour réussir à trouver quelque chose dans un endroit pareilⓠ\n@c0@"
  it: "@aNera@bNon solo sei bello, forte e coraggioso, ma anche incredibilmente fortunato! Solo tu potevi trovare un oggetto tanto prezioso in un posto come questo!\n@c0@"
  ja: "@a@bフローラ「ここを　見つけるなんて\n\tあなたって　本当に　すごいわ！\n@c0@"
38:
  de: "@aBianca@bWir sind jetzt schon ziemlich weit oben. Ich hoffe, wir sind auch auf dem richtigen Weg.\n@c0@"
  en: "@aBianca@bWe've come a long way up now. I wonder if we're on the right path.\n@c0@"
  es: "@aBianca@bYa hemos subido mucho. No sé si estaremos en el camino correcto.\n@c0@"
  fr: "@aBianca@bNous avons grimpé pendant un bon moment.\r\nJe me demande si nous sommes sur la bonne voie.\n@c0@"
  it: "@aBianca@bAbbiamo camminato un bel po', non è vero?\nSperiamo di essere sulla strada giusta...\n@c0@"
  ja: "@a@bビアンカ「ずいぶん　のぼったけど\n\t本当に　この道で\n\tあってるのかしら……。\n@c0@"
39:
  de: "@aNera@bOb wohl jeder, der nach Humburg reist, diesen grässlichen Weg nehmen muss?\n@c0@"
  en: "@aNera@bI wonder if everyone who travels to Gotha has to suffer this awful journey.\n@c0@"
  es: "@aNera@bMe pregunto si todos los que viajan a Pankraz tienen que sufrir este viaje atroce.\n@c0@"
  fr: "@aNera@bJe me demande si tous ceux qui vont à Gotha sont obligés d'affronter cet horrible trajet.\n@c0@"
  it: "@aNera@bAncora non riesco a credere che questo dedalo infinito sia l'unica strada che porta a Denim...\nPossibile che non esista un altro percorso?\n@c0@"
  ja: "@a@bフローラ「グランバニアへ　行く人は\n\tみんな　このような苦労をして\n\t行っているのかしら。\n@c0@"
40:
  de: "@aBianca@bMoment mal!\nSiehst du den Händler da drüben?\n@c0@"
  en: "@aBianca@bWait a minute!\nSee that peddler over there?\n@c0@"
  es: "@aBianca@b¡Eh, un momento!\r\n¿Ves a ese buhonero?\n@c0@"
  fr: "@aBianca@bAttends une secondeⓠ Tu vois ce marchand, là-basⓡ\n@c0@"
  it: "@aBianca@bAspetta un attimo!\nLo riconosci quel tipo, vero?\n@c0@"
  ja: "@a@bビアンカ「あれ？\n\tあそこに見える　商人さんは？？\n@c0@"
41:
  de: "@aBianca@bSind wir womöglich durch das falsche Loch gefallen?\n@c0@"
  en: "@aBianca@bI wonder if we went and fell down the\r\nwrong hole...\n@c0@"
  es: "@aBianca@b¿No habremos caído por el agujero equivocado?\n@c0@"
  fr: "@aBianca@bJe me demande si nous ne serions pas tombés par\r\nle mauvais trou.\n@c0@"
  it: "@aBianca@bNon è che abbiamo scelto il buco sbagliato?!\n@c0@"
  ja: "@a@bビアンカ「私たち　落ちる場所を\n\tまちがえちゃったのかしら……。\n@c0@"
42:
  de: "@aNera@bIch bin sicher, dass ich diesen Händler schon mal gesehen habe.\n@c0@"
  en: "@aNera@bI'm sure I've seen that peddler before.\n@c0@"
  es: "@aNera@bEstoy sicura de que he visto antes a ese buhonero.\n@c0@"
  fr: "@aNera@bJe suis sûre d'avoir déjà vu ce marchand.\n@c0@"
  it: "@aNera@bSono certa di aver già visto quell'uomo...\n@c0@"
  ja: "@a@bフローラ「私　あそこにいらっしゃる\n\t商人さんに　見覚えがありますわ。\n@c0@"
43:
  de: "@aNera@bVielleicht haben wir den falschen Weg gewählt. Oder wir sind durch das falsche Loch gefallen. So oder so, ich glaube, wir müssen's noch einmal probieren.\n@c0@"
  en: "@aNera@bPerhaps we took the wrong path. Or maybe we dropped down in the wrong spot. Either way, it looks like we'll have to try again.\n@c0@"
  es: "@aNera@bQuizá nos hemos equivocado de camino. O a lo mejor nos hemos dejado caer por el agujero que no era. En fin, sembra que tendremos que intentarlo de nuevo.\n@c0@"
  fr: "@aNera@bPeut-être que nous avons pris le mauvais chemin.\r\nOu que nous avons sauté au mauvais endroit.\r\nQuoi qu'il en soit, nous allons devoir recommencer.\n@c0@"
  it: "@aNera@bIl che vuol dire che abbiamo preso la strada sbagliata, o che non siamo saltati nel buco corretto.\nIn ogni caso, ci toccherà ripartire daccapo... \n@c0@"
  ja: "@a@bフローラ「道を　まちがえたのか\n\t落ちる場所を　まちがえたのか……\n\tともかく　もう１回　ですわね。\n@c0@"
44:
  de: "@aBianca@bFantastisch! Wir haben's geschafft!\n@c0@"
  en: "@aBianca@bBlimmin' marvellous! We finally cracked it!\n@c0@"
  es: "@aBianca@b¡Supergenial! ¡Lo hemos resuelto al fin!\n@c0@"
  fr: "@aBianca@bFantastiqueⓠ On s'en est enfin sortisⓠ\n@c0@"
  it: "@aBianca@bEh?!\nNon ci posso credere...\nCe l'abbiamo fatta!\n@c0@"
  ja: "@a@bビアンカ「やった～。\n\tやっと　外に出られたよ……。\n@c0@"
45:
  de: "@aNera@bDa fällt mir aber ein Stein vom Herzen! Allmählich kam mir die Reise schon sehr lang vor.\n@c0@"
  en: "@aNera@bWhat a relief! This was starting to feel like an awfully long journey.\n@c0@"
  es: "@aNera@b¡Qué alivio! Este viaje se me estaba empezando a hacer troppo lungo.\n@c0@"
  fr: "@aNera@bQuel soulagementⓠ Je commençais à trouver le trajet vraiment très long.\n@c0@"
  it: "@aNera@bAh, che sollievo! Non ne potevo più!\nQuesto è stato il tragitto più lungo, scomodo e faticoso della mia vita!\n@c0@"
  ja: "@a@bフローラ「やっと　地面をふめましたわ。\n\tずいぶん　長い道のりだったような\n\t気がします。\n@c0@"
46:
  de: "@aNera@bIch glaube, mein Magen weiß schon gar nicht mehr, wo sein Platz ist, nachdem er die ganze Zeit überall in mir rumgerutscht ist.\n@c0@"
  en: "@aNera@bI don't think my stomach knows where it is after all that dropping about all over the place.\n@c0@"
  es: "@aNera@bCreo que mi estómago no sabe dónde está después de tanto dejarse caer por todos lados.\n@c0@"
  fr: "@aNera@bJe crois que mon estomac ne sait plus où il en est après tous ces sauts.\n@c0@"
  it: "@aNera@bTutto quel saltare, salire e scendere mi ha scombussolata da capo a piedi...\n@c0@"
  ja: "@a@bフローラ「何度も　飛びおりたから\n\tお腹に　ひびいて……。\n@c0@"
47:
  de: "@aBianca@bImmer, wenn man denkt, man kommt endlich raus, kommt noch eine Höhle! Aber jetzt kann der Ausgang nicht mehr weit sein.\n@c0@"
  en: "@aBianca@bJust when you think you're outside again, there's another cave! But the exit can't be far away now.\n@c0@"
  es: "@aBianca@b¡Y cuando crees que ya estás fuera, otra cueva! Pero la salida no puede quedar lejos ya, ¿sabes?\n@c0@"
  fr: "@aBianca@bPile au moment où on croit être à l'extérieur,\non tombe sur une autre caverneⓠ Mais la sortie\nne doit plus être bien loin, à présent.\n@c0@"
  it: "@aBianca@bOh, no! Un'altra caverna! Ci mancava solo questa...\nFacciamoci coraggio, su.\nL'uscita non può essere lontana.\n\n@c0@"
  ja: "@a@bビアンカ「外に出られたのに\n\tまた　洞くつだね。\n\tでも　出口はきっと　すぐそこよ！\n@c0@"
48:
  de: "@aNera@bOh je. Nicht schon wieder in der Höhle! Aber ich bin sicher, jetzt ist es nicht mehr weit zum Ausgang.\n@c0@"
  en: "@aNera@bOh dear. Not inside the cave again! I'm sure the exit isn't far away now, though.\n@c0@"
  es: "@aNera@b¡Oh!, cielos. ¡Otra cueva no! Pero estoy sicura de que la salida ya no está lejos.\n@c0@"
  fr: "@aNera@bOh non. Pas encore une caverneⓠ Mais je suis quand même sûre que la sortie n'est plus très loin, maintenant.\n@c0@"
  it: "@aNera@bDi nuovo nella grotta?!\r\nOh, no!\nSperiamo almeno che l'uscita non sia lontana...\n@c0@"
  ja: "@a@bフローラ「また　洞くつへ\n\t逆もどりですわ。　でも\n\t出口はちかいような　気がします。\n@c0@"
49:
  de: "@aBianca@bGlaubst du, das könnte unser Sancho gewesen sein? Das müssen wir unbedingt rausfinden! Komm schon, %a000090! Schnell nach Humburg!\n@c0@"
  en: "@aBianca@bDo you think Sancho could be our Sancho?\nWe have to find out! Come on, %a000090!\nLet's hurry to Gotha!\n@c0@"
  es: "@aBianca@b¿Crees que ese Sancho puede ser nuestro Sancho?\n¡Tenemos que averiguarlo! ¡Vamos, %a000090!\n¡Deprisa, a Pankraz!\n@c0@"
  fr: "@aBianca@bTu crois que ce Sancho pourrait être notre Sanchoⓡ Il faut en avoir le cœur netⓠ Viens, %a000090ⓠ Dépêchons-nous de rejoindre Gothaⓠ\n@c0@"
  it: "@aBianca@bSancho? Il ⓕnostroⓖ Sancho?!\nDobbiamo scoprire se è davvero lui, %a000090!\nPresto, corriamo a Denim!\n@c0@"
  ja: "@a@bビアンカ「サンチョさんて　サンチョさん？\n\t%a000090　こうしちゃいられないわ\n\tすぐ　グランバニアへ向かいましょう。\n@c0@"
50:
  de: "@aNera@bSagt dir der Name Sancho etwas? Er schien dich gerade irgendwie besonders zu berühren...\n@c0@"
  en: "@aNera@bDoes the name Sancho mean something to you?\r\nIt seemed to strike something of a chord...\n@c0@"
  es: "@aNera@b¿Significa qualcosa para ti el nombre Sancho?\r\nMe ha dado la sensación de que te sonaba...\n@c0@"
  fr: "@aNera@bEst-ce que le nom de Sancho t'est familierⓡ\nIl a semblé t'évoquer quelque chose...\n@c0@"
  it: "@aNera@bPerché quell'espressione sorpresa?\nConosci per caso qualcuno di nome Sancho?\n@c0@"
  ja: "@a@bフローラ「サンチョさんって　名前に\n\t心当たりが　あるのですか？\n\tということは…　それって……。\n@c0@"
51:
  de: "@aGriselda@bSicher wird die Reise jetzt viel leichter, nachdem wir diese mickrige Brücke überquert haben und auf dem Weg ins Tal sind.\n@c0@"
  en: "@aDebora@bThe journey should be much easier now we've crossed that flimsy bridge and we're on the\r\ndownhill path.\n@c0@"
  es: "@aStefania@bAhora que hemos cruzado ese puente tan endeble y vamos cuesta abajo, il viaggio será mucho más fácil.\n@c0@"
  fr: "@aPandora@bLe trajet devrait être bien plus facile maintenant\r\nque nous avons franchi ce pont branlant et que\r\nnous sommes dans la descente.\n@c0@"
  it: "@aViola@bOra che abbiamo superato il ponte il viaggio dovrebbe essere più agevole, visto che la strada prosegue in discesa...\n@c0@"
  ja: "@a@bデボラ「あの　いまいましい　つり橋も\n\t渡りきったし　あとは下るだけね。\n@c0@"
52:
  de: "@aGriselda@bIch glaube, das ist gar nicht gut für den Teint, all dieses Herumgestolpere an solchen Orten.\n@c0@"
  en: "@aDebora@bI don't think it's very good for the skin, all this trudging about in places like this.\n@c0@"
  es: "@aStefania@bNon credo que le convengan nada a mi piel estas caminatas.\n@c0@"
  fr: "@aPandora@bJe ne suis pas sûre que ce soit très bon pour la\r\npeau de se balader dans des endroits pareils.\n@c0@"
  it: "@aViola@bNon sono certa che l'aria di questi posti faccia bene alla mia pelle. Caro, devi assolutamente comprarmi una cremina protettiva...\n@c0@"
  ja: "@a@bデボラ「それにしても\n\tこう　険しい　道ばかり　歩いていると\n\tお肌に　良くなさそう。\n@c0@"
53:
  de: "@aGriselda@bDu wirst mich doch beschützen, wenn es nötig sein sollte, %a000090? Und die übrige Zeit werde dann ich für dich sorgen.\n@c0@"
  en: "@aDebora@bYou will protect me if it comes to it, won't you, %a000090? I take care of you the rest of the time.\n@c0@"
  es: "@aStefania@bSi llega el momento me protegerás, ¿no, %a000090? Después de tutto lo que hago per te...\n@c0@"
  fr: "@aPandora@bTu me protégeras si c'est nécessaire, n'est-ce pas, %a000090ⓡ C'est moi qui prends soin de toi le reste du temps.\n@c0@"
  it: "@aViola@b%0%a000090, mi proteggerai da qualunque pericolo anche a costo della tua vita, vero?\n㈡\nÈ il minimo che puoi fare, viste le cure e le attenzioni che ti dedico in continuazione!\n@c0@"
  ja: "@a@bデボラ「%a000090。　いざとなったら\n\tちゃんと　守ってよね。　ふだんは\n\t私が　あんたを　守ってるんだから。\n@c0@"
54:
  de: "@aGriselda@bEs ist ja schön und gut, uns zu erzählen, dass es zu gefährlich ist, aber wir haben schließlich keine andere Wahl als weiterzugehen.\n@c0@"
  en: "@aDebora@bIt's all very well him saying it's too dangerous, but we don't have any choice but to keep going.\n@c0@"
  es: "@aStefania@bSí, puede decir que es todo lo pericoloso que quiera, ma no tenemos otra opción que seguir.\n@c0@"
  fr: "@aPandora@bC'est bien gentil de nous dire que c'est trop dangereux, mais on n'a pas d'autre choix que continuer d'avancer.\n@c0@"
  it: "@aViola@bÈ stato gentile a metterci in guardia, ma temo che non abbiamo altra scelta che proseguire...\n@c0@"
  ja: "@a@bデボラ「えらい目にあおうが\n\t私たちは　先に行かなきゃ\n\tなんないのよ。\n@c0@"
55:
  de: "@aGriselda@bGeh einfach weiter, %a000090. Nur keine Angst! Du gehst vor, ja?\n@c0@"
  en: "@aDebora@bJust keep going, %a000090. Have no fear!\nYou lead the way, okay?\n@c0@"
  es: "@aStefania@bAndiamo, %a000090. ¡Senza miedo!\nTú ve delante que a mí me da la risa, ¿capisci?\n@c0@"
  fr: "@aPandora@bContinue, %a000090. N'aie pas peurⓠ\nC'est toi qui ouvres la voie, d'accordⓡ\n@c0@"
  it: "@aViola@bCoraggio, %a000090!\nAnche se ci attendono pericoli inimmaginabili, dobbiamo andare aventi!\n㈡\nTu comincia a incamminarti, io ti raggiungerò quando mi avrai assicurata che non ci sono rischi...\n@c0@"
  ja: "@a@bデボラ「おじけづかないで\n\tガンガン　進みなさいよ。\n\tもちろん　先頭は%a000090だからね。\n@c0@"
56:
  de: "@aGriselda@bAutsch! Warum hat uns dieser Händler nicht davor gewarnt?\n@c0@"
  en: "@aDebora@bOuch! Why didn't that peddler warn us that that would happen?\n@c0@"
  es: "@aStefania@b¡Aaay! ¿Por qué no nos advirtió ese buhonero de que pasaría questo?\n@c0@"
  fr: "@aPandora@bOuilleⓠ Pourquoi ce colporteur ne nous\na-t-il pas prévenus de çaⓡ\n@c0@"
  it: "@aViola@bAhia!\nMa non potrebbero mettere qualche cartello che avvisi del pericolo?!\n@c0@"
  ja: "@a@bデボラ「いたたたっ……\n\tあの商人　なんで\n\tちゃんと　教えてくれないの？\n@c0@"
57:
  de: "@aGriselda@bDem würdest du was erzählen, wenn ich mir meine armen Füßchen anstoßen würde, was, %a000090?\n@c0@"
  en: "@aDebora@bYou'd have had to have serious words with him if I'd hurt one of my lovely feet, wouldn't you, %a000090?\n@c0@"
  es: "@aStefania@bHabrías tenido que parlare seriamente con él si me hubiese lastimado mi piececito, ¿vero, %a000090?\n@c0@"
  fr: "@aPandora@bSi je m'étais blessé l'un de mes jolis pieds, tu serais allé lui dire deux mots, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@bFacciamo così, %a000090: lascerò che sia tu ad andare avanti, così mi eviterai spiacevoli sorprese.\nTi piace la mia idea?\n@c0@"
  ja: "@a@bデボラ「私の　じまんの　足に\n\tもしものことが　あったら\n\tどうしてくれるのよねえ　%a000090。\n@c0@"
58:
  de: "@aGriselda@bIch hoffe nur, du springst nicht aus lauter Jux und Dollerei in der Gegend herum.\n@c0@"
  en: "@aDebora@bI do hope you're not just jumping about the place for the sheer fun of it.\n@c0@"
  es: "@aStefania@bAspetto que estos saltos que estás dando no sean solo de alegría.\n@c0@"
  fr: "@aPandora@bJ'ose espérer que tu ne sautes pas partout\r\njuste pour le plaisir.\n@c0@"
  it: "@aViola@bSenti, ma dobbiamo proprio fare tutti questi salti?\nMi sto spettinando tutta!\n@c0@"
  ja: "@a@bデボラ「あんた……。\n\tわざと　落ちて\n\t楽しんでるんじゃないでしょうね？\n@c0@"
59:
  de: "@aGriselda@bIch wäre bestimmt nie in die Lage gekommen, Ungeheuer in Höhlen zu bekämpfen, wenn ich dich nicht geheiratet hätte.\n@c0@"
  en: "@aDebora@bI'm sure I'd never have found myself having to fight off monsters in caves if I hadn't married you.\n@c0@"
  es: "@aStefania@bSonno sicura de que, si no me hubiese casado contigo, no estaría luchando con monstruos en cuevas.\n@c0@"
  fr: "@aPandora@bJe suis sûre que je ne me serais jamais retrouvée à devoir combattre des monstres dans des grottes si je ne t'avais pas épousé.\n@c0@"
  it: "@aViola@bSono certa che, se non ti avessi sposato, non avrei mai dovuto affrontare mostri grandi, brutti e cattivi in caverne buie e maleodoranti!\n@c0@"
  ja: "@a@bデボラ「あんたと　結婚しなければ\n\t洞くつで　魔物と　戦うなんて\n\t人生なかったわ。\n@c0@"
60:
  de: "@aGriselda@bNicht dass es mir leid tut. Im Gegenteil, ich amüsiere mich dabei wirklich prächtig!\n@c0@"
  en: "@aDebora@bNot that I regret it. No, I'm having a whale of a time.\n@c0@"
  es: "@aStefania@bNo es que lo lamente. En realidad es veramente divertente.\n@c0@"
  fr: "@aPandora@bMais je ne le regrette pas, hein. Pas du tout.\r\nJe m'amuse comme une folle.\n@c0@"
  it: "@aViola@bPerò devo ammettere che mi sto divertendo come non mai!\nIh ih ih!\n@c0@"
  ja: "@a@bデボラ「後悔してないけどね。\n\t楽しいから。\n@c0@"
61:
  de: "@aGriselda@bWeißt du... Ich glaube, ich bekomme vielleicht...\nAch, schon gut. Gehen wir lieber weiter.\n@c0@"
  en: "@aDebora@bYou know... I think I might be...\r\nNever mind. Let's keep going.\n@c0@"
  es: "@aStefania@bSabes... Credo que quizá estoy...\r\nNo importa. Andiamo.\n@c0@"
  fr: "@aPandora@bTu sais... Je crois que je pourrais bien être...\nNon, rien. Continuons d'avancer.\n@c0@"
  it: "@aViola@b%0%a000090...\nNon ne sono ancora certa, ma forse sono...\nNo, lascia stare. Te lo dirò più tardi.\n@c0@"
  ja: "@a@bデボラ「私……　ひょっとしたら……。\n\tううん　なんでもないっ。\n\tさあ　先へ　進みましょ？\n@c0@"
62:
  de: "@aGriselda@bHast du eine Ahnung, wo wir sind, %a000090?\n@c0@"
  en: "@aDebora@bHave you any idea where we are, %a000090?\n@c0@"
  es: "@aStefania@b¿Tienes la menor idea de dove estamos, %a000090?\n@c0@"
  fr: "@aPandora@bAs-tu la moindre idée de là où nous sommes, %a000090ⓡ\n@c0@"
  it: "@aViola@bHai idea di dove ci troviamo %a000090?\n@c0@"
  ja: "@a@bデボラ「ところで\n\tここ　どこなのかしら？\n\t%a000090　わかる？\n@c0@"
63:
  de: "@aGriselda@bDu hast doch noch dieses Ding aus Bussolingen, oder? Du weißt schon, dieses Ding, das einem den rechten Weg zeigt.\n@c0@"
  en: "@aDebora@bIn fact, haven't you got that thing from Battenberg? You know, that thing that tells you the way.\n@c0@"
  es: "@aStefania@bOye, ¿no tienes ese cacharro de Habsburgo? Sí, quella cosa que te muestra el camino.\n@c0@"
  fr: "@aPandora@bÀ propos, tu n'aurais pas avec toi ce truc du hameau Técarloⓡ Tu sais, l'objet qui indique le chemin.\n@c0@"
  it: "@aViola@bNon credi che sia il momento di usare l'oggetto che abbiamo ricevuto a Neviternia? Ricordi?\nQuell'affare che indica la strada da seguire...\n@c0@"
  ja: "@a@bデボラ「そういえば　あんた\n\tチゾットのアレ……　持ってたじゃない？\n\t場所がわかるアレ……。\n@c0@"
64:
  de: "@aGriselda@bMänner, die schwer von Kapee sind, kann ich nicht ausstehen, also mach schon ⓚⓛ finde raus, wo wir sind!\n@c0@"
  en: "@aDebora@bI don't take kindly to men who are slow on the uptake, so hurry up and figure out where we are.\n@c0@"
  es: "@aStefania@bMe sacan de quicio los hombres duros de mollera, así que date prisa en averiguar donde estamos, ¿capisci?\n@c0@"
  fr: "@aPandora@bJ'ai beaucoup de mal avec les hommes mous du bulbe, alors dépêche-toi de trouver notre position.\n@c0@"
  it: "@aViola@bProprio così: la bussola delle nevi.\nCi voleva tanto per capirlo?!\n@c0@"
  ja: "@a@bデボラ「私　ニブイ男は　好みじゃないの。\n\tだから　アレで　わかってよね。\n@c0@"
65:
  de: "@aGriselda@bWenn du den Mut verlierst, werde ich immer da sein, um dich weiter anzutreiben. Nicht, dass ich den Weg kennen würde.\n@c0@"
  en: "@aDebora@bIf you get discouraged, I'll always spur you along.\r\nNot that I know the way, mind you.\n@c0@"
  es: "@aStefania@bSi te desalientas, ya te animaré yo.\r\nAunque yo tampoco sé por dove se va...\n@c0@"
  fr: "@aPandora@bSi jamais tu te décourages, je serai là pour te pousser à avancer. Mais ça n'est pas pour autant que je connais le chemin.\n@c0@"
  it: "@aViola@bAvanti, caro... Non scoraggiarti!\nVedrai che ce la faremo!\nHai visto come sono comprensiva?\n㈡\nAvrei potuto dirti che sei un buono a nulla che non sa mai che pesci prendere, e invece ti ho detto delle dolci paroline per tirarti su di morale.\n㈡\nBada di non farci l'abitudine, perché la cosa non si ripeterà...\n@c0@"
  ja: "@a@bデボラ「あんたが　くじけそうになっても\n\t私が　あんたを　ひっぱってあげるわ。\n\t……道　わからないけどね。\n@c0@"
66:
  de: "@aGriselda@bOh! Wie hast du das nun wieder hingekriegt? Ich hab ja gewusst, dass du ein Schussel bist.\n@c0@"
  en: "@aDebora@bOh! How did you manage that?\nI always knew you were a scatterbrain.\n@c0@"
  es: "@aStefania@b¡Oh! ¿Cómo has perdido eso?\r\nSempre he sabido que eras un cabeza de chorlito.\n@c0@"
  fr: "@aPandora@bOhⓠ Comment tu as fait ton compteⓡ\nJe savais bien que tu n'étais qu'un étourdi.\n@c0@"
  it: "@aViola@bMa perdi sempre tutto tu?!\nSei proprio un caso senza speranza...\n@c0@"
  ja: "@a@bデボラ「あら？　あんた　いつのまに\n\t落とし物したの？\n\tやっぱり　おっちょこちょいね。\n@c0@"
67:
  de: "@aGriselda@bDu hast doch wohl gerade eben nicht gelogen, oder? Lügner kann ich nicht ausstehen.\n@c0@"
  en: "@aDebora@bYou weren't lying just then, were you?\nI don't forgive liars.\n@c0@"
  es: "@aStefania@bNo mentirías, ¿verdad?\r\nNo perdono a los mentirosos, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu n'essayais pas de mentir, à l'instant, dis-moiⓡ Pour moi, les menteurs sont impardonnables.\n@c0@"
  it: "@aViola@bHai mentito! Io odio i bugiardi!\nPer questa volta ti perdono, ma solo perché quella veste d'acqua è proprio della mia taglia...\n@c0@"
  ja: "@a@bデボラ「あんた　まさか\n\tウソついてないでしょうね？\n\tウソついてたら　ゆるさないから。\n@c0@"
68:
  de: "@aGriselda@bIch wusste, dass du ehrlich bist. Du hast ja auch zu deinen Gefühlen gestanden und mich geheiratet. Ob er den ganzen Kram wirklich gefunden hat?\n@c0@"
  en: "@aDebora@bI knew you were honest. You were true to your feelings and chose to marry me, after all.\r\nDo you think he really did find all those things?\n@c0@"
  es: "@aStefania@bSabía que eras honrado. Al fin y al cabo, confiaste en tus sentimientos y te casaste con me.\n㈡\n¿Ma será vero que ese uomo se ha encontrado todas esas cosas?\n@c0@"
  fr: "@aPandora@bJe savais que tu étais honnête. Tu l'as été dans tes sentiments et tu as choisi de m'épouser, après tout. Tu crois vraiment qu'il a trouvé toutes ces chosesⓡ\n@c0@"
  it: "@aViola@bSo che sei buono e onesto, caro.\nMagari a volte un po' fessacchiotto, ma sei una brava persona.\n@c0@"
  ja: "@a@bデボラ「私を　選んだだけあって\n\tやっぱり　あんたは　正直者ね。\n\tでも　本当に　落とし物だったのかしら？\n@c0@"
69:
  de: "@aGriselda@bHast du dich verirrt? Macht nichts. Wenigstens verläuft dein Leben wieder in den richtigen Bahnen, seit du mich geheiratet hast.\n@c0@"
  en: "@aDebora@bAre you lost? Never mind. At least your life's on the right track since you chose to marry me.\n@c0@"
  es: "@aStefania@b¿Perdido? No importa. Al menos no perderás la vita, ya que elegiste casarte con me. ¡Ejem!\n@c0@"
  fr: "@aPandora@bTu es perduⓡ Tant pis. Au moins, dans la vie, tu as choisi la bonne voie en décidant de m'épouser.\n@c0@"
  it: "@aViola@bTi sei perso?\nNo che non ti sei perso, caro: fin quando resti accanto a me, sei sempre nel posto giusto...\n@c0@"
  ja: "@a@bデボラ「あんた　道に　迷ってる？\n\t大丈夫。　私を選んだ時点で\n\t人生の　間違いはないと思うから。\n@c0@"
70:
  de: "@aGriselda@bIch fand es eigentlich schon schlimm genug, dass Papa mich damals zu Hause ins oberste Stockwerk verfrachtet hatte.\n@c0@"
  en: "@aDebora@bI always thought Papa making me live on the top floor of the house was bad enough.\n@c0@"
  es: "@aStefania@bSempre creí que vivir en el último piso en casa de il mio papino era un fastidio.\n@c0@"
  fr: "@aPandora@bJe trouvais que le fait que papa me fasse vivre au dernier étage de la maison était déjà terrible.\n@c0@"
  it: "@aViola@bQuando vivevo a Mostroferrato, occupavo una stanza al piano superiore della casa, e salivo e scendevo le scale cento volte al giorno...\n@c0@"
  ja: "@a@bデボラ「お家の　階段を　３階まで\n\tのぼるのって　パパが　私に与えた\n\t人生の　苦行だと思ってたわ。\n@c0@"
71:
  de: "@aGriselda@bAber so lange, wie wir hier schon rumklettern, sind wir die Treppe zu meinem alten Zimmer sicher schon hundertmal hoch- und wieder runtergestiegen!\n@c0@"
  en: "@aDebora@bBut we've probably done the equivalent of the stairs up and down to my old room more than a hundred times here alone!\n@c0@"
  es: "@aStefania@b¡Ma aquí debo de haber subido y bajado más escaleras que en tutta la mia vita!\n@c0@"
  fr: "@aPandora@bMais rien qu'ici, j'ai déjà dû faire plus de cent fois l'équivalent de la montée et de la descente des marches qui menaient à mon ancienne chambreⓠ\n@c0@"
  it: "@aViola@bÈ per questo motivo che odio le scale.\nImmagina quindi quanto sono felice di essere in questo posto...\n@c0@"
  ja: "@a@bデボラ「もう……\n\t１００往復分くらいしたわね……。\n@c0@"
72:
  de: "@aGriselda@bGlaubst du, wir müssen wirklich in eines dieser Löcher springen? Aber mach langsam, ja? Wenn das überhaupt möglich ist.\n@c0@"
  en: "@aDebora@bDo you think we really have to jump down one of those holes? Go slowly, okay? If that's even possible.\n@c0@"
  es: "@aStefania@b¿De verdad crees que tenemos que saltar por uno de estos agujeros? Si es possibile, no vayas muy rápido, ¿eh?\n@c0@"
  fr: "@aPandora@bTu crois vraiment qu'on est obligés de sauter à travers ces trousⓡ Va doucement, d'accordⓡ Enfin, si c'est possible.\n@c0@"
  it: "@aViola@bDavvero dobbiamo saltare in uno di quei buchi?!\nMa mi si sgualcirà tutto il vestito!\nE poi rischio di spezzarmi un'unghia!\n@c0@"
  ja: "@a@bデボラ「……で　まさか　どこかの穴に\n\t飛びおりないと　いけないの？\n\tゆっくり　飛びおりてよね。　無理だけど。\n@c0@"
73:
  de: "@aGriselda@bNicht schlecht. Es war ziemlich schlau von dir, den Ort hier am Weg zu finden.\n@c0@"
  en: "@aDebora@bNot bad. It was quite clever of you to find this place along the way.\n@c0@"
  es: "@aStefania@bNon c'è male. No debes ser tan tonto si has sido capaz de encontrar un sitio así.\n@c0@"
  fr: "@aPandora@bPas mal. C'était plutôt intelligent de ta part de trouver cet endroit au passage.\n@c0@"
  it: "@aViola@bComplimenti, %a000090!\nBel colpo!\n@c0@"
  ja: "@a@bデボラ「あんた　元気ね。\n\t道をさがしている合間に\n\tこんな　場所を　見つけるなんて。\n@c0@"
74:
  de: "@aGriselda@bWir sind so hoch geklettert! Jetzt kommt mir meine Jammerei über die Stufen bis zu meinem alten Zimmer zu Hause albern vor.\n@c0@"
  en: "@aDebora@bWe've climbed so far. This puts my moaning about all the stairs up to my old room into perspective.\n@c0@"
  es: "@aStefania@bSonno stanca de tanto subir y bajar. Veramente, cuando me quejaba de las escaleras de mi casa, me faltaba perspectiva.\n@c0@"
  fr: "@aPandora@bOn est montés si haut. Ça relativise mes plaintes sur le nombre de marches à grimper pour rejoindre mon ancienne chambre.\n@c0@"
  it: "@aViola@bNon so nemmeno io quanti gradini ho salito...\n㈡\nLa prossima volta che mi lamenterò delle scale che facevo a casa mia a Mostroferrato, dammi una botta in testa. Però non spettinarmi, mi raccomando...\n@c0@"
  ja: "@a@bデボラ「もう　大分のぼったわよ。\n\t私の家の　１階から　３階まで\n\t２００往復分くらいしたと思うわ。\n@c0@"
75:
  de: "@aGriselda@bNa toll. Du hast uns an unseren Ausgangspunkt zurückgebracht.\n@c0@"
  en: "@aDebora@bWell done. You've gone and brought us back to the same place.\n@c0@"
  es: "@aStefania@bBene, bene... Nos has traído de vuelta al mismo sitio.\n@c0@"
  fr: "@aPandora@bBien joué. Tu nous as ramenés au même endroit.\n@c0@"
  it: "@aViola@bMa bravo!\nComplimenti per la scelta!\nSiamo esattamente dov'eravamo prima...\n@c0@"
  ja: "@a@bデボラ「上出来よ　あんた。\n\tどうやら　元の道に\n\t戻ることができたようね。\n@c0@"
76:
  de: "@aGriselda@bAber so schlimm ist das nun auch wieder nicht. Dir macht es einen Heidenspaß, dich all diese Löcher hinunterzustürzen, oder?\n@c0@"
  en: "@aDebora@bStill, I suppose it's not all bad. You quite enjoy flinging yourself down those holes, don't you?\n@c0@"
  es: "@aStefania@bEn fin, no está tan mal. Porque tú te lo pasas bien saltando por esos agujeros, ¿vero?\n@c0@"
  fr: "@aPandora@bEnfin, tout n'est pas si noir. Tu adores te jeter dans tous ces trous, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bScommetto che l'hai fatto apposta perché ti diverti a saltar giù da quei dannatissimi buchi!\n@c0@"
  ja: "@a@bデボラ「でも……　\n\tよく考えたら　最悪じゃない。\n\tまた　落とし穴に　落ちるわけ？\n@c0@"
77:
  de: "@aGriselda@bIch fühle mich wunderbar! Etwa so, als hätte ich gerade etwas Neues gelernt!\n@c0@"
  en: "@aDebora@bI feel all exhilarated. A bit like how you feel when you learn how to do something for the first time.\n@c0@"
  es: "@aStefania@bEsto es molto emocionante. Es parecido a cuando aprendes a hacer algo la prima volta.\n@c0@"
  fr: "@aPandora@bJe me sens tout euphorique. Un peu comme quand on apprend à faire quelque chose pour la première fois.\n@c0@"
  it: "@aViola@bOra va meglio...\nSì. Ora va decisamente meglio...\n@c0@"
  ja: "@a@bデボラ「なにか　すがすがしい気分ね。\n\t習い事の時間から　解放された時と\n\t同じくらい　すがすがしいわ。\n@c0@"
78:
  de: "@aGriselda@bAch, doch nicht noch mehr Höhlen! Diese ganze Höhlentrotterei reicht mir für mein ganzes Leben! Na ja, hoffentlich ist es nicht zu weit.\n@c0@"
  en: "@aDebora@bNot more caves! I've had enough spelunking to last me a lifetime. Still, hopefully it's not too far.\n@c0@"
  es: "@aStefania@b¡Basta de cuevas! Estoy harta de espeleología. Espero que no falte molto.\n@c0@"
  fr: "@aPandora@bStopⓠ Plus de grottesⓠ J'ai eu ma dose de spéléologie pour le restant de mes jours. Espérons que ce n'est plus très loin.\n@c0@"
  it: "@aViola@bCon tutte le caverne che stiamo esplorando, dovrebbero darmi la laurea ad honorem in speleologia!\nBah! Speriamo di uscirne vivi...\n@c0@"
  ja: "@a@bデボラ「また　洞くつ？\n\tもう　イヤになっちゃう。\n\tでも　出口には　近そうね。\n@c0@"
79:
  de: "@aGriselda@bKennst du diesen Sancho? Sicher ist er nett. Prinz Harry war doch auch so nett.\n@c0@"
  en: "@aDebora@bDo you know this Sancho man? I'm sure he'll be nice. Prince Harry was lovely too.\n@c0@"
  es: "@aStefania@b¿Conoces a ese Sancho? Sicuro que es un blandengue. El príncipe Froilán también era un blandengue.\n@c0@"
  fr: "@aPandora@bTu connais ce Sanchoⓡ Je suis certaine qu'il sera gentil. Le prince Harry lui aussi était adorable.\n@c0@"
  it: "@aViola@bCaro, il nome ⓕSanchoⓖ ti dice qualcosa?\nConosci qualcuno che si chiama così?\n@c0@"
