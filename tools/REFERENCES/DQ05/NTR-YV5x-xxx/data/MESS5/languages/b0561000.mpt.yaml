2:
  de: "@aSancho@bJetzt du musst aber gehen zu Sebastian. Deine Frau hat gesagt, es ist in Ordnung, no?\n@c0@"
  en: "@aSancho@bOkay, ees time to go to esee señor Albert now. Your wife esay ees okay, no?\n@c0@"
  es: "@aSancho@bÁndele, es hora de ir a ver al señor Agila. Si a tu doña le parece bien, claro.\n@c0@"
  fr: "@aSancho@bIl est t-temps d'aller voir le señor Albert, maintenant. Ta f-femme est d'accord, noⓡ\n@c0@"
  it: "@aSancho@bVai dal principe Alberto, chico.\nLa tua mujer está bien, no devi essere preoccupato por lei.\n@c0@"
  ja: "@a@bサンチョ「%a001230さまも\n\tああ　言っておられます。\n\tオジロンさまの所へ　行きましょう。\n@c0@"
3:
  de: "@aOtto@bOh! ⓞIch liebe dichⓟ! Diese Worte sind Musik in meinen Ohren. Ich wünschte, mir würde jemand mal so etwas sagen...\n@c0@"
  en: "@aTuppence@bOoh! ⓗI love youⓘ! Those words are like music to the ears. If only someone would play that tune for me...\n@c0@"
  es: "@aAlazar@b¡Oh! ¡ⓕTe quieroⓖ! Esas palabras son como música celestial. Si alguien tocara esa melodía para mí...\n@c0@"
  fr: "@aInnocent@bOohⓠ ⓥJe t'aimeⓦⓠ Ces mots sont comme une véritable musique pour mes oreilles. Si seulement quelqu'un pouvait me les susurrer...\n@c0@"
  it: "@aSimon@bⓕTi amo, Simonⓖ. Ah, quante fanciulle vorrebbero pronunciare queste magiche parole, guardandomi negli occhi e stringendo il mio corpo muscoloso!\n\n@c0@"
  ja: "@a@bピピン「愛してるよ　なんて\n\tアツアツですね。　いや～\n\t聞いてるほうが　テレちゃいますよ。\n@c0@"
4:
  de: "@aSancho@bIss weiß, %a001240 ist die legendäre Held, aber er ist immer noch eine kleine Muchacho. Das ist alles zu viel für ihn.\n@c0@"
  en: "@aSancho@bI know %a001240, he ees the legendary hero, but he ees estill a boy. Maybe he pushed heemself too hard.\n@c0@"
  es: "@aSancho@bPues nomás sé que %a001240 es el héroe legendario pero sigue siendo un chamaquito. Se le ha exigido demasiado.\n@c0@"
  fr: "@aSancho@bJ-Je sais que %a001240 est le héros légendaire, mais c'est encore oun p-petit niño. Peut-être qu'il en a f-fait un peu trop pour son âge.\n@c0@"
  it: "@aSancho@b%0%a001240 es l'Eroe Leggendario, ma es pur siempre un niño que vede la sua mamma por la primera vez después muchos años...\n@c0@"
  ja: "@a@bサンチョ「伝説の勇者とは　いっても\n\t%a001240さまは　まだ　子供。\n\tムリして　がんばっていたんでしょう。\n@c0@"
5:
  de: "@aSancho@bDu hast Señora %a001230 bestimmt viel zu erzählen, aber die Niños brauchen auch ein wenig Zeit mit ihr, eh, Chico?\n@c0@"
  en: "@aSancho@bYou must have muchos to esay to señora %a001230, but now you leave her alone weeth the children for esome time, okay?\n@c0@"
  es: "@aSancho@bSeguro que tiene mucho que platicar con la señora %a001230 pero, pues por qué no la deja sola con sus chamaquitos durante un tiempito, ¿ok?\n@c0@"
  fr: "@aSancho@bTu d-dois avoir mucho à dire à la señora %a001230, mais il f-faut que tu la laisses oun peu seule avec les enfants, de acuerdoⓡ\n@c0@"
  it: "@aSancho@bYo so que hai muchas cosas da dire alla señora %a001230, ma pienso que ahora dovresti lasciarla sola con %a001240 y %a001250...\n@c0@"
  ja: "@a@bサンチョ「%a000090王も　%a001230さまと\n\tつもる話も　あるでしょうが\n\tまず　ここは　母子だけに……。\n@c0@"
6:
  de: "@aOtto@bIch glaube, das ist das erste Mal, dass ich %a001240 weinen sehe.\n@c0@"
  en: "@aTuppence@bI do believe that's the first time I've ever seen %a001240 cry.\n@c0@"
  es: "@aAlazar@bCreo que es la primera vez que veo llorar a %a001240.\n@c0@"
  fr: "@aInnocent@bJe crois que je n'avais encore jamais vu %a001240 pleurer.\n@c0@"
