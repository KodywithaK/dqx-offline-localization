400:
  de: "@aGriselda@bKeine Sorge, %a001250. Ich bin ja bei dir.\n@c0@"
  en: "@aDebora@bDon't worry, %a001250.\nI'm right by your side.\n@c0@"
  es: "@aStefania@bNon ti preoccupare, %a001250.\nSonno aquí a tu lado.\n@c0@"
  fr: "@aPandora@bNe t'inquiète pas, %a001250.\nJe suis juste à côté de toi.\n@c0@"
  it: "@aViola@bResterò sempre accanto a te, %a001250.\nNon ci separeremo mai più, piccola mia.\n@c0@"
