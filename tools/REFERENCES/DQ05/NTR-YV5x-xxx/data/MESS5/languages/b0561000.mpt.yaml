  ja: "@a@bサンチョ「私は　なんとしても　パパス王の\n\tご遺志を　ついで　マーサさまを\n\t助けて　いただきたいと……。\n@c0@"
28:
  de: "@aSancho@bWenn du also wieder auf Reisen gehst, Chico... Dann wird dein alter Onkel Sancho diss begleiten, wo immer du auch hingehst.\n@c0@"
  en: "@aSancho@bSo eef you are going esomewhere now, your Uncle Sancho, he go weeth you.\r\nWherever eet ees.\n@c0@"
  es: "@aSancho@bAsí que, si piensas ir a algún lado, órale, tito Sancho te acompaña.\r\nSea donde sea.\n@c0@"
  fr: "@aSancho@bAlors si t-tu décides de p-partir maintenant,\ntonton Sancho te suivra. Où que t-tu ailles.\n@c0@"
  it: "@aSancho@bSi deciderai de andare da qualche partes, lo zio Sancho verrà contigo.\n¡Ovunques andrai, yo sarò al tuo fiancos!\n@c0@"
  ja: "@a@bサンチョ「そのためには\n\tこのサンチョ　どんな所にでも\n\tお供いたしますぞ！\n@c0@"
29:
  de: "@aOtto@bEs wäre sinnlos, einfach hierzubleiben, um Humburg zu beschützen.\n@c0@"
  en: "@aTuppence@bThere's no point in just staying here to\r\nprotect Gotha.\n@c0@"
  es: "@aAlazar@bNo hay necesidad de que nos quedemos aquí para proteger Pankraz.\n@c0@"
  fr: "@aInnocent@bÇa ne sert à rien de rester ici pour protéger Gotha.\n@c0@"
  it: "@aSimon@bRestar qui a proteggere Denim non ha senso...\n@c0@"
  ja: "@a@bピピン「グランバニアだけ　守っても\n\t仕方ないですよね？\n@c0@"
30:
  de: "@aOtto@bWenn es Euch gelingt, Königin Magda zu retten, könnt Ihr mit vereinten Kräften vielleicht sogar der ganzen Welt den Frieden bringen.\n@c0@"
  en: "@aTuppence@bIf you rescue Queen Mada and join forces with her, then you'll be able to bring true peace to the world.\n@c0@"
  es: "@aAlazar@bSi lográis rescatar a la reina Perséfone y unís vuestras fuerzas, podréis devolver la paz a este mundo.\n@c0@"
  fr: "@aInnocent@bSi vous sauvez la reine Magdalena et que vous unissez vos forces, vous pourrez ramener la paix dans notre monde.\n@c0@"
  it: "@aSimon@bCredo sarebbe preferibile salvare la regina Mada, unire le nostre forze alle sue ed eliminare una volta per tutte la minaccia dell'oscurità.\n@c0@"
  ja: "@a@bピピン「マーサさまを　助け出し\n\t共に　たたかってこそ\n\t真の平和が　おとずれると思います。\n@c0@"
31:
  de: "@a%0%a001240@bEs war Großmutter, die Mama wieder zurückverwandelt hat, nicht wahr? Dann sollten wir wirklich versuchen, sie zu retten!\n@c0@"
  en: "@a%0%a001240@bIt was Grandma who turned Mum back to normal\nfor us, right? Then we should definitely try to rescue her!\n@c0@"
  es: "@a%0%a001240@bFue la abuela quien devolvió a mamá a su forma normal, ¿verdad? ¡Entonces debemos intentar salvarla!\n@c0@"
  fr: "@a%0%a001240@bC'est grâce à grand-mère que maman a repris\nson apparence normale, nonⓡ Dans ce cas, il\nfaut vraiment qu'on essaie de la sauverⓠ\n@c0@"
  it: "@a%0%a001240@bÈ stata nonna Mada a far tornare in vita la mamma, non è così? Allora dobbiamo andare a salvarla!\nÈ il minimo che possiamo fare per lei...\n@c0@"
  ja: "@a@b%a001240「おばあちゃんは　お母さんを\n\t元に　もどしてくれたんだよ？\n\tぜったい　助けてあげなくちゃ！\n@c0@"
32:
  de: "@aBianca@bDer gute Bastl sorgt sich wirklich um die Leute von Humburg, nicht?\n@c0@"
  en: "@aBianca@bOld Bertie really cares about the people of\r\nGotha, eh?\n@c0@"
  es: "@aBianca@bEl viejo Agila se preocupa por los de Pankraz, ¿a que sí?\n@c0@"
  fr: "@aBianca@bAlbert s'inquiète vraiment pour les habitants de Gotha, heinⓡ \n@c0@"
  it: "@aBianca@bIl discorso del principe Alberto non fa una grinza...\n@c0@"
  ja: "@a@bビアンカ「オジロンさんは　本当に\n\tグランバニアの民のことを\n\t思っているのね。\n@c0@"
33:
  de: "@aBianca@bAber du würdest es nur bereuen, wenn du deinen Plan aufgibst und hier bleibst. Ich bin mir sicher, dass die Leute das verstehen.\n@c0@"
  en: "@aBianca@bBut you'd only regret it if you gave up on your\r\nplans and stayed here. I'm sure the people understand that.\n@c0@"
  es: "@aBianca@bPero seguro que lo lamentarás si cambias de planes y te quedas aquí. Seguro que la gente lo entenderá, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais tu le regretterais si tu renonçais à ta quête\r\net que tu restais ici. Je suis sûre que les gens comprendront.\n@c0@"
  it: "@aBianca@bMa so bene che non sarai mai in grado di rinunciare ai tuoi piani e restare qui al castello, dimenticandoti di tua madre.\n㈡\nSono certa che, se decidessi di partire, la gente di Denim capirebbe.\n@c0@"
  ja: "@a@bビアンカ「でも　行かずに　後悔するのは\n\tイヤだもの……。　国のみんなも\n\tきっと　わかってくれるわよ。\n@c0@"
34:
  de: "@aNera@bEs ist nicht schön, dass wir die Leute beschwindeln müssen, aber ich bin mir sicher, dass sie uns verstehen und vergeben werden.\n@c0@"
  en: "@aNera@bIt's not nice having to fib about our plans to leave, but I'm sure everyone will forgive us and see we had no choice.\n@c0@"
  es: "@aNera@bNo está bene mentir sobre nuestros planes de marcharnos, pero seguro que tutti nos perdonan y entienden que no hay otra opción.\n@c0@"
  fr: "@aNera@bCe n'est pas bien d'avoir à mentir sur ce qu'on va faire, mais je suis sûre que tout le monde nous pardonnera et comprendra qu'on n'avait pas le choix.\n@c0@"
  it: "@aNera@bSono sicura che, se deciderai di partire, avrai la comprensione di tutti. Capiranno che non hai altro modo per salvare tua madre.\n@c0@"
  ja: "@a@bフローラ「ウソをついて　出かけるのは\n\t心苦しいですけど……\n\tきっと　わかってくださいますわよね。\n@c0@"
35:
  de: "@aOtto@bDie Leute sind alle schrecklich nervös.\n@c0@"
  en: "@aTuppence@bEveryone seems rather jittery.\n@c0@"
  es: "@aAlazar@bTodo el mundo está bastante exaltado.\n@c0@"
  fr: "@aInnocent@bIls ont tous l'air un peu tendus.\n@c0@"
  it: "@aSimon@bMaestà, tutti temono che lei possa partire di nuovo...\n@c0@"
  ja: "@a@bピピン「みんな　不安なんですよね……。\n@c0@"
36:
  de: "@aBianca@bIch weiß, wenn die Leute so reden, kann man schon mal Zweifel bekommen. Aber wir müssen gehen.\n@c0@"
  en: "@aBianca@bIt can give you doubts about leavin' when folk say stuff like that, eh? But we have to go.\n@c0@"
  es: "@aBianca@bCuando la gente dice esas cosas, le entran a una dudas sobre lo de marcharse, ¿eh? Pero no nos queda otra.\n@c0@"
  fr: "@aBianca@bJe veux bien croire que tu hésites à partir quand les gens disent des choses comme ça, mais on doit y aller.\n@c0@"
  it: "@aBianca@bFa piacere ricevere tali dimostrazioni di stima e di affetto, eh? Quasi quasi mi verrebbe voglia di non partire, ma non abbiamo scelta...\n@c0@"
  ja: "@a@bビアンカ「あんなこと言われたら\n\t決心が　にぶっちゃうわね……。\n\tでも　私たちは　行かなくちゃ。\n@c0@"
37:
  de: "@aBianca@bDas stimmt. Auf dem Sterbebett hat Ludwig dich gebeten, deine Mutter zu retten.\n@c0@"
  en: "@aBianca@bThat's true. Pankraz asked you to save your mum when he was lyin' there on the brink of death.\n@c0@"
  es: "@aBianca@bEs cierto. Teudis te pidió que salvases a tu madre justo antes de morir, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai. Juste avant de mourir, Petros t'a demandé de sauver ta mère.\n@c0@"
  it: "@aBianca@bÈ vero.\nPrima di morire, Russel ti chiese di salvare tua madre.\n@c0@"
  ja: "@a@bビアンカ「そうよね。　お母さまを\n\t助けることは　お父さまの\n\tご遺志でも　あるのよね……。\n@c0@"
38:
  de: "@aBianca@bWas meinst du, %a000090? Findest du nicht, dass wir Sancho wieder mitnehmen sollten?\n@c0@"
  en: "@aBianca@bWhat d'you reckon, %a000090? Dun't you think we should take Sancho with us, as he's offerin' an' all?\n@c0@"
  es: "@aBianca@b¿Qué opinas, %a000090? ¿No crees que debemos llevarnos al Sancho, que encima se ha ofrecido y todo?\n@c0@"
  fr: "@aBianca@bQu'est-ce que tu en penses, %a000090ⓡ Tu ne crois pas qu'on devrait emmener Sancho avec nous, vu qu'il le proposeⓡ\n@c0@"
  it: "@aBianca@bChe ne dici, %a000090?\nNon faremmo bene ad accettare la generosa offerta di Sancho e a portarlo con noi?\n@c0@"
  ja: "@a@bビアンカ「……って　それより\n\tサンチョさんは　いっしょに\n\t行かなくてもいいの？　%a000090。\n@c0@"
39:
  de: "@aNera@bSancho wird immer so traurig, wenn er von Ludwig redet.\n@c0@"
  en: "@aNera@bSancho always gets a misty look in his eyes when he talks about Pankraz.\n@c0@"
  es: "@aNera@bA Sancho se le nubla ligeramente la vista cuando parla sobre Teudis.\n@c0@"
  fr: "@aNera@bSancho a toujours les yeux embués quand il parle de Petros.\n@c0@"
  it: "@aNera@bA Sancho vengono sempre le lacrime agli occhi quando parla di Russel...\n@c0@"
  ja: "@a@bフローラ「サンチョさん\n\tパパス王のこととなると\n\t目の色が　変わりますわ。\n@c0@"
40:
  de: "@aNera@bDie beiden müssen gute Freunde gewesen sein.\n@c0@"
  en: "@aNera@bThey must have been very close friends, the two\r\nof them.\n@c0@"
  es: "@aNera@bSeguro que eran buenos amici.\n@c0@"
  fr: "@aNera@bIls devaient être très amis.\n@c0@"
  it: "@aNera@bLui e tuo padre dovevano essere ottimi amici.\n@c0@"
  ja: "@a@bフローラ「パパス王と\n\tサンチョさんの関係って　きっと\n\tすばらしかったんでしょうね。\n@c0@"
41:
  de: "@a%0%a001240@bEs ist nicht Sanchos Art, sich anderen aufzudrängen, aber ich weiß, dass er dich wirklich gerne begleiten würde.\n@c0@"
  en: "@a%0%a001240@bSancho doesn't want to be too pushy, but I know he'd really like to join you if you'll have him.\n@c0@"
  es: "@a%0%a001240@bSancho no quiere insistir demasiado, pero sé que le encantaría venir con nosotros si se lo permitimos.\n@c0@"
  fr: "@a%0%a001240@bSancho ne veut pas s'imposer, mais je sais qu'il\nserait très content de se joindre à nous si tu le\nlui demandais.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non è una persona insistente, ma io so che sarebbe felicissimo se lo portassi con te.\n@c0@"
  ja: "@a@b%a001240「サンチョ　はっきりとは\n\t言わないけど　本当は　すごく\n\tいっしょに　行きたいんだと思うよ。\n@c0@"
42:
  de: "@a%0%a001250@bIch hoffe, dass wir Großmutter bald finden. Ich kann es kaum abwarten, Sancho wieder lächeln zu sehen.\n@c0@"
  en: "@a%0%a001250@bI hope we find Grandma soon. I can't wait to see Sancho look a bit more relaxed at last.\n@c0@"
  es: "@a%0%a001250@bEspero que encontremos a la abuela pronto. Estoy impaciente por que Sancho pueda tener un poco de paz.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'on trouvera grand-mère rapidement. J'aimerais bien que Sancho soit un peu plus détendu.\n@c0@"
  it: "@a%0%a001250@bSpero che presto troveremo la nonna, così lo zio Sancho potrà finalmente rilassarsi un po'... Quel poverino non si darà pace finché non la salveremo!\n@c0@"
  ja: "@a@b%a001250「はやく　おばあちゃんを\n\t助けて　サンチョが安心する顔\n\t見たいな……。\n@c0@"
43:
  de: "@aBianca@bDas haben wir euch zu verdanken, oder? Ihr wart wohl ganz schön beschäftigt, während ich als Statue die ganzen Jahre dumm rumgestanden habe.\n@c0@"
  en: "@aBianca@bYou lot are responsible for that, right? Sounds like you were pretty busy while I was just standin' there as a statue.\n@c0@"
  es: "@aBianca@bEso ha sido cosa vuestra, ¿verdad? Parece que habéis estado ocupados mientras yo estaba ahí, petrificada.\n@c0@"
  fr: "@aBianca@bC'est vous qui avez fait tout ça, n'est-ce pasⓡ\nOn dirait que vous n'avez pas chômé pendant que j'étais pétrifiée.\n@c0@"
  it: "@aBianca@bE scommetto che so chi è stato a far tornare in cielo Zenithia... Vi siete dati da fare mentre io facevo la ⓕbella statuinaⓖ, eh?\n@c0@"
  ja: "@a@bビアンカ「それって　%a000090たちが\n\tしたんでしょ？　私が　石像だった間も\n\t大かつやく　だったのね。\n@c0@"
44:
  de: "@aNera@bNun, das wissen wir ja längst. Aber wahrscheinlich warst du es, der das Schloss wieder in den Himmel hat aufsteigen lassen, nicht?\n@c0@"
  en: "@aNera@bWell, we already know about that, don't we?\r\nYou're the one who resurrected it, no doubt?\n@c0@"
  es: "@aNera@bVero, ya lo sabíamos, ¿verdad?\nVeramente, tú eres quien lo resucitó, ¿verdad?\n@c0@"
  fr: "@aNera@bOn sait déjà tout ça, n'est-ce pasⓡ Et c'est grâce à toi que Zénithia a repris sa place, je me trompeⓡ\n@c0@"
  it: "@aNera@bSono sicura che c'è il tuo zampino nel ritorno in cielo di Zenithia...\nDico bene, tesoro?\n@c0@"
  ja: "@a@bフローラ「おっしゃらなくても\n\tわかりますわ。　あなたが\n\t天空城を　復活させたんでしょう？\n@c0@"
45:
  de: "@a%0%a001240@bIch frage mich, wie er davon hier draußen erfahren hat. Gelehrte wie er scheinen immer alles zu wissen!\n@c0@"
  en: "@a%0%a001240@bI wonder how he found out about that all the\nway out here. Scholars like him always seem\nto know everything!\n@c0@"
  es: "@a%0%a001240@bMe pregunto cómo lograría enterarse estando aquí. ¡Parece que los eruditos siempre lo saben todo!\n@c0@"
  fr: "@a%0%a001240@bJe me demande bien comment la nouvelle est arrivée jusqu'ici. J'ai l'impression que les savants savent toujours toutⓠ\n@c0@"
  it: "@a%0%a001240@bLa notizia che il castello è tornato a volare si è diffusa rapidamente.\n㈡\nForse è stato lo stesso Drago Divino a comunicarla agli Zenithiani che vivono nel nostro mondo, ed essi l'avranno diffusa tra gli uomini...\n@c0@"
  ja: "@a@b%a001240「こんなところにいるのに\n\tよく知ってるよね。\n\t学者さんって　すごいなあ。\n@c0@"
46:
  de: "@a%0%a001250@bWas, glaubst du, würde er sagen, wenn wir ihn nach Zenithia mitnehmen und ihm alles zeigen würden? He he he!\n@c0@"
  en: "@a%0%a001250@bHow do you suppose he'd react if we took him there and showed him what it was like? He he he!\n@c0@"
  es: "@a%0%a001250@b¿Imaginas cómo reaccionaría si le mostráramos cómo era antes? ¡Ji, ji, ji!\n@c0@"
  fr: "@a%0%a001250@bÀ ton avis, qu'est-ce qu'il dirait si on l'emmenait\nlà-bas et qu'on lui faisait visiterⓡ Hé hé héⓠ\n@c0@"
  it: "@a%0%a001250@bChissà che faccia farebbe se gli dicessimo che siamo stati noi a far tornare in cielo il Castello di Zenithia...\n@c0@"
  ja: "@a@b%a001250「あの人　天空城に\n\tつれて行ったら　どんな顔するかな？\n\tくすくす…　楽しそう！\n@c0@"
47:
  de: "@aBianca@bIch frage mich, wann der Tag kommen wird, an dem du dich einfach auf deinen Thron setzen und König sein kannst...\n@c0@"
  en: "@aBianca@bI wonder when the day will finally come that you can just sit on your throne and enjoy bein' king, eh?\n@c0@"
  es: "@aBianca@bA ver cuándo llega el día de que te puedas sentar en el trono y vivir como un rey, ¿eh?\n@c0@"
  fr: "@aBianca@bJe me demande quand viendra le jour où tu pourras enfin t'asseoir sur le trône et simplement remplir ton rôle de roi.\n@c0@"
  it: "@aBianca@bPrima o poi arriverà il momento in cui potrai smettere di viaggiare e sederti sul trono di Denim per governare il tuo popolo...\n@c0@"
  ja: "@a@bビアンカ「%a000090が　ゆっくり\n\t玉座に落ち着けるのは\n\tいつの日に　なるかしらね。\n@c0@"
48:
  de: "@aBianca@bAber irgendwie bezweifle ich, dass es dir gefallen würde, den ganzen Tag immer nur untätig rumzuhocken.\n@c0@"
  en: "@aBianca@bI dunno, though. I'm not sure that just sittin'\r\nabout the place every day would really be\r\nyour cup of tea.\n@c0@"
  es: "@aBianca@bNo sé, ¿no? Igual estar todo el día sentado no sea lo que más te vaya.\n@c0@"
  fr: "@aBianca@bCeci dit, je ne suis pas sûre que ce soit forcément ton truc de rester assis au même endroit toute la journée.\n@c0@"
  it: "@aBianca@bBeh, sai una cosa?\nSono sicura che quel giorno ti inventerai una scusa per fare i bagagli e ripartire!\n㈡\nSei una persona troppo dinamica, tu.\nNon ti ci vedo proprio a star fermo in un posto per più di qualche ora! Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「でも　毎日\n\t座ってばかりの　%a000090なんて\n\tらしくないかもね。\n@c0@"
49:
  de: "@aNera@bEs muss schon ewig her sein, dass jemand auf diesem Thron gesessen hat. Er sieht ein wenig einsam aus.\n@c0@"
  en: "@aNera@bI should imagine it's been many a year since that throne's been sat on. It has something of a lonely\r\nair about it.\n@c0@"
  es: "@aNera@bMe imagino que ha pasado molto tempo desde que alguien ocupó el trono. Tiene aspecto de estar molto solo.\n@c0@"
  fr: "@aNera@bJ'imagine que ça fait des années que personne ne s'est assis sur ce trône. Il a quelque chose de mélancolique.\n@c0@"
  it: "@aNera@bOrmai sono molti anni che sul trono di Denim non siede più il legittimo sovrano.\nTroppi anni...\n㈡\nCredo che a questo punto converrebbe che il Regno si trasformasse in una democrazia, no?\nTanto il Re non c'è mai! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「あの玉座には　もう何年も\n\t誰も　座ってないかも知れませんわね。\n\t玉座が　少しさみしそうですわ……。\n@c0@"
50:
  de: "@a%0%a001240@bMama ist genauso, wie ich sie mir immer vorgestellt hatte!\n@c0@"
  en: "@a%0%a001240@bMum's just as I imagined she'd be!\n@c0@"
  es: "@a%0%a001240@b¡Mamá es tal y como la imaginaba!\n@c0@"
  fr: "@a%0%a001240@bMaman est comme je l'imaginaisⓠ\n@c0@"
  it: "@a%0%a001240@bLa mamma è proprio come me la immaginavo...\n@c0@"
  ja: "@a@b%a001240「お母さんは　ボクが\n\t思ってたとおりの人だったよ！\n@c0@"
51:
  de: "@a%0%a001240@bIch hätte nie gedacht, dass es so großartig ist, eine Mutter zu haben.\n@c0@"
  en: "@a%0%a001240@bI'd never realised until now how nice it is to have a mum around.\n@c0@"
  es: "@a%0%a001240@bHasta ahora no me había dado cuenta de lo bien que está tener una madre.\n@c0@"
  fr: "@a%0%a001240@bJe ne savais pas à quel point c'était bien d'avoir une maman.\n@c0@"
  it: "@a%0%a001240@bE ora che ce l'ho sempre vicina mi chiedo come ho fatto a stare senza di lei per tanti anni...\n@c0@"
  ja: "@a@b%a001240「今まで　知らなかったけど\n\tお母さんがいるって　こんなに\n\tうれしいことだったんだね。\n@c0@"
52:
  de: "@a%0%a001250@bMama ist wirklich nett. Sie weiß, was ich denke, noch bevor ich irgendwas sage. Es ist fantastisch, sie wiederzuhaben.\n@c0@"
  en: "@a%0%a001250@bMum's really nice, isn't she? She knows what I'm thinking even before I say anything. It's great to have her back.\n@c0@"
  es: "@a%0%a001250@bMamá es muy buena, ¿a que sí? Sabe lo que estoy pensando incluso antes de que diga nada. ¡Qué alegría que haya vuelto!\n@c0@"
  fr: "@a%0%a001250@bMaman est vraiment gentille. Elle sait ce que je pense avant même que je dise quoi que ce soit. C'est super qu'elle soit revenue.\n@c0@"
  it: "@a%0%a001250@bSai una cosa?\nSono troppo felice che la mamma è tornata con noi!\nÈ così buona, gentile, affettuosa...\n@c0@"
  ja: "@a@b%a001250「あのね　お母さんって\n\tやさしいの。　なにも言わなくても\n\t伝わってきて…　わたし　うれしい。\n@c0@"
53:
  de: "@aSancho@bWenn du zu lange in die Castillo bleibst, Chico, werden die Leute von Humburg sehr traurig sein, wenn du wieder weggehst.\n@c0@"
  en: "@aSancho@bEef you estay here een the castle too long, friend, all the people of Gotha, they are gonna be eso esad when you have to leave.\n@c0@"
  es: "@aSancho@bEste, pues si te quedas mucho en el castillo, chamaquito, la gente de Pankraz se pondrá bien triste cuando tengas que partir.\n@c0@"
  fr: "@aSancho@bSi t-tu restes trop longtemps au château, chico, tous les gens de G-Gotha, ils vont être tristes quand tu devras p-partir. \n@c0@"
  it: "@aSancho@b¿Chico, posso darte un consiglio?\nNo restare mucho tiempo aquí a Denim.\n㈡\nSi lo farai, los tuos sudditos se affezioneranno a ti ancora más, y se rattristeranno un saccos cuando dovrai rimetterte en viaggio...\n@c0@"
  ja: "@a@bサンチョ「あまり　城の人々の\n\t目については　みなを\n\tいたずらに　心配させるばかり。\n@c0@"
54:
  de: "@aSancho@bDu musst jetzt aufbressen, bevor sie siss an diss gewöhnt haben. Äh... Meine Majestät.\n@c0@"
  en: "@aSancho@bYou must leave now, before they are used to eseeing you here. Er...My Majesty.\n@c0@"
  es: "@aSancho@bÁndele, márchate ahorita, antes de que se acostumbren a verte por aquí. Esto... Majestad.\n@c0@"
  fr: "@aSancho@bT-Tu dois partir maintenant, avant qu'ils ne s'habituent à ta p-présence... Ma Majesté.\n@c0@"
  it: "@aSancho@bDevi partire muy rapido, chico.\nTe lo dico por el bien del Regno de Denim.\n@c0@"
  ja: "@a@bサンチョ「ここは　はやくに\n\t城を発つのが　正解かと思いますよ。\n\t%a000090王。\n@c0@"
55:
  de: "@aOtto@bNichts zu melden, Sir! ... Ups! Tut mir leid. Irgendwie dachte ich gerade, ich stünde Wache...\n@c0@"
  en: "@aTuppence@bNothing to report here, sir! ...Oops! Sorry.\r\nI was in patrol mode for some reason.\n@c0@"
  es: "@aAlazar@b¡Sin novedad, señor!... ¡Huy! Lo siento.\nPor algún motivo creía que estaba de guardia.\n@c0@"
  fr: "@aInnocent@bRien à signaler, Sireⓠ ... Oupsⓠ Désolé.\nJ'étais en mode patrouille.\n@c0@"
  it: "@aSimon@bNiente da segnalar...\nOh, è lei, Maestà! Vede? Sono tornato a svolgere le mie mansioni di guardia di palazzo!\n@c0@"
  ja: "@a@bピピン「異常なーし！\n\t……って　あわわ　すみません！\n\t見まわり中じゃ　ありませんでした！\n@c0@"
56:
  de: "@aBianca@bKomisch, immer wenn ich in diesem Raum bin, fühle ich mich rundum wohl.\n@c0@"
  en: "@aBianca@bIt's funny, but just bein' in this room again makes me feel all relaxed.\n@c0@"
  es: "@aBianca@bCaramba, solo con estar en esta sala me siento relajada.\n@c0@"
  fr: "@aBianca@bC'est marrant, depuis que j'ai remis les pieds dans cette pièce, je me sens toute détendue.\n@c0@"
  it: "@aBianca@bTornare in questa stanza suscita in me moltissimi ricordi...\n@c0@"
  ja: "@a@bビアンカ「うふふ。　ふしぎね。\n\tこの部屋にいるだけで　すごく\n\t気分が　落ち着くわ。\n@c0@"
57:
  de: "@aBianca@bEr birgt eine Menge Erinnerungen, gute wie schlechte. Wahrscheinlich hat er deshalb solch eine warme Atmosphäre.\n@c0@"
  en: "@aBianca@bThere are lots of memories here, good ones and bad. I reckon that's what makes the place feel so warm.\n@c0@"
  es: "@aBianca@bMe trae muchísimos recuerdos, buenos y malos. Por eso me siento bien en este sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai tellement de souvenirs ici, des bons et des mauvais. C'est sans doute pour ça que j'y éprouve ce sentiment particulier.\n@c0@"
  it: "@aBianca@bAlcuni sono belli, altri meno.\nSono pezzi della mia vita, memorie che porterò per sempre con me, tatuate sulla mia anima...\n@c0@"
  ja: "@a@bビアンカ「うれしい思い出も\n\t悲しい思い出も　この部屋には\n\tたくさん　つまってるからね。\n@c0@"
58:
  de: "@aNera@bHier haben die Kinder bestimmt eine Menge Zeit verbracht, als wir weg waren.\n@c0@"
  en: "@aNera@bThe children must've spent their days here during all that time we were away.\n@c0@"
  es: "@aNera@bSeguro que los bambini pasaron aquí sus días mientras estábamos lontano.\n@c0@"
  fr: "@aNera@bLes enfants ont dû passer tout leur temps ici pendant qu'on était pétrifiés.\n@c0@"
  it: "@aNera@bI nostri figli avranno sicuramente trascorso molto tempo in questa stanza, durante gli anni in cui siamo stati assenti...\n@c0@"
  ja: "@a@bフローラ「私たちが　いない間も\n\t子供たちは　ここで\n\t過ごしていたのよね。\n@c0@"
59:
  de: "@aNera@bDieser Raum steckt voller Erinnerungen ⓚⓛ Erinnerungen ohne uns...\n@c0@"
  en: "@aNera@bThe room's full of memories that we were never a part of.\n@c0@"
  es: "@aNera@bO sea, la sala está pliena di recuerdos, ¿sabes?, aunque no sean nuestros.\n@c0@"
  fr: "@aNera@bCette pièce est pleine de souvenirs dont nous sommes exclus.\n@c0@"
  it: "@aNera@bPer troppo tempo non abbiamo fatto parte della loro vita, se non come nomi senza corpo, quasi fossimo degli spettri...\n@c0@"
  ja: "@a@bフローラ「この部屋には\n\t私たちの　知らない思い出が\n\tいっぱい　あふれているのかしら。\n@c0@"
60:
  de: "@a%0%a001240@bKönnen wir nicht bald aufbrechen, Papa? Großmutter wartet doch!\n@c0@"
  en: "@a%0%a001240@bCan we hurry up and get going soon, please, Dad? Grandma's waiting!\n@c0@"
  es: "@a%0%a001240@bPapá, ¿podemos darnos prisa y marcharnos pronto? ¡Nos espera la abuela!\n@c0@"
  fr: "@a%0%a001240@bOn ne pourrait pas se dépêcher d'y aller, papaⓡ Grand-mère nous attendⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, quando partiamo?\nGuarda che la nonna ci sta aspettando!\n@c0@"
  ja: "@a@b%a001240「お父さん。\n\tはやく　出発しようよ！\n\tおばあちゃんを　助けなくちゃ！\n@c0@"
61:
  de: "@a%0%a001250@bWenn ich das nächste Mal nachts Angst habe, kann ich zu Mama gehen. Das ist schön!\n@c0@"
  en: "@a%0%a001250@bThe next time I get scared during the night, I can come and find Mum. How nice!\n@c0@"
  es: "@a%0%a001250@bSi tengo miedo por las noches, puedo venir y buscar a mamá. ¡Qué bien!\n@c0@"
  fr: "@a%0%a001250@bLa prochaine fois que je ferai un cauchemar,\nje pourrai aller trouver maman. C'est chouetteⓠ\n@c0@"
  it: "@a%0%a001250@bLa prossima volta che farò un brutto sogno, potrò andare a dormire nel letto di mamma come fanno tutti i bambini! Che bello!\n@c0@"
  ja: "@a@b%a001250「……今度　夜中に\n\tこわくなったら　お母さんのベッドに\n\tもぐりこんじゃお。　えへへ……。\n@c0@"
62:
  de: "@aSancho@bEs ist schön, Informationen zu haben, Chico, aber wir dürfen nisst zu lange warten, si?\n@c0@"
  en: "@aSancho@bEes good to find out the informations, friend,\r\nbut you can no estand around for too long now, okay?\n@c0@"
  es: "@aSancho@bEstá bueno obtener información, chamaco, pero ahorita no puedes entretenerte demasiado, ¿ok?\n@c0@"
  fr: "@aSancho@bC'est b-bien de chercher des informations, chico, mais on ne p-peut pas rester ici trop longtemps.\n@c0@"
  it: "@aSancho@bChico, es bueno que tu vai en giro por raccogliere informaciónes, ma recuerda que no puedes restare aquí troppo tiempo...\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\t情報集めも大切ですが　あまり\n\tのんびりは　できませんぞ。\n@c0@"
63:
  de: "@aOtto@bIch hätte mir nie träumen lassen, eines Tages die Gemächer des Königs zu sehen.\n@c0@"
  en: "@aTuppence@bI would never have imagined being able to enter the King's quarters in the past.\n@c0@"
  es: "@aAlazar@bNunca hubiera imaginado que entraría en las dependencias del Rey.\n@c0@"
  fr: "@aInnocent@bAutrefois, je n'aurais jamais imaginé que j'entrerais un jour dans les appartements du roi.\n@c0@"
  it: "@aSimon@bAvevo sempre sognato di essere ammesso negli alloggi privati del Re!\n@c0@"
  ja: "@a@bピピン「王のお部屋に　入れるなんて\n\tボクも　出世したなあ。\n@c0@"
64:
  de: "@aOtto@bNur den besten Soldaten ist es vorbehalten, die Gemächer zu bewachen, geschweige denn sie zu betreten!\n@c0@"
  en: "@aTuppence@bOnly the very best soldiers are even allowed to guard the place, let alone just wander on in!\n@c0@"
  es: "@aAlazar@b¡Solo a los mejores soldados se les permite proteger el lugar y no digamos poder entrar!\n@c0@"
  fr: "@aInnocent@bSeuls les meilleurs soldats sont autorisés à garder cet endroit... alors y entrerⓠ\n@c0@"
  it: "@aSimon@bSolo l'élite dell'esercito è chiamata a svolgere servizio di guardia alle stanze reali, ma io sono entrato addirittura nella camera del mio Sire!\n@c0@"
  ja: "@a@bピピン「ここは　見まわり兵士の中でも\n\t特にウデききの　カリスマ兵士しか\n\t入れない部屋なのにっ！\n@c0@"
65:
  de: "@aBianca@bEs ist schön, dass sich die Leute so für mich freuen.\n@c0@"
  en: "@aBianca@bIt's lovely to see how happy people are on\r\nmy account.\n@c0@"
  es: "@aBianca@bDa gusto ver a la gente contenta por mí, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est agréable de voir les gens heureux pour moi. \n@c0@"
  it: "@aBianca@bMi fa piacere vedere che la gente mi dimostra tanto affetto, amore mio.\n@c0@"
  ja: "@a@bビアンカ「そんなに\n\tよろこんでもらえるなんて\n\t私たちは　幸せ者ね。\n@c0@"
66:
  de: "@aNera@bOje. Die Leute sind so glücklich, dass wir wieder da sind, und schon machen wir uns erneut auf den Weg.\n@c0@"
  en: "@aNera@bOh dear. People are so happy we're back, and yet we're about to go off and leave them again.\n@c0@"
  es: "@aNera@b¡Oh, cielos! La gente veramente se alegra de vernos, ma estamos a punto de partire.\n@c0@"
  fr: "@aNera@bPar la Déesse. Les gens sont si heureux que nous soyons de retour et pourtant, nous allons bientôt\r\nles quitter à nouveau.\n@c0@"
  it: "@aNera@bOh, santa dea! Gli abitanti di Denim non fanno altro che dirci quanto sono felici che siamo tornati sani e salvi... e noi stiamo per ripartire!\n@c0@"
  ja: "@a@bフローラ「よろこんで下さっているのに\n\tまた　出かけてしまって\n\t申しわけないけど……\n@c0@"
67:
  de: "@aNera@bAber unsere nächste Rückkehr wird hoffentlich für immer sein.\n@c0@"
  en: "@aNera@bWe'll be sure to come back safely this time, though.\n@c0@"
  es: "@aNera@bMa prometo que esta vez volveremos a salvo.\n@c0@"
  fr: "@aNera@bMais cette fois, nous ferons en sorte de revenir plus tôt sains et saufs.\n@c0@"
  it: "@aNera@bTesoro, cerchiamo di non assentarci per troppo tempo. Anche se sappiamo fin troppo bene che la cosa non dipenderà solo da noi...\n@c0@"
  ja: "@a@bフローラ「でも　今度は　私たち\n\t必ず　無事に　もどりますわよね。\n@c0@"
68:
  de: "@a%0%a001240@bUnd das alles, weil wir uns so angestrengt haben, nicht? Wenn man etwas wirklich will, schafft man es auch.\n@c0@"
  en: "@a%0%a001240@bIt's all because we tried so hard, right? If you try hard, you can do anything.\n@c0@"
  es: "@a%0%a001240@bEs porque nos hemos esforzado mucho, ¿verdad? Si te esfuerzas, puedes conseguirlo todo.\n@c0@"
  fr: "@a%0%a001240@bC'est parce qu'on a fait de notre mieux, pas vraiⓡ Quand on se donne la peine, on peut réussir\nn'importe quoi.\n@c0@"
  it: "@a%0%a001240@bLa mamma è tornata a casa sana e salva perché abbiamo fatto del nostro meglio per riportarla qui.\nSiamo stati proprio bravi!\n@c0@"
  ja: "@a@b%a001240「ボクたちが\n\tがんばったからだよね？\n\tがんばれば　なんでも　できるんだ。\n@c0@"
69:
  de: "@aSancho@bSi, Chico. Du hast hart gearbeitet. Aber unsere Mission ist noch nisst erfüllt.\n@c0@"
  en: "@aSancho@bSí, friend. You have worked eso hard.\nBut our quest, ees no over yet.\n@c0@"
  es: "@aSancho@bSí, chamaco. Pues has hecho un tremendo esfuerzo.\nPero la aventura aún no terminó.\n@c0@"
  fr: "@aSancho@bSi, chico. Tu t'es d-donné de la peine... mais notre quête n'est p-pas encore terminée.\n@c0@"
  it: "@aSancho@bComprendo que te gusta ricevere complimentos, congratulaciones y manifestaciónes de affetto, ma no podemos ancoras reposare su los alloros...\n㈡\nLa nuestra missione no es finita, chico.\n@c0@"
  ja: "@a@bサンチョ「%a000090王　本当に\n\tよく　がんばられましたね。　でも\n\tまだ　旅は終わりでは　ないのです。\n@c0@"
70:
  de: "@aBianca@bOh, ist das nicht süß? Sie weint, als wären wir ihre eigene Familie ...\n@c0@"
  en: "@aBianca@bAah, en't that sweet? Fancy her cryin' like that as if it was her own family!\n@c0@"
  es: "@aBianca@bMira qué bonito. Y se pone a llorar como si fuera su propia familia.\n@c0@"
  fr: "@aBianca@bOoh, c'est tellement mignon. Elle pleure comme\ns'il s'agissait de sa propre familleⓠ\n@c0@"
  it: "@aBianca@bChe dolce, quella donna!\nPiange come se la famiglia riunita fosse la sua!\n@c0@"
  ja: "@a@bビアンカ「うれしいわ。\n\tまるで　わがことのように\n\t泣いてくれるなんて……。\n@c0@"
71:
  de: "@aBianca@bKeiner wird uns je wieder trennen, %a000090, so viel steht fest.\n@c0@"
  en: "@aBianca@bNo one's goin' to split us up again, that much is\r\nfor sure.\n@c0@"
  es: "@aBianca@bNadie nos volverá a separar, eso es seguro, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bUne chose est sûreⓢ plus personne ne pourra nous séparer.\n@c0@"
  it: "@aBianca@bO si è commossa, o ha affettato una tonnellata di cipolle...\n㈡\nEh eh eh!\nChe cattiva che sono!\n@c0@"
  ja: "@a@bビアンカ「でも　もう誰にも\n\t私たち家族を　引きはなすことなんて\n\tできないわよ。\n@c0@"
72:
  de: "@aNera@bWir müssen uns bei ihr bedanken, dass sie %a001240 und %a001250 aufgezogen hat. Wir stehen tief in ihrer Schuld.\n@c0@"
  en: "@aNera@bWe have her to thank for bringing up %a001240 and %a001250 for us. We really are indebted to her.\n@c0@"
  es: "@aNera@bVeramente, deberíamos agradecerle que haya criado a %a001240 y %a001250. Estamos en deuda con ella.\n@c0@"
  fr: "@aNera@bIl faut la remercier d'avoir élevé %a001240 et %a001250. Nous lui devons vraiment beaucoup.\n@c0@"
  it: "@aNera@bDobbiamo ringraziare quella santa donna per aver accudito %a001240 e %a001250 durante la nostra assenza. Le sarò eternamente grata.\n@c0@"
  ja: "@a@bフローラ「あの方が　%a001240や\n\t%a001250を　育ててくださったのね。\n\t本当に　お世話になりました……。\n@c0@"
73:
  de: "@a%0%a001240@bWenn ich sie so sehe, muss ich auch fast anfangen zu weinen.\n@c0@"
  en: "@a%0%a001240@bLooking at her all emotional like that makes me feel like crying again.\n@c0@"
  es: "@a%0%a001240@bVerla tan emocionada hace que me entren ganas de llorar.\n@c0@"
  fr: "@a%0%a001240@bÀ la voir aussi émue, ça me fait revenir les larmes aux yeux.\n@c0@"
  it: "@a%0%a001240@bPerché piange?\nDovrebbe essere contenta che siamo di nuovo tutti a casa, no?\n@c0@"
  ja: "@a@b%a001240「おばさんの顔　見てたら\n\tまた　泣いちゃいそうだよ……。\n@c0@"
74:
  de: "@a%0%a001250@b(Schnüf... Schnüff) Nein, ich bin nicht traurig. Und ich weine auch gar nicht, ehrlich!\n@c0@"
  en: "@a%0%a001250@b(sniff...sniff) No, I'm not sad. I'm not crying, honest!\n@c0@"
  es: "@a%0%a001250@b(snif... snif) No, no estoy triste. No estoy llorando, ¡de verdad!\n@c0@"
  fr: "@a%0%a001250@b(snif snif) Non, je ne suis pas triste. Je ne pleure pas. Promisⓠ\n@c0@"
  it: "@a%0%a001250@bSob! Sob!\nNo, non sto piangendo...\nSob! Davvero! Non sto piangendo! Sob!\n@c0@"
  ja: "@a@b%a001250「ぐすっ……ぐすっ。\n\tわたし　ちっとも　さみしくなんて\n\tなかったもん。　泣いてないもん。\n@c0@"
75:
  de: "@aBianca@b%0%a001250 ist noch so klein, wir dürfen nicht zulassen, dass ihr etwas geschieht.\n@c0@"
  en: "@aBianca@b%0%a001250's just a little girl, and we mustn't put her in any more danger than we have already.\n@c0@"
  es: "@aBianca@b%0%a001250 es solo una niña y no podemos ponerla en peligro.\n@c0@"
  fr: "@aBianca@b%0%a001250 n'est qu'une petite fille et on lui a déjà fait prendre assez de risques comme ça.\n@c0@"
  it: "@aBianca@b%0%a001250 è solo una bambina.\nHa già corso fin troppi rischi, per la sua età.\nNon possiamo metterla ancora in pericolo...\n@c0@"
  ja: "@a@bビアンカ「%a001250は　女の子だし\n\tこれ以上　危険な目には\n\tあわせられないわよね。\n@c0@"
76:
  de: "@aBianca@bTrotzdem ist es traurig, sich wieder von ihr zu trennen, selbst wenn es nur für eine Weile ist.\n@c0@"
  en: "@aBianca@bStill, it's sad to have to part with her again, even if it's just for a bit.\n@c0@"
  es: "@aBianca@bPero me da pena tener que volverme a separar de ella, aunque sea por un tiempo, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bEn même temps, c'est triste de devoir à nouveau nous séparer d'elle, même si ce n'est pas pour longtemps.\n@c0@"
  it: "@aBianca@bPerò mi spiacerebbe separarmi da lei proprio ora che ci siamo ritrovate! So che sarebbe solo per breve tempo, ma ne soffriremmo entrambe tantissimo.\n@c0@"
  ja: "@a@bビアンカ「でも　すこしの間とはいえ\n\t%a001250と　はなれて過ごすのは\n\tわたしも　さみしいわ。\n@c0@"
77:
  de: "@aNera@bNehmen wir %a001250 nicht mit, Liebling? Nein, wahrscheinlich wäre das auch zu viel für ein kleines Mädchen.\n@c0@"
  en: "@aNera@bAre we not taking %a001250 with us, darling? No, I suppose it would be too tough on a little girl.\n@c0@"
  es: "@aNera@b¿%0%a001250 no viene con nosotros, caro mio? Me imagino que será molto duro para ella.\n@c0@"
  fr: "@aNera@bNous n'emmenons pas %a001250 avec nous, mon chériⓡ Non, c'est vrai que ça risque d'être très dur pour une petite fille.\n@c0@"
  it: "@aNera@bCaro, hai intenzione di portare %a001250 con noi?\nDopotutto è ancora una bambina...\nNon dovremmo farle correre tanti rischi...\n@c0@"
  ja: "@a@bフローラ「あなた　%a001250を\n\tつれていかないの？\n\t……そうですわね　女の子ですものね。\n@c0@"
78:
  de: "@aNera@bEs ist nicht schön, sie hier zu lassen, aber wir können sie ja immer besuchen. Wir müssen stark sein und unsere Mission erfüllen.\n@c0@"
  en: "@aNera@bIt'll be sad to leave her, but we can always come back and visit. We just have to be strong and do what's needed of us.\n@c0@"
  es: "@aNera@bVa a ser muy triste dejarla pero, sempre podemos volver de visita. Hay que ser fuertes y hacer tutto lo que sea necesario.\n@c0@"
  fr: "@aNera@bÇa va être triste de la laisser, mais nous pourrons toujours revenir lui rendre visite. Nous allons seulement devoir être forts et faire notre devoir.\n@c0@"
  it: "@aNera@bSarà triste doverci separare da lei ancora una volta, ma penso sia giusto non farle correre altri rischi...\n@c0@"
  ja: "@a@bフローラ「私も　さみしいけど　ここに\n\t帰ってくれば　いつでも会えるもの。\n\t今は　がまんしますわ。\n@c0@"
79:
  de: "@a%0%a001240@bWir müssen %a001250 mitnehmen, Papa! Eine Familie gehört doch zusammen!\n@c0@"
  en: "@a%0%a001240@bWe have to take %a001250 with us, Dad!\nFamily should stick together!\n@c0@"
  es: "@a%0%a001240@b¡Papi, %a001250 tiene que venir con nosotros!\n¡La familia debe permanecer unida!\n@c0@"
  fr: "@a%0%a001240@bIl faut emmener %a001250 avec nous, papaⓠ\nUne famille ne doit jamais se séparerⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, %a001250 deve venire con noi!\nNon possiamo separarci proprio adesso che ci siamo riuniti!\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\t%a001250も　つれて行こうよ！\n\tせっかく　家族が　そろったんだから。\n@c0@"
80:
  de: "@aSancho@bEs ist nisst schön, %a001250 so traurig zu sehen.\n@c0@"
  en: "@aSancho@bEes eso hard to esee %a001250 look eso esad.\n@c0@"
  es: "@aSancho@bDa penita ver a %a001250 tan retetriste.\n@c0@"
  fr: "@aSancho@bC-C'est dur de voir %a001250 si t-triste.\n@c0@"
  it: "@aSancho@bChico, no immagini nemmenos quantos me despiace vedere la povera %a001250 tanto triste...\n@c0@"
