  en: "@aTuppence@bBut he's probably sleeping out here instead of his quarters so that he can be quick to notice if there's trouble afoot.\n@c0@"
  es: "@aAlazar@bPero debe de estar durmiendo aquí en lugar de en su cuarto, para enterarse enseguida en caso de que haya algún problema.\n@c0@"
  fr: "@aInnocent@bMais il dort sans doute à l'extérieur plutôt que dans ses quartiers pour pouvoir réagir au plus vite s'il se passe quelque chose d'anormal.\n@c0@"
  it: "@aSimon@bImmagino che abbia deciso di dormire qui, invece che nei suoi alloggiamenti, in modo da essere subito pronto in caso di bisogno.\n@c0@"
  ja: "@a@bピピン「仮眠室で寝ずに　ここで\n\t寝ているのは　外の変化に　いち早く\n\t気づくためかも知れませんね。\n@c0@"
237:
  de: "@aSancho@bEs gibt nisst mehr viele Leute in Humburg. Die Wachleute arbeiten einfach zu hart.\n@c0@"
  en: "@aSancho@bEes no eso many people here een Gotha these days.\nThe guards, they are working too hard.\n@c0@"
  es: "@aSancho@bPues ya no queda mucha gente en Pankraz.\r\nLos guardias trabajan demasiado.\n@c0@"
  fr: "@aSancho@bIl n'y a p-p-pas beaucoup de monde à Gotha, en ce moment. Les gardes sont obligés de travailler trop.\n@c0@"
  it: "@aSancho@bLos soldados de Denim estanno lavorando muy duramentes en esto periodo...\n@c0@"
  ja: "@a@bサンチョ「この国も　人が\n\t少なくなりましたから…　兵士たちも\n\t手いっぱいなんでしょうね。\n@c0@"
238:
  de: "@aBianca@bIch will ja nicht sagen, dass wir bei Anbruch der Dunkelheit gleich alles hinschmeißen sollten, aber wir müssen uns schon ein bisschen ausruhen.\n@c0@"
  en: "@aBianca@bI en't sayin' we should just drop everythin' the minute it gets dark, but we do need a bit of a rest.\n@c0@"
  es: "@aBianca@bA ver, que no digo que tengamos que dejarlo todo cuando se haga de noche, pero necesitamos descansar, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe ne dis pas qu'on doit tout laisser en plan à la minute où la nuit tombe, mais il est nécessaire\r\nde se reposer, parfois.\n@c0@"
  it: "@aBianca@bNon dico certo di interrompere qualsiasi cosa stiamo facendo al primo calar delle tenebre, ma non dimentichiamo che la notte è fatta per dormire.\n@c0@"
  ja: "@a@bビアンカ「夜だからって\n\tのんびりは　できないけど……\n\tあせっても　しかたないもんね。\n@c0@"
239:
  de: "@aBianca@bLass uns für heute Schluss machen, ja?\n@c0@"
  en: "@aBianca@bMaybe we should call it a day for today, eh?\n@c0@"
  es: "@aBianca@bCasi mejor que por hoy ya lo dejamos, ¿eh?\n@c0@"
  fr: "@aBianca@bOn pourrait peut-être s'en tenir là pour aujourd'hui, nonⓡ\n@c0@"
  it: "@aBianca@bChe ne dici di andare a nanna?\n@c0@"
  ja: "@a@bビアンカ「今夜はもう　休みましょうか。\n@c0@"
240:
  de: "@a%0%a001240@bKein Problem, ich bin nicht müde. Ich kann so lange wach bleiben, bis es Zeit wird, ins Bett zu gehen.\n@c0@"
  en: "@a%0%a001240@bIt's okay. I'm not sleepy, honest. I can stay awake until it's time to go to bed.\n@c0@"
  es: "@a%0%a001240@bEstá bien. En realidad no tengo sueño. Puedo estar despierto hasta que sea la hora de acostarme.\n@c0@"
  fr: "@a%0%a001240@bÇa va. Je ne suis pas fatigué, je t'assure. Je peux rester réveillé jusqu'à ce qu'il soit l'heure d'aller\nau lit.\n@c0@"
  it: "@a%0%a001240@bNon ho ancora sonno.\nSe c'è qualcosa da fare, sono pronto!\n@c0@"
  ja: "@a@b%a001240「うん…　大丈夫\n\tボク　まだ　眠くないよ。\n\tお部屋にもどるまで　起きてる……。\n@c0@"
241:
  de: "@a%0%a001250@bNachts hab ich immer Angst. Ich träume von den bösen Monstern, die Mama entführt haben.\n@c0@"
  en: "@a%0%a001250@bI get scared at night. I have dreams about the nasty creatures who kidnapped Mum.\n@c0@"
  es: "@a%0%a001250@bPor la noche me entra miedo. Sueño con las horribles criaturas que secuestraron a mamá.\n@c0@"
  fr: "@a%0%a001250@bJ'ai peur, la nuit. Je rêve des méchantes créatures qui ont enlevé maman.\n@c0@"
  it: "@a%0%a001250@bA volte di notte mi vengono degli incubi tremendi...\nSogno gli esseri malvagi che rapirono la mamma...\n@c0@"
  ja: "@a@b%a001250「夜になるの　こわいの。\n\tお母さんをさらった人が\n\t夢に　出てくるの……。\n@c0@"
242:
  de: "@aSancho@bIst es noch nisst genug für heute, no? Iss finde, es ist Zeit für eine Siesta.\n@c0@"
  en: "@aSancho@bEes enough for one day, no?\nEes time for siesta maybe, My Majesty?\n@c0@"
  es: "@aSancho@bPues, ya estuvo bien por hoy...\n¿Echamos un sueñecito, Majestad?\n@c0@"
  fr: "@aSancho@bÇa s-suffit pour aujourd'hui, noⓡ Ce ne serait\np-pas l'heure de la siesta, Ma Majestéⓡ\n@c0@"
  it: "@aSancho@b¿Chico, no credi que abbiamo fatto abbastanzas cosas por oggi?\n¿Que ne diresti de una buena siesta?\n@c0@"
  ja: "@a@bサンチョ「さあさ　%a000090王！\n\t今日は　このぐらいにして\n\tもうお休みください。\n@c0@"
243:
  de: "@aSancho@bSi, si. Und außerdem es ist gefährliss, nachts herumzuwandern.\n@c0@"
  en: "@aSancho@bSí, sí. And ees dangerous to walk around at night.\n@c0@"
  es: "@aSancho@bSí, sí. Es bien peligroso caminar de noche.\n@c0@"
  fr: "@aSancho@bSi, si. Et c'est d-dangereux de se promener la noche.\n@c0@"
  it: "@aSancho@b¡Y poi es pericoloso andare en giro de noche, eh!\n@c0@"
  ja: "@a@bサンチョ「夜　出歩くのは\n\t危ないですからねっ。\n@c0@"
244:
  de: "@aOtto@bAaah, ich bin ziemlich erschöpft. Wie schafft Ihr es nur, wach zu bleiben, %a000090?\n@c0@"
  en: "@aTuppence@bAaah, I'm rather tired now. How are you bearing up, %a000090?\n@c0@"
  es: "@aAlazar@bAaah, estoy un poco cansado. ¿Cómo lo lleváis, %a000090?\n@c0@"
  fr: "@aInnocent@bAaah, je suis un peu fatigué. Comment faites-vous pour tenir le coup, %a000090ⓡ\n@c0@"
  it: "@aSimon@bAh, sono esausto!\nLei come sta, Maestà? Non mi dirà mica che è ancora fresco come una rosa, vero?\n@c0@"
  ja: "@a@bピピン「ふぅ～っ。\n\t今日は　つかれましたね。\n\t%a000090さま　大丈夫ですか？\n@c0@"
245:
  de: "@aSancho@bVielleisst arbeiten die Wachmänner ja zu viel, no? Sie haben gar keine Zeit für eine Siesta.\n@c0@"
  en: "@aSancho@bMaybe the guards, they are working too much, no? They no have the time for enough siesta.\n@c0@"
  es: "@aSancho@bPues igual los guardias trabajan demasiado, ¿no? No tienen tiempo para la siesta.\n@c0@"
  fr: "@aSancho@bPeut-être que les g-g-gardes travaillent trop, noⓡ Ils n'ont pas assez de temps pour la siesta.\n@c0@"
  it: "@aSancho@b¿Chico, no piensi que las guardias estanno lavorando troppos? No hanno nemmenos el tiempo por fare una siesta como se deve...\n@c0@"
  ja: "@a@bサンチョ「兵士たちにも　少し\n\tムリを　させてしまっていますね。\n\t今の人数では　仮眠もままなりません。\n@c0@"
246:
  de: "@a%0%a001250@bDer Soldat ist wirklich müde, trotzdem ist er immer noch wach, um Humburg zu beschützen. Das ist echt nett von ihm.\n@c0@"
  en: "@a%0%a001250@bThat soldier's really sleepy, but he's still working hard to guard the people of Gotha. What a good man!\n@c0@"
  es: "@a%0%a001250@bEse soldado está muerto de sueño, pero sigue trabajando duro para proteger a la gente de Pankraz. ¡Qué buen hombre!\n@c0@"
  fr: "@a%0%a001250@bCe soldat a vraiment sommeil, mais il continue à travailler dur pour protéger les habitants de Gotha. C'est un brave hommeⓠ\n@c0@"
  it: "@a%0%a001250@bChe bravo quel soldato!\nÈ stanco morto, ma non smette di fare la guardia, pur di proteggere la gente di Denim!\n@c0@"
  ja: "@a@b%a001250「あの兵士さん　眠いのに\n\t国のみんなのために　見はりしてくれて\n\tいるんでしょ？　えらいよね。\n@c0@"
247:
  de: "@aOtto@bUnsere Reisen durch die Weltgeschichte mögen anstrengend sein, doch die Soldaten hier in der Burg haben es noch viel schwerer.\n@c0@"
  en: "@aTuppence@bIt may be arduous for me sometimes during our travels together, but it's hard work for the soldiers left behind at the castle too.\n@c0@"
  es: "@aAlazar@bCuando viajo con vos, a veces el trabajo es duro, pero también lo es para los soldados que se quedan en el castillo.\n@c0@"
  fr: "@aInnocent@bIl y a parfois des moments difficiles pendant nos voyages, mais le travail des gardes restés au château n'est pas de tout repos non plus.\n@c0@"
  it: "@aSimon@bI soldati del castello stanno lavorando al limite delle loro possibilità.\n@c0@"
  ja: "@a@bピピン「%a000090さまとの旅も\n\t大変だけど　城に残っている兵士たちも\n\t大変なんですよね。\n@c0@"
248:
  de: "@aOtto@bIch werd' mein Möglichstes tun, um meinen Teil beizutragen!\n@c0@"
  en: "@aTuppence@bI must try my absolute hardest to do my bit!\n@c0@"
  es: "@aAlazar@b¡Debo poner todo mi empeño para aportar mi granito de arena!\n@c0@"
  fr: "@aInnocent@bJe dois vraiment faire tout mon possible pour accomplir ma part du travailⓠ\n@c0@"
  it: "@aSimon@bAnch'io ce la metterò tutta per difendere Denim e il mondo intero dall'oscura minaccia che incombe su tutti noi!\n@c0@"
  ja: "@a@bピピン「ボク　がんばらなくっちゃ……！\n@c0@"
249:
  de: "@a%0%a001240@bIgitt! Hast du das gesehen, Papa? Der Mann da sabbert!\n@c0@"
  en: "@a%0%a001240@bUrgh! Did you see that, Dad?\nThat man was dribbling!\n@c0@"
  es: "@a%0%a001240@b¡Argh! ¿Has visto eso, papi?\n¡Ese hombre estaba babeando!\n@c0@"
  fr: "@a%0%a001240@bBeurkⓠ T'as vu ça, papaⓡ Ce monsieur, il bavaitⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, a quel soldato cola il naso!\nNon abbiamo un fazzoletto da prestargli?\n@c0@"
  ja: "@a@b%a001240「お父さん　見た！？\n\t今の人　クチからヨダレが出てたよ！\n\tおっかしいのー。\n@c0@"
250:
  de: "@a%0%a001240@bIch bin wirklich müde, Papa.\n@c0@"
  en: "@a%0%a001240@bI'm really sleepy, Dad.\n@c0@"
  es: "@a%0%a001240@bTengo mucho sueño, papá.\n@c0@"
  fr: "@a%0%a001240@bJ'ai vraiment sommeil, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, sono stanco...\n@c0@"
  ja: "@a@b%a001240「お父さん　ボクもう\n\t眠いよう……。\n@c0@"
251:
  de: "@a%0%a001250@bMir ist es egal, wo wir die Nacht verbringen, Papa. Hauptsache, wir können bald irgendwo schlafen.\n@c0@"
  en: "@a%0%a001250@bI don't care where we stay, Dad. Just as long as\nI can get some sleep soon.\n@c0@"
  es: "@a%0%a001250@bNo me importa dónde nos quedemos, papi, mientras pueda dormir un poco pronto.\n@c0@"
  fr: "@a%0%a001250@bPeu importe où on dort, papa, du moment qu'on peut aller se coucher bientôt.\n@c0@"
  it: "@a%0%a001250@bPapà, sto morendo di sonno...\nNon potremmo fermarci da qualche parte?\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tどこでもいいから　もう　ねようよ。\n@c0@"
252:
  de: "@aOtto@bMacht es Euch bequem, Eure Majestät.\n@c0@"
  en: "@aTuppence@bDo make yourself at home if you wish, Your Majesty.\n@c0@"
  es: "@aAlazar@bAcomodaos como si fuese vuestro propio hogar, Majestad.\n@c0@"
  fr: "@aInnocent@bFaites comme chez vous si cela vous tente, Majesté.\n@c0@"
  it: "@aSimon@bMaestà, decida lei quando sarà il momento di riposare.\r Se preferisce proseguire, non sarò certo io a chiederle di fermarsi.\n@c0@"
  ja: "@a@bピピン「どうぞ　%a000090さま。\n\tごえんりょなさらずに　ぜひ\n\t泊まっていってください。\n@c0@"
253:
  de: "@a%0%a001250@bDer Hund sagt, dass ich Großmutter Magda sehr ähnlich sehe.\n@c0@"
  en: "@a%0%a001250@bThat dog says I look a lot like Grandma Mada.\n@c0@"
  es: "@a%0%a001250@bEse perro dice que me parezco mucho a la abuela Perséfone.\n@c0@"
  fr: "@a%0%a001250@bCe chien a dit que je ressemble beaucoup à grand-mère Magda.\n@c0@"
  it: "@a%0%a001250@bIl cane ha detto che somiglio tanto a nonna Mada.\n@c0@"
  ja: "@a@b%a001250「あの犬さんね　わたしが\n\tマーサおばあちゃんに　にてるって\n\tいってくれたの。\n@c0@"
254:
  de: "@a%0%a001250@bMeinst du, er ist schon lange genug hier in der Burg, um das zu wissen?\n@c0@"
  en: "@a%0%a001250@bDo you think he's been living here in the castle long enough to know?\n@c0@"
  es: "@a%0%a001250@b¿Crees que lleva tanto tiempo viviendo en el castillo como para saberlo?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il a vraiment vécu assez longtemps au château pour le savoirⓡ\n@c0@"
  it: "@a%0%a001250@bCome fa a conoscere il volto di tua madre?\nCredi che l'abbia conosciuta?\n@c0@"
  ja: "@a@b%a001250「あの犬さんは　そんなに\n\t昔から　このお城にいるのね。\n@c0@"
255:
  de: "@a%0%a001240@bSieht ganz so aus, als schlafen alle. Wir sollten besser leise sein, sonst wecken wir noch jemanden auf.\n@c0@"
  en: "@a%0%a001240@bLooks like everyone's asleep. We'd better keep quiet. We wouldn't want to wake people up.\n@c0@"
  es: "@a%0%a001240@bParece que todos están durmiendo. Vayamos con cuidado de no despertar a nadie.\n@c0@"
  fr: "@a%0%a001240@bTout le monde dort, on dirait. On ne doit pas faire de bruit si on ne veut pas réveiller les gens.\n@c0@"
  it: "@a%0%a001240@bDormono tutti...\nFacciamo piano, non vorrei svegliare qualcuno...\n@c0@"
  ja: "@a@b%a001240「……みんな　ねてるみたい。\n\tしずかに　歩こうね。\n\t起こしたら　かわいそうだもん。\n@c0@"
256:
  de: "@aOtto@bAh! Das Ende eines weiteren arbeitsreichen Tages!\n@c0@"
  en: "@aTuppence@bAah! The end of another good day's work!\n@c0@"
  es: "@aAlazar@b¡Aaah! ¡Otro duro día de trabajo que termina!\n@c0@"
  fr: "@aInnocent@bAahⓠ Une nouvelle journée de travail qui s'achève.\n@c0@"
  it: "@aSimon@bAnche questa giornata è finita...\n@c0@"
  ja: "@a@bピピン「いやーっ　今日も\n\t充実した　いち日でしたね！\n\tいい汗かいたなあ。\n@c0@"
257:
  de: "@a%0%a001250@bNachts habe ich immer ein wenig Angst in der Burg. Es heißt, dass Mama nachts entführt wurde.\n@c0@"
  en: "@a%0%a001250@bThe castle's a bit scary of a night. People say it was night-time when Mum was kidnapped.\n@c0@"
  es: "@a%0%a001250@bEl castillo da un poco de miedo por la noche. Dicen que a mamá la secuestraron por la noche.\n@c0@"
  fr: "@a%0%a001250@bLe château fait un peu peur, la nuit. Les gens disent que c'est pendant la nuit que maman a été enlevée.\n@c0@"
  it: "@a%0%a001250@bQuand'è buio, il castello mi mette paura.\nHo sentito dire che la mamma fu rapita di notte...\n@c0@"
  ja: "@a@b%a001250「夜のお城って　少し　こわい。\n\tお母さんが　さらわれたのも\n\t夜だって　聞いたし……。\n@c0@"
258:
  de: "@aBianca@bKeine Sorge, %a001250. Ich verspreche dir, dass ich euch nie wieder verlassen werde.\n@c0@"
  en: "@aBianca@bDun't worry, %a001250.\nI promise I en't goin' to leave you again.\n@c0@"
  es: "@aBianca@bNo te preocupes, %a001250.\nTe prometo que nunca te abandonaré.\n@c0@"
  fr: "@aBianca@bNe t'inquiète pas, %a001250.\nJe te promets que je ne vous laisserai plus.\n@c0@"
  it: "@aBianca@bNon preoccuparti, %a001250.\nTi prometto che non ti abbandonerò mai più.\n@c0@"
  ja: "@a@bビアンカ「大丈夫よ　%a001250。\n\tこれからは　お母さんが\n\tずっと　そばに　いるからね。\n@c0@"
259:
  de: "@aBianca@bEs ist so still hier... Kaum zu glauben, dass tagsüber noch so viel los war.\n@c0@"
  en: "@aBianca@bIt's ever so quiet, eh? Hard to believe it was so bustlin' durin' the day.\n@c0@"
  es: "@aBianca@bPues está todo muy tranquilo, ¿no? Parece increíble que durante el día haya tanto jaleo.\n@c0@"
  fr: "@aBianca@bLe château est tellement calme, heinⓡ On a du mal\nà croire qu'il est aussi animé pendant la journée.\n@c0@"
  it: "@aBianca@bChe calma c'è adesso...\nDi giorno, invece, questo posto è pieno di gente indaffarata.\n@c0@"
  ja: "@a@bビアンカ「すごく静かね。\n\t昼間の活気が　なんだか\n\tウソみたい。\n@c0@"
260:
  de: "@aNera@bMir kommt es vor, als würden meine Füße einen fürchterlichen Krach machen. Wir müssen versuchen, leise zu gehen...\n@c0@"
  en: "@aNera@bI feel like my footsteps are making a terrible noise. We must try to walk about the place quietly.\n@c0@"
  es: "@aNera@bAy, parece que mis pisadas hacen molto ruido. Hay que intentar andar con più sigilo.\n@c0@"
  fr: "@aNera@bJ'ai l'impression de faire un vacarme épouvantable en marchant. Il faut essayer de se déplacer aussi discrètement que possible.\n@c0@"
  it: "@aNera@bC'è talmente tanto silenzio che sento persino il battito del mio cuore...\n@c0@"
  ja: "@a@bフローラ「なんだか　足音が\n\tひびくような　気がしますわ。\n\t静かに　気をつけて歩きましょうね。\n@c0@"
261:
  de: "@a%0%a001250@bDer alte Mann scheint irgendwie immer zu schlafen, selbst tagsüber.\n@c0@"
  en: "@a%0%a001250@bThat old man always seems to be asleep, even during the day.\n@c0@"
  es: "@a%0%a001250@bEse anciano siempre parece estar dormido, hasta de día.\n@c0@"
  fr: "@a%0%a001250@bCe vieux monsieur a toujours l'air de dormir,\nmême en journée.\n@c0@"
  it: "@a%0%a001250@bMa quell'uomo dorme anche di giorno?\n@c0@"
  ja: "@a@b%a001250「あのおじいさん\n\t昼も夜も　寝たきりなの。\n@c0@"
262:
  de: "@a%0%a001250@bWenn wir zurück sind und wieder Frieden herrscht, wäre es doch nett, mal einen Ausflug mit ihm zu machen.\n@c0@"
  en: "@a%0%a001250@bWhen we've finished travelling and\neverywhere's peaceful again, it'd be\nnice to take him out somewhere.\n@c0@"
  es: "@a%0%a001250@bCuando acabemos de viajar y la paz haya vuelto a todas partes, estaría bien llevarlo de excursión a algún lado.\n@c0@"
  fr: "@a%0%a001250@bQuand nous aurons terminé notre voyage et que ce sera de nouveau la paix, ce serait bien de l'emmener quelque part, pour le sortir.\n@c0@"
  it: "@a%0%a001250@bBuon per lui che ci riesce!\n@c0@"
  ja: "@a@b%a001250「この旅が終わって\n\t平和になったら　いっしょに\n\tお外に　つれていってあげたいな。\n@c0@"
263:
  de: "@aBianca@bWarum sagt der so was, wenn ich direkt daneben stehe?!\n@c0@"
  en: "@aBianca@bFancy sayin' all that when I'm standin' right here!\n@c0@"
  es: "@aBianca@b¡Pero mira que soltar eso conmigo delante!\n@c0@"
  fr: "@aBianca@bQuel toupet de dire ça alors que je suis làⓠ\n@c0@"
  it: "@aBianca@bHah! Hai notato che faccia ha fatto quando mi ha vista?! Avrebbe voluto scappare a nascondersi sottoterra, quel bellimbusto da due soldi!\n@c0@"
  ja: "@a@bビアンカ「もうーっ！\n\t本人を前にして　正直な人ね！\n@c0@"
264:
  de: "@aNera@bNa, der weiß ja, wie man einer Frau Komplimente macht! Du hast dich in all den Jahren aber auch nicht verändert, Liebling!\n@c0@"
  en: "@aNera@bWell, he certainly knows how to flatter a woman! Mind you, I suppose you haven't changed a bit\r\nsince all those years ago, either.\n@c0@"
  es: "@aNera@b¡Sin duda sabe cómo adular a una donna! Imagino que tú tampoco habrás cambiado molto en tutti estos anni.\n@c0@"
  fr: "@aNera@bIl sait s'y prendre avec les damesⓠ Remarque, toi non plus, tu n'as pas dû beaucoup changer depuis toutes ces années.\n@c0@"
  it: "@aNera@bⓕCorpicino perfettamente proporzionatoⓖ?\nOh, che bel complimento!\nSpero proprio che tu la pensi come lui, caro... Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「あの方　おせじが上手ですわ。\n\tでも　あなたも　あの頃と\n\t変わりませんのね。\n@c0@"
265:
  de: "@aOtto@bIch muss zugeben, dass ich ein wenig eifersüchtig bin. Es muss wunderbar sein, eine Frau zu haben, die immer noch so jung und schön ist!\n@c0@"
  en: "@aTuppence@bI must admit that I'm rather jealous. How wonderful it must be to have a wife who stays so young and beautiful!\n@c0@"
  es: "@aAlazar@bDebo admitir que me siento un tanto celoso. ¡Debe de ser maravilloso tener una mujer que se conserve tan joven y hermosa!\n@c0@"
  fr: "@aInnocent@bJe dois admettre que je suis un peu jaloux. Ce doit être merveilleux d'avoir une femme qui reste si jeune et si belleⓠ\n@c0@"
  it: "@aSimon@bMaestà, anch'io voglio al mio fianco una donna giovane e bella!\n㈡\nAhem... Senta, Sire, non è che per caso potrebbe chiedere alla regina %a001230 di presentarmi qualche amica, eh?\n@c0@"
  ja: "@a@bピピン「まったく　いつまでも\n\t若く美しい　奥さまをお持ちとは\n\tうらやましいかぎりですよ！\n@c0@"
266:
  de: "@a%0%a001240@bDieser Mann hat früher ganz schrecklich gesungen, doch dann hat er geübt und ist viel besser geworden. Alles ist möglich!\n@c0@"
  en: "@a%0%a001240@bThat man used to be rubbish at singing, but then he practised and got a lot better. Anything's possible!\n@c0@"
  es: "@a%0%a001240@bEse hombre solía cantar como una rana, pero a base de practicar ha mejorado mucho. ¡Todo es posible!\n@c0@"
  fr: "@a%0%a001240@bCe type était vraiment un très mauvais chanteur, mais il s'est entraîné et s'est beaucoup amélioré.\nTout est possibleⓠ\n@c0@"
  it: "@a%0%a001240@bRicordo che quel tipo era incredibilmente stonato, poi ha preso lezioni di canto, e la sua voce è diventata dolce come quella di un usignolo.\n@c0@"
  ja: "@a@b%a001240「あのおじさん　昔は\n\t歌が　ヘタだったんだって。　練習して\n\tうまくなったんだよ。　すごいね！\n@c0@"
267:
  de: "@aOtto@bMein Zuhause ist net weit von hier. Der Gesang dieses Mannes hat mich früher immer in den Schlaf g'wiegt.\n@c0@"
  en: "@aTuppence@bMy home's not too far away from here, so that man's songs were like lullabies to me in my younger years.\n@c0@"
  es: "@aAlazar@bMi casa no está lejos, así que las canciones de ese hombre eran como una nana para mí cuando era niño.\n@c0@"
  fr: "@aInnocent@bJe n'habite pas très loin d'ici, alors les chansons\r\nde cet homme me servaient de berceuses quand\r\nj'étais plus jeune.\n@c0@"
  it: "@aSimon@bLe canzoni di quell'uomo hanno accompagnato la mia infanzia.\n@c0@"
  ja: "@a@bピピン「家が近かったこともあって\n\tあの方の歌声は　毎晩\n\tボクの子守歌に　なっていました。\n@c0@"
268:
  de: "@aOtto@bManchmal hab ich ihn allerdings auch schreien hören, wenn er g'schlafen hat...\n@c0@"
  en: "@aTuppence@bI sometimes heard him cry out in his sleep too,\r\nmind you!\n@c0@"
  es: "@aAlazar@b¡A veces hasta le oía vociferar en sueños!\n@c0@"
  fr: "@aInnocent@bIl m'est même arrivé de l'entendre crier dans son sommeil, vous vous rendez compteⓠ\n@c0@"
  it: "@aSimon@bQuando iniziò la sua attività di poeta e cantante, era più stonato di una campana incrinata, però con il tempo è migliorato...\n@c0@"
  ja: "@a@bピピン「たまに　うなされたことも\n\tありましたが……。\n@c0@"
269:
  de: "@a%0%a001240@bKeine Sorge, ich werde erst einschlafen, wenn ich im Bett liege.\n@c0@"
  en: "@a%0%a001240@bDon't worry, I won't fall asleep before I get to bed.\n@c0@"
  es: "@a%0%a001240@bNo te preocupes, no me dormiré antes de llegar a la cama.\n@c0@"
  fr: "@a%0%a001240@bNe t'inquiète pas, je ne m'endormirai pas avant d'être au lit.\n@c0@"
  it: "@a%0%a001240@bHo sonno, voglio andare a nanna...\n@c0@"
  ja: "@a@b%a001240「大丈夫　ボク\n\tちゃんと　お部屋につくまで\n\t寝るの　がまんするよ。\n@c0@"
270:
  de: "@a%0%a001240@bMama und ich werden erst noch ein Bad nehmen.\n@c0@"
  en: "@a%0%a001240@bMum and I are going to share a bath together\nfirst too.\n@c0@"
  es: "@a%0%a001240@bPrimero, mamá y yo vamos a darnos un baño.\n@c0@"
  fr: "@a%0%a001240@bMaman et moi, on va d'abord aller prendre un bain.\n@c0@"
  it: "@a%0%a001240@bPrima però andrò a fare un bagno caldo!\nLa mamma vuole che mi lavi, prima di mettermi a letto...\n@c0@"
  ja: "@a@b%a001240「それに　今日は\n\tお母さんと　おふろに　入るんだ。\n\tムニャ……。\n@c0@"
271:
  de: "@aSancho@bZu solch später Stunde sollte man nisst mehr arbeiten. Die Nacht, das ist die Zeit für die Siesta, no?\n@c0@"
  en: "@aSancho@bEes too much to work when ees eso late, no?\nThe night, ees a time for siesta.\n@c0@"
  es: "@aSancho@bPues es demasiado trabajo para lo tarde que es, ¿no?\nLa noche está para dormir nomás.\n@c0@"
  fr: "@aSancho@bCe n'est p-pas bueno de travailler si tard. La noche, c'est p-pour la siesta.\n@c0@"
  it: "@aSancho@bNo es bueno lavorar de noche, chico.\n¿Vamos a fare una buena siesta, sì?\n@c0@"
  ja: "@a@bサンチョ「ふむふむ。\n\t夜にも　かかわらず　仕事熱心で\n\tけっこうなことですな。\n@c0@"
272:
  de: "@aOtto@bHilda die Hortmutter ist 'ne ganz schöne Wucht. Allein bei ihrem Anblick bekomme ich schon heftiges Herzklopfen.\n@c0@"
  en: "@aTuppence@bPatty the party planner is a provocative peach. It gives me palpitations just looking at her.\n@c0@"
  es: "@aAlazar@bCone-Cone la organizadora de grupos es un bombón. Con solo mirarla se me acelera el corazón.\n@c0@"
  fr: "@aInnocent@bTulipe, la chef d'équipe, est assez provocante.\r\nRien qu'à la regarder, j'en ai des palpitations.\n@c0@"
  it: "@aSimon@bGreta l'Organizzagruppo è una splendida figliola.\nOgni volta che la vedo, il mio cuore comincia a scalpitare come una mandria di Bufalmoni!\n@c0@"
  ja: "@a@bピピン「酒場の　ルイーダさんって\n\t色っぽいですよね。\n\tボク　ドキドキしちゃって。\n@c0@"
273:
  de: "@a%0%a001250@bIch bin mit ihm befreundet, aber seine beste Menschenfreundin ist Großmutter Magda.\n@c0@"
  en: "@a%0%a001250@bI'm friends with him, but his best human friend is Grandma Mada.\n@c0@"
  es: "@a%0%a001250@bSoy amiga suya, pero su mejor amiga humana es la abuela Perséfone.\n@c0@"
  fr: "@a%0%a001250@bJe suis amie avec lui, mais sa meilleure amie humaine est grand-mère Magda.\n@c0@"
  it: "@a%0%a001250@bQuello Slime è amico di nonna Mada.\nPerò anch'io sono sua amica!\n@c0@"
  ja: "@a@b%a001250「わたし　あの子と　仲よしなの。\n\tでも　あの子は　やっぱり\n\tマーサおばあちゃんが　いちばんなのね。\n@c0@"
274:
  de: "@aSancho@bSi. Es ist spät. Alle schlafen schon. Vielleisst sollten wir auch langsam ins Bett gehen, no?\n@c0@"
  en: "@aSancho@bSí. Ees late. Everyone ees esleeping now. Maybe ees time for us to esleep esoon too, no?\n@c0@"
  es: "@aSancho@bSí. Es tarde. Todos están durmiendo ya.\r\nA lo mejor deberíamos irnos también a dormir pronto.\n@c0@"
  fr: "@aSancho@bSi. Il est tard. Tout le monde dort, pour l'instant. Peut-être qu'il est l'heure de d-d-dormir pour nous aussi, noⓡ\n@c0@"
  it: "@aSancho@bEstanno dormendo todos, chico.\n¿Que ne diresti de andare a fare una bella siesta anche nosotros?\n@c0@"
  ja: "@a@bサンチョ「さすがに　この時間だと\n\tみな　寝ているようですね。\n\tわれわれも　そろそろ休みましょう。\n@c0@"
275:
  de: "@aOtto@bDas Ende eines weiteren erfolgreichen Tages!\n@c0@"
  en: "@aTuppence@bThe end of another fruitful day!\n@c0@"
  es: "@aAlazar@b¡El final de otro día completo!\n@c0@"
  fr: "@aInnocent@bVoilà une autre journée fructueuse qui touche\nà sa finⓠ\n@c0@"
  it: "@aSimon@bFine di un'altra dura giornata...\n@c0@"
  ja: "@a@bピピン「今日も　じつに\n\t有意義な一日でしたよっ！\n@c0@"
276:
  de: "@aOtto@bIn meiner Autobiografie werde ich ihn bestimmt erwähnen!\n@c0@"
  en: "@aTuppence@bI'll be sure to mention it in my autobiography.\n@c0@"
  es: "@aAlazar@bNo me olvidaré de incluirlo en mi autobiografía.\n@c0@"
  fr: "@aInnocent@bIl faudra que je me souvienne de cette phrase pour mon autobiographie.\n@c0@"
  it: "@aSimon@bChissà cosa ci succederà domani, eh?\nMah! Non si sa!\nChi vivrà vedrà!\n@c0@"
  ja: "@a@bピピン「ボクの自分史に\n\tちゃんと　今日のことも\n\t書き加えておかなきゃ！\n@c0@"
277:
  de: "@a%0%a001240@bIch bin ganz schön müde. Meine Füße tun so weh.\n@c0@"
  en: "@a%0%a001240@bI'm pretty tired now. My feet are killing me.\n@c0@"
  es: "@a%0%a001240@bEstoy un poco cansado. Los pies me están matando.\n@c0@"
  fr: "@a%0%a001240@bJe suis vraiment fatigué, maintenant.\nJ'ai très mal aux pieds.\n@c0@"
  it: "@a%0%a001240@bSono stanchissimo!\nMi fanno male i piedi!\n@c0@"
  ja: "@a@b%a001240「今日は　つかれたなあー。\n\t足が　クタクタだよ。\n@c0@"
278:
  de: "@a%0%a001250@bEin Bad? Na, vielleicht mit Mama. Ich bin viel zu alt, um noch mit dir zu baden, Papa!\n@c0@"
  en: "@a%0%a001250@bA bath? I'm going to have one with Mum. I'm too old to have one with you now, Dad!\n@c0@"
  es: "@a%0%a001250@b¿Un baño? Yo me voy a bañar con mamá. ¡Ya soy mayor para bañarme contigo, papá!\n@c0@"
  fr: "@a%0%a001250@bUn bainⓡ Je vais en prendre un avec maman. Maintenant, je suis trop grande pour le faire\navec toi, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, dopo voglio fare un bel bagno caldo insieme a mamma...\n@c0@"
  ja: "@a@b%a001250「えっ　おふろですか？\n\tお母さんと　入ります。\n\tお父さんとじゃ　はずかしい……。\n@c0@"
279:
  de: "@a%0%a001240@bViele Leute scheinen im Schlaf zu sprechen. Ich frage mich, was ich nachts so erzähle...\n@c0@"
  en: "@a%0%a001240@bLoads of people seem to talk in their sleep.\nI wonder what kinds of things I say.\n@c0@"
  es: "@a%0%a001240@bUn montón de personas hablan en sueños.\nMe pregunto qué clase de cosas dicen.\n@c0@"
  fr: "@a%0%a001240@bOn dirait qu'il y a plein de gens qui parlent dans leur sommeil. Je me demande quel genre de choses\nje raconte, moi.\n@c0@"
  it: "@a%0%a001240@bForse anch'io parlo nel sonno...\nChissà cosa dico...!\n@c0@"
  ja: "@a@b%a001240「みんな　寝ながら\n\tなにか　言ってるね。\n\tボクも　なんか　言ってるのかなあ。\n@c0@"
280:
  de: "@a%0%a001250@bWarum ruft er denn nach Großmutter? Sie ist doch in Nadiria. Ein Gelehrter wie er sollte das eigentlich wissen...\n@c0@"
  en: "@a%0%a001250@bThere's no point in him calling for Grandma Mada. She's in Nadiria. You'd think a scholar like him would know that.\n@c0@"
  es: "@a%0%a001250@bNo tiene sentido que llame a la abuela Perséfone. Está en Nadiria. Un erudito como él debería saberlo.\n@c0@"
  fr: "@a%0%a001250@bÇa ne sert à rien d'appeler grand-mère Magda.\nElle est à Nadiria. Je pensais qu'un savant comme\nlui le saurait.\n@c0@"
  it: "@a%0%a001250@bNonna Mada è a Nadiria.\nSperiamo che stia bene...\n@c0@"
  ja: "@a@b%a001250「マーサおばあちゃんは\n\t魔界に　いるのに……。\n\t学者さんなのに　知らないのかな？\n@c0@"
281:
  de: "@a%0%a001240@bSancho wollte immer, dass wir uns vor dem Zubettgehen die Zähne putzen.\n@c0@"
  en: "@a%0%a001240@bSancho always nagged us to clean our teeth\nbefore bed.\n@c0@"
  es: "@a%0%a001240@bSancho siempre nos fastidiaba con lo de cepillarnos los dientes antes de ir a dormir.\n@c0@"
  fr: "@a%0%a001240@bSancho nous a toujours embêtés en nous obligeant à nous laver les dents avant d'aller nous coucher.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho si arrabbia moltissimo se dimentichiamo di lavarci i denti prima di andare a dormire.\n@c0@"
  ja: "@a@b%a001240「寝る前は　いっつも\n\t歯みがきしなさいーって\n\tサンチョが　うるさいんだよ。\n@c0@"
282:
  de: "@a%0%a001240@bEr hat gesagt, du hättest dir jeden Abend die Zähne geputzt, ohne zu murren. Stimmt das, Papa?\n@c0@"
  en: "@a%0%a001240@bHe said you used to do it every night without being asked. Is that true, Dad?\n@c0@"
  es: "@a%0%a001240@bDecía que tú lo hacías cada noche sin que te lo mandasen. ¿Es verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bIl nous disait que toi, tu le faisais tous les soirs sans qu'il ait besoin de te le demander. C'est vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bCi ha detto che tu te li lavavi senza che nessuno te lo ricordasse.\nÈ vero, papà?\n@c0@"
  ja: "@a@b%a001240「お父さんは　言われなくても\n\tきちんとしてたって。\n\tホント？　お父さん。\n@c0@"
283:
  de: "@a%0%a001250@bHm? Was ist los... Papa? Zzz...\n@c0@"
  en: "@a%0%a001250@bHm? What is it...Dad? Zzzz...\n@c0@"
  es: "@a%0%a001250@b¿Mmm? ¿Qué pasa? ¿Papi? Zzzz...\n@c0@"
  fr: "@a%0%a001250@bMmmⓡ Qu'est-ce que c'est... Papaⓡ Zzzz...\n@c0@"
  it: "@a%0%a001250@bRonf...\nChe c'è, papà?\nZzz...\n@c0@"
  ja: "@a@b%a001250「ん？\n\tなーに　お父さん…　ぐう……。\n@c0@"
284:
  de: "@aSancho@bChico! Nisst vergessen. Immer schön die Zähne putzen und Pipi machen, bevor du ins Bett gehst...\n@c0@"
  en: "@aSancho@bFriend! You no forget now! You clean your teeth and do a wee-wee before you go to bed, okay?\n@c0@"
  es: "@aSancho@b¡Chamaquito! ¡No te olvides! Cepíllate los dientes y haz pipí antes de irte a la cama, órale.\n@c0@"
  fr: "@aSancho@bChicoⓠ N'oublie pas, heinⓠ Tu te brosses les dents et tu fais pipi avant d'aller au lit, de acuerdoⓡ\n@c0@"
  it: "@aSancho@b¡Chico, no dementicarte de lavarte los dentes y de andare en bagno antes de addormentarte!\n¿Claro?\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん。\n\tお休み前には　歯みがきと\n\tトイレに行くのを　忘れずに！\n@c0@"
285:
  de: "@aSancho@bDu hast jetzt eigene Niños, Chico. Sie lernen von ihre Padre.\n@c0@"
  en: "@aSancho@bYou have your own children now, friend.\r\nThey learn from their papá.\n@c0@"
  es: "@aSancho@bPues ya tiene sus propios chamaquitos, ¿no?\nSeguro que aprenden de su apá.\n@c0@"
  fr: "@aSancho@bT-Tu as des enfants, m-maintenant, chico.\r\nIls apprennent en r-regardant leur papá.\n@c0@"
  it: "@aSancho@b¡Ahora hai dei figlios, y devi dare loro el buen ejemplo!\n¿Ah, como faresti senza el tuo caro zio Sancho?\n@c0@"
  ja: "@a@bサンチョ「今の　坊っちゃんは\n\tお子さまたちの　お手本なんです。\n\tピシっとしてくださいねっ。\n@c0@"
286:
  de: "@aBianca@bIch hatte solche Angst, als ich entführt wurde. Aber am meisten hab ich mich um die Kinder gesorgt.\n@c0@"
  en: "@aBianca@bI was terrified when I got kidnapped. I was so worried about what would happen to the kids.\n@c0@"
  es: "@aBianca@bCuando me secuestraron estaba muerta de miedo. Me preocupaba lo que pudiera pasarle a los niños, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'étais terrifiée quand j'ai été enlevée. J'étais si inquiète de ce qui allait arriver aux enfants.\n@c0@"
  it: "@aBianca@bQuando venni rapita, il primo pensiero che ebbi fu per i miei figli... Che ne sarebbe stato di loro...?\nCome sarebbero cresciuti senza la mamma...?\n@c0@"
  ja: "@a@bビアンカ「さらわれた時は　こわかったわ。\n\t子供たちに　もしものことがあったら\n\tと思うと　とても……。\n@c0@"
287:
  de: "@aBianca@bIch bin ja so erleichtert, dass sie wohl behütet aufgewachsen sind.\n@c0@"
  en: "@aBianca@bIt's such a relief to see they grew up safe\r\nand sound.\n@c0@"
  es: "@aBianca@bEs un alivio ver que han crecido bien y están sanos y salvos.\n@c0@"
  fr: "@aBianca@bJe suis tellement soulagée de voir qu'ils ont grandi sans problème. \n@c0@"
  it: "@aBianca@bPer fortuna sono venuti su bene, e di questo dobbiamo ringraziare tutta la gente di Denim, e in particolare il nostro caro Sancho...\n@c0@"
  ja: "@a@bビアンカ「でも　ぶじに　こうして\n\t大きく育ってくれていて\n\t本当に　よかった……。\n@c0@"
288:
  de: "@aNera@bDen Tag, an dem ich endlich wieder meine Kinder sehen konnte, werde ich nie vergessen.\n@c0@"
  en: "@aNera@bI'll never forget the day I was reunited with my children at last.\n@c0@"
  es: "@aNera@bNunca olvidaré il giorno que me volví a encontrar con mis bambini.\n@c0@"
  fr: "@aNera@bJe n'oublierai jamais le jour où j'ai retrouvé mes enfants.\n@c0@"
  it: "@aNera@bNon dimenticherò mai il giorno che ho potuto finalmente riabbracciare i miei figli...\n@c0@"
  ja: "@a@bフローラ「私　ふたたび　この手に\n\t子供たちを　抱いた日のこと\n\t一生　わすれないわ……。\n@c0@"
289:
  de: "@aNera@bIch weiß, du hast bestimmt schon Pläne gemacht, aber ich hoffe doch sehr, dass wir alle bis zum Ende zusammenbleiben werden.\n@c0@"
  en: "@aNera@bI'm sure you have your own plans in mind, but I\r\ndo hope we'll all be able to travel together until the very end.\n@c0@"
  es: "@aNera@bSeguro que tienes tus propios planes, ma espero que podamos hacer el viaje juntos hasta el finale.\n@c0@"
  fr: "@aNera@bJe suis sûre que tu as déjà des plans pour la suite, mais j'espère que nous pourrons toujours voyager ensemble.\n@c0@"
  it: "@aNera@bOra voglio che la nostra famiglia resti sempre unita, e spero che permetterai a tutti noi di accompagnarti fino alla fine di quest'avventura...\n@c0@"
  ja: "@a@bフローラ「あなたにも考えがあると思うけど\n\t私は　家族みんなで　最後まで\n\t旅できればと思っているの。\n@c0@"
290:
  de: "@aBianca@bSie ist eine gute Köchin, nicht?\n@c0@"
  en: "@aBianca@bShe's quite a cook, that one, eh?\n@c0@"
  es: "@aBianca@bCocina muy bien, ¿eh?\n@c0@"
  fr: "@aBianca@bCette femme est une sacrée cuisinière, pas vraiⓡ\n@c0@"
  it: "@aBianca@bNon vedo l'ora di assaggiare le delizie che ci preparerà!\r\nQuella donna è davvero in gamba ai fornelli...\n@c0@"
  ja: "@a@bビアンカ「あの　おばさんの　ごはんって\n\t本当に　おいしいのよね。\n@c0@"
291:
  de: "@aBianca@bAber am schönsten wäre es natürlich, wenn ich selbst für die Kinder kochen könnte. Wenigstens wenn wir hier in Humburg sind.\n@c0@"
  en: "@aBianca@bBut it'd be quite nice if I could cook for the kids myself, at least when we're stayin' here in Gotha.\n@c0@"
  es: "@aBianca@bPero me gustaría cocinar para los críos, al menos mientras estemos en Pankraz.\n@c0@"
  fr: "@aBianca@bMais j'aimerais bien cuisiner pour les enfants...\r\nAu moins quand nous sommes à Gotha.\n@c0@"
  it: "@aBianca@bNon come la tua cara mogliettina... Sigh!\nTi prometto che prima o poi imparerò a cucinare!\n㈡\nAlmeno, ci proverò.\n@c0@"
  ja: "@a@bビアンカ「でもここに泊まったときくらいは\n\t子供たちに　私の手料理を\n\t食べさせてあげたいな。\n@c0@"
292:
  de: "@aNera@bDiese Frau ist eine hervorragende Köchin. Alles schmeckt ausgezeichnet.\n@c0@"
  en: "@aNera@bThat lady is a fine cook.\r\nHer meals always go down very well.\n@c0@"
  es: "@aNera@bEsa señora cocina molto bene.\nSu comida è buona.\n@c0@"
  fr: "@aNera@bCette dame est une très bonne cuisinière.\r\nSes plats se mangent tout seuls.\n@c0@"
  it: "@aNera@bÈ una cuoca eccezionale!\nSa preparare dei piatti assolutamente squisiti!\n@c0@"
  ja: "@a@bフローラ「あの　おばさまのお料理は\n\t本当に　おいしいんですもの。\n\t食べると　元気が　出てきますわよね。\n@c0@"
293:
  de: "@aNera@bAber %0%a001250 scheint mir ein wenig schwierig mit dem Essen zu sein. Es wäre schön, wenn ich auch mal für sie kochen könnte...\n@c0@"
  en: "@aNera@b%0%a001250 seems to be quite a fussy eater, though. It would be nice if I could cook for her every once in a while.\n@c0@"
  es: "@aNera@b%0%a001250 sembra un poco especial para las comidas. Me encantaría poder cocinar para ella alguna volta.\n@c0@"
  fr: "@aNera@bCeci dit, %a001250 a l'air d'être un peu difficile. J'aimerais faire la cuisine pour elle, de temps en temps.\n@c0@"
  it: "@aNera@bPerò anch'io me la cavo bene in cucina, sai? Quando studiavo all'Abbazia di Su'ncyel, ero la prima della classe anche in ⓕManicarettologia applicataⓖ!\n@c0@"
  ja: "@a@bフローラ「でも　%a001250は\n\t好きキライが　多いみたいだし…\n\tたまには　私が　作ってみようかしら。\n@c0@"
294:
  de: "@a%0%a001240@bUi! Sieh dir nur all das Essen an! Das passt ja kaum auf den Tisch!\n@c0@"
  en: "@a%0%a001240@bYikes! Look at all that food!\nIt hardly fits on the table.\n@c0@"
  es: "@a%0%a001240@b¡Puaj! ¡Mira toda esa comida!\nCasi no cabe en la mesa.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde toute cette nourritureⓠ\nÇa tient à peine sur la table.\n@c0@"
  it: "@a%0%a001240@bQuanta pappa!\nPancia mia, fatti castello!\n@c0@"
  ja: "@a@b%a001240「うっ　はりきらないでほしいな。\n\tだって　テーブルに　のらないくらい\n\tたくさんの　ごはんが出てくるんだよ。\n@c0@"
295:
  de: "@a%0%a001240@bIch hab ja kein Problem damit, so viel zu essen, aber %a001250 ist manchmal ein wenig pingelig...\n@c0@"
  en: "@a%0%a001240@bI reckon I could manage it okay, but %a001250 can be a bit fussy about food.\n@c0@"
  es: "@a%0%a001240@bYo no tengo ningún problema pero %a001250 es un tanto especial para las comidas.\n@c0@"
  fr: "@a%0%a001240@bJe pense que moi, ça m'irait très bien, mais %a001250 est un peu difficile, parfois..\n@c0@"
  it: "@a%0%a001240@b%0%a001250 non mangia di tutto, ma ci penserò io a spazzolare quello che a lei non piace!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「ボクは　いいけど\n\t%a001250は　好きキライが多いから\n\tたいへんだよ。\n@c0@"
296:
  de: "@a%0%a001250@bÄhm, Papa? Ist es in Ordnung, wenn wir in der Herberge übernachten und nicht hier?\n@c0@"
  en: "@a%0%a001250@bUm, Dad. Is it okay if we stay at the inn instead\nof here?\n@c0@"
  es: "@a%0%a001250@bMmm, papi. ¿Te parece bien que nos quedemos en la posada en vez de aquí?\n@c0@"
  fr: "@a%0%a001250@bMmm, papa. Ça te dérange si on reste à l'auberge plutôt qu'iciⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, potremmo tornare alla locanda ogni tanto?\nQuando dormo lì non faccio mai brutti sogni!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tここじゃなくて\n\t宿屋に　泊まろうよ……。\n@c0@"
297:
  de: "@aBianca@bHm. Er mag ja der legendäre Held sein, aber er ist immer noch ein Junge. Wenn wir ihn mitnehmen, würde ich mir ständig Sorgen machen...\n@c0@"
  en: "@aBianca@bHm. He may be the legendary hero, but he's still only young. It's quite a worry takin' him along.\n@c0@"
  es: "@aBianca@bMmm. Será el héroe legendario pero sigue siendo demasiado joven. A mí me preocupa que venga con nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm. Il a beau être le héros légendaire, ce n'est encore qu'un petit garçon. Ça m'inquiète un peu de l'emmener avec nous.\n@c0@"
  it: "@aBianca@b%0%a001240 sarà anche l'Eroe Leggendario, ma resta pur sempre un bambino...\nA volte penso che sia sbagliato farlo venire con noi.\n㈡\nNon è che lo esponiamo a rischi troppo grandi chiedendogli di accompagnarci?\n@c0@"
  ja: "@a@bビアンカ「う～ん……。　伝説の勇者\n\tとはいえ　まだ小さな子供ですもの\n\tつれて行くのは　気がひけるわね。\n@c0@"
298:
  de: "@aNera@bDass er um diese Zeit noch auf ist! Er muss sich wirklich sehr wünschen, mit uns zu kommen.\n@c0@"
  en: "@aNera@bFancy him being awake at this hour! He must be very desperate to join us.\n@c0@"
  es: "@aNera@b¡Míralo despierto così de tarde! Debe de estar veramente desesperado por unirse a nosotros.\n@c0@"
  fr: "@aNera@bC'est rare qu'il soit encore debout à cette heureⓠ\nIl doit vraiment avoir très envie de venir avec nous.\n@c0@"
