325:
  de: "@aOtto@bOh! Wie romantisch! Kümmert Euch net um mich, turtelt einfach weiter...\n@c0@"
  en: "@aTuppence@bOoh! How romantic! Don't you worry about me. Just carry on with the lovey-dovey routine, I would!\n@c0@"
  es: "@aAlazar@b¡Oh! ¡Qué romántico! No os preocupéis por mí. Seguid con las muestras de cariño, ¡yo lo haría!\n@c0@"
  fr: "@aInnocent@bOohⓠ Comme c'est romantiqueⓠ Ne vous inquiétez pas pour moi. Vous pouvez continuer à vous dire des mots doux.\n@c0@"
  it: "@aSimon@bOh, ma che carini!\nIl mio Re e la sua gentile consorte che si dicono frasi romantiche come due piccioncin...\n㈡\nEhm, mi sembra che mi stiano chiamando nell'altra stanza...\nSì, è meglio che me ne vada...\n@c0@"
  ja: "@a@bピピン「いや～　アツアツですね。\n\tどうぞ　ボクのことは　お気になさらず\n\t続けてください。\n@c0@"
326:
  de: "@a%0%a001240@bMama ist erstaunlich.\n@c0@"
  en: "@a%0%a001240@bMum's amazing.\n@c0@"
  es: "@a%0%a001240@bMamá es genial.\n@c0@"
  fr: "@a%0%a001240@bMaman m'impressionne.\n@c0@"
  it: "@a%0%a001240@bLa mia mamma è troppo forte!\nTroppo troppo forte!\n@c0@"
  ja: "@a@b%a001240「なんか　お母さんって\n\tすごいんだね。\n@c0@"
327:
  de: "@a%0%a001240@bIch dachte, ich müsste sie beschützen, aber in Wahrheit ist sie es, die auf mich aufpasst!\n@c0@"
  en: "@a%0%a001240@bI thought I'd have to be there to protect her,\nbut she's always the one looking after me!\n@c0@"
  es: "@a%0%a001240@b¡Pensé que debía quedarme para protegerla, pero siempre es ella la que me cuida!\n@c0@"
  fr: "@a%0%a001240@bJe croyais que je devrais la protéger, mais c'est toujours elle qui veille sur moiⓠ\n@c0@"
  it: "@a%0%a001240@bAll'inizio pensavo che avrei dovuto difenderla dai nemici, e invece è lei che mi protegge ogni volta che ce n'è bisogno!\n@c0@"
  ja: "@a@b%a001240「ボク　お母さんも\n\t守るつもりだったけど　お母さんには\n\tいつも　守られているみたいだ。\n@c0@"
328:
  de: "@a%0%a001250@bMir wäre es lieber, wenn Mama mitkommen würde, Papa.\n@c0@"
  en: "@a%0%a001250@bI'd rather Mum was with us too, Dad.\n@c0@"
  es: "@a%0%a001250@bYo quiero que mamá venga con nosotros, papi.\n@c0@"
  fr: "@a%0%a001250@bMoi aussi, j'aimerais bien que maman vienne avec nous, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, avrei voluto che con noi ci fosse anche la mamma...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tわたしも　お母さんと\n\tいっしょが　いいな……。\n@c0@"
329:
  de: "@a%0%a001240@bEs wäre großartig, wenn wir hier alle schlafen könnten! Dummerweise gibt es nur ein Bett...\n@c0@"
  en: "@a%0%a001240@bIt'd be cool if we could all sleep here together!\nOh, but there's only one bed...\n@c0@"
  es: "@a%0%a001240@b¡Estaría bien si pudiéramos dormir aquí todos juntos!\n¡Oh!, pero solo hay una cama...\n@c0@"
  fr: "@a%0%a001240@bCe serait super si on pouvait dormir ici tous ensembleⓠ Oh, mais il n'y a qu'un lit...\n@c0@"
  it: "@a%0%a001240@bPeccato che ci sia un solo letto!\nMi avrebbe fatto piacere dormire tutti insieme nella stessa stanza...\n@c0@"
  ja: "@a@b%a001240「みんなで　ここに寝たら\n\tきっと　おもしろいよね！\n\tでも　ベッドが　１つしかないか……。\n@c0@"
330:
  de: "@a%0%a001250@bWir haben hier eine Menge Geschichten gehört. Geschichten aus Sanchos Vergangenheit.\n@c0@"
  en: "@a%0%a001250@bWe heard lots of stories here in this house.\nStories from Sancho's past.\n@c0@"
  es: "@a%0%a001250@bEn esta casa nos han contado muchas historias.\nHistorias de cuando Sancho era joven.\n@c0@"
  fr: "@a%0%a001250@bNous avons entendu beaucoup d'histoires dans cette maison. Des histoires que Sancho racontait.\n@c0@"
  it: "@a%0%a001250@bQuando dormivamo qui, lo zio Sancho ci raccontava sempre tante cose su re Russel...\n@c0@"
  ja: "@a@b%a001250「この　おうちで\n\tいろんな　お話を聞いたの。\n\tサンチョとおじいちゃんの話。\n@c0@"
331:
  de: "@a%0%a001250@bIch glaube, wir wissen einfach alles über Großvater Ludwig!\n@c0@"
  en: "@a%0%a001250@bI think we probably know everything there is to know about Grandpa Pankraz!\n@c0@"
  es: "@a%0%a001250@bSeguramente lo sabemos todo del abuelo Teudis.\n@c0@"
  fr: "@a%0%a001250@bJe crois que nous savons à peu près tout sur grand-père Petrosⓠ\n@c0@"
  it: "@a%0%a001250@bOrmai sappiamo tutto della vita del nonno!\n@c0@"
  ja: "@a@b%a001250「だから\n\tパパスおじいちゃんのこと\n\tわたしたち　なんでも知ってるよ。\n@c0@"
332:
  de: "@aSancho@bNachdem iss Humburg mit Señor Ludwig verlassen hatte, habe iss immer Essen gemacht.\n@c0@"
  en: "@aSancho@bAfter I left Gotha weeth señor Pankraz, every day I make the dinner.\n@c0@"
  es: "@aSancho@bDesde que salí de Pankraz con el señor Teudis, cada día hacía la cena.\n@c0@"
  fr: "@aSancho@bAprès avoir quitté Gotha avec le señor Petros,\r\nj'ai p-p-préparé le repas tous les jours.\n@c0@"
  it: "@aSancho@bCuando partimmo da Denim con el señor Russel, yo avevo el compitos de preparare los pastos.\n@c0@"
  ja: "@a@bサンチョ「パパスさまと旅に出てから\n\t毎日　私が　お食事を作っていました。\n@c0@"
333:
  de: "@aSancho@bEs war nisst einfach, wenn der kleine Chico mal wieder nisst essen wollte, aber wenn iss jetzt zurückdenke, waren es glücklisse Zeiten... (Schluchz)\n@c0@"
  en: "@aSancho@bEes no easy to look after the young friend when you no used to eet, but when I look back now, ees, ees eso happy times... (sob)\n@c0@"
  es: "@aSancho@bNo es fácil cuidar a un chamaco cuando no estás acostumbrado, pero cuando recuerdo esos tiempos... Fui muy feliz... (snif)\n@c0@"
  fr: "@aSancho@bÇa n'est pas facile de s'occuper d'oun petit chico quand on n'a pas l'habitude, mais q-q-quand j'y repense, c'était le bon temps... (snif)\n@c0@"
  it: "@aSancho@b¡Me recuerdo que te piaceva muchissimo la paella que te preparavo con tanto amor!\n@c0@"
  ja: "@a@bサンチョ「なれない子守りも　大変でしたが\n\t今となっては　あの旅の日々ばかりが\n\t思い出されて……。\n@c0@"
334:
  de: "@a%0%a001250@bSancho spricht oft im Schlaf, er scheint wirklich beunruhigt zu sein.\n@c0@"
  en: "@a%0%a001250@bSancho calls out in his sleep sometimes. He always sounds really upset.\n@c0@"
  es: "@a%0%a001250@bA veces Sancho grita en sueñosⓓ suena como si estuviese muy alterado.\n@c0@"
  fr: "@a%0%a001250@bSancho crie parfois dans son sommeil.\nIl a toujours l'air très malheureux.\n@c0@"
  it: "@a%0%a001250@bA volte lo zio Sancho parla nel sonno.\nAnzi, non parla: urla!\nSembra quasi che ce l'abbia con qualcuno...\n@c0@"
  ja: "@a@b%a001250「サンチョ　ときどき\n\t夜中に　うなされてるの。\n\tすごく悲しそうで　かわいそう……。\n@c0@"
335:
  de: "@a%0%a001250@bIch bin sehr gerne hier, aber ich mag es nicht, wenn er sich solche Sorgen macht...\n@c0@"
  en: "@a%0%a001250@bI really like staying here, but I've seen him call out like that loads of times and it's not very nice.\n@c0@"
  es: "@a%0%a001250@bMe gustaría mucho quedarme aquí, pero lo he visto gritar en sueños muchas veces y no es agradable.\n@c0@"
  fr: "@a%0%a001250@bJ'aime bien rester ici, mais je l'ai souvent entendu crier comme ça et ce n'est pas très agréable.\n@c0@"
  it: "@a%0%a001250@bA me piace molto dormire a casa sua, però quando grida mi spavento!\n@c0@"
  ja: "@a@b%a001250「わたし　この家に泊まるの\n\t好きだけど　サンチョがうなされてるの\n\t何度も　見ちゃった……。\n@c0@"
336:
  de: "@a%0%a001240@bIst Großvater Ludwig denn wirklich tot? Kann er nicht irgendwie wieder auferstehen? Sancho ist doch so traurig.\n@c0@"
  en: "@a%0%a001240@bIs Grandpa Pankraz really dead? Can't he come back to life somehow? Poor Sancho seems so sad.\n@c0@"
  es: "@a%0%a001240@b¿De verdad que el abuelo Teudis está muerto? ¿Y no puede volver a la vida de alguna forma? El pobre Sancho parece muy triste.\n@c0@"
  fr: "@a%0%a001240@bEst-ce que grand-père Petros est vraiment mortⓡ\nIl ne pourrait pas revivreⓡ Le pauvre Sancho a l'air si triste.\n@c0@"
  it: "@a%0%a001240@bAllo zio Sancho dispiace moltissimo che nonno Russel non ci sia più...\nGli spiace quasi quanto a me!\n@c0@"
  ja: "@a@b%a001240「ねえ　本当に　おじいちゃんは\n\t死んじゃったの？　生きかえらないの？\n\tサンチョが　かわいそうだよ。\n@c0@"
337:
  de: "@aBianca@bAch, Sancho, du mit deinem weichen Herzen!\n@c0@"
  en: "@aBianca@bOh, Sancho, you big softie!\n@c0@"
  es: "@aBianca@b¡Oh, Sancho, qué blando eres!\n@c0@"
  fr: "@aBianca@bOh, Sancho, tu es un vrai cœur d'artichautⓠ\n@c0@"
  it: "@aBianca@bOh, Sancho! Sei proprio un tenerone.\n@c0@"
  ja: "@a@bビアンカ「サンチョさん……。\n@c0@"
338:
  de: "@aNera@bSancho muss sehr traurig sein. Wahrscheinlich viel mehr, als wir dachten.\n@c0@"
  en: "@aNera@bSancho seems really sad.\r\nProbably more so than we realise.\n@c0@"
  es: "@aNera@bSancho sembra molto triste.\nSicuro que más de lo que nos damos cuenta.\n@c0@"
  fr: "@aNera@bSancho a l'air vraiment triste.\r\nPeut-être même plus que nous le pensons.\n@c0@"
  it: "@aNera@bCredo che Sancho soffra molto più di quanto non dia a vedere.\nEra davvero affezionato a tuo padre...\n@c0@"
  ja: "@a@bフローラ「サンチョさんの　悲しみは\n\tとても　深いのね。\n\tきっと　私たちの想像以上に……。\n@c0@"
339:
  de: "@a%0%a001240@bBleibt Sancho etwa hier? Ich wünschte, er würde mit uns kommen.\n@c0@"
  en: "@a%0%a001240@bAre we leaving Sancho behind? I'd rather he came along with us.\n@c0@"
  es: "@a%0%a001240@b¿Vamos a dejar a Sancho? Preferiría que viniese con nosotros.\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'on laisse Sancho iciⓡ J'aimerais mieux\nqu'il vienne avec nous.\n@c0@"
  it: "@a%0%a001240@bNon portiamo lo zio Sancho con noi?\nMi piacerebbe se ci accompagnasse, sai?\n@c0@"
  ja: "@a@b%a001240「サンチョは　お留守番なの？\n\tボク　サンチョも　いっしょがいいな。\n@c0@"
340:
  de: "@a%0%a001250@bEs ist ein wenig einsam ohne Sancho...\n@c0@"
  en: "@a%0%a001250@bIt's a bit lonely without Sancho...\n@c0@"
  es: "@a%0%a001250@bSin Sancho me siento un poco sola...\n@c0@"
  fr: "@a%0%a001250@bÇa n'est pas pareil, sans Sancho.\n@c0@"
  it: "@a%0%a001250@bMi sento un po' triste senza lo zio Sancho...\n@c0@"
  ja: "@a@b%a001250「サンチョが　いないと\n\tちょっと　さみしい……。\n@c0@"
341:
  de: "@a%0%a001250@bAber das heißt natürlich nicht, dass ich nicht gerne mit dir zusammen bin, Papa! Tut mir leid...\n@c0@"
  en: "@a%0%a001250@bOh, but that doesn't mean I'm not happy to have you around, Dad. Sorry!\n@c0@"
  es: "@a%0%a001250@b¡Oh!, pero eso no quiere decir que no sea feliz por tenerte cerca, papi. ¡Lo siento!\n@c0@"
  fr: "@a%0%a001250@bOh, mais ça ne veut pas dire que je ne suis pas contente d'être avec toi, papa. Désoléeⓠ\n@c0@"
  it: "@a%0%a001250@bLui è troppo simpatico, e poi prepara una paella meravigliosa!\n@c0@"
  ja: "@a@b%a001250「あっ　でも　こんなこと言うと\n\tお父さんが　さみしいね。\n\tごめんなさい……。\n@c0@"
342:
  de: "@aOtto@bSancho muss sich auch mal ein wenig ausruhen... Aber er steckt immer noch voller Tatendrang.\n@c0@"
  en: "@aTuppence@bSancho must be getting on a bit, mustn't he?\r\nHe's still very full of beans, though.\n@c0@"
  es: "@aAlazar@bSancho ya debe de estar haciéndose mayorcito, ¿no?\r\nPero aún está lleno de energía.\n@c0@"
  fr: "@aInnocent@bSancho doit commencer à prendre de l'âge, nonⓡ Pourtant, il est encore plein d'énergie.\n@c0@"
  it: "@aSimon@bSancho ha ancora un sacco di energie, per essere un vecch... Ehm, volevo dire che è una persona esperta e piena di vitalità!\n@c0@"
  ja: "@a@bピピン「サンチョさんって\n\tけっこう　お年なんですよね。\n\tそのわりには　元気だなあ……。\n@c0@"
343:
  de: "@aBianca@bWir halten Sancho immer auf Trab, oder? Vielleicht sollten wir ihm mal die Möglichkeit geben, sich auszuruhen...\n@c0@"
  en: "@aBianca@bWe've always got Sancho on the go, eh? We should probably give him the chance to have a rest every now and then.\n@c0@"
  es: "@aBianca@bSiempre tenemos a Sancho de un lado a otro sin parar. Deberíamos dejar que descansara alguna vez, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bOn a toujours emmené Sancho avec nous. Je pense qu'on devrait lui permettre de se reposer de temps en temps.\n@c0@"
  it: "@aBianca@bSancho si è dato un gran daffare ultimamente. Forse dovremmo concedergli un po' di riposo, così sarà in piena forma quando avremo bisogno di lui.\n@c0@"
  ja: "@a@bビアンカ「サンチョさんには\n\t迷わく　かけっぱなしだもの。\n\tたまには　休んでもらわないとね。\n@c0@"
344:
  de: "@aNera@bSancho scheint immer nur an Ludwig zu denken.\n@c0@"
  en: "@aNera@bAll Sancho ever seems to think about is Pankraz.\n@c0@"
  es: "@aNera@bVeramente, lo único en lo que piensa Sancho es en Teudis.\n@c0@"
  fr: "@aNera@bSancho ne peut pas s'empêcher de penser à Petros.\n@c0@"
  it: "@aNera@bSancho non smette mai di pensare a tuo padre...\nLa stima che ha di lui è sconfinata.\n@c0@"
  ja: "@a@bフローラ「サンチョさん…\n\tパパス王のことばかり……。\n@c0@"
345:
  de: "@aNera@bIch frage mich, wie man ihn ein wenig aufheitern könnte...\n@c0@"
  en: "@aNera@bI wonder if there's any way of cheering him\r\nup somehow.\n@c0@"
  es: "@aNera@bTiene que haber alguna forma de animarle.\n@c0@"
  fr: "@aNera@bJe me demande comment on pourrait lui remonter un peu le moral.\n@c0@"
  it: "@aNera@bLa morte di Russel lo ha segnato indelebilmente.\nMi piacerebbe poter fare qualcosa per tirarlo su di morale...\n@c0@"
  ja: "@a@bフローラ「サンチョさんが　元気になる\n\tいい方法は　ないものかしら？\n@c0@"
346:
  de: "@aSancho@bAber das ist eine Moment für die Familia! Na, das muss etwas sehr Wichtiges sein...\n@c0@"
  en: "@aSancho@bBut ees a family moment.\nEsometheeng must be very important.\n@c0@"
  es: "@aSancho@bUna reunión familiar, nomás.\nPasará algo bien importante.\n@c0@"
  fr: "@aSancho@bEn plein m-milieu de retrouvailles f-familialesⓡ\nÇa doit être t-très important.\n@c0@"
  it: "@aSancho@bSi el principe Alberto desidera parlarte, deve trattarse de una cosa muy importante, chico...\n@c0@"
  ja: "@a@bサンチョ「感動の再会の　最中だというのに\n\tあわただしいですね。\n@c0@"
347:
  de: "@aOtto@bWie wunderbar! Ha ha ha!\n@c0@"
  en: "@aTuppence@bHow marvellous! Ha ha ha!\n@c0@"
  es: "@aAlazar@b¡Qué maravilla! ¡Ja, ja, ja!\n@c0@"
  fr: "@aInnocent@bFantastiqueⓠ Ha ha haⓠ\n@c0@"
  it: "@aSimon@bMaestà, cosa vorrà dirle il principe Alberto?\n@c0@"
  ja: "@a@bピピン「良かったですねえ……。\n\t本当に…　うっうっ……。\n@c0@"
348:
  de: "@aSancho@bAh! Señora Griselda war noch nie auf den Mund gefallen.\n@c0@"
  en: "@aSancho@bAnda! Señora Debora, eshe always have the bad words een her mouth.\n@c0@"
  es: "@aSancho@b¡Ándale! La señora Stefania siempre manda que te manda.\n@c0@"
  fr: "@aSancho@bAndaⓠ La señora Pandora, elle a t-toujours des mauvaises p-paroles dans la bouche.\n@c0@"
  it: "@aSancho@bLa señora Viola es una persona muy decisa...\n¡Anche troppos, por los mios gustos!\n@c0@"
  ja: "@a@bサンチョ「むむ……。\n\tデボラ様は　あいかわらず\n\tクチが　お悪いですなあ。\n@c0@"
349:
  de: "@aOtto@bD-Das ist also Fräulein Griselda...\n@c0@"
  en: "@aTuppence@bS-So this is Miss Debora...\n@c0@"
  es: "@aAlazar@bA-así que esta es la signora Stefania...\n@c0@"
  fr: "@aInnocent@bA-Alors voici mademoiselle Pandora...\n@c0@"
  it: "@aSimon@bLa regina Viola...\n@c0@"
  ja: "@a@bピピン「こ　この方が\n\tデボラ様ですか……。\n@c0@"
350:
  de: "@aOtto@bB-Bei der Göttin! Welch eine Erscheinung!\n@c0@"
  en: "@aTuppence@bG-Goodness me!\nI'm all aflutter!\n@c0@"
  es: "@aAlazar@b¡D-diosa mía!\n¡Tengo palpitaciones!\n@c0@"
  fr: "@aInnocent@bP-Par la Déesseⓠ\nJ'ai le cœur qui bat la chamadeⓠ\n@c0@"
  it: "@aSimon@bSanta dea!\nSono emozionatissimo!\n@c0@"
  ja: "@a@bピピン「何か　ボク\n\tビビッと　きました！\n@c0@"
351:
  de: "@aSancho@bSi. Als deine Onkel Sancho zum ersten Mal hörte, dass Señora Griselda und meine junge Amigo verheiratet sind, war das eine ziemlisse Schock!\n@c0@"
  en: "@aSancho@bSí. When your Uncle Sancho first hear that señora Debora and my young friend are husband and wife, ees, ees, ees esome kind of eshock!\n@c0@"
  es: "@aSancho@b¡Cuando tu tito Sancho se enteró de que la señora Stefania y tú erais marido y mujer, se quedó tieso como cactus!\n@c0@"
  fr: "@aSancho@bSi. Quand tonton Sancho a entendu pour la première f-fois que la señora P-Pandora et mon jeune amigo étaient m-mari et femme, ça été oun peu oun chocⓠ\n@c0@"
  it: "@aSancho@b¡Cuando ho saputo que la señora Viola y el mio chico sono mujer y marido, quasi no credevo a las mias orecchias!\n@c0@"
  ja: "@a@bサンチョ「私も　デボラ様が\n\t坊っちゃんの　奥様と聞いたときは\n\tしょうげきが　走りましたよ。\n@c0@"
352:
  de: "@aOtto@bⓞHaare auf den Zähnenⓟ? Mir würde das nichts ausmachen. Fräulein Griselda darf mit mir reden, wie es ihr beliebt!\n@c0@"
  en: "@aTuppence@bⓗEven more harshlyⓘ? I wouldn't mind that. Miss Debora can speak to me any which way she pleases!\n@c0@"
  es: "@aAlazar@b¿ⓕTodavía más bordeⓖ? No me importaría nada. ¡La signora Stefania puede hablarme como le apetezca!\n@c0@"
  fr: "@aInnocent@bⓥEncore plus durementⓦⓡ Ça ne me dérangerait pas. Mademoiselle Pandora peut bien me parler sur le ton qu'elle veutⓠ\n@c0@"
  it: "@aSimon@bLa regina Viola aveva modi persino più bruschi di quelli attuali?!\nNon credo che una cosa del genere sia possibile...\n@c0@"
  ja: "@a@bピピン「もっと　キツかったんですか？\n\tでも　ボク　デボラ様なら\n\tキツク言われても　平気です！\n@c0@"
353:
  de: "@aGriselda@bSie sind doch auch bisher ganz gut ohne dich zurechtgekommen, oder?\n@c0@"
  en: "@aDebora@bThey've managed fine without you up to now, right?\n@c0@"
  es: "@aStefania@bHasta ahora se las han arreglado senza te, ¿no?\n@c0@"
  fr: "@aPandora@bIls s'en sont bien sortis sans toi jusqu'à présent, nonⓡ\n@c0@"
  it: "@aViola@bIl Regno di Denim se l'è cavata egregiamente anche in tua assenza, caro.\n@c0@"
  ja: "@a@bデボラ「あんたが　いなくても\n\t今まで　平気だったんでしょ？\n@c0@"
354:
  de: "@aGriselda@bDann werden sie es auch weiterhin schaffen. Überlass einfach alles Bastl, dann können wir los.\n@c0@"
  en: "@aDebora@bSo they'll manage fine again now. Just leave Bertie to take care of things and let's go!\n@c0@"
  es: "@aStefania@bAllora se las arreglarán de nuevo. ¡Deja que Agila se encargue de todo y andiamo!\n@c0@"
  fr: "@aPandora@bAlors ils s'en sortiront bien aussi maintenant.\nLaisse Albert s'occuper de tout et allons-nous-enⓠ\n@c0@"
  it: "@aViola@bE se la caveranno anche questa volta.\nForza, saluta il principe Alberto, prepara i bagagli e partiamo!\n@c0@"
  ja: "@a@bデボラ「なら　今さらじゃないの。\n\t国は　オジロンに任せて\n\tさっさと　行きましょうよ。\n@c0@"
355:
  de: "@aGriselda@bDu hattest doch sowieso vor, deine Mutter zu retten, oder? Sancho braucht dir also gar nicht zu sagen, was du zu tun hast.\n@c0@"
  en: "@aDebora@bYou were already planning on rescuing your mother, right? You didn't need Sancho to tell you to.\n@c0@"
  es: "@aStefania@bTú ya estabas planeando el rescate la tua mamma, ¿no? No hacía falta que Sancho te lo dijese.\n@c0@"
  fr: "@aPandora@bTu avais de toute façon l'intention d'aller sauver\nta mère, n'est-ce pasⓡ Tu n'avais pas besoin que Sancho te le dise.\n@c0@"
  it: "@aViola@bSbaglierò, ma penso che hai già deciso di andare a salvare tua madre... Avresti anche potuto dirlo a Sancho. Di lui puoi fidarti.\n@c0@"
  ja: "@a@bデボラ「サンチョに　言われなくても\n\tあんたは　あんたのママを\n\t助けるつもりだったんでしょ？\n@c0@"
356:
  de: "@aGriselda@bApropos Sancho, meinst du nicht, wir sollten ihn bitten, wieder mitzukommen?\n@c0@"
  en: "@aDebora@bSpeaking of Sancho, don't you think we should ask him to come along?\n@c0@"
  es: "@aStefania@bHablando de Sancho, ¿no crees que deberíamos decirle que viniese con nosotros?\n@c0@"
  fr: "@aPandora@bÀ propos de Sancho, tu ne crois pas que nous devrions lui demander de nous accompagnerⓡ\n@c0@"
  it: "@aViola@bA proposito di Sancho, non credi che dovremmo chiedergli di venire con noi?\n@c0@"
  ja: "@a@bデボラ「ところで　サンチョは\n\tああ言ってるけど　連れていかないの？\n@c0@"
357:
  de: "@aGriselda@bJa, und du warst es, der es hat aufsteigen lassen!\n@c0@"
  en: "@aDebora@bYes, and you're the one who resurrected it!\n@c0@"
  es: "@aStefania@b¡Sí, y tú eres quien lo resucitó, ¿vero?!\n@c0@"
  fr: "@aPandora@bOui, et c'est toi qui l'a ramené à la vieⓠ\n@c0@"
  it: "@aViola@bIl Castello di Zenithia è tornato in cielo, e il merito è tutto tuo!\n@c0@"
  ja: "@a@bデボラ「復活したんじゃなくて\n\t%a000090が　復活させたんでしょ？\n@c0@"
358:
  de: "@aGriselda@bWillst du ihm nicht sagen, dass das alles dein Verdienst war, und dir die Lorbeeren abholen?\n@c0@"
  en: "@aDebora@bDon't you want to tell him and take the credit?\n@c0@"
  es: "@aStefania@b¡Tienes que decírselo! ¡El mérito es tuyo, ¿capisci?!\n@c0@"
  fr: "@aPandora@bTu ne veux pas le lui dire pour recevoir\ntous les élogesⓡ\n@c0@"
  it: "@aViola@bDiglielo, caro!\nAvanti, non fare il modesto...\n@c0@"
  ja: "@a@bデボラ「あんた　そこのところを\n\tきちんと　説明してないわけ？\n@c0@"
359:
  de: "@aGriselda@bDieser Thron sieht ganz schön gemütlich aus, findest du nicht?\n@c0@"
  en: "@aDebora@bThat throne looks nice and comfortable,\r\ndon't you think?\n@c0@"
  es: "@aStefania@bEse trono parece veramente cómodo, ¿no?\n@c0@"
  fr: "@aPandora@bCe trône m'a l'air bien confortable,\ntu ne trouves pasⓡ\n@c0@"
  it: "@aViola@bIl trono di Denim sembra molto comodo...\n@c0@"
  ja: "@a@bデボラ「そういえば　あの玉座って\n\tすわり心地が　よさそうね。\n@c0@"
360:
  de: "@aGriselda@bEs wäre doch nett, darauf zu sitzen, wenn wieder Frieden in der Welt eingekehrt ist.\n@c0@"
  en: "@aDebora@bCould be a nice place to spend the day once the world's at peace again.\n@c0@"
  es: "@aStefania@bCuando la pace vuelva al mundo, no me importaría pasarme tutto il giorno en él.\n@c0@"
  fr: "@aPandora@bÇa pourrait être un endroit agréable où passer la journée une fois que le monde sera de nouveau\r\nen paix.\n@c0@"
  it: "@aViola@bSono certa che ti ci troverai bene quando, una volta finita la nostra avventura, potrai finalmente sedertici sopra stabilmente.\n@c0@"
  ja: "@a@bデボラ「平和になったら\n\tあそこに１日　すわってるのも\n\t悪くなさそうね。\n@c0@"
361:
  de: "@aGriselda@bDieser Raum ist fast genauso schön wie mein altes Zimmer in Mostroferrato.\n@c0@"
  en: "@aDebora@bThis room's almost on a par with my old room\r\nin Mostroferrato.\n@c0@"
  es: "@aStefania@bEsta stanza es casi del mismo nivel que mi antigua stanza en Mostroferrato.\n@c0@"
  fr: "@aPandora@bCette pièce vaut presque mon ancienne chambre\r\nà Mostroferrato.\n@c0@"
  it: "@aViola@bQuesta stanza non è affatto malvagia...\nCon qualche ritocchino agli arredi e alla tappezzeria, sarà assolutamente perfetta.\n@c0@"
  ja: "@a@bデボラ「サラボナの　自宅もいいけど\n\tこの部屋も　悪くないわね。\n@c0@"
362:
  de: "@aGriselda@bEs ist ganz normal, dass sie sich freuen. Schließlich ist ihr wahrer Herrscher zurückgekehrt...\n@c0@"
  en: "@aDebora@bIt's natural that they'd be pleased now their true leader has returned.\n@c0@"
  es: "@aStefania@bEs normale que estén encantados de que haya regresado su verdadera líder.\n@c0@"
  fr: "@aPandora@bC'est normal qu'ils soient contents, maintenant que leur véritable souverain est revenu.\n@c0@"
  it: "@aViola@bTutti sono felici perché il Re di Denim è tornato a casa. Beh, probabilmente i sudditi di sesso maschile sono più contenti di rivedere me...\n@c0@"
  ja: "@a@bデボラ「自分たちの　仕える主が\n\t戻ってきたんだから\n\t当然のことよね。\n@c0@"
363:
  de: "@aGriselda@bDu wirst doch nicht etwa auch anfangen zu weinen, oder, %a000090?\n@c0@"
  en: "@aDebora@bYou're not joining in with her tears there,\nare you, %a000090?\n@c0@"
  es: "@aStefania@bNo te vas a poner a llorar tú también, ¿capisci, %a000090?\n@c0@"
  fr: "@aPandora@bTu ne vas pas te mettre à pleurer aussi, j'espère, %a000090ⓡ\n@c0@"
  it: "@aViola@bE tu non ti commuovi, %a000090?\nBravo! Vedo che stai imparando a fare il duro!\nCosì mi piaci!\n@c0@"
  ja: "@a@bデボラ「あらまあ　%a000090？\n\tもらい泣きしてるの？\n@c0@"
364:
  de: "@aGriselda@bOh! Wir lassen %a001250 doch nicht etwa zurück, oder?\n@c0@"
  en: "@aDebora@bOh! We're not leaving %a001250 behind, are we?\n@c0@"
  es: "@aStefania@b¡Eh! ¡No pensarás dejar aquí a %a001250, ¿vero?!\n@c0@"
  fr: "@aPandora@bOhⓠ On ne laisse pas %a001250 derrière nous, quand mêmeⓡ\n@c0@"
  it: "@aViola@bNon mi dirai che hai intenzione di lasciar qui %a001250, vero?!\n@c0@"
  ja: "@a@bデボラ「あら？　%a001250は　お留守番？\n@c0@"
365:
  de: "@aGriselda@b%0%a001240 ist der legendäre Held.\n@c0@"
  en: "@aDebora@b%0%a001240 is the legendary hero.\n@c0@"
  es: "@aStefania@b%0%a001240 veramente es el héroe legendario.\n@c0@"
  fr: "@aPandora@b%0%a001240 est le héros légendaire.\n@c0@"
  it: "@aViola@b%0%a001240 è l'Eroe Leggendario, ed è anche mio figlio.\n@c0@"
  ja: "@a@bデボラ「%a001240が　伝説の勇者ねえ。\n@c0@"
366:
  de: "@aGriselda@bUnd er ist mein Sohn. Noch irgendwelche Fragen?\n@c0@"
  en: "@aDebora@bAnd he's my son.\nSounds about right to me.\n@c0@"
  es: "@aStefania@bY es il mio bambino.\n¡Ovvio!\n@c0@"
  fr: "@aPandora@bEt c'est mon fils.\nÇa me paraît donc normal.\n@c0@"
  it: "@aViola@bDevo aggiungere altro?\n@c0@"
  ja: "@a@bデボラ「まあ　私の息子だし\n\t当然といえば　当然よね。\n@c0@"
367:
  de: "@a%0%a001240@bPapa! Hast du Mama nicht mehr gern oder so?\n@c0@"
  en: "@a%0%a001240@bDad! Don't you like being with Mum or something?\n@c0@"
  es: "@a%0%a001240@b¡Papá! ¿Es que no te gusta estar con mamá?\n@c0@"
  fr: "@a%0%a001240@bPapaⓠ Tu n'aimes pas être avec maman ou quoiⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, ma non ti fa piacere stare insieme a mamma?\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\tお母さんと　一緒じゃだめなの？\n@c0@"
368:
  de: "@a%0%a001240@bMir wäre es viel lieber, wenn sie mit uns käme.\n@c0@"
  en: "@a%0%a001240@bI'd much prefer it if she came with us.\n@c0@"
  es: "@a%0%a001240@bPreferiría que viniese con nosotros.\n@c0@"
  fr: "@a%0%a001240@bJe préférerais largement qu'elle vienne avec nous.\n@c0@"
  it: "@a%0%a001240@bIo vorrei che lei venisse con noi...\n@c0@"
  ja: "@a@b%a001240「ボクは　お母さんも\n\t一緒のほうが　いいよ！\n@c0@"
369:
  de: "@a%0%a001250@bWie funktioniert eure Beziehung? Was hast du Mama eigentlich damals versprochen?\n@c0@"
  en: "@a%0%a001250@bHow does your relationship work? What was it that you promised Mum all those years ago?\n@c0@"
  es: "@a%0%a001250@b¿Qué tal va vuestra relación? ¿Recuerdas lo que le prometiste a mamá hace tantos años?\n@c0@"
  fr: "@a%0%a001250@bComment fonctionne votre coupleⓡ Qu'est-ce que tu as promis à maman il y a toutes ces annéesⓡ\n@c0@"
  it: "@a%0%a001250@bMa una moglie non dovrebbe stare sempre accanto al marito? Il giorno che vi siete sposati, non le avevi promesso che non vi sareste mai separati?\n@c0@"
  ja: "@a@b%a001250「立場って？\n\tお父さん。　昔　お母さんと\n\tなにか約束したの？\n@c0@"
370:
  de: "@aSancho@bChico. Señora Griselda versucht nur, ihre Verlegenheit zu verbergen, weißt du.\n@c0@"
  en: "@aSancho@bEh, friend. Thees ees just señora Debora trying no to eshow the embarrassment, sí?\n@c0@"
  es: "@aSancho@b¡Eh!, amigo. ¿La señora Stefania te amenazaba o son cosas mías?\n@c0@"
  fr: "@aSancho@bHé, chico. La señora P-Pandora essaie juste de ne pas m-montrer qu'elle est embarrassée, noⓡ\n@c0@"
  it: "@aSancho@bChico, pienso che la señora Viola estia cercando de dirte que vorrebbe venire contigo...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！\n\tきっと　アレは　デボラ様なりの\n\t照れ隠しなんですよね！？\n@c0@"
371:
  de: "@aOtto@bHört sich fast so an, als sähe Fräulein Griselda in Euch nichts weiter als einen Dienⓚⓛ Ähm, nichts! Vergesst, was ich gesagt habe!\n@c0@"
  en: "@aTuppence@bIt sounds rather like Miss Debora thinks of you as some sort of servⓚⓛ\nEr, never mind! Forget I said anything!\n@c0@"
  es: "@aAlazar@bParece como si la signora Stefania os tomase por una especie de sirv... Eeeeh, ¡no importa! ¡Olvidadlo!\n@c0@"
  fr: "@aInnocent@bOn dirait assez que mademoiselle Pandora vous considère plutôt comme une sorte de domest...\nEuh, non, rienⓠ Oubliez ce que j'ai ditⓠ\n@c0@"
  it: "@aSimon@bMaestà, sbaglio o la regina Viola la considera una specie di servitore che deve ubbidienza totale e incondizionata alla sua padrona?!\n@c0@"
  ja: "@a@bピピン「もしかして　%a000090王って\n\tデボラ様の　しもべ……\n\tい　いえ！　なんでもないです！！\n@c0@"
372:
  de: "@a%0%a001240@bTreu ergeben? Was soll das denn heißen? Bedeutet das, dass du Mama beschützen möchtest?\n@c0@"
  en: "@a%0%a001240@bDevote yourself? To what?\nTo keeping Mum safe?\n@c0@"
  es: "@a%0%a001240@b¿Qué es lo que prometiste?\n¿Obediencia?\n@c0@"
  fr: "@a%0%a001240@bTe consacrerⓡ À quoiⓡ\nÀ protéger mamanⓡ\n@c0@"
  it: "@a%0%a001240@bQuando sposasti la mamma le promettesti che avresti esaudito qualsiasi suo desiderio?!\n@c0@"
  ja: "@a@b%a001240「つくすってなに？\n\t守ってあげるってこと？\n@c0@"
373:
  de: "@a%0%a001240@bWenn das so ist, bin ich ihr auch treu ergeben!\n@c0@"
  en: "@a%0%a001240@bIn that case, I'll devote myself to her too!\n@c0@"
  es: "@a%0%a001240@b¡Entonces, yo también se la prometeré!\n@c0@"
  fr: "@a%0%a001240@bDans ce cas, je vais m'y consacrer aussiⓠ\n@c0@"
  it: "@a%0%a001240@bAhia, papà!\nMi sa che ti sei messo proprio in un bel guaio...\n@c0@"
  ja: "@a@b%a001240「だったら　ボクも\n\tお母さんに　つくしてあげる！\n@c0@"
374:
  de: "@a%0%a001250@bÄhm, Papa... Du warst damals ganz schön verliebt in Mama, oder?\n@c0@"
  en: "@a%0%a001250@bUm, Dad... You were really head over heels in love with Mum, weren't you?\n@c0@"
  es: "@a%0%a001250@bMmm, papi... Tú estabas realmente loco por mamá, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bHum, papa... Tu étais vraiment fou d'amour pour maman, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bAccidenti, papà!\nCerto che devi volere un gran bene alla mamma, per averle fatto una promessa così impegnativa!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tお父さんって　なんだかんだ言っても\n\tお母さんに　ぞっこんだったんだね。\n@c0@"
375:
  de: "@aGriselda@bDieser Nimzo hat vielleicht Nerven, einfach so in meiner Welt Chaos zu verursachen!\n@c0@"
  en: "@aDebora@bThat Nimzo has some nerve, daring to cause havoc in my world!\n@c0@"
  es: "@aStefania@b¡Cómo se atreve ese Nimzo a venir al mio mondo a provocar el caos!\n@c0@"
  fr: "@aPandora@bCe Nimzo ne manque pas d'air pour oser semer le chaos dans mon mondeⓠ\n@c0@"
  it: "@aViola@bPurtroppo temo che non sia solo una storiella...\nIl mondo è davvero in pericolo.\n@c0@"
  ja: "@a@bデボラ「私が住む世界に\n\t手を出そうなんて　大魔王も\n\tいい根性してるわね。\n@c0@"
376:
  de: "@aGriselda@bAls wir das erste Mal hier waren, hatten wir nicht viel Gelegenheit, uns umzusehen.\n@c0@"
  en: "@aDebora@bWe didn't get to see this the first time we came.\n@c0@"
  es: "@aStefania@bLa prima volta que vinimos no vimos esto.\n@c0@"
  fr: "@aPandora@bNous n'avions pas vu ça la première fois que nous sommes venus ici.\n@c0@"
  it: "@aViola@bCaro, che ne diresti di fare giro?\n@c0@"
  ja: "@a@bデボラ「初めて　来た時は\n\tここは　見られなかったのよね。\n@c0@"
377:
  de: "@aGriselda@bAber jetzt schon! Los, ich möchte alles sehen!\n@c0@"
  en: "@aDebora@bWe should have a little look around now we've got the chance.\n@c0@"
  es: "@aStefania@bVeramente, deberíamos echar un ojo por aquí ya que tenemos ocasión.\n@c0@"
  fr: "@aPandora@bNous devrions faire un petit tour par ici, puisque nous en avons l'occasion.\n@c0@"
  it: "@aViola@bLa prima volta che venimmo qui non avemmo nemmeno il tempo di guardarci intorno...\n@c0@"
  ja: "@a@bデボラ「せっかくだから\n\t少し　見ていくのもいいわね。\n@c0@"
378:
  de: "@aGriselda@bHa ha! Tja, meine Schönheit löst oft solche Begeisterungsstürme aus...\n@c0@"
  en: "@aDebora@bHa ha! My beauty's always having this kind of effect on people.\n@c0@"
  es: "@aStefania@b¡Ja, ja! La mia bellezza siempre provoca esta reacción en la gente.\n@c0@"
  fr: "@aPandora@bHa haⓠ Ma beauté fait toujours ce genre\nd'effet aux gens.\n@c0@"
  it: "@aViola@bUn'altra vittima della mia sfolgorante bellezza.\nAh, sono irresistibile...\nE tu sei l'uomo più invidiato del mondo, caro.\n@c0@"
  ja: "@a@bデボラ「まあ　私の美しさなら\n\t当然のことよね。\n@c0@"
379:
  de: "@aGriselda@bIch habe zwar keine große Lust, durch die Weltgeschichte zu wandern, aber ich werde die Zähne zusammenbeißen und es ertragen.\n@c0@"
  en: "@aDebora@bI'm not keen on having to walk about the place, but I suppose I'll just grin and bear it.\n@c0@"
  es: "@aStefania@bNon mi piace molto tener que pasearme a pie por ahí, pero lo soportaré con una sonrisa.\n@c0@"
  fr: "@aPandora@bJe n'ai pas très envie de continuer à arpenter les chemins, mais je suppose que je vais continuer à serrer les dents et à le supporter.\n@c0@"
  it: "@aViola@bSpero non ci sarà troppo da camminare, %a000090. Sai che al primo segno di stanchezza dovrai portarmi in braccio, vero?\n@c0@"
  ja: "@a@bデボラ「私を歩かせるのが\n\t気に入らないけど　まあ　いいわ。\n@c0@"
380:
  de: "@aGriselda@bIch habe nie so viel getrunken, dass ich davon Kopfschmerzen hatte. Also kann ich auch kein Mitleid mit dem Kerl haben.\n@c0@"
  en: "@aDebora@bI've never drunk to the point that it's given me a headache, so I can't really sympathise with how bad it feels.\n@c0@"
  es: "@aStefania@bNunca he bebido hasta tener mal di testa, así que no puedo compadecerle troppo.\n@c0@"
  fr: "@aPandora@bJe n'ai jamais bu au point d'avoir mal au crâne,\r\nalors j'ai du mal à compatir avec la douleur\r\nque ça provoque.\n@c0@"
  it: "@aViola@bVado sempre a letto presto per godermi il mio bel sonno di bellezza, quindi non so come si senta quel tipo. Però è colpa sua se si è ridotto in quello stato!\n@c0@"
  ja: "@a@bデボラ「飲みすぎて頭が痛い？\n\tなったことが　ないから\n\tどれだけ　つらいのか分からないわね。\n@c0@"
381:
  de: "@aGriselda@bWie es scheint, haben Väter überall auf der Welt zu viel zu sagen...\n@c0@"
  en: "@aDebora@bIt seems that fathers the world over have too much to say for themselves.\n@c0@"
  es: "@aStefania@bSembra que todos los padres del mondo tienen demasiadas cosas que decir.\n@c0@"
  fr: "@aPandora@bApparemment, tous les pères du monde ont\r\nun peu trop leur mot à dire. \n@c0@"
  it: "@aViola@bCerca di star sempre vicino ai tuoi figli, %a000090, altrimenti scoprirai a tue spese che belva divento quando mi arrabbio sul serio!\n@c0@"
  ja: "@a@bデボラ「パパってのは　どこの家も\n\tクチうるさいみたいね。\n@c0@"
382:
  de: "@aGriselda@bIch werde mich nie daran gewöhnen können, wie ungewöhnlich Humburg ist.\n@c0@"
  en: "@aDebora@bI can never quite get over how unusual Gotha is.\n@c0@"
  es: "@aStefania@bNo me acostumbraré jamás a Pankrazⓓ qué sitio más strano.\n@c0@"
  fr: "@aPandora@bJe n'arrive pas vraiment à me débarrasser de l'impression d'étrangeté que me donne Gotha.\n@c0@"
  it: "@aViola@bAncora non mi sono abituata a vivere a Denim.\nQuesto posto è davvero particolare...\n@c0@"
  ja: "@a@bデボラ「いつ見ても　この町並みって\n\tやっぱり　変わってるわね。\n@c0@"
383:
  de: "@aGriselda@bWarum freust du dich eigentlich nicht so, wenn du mich siehst?\n@c0@"
  en: "@aDebora@bYou can get excited like that too if you want.\n@c0@"
  es: "@aStefania@bTu también puedes emocionarte così, si quieres.\n@c0@"
  fr: "@aPandora@bTu peux aussi être tout excité toi aussi, si tu veux.\n@c0@"
  it: "@aViola@bBah...\nHo ricevuto accoglienze ben più entusiastiche.\nComunque, grazie per la dimostrazione d'affetto...\n@c0@"
  ja: "@a@bデボラ「あんたも　あんなふうに\n\tよろこんでも　いいのよ？\n@c0@"
384:
  de: "@aGriselda@bIch kann mich kaum an die Zeit erinnern. Es kommt mir jedenfalls nicht wie zehn Jahre vor...\n@c0@"
  en: "@aDebora@bI hardly remember anything about it, so it doesn't feel like ten years at all.\n@c0@"
  es: "@aStefania@bApenas tengo recuerdos de ese tiempo, así que no parecen dieci anni en absoluto.\n@c0@"
  fr: "@aPandora@bJe ne me rappelle presque rien, alors je n'ai pas l'impression que dix ans ont passé.\n@c0@"
  it: "@aViola@bÈ vero: dopo dieci anni, l'arredamento del castello sarà tutto da rinnovare. Caro, dammi mille monete...\nNo, dammene duemila. Uhm, forse è meglio cinquemila...\n㈡\nBeh, dammi tutta la borsa, che facciamo prima...\n@c0@"
  ja: "@a@bデボラ「ほとんど　覚えてないから\n\t１０年も　たった実感が　ないのよね。\n@c0@"
385:
  de: "@aGriselda@bIch glaube, er könnte einen ganz zuverlässigen Diener abgeben. Nimm ihn mit, %a000090.\n@c0@"
  en: "@aDebora@bHe seems like he'd make a good servant.\nLet's take him along, %a000090.\n@c0@"
  es: "@aStefania@bSembra que será un buen sirviente.\nVamos a llevarlo con nosotros, %a000090.\n@c0@"
  fr: "@aPandora@bIl a l'air de pouvoir faire un bon domestique. Emmenons-le avec nous, %a000090.\n@c0@"
  it: "@aViola@bSono certa che ci sarà utile, %a000090.\nTi consiglio di portarlo con noi.\nAnzi, te lo ordino.\n@c0@"
  ja: "@a@bデボラ「この男　しもべに　向いていそうね。\n\tねえ　%a000090　連れてきましょうよ。\n@c0@"
386:
  de: "@aGriselda@bEs ist schon spät. Lass uns morgen weitermachen und ein wenig schlafen.\n@c0@"
  en: "@aDebora@bIt's getting late. Let's postpone going out until tomorrow and get some sleep.\n@c0@"
  es: "@aStefania@bSe está haciendo tarde. Vamos a retrasar la salida hasta mañana y a dormire un poco.\n@c0@"
  fr: "@aPandora@bIl se fait tard. Remettons à demain le retour\r\nà la maison et allons dormir un peu.\n@c0@"
  it: "@aViola@bS'è fatto tardi, caro. Su, fai il bravo bambino e andiamo a nanna. Non vorrai farmi rinunciare al mio sonno di bellezza, vero?!\n@c0@"
  ja: "@a@bデボラ「もう夜だし　出かけるのは\n\t明日にして　今日はもう寝たいわ。\n@c0@"
387:
  de: "@aGriselda@bEs ist schon fast ein wenig zu ruhig hier. Wo sind denn alle?\n@c0@"
  en: "@aDebora@bIt's almost a little bit too quiet.\nI wonder where everyone is.\n@c0@"
  es: "@aStefania@bEsto está troppo tranquilo.\n¿Dónde estará tutto il mondo?\n@c0@"
  fr: "@aPandora@bC'est presque un peu trop calme. Je me demande\r\noù tout le monde est passé.\n@c0@"
  it: "@aViola@bChe silenzio...\n@c0@"
  ja: "@a@bデボラ「恐ろしいほど　静かね。\n\tみんな　どこかに　行ったのかしら？\n@c0@"
388:
  de: "@aGriselda@bEine ⓞAugenweideⓟ? Das lasse ich mal als Synonym für ⓞSchönheitⓟ gelten...\n@c0@"
  en: "@aDebora@bⓗA fine specimenⓘ? I take it he meant to call me\na beauty.\n@c0@"
  es: "@aStefania@b¿ⓕUn verdadero monumentoⓖ? Supongo que quería decir una bellezza.\n@c0@"
  fr: "@aPandora@bⓥUn beau brin de femmeⓦⓡ De sa part, je suppose que ça voulait dire que je suis une beauté.\n@c0@"
  it: "@aViola@bⓕCorpicino perfettamente proporzionatoⓖ?!\nTutto qui?!\n㈡\nMa non ha visto il mio volto angelico? I miei occhi profondi e lo sguardo intenso? La pelle di seta?\nMi fermo qui, perché non c'è più spazio...\n@c0@"
  ja: "@a@bデボラ「かわいい？\n\t美人の　まちがいでしょ。\n@c0@"
389:
  de: "@aGriselda@bEs war mitten in der Nacht, als ich damals entführt wurde, weißt du noch?\n@c0@"
  en: "@aDebora@bIt was the middle of the night when I was snatched, come to think of it.\n@c0@"
  es: "@aStefania@bAhora que lo pienso, a mí secuestraron en mezzo de la notte.\n@c0@"
  fr: "@aPandora@bMaintenant que j'y pense, c'est au milieu de la nuit que j'ai été enlevée.\n@c0@"
  it: "@aViola@bEra notte fonda quando fui rapita...\nNon dimenticherò mai quel momento, nemmeno se vivessi mille anni...\n@c0@"
  ja: "@a@bデボラ「そういえば　私がさらわれたのって\n\t深夜だったわね。\n@c0@"
390:
  de: "@aGriselda@bAm besten schläfst du bei mir, wenn du nicht möchtest, dass das noch mal passiert. Aber auf dem Boden bitte...\n@c0@"
  en: "@aDebora@bYou'd better sleep next to me if you're worried it might happen again. You'll be on the floor, naturally.\n@c0@"
  es: "@aStefania@bSi te preocupa que me pase otra vez, será mejor que duermas cerca di me. Ma en el suelo, naturalmente.\n@c0@"
  fr: "@aPandora@bTu ferais mieux de dormir près de moi si tu as peur que ça se reproduise. Tu dormiras par terre, évidemment.\n@c0@"
  it: "@aViola@bÈ per questo che esigo che tu dorma sempre con me: così potrai proteggermi in caso a qualche altro mostro venga in mente di portarmi via.\n@c0@"
  ja: "@a@bデボラ「私が　また　さらわれるのが\n\t心配だったら　そばで寝ていいわ。\n\tもちろん　あんたは床よ。\n@c0@"
391:
  de: "@aGriselda@bSie ist eine ganz passable Köchin, nicht wahr?\n@c0@"
  en: "@aDebora@bShe's not a bad cook, is she?\n@c0@"
  es: "@aStefania@bNo es mala cocinera, ¿vero?\n@c0@"
  fr: "@aPandora@bElle n'est pas mauvaise cuisinière, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bPerò!\nNiente male come cuoca, eh?\n@c0@"
  ja: "@a@bデボラ「このおばさんの料理って\n\tけっこう　おいしいのよね～。\n@c0@"
392:
  de: "@aGriselda@bIch glaube, Papas Koch könnte noch eine Menge von ihr lernen...\n@c0@"
  en: "@aDebora@bI reckon she could show Papa's chef a thing or two.\n@c0@"
  es: "@aStefania@bCreo que podría dar unas cuantas lezioni al chef del mio papino.\n@c0@"
  fr: "@aPandora@bJe parie qu'elle pourrait apprendre une chose ou deux au cuisinier de papa.\n@c0@"
  it: "@aViola@bCaro, chiedile di darti qualcuna delle sue ricette, così potrai prepararmi dei deliziosi manicaretti quando ti ordinerò di farmi da mangiare.\n@c0@"
  ja: "@a@bデボラ「パパのところの\n\t料理人と　いい　勝負よ。\n@c0@"
393:
  de: "@aGriselda@bEr war doch früher auch schon dabei, warum sollte er denn jetzt nicht mitkommen?\n@c0@"
  en: "@aDebora@bHe's been along with us before, so I don't see the problem in having him with us again, personally.\n@c0@"
  es: "@aStefania@bYa ha venido otras veces con nosotrosⓓ no veo qué problema hay en que venga una altra volta.\n@c0@"
  fr: "@aPandora@bIl nous a déjà accompagné par le passé, alors personnellement, je ne vois pas de problème\r\nà ce qu'il vienne avec nous.\n@c0@"
  it: "@aViola@b%0%a001240 ci ha già accompagnati in passato, quindi non vedo alcun problema nel farlo venire ancora con noi. Dico bene, no?\n@c0@"
  ja: "@a@bデボラ「今まで　連れてたんなら\n\tまた　連れてってもいいと\n\t私は　思うけど。\n@c0@"
394:
  de: "@aGriselda@bOh! Wir lassen %a001250 doch nicht etwa zurück, oder?\n@c0@"
  en: "@aDebora@bOh! We're not leaving %a001250 behind, are we?\n@c0@"
  es: "@aStefania@b¡Eh! ¡No pensarás dejar aquí a %a001250, ¿vero?!\n@c0@"
  fr: "@aPandora@bOhⓠ On ne laisse pas %a001250 derrière nous, quand mêmeⓡ\n@c0@"
  it: "@aViola@bNon mi dirai che hai intenzione di lasciar qui %a001250, vero?!\n@c0@"
  ja: "@a@bデボラ「あら？　%a001250は　お留守番？\n@c0@"
395:
  de: "@aGriselda@bEr könnte wenigstens versuchen, etwas Schönes zu träumen!\n@c0@"
  en: "@aDebora@bHe could at least try to have happy dreams!\n@c0@"
  es: "@aStefania@b¡Al menos podría intentar tener sogni felices!\n@c0@"
  fr: "@aPandora@bIl pourrait au moins essayer de faire\ndes rêves joyeuxⓠ\n@c0@"
  it: "@aViola@bPovero Sancho...\n@c0@"
  ja: "@a@bデボラ「せめて　夢くらい\n\tいい夢を見なさいよ。\n@c0@"
396:
  de: "@aGriselda@bManchmal benimmt sich Sancho wie ein alter Mann. Immer erzählt er nur von früher...\n@c0@"
  en: "@aDebora@bSancho's like an old man sometimes, going on and on about the past.\n@c0@"
  es: "@aStefania@bA veces Sancho es como un vecchio, siempre contando cosas del passato.\n@c0@"
  fr: "@aPandora@bSancho est un peu comme les personnes âgées, quand il n'arrête pas de parler du passé.\n@c0@"
  it: "@aViola@bSancho è un tipo simpatico.\nCerto, sarebbe ancora più simpatico se ogni tanto la smettesse di pensare al passato!\n@c0@"
  ja: "@a@bデボラ「昔のことを　語りだすなんて\n\tサンチョも　もう　トシなのね。\n@c0@"
397:
  de: "@a%0%a001250@bNachts habe ich immer ein wenig Angst in der Burg. Es heißt, dass Mama nachts entführt wurde.\n@c0@"
  en: "@a%0%a001250@bThe castle's a bit scary of a night. People say it was night-time when Mum was kidnapped.\n@c0@"
  es: "@a%0%a001250@bEl castillo da un poco de miedo por la noche. Dicen que a mamá la secuestraron por la noche.\n@c0@"
  fr: "@a%0%a001250@bLe château fait un peu peur, la nuit. Les gens disent que c'est pendant la nuit que maman a été enlevée.\n@c0@"
  it: "@a%0%a001250@bQuand'è buio, il castello mi mette paura.\nHo sentito dire che la mamma fu rapita di notte...\n@c0@"
  ja: "@a@b%a001250「夜のお城って　少し　こわい。\n\tお母さんが　さらわれたのも\n\t夜だって　聞いたし……。\n@c0@"
398:
  de: "@aNera@bDu darfst dir keine Sorgen machen, %a001250. Ich bleibe jetzt für immer bei euch, versprochen.\n@c0@"
  en: "@aNera@bYou mustn't worry yourself, %a001250.\nI won't leave you again, I promise.\n@c0@"
  es: "@aNera@bNon ti preoccupare, %a001250.\nTe juro que nunca volveré a abandonarte.\n@c0@"
  fr: "@aNera@bTu ne dois pas avoir peur, %a001250.\nJe ne partirai plus, promis.\n@c0@"
  it: "@aNera@bStai tranquilla, %a001250.\nNon ti lascerò più.\nParola di mamma!\n@c0@"
  ja: "@a@bフローラ「大丈夫よ　%a001250。\n\tこれからは　お母さんが\n\tずっと　いっしょに　いるわ。\n@c0@"
