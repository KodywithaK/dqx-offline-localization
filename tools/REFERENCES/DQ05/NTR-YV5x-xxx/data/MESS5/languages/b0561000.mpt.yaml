  ja: "@a@b%a001250「ねえ　お父さん。\n\tわたしも　お母さんと\n\tいっしょが　いいな……。\n@c0@"
107:
  de: "@aBianca@bWenn wir alle bereit sind, kann es ja losgehen.\nAuf zur Unterwelt und zu deiner Mutter!\n@c0@"
  en: "@aBianca@bNow we're all ready, it's time we got goin'.\r\nOff to the underworld to find your mum!\n@c0@"
  es: "@aBianca@bYa que estamos listos, va siendo hora de irnos.\n¡Al inframundo a buscar a tu madre!\n@c0@"
  fr: "@aBianca@bMaintenant que nous sommes tous prêts,\nil est temps d'y aller. Direction le monde\nsouterrain pour retrouver ta mèreⓠ\n@c0@"
  it: "@aBianca@bDirei che siamo pronti per partire.\nSi va nel Regno degli Inferi per salvare tua madre!\n@c0@"
  ja: "@a@bビアンカ「さあ　決めたからには\n\t急ぎましょ　%a000090。\n\tお母さまのいる　暗黒の魔界へ。\n@c0@"
108:
  de: "@a%0%a001240@bDu bist klasse, Papa! Ich wusste, dass du versuchen würdest, Großmutter zu retten, sobald sich die Gelegenheit ergibt!\n@c0@"
  en: "@a%0%a001240@bYou're cool, Dad! I always knew you'd go off and rescue Grandma as soon as you had the chance.\n@c0@"
  es: "@a%0%a001240@b¡Eres increíble, papi! Siempre supe que irías a rescatar a la abuela en cuanto se te presentara la oportunidad.\n@c0@"
  fr: "@a%0%a001240@bT'es génial, papaⓠ J'ai toujours su que tu irais sauver grand-mère dès que tu en aurais l'occasion.\n@c0@"
  it: "@a%0%a001240@bPapà, sei un mito!\nHo sempre saputo che saresti andato a cercare la nonna e che non l'avresti abbandonata!\n@c0@"
  ja: "@a@b%a001240「さっすが　お父さん！\n\tお父さんなら　絶対に　おばあちゃんを\n\t助けに行くって　思ってたんだ！\n@c0@"
109:
  de: "@a%0%a001250@bGlaubst du, dass es in der Unterwelt dunkel und unheimlich ist? Na, selbst wenn, wir müssen dorthin. Wir müssen Großmutter retten.\n@c0@"
  en: "@a%0%a001250@bDo you think it's all dark and scary in the underworld? Even if it is, we have to go.\nWe have to save Grandma.\n@c0@"
  es: "@a%0%a001250@b¿Crees que el inframundo es oscuro y tenebroso? Aunque lo sea, tenemos que ir.\nDebemos salvar a la abuela.\n@c0@"
  fr: "@a%0%a001250@bTu crois que tout est sombre et terrifiant dans le monde souterrainⓡ De toute façon, même si c'est\nle cas, on doit y aller pour sauver grand-mère.\n@c0@"
  it: "@a%0%a001250@bChissà se il Regno degli Inferi è un posto buio e sinistro come il nome suggerisce...\n㈡\nAh, non importa!\nAnche se lo fosse, ci andremmo comunque, perché dobbiamo salvare la nonna! \n@c0@"
  ja: "@a@b%a001250「暗黒の魔界って\n\tやっぱり　暗いかな……。　でも\n\tおばあちゃんを助けるまで　がんばる。\n@c0@"
110:
  de: "@aSancho@bEs ist keine leisste Entscheidung, eh, Chico? Du lässt dein Königreiss und dein Volk zurück.\n@c0@"
  en: "@aSancho@bEes no an easy decision to make, sí?\nTo leave your kingdom and your people behind.\n@c0@"
  es: "@aSancho@bEs una decisión bien complicada.\nAbandonar nuestro reino y a nuestra gente.\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas oune décision f-facile que tu as prise, en choisissant de quitter ton r-royaume\r\net tes sujets.\n@c0@"
  it: "@aSancho@bChico, pienso que hai fatto bien a decidere de partire por salvare la señora Mada.\n@c0@"
  ja: "@a@bサンチョ「%a000090王\n\t民をのこして　国を　はなれること…\n\tなやまれたでしょう。\n@c0@"
111:
  de: "@aSancho@bSi. Señor Ludwig, er war aus die gleisse Holz geschnitzt.\n@c0@"
  en: "@aSancho@bSí. Señor Pankraz, he was een the esame galleon.\n@c0@"
  es: "@aSancho@bSí. Pues, el señor Teudis estuvo en el mismo barco.\n@c0@"
  fr: "@aSancho@bSi. Le señor P-Petros, il a c-connu le même dilemme.\n@c0@"
  it: "@aSancho@bEl señor Russel fece la misma cosa...\n@c0@"
  ja: "@a@bサンチョ「パパスさまも\n\t同じ　お気持ちでしたでしょうね。\n@c0@"
112:
  de: "@aOtto@bHumburg ist wirklich der schönste Ort auf der ganzen Welt!\n@c0@"
  en: "@aTuppence@bGotha really is the most splendid place to be.\n@c0@"
  es: "@aAlazar@bPankraz es un sitio espléndido.\n@c0@"
  fr: "@aInnocent@bGotha est vraiment le plus bel endroit où vivre.\n@c0@"
  it: "@aSimon@bDenim, terra del mio cuoreeeh... Ⓠ\nNon ti voglio abbandonareeeh... Ⓡ\n@c0@"
  ja: "@a@bピピン「グランバニアって\n\tいいですよねえ……。\n@c0@"
113:
  de: "@aOtto@bOh, Entschuldigung. Das soll natürlich net heißen, dass ich Euch net begleiten möcht', Eure Majestät!\n@c0@"
  en: "@aTuppence@bEr, sorry! I didn't mean I don't want to join you on your travels, Your Majesty!\n@c0@"
  es: "@aAlazar@b¡Eeeh, lo siento! ¡No quise decir que no quisiera unirme a su expedición, Majestad!\n@c0@"
  fr: "@aInnocent@bEuh, pardonⓠ Je ne voulais pas dire que je n'avais pas envie de partir avec vous, Votre Majestéⓠ\n@c0@"
  it: "@aSimon@bEhm, Maestà...\nEra solo una canzoncina innocente, sa?\n㈡\nNon era assolutamente mia intenzione darle l'idea di non volerla accompagnare nel suo prossimo viaggio...\n@c0@"
  ja: "@a@bピピン「あっ！　%a000090王と\n\t旅に出たくないって　言ってるワケじゃ\n\tないですからね！\n@c0@"
114:
  de: "@aBianca@bGanz egal, was der alte Bastl sagt. Ich bin mir sicher, dass er tief in seinem Herzen weiß, dass du gehen musst.\n@c0@"
  en: "@aBianca@bNo matter what old Bertie might say, I'm sure that deep down he knows you have to leave.\n@c0@"
  es: "@aBianca@bDa igual lo que diga el viejo Agila, seguro que en su interior sabe que tienes que irte.\n@c0@"
  fr: "@aBianca@bQuoi qu'Albert puisse dire, je suis sûre qu'au fond,\r\nil sait que tu dois partir.\n@c0@"
  it: "@aBianca@bIn cuor loro, tutti i sudditi di Denim condividono la tua scelta di partire, ne sono certa.\n@c0@"
  ja: "@a@bビアンカ「きっと　オジロンさんは\n\tクチでは　ああ言っても　心では\n\t旅立ちを　許してくれてるのよ。\n@c0@"
115:
  de: "@aBianca@bIch frage mich, was mit unserer Welt geschieht, wenn der Großmeister tatsächlich aus der Unterwelt hervorkommt...\n@c0@"
  en: "@aBianca@bI wonder what'll happen to our world if the Grandmaster comes rampagin' out from the underworld.\n@c0@"
  es: "@aBianca@bMe pregunto qué sucedería en nuestro mundo si el Gran Maestro escapara del inframundo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande ce qui arrivera au monde si le\r\nGrand Maître sort des Enfers pour tout ravager.\n@c0@"
  it: "@aBianca@bChissà cosa accadrebbe se il Gran Maestro sbucasse fuori dal Regno degli Inferi e attaccasse il nostro mondo...\n@c0@"
  ja: "@a@bビアンカ「闇の世界から　大魔王が\n\t来たりしたら　私たちの\n\tこの世界は　どうなるのかしら？\n@c0@"
116:
  de: "@aBianca@bNa, da halten wir ihn doch besser auf, bevor es so weit ist, was, %a000090?\n@c0@"
  en: "@aBianca@bWe'd better put a stop to him before it comes to that, eh, %a000090?\n@c0@"
  es: "@aBianca@bMejor pararle los pies antes de que lo intente, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bOn ferait mieux de l'arrêter avant que ça n'arrive, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNo! Non voglio scoprirlo!\nDobbiamo fermarlo prima che si verifichi una tale catastrofe, %a000090!\n@c0@"
  ja: "@a@bビアンカ「%a000090。\n\tそんなことになる前に　絶対\n\t私たちで　食いとめましょ！\n@c0@"
117:
  de: "@aNera@bWenn ich nur daran denke, dass deine arme Mutter diese Kreatur ganz alleine in Schach hält...\n@c0@"
  en: "@aNera@bTo think that your poor mother is having to hold that creature back all by herself.\n@c0@"
  es: "@aNera@bLa tua mamma se tiene que encargar ella sola de retener a esa criatura.\n@c0@"
  fr: "@aNera@bDire que ta pauvre mère doit contenir cette créature toute seule.\n@c0@"
  it: "@aNera@bTua madre sta facendo di tutto per trattenere quella creatura malefica nell'inferno a cui appartiene...\n㈡\nLa coraggiosa Mada sta lottando da sola contro il signore della malvagità!\n@c0@"
  ja: "@a@bフローラ「その　大魔王を\n\tあなたのお母さまは　ひとりで\n\tおさえているんでしょ？\n@c0@"
118:
  de: "@aNera@bWir müssen uns beeilen und ihr helfen!\n@c0@"
  en: "@aNera@bWe have to hurry to her and help her!\n@c0@"
  es: "@aNera@b¡Ay, habrá que ir prestissimo y salvarla!\n@c0@"
  fr: "@aNera@bIl faut se dépêcher d'aller l'aider.\n@c0@"
  it: "@aNera@bDobbiamo correre in suo aiuto!\n@c0@"
  ja: "@a@bフローラ「はやく　助けてあげたいわね。\n@c0@"
119:
  de: "@a%0%a001240@bDieser Großmeister der Unterwelt... Er ist es doch, der Großmutter solchen Kummer macht, nicht?\n@c0@"
  en: "@a%0%a001240@bThe Grandmaster of the Underworld... He's the one who's making Grandma suffer.\n@c0@"
  es: "@a%0%a001240@bEl Gran Maestro del Inframundo... Es el culpable del sufrimiento de la abuela.\n@c0@"
  fr: "@a%0%a001240@bLe Grand Maître des Enfers... C'est lui qui fait souffrir grand-mère.\n@c0@"
  it: "@a%0%a001240@bIl Gran Maestro degli Inferi è l'essere odioso che sta facendo soffrire la nonna, non è vero?\n@c0@"
  ja: "@a@b%a001240「闇の世界の　大魔王……。\n\tそいつが　おばあちゃんを\n\t苦しめてるんだね。\n@c0@"
120:
  de: "@a%0%a001240@bWir müssen ihn besiegen und sie retten, Papa. Ich weiß, dass wir es schaffen!\n@c0@"
  en: "@a%0%a001240@bWe have to defeat him and rescue her, Dad.\nI know we can do it!\n@c0@"
  es: "@a%0%a001240@bPapá, tenemos que derrotarle y rescatar a la abuela.\n¡Sé que podemos lograrlo!\n@c0@"
  fr: "@a%0%a001240@bIl faut le battre et la sauver, papa.\nJe sais qu'on peut y arriverⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, dobbiamo sconfiggerlo!\nSe saremo uniti, ci riusciremo!\nNe sono certissimissimo!\n@c0@"
  ja: "@a@b%a001240「お父さん　がんばろうね。\n\t絶対　大魔王を　たおして\n\tおばあちゃんを　つれて帰ろうね。\n@c0@"
121:
  de: "@a%0%a001250@bMonster machen mir keine Angst, aber dieser Großmeister der Unterwelt ist schon zum Fürchten...\n@c0@"
  en: "@a%0%a001250@bI'm not scared of monsters, but I don't like the Grandmaster of the Underworld. He sounds\nreally mean.\n@c0@"
  es: "@a%0%a001250@bLos monstruos no me asustan, pero no me gusta el Gran Maestro del Inframundo. Parece muy malvado.\n@c0@"
  fr: "@a%0%a001250@bJe n'ai pas peur des monstres, mais je n'aime pas ce Grand Maître des Enfers. Il a l'air vraiment méchant.\n@c0@"
  it: "@a%0%a001250@bIo non ho paura dei mostri, ma questo Gran Maestro degli Inferi mi fa venire i brividi solo a pronunciarne il nome!\n@c0@"
  ja: "@a@b%a001250「魔物さんは　こわくないの……。\n\tでも　大魔王は　キライ。\n\tわるいことばっかり　するから。\n@c0@"
122:
  de: "@a%0%a001250@bAlle Monster haben Angst vor ihm, weißt du. Er muss eine ganz abscheuliche Kreatur sein!\n@c0@"
  en: "@a%0%a001250@bAll the monsters are scared of him, you know.\nWhat a horrible creature he must be!\n@c0@"
  es: "@a%0%a001250@bTodos los monstruos le temen, ¿sabes?\n¡Qué asco de bicho!\n@c0@"
  fr: "@a%0%a001250@bTous les monstres ont peur de lui, tu sais.\nCe doit être une créature vraiment horribleⓠ\n@c0@"
  it: "@a%0%a001250@bI miei amici mostri mi hanno detto che persino i più forti e potenti tra loro temono quella creatura malvagia!\n㈡\nDobbiamo sconfiggerlo, altrimenti saranno guai per tutti!\n@c0@"
  ja: "@a@b%a001250「……魔物さんたちも\n\tみんな　こわがってるもん。\n\tもう許さないんだから……。\n@c0@"
123:
  de: "@aBianca@bIch hatte nie die Gelegenheit, mich auf der Burg umzusehen. Als ich vor all den Jahren hier war, habe ich die meiste Zeit im Bett verbracht!\n@c0@"
  en: "@aBianca@bI've never really had the chance to look around the castle much. When I was here all them years ago,\r\nI spent most of the time in bed!\n@c0@"
  es: "@aBianca@bNunca he tenido tiempo de echar un ojo por el castillo. ¡Cuando vine la última vez solo estuve en la cama!\n@c0@"
  fr: "@aBianca@bJe n'ai jamais vraiment eu l'occasion de faire le tour du château. Quand nous sommes venus ici autrefois, j'ai passé la majeure partie de mon temps au litⓠ\n@c0@"
  it: "@aBianca@bNon avevo mai visitato per intero il Castello di Denim...\n@c0@"
  ja: "@a@bビアンカ「そういえば　私　あんまり\n\tお城の中を　見る機会がなかったわ。\n\t石になる前は　ずっと　寝室だったし。\n@c0@"
124:
  de: "@aNera@bHier arbeiten also Hilda und Monty.\n@c0@"
  en: "@aNera@bSo this is where Patty and Monty do their work.\n@c0@"
  es: "@aNera@bAquí es dove Cone-Cone y Moncho trabajan.\n@c0@"
  fr: "@aNera@bC'est donc là que Tulipe et Ciobair travaillent.\n@c0@"
  it: "@aNera@bGreta e Mister Muster lavorano qui.\n@c0@"
  ja: "@a@bフローラ「ここには　ルイーダさんや\n\tモンスターおじいさま　まで\n\tいらっしゃって……。\n@c0@"
125:
  de: "@aNera@bEs ist schön, dass sich so viele Leute für das Gute einsetzen.\n@c0@"
  en: "@aNera@bIt's nice to have so many people helping the cause.\n@c0@"
  es: "@aNera@bÈ buono que haya tanta gente lavorando por la causa.\n@c0@"
  fr: "@aNera@bC'est rassurant de voir autant de gens œuvrer pour la bonne cause.\n@c0@"
  it: "@aNera@bÈ bello poter contare su di loro.\nPiù siamo, maggiori probabilità di vittoria abbiamo.\n@c0@"
  ja: "@a@bフローラ「みなさんが\n\t協力してくださっているのね。\n\tありがたいことですわ。\n@c0@"
126:
  de: "@a%0%a001240@bLos, Papa! Lass uns unsere Sachen holen und aufbrechen!\n@c0@"
  en: "@a%0%a001240@bHurry up, Dad! Let's get our stuff ready and\nget going!\n@c0@"
  es: "@a%0%a001240@b¡Date prisa, papi! ¡Preparemos las cosas y en marcha!\n@c0@"
  fr: "@a%0%a001240@bDépêche-toi, papaⓠ On prend nos affaires et\non y vaⓠ\n@c0@"
  it: "@a%0%a001240@bForza, papà!\nControlliamo di aver preso tutto quello che ci serve e partiamo!\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\tはやく　準備をすませて\n\t出発しよう！　おーっ！\n@c0@"
127:
  de: "@a%0%a001250@bIch hatte gehofft, dass du mich mitnehmen würdest, Papa.\n@c0@"
  en: "@a%0%a001250@bI hoped you'd decide to take me with you, Dad.\n@c0@"
  es: "@a%0%a001250@bEspero que hayas decidido llevarme contigo, papá.\n@c0@"
  fr: "@a%0%a001250@bJ'espérais que tu me dirais de venir, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, sono felice che tu abbia deciso di portarmi con te!\n@c0@"
  ja: "@a@b%a001250「あのね…\n\tお父さんなら　絶対に　わたしも\n\t連れてってくれると思ってたの。\n@c0@"
128:
  de: "@a%0%a001250@bIch werde mich sehr anstrengen, damit du auch nie das Gefühl hast, dass ich dir im Weg stehe oder so.\n@c0@"
  en: "@a%0%a001250@bI'm going to try really hard so that you don't ever feel like I'm in the way.\n@c0@"
  es: "@a%0%a001250@bMe voy a esforzar mucho para intentar no molestar.\n@c0@"
  fr: "@a%0%a001250@bJe vais faire de mon mieux pour ne pas te gêner.\n@c0@"
  it: "@a%0%a001250@bNon ti preoccupare, non sarò un peso inutile.\nAnzi, farò di tutto per aiutarti in ogni modo!\n@c0@"
  ja: "@a@b%a001250「わたし…　お父さんに\n\t迷わくを　かけないように\n\t一生けんめい　がんばるね。\n@c0@"
129:
  de: "@aSancho@bAh, Chico. Iss bin froh, dass du miss auf deine Reise dabei haben willst. Das macht miss so glückliss!\n@c0@"
  en: "@aSancho@bAh, friend. I am eso happy you ask me to accompany you on your journey!\r\nEso, eso happy!\n@c0@"
  es: "@aSancho@b¡Eh!, chamaco. ¡Pues nomás que me siento bien feliz de que me pidieras acompañarte en este viaje!\n¡Qué padre!\n@c0@"
  fr: "@aSancho@bAh, chico. Je suis si c-content que tu m'aies demandé de v-venir avec toiⓠ Si c-contentⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que bueno!\nChico, soy muy feliz que hai deciso de portarmi contigo nel tuo viaggio...\n@c0@"
  ja: "@a@bサンチョ「それにしましても　やはり\n\t私を　お供に　えらんでくださるとは\n\tこのサンチョ　感動の極み！\n@c0@"
130:
  de: "@aSancho@bAber vergiss nisst, was iss dir beigebracht habe, no? Du musst immer deine Heilkräuter und die Chimärenflügel dabei haben, si?\n@c0@"
  en: "@aSancho@bNow, you no forget what I always tell you. You must pack medicinal herbs and the wings of the chimaera, okay?\n@c0@"
  es: "@aSancho@bAhorita deberás recordar nomás lo que siempre te digo. Tienes que llevar plantas medicinales y alas de quimera, ¿ok?\n@c0@"
  fr: "@aSancho@bEt n'oublie p-pas ce que j'ai toujours ditⓢ il faut\np-prendre des herbes médicinales et des ailes\nde chimère, de acuerdoⓡ\n@c0@"
  it: "@aSancho@b¡Me raccomando! ¡No te escordare de prendere las erbas medicinales y las alas de chimera!\nYo porterò un megapentolon de paella...\n@c0@"
  ja: "@a@bサンチョ「さあ　%a000090王！\n\t旅のしたくは　すみましたか？　薬草や\n\tキメラのつばさは　持ちましたか？\n@c0@"
131:
  de: "@aOtto@bMeine Kameraden sehen mich alle ganz neidisch an. Ich muss meinen Teil beitragen, allein schon ihretwegen.\n@c0@"
  en: "@aTuppence@bMy fellow soldiers seem to be glaring at me somewhat. I must make sure I do my bit, for their sakes.\n@c0@"
  es: "@aAlazar@bParece que mis compañeros me están observando. Tengo que asegurarme de hacerlo bien, por ellos.\n@c0@"
  fr: "@aInnocent@bMes collègues me regardent un peu méchamment.\r\nIl faut absolument que je me montre à la hauteur.\n@c0@"
  it: "@aSimon@bMaestà, sono pronto a eseguire qualsiasi suo ordine!\nTerrò alta la reputazione dei gloriosi soldati di Denim!\n@c0@"
  ja: "@a@bピピン「仲間の兵士たちの\n\t視線が　熱いです。\n\tボク　みんなの分も　がんばりますね。\n@c0@"
132:
  de: "@aBianca@bEs ist schon eine Weile her, seit ich ein Kompliment gehört habe. Ich weiß gar nicht, wo ich hingucken soll!\n@c0@"
  en: "@aBianca@bIt's bin a while since I've had a compliment like that.\r\nI dun't know what to do with myself!\n@c0@"
  es: "@aBianca@bPues sí que había pasado tiempo desde que me dijeron algo así.\n¡Ahora no sé ni qué hacer!\n@c0@"
  fr: "@aBianca@bÇa faisait bien longtemps qu'on ne m'avait pas fait un compliment comme ça. Je suis tout embarrasséeⓠ\n@c0@"
  it: "@aBianca@bOooh!\nChe bel complimento!\nGrazie!\n@c0@"
  ja: "@a@bビアンカ「あんなこと　言ってもらえたの\n\tひさしぶりだわ。\n\tちょっと　テレちゃうな……。\n@c0@"
133:
  de: "@aNera@bBin ich wirklich wunderschön? Die Leute beschreiben mich normalerweise als nett oder liebevoll.\n㈡\nIch hätte nicht gedacht, dass mich jemand für wunderschön hält.\n@c0@"
  en: "@aNera@bAm I really beautiful? People usually just describe me as kind or sweet. I don't think anyone's actually called me beautiful before.\n@c0@"
  es: "@aNera@b¿Sono veramente bellina? La gente suele decir que soy amable o dulce. Ma nunca antes me habían dicho que era bella.\n@c0@"
  fr: "@aNera@bC'est vrai que je suis belleⓡ D'ordinaire, on dit\nplutôt que je suis gentille ou douce. Je crois que\nc'est la première fois qu'on me dit que je suis belle.\n@c0@"
  it: "@aNera@bTesoro, perché fai quella faccia? Non ti sarai mica ingelosito, eh? Hai una bella moglie, e dovresti essere lusingato dal fatto che gli uomini mi ammirino!\n@c0@"
  ja: "@a@bフローラ「私　美しいですか……？\n\tいつもは　やさしそう　とかばかりで…\n\tそんなこと言われたの　初めてですわ。\n@c0@"
134:
  de: "@a%0%a001240@bGroßartig! Das wird ein Spaß, zusammen auf Reisen zu gehen, Papa!\n@c0@"
  en: "@a%0%a001240@bBrilliant! It'll be fun travelling around together\nagain, Dad.\n@c0@"
  es: "@a%0%a001240@b¡Genial! Será divertido volver a viajar contigo, papi.\n@c0@"
  fr: "@a%0%a001240@bSuperⓠ Ça va être marrant de voyager enfin\navec toi, papa.\n@c0@"
  it: "@a%0%a001240@bChe meraviglia!\nPapà, sarà bellissimo viaggiare insieme a te!\n@c0@"
  ja: "@a@b%a001240「やったねっ。\n\tお父さんと　また　いっしょに\n\t行けるなんて　うれしいな！\n@c0@"
135:
  de: "@a%0%a001250@bJuchhu! Danke, Papa. Ich werde dich auch nicht enttäuschen.\n@c0@"
  en: "@a%0%a001250@bYay! Thanks, Dad. I won't let you down.\n@c0@"
  es: "@a%0%a001250@b¡Bien! Gracias, papi. No te defraudaré.\n@c0@"
  fr: "@a%0%a001250@bOuaisⓠ Merci, papa. Tu pourras compter sur moi.\n@c0@"
  it: "@a%0%a001250@bEvviva!\nVedrai che non ti deluderò, papà!\n@c0@"
  ja: "@a@b%a001250「うれしいっ\n\tお父さん　ありがとう。\n\tわたし　がんばるね。\n@c0@"
136:
  de: "@aSancho@bGracias, Chico. Es ist so schön, wieder mit dir reisen zu können. Olé! Lass uns aufbrechen!\n@c0@"
  en: "@aSancho@bGracias, friend. Ees eso good to be travelling together again. Olé! Let's go!\n@c0@"
  es: "@aSancho@bGracias, chamaco. Es padrísimo volver a viajar juntos. ¡En marcha!\n@c0@"
  fr: "@aSancho@bGracias, chico. C'est b-b-bien de voyager à\nnouveau ensemble. Oléⓠ Allons-yⓠ\n@c0@"
  it: "@aSancho@b¡Gracias, chico!\n¡Yo soy muy feliz de viaggiare contigo!\n¡Vamonos!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　私を\n\t仲間に　入れてくださるんですね。\n\tそれでは　はりきって　行きますぞ！\n@c0@"
137:
  de: "@aOtto@bEs ist mir eine Ehre, in Eurem Dienst zu stehen, Eure Majestät.\nIch werd' Euch bestimmt keine Last sein!\n@c0@"
  en: "@aTuppence@bIt's an honour to be summoned, Your Majesty.\r\nI'll endeavour not to be a burden to you.\n@c0@"
  es: "@aAlazar@bEs un honor que me haya llamado, Majestad.\r\nProcuraré no representar una carga para vos.\n@c0@"
  fr: "@aInnocent@bC'est un honneur d'être convoqué, Votre Majesté.\r\nJe ferai tout mon possible pour ne pas être un fardeau pour vous.\n@c0@"
  it: "@aSimon@bMaestà, sono onorato che lei mi abbia scelto.\nFarò del mio meglio per non deluderla!\n@c0@"
  ja: "@a@bピピン「呼んでいただけて　光栄です。\n\t足をひっぱらないように\n\tがんばらせていただきますっ！\n@c0@"
138:
  de: "@aBianca@bDanke, dass du mich mitnimmst. Es wird bestimmt lustig, zusammen zu reisen, meinst du nicht?\n@c0@"
  en: "@aBianca@bThanks for bringin' me on board. It'll be fun to travel about together again, eh?\n@c0@"
  es: "@aBianca@bOye, gracias por llevarme. Va a estar muy bien eso de viajar juntos, ¿eh?\n@c0@"
  fr: "@aBianca@bMerci d'avoir bien voulu m'emmener. Ça va être drôle de voyager à nouveau ensemble, heinⓡ\n@c0@"
  it: "@aBianca@bGrazie per aver deciso di portarmi con te!\nVedrai, ci divertiremo insieme!\n@c0@"
  ja: "@a@bビアンカ「私を　呼んでくれて\n\tありがとう。\n\tまた　いっしょに　旅ができるねっ！\n@c0@"
139:
  de: "@aNera@bIch bin ja so glücklich, Liebling! Jetzt müssen wir uns nie wieder trennen!\n@c0@"
  en: "@aNera@bI'm so happy, darling! Now we need never be apart.\n@c0@"
  es: "@aNera@b¡Qué felice soy! No nos volveremos a separar.\n@c0@"
  fr: "@aNera@bJe suis tellement heureuse, mon chériⓠ Maintenant, nous ne serons plus jamais séparés.\n@c0@"
  it: "@aNera@bTi ringrazio, tesoro!\nPer un attimo avevo temuto che non volevi che ti accompagnassi...\n@c0@"
  ja: "@a@bフローラ「うれしいわ　あなた……。\n\tこれからは　ずっと　いっしょね。\n@c0@"
140:
  de: "@a%0%a001240@bSancho meint, er sei ziemlich stark, deshalb könne er auch so viel vertragen beim Trinken. Bedeutet das etwa, dass dieser Mann da schwach ist?\n@c0@"
  en: "@a%0%a001240@bSancho says he's really strong when it comes to drinking. Does that man's head hurt because he's\ntoo weak?\n@c0@"
  es: "@a%0%a001240@bSancho dice que es muy resistente bebiendo. Si a ese hombre le duele la cabeza, ¿es porque es un débil?\n@c0@"
  fr: "@a%0%a001240@bSancho dit qu'il est vraiment fort quand il s'agit de boire. Est-ce que ce monsieur a mal à la tête parce qu'il n'est pas assez fortⓡ\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non ha mai mal di testa.\nVuol dire che è più forte di quell'uomo? Oppure significa che va sempre a dormire con le galline?\n@c0@"
  ja: "@a@b%a001240「サンチョは　お酒が\n\t強いんだって！　…ということは\n\tあの人は　お酒に負けたの？\n@c0@"
141:
  de: "@aOtto@bAlso ehrlich! Hat dieser Kerl denn gar kein Schamgefühl, so etwas vor dem König höchstpersönlich zuzugeben?!\n@c0@"
  en: "@aTuppence@bHonestly! Does the man have no shame, admitting to such a thing in the presence of His Majesty!?\n@c0@"
  es: "@aAlazar@b¡Hay que ver! ¡¿Es que no le da vergüenza a ese hombre admitir una cosa así en presencia de Su Majestad?!\n@c0@"
  fr: "@aInnocent@bFranchementⓠ Cet homme n'a donc aucune honteⓠⓑ Tenir ce genre de propos en présence de\nSa Majesté...\n@c0@"
  it: "@aSimon@bAh, che vergogna!\nMaestà, non tema! Io non marcherò mai visita per aver fatto tardi la notte precedente!\n@c0@"
  ja: "@a@bピピン「もうっ！\n\t王さまの前だっていうのに\n\tいつまでも　だらしないヤツだなあ。\n@c0@"
142:
  de: "@a%0%a001250@bIch glaube, ich werde nie etwas trinken, wenn ich danach so aussehe! Auch nicht, wenn ich groß bin.\n@c0@"
  en: "@a%0%a001250@bIf that's what happens, then there's no way I'm ever going to drink, even when I'm all grown up.\n@c0@"
  es: "@a%0%a001250@bSi eso es lo que te pasa, no probaré nunca la bebida, ni siquiera cuando sea mayor.\n@c0@"
  fr: "@a%0%a001250@bSi c'est ça le résultat, pas question que je boive, même une fois que je serai grande.\n@c0@"
  it: "@a%0%a001250@bSe è così che ci si sente la mattina dopo aver fatto tardi, me ne andrò sempre a dormire presto, anche quando sarò grande!\n@c0@"
  ja: "@a@b%a001250「わたし　あんなふうになるなら\n\tおとなになっても　ぜったい\n\tお酒を　飲まないわ。\n@c0@"
143:
  de: "@aBianca@bGlaubst du, wir können das Königreich wirklich ihren, ähm, ⓞfähigenⓟ Händen überlassen?\n@c0@"
  en: "@aBianca@bD'you reckon it's wise to leave the safety of the kingdom in their, ahem, capable hands?\n@c0@"
  es: "@aBianca@b¿Entonces es seguro dejar la seguridad del reino en sus, ejem, sabias manos?\n@c0@"
  fr: "@aBianca@bTu crois que c'est raisonnable de laisser la sécurité du royaume entre leurs mainsⓡ\n@c0@"
  it: "@aBianca@bQuello è uno dei ⓕvalorosiⓖ soldati di Denim, vero?!\nUno dei ⓕprodiⓖ a cui è affidata la difesa del Regno, dico bene?!\n㈡\nSanta dea, proteggici tu!\n@c0@"
  ja: "@a@bビアンカ「あの人たちに　この国を\n\tまかせておいて　大丈夫なのかしら？\n@c0@"
144:
  de: "@aNera@bEr scheint sich nicht gerade wohl zu fühlen. Leider können wir nichts für ihn tun...\n@c0@"
  en: "@aNera@bHe seems to be suffering rather a lot. I'm afraid there's not much we can do for him, though.\n@c0@"
  es: "@aNera@bParece que sufre molto. Non credo que podamos hacer nada por él.\n@c0@"
  fr: "@aNera@bIl a l'air d'avoir vraiment mal. Malheureusement,\r\nje crains qu'on ne puisse pas faire grand-chose pour lui.\n@c0@"
  it: "@aNera@bIl mal di testa glielo farei passare a suon di ceffoni!\nOh, mia buona dea, perdonami per ciò che ho detto!\n@c0@"
  ja: "@a@bフローラ「あの方　つらそうですけど\n\t今は　なにもして\n\tあげられませんわね。\n@c0@"
145:
  de: "@a%0%a001240@bKusine Traudl und %a001250 sind gut befreundet, weißt du.\n@c0@"
  en: "@a%0%a001240@bCousin Gertie and %a001250 are really good friends, you know.\n@c0@"
  es: "@a%0%a001240@bLa prima Frede y %a001250 son muy buenas amigas, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bCousine Gégé et %a001250 sont très bonnes amies, tu sais.\n@c0@"
  it: "@a%0%a001240@bGertrude e %a001250 vanno molto d'accordo e passano parecchio tempo insieme.\n㈡\nA volte si mettono a parlare tra loro, e non vogliono nemmeno che io mi avvicini!\nDicono che sono ⓕcose da donneⓖ...\n@c0@"
  ja: "@a@b%a001240「ドリスおねえちゃんと\n\t%a001250は　すっごく\n\tなかよしなんだよ！\n@c0@"
146:
  de: "@a%0%a001250@bKusine Traudl hat mir oft erzählt, wie es war, bevor sie eine Prinzessin wurde. Das war vielleicht lustig!\n@c0@"
  en: "@a%0%a001250@bI often used to get Cousin Gertie to tell me what it was like before she became a princess. We had lots of fun chatting!\n@c0@"
  es: "@a%0%a001250@bSolía preguntarle a la prima Frede cómo era su vida antes de ser princesa. ¡Nos lo pasábamos muy bien charlando!\n@c0@"
  fr: "@a%0%a001250@bJe demandais souvent à cousine Gégé de me raconter comment c'était avant qu'elle ne devienne princesse. On a eu plein de discussions amusantesⓠ\n@c0@"
  it: "@a%0%a001250@bLa cugina Gertrude mi ha detto che si divertiva tantissimo, prima di diventare Principessa.\nOra, invece, si annoia un po'...\n@c0@"
  ja: "@a@b%a001250「よく　ドリスおねえちゃんに\n\tお姫さまになる前の　お話を\n\t聞かせてもらったの。　楽しかった！\n@c0@"
147:
  de: "@a%0%a001250@bHe he! Manchmal hat Kusine Traudl wirklich Haare auf den Zähnen!\n@c0@"
  en: "@a%0%a001250@bHe he! Cousin Gertie's as full of beans as ever!\n@c0@"
  es: "@a%0%a001250@b¡Ji, ji! ¡La prima Frede está igual de enfadada que siempre!\n@c0@"
  fr: "@a%0%a001250@bHé héⓠ Cousine Gégé est toujours aussi énergiqueⓠ\n@c0@"
  it: "@a%0%a001250@bPovera cugina Gertrude...\nAh, quanto la capisco!\n@c0@"
  ja: "@a@b%a001250「うふふ…\n\t今日も　ドリスおねえちゃん\n\t元気そう。\n@c0@"
148:
  de: "@aOtto@bPrinzessin Gertraud hat viel Ähnlichkeit mit meiner Traumfrau. Welchem Burschen würd' solch ein ehrliches und aufg'wecktes Mädel nicht g'fallen?\n@c0@"
  en: "@aTuppence@bPrincess Gertrude is actually not far from being my ideal woman. What man wouldn't find such a candid, lively beast attractive?\n@c0@"
  es: "@aAlazar@bLa princesa Fredegunda es casi mi mujer ideal. Ningún hombre podría no encontrar atractiva a esa monstruita alegre e inocente.\n@c0@"
  fr: "@aInnocent@bPour moi, la princesse Gertrude n'est pas loin de la femme idéale. Quel homme ne serait pas attiré par une fille aussi vive et aussi candideⓡ\n@c0@"
  it: "@aSimon@bTrovo la principessa Gertrude molto attraente.\nMi piacerebbe diventare la sua guardia del corpo...\nEhm...\n@c0@"
  ja: "@a@bピピン「じつは　ボク　ドリスさまも\n\tけっこう　タイプなんですよね。\n\t気さくで元気なお姫さまってステキだ！\n@c0@"
149:
  de: "@aSancho@bIss glaube, Señorita Gertraud bereitet dem armen Señor Sebastian ganz schön viel Ärger.\n@c0@"
  en: "@aSancho@bThe truth ees, señorita Gertrude, eshe makes eso much trouble for señor Albert.\n@c0@"
  es: "@aSancho@bLa verdad es que la señorita Fredegunda causa muchos problemas al señor Agila.\n@c0@"
  fr: "@aSancho@bLa vérité, c'est que la señorita Gertrude cause\r\nb-bien du souci au señor Albert.\n@c0@"
  it: "@aSancho@bLa señorita Gertrude es muy gentil y sensibile, ma crea siempre un mucchios de grattacapos al principe Alberto...\n@c0@"
  ja: "@a@bサンチョ「本当に　オジロンさまには\n\t迷わくを　かけっぱなしで\n\t頭が　あがりませんよ。\n@c0@"
150:
  de: "@aSancho@bEs ist gut für ihn, wenn wir bald unsere Mission erfüllen. Dann kann er endliss Siesta halten, si?\n@c0@"
  en: "@aSancho@bEes good for heem eef we finish our quest esoon. Then he can have the siesta, sí?\n@c0@"
  es: "@aSancho@bSerá mejor para él que acabemos pronto nuestra misión. Pues así podrá echarse la siesta al fin.\n@c0@"
  fr: "@aSancho@bCe serait bien p-p-pour lui aussi qu'on finisse\nvite cette quête. Il pourrait alors faire oune\npetite siesta, noⓡ\n@c0@"
  it: "@aSancho@b¡Quella muchacha ha un caracter muy difícil!\n¡Ay, no invidio proprio el povero hombre que la esposerà!\n@c0@"
  ja: "@a@bサンチョ「１日も　早く　目的を達成して\n\tオジロンさまには　ゆっくり\n\t休んでいただきたいものですね。\n@c0@"
151:
  de: "@aBianca@bIch fürchte, wir lassen Bastl wieder mal mit einem Haufen Arbeit zurück.\n@c0@"
  en: "@aBianca@bI'm afraid we'll be placin' quite a burden on\r\nBertie again.\n@c0@"
  es: "@aBianca@bMe temo que va a ser una verdadera carga para Agila.\n@c0@"
  fr: "@aBianca@bJ'ai bien peur qu'on en redemande beaucoup à Albert.\n@c0@"
  it: "@aBianca@bTemo che la nostra partenza creerà qualche problema al caro principe Alberto...\n@c0@"
  ja: "@a@bビアンカ「オジロンさんには\n\tまだ　もうしばらく\n\tご迷わくを　かけてしまうわね。\n@c0@"
152:
  de: "@aBianca@bAber Traudl scheint das wenig zu kümmern...\n@c0@"
  en: "@aBianca@bNot that Gertie seems too bothered, eh?\n@c0@"
  es: "@aBianca@bAunque no parezca importarle demasiado, ¿eh?\n@c0@"
  fr: "@aBianca@bEn même temps, ça n'a pas l'air de trop déranger Gertrude, heinⓡ\n@c0@"
  it: "@aBianca@bE, di riflesso, anche alla povera Gertrude.\nMi spiace davvero per lei...\n@c0@"
  ja: "@a@bビアンカ「でも　ドリスさんにとっては\n\t悪くない話みたいね。　うふ。\n@c0@"
153:
  de: "@aNera@bOje. Ich weiß wirklich nicht, ob es so gut ist, die Burg wieder zu verlassen.\n@c0@"
  en: "@aNera@bOh dear. Now I'm not sure if it's a good thing or a bad thing that we're leaving the castle again.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Ahora no sé si es buena idea dejar otra vez il castello.\n@c0@"
  fr: "@aNera@bPar la Déesse. Maintenant, je me demande si on fait bien de quitter à nouveau le château.\n@c0@"
  it: "@aNera@bAccidenti, quanto mi dispiace...\n㈡\n%0%a000090, cerchiamo di non restare lontani da Denim a lungo, così non creeremo troppi inconvenienti al principe Alberto e a Gertrude.\n@c0@"
  ja: "@a@bフローラ「あら。　じゃあ　お城を\n\t留守にするのが　いいことなのか\n\t悪いことなのか……。　う～ん……。\n@c0@"
154:
  de: "@a%0%a001240@bGlaubst du denn, es ist in Ordnung, wenn wir die Burg verlassen? Wo doch nur so wenig Soldaten übrig sind...\n@c0@"
  en: "@a%0%a001240@bIf there are so few people left, do you think it's okay for us to just leave the castle?\n@c0@"
  es: "@a%0%a001240@bSi queda tan poca gente, ¿crees que está bien que nos vayamos del castillo y ya está?\n@c0@"
  fr: "@a%0%a001240@bS'il ne reste que si peu de monde, tu crois que c'est une bonne idée qu'on quitte le châteauⓡ\n@c0@"
  it: "@a%0%a001240@bForse non dovremmo andarcene, se al castello ci sono pochi soldati...\n@c0@"
  ja: "@a@b%a001240「人が　少ないのに\n\tボクたちまで　出ていって\n\tこのお城　大丈夫かな……。\n@c0@"
155:
  de: "@a%0%a001240@bWahrscheinlich wird es das Beste sein, wenn wir Großmeister Nimzo schnellstmöglich finden und ihn besiegen...\n@c0@"
  en: "@a%0%a001240@bI suppose the best thing for everyone will be if we manage to find Grandmaster Nimzo and defeat\nhim, though.\n@c0@"
  es: "@a%0%a001240@bImagino que lo mejor para todos será que encontremos al Gran Maestro Nimzo y acabemos con él.\n@c0@"
  fr: "@a%0%a001240@bMais je crois que la meilleure chose à faire est\nquand même de trouver le Grand Maître Nimzo\net de le battre.\n@c0@"
  it: "@a%0%a001240@bNo, ho detto una sciocchezza.\nLa cosa più importante da fare in questo momento è trovare il Gran Maestro Nimzo e farlo sparire dalla circolazione.\n@c0@"
  ja: "@a@b%a001240「でも　今は\n\t大魔王を　やっつけにいくのが\n\tいちばん　いい方法なんだよね。\n@c0@"
156:
  de: "@aSancho@bWenn siss herumsprisst, dass König %a000090 und Königin %a001230 wohlauf sind, werden sie alle nach Humburg zurückkommen.\n@c0@"
  en: "@aSancho@bWhen the news comes that King %a000090 and Queen %a001230, they are okay, everyone ees gonna come back to Gotha.\n@c0@"
  es: "@aSancho@bPues en cuanto se enteren de que el rey %a000090 y la reina %a001230 están bien, todo el mundo volverá de volada a Pankraz.\n@c0@"
  fr: "@aSancho@bQuand les gens apprendront que le roi %a000090 et la reine %a001230 v-vont bien, tout le mundo reviendra à G-Gotha.\n@c0@"
  it: "@aSancho@bSoy seguro que, cuando se espargerà la voce che rey %a000090 y la sua mujer sono tornatos, coloros que erano partitos rientreranno a Denim.\n@c0@"
  ja: "@a@bサンチョ「国の民だって　きっと\n\t%a000090王と　%a001230さまが\n\t無事とわかれば　もどってきますとも！\n@c0@"
157:
  de: "@aOtto@bIch hoffe, er hat Euch damit keinen Grund zur Sorge gegeben, Eure Majestät.\n@c0@"
  en: "@aTuppence@bI do hope he hasn't given you any cause for concern there, Your Majesty.\n@c0@"
  es: "@aAlazar@bEspero que no os haya supuesto ningún estorbo, Majestad.\n@c0@"
  fr: "@aInnocent@bJ'espère que ce qu'il vient de dire ne vous inquiète pas, Votre Majesté.\n@c0@"
  it: "@aSimon@bMaestà, spero che le parole di quell'uomo non l'abbiano turbata...\n@c0@"
  ja: "@a@bピピン「まったく　%a000090さまたちを\n\t不安にさせてどうするんだっ！？\n@c0@"
158:
  de: "@aOtto@bIhr könnt die Verteidigung Humburgs ruhig den fähigen Händen meiner Kameraden anvertrauen!\n@c0@"
  en: "@aTuppence@bJust leave the defence of Gotha in the capable hands of my comrades, and don't you worry!\n@c0@"
  es: "@aAlazar@b¡No os preocupéis y dejad que mis compañeros se encarguen de la defensa de Pankraz!\n@c0@"
  fr: "@aInnocent@bLaissez la défense de Gotha entre les mains habiles de mes camarades et ne vous en faites pasⓠ\n@c0@"
  it: "@aSimon@bNon tema, Sire!\nI miei commilitoni sapranno difendere il Regno di Denim nel migliore dei modi!\n@c0@"
  ja: "@a@bピピン「大丈夫ですよ！\n\t国は　ボクの仲間の兵士たちが\n\tしっかり守ります。\n@c0@"
159:
  de: "@a%0%a001240@bEs gab einen Edelstein in dem Dorf, in dem du gelebt hast? Den will ich sehen!\n@c0@"
  en: "@a%0%a001240@bThere was a gemstone in the village you used to live in? I want to go and find it!\n@c0@"
  es: "@a%0%a001240@b¿Dices que en el pueblo en el que vivías había una gema? ¡Yo quiero ir a buscarla!\n@c0@"
  fr: "@a%0%a001240@bIl y avait une pierre précieuse dans le village où tu vivaisⓡ Je veux qu'on y aille pour la retrouverⓠ \n@c0@"
  it: "@a%0%a001240@bMa è vero che nel villaggio dove vivevi da piccolo ci sono delle pietre preziose?\nVoglio andare a cercarle!\n@c0@"
  ja: "@a@b%a001240「お父さんが　小さい頃いた村って\n\t宝石がとれるの？　すごいやっ！\n\tボクも　さがしにいきたいな！\n@c0@"
160:
  de: "@a%0%a001250@bIch frage mich, ob wir diesen berühmten Handwerker überhaupt finden würden, wenn wir nach Steinach gingen. \n㈡\nVielleicht ist er ja schon woanders hingegangen.\n@c0@"
  en: "@a%0%a001250@bI wonder if we'd find this famous craftsman if we went to Whealbrook. Maybe he's already moved\non somewhere else.\n@c0@"
  es: "@a%0%a001250@b¿Tú crees que encontraríamos a ese famoso artesano si fuésemos a Arroyofrío? A lo mejor ya se ha ido a otra parte.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si on trouverait ce célèbre artisan\nen allant à Ruycelieu. Peut-être qu'il a déjà déménagé ailleurs.\n@c0@"
  it: "@a%0%a001250@bChissà, se andassimo a Valcava potremmo trovare quell'artigiano...\nA patto che viva ancora lì, eh!\n@c0@"
  ja: "@a@b%a001250「サンタローズの洞くつに行ったら\n\t名工のおじさんに　会えるかな？\n\tもう　どっかに　行っちゃったかな。\n@c0@"
161:
  de: "@aBianca@bIch wusste gar nicht, dass es in Steinach Edelsteine gibt...\n@c0@"
  en: "@aBianca@bI had no idea there was any gemstone lurkin'\r\nin Whealbrook.\n@c0@"
  es: "@aBianca@bNo tenía ni idea que de que hubiera gemas escondidas en Arroyofrío, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais pensé qu'il pouvait y avoir une pierre précieuse à Ruycelieu.\n@c0@"
  it: "@aBianca@bNon avevo idea che dalle parti di Valcava ci fossero giacimenti di pietre preziose...\n@c0@"
  ja: "@a@bビアンカ「サンタローズで\n\tそんな石がとれるなんて\n\t知らなかったわ。\n@c0@"
162:
  de: "@a%0%a001240@bEs wäre doch großartig, wenn wir Vater und Sohn wieder zusammenbringen könnten, nicht?\n@c0@"
  en: "@a%0%a001240@bIt'd be nice to bring the old man home to his son one day, wouldn't it?\n@c0@"
  es: "@a%0%a001240@bEstaría bien llevar al viejo de vuelta a casa de su hijo, ¿no?\n@c0@"
  fr: "@a%0%a001240@bCe serait bien de ramener le vieil homme chez son fils un jour, nonⓡ\n@c0@"
  it: "@a%0%a001240@bChe storia triste...\nMi piacerebbe tanto che il padre di quell'uomo tornasse a casa...\n@c0@"
  ja: "@a@b%a001240「いつか　あのおじさんを\n\tお父さんのところへ\n\t連れていってあげたいね。　ねっ？\n@c0@"
163:
  de: "@a%0%a001250@bZum Glück weiß er jetzt, dass sein Vater noch am Leben ist. Das muss eine große Erleichterung für ihn sein.\n@c0@"
  en: "@a%0%a001250@bIt's nice that he knows his dad's alive now. I can understand what a big relief that must be.\n@c0@"
  es: "@a%0%a001250@bAhora sabe que su padre está vivo, eso está bien. Debe de ser un gran alivioⓓ lo digo por experiencia.\n@c0@"
  fr: "@a%0%a001250@bC'est bien qu'il sache que son père est en vie.\nJe comprends quel soulagement ça doit être pour lui.\n@c0@"
  it: "@a%0%a001250@bAdesso che sa che suo padre è vivo, si sentirà sollevato, non credi?\n@c0@"
  ja: "@a@b%a001250「あのおじさん　お父さんが\n\t生きていると知って　うれしそうね。\n\tわたしも　あの気持ち　わかるな。\n@c0@"
164:
  de: "@a%0%a001240@bDu vermisst deine Mutter bestimmt sehr, oder, Papa? Ich habe Mama auch sehr vermisst...\n@c0@"
  en: "@a%0%a001240@bYou must be desperate to find your mum just like I was desperate to find mine.\n@c0@"
  es: "@a%0%a001240@bDebes estar desesperado por encontrar a tu madre, como me pasaba a mí.\n@c0@"
  fr: "@a%0%a001240@bTu dois avoir autant envie de retrouver ta maman que moi j'avais envie de retrouver la mienne.\n@c0@"
  it: "@a%0%a001240@bPapà, capisco che hai tanta voglia di ritrovare nonna Mada. Anch'io ho sofferto tanto per la mancanza della mia mamma...\n@c0@"
  ja: "@a@b%a001240「お父さんが　おばあちゃんに\n\t会いたい気持ちって　ボクがお母さんに\n\t会いたかった気持ちと　同じだよね。\n@c0@"
165:
  de: "@a%0%a001250@bGroßmutter soll sich gut mit Monstern verstanden haben. Genau wie du.\n@c0@"
  en: "@a%0%a001250@bGrandma was good at making friends with monsters, right, Dad? Just like you are.\n@c0@"
  es: "@a%0%a001250@bA la abuela se le daba bien hacerse amiga de los monstruos, ¿verdad, papá? Como a ti.\n@c0@"
  fr: "@a%0%a001250@bGrand-mère était douée pour se faire des amis parmi les monstres, hein, papaⓡ Comme toi.\n@c0@"
  it: "@a%0%a001250@bPapà, è vero che anche la nonna era brava ad addomesticare i mostri?\nÈ lei che ti ha insegnato come si fa?\n@c0@"
  ja: "@a@b%a001250「おばあちゃんも　お父さんと\n\tいっしょで　魔物さんたちと\n\t仲良しだったんでしょ？\n@c0@"
166:
  de: "@a%0%a001250@bWie gerne würde ich sie kennenlernen.\n@c0@"
  en: "@a%0%a001250@bI really want to meet her.\n@c0@"
  es: "@a%0%a001250@bMe gustaría mucho conocerla.\n@c0@"
  fr: "@a%0%a001250@bJ'ai vraiment envie de la rencontrer.\n@c0@"
  it: "@a%0%a001250@bVorrei tanto conoscerla!\n@c0@"
  ja: "@a@b%a001250「だから　わたしも\n\tおばあちゃんに　会ってみたいの。\n@c0@"
167:
  de: "@aSancho@bDas ist eine gute Idee, Chico! Bitte, würdest du das für deine Onkel Chico tun, si?\n@c0@"
  en: "@aSancho@bEes a fine idea, friend! Please, you do thees for your Uncle Sancho, sí?\n@c0@"
  es: "@aSancho@b¡Qué buena idea, mi chamaco! ¡Hazlo por tu tito Sancho, ándale!\n@c0@"
  fr: "@aSancho@bC'est oune bonne idée, chicoⓠ Fais ça pour\nt-tonton Sancho, de acuerdoⓡ\n@c0@"
  it: "@aSancho@bSì, chico.\nSarebbe veramentes una cosa meravigliosa...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！　私からも\n\tお願いします。　いつか　その\n\tペンダント完成させてくださいね。\n@c0@"
168:
  de: "@a%0%a001240@bDiese Frau lebt normalerweise oben im Himmel, oder? Sie ist wunderschön.\n@c0@"
  en: "@a%0%a001240@bThat woman usually lives up in the sky, doesn't she? She's really pretty.\n@c0@"
  es: "@a%0%a001240@bEsa mujer vivía ahí arriba, en el cielo, ¿no? Es muy guapa.\n@c0@"
  fr: "@a%0%a001240@bCette femme vit dans le ciel, d'habitude, c'est çaⓡ Elle est vraiment jolie.\n@c0@"
  it: "@a%0%a001240@bQuella donna viveva in cielo, non è vero?\nÈ davvero carina...\n@c0@"
  ja: "@a@b%a001240「あの人　本当は\n\tお空の上に　住んでるんだよね。\n\tきれいな人だなあ……。\n@c0@"
169:
  de: "@a%0%a001250@bWir haben diese Dame schon oft besucht, aber sie hat nie mit uns gesprochen.\n@c0@"
  en: "@a%0%a001250@bWe used to visit that lady every once in a while,\nbut she'd never talk to us.\n@c0@"
  es: "@a%0%a001250@bA veces íbamos a visitar a esa dama, pero ella nunca nos dirigió la palabra.\n@c0@"
  fr: "@a%0%a001250@bOn venait voir cette dame, de temps en temps, mais elle ne nous parlait jamais.\n@c0@"
  it: "@a%0%a001250@bOgni tanto andavamo a trovare quella signora, ma lei era sempre silenziosa...\n@c0@"
  ja: "@a@b%a001250「あの人ね　今まで\n\tわたしたちが　会いに行っても\n\tおしゃべりして　くれなかったの。\n@c0@"
170:
  de: "@a%0%a001250@bIch bin wirklich froh, dass sie es jetzt tut.\n@c0@"
  en: "@a%0%a001250@bI'm really happy that she will now.\n@c0@"
  es: "@a%0%a001250@bMe alegro mucho de que ahora sí lo haga.\n@c0@"
  fr: "@a%0%a001250@bJe suis contente qu'elle le fasse, maintenant.\n@c0@"
  it: "@a%0%a001250@bOra, però, ci parla!\nChissà come mai ha cambiato idea...\n@c0@"
  ja: "@a@b%a001250「やっと　おしゃべりできて\n\tわたし　うれしい……。\n@c0@"
171:
  de: "@aOtto@bIch hatte ja keine Ahnung, dass in der Burg eine Frau aus Zenithia wohnt.\n@c0@"
  en: "@aTuppence@bI had no idea that there was a Zenithian living in the castle until you brought me here, Your Majesty.\n@c0@"
  es: "@aAlazar@bNo tenía ni idea de que había una zenithia viviendo en el castillo hasta que me trajisteis aquí, Majestad.\n@c0@"
  fr: "@aInnocent@bAvant que vous m'ameniez ici, Votre Majesté, j'ignorais totalement qu'une Zénithienne\r\nvivait dans le château.\n@c0@"
  it: "@aSimon@bMaestà, non avevo idea che al castello vivesse una donna zenithiana...\n@c0@"
  ja: "@a@bピピン「ボク　王に連れてこられるまで\n\tこの城に　天空人が住んでいたなんて\n\t知りませんでした。\n@c0@"
172:
  de: "@aOtto@bDie meisten anderen Leute hier wahrscheinlich auch net. Solch eine schöne Frau würd' sich vor lauter Verehrern ja gar net retten können!\n@c0@"
  en: "@aTuppence@bI should imagine most other folk don't realise, either. A beautiful woman like that would be surrounded by admirers if they did!\n@c0@"
  es: "@aAlazar@bImagino que casi nadie lo sabe. ¡Si lo supieran, una mujer así de hermosa estaría siempre rodeada de admiradores!\n@c0@"
  fr: "@aInnocent@bJe suppose que c'est la même chose pour la plupart des gens. Une belle femme comme ça serait entourée d'admirateurs si cela se savaitⓠ\n@c0@"
  it: "@aSimon@bSe mi è concesso dirlo, è una ragazza davvero affascinante!\n@c0@"
  ja: "@a@bピピン「ほかの人たちも　ほとんど\n\t知らないんじゃないかな？　でなきゃ\n\tあんな美人　ほっときませんよ！\n@c0@"
173:
  de: "@aSancho@bEs tut gut, solche Worte zu hören, no? Jetzt iss bin bereit zu gehen! Olé\n@c0@"
  en: "@aSancho@bEes heartening to hear these words, no?\r\nNow I feel ready to go! Olé!\n@c0@"
  es: "@aSancho@bPues es reteconmovedor escuchar esas palabras, ¿no?\n¡Ahorita ya estoy listo para partir! ¡Ándale!\n@c0@"
  fr: "@aSancho@bC-C'est encourageant d'entendre ça, noⓡ\nMaintenant, je me sens p-prêt à partirⓠ Oléⓠ\n@c0@"
  it: "@aSancho@b¡Estas palabras sono musica por las mias orecchias!\r\nYo soy pronto, chico.\r\n¡Vamos!\n@c0@"
  ja: "@a@bサンチョ「神の光が　魔界にも\n\t届いているとは　心強いですね。\n\tさあ　行きましょう！\n@c0@"
174:
  de: "@a%0%a001240@bEs ist gut, dass du, %a001250 und Großmutter euch alle so gut mit Monstern versteht.\n@c0@"
  en: "@a%0%a001240@bIt's good that you and %a001250 and Grandma are all so friendly with monsters.\n@c0@"
  es: "@a%0%a001240@bEstá muy bien que tú, %a001250 y la abuela os llevéis tan bien con los monstruos.\n@c0@"
  fr: "@a%0%a001240@bC'est bien que toi, %a001250 et grand-mère, vous vous entendiez si bien avec les monstres.\n@c0@"
  it: "@a%0%a001240@bSono contento che tu, %a001250 e la nonna siate amici dei mostri buoni...\n@c0@"
  ja: "@a@b%a001240「いいなあ。\n\tおばあちゃんも　お父さんも\n\t%a001250も　魔物たちと　なかよしで。\n@c0@"
175:
  de: "@a%0%a001240@bVielleicht sollte ich ja mal versuchen, mit einem Schleim oder so Freundschaft zu schließen...\n@c0@"
  en: "@a%0%a001240@bMaybe I should try befriending a slime or something one of these days.\n@c0@"
  es: "@a%0%a001240@bA lo mejor debería trabar amistad con algún limo uno de estos días.\n@c0@"
  fr: "@a%0%a001240@bPeut-être que je devrais essayer de devenir copain avec un gluant ou un autre monstre, un jour.\n@c0@"
  it: "@a%0%a001240@bUno di questi giorni anch'io proverò a fare amicizia con uno Slime o con un'altra simpatica bestiolina...\n@c0@"
  ja: "@a@b%a001240「ボクも　たまには\n\tスライムとかに　なつかれてみたいよ！\n@c0@"
176:
  de: "@aBianca@bEs ist schön, dass hier alles seinen gewohnten Gang nimmt.\n@c0@"
  en: "@aBianca@bIt's nice to see the place all lively as usual.\n@c0@"
  es: "@aBianca@bDa gusto ver este lugar tan animado como de costumbre.\n@c0@"
  fr: "@aBianca@bC'est agréable de voir cet endroit aussi vivant que d'habitude.\n@c0@"
  it: "@aBianca@bSembra proprio che qui la vita scorra con la stessa tranquillità di sempre...\nÈ un buon segno, no?\n@c0@"
  ja: "@a@bビアンカ「ここは　相変わらず\n\tにぎやかで　変わってないね。\n\tうれしいわ。\n@c0@"
177:
  de: "@aNera@bEs kommt mir fast ein wenig unwirklich vor, hier einfach so rumspazieren zu können.\n@c0@"
  en: "@aNera@bIt still feels almost unreal to be able to walk around like this again.\n@c0@"
  es: "@aNera@bVeramente, no me puedo creer que esté andando por aquí otra vez.\n@c0@"
  fr: "@aNera@bÇa semble presque irréel de pouvoir se promener comme ça à nouveau.\n@c0@"
  it: "@aNera@bChe bello poter camminare di nuovo liberamente...\nEra da troppo tempo che non lo facevo...\n@c0@"
  ja: "@a@bフローラ「こうして\n\t自分の足で　歩いているのが\n\tまだ　夢のようですわ……。\n@c0@"
178:
  de: "@a%0%a001240@bAlle Leute sind froh, dass Mama gesund und munter wieder bei uns ist.\n@c0@"
  en: "@a%0%a001240@bEveryone's really happy because Mum came home safe and sound!\n@c0@"
  es: "@a%0%a001240@b¡Todos están felices porque mamá ha vuelto sana y salva!\n@c0@"
  fr: "@a%0%a001240@bTout le monde est vraiment content que maman soit revenue saine et sauveⓠ\n@c0@"
  it: "@a%0%a001240@bTutti sono felicissimi perché mamma è tornata a casa!\n@c0@"
  ja: "@a@b%a001240「お母さんも\n\tぶじに　お城に　もどってきたから\n\tみんな　うれしそう！\n@c0@"
179:
  de: "@a%0%a001240@bDas Volk liebt Mama und dich wirklich sehr...\n@c0@"
  en: "@a%0%a001240@bThe people here all really love you two, you know.\n@c0@"
  es: "@a%0%a001240@bEsta gente os quiere de verdad, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bLes gens d'ici vous aiment vraiment beaucoup, tous les deux, tu sais.\n@c0@"
  it: "@a%0%a001240@bGli abitanti di Denim vogliono un sacco di bene a te e a lei!\nE anche a me e a %a001250!\n@c0@"
  ja: "@a@b%a001240「みんな　お父さんと\n\tお母さんのことが　本当に\n\t大好きなんだね！\n@c0@"
180:
  de: "@a%0%a001250@bIch liebe Humburg einfach! Alle hier sind so nett und freundlich.\n@c0@"
  en: "@a%0%a001250@bI really love Gotha! Everyone's so nice and\nfriendly here.\n@c0@"
  es: "@a%0%a001250@b¡Me encanta Pankraz! Aquí todos son muy amables y cariñosos.\n@c0@"
  fr: "@a%0%a001250@bJ'adore Gothaⓠ Tout le monde est si gentil ici.\n@c0@"
  it: "@a%0%a001250@bLa gente di Denim è sempre gentile e socievole.\nIl nostro Regno è il posto più bello del mondo!\n@c0@"
  ja: "@a@b%a001250「わたし　グランバニアの\n\t町も　大好き！　みんな\n\tすごく　やさしくしてくれたの。\n@c0@"
181:
  de: "@aSancho@bIn die Castillo ist viel mehr los, seit Königin %a001230 wieder in Humburg ist.\n@c0@"
  en: "@aSancho@bEes more and more busy een the castle esince Queen %a001230, eshe returned to Gotha.\n@c0@"
  es: "@aSancho@bPues el castillo anda bien animoso desde que la reina %a001230 ha vuelto a Pankraz.\n@c0@"
  fr: "@aSancho@bLe castel est de p-plus en plus animé depuis que %a001230 est revenue à G-Gotha.\n@c0@"
  it: "@aSancho@bDa cuando la reina %a001230 es tornata a Denim, el castillo es más affollato que mai.\n@c0@"
  ja: "@a@bサンチョ「%a001230さまが\n\tもどってきてから　いつにも増して\n\t城の中が　にぎやかになりました。\n@c0@"
182:
  de: "@aSancho@bSi, si! Das ist gut so. Iss bin ja so glückliss!\n@c0@"
  en: "@aSancho@bSí, sí! Ees esuch a fine feeling.\nI am eso, eso happy!\n@c0@"
  es: "@aSancho@b¡Sí, sí! Qué buena onda.\n¡Qué padre!\n@c0@"
  fr: "@aSancho@bSi, siⓠ Ça fait v-vraiment du bien.\nJe suis si heureuxⓠ\n@c0@"
  it: "@aSancho@bAhora ce está un'atmosfera muy buena, chico.\n@c0@"
  ja: "@a@bサンチョ「いや　けっこう　けっこう！\n\tこのサンチョも　あらためて\n\tよろこびを　かみしめておりますぞ！\n@c0@"
183:
  de: "@aOtto@bOh! Meine Mutter ist bestimmt sehr stolz auch mich ⓚⓛ wo ich Eure Majestät doch auf Euren Reisen begleite und so...\n@c0@"
  en: "@aTuppence@bOoh! I'm sure Mother will be terribly proud to see me accompanying His Majesty like this.\n@c0@"
  es: "@aAlazar@b¡Oh! Seguro que madre estaría orgullosa de verme acompañar a Su Majestad.\n@c0@"
  fr: "@aInnocent@bOohⓠ Je suis sûr que maman est très fière que je sois aux côtés de Sa Majesté.\n@c0@"
  it: "@aSimon@bMia madre sarà orgogliosa quando le diranno che hanno visto il suo amato figlio scortato nientemeno che dal Re di Denim in person...\n㈡\nNo no no.\nVolevo dire che io scorto il Re di Denim!\nScusi, Maestà. Mi ero distratto un attimo...\n@c0@"
  ja: "@a@bピピン「%a000090さまの　お供をする\n\tこのボクの姿……。　きっと　母も\n\t誇りに　思ってくれているでしょう。\n@c0@"
184:
  de: "@aBianca@bNa, das ist doch mal ein Empfang...\n@c0@"
  en: "@aBianca@bYou can't complain about a reception like that, eh?\n@c0@"
  es: "@aBianca@bNo te podrás quejar de esta bienvenida, ¿eh?\n@c0@"
  fr: "@aBianca@bQue demander de plus face à un tel accueilⓡ\n@c0@"
  it: "@aBianca@bChe accoglienza calorosa!\n@c0@"
  ja: "@a@bビアンカ「あんなふうに　素直に\n\tよろこばれると　悪い気はしないわ。\n\tうふふ。\n@c0@"
185:
  de: "@aNera@bIch fühle mich sehr geschmeichelt, dass die Leute sich so für mich freuen. Dabei habe ich doch nur wenig Zeit in Humburg verbracht.\n@c0@"
  en: "@aNera@bIt's incredibly flattering that people are so pleased to see me back. I was only here for such a short\r\ntime before.\n@c0@"
  es: "@aNera@bVeramente, es halagador ver que la gente se alegra de verme de vuelta. Pero si solo había estado un attimo aquí.\n@c0@"
  fr: "@aNera@bC'est vraiment flatteur d'être accueillie comme ça. D'autant qu'ils n'ont pas eu vraiment le temps de me connaître, la dernière fois.\n@c0@"
  it: "@aNera@bPrima della mia sparizione ero stata a Denim solo per pochissimo tempo, eppure la gente mi vuole già bene...\n@c0@"
  ja: "@a@bフローラ「私が　このお城にいたのは\n\tほんの少しの間だったのに。\n\tあんなに　よろこんでくださって……。\n@c0@"
186:
  de: "@a%0%a001240@bDieser Hund vergöttert %a001250 geradezu. Wenn er sie sieht, wedelt er viel mehr mit dem Schwanz als bei mir.\n@c0@"
  en: "@a%0%a001240@bThat dog really loves %a001250. He wags his tail much more when he sees her than when he sees me.\n@c0@"
  es: "@a%0%a001240@bEse perro le tiene mucho cariño a %a001250. Cuando la ve a ella menea más la cola que cuando me ve a mí.\n@c0@"
  fr: "@a%0%a001240@bCe chien aime vraiment beaucoup %a001250.\nIl remue la queue bien plus fort quand il la voit\nque quand c'est moi.\n@c0@"
  it: "@a%0%a001240@bQuel cagnolino ha un debole per %a001250!\nOgni volta che la vede, scondinzola come un matto!\n@c0@"
  ja: "@a@b%a001240「あの犬　%a001250のことが\n\t大好きなんだよ。　ボクの時とじゃ\n\tしっぽのふり方が　全然　ちがうんだ。\n@c0@"
187:
  de: "@a%0%a001240@b%0%a001250 meint, sie könne verstehen, was die Tiere sagen...\n@c0@"
  en: "@a%0%a001240@b%0%a001250 reckons she can understand what animals are saying, you know.\n@c0@"
  es: "@a%0%a001240@b%0%a001250 dice que puede entender lo que dicen los animales, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bTu sais, %a001250 dit qu'elle arrive à comprendre ce que disent les animaux.\n@c0@"
  it: "@a%0%a001240@bA proposito di animali!\nLo sai che %a001250 dice di essere in grado di capire il loro linguaggio?\n@c0@"
  ja: "@a@b%a001240「それに　%a001250は\n\t動物たちの　言っていることも\n\tわかるみたいなんだよ。\n@c0@"
188:
  de: "@a%0%a001250@bIch liebe Tiere! Und zwar alle Tiere!\n@c0@"
  en: "@a%0%a001250@bI love animals! All animals!\n@c0@"
  es: "@a%0%a001250@b¡Me encantan los animales! ¡Todos!\n@c0@"
  fr: "@a%0%a001250@bJ'adore les animauxⓠ Tous les animauxⓠ\n@c0@"
  it: "@a%0%a001250@bIo amo gli animali!\nTutti gli animali!\n@c0@"
  ja: "@a@b%a001250「わたしね……\n\t動物さんは　みんな　大好き！\n@c0@"
189:
  de: "@aOtto@bDieser Hund war schon hier, als ich noch ein kleiner Junge war. Er muss ganz schön alt sein.\n@c0@"
  en: "@aTuppence@bThat dog's been around ever since I was a young boy. He must be a fair old age by now.\n@c0@"
  es: "@aAlazar@bEse perro lleva por aquí desde que yo era niño. Debe de ser bastante viejo ya.\n@c0@"
  fr: "@aInnocent@bCe chien était déjà ici quand j'étais enfant.\r\nIl doit être très vieux, maintenant.\n@c0@"
  it: "@aSimon@bÈ una vita che conosco quel cane...\nRicordo che, quand'ero bambino, mi veniva sempre incontro per farmi le feste.\n@c0@"
  ja: "@a@bピピン「あの犬は　ボクが子供の頃から\n\tずっといますよね。\n\t長生きして欲しいなあ。\n@c0@"
190:
  de: "@a%0%a001240@bDu warst acht Jahre lang eine Statue und Mama zehn, oder?\n@c0@"
  en: "@a%0%a001240@bYou were a statue for eight years and Mum was a statue for ten years, right, Dad?\n@c0@"
  es: "@a%0%a001240@bFuiste estatua durante ocho años y mamá durante diez, ¿no es así papi?\n@c0@"
  fr: "@a%0%a001240@bTu as été transformé en statue pendant huit ans et maman pendant dix ans, c'est çaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, tu hai vissuto in forma di statua per otto anni, vero?\nE la mamma per dieci...\n@c0@"
  ja: "@a@b%a001240「お父さんが　石になってたのは\n\t８年で　お母さんが　１０年でしょ？\n@c0@"
191:
  de: "@a%0%a001240@bDas heißt, dass wir ganze zwei Jahre zusammen nach Mama gesucht haben!\n@c0@"
  en: "@a%0%a001240@bThat means we were looking for Mum together for two whole years!\n@c0@"
  es: "@a%0%a001240@b¡Eso quiere decir que hemos estado juntos dos años buscando a mamá!\n@c0@"
  fr: "@a%0%a001240@bÇa veut dire qu'on a cherché maman ensemble pendant deux années entièresⓠ\n@c0@"
  it: "@a%0%a001240@bQuindi abbiamo trascorso ben due anni a cercarla!\nÈ un sacco di tempo, no?\n@c0@"
  ja: "@a@b%a001240「ということは　ボクたち\n\t２年も　お父さんと　いっしょに\n\tお母さんを　さがしてたんだね！\n@c0@"
192:
  de: "@a%0%a001250@bMama muss sehr einsam gewesen sein in diesen zehn Jahren, in denen sie ganz alleine war. Wir müssen viel Zeit mit ihr verbringen, um das wettzumachen.\n@c0@"
  en: "@a%0%a001250@bMum must have been so lonely, spending ten years all by herself like that. We should spend lots of time with her from now on to make up for it.\n@c0@"
  es: "@a%0%a001250@bSeguro que mamá se ha sentido muy sola durante esos diez años. A partir de ahora, pasaremos más tiempo con ella para compensar ese tiempo.\n@c0@"
  fr: "@a%0%a001250@bMaman a dû se sentir si seule pendant ces dix ans. On devrait passer beaucoup de temps avec elle pour rattraper un peu le temps perdu.\n@c0@"
  it: "@a%0%a001250@bLa mamma dev'essersi sentita tremendamente sola nei dieci anni in cui è stata pietrificata.\n㈡\nStiamole vicini, così dimenticherà in fretta quell'orribile periodo della sua vita!\n@c0@"
  ja: "@a@b%a001250「お母さん　きっと　１０年も\n\tひとりぼっちで　さみしかったよね。\n\tこれからは　一緒に　いてあげようね。\n@c0@"
193:
  de: "@aSancho@bZehn Jahre? Ui, das ist eine lange Zeit. Und es ist so viel passiert. Deine Onkel Sancho, er ist auch nisst mehr der Jüngste.\n@c0@"
  en: "@aSancho@bTen years? Uf, ees a long time.\nEso many theengs have happened.\nYour Uncle Sancho, he ees no eso young now.\n@c0@"
  es: "@aSancho@b¿Diez años nomás? Uf, eso es mucho tiempo.\nPasaron bien de cosas.\nEl tito Sancho ya no es ningún chamaco.\n@c0@"
  fr: "@aSancho@bDix ans, c'est très long. Il y a t-tellement de choses qui sont arrivées. Ton tonton Sancho, il n'est plus très j-jeune, maintenant.\n@c0@"
  it: "@aSancho@bDieci años sono un periodo muy lungo, chico.\n¿Dieci años fa lo zio Sancho era mucho más giovane, sabe?\n㈡\n¡Avevo almenos dieci años de menos!\n@c0@"
  ja: "@a@bサンチョ「あれから　もう１０年ですか。\n\t本当に　いろいろ　ありましたね。\n\t私も　年を　取るわけですよ……。\n@c0@"
194:
  de: "@aBianca@bKaum vorstellbar, dass so viel Zeit vergangen ist, nicht?\n@c0@"
  en: "@aBianca@bIt's hard to believe so much time passed, eh?\n@c0@"
  es: "@aBianca@bNo puedo creer que haya pasado tanto tiempo, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJ'ai du mal à me dire qu'il s'est passé autant de temps.\n@c0@"
  it: "@aBianca@bQuasi non mi sembra vero che sia trascorso tanto tempo...\n@c0@"
  ja: "@a@bビアンカ「本当に　そんなに\n\t長い時間が　流れていたのね。\n@c0@"
195:
  de: "@aBianca@bEs fühlt sich gar nicht so lange an. Geht es dir auch so, %a000090?\n@c0@"
  en: "@aBianca@bIt dun't feel that long somehow.\nIs it the same for you, %a000090?\n@c0@"
  es: "@aBianca@bA mí no me ha parecido tanto.\n¿A ti te pasa lo mismo, %a000090?\n@c0@"
  fr: "@aBianca@bÉtonnamment, ça ne m'a pas paru si long que ça.\nC'est pareil pour toi, %a000090ⓡ\n@c0@"
  it: "@aBianca@bA volte mi pare che gli ultimi dieci anni siano volati, forse perché quand'ero una statua non ero cosciente del tempo che passava.\n㈡\nÈ stato lo stesso anche per te, %a000090?\n@c0@"
  ja: "@a@bビアンカ「正直　あんまり\n\tそんな気が　しないんだけど……\n\t%a000090のときも　そうだった？\n@c0@"
196:
  de: "@aNera@bJa, die Kinder müssen nun schon zehn Jahre alt sein. Fast schon kleine Erwachsene. \n@c0@"
  en: "@aNera@bYes, the children must be ten years old already. They're getting quite grown-up now.\n@c0@"
  es: "@aNera@bPues sí, los bambini ya deben tener diez anni. Ya son bastante mayores.\n@c0@"
  fr: "@aNera@bOui, les enfants on déjà dix ans. Ils sont grands, maintenant.\n@c0@"
  it: "@aNera@bI nostri figli hanno già dieci anni... Sono ancora dei bambini, ma hanno già fatto esperienze che molte persone non faranno mai in tutta la loro vita.\n@c0@"
  ja: "@a@bフローラ「もう　子供たちは１０才なのね。\n\t大きくなっているはずですわ。\n@c0@"
197:
  de: "@aNera@bIch weiß, man kann nichts daran ändern, aber ich wünschte, ich hätte sie aufwachsen sehen...\n@c0@"
  en: "@aNera@bI know there's nothing to be done about it, but\r\nI do wish I'd been there to see them in their\r\nyounger years.\n@c0@"
  es: "@aNera@bSé que no se puede hacer niente, pero ojalá hubiera estado allí mientras eran pequeños.\n@c0@"
  fr: "@aNera@bJe sais que je ne peux rien y changer, mais j'aurais bien aimé les voir grandir.\n@c0@"
  it: "@aNera@bNon perdonerò mai chi mi trasformò in una statua di avermi privata della gioia di vederli crescere.\nMai.\n@c0@"
  ja: "@a@bフローラ「今さら　しかたありませんけど\n\tいっしょに　そばにいて　成長を\n\t見まもってあげたかったわね……。\n@c0@"
198:
  de: "@a%0%a001240@bWir haben keine Wahl, wir müssen nach Nadiria. Um Großmutter zu retten...\n@c0@"
  en: "@a%0%a001240@bWe don't have any choice but to go to Nadiria, though. Not if we want to save Grandma.\n@c0@"
  es: "@a%0%a001240@bNo nos queda otra opción que dirigirnos a Nadiria. Al menos si queremos salvar a la abuela.\n@c0@"
  fr: "@a%0%a001240@bMais nous n'avons pas trop le choix. Nous devons aller à Nadiria si nous voulons sauver grand-mère.\n@c0@"
  it: "@a%0%a001240@bNon abbiamo scelta, papà...\nSe vogliamo salvare la nonna, dobbiamo andare a Nadiria.\n@c0@"
  ja: "@a@b%a001240「でも　魔界を\n\tこわがってたら　おばあちゃんを\n\t助けてあげられないもんね。\n@c0@"
199:
  de: "@a%0%a001250@bIch frage mich, ob es überhaupt jemanden gibt, der das weiß...\n@c0@"
  en: "@a%0%a001250@bI wonder if there's anyone about who does know how you get there.\n@c0@"
  es: "@a%0%a001250@bMe pregunto si alguien sabrá cómo llegar hasta allí.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si quelqu'un sait comment y aller.\n@c0@"
  it: "@a%0%a001250@bChissà se c'è qualcuno che sa come si raggiunge Nadiria... L'ingresso per quel luogo dev'essere il segreto più segreto del mondo!\n@c0@"
  ja: "@a@b%a001250「誰か　知ってる人\n\tどこかに　いないかな？\n@c0@"
200:
  de: "@aSancho@bAber wir werden nisst aufgeben! Es ist wie mit eine Reiskorn.\n㈡\nAlleine, es ist klein und schwach, aber zusammen mit viele andere ergibt es eine köstlisse Paella!\n@c0@"
  en: "@aSancho@bBut we no geeve up! All the questions we ask, they are like the grains of rice. Alone, ees notheeng. But together, they make the paella!\n@c0@"
  es: "@aSancho@b¡No nos demos por vencidos! Las preguntas que hacemos son meros frijoles, por separado no significan nada.\n㈡\n¡Pero si los juntas, pues te sale un platillo delicioso!\n@c0@"
  fr: "@aSancho@bMais on n'abandonnera pasⓠ T-Toutes les questions qu'on p-pose, c'est comme des grains de riz. Seuls, c'est rien, mais ensemble, ça fait oune paellaⓠ\n@c0@"
  it: "@aSancho@b¡No ce possiamo arrendere, chico!\nDobbiamo insistere, y continuar a raccogliere informaciónes...\n㈡\n¡Cada domanda que fai es como un chicchin de riso: da solo no serve a nada, ma tantos chicchinos insiemes formano una maravillosa paella!\n@c0@"
  ja: "@a@bサンチョ「あきらめては　いけませんよ。\n\t情報集めは　根気よく続けねば\n\t意味を　なしませんからね。\n@c0@"
201:
  de: "@aSancho@bDieser Otto ist kein schlechter Señor, no? Warum fragst du ihn nisst, ob er uns begleiten möchte?\n@c0@"
  en: "@aSancho@bThees Tuppence, he no eseem like a bad señor, no?\nWhy don't you ask heem to accompany you?\n@c0@"
  es: "@aSancho@bEste Alazar no parece un mal señor, ¿verdad?\r\n¿Por qué no le pides que te acompañe?\n@c0@"
  fr: "@aSancho@bCet Innocent n'a pas l'air d'être oun mauvais\nbougre, noⓡ Pourquoi ne pas lui d-d-demander\nde t'accompagnerⓡ\n@c0@"
  it: "@aSancho@bEl señor Simon es un bravo hombre, chico...\n¿Por qué non gli chiedi de accompagnarte?\n@c0@"
  ja: "@a@bサンチョ「あの　ピピンという兵士\n\tなかなか　見どころがあるそうです。\n\tどうです　旅に同行させては？\n@c0@"
202:
  de: "@a%0%a001240@bOtto ist einer der Wachleute, die immer um die Burg patrouillieren. Ich finde seinen Namen so lustig, deshalb habe ich ihn behalten.\n@c0@"
  en: "@a%0%a001240@bTuppence is one of the guards who's always patrolling the castle. I remember his name because\nit sounds a bit funny!\n@c0@"
  es: "@a%0%a001240@bAlazar es uno de los guardias que está siempre patrullando por el castillo. ¡Recuerdo cómo se llama porque suena gracioso!\n@c0@"
  fr: "@a%0%a001240@bInnocent est l'un des gardes qui patrouillent en permanence dans le château. Je me souviens de\nson nom parce qu'il est un peu rigoloⓠ\n@c0@"
  it: "@a%0%a001240@bSimon è una delle migliori guardie del Castello di Denim. Tutti dicono che è forte, buono e coraggioso.\nEd è anche simpatico!\n@c0@"
  ja: "@a@b%a001240「ピピンって　いっつも\n\tお城の　見まわりをしてる人だよね。\n\tボク　名前おぼえてるよ！\n@c0@"
203:
  de: "@a%0%a001240@bIch mag Otto. Wir sollten ihn wieder mitnehmen!\n@c0@"
  en: "@a%0%a001240@bI quite like Tuppence. We should take him along with us again!\n@c0@"
  es: "@a%0%a001240@bMe cae bien Alazar. ¡Deberíamos llevarlo con nosotros otra vez!\n@c0@"
  fr: "@a%0%a001240@bJ'aime bien Innocent. J'aimerais bien qu'il nous accompagne à nouveauⓠ\n@c0@"
  it: "@a%0%a001240@bSimon è proprio una brava persona.\nForse potremmo portarlo con noi qualche altra volta, non credi?\n@c0@"
  ja: "@a@b%a001240「ピピン　けっこう\n\tボク　好きだったな。\n\tまた　連れていってあげようよ！\n@c0@"
204:
  de: "@aSancho@bSiehst du, Chico. Alle lieben diss. Dieser Señor weiß, dass du großartig bist.\n@c0@"
  en: "@aSancho@bYou see, friend. You are loved by everyone.\nThees señor, he knows how great you are.\n@c0@"
  es: "@aSancho@bYa lo ves, chamaco, todo el mundo te quiere.\r\nPues hasta este señor sabe que eres una gran persona.\n@c0@"
  fr: "@aSancho@bTu vois, chico. Tout le monde t'aime. Ce señor, il sait que tu es f-f-fantastique.\n@c0@"
  it: "@aSancho@bEl señor Simon nutre grandissima estima por ti, chico.\n@c0@"
  ja: "@a@bサンチョ「おやおや　坊っちゃん。\n\t宿屋のせがれに　ずいぶん\n\tしたわれましたね。\n@c0@"
205:
  de: "@aSancho@bDu solltest ihn bitten, uns wieder zu begleiten, no?\n@c0@"
  en: "@aSancho@bYou eshould ask heem to accompany you again, no?\n@c0@"
  es: "@aSancho@b¿No crees que deberías pedirle que te acompañase otra vez?\n@c0@"
  fr: "@aSancho@bTu devrais lui demander de nous accompagner\noune nouvelle fois, noⓡ\n@c0@"
  it: "@aSancho@b¿Por qué non gli chiedi de venire con nosotros qualche altras vez?\n@c0@"
  ja: "@a@bサンチョ「せっかくですから　どうです？\n\t連れていってやっては？\n@c0@"
206:
  de: "@aSancho@bIss habe miss schon gefragt, warum iss gar kein Schach mehr spiele, aber jetzt iss weiß. Es ist wegen Otto, er hat das Schachspiel.\n@c0@"
  en: "@aSancho@bI ask myself, ⓗWhy you no esee thees chess no more, Sancho?ⓘ, and now I know. Ees because señor Tuppence, he has eet all the time.\n@c0@"
  es: "@aSancho@bYo me preguntaba, ⓕSancho, ¿por qué ya nunca ves ese monstriajedrez?ⓖ, y ahorita ya lo sé. Es porque el señor Alazar lo tuvo siempre.\n@c0@"
  fr: "@aSancho@bEt moi qui me demandais ⓥPourquoi tu ne vois plus le jeu d'échecs, Sanchoⓡⓦ. Maintenant, je sais. C'est\np-p-parce que le señor Innocent le gardait avec lui.\n@c0@"
  it: "@aSancho@b¡Ahora entiendo por qué la escacchiera de los mostros era esparita! El señor Simon l'aveva nascosta, en quantos es un oggetto muy pericolosos!\n@c0@"
  ja: "@a@bサンチョ「見かけないと　思っていたら\n\tピピンが　しまっていたんですね。\n@c0@"
207:
  de: "@aSancho@bUnd es stimmt. Si, si. Iss erinnere miss an den Glanz in den Augen der Männer, wenn sie Schach spielen. Das ist gar nisst gut, no.\n@c0@"
  en: "@aSancho@bAnd ees true. Sí, sí. I remember the look een the men's eyes when they play thees chess.\r\nEsometheeng was no right.\n@c0@"
  es: "@aSancho@bY es verdad. ¡Órale!, recuerdo bien la mirada en los ojos de los soldados cuando jugaban a este monstriajedrez.\n㈡\nAlgo no andaba bien.\n@c0@"
  fr: "@aSancho@bEt c'est vrai, ce qu'il d-dit. Si, si. Je me rappelle du regard de ces hommes, quand ils j-j-jouaient aux échecs. Il y avait quelque chose de pas normal.\n@c0@"
  it: "@aSancho@bMe recuerdo que, cuando giocavano con la escacchiera, los soldados erano como en trance.\n¡Ay, que bruttas cosas!\n@c0@"
  ja: "@a@bサンチョ「たしかに　あの頃\n\tこのチェスをする者の目つきには\n\t異様なものが　ありましたよ。\n@c0@"
208:
  de: "@a%0%a001250@bIch weiß nicht warum, aber irgendwie macht mir dieses Schachspiel Angst. Du lässt mich doch nicht mit ihm allein, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bI find that chess set a bit scary for some reason. You won't leave me alone with it, will you, Dad?\n@c0@"
  es: "@a%0%a001250@bPor algún motivo, ese monstriajedrez me da miedo. No me dejes sola con él, ¿vale, papi?\n@c0@"
  fr: "@a%0%a001250@bCe jeu d'échecs me fait un peu peur. Tu ne me laisseras pas toute seule avec, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ho paura di quella scacchiera!\nTienila lontana da me!\n@c0@"
  ja: "@a@b%a001250「わたし　そのチェス\n\tなんだか　こわい……。\n\tお父さん　ちゃんと　そばにいてね。\n@c0@"
209:
  de: "@a%0%a001240@bIch hab heute gar nicht ins Bett gemacht, Papa!\n@c0@"
  en: "@a%0%a001240@bI didn't wet the bed today, Dad! Ahem!\n@c0@"
  es: "@a%0%a001240@b¡Hoy no he mojado la cama, papá! ¡Ejem!\n@c0@"
  fr: "@a%0%a001240@bJe n'ai pas fait pipi au lit aujourd'hui, papaⓠ Humⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, che facciamo ora?\n@c0@"
  ja: "@a@b%a001240「ボク　今日は\n\tおねしょ　しなかったよ。　エッヘン！\n@c0@"
210:
  de: "@a%0%a001250@bDu hast es gut, Papa. Du kannst in aller Ruhe schlafen. %0%a001240 steht dauernd auf und macht Krach.\n@c0@"
  en: "@a%0%a001250@bYou sleep all nice and quietly, Dad. %0%a001240 moves about all the time and makes a terrible noise.\n@c0@"
  es: "@a%0%a001250@bTú duermes muy bien, papá. %0%a001240 se mueve todo el rato y hace un ruido tremendo.\n@c0@"
  fr: "@a%0%a001250@bToi, tu dors bien tranquillement, papa. Mais %a001240, il n'arrête pas de remuer et de faire du bruit.\n@c0@"
  it: "@a%0%a001250@bPapà, quando dormi non ti muovi e non fai rumore.\n%0%a001240, invece, è peggio di un terremoto!\n@c0@"
  ja: "@a@b%a001250「お父さんって\n\tねぞうが　いいのね。\n\t%a001240ったら　もう　ひどくって！\n@c0@"
211:
  de: "@aOtto@bEs ist schon lustig, unter diesen Umständen in seinem eigenen Heim zu übernachten.\n@c0@"
  en: "@aTuppence@bIt's quite amusing staying in one's own home under these circumstances.\n@c0@"
  es: "@aAlazar@bEs divertido quedarte en tu propia casa en estas circunstancias.\n@c0@"
  fr: "@aInnocent@bC'est assez amusant de dormir chez soi dans ces circonstances.\n@c0@"
  it: "@aSimon@bSe avessi un paio d'ore libere, andrei volentieri a farmi un delizioso stufato di Cinghialorco, ma temo che dovrò rimandare a un altro momento...\n@c0@"
  ja: "@a@bピピン「自分の家に\n\tこういう泊まりかたを　するのって\n\tなんだか　しんせんですよ。\n@c0@"
212:
  de: "@aNera@bEs macht mich ganz verlegen, irgendwo übernachten zu dürfen, ohne dafür zu zahlen...\n@c0@"
  en: "@aNera@bIt's a little bit embarrassing being allowed to stay in the place without paying.\n@c0@"
  es: "@aNera@bMe da molta vergüenza quedarme en un sitio sin pagare.\n@c0@"
  fr: "@aNera@bJe suis un peu gênée de rester quelque part\r\nsans payer.\n@c0@"
  it: "@aNera@bChe gentile quella signora...\nVoglio tornare a trovarla, uno di questi giorni.\n@c0@"
  ja: "@a@bフローラ「タダで　泊めていただくなんて\n\tなんだか　申しわけないですわ。\n@c0@"
213:
  de: "@a%0%a001240@bWir waren nicht oft hier. Vielleicht sollten wir das nächste Mal Ja sagen.\n@c0@"
  en: "@a%0%a001240@bWe never really stayed here very much.\nWe should say yes next time.\n@c0@"
  es: "@a%0%a001240@bNunca nos hemos quedado mucho aquí.\nLa próxima vez tenemos que decir que sí.\n@c0@"
  fr: "@a%0%a001240@bOn n'est pas restés beaucoup ici. On devrait dire oui, la prochaine fois.\n@c0@"
  it: "@a%0%a001240@bLa prossima volta mi piacerebbe fermarmi in questo posto.\nSembra proprio carino!\n@c0@"
  ja: "@a@b%a001240「ボクたち　ここには\n\tあんまり　泊まったことが　ないんだ。\n\t今度　泊まろうね！\n@c0@"
214:
  de: "@a%0%a001250@bDu siehst müde aus, Papa. Geht es dir gut? Du musst hin und wieder auch ein wenig schlafen, hörst du?\n@c0@"
  en: "@a%0%a001250@bYou seem a bit tired, Dad. Are you alright?\nYou must rest every now and then, you know.\n@c0@"
  es: "@a%0%a001250@bPareces un poco cansado, papá. ¿Estás bien?\nTienes que descansar de vez en cuando, ¿vale?\n@c0@"
  fr: "@a%0%a001250@bTu as l'air un peu fatigué, papa. Tu vas bienⓡ\nTu dois te reposer de temps en temps, tu sais.\n@c0@"
  it: "@a%0%a001250@bPapà, mi sembri un po' stanco...\nOgni tanto dovresti fermarti per riposare un po', sai?\n@c0@"
  ja: "@a@b%a001250「お父さん　すこし\n\tつかれてるみたいだけど　大丈夫？\n\t旅は　ムリしちゃいけないのよ。\n@c0@"
215:
  de: "@aOtto@bMan sollte immer das Beste aus der Situation machen, auch wenn die Herberge überlaufen und ein wenig heruntergekommen ist.\n@c0@"
  en: "@aTuppence@bIf you don't mind the place being rather cramped and shabby, then please do avail yourself of it whenever you wish.\n@c0@"
  es: "@aAlazar@bSi no os importa que el sitio sea pequeño y humilde, por favor, acomodaos según os parezca.\n@c0@"
  fr: "@aInnocent@bSi ça ne vous ennuie pas que l'endroit soit un peu exigu et défraîchi, alors profitez-en aussi souvent que vous voudrez.\n@c0@"
  it: "@aSimon@bCerto, la sistemazione è tutt'altro che principesca, ma va più che bene per riposare e recuperare energie...\n@c0@"
  ja: "@a@bピピン「%a000090さま　どうぞ\n\tせまくて　きたない所ですけど\n\t良かったら　泊まっていってください。\n@c0@"
216:
  de: "@aOtto@bEs ist die Pflicht eines jeden Soldaten, das Volk seines Landes zu b'schützen.\n@c0@"
