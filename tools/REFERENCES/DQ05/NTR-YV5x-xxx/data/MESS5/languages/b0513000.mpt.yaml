  it: "@aSimon@bHo la sensazione che questo tipo diventerà ospite fisso del Museo. Chissà, magari potremmo esporlo come ⓕvisitatore più strambo del mondoⓖ...\n@c0@"
  ja: "@a@bピピン「この様子からすると　とうぶん\n\tここに　住みこみそうですよ。\n\tイヤだなあ……。\n@c0@"
514:
  de: "@aBianca@bNur ein einziges Gebäude auf einer winzigen Insel... Und doch ist es ein großartiges, prächtiges Firlefanzeum!\n@c0@"
  en: "@aBianca@bOne single buildin' on one tiny island...\r\nAnd yet it's a great big knick-knackatory!\n@c0@"
  es: "@aBianca@bUn solo edificio en una isla minúscula...\r\n¡Pero es un musenino genial!\n@c0@"
  fr: "@aBianca@bUn seul et unique bâtiment sur une île\nminuscule... et c'est une fantastique et\nremarquable Galericabracⓠ\n@c0@"
  it: "@aBianca@bUn edificio solitario su una piccola isola...\nSignore e signori, benvenuti al grande Museo del Souvenir!\n@c0@"
  ja: "@a@bビアンカ「こんな小さな島に\n\tただひとつの建物……。\n\tそれが　博物館なんて　ステキよね。\n@c0@"
