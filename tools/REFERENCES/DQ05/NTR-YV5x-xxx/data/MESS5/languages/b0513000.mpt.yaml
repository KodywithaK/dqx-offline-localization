  ja: "@a@bフローラ「寝ているときでも\n\t名産品のことを\n\t考えているみたいですね。\n@c0@"
510:
  de: "@a%0%a001240@bMann! Kann der schnarchen! Der ganze Raum bebt!\n@c0@"
