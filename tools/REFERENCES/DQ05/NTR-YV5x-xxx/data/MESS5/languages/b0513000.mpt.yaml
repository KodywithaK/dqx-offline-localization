  fr: "@aBianca@bTu n'en pincerais pas un peu pour elle,\npar hasard, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon penserai mica che quella tipa sia elegante e raffinata, %a000090?!\n@c0@"
  ja: "@a@bビアンカ「%a000090　ひょっとして\n\tあの娘に　見とれてたなんてこと\n\tないよね？\n@c0@"
127:
  de: "@aNera@bMacht es dir denn nichts aus, dass sie hier drin in diesem Aufzug herumläuft, %a000090?\n@c0@"
  en: "@aNera@bDon't you mind her wearing that in here, %a000090?\n@c0@"
  es: "@aNera@b¿No te importa que vaya vestida così, %a000090?\n@c0@"
  fr: "@aNera@bÇa ne te gêne pas de la voir dans cette tenue, %a000090ⓡ\n@c0@"
  it: "@aNera@bMa l'hai vista?!\n%0%a000090, ma ti sembra il modo di vestirsi per una visita a un museo?!\n@c0@"
  ja: "@a@bフローラ「%a000090さん　あの方が\n\t着ている服が　気になるとか……。\n@c0@"
128:
  de: "@aNera@bNein, natürlich nicht! Du bist immer so tolerant, nicht wahr?\n@c0@"
  en: "@aNera@bNo, of course you don't! You're so tolerant of people, aren't you?\n@c0@"
  es: "@aNera@bNo, claro. Eres molto tolerante, ¿verdad?\n@c0@"
