0:
  de: "@a%0%a001250@bIch frage mich, von welchem Potenzial sie da redet. Es gibt doch so viele Möglichkeiten. Vielleicht sogar Hunderte und Aberhunderte.\n@c0@"
  en: "@a%0%a001250@bI wonder what kind of potential she's talking about.\nThere are so many different kinds.\nHundreds and hundreds, potentially...\n@c0@"
  es: "@a%0%a001250@bMe pregunto sobre qué potencial estará hablando...\nHay muchas clases de potencial.\nPotencialmente cientos de ellas...\n@c0@"
  fr: "@a%0%a001250@bJe me demande de quelles capacités elle parle.\nIl y en a tellements de sortes. Des centaines et des centaines, potentiellement.\n@c0@"
  it: "@a%0%a001250@bLa signora ha ragione: la creatività degli uomini è davvero immensa e si manifesta in mille modi diversi.\n@c0@"
  ja: "@a@b%a001250「可能性っていっても\n\tいっぱいあるけど　どんな\n\t可能性を感じたのかなあ？\n@c0@"
1:
  de: "@aSancho@bIn diesen Ausstellungsstücken sieht die Señora das Potenzial der Menschheit.\n@c0@"
  en: "@aSancho@bEen these displays, thees señora esees the potential of the mankind.\n@c0@"
  es: "@aSancho@bEn estas obras de arte la señora ve el potencial de la raza humana.\n@c0@"
  fr: "@aSancho@bCette s-señora voit dans ces p-p-pièces\r\nce dont l'homme est capable.\n@c0@"
  it: "@aSancho@bLa señora considera los souvenir la concretizzazione de la grande creatividad de los esseres humanos. ¡Ay, que pensiero maravilloso!\n@c0@"
  ja: "@a@bサンチョ「名産品から　人の可能性を\n\t感じとられるとは……。\n@c0@"
2:
  de: "@aSancho@bSí, sie ist eine sehr kluge Señora.\n@c0@"
  en: "@aSancho@bSí, eshe ees a very eshrewd señora.\n@c0@"
  es: "@aSancho@bEs una señora retetaimada.\n@c0@"
  fr: "@aSancho@bC'est oune femme muy intelligente, si.\n@c0@"
  it: "@aSancho@bCuando siento riflessiones tantos profundas, yo...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あの方　かなりの目利きと\n\tみました。\n@c0@"
3:
  de: "@aBianca@bUnd wie hier was los ist! Schade, dass wir kein Eintrittsgeld verlangen, was?\n@c0@"
  en: "@aBianca@bIt is bustlin', that's for sure. Shame we en't chargin' an entrance fee, eh?\n@c0@"
  es: "@aBianca@bEstá hasta arriba de gente. Es una pena que no podamos cobrar entrada, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est plein à craquer, effectivement. Dommage qu'on ne fasse pas payer l'entrée, heinⓡ\n@c0@"
  it: "@aBianca@bCerto che questo posto è favoloso!\nStiamo lavorando sodo per farlo diventare il museo più bello del mondo!\n@c0@"
  ja: "@a@bビアンカ「大はんじょうなのかな？\n\t私たちが入場料とってるわけじゃ\n\tないから　よくわからないね。\n@c0@"
4:
  de: "@aNera@bWie wundervoll, all diese Leute zu sehen, die sich extra hierher bemüht haben, um sich anzuschauen, was wir ausstellen. Nicht wahr?\n@c0@"
  en: "@aNera@bIt's a wonderful feeling seeing all these people who've made such an effort to come and see the exhibits we've put on display, isn't it?\n@c0@"
  es: "@aNera@bEs veramente agradable ver a toda esta gente que ha hecho el esfuerzo de venir para ver todas las cosinas que estamos exhibiendo, ¿verdad?\n@c0@"
  fr: "@aNera@bC'est un sentiment merveilleux de voir tous ces gens faire l'effort de venir admirer l'exposition que nous avons mise en place, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bÈ meraviglioso vedere che i visitatori apprezzano il lavoro che stiamo facendo per il Museo. È la più bella ricompensa che potessi sperare di ricevere!\n@c0@"
  ja: "@a@bフローラ「私たちが集めた名産を\n\tお客さんたちが　苦労して見にきて\n\tくださって…　うれしいですわね。\n@c0@"
5:
  de: "@a%0%a001240@bEs kommt mir vor, als wäre es ewig her, dass hier nur ein Bau mit nichts als Spinnweben darin stand. \n@c0@"
  en: "@a%0%a001240@bIt seems like ages ago now that this place was just a cobwebby old place with nothing in it.\n@c0@"
  es: "@a%0%a001240@bParece que ha pasado un siglo desde que este lugar no era más que un sitio vacío lleno de telas de araña.\n@c0@"
  fr: "@a%0%a001240@bOn a l'impression que ça remonte à des siècles maintenant, l'époque où cet endroit ne se réduisait qu'à de vieux murs vides pleins de toiles d'araignées.\n@c0@"
  it: "@a%0%a001240@bE pensare che fino a un po' di tempo fa la cosa più interessante che c'era qui dentro era... Geremia!\n@c0@"
  ja: "@a@b%a001240「こうなると　あの\n\tなにもなくて　静かだった博物館が\n\tなつかしく思えるね。\n@c0@"
6:
  de: "@a%0%a001250@bEs ist ein so großartiges Gefühl, all diese Leute hier zu sehen.\n@c0@"
  en: "@a%0%a001250@bIt's such a great feeling to see all these people here.\n@c0@"
  es: "@a%0%a001250@bMe encanta ver a tanta gente aquí.\n@c0@"
  fr: "@a%0%a001250@bC'est un sentiment tellement agréable de voir tous\nces gens ici.\n@c0@"
  it: "@a%0%a001250@bQuanti visitatori!\nE guarda che espressioni soddisfatte!\nStiamo facendo un buon lavoro, non è vero?\n@c0@"
  ja: "@a@b%a001250「お客さんが　いっぱいって\n\tうれしいね。\n@c0@"
7:
  de: "@aSancho@bSieh dir nur alle diese Leute an, Chico! Sie machen miss so glückliss! Sí, wir haben ein gutes Museum!\n@c0@"
  en: "@aSancho@bLook at all these señores and señoras!\r\nEet, eet makes me eso happy!\nSí, ees a great knick-knackatory.\n@c0@"
  es: "@aSancho@b¡Pero mira qué de gente!\r\nMe alegra tantísimo...\r\nEste musenino está bien padre.\n@c0@"
  fr: "@aSancho@bRegarde t-t-tous ces señores et señorasⓠ\nÇa me rend si heureuxⓠ Si, c'est oune\nmagnifique Galericabrac.\n@c0@"
  it: "@aSancho@b¡Quantas señoras y quantos señores!\r\nSinceramentes, no piensavo que el Museo del Souvenir potesse riscuotere tantos successos...\n@c0@"
  ja: "@a@bサンチョ「こんなにたくさんの\n\tお客さんに　見に来てもらえるとは…\n\tここは　もう　りっぱな博物館ですよ。\n@c0@"
8:
  de: "@aOtto@bIch wette, der alte Firle Franz ist froh wie der Mops im Paletot!\n@c0@"
  en: "@aTuppence@bI bet Old Man Nick's as chuffed as cheese!\n@c0@"
  es: "@aAlazar@bSeguro que el abuelo Nino no cabe en sí de gozo.\n@c0@"
  fr: "@aInnocent@bJe parie que le vieux Bricabrac est\nvachement contentⓠ\n@c0@"
  it: "@aSimon@bQuanti visitatori!\nMi gioco la testa che il caro Geremia starà saltando di gioia.\n@c0@"
  ja: "@a@bピピン「なんとなく　想像できますけど\n\tあの　デスじいさんは\n\tとても　よろこんでいるでしょうね。\n@c0@"
9:
  de: "@aBianca@bWir haben eine ganz schöne Sammlung beisammen, was? Da kann man mal sehen, wo wir schon überall gewesen sind.\n@c0@"
  en: "@aBianca@bWe have got quite a collection goin' now, eh?\r\nJust goes to show how many places we've bin to.\n@c0@"
  es: "@aBianca@bYa tenemos una colección respetable, ¿eh?\r\nDemuestra a cuántos sitios hemos ido.\n@c0@"
  fr: "@aBianca@bOn a une belle collection, maintenant, nonⓡ Ça donne une idée du nombre d'endroits où on est allés.\n@c0@"
  it: "@aBianca@bLa collezione di oggetti del Museo è cresciuta parecchio, e i visitatori sembrano apprezzarla molto.\n@c0@"
  ja: "@a@bビアンカ「ずいぶん名産品が\n\t集まったわよね。\n\tそれだけ　世界をまわったんだわ。\n@c0@"
10:
  de: "@aNera@bErst durch die Reisen mit dir ist mir klar geworden, wie schön die Welt ist, in der wir leben.\n@c0@"
  en: "@aNera@bIt's travelling with you that made me realise how wonderful the world we live in is.\n@c0@"
  es: "@aNera@bViajar con te me ha hecho darme cuenta de lo meraviglioso que es il mondo en que vivimos.\n@c0@"
  fr: "@aNera@bC'est de voyager avec toi qui m'a fait prendre conscience que le monde dans lequel nous\r\nvivons est merveilleux.\n@c0@"
  it: "@aNera@bSì, è proprio così. Ammirare questi oggetti meravigliosi fa capire quanto sia vario e bello il mondo che la dea ha creato per noi...\n@c0@"
  ja: "@a@bフローラ「私も　あなたと旅をして\n\t世界の広さを　実感できました。\n@c0@"
11:
  de: "@a%0%a001240@bDie Räume sehen ganz anders aus, wenn man erst mal etwas Schnickschnack darin platziert hat, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bAll of the rooms look different once you put a few knick-knacks in them, don't they?\n@c0@"
  es: "@a%0%a001240@bTodas las salas cambian una vez pones unas cuantas cosinas en ellas ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bToutes les pièces ont l'air différentes une fois que l'on y place quelques bibelots, tu ne trouves pasⓡ\n@c0@"
  it: "@a%0%a001240@bLe sale del Museo erano più brutte quando erano vuote. Con i souvenir, questo posto ha davvero cambiato faccia!\n@c0@"
  ja: "@a@b%a001240「きれいな名産品を\n\t多くかざると　お部屋の感じも\n\tちがって見えるよね。\n@c0@"
12:
  de: "@a%0%a001250@bMir gefallen hübsche kleine Dinge auch. Die mag ich am liebsten.\n@c0@"
  en: "@a%0%a001250@bI like pretty little knick-knacks too.\nThey're my favourite.\n@c0@"
  es: "@a%0%a001250@bA mi también me encantan las cosinas preciosas.\nSon geniales.\n@c0@"
  fr: "@a%0%a001250@bMoi aussi, j'aime bien les petits bibelots.\nCe sont mes préférés.\n@c0@"
  it: "@a%0%a001250@bGeremia ci aveva visto giusto: il suo Museo del Souvenir sta riscuotendo un successo incredibile!\n@c0@"
  ja: "@a@b%a001250「私も　きれいな名産品って\n\t好きだな。\n@c0@"
13:
  de: "@aSancho@bDu hast einen Blick für das Schöne, sí, Chico? Es ist eine gute Idee, die Dinge so anzuordnen.\n@c0@"
  en: "@aSancho@bYou have the eye for beauties, sí, friend?\nEes a good idea to make the displays like thees.\n@c0@"
  es: "@aSancho@bTienes buen ojo para la belleza, chamaco.\r\nFue una gran idea colocar las cosinas así.\n@c0@"
  fr: "@aSancho@bTu as l'œil pour les belles choses, no, chicoⓡ\nC'était oune bonne idée de disposer les objets\nc-c-comme ça.\n@c0@"
  it: "@aSancho@b¡Con un direttor tanto en gamba, non era possibile que el Museo del Souvenir non fosse un successo! ¡Eh eh eh!\n@c0@"
  ja: "@a@bサンチョ「きれいな名産品を　主にして\n\t展示された　%a000090王のセンスが\n\tよかったのですね。\n@c0@"
14:
  de: "@aOtto@bNun ja, jeder sieht sich gern etwas Hübsches an, net wahr?\n@c0@"
  en: "@aTuppence@bWell everyone likes to gaze on something pretty,\r\ndon't they?\n@c0@"
  es: "@aAlazar@bBueno, a todos nos gusta contemplar algo bello, ¿verdad?\n@c0@"
  fr: "@aInnocent@bDisons que tout le monde préfère regarder\nles jolies choses, n'est-ce pasⓡ\n@c0@"
  it: "@aSimon@bSembra proprio che l'esposizione piaccia molto ai visitatori. Il nostro ⓕdirettoreⓖ ha selezionato gli oggetti giusti e li ha disposti alla perfezione!\n@c0@"
  ja: "@a@bピピン「きれいな名産品は　さすがに\n\t注目されやすいみたいです。\n@c0@"
15:
  de: "@aBianca@bEs würde Spaß machen, hier verschiedene Gerichte auszustellen. Allerdings würden sie sich wohl kaum lange halten.\n@c0@"
  en: "@aBianca@bIt could be fun havin' different foods on display.\r\nHmm, not sure they'd age very well, mind!\n@c0@"
  es: "@aBianca@bPodría tener su gracia exhibir distintos tipos de comida.\n㈡\nMmm, claro que igual no aguantan bien el paso del tiempo, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa pourrait être amusant d'avoir plusieurs types de plats en exposition. Mmm, mais remarque, je ne suis pas sûre qu'ils vieilliraient bienⓠ\n@c0@"
  it: "@aBianca@bMettere del cibo in un museo?!\nUhm...\nE perché no?\n@c0@"
  ja: "@a@bビアンカ「料理の名産も　いいかも。\n\tあっ　でも　ずっと展示しておくのは\n\t無理かな。\n@c0@"
16:
  de: "@aNera@bPapa sagt immer, dass gutes Essen mehr braucht als ein gutes Aroma, um zu einer Spezialität der Haute Cuisine zu werden.\n@c0@"
  en: "@aNera@bPapa always says that good food needs more than a good flavour to become a haute cuisine speciality.\n@c0@"
  es: "@aNera@bIl mio papino sempre dice que la buena cocina no solo es cuestión de sapore.\n@c0@"
  fr: "@aNera@bPapa dit toujours qu'un plat ne doit pas\r\nseulement avoir bon goût pour devenir\r\nréellement gastronomique.\n@c0@"
  it: "@aNera@bQuell'uomo non ha tutti i torti.\nAnzi, si potrebbe persino pensare a un ⓕMuseo del ciboⓖ!\n@c0@"
  ja: "@a@bフローラ「父が　言ってましたけど\n\tただ　おいしいだけでは\n\t料理は　名産にならないそうですわ。\n@c0@"
17:
  de: "@aNera@bEs braucht das gewisse Etwas...\n@c0@"
  en: "@aNera@bIt needs that little something more...\n@c0@"
  es: "@aNera@bTiene que tener algo più...\n@c0@"
  fr: "@aNera@bIl lui faut ce petit quelque chose en plus...\n@c0@"
  it: "@aNera@bUhm, Geremia potrebbe trovare l'idea interessante...\n@c0@"
  ja: "@a@bフローラ「きっと　なにかが\n\t必要なんでしょうね……。\n@c0@"
18:
  de: "@a%0%a001240@bDiese Paellas von Sancho, die sollte man mal hier ausstellen! Die sind klasse!\n@c0@"
  en: "@a%0%a001240@bThose paellas Sancho makes should be on display here. They're amazing!\n@c0@"
  es: "@a%0%a001240@bLos frijoles que cocina Sancho deberían exhibirse. ¡Están de rechupete!\n@c0@"
  fr: "@a%0%a001240@bLes paellas que fait Sancho devraient être exposées ici. Elles sont vraiment incroyablesⓠ\n@c0@"
  it: "@a%0%a001240@bSe i piatti che prepara quell'uomo meritano un posto qui al Museo, allora alle meravigliose paellas dello zio Sancho spetta un'intera sala!\n@c0@"
  ja: "@a@b%a001240「サンチョの作る料理も\n\t名産って呼べるくらい\n\tすごくおいしいよ！\n@c0@"
19:
  de: "@a%0%a001250@bWenn wir hier jemals Essen aufstellen, dann bin ich die Erste, die probiert, was er auftischt!\n@c0@"
  en: "@a%0%a001250@bI'll be first in line to try some of whatever it is he cooks if it ever does end up being on display here. \n@c0@"
  es: "@a%0%a001250@bYo me ofrecería con gusto a probar lo que quiera que cocine si acaba exhibiéndose aquí.\n@c0@"
  fr: "@a%0%a001250@bJe serais la première pour goûter à l'un de ses plats si jamais ils devaient atterrir ici.\n@c0@"
  it: "@a%0%a001250@bM'è venuta fame...\n@c0@"
  ja: "@a@b%a001250「あの人の料理が\n\t名産って　呼ばれるようになったら\n\t食べてみたいね。\n@c0@"
20:
  de: "@aSancho@bIss klappere zwar nisst gerne mit meine eigene Castagnetten, aber iss, iss koche auch sehr gut. Du magst doch meine Paella, sí?\n@c0@"
  en: "@aSancho@bI no like to clack my own castanets, but my cooking ees esometheeng especial, no? You like my paella, sí?\n@c0@"
  es: "@aSancho@bNo es por dármelas de cocinero, pero mi comida está de pelos.\r\n¿A que te gustan mis frijoles?\n@c0@"
  fr: "@aSancho@bJe n'aime pas chanter mes p-p-propres louanges, mais ma cuisine est assez espéciale, noⓡ\nTu aimes ma paella, siⓡ\n@c0@"
  it: "@aSancho@b¡A propositos!\n¿Que mangiamo esta sera?\n¿Paella por todos?\n@c0@"
  ja: "@a@bサンチョ「自分でいうのも　なんですが\n\t私も料理は得意ですよ。\n@c0@"
21:
  de: "@aOtto@bFliegen die Frauen auf Männer, die kochen können? Vielleicht sollte ich auch gelegentlich mal die Uniform mit der Küchenschürze tauschen.\n@c0@"
  en: "@aTuppence@bDo men who can cook attract the ladies?\nPerhaps I ought to don an apron once in a while.\n@c0@"
  es: "@aAlazar@b¿Los hombres que saben cocinar triunfan con las mujeres?\r\nIgual me debía poner el delantal de vez en cuando.\n@c0@"
  fr: "@aInnocent@bEst-ce que les hommes qui savent cuisiner attirent les femmesⓡ Peut-être que je devrais mettre un tablier, de temps en temps.\n@c0@"
  it: "@aSimon@bLe ragazze adorano gli uomini che sanno far da mangiare. Dovrei dedicare un po' di tempo a migliorare la mia abilità in cucina...\n@c0@"
  ja: "@a@bピピン「料理のできる男の人って\n\tもてますかね？\n\tボクも　作ってみようかな？\n@c0@"
22:
  de: "@aBianca@bIch glaube, als ich in ihrem Alter war, wollte ich immer meine eigene Herberge führen.\n@c0@"
  en: "@aBianca@bI seem to remember sayin' it was my dream to run an inn, back when I was her age.\n@c0@"
  es: "@aBianca@bRecuerdo haber dicho a su edad que mi sueño era llevar una posada, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois me souvenir avoir dit un jour que mon rêve était de diriger une auberge, quand j'avais son âge.\n@c0@"
  it: "@aBianca@bQuando avevo la sua età, sognavo che un giorno avrei gestito una locanda tutta mia.\nAh, ne è passato di tempo da allora...\n@c0@"
  ja: "@a@bビアンカ「私も　あの子くらいのとき\n\t大きくなったら　宿屋をやるんだって\n\t言ったことが　あったっけ。\n@c0@"
23:
  de: "@aNera@bVielleicht wird aus diesem kleinen Mädchen einmal eine angesehene Kunsthandwerkerin.\n@c0@"
  en: "@aNera@bPerhaps that little girl will grow up to be an accomplished artisan.\n@c0@"
  es: "@aNera@bQuizás esa picola bambina se convierta en toda una artesana cuando crezca.\n@c0@"
  fr: "@aNera@bPeut-être qu'en grandissant, cette petite fille deviendra un artisan accompli.\n@c0@"
  it: "@aNera@bChissà, magari un giorno quella ragazza riuscirà a relizzare il suo sogno...\nGlielo auguro con tutto il cuore.\n@c0@"
  ja: "@a@bフローラ「あの子が　大きくなったとき\n\tひょっとしたら　職人と呼ばれるように\n\tなっているかもしれませんね。\n@c0@"
24:
  de: "@a%0%a001240@bVielleicht sollte ich auch mal versuchen, was zu basteln.\n@c0@"
  en: "@a%0%a001240@bMaybe I should try making something too.\n@c0@"
  es: "@a%0%a001240@bA lo mejor yo también debería intentar hacer algo.\n@c0@"
  fr: "@a%0%a001240@bPeut-être que moi aussi, je devrais essayer de fabriquer quelque chose.\n@c0@"
  it: "@a%0%a001240@bUhm, potrei provarci anch'io...\n@c0@"
  ja: "@a@b%a001240「う～ん　ボクも何か\n\t作ってみようかなあ。\n@c0@"
25:
  de: "@a%0%a001250@bWas sie da wohl im Sinn hat? Es wäre doch toll, wenn wir etwas von ihr ausstellen könnten, nicht?\n@c0@"
  en: "@a%0%a001250@bI wonder what sort of thing she has in mind.\nIt'd be great if we could put something of hers on display for her, wouldn't it?\n@c0@"
  es: "@a%0%a001250@bMe pregunto qué tendrá en mente.\nEstaría genial poner algo suyo en el museo, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bJe me demande quelle idée elle a en tête, exactement. Ce serait super si on pouvait effectivement exposer une de ses œuvres, un jour, nonⓡ\n@c0@"
  it: "@a%0%a001250@bMi chiedo se quella ragazza abbia già in mente che tipo di oggetto fare... Se sarà bello, gli troveremo di sicuro un posto qui al Museo!\n@c0@"
  ja: "@a@b%a001250「あの子は\n\tどんなものを　作りたいのかな？\n\tできたら　かざってあげようね！\n@c0@"
26:
  de: "@aSancho@bDiese Träume, sie sind so wisstig. Sie machen einen zu dem, was man ist.\n@c0@"
  en: "@aSancho@bThese dreams, they, they are eso important.\r\nThey eshape the man you become een the future.\n@c0@"
  es: "@aSancho@bPues estos sueños son muy importantes.\r\nConforman tu futuro.\n@c0@"
  fr: "@aSancho@bC'est muy important d'avoir des r-rêves. Ce sont eux qui f-f-façonnent la personne que l'on devient plus tard.\n@c0@"
  it: "@aSancho@b¿Ma la vida es un sueño, oppure los sueños aiutano a vivere?\n¡Ah, no importa!\n@c0@"
  ja: "@a@bサンチョ「小さいときの夢は\n\tその後に大きく\n\tかかわってきたりしますから……\n@c0@"
27:
  de: "@aSancho@bDu musst fest an deine Träume glauben.\n@c0@"
  en: "@aSancho@bYou must hold your dreams close to\r\nyour heart.\n@c0@"
  es: "@aSancho@bHay que guardar los sueños bien cerquita del corazón.\n@c0@"
  fr: "@aSancho@bIl faut t-t-toujours s'accrocher à ses rêves, si.\n@c0@"
  it: "@aSancho@bQuello que conta es que los sueños sono una parte importante de la vida de todos los esseres humanos. Bisogna tenerlos siempre vicinos al corazon.\n@c0@"
  ja: "@a@bサンチョ「今もっている　その夢を\n\t大事にしていってほしいですね。\n@c0@"
28:
  de: "@aOtto@bDas kleine Mädchen hat bestimmt eine große Zukunft!\n@c0@"
  en: "@aTuppence@bSounds like the little girl's got quite a future ahead of her!\n@c0@"
  es: "@aAlazar@bParece que la niñita tiene un gran futuro por delante.\n@c0@"
  fr: "@aInnocent@bCette petite fille m'a l'air d'avoir un brillant avenir devant elleⓠ\n@c0@"
  it: "@aSimon@bMaestà, quella ragazzina ha le idee chiare sul proprio futuro, eh?\n@c0@"
  ja: "@a@bピピン「あの子の将来が　楽しみですね。\n@c0@"
29:
  de: "@aBianca@bHier ist jeder willkommen, egal was der Zweck seiner Reise sein mag.\n@c0@"
  en: "@aBianca@bEveryone's welcome here, no matter what the purpose of their journey is.\n@c0@"
  es: "@aBianca@bTodo el mundo es bienvenido, vengan a lo que vengan, ¿sabes?\n@c0@"
  fr: "@aBianca@bTous les visiteurs sont les bienvenus ici, quel que soit le motif de leur voyage.\n@c0@"
  it: "@aBianca@bSì, dev'essere così.\nLa grandezza della dea si manifesta in ogni aspetto della vita degli uomini...\n@c0@"
  ja: "@a@bビアンカ「どんな目的でも\n\t来てくれる人は　大歓迎よ。\n@c0@"
30:
  de: "@aNera@bTja, im Firlefanzeum können die Leute sich wohl gut ein wenig ausruhen.\n@c0@"
  en: "@aNera@bThe knick-knackatory is a good place for people to have a rest, I suppose.\n@c0@"
  es: "@aNera@bBueno, supongo que il musenino es buen lugar per riposare.\n@c0@"
  fr: "@aNera@bJ'imagine que la Galericabrac est un bon endroit pour se reposer.\n@c0@"
  it: "@aNera@bSante parole.\nLa dea ha fatto molti doni agli uomini, e tra questi ci sono senz'altro fantasia e creatività.\n@c0@"
  ja: "@a@bフローラ「この博物館は　休息所としても\n\t使えるんですね。\n@c0@"
31:
  de: "@a%0%a001240@bIch hoffe, hierher kommen immer mehr Reisende und gucken sich alles an, was wir ausgestellt haben.\n@c0@"
  en: "@a%0%a001240@bI hope more and more travellers come by here and look at all the things we've put on display.\n@c0@"
  es: "@a%0%a001240@bEspero que cada vez vengan más viajeros a echar un vistazo a las cosas de la exhibición.\n@c0@"
  fr: "@a%0%a001240@bJ'espère qu'il y aura toujours plus de voyageurs pour venir admirer les choses qu'on a exposées.\n@c0@"
  it: "@a%0%a001240@bSpero che arrivino sempre più visitatori ad ammirare gli oggetti che abbiamo in esposizione.\nNe sarei davvero felice!\n@c0@"
  ja: "@a@b%a001240「旅をしている人も\n\tもっと来て　名産品を\n\t見ていってくれたらいいなあ。\n@c0@"
32:
  de: "@a%0%a001250@bEs ist egal, ob die Leute absichtlich oder nur zufällig vorbeikommen. Je mehr, desto besser.\n@c0@"
  en: "@a%0%a001250@bIt doesn't matter if people plan to come here or just stumble on the place. The more the merrier.\n@c0@"
  es: "@a%0%a001250@bDa igual que la gente haya venido a propósito o que vengan de casualidad. ¡Cuantos más mejor!\n@c0@"
  fr: "@a%0%a001250@bPeu importe que les gens viennent ici exprès ou débarquent par hasard. Plus on est de fous, plus\non rit.\n@c0@"
  it: "@a%0%a001250@bNon m'importa se le persone arrivano qui per caso o appositamente per visitare il Museo: l'importante è che entrino e lo apprezzino!\n@c0@"
  ja: "@a@b%a001250「何気なくでも\n\tよって行ってくれると　うれしいね。\n@c0@"
33:
  de: "@aSancho@bEs ist gut, wenn die Reisenden hier eine Siesta abhalten können, no?\n@c0@"
  en: "@aSancho@bEes good eef the travellers, they can have the siesta here too, no?\n@c0@"
  es: "@aSancho@bPues está bien chido que los viajeros puedan echarse una siestecita aquí.\n@c0@"
  fr: "@aSancho@bC'est bien si les v-v-voyageurs peuvent aussi faire\nla siesta ici, noⓡ\n@c0@"
  it: "@aSancho@bMe es venuta voglia de farme una siesta...\n@c0@"
  ja: "@a@bサンチョ「旅の方が　いやされるような\n\t博物館というのも　いいものです。\n@c0@"
34:
  de: "@aOtto@bAh ja. Es gibt nichts Schöneres als einen guten Platz für ein Nickerchen.\n@c0@"
  en: "@aTuppence@bAh, yes. You can't beat finding a good place to catch forty winks.\n@c0@"
  es: "@aAlazar@b¡Ah!, sí. No hay mejor lugar para echar una cabezadita.\n@c0@"
  fr: "@aInnocent@bC'est vrai. Il n'y a rien de tel que de trouver un bon endroit pour faire un petit somme.\n@c0@"
  it: "@aSimon@bE così il Museo del Souvenir ha anche ricevuto la benedizione del clero.\nE così sia!\n@c0@"
  ja: "@a@bピピン「ボクもそうですけど\n\t思わぬ場所で　休息をとれると\n\tちょっと得した気になりませんか？\n@c0@"
35:
  de: "@aBianca@bIch frage mich, ob er hier wohl etwas ganz Besonderes erforschen wollte. Ich hoffe, er findet, was er sucht.\n@c0@"
  en: "@aBianca@bI wonder if he was here researchin' somethin' or other. I hope the place can be of use to him.\n@c0@"
  es: "@aBianca@bMe pregunto si estará aquí investigando algo. Espero que el sitio le sea útil, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande s'il est ici pour voir quelque chose\r\nen particulier. J'espère en tout cas que notre musée pourra l'aider.\n@c0@"
  it: "@aBianca@bUhm, quel tipo sembra uno scienziato o uno studioso.\nMagari è venuto al Museo per svolgere delle ricerche...\n@c0@"
  ja: "@a@bビアンカ「研究でも　してる人なのかしら？\n\tなんにしろ　この博物館が\n\tあの人の　役に立つといいわね。\n@c0@"
36:
  de: "@aNera@bIch habe gehört, dass manche Leute gern Forschungen zu den Andenken aus den verschiedenen Regionen der Welt betreiben.\n@c0@"
  en: "@aNera@bI heard that some people like to carry out research on the world's various regional souvenirs.\n@c0@"
  es: "@aNera@bHe oído que hay gente que investiga sobre las cosinas de il mondo.\n@c0@"
  fr: "@aNera@bJ'ai entendu dire que certaines personnes faisaient des recherches sur les différentes formes d'artisanat local à travers le monde.\n@c0@"
  it: "@aNera@bSo che numerosi studiosi si interessano di souvenir.\nCome dar loro torto? Sono oggetti così affascinanti!\n@c0@"
  ja: "@a@bフローラ「名産品も　研究の対象に\n\tなることが　あると聞いたことが\n\tありますわ。\n@c0@"
37:
  de: "@a%0%a001240@bAus Büchern zu lernen ist gut und schön, aber noch besser ist es, sich die Dinge selbst anzusehen.\n@c0@"
  en: "@a%0%a001240@bStudying from books is all well and good, but\nit's better if you can actually get to see the real thing too.\n@c0@"
  es: "@a%0%a001240@bEstudiar cosas en los libros está bien y todo eso, pero es mucho mejor si puedes ver las cosas por ti mismo.\n@c0@"
  fr: "@a%0%a001240@bC'est bien d'étudier dans les livres, mais c'est encore mieux quand on peut aller voir les choses en vrai.\n@c0@"
  it: "@a%0%a001240@bStudiare sui libri sarà anche bello, ma esaminare un oggetto da vicino è tutta un'altra cosa! Per questo i musei sono belli: puoi vedere le cose con i tuoi occhi.\n@c0@"
  ja: "@a@b%a001240「本とかで　勉強するのも\n\tいいけど…　どうせ勉強するなら\n\t本物を見てのほうが　いいもんね。\n@c0@"
38:
  de: "@a%0%a001250@bMeinst du, er ist hierher gekommen, um zu forschen?\n@c0@"
  en: "@a%0%a001250@bDo you think he came here to study?\n@c0@"
  es: "@a%0%a001250@b¿Crees que ha venido a estudiar?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il est venu ici pour faire\ndes recherchesⓡ\n@c0@"
  it: "@a%0%a001250@bPenso che sia uno studioso venuto qui per svolgere qualche ricerca...\n@c0@"
  ja: "@a@b%a001250「あの人　ここに\n\tお勉強しに来てるのかな……？\n@c0@"
39:
  de: "@aSancho@bSí, sí. Das Museum ist genau das Risstige zum Erforschen der Kulturen und fremden Orte, no?\n@c0@"
  en: "@aSancho@bSí, sí. Thees museum ees just right for estudying the cultures and the foreign places, no?\n@c0@"
  es: "@aSancho@b¡Ándale! Este museo es el lugar ideal para estudiar culturas y sitios lejanos.\n@c0@"
  fr: "@aSancho@bSi, si. Ce musée est p-p-parfait pour l'étude des cultures et des endroits étrangers, noⓡ\n@c0@"
  it: "@aSancho@bEl Museo del Souvenir diventerà un luego muy popolare tra los estudiosos que esvolgono ricercas sulle diversas culturas del mundo. ¡Soy seguro!\n@c0@"
  ja: "@a@bサンチョ「地域や文化を研究するのでしたら\n\tここの博物館は　もってこいの\n\t場所ですからね。\n@c0@"
40:
  de: "@aOtto@bIch wär gar net überrascht, wenn hinterher ein Loch in den Ausstellungsstücken wär, so intensiv, wie er sie anstarrt!\n@c0@"
  en: "@aTuppence@bI wouldn't be surprised if he bored a hole in the exhibits looking at them so intently like that!\n@c0@"
  es: "@aAlazar@bNo me sorprendería si les hiciera un agujero a las cosinas de mirarlas con tanta concentración.\n@c0@"
  fr: "@aInnocent@bÇa ne m'étonnerait qu'à moitié si, à force de fixer\nles objets comme ça, il finissait par faire un trou dedansⓠ\n@c0@"
  it: "@aSimon@bSe continua a guardare con tanta intensità i souvenir esposti, finirà per consumarceli!\n@c0@"
  ja: "@a@bピピン「あんなに　しんけんに見られたら\n\t名産品に　穴が　あきそうですよ。\n@c0@"
41:
  de: "@aBianca@bEs ist schön, Dinge in einem Museum zu bewundern, aber noch schöner ist es, hübsche Dinge zu Hause stehen zu haben.\n@c0@"
  en: "@aBianca@bIt's nice to see things in a museum, but you can't beat havin' somethin' nice on display at home.\n@c0@"
  es: "@aBianca@bEs maravilloso ver cosas en un museo, pero no hay nada mejor que tener algo bonito en casa, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est sympa de voir des œuvres dans un musée, mais rien ne vaut le plaisir d'avoir un bel objet chez soi.\n@c0@"
  it: "@aBianca@bCerto, ammirare i souvenir esposti in questo Museo è bello, ma potersi godere un bell'oggetto nella comodità della propria casa è anche meglio!\n@c0@"
  ja: "@a@bビアンカ「博物館で　見るのもいいけど\n\t買って家にかざっておけるのが\n\t名産品の　いいところよね。\n@c0@"
42:
  de: "@aNera@bJedes Souvenir ist ein wunderbares Geschenk, weil es zeigt, dass der Schenkende unterwegs an den Beschenkten gedacht hat.\n@c0@"
  en: "@aNera@bAny souvenir is a wonderful gift, because it shows you were thinking of someone on your travels.\n@c0@"
  es: "@aNera@bCualquier cosina es un regalo meraviglioso porque muestra que has pensado en alguien mientras viajabas.\n@c0@"
  fr: "@aNera@bUn souvenir, c'est un magnifique cadeau. Ça montre que l'on a pensé à la personne pendant son voyage.\n@c0@"
  it: "@aNera@bQuel tipo vorrebbe acquistare il Museo del Souvenir, eh? Dovrà prima passare sul cadavere di Geremia!\n@c0@"
  ja: "@a@bフローラ「買って帰る　名産品は\n\t旅の　思い出がつまった\n\t大切な物ですから……\n@c0@"
43:
  de: "@aNera@bIch bin sicher, sie freut sich über alles, was er ihr am Ende kauft.\n@c0@"
  en: "@aNera@bI'm sure she'll be delighted with whatever he decides to buy in the end.\n@c0@"
  es: "@aNera@bEstoy segura de que ella estará felice con lo que le compre.\n@c0@"
  fr: "@aNera@bJe suis sûre qu'elle sera ravie quoi qu'il décide d'acheter au final.\n@c0@"
  it: "@aNera@bSe ha un po' di pazienza, quel momento potrebbe non essere così lontan... Oh, santo cielo!\nDea mia, perdona le mie parole irriguardose!\n@c0@"
  ja: "@a@bフローラ「どんな物でも　きっと\n\t娘さんは　よろこんでくれますわ。\n@c0@"
44:
  de: "@a%0%a001240@bEs ist gut, nicht schon im Vorhinein zu wissen, welches Souvenir man kaufen will. Dann kann man sich ansehen, was alles angeboten wird!\n@c0@"
  en: "@a%0%a001240@bIt's good not knowing what souvenir you're going to buy. You can have fun looking at all the different things on sale!\n@c0@"
  es: "@a%0%a001240@bEstá muy bien no saber qué cosina comprar. Puedes divertirte mirando todo lo que venden.\n@c0@"
  fr: "@a%0%a001240@bC'est bien ne pas savoir quel souvenir on va acheter. Ça permet de s'amuser en regardant tous les trucs marrants qu'il y a à vendre.\n@c0@"
  it: "@a%0%a001240@bSe non ho capito male quell'uomo vorrebbe comprarsi tutto il Museo.\nDeve averne di quattrini, eh?\n@c0@"
  ja: "@a@b%a001240「おみやげは\n\t何を買うか　迷いながら　えらぶのが\n\t楽しいんだよね。\n@c0@"
45:
  de: "@a%0%a001250@bIch wäre mit allem glücklich, was mir jemand schenkt, solange er es mit Liebe schenkt.\n@c0@"
  en: "@a%0%a001250@bI'd be happy with anything that was given to me if it was given with love.\n@c0@"
  es: "@a%0%a001250@bA mí me valdría con cualquier cosa que me regalasen de corazón.\n@c0@"
  fr: "@a%0%a001250@bSi on m'offrait quelque chose avec amour, je serais contente, peu importe ce que c'est.\n@c0@"
  it: "@a%0%a001250@bAcquistare il Museo del Souvenir?\nSe fossi in Geremia, non lo venderai mai!\nNemmeno per un milione di monete d'oro!\n@c0@"
  ja: "@a@b%a001250「私なら　心のこもった物なら\n\t何だって　うれしいよ。\n@c0@"
46:
  de: "@aSancho@bVielleisst wäre es eine gute Idee, wenn wir für diesen Señor ein gutes Souvenir wählen würden, no?\n@c0@"
  en: "@aSancho@bMaybe ees a good idea eef we choose for thees señor the good esouvenir, no?\n@c0@"
  es: "@aSancho@bPues igual podríamos ayudar al señor a elegir una cosina bien linda.\n@c0@"
  fr: "@aSancho@bCe serait peut-être oune bonne idée de choisir\nnous-mêmes oun cadeau pour ce s-señor, noⓡ\n@c0@"
  it: "@aSancho@bQuel señor dev'essere muy muy muy ricco...\n@c0@"
  ja: "@a@bサンチョ「おじょうさんに\n\tいいおみやげになる名産品を\n\t選んであげられれば　いいですね。\n@c0@"
47:
  de: "@aOtto@bEs ist der Gedanke, der zählt, oder net? Aber es ist natürlich schöner, wenn das Geschenk auch was G'scheit's ist.\n@c0@"
  en: "@aTuppence@bIt's the thought that counts after all, isn't it?\r\nWell, the present's got to be half-decent as well,\r\nif you ask me.\n@c0@"
  es: "@aAlazar@bLo que importa es acordarse, ¿verdad?\r\nBueno, en mi opinión, el regalo también tiene que ser un poco decente.\n@c0@"
  fr: "@aInnocent@bC'est l'intention qui compte, après tout, nonⓡ\nBon, il faut quand même que le cadeau soit correct, si vous voulez mon avis.\n@c0@"
  it: "@aSimon@bGeremia non gli venderebbe mai il Museo...\n@c0@"
  ja: "@a@bピピン「こういうのは　物もそうですけど\n\t一生けんめい　えらんでくれた…\n\tということが　うれしいんですよ。\n@c0@"
48:
  de: "@aBianca@bWenn eine Künstlernatur wie er sie hübsch findet, dann muss es wohl so sein!\n@c0@"
  en: "@aBianca@bWell, if someone artistic like him reckons they're beautiful, then they must be!\n@c0@"
  es: "@aBianca@bBueno si alguien así artista como él dice que son bellos, lo serán, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi quelqu'un doté d'une telle fibre artistique trouve que c'est beau, c'est que ça doit l'êtreⓠ\n@c0@"
  it: "@aBianca@bSarà che ho un debole per il ⓕprotagonistaⓖ della poesia, ma devo ammettere che è davvero splendida...\n@c0@"
  ja: "@a@bビアンカ「美しい名産品だって。\n\t芸術に生きる人が　言うんだもの。\n\tまさに　おりがみつきね。\n@c0@"
49:
  de: "@aNera@bWas für ein Genie, aus dem Stegreif so ein Gedicht über das Firlefanzeum zu ersinnen!\n@c0@"
  en: "@aNera@bWhat an accomplished performer, just making up\r\na poem about the knick-knackatory on the spot\r\nlike that!\n@c0@"
  es: "@aNera@bQué poeta más bueno, le ha compuesto un poema al musenino en un instante, così sin más.\n@c0@"
  fr: "@aNera@bQuel artisteⓠ Être capable de composer un poème\nsur la Galericabrac comme ça, sur le moment...\n@c0@"
  it: "@aNera@bOh, che bravo!\nNon è da tutti comporre un poema così, su due piedi!\nComplimenti!\n@c0@"
  ja: "@a@bフローラ「名産品を　歌で表現なさるなんて\n\tさすが芸術の道を　歩む方ですわ。\n@c0@"
50:
  de: "@a%0%a001240@bUnd die herrlichen Stücken\ndie die Besucher entzücken,\nwurden alle gesammelt von %a001240!\n@c0@"
  en: "@a%0%a001240@b...And all the wonderful displays,\nthat did the visitors amaze,\nwere collected by none other than %a001240!\n@c0@"
  es: "@a%0%a001240@bY toda esta colección\nCon grandes muestras de valor\nFue %a001240 quien la reunió.\n@c0@"
  fr: "@a%0%a001240@b... Et tous les beaux objets en ce lieu apportés,\nqui laissent le visiteur les yeux émerveillés,\nfurent tous par %a001240 rassemblésⓠ\n@c0@"
  it: "@a%0%a001240@bE %a001240 il valoroso...\nSpirito coraggioso...\nTutto il mondo girò e mille oggetti trovò!\n@c0@"
  ja: "@a@b%a001240「ラララ　美しい名産品を～\n\tここまで　集めたのは～\n\tボクたち～　ラララ～！\n@c0@"
51:
  de: "@a%0%a001240@bNa, was meinst du? Ich könnte doch glatt auch ein Dichter werden, oder?\n@c0@"
  en: "@a%0%a001240@bWell, what do you think?\nCould I be a poet too?\n@c0@"
  es: "@a%0%a001240@b¿Qué te parece?\n¿Puedo ser poeta?\n@c0@"
  fr: "@a%0%a001240@bAlors, qu'est-ce que tu en disⓡ\nJe pourrais être poète, moi aussiⓡ\n@c0@"
  it: "@a%0%a001240@bNiente male, no?\nPotrei diventare anch'io un poeta!\n@c0@"
  ja: "@a@b%a001240「ねえ　あの人の\n\t歌い方に似てた？\n@c0@"
52:
  de: "@a%0%a001250@bWas für ein herrliches Gedicht! Ich finde, das ist sogar noch unterhaltsamer als die Ausstellungsstücke!\n@c0@"
  en: "@a%0%a001250@bWhat a superb poem! I think it's even more entertaining than the exhibits!\n@c0@"
  es: "@a%0%a001250@b¡Qué poema más bueno! Creo que es mejor que la colección.\n@c0@"
  fr: "@a%0%a001250@bQuel magnifique poèmeⓠ C'est encore plus divertissant que l'exposition elle-mêmeⓠ\n@c0@"
  it: "@a%0%a001250@bAh, un poeta... Un animo nobile che allieta il mondo con la profonda bellezza della sua arte!\nChe meraviglia!\n@c0@"
  ja: "@a@b%a001250「あの人の歌声も　お部屋に\n\t負けないぐらいキレイだった。\n\tぽっ……。\n@c0@"
53:
  de: "@aSancho@bSí, iss weiß, hier ist es voller herrlisser Dinge, aber es ist nisst angebracht, hier so viel Lärm zu machen.\n@c0@"
  en: "@aSancho@bSí, I know ees full of the wonderful displays, but ees no good to make eso much noise.\n@c0@"
  es: "@aSancho@bPues está bien padre que el sitio esté repleto de cosinas bellas, pero ni que hay que montar tanto escándalo.\n@c0@"
  fr: "@aSancho@bSi, je sais qu'il y a b-b-beaucoup de beaux objets, mais ce n'est pas la p-peine de faire autant de bruit.\n@c0@"
  it: "@aSancho@bDevo recordarme de preparare un cartellon...\nⓕ¡Silencio por favor!ⓖ\n@c0@"
  ja: "@a@bサンチョ「歌いたくなる気持ちは\n\tわかりますが　ほかのお客さんも\n\tいることですし……\n@c0@"
54:
  de: "@aSancho@bDas ist doch ein Museum. Im Museum macht man keinen Lärm. Da ist es immer ganz still.\n@c0@"
  en: "@aSancho@bEes a museum. You no make a noise een the museum. Eet must be esilence all the time.\n@c0@"
  es: "@aSancho@bEsto es un museo. No se hace ruido en los museos. Hay que guardar silencio.\n@c0@"
  fr: "@aSancho@bOn est dans oun musée. Il faut faire s-s-silence, dans oun musée. Tout le t-temps.\n@c0@"
  it: "@aSancho@b¡Esto es un museo, por todas la paellas!\nLa gente no puede mica gridare o cantar...\n¡Ops! ¿Sto hablando troppo ad alta voce?\n@c0@"
  ja: "@a@bサンチョ「館内では　静かにして\n\tいただきませんと。\n@c0@"
55:
  de: "@aOtto@bJetzt sieht jeder auf ihn statt auf die Ausstellungsstücke! Ich wette, jetzt kommt er sich blöd vor!\n@c0@"
  en: "@aTuppence@bNow everyone's looking at him rather than the exhibits! I bet he feels stupid!\n@c0@"
  es: "@aAlazar@bAhora todo el mundo le mira a él en vez de mirar a las cosinas. Seguro que se siente un poco bobo.\n@c0@"
  fr: "@aInnocent@bMaintenant, tout le monde le regarde lui au lieu des objetsⓠ Je parie qu'il se sent ridiculeⓠ\n@c0@"
  it: "@aSimon@bUhm, alle donne piacciono i poeti, eh? Ahem...\nⓕAmbarabà cicì cocò, tre civette sul comòⓖ...\nSì, direi che sono sulla buona strada...\n@c0@"
  ja: "@a@bピピン「名産品よりも\n\tあの人が　注目されそうですよ。\n@c0@"
56:
  de: "@aBianca@bWo er wohl herkommt?\n@c0@"
  en: "@aBianca@bI wonder whereabouts he's from.\n@c0@"
  es: "@aBianca@bMe pregunto de dónde será, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande bien d'où il vient.\n@c0@"
  it: "@aBianca@bChissà da dove arriva quel tipo...\n@c0@"
  ja: "@a@bビアンカ「あの人は　どこの国の\n\t人なのかしら？\n@c0@"
57:
  de: "@aNera@bWas meinst du, welches Stück wohl aus seinem Land kommt?\n@c0@"
  en: "@aNera@bWhich is the exhibit from his country, do you think?\n@c0@"
  es: "@aNera@b¿Cuál será la cosina de la sua terra?\n@c0@"
  fr: "@aNera@bQuel est l'objet qui vient de son pays, d'après toiⓡ\n@c0@"
  it: "@aNera@bQuale sarà il souvenir tipico del suo paese?\nNon sono riuscita a capirlo...\n@c0@"
  ja: "@a@bフローラ「あの方の　お国の名産品は\n\tどれなのでしょう？\n@c0@"
58:
  de: "@a%0%a001240@bWenn es etwas ist, was hier ausgestellt wird, dann müssen wir wohl dort gewesen sein, wo er herkommt, oder nicht?\n@c0@"
  en: "@a%0%a001240@bIf it's something that's on display here, it means we must've been to wherever he comes from, doesn't it?\n@c0@"
  es: "@a%0%a001240@bSi es algo que se está exhibiendo aquí, significa que debemos de haber ido a su país, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bSi c'est un objet qui est exposé ici, ça veut dire\nqu'on a dû passer dans son pays, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001240@bSe il suo paese ha prodotto un oggetto in mostra al Museo del Souvenir, vuol dire che siamo stati lì!\n@c0@"
  ja: "@a@b%a001240「かざられてるって　いうことは\n\tボクたちが　行ったことある国の\n\t人ってことだよね？\n@c0@"
59:
  de: "@a%0%a001250@bJa, wahrscheinlich ist es wohl Werbung für die Orte, aus denen wir Krimskrams für unsere Ausstellung mitgebracht haben.\n@c0@"
  en: "@a%0%a001250@bI suppose it does kind of advertise places if we put exhibits from them on display here.\n@c0@"
  es: "@a%0%a001250@bSupongo que si exhibimos piezas de ciertos lugares, de algún modo los estamos patrocinando.\n@c0@"
  fr: "@a%0%a001250@bJ'imagine que ça joue sur la réputation des différents pays si on expose des objets qui\nviennent de chez eux.\n@c0@"
  it: "@a%0%a001250@bIn effetti, i souvenir esposti sono una forma di pubblicità per i loro paesi di provenienza...\n@c0@"
  ja: "@a@b%a001250「ここに　かざっておくと\n\tその名産品があった場所を\n\t知ってもらうことにも　なるのね。\n@c0@"
60:
  de: "@aSancho@bFür die Länder, aus denen wir Sachen ausstellen, ist es gute Werbung, wenn viel Reisende unsere Ausstellung sehen, sí?\n@c0@"
  en: "@aSancho@bFor the countries that we are displaying their esouvenirs, ees good eef muchos travellers\r\nare visiting them, sí?\n@c0@"
  es: "@aSancho@bA muchos de los países de los que mostramos recuerdos les vendría padre que fueran viajeros.\n@c0@"
  fr: "@aSancho@bPour les p-p-pays dont on expose certains objets, c'est oune bonne chose si beaucoup de t-touristes vont ensuite les visiter, noⓡ\n@c0@"
  it: "@aSancho@bPienso que a mucha gente verrà voglia de visitar los países de origine de los souvenir espostos...\n@c0@"
  ja: "@a@bサンチョ「多くの旅人に　来てもらえれば\n\tそれだけその国が　さまざまな面で\n\tうるおいますからな。\n@c0@"
61:
  de: "@aOtto@bEs muss schwierig sein, sich um ein ganzes Land Gedanken machen zu müssen. Ich glaub', das könnt' ich net. \n@c0@"
  en: "@aTuppence@bMust be a bit of a strain having to worry about an entire country. I don't think I'd be cut out for it.\n@c0@"
  es: "@aAlazar@bDebe de ser estresante tener que ocuparse de todo un país. Yo creo que no valdría para eso.\n@c0@"
  fr: "@aInnocent@bÇa doit être un peu fatigant d'avoir à s'occuper d'un pays tout entier. Je crois que je ne serais pas fait pour ça.\n@c0@"
  it: "@aSimon@bMi piacerebbe ricoprire un ruolo di responsabilità a Denim.\n㈡\nNon che fare la guardia di palazzo sia compito da poco, ma sento di poter dare di più al mio paese!\n@c0@"
  ja: "@a@bピピン「国のことを　考えなければいけない\n\t立場の人は　大変ですね。\n@c0@"
62:
  de: "@aBianca@bSchönheit liegt im Auge des Betrachters, oder? Jedem gefällt was anderes.\n@c0@"
  en: "@aBianca@bPrettiness is in the eye of the beholder, though, eh? Different things appeal to different folk.\n@c0@"
  es: "@aBianca@bLa belleza está en el ojo del que mira, ¿sabes? Para gustos, los colores.\n@c0@"
  fr: "@aBianca@bMais la beauté est dans le regard de celui qui reçoit le cadeau, nonⓡ Tout le monde ne trouve pas les mêmes choses jolies.\n@c0@"
  it: "@aBianca@bⓕGraziosi oggettiniⓖ?! Ma quella tizia ha idea del valore artistico e culturale di questi souvenir o pensa di essere in un negozietto di chincaglieria?!\n@c0@"
  ja: "@a@bビアンカ「自分が　いちばん気にいった物が\n\tきれいな名産品になると思うわ。\n@c0@"
63:
  de: "@aNera@bDie junge Frau hat offenbar etwas gesehen, das ihr gefallen hat.\n@c0@"
  en: "@aNera@bIt sounds like that young woman saw something on display she rather liked.\n@c0@"
  es: "@aNera@bSembra que esa jovencita ha visto algo en la exposición que le ha encantado.\n@c0@"
  fr: "@aNera@bOn dirait que cette jeune femme a vu en exposition un objet qui lui plaît.\n@c0@"
  it: "@aNera@bMi spiace per quella ragazza...\nIn effetti, la vita è molto più bella se abbiamo una persona speciale con cui condividerla...\n@c0@"
  ja: "@a@bフローラ「展示している　名産品の中に\n\t気にいってくださった物が\n\tあったのかも　しれませんね。\n@c0@"
64:
  de: "@a%0%a001240@bWenn ich hier was Kleines Hübsches auswählen müsste, würde ich eine der wirklich faszinierenden Erfindungen nehmen. Etwas richtig Interessantes.\n@c0@"
  en: "@a%0%a001240@bIf I had to choose one trinket from all the things in here, I'd take one of the really amazing inventions. Something really interesting.\n@c0@"
  es: "@a%0%a001240@bSi tuviera que quedarme con solo una baratija de las que hay aquí, me llevaría uno de los inventos geniales. Algo realmente interesante.\n@c0@"
  fr: "@a%0%a001240@bSi je devais choisir une des babioles parmi toutes celles qu'il y a ici, je prendrais une invention incroyable. Quelque chose de vraiment intéressant.\n@c0@"
  it: "@a%0%a001240@bAnch'io vorrei avere una fidanzata!\nMa in questo periodo sono troppo impegnato per pensare di trovarmene una...\n@c0@"
  ja: "@a@b%a001240「ボクは　どっちかというと\n\tおもしろそうな　名産品の方がいいな。\n@c0@"
65:
  de: "@a%0%a001250@bJa. Ich hätte auch gern was Kleines Hübsches.\n@c0@"
  en: "@a%0%a001250@bYeah. I'd quite like a pretty little trinket too.\n@c0@"
  es: "@a%0%a001250@bSí. A mí también me gustan las baratijas.\n@c0@"
  fr: "@a%0%a001250@bOui, moi aussi j'aimerais bien une jolie petite babiole.\n@c0@"
  it: "@a%0%a001250@bAnch'io vorrei avere un fidanzato!\nMa sono ancora troppo giovane per pensare all'amore...\n@c0@"
  ja: "@a@b%a001250「きれいな　名産品かあ。\n\t私も　自分のがほしいなあ……。\n@c0@"
66:
  de: "@aSancho@bSí, sí. Jeder mag das, was hübsch aussieht, aber es sind die inneren Werte, die zählen.\n㈡\nWir haben ein Sprichwort, das besagt: Gesisster können wir sehen, Herzen kennen wir nisst.\n@c0@"
  en: "@aSancho@bSí, sí. Everyone likes the pretty displays, but ees the inside that counts. We have the esaying where I come from: faces we esee, hearts we don't know.\n@c0@"
  es: "@aSancho@b¡Ándale! Pues a todo el mundo le gustan las cosas bonitas, pero el interior es lo que cuenta.\n㈡\nDe donde vengo hay un dicho: las caras se ven, los corazones no.\n@c0@"
  fr: "@aSancho@bSi, tout le monde aime les j-jolies choses, mais c'est l'intérieur qui compte. Chez moi, on a oun dictonⓢ\non voit le visage, mais on ne connaît pas le c-cœur.\n@c0@"
  it: "@aSancho@b¡Ma como! ¿Una señorita tanto graziosa no ha ancoras trovato un fidanzato?\n¡Encantado, señorita, mi nombre es Sancho!\n@c0@"
  ja: "@a@bサンチョ「きれいな物もいいですが\n\tやはり大切なのは　中身ですよ。\n@c0@"
67:
  de: "@aOtto@bEtwas Kleines Hübsches? Ja, das ist sie ganz bestimmt!\n@c0@"
  en: "@aTuppence@bPretty little trinket? Yes, she certainly is that!\n@c0@"
  es: "@aAlazar@b¿Baratija? Ella sí que es una baratija.\n@c0@"
  fr: "@aInnocent@bUne jolie petite babioleⓡ C'est un qualificatif que je lui attribuerais volontiersⓠ\n@c0@"
  it: "@aSimon@bMa come?! Una signorina tanto graziosa non ha ancora trovato un fidanzato?!\nPiacere, signorina, il mio nome è Simon!\n@c0@"
  ja: "@a@bピピン「名産品もいいですけど\n\tあの人も　きれいでした……。\n@c0@"
68:
  de: "@aBianca@bEr klingt, als hätte er etwas Imposanteres erwartet, was?\n@c0@"
  en: "@aBianca@bSounds like he was expectin' the exhibits to be a bit more on the grand side, eh?\n@c0@"
  es: "@aBianca@bParece que se esperaba algo más grandioso, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait qu'il s'attendait à ce que les objets exposés soient un peu plus impressionnants, nonⓡ\n@c0@"
  it: "@aBianca@bCome si fa a definire semplicemente ⓕdivertentiⓖ questi capolavori dell'ingegno umano?!\nDea santissima, illumina questo povero ignorante!\n@c0@"
  ja: "@a@bビアンカ「あのおじさん\n\t建物を見て　想像してた\n\t名産品とはちがったみたい。\n@c0@"
69:
  de: "@aNera@bDas stimmt wohl. In diesem prächtigen alten Gebäude sehen einige der Ausstellungsstücke etwas fehl am Platz aus.\n@c0@"
  en: "@aNera@bIt's true, I suppose. This grand old building makes some of the exhibits look a bit out of place.\n@c0@"
  es: "@aNera@bÈ vero, supongo. Este edificio tan grandioso hace que algunas de las cosinas parezcan estar fuera de lugar.\n@c0@"
  fr: "@aNera@bIl a raison. À côté de la somptuosité du bâtiment, certains objets ont l'air un peu déplacés.\n@c0@"
  it: "@aNera@bSì, la penso come lei.\n@c0@"
  ja: "@a@bフローラ「建物のおかげで\n\t名産品が　よりいっそう\n\t面白く見えるのでしょうね。\n@c0@"
70:
  de: "@a%0%a001240@bMir gefällt die Ausstellung lustiger Erfindungen am besten!\n@c0@"
  en: "@a%0%a001240@bI like the funny novelty exhibits best!\n@c0@"
  es: "@a%0%a001240@b¡A mí las que me gustan son las cosinas raras y nuevas!\n@c0@"
  fr: "@a%0%a001240@bMoi, ce que je trouve le plus chouette, ce sont les nouveautés étonnantesⓠ\n@c0@"
  it: "@a%0%a001240@bSecondo me i souvenir divertenti sono i migliori di tutti!\n@c0@"
  ja: "@a@b%a001240「面白いの　ボク大好きだよ！\n@c0@"
71:
  de: "@a%0%a001250@bMir gefallen die Erfindungen auch, aber wenn ich die Wahl hätte, dann würde ich mich erst mal unter den vielen hübschen schimmernden Stücken umsehen.\n@c0@"
  en: "@a%0%a001250@bI like the novelty exhibits too, but if I had to choose, there are lots of pretty, shiny exhibits I'd pick as my favourites first.\n@c0@"
  es: "@a%0%a001250@bA mí me gustan las cosinas raras, pero si tuviera que elegir, hay un montón de cosinas bonitas y resplandecientes que me gustan más.\n@c0@"
  fr: "@a%0%a001250@bMoi aussi, j'aime bien les nouveautés, mais si je devais choisir, il y a plein de jolis objets brillants auxquels je donnerais ma préférence.\n@c0@"
  it: "@a%0%a001250@bAnche a me piacciono gli oggetti divertenti, ma preferisco quelli lucenti.\n@c0@"
  ja: "@a@b%a001250「面白いのも　好きだけど\n\t私は　どちらかというと\n\tきれいな方が好きだな。\n@c0@"
72:
  de: "@aSancho@bEs ist gut, dass die Besucher auch die lustigen Ausstellungsstücke mögen, no?\n@c0@"
  en: "@aSancho@bEes good the clientes, they enjoy the funny exhibits too, no?\n@c0@"
  es: "@aSancho@bEstá chido que los visitantes disfruten también de las cosinas raras.\n@c0@"
  fr: "@aSancho@bC'est bien que les v-visiteurs aiment aussi les objets étonnants, noⓡ\n@c0@"
  it: "@aSancho@b¿Me pare que los souvenir divertentes sono muy apprezzatos da los visitatores, eh?\n@c0@"
  ja: "@a@bサンチョ「面白い名産品も\n\tお客さんに　評判がいいようですね。\n@c0@"
73:
  de: "@aOtto@bDie Ausstellungsstücke müssen ja auch komisch sein. Ich meine, wenn sie nichts Besonderes wären, wären sie ja kein guter Schnickschnack, oder?\n@c0@"
  en: "@aTuppence@bThe exhibits need to be ⓗfunnyⓘ. I mean, if they weren't a bit out of the ordinary, they wouldn't make good knick-knacks, would they?\n@c0@"
  es: "@aAlazar@bLas cosinas son ⓕrarasⓖ por definición. Bueno, si no fueran extraordinarias no serían cosinas, ¿verdad?\n@c0@"
  fr: "@aInnocent@bIl faut que les pièces soient ⓥétonnantesⓦ. C'est vrai,\nsi elles ne sortaient pas un peu de l'ordinaire,\nça ne ferait pas de bons objets d'exposition.\n@c0@"
  it: "@aSimon@bI souvenir devono essere divertenti, oltre che interessanti, così da rendere la visita al Museo ancora più godibile. Almeno, questa è la mia opinione...\n@c0@"
  ja: "@a@bピピン「名産品は面白いと\n\t言われるぐらい　個性的でないと！\n@c0@"
74:
  de: "@aBianca@bTja, ein paar Sachen sind wohl wirklich etwas komisch. Aber es zählt schließlich, wozu sie gedacht waren.\n@c0@"
  en: "@aBianca@bI s'pose some of the stuff is a bit weird. But it's the thought that went into makin' it that counts.\n@c0@"
  es: "@aBianca@bSupongo que algunas cosas son un poco raritas. Pero la intención que hay detrás es lo que cuenta, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai que certains objets sont un peu bizarres. Mais c'est l'idée qui sous-tend l'ensemble qui est importante.\n@c0@"
  it: "@aBianca@bQualcuno degli oggetti esposti sarà anche un po' bizzarro, ma ciò che conta davvero è lo spirito e la creatività con cui i souvenir sono stati realizzati.\n@c0@"
  ja: "@a@bビアンカ「たしかに　おかしいわよね。\n\tでも　物を一生けんめい作る心には\n\t変わりがないと思うな。\n@c0@"
75:
  de: "@aNera@bWichtig ist, wie viel Überlegung und Mühe in die Herstellung dieser Andenken gesteckt wurde.\n@c0@"
  en: "@aNera@bWhat's important is how much care and attention went into creating these souvenirs.\n@c0@"
  es: "@aNera@bLo veramente importante es el cariño y el cuidado que se ha puesto en crear estas cosinas.\n@c0@"
  fr: "@aNera@bCe qui compte, c'est le soin et l'attention apportés\r\nà la fabrication de ces pièces.\n@c0@"
  it: "@aNera@bNon credo che i souvenir debbano essere valutati solo in base alla loro bellezza...\n@c0@"
  ja: "@a@bフローラ「大切なのは　いかに気持ちが\n\tこめられているかと　いうことです。\n@c0@"
76:
  de: "@aNera@bIch wünschte, die Leute hätten nicht immer nur im Blick, ob die Stücke hübsch sind oder nicht.\n@c0@"
  en: "@aNera@bI wish people wouldn't just focus on whether the displays look pretty or not.\n@c0@"
  es: "@aNera@bOjalá la gente no se centrara solo en la belleza de las cosinas.\n@c0@"
  fr: "@aNera@bSi seulement les gens pouvaient ne pas seulement s'attacher à l'aspect extérieur des objets.\n@c0@"
  it: "@aNera@bÈ importante tenere in considerazione le sensazioni e i sentimenti che volevano trasmettere gli artigiani che li hanno prodotti.\n@c0@"
  ja: "@a@bフローラ「外見ばかり　気にしていては\n\tいけないと思いますわ。\n@c0@"
77:
  de: "@a%0%a001240@bTja, ich mag die merkwürdigen Stücke. Die anzuschauen macht schließlich am meisten Spaß.\n@c0@"
  en: "@a%0%a001240@bWell, I like the weird exhibits.\nThey're the most fun to look at, after all.\n@c0@"
  es: "@a%0%a001240@bMe gustan las cosinas extrañas.\nAl fin y al cabo, son las más divertidas.\n@c0@"
  fr: "@a%0%a001240@bEh bien, moi, j'aime bien les objets bizarres.\nCe sont les plus rigolos à regarder.\n@c0@"
  it: "@a%0%a001240@bI souvenir un po' strani sono quelli che mi piacciono di più.\nLi trovo molto interessanti!\n@c0@"
  ja: "@a@b%a001240「ボクは　へんな名産　好きだよ。\n\tだって　見てるだけで\n\t楽しくなってくるんだもん！\n@c0@"
78:
  de: "@a%0%a001250@bIch finde nicht, dass sie merkwürdig sind. Wenn du mich fragst, haben die was ganz Besonderes.\n@c0@"
  en: "@a%0%a001250@bI don't think they're weird. There's something quite charming about them if you ask me.\n@c0@"
  es: "@a%0%a001250@bA mí no me parecen objetos extraños. A mí me parece que tienen algo encantador.\n@c0@"
  fr: "@a%0%a001250@bJe ne les trouve pas bizarres. Je trouve même\nqu'ils ont quelque chose de charmant, si vous\nvoulez mon avis.\n@c0@"
  it: "@a%0%a001250@bMa chi l'ha detto che i souvenir devono essere tutti belli?! L'importante è che siano interessanti e che ben rappresentino la cultura che li ha prodotti!\n@c0@"
  ja: "@a@b%a001250「ヘンな物って……。\n\tわたしは　そういうの　遊び心がある\n\tって　言うんだと思うけど。\n@c0@"
79:
  de: "@aSancho@bUnterschiedlisse Leute mögen unterschiedlisse Sachen, weißt du.\n@c0@"
  en: "@aSancho@bDifferent people, they like different theengs,\r\nyou know.\n@c0@"
  es: "@aSancho@bA cada persona le gusta una cosa.\n@c0@"
  fr: "@aSancho@bTout le m-m-monde n'aime pas les mêmes choses.\n@c0@"
  it: "@aSancho@b¿Ognunos ha el suo gusto personal, no?\n@c0@"
  ja: "@a@bサンチョ「物の価値は　人によって\n\tちがいますから。\n@c0@"
80:
  de: "@aSancho@bMansse Leute sehen eine interessante Ausstellung, und andere Leute, für die ist die Ausstellung nur un poco loco.\n@c0@"
  en: "@aSancho@bEsome people, they esee the interesting display, but for others, the esame display, eet ees just esometheeng loco.\n@c0@"
  es: "@aSancho@bAlgunas personas ven una cosina reteinteresante y otras ven una cosina reteloca.\n@c0@"
  fr: "@aSancho@bPour certains, oun objet sera intéressant, mais pour d'autres, le même objet sera j-j-juste bizarre.\n@c0@"
  it: "@aSancho@bPor alcunas personas estos souvenir sono bellos, por altras sono originales, por altras ancoras estranos.\n㈡\nCiascunos puede piensarla como preferisce...\n¡Esta es la bellezza de la arte!\n@c0@"
  ja: "@a@bサンチョ「面白いと思う人と\n\tヘンな物と　思う人がいるのは\n\tしかたのないことです。\n@c0@"
81:
  de: "@aOtto@bDer Kerl kapiert net, worauf's ankommt. Komisch, das ist doch der letzte Schrei!\n@c0@"
  en: "@aTuppence@bThat chap's missing the point. Weird is wonderful, you see, just like big is beautiful.\n@c0@"
  es: "@aAlazar@bEse tipo no se da cuenta del meollo de la cuestión. Lo raro es bello y lo feo hermoso.\n@c0@"
  fr: "@aInnocent@bLà n'est pas la question. De même que tout ce qui\r\nest petit est gentil, tout ce qui est étrange mérite louanges...\n@c0@"
  it: "@aSimon@bLa bellezza non è universale.\nA ciascuno di noi può capitare di trovarla nelle persone e nelle cose che ad altri non piacciono...\n@c0@"
  ja: "@a@bピピン「あの人は　わかってませんねえ。\n\tヘンなところに　面白味が\n\tあるんじゃないですか。\n@c0@"
82:
  de: "@aBianca@bWir haben eine ganz schöne Sammlung beisammen, was? Da kann man mal sehen, wo wir schon überall gewesen sind.\n@c0@"
  en: "@aBianca@bWe have got quite a collection goin' now, eh?\r\nJust goes to show how many places we've bin to.\n@c0@"
  es: "@aBianca@bYa tenemos una colección respetable, ¿eh?\r\nDemuestra a cuántos sitios hemos ido.\n@c0@"
  fr: "@aBianca@bOn a une belle collection, maintenant, nonⓡ Ça donne une idée du nombre d'endroits où on est allés.\n@c0@"
  it: "@aBianca@bLa collezione di oggetti del Museo è cresciuta parecchio, e i visitatori sembrano apprezzarla molto.\n@c0@"
  ja: "@a@bビアンカ「ずいぶん名産品が\n\t集まったわよね。\n\tそれだけ　世界をまわったんだわ。\n@c0@"
83:
  de: "@aNera@bErst durch die Reisen mit dir ist mir klar geworden, wie schön die Welt ist, in der wir leben.\n@c0@"
  en: "@aNera@bIt's travelling with you that made me realise how wonderful the world we live in is.\n@c0@"
  es: "@aNera@bViajar con te me ha hecho darme cuenta de lo meraviglioso que es il mondo en que vivimos.\n@c0@"
  fr: "@aNera@bC'est de voyager avec toi qui m'a fait prendre conscience que le monde dans lequel nous\r\nvivons est merveilleux.\n@c0@"
  it: "@aNera@bSì, è proprio così. Ammirare questi oggetti meravigliosi fa capire quanto sia vario e bello il mondo che la dea ha creato per noi...\n@c0@"
  ja: "@a@bフローラ「私も　あなたと旅をして\n\t世界の広さを　実感できました。\n@c0@"
84:
  de: "@a%0%a001240@bDer Raum wirkt gleich ganz anders, wenn man eine Menge komische und tolle Stücke ausstellt, nicht?\n@c0@"
  en: "@a%0%a001240@bThe whole room feels different when you put lots of weird and wonderful exhibits on display, doesn't it?\n@c0@"
  es: "@a%0%a001240@bLa sala cambia completamente cuando exhibes muchas cosinas raras y maravillosas ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bLa salle paraît très différente quand on y met en exposition plein d'objets bizarres et merveilleux.\n@c0@"
  it: "@a%0%a001240@bCerto che la sala assume tutto un altro aspetto quando è piena di oggetti bizzarri e meravigliosi, non è vero?\n@c0@"
  ja: "@a@b%a001240「変わった名産品を\n\t多くかざると　お部屋の感じも\n\tちがって見えるよね。\n@c0@"
85:
  de: "@a%0%a001250@bMir gefallen die seltsamen Exponate auch. Aber ich würde mich ja lieber erst mal an die vielen hübschen glänzenden Sachen halten.\n@c0@"
  en: "@a%0%a001250@bI like the weird exhibits too, but if I had to choose, there are lots of pretty, shiny exhibits I'd pick as my favourites first.\n@c0@"
  es: "@a%0%a001250@bA mí también me gustan las cosinas raras, pero si tuviera que elegir, hay un montón de cosinas bonitas y resplandecientes que me gustan más.\n@c0@"
  fr: "@a%0%a001250@bMoi aussi, j'aime bien les objets bizarres, mais si je devais choisir, il y a plein de jolis objets brillants auxquels je donnerais ma préférence.\n@c0@"
  it: "@a%0%a001250@bMi piacciono molto gli oggetti un po' strani, ma la mia preferenza va senz'altro a quelli lucenti.\n@c0@"
  ja: "@a@b%a001250「変わった名産品も　好きだけど\n\t私はどちらかというと　きれいな\n\t名産品の方が好きだな。\n@c0@"
86:
  de: "@aSancho@bSí. Es gibt so mansses schöne Souvenir aus ganz vielen verschiedenen Ländern.\n@c0@"
  en: "@aSancho@bSí. Ees eso many different esouvenirs from eso many different lands.\n@c0@"
  es: "@aSancho@b¡Ándale! Hay tantos souvenires de tantos lados.\n@c0@"
  fr: "@aSancho@bSi. Il y a tant de souvenirs d-d-différents de pays d-d-différents.\n@c0@"
  it: "@aSancho@bAhora aquí nel Museo ce sono souvenir provenientes da muchissimos países.\n@c0@"
  ja: "@a@bサンチョ「それぞれの　土地によって\n\t名産品も　いろいろありますからね。\n@c0@"
87:
  de: "@aOtto@bJe merkwürdiger ein Ausstellungsstück ist, desto mehr sticht es hervor. Aber das ist ja net weiter verwunderlich.\n@c0@"
  en: "@aTuppence@bI suppose it's hardly surprising really, but the more peculiar an exhibit is, the more it seems to stand out.\n@c0@"
  es: "@aAlazar@bBueno, supongo que es de esperar, pero cuanto más peculiar sea una cosina mayor interés parece despertar.\n@c0@"
  fr: "@aInnocent@bÇa n'est pas vraiment étonnant, mais plus un objet est particulier, plus il ressort de l'ensemble.\n@c0@"
  it: "@aSimon@bPiù i souvenir sono bizzarri, più i visitatori li notano.\nGli oggetti particolari non passano mai inosservati...\n@c0@"
  ja: "@a@bピピン「変わった名産品は　さすがに\n\t注目されやすいみたいですね。\n@c0@"
88:
  de: "@aBianca@bDas hört man doch gern. Dann hat sich die ganze Mühe beim Sammeln wenigstens gelohnt.\n@c0@"
  en: "@aBianca@bIt's nice to hear folk say things like that.\r\nMakes you feel all the effort we went to to\r\nget the stuff was worth it.\n@c0@"
  es: "@aBianca@bMe gusta oír a la gente decir eso.\n㈡\nLe hace sentir a una que todo el esfuerzo que hicimos para conseguir las cosinas ha merecido la pena, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est sympa d'entendre les gens dire des choses comme ça. On a l'impression que les efforts qu'on a faits pour obtenir ces pièces n'ont pas été vains.\n@c0@"
  it: "@aBianca@bCommenti del genere mi fanno capire che il nostro lavoro non è stato vano.\nAh, che gioia!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tああ言ってもらえると　がんばって\n\t集めたかいがあるって思えるわ。\n@c0@"
89:
  de: "@aNera@bZu uns kommen viele Besucher, die diese typischen regionalen Stücke zum ersten Mal im Leben sehen.\n@c0@"
  en: "@aNera@bThere are lots of people here who are seeing these regional crafts for the first time in their lives.\n@c0@"
  es: "@aNera@bHay mucha gente aquí que nunca han visto estas piezas regionales en la sua vita.\n@c0@"
  fr: "@aNera@bIl y a beaucoup de gens ici qui voient ces pièces d'artisanat régional pour la première fois de leur vie.\n@c0@"
  it: "@aNera@bMolti dei visitatori non avevano mai visto in vita loro la maggior parte dei souvenir esposti al Museo.\nSono fiera di aver dato una mano a Geremia!\n@c0@"
  ja: "@a@bフローラ「各地の名産品を　初めて\n\t目にする方も　多いようですね。\n@c0@"
90:
  de: "@a%0%a001240@bSeit ich mit dir unterwegs bin, Papa, lerne ich auch ganz vieles kennen.\n@c0@"
  en: "@a%0%a001240@bSince I've been travelling with you, Dad, I've seen loads of things for the first time too.\n@c0@"
  es: "@a%0%a001240@bDesde que viajo contigo, papi, he visto montones de cosas por primera vez también.\n@c0@"
  fr: "@a%0%a001240@bDepuis que je voyage avec toi, papa, j'ai vu plein de choses pour la première fois de ma vie, moi aussi.\n@c0@"
  it: "@a%0%a001240@bNemmeno io avevo visto molti degli oggetti che ci sono al Museo. Papà, da quando viaggio con te ho scoperto un sacco di cose nuove e bellissime!\n@c0@"
  ja: "@a@b%a001240「ボクもお父さんと旅してから\n\t初めて見るものが　いっぱいあったよ。\n@c0@"
91:
  de: "@a%0%a001250@bEs ist toll, manche von diesen Sachen zum ersten Mal zu sehen, findest du nicht auch?\n@c0@"
  en: "@a%0%a001250@bIt's so exciting seeing some of these things for the first time, isn't it?\n@c0@"
  es: "@a%0%a001250@bEs tan emocionante ver algunas de estas cosas por primera vez, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bC'est tellement excitant de voir certains de ces objets pour la première fois, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bVedere qualcosa per la prima volta dà un'emozione grandissima! Spero che anche i visitatori provino questa splendida sensazione.\n@c0@"
  ja: "@a@b%a001250「初めて見る　名産品って\n\tドキドキするよね。\n@c0@"
92:
  de: "@aSancho@bWenn man etwas zum ersten Mal sieht, vergisst man es nisst wieder, no? Es prägt siss tief ins Gedässtnis ein.\n@c0@"
  en: "@aSancho@bWhen you esee esometheeng for the first time, you never forget, sí? Eet makes the beeg impression, no?\n@c0@"
  es: "@aSancho@bCuando ves algo por primera vez, nunca lo olvidas. Impresiona mucho.\n@c0@"
  fr: "@aSancho@bLorsqu'on voit oune chose pour la p-p-première\nfois, on ne l'oublie pas, noⓡ Ça fait oune f-f-forte impression.\n@c0@"
  it: "@aSancho@bVedere qualcosas por la primera vez es siempre una grande emoción. Ah, me recuerdo quando scoprii la paella... ¡Que sensación indescrivibile!\n@c0@"
  ja: "@a@bサンチョ「初めて見る　名産品は\n\t印象深いですからねえ。\n@c0@"
93:
  de: "@aOtto@bSo geht's mir mit vielen Ausstellungsstücken hier. Die Hälfte davon hab ich vorher noch gar net gekannt.\n@c0@"
  en: "@aTuppence@bThat's how I feel about lots of the exhibits in here.\r\nI've never laid eyes on half of them before in my entire life.\n@c0@"
  es: "@aAlazar@bAsí es como me siento yo con muchas de las cosinas que hay aquí.\n㈡\nNunca les había puesto los ojos encima a algunas de ellas en toda mi vida.\n@c0@"
  fr: "@aInnocent@bJ'ai le même sentiment que lui sur bon nombre des objets exposés. De toute ma vie, je n'avais jamais posé les yeux sur la moitié d'entre eux.\n@c0@"
  it: "@aSimon@bLo confesso: prima di cominciare a occuparmi del Museo del Souvenir, non avevo mai visto nessuno degli oggetti esposti!\n@c0@"
  ja: "@a@bピピン「展示された　名産品を見ると\n\tボクの知らなかった　物も\n\tけっこう多いんですね。\n@c0@"
94:
  de: "@aBianca@bIch hoffe, die Leute halten das hier nicht für eine steife Angelegenheit. Die besten Museen sind die, in denen sich das Publikum nicht fehl am Platz fühlt.\n@c0@"
  en: "@aBianca@bI hope folk don't think the place is stuck-up. The best museums are the ones you can just enjoy without puttin' on any airs.\n@c0@"
  es: "@aBianca@bEspero que la gente no piense que esto es demasiado estirado. Los mejores museos son los que puedes disfrutar sin tener que darte aires, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère que les gens ne trouvent pas cet endroit snob. Les meilleurs musées sont ceux dont on peut profiter simplement, sans se donner de grands airs.\n@c0@"
  it: "@aBianca@bSentito? Pare proprio che siamo riusciti ad allestire un'esposizione molto varia, dove ogni visitatore trova qualcosa di interessante!\n@c0@"
  ja: "@a@bビアンカ「博物館は　きどらずに\n\t見てもらうのが　いちばんよ。\n@c0@"
95:
  de: "@aNera@bEs ist schön zu sehen, dass das Museum allen gefällt. Zum Firlefanzeum sollte jeder einen Zugang finden!\n@c0@"
  en: "@aNera@bIt's good to see all sorts of people enjoying the place. A knick-knackatory should be accessible to everyone!\n@c0@"
  es: "@aNera@bÈ buono ver a toda clase de gente disfrutar del lugar. Un musenino debería estar al alcance de todo el mundo.\n@c0@"
  fr: "@aNera@bC'est une bonne chose de voir toutes sortes de gens apprécier cet endroit. Une Galericabrac se doit d'être accessible à tousⓠ\n@c0@"
  it: "@aNera@bCi sono visitatori di ogni genere, e tutti si divertono!\nIl Museo del Souvenir ha sfondato!\n@c0@"
  ja: "@a@bフローラ「誰でも気がねなく\n\t見ることができるのが　本当の\n\t博物館だと　思います。\n@c0@"
96:
  de: "@a%0%a001240@bEs wäre stinklangweilig, wenn hier alle ernst und förmlich tun würden.\n@c0@"
  en: "@a%0%a001240@bIt'd be really boring in here if everyone was being serious and formal.\n@c0@"
  es: "@a%0%a001240@bSería un tostón si todo el mundo que viniese fuera serio y formal.\n@c0@"
  fr: "@a%0%a001240@bCe serait vraiment ennuyeux ici si tout le monde\nétait très sérieux et très guindé.\n@c0@"
  it: "@a%0%a001240@bChissà se anche gli altri musei sono divertenti quanto il nostro...\n@c0@"
  ja: "@a@b%a001240「きどって　名産品を見たって\n\t面白くないもんね。\n@c0@"
97:
  de: "@a%0%a001250@bOb wohl viele Leute Museen für eine steife Angelegenheit halten?\n@c0@"
  en: "@a%0%a001250@bI wonder if lots of people think museums are\nstuck-up places.\n@c0@"
  es: "@a%0%a001250@bMe pregunto si habrá mucha gente que piense que los museos son lugares estirados.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si beaucoup de gens pensent\nqu'on ne comprend rien aux musées.\n@c0@"
  it: "@a%0%a001250@bÈ vero: molte persone pensano erroneamente che i musei siano luoghi noiosi, pieni di oggetti poco interessanti e frequentati da persone barbose!\n@c0@"
  ja: "@a@b%a001250「博物館は　きどってるって\n\t思ってる人が多いのかな？\n@c0@"
98:
  de: "@aSancho@bDieser Señor, er ist ein esster Macho-Mann. Es muss sehr schwer für ihn sein, hierher zukommen, no? Aber er wagt siss trotzdem hinein.\n@c0@"
  en: "@aSancho@bThees señor, he ees the true macho bronco.\r\nEet must be very hard for heem to estep eenside thees place, no? But estill he comes een.\n@c0@"
  es: "@aSancho@bPues este señor es un puritito macho, nomás.\r\nDebe de ser muy difícil para él entrar un sitio como este. Pero aún así, pues entra.\n@c0@"
  fr: "@aSancho@bCe s-s-señor, c'est oun vrai dur.\r\nÇa n'a pas dû être f-facile pour lui d'entrer ici.\r\nMais il l'a fait quand même.\n@c0@"
  it: "@aSancho@b¡Que bueno que la gente apprezza el Museo del Souvenir!\nEl señor Geremia sarà muy feliz...\n\n@c0@"
  ja: "@a@bサンチョ「きっと　入りづらいというのも\n\tあったのでしょうな。\n@c0@"
99:
  de: "@aOtto@bAber nein, in einem Museum treiben sich doch net nur steife, monokelbewehrte Wichtigtuer herum!\n@c0@"
  en: "@aTuppence@bNo, a museum's no place for stuck-up, monocled old fuddy-duddies!\n@c0@"
  es: "@aAlazar@bNo, un museo no es un lugar para gente estirada y caballeros de fina estampa.\n@c0@"
  fr: "@aInnocent@bNon, un musée n'est pas fait pour être compris seulement par de vieux barbons coincés à monocleⓠ\n@c0@"
  it: "@aSimon@bAnch'io pensavo che i musei fossero luoghi noiosi, pieni di oggetti poco interessanti e frequentati da persone barbose! Ah, quanto mi sbagliavo!\n@c0@"
  ja: "@a@bピピン「博物館も　人も\n\tきどってばっかりじゃ\n\tいけないんですよね……。\n@c0@"
100:
  de: "@aBianca@bEs ist gut, wenn die Leute in der Schänke über unser Museum reden. Schänkengerüchte verbreiten sich rasend schnell.\n@c0@"
  en: "@aBianca@bIt's good if folk are chattin' about this place when they're down the pub. Pub rumours always spread far and wide.\n@c0@"
  es: "@aBianca@bEstá bien que la gente hable de este sitio en la taberna. Las conversaciones de taberna son la mejor publicidad, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien que les gens parlent de cet endroit quand ils sont à la taverne. Les bruits qui courent dans ces lieux-là se répandent toujours très vite et très loin.\n@c0@"
  it: "@aBianca@bLo sapevo!\nIl passaparola è la miglior forma di pubblicità per un posto come questo!\n@c0@"
  ja: "@a@bビアンカ「酒場での話って\n\t広まりやすいから　博物館に\n\t来てくれる人が　またふえるかもよ。\n@c0@"
101:
  de: "@aNera@bIch finde es großartig, dass die Leute sich in ihrer Freizeit über das Firlefanzeum unterhalten.\n@c0@"
  en: "@aNera@bIt's great that people are chatting about the\r\nknick-knackatory in their free time.\n@c0@"
  es: "@aNera@bEstá veramente bien que la gente hable del musenino en su tempo libre.\n@c0@"
  fr: "@aNera@bC'est fantastique que les gens parlent de la Galericabrac pendant leur temps libre.\n@c0@"
  it: "@aNera@bSi sta spargendo la voce che il Museo del Souvenir è un posto che vale la pena visitare. Il vecchio Geremia può essere soddisfatto... e anch'io lo sono!\n@c0@"
  ja: "@a@bフローラ「博物館の話題で　楽しんで\n\tくだされば　私もうれしいですわ。\n@c0@"
102:
  de: "@a%0%a001240@bWas er ihm wohl erzählt hat?\n@c0@"
  en: "@a%0%a001240@bI wonder what the man told him about the place.\n@c0@"
  es: "@a%0%a001240@bMe pregunto qué le diría sobre este lugar.\n@c0@"
  fr: "@a%0%a001240@bJe me demande ce que cet homme lui a dit\nà propos de notre musée.\n@c0@"
  it: "@a%0%a001240@bAdesso tocca a lui parlare a un amico del Museo del Souvenir ⓕin termini entusiasticiⓖ.\nÈ così che funziona il passaparola, no?\n@c0@"
  ja: "@a@b%a001240「あの人　博物館のことを\n\tどんなふうに　話してくれるんだろう？\n@c0@"
103:
  de: "@a%0%a001250@bDann ist er also geschäftlich hier? Der Arme!\n@c0@"
  en: "@a%0%a001250@bSo he's here on business, then? Poor thing!\n@c0@"
  es: "@a%0%a001250@bEntonces está aquí por negocios. Pobre.\n@c0@"
  fr: "@a%0%a001250@bAlors il est là pour le travailⓡ Le pauvreⓠ\n@c0@"
  it: "@a%0%a001250@bMi fa piacere che quel signore non sia rimasto deluso da quello che gli aveva detto il suo amico. Mi sarebbe dispiaciuto se fosse andato via scontento...\n@c0@"
  ja: "@a@b%a001250「お仕事のために　来てるんだ。\n\t大変だね。\n@c0@"
104:
  de: "@aSancho@bHeh heh! Selbst in den Schänken spressen sie schon über unser Firlefanzeum!\n@c0@"
  en: "@aSancho@bHeh heh! Even een the pubs now, they are talking about thees knick-knackatory!\n@c0@"
  es: "@aSancho@b¡Je, je! Hasta en las tabernas ya se habla del musenino.\n@c0@"
  fr: "@aSancho@bHé héⓠ Alors on parle de la Galericabrac jusque dans les t-t-tavernes, siⓡ\n@c0@"
  it: "@aSancho@b¡Eh eh eh!\n¡Ormai todo el mundo parla del nuestro maravilloso Museo del Souvenir! ¡Ay, que cosa buena!\n@c0@"
  ja: "@a@bサンチョ「博物館の話題で　お酒の席が\n\tもり上がるといいですね。\n@c0@"
105:
  de: "@aOtto@bÜber Andenken reden, damit das Zeug besser die Kehle runterrutscht? Na, das hab ich auch noch net g'hört!\n@c0@"
  en: "@aTuppence@bChatting about souvenirs to help the grog go down? That's a new one on me!\n@c0@"
  es: "@aAlazar@b¿Hablar de cosinas mientras te tomas unas copichuelas? ¡Qué cosa más rara!\n@c0@"
  fr: "@aInnocent@bAlors maintenant, on discute expositions en attendant son verre à la taverneⓡ C'est nouveau, çaⓠ\n@c0@"
  it: "@aSimon@bSe ne può parlare bene... Se ne può parlare male...\nL'importante è che se ne parli, no?\nMa del Museo del Souvenir si può solo parlar bene!\n@c0@"
  ja: "@a@bピピン「お酒のさかなに\n\t名産品のお話ですか……。\n\tおもしろそうですね。\n@c0@"
106:
  de: "@aBianca@bEs kann nicht schaden, wenn die Ausstellungsstücke ein bisschen komisch sind, sonst würden die Leute sie wohl kaum sehen wollen.\n@c0@"
  en: "@aBianca@bI reckon it's good if the exhibits are a bit funny, otherwise no one would bother comin' to see 'em.\n@c0@"
  es: "@aBianca@bBueno, supongo que está bien que las cosinas sean un poco raras, si no nadie vendría a verlas, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suppose que ce n'est pas plus mal si les pièces sont un peu spéciales, sinon personne ne se donnerait la peine de venir les voir.\n@c0@"
  it: "@aBianca@bGli oggetti divertenti lasciano sempre i visitatori un po' sconcertati...\n@c0@"
  ja: "@a@bビアンカ「名産品なんだから\n\tそれぐらい　変わってた方が\n\tいいんじゃないかな？\n@c0@"
107:
  de: "@aNera@bNun, ich halte es für eine gute Idee, die verschiedenartigsten Stücke auszustellen.\n@c0@"
  en: "@aNera@bWell I think it's a good thing to have a variety of exhibits on display.\n@c0@"
  es: "@aNera@bPenso que es buono tener cosinas variadas en la exposición.\n@c0@"
  fr: "@aNera@bEh bien, je crois que c'est une bonne chose d'avoir des objets très différents en exposition.\n@c0@"
  it: "@aNera@bLa varietà degli oggetti in esposizione è uno dei punti di forza del Museo del Souvenir. Viene subito dopo la grande abilità del mio amato ⓕdirettoreⓖ...\n@c0@"
  ja: "@a@bフローラ「いろいろな物があったほうが\n\t私は　楽しいと思いますわ。\n@c0@"
108:
  de: "@a%0%a001240@bAlso, ich mag die komischen Sachen. Weil sie... na ja... eben komisch sind!\n@c0@"
  en: "@a%0%a001240@bI like the funny exhibits. They're, er...funny!\n@c0@"
  es: "@a%0%a001240@bMe gustan las cosinas raras. Son, esto... ¡díver!\n@c0@"
  fr: "@a%0%a001240@bMoi j'aime bien les objets bizarres.\nIls sont, euh... bizarresⓠ\n@c0@"
  it: "@a%0%a001240@bMi piacciono gli oggetti divertenti.\nLi trovo... divertenti!\n@c0@"
  ja: "@a@b%a001240「ボク　おかしな名産品も\n\t好きだよ。\n@c0@"
109:
  de: "@a%0%a001250@bWenn die Ausstellungsstücke etwas komisch sind, heißt das doch nur, dass ihre Schöpfer interessante Leute sind. Das ist doch gut, oder?\n@c0@"
  en: "@a%0%a001250@bIf the exhibits are a bit funny, it means the craftsmen must've been fun, interesting people. That's good, isn't it?\n@c0@"
  es: "@a%0%a001250@bSi las cosinas son raras quiere decir que los artesanos deben de haber sido gente rara e interesante. Eso está bien, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bSi les objets sont un peu bizarres, ça veut dire\nque les artisans qui les ont faits étaient des gens originaux. C'est bien, nonⓡ\n@c0@"
  it: "@a%0%a001250@bImmagino che gli oggetti divertenti siano stati realizzati da persone simpatiche e spiritose.\nMi piacerebbe conoscere qualcuno di loro...\n@c0@"
  ja: "@a@b%a001250「わたしは　楽しい職人さんが\n\tいっぱい　いるみたいで\n\tうれしいけどな……。\n@c0@"
110:
  de: "@aSancho@bUnterschiedlisse Leute mögen unterschiedlisse Sachen, weißt du.\n@c0@"
  en: "@aSancho@bDifferent people, they like different theengs,\r\nyou know.\n@c0@"
  es: "@aSancho@bA cada persona le gusta una cosa.\n@c0@"
  fr: "@aSancho@bTout le m-m-monde n'aime pas les mêmes choses.\n@c0@"
  it: "@aSancho@b¿Ognunos ha el suo gusto personal, no?\n@c0@"
  ja: "@a@bサンチョ「物の価値は　人によって\n\tちがいますから。\n@c0@"
111:
  de: "@aSancho@bMansse Leute sehen eine interessante Ausstellung, und andere Leute, für die ist die Ausstellung nur un poco loco.\n@c0@"
  en: "@aSancho@bEsome people, they esee the interesting display, but for others, the esame display, eet ees just esometheeng loco.\n@c0@"
  es: "@aSancho@bAlgunas personas ven una cosina reteinteresante y otras ven una cosina reteloca.\n@c0@"
  fr: "@aSancho@bPour certains, oun objet sera intéressant, mais pour d'autres, le même objet sera j-j-juste bizarre.\n@c0@"
  it: "@aSancho@bPor alcunas personas estos souvenir sono bellos, por altras sono originales, por altras ancoras estranos.\n㈡\nCiascunos puede piensarla como preferisce...\n¡Esta es la bellezza de la arte!\n@c0@"
  ja: "@a@bサンチョ「面白いと思う人と\n\tヘンな物と　思う人がいるのは\n\tしかたのないことです。\n@c0@"
112:
  de: "@aOtto@bDer Kerl kapiert net, worauf's ankommt. Komisch, das ist doch der letzte Schrei!\n@c0@"
  en: "@aTuppence@bThat chap's missing the point. Weird is wonderful, you see, just like big is beautiful.\n@c0@"
  es: "@aAlazar@bEse tipo no se da cuenta del meollo de la cuestión. Lo raro es bello y lo feo hermoso.\n@c0@"
  fr: "@aInnocent@bLà n'est pas la question. De même que tout ce qui\r\nest petit est gentil, tout ce qui est étrange mérite louanges...\n@c0@"
  it: "@aSimon@bLa bellezza non è universale.\nA ciascuno di noi può capitare di trovarla nelle persone e nelle cose che ad altri non piacciono...\n@c0@"
  ja: "@a@bピピン「あの人は　わかってませんねえ。\n\tヘンなところに　面白味が\n\tあるんじゃないですか。\n@c0@"
113:
  de: "@aBianca@bNa so was, jetzt schreiben sie über dich auch noch Gedichte, was, %a000090?\n@c0@"
  en: "@aBianca@bFancy bein' the subject of a poem, eh, %a000090?\n@c0@"
  es: "@aBianca@bImagina, ser protagonista de un poema, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bC'est chouette d'inspirer un poème, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bChe bel poema...\nScommetto che è dedicato a un uomo intelligente e sensibile, nobile e generoso... Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「名産品に　こめられた意味を\n\tあらわした歌ね。\n@c0@"
114:
  de: "@aNera@bWas für ein Genie, aus dem Stegreif so ein Gedicht über das Firlefanzeum zu ersinnen!\n@c0@"
  en: "@aNera@bWhat an accomplished performer, just making up\r\na poem about the knick-knackatory on the spot\r\nlike that!\n@c0@"
  es: "@aNera@bQué poeta más bueno, le ha compuesto un poema al musenino en un instante, così sin más.\n@c0@"
  fr: "@aNera@bQuel artisteⓠ Être capable de composer un poème\nsur la Galericabrac comme ça, sur le moment...\n@c0@"
  it: "@aNera@bOh, che bravo!\nNon è da tutti comporre un poema così, su due piedi!\nComplimenti!\n@c0@"
  ja: "@a@bフローラ「名産品を　歌で表現なさるなんて\n\tさすが芸術の道を　歩む方ですわ。\n@c0@"
115:
  de: "@a%0%a001240@bDem fällt einfach zu allem ein Gedicht ein! Toll!\n@c0@"
  en: "@a%0%a001240@bThat poet can make up a poem about anything!\nIt's amazing!\n@c0@"
  es: "@a%0%a001240@bEse poeta puede hacer poemas sobre cualquier cosa.\n¡Es asombroso!\n@c0@"
  fr: "@a%0%a001240@bCe poète peut écrire des odes sur n'importe quoiⓠ C'est incroyableⓠ\n@c0@"
  it: "@a%0%a001240@bÈ incredibile!\nQuel poeta riesce a comporre versi bellissimi su qualsiasi soggetto! È geniale!\n@c0@"
  ja: "@a@b%a001240「何でも歌にできるって\n\tすごいよね。　今のはどういう歌なの？\n@c0@"
116:
  de: "@a%0%a001250@bWas für ein herrliches Gedicht! Ich finde, das ist sogar noch unterhaltsamer als die Ausstellungsstücke!\n@c0@"
  en: "@a%0%a001250@bWhat a superb poem! I think it's even more entertaining than the exhibits!\n@c0@"
  es: "@a%0%a001250@b¡Qué poema más bueno! Creo que es mejor que la colección.\n@c0@"
  fr: "@a%0%a001250@bQuel magnifique poèmeⓠ C'est encore plus divertissant que l'exposition elle-mêmeⓠ\n@c0@"
  it: "@a%0%a001250@bAh, un poeta... Un animo nobile che allieta il mondo con la profonda bellezza della sua arte!\nChe meraviglia!\n@c0@"
  ja: "@a@b%a001250「あの人の歌声も　お部屋に\n\t負けないぐらいキレイだった。\n\tぽっ……。\n@c0@"
117:
  de: "@aSancho@bSí, iss weiß, hier ist es voller herrlisser Dinge, aber es ist nisst angebracht, hier so viel Lärm zu machen.\n@c0@"
  en: "@aSancho@bSí, I know ees full of the wonderful displays, but ees no good to make eso much noise.\n@c0@"
  es: "@aSancho@bPues está bien padre que el sitio esté repleto de cosinas bellas, pero ni que hay que montar tanto escándalo.\n@c0@"
  fr: "@aSancho@bSi, je sais qu'il y a b-b-beaucoup de beaux objets, mais ce n'est pas la p-peine de faire autant de bruit.\n@c0@"
  it: "@aSancho@bDevo recordarme de preparare un cartellon...\nⓕ¡Silencio por favor!ⓖ\n@c0@"
  ja: "@a@bサンチョ「歌いたくなる気持ちは\n\tわかりますが　ほかのお客さんも\n\tいることですし……\n@c0@"
118:
  de: "@aSancho@bDas ist doch ein Museum. Im Museum macht man keinen Lärm. Da ist es immer ganz still.\n@c0@"
  en: "@aSancho@bEes a museum. You no make a noise een the museum. Eet must be esilence all the time.\n@c0@"
  es: "@aSancho@bEsto es un museo. No se hace ruido en los museos. Hay que guardar silencio.\n@c0@"
  fr: "@aSancho@bOn est dans oun musée. Il faut faire s-s-silence, dans oun musée. Tout le t-temps.\n@c0@"
  it: "@aSancho@b¡Esto es un museo, por todas la paellas!\nLa gente no puede mica gridare o cantar...\n¡Ops! ¿Sto hablando troppo ad alta voce?\n@c0@"
  ja: "@a@bサンチョ「館内では　静かにして\n\tいただきませんと。\n@c0@"
119:
  de: "@aOtto@bJetzt sieht jeder auf ihn statt auf die Ausstellungsstücke! Ich wette, jetzt kommt er sich blöd vor!\n@c0@"
  en: "@aTuppence@bNow everyone's looking at him rather than the exhibits! I bet he feels stupid!\n@c0@"
  es: "@aAlazar@bAhora todo el mundo le mira a él en vez de mirar a las cosinas. Seguro que se siente un poco bobo.\n@c0@"
  fr: "@aInnocent@bMaintenant, tout le monde le regarde lui au lieu des objetsⓠ Je parie qu'il se sent ridiculeⓠ\n@c0@"
  it: "@aSimon@bUhm, alle donne piacciono i poeti, eh? Ahem...\nⓕTre sorelle le frittelle fanno e sono belleⓖ...\nCi sono, ci sono quasi...\n@c0@"
  ja: "@a@bピピン「名産品よりも\n\tあの人が　注目されそうですよ。\n@c0@"
120:
  de: "@aBianca@bIn dem Aufzug sieht sie im Museum tatsächlich etwas deplatziert aus!\n@c0@"
  en: "@aBianca@bShe does look a bit out of place dressed like that\r\nin a museum!\n@c0@"
  es: "@aBianca@bParece un poco fuera de lugar vestida así en un museo, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle semble effectivement un peu déplacée,\nvêtue comme ça, dans un muséeⓠ\n@c0@"
  it: "@aBianca@bNon mi sembra proprio l'abbigliamento più adatto per una visita a un museo...\n@c0@"
  ja: "@a@bビアンカ「あのかっこうは　博物館では\n\tちょっとめだつよね。\n@c0@"
121:
  de: "@aNera@bSie zieht mehr Aufmerksamkeit auf sich als die Ausstellungsstücke!\n@c0@"
  en: "@aNera@bShe stands out more than the exhibits do!\n@c0@"
  es: "@aNera@bLlama più la atención que las cosinas.\n@c0@"
  fr: "@aNera@bOn la remarque davantage que les pièces exposéesⓠ\n@c0@"
  it: "@aNera@bMa come le sarà venuto in mente di vestirsi in quel modo, eh?\nOh, santa dea! In che mondo viviamo...\n@c0@"
  ja: "@a@bフローラ「名産品よりも　あの方が\n\tめだって見えますね。\n@c0@"
122:
  de: "@a%0%a001240@bUi! Die trägt ja genau dasselbe wie Hilda die Hortmutter!\n@c0@"
  en: "@a%0%a001240@bWow! She's wearing exactly the same outfit as\nPatty the party planner!\n@c0@"
  es: "@a%0%a001240@b¡Arrea! Lleva la misma ropa que Cone-Cone, la organizadora de grupos.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Elle est habillée exactement de la même façon que Tulipe, la chef d'équipeⓠ\n@c0@"
  it: "@a%0%a001240@bHai visto?\nHa lo stesso vestito di Greta l'Organizzagruppo!\n@c0@"
  ja: "@a@b%a001240「わ～い！\n\tルイーダさんと　おなじ洋服だね！\n@c0@"
123:
  de: "@a%0%a001250@bGlaubst du, das hat sie schon auf dem Weg hierher angehabt?\n@c0@"
  en: "@a%0%a001250@bDo you think she wore that all the way here?\n@c0@"
  es: "@a%0%a001250@b¿Crees que ha ido así vestida todo el camino hasta aquí?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'elle est venue jusqu'ici habillée\ncomme çaⓡ\n@c0@"
  it: "@a%0%a001250@bChe carino quel vestito!\nDove lo avrà comprato?\n@c0@"
  ja: "@a@b%a001250「あのお姉さん　あんなかっこうで\n\tここまで来たのかな……？\n@c0@"
124:
  de: "@aSancho@bDass die junge Señorita siss traut, so ins Firlefanzeum zu kommen, in diesen Kleidern, das ist... das ist...\n@c0@"
  en: "@aSancho@bFor the young señorita to come to thees\r\nknick-knackatory een esuch clothes,\r\nees, ees, ees...\n@c0@"
  es: "@aSancho@bPues que una señorita venga vestida así al musenino es nomás...\n@c0@"
  fr: "@aSancho@bVenir habillée c-c-comme ça à la Galericabrac,\r\npour oune j-j-jeune señorita, c'est... c'est... c'est...\n@c0@"
