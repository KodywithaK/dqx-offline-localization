  it: "@aSimon@bL'atmosfera è totalmente diversa da quella che si respira durante il giorno, quando è preso d'assalto dai visitatori.\n@c0@"
  ja: "@a@bピピン「夜中の博物館というのは\n\tボクは　どうも……。\n@c0@"
508:
  de: "@aBianca@bWovon er wohl gerade träumt?\n@c0@"
  en: "@aBianca@bI wonder what he's dreamin' about.\n@c0@"
  es: "@aBianca@bMe pregunto qué soñará, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande à quoi il rêve.\n@c0@"
  it: "@aBianca@bChissà cosa starà sognando...\n@c0@"
  ja: "@a@bビアンカ「いったい　どんな夢を\n\t見てるのかしら？\n@c0@"
509:
  de: "@aNera@bEr vergleicht immer noch, selbst im Schlaf!\n@c0@"
