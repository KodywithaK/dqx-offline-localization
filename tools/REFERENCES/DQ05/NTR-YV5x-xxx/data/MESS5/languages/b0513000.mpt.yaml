  fr: "@a%0%a001250@bIl n'a pas peur de dormir tout seul dans\nun endroit pareilⓡ\n@c0@"
  it: "@a%0%a001250@bMa non ha paura di dormire tutto da solo in un posto del genere?\n@c0@"
  ja: "@a@b%a001250「こんなところで　ひとりで寝て…\n\tこわくないのかな……？\n@c0@"
512:
  de: "@aSancho@bEr schläft hier doch nisst wegen des Schnickschnacks, eh? No, das nisst. Nisst wegen des Schnickschnacks.\n@c0@"
  en: "@aSancho@bHe no estay the night here because he loves the knick-knacks, eh? No, no. Ees no because\r\nof thees.\n@c0@"
  es: "@aSancho@bNo se queda aquí a dormir porque le gusten las cosinas. No, no es por eso.\n@c0@"
  fr: "@aSancho@bIl ne r-r-reste quand même pas ici la nuit\nparce qu'il aime le bric-à-brac, siⓡ No, no.\nCe n'est pas p-p-pour ça.\n@c0@"
  it: "@aSancho@bPiensavo que un hombre tantos ricco potesse permetterse de dormire en una locandas...\n@c0@"
  ja: "@a@bサンチョ「ここで寝泊まりしている理由は\n\tじゅんすいに　名産品が好きだから…\n\tということでは　ないようですね。\n@c0@"
513:
  de: "@aOtto@bSieht ja net aus, als würd' er irgendwann mal wieder gehen, net wahr? Schad'...\n@c0@"
