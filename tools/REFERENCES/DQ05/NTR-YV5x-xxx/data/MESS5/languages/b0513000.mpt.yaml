  en: "@aSancho@bBut estill he believes he can improve hees technique, you know? Ees thees I admire\r\neso much.\n@c0@"
  es: "@aSancho@bPero igual dice que puede mejorar su técnica. Eso me causa una tremenda admiración.\n@c0@"
  fr: "@aSancho@bMais il pense quand même p-p-pouvoir encore\r\naméliorer sa technique. C'est oune chose que\r\nj'admire b-b-beaucoup.\n@c0@"
  it: "@aSancho@bDev'essere un vero perfezionistas, chico.\n¡Anche lo zio Sancho lo è: yo cerco siempre de preparare la paella perfecta!\n@c0@"
  ja: "@a@bサンチョ「おごることなく　ウデを\n\tみがこうとする　その心がまえには\n\tかんぷくいたしました。\n@c0@"
139:
  de: "@aOtto@bHmm... Hinter dem steckt mehr, als man auf den ersten Blick erkennt.\n@c0@"
  en: "@aTuppence@bHmm... There's more to that man than meets the eye.\n@c0@"
  es: "@aAlazar@bMmm... Este hombre es más de lo que parece.\n@c0@"
  fr: "@aInnocent@bMmm... Cet homme n'est pas une personne ordinaire.\n@c0@"
  it: "@aSimon@bUhm, chissà che genere di oggetti realizza quel signore...\n@c0@"
  ja: "@a@bピピン「う～ん…\n\tただ者ではなさそうですね。\n@c0@"
140:
  de: "@aBianca@bTja, vielleicht ist es hier wirklich ein wenig unheimlich. Du scheinst sie ja sehr beeindruckt zu haben!\n@c0@"
  en: "@aBianca@bI s'pose you could say the place is a bit scary. Sounds like she's pretty impressed with you, mind!\n@c0@"
  es: "@aBianca@bSupongo que este sitio asusta un poco. Parece que la has impresionado, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai que cet endroit peut paraître un peu effrayant. Mais on dirait que tu l'impressionnes beaucoupⓠ\n@c0@"
  it: "@aBianca@bSe quella tipa dice solo un'altra parola sul ⓕmioⓖ direttore, le faccio ingoiare il biglietto d'ingresso!\n@c0@"
  ja: "@a@bビアンカ「じつは私も　ちょっと\n\tこわかったんだ。　べつに%a000090が\n\t気にいってるなら　いいんだけど……。\n@c0@"
141:
  de: "@aNera@bIch glaube nicht, dass es der Frau missfällt, wie du hier alles eingerichtet hast, %a000090.\n@c0@"
  en: "@aNera@bI don't think the woman dislikes the way you've set the place out, %a000090.\n@c0@"
  es: "@aNera@bNo me importa que a esa donna no le guste cómo lo has organizado tutto, %a000090.\n@c0@"
  fr: "@aNera@bJe crois que cette femme ne déteste pas la façon dont tu as tout disposé, %a000090.\n@c0@"
  it: "@aNera@bNon è che a quella signora dispiaccia il modo in cui abbiamo curato l'esposizione degli oggetti al Museo del Souvenir...\n@c0@"
  ja: "@a@bフローラ「%a000090さんの　ならべ方が\n\t嫌ということは　ありませんわ。\n@c0@"
142:
  de: "@aNera@bEs ist nur einfach nicht die Art Museum, in dem eine junge Dame nachts gern allein herumwandern würde, das ist alles.\n@c0@"
  en: "@aNera@bIt's just that it's not the kind of museum a young lady would like to walk around on her own at night, that's all.\n@c0@"
  es: "@aNera@bEs solo que no es el tipo de museo en el que a una ragazza le gustaría estar sola en mitad de la notte.\n@c0@"
  fr: "@aNera@bC'est juste que ce n'est pas le genre de musée dans lequel une jeune femme aimerait se promener seule\r\nla nuit, c'est tout.\n@c0@"
  it: "@aNera@bÈ solo che avrebbe sognato di trascorrere la luna di miele in un posto differente.\n@c0@"
  ja: "@a@bフローラ「ただ　夜にひとりでは\n\t歩きたくない　博物館に\n\tなっていますわよね……。\n@c0@"
143:
  de: "@a%0%a001240@bDas unheimliche Firlefanzeum? Das klingt ja fast wie ein Spukhaus, oder?\n@c0@"
  en: "@a%0%a001240@bA scary knick-knackatory? That makes it a bit like a haunted house, doesn't it?\n@c0@"
  es: "@a%0%a001240@b¿Un musenino que da miedo? Eso lo convierte en una especie de mansión encantada, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bEffrayante, la Galericabracⓡ Un peu comme une maison hantéeⓡ\n@c0@"
  it: "@a%0%a001240@bMa davvero il Museo del Souvenir è un posto terrificante?\nA me non dà affatto quest'impressione...\n@c0@"
  ja: "@a@b%a001240「こわい博物館かあ。\n\tなんか　お化け屋敷みたいだね。\n@c0@"
144:
  de: "@a%0%a001250@bDu könntest ein paar Ausstellungsstücke austauschen, Papa. Gegen ein paar weniger unheimliche Stücke, meine ich.\n@c0@"
  en: "@a%0%a001250@bYou could change a few of the exhibits, Dad.\nFor something less scary, I mean.\n@c0@"
  es: "@a%0%a001250@bPodrías cambiar alguna de las cosas expuestas.\nPor algo que dé un poco menos de miedo, quiero decir.\n@c0@"
  fr: "@a%0%a001250@bTu pourrais peut-être changer un ou deux objets, papa. Pour les remplacer par quelque chose\nde moins effrayant, peut-être.\n@c0@"
  it: "@a%0%a001250@bBeh, immagino che potremmo cambiare qualcuno degli oggetti in esposizione per far sembrare il Museo un po' meno impressionante...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tかざってる名産品　かえない？\n@c0@"
145:
  de: "@aSancho@bDie Señorita, sie hat ein Gesisst so weiß wie eine ungebackene Tortilla, no? Vielleisst ist hier jetzt nisst mehr der risstige Ort por las Señoritas.\n@c0@"
  en: "@aSancho@bThees señorita, her face ees white like the uncooked tortilla, no? Maybe here ees no\r\nthe place for ladies now.\n@c0@"
  es: "@aSancho@bLa cara de la señora está blanca cual tortilla sin cocinar. Igual ahorita este no es sitio para mujeres.\n@c0@"
  fr: "@aSancho@bLe visage de cette señorita est p-pâle comme oune tortilla pas cuite, noⓡ Peut-être que ce n'est\np-p-pas oun endroit pour les dames. \n@c0@"
  it: "@aSancho@bForse los souvenir espostos en esto momento no sono muy adattos por las señoritas...\n¿Si provassimo a cambiar un poco l'esposiziones?\n@c0@"
  ja: "@a@bサンチョ「あの方　少し顔色が\n\t悪かったですね。\n\t女性には　不向きだったのでしょう。\n@c0@"
146:
  de: "@aOtto@bUnheimlich? Unser Firlefanzeum?\nNa, also ich hab k-keine Angst!\n@c0@"
  en: "@aTuppence@bScary? This place? W-Well I'm not scared.\n@c0@"
  es: "@aAlazar@b¿Dar miedo? ¿Este lugar? Bueno, yo no estoy asustado.\n@c0@"
  fr: "@aInnocent@bEffrayant, cet endroitⓡ\nN-Non, je n'ai pas peur, moi.\n@c0@"
  it: "@aSimon@bImpressionante?!\nQuesto posto?!\nMa va' là! È assolutamente fantastico! O forse no...?\n@c0@"
  ja: "@a@bピピン「こわい名産品ですか？\n\tぼ　ボクは平気ですよ。\n@c0@"
147:
  de: "@aBianca@bOh. Jetzt tut es ihm anscheinend leid, dass er sie hergebracht hat. Vielleicht können wir etwas umdekorieren, damit sie sich weniger fürchtet.\n@c0@"
  en: "@aBianca@bOops. Sounds like he's regrettin' bringin' her here. Maybe we could try changin' things about a bit so she's not so scared.\n@c0@"
  es: "@aBianca@bVaya. Parece que se está arrepintiendo de haberla traído. Igual podríamos cambiar las cosas un poco para que no este tan asustada la pobre, ¿sabes?\n@c0@"
  fr: "@aBianca@bOups. On dirait qu'il regrette de l'avoir amenée ici. Peut-être qu'on devrait changer une ou deux choses pour qu'elle n'ait plus peur.\n@c0@"
  it: "@aBianca@bQuel tipo non ha ancora capito cosa pensa la moglie del Museo del Souvenir... A proposito! Amore, che ne diresti di cambiare qualcuno degli oggetti esposti?\n@c0@"
  ja: "@a@bビアンカ「失敗と思わせちゃったのは\n\tまずいわね。　やっぱり\n\t展示品を　かえましょうか……。\n@c0@"
148:
  de: "@aNera@bDer arme Mann ist ganz unglücklich. Vielleicht könnten wir ein paar Dinge umstellen, damit es hier nicht mehr so unheimlich ist, was meinst du?\n@c0@"
  en: "@aNera@bThe poor man's really upset. At least we could change things around so the place isn't so scary\r\nany more, couldn't we?\n@c0@"
  es: "@aNera@bEl poverino está muy disgustado. Al menos, podríamos cambiar las cosas para que este sitio no dé tanto miedo.\n@c0@"
  fr: "@aNera@bCe pauvre homme est vraiment chagriné. Nous pourrions au moins changer une chose ou deux pour que cet endroit paraisse moins effrayant, nonⓡ\n@c0@"
  it: "@aNera@bLa moglie chiede notizie del direttore?! Voglio str...\nEhm, voglio strabiliarla cambiando qualcuno dei souvenir esposti. Già, proprio così. Grrrrr!\n@c0@"
  ja: "@a@bフローラ「新婚旅行で　こわい思い出は\n\t残したくないですよね。\n@c0@"
149:
  de: "@a%0%a001240@bDas ist doch klasse für Flitterwochen! Das sagt er sicher nur, weil er sich vor den Ausstellungsstücken fürchtet.\n@c0@"
  en: "@a%0%a001240@bIt's a great place for a honeymoon! I think he's just saying that because he's scared by the exhibits.\n@c0@"
  es: "@a%0%a001240@b¡Es un sitio genial para una luna de miel! Creo que solo dice lo que dice porque le dan miedo las cosinas.\n@c0@"
  fr: "@a%0%a001240@bC'est un endroit génial pour une lune de mielⓠ\nÀ mon avis, il dit ça juste parce que les pièces\nlui font peur.\n@c0@"
  it: "@a%0%a001240@bNon capisco perché certa gente pensi che questo posto non sia adatto a una luna di miele... Forse abbiamo esposto dei souvenir troppo inquietanti?\n@c0@"
  ja: "@a@b%a001240「失敗かあ……。\n\tあの人たち　こわいの苦手なんだね。\n@c0@"
150:
  de: "@a%0%a001250@bVielen Besuchern sind unsere aktuellen Ausstellungsstücke offenbar unheimlich, aber er hat nur Angst davor, dass seine Frau ihn nicht liebt!\n@c0@"
  en: "@a%0%a001250@bLots of the other visitors seem to be scared by the exhibits at the moment, but he's scared his wife doesn't love him!\n@c0@"
  es: "@a%0%a001250@bOtros muchos visitantes parecen tener miedo de las cosinas que hayⓓ pero él de lo que tiene miedo es de que su mujer no lo quiera.\n@c0@"
  fr: "@a%0%a001250@bIl y a plein de visiteurs qui ont peur des objets,\nen ce moment, mais lui, ce dont il a peur, c'est \nque sa femme ne l'aime pasⓠ\n@c0@"
  it: "@a%0%a001250@bMolti visitatori sono spaventati dai souvenir esposti... Quel tipo, invece, ha paura che la moglie possa interessarsi a un altro uomo!\n@c0@"
  ja: "@a@b%a001250「それに　なんだか\n\tこわいお客さんで\n\tいっぱいに　なっちゃったもんね。\n@c0@"
151:
  de: "@aSancho@bJetzt kommen nisst mehr so viele Besucher, eh, Chico? Vielleisst kommen sie nisst mehr, weil sie siss hier fürssten.\n@c0@"
  en: "@aSancho@bThere are no eso many clientes now, eh, friend?\r\nMaybe they are no coming because ees eso\r\nescary here now.\n@c0@"
  es: "@aSancho@bAhorita no hay tantos visitantes.\r\nIgual es porque este sitio da muchísimas náñaras.\n@c0@"
  fr: "@aSancho@bIl n'y a pas b-b-beaucoup de clients en ce moment, hein, chicoⓡ Peut-être qu'ils ne viennent pas\np-parce que c'est trop effrayant, noⓡ\n@c0@"
  it: "@aSancho@bMe pare que ahora aquí al Museo no ce sono muchos visitatores... ¿Forse los souvenir espostos sono troppos espaventosos?\n@c0@"
  ja: "@a@bサンチョ「この影響で　お客さんの足が\n\t遠のかなければ　いいのですが……。\n@c0@"
152:
  de: "@aOtto@bIch wette, dem alten Firle Franz tät' die Ausstellung g'fallen, wo er doch ein G'spenst ist, net wahr.\n@c0@"
  en: "@aTuppence@bI bet Old Man Nick would like these displays, being a ghost and all.\n@c0@"
  es: "@aAlazar@bSeguro que al abuelo Nino le encantan estas cosinasⓓ como es un fantasma...\n@c0@"
  fr: "@aInnocent@bVu que le vieux Bricabrac est un fantôme, je parie que tous ces objets lui plairaient, à lui.\n@c0@"
  it: "@aSimon@bScommetterei la mia paga di un anno che a Geremia gli oggetti esposti adesso piacciono moltissimo!\nIl nostro anziano amico ha gusti molto particolari...\n@c0@"
  ja: "@a@bピピン「デスじいさんには\n\tぴったりかも　しれませんね。\n\tゆうれいですから。\n@c0@"
153:
  de: "@aBianca@bEr sieht die Dinge offenbar etwas anders als andere. Das liegt sicher daran, dass er so viele Kämpfe bestehen musste.\n@c0@"
  en: "@aBianca@bHe seems to have a bit of a different way of seein' things to other folk. I s'pose that's what bein' in battle all the time does to you.\n@c0@"
  es: "@aBianca@bParece que tiene un modo de ver las cosas distinto al de los demás. Supongo que pasar tanto tiempo en combate acaba por volverte así, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait qu'il ne voit pas les choses de la même manière que les autres. Ça doit tenir au fait qu'il est tout le temps en train de se battre.\n@c0@"
  it: "@aBianca@bQuel tipo non è affatto spaventato dai souvenir esposti al Museo in questo momento. Ciò che vede sui campi di battaglia deve sembrargli ben più orribile...\n@c0@"
  ja: "@a@bビアンカ「ほかの人とは　見ている\n\tところが　ちがうみたい。\n\t戦いに生きる人　ならではね。\n@c0@"
154:
  de: "@aNera@bIch vermute, er hat in seinen vielen Kämpfen schon so viel gesehen, dass es sich darauf auswirkt, wie er die Dinge betrachtet.\n@c0@"
  en: "@aNera@bI suppose he's seen so much in all the battles he's fought. It must affect the way you look at things.\n@c0@"
  es: "@aNera@bSembra que ha visto muchas cosas en las batallas en las que ha luchado. Eso debe de afectar al modo en que ves el mundo.\n@c0@"
  fr: "@aNera@bIl a dû voir tant de choses au cours des batailles qu'il a menées. Ça doit affecter sa manière de voir le monde.\n@c0@"
  it: "@aNera@bCi vuol altro che qualche souvenir impressionante per spaventare un guerriero abituato alle crudeltà del campo di battaglia!\n@c0@"
  ja: "@a@bフローラ「きっと　いくつもの戦いを\n\t経験してみがかれた　感性ですのね。\n@c0@"
155:
  de: "@a%0%a001240@bKeine Ahnung, was der Mann genau gesagt hat, aber er scheint ein echt lässiger Typ zu sein!\n@c0@"
  en: "@a%0%a001240@bI don't know what that man said exactly, but it made him sound really cool!\n@c0@"
  es: "@a%0%a001240@bNo sé lo que significa lo que ha dicho ese hombre, pero sonaba genial.\n@c0@"
  fr: "@a%0%a001240@bJe ne sais pas exactement ce que ce type voulait dire, mais ça lui donnait un air superⓠ\n@c0@"
  it: "@a%0%a001240@bQuel tipo dev'essere molto coraggioso, per non essere spaventato dagli oggetti che abbiamo deciso di esporre al Museo del Souvenir!\n@c0@"
  ja: "@a@b%a001240「すごいこと\n\t言ってるのは　わかるけど\n\tなんだか　よくわからないや。\n@c0@"
156:
  de: "@a%0%a001250@bDie meisten Stücke, die wir gerade ausstellen, mag ich nicht mal ansehen.\n@c0@"
  en: "@a%0%a001250@bI can't even peek at most of the exhibits that are on display at the moment.\n@c0@"
  es: "@a%0%a001250@bYo ni siquiera puedo mirar de reojo a la mayoría de las cosas que están expuestas ahora mismo.\n@c0@"
  fr: "@a%0%a001250@bJe n'ose même pas jeter un coup d'œil à la plupart des objets exposés en ce moment.\n@c0@"
  it: "@a%0%a001250@bIo mi sento un po' a disagio di fronte ai souvenir più spaventosi che sono esposti qui...\n@c0@"
  ja: "@a@b%a001250「私ね　今かざってある\n\t名産品　あまり見ていられないの。\n@c0@"
157:
  de: "@a%0%a001250@bAber der Mann da hat sie sich ganz lange angeschaut, nicht? Ui! Der ist bestimmt total mutig!\n@c0@"
  en: "@a%0%a001250@bBut that man's been looking straight at them for ages, hasn't he? Wow! He must be so brave!\n@c0@"
  es: "@a%0%a001250@bPero ese hombre las ha estado mirando fijamente un buen rato, ¿verdad? ¡Vaya! ¡Debe de ser muy valiente!\n@c0@"
  fr: "@a%0%a001250@bMais cet homme les fixe depuis un bon moment, heinⓡ Waouhⓠ Il doit être très courageuxⓠ\n@c0@"
  it: "@a%0%a001250@bQuell'uomo, invece, non ha fatto una piega!\nDeve averne viste di tutti i colori nella sua vita...\n@c0@"
  ja: "@a@b%a001250「あの人　ずっと見てたの？\n\tすごいなあ……。\n@c0@"
158:
  de: "@aSancho@bSí! Hast du gehört? Das ist das risstige Publikum! Der kann mit unserer Ausstellung was anfangen!\n@c0@"
  en: "@aSancho@bSí! You esee? The right kind of\r\nperson, he can appreciate thees display.\n@c0@"
  es: "@aSancho@b¡Órale! Ya se lo dije. Esta exposición nomás la puede apreciar cierto tipo de gente.\n@c0@"
  fr: "@aSancho@bSiⓠ Tu v-v-voisⓡ Il y a des gens qui p-p-peuvent apprécier ces objets.\n@c0@"
  it: "@aSancho@b¿Claro, no? Cada visitator apprezza un tipo de souvenir diverso. No es posible realizzar un'esposiziones que accontenti todos...\n@c0@"
  ja: "@a@bサンチョ「ほう　わかる人には\n\tわかる　ものなのですね。\n@c0@"
159:
  de: "@aOtto@bMeint Ihr, wenn ich mich sehr bemüh', könnt' ich eins der furchtbaren Dinger längere Zeit anschau'n?\n@c0@"
  en: "@aTuppence@bDo you think I might be able to toughen up enough to stare out one of these terrifying exhibits?\n@c0@"
  es: "@aAlazar@b¿Creéis que llegaré a ser tan duro como para poder mirar fijamente una de estas cosinas?\n@c0@"
  fr: "@aInnocent@bVous croyez que j'arriverai à m'endurcir suffisamment pour regarder tous ces objets terrifiantsⓡ\n@c0@"
  it: "@aSimon@bUn giorno anch'io sarò tanto duro e coraggioso da poter ammirare persino i souvenir più spaventosi senza che brividi gelidi mi percorrano la schiena...\n@c0@"
  ja: "@a@bピピン「ボクも強くなれば　あの人のような\n\t目線で名産品を　見ることが\n\tできるでしょうか？\n@c0@"
160:
  de: "@aBianca@bTja, wenigstens nimmt er kein Blatt vor den Mund, was?\n@c0@"
  en: "@aBianca@bWell, you can't accuse him of mincin' his words, eh?\n@c0@"
  es: "@aBianca@bBueno, no se le puede acusar de no decir lo que piensa, ¿eh?\n@c0@"
  fr: "@aBianca@bEh bien, on peut dire qu'il ne mâche pas ses motsⓠ\n@c0@"
  it: "@aBianca@bHa ragione. Tuttavia, è proprio in momenti difficili come questi che la gente ha bisogno di distrarsi, per dimenticare le preoccupazioni almeno per un po'...\n@c0@"
  ja: "@a@bビアンカ「なんか　もっともなこと\n\t言われちゃったような……。\n@c0@"
161:
  de: "@aNera@bNun, es ist wichtig, dass die Menschen in diesen unruhigen Zeiten wenigstens einen oder zwei Orte haben, an denen sie sich wohlfühlen können.\n@c0@"
  en: "@aNera@bWell it's important that people keep at least one or two places where they can go to relax in these troubled times.\n@c0@"
  es: "@aNera@bVa bene, hoy en día es importante para la gente tener un par de sitios donde poder relajarse.\n@c0@"
  fr: "@aNera@bEn ces temps troublés, c'est important que les gens aient au moins un ou deux lieux où ils peuvent aller se détendre un peu, nonⓡ\n@c0@"
  it: "@aNera@bNon sono d'accordo. Anche nei periodi più critici è importante trovare il modo di allontanare i cattivi pensieri, altrimenti si perde la speranza nel futuro.\n@c0@"
  ja: "@a@bフローラ「こんな　時代だからこそ\n\t人々が落ち着ける　場所を作ることが\n\t大切なのですよね？\n@c0@"
162:
  de: "@a%0%a001240@bMeint er damit, das ist bloß eine Spielerei?\nDabei spielen wir doch meistens gar nicht. Meistens sind wir damit beschäftigt, Monster zu bekämpfen!\n@c0@"
  en: "@a%0%a001240@bDoes he mean it's just for play?\nBecause we don't play most of the time.\nMost of the time we're busy fighting monsters!\n@c0@"
  es: "@a%0%a001240@bQuiere decir que hace frío.\nPorque la mayor parte del tiempo no hace frío.\nCasi siempre tenemos la calefacción.\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'il veut dire qu'on fait ça uniquement pour s'amuserⓡ Parce que la plupart du temps, on ne s'amuse pas.\n㈡\nOn passe presque tout notre temps à combattre des monstresⓠ\n@c0@"
  it: "@a%0%a001240@bE dove vuole che abbiano la testa, eh?! Sul collo! Non penserà mica che concedersi qualche ora di svago voglia dire non avere a cuore il destino del mondo?!\n@c0@"
  ja: "@a@b%a001240「のんきかあ……。\n\tふだんのボクたちは\n\tぜんぜん　のんきじゃないんだけどな。\n@c0@"
163:
  de: "@a%0%a001250@bWenn er so denkt, warum ist er dann überhaupt hergekommen?\n@c0@"
  en: "@a%0%a001250@bWhy did he bother coming if that's what he thinks?\n@c0@"
  es: "@a%0%a001250@bSi eso es lo que piensa, ¿para qué viene?\n@c0@"
  fr: "@a%0%a001250@bPourquoi il est venu, alors, si c'est ça qu'il penseⓡ\n@c0@"
  it: "@a%0%a001250@bCapisco, capisco...\nMa allora perché è venuto qui al Museo?\nMi sa che quel tipo predica bene e razzola male...\n@c0@"
  ja: "@a@b%a001250「そんなこと言うなら\n\t来なければいいのに……。\n@c0@"
164:
  de: "@aSancho@bEs ist immer wisstig, Zeit zum Entspannen zu haben, weißt du. Und für la Paella. Sí, aber natürliss.\n@c0@"
  en: "@aSancho@bEes always important to have the time for relaxing, you know. And for the paella. Sí, sí, sí.\n@c0@"
  es: "@aSancho@bEs bien importante dedicar un tiempo a relajarse. Y a los frijoles. ¡Ándale!\n@c0@"
  fr: "@aSancho@bC'est toujours muy important d'avoir du t-t-temps pour se détendre. Et aussi pour dégouster la paella. Si, si, si.\n@c0@"
  it: "@aSancho@bYo credo que es siempre importante trovar un poco de tiempo por rilassarse.\nY anche por un poco de paella...\n@c0@"
  ja: "@a@bサンチョ「どんな時代でも　心にゆとりを\n\t持つことは大事です。\n@c0@"
165:
  de: "@aOtto@bWenn Ihr mich fragt, ist dem bloß eine Laus über die Leber g'laufen. Vielleicht hatte er gerade ein unangenehmes Erlebnis.\n@c0@"
  en: "@aTuppence@bSounds like that chap's a bit sore about something if you ask me. Maybe he had a bad experience recently.\n@c0@"
  es: "@aAlazar@bA mí me da que está picado por algo. Igual ha vivido una mala experiencia hace poco.\n@c0@"
  fr: "@aInnocent@bCe type m'a l'air un peu amer, si vous voulez mon avis. Il a peut-être eu une mauvaise expérience récemment.\n@c0@"
  it: "@aSimon@bCerto, come no?!\nE allora cosa dovrebbe fare la gente? Chiudersi in casa e aspettare che arrivi la fine del mondo?!\n@c0@"
  ja: "@a@bピピン「あの人　何かいやなことでも\n\tあったんじゃないんですか？\n@c0@"
166:
  de: "@aBianca@bEr sieht ja wirklich etwas abgerissen aus.\nWo er wohl herkommt?\n@c0@"
  en: "@aBianca@bHe does look a bit of a state. I wonder where it is he's come from.\n@c0@"
  es: "@aBianca@bTiene una pinta lamentable. Me pregunto de dónde vendrá, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl est effectivement en triste état.\r\nJe me demande d'où il vient.\n@c0@"
  it: "@aBianca@bCerto che è ridotto proprio maluccio, eh?\nChissà da dove arriva quel poverino...\n@c0@"
  ja: "@a@bビアンカ「あんなに服が　ボロボロに\n\tなるなんて。　いったいどこから\n\t来てくれたのかしら？\n@c0@"
167:
  de: "@aNera@bDer arme Mann! Es muss für ihn sehr schwer gewesen sein, hierher zu kommen.\n@c0@"
  en: "@aNera@bThe poor man! He must've had a terribly harsh time of it getting here.\n@c0@"
  es: "@aNera@b¡Poverino! Lo ha debido de pasar fatal para llegar aquí.\n@c0@"
  fr: "@aNera@bPauvre hommeⓠ Il a dû avoir beaucoup de mal\nà arriver jusqu'ici.\n@c0@"
  it: "@aNera@bOh, santa dea!\nGuarda in che condizioni è quell'uomo! Deve aver fatto dei pessimi incontri mentre veniva qui...\n@c0@"
  ja: "@a@bフローラ「ここに来るために　ものすごい\n\t過酷な旅をして　こられたのですね。\n@c0@"
168:
  de: "@a%0%a001240@bIch glaube nicht, dass seine Kleidung nur beim Reisen so gelitten hat.\n@c0@"
  en: "@a%0%a001240@bI don't think his clothes would've got that messed up just from travelling.\n@c0@"
  es: "@a%0%a001240@bNo creo que su ropa se haya quedado así de viajar.\n@c0@"
  fr: "@a%0%a001240@bÇa m'étonnerait que ses vêtements soient dans un état pareil rien qu'à cause du voyage.\n@c0@"
  it: "@a%0%a001240@bMa come avrà fatto a ridursi in quel modo?!\n@c0@"
  ja: "@a@b%a001240「旅をしてても　なかなか\n\tあんなに　ボロボロにならないような\n\t気がするんだけど……。\n@c0@"
169:
  de: "@a%0%a001240@bVielleicht musste er auf dem Weg hierher gegen ein gefährliches Ungeheuer kämpfen oder so!\n@c0@"
  en: "@a%0%a001240@bMaybe he fought some amazing monster on the way here or something!\n@c0@"
  es: "@a%0%a001240@bIgual se tuvo que enfrentar a un monstruo terrible de camino, o algo.\n@c0@"
  fr: "@a%0%a001240@bIl a peut-être combattu un monstre phénoménal\nen chemin, ou un truc comme çaⓠ\n@c0@"
  it: "@a%0%a001240@bProbabilmente sarà stato attaccato dai mostri mentre veniva qui al Museo...\n@c0@"
  ja: "@a@b%a001240「すごい魔物と\n\tたたかったりしたのかな？\n@c0@"
170:
  de: "@a%0%a001250@bMeinst du, er ist verletzt? Hoffentlich nicht...\n@c0@"
  en: "@a%0%a001250@bDo you think he's hurt? I hope he's okay...\n@c0@"
  es: "@a%0%a001250@b¿Crees que estará herido? Espero que esté bien.\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il est blesséⓡ J'espère qu'il va bien...\n@c0@"
  it: "@a%0%a001250@bMamma mia, com'è ridotto male!\nPer fortuna non sembra ferito...\n@c0@"
  ja: "@a@b%a001250「あのおじさん\n\tケガしてないの？　大丈夫なの？\n@c0@"
171:
  de: "@aSancho@bDieser Señor, er ist kein erfahrener Reisender, no?\n@c0@"
  en: "@aSancho@bThees señor, he ees no a seasoned\r\ntraveller, eh?\n@c0@"
  es: "@aSancho@bEste señor pues no es un viajero curtido.\n@c0@"
  fr: "@aSancho@bCe señor, ça n'est pas oun voyageur aguerri, heinⓡ\n@c0@"
  it: "@aSancho@bQuel señor doveva spender el suo dinero por comprarse qualche vestitos nuevos, inveces de acquistar el biglietto d'ingresso al Museo...\n@c0@"
  ja: "@a@bサンチョ「旅なれた方　ということでは\n\tないようですな。\n@c0@"
172:
  de: "@aOtto@bDas meint er ja wohl net ernst, net wahr? Ich mein', er hat sich das Zeug doch grad erst angezogen, bevor er reinkam, oder etwa net?\n@c0@"
  en: "@aTuppence@bHe's not being serious, is he?\nI mean, he just got changed into those clothes before he came in or something, didn't he?\n@c0@"
  es: "@aAlazar@bNo hablará en serio, ¿verdad?\r\nO sea, se habrá puesto esa ropa en la entrada o algo, ¿no?\n@c0@"
  fr: "@aInnocent@bIl n'est pas sérieux, quand mêmeⓡ Je veux dire...\nIl s'est changé juste avant d'entrer pour passer\nces loques, ça n'est pas possible autrementⓠ\n@c0@"
  it: "@aSimon@bSecondo me ha indossato quegli stracci per provare a impietosire Geremia e Sue Venir e farsi regalare un ingresso omaggio al Museo...\n@c0@"
  ja: "@a@bピピン「あれって　じょうだんですよね？\n\t本気ですかね？\n@c0@"
173:
  de: "@aBianca@bWir haben eine ganz schöne Sammlung beisammen, was? Da kann man mal sehen, wo wir schon überall gewesen sind.\n@c0@"
  en: "@aBianca@bWe have got quite a collection goin' now, eh?\r\nJust goes to show how many places we've bin to.\n@c0@"
  es: "@aBianca@bYa tenemos una colección respetable, ¿eh?\r\nDemuestra a cuántos sitios hemos ido.\n@c0@"
  fr: "@aBianca@bOn a une belle collection, maintenant, nonⓡ Ça donne une idée du nombre d'endroits où on est allés.\n@c0@"
  it: "@aBianca@bLa collezione di oggetti del Museo comprende anche degli oggetti inquietanti, ma non credevo che qualcuno li avrebbe trovati addirittura spaventosi!\n@c0@"
  ja: "@a@bビアンカ「ずいぶん名産品が\n\t集まったわよね。\n\tそれだけ　世界をまわったんだわ。\n@c0@"
174:
  de: "@aNera@bErst durch die Reisen mit dir ist mir klar geworden, wie schön die Welt ist, in der wir leben.\n@c0@"
  en: "@aNera@bIt's travelling with you that made me realise how wonderful the world we live in is.\n@c0@"
  es: "@aNera@bViajar con te me ha hecho darme cuenta de lo meraviglioso que es il mondo en que vivimos.\n@c0@"
  fr: "@aNera@bC'est de voyager avec toi qui m'a fait prendre conscience que le monde dans lequel nous\r\nvivons est merveilleux.\n@c0@"
  it: "@aNera@bAl mondo esistono cose belle e altre orribili, quindi è giusto che il Museo del Souvenir accolga anche oggetti che qualcuno può trovare sgradevoli.\n@c0@"
  ja: "@a@bフローラ「私も　あなたと旅をして\n\t世界の広さを　実感できました。\n@c0@"
175:
  de: "@a%0%a001240@bWenn man genug unheimliche Stücke in einen Raum stellt, dann wirkt das Ganze gleich finsterer, oder?\n@c0@"
  en: "@a%0%a001240@bIf you put enough scary exhibits in a room, it makes the whole place feel darker, doesn't it?\n@c0@"
  es: "@a%0%a001240@bSi pones cosinas terroríficas suficientes en una sala, parece que es más oscura, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bSi on met plein d'objets qui font peur dans une salle, ça donne l'impression qu'elle est plus sombre, nonⓡ\n@c0@"
  it: "@a%0%a001240@bLe sale assumono un'aria tetra e lugubre, se si mettono in esposizione dei souvenir terrificanti...\n@c0@"
  ja: "@a@b%a001240「こわい名産品を\n\t多くかざると　お部屋の感じも\n\t暗くなったような　気がするよ。\n@c0@"
176:
  de: "@a%0%a001250@bIch mag die unheimlichen Sachen nicht. Wenn ich nachts hierherkommen müsste, würde ich bestimmt in Tränen ausbrechen.\n@c0@"
  en: "@a%0%a001250@bI don't like scary exhibits. I'm sure I'd end up in tears if I came here at night.\n@c0@"
  es: "@a%0%a001250@bNo me gustan las cosinas que dan miedo. Si viniera aquí de noche, seguro que me echaba a llorar.\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas les objets qui font peur. Je suis sûre que je finirais par me mettre à pleurer si je devais venir ici de nuit.\n@c0@"
  it: "@a%0%a001250@bNon mi sentirei a mio agio se dovessi visitare una sala colma di oggetti spaventosi, da sola e di notte!\n@c0@"
  ja: "@a@b%a001250「こわい名産品は\n\tなんかいやだな。\n\t夜に来たら　泣いちゃうかも……。\n@c0@"
177:
  de: "@aSancho@bSí. Es gibt so mansses schöne Souvenir aus ganz vielen verschiedenen Ländern.\n@c0@"
  en: "@aSancho@bSí. Ees eso many different esouvenirs from eso many different lands.\n@c0@"
  es: "@aSancho@b¡Ándale! Hay tantos souvenires de tantos lados.\n@c0@"
  fr: "@aSancho@bSi. Il y a tant de souvenirs d-d-différents de pays d-d-différents.\n@c0@"
  it: "@aSancho@bAhora aquí nel Museo ce sono souvenir provenientes da muchissimos países.\n@c0@"
  ja: "@a@bサンチョ「それぞれの　土地によって\n\t名産品も　いろいろありますからね。\n@c0@"
178:
  de: "@aOtto@bNach dem unheimlichen Kram verdrehen die Leut' die Hälse, net wahr? Wisst Ihr, was wirklich unheimlich wär? Wenn's hier echt einen verdrehten Hals gäb'!\n@c0@"
  en: "@aTuppence@bThe scary exhibits certainly turn heads, don't they? Actually, you know what would be really scary? A turning head!\n@c0@"
  es: "@aAlazar@bHoy en día las cosinas terroríficas llaman mucho la atención, ¿no creéis?\n¿Sabéis qué sería terrorífico de verdad?\n㈡\n¡BUUUU!\n¡Je, je!, ¿os he asustado?\n@c0@"
  fr: "@aInnocent@bC'est sûr qu'on tourne la tête quand on voit des objets qui font peur. En fait, vous savez ce qui ficherait vraiment la trouilleⓡ\n㈡\nUne tête qui tournerait toute seuleⓠ\n@c0@"
  it: "@aSimon@bMolte persone sono affascinate da ciò che mette paura...\nPerò non mi pare che sia il caso di questa signora!\n@c0@"
  ja: "@a@bピピン「恐ろしい名産品は　いろいろな\n\t意味で　注目されやすいみたいです。\n@c0@"
179:
  de: "@aBianca@bTja, vermutlich fühlt sich zu den unheimlichen Sachen eine ganz bestimmte Sorte Leute hingezogen.\n@c0@"
  en: "@aBianca@bI s'pose havin' scary exhibits on display does attract a certain type of customer.\n@c0@"
  es: "@aBianca@bSupongo que exhibir piezas terroríficas atrae a cierto tipo de visitantes, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'imagine qu'en exposant des objets effrayants,\r\non attire un certain genre de visiteurs.\n@c0@"
  it: "@aBianca@bIn effetti, i souvenir che abbiamo in esposizione attirano visitatori di ogni genere, inclusa qualche ⓕmela marciaⓖ...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　こわい名産品だと\n\t見に来る人も　限られちゃうみたい。\n@c0@"
180:
  de: "@aNera@bHast du den Eindruck, dass die unheimlichen Stücke die falschen Leute anziehen?\n@c0@"
  en: "@aNera@bDo you get the impression the scary displays are attracting the wrong sort of people?\n@c0@"
  es: "@aNera@b¿Crees que poner cosinas terroríficas, veramente atrae al tipo equivocado de gente?\n@c0@"
  fr: "@aNera@bTu crois vraiment qu'exposer des objets effrayants attire des visiteurs peu recommandablesⓡ\n@c0@"
  it: "@aNera@bAnch'io penso che dovremmo tenere gli occhi aperti.\nGli oggetti spaventosi potrebbero attirare qualche malintenzionato.\n@c0@"
  ja: "@a@bフローラ「こわい名産品が　引きつけて\n\tいるような……　そんな気にも\n\tなってしまいますね。\n@c0@"
181:
  de: "@a%0%a001240@bNur keine Bange! Wenn's Probleme gibt, dann werden wir beide schon damit fertig, was, Papa?\n@c0@"
  en: "@a%0%a001240@bDon't worry! If there's any trouble, you and me will sort it out, right, Dad?\n@c0@"
  es: "@a%0%a001240@b¡No te preocupes! Si pasa algo, nosotros lo solucionaremos, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001240@bNe t'inquiète pasⓠ S'il y a le moindre pépin, toi et moi, on le réglera, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bNon c'è pericolo! Se qualche visitatore si facesse venire delle strane idee, ci penseremmo noi a togliergliele dalla testa. Non è vero, papà?\n@c0@"
  ja: "@a@b%a001240「大丈夫だよ。　何かあっても\n\tお父さんと　ボクがいるからね！\n@c0@"
182:
  de: "@a%0%a001250@bSicher ist das nichts, worum wir uns Sorgen machen müssen, aber... manchmal sehe ich Besucher, deren Blicke mir einen richtigen Schreck einjagen.\n@c0@"
  en: "@a%0%a001250@bI'm sure it's nothing to worry about, but...sometimes I see visitors with really scary eyes.\n@c0@"
  es: "@a%0%a001250@bSé que no hay por qué preocuparse, pero, en ocasiones veo... visitantes con miradas muy raras.\n@c0@"
  fr: "@a%0%a001250@bIl n'y a sûrement pas de raison de s'inquiéter,\nmais... je croise parfois des visiteurs avec un\nregard qui fait très peur.\n@c0@"
  it: "@a%0%a001250@bForse mi preoccupo per nulla, ma a volte mi sembra che qualcuno osservi gli oggetti in esposizione in un modo che non mi piace affatto...\n@c0@"
  ja: "@a@b%a001250「大丈夫だと思うけど\n\tときどき　お客さんの中で\n\t目のこわい人がいるの。\n@c0@"
183:
  de: "@aSancho@bAber das hier, das ist doch ein Museum, nisst wahr?\n@c0@"
  en: "@aSancho@bBut thees place, eet ees a museum.\n@c0@"
  es: "@aSancho@bPero este lugar es un museo.\n@c0@"
  fr: "@aSancho@bMais cet endroit, c'est oun m-musée.\n@c0@"
  it: "@aSancho@b¿Tipos loscos en un museo?\n@c0@"
  ja: "@a@bサンチョ「あやしい人が　いるとはいえ\n\tここは博物館。\n@c0@"
184:
  de: "@aSancho@bNiemand macht Ärger in einem Museum. Hier ist es viel zu ruhig dafür, no?\n@c0@"
  en: "@aSancho@bNo one ees gonna make trouble een the museum. Ees too quiet, sí?\n@c0@"
  es: "@aSancho@bNadie causaría problemas en un museo. Es demasiado tranquilo.\n@c0@"
  fr: "@aSancho@bPersonne ne va c-c-causer d'ennuis dans oun musée, noⓡ C'est oun endroit trop t-t-tranquille.\n@c0@"
  it: "@aSancho@bAh, no me pare proprio.\n¡D'altra partes, después que ho visto Geremia, toda la gente me sembra normal!\n@c0@"
  ja: "@a@bサンチョ「さわぎを　おこそうなどと\n\t考える人は　いないと思いますが……。\n@c0@"
185:
  de: "@aOtto@bNet verzag'n, Otto frag'n! Wer hier für Ärger sorgt, mit dem mach' ich kurzen Prozess, Ihr werdet schon seh'n.\n@c0@"
  en: "@aTuppence@bNever fear, Tuppence is here! I'll make short work of any troublemakers, you'll see.\n@c0@"
  es: "@aAlazar@bNo temáis, ¡Alazar está aquí! Acabaré con cualquier persona que cause problemas, ya veréis.\n@c0@"
  fr: "@aInnocent@bPas d'inquiétude, Innocent est làⓠ J'aurai vite fait de régler leur compte aux fauteurs de troubles, vous verrez.\n@c0@"
  it: "@aSimon@bNiente paura! Simon è qui!\nChiunque proverà a piantare grane al Museo del Souvenir dovrà vedersela con me!\n@c0@"
  ja: "@a@bピピン「何かあっても　ボクもいます。\n\t大丈夫ですよ！\n@c0@"
