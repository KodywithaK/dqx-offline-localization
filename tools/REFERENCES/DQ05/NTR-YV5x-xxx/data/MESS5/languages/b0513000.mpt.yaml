  it: "@aBianca@bPotremmo anche prendere in considerazione l'idea di farlo, se ce lo chiedesse gentilmente...\n@c0@"
  ja: "@a@bビアンカ「気をつかってくれなくても\n\tいいのに。　私たちも\n\t楽しんでやっているんだしね。\n@c0@"
489:
  de: "@aNera@bDu schaffst es sicher, dass es hier fantastisch aussieht, egal, wie du die Stücke arrangierst.\nDu hast einfach ein Händchen dafür.\n@c0@"
  en: "@aNera@bI'm sure the place will look amazing no matter how you arrange the exhibits. You're so good at it.\n@c0@"
  es: "@aNera@bEstoy sicura de que este lugar tendrá un aspecto magnífico con independencia de cómo coloques las cosas. ¡Se te da tan bene!\n@c0@"
  fr: "@aNera@bJe suis sûre que cet endroit sera formidable, quelle que soit la façon dont tu disposeras les pièces.\r\nTu es tellement doué pour ça.\n@c0@"
  it: "@aNera@bPerché cambiare gli oggetti in esposizione se il Museo va già bene? Beh, comunque potremmo apportare qualche modifica, se ci tiene tanto...\n@c0@"
  ja: "@a@bフローラ「あなたなら　どんな\n\tならべ方をしても　きっと\n\tステキな博物館になるでしょうね。\n@c0@"
490:
  de: "@a%0%a001240@bToll! Ist das dein Gehalt, Papa? Weil du doch der Kurator bist, meine ich.\n@c0@"
  en: "@a%0%a001240@bCool! Is that your salary, Dad?\nBecause you're the curator, I mean.\n@c0@"
  es: "@a%0%a001240@b¡Genial! ¿Ese es tu salario, papi?\nComo eres el gestor, digo.\n@c0@"
  fr: "@a%0%a001240@bSuperⓠ C'est ton salaire, papaⓡ En tant que conservateur, je veux dire.\n@c0@"
  it: "@a%0%a001240@bIo non cambierei nemmeno una virgola...\nMa il direttore del Museo sei tu, papà: tocca a te decidere il da farsi.\n@c0@"
  ja: "@a@b%a001240「えへへ。\n\tお父さん　館長だもんね！\n\tこの１０００ゴールドは　お給料？\n@c0@"
491:
  de: "@a%0%a001250@bVielleicht sollten wir versuchen, ein paar dieser Stücke umzustellen. Das Führen eines Firlefanzeums ist ganz schön abwechslungsreich, nicht?\n@c0@"
  en: "@a%0%a001250@bMaybe we should try changing some of the exhibits around. There's quite a lot to running a knick-knackatory, isn't there?\n@c0@"
  es: "@a%0%a001250@bQuizás deberíamos probar a cambiar las piezas de sitio. Lo de llevar un musenino, no es cosa fácil, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bPeut-être qu'on devrait essayer de changer un ou deux objets de place. Ça n'est pas rien de diriger une Galericabrac, heinⓡ\n@c0@"
  it: "@a%0%a001250@bForse potremmo cambiare qualcuno degli oggetti in esposizione. Chissà che non si riesca ad attirare ancor più visitatori...\n@c0@"
  ja: "@a@b%a001250「これからは　いろいろ考えて\n\t展示したほうが　いいのかな？\n\tやりがいがあるね　博物館って。\n@c0@"
492:
  de: "@aSancho@bJetzt kommen die essten Koryphäen, die Schnickschnack-Experten, um siss deine Sammlung anzusehen, Chico.\n@c0@"
  en: "@aSancho@bNow the aficionados, the experts of the\r\nknick-knacks, they gonna come to esee\r\nyour collection, friend.\n@c0@"
  es: "@aSancho@bAhorita sí que vendrán los aficionados a las cosinas para ver tu colección, chamaco.\n@c0@"
  fr: "@aSancho@bMaintenant, les aficionados, tous les experts en objets de c-c-collection, vont venir admirer ton\r\nm-musée, chico.\n@c0@"
  it: "@aSancho@bAhora al Museo del Souvenir verranno muchos criticos por valutare los oggettos que abbiamo raccolto, chico...\n@c0@"
  ja: "@a@bサンチョ「これからは　目のこえた\n\tお客さんも　%a000090王の集めた\n\t名産品を見に来られるのでしょうね。\n@c0@"
493:
  de: "@aOtto@bTausend Goldmünzen? Ist das alles?! Das ist ein Sklaventreiber, wenn Ihr mich fragt, %a000090!\n@c0@"
  en: "@aTuppence@bA thousand gold coins? That's it!?\nHe's a slave-driver if you ask me, %a000090!\n\n@c0@"
  es: "@aAlazar@b¿Mil monedas de oro? ¿Nada más?\nEste tipo es un negrero, %a000090.\n@c0@"
  fr: "@aInnocent@b1000 pièces d'orⓡ C'est toutⓡⓐ\nC'est de l'esclavage, si vous voulez mon avis, %a000090ⓠ\n@c0@"
  it: "@aSimon@bMa sì, Maestà!\nDiamo una bella rimescolata agli oggetti esposti e vediamo cosa succede!\n@c0@"
  ja: "@a@bピピン「分けまえが　１０００ゴールド！？\n\tずいぶん　安く　つかわれてますね\n\t%a000090王って……。\n@c0@"
494:
  de: "@aBianca@bTja, das bedeutet wohl, dass es ihm hier wirklich gefällt.\n@c0@"
  en: "@aBianca@bI s'pose we should just take it that he really likes\r\nthe place.\n@c0@"
  es: "@aBianca@bSupongo que tendremos que tomárnoslo como un cumplido, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn devrait plutôt se dire simplement qu'il aime vraiment beaucoup cet endroit.\n@c0@"
  it: "@aBianca@bPuò darsi che sia talmente affascinato dagli oggetti esposti da non essersi reso conto del tempo che ha trascorso qui dentro...\n@c0@"
  ja: "@a@bビアンカ「よっぽど　ここの博物館を\n\t気に入ってくれたって\n\tそう　いいふうに　考えましょうか。\n@c0@"
495:
  de: "@aNera@bMeinst du, er will sich ansehen, wie das Museum geführt wird? Woher will er denn sein Essen bekommen? Und was ist mit seiner Dusche am Morgen?\n@c0@"
