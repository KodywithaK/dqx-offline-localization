  it: "@a%0%a001240@bSentilo come russa!\n@c0@"
  ja: "@a@b%a001240「すごい　いびきだね。\n\t部屋中にひびいてるよ。\n@c0@"
511:
  de: "@a%0%a001250@bHat er denn keine Angst, hier zu schlafen, so ganz allein?\n@c0@"
