  es: "@a%0%a001240@b¿Otra cosa? ¿Pero el qué? Hay demasiadas cosas entre las que elegir.\n@c0@"
  fr: "@a%0%a001240@bQuelque chose d'autreⓡ D'accord, mais quoiⓡ\nIl y a tellement de choix.\n@c0@"
  it: "@a%0%a001240@bD'accordo, ma quale altro oggetto potremmo esporre?\nCe ne sono tantissimi tra cui scegliere...\n@c0@"
  ja: "@a@b%a001240「かざってみたい名産品が\n\tいっぱいあると　こまっちゃうね。\n@c0@"
220:
  de: "@a%0%a001250@bMir ist alles recht, was du hier ausstellen willst, Papa.\n@c0@"
  en: "@a%0%a001250@bI agree with whatever you choose to put on\ndisplay, Dad.\n@c0@"
  es: "@a%0%a001250@bPongas lo que pongas en la exhibición, yo te apoyaré, papi.\n@c0@"
  fr: "@a%0%a001250@bMoi, je serai d'accord avec tout ce que tu choisiras d'exposer, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, qualunque oggetto vorrai esporre andrà benissimo!\nMi fido del tuo gusto!\n@c0@"
  ja: "@a@b%a001250「お父さんが　かざりたいって\n\t思う　名産品を置くのが\n\tいちばん　いいと思うの。\n@c0@"
221:
  de: "@aSancho@bWeißt du, wenn du nur die Ausstellungsstücke in Betracht ziehst, die für diesen Raum prässtig genug sind, dann kannst du die Auswahl etwas eingrenzen.\n@c0@"
  en: "@aSancho@bYou know, when you theenk about only the exhibits that are grand enough for thees room, you can make the choices esmaller.\n@c0@"
  es: "@aSancho@bCuando piensas en qué cosinas son lo suficientemente chidas para esta sala, pues tampoco hay tantísimas opciones.\n@c0@"
  fr: "@aSancho@bTu sais, si tu r-réfléchis aux objets qui ont assez de valeur pour m-m-mériter oune place ici, ça\r\nr-réduit déjà les possibilités.\n@c0@"
  it: "@aSancho@bForse dovremmo pensar a qualos souvenir sono tantos maestosos da meritarse de esser espostos en esta sala...\n@c0@"
  ja: "@a@bサンチョ「部屋に負けないほどの\n\t名産品といいますと\n\tけっこう数が　しぼられますけどね。\n@c0@"
222:
  de: "@aOtto@bEtwas anderes? Was würde der Alte denn wohl gern hier sehen?\n@c0@"
  en: "@aTuppence@bSomething else? I wonder what on earth the old man's hoping we'll put on display here.\n@c0@"
  es: "@aAlazar@b¿Otra cosa? Me pregunto qué demonios querrá el viejales que pongamos en la sala.\n@c0@"
  fr: "@aInnocent@bQuelque chose d'autreⓡ Je me demande bien ce que ce vieux bonhomme espère qu'on placera ici.\n@c0@"
  it: "@aSimon@bUn altro oggetto?\nChissà a quale souvenir sta pensando quell'uomo...\n@c0@"
  ja: "@a@bピピン「似合いの品……？\n\tあのおじいさんは　なにを\n\tかざって　ほしいんでしょうか？\n@c0@"
223:
  de: "@aBianca@bWas ist denn mit dem los? Ist er etwa bloß hier, um uns zu ärgern?\n@c0@"
  en: "@aBianca@bWhat's his problem? Has he just come here to\r\nannoy us?\n@c0@"
  es: "@aBianca@b¿Pero qué le pasa? ¿Es que viene a molestar?\n@c0@"
  fr: "@aBianca@bC'est quoi, son problèmeⓡ Il est juste venu ici pour nous embêter ou quoiⓡ\n@c0@"
  it: "@aBianca@bNon ho capito bene cosa voglia da noi quel tizio...\nHa intenzione di aiutarci?\nO vuole solo farci perdere tempo?\n@c0@"
  ja: "@a@bビアンカ「何　あの人？\n\tイヤミを言うために　ここに来たわけ？\n@c0@"
224:
  de: "@aNera@bDas muss der Mann sein, von dem man uns erzählt hat.\n@c0@"
  en: "@aNera@bThis must be the man we were told about.\n@c0@"
  es: "@aNera@bEste debe de ser el uomo sobre el que nos advirtieron.\n@c0@"
  fr: "@aNera@bÇa doit être l'homme dont on nous a parlé.\n@c0@"
  it: "@aNera@bCredo che qualcuno ci abbia già parlato di questo tipo, ma non riesco a ricordare chi...\n@c0@"
  ja: "@a@bフローラ「あの方が　おじいさんの\n\t言ってらした人みたいですね。\n@c0@"
225:
  de: "@a%0%a001240@bDer ist ja komisch, was? Ich kann mich nicht daran erinnern, dass uns schon jemals einer wie der über den Weg gelaufen wäre.\n@c0@"
  en: "@a%0%a001240@bHe's a bit weird, isn't he? In all the places we've visited up to now, I don't remember meeting anyone quite like him before.\n@c0@"
  es: "@a%0%a001240@bEs un poco rarito, ¿verdad? En ninguno de los sitios que hemos visitado recuerdo haberme encontrado a nadie igual.\n@c0@"
  fr: "@a%0%a001240@bIl est un peu bizarre, nonⓡ Je ne me rappelle pas avoir croisé une seule personne comme lui dans tous les lieux où on est allés jusqu'à maintenant.\n@c0@"
  it: "@a%0%a001240@bChe tipo strano, eh?\nPerò è simpatico!\n@c0@"
  ja: "@a@b%a001240「なんだか　変な人だね。\n\t今まで　旅した町には\n\tあんな人　いなかったな……。\n@c0@"
226:
  de: "@a%0%a001250@bLeute wie ihn kann ich nicht ausstehen. Kannst du bitte mit ihm reden? Ich würde mich lieber von ihm fernhalten.\n@c0@"
  en: "@a%0%a001250@bI don't like people like him. Will you talk to him, please, so that I don't have to?\n@c0@"
  es: "@a%0%a001250@bNo me gusta la gente como él. ¿Podrías hablar tú con él para evitarme el trago?\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas les gens comme ça. Tu ne veux pas\nle remettre à sa place, histoire que je ne le fasse\npas moi-mêmeⓡ\n@c0@"
  it: "@a%0%a001250@bNon mi piace quell'uomo.\nMi è proprio antipatico, e non ci voglio parlare!\n@c0@"
  ja: "@a@b%a001250「わたし　ああいう人苦手だから\n\tお話しは　お父さんがしてください。\n@c0@"
227:
  de: "@aSancho@bDieser Señor, er redet nisst sehr nett, no? Aber wenn er uns etwas über unsere Ausstellungsstücke erzählt, dann ist er vielleisst nisst so schlimm.\n@c0@"
  en: "@aSancho@bThees señor, he no espeak eso nice, eh?\nBut eef he tells us about the exhibits, maybe ees no eso bad.\n@c0@"
  es: "@aSancho@bEste señor no es demasiado amable.\r\nPero igual si nos habla de las cosinas, pues tampoco es tan malo.\n@c0@"
  fr: "@aSancho@bCe s-señor, il n'est pas g-gentil, noⓡ Mais s'il nous parle des objets, ce n'est peut-être pas si m-m-mal.\n@c0@"
  it: "@aSancho@bQuel señor me sembra un pocos presuntuosos...\n¿Chico, piensi que possa veramentes darce qualche información su los souvenir?\n@c0@"
  ja: "@a@bサンチョ「言い方は　きついですけど\n\tまあ　価値を教えてくれると\n\tおっしゃってますし……。\n@c0@"
228:
  de: "@aOtto@bDer scheint ja sehr von sich überzeugt, wie?\n@c0@"
  en: "@aTuppence@bThis chap's got a bit of a chip on his shoulder,\r\nhasn't he?\n@c0@"
  es: "@aAlazar@bEste tipo se da unos aires que para qué...\n@c0@"
  fr: "@aInnocent@bIl cherche des noises ou quoi, ce typeⓡ\n@c0@"
  it: "@aSimon@bAccidenti, che modestia!\n@c0@"
  ja: "@a@bピピン「なんでしょう　あの　上から\n\t見下すような言い方。\n@c0@"
229:
  de: "@aOtto@bWas glaubt er denn, mit wem er redet? Weiß er net, dass er mit König %a000090 spricht?\n@c0@"
  en: "@aTuppence@bWho does he think he's talking to, eh?\nDoesn't he know he's addressing King %a000090?\n@c0@"
  es: "@aAlazar@b¿Con quién se cree que está hablando?\n¿Es que no sabe que se dirige a Su Majestad, el rey %a000090?\n@c0@"
  fr: "@aInnocent@bIl se croit oùⓡ Il ne sait pas que c'est au roi %a000090 qu'il s'adresseⓡ\n@c0@"
  it: "@aSimon@bQuel tizio non ha idea di chi siamo, eh?!\nDovremmo dirgli di moderare il linguaggio, quando parla con il gruppo del mitico re %a000090!\n@c0@"
  ja: "@a@bピピン「いったい　%a000090王を\n\tどなただと思っているんでしょう。\n@c0@"
230:
  de: "@aBianca@bHör nicht auf ihn, %a000090. Mach einfach alles so, wie es dir gefällt.\n@c0@"
  en: "@aBianca@bDon't listen to him, %a000090.\nJust do things how you want.\n@c0@"
  es: "@aBianca@bNo le hagas ni caso, %a000090.\nTú haz las cosas a tu manera, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bNe l'écoute pas, %a000090. Fais simplement\nles choses comme tu en as envie.\n@c0@"
  it: "@aBianca@bNon starlo a sentire, %a000090.\nFai come ti pare, che vai bene!\n@c0@"
  ja: "@a@bビアンカ「あの人の　言うことは\n\t気にしちゃダメよ。　%a000090が\n\t思ったとおりにすれば　いいんだから。\n@c0@"
231:
  de: "@aNera@bSo beschäftigt wirkt er auf mich gar nicht. Was meinst du, Liebling?\n@c0@"
  en: "@aNera@bHe doesn't look all that busy to me.\nWhat do you think, darling?\n@c0@"
  es: "@aNera@bA mí no me parece qué esté tan ocupado, ¿tú qué crees, caro mio?\n@c0@"
  fr: "@aNera@bIl ne m'a pas l'air si débordé que ça.\nQu'en penses-tu, mon chériⓡ\n@c0@"
  it: "@aNera@bAmmettilo, tesoro: un po' di varietà in più non stonerebbe affatto.\n@c0@"
  ja: "@a@bフローラ「とても　忙しそうには\n\t見えないのですが……。\n\t%a000090さんは　どうですか？\n@c0@"
232:
  de: "@a%0%a001240@bWir haben gar nicht eine Menge Zeit! Wir sind immer schwer damit beschäftigt, Monster zu bekämpfen und so! Stimmt's nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bWe have not got a lot of time on our hands!\nWe're always busy fighting monsters and stuff!\nRight, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Nosotros tampoco tenemos tanto tiempo libre!\nSiempre estamos ocupados enfrentándonos a monstruos y todo eso.\n㈡\n¿A que sí, papi?\n@c0@"
  fr: "@a%0%a001240@bOn n'a pas beaucoup de temps libreⓠ On est tout le temps en train de combattre des monstres, et tout çaⓠ Hein que c'est vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bIo sono un bambino, ma non sapevo che la varietà fosse l'essenza della vita...\n@c0@"
  ja: "@a@b%a001240「ボクたちだって\n\tヒマじゃないよ！　ねっ　お父さん！\n@c0@"
233:
  de: "@a%0%a001250@bLeute wie ihn kann ich nicht ausstehen. Kannst du bitte mit ihm reden? Ich würde mich lieber von ihm fernhalten.\n@c0@"
  en: "@a%0%a001250@bI don't like people like him. Will you talk to him, please, so that I don't have to?\n@c0@"
  es: "@a%0%a001250@bNo me gusta la gente como él. ¿Podrías hablar tú con él para evitarme el trago?\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas les gens comme ça. Tu ne veux pas\nle remettre à sa place, histoire que je ne le fasse\npas moi-mêmeⓡ\n@c0@"
  it: "@a%0%a001250@bNon mi piace quell'uomo.\nMi è proprio antipatico, e non ci voglio parlare!\n@c0@"
  ja: "@a@b%a001250「わたし　ああいう人苦手だから\n\tお話しは　お父さんがしてください。\n@c0@"
234:
  de: "@aSancho@bEs ist nisst Zeit, die man dafür braucht. Es ist Zielstrebigkeit. Man muss gierig sein, so wie ein Barrakuda, auf ein ganz bestimmtes Stück.\n@c0@"
  en: "@aSancho@bEes no the time you need for thees. Ees the determination. You must be hungry like the barracuda for just thees one exhibit.\n@c0@"
  es: "@aSancho@bPara esto no es tiempo lo que hace falta. Lo que hace falta es determinación, nomás. Hay que estar retehambriento de cosinas.\n@c0@"
  fr: "@aSancho@bÇa n'est pas du t-t-temps qu'il faut. C'est de la\r\nd-d-détermination. Il faut en v-v-vouloir, rien que pour ce seul objet.\n@c0@"
  it: "@aSancho@b¡Sì, chico: quell'hombre es muy presuntuosos y antipaticos!\n@c0@"
  ja: "@a@bサンチョ「全て同じ名産品を\n\t展示するのは　ヒマではなく\n\tこだわりのある者のみ　できるんです。\n@c0@"
235:
  de: "@aOtto@bWenn Ihr mich fragt, dann hat der eine Menge mehr Zeit als wir.\n@c0@"
  en: "@aTuppence@bIf you ask me, he looks like he's got a lot more time on his hands than we do.\n@c0@"
  es: "@aAlazar@bPues a mí me parece que él tiene bastante más tiempo libre que nosotros.\n@c0@"
  fr: "@aInnocent@bBen si on me demandait, je dirais qu'il a l'air d'avoir bien plus de temps libre que nous.\n@c0@"
  it: "@aSimon@bMaestà, non perda tempo ad ascoltare le sciocche parole di quel tipo! Però concordo con lui: aggiungere degli oggetti diversi non sarebbe una cattiva idea...\n@c0@"
  ja: "@a@bピピン「ボクには　あの人のほうが\n\tヒマそうに見えますが。\n@c0@"
236:
  de: "@aBianca@bHör nicht auf ihn, %a000090. Mach einfach alles so, wie es dir gefällt.\n@c0@"
  en: "@aBianca@bDon't listen to him, %a000090.\nJust do things how you want.\n@c0@"
  es: "@aBianca@bNo le hagas ni caso, %a000090.\nTú haz las cosas a tu manera, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bNe l'écoute pas, %a000090. Fais simplement\nles choses comme tu en as envie.\n@c0@"
  it: "@a@bNon starlo a sentire, %a000090.\nFai come ti pare, che vai bene!\n@c0@"
  ja: "@a@bビアンカ「あの人の　言うことは\n\t気にしちゃダメよ。　%a000090が\n\t思ったとおりにすれば　いいんだから。\n@c0@"
237:
  de: "@aNera@bDas kann er doch nicht sagen! Etwas zu essen ist niemals wertlos! Papa wäre entsetzt, wenn er das hören würde.\n@c0@"
  en: "@aNera@bHe can't say that! Cuisine is never worthless.\nPapa would have a fit!\n@c0@"
  es: "@aNera@b¡Ma come puede decir eso! El mangiare es molto importante.\r\nAl mio papino le daría un ataque si lo oyera.\n@c0@"
  fr: "@aNera@bIl n'a pas le droit de dire çaⓠ L'art culinaire,\nça n'est pas sans valeur. Si papa entendait ça,\nil ferait une attaqueⓠ\n@c0@"
  it: "@aNera@bNon so se prendere le sue parole come una critica o come un incoraggiamento...\n@c0@"
  ja: "@a@bフローラ「価値が　ないなんて\n\t食べ物にたいして　そんなこと言っては\n\tいけませんわ。\n@c0@"
238:
  de: "@a%0%a001240@bIst mir doch egal, was er sagt. Mir gefallen die Schokomünzen, und basta!\n@c0@"
  en: "@a%0%a001240@bI don't care what he says. I like chocolate medalliyums, and that's that!\n@c0@"
  es: "@a%0%a001240@bMe da igual lo que diga. A mí me encantan los medallones de chocolate, y ya está.\n@c0@"
  fr: "@a%0%a001240@bJe m'en moque, de ce qu'il dit. Moi, j'aime les\nmédailles en chocolat, et puis c'est toutⓠ\n@c0@"
  it: "@a%0%a001240@bA me le medaglie di cioccolato piacciono tantissimo!\nSecondo me quel tipo ne parla male solo perché è a dieta e non può mangiarle...\n@c0@"
  ja: "@a@b%a001240「ボクは\n\tメダル型チョコ好きだから\n\tなんて言われても　へっちゃらだね。\n@c0@"
239:
  de: "@a%0%a001250@bBestimmt hat er es nur darauf angelegt, dass wir ihm all unsere Schokomünzen abgeben. Nur darum sagt er das!\n@c0@"
  en: "@a%0%a001250@bI bet he secretly wants us to give all our medalliyums to him. That's why he's saying that.\n@c0@"
  es: "@a%0%a001250@bSeguro que este lo que quiere es que le demos todos nuestros medallones de chocolate. Por eso dice esas cosas.\n@c0@"
  fr: "@a%0%a001250@bJe parie qu'en secret, il rêve qu'on lui donne toutes nos médailles en chocolat. C'est pour ça qu'il dit ça.\n@c0@"
  it: "@a%0%a001250@bScommetto che dice così solo perché vuole convincerci che le medaglie non valgono niente, così gliele regaliamo tutte!\n@c0@"
  ja: "@a@b%a001250「本当はおじさんも\n\tメダル型チョコ　ほしかったりして。\n@c0@"
240:
  de: "@aSancho@bZumindest findet dieser Señor auch ein paar Worte der Ermutigung für uns, nisst?\n@c0@"
  en: "@aSancho@bAt least thees señor, he geeves us esome esmall words of encouragement, no?\n@c0@"
  es: "@aSancho@bPor lo menos este señor pues nos anima un poco.\n@c0@"
  fr: "@aSancho@bCe señor, il nous donne au moins quelques m-m-mots d'encouragement, noⓡ\n@c0@"
  it: "@aSancho@bSi no me esbaglio, ho colto nellas suas palabras un pizzicos de incoraggiamentos...\n@c0@"
  ja: "@a@bサンチョ「展示した　努力だけは\n\tわかって　くださったようですな。\n@c0@"
241:
  de: "@aOtto@bWertlos für ihn vielleicht. Schokoliebhaber sehen das bestimmt ganz anders! Die würden ihm was erzählen!\n@c0@"
  en: "@aTuppence@bWorthless to him, maybe, but I bet chocolate lovers would have something to say about that.\r\nThey'd be furious!\n@c0@"
  es: "@aAlazar@bPues no tendrán valor para él, pero seguro que los amantes del chocolate no están nada de acuerdo.\r\n¡Les sentaría como un cuerno!\n@c0@"
  fr: "@aInnocent@bElles ne valent peut-être pas grand-chose pour lui, mais les amateurs de chocolat auraient sans doute leur mot à dire là-dessus. Ils seraient furieuxⓠ\n@c0@"
  it: "@aSimon@bMagari per lui non valgono niente, ma per i buongustai di tutto il mondo le medaglie di cioccolato sono preziose... e deliziose!\n@c0@"
  ja: "@a@bピピン「価値がないなんて　言ったら\n\tチョコ好きな人に　怒られますよ。\n@c0@"
242:
  de: "@aBianca@bDas klang doch jetzt gar nicht so übel. Im Gegenteil, ich würde sagen, ihm gefällt es sogar.\n@c0@"
  en: "@aBianca@bThat dun't sound all bad. In fact, I'd say he quite likes it.\n@c0@"
  es: "@aBianca@bEso no suena nada mal Yo diría que hasta le gusta, ¿sabes?\n@c0@"
  fr: "@aBianca@bSa critique n'est pas si méchante que ça.\nJe dirais même que l'exposition a l'air\nd'être plutôt à son goût, nonⓡ\n@c0@"
  it: "@aBianca@bBeh, tutto sommato ha ragione: esporre lo stesso oggetto su tutti i piedistalli potrebbe non essere la migliore delle idee...\n@c0@"
  ja: "@a@bビアンカ「まんざらでも　ないみたいね。\n\t本当は　けっこう\n\tうれしいんじゃないの？\n@c0@"
243:
  de: "@aNera@bEr scheint ja ein sehr wachsames Auge auf unsere Ausstellung zu haben, nicht? Er weiß auch genau, was sich in den anderen Etagen befindet.\n@c0@"
  en: "@aNera@bHe certainly keeps a close eye on what's on display, doesn't he? He knows exactly what's on the other floors too.\n@c0@"
  es: "@aNera@bDesde luego está atento a lo que exhibimos, ¿eh? Y veramente sabe qué hay en todas las plantas.\n@c0@"
  fr: "@aNera@bIl surveille de près les expositions, heinⓡ\nIl sait exactement ce qui est exposé dans\nles autres salles.\n@c0@"
  it: "@aNera@bCerto che quel tipo sa un mucchio di cose sui souvenir esposti...\n@c0@"
  ja: "@a@bフローラ「あの方　ちゃんと\n\tほかの階のことも\n\tわかっていらっしゃるようですわ。\n@c0@"
244:
  de: "@aNera@bEr mag Souvenirs wirklich.\n@c0@"
  en: "@aNera@bHe really does love his souvenirs.\n@c0@"
  es: "@aNera@bLe encantan las cosinas.\n@c0@"
  fr: "@aNera@bIl aime vraiment les objets de collection.\n@c0@"
  it: "@aNera@bChe sia un critico inviato da qualche rivista di settore?\n@c0@"
  ja: "@a@bフローラ「やはり　名産品が\n\tお好きなんですわね。\n@c0@"
245:
  de: "@a%0%a001240@bBuddelschiffe sind toll! Die werden mir nie über.\n@c0@"
  en: "@a%0%a001240@bShips in bottles are amazing!\nI never get bored of looking at them.\n@c0@"
  es: "@a%0%a001240@bLos barcos en botella son geniales.\nNunca me canso de mirarlos.\n@c0@"
  fr: "@a%0%a001240@bLes bateaux en bouteille, c'est incroyableⓠ\nJe ne me lasse jamais de les regarder.\n@c0@"
  it: "@a%0%a001240@bLe navi in bottiglia sono meravigliose!\nNon mi stancherei mai di ammirarle, e sono certo che anche gli altri visitatori la pensano come me!\n@c0@"
  ja: "@a@b%a001240「ボトルシップって　かっこいいよね！\n\tずっと見てても　あきないよ。\n@c0@"
246:
  de: "@a%0%a001250@bÜberall stehen Buddelschiffe herum. Wie viele hast du denn in der Ausstellung, Papa?\n@c0@"
  en: "@a%0%a001250@bThere are ships in bottles everywhere.\nHow many did you put on display, Dad?\n@c0@"
  es: "@a%0%a001250@bHay barcos en botella por todos sitios.\n¿Cuántos has expuesto?\n@c0@"
  fr: "@a%0%a001250@bC'est vrai qu'il y a des bateaux en bouteille partout. Combien tu en as exposés, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, non è che abbiamo esagerato con le navi in bottiglia?\nIn tutto il Museo non c'è altro in esposizione!\n@c0@"
  ja: "@a@b%a001250「ボトルシップが　いっぱい……。\n\tねえ　お父さん　いくら　つかったの？\n@c0@"
247:
  de: "@aSancho@bJe genauer man siss diese Buddelschiffe ansieht, desto mehr erkennt man, wie viel Arbeit in ihnen steckt.\n@c0@"
  en: "@aSancho@bThe more you look at these esheeps een bottles, the more you esee how much work eet must be to make them.\n@c0@"
  es: "@aSancho@bCuanto más miras esos barquitos en botella, más te das cuenta del trabajo que llevan.\n@c0@"
  fr: "@aSancho@bPlus on observe ces b-b-bateaux en bouteille,\nplus on voit quel t-travail ils doivent demander, noⓡ\n@c0@"
  it: "@aSancho@bMás guardo questas naves en bottiglias, más me rendo conto de todo el lavoro necessario por realizzarlas... ¡Sono davveros maravillosas!\n@c0@"
  ja: "@a@bサンチョ「しかしながら　見れば\n\t見るほど　こまかいところまで\n\tよくできているものです。\n@c0@"
248:
  de: "@aOtto@bWir veralbern hier niemanden! Ihr habt doch sicher Eure Gründe dafür, net wahr, %a000090? Bestimmt steckt ein raffinierter Plan dahinter.\n@c0@"
  en: "@aTuppence@bWe're not making fun of anyone!\nThere's a reason why you've done this, I'll bet, isn't there, %a000090? A cunning plan or something.\n@c0@"
  es: "@aAlazar@b¡No estamos tomando el pelo a nadie!\nSeguro que hay alguna buena razón para todo esto, ¿verdad, %a000090? Un astuto plan o algo.\n@c0@"
  fr: "@aInnocent@bOn ne se moque de personneⓠ Je parie qu'il y a\nune raison à ce choix, n'est-ce pas, %a000090ⓡ\nUn plan très rusé ou quelque chose comme ça.\n@c0@"
  it: "@aSimon@bNon è affatto uno scherzo! C'è un ottimo motivo per cui abbiamo scelto di esporre tante navi in bottiglia!\nSolo che ora non mi viene in mente, ehm...\n@c0@"
  ja: "@a@bピピン「バカになんか　してませんよ。\n\t%a000090王の　なさることですから\n\t考えがあっての　ことですよね？\n@c0@"
249:
  de: "@aBianca@bEs kann gar nichts Besseres geben als unseren Stein. Schließlich kommt er aus deinem Heimatdorf!\n@c0@"
  en: "@aBianca@bNothin' he has could outclass that.\r\nIt's from your hometown, after all.\n@c0@"
  es: "@aBianca@bNada de lo que tenga puede superar eso.\r\nAl fin y al cabo, es de tu pueblo, ¿sabes?\n@c0@"
  fr: "@aBianca@bRien de ce qu'il a ne pourrait surpasser ça.\r\nÇa vient du village où tu as vécu, après tout.\n@c0@"
  it: "@aBianca@bCerto che lui ne ha di migliori!\nNei suoi sogni, però!\nAh ah ah!\n@c0@"
  ja: "@a@bビアンカ「あれは%a000090の　ふるさとの\n\t名産品なのよ。　あの人の持ってる\n\t宝石より　きれいに決まってるわ。\n@c0@"
250:
  de: "@aNera@bWir hatten auch ein paar Edelsteine daheim. Aber nur ganz normale, nichts Besonderes.\n@c0@"
  en: "@aNera@bWe used to have some gemstones at home too.\nJust normal ones, though.\n@c0@"
  es: "@aNera@bEn la mia casa solíamos tener algunas gemas.\r\nPero eran normales.\n@c0@"
  fr: "@aNera@bNous aussi, nous avions des pierres précieuses à la maison. Mais des pierres classiques, rien de plus.\n@c0@"
  it: "@aNera@bAccidenti, ha riconosciuto la gemma!\nChissà, forse è davvero un profondo conoscitore di souvenir...\n@c0@"
  ja: "@a@bフローラ「ふつうの宝石なら　私の家にも\n\tいくつか　ありましたけど……。\n@c0@"
251:
  de: "@a%0%a001240@bEr hat zwar gesagt, es sei ein schöner Stein, aber meinst du, das hat er ernst gemeint?\n@c0@"
  en: "@a%0%a001240@bHe said it was a fine gem, but do you think he\nwas lying?\n@c0@"
  es: "@a%0%a001240@bDice que esta gema es espléndida, pero, ¿estará mintiendo?\n@c0@"
  fr: "@a%0%a001240@bIl a dit que c'était une pierre magnifique, mais tu crois qu'il le pensait vraimentⓡ\n@c0@"
  it: "@a%0%a001240@bSarà davvero un esperto?\nForse ha solo tirato a indovinare...\n@c0@"
  ja: "@a@b%a001240「すばらしいって　言ってたけど\n\t本当に　そう思ってるのかな？\n@c0@"
252:
  de: "@a%0%a001250@bEr kann einfach nicht zugeben, dass jemand ihn aussticht, oder?\n@c0@"
  en: "@a%0%a001250@bHe can't bear to be outdone, can he?\n@c0@"
  es: "@a%0%a001250@bNo pude soportar que lo superen. ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bIl ne supporte pas qu'on fasse mieux que lui, heinⓡ\n@c0@"
  it: "@a%0%a001250@bSe a casa ha delle pietre più belle di questa, dovrebbe farcele vedere, altrimenti potremmo pensare che è solo un gran bugiardo!\n@c0@"
  ja: "@a@b%a001250「負けずぎらいなんだね　あの人。\n@c0@"
253:
  de: "@aSancho@bDieser Señor, hat er etwas Nettes über den Steinach-Saphir gesagt oder hat er etwas Schlesstes gesagt?\n@c0@"
  en: "@aSancho@bThees señor, he ees esaying a nice theeng about the Whealbrook esapphire, or he ees esaying esometheeng bad?\n@c0@"
  es: "@aSancho@bY este señor, ¿está diciendo algo bueno o algo malo sobre el Zafiro de Arroyofrío?\n@c0@"
  fr: "@aSancho@bCe señor, ce qu'il a dit à propos du saphir de Ruycelieu, c'était g-g-gentil ou méchantⓡ\n@c0@"
  it: "@aSancho@bQuell'hombre ha detto que lo zaffiro de Valcava es una pietra muy bella...\n¡El señor sì que se ne intiende!\n@c0@"
  ja: "@a@bサンチョ「サンタローズの名産品を\n\tほめているのか……　それとも\n\tけなしているのか。\n@c0@"
254:
  de: "@aSancho@bWenn er etwas Nettes gesagt hat, finde iss ihn auch nett, aber wenn er etwas Nisst-Nettes gesagt hat, nehme iss ihm das übel!\n@c0@"
  en: "@aSancho@bEef ees one theeng, I hug heem.\nEef ees another, I hammer heem!\n@c0@"
  es: "@aSancho@bSi es lo primero, pues le doy un abrazo.\r\nSi es lo segundo, pues le doy un mazazo.\n@c0@"
  fr: "@aSancho@bSi c'était gentil, je le s-s-serre dans mes bras,\nsi c'était m-m-méchant, je l'assomme, siⓡⓐ\n@c0@"
  it: "@aSancho@b¡Però no pienso affattos que egli possegga gioiellos más preziosos de esto!\n@c0@"
  ja: "@a@bサンチョ「ことによっては\n\tゆるせませんぞ。\n@c0@"
255:
  de: "@aOtto@bSteinach, dort habt Ihr doch mal gewohnt, %a000090, net wahr?\n@c0@"
  en: "@aTuppence@bWhealbrook's where you used to live, isn't it, %a000090?\n@c0@"
  es: "@aAlazar@bVivíais en Arroyofrío, ¿verdad %a000090?\n@c0@"
  fr: "@aInnocent@bRuycelieu... C'est bien là où vous avez vécu, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, lei ha vissuto a Valcava per un periodo, non è così?\n@c0@"
  ja: "@a@bピピン「サンタローズは　たしか\n\t%a000090王が　一時\n\t住んでいらっしゃったんですよね？\n@c0@"
256:
  de: "@aBianca@bSo eine Frechheit!\n@c0@"
  en: "@aBianca@bWhat a blimmin' cheek!\n@c0@"
  es: "@aBianca@b¡Qué desfachatez!\n@c0@"
  fr: "@aBianca@bIl est sacrément gonflé, luiⓠ\n@c0@"
  it: "@aBianca@bGratuito o non gratuito, questo è un oggetto bellissimo! E se quell'essere odioso non lo capisce, è peggio per lui!\n@c0@"
  ja: "@a@bビアンカ「………ムカっ！\n@c0@"
257:
  de: "@aNera@bEs klingt fast, als wäre etwas, was nichts kostet, in seinen Augen nichts wert, egal, wie faszinierend es ist!\n@c0@"
  en: "@aNera@bIt sounds like he doesn't put any value on things unless they cost money, no matter how amazing\r\nthey are.\n@c0@"
  es: "@aNera@bSembra que solo valora las cosas si cuestan dinero, por alucinantes que sean.\n@c0@"
  fr: "@aNera@bApparemment, il n'accorde aucune valeur aux choses si elles ne coûtent pas une grosse somme d'argent. Peu importe qu'elles soient incroyables.\n@c0@"
  it: "@aNera@bPer quell'uomo, la bellezza di un oggetto è direttamente proporzionale al suo prezzo d'acquisto. Che mentalità ristretta...\n@c0@"
  ja: "@a@bフローラ「あの方は　どんなに\n\tすばらしくても　タダで手に入る物には\n\t価値がないと思っていらっしゃるのね。\n@c0@"
258:
  de: "@a%0%a001240@bAber Schlummerkissen sind doch toll! Sie sind so bequem, dass sie sogar Monster einschläfern würden! Der hat ja keine Ahnung!\n@c0@"
  en: "@a%0%a001240@bBut Zizzwizz Pillows are amazing! They're so comfortable, they could send a monster to sleep.\nThat man doesn't know anything!\n@c0@"
  es: "@a%0%a001240@bPero si las almohadas afelpadas son geniales. Son comodísimas y pueden hacer que los monstruos se duerman.\n㈡\nEstá claro que no tiene ni idea.\n@c0@"
  fr: "@a%0%a001240@bLes oreillers de Morphée sont géniauxⓠ Ils sont tellement moelleux qu'ils peuvent même endormir\nun monstre. Il n'y connaît vraiment rien, ce typeⓠ\n@c0@"
  it: "@a%0%a001240@bI cuscini Buonriposo sono talmente comodi che riuscirebbero ad addormentare persino i mostri!\nQuel tizio non capisce niente!\n@c0@"
  ja: "@a@b%a001240「あのマクラって　すごいのに！\n\t魔物だって寝ちゃう気持ちよさなのに！\n\tぜんぜん　わかってないよっ！\n@c0@"
259:
  de: "@a%0%a001250@bWarum ist der Mann überhaupt ins Firlefanzeum gekommen, wenn er Schnickschnack doch offenbar nicht ausstehen kann?\n@c0@"
  en: "@a%0%a001250@bWhy did that man even come to the knick-knackatory when he doesn't seem to like knick-knacks at all?\n@c0@"
  es: "@a%0%a001250@b¿Y para qué viene ese hombre al musenino si no le gustan las cosinas?\n@c0@"
  fr: "@a%0%a001250@bPourquoi il est venu à la Galericabrac s'il n'aime pas le bric-à-brac, d'abordⓡ\n@c0@"
  it: "@a%0%a001250@bMa con tutti i posti che ci sono al mondo, quest'antipatico doveva venire proprio al Museo del Souvenir?!\n@c0@"
  ja: "@a@b%a001250「博物館に来てるのに\n\tあの人　名産品が好きじゃないの？\n@c0@"
260:
  de: "@aSancho@bBei so etwas zählt nisst nur das Geld...\n@c0@"
  en: "@aSancho@bEes no just about the garbanzos...\n@c0@"
  es: "@aSancho@bNo todo es el vil metal...\n@c0@"
  fr: "@aSancho@bTout n'est pas qu'oune question d'argent...\n@c0@"
  it: "@aSancho@b¡No me importa cosa dice quel señor: esto souvenir es fantastico!\n@c0@"
  ja: "@a@bサンチョ「タダとか　お金の問題では\n\tないと思うのですが……。\n@c0@"
261:
  de: "@aOtto@bIch glaub', es g'fallt mir net, wie der alte Geldsack die Welt sieht.\n@c0@"
  en: "@aTuppence@bI don't think I like the way this fat cat thinks.\n@c0@"
  es: "@aAlazar@bA mí este señor me cae gordo.\n@c0@"
  fr: "@aInnocent@bJe n'aime pas la façon de penser de ce gros bonhomme.\n@c0@"
  it: "@aSimon@bSecondo me quel tipo parla per invidia.\nGli piacerebbe possedere i souvenir esposti al Museo ma, siccome non può averli, ne parla male!\n@c0@"
  ja: "@a@bピピン「あのような　お金持ちの考え方は\n\tちょっと　いやですね。\n@c0@"
262:
  de: "@aBianca@bWir sollten wohl tatsächlich etwas mehr darauf achten, dass alles einen guten Eindruck macht. Vielleicht sollten wir die Stücke mal polieren.\n@c0@"
  en: "@aBianca@bI s'pose it is important to keep things in good nick. Maybe we should have a bit of a polish before long.\n@c0@"
  es: "@aBianca@bSupongo que tener las cosinas en perfecto estado de revista es importante. Deberíamos hacer limpieza, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bÇa doit être important de garder les objets en bon état. Peut-être qu'on devrait nettoyer ce service assez rapidement.\n@c0@"
  it: "@aBianca@bÈ importante tenere gli oggetti puliti.\nCredo che dovremmo dar loro una bella lucidata ogni tanto...\n@c0@"
  ja: "@a@bビアンカ「う～ん…　たしかに\n\t展示品の手入れは　大切よね。\n\t今度　みがきましょうか。\n@c0@"
263:
  de: "@aNera@bDa hat er wohl recht, nicht? Wir sollten es aufpolieren, damit es wieder richtig glänzt und funkelt.\n@c0@"
  en: "@aNera@bHe's right, isn't he? We should polish it up so there's\r\na beautiful, gleaming exhibit for him the next time\r\nwe speak.\n@c0@"
  es: "@aNera@bTiene razón, ¿verdad? Deberíamos limpiare un po' para tener una cosina brillante que exponer la próxima volta que hablemos.\n@c0@"
  fr: "@aNera@bIl a raison, nonⓡ Nous devrions le faire briller\npour qu'il trouve un magnifique objet reluisant\nla prochaine fois que nous viendrons lui parler.\n@c0@"
  it: "@aNera@bHa ragione, sai?\nQuando sono puliti, i souvenir sembrano ancora più belli!\n@c0@"
  ja: "@a@bフローラ「今のは　あの方が\n\t正しいですわね。　今度は\n\tみがいたのを見ていただきましょう？\n@c0@"
264:
  de: "@a%0%a001240@bDie Stücke sehen wirklich besser aus, wenn sie sauber sind und glänzen.\n@c0@"
  en: "@a%0%a001240@bThe exhibits do look better when they're all clean\nand shiny.\n@c0@"
  es: "@a%0%a001240@bLas cosinas están más bonitas si están limpias y relucientes.\n@c0@"
  fr: "@a%0%a001240@bC'est vrai que les objets sont plus beaux quand ils sont propres et brillants.\n@c0@"
  it: "@a%0%a001240@bSono d'accordo con quel signore: dovremmo dare una bella pulitina a tutti i souvenir del Museo...\n@c0@"
  ja: "@a@b%a001240「みがいて　ピカピカした\n\t名産品って　きれいだろうね。\n@c0@"
265:
  de: "@a%0%a001250@bWenn man etwas reinigt, dann fühlt man sich auch innerlich gleich viel reiner.\n@c0@"
  en: "@a%0%a001250@bWhen you clean things, it makes you feel cleaner inside too.\n@c0@"
  es: "@a%0%a001250@bLimpiar te hace sentir más limpio.\n@c0@"
  fr: "@a%0%a001250@bQuand on nettoie quelque chose, on se sent aussi plus propre à l'intérieur, après.\n@c0@"
  it: "@a%0%a001250@bCredo che nemmeno agli altri visitatori faccia piacere ammirare souvenir sporchi e impolverati, non trovi?\n@c0@"
  ja: "@a@b%a001250「何でも　きれいにしておくと\n\t気持ちいいよ。\n@c0@"
266:
  de: "@aSancho@bWeißt du, dein Onkel Sancho, er ist gar nisst schlesst in solssen Arbeiten.\n@c0@"
  en: "@aSancho@bYou know, your Uncle Sancho, he ees good at thees kind of work.\n@c0@"
  es: "@aSancho@bPues al tito Sancho se le da padrísimo eso de limpiar.\n@c0@"
  fr: "@aSancho@bTu sais, tonton Sancho est t-t-très doué pour ce genre de travail.\n@c0@"
  it: "@aSancho@bAnche lo zio Sancho pensa que los souvenir sono más bellos quando sono pulitos y splendentes...\n@c0@"
  ja: "@a@bサンチョ「お手入れのことならば\n\t私も　得意ですよ。\n@c0@"
267:
  de: "@aOtto@bDem Typen würd' ich am liebsten gar net mehr zuhör'n. Net mal dann, wenn das, was er sagt, Hand und Fuß hat.\n@c0@"
  en: "@aTuppence@bI don't like listening to anything that chap says now, even if it does make perfect sense!\n@c0@"
  es: "@aAlazar@bNo quiero oír nada de lo que ese tipo tenga que decir, incluso si tiene razón.\n@c0@"
  fr: "@aInnocent@bDe toute façon, je n'ai aucune envie d'écouter ce que dit ce type, même si c'est parfaitement sensé.\n@c0@"
  it: "@aSimon@bQuel tipo sarà anche un dannato presuntuoso, ma riconosco che stavolta ha perfettamente ragione: i souvenir puliti sono molto più belli!\n@c0@"
  ja: "@a@bピピン「あの人に言われると\n\tもっともなことでも　イヤミに\n\t聞こえてしまいます。\n@c0@"
268:
  de: "@aBianca@bAch ja! Das Etepetete-Teeservice! Das erinnert mich an damals, als wir noch klein waren und auf Gespensterjagd gegangen sind.\n@c0@"
  en: "@aBianca@bOh yeah. The toff's tea set! Reminds me of that time we went off ghost-bustin' when we was kids.\n@c0@"
  es: "@aBianca@b¡Ah!, sí. El juego de té repipi. Me recuerda a aquella vez que fuimos a cazar fantasmas cuando éramos críos, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh, oui. Le service à thé de luxeⓠ Ça me rappelle\nla fois où on est partis à la chasse aux fantômes, quand on était enfants.\n@c0@"
  it: "@aBianca@bOh, sì! Il sontuoso servizio da tè!\nEh eh eh! Mi ricorda di quella volta che andammo a caccia di fantasmi...\n@c0@"
  ja: "@a@bビアンカ「そういえば　小さい頃\n\tお化け退治に行ったよね。\n\tなつかしいなあ。\n@c0@"
269:
  de: "@aNera@bEr muss einfach alles, was er hier sieht, mit etwas vergleichen, was er zu Hause hat, nicht?\n@c0@"
  en: "@aNera@bHe just can't help comparing everything here to something he owns at home, can he?\n@c0@"
  es: "@aNera@bNo puede evitar comparar todo a lo que tiene en la sua casa, ¿verdad?\n@c0@"
  fr: "@aNera@bIl ne peut pas s'empêcher de tout comparer à ce qu'il possède chez lui, heinⓡ\n@c0@"
  it: "@aNera@bProprio non riesce a fare a meno di paragonare gli oggetti del Museo con quelli che dice di avere a casa, eh?\n@c0@"
  ja: "@a@bフローラ「けっきょく　何でも\n\tあの方が持っている物と\n\tくらべたいみたいですね。\n@c0@"
270:
  de: "@a%0%a001240@bMir gefällt das Teeservice. Das ist klasse.\n@c0@"
  en: "@a%0%a001240@bI like this tea set. It's really cool!\n@c0@"
  es: "@a%0%a001240@bMe gusta este juego de té. ¡Es genial!\n@c0@"
  fr: "@a%0%a001240@bJ'aime bien ce service à thé. Il est génialⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto servizio da tà è proprio bello.\nMi piace moltissimo.\n@c0@"
  ja: "@a@b%a001240「ボク　このティーセット\n\t好きだな。　すごく　きれいだし！\n@c0@"
271:
  de: "@a%0%a001240@bAber Tee mag ich nicht. Der ist so heiß. Und bitter!\n@c0@"
  en: "@a%0%a001240@bI don't like tea, though. It's really hot. And bitter too.\n@c0@"
  es: "@a%0%a001240@bPero el té no me gusta. Está muy caliente. Y además es amargo.\n@c0@"
  fr: "@a%0%a001240@bMais je n'aime pas trop le thé. C'est très chaud.\nEt amer, aussi.\n@c0@"
  it: "@a%0%a001240@bIl tè, invece, non mi piace molto.\nLo bevo volentieri solo freddo e con tanto limone!\n@c0@"
  ja: "@a@b%a001240「午後のお茶を…\n\tっていうのは　苦手だけどね。\n@c0@"
272:
  de: "@a%0%a001250@bOh! Ich habe gerade nicht zugehört. Was hat er gesagt?\n@c0@"
  en: "@a%0%a001250@bOops! I wasn't listening! What did he just say?\n@c0@"
  es: "@a%0%a001250@b¡Uy! No estaba prestando atención. ¿Qué ha dicho?\n@c0@"
  fr: "@a%0%a001250@bOupsⓠ Je n'écoutais pasⓠ Qu'est-ce qu'il a ditⓡ\n@c0@"
  it: "@a%0%a001250@bEhm, mi sono distratta...\nCos'è che ha detto?\n@c0@"
  ja: "@a@b%a001250「あっ　わたし\n\tお話　聞いてませんでした……。\n@c0@"
273:
  de: "@aSancho@bDas ist doch schon etwas, nisst? Er sagt zwar nisst, dass es das beste ist, aber er hat wenigstens gesagt, es ist gut, no?\n@c0@"
  en: "@aSancho@bEes esometheeng, no? He no esay ees the best, but ees estill good, sí?\n@c0@"
  es: "@aSancho@bBueno, algo es algo. No dijo que fuera el mejor, pero al menos es espléndido, ¿no?\n@c0@"
  fr: "@aSancho@bC'est quelque chose, noⓡ Il ne dit pas que c'est le\nm-m-meilleur, mais c'est quand même bien, siⓡ\n@c0@"
  it: "@aSancho@bHa detto que no es el servizio da tè más precioso del mundo, ma que es comunque bueno.\n¿Mejor que nada, no?\n@c0@"
  ja: "@a@bサンチョ「いちおう　それなりに評価は\n\tしてくださっているのでしょう。\n@c0@"
274:
  de: "@aOtto@bErst sagt er, es sei ein gutes Ausstellungsstück, und dann macht er es er im gleichen Atemzug wieder schlecht. Der weiß auch net, was er will, net wahr?\n@c0@"
  en: "@aTuppence@bHe says it's a decent exhibit, but then he undermines it in his next breath. You just don't know what to believe, do you?\n@c0@"
  es: "@aAlazar@bPrimero dice que es una cosina espléndida y luego la hace de menos. No sabe uno a qué atenerse, ¿verdad?\n@c0@"
  fr: "@aInnocent@bIl dit que c'est un bel objet, mais il minimise sa qualité dans la phrase d'après. On ne sait plus quoi croire, au final, heinⓡ\n@c0@"
  it: "@aSimon@bPrima dice che l'oggetto è una meraviglia e poi aggiunge che a casa ne ha uno migliore. Se crede che siamo invidiosi di lui, si sbaglia di grosso!\n@c0@"
  ja: "@a@bピピン「あのように　言ってはいますが\n\tはたして　本当なんですかね？\n@c0@"
275:
  de: "@aBianca@bHah! So eine kriegt er nie!\n@c0@"
  en: "@aBianca@bHah! He'll never be able to get one of them for himself!\n@c0@"
  es: "@aBianca@b¡Ja! ¡Nunca conseguirá una!\n@c0@"
  fr: "@aBianca@bHaⓠ Il ne pourra jamais en avoir une pour luiⓠ\nEt tocⓠ\n@c0@"
  it: "@aBianca@bHah!\nNon riuscirà mai ad averne una uguale!\n@c0@"
  ja: "@a@bビアンカ「さすがに　あれは\n\tあの人でも手に入らないわよね。\n@c0@"
276:
  de: "@aNera@bEs scheint ihn richtig zu fuchsen, wenn er etwas sieht, was er nicht haben kann, meinst du nicht?\n@c0@"
  en: "@aNera@bIt really troubles that man if he feels like he can't have something, doesn't it?\n@c0@"
  es: "@aNera@bA ese uomo le preocupa veramente no poder conseguir algo, ¿verdad?\n@c0@"
  fr: "@aNera@bÇa le perturbe vraiment d'avoir l'impression qu'il ne peut pas posséder quelque chose, heinⓡ\n@c0@"
  it: "@aNera@bQuell'uomo proprio non sopporta di non avere qualcosa, vero?\nPoverino, mi spiace tanto per lui...\n@c0@"
  ja: "@a@bフローラ「けっきょく　何でも\n\t手に入れないと　気がすまない\n\tみたいですね。\n@c0@"
277:
  de: "@a%0%a001240@bDer mag wohl nur teure Sachen, oder? Aus Souvenirs und Schnickschnack macht er sich eigentlich nichts.\n@c0@"
  en: "@a%0%a001240@bThat man just wants expensive things, doesn't he?\nHe doesn't really care about souvenirs and\nknick-knacks.\n@c0@"
  es: "@a%0%a001240@bEse hombre solo quiere cosas caras, ¿verdad?\nLe dan igual los souvenires y las cosinas.\n@c0@"
  fr: "@a%0%a001240@bCe type veut juste posséder des objets très chers, heinⓡ Il ne s'intéresse pas vraiment aux objets de collection et au bric-à-brac.\n@c0@"
  it: "@a%0%a001240@bQuand'è che imparerà che nella vita non si può avere tutto?!\n@c0@"
  ja: "@a@b%a001240「名産品よりも　高そうな物が\n\tほしいんだね　あの人。\n@c0@"
278:
  de: "@a%0%a001250@bEr verliert nicht gern, oder?\n@c0@"
  en: "@a%0%a001250@bHe really hates losing, doesn't he?\n@c0@"
  es: "@a%0%a001250@bTiene mal perder, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bIl ne supporte vraiment pas de perdre, heinⓡ\n@c0@"
  it: "@a%0%a001250@bQuel tipo non sa perdere.\nFinirà per rodersi il fegato per l'invidia...\n@c0@"
  ja: "@a@b%a001250「あの人　すごい\n\t負けずぎらいなのね。\n@c0@"
279:
  de: "@aSancho@bEs ist nisst wisstig, ob der Schnickschnack teuer ist oder billig.\n@c0@"
  en: "@aSancho@bEes no important eef the knick-knacks, they are expensive or they are cheap.\n@c0@"
  es: "@aSancho@bPues lo importante no es si las cosinas son caras o baratas.\n@c0@"
  fr: "@aSancho@bÇa n'est pas important qu'oun objet de collection soit cher ou p-pas.\n@c0@"
  it: "@aSancho@b¡Es mejor que se rassegni: no potrà mai avere una corona uguale a esta!\n@c0@"
  ja: "@a@bサンチョ「名産品は　高いとか安いでは\n\tないと思うのですが……。\n@c0@"
280:
  de: "@aOtto@bIch glaub', es g'fallt mir net, wie der alte Geldsack die Welt sieht.\n@c0@"
  en: "@aTuppence@bI don't think I like the way this fat cat thinks.\n@c0@"
  es: "@aAlazar@bA mí este señor me cae gordo.\n@c0@"
  fr: "@aInnocent@bJe n'aime pas la façon de penser de ce gros bonhomme.\n@c0@"
  it: "@aSimon@bSecondo me quel tipo parla per invidia.\nGli piacerebbe possedere i souvenir esposti al Museo ma, siccome non può averli, ne parla male!\n@c0@"
  ja: "@a@bピピン「あのような　お金持ちの考え方は\n\tちょっと　いやですね。\n@c0@"
281:
  de: "@aBianca@bHmm... Die Blüten duften wunderbar. Und du hast sie zum Blühen gebracht, %a000090.\n@c0@"
  en: "@aBianca@bMmm... The blossom smells lovely. You're the one who made it bloom too, %a000090.\n@c0@"
  es: "@aBianca@bMmm... Las flores huelen genial. Y tú eres el que las ha hecho florecer, %a000090.\n@c0@"
  fr: "@aBianca@bMmm... Les fleurs sentent délicieusement bon. Et puis c'est grâce à toi qu'elle a fleuri, %a000090.\n@c0@"
  it: "@aBianca@bQuesto ramoscello ha tutto il profumo della primavera, e sei stato tu a farlo sbocciare, %a000090.\n@c0@"
  ja: "@a@bビアンカ「桜のかおりが　いっぱい。\n\tいいにおい…　この桜は\n\t%a000090が　咲かせたのよね。\n@c0@"
282:
  de: "@aNera@bIst das nicht erstaunlich? Nichts berührt ihn, nicht einmal etwas so Wunderschönes wie diese Blüten.\n@c0@"
  en: "@aNera@bIsn't it amazing? He doesn't feel anything, even\r\nwhen presented with something as beautiful as\r\nthis blossom.\n@c0@"
  es: "@aNera@b¿Ma come? Le da igual tutto, incluso estas flores tan bellas.\n@c0@"
  fr: "@aNera@bJe n'en reviens pasⓠ Il ne ressent rien, même quand on lui présente quelque chose d'aussi beau que cette branche en fleur.\n@c0@"
  it: "@aNera@bDi soldi ne avrà anche tanti, ma in quanto a sensibilità è zero: quel tizio non sa apprezzare la bellezza delle cose, ma solo il loro valore economico!\n@c0@"
  ja: "@a@bフローラ「あのように幻想的に\n\t美しい桜を見ても　あの方は\n\tなにも　感じないのかしら……。\n@c0@"
283:
  de: "@a%0%a001240@bIst es nicht ein Fehler, so vorschnell über etwas zu urteilen?\n@c0@"
  en: "@a%0%a001240@bIsn't it wrong to make snap judgements like that?\n@c0@"
  es: "@a%0%a001240@b¿No está mal hacer juicios de valor tan cortantes?\n@c0@"
  fr: "@a%0%a001240@bÇa n'est pas bien de porter des jugements aussi rapides, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bLe fate non esistono?\nPeggio per lui che non ci crede...\n@c0@"
  ja: "@a@b%a001240「なんでも　そうやって\n\t決め付けるのは　良くないことだよね？\n@c0@"
284:
  de: "@a%0%a001250@bAuch gut! Dann zeigen wir ihm eben keine wunderschönen Blütenzweige mehr! Ist uns doch egal!\n@c0@"
  en: "@a%0%a001250@bFine! We won't bother showing him any more beautiful branches of blossom then! See if we care!\n@c0@"
  es: "@a%0%a001250@b¡Pues vale! Ya no le enseñaremos más ramas o más flores. ¡Nos importa un bledo!\n@c0@"
  fr: "@a%0%a001250@bParfaitⓠ Eh bien, on ne se donnera plus la peine\nde lui montrer aucune belle branche en fleur\npuisque c'est çaⓠ Ça nous est égalⓠ\n@c0@"
  it: "@a%0%a001250@bNon gli piace questo meraviglioso ramoscello?\nMi spiace per lui che non ha la capacità di apprezzare le bellezze della natura...\n@c0@"
  ja: "@a@b%a001250「いいもん！\n\tもう　きれいな桜　あの人には\n\t見せてあげないもん。\n@c0@"
285:
  de: "@aSancho@bSí... Das ist der Zweig, den du mir mal gebracht hast, als du noch klein warst. Sí. Iss erinnere miss...\n@c0@"
  en: "@aSancho@bSí... Thees ees the branch you once breeng een the house when you were just a leettle boy. Sí. I remember...\n@c0@"
  es: "@aSancho@bPero... Si esta es la rama que me trajiste cuando eras un chamaco... Me acuerdo perfectamente.\n@c0@"
  fr: "@aSancho@bSi... C'est la b-b-branche que tu m'as rapportée\r\nun jour à la maison, quand tu étais encore oun\r\npetit garçon. Je m'en r-r-rappelle...\n@c0@"
  it: "@aSancho@bSì, esto es el ramoscello que me portasti en casa quando eri un piccolo niño.\nLo recuerdo como si fosse ieri...\n@c0@"
  ja: "@a@bサンチョ「そういえば　あの桜は\n\t坊っちゃんが　小さい頃\n\t持って帰ってきたんでしたっけ……。\n@c0@"
286:
  de: "@aOtto@bDer ist ja ganz schön selbstgewiss, net wahr? Ich glaub', den werden wir nie bekehren können. Er kann einem leid tun.\n@c0@"
  en: "@aTuppence@bHe's pretty sure of himself, isn't he?\nI don't think we'll ever manage to convince him.\nPoor, unenlightened fellow.\n@c0@"
  es: "@aAlazar@bEstá muy pagado de sí mismo, ¿verdad?\r\nMe parece que no le podremos convencer.\r\nPobre necio.\n@c0@"
  fr: "@aInnocent@bIl est très affirmatif, n'est-ce pasⓡ\nNous n'arriverons pas à le faire changer d'avis,\nje le crains. C'est triste d'être aussi obtus.\n@c0@"
  it: "@aSimon@bQuanto mi piacerebbe che una fata gli desse uno scappellotto su quella zucca vuota che si ritrova, così lo capirebbe se esistono oppure no!\n@c0@"
  ja: "@a@bピピン「ボクたちが　なにを言っても\n\t信じてくれそうにないですね。\n\tさみしい人だ……。\n@c0@"
287:
  de: "@aBianca@bWas hat der denn für ein Problem? Ist er etwa nur hier, um uns auf die Nerven zu gehen?\n@c0@"
  en: "@aBianca@bWhat's his problem? Is he just here to get on\r\nour nerves?\n@c0@"
  es: "@aBianca@b¿Pero qué le pasa? ¿Es que quiere ponernos de los nervios?\n@c0@"
  fr: "@aBianca@bC'est quoi, son problèmeⓡⓐ Il est juste là pour nous énerver, c'est çaⓡ\n@c0@"
  it: "@aBianca@bMa quanto si divertirà a dire cose del genere?!\nNon si rende conto di essere ridicolo?!\n@c0@"
  ja: "@a@bビアンカ「何　あの人？\n\tイヤミを言うために　ここにいるわけ？\n@c0@"
288:
  de: "@aNera@bIch würde dem Mann am liebsten gar nichts mehr zeigen. Er beurteilt alles immer so abfällig.\n@c0@"
  en: "@aNera@bI don't feel like I want to show this man anything now. He's always so negative.\n@c0@"
  es: "@aNera@bNon credo que me apetezca enseñarle niente a este hombre. Es veramente negativo.\n@c0@"
  fr: "@aNera@bJe n'ai plus très envie de montrer quoi que ce soit\r\nà cet homme. Il est toujours tellement négatif.\n@c0@"
  it: "@aNera@bQuell'uomo non dice mai una cosa carina.\nMi fa venir voglia di non mostrargli più niente!\n@c0@"
  ja: "@a@bフローラ「あのような言い方をされると\n\tもう　あの方には　なにも\n\t見せたくなくなってしまいますわ。\n@c0@"
289:
  de: "@a%0%a001240@bDu könntest doch ein paar Juwelen dafür finden, oder, Papa? Dann würde sie einfach toll aussehen!\n@c0@"
  en: "@a%0%a001240@bYou could find some jewels to fit in there, couldn't you, Dad? Then it would look great!\n@c0@"
  es: "@a%0%a001240@bPodrías encontrar joyas que engastarle, ¿verdad papi? ¡Entonces será genial!\n@c0@"
  fr: "@a%0%a001240@bOn pourrait trouver des pierres à mettre dessus, hein, papaⓡ Ça serait super beau, aprèsⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, perché non troviamo dei gioielli da incastonare nel carillon nuziale?\nCosì faremo star zitto quel signore antipatico!\n@c0@"
  ja: "@a@b%a001240「お父さん　いつか\n\tあれに　ピッタリな宝石をいれようね！\n@c0@"
290:
  de: "@a%0%a001250@bIhnen ist nicht das Geld ausgegangen. Sie konnten nur keinen Künstler finden, der das hätte machen können.\n@c0@"
  en: "@a%0%a001250@bThe money didn't run out. It's just that they couldn't find a craftsman to do the work.\n@c0@"
  es: "@a%0%a001250@bNo es que se quedaran sin dinero. Es que no encontraron un artesano que pudiera hacerlo.\n@c0@"
  fr: "@a%0%a001250@bÇa n'est pas parce qu'il n'y avait plus d'argent,\nc'est juste qu'ils n'ont pas réussi à trouver un artisan capable de le faire.\n@c0@"
  it: "@a%0%a001250@bNon è stato certo per una questione di soldi che sul carillon nuziale non sono incastonate delle pietre preziose! Ma quel tipo è troppo stupido per capirlo...\n@c0@"
  ja: "@a@b%a001250「お金がなかったんじゃないもん。\n\t職人さんが見つからなかったんだもん。\n@c0@"
291:
  de: "@aSancho@bEs ist zwar nur Tifortu, aber trotzdem... Iss mag es nisst, wie dieser Señor über die königlisse Familie sprisst.\n@c0@"
  en: "@aSancho@bEes only Coburg, but estill... I no like the way thees señor espeaks about the royalty.\n@c0@"
  es: "@aSancho@bNomás es Trastámara pero aún así... No me gusta como habla este señor de la realeza...\n@c0@"
  fr: "@aSancho@bÇa n'est que Cobourg, mais quand même... Je n'aime\r\np-p-pas la façon dont ce señor parle des membres d'oune famille royale.\n@c0@"
  it: "@aSancho@bNo me gusta como esto señor habla della familia real de Coburg...\n@c0@"
  ja: "@a@bサンチョ「う～む…\n\tラインハットの物とは　いえ\n\tあの言い方は……。\n@c0@"
292:
  de: "@aOtto@bDiese Bemerkung nehme ich ihm ziemlich übel!\n@c0@"
  en: "@aTuppence@bI'm afraid I'm rather offended by that remark!\n@c0@"
  es: "@aAlazar@bLa verdad es que ese comentario me ha ofendido mucho.\n@c0@"
  fr: "@aInnocent@bJe regrette, mais je suis très vexé par ce commentaireⓠ\n@c0@"
  it: "@aSimon@bUn altro commento del genere e gli farò lucidare tutti i souvenir del Museo con quella linguaccia velenosa che si ritrova!\n@c0@"
  ja: "@a@bピピン「今の言い方は\n\tかなり　カチンと　きましたよっ！\n@c0@"
293:
  de: "@aBianca@bDie Steine passen wirklich wunderbar in Harrys Spieldose, was?\n@c0@"
  en: "@aBianca@bThat gem goes a treat in Harry's music box, eh?\n@c0@"
  es: "@aBianca@bLa joya ha mejorado la caja de música de Froilán, ¿eh?\n@c0@"
  fr: "@aBianca@bCette pierre va parfaitement sur la boîte à musique de Harry, heinⓡ\n@c0@"
  it: "@aBianca@bSembra proprio che il carillon con la gemma gli sia piaciuto parecchio, eh?\nEh eh eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんの　オルゴールに\n\tあの宝石が　ピッタリだったのよね。\n\tなんだか　うれしいね。\n@c0@"
294:
  de: "@aNera@bIch glaube, nicht einmal Papa hat eine Spieldose, die dieser hier gleichkommen könnte. Ist sie nicht herrlich?\n@c0@"
  en: "@aNera@bI don't even think Papa has a music box that could compete with this one. Isn't it magnificent?\n@c0@"
  es: "@aNera@bNon credo ni que il mio papino tenga una caja de música que pueda compararse a esta. ¿A que es magnífica?\n@c0@"
  fr: "@aNera@bJe crois que même papa n'a pas de boîte à musique capable de rivaliser avec celle-ci. N'est-elle pas magnifiqueⓡ\n@c0@"
  it: "@aNera@bNemmeno mio padre ha un carillon nuziale tanto bello!\nÈ davvero meraviglioso!\n@c0@"
  ja: "@a@bフローラ「あれだけの細工のものは\n\tルドマンも持っていないと思いますわ。\n\tすばらしい　オルゴールです。\n@c0@"
295:
  de: "@a%0%a001240@bDie würde ich gern mal Prinz Harry und allen anderen zeigen, nachdem wir sie jetzt noch schöner gemacht haben.\n@c0@"
  en: "@a%0%a001240@bI'd love to show it to Prince Harry and everyone now we've made it look so much better.\n@c0@"
  es: "@a%0%a001240@bMe encantaría enseñársela al príncipe Froilán y a todos los demás ahora que tiene mucho mejor pinta.\n@c0@"
  fr: "@a%0%a001240@bJ'adorerais la montrer au prince Harry et à tout le monde, maintenant qu'on l'a rendue si belle.\n@c0@"
  it: "@a%0%a001240@bScommetto che al principe Robert piacerebbe tantissimo vedere come abbiamo trasformato il suo carillon nuziale!\n@c0@"
  ja: "@a@b%a001240「いつか　あの完成した\n\tオルゴールを　ヘンリーさんたちにも\n\t見てもらいたいね。\n@c0@"
296:
  de: "@a%0%a001250@bAch, der Arme. Er scheint etwas enttäuscht zu sein. Ha ha ha!\n@c0@"
  en: "@a%0%a001250@bOh, poor man. He seems a bit bitter. Ha ha ha!\n@c0@"
  es: "@a%0%a001250@b¡Oh!, pobrecito. Parece un poco amargado. ¡Ja, ja!\n@c0@"
  fr: "@a%0%a001250@bOh, le pauvre. Il a l'air un peu amer. Ha ha haⓠ\n@c0@"
  it: "@a%0%a001250@bVuole farsi fare un carillon più bello di questo?\nDubito che ci riuscirà.\nAh ah ah!\n@c0@"
  ja: "@a@b%a001250「あのおじさんが\n\tくやしがってる……。\n\tちょっと　うれしい…　かな？\n@c0@"
297:
  de: "@aSancho@bDie Spieldose von Tifortu und der Saphir von Steinach...\n@c0@"
  en: "@aSancho@bThe organ of Coburg, and the esapphire from Whealbrook...\n@c0@"
  es: "@aSancho@bLa caja de música de Trastámara y el zafiro de Arroyofrío...\n@c0@"
  fr: "@aSancho@bLa b-boîte à musique de Cobourg et un saphir de Ruycelieu...\n@c0@"
  it: "@aSancho@bEl carillon de Coburg y los zaffiros de Valcava...\n@c0@"
  ja: "@a@bサンチョ「ラインハットのオルゴールと\n\tサンタローズの　聖なる宝石……\n@c0@"
298:
  de: "@aSancho@bNachdem diese beiden Schätze nun vereint sind, bedeutet das vielleisst, dass auch die beiden Reisse irgendwann einmal vereint sind!\n@c0@"
  en: "@aSancho@bNow these two treasures are together, maybe eet means the places, one day they join together too.\n@c0@"
  es: "@aSancho@bPues igual haber unido estos dos tesoros logrará que ambos lugares se unan un día.\n@c0@"
  fr: "@aSancho@bMaintenant que ces deux t-t-trésors sont rassemblés, peut-être que ça veut dire qu'un jour, ces deux endroits seront unis aussi.\n@c0@"
  it: "@aSancho@bPare que estos souvenir siano proprio fattos l'uno por l'altro...\r\n¡Insieme sono davvero fantasticos!\n@c0@"
  ja: "@a@bサンチョ「ふたつが　あわさったように\n\tサンタローズとラインハットも　また\n\tひとつになれる日が来るのでしょうか？\n@c0@"
299:
  de: "@aOtto@bMich tät' mal interessieren, was für ein Künstler seines Fachs für diesen Mann arbeiten würde.\n@c0@"
  en: "@aTuppence@bI'd be interested to see what kind of craftsman would be employed by that man.\n@c0@"
  es: "@aAlazar@bMe pregunto qué clase de artesano aceptaría trabajar para ese tipo.\n@c0@"
  fr: "@aInnocent@bJe serais assez curieux de voir le genre d'artisan que peut bien employer cet homme.\n@c0@"
  it: "@aSimon@bSarei proprio curioso di sapere a chi si rivolgerà quell'uomo per farsi fare un carillon più bello di questo...\n@c0@"
  ja: "@a@bピピン「あの人の\n\tおかかえ職人というものを\n\t見てみたいものです。\n@c0@"
300:
  de: "@aBianca@bDer Göttin wird es gar nicht sehr gefallen, was er da sagt! Nicht, dass es ihm was ausmachen würde.\n@c0@"
  en: "@aBianca@bThe Goddess won't be happy with him for sayin' that! Not that he'll care, mind.\n@c0@"
  es: "@aBianca@bA la Diosa no le va a hacer ni pizca de gracia lo que ha dicho. Claro que a él tampoco le importa, ¿sabes?\n@c0@"
  fr: "@aBianca@bLa Déesse risque de ne pas aimer ce qu'il vient de direⓠ Remarque, je crois que ça lui est bien égal.\n@c0@"
  it: "@aBianca@bChe razza di maleducato!\nLa dea non sarà affatto contenta di sentire le sue parole!\n@c0@"
  ja: "@a@bビアンカ「バチ当たりな　言葉よね！\n\tでも　ああいう人ってバチが当たっても\n\t当たったって　わからないのかな？\n@c0@"
301:
  de: "@aNera@bDas Stift war mein Zuhause! Es kränkt mich, wenn die Leute etwas Abwertendes darüber sagen!\n@c0@"
  en: "@aNera@bThe abbey was my home! It's very upsetting when people say disparaging things about it.\n@c0@"
  es: "@aNera@b¡La abadía fue il mio hogar! Me dispiace molto cuando la gente la hace de menos.\n@c0@"
  fr: "@aNera@bC'était chez moi, cette abbayeⓠ Je déteste entendre les gens dire des choses aussi désobligeantes à son propos.\n@c0@"
  it: "@aNera@bMa come si permette questo villanzone di dire una cosa del genere, eh?!\nOh, santa dea, perdona la sua arroganza!\n@c0@"
  ja: "@a@bフローラ「その修道院に\n\t身をおいたことのある　私としては\n\t今の言葉は　つらいですわね……。\n@c0@"
302:
  de: "@a%0%a001240@bAlso, immer wenn ich eine dieser Statuetten in der Hand halte, fühle ich mich behütet. Das kapiert der einfach nicht, oder?\n@c0@"
  en: "@a%0%a001240@bWell whenever I hold one of those images, I get a warm feeling all over. That man just doesn't get it, does he?\n@c0@"
  es: "@a%0%a001240@bBueno, pues cuando yo sostengo una de esas imágenes, me siento mejor. Pero ese hombre no lo entiende, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bEh bien moi, quand je tiens l'une de ces statuettes,\nje ressens une sensation de chaleur. Mais ce type ne comprend rien à tout ça, heinⓡ\n@c0@"
  it: "@a%0%a001240@bOgni volta che stringo tra le mani una di queste statuette, sento la protezione della dea su di me. Se quell'uomo non ci crede, il problema è suo, non mio!\n@c0@"
  ja: "@a@b%a001240「ボク　あの女神像を持ってると\n\tあったかい気持ちに　なれるんだ。\n\tあの人には　わからないのかな？\n@c0@"
303:
  de: "@a%0%a001250@bLiebe Göttin, hast du das gehört? Hier ist ein Sünder, der bestraft werden sollte!\n@c0@"
  en: "@a%0%a001250@bDear Goddess, are you listening to this?\nThere's a sinner here who needs to be punished!\n@c0@"
  es: "@a%0%a001250@bSanta Diosa, ¿has oído?\nHe aquí un pecador que merece ser castigado.\n@c0@"
  fr: "@a%0%a001250@bChère Déesse, tu entends çaⓡ Voilà un pécheur qui mériterait bien une petite leçonⓠ\n@c0@"
  it: "@a%0%a001250@bDea onnipotente, fai in modo che quest'insolente peccatore se ne stia zitto per un po'!\nDiciamo per i prossimi dieci o vent'anni...\n@c0@"
  ja: "@a@b%a001250「神さま…\n\tバチ当たりな人がいます！\n\tちゃんと　見ててくださいっ。\n@c0@"
304:
  de: "@aSancho@bDas ist gemein gegenüber den Schwestern, die diese Figürssen machen! Wenn sie diese harschen Worte hören würden, wären sie schreckliss gekränkt.\n@c0@"
  en: "@aSancho@bEes, ees eso esad for the esisters who make thees estatue. Eef they heard these harsh words, they, they would be eso hurt.\n@c0@"
  es: "@aSancho@bEs bien triste para las hermanitas que hicieron la estatua. Si oyeran esas palabras de desprecio, les dolería en el alma.\n@c0@"
  fr: "@aSancho@bC'est vraiment t-t-triste pour les religieuses qui ont fait cette statouette. Elles seraient très p-peinées d'entendre dire des choses pareilles.\n@c0@"
  it: "@aSancho@b¡Si yo no avessi tanto respetto por el lavoro de las suoras y por la dea, romperei la stauetta sulla cabeza de esto ⓕseñorⓖ de los mios stivales!\n@c0@"
  ja: "@a@bサンチョ「作った方のことを考えると\n\tあのような言い方は\n\tどうかと思います……。\n@c0@"
305:
  de: "@aOtto@bDer Kerl ist aber ganz schön neugierig, was?\n@c0@"
  en: "@aTuppence@bThe chap's more than a bit indiscreet, isn't he?\n@c0@"
  es: "@aAlazar@bEl tipo es un autentico bocazas, ¿verdad?\n@c0@"
  fr: "@aInnocent@bCe type n'a vraiment aucune retenue, heinⓡ\n@c0@"
  it: "@aSimon@bQuesta sottospecie di ometto dev'essere il campione mondiale di maleducazione!\nAvrei tanta voglia di dirgliene quattro...\n@c0@"
  ja: "@a@bピピン「あの人も　いい大人なのに\n\tこまった人ですねえ。\n@c0@"
306:
  de: "@aBianca@bIch glaube, so begeistert hat er noch nie geklungen. Er muss ganz wild sein auf diese Schleimschleife.\n@c0@"
  en: "@aBianca@bI think that's the first time I've heard him so thrilled. He must be really keen on that slime curio.\n@c0@"
  es: "@aBianca@bCreo que es la primera vez que lo veo tan emocionado. Le debe de encantar el souvenir limoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien la première fois que je le vois aussi\r\nexcité. Il doit vraiment être fou de cette breloque\r\nde gluants.\n@c0@"
  it: "@aBianca@bEh eh eh!\nDirei che la nostra cintura degli Slime gli è piaciuta parecchio!\n@c0@"
  ja: "@a@bビアンカ「あの人が　とり乱すところ\n\t初めて見たかも。\n\tそんなに　あれが　ほしいんだ……。\n@c0@"
307:
  de: "@aNera@bKein Wunder, dass er keine hat. Der Inhaber der Geheimniskrämerei in Fortuna ist wählerisch bei seinen Kunden. Mit dem würde er keine Geschäfte machen.\n@c0@"
  en: "@aNera@bI'm not surprised he hasn't got one. The Old Curiosity Shop owner in Fortuna is very picky about his customers. He wouldn't accept this man.\n@c0@"
  es: "@aNera@bNo me extraña que no consiguiera uno. El propietario de la Vieja Tienda de Curiosidades es veramente selectivo con su clientela.\n㈡\nNo le vendería nada a este uomo.\n@c0@"
  fr: "@aNera@bÇa ne m'étonne pas qu'il n'en possède pas.\nLe propriétaire de la Petite boutique des curiosités de Bonaventure trie ses clients sur le volet. \n㈡\nEt il ne l'accepterait jamais.\n@c0@"
  it: "@aNera@bAnche se vivesse fino all'età di Geremia, non riuscirebbe mai a procurarsi un'autentica cintura degli Slime! Oh, quanto mi dispiace! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「オラクル屋のご主人は\n\tお客さんを　えらびますから…\n\tあの人はダメだったということですね。\n@c0@"
308:
  de: "@a%0%a001240@bJawoll! Wir haben etwas, was er nicht kriegen kann!\n@c0@"
  en: "@a%0%a001240@bYes! We've got something that he can't get!\n@c0@"
  es: "@a%0%a001240@b¡Sí! ¡Tenemos algo que él no puede conseguir!\n@c0@"
  fr: "@a%0%a001240@bOuaisⓠ On a quelque chose qu'il ne peut pas avoirⓠ\n@c0@"
  it: "@a%0%a001240@bChissà se quel poveretto riuscirà a sopravvivere alla delusione di non possedere un oggetto che noi abbiamo... Wah ah ah ah ah!\n@c0@"
  ja: "@a@b%a001240「あの人でも　手に入らない物が\n\tあるんだね。\n@c0@"
309:
  de: "@a%0%a001250@bWas? Ihm gefällt diese merkwürdige Schleimschleife? Das zeigt doch, was er für ein komischer Typ ist!\n@c0@"
  en: "@a%0%a001250@bWhat? He likes that weird slime curio?\nThat just shows how weird he is!\n\n@c0@"
  es: "@a%0%a001250@b¿Qué? ¿Le gusta ese souvenir limoso tan raro?\nEso demuestra lo rarito que es.\n@c0@"
  fr: "@a%0%a001250@bQuoiⓡ Il aime cette drôle de breloque de gluantsⓡ Ça prouve bien qu'il est bizarreⓠ\n@c0@"
  it: "@a%0%a001250@bEh?! Gli piace quella bizzarra cintura degli Slime?!\nNon l'avrei mai detto...\n@c0@"
  ja: "@a@b%a001250「えっ　あんな\n\tへんな　のれんが　好きなの？\n\tやっぱり　変わった人なんだね。\n@c0@"
310:
  de: "@aSancho@bDieser Señor, er will uns etwas über unseren Schnickschnack sagen, aber wenn du miss fragst, sagt er uns etwas über siss selbst.\n@c0@"
  en: "@aSancho@bThees señor, he esay to us he can tell us about the knick-knacks, but eef you ask me, he just tells us about heemself.\n@c0@"
  es: "@aSancho@bEste señor nomás dice que nos puede contar sobre las cosinas, pero, a mí me parece que solo cuenta de sí mismo y pues ya.\n@c0@"
  fr: "@aSancho@bCe señor, il nous r-r-raconte qu'il peut nous parler des objets, mais je crois plutôt qu'il nous p-parle surtout de lui.\n@c0@"
  it: "@aSancho@b¿Trecentomilas monedas por una cintura de los Slime?\n¡Quell'hombre dev'essere davveros muy ricco!\n@c0@"
  ja: "@a@bサンチョ「名産の価値を　聞くと言うより\n\tなんだか　あの人の個人的な好みを\n\t聞いているような気がしてきましたよ。\n@c0@"
311:
  de: "@aOtto@bJa, die Schleimschleife ist ziemlich wertvoll, net wahr? Hieß es net, es gäbe nur eine davon auf der ganzen Welt oder so?\n@c0@"
  en: "@aTuppence@bYes, that slime curio's pretty valuable, isn't it?\r\nWeren't we told there's only one of them in the\r\nwhole world or something?\n@c0@"
  es: "@aAlazar@bSí, el souvenir limoso es muy valioso, ¿verdad?\r\n¿No nos dijeron que era único en el mundo o algo así?\n@c0@"
  fr: "@aInnocent@bOui, cette breloque de gluants a pas mal de valeur. D'ailleurs, on ne nous a pas dit qu'il n'en existait qu'une seule au monde ou un truc comme çaⓡ\n@c0@"
  it: "@aSimon@bSarà anche antipatico, ma quel tizio è un vero esperto: s'è subito reso conto che la cintura degli Slime è un oggetto preziosissimo.\n@c0@"
  ja: "@a@bピピン「あの　のれんって\n\t貴重な物なんですねえ。\n\t世界に１枚しか　ないんでしたっけ？\n@c0@"
312:
  de: "@aBianca@bIn Bakenmünde werden sie einem fast nachgeworfen, aber sie sind ziemlich eindrucksvoll.\n@c0@"
  en: "@aBianca@bYou can get 'em easy as pie over in Lodestar Harbour, but they are pretty impressive.\n@c0@"
  es: "@aBianca@bSe pueden conseguir fácilmente en Puerto Polaris, pero siguen siendo impresionantes, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn les trouve très facilement à Port-Lanterne,\r\nmais ce sont des objets assez impressionnants.\n@c0@"
  it: "@aBianca@bÈ proprio vero: non si può restare indifferenti di fronte alla bellezza delle navi in bottiglia di Grandport.\n@c0@"
  ja: "@a@bビアンカ「ポートセルミでは\n\tふつうに売ってたけど\n\tけっこう　すごい物なんだ。\n@c0@"
313:
  de: "@aNera@bDass der Schöpfer dieses Schiffes so viele schön gefertigte Souvenirs herstellen konnte, zeigt, wie geschickt er gewesen sein muss.\n@c0@"
  en: "@aNera@bThe fact that the person who made this managed to produce so many finely crafted souvenirs just goes to show how skilled he must have been.\n@c0@"
  es: "@aNera@bEl que el que lo ha fabricado haya logrado hacer tanti y tan bene solo es prueba de lo habilidoso que es.\n@c0@"
  fr: "@aNera@bLa finesse des détails de cet objet prouve\r\nque la personne qui l'a fabriqué devait être\r\ntrès talentueuse.\n@c0@"
  it: "@aNera@bBasta guardare questo splendido souvenir per capire che la persona che l'ha creato è un artigiano straordinariamente abile.\n@c0@"
  ja: "@a@bフローラ「すばらしい物を　たくさん\n\t作り出せるということは　職人さんの\n\tウデが　たしかなのですね。\n@c0@"
314:
  de: "@a%0%a001240@bJa, Buddelschiffe sind voll klasse! Die könnte ich mir stundenlang anschauen.\n@c0@"
  en: "@a%0%a001240@bYeah, ships in bottles are really cool! I could just sit and look at them for hours and hours.\n@c0@"
  es: "@a%0%a001240@bSí, los barcos en botella son geniales. Yo me puedo pasar horas mirándolos.\n@c0@"
  fr: "@a%0%a001240@bOui, c'est vraiment super, les bateaux en bouteilleⓠ Je pourrais passer des heures et des heures à les contempler.\n@c0@"
  it: "@a%0%a001240@bLe navi in bottiglia sono bellissime. Quando ne guardo una, mi sembra di essere un marinaio che naviga su mari sconosciuti verso fantastiche avventure!\n@c0@"
  ja: "@a@b%a001240「ボトルシップって\n\tかっこいいよね！\n\tずっと見てても　あきないよ。\n@c0@"
315:
  de: "@a%0%a001250@bEs sieht genauso aus wie dein Schiff, Papa. Es ist wirklich toll.\n@c0@"
  en: "@a%0%a001250@bIt looks exactly like your ship, Dad. It's amazing.\n@c0@"
  es: "@a%0%a001250@bEs igualito que tu barco, papi. Es asombroso.\n@c0@"
  fr: "@a%0%a001250@bOn dirait la réplique exacte de ton bateau, papa. C'est incroyable.\n@c0@"
  it: "@a%0%a001250@bPapà, non ti sembra che questa nave in bottiglia somigli alla nostra imbarcazione?\n@c0@"
  ja: "@a@b%a001250「お父さんのお船に\n\tそっくりだもんね。　すごいなあ……。\n@c0@"
316:
  de: "@aSancho@bEs ist nisst leisst, die Galeone in die Flasche einzubauen, weißt du.\n@c0@"
  en: "@aSancho@bEes no easy to make the galleon eenside the bottle, you know.\n@c0@"
  es: "@aSancho@bPues no es fácil meter un galeón dentro de una botella.\n@c0@"
  fr: "@aSancho@bÇa n'est pas f-f-facile de faire rentrer le bateau dans la bouteille, tu sais.\n@c0@"
  it: "@aSancho@bNo dev'essere facil realizzare una nave en bottiglia così bella...\n@c0@"
  ja: "@a@bサンチョ「ボトルの中で\n\t船を　組み立てるというのは\n\tなみたいていの苦労ではありませんよ。\n@c0@"
317:
  de: "@aSancho@bFür miss, es ist unmögliss. Sieh dir nur meine Finger an... Sie sind dick wie leckere Würstssen, no?\n@c0@"
  en: "@aSancho@bFor me, ees no possible. You look at these fingers...\r\nThey are thick like the trunks of the tree, no?\n@c0@"
  es: "@aSancho@bPara mí sería imposible. ¡Mira mis dedos!\r\nSon gordos como morcillas, chamaquito.\n@c0@"
  fr: "@aSancho@bEt pour moi, c'est c-c-carrément impossible.\nRegarde mes d-d-doigts... Ils sont épais comme\ndes t-troncs d'arbres, noⓡ\n@c0@"
  it: "@aSancho@bYo no ce riuscirei mai.\n¡Però yo so preparare una paella esquisita!\n@c0@"
  ja: "@a@bサンチョ「私なんて　特に！\n\t指が太いですから。\n@c0@"
318:
  de: "@aOtto@bAlso von einem Meister seines Fachs angefertigt? Tja, da könnt' was dran sein.\n@c0@"
  en: "@aTuppence@bMade by a real expert, was it? Yes, I suppose\r\nit was.\n@c0@"
  es: "@aAlazar@bLo haría un auténtico experto, ¿verdad? Sí, supongo que sí.\n@c0@"
  fr: "@aInnocent@bFabriqué par un véritable expert, heinⓡ\nOui, c'est sans doute vrai.\n@c0@"
  it: "@aSimon@bProvo grande ammirazione per l'eccelso artigiano che ha saputo creare un oggetto tanto squisito!\n@c0@"
  ja: "@a@bピピン「そんな　すごい職人さんが\n\t作ったものだったんですねえ。\n@c0@"
319:
  de: "@aBianca@bEtwas ganz Fürchterliches? Na, schönen Dank auch! Das würde %a001210 bestimmt nicht gern hören!\n@c0@"
  en: "@aBianca@bA frightful pest? Charmin'! %0%a001210 wouldn't be best pleased to be described like that!\n@c0@"
  es: "@aBianca@b¿Terrible plaga? ¡Qué simpático! A %a001210 no le gustaría nada que lo describiesen así, ¿sabes?\n@c0@"
  fr: "@aBianca@bDe sacrés rôdeursⓡ Charmantⓠ\n%0%a001210 apprécierait sans doute beaucoup d'être décrit de la sorteⓠ\n@c0@"
  it: "@aBianca@bⓕUn mostro di quelli tostiⓖ? Ah ah ah!\nMa no! %0%a001210 è una bestiolina adorabile!\n@c0@"
  ja: "@a@bビアンカ「よほどの敵だって。\n\t%a001210が聞いたら　怒るかもね。\n@c0@"
320:
  de: "@aNera@bIch mag das Ding eigentlich nicht. Zu dem würde ich lieber Abstand halten!\n@c0@"
  en: "@aNera@bI don't really like that thing.\nDon't make me go near it, will you?\n@c0@"
  es: "@aNera@bEsa cosa no me gusta niente.\r\nVeramente, no quiero estar cerca de ella.\n@c0@"
  fr: "@aNera@bJe n'aime pas trop cette... chose.\nNe m'oblige pas à m'en approcher, d'accordⓡ\n@c0@"
  it: "@aNera@bPerò!\nHa riconosciuto anche lo spaventamostri di Punta Campestre!\n@c0@"
  ja: "@a@bフローラ「私も　あのカカシには\n\t近寄りづらいです。\n@c0@"
321:
  de: "@a%0%a001240@bEs soll Ungeheuer abschrecken. Wenn es den Mann nicht wenigstens ein bisschen erschreckt hätte, würde es ja wohl nicht viel taugen, oder?\n@c0@"
  en: "@a%0%a001240@bIt's supposed to scare off monsters.\nIf it didn't at least scare that man a bit too,\nit wouldn't be much good, would it?\n@c0@"
  es: "@a%0%a001240@bSe supone que debe espantar a los monstruos.\nSi no hubiera asustado a ese hombre ni un poco, no sería demasiado útil, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bC'est censé faire fuir les monstres. Si ça ne fait pas aussi un peu fuir cet homme, c'est que ce n'est pas très réussi, tu ne crois pasⓡ\n@c0@"
  it: "@a%0%a001240@bLo spaventamostri dovrebbe terrorizzare le belve, no? Eppure anche quell'uomo ne ha avuto paura.\nChe sia un mostro pure lui? Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「魔物よけの　カカシだもの。\n\tおじさんが　おどろくのも\n\tしかたないよ。\n@c0@"
322:
  de: "@a%0%a001250@bIch wette, die Schreckensscheuche wäre nicht sehr erfreut, als wertlos bezeichnet zu werden. Und die sollte man lieber nicht verstimmen!\n@c0@"
  en: "@a%0%a001250@bI bet the terrorcrow wouldn't be too happy being described as worthless. And you wouldn't want to upset the terrorcrow.\n@c0@"
  es: "@a%0%a001250@bSeguro que el horrorizacuervos no se siente demasiado halagado con eso de que diga que no vale nada. Y no es buena idea enfadarlo.\n@c0@"
  fr: "@a%0%a001250@bJe parie que l'épouvanteur n'apprécierait pas beaucoup d'entendre qu'il ne vaut rien. Et personne n'aimerait voir un épouvanteur en colère.\n@c0@"
  it: "@a%0%a001250@bScommetto che allo spaventamostri non piacerebbe sapere che qualcuno ha detto che non vale una cicca...\n@c0@"
  ja: "@a@b%a001250「価値がないなんて言ったら\n\tカカシさん　怒っちゃうよ。\n@c0@"
323:
  de: "@aSancho@bDiese Vogelscheusse, sie ist so unheimliss, sie erschreckt nisst nur Ungeheuer auf den Feldern, sondern auch Menschen.\n@c0@"
  en: "@aSancho@bThees escarecrow, he ees eso escary, ees no just the monsters who no go een the fields.\r\nEes the humans too.\n@c0@"
  es: "@aSancho@bEste horrorizcuervos da tantísimo miedo que no solo son los monstruos los que no se acercan a los campos.\n㈡\nLos humanos tampoco.\n@c0@"
  fr: "@aSancho@bCet épouvantail est t-t-tellement effrayant qu'il n'y a pas que les m-m-monstres qui ne vont plus dans\r\nles champs. Les humains non plus.\n@c0@"
  it: "@aSancho@b¡Madre de la dea, quant'è bruttos!\n¡Esto spaventamostri no espaventa solo los mostros, ma anche los esseres humanos!\n@c0@"
  ja: "@a@bサンチョ「あのカカシを　置いておいたら\n\t人もこわがって　畑に入れなく\n\tなるかもしれませんね。\n@c0@"
324:
  de: "@aOtto@bHuch! Grad hat mich die Schreckensscheuche aus den Augenwinkeln angefunkelt, ganz bestimmt!\n@c0@"
  en: "@aTuppence@bI'm sure that terrorcrow just gave me a\r\nsideways glance.\n@c0@"
  es: "@aAlazar@bEstoy convencido de que ese horrorizacuervos me acaba de mirar de reojo.\n@c0@"
  fr: "@aInnocent@bJe suis sûr que cet épouvanteur m'a lancé un regard de travers.\n@c0@"
  it: "@aSimon@bAaaaaahhh! \nLo spaventamostri si è mosso!\nNe sono certo! Ha cercato di colpirmi!\n@c0@"
  ja: "@a@bピピン「今　あのカカシに\n\tにらまれたような……。\n@c0@"
325:
  de: "@aOtto@bN-Nein... Das... Das muss ich mir eingebildet haben...\n@c0@"
  en: "@aTuppence@bN-No... I, I must've imagined it...\n@c0@"
  es: "@aAlazar@bN-no... D-deben ser imaginaciones mías...\n@c0@"
  fr: "@aInnocent@bN-Non... J'ai dû rêver...\n@c0@"
  it: "@aSimon@bUhm, forse mi sono sbagliato.\nComunque, nel dubbio, mi terrò a distanza di sicurezza...\n@c0@"
  ja: "@a@bピピン「気のせいですよね……。\n@c0@"
326:
  de: "@aBianca@bEr braucht also bloß jemanden hinzuschicken, um ihn zu besorgen? Ich dachte, da kommt so leicht keiner dran!\n@c0@"
  en: "@aBianca@bSo all he has to do is send someone over and he gets some? I thought it was s'posed to be exclusive stuff!\n@c0@"
  es: "@aBianca@b¿Así que tan solo tiene que enviar a alguien y le darán un poco? Creía que era algo exclusivo.\n@c0@"
  fr: "@aBianca@bAlors tout ce qu'il a à faire, c'est envoyer quelqu'un là-bas pour lui en rapporterⓡ Je croyais que c'était un secret bien gardéⓠ\n@c0@"
  it: "@aBianca@bPuò mandarne anche dodici di servitori a Milleventi, ma dubito fortemente che riuscirà a procurarsi anche una sola bottiglia di questa delizia!\n@c0@"
  ja: "@a@bビアンカ「あの人　使いを出すだけで\n\tルラフェンの地酒が飲めるの？\n\t貴重なお酒なのに…　ホントかな？\n@c0@"
327:
  de: "@aNera@bPapa lässt sich Getränke aus der ganzen Welt auf sein Kasinoschiff liefern.\n@c0@"
  en: "@aNera@bPapa has different drinks delivered to his casino ship from all over the world.\n@c0@"
  es: "@aNera@bIl mio papino hace que le envíen bebidas a il suo barcoⓚcasino desde tutti los sitios del mondo.\n@c0@"
  fr: "@aNera@bDes boissons du monde entier sont livrées sur le bateau casino de papa.\n@c0@"
  it: "@aNera@bMio padre acquista bevande da tutto il mondo per gli ospiti del suo casinò.\n@c0@"
  ja: "@a@bフローラ「お父さまも　集めたお酒を\n\tカジノ船に置いていますが\n@c0@"
328:
  de: "@aNera@bAber ich kann mich nicht daran erinnern, schon jemals Sprungsprudel gesehen zu haben. Und auch nichts anderes aus Wunnermühl, wenn ich's recht bedenke.\n@c0@"
  en: "@aNera@bBut I don't recall seeing any Zoomshine there before. Nothing from Zoomingale at all, as far as I remember.\n@c0@"
  es: "@aNera@bPero non ricordo que tuviera telelicor. No tenía niente de Telele si mal no recuerdo.\n@c0@"
  fr: "@aNera@bMais je ne me souviens pas y avoir jamais vu de télétord-boyaux. Ni rien qui vienne de Moulinsort, d'ailleurs.\n@c0@"
  it: "@aNera@bDi Delizia di Milleventi, però, non ne ha mai trovata nemmeno una bottiglia. Figuriamoci se questo tipo riuscirà ad acquistarne quattro o cinque casse!\n@c0@"
  ja: "@a@bフローラ「ルラフェンの地酒は\n\t見たこと　ありませんわ。\n@c0@"
329:
  de: "@a%0%a001240@bSancho sagt, nur Erwachsene dürfen so was trinken.\n@c0@"
  en: "@a%0%a001240@bSancho says only adults are allowed to drink.\n@c0@"
  es: "@a%0%a001240@bSancho dice que beber es de mayores.\n@c0@"
  fr: "@a%0%a001240@bSancho dit qu'il n'y a que les grandes personnes qui ont le droit de boire.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho mi ha detto che la Delizia di Milleventi è buonissima. Mi ha promesso che me la farà assaggiare, quando sarò grande.\n@c0@"
  ja: "@a@b%a001240「お酒は大人に　なってからって\n\t前にサンチョが　言ってたよ。\n@c0@"
330:
  de: "@a%0%a001250@bAch... Immer, wenn ich einen Hauch von diesem Sprungsprudel in die Nase kriege, wird mir ganz schwindelig...\n@c0@"
  en: "@a%0%a001250@bOooh... Whenever I get a whiff of that Zoomshine,\nit makes me feel all dizzy...\n@c0@"
  es: "@a%0%a001250@bOooh... Cada vez que huelo ese telelicor me mareo...\n@c0@"
  fr: "@a%0%a001250@bOooh... Chaque fois que je respire les vapeurs de\nce télétord-boyaux, j'ai la tête qui tourne...\n@c0@"
  it: "@a%0%a001250@bA giudicare dal profumino che emana, la Delizia di Milleventi dev'essere una vera squisitezza!\n@c0@"
  ja: "@a@b%a001250「私　お酒のにおいを　かぐと\n\tクラクラしちゃうの。\n@c0@"
331:
  de: "@aSancho@bSí, sí. Es ist gut zum Kochen, so ein Getränk. Qué? Zu wertvoll, um es ins Essen zu schütten? Wirkliss?\n@c0@"
  en: "@aSancho@bSí, sí. Ees good for the cooking, thees kind of dreenk. Qué? Ees too valuable to put een the cooking? You theenk eso?\n@c0@"
  es: "@aSancho@b¡Ándale! Pues este licorcillo sería bien chido para cocinar.\n㈡\n¿Cómo? ¿Que es demasiado caro para usarlo en la cocina? ¿Tú crees?\n@c0@"
  fr: "@aSancho@bSi, si. Ce genre de b-boisson est excellent pour\nla cuisine. Quéⓡ C'est trop p-p-précieux pour le\nmettre dans oun platⓡ Tu croisⓡ\n@c0@"
  it: "@aSancho@b¡No esiste una bevanda mejor della Delizia de Milleventi por accompagnare un pentolon de ottima paella!\n@c0@"
  ja: "@a@bサンチョ「お酒は　よく料理を作るとき\n\t使いますけどね。\n@c0@"
332:
  de: "@aOtto@bWenn das Zeug so was Besonderes ist, wie man uns weismachen will, dann kommt man da bestimmt nicht so ohne weiteres dran.\n@c0@"
  en: "@aTuppence@bIf the stuff's as legendary as we've been led to believe, I can't imagine it'll be all that easy to get\r\nhold of.\n@c0@"
  es: "@aAlazar@bSi es tan legendario como nos han hecho creer, no será tan fácil de conseguir.\n@c0@"
  fr: "@aInnocent@bSi cette boisson est aussi légendaire que ce qu'on nous a laissé entendre, je doute qu'il soit si facile que ça d'en obtenir.\n@c0@"
  it: "@aSimon@bLa Delizia di Milleventi dev'essere una bevanda eccezionale!\nMi viene sete solo a nominarla!\n@c0@"
  ja: "@a@bピピン「伝説の　お酒という\n\tくらいですから　そんな\n\tかんたんに　手に入らないんじゃ……。\n@c0@"
333:
  de: "@aBianca@bFür ihn mögen das ja bloß klebrige Brötchen sein, aber für uns sind sie was ganz Besonderes, nicht?\n@c0@"
  en: "@aBianca@bThey might just be sticky buns to him, but they're special to us, eh?\n@c0@"
  es: "@aBianca@bPara él igual no son más que unos pasteles pegajosos, pero para nosotros son muy especiales, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bCe ne sont peut-être que de simples gâteaux pour lui, mais pour nous, ils ont quelque chose de particulier, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bPer lui sono ⓕsoloⓖ dei semplici dolcetti, ma per noi questi panini hanno un valore inestimabile...\n@c0@"
  ja: "@a@bビアンカ「あの人には\n\tただの　おまんじゅうでも\n\t私たちには　特別なものだわ。\n@c0@"
334:
  de: "@aNera@bIch verstehe, warum er so denkt.\n@c0@"
  en: "@aNera@bI can understand why he thinks that.\n@c0@"
  es: "@aNera@bNon capisco porque dice eso.\n@c0@"
  fr: "@aNera@bJe comprends son raisonnement.\n@c0@"
  it: "@aNera@bCerto, capisco che per quell'uomo questi panini siano solo dei dolci come gli altri...\n@c0@"
  ja: "@a@bフローラ「いいえ　べつに\n\t反論はありませんわ。\n@c0@"
335:
  de: "@aNera@bIch meine, er weiß ja nicht, dass sie extra zur Feier unserer Hochzeit gebacken wurden.\n@c0@"
  en: "@aNera@bI mean, he doesn't know they were made to celebrate our marriage to each other, does he?\n@c0@"
  es: "@aNera@bMa, ¿es que no sabe que se hicieron para conmemorar la nostra boda?\n@c0@"
  fr: "@aNera@bC'est vrai, il ne peut pas savoir que ces gâteaux\r\nont été faits spécialement pour célébrer notre mariage, après tout.\n@c0@"
  it: "@aNera@bPer me, invece, sono il delizioso ricordo del nostro matrimonio!\n@c0@"
  ja: "@a@bフローラ「だって　あの方は\n\t私たちが　どのように祝福されて\n\t結婚したか　ご存じないんですもの。\n@c0@"
336:
  de: "@a%0%a001240@bAber die sind doch was wert! Das sind doch nicht einfach irgendwelche Honigbrötchen! Immerhin wurden sie extra für deine Hochzeit gebacken.\n@c0@"
  en: "@a%0%a001240@bBut they are worth something. They're not just\nany honey buns. They were made especially for\nyour wedding.\n@c0@"
  es: "@a%0%a001240@bPero claro que tienen valor. No son solo unos pasteles de miel. Los hicieron especialmente para vuestra boda.\n@c0@"
  fr: "@a%0%a001240@bMais si, ils ont de la valeurⓠ Ce ne sont pas de\nsimples gâteaux au miel. Ils ont été faits exprès\npour votre mariage.\n@c0@"
  it: "@a%0%a001240@bQuelli non sono dolci comuni!\nSono stati preparati appositamente per il matrimonio dei miei genitori!\n@c0@"
  ja: "@a@b%a001240「お父さんと　お母さんの\n\t思い出の　おまんじゅうなのに\n\tひどいなあ。\n@c0@"
337:
  de: "@a%0%a001250@bWie würde sich wohl der arme Bäcker fühlen, wenn er das jetzt gehört hätte!\n@c0@"
  en: "@a%0%a001250@bJust think how the poor chef would feel if he heard him say that!\n@c0@"
  es: "@a%0%a001250@bImagina qué mal se sentiría el pastelero si le oyese decir eso.\n@c0@"
  fr: "@a%0%a001250@bImaginez un peu ce que ressentirait le pauvre\nchef-pâtissier s'il l'entendait dire çaⓠ\n@c0@"
  it: "@a%0%a001250@bI panini dolci non valgono molto?!\nIo penso che il pasticciere che li ha preparati sia un vero artista!\n@c0@"
  ja: "@a@b%a001250「職人さんが一生けんめい\n\t作った物を　そんなふうに言う人\n\tきらいです。\n@c0@"
338:
  de: "@aSancho@bEs ist nisst gut, den zu verstimmen, der das Essen macht, weißt du.\n@c0@"
  en: "@aSancho@bEes no a good idea to upset the one who makes the food, you know.\n@c0@"
  es: "@aSancho@bHe aquí una importante lección, chamaco: nunca enfades al cocinero.\n@c0@"
  fr: "@aSancho@bÇa n'est jamais oune bonne idée de mettre en\r\nc-c-colère la personne qui prépare la nourriture.\n@c0@"
  it: "@aSancho@bDa como ne parla, pienso que los paninos dolces gli gustano mucho anche a lui...\n@c0@"
  ja: "@a@bサンチョ「職人の方に　失礼な\n\t言い方ですね。\n@c0@"
339:
  de: "@aOtto@bAlso, eins will ich mal sagen! Man sieht nicht jeden Tag so schön geformte Honigbrötchen wie die da!\n@c0@"
  en: "@aTuppence@bLet me tell you, you don't see honey buns as finely formed as that pair every day, you know.\n@c0@"
  es: "@aAlazar@bPermitidme que os diga algo, unos bollitos tan redonditos no se ven todos los días.\n@c0@"
  fr: "@aInnocent@bLaissez-moi vous dire une choseⓢ ce n'est pas tous les jours qu'on voit des gâteaux au miel aussi parfaitement réalisés que ces deux-là.\n@c0@"
  it: "@aSimon@bQuesti panini non sono affatto dolci comuni: in tutto il mondo non ce ne sono altri tanto squisiti!\n@c0@"
  ja: "@a@bピピン「あんなに　きれいに\n\t焼き印を押した　まんじゅうなんて\n\tそうは　ないと思いますけどね。\n@c0@"
340:
  de: "@aBianca@bIch hatte schon gehört, dass die Nachfrage nach Blitzendem Badesalz in letzter Zeit gestiegen war. Ist ja typisch, dass er der Grund dafür ist!\n@c0@"
  en: "@aBianca@bI'd heard there was a lot of demand for scintillatin' sinter just lately. How typical that he's the root of it!\n@c0@"
  es: "@aBianca@bHabía escuchado que la demanda de sales destellantes se había disparado. Era de esperar que él estuviera detrás de todo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'avais effectivement entendu dire qu'il y avait une grosse demande de sels scintillants, récemment.\nÇa ne m'étonne pas du tout qu'il en soit à l'origineⓠ\n@c0@"
  it: "@aBianca@bNaturalmente ⓕMister Modestiaⓖ non poteva perdere l'occasione di far notare come i sali da bagno scintillanti siano cari per tutti, tranne che per lui...\n@c0@"
  ja: "@a@bビアンカ「最近　秘湯の花を\n\tとりにくる人がいると思ったら\n\tあの人が　原因だったのね。\n@c0@"
341:
  de: "@aNera@bPapa sagt immer, wenn man mit Geld um sich wirft, ohne an die anderen zu denken, dann macht einen das am Ende kaputt.\n@c0@"
  en: "@aNera@bPapa always says that throwing money about without a thought for the people around you will destroy you in the end.\n@c0@"
  es: "@aNera@bIl mio papino sempre dice que malgastar el dinero sin pensare en los que te rodean acaba per conducirte a la ruina.\n@c0@"
  fr: "@aNera@bPapa dit toujours que jeter l'argent par les\r\nfenêtres sans avoir une pensée pour les gens\r\nqui vous entourent finit par vous détruire.\n@c0@"
  it: "@aNera@bQuest'uomo ha le mani bucate.\n@c0@"
  ja: "@a@bフローラ「人のことを考えない\n\tお金のつかい方は　身をほろぼすと\n\tお父さまが　言っていましたわ……。\n@c0@"
342:
  de: "@aNera@bMeinst du, dass bei diesem Mann alles gut gehen wird?\n@c0@"
  en: "@aNera@bDo you think that man's going to be alright?\n@c0@"
  es: "@aNera@b¿Tú crees que ese hombre acabará bene?\n@c0@"
  fr: "@aNera@bTu crois que tout ira bien pour cet hommeⓡ\n@c0@"
  it: "@aNera@bSe mio padre avesse speso i suoi soldi con tanta noncuranza, non sarebbe mai diventato un imprenditore di successo!\n@c0@"
  ja: "@a@bフローラ「あの方　大丈夫でしょうか？\n@c0@"
343:
  de: "@a%0%a001240@bEs ist falsch, alles für sich zu behalten. Man muss mit den anderen teilen.\n@c0@"
  en: "@a%0%a001240@bIt's wrong to keep everything for yourself.\nYou have to share.\n@c0@"
  es: "@a%0%a001240@bNo está bien guardárselo todo para uno mismo.\n¡Hay que compartir!\n@c0@"
  fr: "@a%0%a001240@bÇa n'est pas bien de tout garder pour soi.\nIl faut partager.\n@c0@"
  it: "@a%0%a001240@bSali da bagno?\nPerché quel tipo si lava con il sale?\nNon si dovrebbe usare il sapone per lavarsi?!\n@c0@"
  ja: "@a@b%a001240「何でも　ひとり占めは\n\tよくないと思うな。\n@c0@"
344:
  de: "@a%0%a001250@bWie viel hat er denn wohl gekauft, dass der Preis so sehr in die Höhe gegangen ist?\n@c0@"
  en: "@a%0%a001250@bHow much must he have bought to make the price go up so much?\n@c0@"
  es: "@a%0%a001250@bPero cuánto habrá comprado para que haya subido tanto el precio.\n@c0@"
  fr: "@a%0%a001250@bCombien il en a acheté pour que le prix augmente\nà ce point, tu pensesⓡ\n@c0@"
  it: "@a%0%a001250@bEcco perché i sali da bagno scintillanti sono tanto cari! Quel tipo deve averne acquistata una quantità enorme, facendo schizzare il prezzo alle stelle!\n@c0@"
  ja: "@a@b%a001250「値段が上がるほど\n\t買い占めるなんて……。\n@c0@"
345:
  de: "@aSancho@bSí. Als iss die Haut dieses Señors zum ersten Mal gesehen habe, dachte iss gleiss, dass sie wirkliss gut aussieht. Und nun weiß iss ja, wieso.\n@c0@"
  en: "@aSancho@bSí. When I first esee thees señor's eskin, I theenk to myself, the colour, ees eso good.\r\nNow I know the esecret.\n@c0@"
  es: "@aSancho@b¡Ándale! La primera vez que vi la piel de este señor, nomás pensé que tenía un color fantástico.\r\nAhorita sé por qué.\n@c0@"
  fr: "@aSancho@bSi. Quand j'ai vu ce señor pour la p-p-première fois, je me suis dit qu'il avait un teint r-resplendissant. Maintenant, je connais son secret.\n@c0@"
  it: "@aSancho@bLos salos scintillantes sono ottimos por fare el bagno, ma yo li utilizzo anche por condire la paella.\n¡Aggiungono un sabor unico al piatto!\n@c0@"
  ja: "@a@bサンチョ「はだの色つやが\n\tいいとは　思いましたが…\n\tそういうこと　だったんですね。\n@c0@"
346:
  de: "@aOtto@bLeute mit Geld faseln dauernd von ihrer Gesundheit, ist Euch das schon mal aufgefallen?\n@c0@"
  en: "@aTuppence@bPeople with money are always rabbiting on about their health, aren't they?\n@c0@"
  es: "@aAlazar@bLos ricos siempre están preocupados por su salud, ¿verdad?\n@c0@"
  fr: "@aInnocent@bLes gens qui ont de l'argent n'arrêtent pas\nde jacasser à propos de leur santé, vous ne trouvez pasⓡ\n@c0@"
  it: "@aSimon@bAh, fa il bagno con i sali scintillanti?\nStrano... A giudicare dai suoi commenti acidi avrei scommesso che usava lo yogurt andato a male...\n@c0@"
  ja: "@a@bピピン「お金のある人は\n\t健康に　うるさいですからねえ。\n@c0@"
347:
  de: "@aBianca@bEine Weile in der Wüste herumläuft? Pah! Ich wette, der ist in seinem ganzen Leben noch nie in der Wüste gewesen!\n@c0@"
  en: "@aBianca@bWander around in the desert? Pah! I'll bet he's never bin to the desert all his life!\n@c0@"
  es: "@aBianca@b¿Pasearse un ratito por el desierto? ¡Buah! Seguro que no ha estado en el desierto en su vida, ¿sabes?\n@c0@"
  fr: "@aBianca@bSe promener dans le désertⓡ Pfffⓠ Je parie qu'il\nn'y a jamais mis les pieds de toute sa vieⓠ\n@c0@"
  it: "@aBianca@bMa sentilo!\nFa tutto facile, lui!\n@c0@"
  ja: "@a@bビアンカ「砂漠中にある　だなんて…\n\tあの人　自分で砂漠に行ったことが\n\tないのかしら……。\n@c0@"
348:
  de: "@aNera@bWenn etwas rätselhaft ist, ist das doch Grund genug, es im Firlefanzeum auszustellen, oder nicht? Ich finde schon.\n@c0@"
  en: "@aNera@bSurely being mystifying is a good enough reason for it to be a famous knick-knack, isn't it? I think it is.\n@c0@"
  es: "@aNera@bSer desconcertante es una buona razón para que sea una cosina famosa, ¿sabes? Yo credo que sí.\n@c0@"
  fr: "@aNera@bÊtre ⓥsurprenantⓦ est en soi une raison suffisante pour devenir un objet de collection, nonⓡ\nMoi, je trouve.\n@c0@"
  it: "@aNera@bProprio perché la rosa del deserto è una meraviglia della natura abbiamo deciso di esporla al Museo del Souvenir!\n@c0@"
  ja: "@a@bフローラ「神秘的であるという　ことだけで\n\tじゅうぶん　名産品としての\n\t価値があると　思うのですが。\n@c0@"
349:
  de: "@a%0%a001240@bBeim bloßen Herumwandern findet man sie noch lange nicht. Sie sind sogar ziemlich schwer zu finden. Ich wette, er selbst hat noch nie eine gefunden.\n@c0@"
  en: "@a%0%a001240@bYou can't just wander about and find them.\nIt's quite hard, actually. I bet he's never found one.\n@c0@"
  es: "@a%0%a001240@bNo es solo cuestión de darse un paseito y encontrarlas.\n㈡\nDe hecho, es muy difícil. Seguro que él nunca ha encontrado una.\n@c0@"
  fr: "@a%0%a001240@bIl ne suffit pas de se promener pour en trouver. C'est assez difficile, en fait. Je parie qu'il n'en a jamais trouvé une seule.\n@c0@"
  it: "@a%0%a001240@bScommetto che quel signore non troverebbe una rosa del deserto nemmeno se passasse tutta la vita a scavare tra le dune! Ah ah ah!\n@c0@"
  ja: "@a@b%a001240「さばくのバラを\n\tさがすのは　けっこう　大変だよ。\n\t簡単じゃないよ。\n@c0@"
350:
  de: "@a%0%a001250@bEr ist noch nie selbst in der Wüste gewesen. Er kann also gar nicht wissen, wie schwierig es ist.\n@c0@"
  en: "@a%0%a001250@bHe's never been into the desert himself, so he doesn't know how difficult it is.\n@c0@"
  es: "@a%0%a001250@bComo nunca ha ido al desierto no sabe lo difícil que es estar allí.\n@c0@"
  fr: "@a%0%a001250@bIl n'est jamais allé dans le désert, de toute façon, alors il ne sait pas à quel point c'est difficile.\n@c0@"
  it: "@a%0%a001250@bMa che ne sa lui?!\nSecondo me non ha nemmeno idea di dove si trovi, il deserto!\n@c0@"
  ja: "@a@b%a001250「自分でとりに\n\t行ったことがないから\n\tさばくの大変さが　わからないのね。\n@c0@"
351:
  de: "@aSancho@bDie Wüste? Uff! Mir brisst schon der Schweiß aus, wenn iss das Wort nur höre!\n@c0@"
  en: "@aSancho@bThe desert? Uf! Just hearing thees word, eet\r\nmakes me esweat.\n@c0@"
  es: "@aSancho@b¿El desierto? ¡Uf! Solo de oírlo como que me entran los sudores.\n@c0@"
  fr: "@aSancho@bLe désertⓡ Pfiouⓠ Rien que d'entendre ce m-mot,\nje me mets à t-t-transpirer.\n@c0@"
  it: "@aSancho@b¿Desierto?\n¡Solo a sentirlo nominare comincio a sudar todo!\n¡Ay, que calor!\n@c0@"
  ja: "@a@bサンチョ「さばくですか。　聞くだけで\n\t汗がにじみ出てくるようです。\n@c0@"
352:
  de: "@aOtto@bEr scheint gar kein Interesse an Dingen zu haben, die keinen finanziellen Wert haben, egal wie geheimnisvoll oder ungewöhnlich sie auch sind.\n@c0@"
  en: "@aTuppence@bHe doesn't seem to be interested in anything unless it's got monetary value, no matter how mysterious or unusual it is.\n@c0@"
  es: "@aAlazar@bNo parece que le interese nada, por raro o misterioso que sea, que no tenga valor monetario.\n@c0@"
  fr: "@aInnocent@bIl n'a pas l'air de s'intéresser à quoi que ce soit\r\nsi ça n'a pas de valeur monétaire, même si c'est mystérieux ou inhabituel.\n@c0@"
  it: "@aSimon@bIo lo porterei nel deserto e ce lo lascerei per qualche annetto, quel tipo lì!\nPoi vediamo quante rose riesce a trovare!\n@c0@"
  ja: "@a@bピピン「価値がなければ　いくら\n\t神秘的な物でも　あの人にとっては\n\t意味がないんですね。\n@c0@"
353:
  de: "@aBianca@bEr wird wohl recht haben, aber das kann man auch ein bisschen netter sagen, oder etwa nicht?\n@c0@"
  en: "@aBianca@bI s'pose he's right, but he dun't have to be quite so rude about 'em, eh?\n@c0@"
  es: "@aBianca@bSupongo que tiene razón, pero tampoco hacía falta despreciarlos de esa manera, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a sans doute raison, mais il n'a pas besoin de le dire de manière aussi grossière, nonⓡ\n@c0@"
  it: "@aBianca@bSono d'accordo con lui: le medaglie di cioccolato non valgono certo una fortuna, però sono buonissime!\n@c0@"
  ja: "@a@bビアンカ「たしかに言うとおりだけど\n\tなんか　言い方に　トゲがあるのよね。\n@c0@"
354:
  de: "@aNera@bAlles, was man essen kann, ist mehr wert als alles Gold der Welt. Das hat mich Papa gelehrt.\n@c0@"
  en: "@aNera@bAnything you can eat is worth more than any amount of gold. That's what Papa always taught me.\n@c0@"
  es: "@aNera@bCualquier cosa di mangiare vale más que el oro. Eso es lo que me enseñó il mio papino.\n@c0@"
  fr: "@aNera@bTout ce qui se mange vaut nettement plus que n'importe quelle quantité d'or. C'est ce que papa\r\nm'a appris.\n@c0@"
  it: "@aNera@bNon so che darei per entrare in possesso della ricetta delle medaglie di cioccolato...\nSe l'avessi, preparerei quelle delizie ogni giorno!\n@c0@"
  ja: "@a@bフローラ「あんなもの　だなんて\n\t食べ物にたいして\n\tそんなことを言っては　いけませんわ。\n@c0@"
355:
  de: "@a%0%a001240@bIst mir doch egal, was er sagt. Mir gefallen die Schokomünzen, und basta!\n@c0@"
  en: "@a%0%a001240@bI don't care what he says. I like chocolate medalliyums, and that's that!\n@c0@"
  es: "@a%0%a001240@bMe da igual lo que diga. A mí me encantan los medallones de chocolate, y ya está.\n@c0@"
  fr: "@a%0%a001240@bJe m'en moque, de ce qu'il dit. Moi, j'aime les\nmédailles en chocolat, et puis c'est toutⓠ\n@c0@"
  it: "@a%0%a001240@bA me le medaglie di cioccolato piacciono tantissimo!\nSecondo me quel tipo ne parla male solo perché è a dieta e non può mangiarle...\n@c0@"
  ja: "@a@b%a001240「ボクは\n\tメダル型チョコ好きだから\n\tなんて言われても　へっちゃらだね。\n@c0@"
356:
  de: "@a%0%a001250@bBestimmt hat er es nur darauf angelegt, dass wir ihm all unsere Schokomünzen abgeben. Nur darum sagt er das!\n@c0@"
  en: "@a%0%a001250@bI bet he secretly wants us to give all our medalliyums to him. That's why he's saying that.\n@c0@"
  es: "@a%0%a001250@bSeguro que este lo que quiere es que le demos todos nuestros medallones de chocolate. Por eso dice esas cosas.\n@c0@"
  fr: "@a%0%a001250@bJe parie qu'en secret, il rêve qu'on lui donne toutes nos médailles en chocolat. C'est pour ça qu'il dit ça.\n@c0@"
  it: "@a%0%a001250@bScommetto che dice così solo perché vuole convincerci che le medaglie non valgono niente, così gliele regaliamo tutte!\n@c0@"
  ja: "@a@b%a001250「本当はおじさんも\n\tメダル型チョコ　ほしかったりして。\n@c0@"
357:
  de: "@aSancho@bDer eine mag Essen und der andere nisst. Weißt du, was iss meine?\n@c0@"
  en: "@aSancho@bOne man, he likes hees food, but hees brother,\r\nhe no likes eet. You know what I mean?\n@c0@"
  es: "@aSancho@bA un hombre pues le gusta una comida y a su compadre pues no. ¿Me entiendes, chamaco?\n@c0@"
  fr: "@aSancho@bOun homme peut aimer ce qu'il a d-d-dans son assiette, mais pas son frère. Tu vois ce que j-je veux direⓡ\n@c0@"
  it: "@aSancho@b¡Caramba, que idea! ¡La próxima vez que preparerò la paella ce aggiungerò un pocos de cioccolatos!\n¡Sarà esquisitas!\n@c0@"
  ja: "@a@bサンチョ「あのチョコは　たしか\n\t味が２種類ありましたよね。\n@c0@"
358:
  de: "@aOtto@bWertlos für ihn vielleicht. Schokoliebhaber sehen das bestimmt ganz anders! Die würden ihm was erzählen!\n@c0@"
  en: "@aTuppence@bWorthless to him, maybe, but I bet chocolate lovers would have something to say about that.\r\nThey'd be furious!\n@c0@"
  es: "@aAlazar@bPues no tendrán valor para él, pero seguro que los amantes del chocolate no están nada de acuerdo.\r\n¡Les sentaría como un cuerno!\n@c0@"
  fr: "@aInnocent@bElles ne valent peut-être pas grand-chose pour lui, mais les amateurs de chocolat auraient sans doute leur mot à dire là-dessus. Ils seraient furieuxⓠ\n@c0@"
  it: "@aSimon@bMagari per lui non valgono niente, ma per i buongustai di tutto il mondo le medaglie di cioccolato sono preziose... e deliziose!\n@c0@"
  ja: "@a@bピピン「価値がないなんて　言ったら\n\tチョコ好きな人に　怒られますよ。\n@c0@"
359:
  de: "@aBianca@bIch hatte vorher auch noch nie eine gesehen. Ich glaube nicht, dass schon viele Leute von ihnen gehört haben.\n@c0@"
  en: "@aBianca@bI'd never seen a maxi medal before neither.\r\nI doubt many folk know about 'em.\n@c0@"
  es: "@aBianca@bYo tampoco había visto nunca una maximedalla.\r\nDudo que haya mucha gente que sepa lo que es, ¿sabes?\n@c0@"
  fr: "@aBianca@bMoi non plus, je n'avais jamais vu de maxi médaille avant. Ça m'étonnerait que beaucoup de gens soient au courant de leur existence.\n@c0@"
  it: "@aBianca@bLe maximedaglie sono oggetti praticamente introvabili. Secondo me, la maggior parte delle persone ne ignora persino l'esistenza.\n@c0@"
  ja: "@a@bビアンカ「私も　大きなメダルなんて\n\t初めて見たもの。　あんなのがあるって\n\t知ってる人すら　少ないでしょうね。\n@c0@"
360:
  de: "@aNera@bPapa sammelt auch gern seltene Schätze, weißt du. Ich weiß, er hätte auch gern so eine. Da bin ich ganz sicher.\n@c0@"
  en: "@aNera@bPapa likes collecting rare treasures too, you know.\r\nI know he'd want one of these. I'm sure of it.\n@c0@"
  es: "@aNera@bAl mio papino también le gusta coleccionar tesoros extraños.\r\nEstoy sicura de que querría una de estas. ¡Sicuro!\n@c0@"
  fr: "@aNera@bPapa aussi aime collectionner les objets rares, tu sais. Je sais que ça lui plairait d'avoir une médaille comme ça. J'en suis certaine.\n@c0@"
  it: "@aNera@bMio padre è un collezionista di tesori e di opere d'arte. Sono certa che gli piacerebbe molto possedere un souvenir del genere...\n@c0@"
  ja: "@a@bフローラ「父は　めずらしい物を集めるのが\n\t好きなんです。　大きなメダルを見たら\n\tほしがるかも知れませんわ。\n@c0@"
361:
  de: "@a%0%a001240@bHinter denen war doch auch der alte Firle Franz her, oder? Die sind bestimmt total wertvoll.\n@c0@"
  en: "@a%0%a001240@bThis is what Old Man Nick Knack wanted too, isn't it? They must be really valuable.\n@c0@"
  es: "@a%0%a001240@bEsto era lo que quería el abuelo Nino también, ¿verdad? Deben de ser muy valiosas.\n@c0@"
  fr: "@a%0%a001240@bC'est aussi ce que voulait le vieux Bricabrac, nonⓡ Ça doit vraiment avoir beaucoup de valeur.\n@c0@"
  it: "@a%0%a001240@bAnche il vecchio Geremia ha un debole per quest'oggetto.\nÈ un souvenir veramente prezioso...\n@c0@"
  ja: "@a@b%a001240「あれって　デスじいさんも\n\tほしがってた物だもん。\n\t大きなメダルは　貴重なんだよね。\n@c0@"
362:
  de: "@a%0%a001250@bSie sind auf jeden Fall viel zu groß für eine Schatzsuche. Die würden ja hinter allem hervorlugen!\n@c0@"
  en: "@a%0%a001250@bThey're definitely too big to play treasure hunting with. You'd see them sticking out behind anything!\n@c0@"
  es: "@a%0%a001250@bDesde luego son muy grandes para jugar a la busca del tesoro con ellas. Es que se las vería en cualquier lado.\n@c0@"
  fr: "@a%0%a001250@bElles sont effectivement trop grandes pour\norganiser une chasse au trésor avec. Impossible\nde les cacher, on les verrait tout de suiteⓠ\n@c0@"
  it: "@a%0%a001250@bCerto che le maximedaglie sono davvero... maxi!\nSolo un gigante potrebbe appuntarsene una sul petto! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「あんなに　大きいんじゃ\n\t宝さがしって感じが　しないと思うな。\n@c0@"
363:
  de: "@aSancho@bSie ist sehr groß, nisst wahr? Vielleisst ist sie groß genug, dass du sie verwenden kannst wie einen Schild, no?\n@c0@"
  en: "@aSancho@bEes very beeg, eh? Maybe ees beeg enough eso you can use eet like a shield, no?\n@c0@"
  es: "@aSancho@bEs retegrandota, ¿eh? Igual pues es tan grande que la puedes usar de escudo.\n@c0@"
  fr: "@aSancho@bElle est t-t-très grosse, heinⓡ Peut-être\nmême assez pour p-pouvoir être utilisée\ncomme bouclier, noⓡ\n@c0@"
  it: "@aSancho@b¿Las maximedaglias sono talmente grandes y resistentes que potrebbero essere utilizzatas como escudos, eh? \n@c0@"
  ja: "@a@bサンチョ「う～ん　盾とかにも\n\t使えそうなくらい　大きいですな。\n@c0@"
364:
  de: "@aOtto@bAllmählich verstehe ich, warum der alte Firle Franz so eine unbedingt haben wollte.\n@c0@"
  en: "@aTuppence@bI'm starting to understand why Old Man Nick Knack wanted one of these so badly now.\n@c0@"
  es: "@aAlazar@bAhora empiezo a comprender por qué el abuelo Nino estaba tan desesperado por conseguir una de estas.\n@c0@"
  fr: "@aInnocent@bJe commence à comprendre pourquoi le vieux Bricabrac tenait tellement à en avoir une.\n@c0@"
  it: "@aSimon@bEsatto: le maximedaglie sono rarissime e preziose.\nÈ per questo motivo che il vecchio Geremia ne va matto!\n@c0@"
  ja: "@a@bピピン「これで　デスじいさんが\n\tほしがってた　理由がなんとなく\n\tわかりましたね。\n@c0@"
365:
  de: "@aBianca@bJeder seiner Angestellten bekommt einen? Die haben's gut, was?\n@c0@"
  en: "@aBianca@bSo every member of his staff gets one?\r\nThey have it pretty easy, eh?\n@c0@"
  es: "@aBianca@b¿Así que le da una a todos los miembros de su personal?\r\nPues menuda suerte, ¿no?\n@c0@"
  fr: "@aBianca@bAlors chacun des membres de son équipe en possède uneⓡ Ils ne sont pas à plaindre, heinⓡ\n@c0@"
  it: "@aBianca@bUna bussola delle nevi per ciascun membro del gruppo?! Corbezzoli!\nA questo tipo piace fare le cose in grande!\n@c0@"
  ja: "@a@bビアンカ「使用人さんにコンパスを？　\n\tけっこう　いいところあるじゃない。\n@c0@"
366:
  de: "@aNera@bIch wäre nicht gern bei ihm angestellt.\n@c0@"
  en: "@aNera@bI wouldn't like to be a member of his staff.\n@c0@"
  es: "@aNera@bNo me gustaría ser parte del suo personal.\n@c0@"
  fr: "@aNera@bJe n'aimerais pas faire partie de son équipe.\n@c0@"
  it: "@aNera@bBussola o non bussola, non mi piacerebbe viaggiare con quest'uomo.\nÈ troppo borioso!\n@c0@"
  ja: "@a@bフローラ「あの方のもとで\n\tはたらいている方たちは\n\t大変そうですね。\n@c0@"
367:
  de: "@a%0%a001240@bAber man muss ihn doch nicht unbedingt an einem Berg benutzen, oder? Man kann ihn doch sicher auch noch anderswo benutzen?\n@c0@"
  en: "@a%0%a001240@bYou don't have to use it up a mountain though, do you? You can use it in other places too, can't you?\n@c0@"
  es: "@a%0%a001240@bNo hay que usarlas en las montañas, ¿verdad? Se pueden usar en otros sitios, ¿no?\n@c0@"
  fr: "@a%0%a001240@bMais on n'est pas obligé de s'en servir au sommet d'une montagne, heinⓡ On peut l'utiliser dans d'autres endroits aussi, nonⓡ\n@c0@"
  it: "@a%0%a001240@bLe bussole delle nevi possono essere usati in diversi posti, non solo in montagna. Chissà come mai hanno scelto di dar loro questo nome...\n@c0@"
  ja: "@a@b%a001240「あのコンパスは　山歩き以外でも\n\t使えるんだよね？\n@c0@"
368:
  de: "@a%0%a001250@bHeißt das, dass die Leute, die für diesen Mann arbeiten, oft auf Berge steigen müssen?\n@c0@"
  en: "@a%0%a001250@bDoes that mean the people who work for that man have to climb mountains a lot?\n@c0@"
  es: "@a%0%a001250@b¿Quiere decir que la gente que trabaja para este hombre tiene que escalar un montón?\n@c0@"
  fr: "@a%0%a001250@bEst-ce que ça veut dire que les gens qui travaillent pour cet homme doivent souvent escalader des montagnesⓡ\n@c0@"
  it: "@a%0%a001250@bCredo di aver capito come fa questo tipo ad avere tanti oggetti rari e preziosi...\n@c0@"
  ja: "@a@b%a001250「あの人の　使用人さんは\n\tお仕事で　山の方まで行くの？\n@c0@"
369:
  de: "@a%0%a001250@bWahrscheinlich schafft er es deswegen, seltenen Firlefanz aus der ganzen Welt zu sammeln.\n@c0@"
  en: "@a%0%a001250@bI suppose that's how he manages to collect rare knick-knacks from all over the world.\n@c0@"
  es: "@a%0%a001250@bSupongo que será así como logra conseguir cosinas de todo el mundo.\n@c0@"
  fr: "@a%0%a001250@bÇa doit être comme ça qu'il arrive à récupérer\ndes objets rares du monde entier.\n@c0@"
  it: "@a%0%a001250@bHa un gruppo di persone che gira il mondo alla ricerca di ciò che gli interessa! Proprio come facciamo noi per quel pigrone di Geremia...\n@c0@"
  ja: "@a@b%a001250「もしかして　そうやって\n\t世界中の　めずらしい物を\n\t集めさせているのかな？\n@c0@"
370:
  de: "@aSancho@bDieser Señor, er gibt allen, die für ihn arbeiten, einen Kompass? Es klingt so, als würde er sehr abgelegen wohnen, nisst wahr?\n@c0@"
  en: "@aSancho@bThees señor, he geeves all the people who work for heem the compass? Eet esounds like he leeves esomewhere very remote, eh?\n@c0@"
  es: "@aSancho@b¿Este señor le da a toditos sus empleados una brújula? Pues vivirá retelejos, ¿no?\n@c0@"
  fr: "@aSancho@bCe señor donne oune boussole à tous ceux\nqui t-t-travaillent pour luiⓡ Il a l'air de vivre\nt-t-très loin, noⓡ\n@c0@"
  it: "@aSancho@b¿El señor dà una bussola delle nevi a todos los componentes del suo gruppo?\n¡Ay, que persona generosa!\n@c0@"
  ja: "@a@bサンチョ「使用人の人たちに　コンパスを\n\t持たせているとは。　あの方の家は\n\tどこか　遠くにあるのですかね？\n@c0@"
371:
  de: "@aOtto@bIch dachte, diese Bussolinger Kompasse seien nicht mehr zu bekommen? Was meint Ihr, wie viele dieser Mann hat?\n@c0@"
  en: "@aTuppence@bI thought we were told you can't get hold of these Batten binnacles any more. How many do you think this man has got?\n@c0@"
  es: "@aAlazar@bCreía que nos habían dicho que ya no se pueden conseguir bitácoras de Habs. ¿Cuántas tendrá este hombre?\n@c0@"
  fr: "@aInnocent@bJe croyais avoir compris qu'on ne trouvait plus de boussoles de Técarlo. Combien croyez-vous que\ncet homme en possèdeⓡ\n@c0@"
  it: "@aSimon@bEcco perché le bussole delle nevi sono diventate tanto rare! Le ha comprate tutte il nostro amico ⓕsignor posseggotuttoⓖ per darle ai suoi servitori!\n@c0@"
  ja: "@a@bピピン「コンパスは　もう　手に入らないと\n\t言われてるのに…　あの人は\n\tいったい　いくつ持ってるんでしょう？\n@c0@"
372:
  de: "@aBianca@bAber unser Monsterschachspiel wurde von einem berühmten Kunsthandwerker angefertigt!\n@c0@"
  en: "@aBianca@bBut our monster chess set was made by a\r\nfamous craftsman!\n@c0@"
  es: "@aBianca@bPero si nuestro juego de monstriajedrez lo hizo un afamado artesano.\n@c0@"
  fr: "@aBianca@bMais notre jeu d'échecs monstrueux a été fabriqué par un célèbre artisanⓠ\n@c0@"
  it: "@aBianca@bOh, ma certo!\nOvviamente, la SUA scacchiera è migliore della NOSTRA...\n@c0@"
  ja: "@a@bビアンカ「でも　私たちの\n\tモンスターチェスは　名工が作ったと\n\tいわれてるものだもの。\n@c0@"
373:
  de: "@aBianca@bEr hat bestimmt kein besseres zu Hause!\n@c0@"
  en: "@aBianca@bThere's no way the one he has at home can be better!\n@c0@"
  es: "@aBianca@b¡Es imposible que el que tiene en casa sea mejor!\n@c0@"
  fr: "@aBianca@bC'est impossible que celui qu'il possède chez lui soit plus beauⓠ\n@c0@"
  it: "@aBianca@bBah, che razza di sbruffone...\n@c0@"
  ja: "@a@bビアンカ「あれ以上に　すばらしいできの\n\tチェスなんて　そうそう　ないわよね。\n@c0@"
374:
  de: "@aNera@bEs klingt, als würde seine Sammlung Fundstücke aus der ganzen Welt enthalten.\n@c0@"
  en: "@aNera@bIt sounds like his collection includes items from every corner of the world.\n@c0@"
  es: "@aNera@bSembra que la sua colección tiene cosas de tutti los rincones del mondo.\n@c0@"
  fr: "@aNera@bOn dirait que sa collection privée comprend\r\ndes objets venus des quatre coins du monde.\n@c0@"
  it: "@aNera@bQuel tipo dice di avere una scacchiera più bella di questa?\nHah! Ci crederò quando la vedrò!\n@c0@"
  ja: "@a@bフローラ「あの方は　ずいぶんと\n\tはば広く　品物を\n\t集めているみたいですね。\n@c0@"
375:
  de: "@a%0%a001240@bJa! Humburgs Schnickschnack ist der beste! Nichts geht über Monsterschach!\n@c0@"
  en: "@a%0%a001240@bYeah! Gotha's knick-knack's the best!\nYou can't beat monster chess!\n@c0@"
  es: "@a%0%a001240@b¡Sí! ¡Las cosinas de Pankraz son las mejores!\n¡No se puede superar un juego de monstriajedrez!\n@c0@"
  fr: "@a%0%a001240@bOuaisⓠ Les objets de collection de Gotha sont\nles meilleursⓠ Le jeu d'échecs monstrueux\nest imbattableⓠ\n@c0@"
  it: "@a%0%a001240@bIl souvenir di Denim è il più bello del mondo!\nNon esiste niente di meglio della scacchiera dei mostri!\n@c0@"
  ja: "@a@b%a001240「なんてったって\n\tグランバニアの名産だもん。　ボクは\n\tモンスターチェスがいちばん好きだよ！\n@c0@"
376:
  de: "@a%0%a001250@bDie Monsterschachspiele sind wirklich gut gemacht, nicht? Die Monster sehen alle so echt aus.\n@c0@"
  en: "@a%0%a001250@bThe monster chess sets are really well-made, aren't they? The monsters all look so real.\n@c0@"
  es: "@a%0%a001250@bLos juegos de monstriajedrez están muy bien hechos, ¿no? Todos los monstruos parecen de verdad.\n@c0@"
  fr: "@a%0%a001250@bLes pièces du jeu d'échecs monstrueux sont vraiment bien faites, heinⓡ Tous les monstres ont l'air si vrais.\n@c0@"
  it: "@a%0%a001250@bQuesta scacchiera dei mostri è veramente fantastica! I pezzi sono realizzati con un livello di dettaglio incredibile!\n@c0@"
  ja: "@a@b%a001250「モンスターチェスって\n\tすごく　よくできてるのよね……。\n\t魔物さんたちが　いきいきしてるの。\n@c0@"
377:
  de: "@aSancho@bMeinst du, dass dieser Señor in Humburg war, um siss dort ein Monsterschachspiel zu besorgen?\n@c0@"
  en: "@aSancho@bYou theenk thees señor, he went to Gotha to buy a monster chess eset for heemself?\n@c0@"
  es: "@aSancho@b¿Iría este señor a Pankraz a comprar un juego de monstriajedrez?\n@c0@"
  fr: "@aSancho@bTu crois que ce señor est allé à Gotha p-p-pour s'acheter oun jeu d'échecs pour luiⓡ\n@c0@"
  it: "@aSancho@bNo pienso que quell'hombre possegga una scacchiera más bella de la nuestra...\n@c0@"
  ja: "@a@bサンチョ「あの方　グランバニアで\n\tモンスターチェスを\n\t買われたんでしょうか？\n@c0@"
378:
  de: "@aSancho@bDas ist komisch. Iss glaube, der Kunsthandwerker, der die Schachspiele angefertigt hat, hat gerade genug für die Burg gemacht und nisst mehr.\n@c0@"
  en: "@aSancho@bEes estrange. I believe thees artisan who made the chess esets, he made just enough for the castle and no more.\n@c0@"
  es: "@aSancho@bEs bien raro. Creía que el artesano que los hacia solo hizo los justitos para el castillo y ya.\n@c0@"
  fr: "@aSancho@bC'est b-b-bizarre. Je croyais que l'artisan qui avait fait ce jeu en avait fait juste assez p-p-pour le château et pas plus.\n@c0@"
  it: "@aSancho@bYo soy seguro que manderà qualche servitores a Denim por comprare una escacchiera de los mostros...\n@c0@"
  ja: "@a@bサンチョ「名工が作った\n\tモンスターチェスは\n\t数えるほどしか　ないはずですが……。\n@c0@"
379:
  de: "@aOtto@bTja, wenigstens findet das Spiel, auf das mein Vater so wild war, endlich ein wenig Anerkennung!\n@c0@"
  en: "@aTuppence@bWell at least the game my father was so crazy about is getting some recognition at last!\n@c0@"
  es: "@aAlazar@bBueno, al menos el juego que tanto le gustaba a mi padre empieza a recibir cierto reconocimiento.\n@c0@"
  fr: "@aInnocent@bEnfin, le jeu dont mon père était si fou est reconnu\nà sa juste valeurⓠ\n@c0@"
  it: "@aSimon@bMio padre e i suoi commilitoni maturarono una vera ossessione per questi scacchi. In effetti, fanno venire voglia di giocare solo a guardarli...\n@c0@"
  ja: "@a@bピピン「いちおう　ボクの父がのこした\n\tチェスは　価値を　みとめてもらえたと\n\tいうことでしょうか？\n@c0@"
380:
  de: "@aBianca@bÜberladen! Das sagt er bestimmt bloß, weil er kein eigenes Exemplar hat, mit dem er angeben kann.\n@c0@"
  en: "@aBianca@bHe's prob'ly only callin' it gaudy because he dun't have one of his own to boast about.\n@c0@"
  es: "@aBianca@bLos estará llamando chabacanos porque no tiene unos iguales de los que presumir, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl dit sûrement que c'est tape-à-l'œil juste parce qu'il n'en a pas lui-même un exemplaire dont il\r\npeut se vanter.\n@c0@"
  it: "@aBianca@bUhm, ha riconosciuto i ⓕSalmi del Sollievoⓖ del Picco Maximo.\nBeh, questo tizio è davvero un intenditore...\n@c0@"
  ja: "@a@bビアンカ「どこかに　やましい気持ちが\n\tあるから　気品のある物には\n\tきょうみ　ないんじゃない？\n@c0@"
381:
  de: "@aNera@bÜberladen? Wenn hier was überladen ist, dann die Art, wie der Mann sich ausdrückt!\n@c0@"
  en: "@aNera@bGaudy? If there's anything gaudy here, it's the way that man speaks!\n@c0@"
  es: "@aNera@b¿Chabacana? Ma aquí lo único chabacano es come habla este uomo.\n@c0@"
  fr: "@aNera@bTape-à-l'œilⓡ S'il y a quelque chose de\ntape-à-l'œil, c'est bien sa façon de parlerⓠ\n@c0@"
  it: "@aNera@bAh, quante chiacchiere inutili!\nQuesto libro è un'opera d'arte, punto e basta!\n@c0@"
  ja: "@a@bフローラ「イヤミなくらい…　だなんて\n\tあの方のほうが　ずっと\n\tイヤミなこと　おっしゃってますわ！\n@c0@"
382:
  de: "@a%0%a001240@bDas ist doch Omas Buch! Klar ist es viel wert! Allerdings... macht es das für ihn wohl noch nicht wertvoll.\n@c0@"
  en: "@a%0%a001240@bThat's Grandma's book! Of course it's worth a lot.\nAlthough...I suppose that doesn't make it worth a\nlot to him.\n@c0@"
  es: "@a%0%a001240@b¡Ese es el libro de la abuela! Claro que tiene mucho valor.\n㈡\nAunque... supongo que eso no lo hace valioso a sus ojos.\n@c0@"
  fr: "@a%0%a001240@bC'est le livre de grand-mèreⓠ Évidemment qu'il a beaucoup de valeur. Mais bon... ce n'est pas\nle genre de valeur qu'il apprécie.\n@c0@"
  it: "@a%0%a001240@bQuello è il libro di mia nonna!\nForse per lui sarà solo un oggetto di valore, ma per me è un oggetto dal significato inestimabile!\n@c0@"
  ja: "@a@b%a001240「あれは　おばあちゃんも読んだ\n\t本なのに……。　でも　あの人には\n\tそういう思い出とか　関係ないんだね。\n@c0@"
383:
  de: "@a%0%a001250@bEr sollte keine gemeinen Sachen über Steile Höh oder über Oma sagen. Das ist nicht nett.\n@c0@"
  en: "@a%0%a001250@bHe shouldn't say mean things about Lofty Peak or about Grandma. It's not nice.\n@c0@"
  es: "@a%0%a001250@bNo debería decir cosas malas sobre Cumbre Excelsa o la abuela. No está bien.\n@c0@"
  fr: "@a%0%a001250@bIl ne devrait pas dire du mal de Haute Cime ou de grand-mère. Ça n'est pas gentil.\n@c0@"
  it: "@a%0%a001250@bSolo a una persona totalmente priva di buon gusto può non piacere un capolavoro del genere...\n@c0@"
  ja: "@a@b%a001250「おばあちゃんの　ふるさとの\n\t名産品を　あんなふうに言うなんて\n\tひどいです。\n@c0@"
384:
  de: "@aSancho@bVielleisst sollten wir diesem Señor lieber doch nisst unseren Schnickschnack zeigen, eh?\n@c0@"
  en: "@aSancho@bMaybe ees best eef we no eshow thees señor our knick-knacks, eh?\n@c0@"
  es: "@aSancho@bPues igual mejor no le enseñamos más cosinas a este señor, ¿no?\n@c0@"
  fr: "@aSancho@bÇa serait p-p-peut-être mieux de ne pas m-montrer notre bric-à-brac à ce señor.\n@c0@"
  it: "@aSancho@b¡Ay, esto señor apprezza solo el valore economico de los souvenir...!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　もう　あの者に\n\t貴重なものを見せるのは\n\tやめませんか？\n@c0@"
385:
  de: "@aSancho@bEr macht uns unsere kostbaren Erinnerungen nur madig.\n@c0@"
  en: "@aSancho@bHe ees just making our precious memories dirty.\n@c0@"
  es: "@aSancho@bNomás que está manchando nuestros preciosos recuerdos.\n@c0@"
  fr: "@aSancho@bTout ce qu'il fait, c'est salir nos p-p-précieux souvenirs.\n@c0@"
  it: "@aSancho@bMe fa passare la voglia de mostrargli los nuestros preziosos oggettos...\n@c0@"
  ja: "@a@bサンチョ「なんだか　きれいな思い出が\n\tけがされるような気がしてきましたよ。\n@c0@"
386:
  de: "@aOtto@bIch wette, das hat Euch ein wenig aufgebracht, was, %a000090?\n@c0@"
  en: "@aTuppence@bI bet that's got you a bit riled, hasn't it, %a000090?\n@c0@"
  es: "@aAlazar@bSupongo que eso os habrá ofendido, ¿verdad, %a000090?\n@c0@"
  fr: "@aInnocent@bJe suis sûr que ça vous a un peu énervé,\nhein, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, i commenti di quest'uomo mi stanno innervosendo...\n@c0@"
  ja: "@a@bピピン「もしかして　%a000090さま\n\tちょっと　怒ってらっしゃいます？\n@c0@"
387:
  de: "@aOtto@bIch kann's Euch net verdenken, so wie er über Königin Magdas kostbares Buch g'sprochen hat.\n@c0@"
  en: "@aTuppence@bI don't blame you, the way he's talking about Queen Mada's treasured book like that.\n@c0@"
  es: "@aAlazar@bNo es de extrañar, teniendo en cuenta como habla del amado libro de la reina Perséfone.\n@c0@"
  fr: "@aInnocent@bJe vous comprends. Quand on l'entend parler comme ça du précieux livre de la reine Magdalena...\n@c0@"
  it: "@aSimon@bAvrebbe dovuto usare parole più rispettose per descrivere il prezioso libro della regina Mada.\nSe vuole, gli tiro un pugno sul naso...\n@c0@"
  ja: "@a@bピピン「そうですよね…\n\t太后さまの　ふるさとの品物を\n\tあんなふうに……。\n@c0@"
388:
  de: "@aBianca@bWenn der wüsste, dass er vom Yggdrasil-Baum stammt, was?\n@c0@"
  en: "@aBianca@bHe'd be eatin' his words if he knew it come from the Yggdrasil tree, eh?\n@c0@"
  es: "@aBianca@bSe tragaría sus propias palabras si supiera que es del árbol Yggdrasil, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl regretterait ce qu'il vient de dire s'il savait que cette pousse est celle de l'Yggdrasil, heinⓡ\n@c0@"
  it: "@aBianca@bEh eh eh!\nNemmeno lui sa che questo tesoro viene dal mitico Albero di Ygdrasil!\n@c0@"
  ja: "@a@bビアンカ「あの人　あれが\n\t世界樹の苗木って　わかったら\n\tきっと　おどろくんでしょうけど……。\n@c0@"
389:
  de: "@aNera@bWenn man ein Gespür dafür hat, kann man es fühlen. Man kann die seltsame Kraft spüren, die von dem Schössling ausgeht.\n@c0@"
  en: "@aNera@bIf you're the right kind of person, you can feel it. You can feel the strange power radiating from\r\nthe sapling.\n@c0@"
  es: "@aNera@bSi eres el tipo de persona adecuado, veramente lo puedes sentir. Puedes sentir el extraño poder que irradia el retoño.\n@c0@"
  fr: "@aNera@bCertaines personnes sont capables de le sentir.\r\nElles peuvent percevoir l'étrange pouvoir qui\r\némane de cette pousse.\n@c0@"
  it: "@aNera@bPoveretto, mi fa pena.\nNon a tutti è dato percepire l'immenso potere che promana da quel magico virgulto...\n@c0@"
  ja: "@a@bフローラ「わかる人には\n\t感じていただけると思いますわ。\n\tあの苗木が発する　ふしぎなチカラを。\n@c0@"
390:
  de: "@a%0%a001240@bIch würde zu gern sein Gesicht sehen, wenn er herausfindet, was das für ein Schössling ist.\n@c0@"
  en: "@a%0%a001240@bI'd really like to see that man's face when he finds out exactly what this sapling is.\n@c0@"
  es: "@a%0%a001240@bMe encantaría ver la cara que se le queda cuando se entere de lo que es este retoño.\n@c0@"
  fr: "@a%0%a001240@bJ'adorerais voir la tête de ce type quand il découvrira de quelle pousse il s'agit exactement.\n@c0@"
  it: "@a%0%a001240@bMi piacerebbe vedere che faccia farebbe quel tipo se sapesse da dove viene il virgulto...\n@c0@"
  ja: "@a@b%a001240「なんとか　あの人を\n\tあっ　と言わせたいなあ。\n@c0@"
391:
  de: "@a%0%a001250@bEr sieht nichts als einen winzigen Spross. Er weiß nicht, dass diesem eine mächtige Lebenskraft innewohnt.\n@c0@"
  en: "@a%0%a001250@bAll he sees is a tiny shoot. He doesn't know it holds a powerful life force.\n@c0@"
  es: "@a%0%a001250@bSolo ve un retoño. No se da cuenta de que encierra una poderosa fuerza vital.\n@c0@"
  fr: "@a%0%a001250@bTout ce qu'il voit, c'est une pousse minuscule.\nIl ne sait pas qu'elle renferme une force de vie exceptionnelle.\n@c0@"
  it: "@a%0%a001250@bQuell'uomo non vede altro che un virgulto e, siccome non è un oggetto di valore, non ne percepisce tutta la grandezza. Peggio per lui.\n@c0@"
  ja: "@a@b%a001250「小さな苗木だけど\n\tすごい　命のいぶきに　包まれてるのが\n\tあの人には　わからないのかな……。\n@c0@"
392:
  de: "@aSancho@bWeißt du, dein Onkel Sancho, er ist auch nisst so sisser.\n@c0@"
  en: "@aSancho@bYou know, your Uncle Sancho, he ees no eso esure, either.\n@c0@"
  es: "@aSancho@bPues sabes, tu tito Sancho tampoco está muy seguro.\n@c0@"
  fr: "@aSancho@bTu sais, tonton Sancho n'en est pas sûr, lui non plus.\n@c0@"
  it: "@aSancho@b¡Ay, que ignoranton!\n@c0@"
  ja: "@a@bサンチョ「まあ　私も　正直\n\t信じられませんからねえ。\n@c0@"
393:
  de: "@aSancho@bEr soll vom Yggdrasil-Baum in Zenithia stammen, aber iss kann es nisst so resst glauben.\n@c0@"
  en: "@aSancho@bEes esupposed to be from the Yggdrasil tree een Zenithia, but I no believe eet.\n@c0@"
  es: "@aSancho@bSe supone que proviene del árbol Yggdrasil de Zenithia, pero yo como que no me lo acabo de creer.\n@c0@"
  fr: "@aSancho@bElle est censée v-venir de l'Yggdrasil de Zénithia,\r\nma j'ai du m-mal à le croire.\n@c0@"
  it: "@aSancho@b¿Como es posible que no ha reconosciuto el virgulto proveniente dal fantastico Albero de Ygdrasil?\n@c0@"
  ja: "@a@bサンチョ「あれが　天空城にあった\n\t世界樹の苗木だなんて……。\n@c0@"
394:
  de: "@aOtto@bIch wett', wenn er wüsst', dass das ein Schössling des Weltenbaums ist, würd' er seine Meinung ändern. Dann würd' er dafür ein kleines Vermögen bieten.\n@c0@"
  en: "@aTuppence@bI bet if he knew it was a sapling of the Great World Tree, he'd change his tune. He'd pay a small fortune for it then.\n@c0@"
  es: "@aAlazar@bSi supiera que es un retoño del Gran Árbol del Mundo, otro gallo le cantaría. Entonces pagaría una pequeña fortuna por él.\n@c0@"
  fr: "@aInnocent@bJe parie que s'il savait que c'est une pousse du Grand arbre du Monde, il changerait de ton.\r\nIl paierait une petite fortune pour ça.\n@c0@"
  it: "@aSimon@bⓕUn virgulto del genere non vale nullaⓖ? Scommetto che pagherebbe un patrimonio per averlo, se sapesse che proviene dal Grande Albero del Mondo!\n@c0@"
  ja: "@a@bピピン「あれが　世界樹の苗木だって\n\t知ったら　大金はたいて\n\t買おうとしますよ。　あの人……。\n@c0@"
395:
  de: "@aBianca@bSolche Stücke machen doch die Ausstellung erst richtig interessant, oder etwa nicht?\n@c0@"
  en: "@aBianca@bIt's havin' stuff like that on display that makes this place so amazin', eh?\n@c0@"
  es: "@aBianca@bEs tener cosas así expuestas lo que hace de este lugar un sitio alucinante, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est d'avoir des choses comme celles-ci\nen exposition qui rend cet endroit si\nincroyable, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bSì, i virgulti di Ygdrasil sono estremamente difficili da trovare.\n@c0@"
  ja: "@a@bビアンカ「その貴重な品物を　置けるから\n\tここの博物館は　すごいのよね！\n@c0@"
396:
  de: "@aNera@bDa hat er recht. Das ist sehr selten.\n@c0@"
  en: "@aNera@bHe's right about that. It is very rare.\n@c0@"
  es: "@aNera@bÈ vero. No se ve tutti los días.\n@c0@"
  fr: "@aNera@bIl a raison. C'est très rare.\n@c0@"
  it: "@aNera@bOggetti del genere non si vedono certo tutti i giorni!\n@c0@"
  ja: "@a@bフローラ「たしかに　ふつうの人には\n\t手に入れられませんもの。\n@c0@"
397:
  de: "@aNera@bSiehst du, der alte Firle Franz hat eben doch recht daran getan, dich als Kurator einzusetzen.\n@c0@"
  en: "@aNera@bOld Man Nick Knack was right to pick you as curator, you see.\n@c0@"
  es: "@aNera@bEl nono Nino acertó al nombrarte gestor.\n@c0@"
  fr: "@aNera@bLe vieux Bricabrac a eu raison de te choisir comme conservateur.\n@c0@"
  it: "@aNera@bSolo un grande direttore poteva arricchire la collezione del Museo del Souvenir con un tesoro simile...\n@c0@"
  ja: "@a@bフローラ「デスじいさんが\n\tあなたを館長に　えらんだのは\n\t正しかったような気がします……。\n@c0@"
398:
  de: "@a%0%a001240@bWenn er versuchen würde, eines der Blätter zu benutzen, wüsste er es genau.\n@c0@"
  en: "@a%0%a001240@bHe'd know for sure if he tried using one of\nthe leaves.\n@c0@"
  es: "@a%0%a001240@bEstaría seguro si usara una de las hojas.\n@c0@"
  fr: "@a%0%a001240@bIl n'aurait plus de doutes s'il essayait d'utiliser l'une de ses feuilles.\n@c0@"
  it: "@a%0%a001240@bChe bello il nostro virgulto di Ygdrasil, eh?\n@c0@"
  ja: "@a@b%a001240「あの葉っぱを　つかえば\n\tわかるんだけどな……。\n@c0@"
399:
  de: "@a%0%a001250@bDas ist mein Schössling! Ich habe mich darum gekümmert und dafür gesorgt, dass er gedeiht. Noch mal bekommt der ihn nicht zu sehen!\n@c0@"
  en: "@a%0%a001250@bIt's my sapling! I looked after it and helped it grow.\nI'm not showing it to him again!\n@c0@"
  es: "@a%0%a001250@b¡Es mi retoño! Yo lo he cuidado y lo he ayudado a crecer.\n¡No se lo pienso volver a enseñar!\n@c0@"
  fr: "@a%0%a001250@bC'est ma pousseⓠ Je m'en suis occupée et je l'ai aidée à grandir. Je ne veux pas lui montrer une deuxième foisⓠ\n@c0@"
  it: "@a%0%a001250@bSe quel villanzone dirà solo un'altra parola sul nostro virgulto di Ygdrasil, gli annoderò la lingua intorno al collo a mo' di sciarpa!\n@c0@"
  ja: "@a@b%a001250「わたしが　だいじに育ててる\n\t苗木なのに……。\n\tもう　あの人に　見せてあげないもん！\n@c0@"
400:
  de: "@aSancho@bMeinst du, es geht in Ordnung, hier etwas auszustellen, was dieser Señor noch nisst selbst hat? Vielleisst wird er neidisch, nisst?\n@c0@"
  en: "@aSancho@bYou theenk ees okay to put esometheeng thees señor no have heemself on display here? Maybe he ees gonna be jealous, eh?\n@c0@"
  es: "@aSancho@b¿Crees que estará bien exhibir algo que ni este señor tiene? Pues igual se nos pone celosón, ¿eh?\n@c0@"
  fr: "@aSancho@bTu c-c-crois que c'est bien de mettre en exposition oune chose que ce señor ne possède pas lui-mêmeⓡ Il risquerait d'être j-j-jaloux, noⓡ\n@c0@"
  it: "@aSancho@bEsto señor es muy invidiosos...\nYo no me fiderei a mostrargli qualcosas que lui no possiede...\n@c0@"
  ja: "@a@bサンチョ「自分が持っていないのに\n\t博物館に　展示されてることが\n\t許せないのでしょうね。\n@c0@"
401:
  de: "@aOtto@bEr hat wirklich kein Auge für Schnickschnack, oder? Spürt er denn net die mächtige Aura, die von ihm ausgeht?\n@c0@"
  en: "@aTuppence@bHe hasn't got an eye for knick-knacks at all, has he? Can't he feel that powerful aura it's giving out?\n@c0@"
  es: "@aAlazar@bNo tiene ojo para las cosinas, ¿eh?\r\n¿Es que no percibe el aura tan potente que emite?\n@c0@"
  fr: "@aInnocent@bIl n'a vraiment pas l'œil pour les objets de collection, ou quoiⓡ Il ne ressent pas la puissante aura que dégage cette pousseⓡ\n@c0@"
  it: "@aSimon@bMaestà, lo confesso...\n@c0@"
  ja: "@a@bピピン「見る目が　ないですねえ。\n\tあの　チカラ強いオーラを\n\t感じられないなんて……。\n@c0@"
402:
  de: "@aOtto@bAlso, um ehrlich zu sein, ich spür' sie ja auch net...\n@c0@"
  en: "@aTuppence@bActually, to tell the truth, neither can I!\n@c0@"
  es: "@aAlazar@bBueno, a decir verdad, yo tampoco.\n@c0@"
  fr: "@aInnocent@bBon, pour être honnête, moi non plusⓠ\n@c0@"
  it: "@aSimon@bFino a poco fa, nemmeno io avevo mai visto un virgulto di Ygdrasil! Grazie per avermi dato la possibilità di ammirarne uno da vicino...\n@c0@"
  ja: "@a@bピピン「いや　じつは　ボクも\n\tそういうの　わからないんですけど。\n@c0@"
403:
  de: "@aBianca@bEs klingt, als würde er nur an das glauben, was er schon selbst gesehen hat. Das muss ganz schön langweilig sein.\n@c0@"
  en: "@aBianca@bSounds like he only believes in things he's seen for himself. That must make life a bit borin' for him.\n@c0@"
  es: "@aBianca@bParece que si no lo ve, no lo cree. Debe de llevar una vida aburridísima, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait qu'il ne croit que ce qu'il voit de ses propres yeux. Ça ne doit pas lui simplifier la vie.\n@c0@"
  it: "@aBianca@bSanti numi!\nQuest'uomo è davvero odioso!\n@c0@"
  ja: "@a@bビアンカ「あの人は　自分で見たものしか\n\t信じられないのかな？　だとすると\n\tあの人の世界は　かなり　せまいわね。\n@c0@"
404:
  de: "@aNera@bDer arme Mann. Glaubst du, dass er irgendwem vertraut?\n@c0@"
  en: "@aNera@bPoor man. Do you think he trusts anyone?\n@c0@"
  es: "@aNera@b¡Povero! ¿Tú crees que confiará en alguien?\n@c0@"
  fr: "@aNera@bPauvre homme. Tu crois qu'il lui arrive de faire confiance aux gensⓡ\n@c0@"
  it: "@aNera@bMi spiace dover dire una cosa tanto triste, ma provo pena per questo poveraccio...\n@c0@"
  ja: "@a@bフローラ「あの方の心は\n\tさみしいですね……。\n@c0@"
405:
  de: "@a%0%a001240@bIch würde zu gern sein Gesicht sehen, wenn er erkennt, dass sie echt ist!\n@c0@"
  en: "@a%0%a001240@bI'd love to see his face when he finds out it is real!\n@c0@"
  es: "@a%0%a001240@bMe encataría ver la cara que se le queda cuando descubra que es real.\n@c0@"
  fr: "@a%0%a001240@bJ'adorerais voir sa tête quand il découvrira que c'est une vraieⓠ\n@c0@"
  it: "@a%0%a001240@bQuasi quasi prendo la penna fatata e gli scrivo ⓕFESSOⓖ sulla fronte, a caratteri cubitali!\n@c0@"
  ja: "@a@b%a001240「なんとか　あの人を\n\tあっ　と言わせたいんだけどなあ。\n@c0@"
406:
  de: "@a%0%a001250@bMehr fällt ihm dazu nicht ein? Sieht er denn nicht, wie wunderschön sie ist?\n@c0@"
  en: "@a%0%a001250@bIs that all he can say? What about how beautiful\nit is?\n@c0@"
  es: "@a%0%a001250@b¿Eso es todo? ¿Qué pasa con lo bonita que es?\n@c0@"
  fr: "@a%0%a001250@bC'est tout ce qu'il a à direⓡ Il ne pourrait pas plutôt parler de sa beautéⓡ\n@c0@"
  it: "@a%0%a001250@bMa che razza di uomo può dire una cosa simile di fronte a un oggetto tanto bello, eh?!\n@c0@"
  ja: "@a@b%a001250「あの人　そんなことしか\n\t言えないの？\n\tあんなに　きれいな羽を見ても……。\n@c0@"
407:
  de: "@aSancho@bWeißt du, manssmal iss bin nisst sisser, ob dieser Señor tatsässliss Schnickschnack mag oder ob er nur ein Hinterwäldler ist.\n@c0@"
  en: "@aSancho@bEsometimes I no esure eef thees señor ees\r\nreally the aficionado of the knick-knacks or\r\neef he ees just a cowboy.\n@c0@"
  es: "@aSancho@bA veces me entra la duda sobre si este señor será de verdad un experto en cosinas o solo es un menzo integral.\n@c0@"
  fr: "@aSancho@bParfois, je me d-d-demande si ce señor est vraiment l'aficionado des objets de c-c-collection qu'il prétend, ou si ce n'est qu'oun cowboy.\n@c0@"
  it: "@aSancho@bNo, esto señor no puede essere considerato un vero intenditore de souvenir.\n¡Es troppo estupido!\n@c0@"
  ja: "@a@bサンチョ「あの方は　名産品を見る目が\n\tあるのやら　ないのやら……。\n@c0@"
408:
  de: "@aOtto@bWieso hören wir dem Kerl doch noch gleich zu? Der hat ja anscheinend gar nichts Nützliches zu sagen.\n@c0@"
  en: "@aTuppence@bRemind me why we're listening to this chap again, would you? He doesn't seem to have anything useful to say at all.\n@c0@"
  es: "@aAlazar@b¿Recordadme por qué estamos escuchando a este tipo? No parece que tenga nada interesante que decir.\n@c0@"
  fr: "@aInnocent@bRappelez-moi encore une fois pourquoi on écoute\nce typeⓡ Il n'a pas l'air d'avoir quoi que ce soit d'utile à dire.\n@c0@"
  it: "@aSimon@bMa perché ascoltiamo le bestialità che dice questo tipo, eh? Ce l'ha ordinato il medico?! È un modo per espiare i nostri peccati?! Argh! Non lo sopporto!\n@c0@"
  ja: "@a@bピピン「どうして　ボクたちは　あんな人の\n\t意見を　きいているんでしょう？\n\tなんだか　むなしくなってきました。\n@c0@"
409:
  de: "@aBianca@bEs hat keinen Zweck, es ihm zu erklären. Er würde uns sowieso nicht glauben.\n@c0@"
  en: "@aBianca@bThere's no point explainin' it to him.\r\nHe wouldn't believe us.\n@c0@"
  es: "@aBianca@bNo merece la pena explicarle nada.\r\nNo nos iba a creer, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa ne sert à rien de lui expliquer.\r\nIl ne nous croirait pas.\n@c0@"
  it: "@aBianca@bCi rinuncio.\nQuesto tipo è davvero senza speranza...\n@c0@"
  ja: "@a@bビアンカ「ちゃんと　説明しても\n\t信じてくれそうにないわね。\n\tふう……。\n@c0@"
410:
  de: "@aNera@bEs ist wirklich gru... Ähm, ich meine, wirklich sehr ungewöhnlich.\n@c0@"
  en: "@aNera@bIt certainly is creeⓚⓛ\nEr... I mean, it certainly is unusual.\n@c0@"
  es: "@aNera@bVeramente es espan... Estooo... Quiero decir que la verdad es que es peculiar.\n@c0@"
  fr: "@aNera@bC'est vrai que ça fait froid dans le... euh... je veux dire, c'est vrai que c'est inhabituel.\n@c0@"
  it: "@aNera@bNon posso dargli torto.\n@c0@"
  ja: "@a@bフローラ「かなり　気味の悪い…\n\tいえ　変わったものですから……\n@c0@"
411:
  de: "@aNera@bVielleicht ist er nicht der Einzige, dem man schwer vermitteln kann, dass das ein berühmtes Souvenir eines Ortes ist.\n@c0@"
  en: "@aNera@bHe might not be the only person who finds it hard to believe it's a famous souvenir of anywhere.\n@c0@"
  es: "@aNera@bPuede que no sea el único al que le cueste credere que es una cosina famosa de algún sitio.\n@c0@"
  fr: "@aNera@bCet homme n'est sans doute pas le seul qui ait du mal à croire qu'il s'agisse vraiment d'un souvenir authentique.\n@c0@"
  it: "@aNera@bIn effetti, è difficile credere che cosa sia davvero quest'oggetto e da dove provenga...\n@c0@"
  ja: "@a@bフローラ「あの方でなくても\n\t名産品と　信じてくださる方は\n\t多くないかも　しれませんね。\n@c0@"
412:
  de: "@a%0%a001240@bWenn das nicht aus Prekaria käme, würde ich es auch gruselig finden. Aber das ist die Stadt, die von Mama gerettet wurde.\n@c0@"
  en: "@a%0%a001240@bIf it wasn't from Precaria, I'd think it was creepy too. But that's the town Mum saved.\n@c0@"
  es: "@a%0%a001240@bSi no fuera por Precaria, yo también creería que es espantoso. Pero es el pueblo que salvó la abuela.\n@c0@"
  fr: "@a%0%a001240@bSi ça ne venait pas de Précaria, moi aussi, je trouverais que ça fait froid dans le dos.\nMais c'est la ville que grand-mère a sauvée.\n@c0@"
  it: "@a%0%a001240@bQuello è un souvenir di Civitascura.\nE non me ne importa un fico secco se quel tipo non ci crede!\n@c0@"
  ja: "@a@b%a001240「あれが　おばあちゃんが\n\t救った町　ジャハンナのじゃなかったら\n\tボクも　気持ち悪いと思ったけど……。\n@c0@"
413:
  de: "@a%0%a001250@bEs zeigt nur, wie Großmutter den Ungeheuern geholfen hat, zu Menschen zu werden. Daran ist nichts Gruseliges.\n@c0@"
  en: "@a%0%a001250@bIt just shows how Grandma helped the monsters turn into humans. There's nothing creepy about it.\n@c0@"
  es: "@a%0%a001250@bSolo demuestra que la abuela ayudó a los monstruos a convertirse en humanos. No tiene nada de espantoso.\n@c0@"
  fr: "@a%0%a001250@bÇa montre juste comment grand-mère a aidé\nles monstres à devenir humains. Ça n'a rien\nde particulièrement terrifiant.\n@c0@"
  it: "@a%0%a001250@bGli ⓕAnnali della Mostruositàⓖ spiegano come mia nonna aiutò i mostri a trasformarsi in esseri umani.\nÈ una storia vera, mica frottole!\n@c0@"
  ja: "@a@b%a001250「ああやって　魔物さんが\n\tおばあちゃんのチカラで　人間に\n\t変わったのよ。　気持ち悪くないもん！\n@c0@"
414:
  de: "@aSancho@bAber dieses Ausstellungsstück ist aus dem Ort, den Señora Magda gerettet hat.\n@c0@"
  en: "@aSancho@bBut thees knick-knack, eet ees from the town señora Mada esaved.\n@c0@"
  es: "@aSancho@bPero esta cosina es del pueblo que salvó la señora Perséfone.\n@c0@"
  fr: "@aSancho@bMais ce s-souvenir vient de la ville que la señora Magdalena a s-sauvée.\n@c0@"
  it: "@aSancho@bEsto souvenir proviene dalla città que fu salvata dalla povera reina Maddalena.\n@c0@"
  ja: "@a@bサンチョ「しかし　あれは\n\tマーサさまが　救われた町の……。\n@c0@"
415:
  de: "@aSancho@bWenn iss anfange, darüber nachzudenken, ob das gruselig ist oder nisst, bin iss ganz verwirrt vor lauter Gefühlen!\n@c0@"
  en: "@aSancho@bWhen I try to theenk eef ees creepy or no, my mind, ees, ees just too full of emotions!\n@c0@"
  es: "@aSancho@bCuando me paro a pensar si es espantoso o no, pues se me llenan los ojos de lágrimas.\n@c0@"
  fr: "@aSancho@bQuand j'essaie de s-s-savoir si c'est effrayant ou no, mon esprit est t-t-trop plein d'émotionsⓠ\n@c0@"
  it: "@aSancho@bSi penso alla cara señora Mada...\nYo... Yo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「私は　冷静に\n\t判断できていませんかね？\n\tどうも　思い入れが　強くて……。\n@c0@"
416:
  de: "@aOtto@bEr hat recht. Ich finde es auch gruselig. Ich kann's mir nicht mal ansehen.\n@c0@"
  en: "@aTuppence@bI agree. It gives me the creeps too.\nI can't look at it, personally.\n@c0@"
  es: "@aAlazar@bEstoy de acuerdo. A mí me espanta.\r\nYo es que no lo puedo ni ver.\n@c0@"
  fr: "@aInnocent@bJe suis d'accord. Moi aussi, ça me fiche la trouille. Personnellement, je n'arrive même pas à le\r\nregarder, cet objet.\n@c0@"
  it: "@aSimon@bArgh! Quest'oggetto mi fa sudare freddo!\nNon riesco nemmeno a guardarlo! È terrificante...\n@c0@"
  ja: "@a@bピピン「ボクも　あの絵は\n\tおそろしくて　ずっと\n\t見ていられないんです。\n@c0@"
417:
  de: "@aBianca@bDer ist so verflixt unhöflich! Hat ihm seine Mutter denn nicht beigebracht, wann man besser mal den Mund hält?\n@c0@"
  en: "@aBianca@bHe's so blimmin' rude! Didn't his mum teach him when to keep his mouth shut?\n@c0@"
  es: "@aBianca@b¡Es un maleducado de tomo y lomo! ¿No le han enseñado en su casa cuándo tiene que cerrar el pico?\n@c0@"
  fr: "@aBianca@bIl est d'une grossièreté phénoménaleⓠ Sa mère ne lui a donc jamais appris à fermer son clapetⓡ\n@c0@"
  it: "@aBianca@bMa chi ha insegnato l'educazione a questa sottospecie di orango travestito da uomo, eh?!\n@c0@"
  ja: "@a@bビアンカ「失礼な人ね！\n\t言っていいことと　悪いことくらい\n\tわからないのかしら？\n@c0@"
418:
  de: "@aNera@bJa, er ist wohl wirklich etwas anderes als die anderen Ausstellungsstücke.\n@c0@"
  en: "@aNera@bI suppose it is a bit different to the other exhibits.\n@c0@"
  es: "@aNera@bSupongo que veramente es un poco distinto al resto de cosinas.\n@c0@"
  fr: "@aNera@bIl est certain que cet objet est un peu différent\r\ndes autres.\n@c0@"
  it: "@aNera@bCerto, non tutto ciò che è scritto sulle ⓕCronache di Inchucheniaⓖ corrisponde a verità...\n@c0@"
  ja: "@a@bフローラ「たしかに　ほかの名産とは\n\tちがいますけど……\n@c0@"
419:
  de: "@aNera@bAber immerhin haben Hunderte von Reisenden dazu beigetragen. Dadurch hat er doch einen gewissen Wert erlangt, oder etwa nicht?\n@c0@"
  en: "@aNera@bBut it's the result of hundreds of travellers' work. That gives it a certain value, doesn't it?\n@c0@"
  es: "@aNera@bPero es el resultado del trabajo de cientos de viajeros. Eso le da cierto valor, ¿vero?\n@c0@"
  fr: "@aNera@bMais c'est le résultat du travail de centaines de voyageurs. Ça lui donne quand même une certaine valeur, nonⓡ\n@c0@"
  it: "@aNera@bPerò è un souvenir realizzato con il contributo di centinaia di viaggiatori provenienti da tutto il mondo, ed è questa particolarità a renderlo tanto prezioso.\n@c0@"
  ja: "@a@bフローラ「いろんな旅人さんたちの\n\t手によるもので…　そういう意味では\n\tひとつしかない貴重なものですわ。\n@c0@"
420:
  de: "@a%0%a001240@bDas ist einfach nur gemein, was er da gesagt hat. Ich hab immer gedacht, Erwachsene reden nicht so.\n@c0@"
  en: "@a%0%a001240@bThat's just nasty, what he said. I didn't think adults were supposed to talk like that.\n@c0@"
  es: "@a%0%a001240@bLo que acaba de decir está muy feo. Yo creía que los adultos no hablaban así.\n@c0@"
  fr: "@a%0%a001240@bC'est méchant, ce qu'il vient de dire. Je croyais que les grandes personnes n'étaient pas censées parler comme ça.\n@c0@"
  it: "@a%0%a001240@bChe razza di cafone impertinente!\nSpero proprio che da grande non diventerò come lui!\n@c0@"
  ja: "@a@b%a001240「ひどい言い方だね。\n\tおとなの人が　言うこととは\n\t思えないよ……。\n@c0@"
421:
  de: "@a%0%a001250@bHauptsache, es macht Spaß! Immerhin ist es doch ein Souvenir, oder etwa nicht? Und das wollen wir im Firlefanzeum schließlich zeigen: Souvenirs.\n@c0@"
  en: "@a%0%a001250@bAs long as it's fun, what's wrong with it?\nIt's still a souvenir, isn't it? And that's what the knick-knackatory's here for. Souvenirs.\n@c0@"
  es: "@a%0%a001250@bMientras sea divertido, ¿qué tendrá de malo?\nSigue siendo una cosina, ¿verdad? Y para eso está aquí el musenino. Para mostrar cosinas.\n@c0@"
  fr: "@a%0%a001250@bDu moment que c'est drôle, je ne vois pas le problème. Ça reste un souvenir, nonⓡ Et c'est à ça que sert la Galericabracⓢ à exposer des souvenirs.\n@c0@"
  it: "@a%0%a001250@bNon conta che ci siano scritte cose vere o solo pettegolezzi: è un souvenir interessante e, in quanto tale, merita di essere esposto qui al Museo.\n@c0@"
  ja: "@a@b%a001250「手にとった人が\n\t楽しめれば　いいんだよね？\n\tあれは　そういう　おみやげよね？\n@c0@"
422:
  de: "@aSancho@bMansse Leute, sie gehen in diese Schänke, nur um zu schreiben in das Buch.\n@c0@"
  en: "@aSancho@bEsome people, they go to thees inn just to write een thees book.\n@c0@"
  es: "@aSancho@bPues hay gente que va a esa posada solo para escribir en él.\n@c0@"
  fr: "@aSancho@bIl y a des gens qui s-sont allés dans cette auberge jouste pour écrire dans ce livre.\n@c0@"
  it: "@aSancho@bQuell'hombre no ha capito nada dell'espirito del Museo del Souvenir, y de los criterios con cui scegliamo los oggettos da mettere en esposiziones...\n@c0@"
  ja: "@a@bサンチョ「わざわざ　あのノートに\n\t書きこむため　あの宿へ行く者も\n\tいるのですよ。\n@c0@"
423:
  de: "@aSancho@bEs ist ein gutes Buch, oder etwa nisst? Darin werden so viele verschiedene Dinge erwähnt.\n@c0@"
  en: "@aSancho@bEes a good book, sí? Eso many different theengs, they are written eenside.\n@c0@"
  es: "@aSancho@b¡Es una buena publicación! Hay tantísimas cosas escritas en su interior.\n@c0@"
  fr: "@aSancho@bC'est oun bon livre, noⓡ Il y a t-t-tellement de choses d-d-différentes écrites dedans.\n@c0@"
  it: "@aSancho@b¡No es importante si las cosas escrittas nel libro sono veras oppure no: conta solo que esto volume es un souvenir unico!\n@c0@"
  ja: "@a@bサンチョ「いろんな人たちの話がつまった\n\tいいノートじゃないですか。\n@c0@"
424:
  de: "@aOtto@bDie Eltern von dem Kerl, die würd' ich gern mal kennenlernen! Die haben viel vermasselt!\n@c0@"
  en: "@aTuppence@bI'd like to meet that chap's parents!\nThey've got a lot to answer for.\n@c0@"
  es: "@aAlazar@b¡Me gustaría conocer a sus padres!\r\nLes iba a decir un par de cositas.\n@c0@"
  fr: "@aInnocent@bJ'aimerais bien rencontrer les parents de ce typeⓠ\nIls ont une grosse part de responsabilité, dans l'histoire.\n@c0@"
  it: "@aSimon@bQuel tizio mi sta cordialmente antipatico.\nAnzi, no: mi sta antipatico e basta!\n@c0@"
  ja: "@a@bピピン「あの人の　親の顔が\n\t見てみたいですね！\n@c0@"
425:
  de: "@aBianca@bWie niederträchtig, sie anzunehmen und dann nicht in Ehren zu halten!\n@c0@"
  en: "@aBianca@bHow mean of him, to take 'em and waste 'em like that!\n@c0@"
  es: "@aBianca@bPero qué desagradable por su parte amontonarlos así, ¿sabes?\n@c0@"
  fr: "@aBianca@bQue c'est méchant de sa part de les emporter\r\ncomme ça et de les gâcher.\n@c0@"
  it: "@aBianca@bCentinaia di gagliardetti?!\nE cosa se ne fa?!\nA questo tizio manca qualche venerdì...\n@c0@"
  ja: "@a@bビアンカ「あの人　いらないのに\n\t何度も　もらったのかな？\n\t……意外と　貧乏性なのね。\n@c0@"
426:
  de: "@aNera@bAber die krummen Stiche sind so nett! Sie verleihen ihm ein so heimeliges, selbst gebasteltes Aussehen.\n@c0@"
  en: "@aNera@bBut the wiggly stitching is so cute!\nIt gives it such a warm, home-made feel.\n@c0@"
  es: "@aNera@bMa los costurones son tan monos.\r\nLe dan ese toque veramente casero y cálido.\n@c0@"
  fr: "@aNera@bMais la couture de travers est tellement mignonneⓠ Ça leur donne vraiment une touche chaleureuse,\nun aspect ⓥfait maisonⓦ.\n@c0@"
  it: "@aNera@bA me il gagliardetto di Serena piace moltissimo.\nSi vede che è un oggetto realizzato con cura...\n@c0@"
  ja: "@a@bフローラ「でも　あの　ふぞろいな\n\tぬい目に　作り手さんの\n\tあたたかい心を　感じますわ……。\n@c0@"
427:
  de: "@a%0%a001240@bWenn er einen ganzen Berg davon hat, dann muss er sie wohl richtig gut finden, oder nicht?\n@c0@"
  en: "@a%0%a001240@bIf he's got a mountain of them, surely that means he really likes them, doesn't it?\n@c0@"
  es: "@a%0%a001240@bSi tiene un montón de ellos en casa, será que le encantan, ¿no?\n@c0@"
  fr: "@a%0%a001240@bS'il en a tout un paquet, ça doit pourtant vouloir dire qu'il les aime, nonⓡ\n@c0@"
  it: "@a%0%a001240@bSe ne ha tanti, vuol dire che quei gagliardetti gli piacciono, no?\n@c0@"
  ja: "@a@b%a001240「山ほど　あるんだって。\n\tそれって　よっぽど\n\tほしかったって　ことなのかな？\n@c0@"
428:
  de: "@a%0%a001250@bNa, also ich finde die Wimpel richtig gut. Wenn ich sie anschaue, wird's mir ganz wohlig.\n@c0@"
  en: "@a%0%a001250@bWell I really like those flags. They give you a warm feeling inside.\n@c0@"
  es: "@a%0%a001250@bBueno, me encantan esos banderines. Te hacen sentir bien.\n@c0@"
  fr: "@a%0%a001250@bEh bien moi, j'aime vraiment beaucoup ces fanions.\nIls donnent un sentiment très chaleureux.\n@c0@"
  it: "@a%0%a001250@bTrovo quei gagliardetti molto carini.\nSono davvero ben fatti.\n@c0@"
  ja: "@a@b%a001250「わたし　あのペナント好きだな。\n\t見てると　あったかい\n\t気持ちになるもん。\n@c0@"
429:
  de: "@aSancho@bMeinst du, dieser Señor, er legt alle seine Wimpel in den Lagerraum? Wäre das nisst schade, wenn jemand siss mit ihnen solsse Mühe gemacht hat?\n@c0@"
  en: "@aSancho@bYou theenk thees señor, he puts all hees flags een the storeroom? Ees esuch a shame when esomeone has worked eso hard to make them.\n@c0@"
  es: "@aSancho@b¿Crees que este señor nomás pondrá todos los banderines en el almacén? Es una vergüenza, trabajaron bien duro para hacerlos.\n@c0@"
  fr: "@aSancho@bTu crois que ce s-señor met tous les f-fanions dans oune réserveⓡ C'est dommage, alors que quelqu'un s'est d-d-donné autant de mal pour les faire.\n@c0@"
  it: "@aSancho@b¿Por qué quel señor ha deciso de mettere los gagliardettos en un magazzin?\n¿Es un espreco, no?\n@c0@"
  ja: "@a@bサンチョ「あの人　物置に\n\t入れてるんですか？　もったいない…\n\t作り手さんが　悲しみますよ。\n@c0@"
430:
  de: "@aOtto@bIch glaube, insgeheim findet er sie sehr schön. Warum würde er wohl sonst so viel darüber wissen?\n@c0@"
  en: "@aTuppence@bI think he secretly really likes them.\r\nWhy else would he know so much about them?\n@c0@"
  es: "@aAlazar@bYo creo que en el fondo le gustan.\r\n¿Si no por qué sabría tanto de ellos?\n@c0@"
  fr: "@aInnocent@bJe crois qu'en réalité, il les aime beaucoup.\nSinon pourquoi il en saurait autant à leur proposⓡ\n@c0@"
  it: "@aSimon@bQuel tipo va matto per i gagliardetti, però non lo ammetterà mai, perché non sono oggetti di valore.\nSe lo facesse, andrebbe contro i suoi principi.\n@c0@"
  ja: "@a@bピピン「あんなに\n\tムキになるところを見ると\n\tじつは　気に入ってるんじゃ？\n@c0@"
431:
  de: "@aBianca@bDiese Tinte ist etwas ganz Besonderes. Manchmal sieht sie schwarz aus und manchmal regenbogenfarben.\n@c0@"
  en: "@aBianca@bThat ink is pretty special. Sometimes it looks black, but sometimes it looks all rainbow-coloured.\n@c0@"
  es: "@aBianca@bLa tinta es muy especial. A veces parece negra, pero otras veces tiene todos los colores del arcoiris, ¿sabes?\n@c0@"
  fr: "@aBianca@bL'encre qu'il contient est très spéciale, c'est vrai. Parfois elle a l'air noire et parfois on dirait qu'elle est arc-en-ciel.\n@c0@"
  it: "@aBianca@bIn effetti, l'inchiostro contenuto nel magicalamaio è davvero speciale: a volte sembra nero, altre assume mille colori diversi.\n@c0@"
  ja: "@a@bビアンカ「あのインク　ふしぎなのよね。\n\t黒いようにも見えるし\n\t虹色にも見えるし……。\n@c0@"
432:
  de: "@aNera@bEin Wanderpriester, der das Stift besuchte, als ich dort lebte, hat mir von dieser Tinte erzählt und wie sie hergestellt wird.\n@c0@"
  en: "@aNera@bI heard about that ink and how they make it at Northminster from a travelling priest who came\r\nto the abbey when I was living there.\n@c0@"
  es: "@aNera@bCuando vivía en la abadía, oí parlare de la tinta y la sua fabricación en Silos a un misionero.\n@c0@"
  fr: "@aNera@bJ'ai entendu parler de cette encre, et de la manière dont elle est fabriquée à Saint Glinglin, par un prêtre itinérant de passage à l'abbaye quand j'y étais.\n@c0@"
  it: "@aNera@bRicordo di aver saputo del magicalamaio da un sacerdote che venne in visita all'Abbazia di Su'ncyel durante il mio soggiorno presso le suore.\n@c0@"
  ja: "@a@bフローラ「私も修道院にいたとき\n\t北の教会に伝わる　インクの話を\n\t旅をしている神父さまから聞きました。\n@c0@"
433:
  de: "@aNera@bEr sagte das Gleiche. Es ist eine ganz besondere Tinte, die niemals verbleicht.\n@c0@"
  en: "@aNera@bHe said the same thing. It's a special ink that never ever fades.\n@c0@"
  es: "@aNera@bDijo la misma cosa. Es una tinta speciale indeleble.\n@c0@"
  fr: "@aNera@bIl a dit la même chose. Que c'est une encre spéciale qui ne pâlit jamais.\n@c0@"
  it: "@aNera@bAnche lui mi disse che questo particolarissimo oggetto contiene un inchiostro tanto speciale da poter essere definito magico.\n@c0@"
  ja: "@a@bフローラ「時がたっても　けっして\n\t消えることのないインクとか……。\n@c0@"
434:
  de: "@a%0%a001240@bTinte riecht meistens komisch, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bInk usually smells funny, doesn't it?\n@c0@"
  es: "@a%0%a001240@bLa tinta tiene un olor muy particular, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bEn général, l'encre ça sent bizarre, nonⓡ\n@c0@"
  it: "@a%0%a001240@bDi solito gli inchiostri emanano un profumo molto particolare...\n@c0@"
  ja: "@a@b%a001240「どのインクも\n\tヘンな　においがするよね？\n@c0@"
435:
  de: "@a%0%a001240@bAber diese nicht. Wie kommt das?\n@c0@"
  en: "@a%0%a001240@bBut this ink doesn't. Why is that?\n@c0@"
  es: "@a%0%a001240@bPero esta tinta, no. ¿Por qué será?\n@c0@"
  fr: "@a%0%a001240@bMais pas celle-là. Comment ça se faitⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto, invece, è del tutto inodore!\nChissà come mai...\n@c0@"
  ja: "@a@b%a001240「でも　このインクは\n\tしないんだよ。　なんでかな？\n@c0@"
436:
  de: "@a%0%a001250@bJa, das glaube ich. Ich glaube, sie ist etwas ganz Besonderes.\n@c0@"
  en: "@a%0%a001250@bWell I believe it. I think it is special.\n@c0@"
  es: "@a%0%a001250@bYo lo creo. Yo creo que tiene poderes especiales.\n@c0@"
  fr: "@a%0%a001250@bMoi j'y crois. Je crois que cette encre est spéciale.\n@c0@"
  it: "@a%0%a001250@bSì, anch'io so che questo souvenir contiene un inchiostro speciale.\n@c0@"
  ja: "@a@b%a001250「ふしぎなチカラの　ウワサは\n\t本当だと思うよ。\n@c0@"
437:
  de: "@a%0%a001250@bIch weiß nicht warum, aber irgendwie ist sie für mich etwas ganz Besonderes.\n@c0@"
  en: "@a%0%a001250@bI don't know why, but it just seems special to\nme somehow.\n@c0@"
  es: "@a%0%a001250@bNo se por qué, pero a mí me lo parece.\n@c0@"
  fr: "@a%0%a001250@bJe ne sais pas pourquoi, mais j'ai l'impression qu'elle a quelque chose de particulier.\n@c0@"
  it: "@a%0%a001250@bPerò non ho idea di quale sia il procedimento da seguire per realizzarlo...\nSolo i monaci del Monastero Scribarum lo conoscono!\n@c0@"
  ja: "@a@b%a001250「このインクから　何か\n\tあたたかいものが　感じられるの。\n@c0@"
438:
  de: "@aSancho@bSí, sí. Das ist die Tinte, die aus dem Stoßzahn eines Ungeheuers gemacht wird.\n@c0@"
  en: "@aSancho@bSí, sí. Ees the eenk made from the tusk of\r\na monster.\n@c0@"
  es: "@aSancho@b¡Ándale! Es tinta hecha de un tantor.\n@c0@"
  fr: "@aSancho@bSi, si. Cette encre est f-fabriquée à partir de la\r\nd-défense d'oun monstre.\n@c0@"
  it: "@aSancho@bEsto inchiostro es fatto con las zannas de un mostro...\n@c0@"
  ja: "@a@bサンチョ「魔物のキバが　使われている\n\tインクですからねえ。\n@c0@"
439:
  de: "@aSancho@bDa ist es nisst weiter verwunderliss, wenn sie besondere Kräfte besitzt, nisst?\n@c0@"
  en: "@aSancho@bEes no esurprising eef eet has the especial\r\npowers, eh?\n@c0@"
  es: "@aSancho@bPues no es ninguna sorpresa que tenga poderes especiales.\n@c0@"
  fr: "@aSancho@bPas étonnant qu'elle ait des p-p-pouvoirs\nespéciaux, noⓡ\n@c0@"
  it: "@aSancho@b¡Per esto motivo es dotato de poteres especiales!\n@c0@"
  ja: "@a@bサンチョ「何かしらの　チカラが\n\tこめられていても　おかしくは\n\tないですね。\n@c0@"
440:
  de: "@aOtto@bIhr glaubt doch nicht, dass sie die Handschrift verbessern kann, oder?\n@c0@"
  en: "@aTuppence@bYou don't think it can improve your handwriting,\r\ndo you?\n@c0@"
  es: "@aAlazar@b¿No mejorará la caligrafía, verdad?\n@c0@"
  fr: "@aInnocent@bVous ne croyez pas que ça peut améliorer l'écriture, par hasardⓡ\n@c0@"
  it: "@aSimon@bMa è vero che quest'inchiostro corregge automaticamente gli errori di scrittura?\n@c0@"
  ja: "@a@bピピン「あのインクを　使ったら\n\tものが　きれいに書けるとか……。\n@c0@"
441:
  de: "@aOtto@bTja, vermutlich nicht... Schade...\n@c0@"
  en: "@aTuppence@bNo, I... I suppose not. Oh, well.\n@c0@"
  es: "@aAlazar@bNo, supongo que no. ¡Qué chasco!\n@c0@"
  fr: "@aInnocent@bNon, je... je suppose que non. Tant pis.\n@c0@"
  it: "@aSimon@bNo?\nAllora cos'ha di tanto speciale?\n@c0@"
  ja: "@a@bピピン「そういうことでは　ないんですか？\n@c0@"
442:
  de: "@aBianca@bIch frage mich, wann man wohl ein solches Instrument spielen sollte. Ich will's jedenfalls nicht hören!\n@c0@"
  en: "@aBianca@bI wonder when anyone'd want to play an instrument like that. I certainly don't want to hear it!\n@c0@"
  es: "@aBianca@bMe pregunto qué impulsará a alguien a querer tocar semejante instrumento. A mi no se me ocurriría, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande quand les gens pourraient bien avoir envie de jouer d'un instrument pareil. Moi, je n'ai pas envie de l'entendreⓠ\n@c0@"
  it: "@aBianca@bMi chiedo a chi possa piacere il suono di uno strumento del genere...\nA me no di certo!\n@c0@"
  ja: "@a@bビアンカ「あの楽器は\n\tどういうときに　使うのかな？\n\t私は　あまり　ききたくないけど……。\n@c0@"
443:
  de: "@aNera@bEin Geräusch, als wenn Leute kreischen? Brr... Da läuft's mir kalt den Rücken runter.\n@c0@"
  en: "@aNera@bThe sound of people screaming?\nBrrr... It sends shivers down your spine.\n@c0@"
  es: "@aNera@b¿Suena como personas gritando?\r\nBrrr... Veramente, me hace estremecer.\n@c0@"
  fr: "@aNera@bLe son de gens qui crientⓡ\nBrrr... Ça donne la chair de poule.\n@c0@"
  it: "@aNera@bQuesto strumento produce il suono di grida umane disperate?! Chi può aver inventato un oggetto simile?! È una cosa terrificante!\n@c0@"
  ja: "@a@bフローラ「人の叫び声なんて……。\n\t背すじが　寒くなってきました。\n@c0@"
444:
  de: "@a%0%a001240@bDas klingt nicht nach einem sehr angenehmen Instrument, oder?\n@c0@"
  en: "@a%0%a001240@bIt doesn't sound like a very nice instrument, does it?\n@c0@"
  es: "@a%0%a001240@bNo sembra un instrumento demasiado bueno, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bÇa n'a pas l'air d'un instrument très sympa.\n@c0@"
  it: "@a%0%a001240@bSarà anche un souvenir interessante, ma preferisco altri strumenti musicali!\n@c0@"
  ja: "@a@b%a001240「あまり使いたくない　楽器だね。\n@c0@"
445:
  de: "@a%0%a001250@bSag mir, wenn du es benutzen willst, Papa, ja? Dann kann ich mir die Finger in die Ohren stecken.\n@c0@"
  en: "@a%0%a001250@bTell me if you're going to use it, won't you, Dad?\nSo I can put my fingers in my ears.\n@c0@"
  es: "@a%0%a001250@bDime si vas a usarlo, ¿vale, papi?\nPara que me tape los oídos.\n@c0@"
  fr: "@a%0%a001250@bPréviens-moi si tu as l'intention de l'utiliser, papa. Comme ça je pourrai me boucher les oreilles.\n@c0@"
  it: "@a%0%a001250@bPer favore, avvertimi con un po' d'anticipo quando vorrai suonare questo strumento, così avrò il tempo di tapparmi le orecchie!\n@c0@"
  ja: "@a@b%a001250「お父さん　あの楽器を\n\t使うときは言ってね。\n\t私　耳をふさぐから。\n@c0@"
446:
  de: "@aSancho@bDieser Señor, er tut, als hätte er keine Angst, aber dein Onkel Sancho, der kennt die Wahrheit. Er kann die Schweißtropfen auf seiner Stirn nisst verbergen.\n@c0@"
  en: "@aSancho@bThees señor, he pretends he no escared, but your Uncle Sancho knows the truth. He can no hide the esweat on hees brow.\n@c0@"
  es: "@aSancho@bEste señor nomás pretende que no tiene miedo, pero tu tito Sancho sabe la verdad. Ni modo puede ocultar el sudor de la frente.\n@c0@"
  fr: "@aSancho@bCe s-señor, il dit qu'il n'a pas p-p-peur, mais tonton Sancho sait la vérité. Il ne peut p-p-pas cacher la sueur qui coule sur son front.\n@c0@"
  it: "@aSancho@b¡El señor dice que es toda una esciocchezza, ma yo penso que es muy espaventato da esto estrumento!\n@c0@"
  ja: "@a@bサンチョ「あの方は　おそろしく\n\tないようですが　ひたいに\n\t汗が光ってましたよ。\n@c0@"
447:
  de: "@aOtto@bAber es will doch sicher keiner das Geräusch von schreienden Leuten hören? Ich will's jedenfalls net!\n@c0@"
  en: "@aTuppence@bBut surely no one wants to listen to the sound of people screaming. I know I don't.\n@c0@"
  es: "@aAlazar@bPero nadie querrá oír el sonido de personas gritando. Yo desde luego, no.\n@c0@"
  fr: "@aInnocent@bMais enfin, personne n'a envie d'entendre le son de gens qui crientⓠ Moi pas, en tout cas.\n@c0@"
  it: "@aSimon@bUno strumento in grado di riprodurre grida umane?!\r\nNo, grazie. Preferisco ascoltare la cara, vecchia musica folk di Denim!\n@c0@"
  ja: "@a@bピピン「人の叫び声を　ききたい人なんて\n\tいませんよね。　ボクもです。\n@c0@"
448:
  de: "@aBianca@bWenn ich das Medaillon sehe, schnürt es mir richtig die Kehle zu.\n@c0@"
  en: "@aBianca@bSeein' that locket makes me feel all choked up inside.\n@c0@"
  es: "@aBianca@bVer ese camafeo me encoge el corazón, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand je vois ce pendentif, je me sens\r\nprofondément émue.\n@c0@"
  it: "@aBianca@bSe guardo quel medaglione mi viene un groppo in gola...\n@c0@"
  ja: "@a@bビアンカ「あのロケットを　見てると\n\tむねが　しめつけられるような\n\t感じがして　せつなくなるの……。\n@c0@"
449:
  de: "@aNera@bWie schade, dass so ein wunderschönes Medaillon kein Bild hat. Das ist irgendwie traurig.\n@c0@"
  en: "@aNera@bIt's a shame for such a beautiful locket not to have a picture in it. It seems so sad.\n@c0@"
  es: "@aNera@bEs una pena que un camafeo così bello no tenga un retrato en el suo interior. Es veramente triste.\n@c0@"
  fr: "@aNera@bC'est vraiment dommage qu'il n'y ait aucun portrait à l'intérieur de ce pendentif. Ça lui donne l'air triste.\n@c0@"
  it: "@aNera@bPeccato che il medaglione non abbia nessuna immagine all'interno...\n@c0@"
  ja: "@a@bフローラ「絵が入っていない\n\t美しいロケットですか……。\n\tなんだか　さびしいですね。\n@c0@"
450:
  de: "@a%0%a001240@bIch würd' ja gern wissen, was Opa und Oma über das Medaillon erzählen könnten.\n@c0@"
  en: "@a%0%a001240@bI wonder what kind of things Grandpa and Grandma could tell us about this locket.\n@c0@"
  es: "@a%0%a001240@bMe pregunto qué nos podrían contar los abuelos sobre este camafeo.\n@c0@"
  fr: "@a%0%a001240@bJe me demande ce que grand-père et grand-mère pourraient nous dire à propos de ce pendentif.\n@c0@"
  it: "@a%0%a001240@bIl nonno e la nonna potrebbero raccontarci molte cose su questo medaglione. Dev'essere stato l'oggetto più caro che abbiano mai avuto...\n@c0@"
  ja: "@a@b%a001240「あれには\n\tおじいちゃんとおばあちゃんの\n\tどんな思い出が　あるんだろうね？\n@c0@"
451:
  de: "@a%0%a001250@bIch spüre Omas gütige Fürsorge in diesem Medaillon.\n@c0@"
  en: "@a%0%a001250@bI can feel Grandma's loving warmth in that locket.\n@c0@"
  es: "@a%0%a001250@bPuedo sentir la calidez de la abuela en ese camafeo.\n@c0@"
  fr: "@a%0%a001250@bJe ressens toute la douceur et l'amour\nde grand-mère dans ce pendentif.\n@c0@"
  it: "@a%0%a001250@bQuando guardo il medaglione, mi sembra quasi di sentire tutto l'amore che il nonno provava per la nonna...\n@c0@"
  ja: "@a@b%a001250「あのロケットから\n\tおばあちゃんの　ぬくもりが\n\t伝わってくるような……\n@c0@"
452:
  de: "@a%0%a001250@bIch weiß auch nicht, wieso. Ich spüre sie einfach.\n@c0@"
  en: "@a%0%a001250@bI, I don't know why. I just can.\n@c0@"
  es: "@a%0%a001250@bNo sé por qué. Solo sé que puedo.\n@c0@"
  fr: "@a%0%a001250@bJe ne sais pas comment c'est possible, mais c'est vrai.\n@c0@"
  it: "@a%0%a001250@bLo so, è solo una mia impressione, ma è talmente forte da sembrarmi reale!\n@c0@"
  ja: "@a@b%a001250「そんな　気がします。\n@c0@"
453:
  de: "@aSancho@bDas... Das waren so glücklisse Zeiten... Señor Ludwig und Señora Magda, sie waren so verliebt... (Schluchz)\n@c0@"
  en: "@aSancho@bEet, eet was esuch a happy time...\r\nSeñor Pankraz and señora Mada, they were eso een love... (sob)\n@c0@"
  es: "@aSancho@b¡Eran tiempos tan felices...!\r\nEl señor Teudis y la señora Perséfone estaban tan enamorados... (snif)\n@c0@"
  fr: "@aSancho@bC'était oune époque si heureuse... Le señor Petros\r\net la s-señora Magdalena, ils étaient si amoureux... (snif)\n@c0@"
  it: "@aSancho@bEh, sì... El señor Russel y la señora Mada se amavano tanto...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あの頃の　パパスさまと\n\tマーサさまは　本当に　お幸せで…\n\tうっうっ……。\n@c0@"
454:
  de: "@aOtto@bDieser Mann will bei König Ludwigs Hochzeit dabei gewesen sein? Das ist doch bestimmt eine faustdicke Lüge!\n@c0@"
  en: "@aTuppence@bThat man was at King Pankraz's wedding?\nNow that's got to be a lie!\n@c0@"
  es: "@aAlazar@b¿Ese hombre estuvo en la boda del rey Teudis?\r\n¡Eso es una mentira como una casa de grande!\n@c0@"
  fr: "@aInnocent@bCe type était au mariage du roi Petrosⓡ\nNon, c'est forcément un bobardⓠ\n@c0@"
  it: "@aSimon@bNon crederò mai che quell'uomo sia stato invitato al matrimonio di re Russel!\nAl massimo, si sarà imbucato di nascosto!\n@c0@"
  ja: "@a@bピピン「先代パパス王の\n\tご成婚式に　あの人が？\n\t……ぜったい　うそに決まってますよ！\n@c0@"
455:
  de: "@aBianca@bDas ist doch deine Mutter, %a000090, oder nicht? Sie sieht so lieb aus.\n@c0@"
  en: "@aBianca@bThat's your mum, en't it, %a000090?\nShe's got such a kind-lookin' face.\n@c0@"
  es: "@aBianca@bEsa es tu madre, ¿verdad, %a000090?\nTiene un rostro tan dulce.\n@c0@"
  fr: "@aBianca@bC'est ta mère, n'est-ce pas, %a000090ⓡ\nElle a un visage si bon.\n@c0@"
  it: "@aBianca@bQuesta è tua madre, %a000090?\nHa un'espressione dolcissima...\n@c0@"
  ja: "@a@bビアンカ「あの人が　%a000090の\n\tお母さんなんだね。　なんて\n\tやさしい笑顔なのかしら……。\n@c0@"
456:
  de: "@aBianca@bKein Wunder, dass Ludwig sich auf den ersten Blick in sie verguckt hat.\n@c0@"
  en: "@aBianca@bIt's easy to see how Pankraz fell in love with her at first sight.\n@c0@"
  es: "@aBianca@bEs fácil entender por qué Teudis se enamoró de ella a primera vista, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl est facile d'imaginer comment Petros a pu tomber amoureux d'elle au premier regard.\n@c0@"
  it: "@aBianca@bCapisco perché Russel si innamorò di lei non appena la vide...\n@c0@"
  ja: "@a@bビアンカ「パパスさんが　ひとめぼれ\n\tしちゃったのも　わかる気がするな。\n@c0@"
457:
  de: "@aNera@bMan sieht auf dem Porträt, was für eine gütige und reine Frau sie war.\n@c0@"
  en: "@aNera@bYou can tell from the portrait what a kind and pure woman she was.\n@c0@"
  es: "@aNera@bEn el retrato se puede ver qué donna tan pura y amabile era.\n@c0@"
  fr: "@aNera@bOn voit bien dans ce portrait que c'était une femme pure et pleine de bonté.\n@c0@"
  it: "@aNera@bBasta guardare questo ritratto per capire quanto fosse puro l'animo di Maddalena...\n@c0@"
  ja: "@a@bフローラ「姿絵からも　この方の心が\n\tとても　清らかであると　わかりますわ。\n@c0@"
458:
  de: "@a%0%a001240@bEr weint! Er ist richtig gerührt.\n@c0@"
  en: "@a%0%a001240@bHe's crying! He must've been really moved.\n@c0@"
  es: "@a%0%a001240@b¡Llora! Se debe de haber emocionado.\n@c0@"
  fr: "@a%0%a001240@bIl pleureⓠ Il doit être vraiment très ému.\n@c0@"
  it: "@a%0%a001240@bChe bel ritratto...\nÈ veramente meraviglioso...\n@c0@"
  ja: "@a@b%a001240「あのおじさん　感動して\n\t泣いちゃってるよ。\n@c0@"
459:
  de: "@a%0%a001250@bSo also hat Oma ausgesehen, als sie jung war.\n@c0@"
  en: "@a%0%a001250@bSo that's what Grandma looked like when she\nwas young.\n@c0@"
  es: "@a%0%a001250@bAsí que la abuela era así cuando era joven.\n@c0@"
  fr: "@a%0%a001250@bAlors c'est à ça que ressemblait grand-mère quand elle était jeune.\n@c0@"
  it: "@a%0%a001250@bAllora mia nonna era così da giovane?\nEra una ragazza bellissima, non è vero?\n@c0@"
  ja: "@a@b%a001250「若い頃の　おばあちゃんって\n\tあんな感じだったのね。\n@c0@"
460:
  de: "@aSancho@bEs ist so schön, dass das Bildnis endliss im Medaillon ist. Señor Ludwig, er wäre so... so glückliss.\n@c0@"
  en: "@aSancho@bEes eso good to have thees picture een the\r\nlocket at last. Señor Pankraz, he would be eso...eso happy.\n@c0@"
  es: "@aSancho@bEstá tan padre tener el retrato en el camafeo. El señor Teudis estaría tan retecontento...\n@c0@"
  fr: "@aSancho@bC'est muy bien d'avoir enfin ce p-p-portrait dans le pendentif. Le señor Petros serait si... si heureux.\n@c0@"
  it: "@aSancho@b¡Finalmentes el medaglione es completo!\nEl señor Russel sarebbe feliz de vedere que ahora contiene el ritratto della señora Madalena...\n@c0@"
  ja: "@a@bサンチョ「ロケットを完成させられて\n\t本当に　よかった。　パパスさまも\n\tおよろこびでしょう…　うっうっ……。\n@c0@"
461:
  de: "@aOtto@bJetzt weint der Kerl. Ich verstehe ihn einfach nicht. Was ist das bloß für einer?\n@c0@"
  en: "@aTuppence@bThe chap's crying now. I can't keep up with him.\r\nJust who is he exactly?\n@c0@"
  es: "@aAlazar@bEl tipo se ha puesto a llorar. Es que no lo entiendo.\r\nPero, ¿quién es?\n@c0@"
  fr: "@aInnocent@bVoilà qu'il pleure, maintenant. Je n'arrive vraiment pas à le suivre, ce type. Mais qui c'est, exactementⓡ\n@c0@"
  it: "@aSimon@bSì, quel tipo ha ragione: non ci sono parole per descrivere la bellezza di quest'oggetto...\n@c0@"
  ja: "@a@bピピン「あの人　泣いてますよ。\n\tいったい　どういう人なんでしょう？\n@c0@"
462:
  de: "@aBianca@bUm so weit zu gehen, müsste man schon ziemlich wild auf Souvenirs sein, wie?\n@c0@"
  en: "@aBianca@bYou'd have to be pretty keen on souvenirs to go to that extreme to get 'em, eh?\n@c0@"
  es: "@aBianca@bHay que tomarse las cosinas muy en serio para llegar a esos extremos, ¿verdad?\n@c0@"
  fr: "@aBianca@bIl faut vraiment être mordu d'objets de collection pour aller jusqu'à de telles extrémités afin de les obtenir, nonⓡ\n@c0@"
  it: "@aBianca@bChe cosa?! Vuole mandare i suoi servitori a Nadiria per farsi portare qualche souvenir?!\nSecondo me questo tipo non ci sta con la testa...\n@c0@"
  ja: "@a@bビアンカ「名産品ほしさに\n\tそんなことしたら　人として\n\t大切なものを　失っちゃうわよね。\n@c0@"
463:
  de: "@aNera@bMeinst du nicht, wir sollten ihn davor warnen, wie gruselig es in Nadiria ist?\n@c0@"
  en: "@aNera@bDon't you think we should warn him about how scary it is in Nadiria?\n@c0@"
  es: "@aNera@b¿Non credi que deberíamos advertile de lo terrorífico que es Nadiria?\n@c0@"
  fr: "@aNera@bTu crois qu'on devrait lui dire à quel point c'est effrayant, Nadiriaⓡ\n@c0@"
  it: "@aNera@bForse dovremmo dirgli che andare a Nadiria non è proprio come fare un picnic in campagna...\n@c0@"
  ja: "@a@bフローラ「魔界がどれほど　おそろしい\n\t場所なのか　教えてさしあげたほうが\n\tいいのではないでしょうか？\n@c0@"
464:
  de: "@a%0%a001240@bSo eine Trophäe bekommt man aber nicht einfach nur dadurch, dass man in Nadiria lebt. Dafür muss man Estark besiegen.\n@c0@"
  en: "@a%0%a001240@bYou can't just get a trophy like that by living in Nadiria, though. You have to defeat Estark.\n@c0@"
  es: "@a%0%a001240@bPero no te dan un trofeo así por vivir en Nadiria. Hay que vencer a Estark.\n@c0@"
  fr: "@a%0%a001240@bIl ne suffit pas de vivre à Nadiria pour obtenir un trophée comme ça. Il faut vaincre Estark.\n@c0@"
  it: "@a%0%a001240@bNon basta andare a Nadiria per ottenere questo souvenir...\nPer conquistarlo è necessario sconfiggere Estark.\n@c0@"
  ja: "@a@b%a001240「魔界の住人に　なったからって\n\tあれは　手にはいる物じゃないよね。\n\tエスタークを　たおさないと……。\n@c0@"
465:
  de: "@a%0%a001250@bDas kann er doch wohl nicht ernst meinen? Nein, das meint er bestimmt nicht ernst...\n@c0@"
  en: "@a%0%a001250@bHe's not serious, is he? No, he can't be...\n@c0@"
  es: "@a%0%a001250@bNo hablará en serio, ¿verdad? No, no puede ser.\n@c0@"
  fr: "@a%0%a001250@bIl n'est pas sérieux, quand mêmeⓡ\nNon, c'est impossible...\n@c0@"
  it: "@a%0%a001250@bMandare dei servitori a Nadiria per avere dei souvenir?!\nQuest'uomo sta scherzando, vero?!\n@c0@"
  ja: "@a@b%a001250「あの人　もちろん\n\tじょうだんで　言ってるんだよね？\n@c0@"
466:
  de: "@aSancho@bUff! Das würde er nisst mehr sagen, wenn er erst einmal dort gewesen wäre!\n@c0@"
  en: "@aSancho@bUf! He would no esay thees eef he goes there!\n@c0@"
  es: "@aSancho@b¡Uf! Pues no va conseguir eso yendo allá.\n@c0@"
  fr: "@aSancho@bTsssⓠ Il ne d-d-dirait pas ça s'il était allé là-basⓠ\n@c0@"
  it: "@aSancho@b¿Por qué quell'hombre no va a Nadiria de persona, inveces de mandarce los suos servitores? ¡Soy seguro que lì se divertirebbe muchissimo! ¡Eh eh eh!\n@c0@"
  ja: "@a@bサンチョ「やれやれ…\n\tなにも知らないというのは\n\t本当に　気楽ですねえ。\n@c0@"
467:
  de: "@aOtto@bEgal wieso ⓚⓛ schon allein der Gedanke, nadirischer Staatsbürger zu werden, ist schon ziemlich Furcht einflößend!\n@c0@"
  en: "@aTuppence@bWhatever the reasons, just entertaining the idea\r\nof getting Nadirian citizenship is pretty terrifying really!\n@c0@"
  es: "@aAlazar@bCualquiera que sea el motivo, simplemente el pensar en convertirse en residente de Nadiria ya asusta.\n@c0@"
  fr: "@aInnocent@bL'idée de vouloir demander la nationalité nadirienne est déjà terrifiante en soit, quelles qu'en soient les raisonsⓠ\n@c0@"
  it: "@aSimon@bAndare a Nadiria per prendere dei souvenir?!\nSolo un pazzo potrebbe avere un'idea del genere!\n@c0@"
  ja: "@a@bピピン「目的がなんであれ\n\t魔界の住人に　なりたいなど\n\tなんて　おそろしい……。\n@c0@"
468:
  de: "@aBianca@bSicher beruhigt es die Besucher, wenn sie sehen, dass wir auch um die Sicherheit hier bemüht sind.\n@c0@"
  en: "@aBianca@bIt must be quite reassurin' for the customers, seein' we've got the security of the place covered.\n@c0@"
  es: "@aBianca@bA los visitantes les debe de hacer sentir más tranquilos ver que tenemos la seguridad de este sitio cubierta, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa doit être plutôt rassurant pour les visiteurs\r\nde constater qu'on se préoccupe de la sécurité\r\nde cet endroit.\n@c0@"
  it: "@aBianca@bSono certa che ai visitatori fa piacere vedere che il Museo del Souvenir ha assunto un sorvegliante che garantise la sicurezza loro e degli oggetti esposti.\n@c0@"
  ja: "@a@bビアンカ「警備の人がいると\n\tお客さんも　安心できるよね。\n@c0@"
469:
  de: "@aNera@bNun, das ist beruhigend, nicht?\n@c0@"
  en: "@aNera@bWell that's reassuring, isn't it?\n@c0@"
  es: "@aNera@bBene, eso da tranquilidad, ¿verdad?\n@c0@"
  fr: "@aNera@bVoilà qui est rassurant, nonⓡ\n@c0@"
  it: "@aNera@bBuono a sapersi!\n@c0@"
  ja: "@a@bフローラ「あの方が　いてくだされば\n\t私たちも　安心ですわね。\n@c0@"
470:
  de: "@a%0%a001240@bNichts zu berichten! Heh heh! Das klingt gut!\n@c0@"
  en: "@a%0%a001240@bNothing to report! Heh heh! That sounds cool!\n@c0@"
  es: "@a%0%a001240@b¡Sin novedad! ¡Je, je! ¡Suena genial!\n@c0@"
  fr: "@a%0%a001240@bRien à signalerⓠ Hé héⓠ Ça sonne bienⓠ\n@c0@"
  it: "@a%0%a001240@bⓕLe cose sono filate lisce come l'olioⓖ...\nMi piace questa frase! E mi piace anche il tono con cui l'ha detta! Quel tipo dev'essere in gamba...\n@c0@"
  ja: "@a@b%a001240「異常　ありませんっ！\n\t……だって。　かっこいいなあ。\n@c0@"
471:
  de: "@a%0%a001250@bEr behält das Firlefanzeum doch auch dann im Auge, wenn wir nicht hier sind, oder?\n@c0@"
  en: "@a%0%a001250@bHe keeps an eye on the knick-knackatory even when we're not here, doesn't he?\n@c0@"
  es: "@a%0%a001250@bVigila el musenino hasta cuando no estamos, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bIl garde un œil sur la Galericabrac même quand\non n'est pas là, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bLa presenza di una guardia dovrebbe scoraggiare i malintenzionati che avessero in mente di fare qualche brutto scherzo al Museo.\n@c0@"
  ja: "@a@b%a001250「わたしたちが　いないときも\n\tちゃんと博物館を　守ってくれるのね。\n@c0@"
472:
  de: "@aSancho@bIss hoffe nur, dass es hier keine Problemas gibt. Aber weißt du, manssmal müssen wir alle mit sslessten Umständen kämpfen.\n@c0@"
  en: "@aSancho@bI hope to the Goddess there are no problems here. But you know, esometimes the bad theengs, they come for us all.\n@c0@"
  es: "@aSancho@bPues espero que por la Diosa no haya problemas aquí.\r\nPero, a veces, a todos nos toca verla fea.\n@c0@"
  fr: "@aSancho@bJe p-p-prie la Déesse pour qu'il n'y ait pas de\r\np-problèmes ici. Mais tu sais, les mauvaises choses peuvent tomber sur t-t-tout le monde.\n@c0@"
  it: "@aSancho@b¿Sabe como se dice?\nⓕEsperiamo que el diablo no ce metta el codonⓖ.\nMe auguro que aquí non succeda nada de males...\n@c0@"
  ja: "@a@bサンチョ「何事もないことが　いいのですが\n\t万が一ということも　ありますからね。\n@c0@"
473:
  de: "@aOtto@bReicht es denn, nur eine Wache am Eingang zu haben? Ich glaube, das würde mir etwas Sorgen machen.\n@c0@"
  en: "@aTuppence@bIs it okay just to have a guard on the entrance?\nI'd be a bit worried about that, I think.\n@c0@"
  es: "@aAlazar@b¿Con tener un guardia a la entrada vale?\r\nA mí me preocupa un poco.\n@c0@"
  fr: "@aInnocent@bEst-ce que ça suffit, un seul garde à l'entréeⓡ\nJe crois que ça m'inquiéterait un peu.\n@c0@"
  it: "@aSimon@bBasterà una guardia sola? Al posto di Geremia, ne avrei assunte almeno tre o quattro! Coi tempi che corrono, la prudenza non è mai troppa!\n@c0@"
  ja: "@a@bピピン「入り口だけの警備で\n\tいいんでしょうか？\n\tボクとしては　ちょっと不安ですね。\n@c0@"
474:
  de: "@aBianca@bDa braucht er sich keine Sorgen zu machen. Uns macht die ganze Sache schließlich Spaß.\n@c0@"
  en: "@aBianca@bHe dun't need to be frettin' about us. We're havin' fun with things just the way they are.\n@c0@"
  es: "@aBianca@bNo tiene que darnos la brasa. Nosotros estamos contentos con las cosas tal y como están, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl n'a pas besoin de s'inquiéter pour nous.\r\nOn profite des choses telles qu'elles sont.\n@c0@"
  it: "@aBianca@bNon mi è mai piaciuto ricevere ordini!\n@c0@"
  ja: "@a@bビアンカ「気をつかってくれなくても\n\tいいのに。　私たちも\n\t楽しんでやっているんだしね。\n@c0@"
475:
  de: "@aNera@bDas ist aber nett, nicht? Ich glaube, er fängt an, uns zu mögen!\n@c0@"
  en: "@aNera@bThat's nice, isn't it? I think he's starting to like us!\n@c0@"
  es: "@aNera@b¡Meraviglioso! Credo que empezamos a gustarle.\n@c0@"
  fr: "@aNera@bC'est bien, nonⓡ Je crois qu'il commence\nà nous apprécierⓠ\n@c0@"
  it: "@aNera@bOh, che carino!\nSi vede che Geremia adesso si fida ciecamente di noi, non è vero?\n@c0@"
  ja: "@a@bフローラ「ちょっと　うれしいですね。\n\tデスじいさんの心に\n\tふれたような　気持ちですわ。\n@c0@"
476:
  de: "@a%0%a001240@bToll! Ist das dein Gehalt, Papa? Weil du doch der Kurator bist, meine ich.\n@c0@"
  en: "@a%0%a001240@bCool! Is that your salary, Dad?\nBecause you're the curator, I mean.\n@c0@"
  es: "@a%0%a001240@b¡Genial! ¿Eso es tu salario, papi?\nComo eres el gestor, digo.\n@c0@"
  fr: "@a%0%a001240@bSuperⓠ C'est ton salaire, papaⓡ En tant que conservateur, je veux dire.\n@c0@"
  it: "@a%0%a001240@bAccidenti, quanti soldi!\nFare il direttore del Museo del Souvenir è un lavoro che rende, eh?\n@c0@"
  ja: "@a@b%a001240「えへへ。\n\tお父さん　館長だもんね！\n\tこの５００ゴールドは　お給料？\n@c0@"
477:
  de: "@a%0%a001250@bDas hat er uns doch deswegen gegeben, weil du dir solche Mühe gibst, nicht, Papa? Ich finde auch, dass du deine Sache sehr gut machst.\n@c0@"
  en: "@a%0%a001250@bHe gave you that because you're trying so hard, didn't he, Dad? I think you're doing really well too.\n@c0@"
  es: "@a%0%a001250@bTe ha dado eso porque te estás esforzando un montón, ¿verdad papi? Yo también creo que lo estás haciendo genial.\n@c0@"
  fr: "@a%0%a001250@bIl t'a donné cet argent parce que tu fais tout ce\nque tu peux, hein, papaⓡ Moi aussi, je trouve\nque tu t'en sors très bien.\n@c0@"
  it: "@a%0%a001250@bQuesta è la ricompensa per aver aiutato il Museo, esatto?\nÈ proprio vero: il lavoro paga!\n@c0@"
  ja: "@a@b%a001250「がんばってるから\n\t分けまえ　もらえたのね。\n\tよかったね　お父さん。\n@c0@"
478:
  de: "@aSancho@bNisst jeder bekommt die Gelegenheit, siss das Museum nachts anzusehen, no?\n@c0@"
  en: "@aSancho@bEes no normal to esee the museum at night, eh?\n@c0@"
  es: "@aSancho@bPues no es muy normal venir al museo de noche.\n@c0@"
  fr: "@aSancho@bÇa n'est pas normal de p-p-pouvoir visiter le musée de nuit, noⓡ\n@c0@"
  it: "@aSancho@b¿El señor Geremia es un vero taccagnos, eh?\n@c0@"
  ja: "@a@bサンチョ「なかなか　夜の博物館なんて\n\t見られるものでは　ありませんよ。\n@c0@"
479:
  de: "@aSancho@bDas ist sisser, weil du der Kurator bist, Chico. Sí, das haben wir dir zu verdanken, Gracias, gracias.\n@c0@"
  en: "@aSancho@bEes because you are the curator now, friend.\r\nSí, ees thanks to you. Gracias, gracias.\n@c0@"
  es: "@aSancho@bEs porque tú eres el gestor, chamaco.\r\nSí todo es gracias a ti, nomás. ¡Órale!\n@c0@"
  fr: "@aSancho@bC'est seulement parce que c'est toi le\r\nc-c-conservateur, chico. Si, c'est grâce\r\nà toi. Gracias, gracias.\n@c0@"
  it: "@aSancho@bEl Museo está andando alla grandes, quindi se potrebbe permettere de essere un pocos más munificos...\n@c0@"
  ja: "@a@bサンチョ「これも　%a000090王が\n\t館長を　つとめている　おかげです。\n@c0@"
480:
  de: "@aOtto@bFünfhundert Goldmünzen? Mehr nicht?! Das ist ein Sklaventreiber, wenn Ihr mich fragt, %a000090!\n@c0@"
  en: "@aTuppence@bFive hundred gold coins? That's it!?\nHe's a slave-driver if you ask me, %a000090!\n\n@c0@"
  es: "@aAlazar@b¿Quinientas monedas de oro? ¿Nada más?\nEste tipo es un negrero, %a000090.\n@c0@"
  fr: "@aInnocent@b500 pièces d'orⓡ C'est toutⓡⓐ\nC'est de l'esclavage, si vous voulez mon avis, %a000090ⓠ\n@c0@"
  it: "@aSimon@bAppena cinquecento monete d'oro?!\nMa sono al netto delle imposte oppure al lordo?\n\n@c0@"
  ja: "@a@bピピン「分けまえが　５００ゴールド！？\n\tずいぶん　安く　つかわれてますね\n\t%a000090王って……。\n@c0@"
481:
  de: "@aBianca@bAber ich wollte mich doch gar nicht beschweren!\nDu etwa?\n@c0@"
  en: "@aBianca@bI wasn't plannin' on complainin' though, were you?\n@c0@"
  es: "@aBianca@bIba a quejarme, ¿y tú?\n@c0@"
  fr: "@aBianca@bMais je n'avais pas l'intention de me plaindre,\net toi non plus, je me trompeⓡ\n@c0@"
  it: "@aBianca@bDiamine!\nMa non abbiamo nemmeno il diritto di dire la nostra, eh?!\n@c0@"
  ja: "@a@bビアンカ「べつに　文句を言う気なんて\n\tぜんぜん　ないんだけど……。\n@c0@"
482:
  de: "@aNera@bEr ist sehr streng, nicht? Aber es ist vermutlich zu deinem eigenen Besten.\n@c0@"
  en: "@aNera@bHe's very strict, isn't he?\nBut it's probably for our own good, I expect.\n@c0@"
  es: "@aNera@bEs veramente estricto, ¿verdad?\r\nMa supongo que será per il nostro bien.\n@c0@"
  fr: "@aNera@bIl est très sévère, nonⓡ\nMais j'imagine que c'est pour notre bien.\n@c0@"
  it: "@aNera@bAccidenti, che caratteraccio!\n@c0@"
  ja: "@a@bフローラ「おじいさんは　きびしい方ですね。\n\tでも　私たちのことを思って\n\t言ってくれて　いるのでしょう。\n@c0@"
483:
  de: "@a%0%a001240@bGerade als ich dachte, er würde jetzt ein bisschen zugänglicher, kommt der alte Grantler wieder zum Vorschein.\n@c0@"
  en: "@a%0%a001240@bJust when I thought he was getting a bit nicer,\nhe goes back to being Mr Grumpy.\n@c0@"
  es: "@a%0%a001240@bJusto ahora que empezaba a creer que se estaba volviendo más amable, vuelve a convertirse en e rey de los gruñones.\n@c0@"
  fr: "@a%0%a001240@bEt moi qui commençais tout juste à le trouver\nun peu plus sympa. Ça restera monsieur Grincheux, dans ce cas.\n@c0@"
  it: "@a%0%a001240@bAh, Geremia non cambierà mai!\nEppure mi era sembrato che si fosse dato una calmata...\n@c0@"
  ja: "@a@b%a001240「やさしいかと思ったら\n\tいつもの　おじいさんに\n\tもどっちゃったね。\n@c0@"
484:
  de: "@a%0%a001250@bKomm, Papa, Wir suchen einfach jede Menge weiteren Firlefanz und überraschen den Alten damit.\n@c0@"
  en: "@a%0%a001250@bCome on, Dad. Let's find loads more knick-knacks and really surprise the old man.\n@c0@"
  es: "@a%0%a001250@b¡Vamos, papi! Vamos a buscar más cosinas y darle una sorpresa al abuelo.\n@c0@"
  fr: "@a%0%a001250@bAllez, papa. Allons trouver plein d'autres pièces pour réellement surprendre le vieil homme.\n@c0@"
  it: "@a%0%a001250@bChe maleducato! Sai che ti dico? Andiamo a cercare qualche altro souvenir per il Museo, così lasceremo quel villanzone di Geremia a bocca aperta!\n@c0@"
  ja: "@a@b%a001250「お父さん　もっと\n\tいっぱい　名産　集めて\n\tおじいさんを　びっくりさせようよ。\n@c0@"
485:
  de: "@aSancho@bNisst jeder bekommt die Gelegenheit, siss das Museum nachts anzusehen, no?\n@c0@"
