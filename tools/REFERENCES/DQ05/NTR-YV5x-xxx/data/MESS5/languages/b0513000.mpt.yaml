  ja: "@a@bサンチョ「うら若き女性が　博物館で\n\tあのような　かっこうをなさっては……。\n@c0@"
125:
  de: "@aOtto@bEin Häschenmädel? Komisch aussehen? Aber nie im Leben! Häschenmädel sind jederzeit und überall willkommen, wenn Ihr mich fragt!\n@c0@"
