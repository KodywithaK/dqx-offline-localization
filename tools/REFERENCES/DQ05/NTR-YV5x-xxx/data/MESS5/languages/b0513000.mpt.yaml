  fr: "@a%0%a001240@bAlors, les fantômes aussi, ça dortⓡ C'est rigolo.\n@c0@"
  it: "@a%0%a001240@bNon avevo mai sentito nessuno russare in questo modo...\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「ゆうれいでも　眠るんだね。\n\tなんだか　ふしぎだなあ。\n@c0@"
504:
  de: "@a%0%a001250@bHoffentlich ist er nicht einsam, so ganz allein.\n@c0@"
  en: "@a%0%a001250@bI hope he isn't lonely, all on his own.\n@c0@"
  es: "@a%0%a001250@bEspero que no se sienta solo aquí.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'il ne se sent pas trop seul ici,\nsans personne.\n@c0@"
  it: "@a%0%a001250@bGuarda come dorme!\nSembra un bambino...\nSolo che i bambini non russano tanto! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「おじいさん　ひとりで\n\tさみしくないのかな……。\n@c0@"
505:
  de: "@aSancho@bWeck ihn nisst auf, ja, Chico? Er ist sisser sehr müde.\n@c0@"
  en: "@aSancho@bYou no wake heem up, okay, friend?\nHe ees very tired.\n@c0@"
  es: "@aSancho@bNo lo despiertes, chamaco.\r\nEstá retecansado.\n@c0@"
  fr: "@aSancho@bNe le r-r-réveille pas, de acuerdo, chicoⓡ\nIl est très f-fatigué.\n@c0@"
  it: "@aSancho@bPare proprio que el señor Geremia abbia avuto un día muy faticosos...\nLasciamolo dormire en paz...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん\n\t起こしては　いけませんよ。\n\tなにやら　おつかれのご様子です。\n@c0@"
506:
  de: "@aOtto@bH-Hier gibt's doch nicht noch mehr Gespenster? Außer dem alten Franz, meine ich?\n@c0@"
  en: "@aTuppence@bThere, there are no other ghosts about other than Old Man Nick Knack, are there?\n@c0@"
  es: "@aAlazar@bNo habrá más fantasmas por aquí que el abuelo Nino, ¿verdad?\n@c0@"
  fr: "@aInnocent@bBon, euh... Il n'y a pas d'autres fantômes que le vieux Bricabrac par ici, dites-moiⓡ\n@c0@"
  it: "@aSimon@bDi notte il Museo è tranquillo e silenzioso...\n@c0@"
  ja: "@a@bピピン「デスじいさん以外に\n\tゆうれいの人は　いませんよね？\n@c0@"
507:
  de: "@aOtto@bWisst Ihr, ich glaube, es ist keine gute Idee, hier die Nacht zu verbringen. Nein, ganz bestimmt keine gute Idee.\n@c0@"
  en: "@aTuppence@bI don't think it's a good idea to spend the night here, you know. No, definitely not a good idea.\n@c0@"
  es: "@aAlazar@bNo creo que pasar la noche aquí sea buena idea, ¿sabéis? No, seguro que no.\n@c0@"
