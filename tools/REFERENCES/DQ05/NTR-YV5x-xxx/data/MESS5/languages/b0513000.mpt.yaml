487:
  de: "@aOtto@bAber nur fünfhundert? Das ist doch reine Halsabschneiderei! Da verdien' ja sogar ich noch mehr!\n@c0@"
  en: "@aTuppence@bBut only five hundred? That's daylight robbery.\nIt's less than my salary, even.\n@c0@"
