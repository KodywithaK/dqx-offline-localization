  es: "@aAlazar@b¿Una conejita?, ¿rara? ¡Jamás! Las conejitas son bienvenidas siempre y en todo lugar, o así sería si por mí fuera.\n@c0@"
  fr: "@aInnocent@bUne serveuse en costume de lapinⓡ Bizarreⓡ Jamaisⓠ Elle sont les bienvenues partout et\ntout le temps, en ce qui me concerneⓠ\n@c0@"
  it: "@aSimon@bEh eh eh!\nA me quel vestitino piace tanto.\nQuasi quanto la ragazza che lo indossa...\n@c0@"
  ja: "@a@bピピン「ボクは　大かんげいですよ！\n\tバニーさんって　どこで見ても\n\tいいですよねっ！\n@c0@"
126:
  de: "@aBianca@bDu hast doch nicht etwa eine Schwäche für sie, %a000090?\n@c0@"
