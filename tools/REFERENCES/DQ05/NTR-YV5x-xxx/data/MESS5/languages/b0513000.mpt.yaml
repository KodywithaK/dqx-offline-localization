  es: "@aNera@b¿Crees que querrá quedarse? ¿Y la cena? ¿Y la ducha de la matina?\n@c0@"
  fr: "@aNera@bTu crois qu'il veut voir comment ce musée est géréⓡ Mais comment il va faire pour le dînerⓡ Et pour prendre sa douche demain matinⓡ\n@c0@"
  it: "@aNera@bDev'essere un vero appassionato di souvenir, visto da quanto tempo è qui al Museo!\n@c0@"
  ja: "@a@bフローラ「泊まりこみで　博物館を\n\t見学なさるんですか？　お食事とか\n\tおふろとか　どうなさるんでしょう？\n@c0@"
496:
  de: "@a%0%a001240@bEr hat sich den ganzen Tag schon die Ausstellungsstücke angesehen? Ich hab's doch gewusst. Der ist wirklich ziemlich komisch.\n@c0@"
  en: "@a%0%a001240@bHe spent the whole day looking at the exhibits?\nI knew it. He's definitely a bit weird.\n@c0@"
  es: "@a%0%a001240@b¿Se pasa el día mirando las cosinas?\nLo sabía. Está claro que es un poco rarito.\n@c0@"
  fr: "@a%0%a001240@bIl a passé toute la journée à regarder notre collectionⓡ J'en étais sûr... Il a vraiment un grain.\n@c0@"
  it: "@a%0%a001240@bUna persona ha passato tutto il giorno ad ammirare i souvenir?! Ma non ha fatto nemmeno una pausa per mangiare qualcosa?! Nemmeno per andare in bagno?!\n@c0@"
  ja: "@a@b%a001240「一日じゅう　名産品を\n\t見ていたいのかな……。\n\tやっぱり　変わった人なんだね。\n@c0@"
497:
  de: "@a%0%a001250@bWir können ihn doch nicht rauswerfen! Was machen wir denn nun?\n@c0@"
  en: "@a%0%a001250@bWe can't throw him out, so what are we going to do?\n@c0@"
  es: "@a%0%a001250@bNo lo podemos echar, así que, ¿qué vamos a hacer?\n@c0@"
  fr: "@a%0%a001250@bOn ne peut quand même pas le jeter dehorsⓠ\nQu'est-ce qu'on va faire, alorsⓡ\n@c0@"
  it: "@a%0%a001250@bNon potremmo dirgli con gentilezza che deve andarsene?\n@c0@"
  ja: "@a@b%a001250「あの　おじいさんが\n\t追い出せないなんて…\n\tこまった人だね。\n@c0@"
498:
  de: "@aSancho@bAber wenn dieser Señor hier die Nacht verbringt, macht siss seine Familie dann keine Sorgen um ihn?\n@c0@"
  en: "@aSancho@bBut eef thees señor, he estays the night here, hees family, they gonna worry about heem, sí?\n@c0@"
  es: "@aSancho@bPero si ese señor pasa la noche aquí, igual su familia se preocupa.\n@c0@"
  fr: "@aSancho@bMais si ce s-señor passe la nuit ici, sa f-f-famille va s'inquiéter, noⓡ\n@c0@"
  it: "@aSancho@b¿Un señor ha trascorso todo el día nel Museo?\n¡Ay, certa gentes no ha proprio nada da fare!\n@c0@"
  ja: "@a@bサンチョ「博物館に寝泊まりして\n\tご家族の方は\n\t心配なさらないんでしょうか？\n@c0@"
499:
  de: "@aOtto@bTja, ich kann ihn verstehen. Hier ist es nett und ruhig und die Aussicht ist fantastisch.\n@c0@"
  en: "@aTuppence@bWell, I can understand how he feels.\r\nIt's nice and quiet here, and the view's fantastic.\n@c0@"
  es: "@aAlazar@bBueno, entiendo cómo se siente.\r\nAquí se está a gusto y hay paz, y las vistas son fantásticas.\n@c0@"
  fr: "@aInnocent@bJe le comprends, en fait. C'est beau et calme, ici,\r\net la vue est magnifique.\n@c0@"
  it: "@aSimon@bNon mi stupirei se quel tipo volesse passare la notte al Museo...\n㈡\nÈ l'unico momento in cui si possono ammirare i souvenir con calma, vista la folla che c'è di giorno!\n@c0@"
  ja: "@a@bピピン「帰りたくなくなるのも\n\tわかりますけどね。\n\tここは　静かだし　ながめもいいし。\n@c0@"
500:
  de: "@aBianca@bEr klingt etwas müde. Gönnen wir ihm seinen Schlaf.\n@c0@"
  en: "@aBianca@bHe sounds a bit tired. We should let him get\r\nsome sleep.\n@c0@"
  es: "@aBianca@bParece cansado. Deberíamos dejarle dormir, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a l'air fatigué. On devrait le laisser dormir un peu.\n@c0@"
  it: "@aBianca@bDev'essere molto stanco.\nMeglio lasciarlo riposare in pace...\n@c0@"
  ja: "@a@bビアンカ「おじいさん　つかれたのかな？\n\tゆっくり　寝かせてあげようね。\n@c0@"
501:
  de: "@aNera@bWahrscheinlich hat der alte Firle Franz auf eigene Faust saubergemacht, wenn wir nicht hier waren.\n@c0@"
  en: "@aNera@bI suppose Old Man Nick's been cleaning on his own when we're not here.\n@c0@"
