  fr: "@aNera@bJe suppose que le vieux Bricabrac fait le ménage tout seul quand nous ne sommes pas là.\n@c0@"
  it: "@aNera@bImmagino che il vecchio Geremia si dia molto da fare al Museo quando non ci siamo...\n@c0@"
  ja: "@a@bフローラ「私たちが　いないあいだ\n\tおじいさんが　ひとりで　おそうじとか\n\tしてくださってるんですよね？\n@c0@"
502:
  de: "@aNera@bDer Arme. Sicher ist er erschöpft.\n@c0@"
  en: "@aNera@bPoor man. He must be exhausted.\n@c0@"
  es: "@aNera@b¡Povero! Debe de estar agotado.\n@c0@"
  fr: "@aNera@bLe pauvre. Il doit être épuisé.\n@c0@"
  it: "@aNera@bPoveretto, sarà stanco morto.\nSu, lasciamolo dormire...\n@c0@"
  ja: "@a@bフローラ「おつかれさまです……。\n@c0@"
503:
  de: "@a%0%a001240@bGespenster schlafen also auch? Das ist ja witzig.\n@c0@"
  en: "@a%0%a001240@bSo ghosts sleep too? That's funny.\n@c0@"
