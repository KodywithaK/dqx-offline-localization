0:
  de: "@a@b*: Ich bin Monty, der berühmte Monsterhüter.\n@c0@"
  en: "@a@b*: I'm Monty, the famous monster monitor.\n@c0@"
  es: "@a@b*: Soy Moncho, el famoso cuidador de monstruos.\n@c0@"
  fr: "@a@b*ⓢ Je suis Ciobair, le célèbre berger,\nspécialiste des monstres.\n@c0@"
  it: "@aMister Muster@b*: Salve, come va?\nIo sono Mister Muster, il Maestro dei Mostri.\n@c0@"
  ja: "@a@b＊「わしゃ　有名な\n\tモンスターじいさんじゃ。\n@c0@"
1:
  de: "@aMonty@bIch passe auf die Monster anderer Leute auf.\nWas kann ich heute für Euch tun? \n@c0@"
  en: "@aMonty@bI take care of folks' monsters for them.\r\nWhat can I do for you today?\n@c0@"
  es: "@aMoncho@bMi trabajo es cuidar de los monstruos de la gente.\r\n¿Qué desea?\n@c0@"
  fr: "@aCiobair@bJe prends soin des monstres que les gens\nme confient. Que puis-je faire pour vousⓡ\n@c0@"
  it: "@aMister Muster@bMi prendo cura delle creature i cui legittimi proprietari sono troppo occupati per badare a loro.\nAllora, %H0860%Xdimmi: cosa posso fare per te%Yditemi: cosa posso fare per voi%Z?\n@c0@"
  ja: "@a@b＊「仲間のモンスターの\n\tめんどうを　みるぞい。\n\tどんな用じゃな？\n@c0@"
2:
  de: "@aMonty@bEs tut mir leid, %A0110%Xmein Herr%Z%B0110%Xmeine Dame%Z, aber der Monstergarten ist momentan zum Bersten voll.\n@c0@"
  en: "@aMonty@bSorry, %A0110%Xmister%Z%B0110%Xlady%Z, but the monstergarten is full to bursting at the moment.\n@c0@"
  es: "@aMoncho@bLo siento, %A0110%Xcaballero%Z%B0110%Xseñora%Z, pero tengo la monstrería llena hasta los topes.\n@c0@"
  fr: "@aCiobair@bDésolé, %A0110%XMonsieur%Z%B0110%XMadame%Z, mais le Refuge est plein à craquer en ce moment.\n@c0@"
  it: "@aMister Muster@b%H0860%X%A0110%XAmico mio%Z%B0110%XAmica mia%Z%Y%R0000%XAmiche mie%YAmici miei%Z%Z, il Monstergarten è al completo in questo momento.\nMi spiace dirlo, ma le cose stanno proprio così.\n@c0@"
  ja: "@a@b＊「すまんが　わしのところは\n\tもう　いっぱいじゃ。\n@c0@"
3:
  de: "@aMonty@bIhr müsst Euch also leider von jemandem trennen, um etwas Platz zu schaffen, wenn Ihr mir ein paar neue Monsterchen hierlassen wollt.\n@c0@"
  en: "@aMonty@bI'm afraid you'll have to part ways with someone to free up some space if you want to give me any new little ones to look after.\n@c0@"
  es: "@aMoncho@bMe temo que tendrá que despedirse de algún monstruo para hacer sitio si quiere que cuide a algún otro pequeñuelo.\n@c0@"
  fr: "@aCiobair@bVous allez devoir vous séparer de quelqu'un\r\nsi vous voulez libérer un peu de place et me\r\nconfier des petits nouveaux.\n@c0@"
  it: "@aMister Muster@bTemo che %H0860%Xdovrai dare il benservito a qualcuno, se vorrai%Ydovrete dare il benservito a qualcuno, se vorrete%Z che mi occupi di qualche altro mostro...\n@c0@"
  ja: "@a@b＊「これ以上　預けたいなら\n\tつらいことじゃが　誰かと別れて\n\t空きを　つくるしかないのう。\n@c0@"
4:
  de: "@aMonty@bAlso wirklich, %A0110%Xmein Herr%Z%B0110%Xmeine Dame%Z, ich glaube nicht, dass Ihr jemanden braucht, der auf Euch aufpasst.\n@c0@"
  en: "@aMonty@bCome on now, %A0110%Xmister%Z%B0110%Xlady%Z! I hardly think you need me to look after you.\n@c0@"
  es: "@aMoncho@b¡Vamos, %A0110%Xcaballero%Z%B0110%Xseñora%Z! No creo que necesite que cuide de usted a estas alturas.\n@c0@"
  fr: "@aCiobair@bVoyons, %A0110%XMonsieur%Z%B0110%XMadame%Zⓠ J'ai du mal à croire que vous ayez besoin que je m'occupe de vous.\n@c0@"
  it: "@aMister Muster@bAh ah ah! Che %A0110%Xspiritoso%Z%B0110%Xspiritosa%Z che sei!\nE così vorresti che mi occupassi di te, eh?!\nWah ah ah! Questa sì che è buona!\n@c0@"
  ja: "@a@b＊「お前さんまで　預けて\n\tいったいどうするんじゃ？\n\t無理を　いいなさんな。\n@c0@"
5:
  de: "@aMonty@bAuf welches Monster soll ich aufpassen?\n@c0@"
  en: "@aMonty@bWhich monster would you like me to look after?\n@c0@"
  es: "@aMoncho@b¿Qué monstruo querría que le cuidase?\n@c0@"
  fr: "@aCiobair@bDe quel monstre voulez-vous que je m'occupeⓡ\n@c0@"
  it: "@aMister Muster@bDi quale mostro %H0860%Xvuoi%Yvolete%Z che mi occupi?\n@c0@"
  ja: "@a@b＊「どの　モンスターを\n\t預けるつもりじゃ？\n@c0@"
6:
  de: "@aMonty@bAlso wirklich, %A0110%Xmein Herr%Z%B0110%Xmeine Dame%Z, ich glaube nicht, dass Ihr jemanden braucht, der auf Euch aufpasst.\n@c0@"
  en: "@aMonty@bCome on now, %A0110%Xmister%Z%B0110%Xlady%Z! I hardly think you need me to look after you.\n@c0@"
  es: "@aMoncho@b¡Vamos, %A0110%Xcaballero%Z%B0110%Xseñora%Z! No creo que necesite que cuide de usted a estas alturas.\n@c0@"
  fr: "@aCiobair@bVoyons, %A0110%XMonsieur%Z%B0110%XMadame%Zⓠ J'ai du mal à croire que vous ayez besoin que je m'occupe de vous.\n@c0@"
  it: "@aMister Muster@b%A0110%XAmico mio%Z%B0110%XAmica mia%Z, non vorrai mica che mi occupi di te...?\n@c0@"
  ja: "@a@b＊「お前さんを　預けて\n\tいったいどうするんじゃ？\n\t無理を　いいなさんな。\n@c0@"
7:
  de: "@aMonty@bIch weiß nicht, ob %a000180 davon sehr begeistert wäre.\n@c0@"
  en: "@aMonty@bI don't know how happy %a000180 would be about that.\n@c0@"
  es: "@aMoncho@bNo creo que a %a000180 le guste demasiado.\n@c0@"
  fr: "@aCiobair@bJe ne suis pas sûr %G0180%Xqu'%Yque %Z%a000180 apprécie...\n@c0@"
  it: "@aMister Muster@bDubito che %a000180 apprezzerebbe la cosa...\n@c0@"
  ja: "@a@b＊「そんなことを　いったら\n\t%a000180が　泣くぞ。\n@c0@"
8:
  de: "@aMonty@bAußerdem kümmere ich mich hier nur um Monster.\n@c0@"
  en: "@aMonty@bBesides, I only take care of monsters here.\n@c0@"
  es: "@aMoncho@bAdemás, aquí solo cuido de monstruos.\n@c0@"
  fr: "@aCiobair@bEt de surcroît, je ne m'occupe que des monstres.\n@c0@"
  it: "@aMister Muster@bVedi, io mi occupo solo di mostri.\n@c0@"
  ja: "@a@b＊「わしが　めんどうを見るのは\n\tモンスターだけじゃ。\n@c0@"
9:
  de: "@aMonty@bAber wenn ich Euch aufnehme, wer kümmert sich dann um den Wagen?\n@c0@"
  en: "@aMonty@bBut if I took you in, who would that leave to look after the wagon?\n@c0@"
  es: "@aMoncho@bPero, si le acogiese a usted, ¿quién cuidaría del carromato?\n@c0@"
  fr: "@aCiobair@bMais si je vous acceptais, qui resterait-il pour surveiller le chariotⓡ\n@c0@"
  it: "@aMister Muster@bSe ti accettassi nel Monstergarten, chi si occuperebbe del carro, eh?!\n@c0@"
  ja: "@a@b＊「しかし　お前さんまで\n\tわしのところへ来たら\n\t後は　誰が　馬車を引くんじゃ？\n@c0@"
10:
  de: "@aMonty@bIhr wollt doch wohl nicht jemanden in meine Obhut geben, der im Sarg liegt, oder? Also, das ist doch ein starkes Stück.\n@c0@"
  en: "@aMonty@bYou're not planning on giving me someone in a coffin to look after, surely!? That seems a bit rough.\n@c0@"
  es: "@aMoncho@b¡No pretenderá en serio que cuide de un monstruo que está en un ataúd, ¿verdad?!\r\nEs un poco violento.\n@c0@"
  fr: "@aCiobair@bVous n'envisagez quand même pas de me confier un monstre qui se trouve dans un cercueilⓠⓑ\nC'est un peu rude.\n@c0@"
  it: "@aMister Muster@bNon %H0860%Xvorrai%Yvorrete%Z mica lasciarmi una creatura... leggermente defunta?!\n@c0@"
  ja: "@a@b＊「なんと！　そんなじょうたいのまま\n\t預けるつもりか？\n\tそれは　あんまりじゃぞ！\n@c0@"
11:
  de: "@aMonty@bIhr werdet mir jetzt wahrscheinlich erzählen wollen, dass Ihr es Euch zurzeit einfach nicht leisten könnt, für eine Wiedererweckung zu zahlen?\n@c0@"
  en: "@aMonty@bI suppose you're going to tell me you can't afford to pay for a resurrection at the moment, right?\n@c0@"
  es: "@aMoncho@b¿Se ha quedado sin dinero para resurrecciones?\n@c0@"
  fr: "@aCiobair@bVous allez sûrement me dire que vous n'avez pas\nles moyens de payer une résurrection pour l'instant, c'est çaⓡ\n@c0@"
  it: "@aMister Muster@b%H0860%XLasciami%YLasciatemi%Z indovinare: non %H0860%Xhai%Yavete%Z il denaro necessario per celebrare il rito di resurrezione. Dico bene?\n@c0@"
  ja: "@a@b＊「それとも　今は　生きかえす\n\tお金が　ないのかの？\n@c0@"
12:
  de: "@aMonty@bTja, da kann man wohl nichts machen. Seid unbesorgt, %a000180%K0180%X'%Ys%Z Sarg ist bei mir in guten Händen!\n@c0@"
  en: "@aMonty@bWell, then I suppose there's nothing for it.\nConsider %a000180's coffin duly in my care.\n@c0@"
  es: "@aMoncho@bAsí pues, supongo que no hay alternativa. Me quedo al cuidado del ataúd de %a000180.\n@c0@"
  fr: "@aCiobair@bBon, dans ce cas... Je prendrai soin du cercueil %G0180%Xd'%Yde %Z%a000180.\n@c0@"
  it: "@aMister Muster@bCapisco. Beh, allora non c'è alternativa...\nMi prenderò cura della bara di %a000180.\n@c0@"
  ja: "@a@b＊「では　しかたがないのう。\n\t%a000180の　ひつぎ\n\tたしかに　預かったぞ。\n@c0@"
13:
  de: "@aMonty@bIn diesem Fall würde ich Euch nahelegen, %a000180 zunächst wieder zum Leben zu erwecken. Das ist doch ein Gebot der Höflichkeit.\n@c0@"
  en: "@aMonty@bIn that case, I suggest you bring %a000180 back to life first. It's only polite, after all.\n@c0@"
  es: "@aMoncho@bEn ese caso, le sugiero que antes resucite a %a000180. Es una cuestión de cortesía.\n@c0@"
  fr: "@aCiobair@bDans ce cas, je vous suggère de ramener d'abord %a000180 à la vie. C'est la moindre des politesses, quand même.\n@c0@"
  it: "@aMister Muster@bIn tal caso, %H0860%Xti%Yvi%Z suggerisco di far tornare in vita %a000180.\nSì, credo che sia la cosa migliore da fare...\n@c0@"
  ja: "@a@b＊「じゃったら　生きかえして\n\tあげなされ。\n\t%a000180が　かわいそうじゃ。\n@c0@"
14:
  de: "@aMonty@bIch soll auf %a000180 aufpassen? Wie Ihr wünscht.\n@c0@"
  en: "@aMonty@bYou'd like me to look after %a000180?\nVery well.\n@c0@"
  es: "@aMoncho@b¿Quiere que cuide de %a000180? Muy bien.\n@c0@"
  fr: "@aCiobair@bVous aimeriez que je prenne soin %G0180%Xd'%Yde %Z%a000180ⓡ Très bien.\n@c0@"
  it: "@aMister Muster@b%H0860%XVuoi%YVolete%Z che mi prenda cura di %a000180?\nAgli ordini, %H0860%X%A0110%Xamico mio%Z%B0110%Xamica mia%Z%Y%R0000%Xamiche mie%Yamici miei%Z%Z!\n@c0@"
  ja: "@a@b＊「%a000180を　預けるんじゃな？\n\tよし　引きうけたぞ。\n@c0@"
15:
  de: "@aMonty@bIch lege alle Gegenstände, die nicht ausgerüstet sind, in Euren Beutel da, einverstanden?\n@c0@"
  en: "@aMonty@bI'll put any items that aren't equipped into your bag there for you, okay?\n@c0@"
  es: "@aMoncho@bPondré los objetos que no tenga equipados en su bolsa, ¿de acuerdo?\n@c0@"
  fr: "@aCiobair@bJe vais mettre tous les objets qui ne sont pas équipés dans votre sac, d'accordⓡ\n@c0@"
  it: "@aMister Muster@bMetterò nella borsa gli oggetti che non fanno parte dell'equipaggiamento.\n@c0@"
  ja: "@a@b＊「装備している物　以外は\n\tその　%a001400に\n\t入れておくからな。\n@c0@"
16:
  de: "@aMonty@bManche Leute können sich nämlich sonst nicht merken, wer was bei sich hatte.\n@c0@"
  en: "@aMonty@bSome folk have a tendency to forget who has what otherwise, you see.\n@c0@"
  es: "@aMoncho@bSi no lo hago así, hay personas que se olvidan de quién llevaba qué.\n@c0@"
  fr: "@aCiobair@bSans cela, certaines personnes ont tendance à oublier qui porte quoi, voyez-vous.\n@c0@"
  it: "@aMister Muster@bCosì è più pratico, no?\nCosì non %H0860%Xrischi%Yrischiate%Z di dimenticare nessun oggetto!\n@c0@"
  ja: "@a@b＊「こうしないと　大切な物を\n\t誰に　持たせたのか\n\t忘れてしまう人が　おるでな。\n@c0@"
17:
  de: "@aMonty@bSoll ich mich heute sonst noch um jemanden kümmern?\n@c0@"
  en: "@aMonty@bWould you like me to take care of anyone else for you today?\n@c0@"
  es: "@aMoncho@b¿Desea que cuide de algún otro monstruo?\n@c0@"
  fr: "@aCiobair@bVoulez-vous me confier quelqu'un d'autre, aujourd'huiⓡ\n@c0@"
  it: "@aMister Muster@b%H0860%XDimmi, vuoi%YDitemi, volete%Z che mi prenda cura di qualcun altro?\n@c0@"
  ja: "@a@b＊「ほかのモンスターも\n\t預かってほしいかの？\n@c0@"
18:
  de: "@aMonty@bIch glaube nicht, dass es sehr schlau wäre, Eure Gruppe noch größer werden zu lassen, als sie sowieso schon ist.\n@c0@"
  en: "@aMonty@bI don't think it'd be very clever to make your party any bigger than it already is.\n@c0@"
  es: "@aMoncho@bCreo que no es muy sensato aumentar el grupo.\n@c0@"
  fr: "@aCiobair@bJe ne crois pas qu'il serait très avisé d'agrandir davantage votre équipe.\n@c0@"
  it: "@aMister Muster@bNon credo che %H0860%Xtu possa%Ypossiate%Z allargare ulteriormente il gruppo...\n@c0@"
  ja: "@a@b＊「それ以上　仲間を\n\t連れ歩くのは　感心できんな。\n@c0@"
19:
  de: "@aMonty@bWieso gebt Ihr nicht erst eins von Euren Monsterchen in meine Obhut?\n@c0@"
  en: "@aMonty@bWhy don't you check someone else in here with me first?\n@c0@"
  es: "@aMoncho@b¿Por qué no deja antes a algún monstruo más aquí, a mi cuidado?\n@c0@"
  fr: "@aCiobair@bPourquoi ne pas commencer par me confier quelqu'unⓡ\n@c0@"
  it: "@aMister Muster@bPrima di aggiungere nuovi membri, %H0860%Xdovresti%Ydovreste%Z prima affidarmi qualche mostro...\n@c0@"
  ja: "@a@b＊「まず　誰かを\n\t預けたらどうじゃ？\n@c0@"
20:
  de: "@aMonty@bHier muss es sich um ein Missverständnis handeln. Ich habe zurzeit keines von Euren Monstern in meinem Monstergarten.\n@c0@"
  en: "@aMonty@bThere must be some sort of misunderstanding. I don't have any of your monsters in the monstergarten at the moment.\n@c0@"
  es: "@aMoncho@bDebe de ser un malentendido. En este momento no tengo a ninguno de sus monstruos en mi monstrería.\n@c0@"
  fr: "@aCiobair@bIl doit y avoir un malentendu. Mon Refuge n'abrite aucun de vos monstres, pour l'instant.\n@c0@"
  it: "@aMister Muster@bMa che %H0860%Xdici%Ydite%Z?!\n%H0860%XGuarda che non hai%YGuardate che non avete%Z nessun mostro qui al Monstergarten!\n@c0@"
  ja: "@a@b＊「そんなことを　いっても\n\t今は　１匹も預かっておらんぞ。\n@c0@"
21:
  de: "@aMonty@bWen wollt Ihr denn abholen?\n@c0@"
  en: "@aMonty@bWho've you come to collect?\n@c0@"
  es: "@aMoncho@b¿A quién ha venido a recoger?\n@c0@"
  fr: "@aCiobair@bQui êtes-vous %A0110%Xvenu%Z%B0110%Xvenue%Z chercherⓡ\n@c0@"
  it: "@aMister Muster@bChi %H0860%X%A0110%Xsei venuto%Z%B0110%Xsei venuta%Z%Y%R0000%Xsiete venute%Ysiete venuti%Z%Z a prendere?\n@c0@"
  ja: "@a@b＊「誰を　むかえに来たのかの？\n@c0@"
22:
  de: "@aMonty@bHe da, %a000180! Es geht heimwärts!\n@c0@"
  en: "@aMonty@bHey, %a000180! It's home time!\n@c0@"
  es: "@aMoncho@b¡Eh, %a000180! ¡Ya puedes volver a casa!\n@c0@"
  fr: "@aCiobair@bHé, %a000180ⓠ\nC'est l'heure de rejoindre les tiensⓠ\n@c0@"
  it: "@aMister Muster@bForza, %a000180!\nIl tuo periodo di riposo è finito!\n@c0@"
  ja: "@a@b＊「おーい　%a000180！\n\tおむかえじゃぞ！\n@c0@"
23:
  de: "@a@b%0%a000180 schließt sich der Gruppe an.\n@c0@"
  en: "@a@b%0%a000180 joins the party.\n@c0@"
  es: "@a@b%0%a000180 se une al grupo.\n@c0@"
  fr: "@a@b%0%a000180 rejoint l'équipe.\n@c0@"
  it: "@a@b%0%a000180 si unisce al gruppo!\n@c0@"
  ja: "@a@b%a000180が　仲間に　くわわった！\n@c0@"
24:
  de: "@a@b%0%a000180 steigt in den Wagen.\n@c0@"
  en: "@a@b%0%a000180 gets into the wagon.\n@c0@"
  es: "@a@b%0%a000180 sube al carromato.\n@c0@"
  fr: "@a@b%0%a000180 monte dans le chariot.\n@c0@"
  it: "@a@b%0%a000180 entra nel carro.\n@c0@"
  ja: "@a@b%a000180は　馬車に乗りこんだ！\n@c0@"
