  es: "@aStefania@bIl mio papino y la mia mamma no son mis padres biológicos, ni los de la mia sorella.\n@c0@"
  fr: "@aPandora@bNera et moi ne sommes pas vraiment les enfants de mamma et de papa.\n@c0@"
  it: "@aViola@bIo e Nera non siamo figlie di Rick e Rosanna Fosconi.\n@c0@"
  ja: "@a@bデボラ「身の程を　わきまえてるわね。\n\tあんたが　私を　ほめるなんて\n\t１００年早いわ。\n@c0@"
325:
  de: "@aGriselda@bWir sind aber Schwestern. Kaum zu glauben, dass so ein ängstliches Mäuschen mit mir blutsverwandt ist.\n@c0@"
  en: "@aDebora@bWe are sisters, though, if you can believe such a timid little mouse shares any common blood with me.\n@c0@"
  es: "@aStefania@bNera es veramente la mia sorella, aunque sea difícil creer que semejante llorona tenga la misma sangre que io.\n@c0@"
  fr: "@aPandora@bMais nous sommes bien sœurs. Même s'il paraît incroyable qu'une petite souris timide comme elle partage le même sang que moi.\n@c0@"
  it: "@aViola@bSiamo sorelle, anche se è difficile credere che quella gattina timida e remissiva possa essere imparentata con una tigre come me.\n@c0@"
  ja: "@a@bフローラ「あ　デボラお姉さんとは\n\t本当の　姉妹なんですけど……。\n@c0@"
326:
  de: "@aGriselda@bWir wurden adoptiert, als wir noch klein waren, weißt du.\n@c0@"
  en: "@aDebora@bWe were adopted when we were small, you see.\n@c0@"
  es: "@aStefania@bSomos adoptadas, ¿capisci?\n@c0@"
  fr: "@aPandora@bEn réalité, nous avons été adoptées quand nous étions petites.\n@c0@"
  it: "@aViola@bSiamo state adottate dalla famiglia Fosconi che eravamo ancora molto piccole.\n@c0@"
  ja: "@a@bデボラ「あら　起きたのね。\n\tゆうべは　本当によく　眠れたわね。\n@c0@"
327:
