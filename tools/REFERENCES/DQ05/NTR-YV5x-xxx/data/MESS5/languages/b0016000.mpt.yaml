258:
  de: "@aOttmar@bEs war der Kanzler, durch den wir die Figuren bekommen haben, wisst Ihr.\n@c0@"
  en: "@aThruppence@bIt was the Chancellor who provided us all with the pieces, you see.\n@c0@"
