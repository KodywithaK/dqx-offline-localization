244:
  de: "@a@b*: Nein, Eure Majestät. Wir haben hier nichts Verdächtiges gesehen.\n@c0@"
  en: "@a@b*: No, Your Majesty. We haven't seen anything suspicious here, sir.\n@c0@"
  es: "@a@b*: No, Majestad. Aún no hemos visto nada sospechoso, señor.\n@c0@"
  fr: "@a@b*ⓢ Non, Votre Majesté. Nous n'avons rien vu de suspect par ici.\n@c0@"
  it: "@a@b*: No, Maestà.\nNon abbiamo notato nulla di sospetto.\n@c0@"
  ja: "@a@b＊「いじめないでね。\n\tボクは　悪いスライムじゃないよ。\n@c0@"
245:
  de: "@a@b*: Außer natürlich dieser seltsamen dunklen Wolke im Norden...\n@c0@"
  en: "@a@b*: There is that strange, dark cloud to the north,\r\nof course...\n@c0@"
