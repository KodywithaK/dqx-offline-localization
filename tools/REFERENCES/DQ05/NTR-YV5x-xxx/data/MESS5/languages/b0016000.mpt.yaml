  fr: "@aPrince Albert@bMesdames et messieursⓠ\nJe demande toute votre attentionⓠ\n@c0@"
  it: "@aPrincipe Alberto@bMadame e messeri,\nascoltatemi con la massima attenzione!\n@c0@"
  ja: "@a@b＊「さあ　%a000090さま！\n\tオジロン王が\n\tお待ちかねで　ございます！\n@c0@"
140:
  de: "@aPrinz Sebastian@bWie viele von Euch sicher schon wissen, ist der Bursche neben mir niemand anders als mein Neffe, König Ludwigs Sohn %a000090!\n@c0@"
  en: "@aPrince Albert@bAs I'm sure many of you are already aware, the chap standing next to me is none other than my nephew, King Pankraz's son, %a000090!\n@c0@"
  es: "@aRey Agila@bComo sin duda ya sabréis muchos, este muchacho no es otro que mi sobrino %a000090, ¡el hijo del rey Teudis!\n@c0@"
  fr: "@aPrince Albert@bJe suis sûr que la plupart d'entre vous le savent déjà, mais le jeune homme à mes côtés n'est autre que mon neveu... %0%a000090, le fils du roi Petrosⓠ\n@c0@"
  it: "@aPrincipe Alberto@bCome certo già saprete, il gentiluomo al mio fianco è mio nipote %a000090, il figlio dell'amato re Russel.\n@c0@"
  ja: "@a@b今日は　%a000090王の　即位式だ。\n勝手な行動を　とるわけには\nいかないだろう……。\n@c0@"
141:
  de: "@aPrinz Sebastian@bUnd deswegen habe ich beschlossen, die Krone abzulegen und ab sofort %a000090 aufzuladen!\n@c0@"
  en: "@aPrince Albert@bAs such, I've decided to slip off the old crown, and let %a000090 do the honours from now on!\n@c0@"
  es: "@aRey Agila@bTal es así que he decidido quitarme esta vieja corona para que, a partir de ahora, %a000090 haga los honores por mí.\n@c0@"
  fr: "@aPrince Albert@bC'est pour cette raison que j'ai décidé de lui remettre la couronne. C'est %a000090 qui tiendra désormais les rênes du royaume.\n@c0@"
  it: "@aPrincipe Alberto@bHo deciso di lasciare a %a000090 il trono di Denim, che del resto gli spetta di diritto, in quanto egli è il legittimo erede del defunto sovrano.\n@c0@"
  ja: "@a@b＊「さあ　%a000090さま！\n\tこちらで　ございます！\n@c0@"
142:
