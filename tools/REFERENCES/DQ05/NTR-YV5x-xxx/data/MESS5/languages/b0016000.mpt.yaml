  fr: "@aPandora@bQuoi qu'il en soit, quand tu seras couronné roi aujourd'hui, je deviendrai reine. Voilà le genre d'ascension sociale qui me plaîtⓠ\n@c0@"
  it: "@aViola@bComunque, oggi diventerai Re di Denim, e io sarò Regina. Da pappamolle che eri, ti ho fatto diventare capo di un regno! Niente male, no?\n@c0@"
