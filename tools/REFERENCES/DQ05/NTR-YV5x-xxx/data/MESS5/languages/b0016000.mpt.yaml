  fr: "@a@b*ⓢ Bien sûr, il y a ce nuage noir assez bizarre,\nau nord...\n@c0@"
  it: "@a@b*: Tranne quella strana nuvola scura verso nord...\n@c0@"
  ja: "@a@b＊「昔　この城の王妃さまだった\n\tマーサさまに　飼われてたんだよ。\n@c0@"
246:
