  en: "@a@b*: Oh, my Goddess! Your Majesty!\nI-I'm sorry about that! I was j-just talking to myself. Musing, really. I, er...\n@c0@"
  es: "@a@b*: ¡Oh, por la Diosa! ¡Majestad!\r\n¡Lo siento mucho! E-estaba hablando solo. Musitando, vamos. Yo, eh...\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Votre Majestéⓠ Je suis désolé.\nJ-Je me parlais à moi-même. Des bêtises... euh...\n@c0@"
  it: "@a@b*: Oh, santa dea!\nMi scusi, Maestà! Ecco, stavo solo pensando ad alta voce... Erano chiacchiere senza senso...\n@c0@"
  ja: "@a@b＊「あっ！　王さま！\n\tはい　ここは　大臣どのの\n\tお部屋で　ございます。\n@c0@"
233:
