  fr: "@a@b*ⓢ Je sais qu'elle n'est plus vraiment princesse, mais elle devrait tout de même se comporter en dame.\n@c0@"
  it: "@a@b*: So che ormai non è più la Principessa di Denim, ma ciò non toglie che dovrebbe comportarsi come una signorina ben educata!\n@c0@"
  ja: "@a@b＊「グランバニアに　栄光を！\n@c0@"
248:
  de: "@aGertraud@bWarum glaubt mir denn niemand?\n@c0@"
  en: "@aGertrude@bWhy won't anyone believe me?\n@c0@"
  es: "@aFredegunda@b¿Por qué nadie me cree?\n@c0@"
  fr: "@aGertrude@bPourquoi personne ne veut me croireⓡ\n@c0@"
  it: "@aGertrude@bMa perché non mi crede nessuno, eh?!\n@c0@"
  ja: "@a@b＊「はい　王さま。\n\t今のところ　あやしいヤツは\n\t見つかっていません。\n@c0@"
249:
  de: "@aGertraud@bIch hab's gesehen! Wirklich! Kanzler Konrad ist direkt über meinen Kopf hinweggeflogen. Da rüber. Nach Norden. Das hab ich mir net bloß ausgedacht!\n@c0@"
  en: "@aGertrude@bI saw it! I really did! Chancellor Jeeves flew right over my head. He was going that way. North, you see. I'm not making it up.\n@c0@"
  es: "@aFredegunda@b¡Lo vi! ¡En serio! El canciller Ambrosio me pasó volando por encima. Iba hacia allá. Al norte, ¿%H0860%Xves%Yveis%Z? No me lo he inventado.\n@c0@"
  fr: "@aGertrude@bJe l'ai vuⓠ C'est vraiⓠ J'ai vu le chancelier Tiquette s'envoler au-dessus de moi. Il allait par-là... vers le nord. Il faut me croire.\n@c0@"
  it: "@aGertrude@bL'ho visto! Dico davvero!\nHo visto il ministro Ligio che volava!\nEra diretto a nord! Non me lo sto inventando!\n@c0@"
  ja: "@a@b＊「ただ　なにやら\n\t北の空に　黒い雲が……。\n@c0@"
250:
  de: "@aGertraud@bIch wusste doch, dass an dem Kerl was komisch ist.\n@c0@"
