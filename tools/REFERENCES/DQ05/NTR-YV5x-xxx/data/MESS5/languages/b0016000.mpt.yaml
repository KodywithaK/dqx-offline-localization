129:
  de: "@aNera@bIch weiß eigentlich immer noch nicht so recht, was das alles zu bedeuten hat.\n@c0@"
  en: "@aNera@bI still don't really know what it all means.\n@c0@"
  es: "@aNera@bAún no sé a qué se refería.\n@c0@"
  fr: "@aNera@bJe ne sais toujours pas ce que cela veut dire.\n@c0@"
  it: "@aNera@bNon ho ancora compreso il senso delle parole di quella veggente, e non so se le capirò mai fino in fondo...\n@c0@"
  ja: "@a@bフローラ「私とデボラお姉さんはね\n\t本当は　父と母の　実の娘じゃないのよ。\n@c0@"
130:
  de: "@aNera@bIch weiß nur, dass es jetzt meine Aufgabe ist, mich um dich und um meine Kinder zu kümmern und die Kinder so gut aufzuziehen, wie ich kann.\n@c0@"
  en: "@aNera@bAll I know is that my duty now is to you and my children, and to raising them as best I can.\n@c0@"
  es: "@aNera@bSolo sé que ahora me debo a ti y a mis figlios, y que los criaré lo mejor que pueda.\n@c0@"
  fr: "@aNera@bTout ce que je sais, c'est que, maintenant, je veux me consacrer à toi et à nos enfants, et les élever de mon mieux.\n@c0@"
  it: "@aNera@bL'unica cosa che so in questo momento è che farò sempre del mio meglio per essere una brava moglie e un'ottima madre. Te lo prometto!\n@c0@"
  ja: "@a@bフローラ「まだ　ほんとうに小さい頃\n\t今の両親に　ひきとられたの。\n@c0@"
