  ja: "@a@b＊「そこに住んでいた　竜の神さまも\n\tいずこへか　姿を消して\n\tしまったということです。\n@c0@"
259:
  de: "@aOttmar@bAnscheinend waren sie im Burgverlies versiegelt.\n@c0@"
