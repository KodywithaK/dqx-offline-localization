0:
  de: "@a@b*: Diese Höhle ist alleiniges Eigentum der königlichen Familie von Humburg.\n@c0@"
  en: "@a@b*: This cave is the exclusive domain of the royal family of Gotha.\n@c0@"
  es: "@a@b*: Esta cueva es propiedad de la familia real de Pankraz.\n@c0@"
  fr: "@a@b*ⓢ Cette grotte appartient à la famille royale de Gotha.\n@c0@"
  it: "@a@b*: Questa caverna è di proprietà della famiglia reale di Denim.\n@c0@"
  ja: "@a@b＊「ここは　グランバニア王家\n\tゆかりの地。\n@c0@"
1:
  de: "@a@b*: Unbefugte sind hier net willkommen!\n@c0@"
  en: "@a@b*: Those with no business here are not welcome!\n@c0@"
  es: "@a@b*: ¡Los que no tienen nada que hacer aquí no son bienvenidos!\n@c0@"
  fr: "@a@b*ⓢ Si vous n'avez rien à faire par ici, vous devez déguerpirⓠ\n@c0@"
  it: "@a@b*: Non sono ammessi estranei!\n@c0@"
  ja: "@a@b＊「用のない者は\n\tそうそうに　立ち去れい！\n@c0@"
2:
  de: "@a@b%0%a000120 liest die Inschrift, die in den Stein gehauen ist.\n@c0@"
  en: "@a@b%0%a000120 reads the inscription carved out in the stone.\n@c0@"
  es: "@a@b%0%a000120 lee la inscripción grabada en la piedra.\n@c0@"
  fr: "@a@b%0%a000120 lit l'inscription gravée dans la pierre.\n@c0@"
  it: "@a@b%0%a000120 legge l'iscrizione scolpita sulla stele.\n@c0@"
  ja: "@a@b%a000120は\n石に　きざまれた文字を　読んだ。\n@c0@"
3:
  de: "@a@bⓞWer der Krone würdig ist, darf niemals den Weg des Krieges oder der Gewalt gehen.\n@c0@"
  en: "@a@bⓗHe who is worthy of the crown must never permit war or violence.\n@c0@"
  es: "@a@bⓕAquel que sea merecedor de la corona no debe permitir jamás guerras ni violenciaⓖ.\n@c0@"
  fr: "@a@bⓥUne personne digne de la couronne ne doit en aucun cas permettre la guerre ou la violence.\n@c0@"
  it: "@a@bⓕSolo chi si opporrà all'uso della guerra e della violenza come strumenti di offesa sarà degno di indossare la corona.ⓖ\n@c0@"
  ja: "@a@b“王たるべき者　けして\n　あらそいを　許すべからず。\n@c0@"
4:
  de: "@a@bEr muss einen Eid ablegen, dass er zwischen jenen, die einander den Rücken zuwenden, die Verständigung fördern will.\n@c0@"
  en: "@a@bⓗHe must vow to promote communication and understanding even between those whose backs are turned.\n@c0@"
  es: "@a@bⓕDebe promover la comunicación y la comprensión, incluso entre aquellos con posturas encontradasⓖ.\n@c0@"
  fr: "@a@bElle doit toujours privilégier la communication et la compréhension entre tous les hommes, quels qu'ils soient.\n@c0@"
  it: "@a@bⓕEgli promuoverà il dialogo tra le parti in lotta, al fine di chiarire qualsiasi incomprensione e di raggiungere la pace.ⓖ\n@c0@"
  ja: "@a@b“たがいに　背を向ける者あらば\n　王みずから　出向きて　ただしく\n　向かい合わせるべし。\n@c0@"
5:
  de: "@a@bDie Insignien weisen den Weg.ⓟ\n@c0@"
  en: "@a@bⓗThe insignia will guide the way.ⓘ\n@c0@"
  es: "@a@bⓕLa insignia será su guíaⓖ.\n@c0@"
  fr: "@a@bL'Emblème la guidera sur cette voie.ⓦ\n@c0@"
  it: "@a@bⓕLo stemma mostrerà il sentiero da percorrere.ⓖ\n@c0@"
  ja: "@a@b“すべては　紋章の\n　みちびくままに……。”\n@c0@"
6:
  de: "@a@bDie Königlichen Insignien von Humburg strahlen ein erhabenes Licht aus.\n@c0@"
  en: "@a@bThe Royal Insignia of Gotha gives off a dignified glow.\n@c0@"
  es: "@a@bLa Insignia Real de Pankraz reluce con dignidad.\n@c0@"
  fr: "@a@bL'Emblème royal de Gotha luit d'un éclat solennel.\n@c0@"
  it: "@a@bLo Stemma Reale di Denim emana una luce meravigliosa...\n@c0@"
  ja: "@a@bグランバニア王家の紋章が\n重々しい光を　はなっている！\n@c0@"
7:
  de: "@a@b%0%a000120 findet die Königlichen Insignien!\n@c0@"
  en: "@a@b%0%a000120 finds the Royal Insignia!\n@c0@"
  es: "@a@b¡%0%a000120 encuentra la Insignia Real!\n@c0@"
  fr: "@a@b%0%a000120 trouve l'Emblème royalⓠ\n@c0@"
  it: "@a@b%0%a000120 ha trovato lo Stemma Reale!\n@c0@"
  ja: "@a@b%a000120は　王家のあかしを\n見つけた！\n@c0@"
8:
  de: "@a@b%0%a000180 steckt die Königlichen Insignien ein!\n@c0@"
  en: "@a@b%0%a000180 acquires the Royal Insignia!\n@c0@"
  es: "@a@b¡%0%a000180 obtiene la Insignia Real!\n@c0@"
  fr: "@a@b%0%a000180 récupère l'Emblème royalⓠ\n@c0@"
  it: "@a@b%0%a000180 prende lo Stemma Reale!\n@c0@"
  ja: "@a@b%a000180は　王家のあかしを\n手に入れた。\n@c0@"
9:
  de: "@a@b*: Halt! Keinen Schritt weiter!\n@c0@"
  en: "@a@b*: Stop right there!\n@c0@"
  es: "@a@b*: ¡Alto ahí!\n@c0@"
  fr: "@a@b*ⓢ Arrêtezⓠ\n@c0@"
  it: "@a@b*: Non muoverti!\nFermo dove sei!\n@c0@"
  ja: "@a@b＊「おっと　待ちな！！\n@c0@"
10:
  de: "@a@b*: Wir können dir nicht erlauben, dich mit den Königlichen Insignien davonzumachen!\n@c0@"
  en: "@a@b*: We can't possibly allow you to make off with the Royal Insignia!\n@c0@"
  es: "@a@b*: ¡De ningún modo podemos permitir que %H0860%Xte lleves%Yos llevéis%Z la Insignia Real!\n@c0@"
  fr: "@a@b*ⓢ Nous ne pouvons pas vous laisser partir avec l'Emblème royalⓠ\n@c0@"
  it: "@a@b*: Non penserai mica di filartela con lo Stemma Reale, eh?!\n@c0@"
  ja: "@a@b＊「悪いが　王家のあかしを\n\t持って行かせるわけには\n\tいかねえな！\n@c0@"
11:
  de: "@a@b*: Es gibt da draußen nämlich Leute, denen der Gedanke, dass du König von Humburg werden könntest, überhaupt nicht schmeckt, %a000090!\n@c0@"
  en: "@a@b*: There are people out there who find the idea of you becoming King of Gotha more than a little distasteful, you see, %a000090.\n@c0@"
  es: "@a@b*: Hay personas que abominan de la idea de que %O0960%Xte conviertas en rey de Pankraz, %a000090%Y%a000090 se convierta en rey de Pankraz%Z.\n@c0@"
  fr: "@a@b*ⓢ Certaines personnes en ville sont loin d'apprécier l'idée que vous deveniez roi de Gotha, %a000090.\n@c0@"
  it: "@a@b*: C'è qualcuno a cui l'idea che tu diventi il nuovo Re di Denim non piace affatto, %a000090!\nPresto scoprirai che...\n@c0@"
  ja: "@a@b＊「%a000090さんが　王になるのを\n\tイヤがる者も　いるってことよ。\n@c0@"
12:
  de: "@a@b*: Pscht! Nicht so viel reden!\n@c0@"
  en: "@a@b*: Shh! Too much information!\n@c0@"
  es: "@a@b*: ¡Sssh! ¡Demasiada información!\n@c0@"
  fr: "@a@b*ⓢ Chutⓠ Tu en as déjà trop ditⓠ\n@c0@"
  it: "@a@b*: Zitto!\nChiudi il becco!\n@c0@"
  ja: "@a@b＊「シーッ。\n\tよけいな事を　言うな！\n@c0@"
13:
  de: "@a@b*: Rück sie einfach raus!\n@c0@"
  en: "@a@b*: Just hand it over!\n@c0@"
  es: "@a@b*: ¡%H0860%XDámela%YDádmela%Z y basta!\n@c0@"
  fr: "@a@b*ⓢ Donnez-le-moiⓠ\n@c0@"
  it: "@a@b*: E tu sbrigati!\nDacci lo Stemma!\n@c0@"
  ja: "@a@b＊「とにかく　そいつは\n\t返してもらうぜ！！\n@c0@"
14:
  de: "@a@b*: Willkommen zurück, gnädiger Herr!\n@c0@"
  en: "@a@b*: Welcome back, sir!\n@c0@"
  es: "@a@b*: ¡Bienvenido, señor!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Gotha.\n@c0@"
  it: "@a@b*: Bentornato!\n@c0@"
  ja: "@a@b＊「よくぞ　もどられました！\n@c0@"
15:
  de: "@a@b*: Schön, dass Ihr wieder da seid, gnädiger Herr!\n@c0@"
  en: "@a@b*: Good to have you back, sir!\n@c0@"
  es: "@a@b*: ¡Me alegro de que haya vuelto, señor!\n@c0@"
  fr: "@a@b*ⓢ Content de vous revoirⓠ\n@c0@"
  it: "@a@b*: Toh!\nEccoti di ritorno!\n@c0@"
  ja: "@a@b＊「おかえりなさいませ！\n@c0@"
16:
  de: "@aKanzler Konrad@bNun, da sind wohl Glückwünsche angebracht, gnädigster Herr. Es ist doch eine recht gefahrvolle Aufgabe, die Königlichen Insignien zu beschaffen.\n@c0@"
  en: "@aChancellor Jeeves@bCongratulations are in order I believe, sir. It is a task of some considerable peril to recover the\r\nRoyal Insignia.\n@c0@"
  es: "@aCanciller Ambrosio@bCreo que procede una felicitación, señor. Recuperar la Insignia Real es una tarea no exenta de peligro.\n@c0@"
  fr: "@aChancelier Tiquette@bJe crois que les félicitations sont de rigueur.\r\nC'est une mission très périlleuse que vous avez menée à bien en récupérant l'Emblème royal.\n@c0@"
  it: "@aMinistro Ligio@bPer me è un onore porgerti le mie più vive congratulazioni. Conquistare lo Stemma Reale è un'impresa che solo un valoroso può compiere.\n@c0@"
  ja: "@a@b大臣「なんと！\n\t王家のあかしを　手に入れ\n\t無事に　もどって来るとはっ！\n@c0@"
17:
  de: "@aKanzler Konrad@bEuer Vater, der verstorbene König Ludwig, wäre sehr stolz auf Euch.\n@c0@"
  en: "@aChancellor Jeeves@bYour father, the late King Pankraz, would be extremely proud.\n@c0@"
  es: "@aCanciller Ambrosio@bVuestro padre, el fallecido rey Teudis, estaría orgulloso en grado sumo.\n@c0@"
  fr: "@aChancelier Tiquette@bVotre père, feu le roi Petros, serait extrêmement fier de vous.\n@c0@"
  it: "@aMinistro Ligio@bTuo padre, il povero re Russel, sarebbe molto fiero di te.\n@c0@"
  ja: "@a@b大臣「いや　もどられるとは。\n\tさすが　先代パパス王の\n\t血をひきし　おかた。\n@c0@"
18:
  de: "@aKanzler Konrad@bEine höchst bewundernswerte Leistung, gnädigster Herr.\n@c0@"
  en: "@aChancellor Jeeves@bA most admirable achievement, sir.\n@c0@"
  es: "@aCanciller Ambrosio@bUn logro admirable, señor.\n@c0@"
  fr: "@aChancelier Tiquette@bC'est un véritable exploit.\n@c0@"
  it: "@aMinistro Ligio@bRinnovo le mie felicitazioni ed esprimo ancora la mia ammirazione per il coraggio e l'abilità che hai dimostrato.\n@c0@"
  ja: "@a@b大臣「この大臣　ほとほと\n\tかんぷく　いたしましたぞ。\n\tわっはっはっはっ。\n@c0@"
19:
  de: "@aPrinz Sebastian@bNa geh, %a000090, das hast gut g'macht! Eine g'standene Leistung!\n@c0@"
  en: "@aPrince Albert@bI say, %a000090, well done!\nJolly good show!\n@c0@"
  es: "@aRey Agila@b¡Rayos, %a000090, bien hecho!\n¡Menudo espectáculo!\n@c0@"
  fr: "@aPrince Albert@b%a000090, c'est du beau travailⓠ\nJe suis impressionnéⓠ\n@c0@"
  it: "@aPrincipe Alberto@bCe l'hai fatta, %a000090! Ottimo lavoro!\nComplimenti! Anzi, complimentoni!\n@c0@"
  ja: "@a@bオジロン「おお　%a000090よ！\n\tよくぞ　やりとげた！\n@c0@"
20:
  de: "@aPrinz Sebastian@bDie Königlichen Insignien hast dir geangelt, mit allem, was dazug'hört, net wahr?\n@c0@"
  en: "@aPrince Albert@bThe Royal Insignia! You reeled it in, hook, line and sinker, eh?\n@c0@"
  es: "@aRey Agila@b¡La Insignia Real! ¡Le has echado bien el anzuelo!, ¿eh?\n@c0@"
  fr: "@aPrince Albert@bVoilà l'Emblème royalⓠ\nTu l'as rapporté en un rien de tempsⓠ\n@c0@"
  it: "@aPrincipe Alberto@bHai conquistato lo Stemma Reale!\r\nA dirla tutta, la cosa non mi sorprende affatto: ero convinto che ci saresti riuscito.\n@c0@"
  ja: "@a@bオジロン「王家のあかし\n\tしかと　見とどけたぞよ！\n@c0@"
21:
  de: "@aPrinz Sebastian@bDann können wir uns ja endlich drangeben, dich an meiner Stell' als König auf den Thron zu setzen.\n@c0@"
  en: "@aPrince Albert@bNow we can get on with the business of un-kinging me, and kinging you.\n@c0@"
  es: "@aRey Agila@bYa podemos seguir con el asuntillo de mi descoronación y tu coronación.\n@c0@"
  fr: "@aPrince Albert@bMaintenant, on va pouvoir passer à l'étape suivante. Je vais descendre du trône pour que tu y montes.\n@c0@"
  it: "@aPrincipe Alberto@bAdesso potremo procedere al trasferimento del trono, della corona e di tutto il resto.\nTu sarai il nuovo Re di Denim!\n@c0@"
  ja: "@a@bオジロン「これで　晴れて\n\tそなたに　王位をゆずれると\n\tいうもんじゃ。\n@c0@"
22:
  de: "@aPrinz Sebastian@bIch nehme an, selbst Ihr habt jetzt nichts mehr zu mosern, Konrad, net wahr?\n@c0@"
  en: "@aPrince Albert@bI presume we've heard the last of your grumblings on the matter now, Jeeves?\n@c0@"
  es: "@aRey Agila@bSupongo, Ambrosio, que ya no oiremos más farfullos tuyos al respecto, ¿no?\n@c0@"
  fr: "@aPrince Albert@bTiquette, j'imagine que vous n'avez pas d'autre remarque à faireⓡ\n@c0@"
  it: "@aPrincipe Alberto@bSempre che il nostro carissimo ministro Ligio non se ne esca con un'altra delle sue, eh?!\n@c0@"
  ja: "@a@bオジロン「大臣！　そなたも\n\tもはや　文句はないであろう？\n@c0@"
23:
  de: "@aKanzler Konrad@bMosern, gnädigster Herr? Ich hab Euch doch nur auf die Traditionen des Hauses Humburg verwiesen.\n@c0@"
  en: "@aChancellor Jeeves@bGrumblings, sir? I was merely directing your attention to the traditional practices of the\r\nHouse of Gotha.\n@c0@"
  es: "@aCanciller Ambrosio@b¿Farfullos, señor? No hacía más que reclamar vuestra atención sobre las prácticas tradicionales de la Casa de los Pankraz.\n@c0@"
  fr: "@aChancelier Tiquette@bDes remarques, Votre Majestéⓡ Je vous rappelais simplement les usages qui ont cours à la Maison de Gotha.\n@c0@"
  it: "@aMinistro Ligio@bⓕUn'altra delle mieⓖ, Maestà?\nIo mi sono esclusivamente limitato a far osservare una delle più antiche leggi del nostro glorioso Regno.\n@c0@"
  ja: "@a@b大臣「文句とは　心外ですな。\n\t私は　ただ　しきたりのことを\n\t言っただけで　文句などは……。\n@c0@"
24:
  de: "@aPrinz Sebastian@bJaja... Na schön. Aber jedenfalls hat %a000090 gezeigt, dass er der Aufgabe g'wachsen ist, und so kann uns jetzt nichts mehr aufhalt'n.\n@c0@"
  en: "@aPrince Albert@bWell, yes... Alright, then. But anyway, %a000090's proved he's up to the task, so there's nothing stopping us now.\n@c0@"
  es: "@aRey Agila@bYa, sí... Muy bien. El caso es que %a000090 ha demostrado estar a la altura, así que ya no hay obstáculo alguno.\n@c0@"
  fr: "@aPrince Albert@bBon... d'accord. Quoi qu'il en soit, %a000090 a prouvé qu'il était à la hauteur et plus rien ne nous empêche de passer à la suite.\n@c0@"
  it: "@aPrincipe Alberto@bAccidenti quanto sei permaloso, Ministro!\nBah, non importa.\n㈡\nIl nostro %a000090 ha dimostrato quello che doveva dimostrare, quindi ora potremo procedere con l'incoronazione.\n@c0@"
  ja: "@a@bオジロン「そ　そうであったな。\n\tとにかく　%a000090が\n\tこの国の王に　なるのじゃ。\n@c0@"
25:
  de: "@aKanzler Konrad@bGanz recht, gnädigster Herr. Zu diesem Zeitpunkt würd' es sich g'hören, dass ich Eure Untertanen von den ⓞgeänderten Umständenⓟ in Kenntnis setze.\n@c0@"
  en: "@aChancellor Jeeves@bPrecisely, sir. It would be customary at this point for me to inform your subjects of the ⓗchange of circumstancesⓘ.\n@c0@"
  es: "@aCanciller Ambrosio@bPrecisamente, señor. Lo habitual ahora sería que yo informara a vuestros súbditos del ⓕcambio de circunstanciasⓖ.\n@c0@"
  fr: "@aChancelier Tiquette@bTout à fait, Votre Majesté. Comme le veut l'usage,\nil faut maintenant que j'informe vos sujets du ⓥchangement de situationⓦ.\n@c0@"
  it: "@aMinistro Ligio@bCertamente, Maestà. A questo punto, il protocollo di corte mi impone di predisporre quanto necessario per l'ascesa al trono del nuovo sovrano.\n@c0@"
  ja: "@a@b大臣「では　このことを\n\t国中に　知らせなくては\n\tいけませんな。\n@c0@"
26:
  de: "@aKanzler Konrad@bUnd dann ist da ja auch noch die Sache mit der Zeremonie. Soll ich mit den Vorkehrungen dazu beginnen, gnädigster Herr?\n@c0@"
  en: "@aChancellor Jeeves@bAnd there's the matter of the ceremony, of course. Shall I begin making arrangements, sir?\n@c0@"
  es: "@aCanciller Ambrosio@bY luego está el asunto de la ceremonia, por supuesto. ¿Puedo comenzar con los preparativos, señor?\n@c0@"
  fr: "@aChancelier Tiquette@bBien sûr, il y a également le problème de la cérémonie.\nDois-je faire le nécessaire, Votre Majestéⓡ\n@c0@"
  it: "@aMinistro Ligio@bCredo di poter dare il via ai preparativi per la cerimonia.\n@c0@"
  ja: "@a@b大臣「それに　即位式の準備も……。\n\tその役目　この大臣が\n\t引き受けましょうぞ。\n@c0@"
27:
  de: "@aKanzler Konrad@bSehr wohl, gnädigster Herr. Ich werde die erforderlichen Schritte einleiten.\n@c0@"
  en: "@aChancellor Jeeves@bVery good, sir. I shall set the necessary wheels\r\nin motion.\n@c0@"
  es: "@aCanciller Ambrosio@bMuy bien, señor. Pondré en marcha los mecanismos correspondientes.\n@c0@"
  fr: "@aChancelier Tiquette@bTrès bien, Votre Majesté. Je m'y attelle de ce pas. \n@c0@"
  it: "@aMinistro Ligio@bMi metterò immediatamente all'opera.\n@c0@"
  ja: "@a@b大臣「さて　そうと決まったら\n\tこうしては　いられないわい。\n@c0@"
28:
  de: "@aKanzler Konrad@bIch darf mich entschuldigen.\n@c0@"
  en: "@aChancellor Jeeves@bIf you'll excuse me.\n@c0@"
  es: "@aCanciller Ambrosio@bSi me disculpáis...\n@c0@"
  fr: "@aChancelier Tiquette@bSi vous voulez bien m'excuser...\n@c0@"
  it: "@aMinistro Ligio@bVi prego di scusarmi.\nCon il vostro permesso...\n@c0@"
  ja: "@a@b大臣「では　これにてっ！\n@c0@"
29:
  de: "@aPrinz Sebastian@bHmm... Konrad ist doch ein komischer alter Kauz. Zunächst schien er ganz dagegen zu sein, und jetzt kann's ihm gar net schnell g'nug gehen.\n@c0@"
  en: "@aPrince Albert@bHmm... Jeeves is a funny old bird. He seemed completely against the idea at first, but now he's\r\nat it like a rat up a drainpipe.\n@c0@"
  es: "@aRey Agila@bMmm... Ambrosio es un pájaro de cuidado. Al principio se oponía por completo a la idea y ahora parece que le deben y no le pagan.\n@c0@"
  fr: "@aPrince Albert@bMmm... Tiquette est un gars bizarre. Au début, il semblait complètement contre l'idée que tu deviennes roi et là, il s'occupe de tout.\n@c0@"
  it: "@aPrincipe Alberto@bChi lo capisce quel Ligio?! Prima storceva il naso all'idea che tu diventassi Re, e ora è corso a preparare la cerimonia per la tua incoronazione!\n@c0@"
  ja: "@a@bオジロン「ふーむ……。\n\t反対していたわりには\n\t大臣も　気が早いことだな……。\n@c0@"
30:
  de: "@a@b*: Eure Hoheit! Eure Hoheit! Es ist so weit!\n@c0@"
  en: "@a@b*: Your Highness! Your Highness!\nIt's time!\n@c0@"
  es: "@a@b*: ¡Alteza! ¡Alteza!\r\n¡Ha llegado el momento!\n@c0@"
  fr: "@a@b*ⓢ Votre Majestéⓠ Votre Majestéⓠ Ça y estⓠ\n@c0@"
  it: "@a@b*: Altezza! Altezza!\nCi siamo!\n@c0@"
  ja: "@a@b＊「大変でございます！\n\t大変でございます！\n@c0@"
31:
  de: "@aPrinz Sebastian@bWas ist denn jetzt los?!\n@c0@"
  en: "@aPrince Albert@bWhat on earth's the matter!?\n@c0@"
  es: "@aRey Agila@b¿Qué diantres sucede?\n@c0@"
  fr: "@aPrince Albert@bQu'est-ce qu'il y a encoreⓠⓑ\n@c0@"
  it: "@aPrincipe Alberto@bChe cosa sta succedendo?!\n@c0@"
  ja: "@a@bオジロン「なっ　なにごとだっ！？\n@c0@"
32:
  de: "@a@b*: Es ist die gnädige Frau, %a000090!\n%0%a001230 ist... Das Baby ist...\n@c0@"
  en: "@a@b*: It's your wife, %a000090!\nLady %a001230 is... The baby is...\n@c0@"
  es: "@a@b*: ¡Es vuestra esposa, %a000090!\nLady %a001230 está... El bebé va a...\n@c0@"
