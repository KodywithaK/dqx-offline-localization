  de: "@aPrinz Sebastian@bNun, König %a000090. Es ist Zeit, dass du dich um deine königlichen Pflichten kümmerst, net wahr? Zeig deinem Volk, worauf es sich da eingelassen hat!\n@c0@"
  en: "@aPrince Albert@bWell, King %a000090. Time to start your kingly duties and do the rounds, eh? Show the people what they've let themselves in for and all that!\n@c0@"
