  it: "@aGertrude@bQuel tipo non mi era mai piaciuto!\n@c0@"
  ja: "@a@b＊「ドリスさまったら\n\tちっとも　私のいうことを\n\t聞いてくれなくて……。\n@c0@"
251:
  de: "@a@b*: Ah! Eure Majestät! Wie geht es Euch?\n@c0@"
  en: "@a@b*: Ah! Your Majesty!\nHow are you?\n@c0@"
  es: "@a@b*: ¡Ah! ¡Majestad!\r\n¿Cómo estáis?\n@c0@"
  fr: "@a@b*ⓢ Ahⓠ Votre Majestéⓠ Comment allez-vousⓡ\n@c0@"
  it: "@a@b*: Salve, Maestà.\nCome sta?\n@c0@"
  ja: "@a@b＊「たとえ　姫さまでなくなっても\n\t少しは　女らしく\n\tしていただかないと……。\n@c0@"
252:
  de: "@a@b*: Mir wurde von Eurem Vater, König Ludwig, aufgetragen, Nachforschungen über ein Schloss namens Zenithia anzustellen.\n@c0@"
  en: "@a@b*: I was ordered by your father, King Pankraz, to carry out research into a castle called Zenithia.\n@c0@"
  es: "@a@b*: Vuestro padre, el rey Teudis, me ordenó que investigara acerca del castillo de un reino llamado Zenithia.\n@c0@"
  fr: "@a@b*ⓢ Votre père, le roi Petros, m'avait chargé de mener des recherches sur un royaume appelé Zénithia.\n@c0@"
  it: "@a@b*: Suo padre, il povero re Russel, mi ordinò di effettuare delle ricerche su un castello chiamato Zenithia.\n@c0@"
  ja: "@a@bドリス「誰も　信じちゃくれないけどさ。\n@c0@"
253:
  de: "@a@b*: Bisher habe ich herausgefunden, dass Zenithia eigentlich am Himmel sein sollte, aber dass es aus irgendeinem Grund net mehr dort ist.\n@c0@"
  en: "@a@b*: So far, I've discovered that Zenithia's\r\nsupposed to be up in the sky, but for\r\nsome reason it isn't any more.\n@c0@"
  es: "@a@b*: Hasta ahora he descubierto que Zenithia se encontraba en el cielo, pero ya no es así por algún motivo.\n@c0@"
  fr: "@a@b*ⓢ Jusqu'ici, j'ai découvert que Zénithia est censé se trouver dans le ciel, mais que, pour d'obscures raisons, il n'y est plus.\n@c0@"
  it: "@a@b*: Fino a questo momento, ho scoperto che Zenithia dovrebbe fluttuare in cielo e che, per motivi a me ignoti, non si trova più lì.\n@c0@"
  ja: "@a@bドリス「あたしは　見たんだよ。\n\t大臣のやつが　北の方へ\n\t空を　飛んでゆくのを。\n@c0@"
254:
  de: "@a@b*: Ich habe außerdem festg'stellt, dass der Drachengott, der einmal dort gelebt hat, verschwunden ist.\n@c0@"
  en: "@a@b*: I've also learnt that the Dragon God who lived there has gone missing.\n@c0@"
  es: "@a@b*: También sé que el Dios Dragón que vivía allí ha desaparecido.\n@c0@"
  fr: "@a@b*ⓢ J'ai également appris que le dieu dragon qui y vivait a disparu.\n@c0@"
  it: "@a@b*: Ho anche appreso che il Drago Divino che un tempo dimorava a Zenithia ha abbandonato il castello, e non si sa dove sia finito.\n@c0@"
  ja: "@a@bドリス「やっぱり　あの大臣\n\tどっか　おかしかったんだなあ。\n@c0@"
255:
  de: "@a@b*: Es ist nur eine Theorie, aber wenn Schloss und Drachengott wieder an ihrem Platz sind, vielleicht kehrt dann auf der Welt wieder Frieden ein.\n@c0@"
  en: "@a@b*: It's just a theory, but perhaps if the castle and its Dragon God were restored to their rightful places, the world would be restored to peace.\n@c0@"
  es: "@a@b*: Es solo una teoría, pero si el castillo y el Dios Dragón fueran devueltos al sitio que les corresponde, el mundo podría recobrar la paz.\n@c0@"
  fr: "@a@b*ⓢ Ce n'est qu'une théorie, mais peut-être que si le château et le dieu dragon reprenaient leur place, la paix reviendrait.\n@c0@"
  it: "@a@b*: Personalmente ritengo che, se il Castello di Zenithia e il Drago Divino tornassero al loro posto, il mondo ritroverebbe la pace.\n@c0@"
  ja: "@a@b＊「あ！　これは　王さま\n\tよくぞ　おこしを。\n@c0@"
256:
  de: "@aOttmar@bEure M-Majestät!\n@c0@"
  en: "@aThruppence@bY-Your Majesty!\n@c0@"
  es: "@aAle Atorio@b¡M-Majestad!\n@c0@"
  fr: "@aVirtus@bV-Votre Majestéⓠ\n@c0@"
  it: "@aEchex@bMaestà!\n@c0@"
  ja: "@a@b＊「私は　王さまの父上　パパスさまに\n\t命じられ　天空の城について\n\t長い間　研究してきました。\n@c0@"
257:
  de: "@aOttmar@bIch glaube, ich sollte Euch vielleicht die Sache mit den Monsterschachspielen erklären, durch die alle so abgelenkt waren.\n@c0@"
  en: "@aThruppence@bI think I should explain about all the monster chess playing that's been going on.\n@c0@"
  es: "@aAle Atorio@bCreo que debería explicaros lo de las partidas de monstriajedrez.\n@c0@"
  fr: "@aVirtus@bJe crois que je devrais tout vous dire sur ce qui s'est passé avec ces jeux d'échecs monstrueux.\n@c0@"
