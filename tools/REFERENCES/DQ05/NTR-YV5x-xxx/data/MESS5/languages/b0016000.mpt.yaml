  fr: "@a@b*ⓢ Mademoiselle Gertrude ne veut pas m'écouterⓠ\n@c0@"
  it: "@a@b*: La signorina Gertrude non ascolta nemmeno una parola di ciò che dico.\n@c0@"
  ja: "@a@b＊「新しい王さまに　けいれい！\n@c0@"
247:
  de: "@a@b*: Ich weiß, dass sie eigentlich keine Prinzessin mehr ist, aber sie sollte sich dennoch wie eine Dame verhalten.\n@c0@"
