  en: "@a@bThis is the day of the coronation.\nIt wouldn't do to go wandering off!\n@c0@"
  es: "@a@bEs el día de la coronación.\r\nNo estaría bien marcharse por ahí.\n@c0@"
  fr: "@a@bC'est le jour du couronnement. Cela ne se fait pas de partir en balade un jour comme celui-làⓠ\n@c0@"
  it: "@a@bQuesto è il giorno dell'incoronazione!\nNon si può andare in giro a perdere tempo! \n@c0@"
