  es: "@aAle Atorio@bParece que estaban a buen recaudo en la cámara del tesoro del castillo.\n@c0@"
  fr: "@aVirtus@bApparemment, elles se trouvaient dans la chambre forte du château.\n@c0@"
  it: "@aEchex@bCome le dissi, gli scacchi erano custoditi nella sala del tesoro del castello...\n@c0@"
  ja: "@a@b＊「もし再び　天空の城を\n\t存在せしめられたなら　平和な時代が\n\tやってくるのかも　知れませんが…。\n@c0@"
260:
  de: "@aOttmar@bWir Soldaten sind alle sofort ganz verrückt danach g'wesen. Es war so schlimm, dass wir sogar unsere Pflichten vernachlässigt haben.\n@c0@"
  en: "@aThruppence@bAll us soldiers got completely hooked on it.\r\nIt was so bad, we were neglecting our duties.\n@c0@"
  es: "@aAle Atorio@bLos soldados estábamos enganchadísimos.\r\nLlegamos incluso a descuidar nuestro deber.\n@c0@"
  fr: "@aVirtus@bTous les soldats se sont pris de folie pour ce jeu. C'en était arrivé à tel point que nous négligions nos devoirs.\n@c0@"
  it: "@aEchex@bUna volta che noi soldati ricevemmo gli scacchi, ne fummo totalmente rapiti, al punto da trascurare del tutto i nostri doveri.\n@c0@"
  ja: "@a@bパピン「あわわわ……。\n\tお　王さま！\n@c0@"
261:
  de: "@aOttmar@bUnsere Nachlässigkeit ist daran schuld, dass die Königin... na... Ihr wisst schon... Ach herrjemine...\n@c0@"
  en: "@aThruppence@bIt's because of our carelessness that Her Majesty the Queen was...well... Oh dear...\n@c0@"
  es: "@aAle Atorio@bDebido a nuestro descuido Su Majestad la Reina fue... bueno... ¡Oh!, cielos...\n@c0@"
  fr: "@aVirtus@bC'est à cause de notre inattention que Sa Majesté la reine a... enfin... oh, c'est terrible...\n@c0@"
  it: "@aEchex@bÈ solo colpa nostra se Sua Maestà la Regina è stata... Oh, non voglio nemmeno dirlo.\nDea santissima! Proteggila tu!\n@c0@"
  ja: "@a@bパピン「われわれ　兵士の間で\n\tはやっているゲーム\n\tチェスのことなんですが……。\n@c0@"
262:
  de: "@aOttmar@bHier. Das ist mein Monsterschachspiel. Nehmt Ihr es. Ich verspreche, ab sofort besonders wachsam zu sein!\n@c0@"
  en: "@aThruppence@bHere. This is my monster chess set. You take it.\r\nI promise to be extra vigilant from now on!\n@c0@"
  es: "@aAle Atorio@bTened. Es mi juego de monstriajedrez. Tomadlo.\r\n¡De ahora en adelante, prometo vigilar con celo extremo!\n@c0@"
