  it: "@a@b*: Prima la regina Mada, quando sul trono sedeva re Russel...\n@c0@"
  ja: "@a@b＊「ややっ！\n\tあなたは　新しく王になられた\n\t%a000090さまですねっ！\n@c0@"
234:
  de: "@a@b*: Und jetzt Eure Frau, Königin %a001230. Und das unmittelbar nach Eurer Krönung zum König.\n@c0@"
  en: "@a@b*: And now your wife, Queen %a001230, too. And just after you were crowned king too.\n@c0@"
