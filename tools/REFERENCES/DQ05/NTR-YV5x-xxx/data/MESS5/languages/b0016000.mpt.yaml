  it: "@a@b*: Sono talmente bravo e bene educato che un tempo ero lo Slime da compagnia della regina Mada.\n@c0@"
  ja: "@a@b＊「%a000090王が　パパスさまの\n\tご子息なら　お教えしておかねば\n\tならないでしょう。\n@c0@"
242:
  de: "@a@b*: Eure Majestät! Lang lebe der König!\n@c0@"
  en: "@a@b*: Your Majesty!\nLong live the King!\n@c0@"
  es: "@a@b*: ¡Majestad!\r\n¡Larga vida al Rey!\n@c0@"
