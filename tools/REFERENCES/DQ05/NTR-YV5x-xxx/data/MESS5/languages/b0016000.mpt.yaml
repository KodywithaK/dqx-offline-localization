  fr: "@aPandora@bC'est vrai, quel que soit l'endroit où j'aurais pu grandir, je serais de toute façon devenue l'exquise demoiselle que tu as devant toi, mais bon...\n@c0@"
  it: "@aViola@bE io sono diventata la superlativa donna che sono oggi, e che tu hai avuto la fortuna di sposare.\n@c0@"
  ja: "@a@bデボラ「そうだ　%a000090。\n\tせっかくだから　ひとつ\n\t言っておきたいことがあるのよ。\n@c0@"
330:
