144:
  de: "@aPrinz Sebastian@bHiermit beschwöre ich bei der allmächtigen Göttin, dass ich abdanke und dass vom heutigen Tag an du als König über Humburg herrschen sollst.\n@c0@"
  en: "@aPrince Albert@bI hereby swear by the almighty Goddess that I relinquish my right to the throne, and that from this day forward, you shall reign as King of Gotha.\n@c0@"
  es: "@aRey Agila@bJuro por la Diosa todopoderosa que renuncio a mi derecho al trono, y que desde este día en adelante vos reinaréis como rey de Pankraz.\n@c0@"
  fr: "@aPrince Albert@bJe jure devant la Déesse toute-puissante que je renonce à mes droits sur le trône et que, dorénavant, c'est toi qui régneras sur Gotha.\n@c0@"
  it: "@aPrincipe Alberto@bGiuro solennemente, innanzi alla dea e agli uomini, di rinunciare a qualsiasi diritto sul trono di Denim!\n㈡\nDa questo momento in avanti, sarai tu, %a000090, a regnare su queste terre!\n@c0@"
  ja: "@a@bオジロン「すでに知っている者もおろうが\n\t今　余のとなりにいるのが\n\t先代パパス王の息子　%a000090じゃ。\n@c0@"
