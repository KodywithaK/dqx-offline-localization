  de: "@aGriselda@bAch ja. Das wäre wohl jetzt ein günstiger Zeitpunkt, um es dir zu sagen...\n@c0@"
  en: "@aDebora@bOh, yes. I suppose this would be a good time to tell you...\n@c0@"
  es: "@aStefania@bBene, supongo que ha llegado la hora de decírtelo...\n@c0@"
  fr: "@aPandora@bAh, oui. Je crois que c'est le bon moment pour te le dire...\n@c0@"
  it: "@aViola@bA proposito, c'è una cosuccia di cui volevo parlarti.\n@c0@"
  ja: "@a@bデボラ「ちゃんと　考えなさいよね。\n@c0@"
324:
  de: "@aGriselda@bNera und ich, wir sind gar nicht Mamas und Papas richtige Kinder.\n@c0@"
