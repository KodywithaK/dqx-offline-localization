  es: "@aStefania@bSembra que il mio papino pensó que il suo destino era cuidar de nosotras.\n@c0@"
  fr: "@aPandora@bApparemment, papa s'est dit que son destin était de prendre soin des deux petites orphelines que nous étions, ou quelque chose dans le genre.\n@c0@"
