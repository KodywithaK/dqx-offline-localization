  en: "@aPrince Albert@bSo, %a000090, if you'll just kneel down here...\n@c0@"
  es: "@aRey Agila@bY bien, %a000090. Arrodillaos...\n@c0@"
  fr: "@aPrince Albert@b%0%a000090, si tu veux bien t'agenouiller...\n@c0@"
  it: "@aPrincipe Alberto@b%0%a000090, inginocchiati...\n@c0@"
  ja: "@a@bオジロン「おお　来たか！　%a000090。\n@c0@"
