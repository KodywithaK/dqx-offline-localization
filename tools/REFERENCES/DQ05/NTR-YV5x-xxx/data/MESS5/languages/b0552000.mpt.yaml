22:
  de: "@a%0%a001240@bEin Topf, der rot glüht? Von ganz alleine? Das ist bestimmt ein seltsamer Anblick...\n@c0@"
  en: "@a%0%a001240@bIt would be a bit weird, seeing a jar glowing red all by itself like that.\n@c0@"
