9:
  de: "@aBianca@bIch hätte mir nie träumen lassen, hier noch einmal mit dir spazieren zu gehen.\n@c0@"
  en: "@aBianca@bI never dreamt we'd be walkin' about here\r\ntogether again.\n@c0@"
  es: "@aBianca@bNunca pensé que volveríamos por aquí.\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais cru qu'on se promènerait\r\nà nouveau ici ensemble.\n@c0@"
  it: "@aBianca@bNon credevo che saremmo mai tornati in questo posto, sai?\n@c0@"
  ja: "@a@bビアンカ「%a000090と　また\n\tこの町を歩けるなんて\n\t夢にも　思わなかったな……。\n@c0@"
10:
  de: "@aBianca@b... Aber vielleicht freue ich mich ja etwas zu früh.\n@c0@"
  en: "@aBianca@b...Maybe I'm jumpin' the gun a bit bein' so\r\nhappy, though.\n@c0@"
  es: "@aBianca@bAunque quizás me precipite con tanta alegría...\n@c0@"
  fr: "@aBianca@b... Mais je me réjouis peut-être un peu trop vite.\n@c0@"
  it: "@aBianca@bSono felice di essere di nuovo qui con te...\nSpero solo che non ci aspetti qualche brutta sorpresa!\n@c0@"
  ja: "@a@bビアンカ「……って　よろこぶには\n\tまだ　ちょっと　早すぎたわね。\n@c0@"
11:
  de: "@a%0%a001240@bWir sind hier nie mit Sancho gewesen, als wir dich gesucht haben, Papa.\n@c0@"
  en: "@a%0%a001240@bWe never came here with Sancho when we were looking for you, Dad.\n@c0@"
  es: "@a%0%a001240@bNunca vinimos aquí con Sancho cuando te estábamos buscando, papá.\n@c0@"
  fr: "@a%0%a001240@bOn n'est jamais venus ici avec Sancho quand on te cherchait, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, quando ti cercavamo insieme allo zio Sancho non venimmo mai da queste parti...\n@c0@"
  ja: "@a@b%a001240「サンチョと　お父さんを\n\t探して旅してたときも　この町には\n\t来たことなかったなあ。\n@c0@"
12:
  de: "@a%0%a001250@bWirklich? Das ist die Stadt, in der du und Mama geheiratet habt? Wie aufregend!\n@c0@"
  en: "@a%0%a001250@bReally? This is the town where you and Mum got married? How exciting!\n@c0@"
  es: "@a%0%a001250@b¿En serio? ¿Aquí es donde tú y mamá os casasteis? ¡Qué emocionante!\n@c0@"
  fr: "@a%0%a001250@bVraimentⓡ C'est la ville où maman et toi vous êtes mariésⓡ C'est génialⓠ\n@c0@"
  it: "@a%0%a001250@bQuesto è il villaggio dove viveva la mamma?\nÈ molto carino, sai?\n@c0@"
  ja: "@a@b%a001250「えっ？　お父さん\n\tこの町で　お母さんと　結婚したの？\n\tふ～ん……。\n@c0@"
13:
  de: "@aSancho@bDas ist eine sehr schöne Stadt, eh, Chico? Si. Humburg sollte auch so aussehen...\n@c0@"
  en: "@aSancho@bEes a very attractive town, you no theenk?\nSí. Gotha eshould look like thees.\n@c0@"
  es: "@aSancho@bEste lugar está padrísimo, ¿no?\n¡Ándale! Pankraz tendría que ser así.\n@c0@"
  fr: "@aSancho@bC'est une ville v-vraiment agréable, noⓡ\nSi. Gotha d-devrait ressembler à ça.\n@c0@"
  it: "@aSancho@b¿Esto villaggio es muy carino, eh?\nPerò preferisco Denim...\n@c0@"
  ja: "@a@bサンチョ「きれいな町並みですね。\n\tふむふむ…　グランバニアも\n\tこうありたいものです。\n@c0@"
14:
  de: "@aOtto@bDas gibt's ja net! Ihr habt hier g'heiratet?\n@c0@"
  en: "@aTuppence@bNo!? You had your wedding ceremony here?\n@c0@"
  es: "@aAlazar@b¡No! ¡No me digáis que os casasteis aquí!\n@c0@"
  fr: "@aInnocent@bNonⓠⓑ C'est ici qu'a été célébré votre mariageⓡ\n@c0@"
  it: "@aSimon@bMaestà, stavo pensando a una cosa...\nCome mai non celebrò le sue nozze a Denim?\n@c0@"
  ja: "@a@bピピン「%a000090さまは　この町で\n\tビアンカさまと　ご結婚を！？\n@c0@"
15:
  de: "@aOtto@bAh, verstehe. Damals wart Ihr Euch über Euren wahren Status noch net im Klaren...\n@c0@"
  en: "@aTuppence@bOh, I see. You didn't realise your true status at\r\nthe time.\n@c0@"
  es: "@aAlazar@b¡Ah!, ya veo. Desconocíais vuestro verdadero estatus por aquel entonces.\n@c0@"
  fr: "@aInnocent@bOh, je vois. Vous ne connaissiez pas votre rang,\r\nà l'époque.\n@c0@"
  it: "@aSimon@bScusi, Sire!\r\nAvevo dimenticato che all'epoca lei non sapeva di essere il legittimo erede al trono...\n@c0@"
  ja: "@a@bピピン「なるほど……。\n\tその頃は　ご自身の身分を\n\tご存じなかったと……。\n@c0@"
16:
  de: "@a%0%a001240@bIn dieser Stadt wurde Mama geboren, oder? Oh! Sie wurde gar nicht hier geboren?\n@c0@"
  en: "@a%0%a001240@bThis is where Mum was born, isn't it?\nOh! She wasn't actually born here?\n@c0@"
  es: "@a%0%a001240@bAquí es donde nació mamá, ¿no?\n¡Vaya! ¿Que no nació aquí?\n@c0@"
  fr: "@a%0%a001240@bC'est ici que maman est née, pas vraiⓡ\nOhⓠ Elle n'est pas née iciⓡ\n@c0@"
  it: "@a%0%a001240@bQui è dove è nata la mia mamma, vero?\nCome? Mamma non è nata qui?!\n@c0@"
  ja: "@a@b%a001240「ここって　お母さんの\n\t生まれた町なんだよね？\n\tえっ　ちがうの？\n@c0@"
17:
  de: "@a%0%a001240@bAlso ist sie als Kind auch viel herumgereist...\n@c0@"
