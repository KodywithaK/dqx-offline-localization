  it: "@aSimon@bDica la verità, Sire...\nLe piacerebbe avere come cognato il valente Simon, prode soldato dell'esercito di Denim?\n㈡\nSì?\nE allora che aspetta?!\nMi presenti alla fanciulla!\n@c0@"
  ja: "@a@bピピン「これは　なんとしても\n\tお姉さまの　ハートを　いとめねば！！\n@c0@"
279:
