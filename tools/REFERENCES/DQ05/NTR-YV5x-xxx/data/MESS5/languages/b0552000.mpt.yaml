  it: "@a%0%a001250@bMister Fosconi è molto più simpatico quand'è sorridente e rilassato!\nÈ una persona totalmente diversa rispetto a prima!\n@c0@"
  ja: "@a@b%a001250「ルドマンさんが\n\tあんなに笑ってるの　初めて見た。\n\tなんだか　ちがう人みたい……。\n@c0@"
156:
  de: "@aSancho@bDas ist aber nisst die Ende von unsere Mission. Komm, wir haben noch viel vor, Chico.\n@c0@"
