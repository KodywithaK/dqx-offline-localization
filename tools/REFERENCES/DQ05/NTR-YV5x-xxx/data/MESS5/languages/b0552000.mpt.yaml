  de: "@aSancho@bEs ist vielleisst nisst sehr höfliss, es einfach so zu lesen, aber uns bleibt keine Zeit für gute Manieren...\n@c0@"
  en: "@aSancho@bMaybe ees wrong to read eet before you ask permission, but ees no the time for manners now.\n@c0@"
  es: "@aSancho@bPienso que está mal leerlo sin permiso, pero ahorita no hay tiempo para formalidades.\n@c0@"
  fr: "@aSancho@bC-Ce n'est peut-être pas b-bien de le lire sans demander la p-permission d'abord, mais on n'a\r\npas beaucoup de t-tiempo.\n@c0@"
  it: "@aSancho@bNormalmentes te direi que no es buena educaziones leggerlo senza chiedere el permesso, ma esto es un caso de emergenzas, chico.\n@c0@"
  ja: "@a@bサンチョ「勝手に見るのは\n\t気が引けますが　今なら\n\tそれも　許されますよ。\n@c0@"
89:
  de: "@aBianca@bⓞUnd für all meine Erben, die das Pech haben, hundertfünfzig Jahre nach mir geboren zu werden...ⓟ?\n@c0@"
  en: "@aBianca@bⓗTo those of my heirs unlucky enough to be born one hundred and fifty years after myselfⓘ...?\n@c0@"
  es: "@aBianca@bⓕY aquellos de mis herederos que tengan la desgracia de nacer ciento cincuenta años después que io... rezo por vosotros.ⓖ...\n@c0@"
  fr: "@aBianca@bⓥÀ ceux de mes héritiers qui auront la malchance de naître cent cinquante ans après moiⓦ...ⓡ\n@c0@"
  it: "@aBianca@bⓕIo dico preghiera per my sfortunato discendente che nasce cientocinquanta year dopo di meⓖ...\n@c0@"
  ja: "@a@bビアンカ「運わるく　１５０年目に\n\t当たった子孫よ……って　ずいぶん\n\t無責任な話も　あったものね。\n@c0@"
90:
  de: "@aBianca@bDas hört sich ganz nach uns an...\nDann sind wir wohl Pechvögel!\n@c0@"
  en: "@aBianca@bSounds like we're the unlucky ones, eh?\n@c0@"
  es: "@aBianca@bSupongo que los que tienen la desgracia seremos nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que la malchance est pour nous, heinⓡ\n@c0@"
  it: "@aBianca@bDirei che, a occhio e croce, i centocinquant'anni scadono proprio in questi giorni...\nLa nostra solita fortuna!\n@c0@"
  ja: "@a@bビアンカ「つまり　今が\n\tその１５０年目ってことなのね？\n@c0@"
91:
  de: "@aNera@bIch kann nicht glauben, dass Papa solch ein großes Geheimnis für sich behalten hat.\n@c0@"
  en: "@aNera@bI can't believe Papa kept such a big secret to himself all this time.\n@c0@"
  es: "@aNera@bNo puedo creer que il mio papino guardara tal secreto todo este tiempo.\n@c0@"
  fr: "@aNera@bJe n'arrive pas à croire que papa ait gardé ce secret pour lui si longtemps.\n@c0@"
  it: "@aNera@bNon riesco a credere che per tutto questo tempo mio padre si sia tenuto dentro un segreto così sconvolgente...\n@c0@"
  ja: "@a@bフローラ「お父さまったら…\n\tこんな　重大なヒミツを\n\tひとりで　抱えていらしたのね……。\n@c0@"
92:
  de: "@a%0%a001240@bEin Monster so groß, dass sein Kopf den Himmel berührte? Gibt es so was denn überhaupt?\n@c0@"
  en: "@a%0%a001240@bA monster so big that his head reached the clouds? Do you think that's really possible?\n@c0@"
  es: "@a%0%a001240@b¿Un monstruo tan grande que su cabeza alcanzaba las nubes? ¿Crees que algo así puede ser posible?\n@c0@"
  fr: "@a%0%a001240@bUne bête si grande que sa tête traverse les nuagesⓡ Tu crois que c'est possibleⓡ\n@c0@"
  it: "@a%0%a001240@bUn mostro tanto grande da poter toccare le nuvole?!\nMa esiste davvero una creatura così gigantesca?!\n@c0@"
  ja: "@a@b%a001240「天まで　とどくほどの\n\t魔物だって。\n\tそんなの　ホントにいるのかな？\n@c0@"
93:
  de: "@a%0%a001250@bDieser Tiegel muss ja riesig sein, wenn das Monster dort eingeschlossen ist...\n@c0@"
  en: "@a%0%a001250@bIt must be an enormous jar if it's got a monster that big inside.\n@c0@"
  es: "@a%0%a001250@bDebe de ser una tinaja enorme para albergar un monstruo tan grande en su interior.\n@c0@"
  fr: "@a%0%a001250@bCette amphore doit être énorme s'il y a un monstre de cette taille à l'intérieur.\n@c0@"
  it: "@a%0%a001250@bDev'essere un'anfora enorme, per contenere un mostro tanto grande...\n@c0@"
  ja: "@a@b%a001250「そんなに大きな魔物が\n\t入ってるんだったら　きっと\n\tすごく　大きいツボね？\n@c0@"
94:
  de: "@aSancho@bIss habe nisst alles verstanden, aber das mir hat schon gereisst. Komm, wie müssen gehen.\n@c0@"
  en: "@aSancho@bI no comprende everytheeng, but I understand enough. Come, we must go.\n@c0@"
  es: "@aSancho@bNo entendí todo, pero sí lo suficiente. Órale, hay que irse.\n@c0@"
  fr: "@aSancho@bJe ne c-comprends pas tout, m-mais ça me suffit. Allez, il f-faut y aller.\n@c0@"
  it: "@aSancho@bNo entiendo todo, ma pienso que la situación es muy preoccupantes.\n¡Vamonos, no ce está tiempo da perdere!\n@c0@"
  ja: "@a@bサンチョ「だいたいの事情は\n\tこれで　飲み込めましたね。\n\tさあ　行きましょう。\n@c0@"
95:
  de: "@aOtto@bDieses Biest war so gigantisch, dass sein Kopf den Himmel berührte?\n@c0@"
  en: "@aTuppence@bA b-beast so gigantic, his head p-pierced\r\nthe clouds?\n@c0@"
  es: "@aAlazar@b¿Una bestia tan gigantesca que su cabeza traspasaba las nubes?\n@c0@"
  fr: "@aInnocent@bUne b-bête si gigantesque que sa t-tête traverse\nles nuagesⓡ\n@c0@"
  it: "@aSimon@bUn mostro tanto grande da arrivare fino al cielo?!\n@c0@"
  ja: "@a@bピピン「くっ…雲を　つきぬけるほどの\n\tま…魔物ですか……。\n@c0@"
96:
  de: "@aOtto@bM-Manchmal wäre es mir schon lieber, wenn ich noch in Humburg wäre...\n@c0@"
  en: "@aTuppence@bP-Perhaps it would be better if I sat this one out back in Gotha.\n@c0@"
  es: "@aAlazar@bEsta vez casi preferiría estar tranquilito en Pankraz.\n@c0@"
  fr: "@aInnocent@bP-Peut-être que ce serait mieux que cette fois,\r\nje passe mon tour et que je retourne à Gotha.\n@c0@"
  it: "@aSimon@bMaestà, chiedo di essere esentato da questa missione!\n㈡\nNon sono un codardo, ma non mi va di combattere contro un avversario che non posso guardare negli occhi...\n@c0@"
  ja: "@a@bピピン「ぼ　ボク\n\tグランバニアで　おるすばんしてます。\n@c0@"
97:
  de: "@a%0%a001250@bIst dein Herz wirklich aus Stein, Papa?\n@c0@"
  en: "@a%0%a001250@bIs your heart made of stone, Dad? Really?\n@c0@"
  es: "@a%0%a001250@b¿Tienes el corazón de piedra, papi? ¿De verdad?\n@c0@"
  fr: "@a%0%a001250@bTu as un cœur de pierre, papaⓡ Vraimentⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, davvero non conosci il significato della parola ⓕgratitudineⓖ? Se vuoi te lo spiego io.\nMe l'ha insegnato lo zio Sancho...\n@c0@"
  ja: "@a@b%a001250「お父さんって\n\tはくじょう者……なの？\n@c0@"
98:
  de: "@aBianca@bJetzt nimm den armen Kerl doch nicht so auf den Arm, %a000090! Das ist das Mindeste, was wir für ihn tun können.\n@c0@"
  en: "@aBianca@bNow's not the time to be teasin' the poor bloke, %a000090! We owe him this at least.\n@c0@"
  es: "@aBianca@b¡No es momento para tomarle el pelo al pobre hombre, %a000090! Al menos le debemos algo de respeto, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bCe n'est pas le moment de faire marcher ce pauvre homme, %a000090ⓠ On lui doit bien ça.\n@c0@"
  it: "@aBianca@bMa insomma, %a000090! Ti pare questo il momento di scherzare?!\nNon possiamo restare sordi alla sua richiesta d'aiuto!\n@c0@"
  ja: "@a@bビアンカ「ちょっと　%a000090っ！\n\tいじわる言ってる場合じゃないでしょ？\n\t今　恩返ししなくて　どうするのよ！\n@c0@"
99:
  de: "@aBianca@bImmerhin hat er uns diese wundervolle Hochzeit ausgerichtet! Und dann hat er uns auch noch das Boot gegeben.\n@c0@"
  en: "@aBianca@bHe's the one who put on our lovely weddin', remember! And he gave us that great big ship and everythin'!\n@c0@"
  es: "@aBianca@b¡Acuérdate de que fue él quien organizó nuestra boda! ¡Y nos regaló ese pedazo de barco y todo eso!\n@c0@"
  fr: "@aBianca@bC'est lui qui a organisé notre beau mariage. Tu t'en souviensⓡ Et il nous a donné ce grand bateau et tout le reste.\n@c0@"
  it: "@aBianca@bHai già dimenticato che mister Fosconi ci ha offerto la cerimonia di nozze?!\nE che ci ha anche prestato una delle sue navi?!\n@c0@"
  ja: "@a@bビアンカ「なにしろ　ルドマンさんには\n\tすてきな結婚式をあげてもらったし\n\t大きな船まで　もらったんだから！\n@c0@"
100:
  de: "@aSancho@bWie kannst du nur so grausam sein, Chico? Deine Padre, er würde siss umdrehen in seine Grabe, wenn er das hören könnte!\n@c0@"
