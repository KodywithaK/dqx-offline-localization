24:
  de: "@aSancho@bZuerst es ist rot, dann wieder weiß... Das ist ja wie in eine Zirkus, he he he.\n@c0@"
  en: "@aSancho@bThees ees red, thees ees white... Thees conversation, ees chopping thees way and that more than the barber eshop! Eh heh heh heh.\n@c0@"
  es: "@aSancho@bAzul, rojo, blanco... ¡Híjole! ¡Esto tiene más colores que un anuncio de barbero! Je, je, je, je.\n@c0@"
  fr: "@aSancho@bOune fois c'est b-blanc, oune fois c'est rouge...\nOn est en train de c-couper les cheveux en quatre, comme chez le b-b-barbierⓠ Hé hé hé hé hé.\n@c0@"
  it: "@aSancho@bEsto hombre es muy nervoso por qué teme de aver detto una cosa esgradita al señor Fosconi...\n@c0@"
  ja: "@a@bサンチョ「赤い　ツボを見て\n\t真っ青とは……！？\n\t赤なのに　青！？　うひゃ～。\n@c0@"
