  ja: "@a@bサンチョ「今の　はくじょうな姿…\n\tパパスさまが　ご覧になられたら\n\tさぞ　なげかれるでしょうね……。\n@c0@"
101:
  de: "@aBianca@bIch habe zwar keine Ahnung, worum es hier geht, aber wir sollten tun, was er sagt.\n@c0@"
  en: "@aBianca@bI en't really sure what this is all about, but we should just do what he says.\n@c0@"
  es: "@aBianca@bNo estoy segura de saber de qué va todo esto, pero deberíamos hacer lo que dice.\n@c0@"
  fr: "@aBianca@bJe ne suis pas sûre de tout comprendre, mais on devrait faire ce qu'il dit.\n@c0@"
  it: "@aBianca@bLa storia non mi è del tutto chiara, ma credo che dovremmo fare come dice...\n@c0@"
  ja: "@a@bビアンカ「よくわからないけど\n\tとにかく　急いだほうが　よさそうね。\n@c0@"
102:
  de: "@a%0%a001240@bWir müssen also nur herausfinden, was für eine Farbe dieser Tiegel hat? Aber das ist ja total einfach!\n@c0@"
  en: "@a%0%a001240@bSo all we have to do is find out what colour the jar is? That'll be dead easy!\n@c0@"
