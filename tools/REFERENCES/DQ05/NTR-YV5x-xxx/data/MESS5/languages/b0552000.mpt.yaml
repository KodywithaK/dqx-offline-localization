0:
  de: "@aBianca@bDas war Onassetti, nicht? Der schaut aber ernst drein...\n@c0@"
  en: "@aBianca@bThat was Briscoletti, wasn't it?\r\nHe looked a bit serious, though, eh?\n@c0@"
  es: "@aBianca@b¿No era ese Rimaldi?\nPues estaba de lo más serio, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'était Oscuroni, nonⓡ Il avait l'air grave.\n@c0@"
  it: "@aBianca@bMister Fosconi mi sembrava un po' preoccupato...\n@c0@"
  ja: "@a@bビアンカ「今の人　ルドマンさんよね？\n\tまるで別人みたいに\n\t真剣な顔してたけど……。\n@c0@"
1:
  de: "@aBianca@bIch frage mich, was da los ist. Wir sollten uns gleich mal erkundigen.\n@c0@"
  en: "@aBianca@bI wonder what's goin' on.\r\nWe'd better go and find out.\n@c0@"
  es: "@aBianca@bA saber qué estará pasando.\nTenemos que averiguarlo.\n@c0@"
  fr: "@aBianca@bJe me demande ce qui se passe. On ferait bien de se renseigner.\n@c0@"
  it: "@aBianca@bCredi che sia successo qualcosa?\nChe ne dici di controllare se è tutto a posto?\n@c0@"
  ja: "@a@bビアンカ「なにが　起こったのかしら。\n\t%a000090　行きましょうよ。\n@c0@"
2:
  de: "@aNera@bPapa muss wirklich Probleme haben, wenn er uns noch nicht mal bemerkt hat. Ich mache mir Sorgen um ihn. Komm, wir müssen herausfinden, was los ist.\n@c0@"
  en: "@aNera@bPapa must be really troubled to have not even noticed us just then. I'm worried about him.\r\nWe'd better find out what's happened.\n@c0@"
  es: "@aNera@bIl mio papino debe de estar molto preoccupato para no haberse percatado de nuestra presencia. ¿Qué le pasará?\n㈡\nSerá mejor averiguar lo que ha sucedido.\n@c0@"
  fr: "@aNera@bPapa doit être vraiment préoccupé pour ne pas nous avoir vus. Je suis inquiète. Il faudrait savoir ce qui se passe.\n@c0@"
  it: "@aNera@bMio padre non s'è nemmeno accorto della nostra presenza...\nDev'essere successo qualcosa di serio!\n@c0@"
  ja: "@a@bフローラ「私たちにも　気づかないなんて\n\tお父さま　どうなさったのかしら……。\n\t心配だわ。　行ってみましょう。\n@c0@"
3:
  de: "@a%0%a001240@bIrgendwas ist doch nicht in Ordnung, oder? Er ist ganz aufgewühlt...\n@c0@"
  en: "@a%0%a001240@bWhat do you reckon is going on here?\nHe seemed a bit on edge, didn't he?\n@c0@"
  es: "@a%0%a001240@b¿Qué estará ocurriendo aquí?\nEstaba un poco alterado, ¿no?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qui se passe, à ton avisⓡ\nIl avait l'air un peu tendu.\n@c0@"
  it: "@a%0%a001240@bMa che succede qui?\nCos'è tutta questa agitazione?\n@c0@"
  ja: "@a@b%a001240「なにか　あったのかな？\n\tなんだか　あわててたみたいだよ。\n@c0@"
