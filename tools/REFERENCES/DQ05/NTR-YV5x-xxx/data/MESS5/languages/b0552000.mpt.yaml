  fr: "@aSancho@bAndaⓠ Ce n'est pas le m-moment de rire, heinⓡ\n@c0@"
  it: "@aSancho@bYo pienso que ha fatto bien a dire quello que ha visto... ¿Anche si es una cosa brutta, es bueno saperla il primero posible, no?\n@c0@"
  ja: "@a@bサンチョ「いやいや……。\n\t笑っている場合では　なさそうですな！\n@c0@"
26:
  de: "@aOtto@bManchmal ist Ignoranz durchaus ein Segen.\n@c0@"
  en: "@aTuppence@bSometimes ignorance is bliss.\n@c0@"
  es: "@aAlazar@bA veces, la ignorancia es una bendición.\n@c0@"
  fr: "@aInnocent@bIl vaut parfois mieux ne rien savoir.\n@c0@"
  it: "@aSimon@bCerte persone non amano conoscere verità spiacevoli. Nascondono la testa sotto la sabbia facendo finta di nulla...\n@c0@"
  ja: "@a@bピピン「知らない方が　幸せ\n\tということは　ありますけど……\n@c0@"
27:
  de: "@aOtto@bDoch den Kopf einfach so in den Sand stecken, nützt auch nichts. Wir müssen etwas unternehmen.\n@c0@"
  en: "@aTuppence@bBut it's no use burying your head in the sand when something needs to be dealt with.\n@c0@"
