8:
  de: "@a%0%a001240@bLa Guardia! Das ist doch der Wachturm, oder?\nKönnen wir da alle zusammen hingehen?\n@c0@"
  en: "@a%0%a001240@bLa Guardia! That's the lookout tower, isn't it?\nCan we all go together?\n@c0@"
  es: "@a%0%a001240@b¡La Guardia! ¿No es esa la atalaya?\n¿Podemos ir todos juntos?\n@c0@"
