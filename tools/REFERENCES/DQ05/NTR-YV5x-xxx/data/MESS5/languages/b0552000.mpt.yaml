  es: "@aSancho@b¿Qué? Qué cuate era este.\n@c0@"
  fr: "@aSancho@bQuéⓡ T-Tu connais ce señor, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, conosce esto señor?\n@c0@"
  ja: "@a@bサンチョ「なんと？\n\t今の方は　%a000090王の\n\tお知り合いの方ですか。\n@c0@"
5:
