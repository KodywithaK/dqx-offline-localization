  ja: "@a@bサンチョ「自分の目で　確かめるのが\n\tこわい　ということなのでしょうか？\n@c0@"
263:
  de: "@aOtto@bDas ist die perfekte Gelegenheit. Onassetti wird tief in meiner Schuld stehen und...\n@c0@"
