  ja: "@a@b%a001250「ねている人の　おうちに\n\tかってに入るなんて……\n\tわたしたちって　どろぼうさん？？\n@c0@"
148:
  de: "@a%0%a001240@bWir sollten ihn nicht aufwecken, Papa. Lass ihn schlafen.\n@c0@"
  en: "@a%0%a001240@bWe shouldn't wake him up, Dad. Let him sleep.\n@c0@"
  es: "@a%0%a001240@bMejor no despertarlo, papá. Déjalo descansar.\n@c0@"
  fr: "@a%0%a001240@bOn ne devrait pas le réveiller, papa.\nLaissons-le dormir.\n@c0@"
  it: "@a%0%a001240@bPapà, lasciamolo dormire...\n@c0@"
  ja: "@a@b%a001240「ダメだよ　お父さん。\n\tおこしちゃ　かわいそうだよ。\n@c0@"
149:
  de: "@aSancho@bAlte Señores und Señoritas gehen immer früh zu Bett. Du solltest sie nisst aufwecken, Chico...\n@c0@"
  en: "@aSancho@bThe old señores and señoras, they like to esleep early. You must no wake them up, friend.\n@c0@"
  es: "@aSancho@bLos abuelitos se van a dormir temprano. No los despiertes, chamaquito.\n@c0@"
  fr: "@aSancho@bLes vieux señors et les v-vieilles señoras, ils aiment bien se coucher t-tôt. Il ne faut pas les r-réveiller, chico.\n@c0@"
  it: "@aSancho@bChico, no esvegliamo las personas que dormono...\nCerchiamo de comportarce educatamentes...\n@c0@"
  ja: "@a@bサンチョ「ご老人は　夜が早いんですから\n\tゆっくり　ねかせてあげましょう。\n@c0@"
150:
  de: "@aBianca@bEs ist doch nett, dass sie sich so um ihren Mann sorgt, nicht?\n@c0@"
  en: "@aBianca@bIt's nice that she looks out for her hubbie like\r\nthat, eh?\n@c0@"
  es: "@aBianca@bQué bonito que se preocupe tanto por su marido... ¡Ay!\n@c0@"
  fr: "@aBianca@bC'est mignon qu'elle s'occupe de son mari comme ça.\n@c0@"
  it: "@aBianca@bNon sono fatti miei, ma mi piacerebbe sapere che lavoro fa suo marito.\nEh eh eh! Sono una curiosona, che ci vuoi fare?\n@c0@"
  ja: "@a@bビアンカ「いい奥さんね。\n\t私も　すこしは見習わなきゃ。\n@c0@"
151:
  de: "@aNera@bWir sollten uns diese Nacht auch mal ausruhen, Liebling.\n@c0@"
  en: "@aNera@bWe should probably have a good rest together tonight too, darling.\n@c0@"
  es: "@aNera@bAmore, ¿por qué no nos damos esta notte un merecido descanso también?\n@c0@"
  fr: "@aNera@bNous aussi, nous devrions peut-être aller passer une bonne nuit réparatrice, mon chéri.\n@c0@"
  it: "@aNera@bIl riposo è importante, caro.\nAnche noi dovremmo cercare di dormire a sufficienza...\n@c0@"
  ja: "@a@bフローラ「あなた　私たちも\n\t今夜は　仲良くしましょうか？\n@c0@"
152:
  de: "@aSancho@bSiehst du? Es gibt nissts Schöneres auf der Welt, als jemanden zu haben, der diss liebt!\n@c0@"
  en: "@aSancho@bYou see? Ees notheeng better than esomeone who loves you.\n@c0@"
  es: "@aSancho@b¡Épale! No hay nada como tener a alguien que te quiera a tu lado.\n@c0@"
  fr: "@aSancho@bT-Tu voisⓡ Il n'y a r-rien de mieux que d'avoir quelqu'un qui t'aime à tes c-côtés.\n@c0@"
  it: "@aSancho@b¡Ay, que mujer premurosa!\nSuo marido es un hombre muy fortunato...\n@c0@"
  ja: "@a@bサンチョ「やはり　夫婦とは\n\tよいものですなあ……。\n@c0@"
153:
  de: "@aBianca@bOnassetti ist vor lauter Freude ganz schön aus dem Häuschen. Es ist gut, dass wir ihm helfen konnten.\n@c0@"
  en: "@aBianca@bBriscoletti seems pleased, eh? It's good that we've managed to pay him back a bit.\n@c0@"
  es: "@aBianca@bMenuda satisfacción la de Rimaldi, ¿no? Menos mal que hemos podido corresponderle un poco por su ayuda.\n@c0@"
  fr: "@aBianca@bOscuroni a l'air content, heinⓡ Ça me fait plaisir qu'on ait trouvé un moyen de le remercier un peu pour tout ce qu'il a fait pour nous.\n@c0@"
  it: "@aBianca@bMister Fosconi era proprio sollevato...\nSono contenta di aver potuto ripagare il debito di riconoscenza che avevamo verso di lui!\n@c0@"
  ja: "@a@bビアンカ「ルドマンさん　うれしそう……。\n\tこれで　すこしは　恩返しが\n\tできたかしらね？\n@c0@"
154:
  de: "@a%0%a001240@bOh! Wir hätten zusammen mit Herrn Onassetti kämpfen können, wenn er rechtzeitig da gewesen wäre. Das wäre bestimmt lustig geworden!\n@c0@"
  en: "@a%0%a001240@bOh! We could've fought with Briscoletti if he'd made it to the tower in time. That would've been fun.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! Hubiéramos luchado con Rimaldi si hubiera llegado a la torre a tiempo. Una lástima no haberlo visto.\n@c0@"
  fr: "@a%0%a001240@bOhⓠ On aurait pu combattre avec Oscuroni s'il était arrivé à la tour à temps. Ça aurait été sympa.\n@c0@"
  it: "@a%0%a001240@bCerto che il mio papà è in gamba!\nLui è il padre dell'Eroe Leggendario!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「どうせなら　したくしてから\n\t塔に行ってくれてれば　ルドマンさんと\n\tいっしょに　たたかえたのにね！\n@c0@"
155:
  de: "@a%0%a001250@bIch glaube, das ist das erste Mal, dass ich Herrn Onassetti habe lächeln sehen. Der sieht ja völlig verändert aus!\n@c0@"
