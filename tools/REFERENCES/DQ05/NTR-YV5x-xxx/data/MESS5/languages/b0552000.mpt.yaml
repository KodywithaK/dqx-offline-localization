  it: "@aSimon@bTemo che ce l'abbia con lei, Sire!\nMi presenti alla belva...\nEhm, mi presenti alla bisbetica...\n㈡\nNo no no!\nVolevo dire mi presenti a quella fanciulla, e vedrà che saprò come calmarla...\n@c0@"
  ja: "@a@bピピン「%a000090王が　遅いなら\n\tボクは　大丈夫なはず……！\n@c0@"
