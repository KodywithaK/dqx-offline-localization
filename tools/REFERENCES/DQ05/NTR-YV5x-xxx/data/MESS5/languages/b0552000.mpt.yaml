  it: "@aSimon@bQuesta è la mia grande opportunità!\nSe aiuterò mister Fosconi, lui sarà in debito nei miei confronti, e potrò chiedergli di tutto!\n@c0@"
  ja: "@a@bピピン「ここは　ルドマンさんに\n\t恩の　ひとつも　売っておけば……\n@c0@"
264:
