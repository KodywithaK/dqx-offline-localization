  it: "@aSimon@bQuesta è la mia grande opportunità!\nSe aiuterò mister Fosconi, lui sarà in debito nei miei confronti, e potrò chiedergli di tutto!\n@c0@"
  ja: "@a@bピピン「ここは　ルドマンさんに\n\t恩の　ひとつも　売っておけば……\n@c0@"
117:
  de: "@aOtto@bÄhm, nichts! Nein, ich habe gar nichts gesagt. Das müsst Ihr Euch eingebildet haben...\n@c0@"
  en: "@aTuppence@bEr! Nothing! No, I didn't say a word.\r\nYou must be hearing things.\n@c0@"
  es: "@aAlazar@bEjem... ¡Nada! No he dicho nada.\nSerán alucinaciones vuestras.\n@c0@"
  fr: "@aInnocent@bEuhⓠ Rienⓠ Je n'ai rien dit. Vous devez entendre des voix.\n@c0@"
  it: "@aSimon@bIn particolare, potrò chiedergli di dimostrarmi la sua riconoscenza trovandomi una moglie bella, giovane e ricca! Sì, mi sembra un'ottima idea...\n@c0@"
  ja: "@a@bピピン「……えっ！？　なにか\n\t聞こえました？　おかしいなあ。\n\tなんにも　言ってませんよ。\n@c0@"
118:
  de: "@aBianca@b(Gähn) Aaaaah. ... Guck mich bitte nicht so an, wenn ich gähne!\n@c0@"
  en: "@aBianca@b(yawn) Aaaaaah. ...There's no need to stare at me when I'm yawnin', you know!\n@c0@"
  es: "@aBianca@b¡Uaaah! ¡Eh, no me mires así! ¿No has visto nunca a nadie bostezar?\n@c0@"
  fr: "@aBianca@b(bâillement) Aaaaah... Il n'y a pas grand intérêt à me regarder bâiller, tu saisⓠ\n@c0@"
  it: "@aBianca@bYaaawn...\nNon guardarmi mentre sbadiglio, che poi viene sonno anche a te!\n@c0@"
  ja: "@a@bビアンカ「ふ…ふわぁ……。\n\t……！　やだ　あくびしてるとこ\n\tそんなに　見ないでよ！\n@c0@"
119:
  de: "@aNera@bWenn man bedenkt, wie oft ich auf Reisen war und wie lange ich im Stift gelebt habe, habe ich doch nicht so viel Zeit hier verbracht.\n@c0@"
  en: "@aNera@bBy the time you take into account all the travelling I did and that time I spent at the abbey, I wasn't actually here all that much.\n@c0@"
  es: "@aNera@bTeniendo en considerazione el tempo que me he pasado viajando y la estancia en la abadía, no he pasado molto tempo aquí.\n@c0@"
  fr: "@aNera@bSi on compte toutes les années que j'ai passées\r\nà voyager et le séjour que j'ai fait à l'abbaye, je n'ai pas passé beaucoup de temps ici, en fait.\n@c0@"
  it: "@aNera@bHo trascorso più tempo in giro per il mondo e all'Abbazia di Su'ncyel che non in questo posto...\n@c0@"
  ja: "@a@bフローラ「私　修道院に入ったり\n\t旅したりして　この町にいることは\n\tほとんどなかったけど……\n@c0@"
120:
  de: "@aNera@bTrotzdem ist es schön, wieder da zu sein.\n@c0@"
  en: "@aNera@bIt's still nice to be back, though.\n@c0@"
  es: "@aNera@bMa, es agradable estar aquí de nuevo.\n@c0@"
  fr: "@aNera@bMais je suis quand même contente de revenir.\n@c0@"
  it: "@aNera@bPerò mi fa sempre piacere tornare qui.\nAhhh, che bello respirare aria di casa!\n@c0@"
  ja: "@a@bフローラ「それでも　ここに帰ってくると\n\tホッとしますわ……。\n@c0@"
121:
  de: "@a%0%a001240@bIch kann eine Menge Leute hören, die sich prächtig amüsieren. Sind die etwa alle in der Schänke?\n@c0@"
  en: "@a%0%a001240@bI can hear lots of people having fun.\nMaybe they're in the pub?\n@c0@"
  es: "@a%0%a001240@bEstoy oyendo a mucha gente pasándoselo bien.\n¿Estarán en la taberna?\n@c0@"
  fr: "@a%0%a001240@bJ'entends plein de gens qui s'amusent.\nIls sont peut-être à la taverneⓡ\n@c0@"
  it: "@a%0%a001240@bA volte penso che mi piacerebbe giocare con altri bambini, però mi rendo conto che non posso farlo.\nNon ancora, perlomeno...\n@c0@"
  ja: "@a@b%a001240「どこかから　楽しそうな声が\n\t聞こえるね。　酒場のほうからかな？\n@c0@"
122:
  de: "@a%0%a001250@bÄhm, es ist doch schon Nacht, oder?\n@c0@"
  en: "@a%0%a001250@bUm, it's night already, isn't it?\n@c0@"
  es: "@a%0%a001250@bMmm, ya ha caído la noche, ¿no es así?\n@c0@"
  fr: "@a%0%a001250@bMmm. Il fait déjà nuitⓡ\n@c0@"
  it: "@a%0%a001250@bÈ già calato il buio...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tもう　夜よ？\n@c0@"
123:
  de: "@aSancho@bDas ist eine sehr schöne Stadt, eh, Chico? Si. Humburg sollte auch so aussehen...\n@c0@"
  en: "@aSancho@bEes a very attractive town, you no theenk?\nSí. Gotha eshould look like thees.\n@c0@"
  es: "@aSancho@bEste lugar está padrísimo, ¿no?\n¡Ándale! Pankraz tendría que ser así.\n@c0@"
  fr: "@aSancho@bC'est une ville v-vraiment agréable, noⓡ\nSi. Gotha d-devrait ressembler à ça.\n@c0@"
  it: "@aSancho@b¿Esto villaggio es muy carino, eh?\nPerò preferisco Denim...\n@c0@"
  ja: "@a@bサンチョ「きれいな町並みですね。\n\tふむふむ…　グランバニアも\n\tこうありたいものです。\n@c0@"
124:
  de: "@a%0%a001240@bHm? Er hält sich wohl für besonders lustig...\n@c0@"
  en: "@a%0%a001240@bHuh! I suppose he thinks he's funny, does he?\n@c0@"
  es: "@a%0%a001240@b¡Mmm! Supongo que se creerá muy gracioso, ¿a que sí?\n@c0@"
  fr: "@a%0%a001240@bPfffⓠ Je suppose qu'il trouve ça drôle, heinⓡ\n@c0@"
  it: "@a%0%a001240@bMa perché hanno messo di guardia una persona che non ci vede bene?!\n@c0@"
  ja: "@a@b%a001240「なんだよ　えらそうに！\n\tあっかん　ベーっだ！\n@c0@"
125:
  de: "@a%0%a001250@bDieser Mann macht mir Angst. Los, lass uns schnell eine Herberge finden, ja, Papa?\n@c0@"
  en: "@a%0%a001250@bThat's really scary. Can we hurry up and find an inn now please, Dad?\n@c0@"
  es: "@a%0%a001250@b¡Qué miedo! ¡Démonos prisa en encontrar una posada, papi!\n@c0@"
  fr: "@a%0%a001250@bÇa fait vraiment peur. S'il te plaît, papa,\non pourrait se dépêcher de trouver une\nauberge où dormir, maintenantⓡ\n@c0@"
  it: "@a%0%a001250@bNon ci avrà davvero scambiati per dei mostri?!\nSe fosse così, gli consiglierei di farsi visitare subito da un buon oculista!\n@c0@"
  ja: "@a@b%a001250「こわいこと　言う人がいるね。\n\tねえ　お父さん　もう宿に行こうよ。\n@c0@"
126:
  de: "@aSancho@bSi, es stimmt. In die Nacht, die Monster kommen heraus, um zu spielen. Das wäre eine gute Zeit für die Siesta, no?\n@c0@"
  en: "@aSancho@bSí. Ees true. Een the night, the monsters, they\r\ncome out to play. Maybe ees a good time for\r\na siesta, no?\n@c0@"
  es: "@aSancho@b¡Órale! Pues es la puritita verdad. Los monstruos aprovechan la noche para salir a hacer de las suyas. ¿Igual, pues ya es hora de planchar oreja?\n@c0@"
  fr: "@aSancho@bSi. Il a r-raison. La noche, les monstres, ils sortent pour s'amuser. C'est peut-être le m-moment idéal pour aller faire oune siesta, noⓡ\n@c0@"
  it: "@aSancho@bSì, claro. Durante la noche ce sono en giro diversos mostros. Es una fortuna que quell'hombre no ce abbia attaccatos...\n㈡\nEsta es l'ora de dormir, chico, no de passeggiare...\n@c0@"
  ja: "@a@bサンチョ「ふむ。　たしかに\n\t夜は　魔物たちの時間ですからね。\n\t今日は　もう　休むとしましょうか。\n@c0@"
127:
  de: "@a%0%a001240@bDer Hund bellt aber komisch... Na, vielleicht ist er ja erkältet.\n@c0@"
  en: "@a%0%a001240@bThat dog sounds weird.\nMaybe it's got a cold or something.\n@c0@"
  es: "@a%0%a001240@bQué ladrido tan raro.\nPara mí que el perro se ha pillado un resfriado.\n@c0@"
  fr: "@a%0%a001240@bCe chien aboie bizarrement.\nPeut-être qu'il a pris froid.\n@c0@"
  it: "@a%0%a001240@bChe carino quel cane!\n@c0@"
  ja: "@a@b%a001240「あの犬　おっかし～い！\n\t鼻が　つまってるのかな？？\n@c0@"
128:
  de: "@a%0%a001240@b(Gähn) Ich glaube, ich werde langsam müde...\n@c0@"
  en: "@a%0%a001240@b(yawn) I think I might be a bit sleepy.\n@c0@"
  es: "@a%0%a001240@b¡Uaaaah! Qué sueño me ha entrado...\n@c0@"
  fr: "@a%0%a001240@b(bâillement) Je crois que je suis un peu fatigué.\n@c0@"
  it: "@a%0%a001240@bYaaawn...\nSono un po' assonnato...\n@c0@"
  ja: "@a@b%a001240「ふわ～……\n\tなんだか　眠くなってきちゃったよ。\n@c0@"
129:
  de: "@a%0%a001240@bEin Topf, der rot glüht? Von ganz alleine? Das ist bestimmt ein seltsamer Anblick...\n@c0@"
  en: "@a%0%a001240@bIt would be a bit weird, seeing a jar glowing red all by itself like that.\n@c0@"
  es: "@a%0%a001240@bNo me imagino una tinaja resplandeciendo con un brillo rojo, así, ella sola.\n@c0@"
  fr: "@a%0%a001240@bÇa doit faire un peu bizarre de voir une amphore qui émet une lueur rouge.\n@c0@"
  it: "@a%0%a001240@bUn'anfora che emanava una luce rossastra?\nNon è che quel tipo avrà visto un braciere e si è confuso?\n@c0@"
  ja: "@a@b%a001240「たしかに　かってに\n\t赤く光るツボって　こわいよね……。\n@c0@"
130:
  de: "@a%0%a001250@bKönnen wir denn gar nichts tun, Papa?\n@c0@"
  en: "@a%0%a001250@bIs there nothing we can do to help out, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Podemos ayudar de alguna forma, papi?\n@c0@"
  fr: "@a%0%a001250@bOn ne peut rien faire pour aider, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, cosa potremmo fare per aiutare quest'uomo?\nMi sembra molto preoccupato...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tなんとかしてあげたいね……？\n@c0@"
131:
  de: "@aSancho@bMan sollte immer erst denken, bevor man die Mund aufmacht. Manche Leute vergessen das leider...\n@c0@"
  en: "@aSancho@bThees ees red, thees ees white... Thees conversation, ees chopping thees way and that more than the barber eshop! Eh heh heh heh.\n@c0@"
  es: "@aSancho@bAzul, rojo, blanco... ¡Híjole! ¡Esto tiene más colores que un anuncio de barbero! Je, je, je, je.\n@c0@"
  fr: "@aSancho@bOune fois c'est b-blanc, oune fois c'est rouge...\n\nOn est en train de c-couper les cheveux en quatre, comme chez le b-b-barbierⓠ Hé hé hé hé hé.\n@c0@"
  it: "@aSancho@bEsto hombre es muy nervoso por qué teme de aver detto una cosa esgradita al señor Fosconi...\n@c0@"
  ja: "@a@bサンチョ「赤い　ツボを見て\n\t真っ青とは……！？\n\t赤なのに　青！？　うひゃ～。\n@c0@"
132:
  de: "@aSancho@bSo darfst du auf keine Fall werden, Chico. Du musst immer auf die anderen Rücksisst nehmen, si?\n@c0@"
  en: "@aSancho@bAnda! Ees no time for the laughing, eh?\n@c0@"
  es: "@aSancho@b¡Ándale! Este no es momento de chanzas, ¿eh?\n@c0@"
  fr: "@aSancho@bAndaⓠ Ce n'est pas le m-moment de rire, heinⓡ\n@c0@"
  it: "@aSancho@bYo pienso que ha fatto bien a dire quello que ha visto... ¿Anche si es una cosa brutta, es bueno saperla il primero posible, no?\n@c0@"
  ja: "@a@bサンチョ「いやいや……。\n\t笑っている場合では　なさそうですな！\n@c0@"
133:
  de: "@aOtto@bManchmal ist Ignoranz durchaus ein Segen.\n@c0@"
  en: "@aTuppence@bSometimes ignorance is bliss.\n@c0@"
  es: "@aAlazar@bA veces, la ignorancia es una bendición.\n@c0@"
  fr: "@aInnocent@bIl vaut parfois mieux ne rien savoir.\n@c0@"
  it: "@aSimon@bCerte persone non amano conoscere verità spiacevoli. Nascondono la testa sotto la sabbia facendo finta di nulla...\n@c0@"
  ja: "@a@bピピン「知らない方が　幸せ\n\tということは　ありますけど……\n@c0@"
134:
  de: "@aOtto@bDoch den Kopf einfach so in den Sand stecken, nützt auch nichts. Wir müssen etwas unternehmen.\n@c0@"
  en: "@aTuppence@bBut it's no use burying your head in the sand when something needs to be dealt with.\n@c0@"
  es: "@aAlazar@bPero no sirve de nada enterrar la cabeza en la arena cada vez que se presenta el más mínimo problema.\n@c0@"
  fr: "@aInnocent@bMais ça ne sert à rien de se voiler la face\nlorsqu'il y a quelque chose à faire.\n@c0@"
  it: "@aSimon@bIo, invece, preferisco sapere tutto ciò che mi riguarda, anche se si tratta di fatti sgradevoli. Non mi piace essere lasciato all'oscuro!\n@c0@"
  ja: "@a@bピピン「だからといって\n\t知らないままで　いるわけには\n\tいかないことって　ありますもんね。\n@c0@"
135:
  de: "@a%0%a001240@bIn der Schänke ist ja eine Menge los. Da muss man ganz schön laut reden, um gehört zu werden!\n@c0@"
  en: "@a%0%a001240@bThe pub's a bit lively. You have to talk really loud to make yourself heard!\n@c0@"
  es: "@a%0%a001240@bMenuda fiesta tienen montada. ¡Aquí hay que gritar para poder entenderse!\n@c0@"
  fr: "@a%0%a001240@bIl y a de l'animation dans cette taverne.\nIl faut parler fort pour s'entendreⓠ\n@c0@"
  it: "@a%0%a001240@bChe confusione che c'è qui dentro!\nNon riesco nemmeno a sentire quello che dico!\n@c0@"
  ja: "@a@b%a001240「酒場って　にぎやかだね。\n\t大きな声で話さないと　聞こえないよ！\n@c0@"
136:
  de: "@a%0%a001250@bBah! Wie das hier stinkt! Mir wird ganz schlecht...\n@c0@"
  en: "@a%0%a001250@bYuck! All those smells are making me feel sick.\n@c0@"
  es: "@a%0%a001250@b¡Puaj! Estos vapores me están revolviendo el estómago.\n@c0@"
  fr: "@a%0%a001250@bBeurkⓠ Toutes ces odeurs me donnent la nausée.\n@c0@"
  it: "@a%0%a001250@bQuesto posto è troppo rumoroso per i miei gusti...\n@c0@"
  ja: "@a@b%a001250「う～……\n\tいろんなニオイが　まじってて\n\t気持ち悪くなってきた……。\n@c0@"
137:
  de: "@a%0%a001240@bIch hätte gern ein Glas Saft, bitte!\n@c0@"
  en: "@a%0%a001240@bI'd like a tasty glass of juice, I think!\n@c0@"
  es: "@a%0%a001240@b¡Yo me tomaría un zumo natural!\n@c0@"
  fr: "@a%0%a001240@bMoi, je prendrais bien un bon verre de jus de fruitⓠ\n@c0@"
  it: "@a%0%a001240@bIl caffè e il tè li conosco, ma che razza di bevanda è il ⓕmeⓖ?!\n@c0@"
  ja: "@a@b%a001240「ボクは　おいしい\n\tジュースが飲みたいな！\n@c0@"
138:
  de: "@aOtto@bHi hi hi! Das ist aber ein ziemlich dreistes Weibsbild.\n@c0@"
  en: "@aTuppence@bHee hee hee! What a cheeky little minx!\n@c0@"
  es: "@aAlazar@b¡Ji, ji, ji! Pequeña descarada...\n@c0@"
  fr: "@aInnocent@bHé hé héⓠ Quelle petite coquineⓠ\n@c0@"
  it: "@aSimon@bIo prendo un bel bicchierone di ⓕmeⓖ. Cioè di ⓕteⓖ. Ehm, di lei... No, Maestà, non di ⓕlei re %a000090ⓖ, di ⓕlei la camerieraⓖ e...\n㈡\nOh, non importa.\nPrenderò un succo di frutta...\nSigh...\n@c0@"
  ja: "@a@bピピン「うわ～！　やっぱり　女性は\n\tボン！　キュッ！　ボーン！\n\tサイコーですね！　%a000090さま！\n@c0@"
139:
  de: "@aBianca@bIch frage mich, was sie sagen würde, wenn ich auf ihr Angebot eingehe...\n@c0@"
  en: "@aBianca@bI wonder what she'd say if I tried to take her up on her offer.\n@c0@"
  es: "@aBianca@b¡Pues no sé yo qué me iba a ofrecer esta si le llego a pedir ⓕotra cosaⓖ, vamos!\n@c0@"
  fr: "@aBianca@bJe me demande ce qu'elle dirait si je choisissais la deuxième option.\n@c0@"
  it: "@aBianca@bAccidenti, Simon!\nMa hai proprio un chiodo fisso, eh?!\n@c0@"
  ja: "@a@bビアンカ「ああ言ってるわよ？\n\tウンとかスンとか　答えたら\n\tどうなの？　%a000090。\n@c0@"
140:
  de: "@a%0%a001240@bGlaubst du, dass es Herrn Onassetti besser geht, wenn er hierher kommt?\n@c0@"
  en: "@a%0%a001240@bDo you think coming here makes Mr Briscoletti\nfeel better?\n@c0@"
  es: "@a%0%a001240@b¿Y venir a este sitio le levanta el ánimo a don Rimaldi?\n@c0@"
  fr: "@a%0%a001240@bTu crois que monsieur Oscuroni se sent mieux quand il vient iciⓡ\n@c0@"
  it: "@a%0%a001240@bCredi che mister Fosconi si senta meglio quando viene qui? Secondo me cerca solo di non pensare ai propri guai, ma dubito che ci riesca...\n@c0@"
  ja: "@a@b%a001240「ルドマンさん\n\tここに来ると　すっきりするのかな？\n@c0@"
141:
  de: "@aSancho@bWeißt du, deine Onkel Sancho hat auch viel Zeit in die Schänke verbracht, als Señor Ludwig, als er n-nisst nach Hause gekommen ist...\n@c0@"
  en: "@aSancho@bYou know, your Uncle Sancho espent a lot of time een the pub too, when señor Pankraz, he, he no came home.\n@c0@"
  es: "@aSancho@bTu tito Sancho también pasó mucho tiempo en la taberna, cuando el señor Teudis no regresaba a casa, chamaco.\n@c0@"
  fr: "@aSancho@bT-Tu sais, ton oncle Sancho a passé b-beaucoup de tiempo à la taverne quand le señor P-Petros ne rentrait p-pas à la maison.\n@c0@"
  it: "@aSancho@bQuando hai un problema, espendere todo el día en un luego como esto no serve a nada.\nNo es così que se resolvono los guaios...\n@c0@"
  ja: "@a@bサンチョ「私も　パパスさまが\n\tもどられなかったとき　しばらく\n\t酒場に　かよってしまいましたよ……。\n@c0@"
142:
  de: "@aBianca@bNa, wenn man mit so was wie ihm vorlieb nehmen muss, ist man aber kein Glückspilz...\n@c0@"
  en: "@aBianca@bIt's not so lucky havin' to put up with the likes of him though, eh? What a lout!\n@c0@"
  es: "@aBianca@bTener que aguantar a gente así, es lo peor, ¿verdad? ¡Menudo patán!\n@c0@"
  fr: "@aBianca@bQuelle plaie d'avoir à supporter les gens dans son genreⓠ Quel rustreⓠ\n@c0@"
  it: "@aBianca@bA giudicare da com'è ridotto quel tipo, non c'è da stupirsi che non abbia una compagna...\n@c0@"
  ja: "@a@bビアンカ「……あんな　おじさんに\n\tたまんねえなあ！\n\t…って　いわれても　ねえ？\n@c0@"
143:
  de: "@aBianca@bJetzt hat er's dir aber gezeigt, was, %a000090?\n@c0@"
  en: "@aBianca@bWell, that told you, eh, %a000090?\n@c0@"
  es: "@aBianca@bBueno, habrá que hacerle caso, ¿no, %a000090?\n@c0@"
  fr: "@aBianca@bEh bien, tiens-toi le pour dit, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon ho capito bene le sue parole ma, se ho afferrato il senso del discorso, concordo sull'importanza di prestare attenzione a ciò che si dice in giro...\n@c0@"
  ja: "@a@bビアンカ「あら　言われたわね。\n\t%a000090。\n@c0@"
144:
  de: "@aSancho@bSi, si. Das stimmt aber, weißt du.\n@c0@"
  en: "@aSancho@bSí, sí. Thees ees the truth, you know.\n@c0@"
  es: "@aSancho@bSí, sí. Esa es la verdad, nomás.\n@c0@"
  fr: "@aSancho@bSi, si. Il a r-raison, tu sais.\n@c0@"
  it: "@aSancho@bSì, claro.\nLas mias orecchias sono mias.\nSi las presto en giros, poi las rivoglio indietros.\n@c0@"
  ja: "@a@bサンチョ「いや　ごもっともですよ。\n@c0@"
145:
  de: "@a%0%a001240@bHeißt das, dass sich die Farbe erst vor kurzem geändert hat?\n@c0@"
  en: "@a%0%a001240@bDoes that mean the colour of it's changed\njust recently?\n@c0@"
  es: "@a%0%a001240@b¿Significará eso que el color con el que brillaba ha cambiado hace poco?\n@c0@"
  fr: "@a%0%a001240@bÇa veut dire que la couleur a changé il n'y a pas longtempsⓡ\n@c0@"
  it: "@a%0%a001240@bAllora l'anfora ha cambiato colore recentemente?\n@c0@"
  ja: "@a@b%a001240「ってことは\n\t最近　ツボの色が変わったって\n\tことなのかな？\n@c0@"
146:
  de: "@a%0%a001240@bVon schlechten Nachrichten lass ich mich nicht unterkriegen. Am besten, man krempelt einfach die Ärmel hoch und tut was dagegen!\n@c0@"
  en: "@a%0%a001240@bI never let the bad stuff get me down in the dumps. It's best to stand up and do something about it.\n@c0@"
  es: "@a%0%a001240@bYo nunca dejo que las cosas malas me desanimen. Lo mejor es ser positivo y afrontar los problemas.\n@c0@"
  fr: "@a%0%a001240@bMoi, je ne me laisse jamais abattre. Je préfère tenir bon et faire de mon mieux pour changer les choses.\n@c0@"
  it: "@a%0%a001240@bIo non mi deprimo facilmente! Quando ho un problema, ci rifletto su e poi cerco di risolverlo nel miglior modo possibile! Piangere sui propri guai non serve a niente.\n@c0@"
  ja: "@a@b%a001240「ボクは　イヤなことがあっても\n\t気が　めいったりしないよ！\n\tめいる前に　やれる事　がんばるんだ！\n@c0@"
147:
  de: "@a%0%a001250@bWir sollten nicht einfach so in den Häusern der Leute rumschleichen, wenn sie schlafen. Nachher halten sie uns noch für Einbrecher!\n@c0@"
