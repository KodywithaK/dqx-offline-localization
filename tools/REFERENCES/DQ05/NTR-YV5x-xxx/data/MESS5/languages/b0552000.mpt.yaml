  ja: "@a@bサンチョ「う～む…　それだけのことを\n\tわざわざ人に頼むとは\n\tただごとでは　ありませんね。\n@c0@"
262:
  de: "@aSancho@bIss glaube, dieser Señor Onassetti hat zu viel Angst, um selbst nachzusehen, eh, Chico?\n@c0@"
