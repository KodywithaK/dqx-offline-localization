  it: "@aBianca@bIo non sopporterei di essere trattata in quel modo!\n@c0@"
  ja: "@a@bビアンカ「私だって　たまには\n\t%a000090に　強引に　手を\n\tひっぱってほしいと思うもの。\n@c0@"
57:
  de: "@aBianca@bDas ist immer noch besser, als mit einem Waschlappen verheiratet zu sein!\n@c0@"
