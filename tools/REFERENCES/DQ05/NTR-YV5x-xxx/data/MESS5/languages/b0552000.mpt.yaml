  it: "@aSancho@b¿Que cosa?\n¿Quel señor es el padre de %a001230?\n@c0@"
  ja: "@a@bサンチョ「なんと？\n\t今の方は　%a001230さまの\n\tお父上ですか。\n@c0@"
