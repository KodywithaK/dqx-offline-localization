  en: "@aSancho@bHe no eseems to be een a good mood, eh?\r\nMaybe you eshould ask heem what ees the matter.\n@c0@"
  es: "@aSancho@bEstá reteserio.\nHabría que preguntarle qué le pasa.\n@c0@"
  fr: "@aSancho@bIl n'a pas l'air d'être de b-bonne humeur. Peut-être que tu devrais lui d-demander ce qu'il y a.\n@c0@"
