303:
  de: "@aBianca@bSie hat sich keine Sorgen gemacht?! Na, das ist ja nett von ihr!\n@c0@"
  en: "@aBianca@bShe wasn't bothered? This Debora's quite a piece of work, eh?\n@c0@"
  es: "@aBianca@b¿Dice que no pasa nada? Menudo ejemplar esta Stefania, ¿eh?\n@c0@"
  fr: "@aBianca@bElle n'a pas été dérangéeⓡ C'est quelqu'un, hein, cette Pandoraⓡ\n@c0@"
  it: "@aBianca@bNon è rimasta turbata?!\nQuella donna ha i nervi d'acciaio!\nNah. Credo che stavolta stia bluffando...\n@c0@"
  ja: "@a@bビアンカ「なんともないって……\n\t実は　デボラさんって\n\t大物なのかもね。\n@c0@"
304:
  de: "@aNera@bWahrscheinlich wollte sie bloß unsere Gefühle nicht verletzen...\n@c0@"
  en: "@aNera@bI think she's probably just trying to save\r\nour feelings.\n@c0@"
  es: "@aNera@bProbabilemente quiere quitarle ferro al asunto.\n@c0@"
  fr: "@aNera@bJe crois qu'elle essaie simplement de ne\r\npas nous heurter.\n@c0@"
  it: "@aNera@bMia sorella è sempre la solita: pur di non ringraziarci, fa finta di non sapere cos'è successo...\n@c0@"
  ja: "@a@bフローラ「もしかして　姉さん\n\t私たちに　気を使ってくださってる？\n@c0@"
305:
  de: "@a%0%a001240@bWie kann sie sich keine Sorgen gemacht haben, wo draußen dieses riesige Monster rumgestampft ist? Sie muss wirklich tapfer sein!\n@c0@"
  en: "@a%0%a001240@bHow can she not have been bothered, with that huge monster clomping about the place?\nShe must be really brave!\n@c0@"
  es: "@a%0%a001240@b¿Cómo que no pasaba nada con ese monstruo enorme paseándose por aquí?\n¡Qué valiente!\n@c0@"
  fr: "@a%0%a001240@bComment elle peut ne pas avoir été dérangée avec ce monstre énorme qui piétinait toutⓡ Elle doit être très courageuseⓠ\n@c0@"
  it: "@a%0%a001240@bEh?! C'era un mostro gigantesco che voleva distruggere il villaggio e lei non è rimasta turbata?!\nAccidenti! Quella signorina è troppo forte!\n@c0@"
  ja: "@a@b%a001240「あんな　怪物が歩いてたのに\n\t平気だったんだって！\n\tすごいね　お父さん！\n@c0@"
306:
  de: "@a%0%a001250@bSie hat es zwar nicht sehr geschickt ausgedrückt, aber wahrscheinlich möchte sie einfach nicht unsere Gefühle verletzen.\n@c0@"
  en: "@a%0%a001250@bShe's not expressing it very well, but I'm sure she's just trying to be considerate of our feelings.\n@c0@"
  es: "@a%0%a001250@bAunque no se expresa muy bien, yo creo lo que intenta es quitarle hierro al asunto.\n@c0@"
  fr: "@a%0%a001250@bElle ne l'exprime pas très bien, mais je suis sûre qu'elle essaie simplement de ne pas nous vexer.\n@c0@"
  it: "@a%0%a001250@bSecondo me sta recitando la parte della donna fredda e coraggiosa, ma in realtà anche lei ha temuto che il mostro distruggesse il villaggio!\n@c0@"
  ja: "@a@b%a001250「言葉づかいは\n\t悪いけど　気をつかって\n\tくれてるみたい……。\n@c0@"
307:
  de: "@aOtto@bLiebste Griselda, ich bin so schnell wie möglich hierher geeilt, um zu sehen, ob Ihr nicht verletztⓚⓛ Oh. Sie hört gar nicht zu.\n@c0@"
  en: "@aTuppence@bDear Debora, I came as fast as I could to check that you weren't injuⓚⓛ Oh. She's not listening.\n@c0@"
  es: "@aAlazar@bQuerida Stefania, he venido tan rápido como he podido para comprobar si estabas... Vaya. No me escucha.\n@c0@"
  fr: "@aInnocent@bChère Pandora. Je suis venu aussi promptement que possible m'assurer que vous n'étiez point bless...\r\nOh. Elle ne m'écoute pas.\n@c0@"
  it: "@aSimon@bMia splendida Viola, ho lottato come un luone per impedire che il mostro potesse torcerti anche un solo capell...\n㈡\nMaestà!\nLa signorina Viola non mi ascolta nemmeno!\n@c0@"
  ja: "@a@bピピン「お美しい　デボラさまが\n\tケガなど　されていないかと……\n\tって　聞いてませんね。\n@c0@"
308:
  de: "@aNera@bGriselda nennt die Leute immer mickrig, wenn sie ihnen ein Kompliment machen möchte. Sie macht nur Spaß...\n@c0@"
  en: "@aNera@bDebora always calls people puny-looking when she's trying to pay a compliment. She's just teasing.\n@c0@"
  es: "@aNera@bStefania siempre llama blandengue a la gente cuando en realidad los quiere halagar. Es una de sus bromas, veramente.\n@c0@"
  fr: "@aNera@bPandora traite toujours les gens de mauviettes quand elle essaie de faire un compliment.\r\nElle plaisante, c'est tout.\n@c0@"
  it: "@aNera@bLa ⓕsplendida signorina Violaⓖ, eh?!\n@c0@"
  ja: "@a@bフローラ「小魚って　姉さんが\n\t誰かを　ほめるときは\n\t必ず　言うんですよね。\n@c0@"
309:
  de: "@aNera@bAber ich bin froh, dass sie gut mit den Kindern auszukommen scheint.\n@c0@"
  en: "@aNera@bI'm glad that the children seem to get on with her.\n@c0@"
  es: "@aNera@bMe alegro de que los bambini se lleven bien con ella.\n@c0@"
  fr: "@aNera@bJe suis contente que les enfants aient l'air de bien s'entendre avec elle.\n@c0@"
  it: "@aNera@bNo, mia sorella non cambierà mai...\n@c0@"
  ja: "@a@bフローラ「この子たちも　姉さんに\n\t気に入られたみたいで\n\tうれしいですわ。\n@c0@"
310:
  de: "@a%0%a001240@bWarum will sie nicht, dass wir sie Tantchen nennen, Papa? Sie ist doch unsere Tante, oder?\n@c0@"
  en: "@a%0%a001240@bWhat's the problem with calling her ⓗauntieⓘ, Dad?\nShe is my auntie, isn't she?\n@c0@"
  es: "@a%0%a001240@b¿Y qué pasa si la llamo ⓕtitaⓖ, papi?\n¿Es que no es mi tita?\n@c0@"
  fr: "@a%0%a001240@bDis, papa, c'est quoi le problème de l'appeler ⓥtataⓦⓡ C'est bien ma tata, pourtant, nonⓡ\n@c0@"
  it: "@a%0%a001240@bPerché non posso chiamarla semplicemente ⓕziaⓖ?\nEppure è mia zia, no?\nIo voglio chiamarla ⓕziaⓖ!\n@c0@"
  ja: "@a@b%a001240「ねえ　どうして\n\tおばさんって呼んじゃ　ダメなの？\n\tあの人　ボクの　おばさんでしょ？\n@c0@"
311:
  de: "@a%0%a001250@bIch habe Angst, sie Tantchen zu nennen. Am besten spreche ich sie einfach mit Signora an, so wie sie es wollte...\n@c0@"
  en: "@a%0%a001250@bI'm too scared to call her ⓗauntieⓘ.\nI'll just call her ⓗSignorinaⓘ like she asked.\n@c0@"
  es: "@a%0%a001250@bMe da miedo llamarle ⓕtitaⓖ.\nLa llamaré ⓕsignora Stefaniaⓖ, como ha pedido.\n@c0@"
  fr: "@a%0%a001250@bElle me fait bien trop peur pour que je l'appelle ⓥtataⓦ, de toute façon. Je l'appellerai ⓥsignorinaⓦ, comme elle l'a demandé.\n@c0@"
  it: "@a%0%a001250@bD'accordo, la chiamerò ⓕsplendida signorina Violaⓖ...\nMa lei dovrà rivolgersi a me dicendo ⓕmeravigliosa sorella dell'Eroe Leggendarioⓖ!\n@c0@"
  ja: "@a@b%a001250「おばさんと呼ぶと\n\tこわそうなので　お姉さんと\n\t呼ぶことにします。\n@c0@"
312:
  de: "@aOtto@bOh, ich habe kein Problem damit, sie ⓞwunderschöne Signora Griseldaⓟ zu nennen! Nein, überhaupt net!\n@c0@"
  en: "@aTuppence@bOoh, I don't mind calling her ⓗbeautiful Signorina Deboraⓘ! No, not one little bit!\n@c0@"
  es: "@aAlazar@b¡Ooh, no me importa llamarla ⓕbella signora Stefaniaⓖ! ¡No me importa en absoluto!\n@c0@"
  fr: "@aInnocent@bOooh, mais ça ne me dérange pas de l'appeler ⓥsplendide Signorina Pandoraⓦⓠ Non, pas le\nmoins du mondeⓠ\n@c0@"
  it: "@aSimon@bHo deciso, Sire!\nChiamerò la signorina Viola ⓕluce degli occhi del prode soldato Simonⓖ!\n㈡\nDica, Maestà...\nCrede che mi risponderà...?\n@c0@"
  ja: "@a@bピピン「ボクにも　デボラお姉さまと\n\t呼ばせてください！！\n@c0@"
313:
  de: "@aGriselda@bDann ist Lothar jetzt wohl mein Schwager, wenn er und Nera verheiratet sind.\n@c0@"
  en: "@aDebora@bI suppose that means Crispin's my brother-in-law now that he and Nera are married.\n@c0@"
  es: "@aStefania@bSupongo que, ahora que Crispín y Nera se han sposato, eso significa que él es mi cuñado.\n@c0@"
  fr: "@aPandora@bJ'imagine que maintenant que Nera et Gaëtan sont mariés, ça signifie qu'il est mon beau-frère.\n@c0@"
  it: "@aViola@bOra che ha sposato Nera, Candido è diventato mio cognato...\n@c0@"
  ja: "@a@bデボラ「アンディが　フローラと\n\t結婚したってことは\n\t私の　義弟になるのよね。\n@c0@"
314:
  de: "@aGriselda@bHa, dann lässt er sich noch leichter herumkommandieren als vorher!\n@c0@"
  en: "@aDebora@bThat should make him even easier to boss around than before!\n@c0@"
  es: "@aStefania@b¡Allora, aún me resultará más fácil que antes darle órdenes!\n@c0@"
  fr: "@aPandora@bÇa va être encore plus facile de lui donner des ordres, alorsⓠ\n@c0@"
  it: "@aViola@bQuesto vuol dire che potrò farmi ancora meno scrupoli a dare ordini a quel rammollito!\n㈡\nNon che prima me ne facessi alcuno, sia chiaro...\n@c0@"
  ja: "@a@bデボラ「これで　ますます\n\tこき使いやすく　なるわね。\n@c0@"
315:
  de: "@a%0%a001240@bHundertfünfzig Jahre sollen sich nur wie ein paar Tage anfühlen? Glaubst du, dass man ein anderes Zeitgefühl hat, wenn man so groß ist?\n@c0@"
  en: "@a%0%a001240@bOne hundred and fifty years would've felt like just a few days? Do you think time feels different if you're big, then?\n@c0@"
  es: "@a%0%a001240@b¿Que ciento cincuenta años le debieron parecer unos cuantos días? Supongo que el tamaño debe influir en la noción del tiempo. Será eso, ¿no?\n@c0@"
  fr: "@a%0%a001240@bCes cent cinquante ans lui auraient semblé seulement quelques joursⓡ Alors tu crois que le temps passe différemment quand on est aussi grosⓡ\n@c0@"
  it: "@a%0%a001240@bCentocinquant'anni in un'anfora sono tanti per chiunque, mostro o uomo che sia! Io sarei impazzito! O forse morto. O magari entrambe le cose...\n@c0@"
  ja: "@a@b%a001240「１５０年が　数日！？\n\tやっぱり　身体が大きいと\n\t時間も　ゆっくりなのかな？\n@c0@"
316:
  de: "@a%0%a001250@bDas Monster hätte bestimmt großen Schaden angerichtet, wenn es in die Stadt gekommen wäre. Wie gut, dass wir es aufgehalten haben...\n@c0@"
  en: "@a%0%a001250@bWould everyone have been killed if that monster\nhad made it into town? It's a good job we stopped him, then.\n@c0@"
  es: "@a%0%a001250@bSi el monstruo hubiera entrado a la ciudad ahora estaríamos viviendo una desgracia. Menos mal que pudimos detenerlo a tiempo.\n@c0@"
  fr: "@a%0%a001250@bTout le monde aurait été tué si le monstre était arrivé en villeⓡ Alors c'est vraiment bien qu'on ait réussi à l'arrêter.\n@c0@"
  it: "@a%0%a001250@bNon oso nemmeno pensare a cosa sarebbe successo se il mostro avesse raggiunto Mostroferrato!\nPer fortuna l'abbiamo fermato in tempo...\n@c0@"
  ja: "@a@b%a001250「あの魔物が　あばれてたら\n\tこの町の人　みんな　死んじゃってた？\n\t……ぐすっ　たおせて良かったね。\n@c0@"
317:
  de: "@a%0%a001240@bMama ist doch ihre Schwester, oder?\n@c0@"
  en: "@a%0%a001240@bHer sister is Mum, isn't it?\n@c0@"
  es: "@a%0%a001240@bSu hermana es mamá, ¿no?\n@c0@"
  fr: "@a%0%a001240@bSa sœur, c'est maman, heinⓡ\n@c0@"
  it: "@a%0%a001240@bQuella signorina è la sorella di mamma, non è vero?\nE allora come mai hanno caratteri così differenti?\n@c0@"
  ja: "@a@b%a001240「デボラお姉さんって\n\tお母さんの　ことだよね？\n@c0@"
318:
  de: "@a%0%a001240@bIch dachte immer, Geschwister hätten viel Ähnlichkeit miteinander, aber sie sind ja grundverschieden!\n@c0@"
  en: "@a%0%a001240@bAren't sisters supposed to be alike?\nThey don't seem very similar.\n@c0@"
  es: "@a%0%a001240@bY las hermanas deberían parecerse, ¿no?\nNo parece que se parezcan demasiado.\n@c0@"
  fr: "@a%0%a001240@bÇa n'est pas censé se ressembler, les sœursⓡ\nElles, elles n'ont pas l'air du tout pareilles.\n@c0@"
  it: "@a%0%a001240@bAh, la cosa non dovrebbe sorprendermi... Anche io e %a001250 siamo totalmente diversi tra noi: io sono l'Eroe Leggendario, e lei non lo è! Ah ah ah!\n@c0@"
  ja: "@a@b%a001240「姉妹ってことは\n\t似たところも　あるのかな？\n\t……なさそうだけどね。\n@c0@"
319:
  de: "@a%0%a001250@bTante Nera scheint sich wirklich um Mama zu sorgen, nicht? Ich glaube, sie würde sie wirklich gerne wiedersehen.\n@c0@"
  en: "@a%0%a001250@bAuntie Nera really seems to care about Mum, doesn't she? You can tell she'd love to see her again.\n@c0@"
  es: "@a%0%a001250@bTita Nera se preocupa mucho por mamá, ¿verdad? Seguro que le gustaría muchísimo volverla a ver.\n@c0@"
  fr: "@a%0%a001250@bTante Nera a l'air de vraiment beaucoup aimer maman, heinⓡ Ça se sent qu'elle aimerait beaucoup\nla revoir.\n@c0@"
  it: "@a%0%a001250@bZia Nera vuole molto bene alla mamma...\nE anche a noi! Spero che torneremo a trovarla prestissimo, perché mi è troppo simpatica!\n@c0@"
  ja: "@a@b%a001250「フローラおばさん\n\tお母さんのこと　大好きなんだね。\n\t会いたいって気持ちが　伝わってくるもん。\n@c0@"
320:
  de: "@aOtto@bWenn solch eine Schönheit für mich betet, komme ich mir plötzlich so stark vor wie hundert Mann!\n@c0@"
  en: "@aTuppence@bWith a beauty like that praying for me, I suddenly feel like I have the strength of a hundred men!\n@c0@"
  es: "@aAlazar@b¡Con una belleza como esta rezando por mí, de repente me siento con la fuerza de cien hombres!\n@c0@"
  fr: "@aInnocent@bAvec une beauté pareille qui prie pour moi, je me sens soudain aussi fort qu'une armée entièreⓠ\n@c0@"
  it: "@aSimon@bSe una donna tanto bella pregasse per me, niente e nessuno potrebbe fermarmi!\n@c0@"
  ja: "@a@bピピン「フローラさんに　祈られたら\n\tこのピピン　百人力ですよ！\n@c0@"
321:
  de: "@aOtto@bZu schade, dass sie bereits verheiratet ist... Die Göttin möchte mir aber auch gar nichts gönnen...\n@c0@"
  en: "@aTuppence@bWhat a shame she already belongs to another, though. Will the Goddess never grant me the happiness I deserve?\n@c0@"
  es: "@aAlazar@bEs una lástima que no esté soltera y sin compromiso... ¿Se apiadará de mí la Diosa algún día y me brindará la felicidad que merezco?\n@c0@"
  fr: "@aInnocent@bC'est dommage qu'elle soit déjà mariée. La Déesse\nne m'accordera-t-elle donc jamais le bonheur que\nje mériteⓡ\n@c0@"
  it: "@aSimon@bMa anche lei è già sposata!\nDea amatissima, ma non è che lo fai apposta a farmi incontrare solo donne maritate, eh?!\n@c0@"
  ja: "@a@bピピン「しかし　フローラさんは\n\tすでに　他の男性のもの……。\n\t神さまを　うらまずにいられません。\n@c0@"
322:
  de: "@aGriselda@bWir mussten unser Dasein viele Jahre als Steinstatuen fristen, deshalb ist die Zeit für uns nicht so schnell vorübergegangen!\n@c0@"
  en: "@aDebora@bWe were turned into stone for all those years,\r\nso the time didn't pass that quickly for us!\n@c0@"
  es: "@aStefania@b¡Como estuvimos convertidos en pietra tutti estos años, el tiempo pasó más lento para nosotros!\n@c0@"
  fr: "@aPandora@bNous avons été transformés en statues de pierre pendant toutes ces années, alors pour nous, le temps n'est pas passé à une vitesse si folle que çaⓠ\n@c0@"
  it: "@aViola@bSiamo stati due statue per tanti anni, e lo sanno tutti che le pietre non invecchiano!\n㈡\nNo, mi correggo: lo sanno tutti, tranne la mia cara sorellina... \n@c0@"
  ja: "@a@bデボラ「私たちは　石になってたから\n\t月日がたったっていう　実感は\n\tほとんど　ないんだけどね。\n@c0@"
323:
  de: "@a%0%a001240@bIch wusste, dass ich dir ähnlich sehe, Papa! Das sagt jeder.\n@c0@"
  en: "@a%0%a001240@bI knew I looked like you, Dad!\nEveryone says so.\n@c0@"
  es: "@a%0%a001240@b¡Ya sabía que me parecía a ti, papá!\nTodo el mundo lo dice.\n@c0@"
  fr: "@a%0%a001240@bJe savais que je te ressemblais, papaⓠ\nTout le monde le dit.\n@c0@"
  it: "@a%0%a001240@bEvviva!\nSomiglio al mio papà, che è tanto coraggioso!\nQuesta cosa è troppo forte!\n@c0@"
  ja: "@a@b%a001240「やっぱり　ボクって\n\tお父さんに　そっくりなんだね！\n\tみんなに　言われるもん。\n@c0@"
324:
  de: "@a%0%a001250@bNera und Mama sind Schwestern, nicht wahr?\n@c0@"
  en: "@a%0%a001250@bNera and Mum are sisters, aren't they?\n@c0@"
  es: "@a%0%a001250@bNera y mamá son hermanas, ¿no?\n@c0@"
  fr: "@a%0%a001250@bMaman et Nera sont sœurs, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bNera e la mamma sono sorelle, non è vero?\n@c0@"
  ja: "@a@b%a001250「フローラおばさんと\n\tお母さんって　姉妹なんだよね？\n@c0@"
325:
  de: "@a%0%a001250@bOb sie sich auch manchmal streiten, so wie ich und %a001240?\n@c0@"
  en: "@a%0%a001250@bI wonder if they fight with each other sometimes like %a001240 and I do.\n@c0@"
  es: "@a%0%a001250@bMe pregunto si a veces se pelean como hacemos %a001240 y yo.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si elles se battent parfois entre elles, comme %a001240 et moi.\n@c0@"
  it: "@a%0%a001250@bChissà se anche loro litigano tra loro come facciamo io e %a001240...\n@c0@"
  ja: "@a@b%a001250「わたしと　%a001240のように\n\tときどき　ケンカしたりするのかなあ。\n@c0@"
326:
  de: "@aGriselda@bMama, Papa, Nera ⓚⓛ sie sind alle gleich. Immerzu machen sie sich Sorgen!\n@c0@"
  en: "@aDebora@bMama, Papa, Nera, they're all the same.\nNon-stop worriers, the lot of them!\n@c0@"
  es: "@aStefania@bIl mio papino, la mia mamma y Nera son iguales.\n¡No pueden dejar de preocuparse!\n@c0@"
  fr: "@aPandora@bMamma, papa, Nera... tous les mêmes. Ils passent leur temps à s'inquiéter, tous autant qu'ils sontⓠ\n@c0@"
  it: "@aViola@bIl mio paparino, la mia mammina e la mia sorellina non fanno altro che preoccuparsi per noi...\n㈡\nChe branco di pappemolli!\nIh ih ih!\n@c0@"
  ja: "@a@bデボラ「ホント　パパもママも\n\tそれに　フローラも\n\t心配性で　困っちゃうわね。\n@c0@"
327:
  de: "@aGriselda@bDu scheinst sehr glücklich darüber zu sein, dass Nera für uns betet...\n@c0@"
  en: "@aDebora@bYou seem incredibly pleased that Nera's been praying for you...\n@c0@"
  es: "@aStefania@bPareces molto felice de que Nera haya estado rezando per te...\n@c0@"
  fr: "@aPandora@bTu as l'air particulièrement content que Nera ait\r\nprié pour toi...\n@c0@"
  it: "@aViola@bTi fa piacere che Nera preghi per noi, eh?!\nGuarda che io so pregare come e meglio di lei!\n@c0@"
  ja: "@a@bデボラ「あんた　フローラに祈られて\n\tずいぶん　うれしそうね。\n@c0@"
328:
  de: "@a%0%a001240@bJa, wir müssen uns langsam wieder auf den Weg machen, Papa. Hier haben wir alles erledigt.\n@c0@"
  en: "@a%0%a001240@bYeah, let's get on our way now, Dad.\nWe're done here.\n@c0@"
  es: "@a%0%a001240@bSí, pongámonos en marcha ahora, papá.\nAquí ya no tenemos mucho más que hacer.\n@c0@"
  fr: "@a%0%a001240@bOui, remettons-nous en route, papa.\nOn n'a plus rien à faire ici.\n@c0@"
  it: "@a%0%a001240@bPapà, allora ce ne andiamo?\nMi sembra che qui non abbiamo più niente da fare...\n@c0@"
  ja: "@a@b%a001240「うん！　お父さん！\n\tはやく　次の所に行こうよ！\n@c0@"
329:
  de: "@aOtto@bWenn solch eine Schönheit für mich betet, komme ich mir plötzlich so stark vor wie hundert Mann!\n@c0@"
  en: "@aTuppence@bWith a beauty like that praying for me, I suddenly feel like I have the strength of a hundred men!\n@c0@"
  es: "@aAlazar@b¡Con una belleza como esta rezando por mí, de repente me siento con la fuerza de cien hombres!\n@c0@"
  fr: "@aInnocent@bAvec une beauté pareille qui prie pour moi, je me sens soudain aussi fort qu'une armée entièreⓠ\n@c0@"
  it: "@aSimon@bSe una donna tanto bella pregasse per me, niente e nessuno potrebbe fermarmi!\n@c0@"
  ja: "@a@bピピン「フローラさんに　祈られたら\n\tこのピピン　百人力ですよ！\n@c0@"
330:
  de: "@aOtto@bZu schade, dass sie bereits verheiratet ist... Die Göttin möchte mir aber auch gar nichts gönnen...\n@c0@"
  en: "@aTuppence@bWhat a shame she already belongs to another, though. Will the Goddess never grant me the happiness I deserve?\n@c0@"
  es: "@aAlazar@bEs una lástima que no esté soltera y sin compromiso... ¿Se apiadará de mí la Diosa algún día y me brindará la felicidad que merezco?\n@c0@"
  fr: "@aInnocent@bC'est dommage qu'elle soit déjà mariée. La Déesse\nne m'accordera-t-elle donc jamais le bonheur que\nje mériteⓡ\n@c0@"
  it: "@aSimon@bMa anche lei è già sposata!\nDea amatissima, ma non è che lo fai apposta a farmi incontrare solo donne maritate, eh?!\n@c0@"
  ja: "@a@bピピン「しかし　フローラさんは\n\tすでに　他の男性のもの……。\n\t神さまを　うらまずにいられません。\n@c0@"
331:
  de: "@aGriselda@bWenn ich Mama so schlafen sehe, dann werde ich auch ganz schläfrig.\n@c0@"
  en: "@aDebora@bWatching Mama sleeping like that makes me feel all sleepy too.\n@c0@"
  es: "@aStefania@bVer a la mamma dormir así me da sueño.\n@c0@"
  fr: "@aPandora@bRegarder mamma dormir comme ça me donne\nmoi aussi envie d'aller me coucher.\n@c0@"
  it: "@aViola@bVedere mia madre che dorme così beatamente mi ha fatto venire sonno...\n@c0@"
  ja: "@a@bデボラ「ママの顔見てたら\n\t私も　眠くなってきたわ。\n@c0@"
332:
  de: "@a%0%a001240@bHey! Schlafen wir heute Nacht nicht hier? Ich möchte aber hier schlafen!\n@c0@"
  en: "@a%0%a001240@bHey! Aren't we sleeping here tonight?\nI want to sleep here!\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¿No vamos a pasar la noche aquí?\n¡Yo quiero dormir aquí!\n@c0@"
  fr: "@a%0%a001240@bHéⓠ On ne dort pas ici ce soirⓡ\nJe veux dormir ici, moiⓠ\n@c0@"
  it: "@a%0%a001240@bMa io volevo dormire qui stanotte!\nPerché non restiamo, eh?! Uffà!\n@c0@"
  ja: "@a@b%a001240「えっ？\n\tここで　ねるんじゃないの？\n\tボク　今日は　ここでねたいよ！\n@c0@"
333:
  de: "@a%0%a001250@bHier riecht es nach Mama. Ich glaube, wenn ich in diesem Bett schlafe, fange ich noch an zu weinen oder so...\n@c0@"
  en: "@a%0%a001250@bIt smells of Mum in here. If I slept in that bed,\nI'd probably end up crying or something.\n@c0@"
  es: "@a%0%a001250@bEste sitio huele a mamá. Si durmiera en esa cama, acabaría llorando o algo así.\n@c0@"
  fr: "@a%0%a001250@bIl y a encore l'odeur de maman dans cette pièce.\nJe sens que je finirais par pleurer si je dormais dans ce lit.\n@c0@"
  it: "@a%0%a001250@bMi sembra di sentire il profumo di mamma.\nChissà cosa sognerei se dormissi qui...\n@c0@"
  ja: "@a@b%a001250「お母さんのニオイがする。\n\tあのベッドでねたら\n\tわたし　泣いちゃうかも……。\n@c0@"
334:
  de: "@a%0%a001240@bEs ist schön, dass wir diese Nacht alle zusammen waren.\n@c0@"
  en: "@a%0%a001240@bIt's cool that we could all stay together like this.\n@c0@"
  es: "@a%0%a001240@bQué bien que podamos estar todos juntos.\n@c0@"
  fr: "@a%0%a001240@bC'est chouette qu'on ait pu rester tous ensemble.\n@c0@"
  it: "@a%0%a001240@bHo riposato benissimo!\nMi sento fresco come una rosa!\n@c0@"
  ja: "@a@b%a001240「えへへ……。\n\tお父さんとお母さんと　いっしょって\n\tうれしいね。\n@c0@"
335:
  de: "@a%0%a001250@bIch werde mich heute besonders anstrengen!\n@c0@"
  en: "@a%0%a001250@bI'm going to try really, really hard today!\n@c0@"
  es: "@a%0%a001250@b¡Hoy me voy a esforzar mucho, papi!\n@c0@"
  fr: "@a%0%a001250@bJe vais essayer de faire encore mieux, aujourd'huiⓠ\n@c0@"
  it: "@a%0%a001250@bOggi voglio fare un sacco di belle cose!\n@c0@"
  ja: "@a@b%a001250「あのね。\n\t今日　わたし　いっぱい\n\tがんばっちゃうからねっ！\n@c0@"
336:
  de: "@a%0%a001240@bOh! Bleiben wir nicht hier? Aber ich bin doch noch so klein. Ich möchte in Mamas Bett schlafen.\n@c0@"
  en: "@a%0%a001240@bOh! Aren't we going to stay? But I'm still only little really. I wanted to sleep in Mum's bed.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¿No vamos a quedarnos? ¡Jo!, papá. Quería dormir en la cama de mamá.\n@c0@"
  fr: "@a%0%a001240@bOhⓠ On ne va pas rester iciⓡ Mais je suis encore petit, moi. Je voulais dormir dans le lit de maman.\n@c0@"
  it: "@a%0%a001240@bMa come?!\nNon restiamo qui?!\nOh, accidenti! Volevo dormire nel letto di mamma!\n@c0@"
  ja: "@a@b%a001240「え～っ！　泊まらないの？\n\tボク　まだ子供なのにな……\n\tお母さんと　ねたかったよ。\n@c0@"
337:
  de: "@a%0%a001250@bDu bist vielleicht voller Energie, Papa, aber ich bin müde...\n@c0@"
  en: "@a%0%a001250@bYou might still have lots of energy, Dad, but I'm really tired.\n@c0@"
  es: "@a%0%a001250@bSeguro que tú puedes seguir toda la noche despierto, papi, pero yo no puedo con mi alma.\n@c0@"
  fr: "@a%0%a001250@bTu as peut-être encore beaucoup d'énergie, papa, mais moi, je suis vraiment fatiguée.\n@c0@"
  it: "@a%0%a001250@bPapà, tu sarai anche un uomo dinamico, ma io sono stanchissima!\n@c0@"
  ja: "@a@b%a001250「お父さんは　元気だけど\n\tわたしは　ちょっと\n\tつかれちゃいました……。\n@c0@"
338:
  de: "@aOtto@bMacht Euch keine Sorgen um mich. Geht Ihr ruhig schlafen.\n@c0@"
  en: "@aTuppence@bDon't you worry about me. You should take all the rest you need.\n@c0@"
  es: "@aAlazar@bNo os preocupéis por mí. Descansad todo lo que necesitéis.\n@c0@"
  fr: "@aInnocent@bNe vous inquiétez pas pour moi. Vous devriez penser à vous et vous reposer.\n@c0@"
  it: "@aSimon@bNon si preoccupi per me, Maestà.\nSe vuole riposare, faccia pure.\n@c0@"
  ja: "@a@bピピン「どうぞ　ボクのことは\n\tお気になさらず　ごゆっくり\n\tおやすみください。\n@c0@"
339:
  de: "@aOtto@bIch kann am Rand des Bettes schlafen. Oder auf dem Boden, wenn Ihr wollt!\n@c0@"
  en: "@aTuppence@bI can sleep on the edge of the bed.\r\nOr the floor, even!\n@c0@"
  es: "@aAlazar@bMe conformo con dormir al borde de la cama.\n¡O en el suelo si hace falta!\n@c0@"
  fr: "@aInnocent@bJe peux dormir sur le bord du lit... ou même\npar terreⓠ\n@c0@"
  it: "@aSimon@bIo mi arrangerò sul pavimento.\nOppure sotto il letto.\nDica, Maestà... Dove preferisce che io dorma?\n@c0@"
  ja: "@a@bピピン「ボクは　ベッドの片すみ…\n\tいえ　床ででも　ねてますからっ！\n@c0@"
340:
  de: "@aGriselda@bDu hast Glück, Otto! Du darfst die ganze Nacht draußen vor dem Zimmer Wache stehen, weißt du noch?\n@c0@"
