  it: "@aNera@bHo paura che Viola sia arrabbiata con te perché hai deciso di sposare me e non lei. Non preoccuparti, tesoro. Vedrai che col tempo le passerà.\n㈡\nAlmeno spero!\n@c0@"
  ja: "@a@bフローラ「もしかしたら　姉さん\n\t%a000090さんが　私と結婚したこと\n\tいまだに　怒っているのかしら……。\n@c0@"
286:
  de: "@aGriselda@bNachts ist es hier viel ruhiger als tagsüber.\n@c0@"
  en: "@aDebora@bIt's so much quieter here at night than it is during\r\nthe day.\n@c0@"
  es: "@aStefania@bDe notte esto está mucho más tranquilo que de día.\n@c0@"
  fr: "@aPandora@bC'estvraiment beaucoup plus tranquille de nuit\r\nqu'en journée, ici.\n@c0@"
  it: "@aViola@bChe pace...\nChe silenzio...\nChe noia!\n@c0@"
  ja: "@a@bデボラ「夜のサラボナって\n\t昼間とはちがって\n\tずいぶん　静かなのよね～。\n@c0@"
287:
  de: "@aGriselda@bPapa kommt oft hierher? Das ist seltsam. Schänken waren doch früher nie sein Ding.\n@c0@"
  en: "@aDebora@bPapa comes here a lot? That's odd. This kind of place never used to be his cup of tea.\n@c0@"
  es: "@aStefania@b¿Que il mio papino viene mucho por aquí? ¡Qué raro! No es el tipo de sitios que solía gustarle.\n@c0@"
  fr: "@aPandora@bPapa vient souvent iciⓡ C'est bizarre. Ce genre d'endroit n'a pourtant jamais été sa tasse de thé.\n@c0@"
  it: "@aViola@bIl mio paparino viene spesso in questo locale?!\nPer quello che ricordo, non ci era mai entrato in vita sua!\n㈡\nNon avrà per caso qualche problema che lo preoccupa...?\n@c0@"
  ja: "@a@bデボラ「パパが　この店に　入りびたり？\n\t酒場通いなんて　しなかったのに……。\n@c0@"
288:
  de: "@aGriselda@bWas? Erwartest du etwa, dass ich dich genauso fürsorglich behandle?\n@c0@"
  en: "@aDebora@bWhat? You're not expecting the same kind of treatment from me, are you?\n@c0@"
  es: "@aStefania@b¿Come? No esperarás que yo te trate igual, ¿vero?\n@c0@"
  fr: "@aPandora@bQuoiⓡ Tu n'espères quand même pas que je vais te traiter de la même manière, quand mêmeⓡ\n@c0@"
  it: "@aViola@bNemmeno io voglio che tu sia disturbato mentre dormi. Se non riposassi bene, non avresti le energie necessarie per servirmi e riverirmi come desidero!\n@c0@"
  ja: "@a@bデボラ「なに？　あんたも\n\tああいうのを　期待してるわけ？\n@c0@"
289:
  de: "@aGriselda@bUi, das ist eine Menge Geld! Los, lass uns einkaufen gehen!\n@c0@"
  en: "@aDebora@bOoh, that's quite a windfall!\nLet's go shopping, %a000090!\n@c0@"
  es: "@aStefania@b¡Vaya lluvia de monedas!\n¡Andiamo de compras, %a000090!\n@c0@"
  fr: "@aPandora@bOh, en voilà une aubaineⓠ\nAllons faire quelques achats, %a000090ⓠ\n@c0@"
  it: "@aViola@bMa che bella sorpresa!\nQuesta ci voleva proprio!\nAndiamo a fare spese, %a000090!\n㈡\nEhm, ovviamente per i nostri bambini... Poi, se avanza qualche spicciolo, potresti anche comprare due o tre abitini per la tua amata mogliettina...\n@c0@"
  ja: "@a@bデボラ「あら　よかったわね。\n\tねえ　%a000090。　せっかくだから\n\t何か　買ってあげましょうよ。\n@c0@"
290:
  de: "@aGriselda@bMir wäre es natürlich auch lieber, wenn die Kinder nicht bei unseren Kämpfen dabei wären.\n@c0@"
  en: "@aDebora@bOf course I'd rather that the children weren't involved in our battles.\n@c0@"
  es: "@aStefania@bClaro que preferiría que los bambini no se metiesen en nuestras batallas.\n@c0@"
  fr: "@aPandora@bBien sûr que je préférerais que les enfants ne\r\nsoient pas impliqués dans nos combats.\n@c0@"
  it: "@aViola@bOvviamente, non mi fa affatto piacere che %a001250 e %a001240 prendano parte ai combattimenti...\n@c0@"
  ja: "@a@bデボラ「私だって　子供たちを\n\tたたかわせたいわけじゃ　ないわよ。\n@c0@"
291:
  de: "@aGriselda@bAber sie wollen es ja so. Und das müssen wir respektieren.\n@c0@"
  en: "@aDebora@bIt's what they want to do, though.\r\nIt's important to respect that.\n@c0@"
  es: "@aStefania@bMa es lo que ellos quieren y hay que respetarlo, ¿capisci?\n@c0@"
  fr: "@aPandora@bMais c'est ce dont ils ont envie. C'est important de respecter leur volonté.\n@c0@"
  it: "@aViola@bPerò i nostri figli hanno deciso di restarci vicini fino alla fine della nostra avventura, e intendo rispettare la loro scelta.\n@c0@"
  ja: "@a@bデボラ「でも　この子たちが　自分の意思で\n\tたたかうって　言ってるから\n\tそれを　そんちょうしたいだけ。\n@c0@"
292:
  de: "@aGriselda@bDas ist ja wohl klar. Sonst hätte ich dich auch kaum geheiratet.\n@c0@"
  en: "@aDebora@bThat goes without saying. I wouldn't have married you otherwise.\n@c0@"
  es: "@aStefania@bEso se da por descontado. Si no, no me habría casado con te.\n@c0@"
  fr: "@aPandora@bCela va de soi. Je ne t'aurais pas épousé, sinon.\n@c0@"
  it: "@aViola@bSe tu non fossi una persona eccezionale, non ti avrei mai permesso di sposarmi, caro il mio ⓕpappamolleⓖ! Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「私の夫なんだし　当然よね。\n@c0@"
293:
  de: "@a%0%a001240@bOh! Wir hätten zusammen mit Herrn Onassetti kämpfen können, wenn er rechtzeitig da gewesen wäre. Das wäre bestimmt lustig geworden!\n@c0@"
  en: "@a%0%a001240@bOh! We could've fought with Briscoletti if he'd made it to the tower in time. That would've been fun.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! Hubiéramos luchado con Rimaldi si hubiera llegado a la torre a tiempo. Una lástima no haberlo visto.\n@c0@"
  fr: "@a%0%a001240@bOhⓠ On aurait pu combattre avec Oscuroni s'il était arrivé à la tour à temps. Ça aurait été sympa.\n@c0@"
  it: "@a%0%a001240@bCerto che il mio papà è in gamba!\nLui è il padre dell'Eroe Leggendario!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「どうせなら　したくしてから\n\t塔に行ってくれてれば　ルドマンさんと\n\tいっしょに　たたかえたのにね！\n@c0@"
294:
  de: "@a%0%a001250@bIch glaube, das ist das erste Mal, dass ich Opa habe lächeln sehen. Der sieht ja völlig verändert aus!\n@c0@"
  en: "@a%0%a001250@bI think that's the first time I've seen Grandpapa smile. He's like a totally different person.\n@c0@"
  es: "@a%0%a001250@bEs la primera vez que veo al abuelito sonreír. Si hasta parece otra persona.\n@c0@"
  fr: "@a%0%a001250@bJe crois que c'est la première fois que je vois\ngrand-père sourire. C'est comme si c'était une personne complètement différente.\n@c0@"
  it: "@a%0%a001250@bIl nonno è molto più simpatico quando sorride!\nPrima, quando era preoccupato, sembrava una persona totalmente diversa...\n@c0@"
  ja: "@a@b%a001250「おじいさまが\n\tあんなに笑ってるの　初めて見た。\n\tなんだか　ちがう人みたい……。\n@c0@"
295:
  de: "@aSancho@bDas ist aber nisst die Ende von unsere Mission. Komm, wir haben noch viel vor, Chico.\n@c0@"
  en: "@aSancho@bThees ees no the end of our quest.\nCome, we have muchos, muchos to do.\n@c0@"
  es: "@aSancho@bEste no es el fin de la aventura.\nTodavía queda mucho que hacer.\n@c0@"
  fr: "@aSancho@bNotre quête n'est pas f-finie pour autant.\nAllezⓠ On a mucho, mucho à faire.\n@c0@"
  it: "@aSancho@bVamonos, chico.\nLa nuestra avventura no es finita.\nAbbiamo ancoras muchas cosas da fare...\n@c0@"
  ja: "@a@bサンチョ「これで　われわれの旅が\n\t終わったわけでは　ありません。\n\tさあ　旅の続きをしましょう。\n@c0@"
296:
  de: "@aOtto@bAh, und eine weitere Heldentat, die ich später meinen Enkelkindern erzählen kann!\n@c0@"
  en: "@aTuppence@bAah, another heroic tale to add to my\r\never-growing portfolio!\n@c0@"
  es: "@aAlazar@bAaaah, otra heroica hazaña que añadir a mi extenso haber...\n@c0@"
  fr: "@aInnocent@bAah, encore un épisode héroïque à ajouter à ma collectionⓠ\n@c0@"
  it: "@aSimon@bUn altro successo da aggiungere al già ricco palmares del brillante soldato Simon!\n@c0@"
  ja: "@a@bピピン「これで　また\n\tボクの歴史に　新たなる\n\t武勇伝が　書き加えられました！\n@c0@"
297:
  de: "@aGriselda@bIch glaube ja, dass Papa nie die Absicht hatte, zu kämpfen...\n@c0@"
  en: "@aDebora@bI suspect Papa never intended to fight in the\r\nfirst place.\n@c0@"
  es: "@aStefania@bCredo que il mio papino no tenía intención de luchar.\n@c0@"
  fr: "@aPandora@bJe soupçonne papa de n'avoir jamais réellement\r\neu l'intention de se battre.\n@c0@"
  it: "@aViola@bNon oso immaginare cosa sarebbe successo se il mio paparino avesse dovuto affrontare quel mostro...\n㈡\nDa quando è ingrassato non sa più maneggiare le armi come si deve.\nLa belva se lo sarebbe pappato in un sol boccone...\n@c0@"
  ja: "@a@bデボラ「パパったら　ホントは\n\t戦う気なんて　なかったんじゃないの？\n@c0@"
298:
  de: "@aGriselda@bAber wahrscheinlich ist es besser so. Er hätte uns nur im Weg gestanden...\n@c0@"
  en: "@aDebora@bStill, it's probably for the best. He would only have got in the way if he'd made it anyway.\n@c0@"
  es: "@aStefania@bPero quizá sea mejor así. Si lo hubiese hecho solo habría sido un estorbo, veramente.\n@c0@"
  fr: "@aPandora@bMais c'est sans doute mieux comme ça. S'il s'en était mêlé, il aurait surtout été une gêne.\n@c0@"
  it: "@aViola@bO forse due bocconi, vista la considerevole stazza del mio caro genitore...\n@c0@"
  ja: "@a@bデボラ「まあ　戦われても\n\t危ないだけだし　かえって\n\tよかったのかもしれないわね。\n@c0@"
