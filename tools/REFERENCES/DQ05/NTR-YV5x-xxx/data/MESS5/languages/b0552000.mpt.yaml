  ja: "@a@bピピン「だからといって\n\t知らないままで　いるわけには\n\tいかないことって　ありますもんね。\n@c0@"
28:
  de: "@a%0%a001240@bKomm, vielleicht können wir helfen. Dafür sind Freunde ja schließlich da.\n@c0@"
  en: "@a%0%a001240@bWe'd better go and see if we can help out, Dad. That's what friends are for.\n@c0@"
  es: "@a%0%a001240@bSerá mejor que vayamos a ayudar, papá. Para eso están los amigos.\n@c0@"
  fr: "@a%0%a001240@bOn ferait mieux d'aller voir si on peut l'aider, papa. C'est à ça que servent les amis.\n@c0@"
  it: "@a%0%a001240@bPapà, perché non andiamo a vedere cosa succede?\nMagari qualcuno ha bisogno d'aiuto...\n@c0@"
  ja: "@a@b%a001240「うん！　お父さんの\n\t知り合いが　困ってるんなら\n\t絶対に　助けてあげないとね！\n@c0@"
29:
  de: "@aSancho@bWeißt du, warum er diss nisst vergessen kann, Chico? Weil du eine gute und ehrlisse Mann bist, deshalb!\n@c0@"
  en: "@aSancho@bYou know why he can no forget you, friend?\r\nEes because you are a good and\r\nhonest man!\n@c0@"
  es: "@aSancho@b¿Sabes por qué no te ha olvidado, chamaco?\n¡Órale, pues por lo buen hombre que eres!\n@c0@"
  fr: "@aSancho@bT-Tu sais pourquoi il ne t'oubliera j-jamais, chicoⓡ C'est parce que tu es oun hombre honnête et buenoⓠ\n@c0@"
  it: "@aSancho@bEsto hombre se recuerda de ti anche si sono passatos muchos años, chico.\n¡Ay, que memoria buena!\n@c0@"
