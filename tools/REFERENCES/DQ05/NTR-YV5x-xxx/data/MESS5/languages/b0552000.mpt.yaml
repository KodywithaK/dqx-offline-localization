173:
  de: "@a%0%a001240@bOh! Wir hätten zusammen mit Herrn Onassetti kämpfen können, wenn er rechtzeitig da gewesen wäre. Das wäre bestimmt lustig geworden!\n@c0@"
  en: "@a%0%a001240@bOh! We could've fought with Briscoletti if he'd made it to the tower in time. That would've been fun.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! Hubiéramos luchado con Rimaldi si hubiera llegado a la torre a tiempo. Una lástima no haberlo visto.\n@c0@"
  fr: "@a%0%a001240@bOhⓠ On aurait pu combattre avec Oscuroni s'il était arrivé à la tour à temps. Ça aurait été sympa.\n@c0@"
  it: "@a%0%a001240@bCerto che il mio papà è in gamba!\nLui è il padre dell'Eroe Leggendario!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「どうせなら　したくしてから\n\t塔に行ってくれてれば　ルドマンさんと\n\tいっしょに　たたかえたのにね！\n@c0@"
174:
  de: "@a%0%a001250@bIch glaube, das ist das erste Mal, dass ich Opa habe lächeln sehen. Der sieht ja völlig verändert aus!\n@c0@"
  en: "@a%0%a001250@bI think that's the first time I've seen Grandpapa smile. He's like a totally different person.\n@c0@"
  es: "@a%0%a001250@bEs la primera vez que veo al abuelito sonreír. Si hasta parece otra persona.\n@c0@"
  fr: "@a%0%a001250@bJe crois que c'est la première fois que je vois\ngrand-père sourire. C'est comme si c'était une personne complètement différente.\n@c0@"
  it: "@a%0%a001250@bIl nonno è molto più simpatico quando sorride!\nPrima, quando era preoccupato, sembrava una persona totalmente diversa...\n@c0@"
  ja: "@a@b%a001250「ルドマンおじいさまが\n\tあんなに笑ってるの　初めて見た。\n\tなんだか　ちがう人みたい……。\n@c0@"
175:
  de: "@aSancho@bDas ist aber nisst die Ende von unsere Mission. Komm, wir haben noch viel vor, Chico.\n@c0@"
  en: "@aSancho@bThees ees no the end of our quest.\nCome, we have muchos, muchos to do.\n@c0@"
  es: "@aSancho@bEste no es el fin de la aventura.\nTodavía queda mucho que hacer.\n@c0@"
  fr: "@aSancho@bNotre quête n'est pas f-finie pour autant.\nAllezⓠ On a mucho, mucho à faire.\n@c0@"
  it: "@aSancho@bVamonos, chico.\nLa nuestra avventura no es finita.\nAbbiamo ancoras muchas cosas da fare...\n@c0@"
  ja: "@a@bサンチョ「これで　われわれの旅が\n\t終わったわけでは　ありません。\n\tさあ　旅の続きをしましょう。\n@c0@"
176:
  de: "@aOtto@bAh, und eine weitere Heldentat, die ich später meinen Enkelkindern erzählen kann!\n@c0@"
  en: "@aTuppence@bAah, another heroic tale to add to my\r\never-growing portfolio!\n@c0@"
  es: "@aAlazar@bAaaah, otra heroica hazaña que añadir a mi extenso haber...\n@c0@"
  fr: "@aInnocent@bAah, encore un épisode héroïque à ajouter à ma collectionⓠ\n@c0@"
  it: "@aSimon@bUn altro successo da aggiungere al già ricco palmares del brillante soldato Simon!\n@c0@"
  ja: "@a@bピピン「これで　また\n\tボクの歴史に　新たなる\n\t武勇伝が　書き加えられました！\n@c0@"
177:
  de: "@a%0%a001240@bJuchhu! So viel Taschengeld! Die eine Hälfte ist für mich und die andere für %a001250, ja?\n@c0@"
  en: "@a%0%a001240@bYay! We got some pocket money!\nCan we split it between %a001250 and me?\n@c0@"
  es: "@a%0%a001240@b¡Bien! ¡Hemos conseguido algo de dinero!\n¿Le damos la mitad a %a001250?\n@c0@"
  fr: "@a%0%a001240@bOuaisⓠ On a de l'argent de pocheⓠ\nOn peut le partager entre %a001250 et moiⓡ\n@c0@"
  it: "@a%0%a001240@bEvviva!\nI nonni ci hanno fatto un regalino, anzi un regalone!\n@c0@"
  ja: "@a@b%a001240「おこづかい　もらっちゃった！\n\t%a001250と　半分こ　していい？？\n@c0@"
178:
  de: "@a%0%a001250@bIm Moment möchte ich mir gar nichts kaufen, du kannst meinen Teil also aufbewahren, Papa.\n@c0@"
  en: "@a%0%a001250@bThere's nothing I want to buy at the moment, so you can just save my share, Dad.\n@c0@"
  es: "@a%0%a001250@bAhora no tengo pensado comprar nada, así que puedes quedarte mi parte, papi.\n@c0@"
  fr: "@a%0%a001250@bJe n'ai besoin de rien en ce moment, alors tu peux garder ma part, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, io non desidero nulla in questo momento.\nSe vuoi, puoi tenere tu la mia parte.\nPerò poi me la dovrai ridare, eh! Ih ih ih!\n@c0@"
  ja: "@a@b%a001250「わたし　ほしいものないから\n\t貯金しといてね　お父さん。\n@c0@"
179:
  de: "@aNera@bMama ist so glücklich, endlich %a001240 und %a001250 zu sehen.\n@c0@"
  en: "@aNera@bMama seems so thrilled to see %a001240 and %a001250.\n@c0@"
  es: "@aNera@bLa mia mamma está contentísima de ver a %a001240 y a %a001250.\n@c0@"
  fr: "@aNera@bMamma est si contente de voir %a001240 et %a001250.\n@c0@"
  it: "@aNera@bMia madre è stata contentissima di aver visto %a001240 e %a001250...\nIo... Io...\n@c0@"
  ja: "@a@bフローラ「お母さま　%a001240や\n\t%a001250のことを　心から\n\tよろこんでくださってるみたい……。\n@c0@"
180:
  de: "@aNera@bDa werde auch ich ganz rührselig...\n@c0@"
  en: "@aNera@bI feel quite emotional all of a sudden.\n@c0@"
  es: "@aNera@bQué sentimentale me he puesto en un momento.\n@c0@"
  fr: "@aNera@bJ'ai les larmes aux yeux, tout à coup.\n@c0@"
  it: "@aNera@bSe fossi Sancho, mi commuoverei...\nSob!\n@c0@"
  ja: "@a@bフローラ「私も　なんだか\n\tむねが　熱くなってきましたわ。\n@c0@"
181:
  de: "@a%0%a001240@bGroßmutter ist sehr lieb.\n@c0@"
  en: "@a%0%a001240@bGrandmama's so kind and gentle.\n@c0@"
  es: "@a%0%a001240@bLa abuela es tan amable y tan buena...\n@c0@"
  fr: "@a%0%a001240@bGrand-mère est vraiment gentille.\n@c0@"
  it: "@a%0%a001240@bLa nonna è una persona tanto gentile, sai?\n@c0@"
  ja: "@a@b%a001240「おばあさまって\n\tきれいだし　やさしい人だね。\n@c0@"
182:
  de: "@a%0%a001240@bIch werde mein Bestes geben, um die Welt zu retten!\n@c0@"
  en: "@a%0%a001240@bI'm going to try really hard to keep everyone safe.\n@c0@"
  es: "@a%0%a001240@bMe voy a esforzar mucho por cuidar de todos.\n@c0@"
  fr: "@a%0%a001240@bJe vais faire de mon mieux pour que personne ne soit blessé.\n@c0@"
  it: "@a%0%a001240@bFarò del mio meglio per salvarla dalla minaccia dell'oscurità!\nProteggerò lei, Mostroferrato e tutto il mondo!\n@c0@"
  ja: "@a@b%a001240「みんなを守るために\n\tボク　がんばるよ！\n@c0@"
183:
  de: "@a%0%a001250@bIch finde nicht, dass das eine Schande ist. Es ist doch schön, dass wir so viel Zeit miteinander verbringen können.\n@c0@"
  en: "@a%0%a001250@bI don't think it's a shame at all. It's nice that we can all spend time together.\n@c0@"
  es: "@a%0%a001250@bA mí no me parece una pena. Me gusta pasar el rato en compañía de mi padre.\n@c0@"
  fr: "@a%0%a001250@bMoi, je ne trouve pas ça regrettable. Au contraire, ça nous permet de passer du temps tous ensemble.\n@c0@"
  it: "@a%0%a001250@bCerto, essere sempre in giro non è facile, ma io mi diverto perché viaggiamo tutti insieme!\n@c0@"
  ja: "@a@b%a001250「わたしたち　ちっとも\n\tかわいそうじゃ　ないよね。\n\tだって　お父さんと　いっしょだもん！\n@c0@"
184:
  de: "@aNera@bManchmal frage ich mich immer noch, warum jemand, der so jung ist wie %a001240, der legendäre Held sein muss...\n@c0@"
  en: "@aNera@bI still sometimes wonder why someone as young as %a001240 has to be the legendary hero.\n@c0@"
  es: "@aNera@bTodavía me pregunto cómo alguien tan joven como %a001240 puede ser el héroe legendario.\n@c0@"
  fr: "@aNera@bParfois, je me demande pourquoi il faut que ce soit %a001240 le héros légendaire. Il est si jeune...\n@c0@"
  it: "@aNera@bA volte penso che non sia giusto che un ragazzino come %a001240 sia stato scelto dal destino per essere l'Eroe Leggendario...\n@c0@"
  ja: "@a@bフローラ「どうして　こんなに小さな\n\t%a001240が　勇者なんだろうって\n\tいまだに　思うことがありますわ。\n@c0@"
185:
  de: "@aNera@bIch hoffe, das alles ist bald vorbei. Dann können wir nach Hause gehen und ihm eine ganze normale Kindheit schenken.\n@c0@"
  en: "@aNera@bI hope this is all over soon so that we can go home and give him some semblance of a normal childhood.\n@c0@"
  es: "@aNera@bEspero que todo esto acabe pronto para que podamos tornare a casa y que tenga una infancia normale.\n@c0@"
  fr: "@aNera@bJ'espère que tout sera bientôt terminé pour qu'on puisse rentrer à la maison et lui offrir une enfance plus ou moins normale.\n@c0@"
  it: "@aNera@bSpero che quest'avventura termini presto, così i nostri figli potranno vivere spensieratamente, come tutti i ragazzi della loro età...\n@c0@"
  ja: "@a@bフローラ「たたかいを　早く終わらせて\n\t%a001240たちに　子供らしい生活を\n\t送らせてやりたいですわね。\n@c0@"
186:
  de: "@aSancho@bIn meiner Heimat sagen wir, dass die Niños in die Fußstapfen ihrer Eltern treten... Du wirst eine gute Padre sein, Chico.\n@c0@"
  en: "@aSancho@bWhere I come from, we esay the young ones, they follow een the footsteps of their parents. You weell be a fine papá, friend.\n@c0@"
  es: "@aSancho@bEn el lugar del que vengo, decimos que todo chamaco debe seguir los pasos de su apá.\nTú serás un gran apá, chamaquito.\n@c0@"
  fr: "@aSancho@bD'où j-je viens, on dit que les j-jeunes suivent les traces de leurs p-parents. Tu feras oun bon papá, chico.\n@c0@"
  it: "@aSancho@bEl proverbio dice ⓕtales padres, tales figliosⓖ.\n㈡\nEl señor Russel es estato un ottimo padre, chico. Soy seguro que anche tu sarai un genitore perfecto por los tuos niños...\n@c0@"
  ja: "@a@bサンチョ「子は　親の背中を見て育つ\n\tとも言います。　%a000090王なら\n\tりっぱな親に　なれますとも。\n@c0@"
187:
  de: "@aOtto@bSieh mal an. Ich hätte nie gedacht, dass eine solch gut aussehende Lady schon Großmutter sein könnte...\n@c0@"
  en: "@aTuppence@bWell, well... I never imagined such a delightful-looking lady could possibly be a grandma already.\n@c0@"
  es: "@aAlazar@bVaya, vaya... Nunca imaginé que una señora de tan buen ver pudiera ser abuela.\n@c0@"
  fr: "@aInnocent@bEh bien... Je n'aurais jamais pensé qu'une dame aussi séduisante pouvait déjà être grand-mère.\n@c0@"
  it: "@aSimon@bQuella bella signora è già nonna?!\nNon l'avrei mai detto...\n@c0@"
  ja: "@a@bピピン「そうか…\n\tあんなに　きれいなのに\n\tおばあちゃんなのか……。\n@c0@"
188:
  de: "@aNera@bDu bist wirklich wunderbar, Liebling. Du kommst mir jetzt viel stärker vor als damals, als wir in Statuen verwandelt wurden...\n@c0@"
  en: "@aNera@bYou are quite wonderful, you know, darling. You seem so much stronger now than when you were turned into a statue.\n@c0@"
  es: "@aNera@bAmore mio, eres meraviglioso. Estás mucho más fuerte que cuando te convertiste en estatua de piedra.\n@c0@"
  fr: "@aNera@bTu es vraiment merveilleux, mon chéri. Pour moi, tu es encore plus solide maintenant que lorsque tu étais une statue de pierre.\n@c0@"
  it: "@aNera@bTesoro, sei una persona davvero eccezionale.\nNon c'è nulla che tu non riesca a fare!\n@c0@"
  ja: "@a@bフローラ「あなたって　すごいのね。\n\t石にされる前より\n\tずっとずっと　強くなったみたい。\n@c0@"
189:
  de: "@a%0%a001240@bIch glaube, die Leute hier haben gar nicht gemerkt, dass wir gegen solch ein riesiges Monster gekämpft haben. Na, ist wohl auch besser so.\n@c0@"
  en: "@a%0%a001240@bIt doesn't look like the people here noticed that huge monster on the prowl. I suppose that's for the best.\n@c0@"
  es: "@a%0%a001240@bNo parece que la gente de aquí se haya percatado de la presencia del inmenso monstruo. Mejor así, supongo.\n@c0@"
  fr: "@a%0%a001240@bApparemment, les gens d'ici n'ont pas remarqué le monstre énorme qui rôdait. C'est aussi bien comme ça, remarque\n@c0@"
  it: "@a%0%a001240@bPare che gli abitanti del villaggio non si siano accorti del rischio che hanno corso... Meglio per loro, no?\nSi sono risparmiati un infarto collettivo!\n@c0@"
  ja: "@a@b%a001240「町の人たち　あの大きな魔物に\n\t気づかなかったんだね。\n\tでも　それで　良かったんだよね？\n@c0@"
190:
  de: "@aOtto@bHmpf. Zu dumm, dass die Leute net Zeugen meiner Tapferkeit g'worden sind!\n@c0@"
  en: "@aTuppence@bHmph. What a pity the people here weren't able to witness my bravery!\n@c0@"
  es: "@aAlazar@b¡Mmm! ¡Una lástima que estas gentes no hayan podido admirar mi coraje y valor!\n@c0@"
  fr: "@aInnocent@bMmpf. Quel dommage que les gens d'ici n'aient pas pu être témoins de ma bravoure.\n@c0@"
  it: "@aSimon@bMi spiace che la gente del posto abbia perso l'occasione di ammirare il valoroso soldato Simon in azione!\n㈡\nForse dovrei narrare le mie epiche gesta a qualche poeta che potrà poi metterle in versi e tramandarle ai posteri...\n@c0@"
  ja: "@a@bピピン「むむむっ。\n\tこのピピンの勇姿を　町の人々に\n\t見せられなかったのは　残念です。\n@c0@"
191:
  de: "@a%0%a001240@bWenn das dein Haus ist, ist es ja auch mein Haus, oder? Juchhu!\n@c0@"
  en: "@a%0%a001240@bIf it's your house, then that makes it my house too, right? Yippee!\n@c0@"
  es: "@a%0%a001240@bSi esta es tu casa, entonces eso significa que también es la mía, ¿no? ¡Yupiii!\n@c0@"
  fr: "@a%0%a001240@bSi c'est chez toi, alors c'est chez moi aussiⓡ Youpiⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ma questa è casa tua?!\nAllora è anche casa mia, non è vero?\n@c0@"
  ja: "@a@b%a001240「お父さんのおうち　ってことは\n\tボクのうち　でもあるんだよね？\n\tわ～い　わ～い！\n@c0@"
192:
  de: "@a%0%a001250@bHe he! Ein wunderbarer Schwiegersohn? Es ist lustig, wenn jemand so über dich spricht...\n@c0@"
  en: "@a%0%a001250@bHe he! A wonderful son-in-law? It's funny to hear someone talk about you like that.\n@c0@"
  es: "@a%0%a001250@b¡Je, je! ¿Un yerno genial? Qué raro suena que diga eso de ti.\n@c0@"
  fr: "@a%0%a001250@bHé hé héⓠ Un gendre fantastiqueⓡ C'est drôle d'entendre parler de toi comme ça.\n@c0@"
  it: "@a%0%a001250@bHa detto che nonno Rick si è scelto come genero un guerriero eccezionale... Papà, è buffo sentir parlare di te in questi termini! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「うふふ…\n\t若だんなさま　だって。\n\tなんだか　おかしいね。\n@c0@"
193:
  de: "@a%0%a001240@bScheint so, als ob hier jetzt alles wieder im Lot ist.\n@c0@"
  en: "@a%0%a001240@bLooks like there's nothing to worry about here\nany more.\n@c0@"
  es: "@a%0%a001240@bParece que ya se acabaron las preocupaciones por aquí.\n@c0@"
  fr: "@a%0%a001240@bJ'ai effectivement l'impression qu'il n'y a plus de quoi s'inquiéter.\n@c0@"
  it: "@a%0%a001240@bPer fortuna le cose sono tornate alla normalità...\n@c0@"
  ja: "@a@b%a001240「この町のことは\n\tもう　心配いらないみたいだね。\n@c0@"
194:
  de: "@a%0%a001250@bEr hat schon eine ziemlich laute Lache, stimmt!\n@c0@"
  en: "@a%0%a001250@bHe does have quite a laugh on him!\n@c0@"
  es: "@a%0%a001250@bEstán muy contentos.\n@c0@"
  fr: "@a%0%a001250@bAh oui, ça rigole beaucoupⓠ\n@c0@"
  it: "@a%0%a001250@bAdesso è tutto a posto, eh?\nAh, che bellezza!\n@c0@"
  ja: "@a@b%a001250「ルドマンさんの\n\t笑い声　大きいから……。\n@c0@"
195:
  de: "@aSancho@bWeißt du, wenn uns diese Señor nisst von die Farbe des Tiegels erzählt hätte, wäre es vielleisst zu spät gewesen, no?\n@c0@"
  en: "@aSancho@bYou know, eef thees señor, he had no told us about the colour of the jar, maybe we would have been too late, no?\n@c0@"
  es: "@aSancho@bSi este señor no nos hubiera contado lo del color de la tinaja, hubiéramos llegado demasiado tarde, ¿no crees, chamaco?\n@c0@"
  fr: "@aSancho@bT-Tu sais si ce señor, il ne nous avait pas parlé de la c-couleur de l'amphore, on serait peut-être arrivés t-trop tard.\n@c0@"
  it: "@aSancho@bChico, si quel señor no ce avesse detto del colore dell'anfora, forse no saremmo riuscitos a intervenire en tiempo...\n@c0@"
  ja: "@a@bサンチョ「思えば　あの旅の商人が\n\tツボの色を　報告してくれなければ\n\t手おくれになっていたかも知れません。\n@c0@"
196:
  de: "@aSancho@bEr ist wie eine Schattenkrieger, eh? Der Sombrero-Retter! Qué? Du weißt nisst, was eine Sombrero-Retter ist?\n@c0@"
  en: "@aSancho@bHe ees like a warrior from the eshadows, no?\r\nThe sombrero saviour! Qué? Thees no translate?\n@c0@"
  es: "@aSancho@bEs como un héroe en la sombra, nomás.\n¡El guerrero enmascarado! ¡Híjole!\n¿Que no lo conoces?\n@c0@"
  fr: "@aSancho@bC'est un peu oun guerrier de l'ombre, noⓡ\nLe sauveur au sombreroⓠ Quéⓡ Je m'emporteⓡ\n@c0@"
  it: "@aSancho@bSi abbiamo esconfitto el mostro, el merito es anche un poco suo...\n@c0@"
  ja: "@a@bサンチョ「彼は　かげの功労者と\n\t言えるでしょうね。\n@c0@"
197:
  de: "@a%0%a001240@bIch glaube, der Mann hat schon oft nach dem Tiegel gesehen. Das ist nett von ihm.\n@c0@"
  en: "@a%0%a001240@bIt sounds like that man's been to see the jar loads of times. That's nice of him.\n@c0@"
  es: "@a%0%a001240@bMe da que este hombre ha ido a ver la tinaja unas cuantas veces. Qué simpático.\n@c0@"
  fr: "@a%0%a001240@bOn dirait que ce monsieur est allé voir l'amphore plus d'une fois. C'est gentil.\n@c0@"
  it: "@a%0%a001240@bAh ah ah!\nFarebbe prima a trasferirsi al tempio, così avrebbe sempre l'anfora sotto controllo!\n@c0@"
  ja: "@a@b%a001240「あのおじさん　そんなに\n\t何度も　ツボを見に行ってるんだ。\n\tいい人だね。\n@c0@"
198:
  de: "@a%0%a001240@bHa! Er ist nicht besonders helle, was?\n@c0@"
  en: "@a%0%a001240@bHuh! He's a bit dippy, isn't he?\n@c0@"
  es: "@a%0%a001240@b¡Mmm! Está un poco chiflado, ¿no te parece?\n@c0@"
  fr: "@a%0%a001240@bHeinⓡ Il n'a plus toute sa tête ou quoiⓡ\n@c0@"
  it: "@a%0%a001240@bQuel tipo ha una fantasia molto fervida, eh?\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「まったく！\n\tのんきな人だねっ！\n@c0@"
199:
  de: "@a%0%a001250@bEs ist doch komisch, dass der Mann nie nachgesehen hat, was den Krach verursacht... %0%a001240 hätte das bestimmt getan.\n@c0@"
  en: "@a%0%a001250@bIt's weird that that man didn't think to check what the noise was about. %0%a001240 would've definitely gone and had a look.\n@c0@"
  es: "@a%0%a001250@bQué raro que ese hombre no se haya parado a investigar de dónde procedía el ruido. %0%a001240 no se lo hubiera pensado dos veces.\n@c0@"
  fr: "@a%0%a001250@bC'est bizarre que ce monsieur n'ait pas vérifié d'où venait ce bruit. %0%a001240 serait allé jeter un coup d'œil, lui.\n@c0@"
  it: "@a%0%a001250@bAccidenti, che persona impressionabile!\n@c0@"
  ja: "@a@b%a001250「あの人　音の正体を\n\tつきとめようとは思わなかったのかな？\n\t%a001240なら　絶対　行ってるよ！\n@c0@"
200:
  de: "@aBianca@bEs ist doch nett, dass er sich mehr um Onassettis Wohlergehen sorgt als um sein eigenes Geschäft, nicht?\n@c0@"
  en: "@aBianca@bIt's nice that he cares more about Briscoletti's welfare than he does about his own business, eh?\n@c0@"
  es: "@aBianca@bPues a mí me parece algo muy bonito que este señor se preocupe más por el bienestar de Rimaldi que por la buena marcha de su propio negocio, ¿sabes?\n@c0@"
