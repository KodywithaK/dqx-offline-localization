  de: "@a@b*: Zunächst, Monsieur ⓚⓛ und darf isch sagen, dass Ihr 'eute einfach großartig ausseht ⓚⓛ werdet Ihr Euren Platz vor dem Priester einnehmen.\n@c0@"
