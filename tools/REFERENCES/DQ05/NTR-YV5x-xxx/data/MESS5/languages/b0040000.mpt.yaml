  es: "@a@b*: ¡Cuando él diga unas palabgras, ustedes integrcambiagrán los anillos con una migrada passionée!\n㈡\n*: ¡La pasión de los grecién casados!\n@c0@"
  fr: "@a@b*ⓢ Après son discours, vous échangerez les alliances en y mettant toute la passion de l'amourⓠ\nCe sera comme dans les romansⓠ\n@c0@"
  it: "@a@b*: Lui vi dirà delle cose, poi vi scambierete gli anelli e...\n@c0@"
  ja: "@a@b＊「そこで　神父さまからの\n\tお話が　ありまして　あとは\n\t指輪の交換となります。\n@c0@"
28:
  de: "@a@b*: Und ⓚⓛ fertig! Voilà! Ihr seid ver'eiratet! Alors. Seid Ihr bereit, den ⓞgroßen Schritt zu wagenⓟ?\n@c0@"
  en: "@a@b*: And zat's it! Voilà! You will be 'itched!\nAlors. Are you ready to ⓗtake ze plungeⓘ?\n@c0@"
  es: "@a@b*: ¡Y ya está! ¡Voilà! ¡Bodogrio concluido!\r\nAlors. ¿Listó pagra dagr el salto?\n@c0@"
  fr: "@a@b*ⓢ Et voilàⓠ Vous serez mariésⓠ\nAlorsⓡ Vous êtes prêt pour le ⓥgrand sautⓦⓡ\n@c0@"
  it: "@a@b*: Voilà!\nLes jeux sont faits!\nAllora, hai capito bene cosa devi fare?\n@c0@"
  ja: "@a@b＊「それでは　お時間ですので\n\tさっそく　始めますが\n\tよろしいですか？\n@c0@"
29:
  de: "@a@b*: Bien. Folgt mir, Monsieur, und isch bringe Eusch den Gang 'inunter zum Priester. 'altet Euren Kopf 'och, damit sisch alle in Eusch verlieben, eh?! (Zwinker)\n@c0@"
  en: "@a@b*: Bien. Follow me, monsieur, and I will take you down ze aisle to ze priest. Keep your 'ead 'eld 'igh, so everyone falls in love wiz you, eh!? (wink)\n@c0@"
  es: "@a@b*: Très bien. Sígame, monsieur, y lo conducigré pogr el pasillo hasta el sacegrdote.\n㈡\n*: Mantenga bien alta la tête pagra que todo el mundo se enamogre de usted. (guiño)\n@c0@"
  fr: "@a@b*ⓢ Parfait. Suivez-moi, Monsieur, je vais vous conduire à l'allée au bout de laquelle se trouve le prêtre.\n㈡\n*ⓢ Gardez la tête bien haute pour que tout le monde puisse vous admirer. (clin d'œil)\n@c0@"
  it: "@a@b*: Ora andremo dal sacerdote. Mi raccomando, cammina lentamente, così tutti potranno ammirare lo style così vintage e post-urban del tuo essere cool.\n@c0@"
  ja: "@a@b＊「それでは　花ムコさま。\n\t神父さまのもとへ\n\t私が　ご案内いたします。\n@c0@"
30:
  de: "@a@b*: Non? Ihr seid naturellement nervös, da Ihr so ein Juwel e'elischen werdet, eh? Bien. Isch erkläre es Eusch encore une fois.\n@c0@"
  en: "@a@b*: Non? It is understandable zat you are nervous when you are to marry such a jewel, eh?\r\nBien. I will explain it once again.\n@c0@"
  es: "@a@b*: ¿Non? Es très nogrmal que tenga negrvios pogr casagrse con una joya así, ¿non?\r\nTrès bien. Se lo explicagré otgra vez.\n@c0@"
  fr: "@a@b*ⓢ Nonⓡ Je comprends que vous soyez un peu nerveux de vous marier à une telle beauté.\nJe vais tout vous réexpliquer.\n@c0@"
  it: "@a@b*: Lo supponevo. Guarda, caro, non è difficile.\nAscoltami attentamente e vedrai che ce la farai.\n㈡\nAh, che pazienza bisogna avere con questi nuovi ricchi...!\n@c0@"
  ja: "@a@b＊「では　もう１度\n\tご説明いたします。\n@c0@"
31:
  de: "@aPriester@bWir sind vor der allmächtigen Göttin zusammengekommen, um den gesegneten Bund zwischen %a000090 und Griselda zu bezeugen.\n@c0@"
  en: "@aPriest@bWe are gathered here in the presence of the Goddess, to witness the blessed union of %a000090 and Debora.\n@c0@"
  es: "@aSacerdote@bEstamos aquí reunidos, en presencia de la Diosa, para asistir a la sagrada unión de %a000090 y Stefania.\n@c0@"
  fr: "@aPrêtre@bNous voici ici rassemblés en présence de la Déesse pour assister à l'union bénie entre %a000090 et Pandora.\n@c0@"
  it: "@aSacerdote@bSiamo oggi qui riuniti alla presenza della dea misericordiosa per celebrare l'unione tra Viola Fosconi e %a000090.\n@c0@"
  ja: "@a@b神父「それでは　本日　これより\n\t神の御名において　%a000090と\n\tデボラの結婚式を　行います。\n@c0@"
32:
  de: "@aPriester@bBitte wendet Euch zum Achterdeck, wo jetzt die Braut erscheinen wird!\n@c0@"
  en: "@aPriest@bAll turn to face the rear of the deck for the entrance of the bride, please!\n@c0@"
  es: "@aSacerdote@b¡Volved la vista a popa, va a entrar la novia!\n@c0@"
  fr: "@aPrêtre@bEt maintenant, veuillez vous retourner vers\nl'arrière du pont pour assister à l'entrée de\nla mariée, je vous prieⓠ\n@c0@"
  it: "@aSacerdote@bChe la sposa faccia il suo ingresso!\n@c0@"
  ja: "@a@b神父「皆さん　甲板後方の　特別室を\n\tご注目ください。　花嫁　デボラの\n\t入場です！\n@c0@"
33:
  de: "@aPriester@bGnadenreiche Göttin. Wir danken dir, dass du diese zwei Seelen an diesem freudevollen Tag hierher geleitet hast.\n@c0@"
  en: "@aPriest@bDear Goddess. Thank you for guiding these two souls to meet here, on this most joyous of days.\n@c0@"
  es: "@aSacerdote@bDiosa mía, gracias por reunir a estas dos almas aquí hoy, el más gozoso de los días.\n@c0@"
  fr: "@aPrêtre@bChère Déesse, nous te remercions d'avoir guidé ces deux êtres jusqu'ici en ce jour béni.\n@c0@"
  it: "@aSacerdote@bDea buona e misericordiosa, guida verso la felicità queste due anime pure che hanno deciso di unirsi in matrimonio!\n@c0@"
  ja: "@a@b神父「おお　神よ。　このよき日\n\tよき場所に　この　花嫁と　花婿が\n\tみちびかれました。\n@c0@"
34:
  de: "@aPriester@bBitte segne sie mit deiner ewigen Liebe und lass sie miteinander glücklich werden..\n@c0@"
  en: "@aPriest@bMay you bless them with your eternal\r\nlove and happiness.\n@c0@"
  es: "@aSacerdote@bBendícelos con tu dicha y amor eternos.\n@c0@"
  fr: "@aPrêtre@bPuisses-tu leur offrir l'amour et le bonheur éternels.\n@c0@"
  it: "@aSacerdote@bBenedicile con la pace, l'amore e l'armonia che solo tu puoi donare a noi, fedeli pecorelle del tuo gregge.\n@c0@"
  ja: "@a@b神父「この　ふたりの　出会いを\n\tどうぞ　祝福してください。\n@c0@"
35:
  de: "@aPriester@bKommen wir nun zu eurem Ehegelübde.\n@c0@"
  en: "@aPriest@bNow we will move on to your vows.\n@c0@"
  es: "@aSacerdote@bAhora pasaremos a los votos.\n@c0@"
  fr: "@aPrêtre@bNous allons procéder à l'échange des consentements.\n@c0@"
  it: "@aSacerdote@bBene, e ora veniamo a voi...\n@c0@"
  ja: "@a@b神父「さあ　それでは\n\tおふたりの　誓いの言葉を。\n@c0@"
36:
  de: "@aPriester@bWillst du, %a000090, Griselda zu deiner Frau nehmen?\n@c0@"
  en: "@aPriest@bDo you, %a000090, take Debora to be your wife?\n@c0@"
  es: "@aSacerdote@b%0%a000090, ¿quieres tomar a Stefania como legítima esposa?\n@c0@"
  fr: "@aPrêtre@b%0%a000090, voulez-vous prendre Pandora pour épouseⓡ\n@c0@"
  it: "@a@bVuoi tu, %a000090, prendere in moglie la qui presente Viola Fosconi?\n@c0@"
  ja: "@a@b神父「なんじ　%a000090は\n\tデボラを　妻とし……\n@c0@"
37:
  de: "@aPriester@bSie lieben und achten, in Krankheit und Gesundheit, so lange ihr beide in der Kirche wieder ins Leben zurückgerufen werdet?\n@c0@"
  en: "@aPriest@bTo love and to cherish, in sickness and in health, for as long as you both shall be resurrected from death in the church?\n@c0@"
  es: "@aSacerdote@b¿La amarás en la salud y en la enfermedad, hasta que ambos dejéis de resucitar en la iglesia?\n@c0@"
  fr: "@aPrêtre@bLui rester fidèle, dans la santé comme dans la maladie, et l'aimer tous les jours de votre vieⓡ\n@c0@"
  it: "@aSacerdote@bPrometti di amarla e rispettarla, nella buona e nella cattiva sorte, in salute e in malattia, finché la dea vi concederà di tornare in vita nella sua chiesa?\n@c0@"
  ja: "@a@b神父「すこやかなる時も\n\t病める時も　その身を\n\t共にすることを　誓いますか？\n@c0@"
38:
