43:
  de: "@aPriester@bNun zeigt vor der Göttin allen Anwesenden, dass ihr für immer miteinander verbunden seid.\n@c0@"
  en: "@aPriest@bSo, in the presence of the Goddess, you will\r\nnow demonstrate to everyone here that your\r\nunion is complete.\n@c0@"
  es: "@aSacerdote@bAhora, en presencia de la Diosa, demostraréis a los presentes que vuestra unión es completa.\n@c0@"
  fr: "@aPrêtre@bAinsi, en présence de la Déesse, vous allez donner la preuve aux personnes présentes que votre union est irrévocable.\n@c0@"
  it: "@aSacerdote@bPossa la dea onnipotente benedire la vostra unione!\nVi dichiaro marito e moglie!\n@c0@"
  ja: "@a@b神父「それでは　神の御前で\n\tふたりが　夫婦となることの\n\t証を　お見せなさい。\n@c0@"
44:
