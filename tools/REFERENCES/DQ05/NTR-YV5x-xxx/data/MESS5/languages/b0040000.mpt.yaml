84:
  de: "@aGriselda@bHab ich nicht gesagt, wir müssen erst zu Papa und ihm sagen, dass wir weggehen?\n@c0@"
  en: "@aDebora@bI said we have to go and tell Papa we're leaving first, didn't I?\n@c0@"
  es: "@aStefania@bHe dicho que primero tenemos que decirle al mio papino que nos marchamos, ¿no?\n@c0@"
  fr: "@aPandora@bJe ne t'ai pas dit qu'on devait d'abord aller annoncer à papa qu'on partaitⓡ\n@c0@"
  it: "@aViola@bTi ho detto che prima di andarcene dobbiamo passare dal mio paparino, no?!\n@c0@"
  ja: "@a@bデボラ「パパに　話してから\n\t出発するって　言ったでしょ。\n@c0@"
85:
  de: "@aGriselda@bWas? Bist du müde? Na, also ich laufe jetzt aber nicht den weiten Weg bis nach Hause! Wir können die Nacht hier verbringen, in Ordnung?\n@c0@"
  en: "@aDebora@bWhat? Are you tired? Well I'm not going all the way home now! We'll spend the night here, alright?\n@c0@"
  es: "@aStefania@b¿Ma, come? ¿Estás cansado? Bueno, io no pienso volverme a casa ahora. Pasaremos la notte aquí.\n@c0@"
  fr: "@aPandora@bQuoiⓡ Tu es fatiguéⓡ Pas question que je retourne jusqu'à la maison maintenantⓠ On va passer la nuit ici, d'accordⓡ\n@c0@"
  it: "@aViola@bChe cosa?! Sei stanco?! Non ho nessuna intenzione di tornare a casa adesso!\nTrascorreremo la notte qui, d'accordo?\n@c0@"
  ja: "@a@bデボラ「なに。　つかれたの？\n\tなら　今日は　\n\tこの別荘で　休む？\n@c0@"
86:
  de: "@aGriselda@bIch bin total fertig. Bis morgen!\n@c0@"
  en: "@aDebora@bI'm shattered. See you in the morning!\n@c0@"
  es: "@aStefania@bTengo sogno. ¡Buona notte!\n@c0@"
  fr: "@aPandora@bJe suis exténuée. À demain matinⓠ\n@c0@"
  it: "@aViola@bSono esausta.\nBuonanotte.\n@c0@"
  ja: "@a@bデボラ「あら　そう。\n\t私　眠いから　先に寝るわ。\n@c0@"
87:
  de: "@aGriselda@bNa los, aufstehen! Es ist hellichter Tag! Wir sollten uns auf den Weg machen!\n@c0@"
  en: "@aDebora@bCome on, rise and shine!\nIt's high time we left.\n@c0@"
  es: "@aStefania@b¡Buongiorno! ¡Arriba!\r\nVa siendo hora de ponerse en marcha.\n@c0@"
  fr: "@aPandora@bAllez, deboutⓠ Le soleil est déjà hautⓠ\nIl est grand temps de partir.\n@c0@"
  it: "@aViola@bForza, caro!\nIn piedi!\nDobbiamo andare!\n@c0@"
  ja: "@a@bデボラ「あら　起きたの？\n\tさ　早く　出発するわよ。\n@c0@"
88:
  de: "@aGriselda@bNa, dann hör auf rumzutrödeln! Wir gehen jetzt!\n@c0@"
  en: "@aDebora@bWell stop messing around, then! We're leaving!\n@c0@"
  es: "@aStefania@bBene, deja de hacer el tonto. ¡Andiamo!\n@c0@"
  fr: "@aPandora@bEh bien arrête de traînasser, alorsⓠ On y vaⓠ\n@c0@"
  it: "@aViola@bAllora smettila di farmi perdere tempo e andiamo!\n@c0@"
  ja: "@a@bデボラ「なら　さっさと\n\t出発しましょうよ。\n@c0@"
89:
  de: "@a@b*: Also, alle Achtung, %a000090! Ich meine, Griselda zu heiraten... Puh!\n@c0@"
  en: "@a@b*: I've got to hand it to you, %a000090. I mean, marrying Debora... Phew!\n@c0@"
  es: "@a@b*: La verdad es que tienes valor, %a000090. Bueno, casarse con Stefania... ¡Uuuf!\n@c0@"
  fr: "@a@b*ⓢ Je dois vous tirer mon chapeau, %a000090. C'est vrai, épouser Pandora... pfiouⓠ\n@c0@"
  it: "@a@b*: E così hai sposato Viola, %a000090! Non avrei mai immaginato che qualcuno potesse essere tanto pazzo da prendere in moglie quella tigre in gonnella...\n@c0@"
  ja: "@a@b＊「%a000090が　デボラさんと\n\t結婚するなんて……。\n@c0@"
90:
  de: "@a@b*: Aber so habe ich immer noch die Chance, mich um Nera zu bemühen! Ha ha! Nimm dich in Acht, Mädel, ich komme!\n@c0@"
  en: "@a@b*: But that still leaves me with a chance of wooing Nera. Ha ha! Look out lady, here I come!\n@c0@"
  es: "@a@b*: Pero eso me da la oportunidad de ir a por Nera. ¡Que se vaya preparando!\n@c0@"
  fr: "@a@b*ⓢ Et ça me laisse encore une chance de passer la bague au doigt de Nera. Ha haⓠ Attention, demoiselle, j'arriveⓠ\n@c0@"
  it: "@a@b*: Questo vuol dire che ho ancora qualche speranza di ottenere la mano della sua bella sorella!\nAspettami, Nera! Sto arrivando!\n@c0@"
  ja: "@a@b＊「でも　これで　フローラさんと\n\t結婚するチャンスが　私にも\n\t残されているって　ことですよね。\n@c0@"
91:
  de: "@aRodrigo Onassetti@bEndlich tauchen sie auf! Ich hatte mir schon Sorgen gemacht, aber nun kann ich ja sehen, dass ihr beiden zusammengehört wie Spaghetti und Bolognese-Sauce!\n@c0@"
  en: "@aRodrigo Briscoletti@bFinally, they make an appearance! I was worried,\r\nbut now that I see you together, I can tell you belong together like spaghetti and Bolognese sauce!\n@c0@"
  es: "@aDon Rimaldi@bFinalmente habéis aparecido. Estaba preoccupato.\n㈡\nMa ahora que os veo juntos, me doy cuenta de que sois tal para cual: como los spaghetti y la salsa bolognese.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEnfin, les voilàⓠ\n㈡\nJe m'inquiétais, mais maintenant que je vous vois ensemble, je peux dire que vous êtes faits l'un pour l'autre, comme les spaghetti et la sauce bologneseⓠ\n@c0@"
  it: "@aRick Fosconi@bAh, eccoli! Prima io ero uno poco appreoccupato, ma ora che vi vedo uno accanto ad altra, io capisce che insieme state bene come cacio su maccheroni!\n@c0@"
  ja: "@a@bルドマン「やっと　おでましかっ。\n\t心配したが　こうして見ると\n\tなかなか似合いの　夫婦だぞ。\n@c0@"
92:
  de: "@aRodrigo Onassetti@bLeider mussten Prinz Harry und seine Frau heute schon früh abreisen.\n@c0@"
  en: "@aRodrigo Briscoletti@bI'm afraid Prince Harry and his wife had to leave early this morning.\n@c0@"
  es: "@aDon Rimaldi@bMe temo que el príncipe Froilán y su esposa tuvieron que partir di buona matina.\n@c0@"
  fr: "@aRodrigo Oscuroni@bMalheureusement, le prince Harry et son épouse ont dû partir tôt ce matin.\n@c0@"
  it: "@aRick Fosconi@bPurtroppo principe Robert e sua mugliera sono dovuti appartire questa mattina presto, yes.\n@c0@"
  ja: "@a@bルドマン「そうそう。　ヘンリーさんたちは\n\t今朝早く　お帰りになったよ。\n@c0@"
93:
  de: "@aRodrigo Onassetti@bAber er hatte ein paar sehr interessante Dinge zu sagen über %O0960%Xdich, weißt du, %a000090%Y%a000090%Z.\n@c0@"
  en: "@aRodrigo Briscoletti@bBut he had some very interesting things to say about %O0960%Xyou, you know, %a000090%Y%a000090, you know%Z.\n@c0@"
  es: "@aDon Rimaldi@bPero, veramente, Froilán me contó muchas cosas interesantes sobre %O0960%Xti%Y%a000090%Z.\n@c0@"
  fr: "@aRodrigo Oscuroni@bMais il avait des choses très intéressantes à raconter sur %O0960%Xtoi, tu sais, %a000090%Y%a000090%Z.\n@c0@"
  it: "@aRick Fosconi@bPerò prima lui mi ha diciuto molte cose very interessanti su %O0960%Xdi te, %a000090%Y%a000090%Z.\n@c0@"
  ja: "@a@bルドマン「で　帰っていく前に\n\t%a000090のことを　いろいろと\n\t聞かせてもらったわけだ。\n@c0@"
94:
  de: "@aRodrigo Onassetti@bIch habe gehört, du suchst nach einem legendären Helden.\n@c0@"
  en: "@aRodrigo Briscoletti@bI hear you're travelling in search of a\r\nlegendary hero.\n@c0@"
  es: "@aDon Rimaldi@bHe oído que viajas buscando a un héroe de leyenda.\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl paraît que %O0960%Xtu es%Yvous êtes%Z à la recherche d'un héros légendaire.\n@c0@"
  it: "@aRick Fosconi@bHo saputo che %O0960%Xtu stai%Ylui sta%Z a ricerca di Eroe Leggendario...\n@c0@"
  ja: "@a@bルドマン「なんでも\n\t伝説の勇者を　さがして\n\t旅をしているとか。\n@c0@"
95:
  de: "@aRodrigo Onassetti@bJa, ich glaube, da habe ich genau das Richtige für dich.\n@c0@"
  en: "@aRodrigo Briscoletti@bWell, I believe I have just the thing for you.\n@c0@"
  es: "@aDon Rimaldi@bBene, creo que puedo ayudarte.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEh bien, je crois que j'ai ce qu'il %O0960%Xte%Yvous%Z faut.\n@c0@"
  it: "@aRick Fosconi@bWell, forse %O0960%Xti%Ylo%Z posso aiutare, yes.\n@c0@"
  ja: "@a@bルドマン「そこでだ！\n\t私からの　祝いを\n\t受けとってくれい！\n@c0@"
96:
  de: "@aRodrigo Onassetti@bIn den zwei Truhen hinter mir findest du ein paar Geschenke für dich.\n@c0@"
  en: "@aRodrigo Briscoletti@bYou'll find some gifts from me in the two chests behind me here. They're both unlocked. The contents are yours.\n@c0@"
  es: "@aDon Rimaldi@bEn los due cofres a la mia espalda encontrarás algunos regalos. Están abiertos. El contenido es para te.\n@c0@"
  fr: "@aRodrigo Oscuroni@b%O0960%XTu trouveras%YVous trouverez%Z quelques bricoles dans les coffres derrière moi. Ils ne sont pas fermés. Tout est pour %O0960%Xtoi%Yvous%Z.\n@c0@"
  it: "@aRick Fosconi@bHo dei regali per %H0860%Xyou. Stanno dentro agli scrigni che si trovano dietro di me. Aprili e apprendi tutto quello che vuoi%Yvoi. Stanno dentro agli scrigni che si trovano dietro di me. Apriteli e apprendete tutto quello che volete%Z.\n@c0@"
  ja: "@a@bルドマン「うしろの　宝箱のカギを\n\tあけておいたから　なかの物を\n\t持ってゆくがいい。\n@c0@"
97:
  de: "@aRodrigo Onassetti@bNun denn, Griselda. Während %a000090 fort ist, will ich...\n@c0@"
  en: "@aRodrigo Briscoletti@bNow then, Debora. While %a000090 is away, Iⓚⓛ\n@c0@"
  es: "@aDon Rimaldi@bBene, Stefania, mientras %a000090 no esté...\n@c0@"
  fr: "@aRodrigo Oscuroni@bBien. À nous, Pandora. Pendant %G0090%Xqu'%Yque %Z%a000090 sera parti, je...\n@c0@"
  it: "@aRick Fosconi@bAscolta, Viola...\nOra che tuo marito %a000090 non c'è, tu dovrai...\n@c0@"
  ja: "@a@bルドマン「それで　デボラ。\n\t%a000090が　旅に出ている間だが……\n@c0@"
98:
  de: "@aGriselda@bJa, deswegen wollte ich auch noch mit dir reden, Papa. Ich habe beschlossen, mit ihm zu gehen.\n@c0@"
  en: "@aDebora@bYes, about that, Papa. I've decided I'm going to go with him.\n@c0@"
  es: "@aStefania@bMa, sobre eso quería hablarte, papino... He decidido ir con él.\n@c0@"
  fr: "@aPandora@bOui, à ce propos, papa...\r\nJ'ai décidé de partir avec lui.\n@c0@"
  it: "@aViola@bProprio di questo volevo parlarti, paparino...\nHo deciso di seguire %a000090 nei suoi viaggi.\n@c0@"
  ja: "@a@bデボラ「そのことなんだけど。\n\tパパ　私　%a000090に\n\tついていくことに決めたから。\n@c0@"
99:
  de: "@aRodrigo Onassetti@bAha... Tja, ich kann nicht sagen, dass mich das überrascht. Ich habe mir schon gedacht, dass du das willst.\n@c0@"
  en: "@aRodrigo Briscoletti@bI see... Well, I can't say that I'm surprised. I had a feeling that would be your preference.\n@c0@"
  es: "@aDon Rimaldi@bYa veo... Bueno, no me sorprende. Me imaginaba que harías algo così.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe vois... Ça ne me surprend pas vraiment, je dois dire. Je me doutais que ça serait ce que tu voudrais.\n@c0@"
  it: "@aRick Fosconi@bUhm, capisco...\nTi acconfesso che mi aspettavo che tu volessi fare così, yes.\n@c0@"
  ja: "@a@bルドマン「そうか…………。\n\tいや　お前のことだから\n\tそう言うのではと　思っていたのだ。\n@c0@"
100:
  de: "@aRodrigo Onassetti@bAber solche Abenteuer wie die, auf die sich %a000090 begibt, sind zu gefährlich für dich. Du wirst bei uns zu Hause bleiben.\n@c0@"
  en: "@aRodrigo Briscoletti@bBut the sort of adventures %a000090 is embarking on are too dangerous for you. You will stay here with us.\n@c0@"
  es: "@aDon Rimaldi@bMa las aventuras en las que se va a meter %a000090 pueden resultar troppo peligrosas per te. Te quedarás aquí con noi.\n@c0@"
  fr: "@aRodrigo Oscuroni@bMais le genre d'aventures dans lesquelles %a000090 se lance sont trop dangereuses pour toi. Tu resteras ici avec nous.\n@c0@"
  it: "@aRick Fosconi@bPerò avventura che %a000090 deve intraprendere è troppo pericolosa per te, yes.\nQuindi, Viola, tu resterai a casa con noi, capisce?\n@c0@"
  ja: "@a@bルドマン「だが　やはり　お前には\n\t旅は危険すぎる。\n\tおとなしく　家でまっていなさい。\n@c0@"
101:
  de: "@aGriselda@bWas?! Also, wenn %a000090 aus lauter Einsamkeit mit einer anderen Frau anbandelt, mache ich dich persönlich dafür verantwortlich, Papa!\n@c0@"
  en: "@aDebora@bWhat!? Well, if %a000090 gets lonely and runs off with another woman, I shall hold you personally responsible, Papa!\n@c0@"
  es: "@aStefania@b¿Ma qué dices? Si %a000090 se siente solo y se va con otra donna, será culpa tuya, papino.\n@c0@"
  fr: "@aPandora@bQuoiⓡⓐ Eh bien si %a000090 finit par se sentir seul et par partir avec une autre femme, je te tiendrai pour personnellement responsable, papaⓠ\n@c0@"
  it: "@aViola@bChe cosa?!\nE se %a000090 si sentisse solo e scappasse con un'altra donna, eh?!\n㈡\nIn quel caso saresti il responsabile del naufragio del nostro matrimonio, paparino caro!\n@c0@"
  ja: "@a@bデボラ「なんでよ　パパ？\n\t%a000090を　ひとりでいかせて\n\tもし逃げられたら　パパのせいよ！\n@c0@"
102:
  de: "@aRodrigo Onassetti@bMamma mia! Wie kannst du deinem treuen Ehemann nur so etwas unterstellen, Griselda! Aber das geht natürlich nicht, da hast du recht.\n@c0@"
  en: "@aRodrigo Briscoletti@bHoly rigatoni! What a thing to say of your faithful husband, Debora! Nevertheless, that wouldn't do at all...\n@c0@"
  es: "@aDon Rimaldi@b¡Per tutti le rigatoni! Cómo dices algo così de il tuo fidelísimo marido, Stefania... Da igual. No puedes...\n@c0@"
  fr: "@aRodrigo Oscuroni@bPar la sainte pastaⓠ En voilà des propos à tenir sur ton fidèle époux, Pandoraⓠ Il n'empêche que ça n'irait pas du tout...\n@c0@"
  it: "@aRick Fosconi@bAh, ma che bella fiducia che arriponi in tuo marito, Viola!\nD'altra parte, non attieni tutti torti...\n@c0@"
  ja: "@a@bルドマン「あわわ。　それは　こまる！\n@c0@"
103:
  de: "@aRodrigo Onassetti@bAh! Ich habe eine Idee!\n@c0@"
  en: "@aRodrigo Briscoletti@bAh-ha! I have an idea!\n@c0@"
  es: "@aDon Rimaldi@b¡Ecco! ¡Tengo una idea!\n@c0@"
  fr: "@aRodrigo Oscuroni@bHa haⓠ J'ai une idéeⓠ\n@c0@"
  it: "@aRick Fosconi@bAh-ha!\nHo avuto grande idea!\n@c0@"
  ja: "@a@bルドマン「よし　わかった！\n\tでは　こうしよう！\n@c0@"
104:
  de: "@aRodrigo Onassetti@bIch besitze einen kleinen Schrein auf einer kleinen Insel westlich von Utensiel. Ich nenne ihn den Tiegeltempel.\n@c0@"
  en: "@aRodrigo Briscoletti@bI own a small shrine on a little island to the west of Stockenbarrel. I call it the Pothold.\n@c0@"
  es: "@aDon Rimaldi@bPoseo una capilla en una piccola isla al oeste de Clavis. La llamo la Tinajera.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe possède un sanctuaire sur une petite île située\r\nà l'ouest de Saint Éloi. Je l'ai appelé la Fosse.\n@c0@"
  it: "@aRick Fosconi@bA ovest di Aprianuam ci sta una piccola isola, e sopra a isola io ho costruito edificio chiamato ⓕTempio del Gabioⓖ.\n@c0@"
  ja: "@a@bルドマン「じつは\n\t山奥の村の　西の小島に\n\t小さな　ほこらが　あるんだが……\n@c0@"
105:
  de: "@aRodrigo Onassetti@bEr enthält einen Tiegel. Ich denke schon eine Weile darüber nach, %a000090 dorthin zu schicken, damit er den Zustand des Tiegels überprüft.\n@c0@"
  en: "@aRodrigo Briscoletti@bIt contains a jar, you see. I've been thinking for some time now that I'd send %a000090 there to check on its condition.\n@c0@"
  es: "@aDon Rimaldi@bDentro hay una tinaja. Llevo un tiempo pensando en enviar a %a000090 a comprobar cómo está.\n@c0@"
  fr: "@aRodrigo Oscuroni@bUne amphore y est conservée. Cela fait un certain temps que je pensais envoyer %a000090 vérifier dans quel état elle est.\n@c0@"
  it: "@aRick Fosconi@bDentro a Tempio del Gabio ci sta un'anfora.\nVoglio chiedere a %a000090 di andare a vedere in che condizioni è quel grosso vaso, yes.\n@c0@"
  ja: "@a@bルドマン「その　ほこらの中に置いてある\n\tツボの様子を　%a000090に\n\t見て来てもらおうと思っていたのだ。\n@c0@"
106:
  de: "@aRodrigo Onassetti@bWenn du diese kleine Aufgabe bewältigen kannst, Griselda, ohne %a000090 im Weg zu stehen, dann lasse ich dir deinen Willen.\n@c0@"
  en: "@aRodrigo Briscoletti@bIf you can manage that little errand without getting under %a000090's feet, Debora, I'll allow you to do as you please.\n@c0@"
  es: "@aDon Rimaldi@bStefania, si logras cumplir con esta commissione sin molestar a %a000090, te dejaré hacer lo que te plazca.\n@c0@"
  fr: "@aRodrigo Oscuroni@bPandora, si tu parviens à l'accompagner dans cette mission sans le gêner, je te laisserai faire ce que tu veux.\n@c0@"
  it: "@aRick Fosconi@bViola, se svolgerai questa commissione insieme a %a000090 senza essergli d'intralcio, allora ti acconsentirò di accompagnarlo in suoi viaggi, yes.\n@c0@"
  ja: "@a@bルドマン「もし　デボラが　%a000090に\n\t迷惑をかけずに　そこまで行けたら\n\t２人で　旅立つのを　許そう。\n@c0@"
107:
  de: "@aRodrigo Onassetti@bNun? Das ist doch ein Angebot, das du nicht abschlagen kannst, no?\n@c0@"
  en: "@aRodrigo Briscoletti@bWell? That's fair, no?\n@c0@"
  es: "@aDon Rimaldi@b¿Y bien? ¿Te parece justo?\n@c0@"
  fr: "@aRodrigo Oscuroni@bAlorsⓡ Ça me paraît honnête, nonⓡ\n@c0@"
  it: "@aRick Fosconi@bMi pare proposta giusta, yes?\nChe dici?\n@c0@"
  ja: "@a@bルドマン「どうだね？　デボラ。\n@c0@"
108:
  de: "@aGriselda@bZeitverschwendung! Wer hier wohl wen aufhalten würde?! Nicht dass ich warten würde, bis sich %a000090 bequemt nachzukommen, wohlgemerkt.\n@c0@"
  en: "@aDebora@bWhat a waste of time! If anyone's going to be slowing anyone down, it'll be %a000090, not me. Not that I intend to wait for him if he does, mind you.\n@c0@"
  es: "@aStefania@b¡Ma qué cosa! Si alguien va a hacer perder el tempo a alguien aquí, será %a000090 a mí y no al revés.\n㈡\nClaro, que no pienso dejarle hacerme perder ni un attimo...\n@c0@"
  fr: "@aPandora@bQuelle perte de tempsⓠ Si quelqu'un risque de ralentir l'autre, ça sera %a000090, pas moi.\n㈡\nEt puis s'il traîne trop, je n'ai pas l'intention de l'attendre, de toute façon.\n@c0@"
  it: "@aViola@bNon mi piace per niente!\nSe c'è qualcuno che rallenterà l'altra, quello sarà proprio %a000090!\n㈡\nE puoi star certo che non mi fermerò ad aspettarlo, quando resterà indietro!\n@c0@"
  ja: "@a@bデボラ「なんだ　そんなことっ？\n\t私が　足手まといになんか\n\tなるわけないじゃん。\n@c0@"
109:
  de: "@aRodrigo Onassetti@bDann ist es also abgemacht? Gut! Griselda, hier ist der Schlüssel zum Schrein.\n@c0@"
  en: "@aRodrigo Briscoletti@bSo it's settled? Good! Here you are then, Debora.\r\nI'll give you the key to the shrine.\n@c0@"
  es: "@aDon Rimaldi@bEntonces, ¿lo haréis?. ¡Benissimo! Ten, Stefania.\r\nEstas son las llaves de la piccola capilla.\n@c0@"
  fr: "@aRodrigo Oscuroni@bAlors, c'est régléⓡ Très bienⓠ Dans ce cas, prends ça, Pandora. Il s'agit de la clef du sanctuaire.\n@c0@"
  it: "@aRick Fosconi@bAllora è deciso, yes?\nVery well!\nEcco, Viola. Prendi chiave di Tempio del Gabio.\n@c0@"
  ja: "@a@bルドマン「よし　決まったな。\n\tデボラには　ほこらのカギを\n\t持たせよう。\n@c0@"
110:
  de: "@aRodrigo Onassetti@bIch zähle auf dich, %a000090. Denk daran, du gehörst jetzt zur Familie!\n@c0@"
  en: "@aRodrigo Briscoletti@bI'm counting on you, %a000090.\nRemember, you're family now!\n@c0@"
  es: "@aDon Rimaldi@bCuento contigo, %a000090.\n¡Recuerda que eres de la famiglia!\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe compte sur toi, %a000090.\nN'oublie pas que tu fais partie de la famille, maintenantⓠ\n@c0@"
  it: "@aRick Fosconi@bConto sopra a te, %a000090.\nArricordati che ora fai parte della Fosconi family!\n@c0@"
  ja: "@a@bルドマン「よろしく　たのむぞ\n\t%a000090。\n@c0@"
111:
  de: "@aRodrigo Onassetti@bIch will nur wissen, welche Farbe der Tiegel hat. Er befindet sich auf einer Insel westlich von Utensiel. Capisce?\n@c0@"
  en: "@aRodrigo Briscoletti@bI just need to know what colour the jar is.\nIt's on an island to the west of Stockenbarrel. Capice?\n@c0@"
  es: "@aDon Rimaldi@bSolo necesito saber de qué color está la tinaja.\r\nSe encuentra en una isla al oeste de Clavis. ¿Capisci?\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe veux juste savoir de quelle couleur est l'amphore.\nElle est sur une île à l'ouest de Saint Éloi. Capitoⓡ\n@c0@"
  it: "@aRick Fosconi@bTutto quello che mi asserve sapere è colore di anfora.\nTempio sta sopra a isola che si trova a ovest di Aprianuam.\nCapisce?\n@c0@"
  ja: "@a@bルドマン「山奥の村の　西の小島の\n\tほこらだ。　その中にある\n\tツボの色を　調べて来てくれ。\n@c0@"
112:
  de: "@aRodrigo Onassetti@bIn den zwei Truhen hinter mir findest du ein paar Geschenke für dich.\n@c0@"
  en: "@aRodrigo Briscoletti@bYou'll find some gifts from me in the two chests behind me here. They're both unlocked. The contents are yours.\n@c0@"
  es: "@aDon Rimaldi@bEn los due cofres a la mia espalda encontrarás algunos regalos. Están abiertos. El contenido es para te.\n@c0@"
  fr: "@aRodrigo Oscuroni@b%O0960%XTu trouveras%YVous trouverez%Z quelques bricoles dans les coffres derrière moi. Ils ne sont pas fermés. Tout est pour %O0960%Xtoi%Yvous%Z.\n@c0@"
  it: "@aRick Fosconi@bHo dei regali per %H0860%Xyou. Stanno dentro agli scrigni che si trovano dietro di me. Aprili e apprendi tutto quello che vuoi%Yvoi. Stanno dentro agli scrigni che si trovano dietro di me. Apriteli e apprendete tutto quello che volete%Z.\n@c0@"
  ja: "@a@bルドマン「うしろの　宝箱のカギを\n\tあけておいたから　なかの物を\n\t持ってゆくがいい。\n@c0@"
113:
  de: "@aGriselda@bWas sollen wir denn an diesem stinkigen alten Ort?\n@c0@"
  en: "@aDebora@bWhat's the point in this stinking old place?\n@c0@"
  es: "@aStefania@b¿Para qué habremos venido a este lugare apestoso?\n@c0@"
  fr: "@aPandora@bJe ne vois pas l'intérêt de ce vieux trou moisi.\n@c0@"
  it: "@aViola@bMa a che servirà mai questa sottospecie di tempio?!\n@c0@"
  ja: "@a@bデボラ「なんなの？\n\tこの　古くさい　ほこらは。\n@c0@"
114:
  de: "@aGriselda@bAch, egal. Wir tun, weswegen wir hergekommen sind, und hauen dann so schnell wie möglich wieder ab, alles klar?\n@c0@"
  en: "@aDebora@bNever mind. We'll just do what we came to do and leave as quickly as possible, got it?\n@c0@"
  es: "@aStefania@bDa igual. Hagamos lo que tenemos que hacer y salgamos presto de aquí, ¿capisci?\n@c0@"
  fr: "@aPandora@bMais peu importe. Contentons-nous de faire ce pour quoi nous sommes venus et repartons aussi vite que possible, comprisⓡ\n@c0@"
  it: "@aViola@bAh, non me ne può importare di meno.\nSbrighiamoci, %a000090. Facciamo quello che ha detto mio padre e andiamocene.\n㈡\nNon voglio restare in questo posto nemmeno un secondo più del necessario.\n@c0@"
  ja: "@a@bデボラ「まあ　さっさと\n\t用を　済ませましょうよ。\n@c0@"
115:
  de: "@a@bGriselda schließt die Tür zum Schrein auf.\n@c0@"
  en: "@a@bDebora unlocks the shrine door.\n@c0@"
  es: "@a@bStefania abre la puerta de la capilla.\n@c0@"
  fr: "@a@bPandora ouvre la porte du sanctuaire.\n@c0@"
  it: "@a@bViola ha aperto la porta del tempio!\n@c0@"
  ja: "@a@bデボラは　扉のカギを　開けた！\n@c0@"
116:
  de: "@a@b%0%a000120 wirft einen Blick in den Topf.\n@c0@"
  en: "@a@b%0%a000120 has a look at the pot.\n@c0@"
  es: "@a@b%0%a000120 mira dentro de la tinaja.\n@c0@"
  fr: "@a@b%0%a000120 jette un coup d'œil dans la jarre.\n@c0@"
  it: "@a@b%0%a000120 guarda all'interno dell'anfora...\n@c0@"
  ja: "@a@b%a000120は　ツボを　のぞきこんだ！\n@c0@"
117:
  de: "@a@bInnen leuchtet ein sanftes, blaues Licht.\n@c0@"
  en: "@a@bIt's glowing with a calm, blue light.\n@c0@"
  es: "@a@bDel interior surge una suave luz azul.\n@c0@"
  fr: "@a@bUne douce lueur bleue s'en échappe.\n@c0@"
  it: "@a@bDentro risplende una tenue luce azzurrina.\n@c0@"
  ja: "@a@bツボは　静かに\n青い光を　たたえている。\n@c0@"
118:
  de: "@aRodrigo Onassetti@bAh! Willkommen daheim! Also ist alles gut gegangen?\n@c0@"
  en: "@aRodrigo Briscoletti@bAh! Welcome back!\nSo it all went well, then?\n@c0@"
  es: "@aDon Rimaldi@b¡Ah! ¡Benvenuti!\r\nEntonces fue bene, ¿no?\n@c0@"
  fr: "@aRodrigo Oscuroni@bAhⓠ Vous revoilàⓠ\nTout s'est bien passé, alorsⓡ\n@c0@"
  it: "@aRick Fosconi@bAh, %H0860%Xsei%Ysiete%Z di ritorno!\nAllora, come sta my bella anfora?\n@c0@"
  ja: "@a@bルドマン「おお！　お帰り！\n\tどうやら　無事に\n\t帰って来たようだな。\n@c0@"
119:
  de: "@aRodrigo Onassetti@bAha. Der Tiegel war blau. Tja, da bin ich ja sehr erleichtert.\n@c0@"
  en: "@aRodrigo Briscoletti@bI see. The jar was blue.\nWell, that's a weight off my mind.\n@c0@"
  es: "@aDon Rimaldi@bYa veo. El vasetto era azul.\r\nMe quito un peso de encima.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe vois. L'amphore était bleue.\r\nEh bien, je suis soulagé.\n@c0@"
  it: "@aRick Fosconi@bArrisplendeva di una bella luce azzurra?\nVery well, meglio così.\n@c0@"
  ja: "@a@bルドマン「そうか\n\tツボの色は　青かったか。\n\tうむ　ひと安心だ。\n@c0@"
120:
  de: "@aRodrigo Onassetti@bNun ja. Aber jetzt genug davon!\n@c0@"
  en: "@aRodrigo Briscoletti@bAnyway. Never mind about that now!\n@c0@"
  es: "@aDon Rimaldi@bVa bene. ¡Olvidemos el asunto!\n@c0@"
  fr: "@aRodrigo Oscuroni@bEnfin, vous n'avez plus à vous en occuper, maintenant.\n@c0@"
  it: "@aRick Fosconi@bUna preoccupazione in meno, yes.\n@c0@"
  ja: "@a@bルドマン「あ　いやいや\n\tなんでもない。\n@c0@"
121:
  de: "@aRodrigo Onassetti@bAlso, %a000090. War meine Tochter dir eine Hilfe?\n@c0@"
  en: "@aRodrigo Briscoletti@bSo, %a000090... Was my daughter able to assist you?\n@c0@"
  es: "@aDon Rimaldi@bEntonces, %a000090, ¿la mia figlia te fue de ayuda?\n@c0@"
  fr: "@aRodrigo Oscuroni@bAlors, %a000090... Ma fille a-t-elle réussi\nà t'aiderⓡ\n@c0@"
  it: "@aRick Fosconi@bAllora, %a000090...\nViola ti è stata d'aiuto, yes?\n@c0@"
  ja: "@a@bルドマン「で　どうだったかね\n\t%a000090？　デボラは\n\t役に　立ったかね？\n@c0@"
122:
  de: "@aRodrigo Onassetti@bWirklich? Du würdest mich doch nicht anlügen, oder?\n@c0@"
  en: "@aRodrigo Briscoletti@bReally? You wouldn't be lying to me now, would you? Telling me prosciutto-pies?\n@c0@"
  es: "@aDon Rimaldi@b¿Veramente? No me estarás mintiendo, ¿eh?\r\nNo me gusta la falsità.\n@c0@"
  fr: "@aRodrigo Oscuroni@bVraimentⓡ Tu ne me mentirais pas, n'est-ce pasⓡ\nTu ne me raconterais pas des insalateⓡ\n@c0@"
  it: "@aRick Fosconi@bReally?\nStai dicendo verità?\nNon devi addire bugie a me, boy!\n@c0@"
  ja: "@a@bルドマン「本当かね？\n\tどうも　信じられんが……。\n@c0@"
123:
  de: "@aGriselda@bAlso wirklich, Papa. %a000090 hat doch schon gesagt, dass ich ihm eine Hilfe war. Was willst du denn noch?\n@c0@"
  en: "@aDebora@bLook, Papa. You heard %a000090. He said I helped him, so what's the problem?\n@c0@"
  es: "@aStefania@bMira, papino. Ya has oído a %a000090. Dice que le he ayudado, ¿capisci?\n@c0@"
  fr: "@aPandora@bÉcoute, papa. Tu as entendu %a000090. Il t'a dit que je l'avais aidé, alors où est le problèmeⓡ\n@c0@"
  it: "@aViola@bPaparino, hai qualche problema d'udito?!\n%0%a000090 ti ha detto che l'ho aiutato, no?!\nDiscorso chiuso!\n@c0@"
  ja: "@a@bデボラ「ちょっと　パパ。\n\t%a000090が　役に立ったって\n\t言ってるんだから　問題ないでしょ？\n@c0@"
124:
  de: "@aGriselda@bWeißt du, du wirst vor lauter Sorgen noch eine Glatze kriegen.\n@c0@"
  en: "@aDebora@bYou know, if you keep on worrying like this all the time, you'll go bald.\n@c0@"
  es: "@aStefania@bVeramente, si te preocupas tanto, te vas a quedar più calvo que una bola de cristal.\n@c0@"
  fr: "@aPandora@bTu sais, si tu continues à te faire du souci comme ça en permanence, tu finiras chauve.\n@c0@"
  it: "@aViola@bSe continui a preoccuparti in questo modo, ti verrà il mal di fegato e ti cadranno tutti i capelli.\nLo sai, vero?\n@c0@"
  ja: "@a@bデボラ「そんなに　よけいな\n\t心配ばかりしてると　ハゲるわよ。\n@c0@"
125:
  de: "@aRodrigo Onassetti@bIch... Ich... Wenn du so was sagst, dann... dann tut das deinem Papa doch auch weh, Griselda.\n@c0@"
  en: "@aRodrigo Briscoletti@bI...I...\nYou have hurt your Papa, Debora.\n@c0@"
  es: "@aDon Rimaldi@b¡...!\r\nHas herido los sentimientos de il tuo papino, Stefania.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe... Je...\nTu as fait de la peine à ton papa, Pandora.\n@c0@"
  it: "@aRick Fosconi@bViola, ma ti pare questo modo di apparlare a tuo padre, yes?!\n@c0@"
  ja: "@a@bルドマン「くっ……。\n\tまったく　お前というやつは\n\tわしの気も　知らずに……。\n@c0@"
126:
  de: "@aRodrigo Onassetti@bNa schön. Dann tu, was du willst. Dieses Gespräch ist finito! Pass nur auf, dass du %a000090 nicht in die Quere kommst!\n@c0@"
  en: "@aRodrigo Briscoletti@bFine! Do as you please. This discussion is finito! Just don't get under %a000090's feet!\n@c0@"
  es: "@aDon Rimaldi@b¡Bene! Haz lo que quieras. Se acabó la discussione. ¡Pero no vayas a estorbar a %a000090!\n@c0@"
  fr: "@aRodrigo Oscuroni@bBon. Eh bien, fais ce que tu veux. Cette discussion est finitaⓠ Mais ne va pas te mettre dans les pattes %G0090%Xd'%Yde %Z%a000090ⓠ\n@c0@"
  it: "@aRick Fosconi@bVuoi andare con %a000090?! Very well!\nVai e addivertiti! Ma cerca di non dargli problemi,capisce?! Questa discussione è finished!\n@c0@"
  ja: "@a@bルドマン「もう　好きにしなさい。\n\tただし　決して　%a000090に\n\tめいわくを　かけるんじゃないぞ。\n@c0@"
127:
  de: "@aGriselda@bWarum sollte ich ihm in die Quere kommen? Dir bin ich doch auch nie in die Quere gekommen!\n@c0@"
  en: "@aDebora@bWhy would I get under his feet? I never got under yours.\n@c0@"
  es: "@aStefania@b¿Per qué iba yo a estorbarle? A ti nunca te he estorbado.\n@c0@"
  fr: "@aPandora@bPourquoi j'irais me mettre dans ses pattesⓡ\nJe ne l'ai jamais fait avec toi.\n@c0@"
  it: "@aViola@bPerché mai dovrei dargli problemi?!\nForse che ne ho creati a te, qualche volta?!\nDirei proprio di no!\n@c0@"
  ja: "@a@bデボラ「なに言ってんのよ。\n\t私が　めいわくなわけないでしょ。\n\tパパったら　わかってないわね。\n@c0@"
128:
  de: "@aRodrigo Onassetti@bDu bist mir nie...?! Ähem! Wir verschwenden nur unsere Zeit. %0%a000090, du musst jetzt gehen, um diesen legendären Helden zu finden, den du suchst.\n@c0@"
  en: "@aRodrigo Briscoletti@bYou neverⓚⓛ!? Ahem!\nWe're wasting time now. %0%a000090, you must leave now to find this legendary hero you seek.\n@c0@"
  es: "@aDon Rimaldi@bQue tú nunca... ¡Ejem!\n㈡\nEstamos perdiendo un tiempo molto valioso. %0%a000090 debes partir en busca de ese héroe legendario que buscas.\n@c0@"
  fr: "@aRodrigo Oscuroni@bTu ne l'as jamais...ⓡⓐ Humⓠ Assez parlé.\n%0%a000090, il est temps que tu partes à la recherche de ce fameux héros légendaire.\n@c0@"
  it: "@aRick Fosconi@bYou non hai mai accreato problemi a me?!\nCosa assentono mie orecchie?!\n㈡\nBasta, stiamo solo sprecando time.\n%0%a000090, vai a trova Eroe Leggendario che tu dici, my boy.\n@c0@"
  ja: "@a@bルドマン「むむ～。　こうなったら\n\t%a000090には　いっこくも早く\n\t勇者を　探し出してもらわんと……。\n@c0@"
129:
  de: "@aRodrigo Onassetti@bAch ja. Eins meiner Schiffe liegt gerade in Bakenmünde vor Anker. Nehmt es nur. Ich habe schließlich noch ein paar davon!\n@c0@"
  en: "@aRodrigo Briscoletti@bOh, yes. One of my ships is in dock at Lodestar Harbour at the moment. Take it! I've got plenty more!\n@c0@"
  es: "@aDon Rimaldi@b¡Oh!, sí. In questo momento uno de mis barcos está anclado en Puerto Polaris. ¡Tomadlo! ¡Tengo muchos más!\n@c0@"
  fr: "@aRodrigo Oscuroni@bAh, j'allais oublierⓢ l'un de mes bateaux est amarré à Port-Lanterne en ce moment. Il est à vous. Ne vous inquiétez pas, j'en ai plein d'autresⓠ\n@c0@"
  it: "@aRick Fosconi@bA sproposito! Mi stavo addimenticando di dirvi che una di mie navi è attraccata a Grandport. %H0860%XSe vuoi, la puoi%YSe volete, la potete%Z apprendere. Tanto io ne ho un sacco!\n@c0@"
  ja: "@a@bルドマン「そうそう。\n\tポートセルミにある　私の船も\n\t自由に　使っていいぞ。\n@c0@"
130:
  de: "@aRodrigo Onassetti@bDieses Schiff ist sozusagen das Tiramisu unter den seetüchtigen Schiffen: Es taugt für jede Reise, auf der du es brauchen könntest. Also nimm es ruhig!\n@c0@"
  en: "@aRodrigo Briscoletti@bIt's to sea-faring vessels what tiramisu is to desserts ⓚⓛ the best there is! Ready for any voyage you care to embark on. So make use of it soon!\n@c0@"
  es: "@aDon Rimaldi@bEs a los barcos lo que el tiramisú a los postres: ¡il migliore! Está listo para cualquier viaggio que inicies. ¡No dudes en usarlo!\n@c0@"
  fr: "@aRodrigo Oscuroni@bPlus qu'un bateau, c'est presque une gondola...\nIl n'y a pas mieuxⓠ Il %O0960%Xt'%Yvous %Zemmènera où %O0960%Xtu veux.\nAlors n'hésite%Yvous voulez.\nAlors n'hésitez%Z pas un instant à l'utiliser.\n@c0@"
  it: "@aRick Fosconi@bÈ nave meravigliosa, very beautiful. %H0860%XYou la puoi usare per andare dove vuoi, e aspetta solo te per salpare%YLa potete usare per andare dove volete, e aspetta solo voi per salpare%Z.\n@c0@"
  ja: "@a@bルドマン「あの船なら　かなりの\n\t長旅にも　たえられるだろうからな。\n\tすぐに　連絡しておこう。\n@c0@"
131:
  de: "@aRodrigo Onassetti@bPasst gut auf euch auf, ja? Tut nichts Verrücktes!\n@c0@"
  en: "@aRodrigo Briscoletti@bTake care, now.\nDon't do anything crazy!\n@c0@"
  es: "@aDon Rimaldi@bTened cuidado.\r\nNo hagáis locuras, ¿eh?\n@c0@"
  fr: "@aRodrigo Oscuroni@bFaites attention à vous.\nEt ne faites pas de bêtisesⓠ\n@c0@"
  it: "@aRick Fosconi@bMi arraccomando!\n%H0860%XFai attenzione e non ficcarti%YFate attenzione e non ficcatevi%Z dentro a pasticci!\n@c0@"
  ja: "@a@bルドマン「よいか　２人とも\n\tじゅうぶん　気をつけて旅を\n\tするんだぞ。\n@c0@"
132:
  de: "@aRodrigo Onassetti@bUnd kommt nach Hause, wenn ihr müde seid. Eure Familie ist immer für euch da.\n@c0@"
  en: "@aRodrigo Briscoletti@bAnd come home if you get tired. Your family's always here for you.\n@c0@"
  es: "@aDon Rimaldi@bY volved si os cansáis. Vuestra famiglia siempre estará aquí.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt revenez à la maison si vous êtes fatigués.\r\nNous serons toujours là pour vous.\n@c0@"
  it: "@aRick Fosconi@bE se %H0860%Xti stanchi, torna qui a riposarti. Questa è e sarà sempre casa tua%Yvi stancate, tornate qui a riposarvi. Questa è e sarà sempre casa vostra%Z.\n@c0@"
  ja: "@a@bルドマン「もし　つかれたら\n\tいつでも　帰って来るようにな。\n@c0@"
133:
  de: "@aRodrigo Onassetti@bSobald die Welt wieder sicher ist, setzen wir uns alle zur Ruhe und machen uns ein schönes Leben, no?\n@c0@"
  en: "@aRodrigo Briscoletti@bOnce the world's safe again, we'll all settle down and make a good life for ourselves here, hm?\n@c0@"
  es: "@aDon Rimaldi@bCuando el mundo esté a salvo, nos estableceremos y disfrutaremos de la dolce vita.\n@c0@"
  fr: "@aRodrigo Oscuroni@bUne fois que le monde sera à nouveau sûr, nous nous installerons tous ici et nous profiterons de la vieⓠ\n@c0@"
  it: "@aRick Fosconi@bQuando cose si saranno messe a posto, potrete attrasferirvi qui e vivremo tutti insieme tranquilli e in santa pace, yes.\n㈡\nNon è certo spazio che ammanca qui!\nAh ah ah!\n@c0@"
  ja: "@a@bルドマン「そして　世界が　本当に\n\t平和になった　その時こそ\n\t家族そろって　一緒に　暮らそう！\n@c0@"
134:
  de: "@aRodrigo Onassetti@bDas überrascht mich nicht! Griselda kann nicht einmal ein Schwert führen, nicht?\n@c0@"
  en: "@aRodrigo Briscoletti@bI'm not surprised! Debora can't even wield a sword, can she?\n@c0@"
  es: "@aDon Rimaldi@b¡No me soprende! Veramente, Stefania no puede blandir una espada...\n@c0@"
  fr: "@aRodrigo Oscuroni@bÇa ne m'étonne pasⓠ Pandora ne sait même pas tenir une épée.\n@c0@"
  it: "@aRick Fosconi@bMe l'aspettavo, yes!\nViola non sa nemmeno come si impugna una spada!\n@c0@"
  ja: "@a@bルドマン「やはり　そうか。\n\tデボラは　剣を　持つことも\n\tできんしな……。\n@c0@"
135:
  de: "@aGriselda@bHe! Jetzt ist es aber gut, Papa!\n@c0@"
  en: "@aDebora@bHey! That's enough, Papa!\n@c0@"
  es: "@aStefania@b¡Eh! ¡Basta, papino!\n@c0@"
  fr: "@aPandora@bHé hoⓠ Ça suffit, papaⓠ\n@c0@"
  it: "@aViola@bEhi, paparino!\nNon ti sembra di esagerare?!\n@c0@"
  ja: "@a@bデボラ「ちょっと　待ってよ　パパ！\n@c0@"
136:
  de: "@aRodrigo Onassetti@bJetzt müsst ihr aber gehen. Die Bolognese macht sich nicht von selbst! Du musst schließlich noch einen legendären Helden finden, %a000090.\n@c0@"
  en: "@aRodrigo Briscoletti@bNow everything's settled, you must get going.\nThe Bolognese won't make itself, eh?\nYou have a legendary hero to find, %a000090.\n@c0@"
  es: "@aDon Rimaldi@bAhora que todo está resuelto debéis iros.\r\nLos caneloni no se hacen solos, ¿eh?\r\nTenéis un héroe legendario que encontrar.\n@c0@"
  fr: "@aRodrigo Oscuroni@bMaintenant que la question est réglée, il faudrait que vous pensiez à partir. La bolognese ne se fait pas toute seule, comme on dit.\n㈡\nTu as un héros légendaire à trouver, %a000090.\n@c0@"
  it: "@aRick Fosconi@bVery well. Allora abbiamo attrovato accordo, yes. Adesso andate. Vi aspetta un viaggio very long...\nNon sarà facile attrovare Eroe Leggendario.\n@c0@"
  ja: "@a@bルドマン「こうなったら　%a000090に\n\tいっこくも早く　勇者を\n\t探し出して　もらわなくてはな。\n@c0@"
137:
  de: "@aRodrigo Onassetti@bAuch wenn es eine Schande ist, dass so frisch Vermählte sich vor so einer schwierigen Reise nicht etwas Zeit für die Flitterwochen nehmen.\n@c0@"
  en: "@aRodrigo Briscoletti@bAlthough it's a shame for a newly-wed couple not to take some time for a little amore before setting off on such a difficult journey.\n@c0@"
  es: "@aDon Rimaldi@bAunque sea una pena que unos recién casados no disfruten del suo amore antes de partir en un viaje tan difícil.\n@c0@"
  fr: "@aRodrigo Oscuroni@bC'est quand même dommage qu'un couple de jeunes mariés ne prenne pas un peu de temps pour sa lune de miel avant de partir pour un voyage difficile.\n@c0@"
  it: "@aRick Fosconi@bE così coppia di freschi sposini se ne va all'avventura...\n@c0@"
  ja: "@a@bルドマン「……とはいえ\n\tせっかくの新婚だ。　長旅に出る前に\n\t少しは　羽をのばすといい。\n@c0@"
138:
  de: "@aRodrigo Onassetti@bKennt Ihr die Insel direkt östlich von Bakenmünde?\n@c0@"
  en: "@aRodrigo Briscoletti@bDo you know the island just east of\r\nLodestar Harbour?\n@c0@"
  es: "@aDon Rimaldi@b¿Conoces la isla que hay al este de Puerto Polaris?\n@c0@"
  fr: "@aRodrigo Oscuroni@bTu connais l'île à l'est de Port-Lanterneⓡ\n@c0@"
  it: "@aRick Fosconi@b%H0860%XConosci%YConoscete%Z isola che sta appena a est di Grandport, yes?\n@c0@"
  ja: "@a@bルドマン「ポートセルミから　船で\n\t東へ向かえば　すぐに\n\t小さな島が見えるだろう。\n@c0@"
139:
  de: "@aRodrigo Onassetti@bDort liegt die Ventuno vor Anker. Mein Kasinoschiff, auf dem ihr getraut wurdet.\n@c0@"
  en: "@aRodrigo Briscoletti@bThat's where the Ventuno is moored.\r\nMy casino ship, where you were married.\n@c0@"
  es: "@aDon Rimaldi@bAllí está anclado el Musini. El mio barco casino, donde os casasteis.\n@c0@"
  fr: "@aRodrigo Oscuroni@bC'est là que le Vingt-et-un est amarré.\r\nC'est le bateau casino sur lequel vous vous êtes mariés.\n@c0@"
  it: "@aRick Fosconi@bLì ci sta Jolly Ace, nave-casinò dove è stato celebrato vostro matrimonio.\n@c0@"
  ja: "@a@bルドマン「そこに　停泊しているのが\n\t結婚式を　あげた　カジノ船だ。\n@c0@"
140:
  de: "@aRodrigo Onassetti@bDiese ganze Feier war so hektisch, dass euch keine Zeit fürs Vergnügen geblieben ist. Warum legt ihr dort nicht einen kurzen Zwischenstopp ein?\n@c0@"
  en: "@aRodrigo Briscoletti@bThat whole extravaganza was so hectic, you didn't have any time to enjoy yourselves.\r\nWhy don't you take a short break there now?\n@c0@"
  es: "@aDon Rimaldi@bFue todo tan presto que no tuvisteis tiempo de divertiros.\r\n¿Por qué no os tomáis allí un riposo?\n@c0@"
  fr: "@aRodrigo Oscuroni@bCette journée a été si mouvementée que vous n'avez sûrement pas dû en profiter beaucoup.\n㈡\nPourquoi vous n'y retourneriez pas pour vous reposer un peu tous les deuxⓡ\n@c0@"
  it: "@aRick Fosconi@bMi è avvenuta una great idea!\nPerché non %H0860%Xapprofitti di questo viaggio per riposarti%Yapprofittate di questo viaggio per riposarvi%Z uno poco di time?\n@c0@"
  ja: "@a@bルドマン「あの時は　忙しくて\n\t遊ぶどころじゃなかったから\n\t今度は　ゆっくりして来なさい。\n@c0@"
141:
  de: "@aRodrigo Onassetti@bNennt dem Mann, der die Fähre zum Schiff betreibt, nur meinen Namen, dann sorgt er dafür, dass euch alles gezeigt wird.\n@c0@"
  en: "@aRodrigo Briscoletti@bJust mention my name to the man who runs the\r\nferry over to the ship, and he'll see that you're shown around.\n@c0@"
  es: "@aDon Rimaldi@bMencionad il mio nombre al uomo que se encarga del barco y os lo enseñará tutto.\n@c0@"
  fr: "@aRodrigo Oscuroni@bDis au capitaine du bateau qui fait la navette jusqu'au Vingt-et-un que tu viens de ma part et il arrangera tout pour vous.\n@c0@"
  it: "@aRick Fosconi@b%H0860%XDici my nome a man che gestisce barca che porta su Jolly Ace, e lui ti addarà%YDite my nome a man che gestisce barca che porta su Jolly Ace, e lui vi addarà%Z wonderful sistemazione.\n@c0@"
  ja: "@a@bルドマン「カジノ船に向かう　ボートの\n\t乗り場で　私の名を出せば　丁重に\n\t案内してくれるだろう。\n@c0@"
142:
  de: "@aRodrigo Onassetti@bWenn ihr von dort weiter nach Süden segelt, kommt ihr zu einem Ort namens Helmunaptra.\n@c0@"
  en: "@aRodrigo Briscoletti@bIf you carry on sailing south from there, you'll come to a place called Helmunaptra.\n@c0@"
  es: "@aDon Rimaldi@bSi desde allí vais al sur, llegaréis al reino de la regina del desierto, Leopatra.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt si tu continues à naviguer vers le sud depuis\r\nlà-bas, tu arriveras à un endroit appelé Helmunaptra.\n@c0@"
  it: "@aRick Fosconi@bE a sud di quel posto ci sta Faraonia, yes.\nBasta navigare verso sud e ci %H0860%Xarrivi%Yarrivate%Z.\n@c0@"
  ja: "@a@bルドマン「それから　ゆっくり　南へ\n\t向かえば　やがて　テルパドール\n\tという国に　着くはず。\n@c0@"
143:
  de: "@aRodrigo Onassetti@bEure Hauptreise könnt ihr von dort aus antreten. Aber denkt daran, gebt gut auf euch acht!\n@c0@"
  en: "@aRodrigo Briscoletti@bYou can start your main journey from there.\nBut remember, be careful!\n@c0@"
  es: "@aDon Rimaldi@bDesde allí podéis empezar el viaje principal.\r\nMa ricordare: ¡tened cuidado!\n@c0@"
  fr: "@aRodrigo Oscuroni@bTu pourras débuter ton grand voyage par là.\nMais je t'en prie, fais bien attentionⓠ\n@c0@"
  it: "@aRick Fosconi@b%H0860%XPuoi iniziare tuo viaggio da lì. Però mi arraccomando! Fai%YPotete iniziare vostro viaggio da lì. Però mi arraccomando! Fate%Z molta attenzione!\n@c0@"
  ja: "@a@bルドマン「そこからは\n\t本格的な旅の　はじまりだ。\n\tくれぐれも　気をつけるんだぞ。\n@c0@"
144:
  de: "@aRomana@bIch bin so froh, einen so wunderbaren Sohn gewonnen zu haben!\n@c0@"
  en: "@aRomana@bI'm so happy to have gained such a wonderful son.\n@c0@"
  es: "@aRomana@bCómo me alegro de haber ganado un hijo así.\n@c0@"
  fr: "@aRomana Oscuroni@bJe suis heureuse d'avoir un gendre si merveilleux. \n@c0@"
  it: "@aRosanna Fosconi@bSono davvero contenta di avere un genero tanto caro.\n@c0@"
  ja: "@a@b＊「%a000090みたいな\n\t立派な　息子ができて\n\t私も　うれしいわ。\n@c0@"
145:
  de: "@aRomana@bUnd du betrachte mich einfach als deine eigene Mutter, ja? Ich werde immer für dich da sein.\n@c0@"
  en: "@aRomana@bYou can think of me as your own mama.\nI'll always be there for you.\n@c0@"
  es: "@aRomana@bConsidérame una madre.\r\nSiempre podrás contar conmigo.\n@c0@"
  fr: "@aRomana Oscuroni@bTu peux me considérer comme ta mamma.\nJe serai toujours là pour toi.\n@c0@"
  it: "@aRosanna Fosconi@bMi piacerebbe che %O0960%Xtu mi considerassi come una madre, %a000090%Y%a000090 mi considerasse come una madre%Z.\n@c0@"
  ja: "@a@b＊「本当の　お母さんだと　思って\n\t甘えていいのよ。\n@c0@"
146:
  de: "@aRomana@bGriselda, und du benimm dich! Sei nett zu %a000090 und nutze seine Gutmütigkeit nicht aus.\n@c0@"
  en: "@aRomana@bDebora, you be nice to %a000090.\nDon't take advantage of his kind personality.\n@c0@"
  es: "@aRomana@bStefania, sé buena con %a000090.\nNo te aproveches de su bondad.\n@c0@"
  fr: "@aRomana Oscuroni@bPandora, sois gentille avec %a000090.\nCe n'est pas parce que c'est un garçon\ngénéreux qu'il faut en profiter.\n@c0@"
  it: "@aRosanna Fosconi@bViola, sii gentile con %a000090.\nNon approfittarti del suo carattere buono e mite.\nCi siamo capite, cara?\n@c0@"
  ja: "@a@b＊「デボラ。　いいこと？\n\t%a000090に　わがままを言っては\n\tいけませんよ？\n@c0@"
147:
  de: "@aGriselda@bNein, Mama.\n@c0@"
  en: "@aDebora@bNo, Mama...\n@c0@"
  es: "@aStefania@bNo, mamma...\n@c0@"
  fr: "@aPandora@bEntendu, mamma...\n@c0@"
  it: "@aViola@bSì, mamma.\nNon preoccuparti.\n@c0@"
  ja: "@a@bデボラ「わかっているわよ　ママ。\n@c0@"
148:
  de: "@aNera@bIch muss zugeben, dass mich die Hochzeit doch ein klein bisschen eifersüchtig gemacht hat. Ihr beide habt so glücklich ausgesehen.\n@c0@"
  en: "@aNera@bI have to confess to being ever so slightly envious at the wedding. You both looked so happy.\n@c0@"
  es: "@aNera@bVeramente, he de decir que sentí un po' de envidia durante la boda. Los dos parecíais tan felices.\n@c0@"
  fr: "@aNera@bJe dois avouer que j'ai été un petit peu jalouse, pendant le mariage. Vous aviez l'air si heureux,\r\ntous les deux.\n@c0@"
  it: "@aNera@bDevo confessare di aver provato un pizzico d'invidia al matrimonio. Sembravate così felici...\nE vi auguro di esserlo sempre.\n@c0@"
  ja: "@a@bフローラ「%a000090さんたちの結婚式\n\t見ていて　本当に幸せそうで\n\tうらやましかったですわ。\n@c0@"
149:
  de: "@aNera@bTja... Dies ist jetzt auch dein Zuhause, %a000090! Hier wirst du immer willkommen sein.\n@c0@"
  en: "@aNera@bWell...this is your house now too, %a000090. You will always be welcome here.\n@c0@"
  es: "@aNera@bVa bene... Ahora esta también es la tua casa, %a000090. Siempre serás benvenuto.\n@c0@"
  fr: "@aNera@bEnfin... Cette maison est aussi la tienne, désormais, %a000090. Tu seras toujours le bienvenu ici.\n@c0@"
  it: "@aNera@bAdesso questa è anche casa tua, %a000090.\nQui sarai sempre il benvenuto.\n@c0@"
  ja: "@a@bフローラ「ここは　%a000090さんの\n\t家でも　あるのですから\n\tいつでも　帰ってきてくださいね。\n@c0@"
150:
  de: "@aNera@bUnd Griselda... Bitte pass auf dich auf.\n@c0@"
  en: "@aNera@bAnd Debora... Please be careful.\n@c0@"
  es: "@aNera@bY Stefania... ¡Ten cuidado, per favore!\n@c0@"
  fr: "@aNera@bEt Pandora, je t'en prie... sois prudente.\n@c0@"
  it: "@aNera@bViola, mi raccomando...\nFate i bravi, e state attenti.\n@c0@"
  ja: "@a@bフローラ「デボラお姉さん。\n\tどうか　気をつけてくださいね。\n@c0@"
151:
  de: "@aGriselda@bWenn du jetzt schon müde bist, kannst du dich hier wohl ein bisschen ausruhen. Und? Willst du?\n@c0@"
  en: "@aDebora@bIf you're tired already, I suppose it'd be okay for you to have a rest here. Well? Do you want to?\n@c0@"
  es: "@aStefania@bSi estás molto cansado, supongo que podemos quedarnos aquí a echar una cabezadita. ¿Y bien? ¿Quieres?\n@c0@"
  fr: "@aPandora@bSi tu es déjà fatigué, tu seras sûrement d'accord pour te reposer ici. Alorsⓡ Ça te tenteⓡ\n@c0@"
  it: "@aViola@bNon mi dirai che sei già stanco?!\nAh, cominciamo bene!\nAllora? Che vuoi fare? Vuoi fermarti?\n@c0@"
  ja: "@a@bデボラ「%a000090。　つかれたのなら\n\t休んでもいいわよ？\n@c0@"
152:
  de: "@aGriselda@bNa schön. Aber das Bett ist viel zu eng für zwei.\nDu kannst auf dem Boden schlafen.\n@c0@"
  en: "@aDebora@bAlright. But the bed's far too narrow for two.\r\nYou can sleep on the floor.\n@c0@"
  es: "@aStefania@bD'accordo. Pero esta cama es tropo estrecha para los dos. Puedes dormir en el suelo, ¿capisci?\n@c0@"
  fr: "@aPandora@bEntendu. Mais le lit est bien trop étroit pour deux.\r\nTu n'as qu'à dormir par terre.\n@c0@"
  it: "@aViola@bD'accordo.\nPerò il letto è troppo stretto per due persone.\nTu dormirai sul pavimento, caro.\n@c0@"
  ja: "@a@bデボラ「あら　そう。\n\tでも　ベッドが狭いから\n\t%a000090は　床で寝てね。\n@c0@"
153:
  de: "@aGriselda@bDu bist wach, oder?\nNa schön, dann lass uns aufbrechen.\n@c0@"
  en: "@aDebora@bYou're awake now, are you?\nRight then, let's get going.\n@c0@"
  es: "@aStefania@b¿Ya estás despierto?\r\nBene, ¡andiamo!\n@c0@"
  fr: "@aPandora@bTu es réveillé, heinⓡ\nParfait. Dans ce cas, allons-y.\n@c0@"
  it: "@aViola@bSei sveglio, vero?\nMolto bene.\nAllora andiamo.\n@c0@"
  ja: "@a@bデボラ「起きたわね。\n\tさあ　出発するわよ。\n@c0@"
154:
  de: "@aGriselda@bWenn du nicht zu müde bist. Nicht, dass du mir unterwegs zusammenklappst.\n㈡\nEs wäre Gift für meine Nägel, wenn ich dich in eine Herberge oder Kirche schleppen müsste.\n@c0@"
  en: "@aDebora@bJust so long as you're not too tired. I don't want you collapsing while we're travelling. I could really damage my nails dragging you to an inn.\n@c0@"
  es: "@aStefania@bD'accordo. Ma espero que no estés troppo cansado. No te vayas a desmayar encima mío mientras viajamos.\n㈡\nSi te tengo que arrastrar hasta una iglesia o una posada, igual me rompo una uña o algo, y eso no es buono, ¿capisci?\n@c0@"
  fr: "@aPandora@bDu moment que tu arrives à tenir debout...\nJe ne voudrais surtout pas que tu t'écroules\nsur moi pendant qu'on marche.\n㈡\nJe risquerais de me casser un ongle en te traînant jusqu'à une auberge ou une église.\n@c0@"
  it: "@aViola@bVa bene, ma cerca di dosare bene le tue forze.\nNon voglio che tu svenga per strada come un pappamolle, mi sono spiegata?!\n㈡\nNon ho la benché minima intenzione di trascinarti in giro come un sacco di patate!\n@c0@"
  ja: "@a@bデボラ「つかれていないなら　いいけど\n\tでも　それで倒れて　私に迷惑が\n\tかかるのは　ごめんだわよ。\n@c0@"
155:
  de: "@aNera@bZzz... Zzz...\n@c0@"
  en: "@aNera@bZzz... Zzz...\n@c0@"
  es: "@aNera@bZzz... Zzz...\n@c0@"
  fr: "@aNera@bZzz... zzz...\n@c0@"
  it: "@aNera@bZzz... Zzz...\n@c0@"
  ja: "@a@bフローラ「すー　すー……。\n@c0@"
156:
  de: "@aGriselda@bAndererseits, je runtergekommener du aussiehst, desto mehr werde ich neben dir strahlen...\n@c0@"
  en: "@aDebora@bMind you, the rougher you look, the more dazzling I'll be!\n@c0@"
  es: "@aStefania@bClaro, que cuanto peor aspecto tengas, più bella pareceré yo...\n@c0@"
  fr: "@aPandora@bRemarque, plus tu auras l'air nigaud, plus on verra à quel point je suis éblouissanteⓠ\n@c0@"
  it: "@aViola@bCerca di assumere un'aria da duro, che sei più carino!\nTogliti quell'espressione da pappamolle!\n@c0@"
  ja: "@a@bデボラ「……でも　あんたが\n\tそのままの方が　かえって\n\t私が　引き立つかもね！\n@c0@"
157:
  de: "@aGriselda@bKümmert Euch um Euren eigenen Kram und seht zu, dass Ihr fertig werdet. Ein bisschen flott, damit diese fromme Salbaderei zum Ende kommt!\n@c0@"
  en: "@aDebora@bJust mind your own business and get on with it. Hurry up and get all your holy babble out of the way!\n@c0@"
  es: "@aStefania@bA ti qué te importa tutti eso, ¿eh? Presto, menos parlare y acaba de una vez...\n@c0@"
  fr: "@aPandora@bOccupez-vous de vos oignons et finissons-en. Dépêchez-vous de terminer votre blabla de bénitier qu'on puisse partirⓠ\n@c0@"
  it: "@aViola@bPerché non pensi un po' agli affari tuoi, eh?!\nAvanti, cerca di sbrigarti, se non vuoi che perda la pazienza!\n@c0@"
  ja: "@a@bデボラ「私のことは　私が決めるわよ。\n\tいいから　先に　すすめてちょうだい！\n@c0@"
158:
  de: "@aHarry@bUnd, äh, ganz unter uns, %a000090... Da hast du dir ja eine wahre Schönheit zur Braut erkoren!\n@c0@"
  en: "@aHarry@bAnd, er...can I just have a word in your ear, %a000090? That is one good-looking bride you've found!\n@c0@"
  es: "@aFroilán@bY esto... ¿Puedo decirte algo en privado, %a000090?\n(Tu futura mujer es un auténtico bombón.)\n@c0@"
  fr: "@aHarry@bEt, euh... Je peux te dire un mot en privé, %a000090ⓡ C'est vraiment une magnifique épouse que tu as làⓠ\n@c0@"
  it: "@aRobert@bEhm... Permetti una parola, %a000090?\nComplimenti!\nTi sei trovato una gran bella mogliettina!\n@c0@"
  ja: "@a@bヘンリー「……（小声で）……\n\tしかし　お前の嫁さん　セクシーだな。\n\tびっくりしたよ……！\n@c0@"
159:
  de: "@aGriselda@bImmerhin hast du uns alle hierhergeflogen. Darum will ich es dir heute noch mal durchgehen lassen.\n@c0@"
  en: "@aDebora@bI suppose you did fly us all here. I'll let you off this time.\n@c0@"
  es: "@aStefania@bComo nos has traído aquí a tutti volando, te voy a dejar en pace por esta vez.\n@c0@"
  fr: "@aPandora@bTu nous as quand même tous transportés jusqu'ici. Je ne vais pas insister pour cette fois.\n@c0@"
  it: "@aViola@bTutto sommato, ci hai fatto volare fin qui, quindi per stavolta lascerò correre.\n@c0@"
  ja: "@a@bデボラ「何人も引きつれて\n\t飛んできたんだから　今回は\n\t大目に見てあげるけど……。\n@c0@"
160:
  de: "@aRodrigo Onassetti@bNein... Aber Griselda dabeizuhaben, würde dich viel zu sehr aufhalten, %a000090. Hmm...\n@c0@"
  en: "@aRodrigo Briscoletti@bNo... But it would slow you down far too much to take Debora with you, %a000090. Hmm...\n@c0@"
  es: "@aDon Rimaldi@bNo... %a000090, Stefania te haría perder el tiempo. Mmm...\n@c0@"
  fr: "@aRodrigo Oscuroni@bNon... Mais cela te ralentirait beaucoup trop d'emmener Pandora avec toi, %a000090. Mmm...\n@c0@"
  it: "@aRick Fosconi@bPerò rallenteresti troppo %a000090 se tu andassi con lui...\nCome possiamo fare, yes...\n@c0@"
  ja: "@a@bルドマン「だが……　デボラが\n\t%a000090の　足手まといになっても\n\t申しわけないし…………。\n@c0@"
