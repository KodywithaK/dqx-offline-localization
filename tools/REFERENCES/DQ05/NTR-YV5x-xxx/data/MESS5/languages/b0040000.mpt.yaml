1:
  de: "@aRodrigo Onassetti@bIch dachte, wir feiern die Hochzeit auf meinem Kasinoschiff, der Ventuno. Es ist weit im Nordosten, aber es wäre die Reise wert.\n@c0@"
  en: "@aRodrigo Briscoletti@bI've decided the wedding will take place on my casino ship, the Ventuno. It's far, farfalle away in the north-east, but it'll be well worth the trip.\n@c0@"
  es: "@aDon Rimaldi@bHe decidido que la boda tenga lugar en el mio barco casino, el Musini. Está a tomar farfalles, al noreste, pero el viaje merece la pena.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJ'ai décidé que le mariage aurait lieu sur mon\r\nbateau casino, le Vingt-et-un. Il est ancré molto\r\nloin au nord-est, mais ça vaut le déplacement.\n@c0@"
  it: "@aRick Fosconi@bHo deciso che matrimonio sarà accelebrato sulla Jolly Ace, my nave-casinò che sta a nord-est.\nÈ uno poco lontano, ma è un posto very bello.\n@c0@"
