42:
  de: "@a@b%0%a000090 und Griselda stecken einander die Ringe an.\n@c0@"
  en: "@a@b%0%a000090 and Debora place their wedding rings on each other's fingers.\n@c0@"
  es: "@a@b%0%a000090 y Stefania se ponen mutuamente el anillo.\n@c0@"
