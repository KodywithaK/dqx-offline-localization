  ja: "@a@bヘンリー「ありがとうな\n\t気を　つかってくれて……。\n@c0@"
218:
  de: "@aHarry@bWir haben hier doch eigentlich gar nichts zu suchen, oder, %a000090? Vielleicht sollten wir uns etwas mehr auf die anstehende Aufgabe konzentrieren.\n@c0@"
