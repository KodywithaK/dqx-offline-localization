  it: "@aRobert@bBianca è la tua amica d'infanzia di cui mi hai parlato, non è vero?\nSpero che stia bene.\n@c0@"
  ja: "@a@bヘンリー「ビアンカって　%a000090が\n\t前に言ってた　幼なじみのことか。\n\t元気でいるといいな。\n@c0@"
212:
  de: "@aHarry@bSelbst wenn der Held tot ist, könnte er doch immer noch ein Enkelkind haben. Wir sollten damit anfangen, zunächst mal die legendäre Ausrüstung zu suchen.\n@c0@"
