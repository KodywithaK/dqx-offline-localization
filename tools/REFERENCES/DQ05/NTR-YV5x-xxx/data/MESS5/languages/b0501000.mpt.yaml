385:
  de: "@aHarry@bDas muss das Buch sein, von dem Wilbur gesprochen hat.\n@c0@"
  en: "@aHarry@bThis must be the book Wilbur was talking about.\n@c0@"
  es: "@aFroilán@bEste debe de ser el libro del que hablaba Leonoro.\n@c0@"
  fr: "@aHarry@bCe doit être le livre dont parlait Will.\n@c0@"
  it: "@aRobert@bQuesto dev'essere il libro di cui parlava Fabian.\n@c0@"
  ja: "@a@bヘンリー「デ―ルが言ってたのは\n\tどうも　この日記のことみたいだな。\n@c0@"
386:
  de: "@aHarry@bEin Spiegel, ⓞder die Wahrheit zeigen kannⓟ... Interessant. Dann sollten wir uns diesen Turm wohl mal ansehen!\n@c0@"
  en: "@aHarry@bA mirror ⓗwith the power to show the truthⓘ... Interesting. We'd better go and have a look at that tower, then!\n@c0@"
  es: "@aFroilán@bUn espejo ⓕcon el poder de mostrar la verdadⓖ... Interesante. ¡Debemos echar un vistazo a esa torre!\n@c0@"
  fr: "@aHarry@bUn miroir ⓥayant le pouvoir de révéler la véritéⓦ... Intéressant. On ferait bien d'aller jeter un œil\nà cette tour, alorsⓠ\n@c0@"
  it: "@aRobert@bⓕUno specchio che ha il potere di mostrare il vero aspetto delle coseⓖ... Interessante. Muoviamoci!\nDobbiamo dare un'occhiata a quella torre!\n@c0@"
  ja: "@a@bヘンリー「真実の姿を\n\tうつしだす鏡か…　なるほど。\n\tよし　その塔へ　行ってみようぜ！\n@c0@"
387:
  de: "@aHarry@bEs ist komisch, sich ein Teleportal irgendwo in der Burg vorzustellen. Ich frage mich, wer das wohl gebaut hat.\n@c0@"
  en: "@aHarry@bIt's funny to think of a teleportal inside the castle somewhere. I wonder who made it.\n@c0@"
  es: "@aFroilán@bEs gracioso pensar que en alguna parte del castillo hay un portal. ¿Quién lo crearía?\n@c0@"
  fr: "@aHarry@bC'est drôle de penser qu'il y a un téléportail\r\nquelque part dans le château. Je me demande\r\nqui l'a construit.\n@c0@"
  it: "@aRobert@bNon sapevo che nel castello ci fosse un portale di trasporto.\nChissà chi l'ha costruito...\n@c0@"
  ja: "@a@bヘンリー「城の中に　旅の扉が\n\tあるなんて　不思議だよな。\n\t誰が　作ったんだろ？\n@c0@"
388:
  de: "@aHarry@bSollten wir mit dem geheimnisvollen Spiegel nicht zu dem Turm da drüben gehen, %a000090?\n@c0@"
  en: "@aHarry@bShouldn't we be heading over to that tower with the mysterious mirror, %a000090?\n@c0@"
  es: "@aFroilán@b¿No deberíamos ir a esa torre del espejo misterioso, %a000090?\n@c0@"
  fr: "@aHarry@bOn ne devrait pas se rendre à la tour où se trouve le mystérieux miroir, %a000090ⓡ\n@c0@"
  it: "@aRobert@bNon dovremmo dirigergi verso la torre dov'è custodito lo specchio misterioso, %a000090?\n@c0@"
  ja: "@a@bヘンリー「なあ　%a000090。\n\t不思議な鏡が　あるっていう塔に\n\t向かうんじゃなかったっけ？\n@c0@"
389:
  de: "@aMaria@bÄhm, es geht mich zwar eigentlich nichts an, aber was tun wir hier eigentlich? Sollten wir nicht eigentlich zum Turm gehen?\n@c0@"
  en: "@aMaria@bErm, it's not really my business, but what are we doing here? Weren't we supposed to be going to the tower?\n@c0@"
  es: "@aMaría@bEstooo, no es asunto mío, ¿pero qué hacemos aquí? ¿No debíamos ir a la torre?\n@c0@"
  fr: "@aMaria@bHum... Ce ne sont pas vraiment mes affaires,\nmais que faisons-nous iciⓡ N'étions-nous pas\ncensés nous rendre à la tourⓡ\n@c0@"
  it: "@aMaria@bScusa se te lo chiedo, ma cosa stiamo facendo qui?\nNon dovevamo andare alla torre?\n@c0@"
  ja: "@a@bマリア「あの……ここは\n\tどこなんでしょう？\n\tたしか　南の塔へ　行くはずでは？\n@c0@"
390:
  de: "@aHarry@bWir werden bei Tage zurückkommen müssen, wenn wir ins Schloss wollen. Jetzt sollten wir uns erst mal ausruhen.\n@c0@"
  en: "@aHarry@bWe'll have to come back during the daytime if we want to get inside the castle. We should rest for now.\n@c0@"
  es: "@aFroilán@bSi queremos entrar en el castillo debemos volver durante el día. Ahora hay que descansar.\n@c0@"
  fr: "@aHarry@bNous allons devoir revenir de jour si nous voulons entrer dans le château. Pour l'instant, nous ferions mieux de nous reposer.\n@c0@"
  it: "@aRobert@bSe vogliamo entrare nel castello, dovremo tornare di giorno.\nOra ci conviene riposare un po'...\n@c0@"
  ja: "@a@bヘンリー「城に　入るには\n\tとにかく　昼間に来ないとな。\n\tとりあえず　今日は　休もうぜ。\n@c0@"
391:
  de: "@aHarry@bHier fühlt man sich nachts ja noch einsamer. Als würde man über einen Friedhof laufen.\n@c0@"
  en: "@aHarry@bThis place feels even more desolate at night.\r\nIt's like walking through a graveyard.\n@c0@"
  es: "@aFroilán@bDe noche este sitio parece aún más desolado.\r\nEs como caminar por un cementerio.\n@c0@"
  fr: "@aHarry@bCet endroit est encore plus lugubre de nuit.\r\nC'est comme si on traversait un cimetière.\n@c0@"
  it: "@aRobert@bQuesto posto di notte è quanto di più desolato si possa immaginare.\r\nSembra di essere in un cimitero...\n@c0@"
  ja: "@a@bヘンリー「夜は　城下町のさびしさが\n\tいっそう　きわだつな。\n\tまるで　墓場にでも　いるみたいだ。\n@c0@"
392:
  de: "@aHarry@bIch werde diesen Saustall ausmisten, das kannst du mir glauben!\n@c0@"
  en: "@aHarry@bI'm going to sort this mess out, you mark my words!\n@c0@"
  es: "@aFroilán@b¡Prometo arreglar esta situación, óyeme lo que te digo!\n@c0@"
  fr: "@aHarry@bJe vais remettre de l'ordre dans ce bazar,\ntu peux me croireⓠ\n@c0@"
  it: "@aRobert@bRiporterò giustizia e serenità a Coburg!\nTi giuro che ce la farò!\n@c0@"
  ja: "@a@bヘンリー「今からでも　このオレが\n\t何とかしてみせるぞ！\n@c0@"
393:
  de: "@aMaria@bSollte es nicht die Aufgabe der Herrscher über ein Königreich sein, das Volk glücklich zu machen? Das habe ich jedenfalls immer geglaubt.\n@c0@"
  en: "@aMaria@bShouldn't the rulers of a kingdom be there to make their people happy? That's what I always thought.\n@c0@"
  es: "@aMaría@b¿Los gobernantes de un reino no están ahí para hacer felices a sus súbditos? O es lo que yo creía.\n@c0@"
  fr: "@aMaria@bLe souverain d'un royaume n'est-il pas là pour rendre son peuple heureuxⓡ C'est ce que j'ai toujours pensé.\n@c0@"
  it: "@aMaria@bHo sempre pensato che il primo dovere di un regnante fosse garantire la felicità ai propri sudditi...\n@c0@"
  ja: "@a@bマリア「国というものは　\n\tそこに暮らす人々を　\n\t幸せにするためにあるはずなのに…。\n@c0@"
394:
  de: "@aHarry@bMir war nicht klar, dass mein Vater versuchte, die Krone an mich zu übergeben, bevor er starb.\n@c0@"
  en: "@aHarry@bI didn't realise that my father was trying to pass the crown on to me before he died.\n@c0@"
  es: "@aFroilán@bNo sabía que mi padre intentaba pasarme la corona antes de morir.\n@c0@"
  fr: "@aHarry@bJe n'avais pas réalisé que mon père essayait de me transmettre la couronne avant de mourir.\n@c0@"
  it: "@aRobert@bNon avevo capito che mio padre voleva che gli succedessi sul trono di Coburg...\n@c0@"
  ja: "@a@bヘンリー「自分の死期をさとって\n\t親父が　オレに　王位を\n\tゆずろうとしてたなんてな……。\n@c0@"
395:
  de: "@aHarry@bIch erinnere mich daran, dass im Schloss damals eine gespannte Stimmung herrschte. Dann war das wohl der Grund.\n@c0@"
  en: "@aHarry@bI do remember there being a strained atmosphere in the castle at the time. I suppose that was why.\n@c0@"
  es: "@aFroilán@bRecuerdo que en esa época el ambiente en el castillo era tenso. Supongo que ese era el motivo.\n@c0@"
  fr: "@aHarry@bJe me souviens que l'ambiance était tendue au château, à l'époque. C'était sans doute pour ça.\n@c0@"
  it: "@aRobert@bAdesso comprendo come mai in quel perdiodo l'atmosfera al castello era tanto tesa!\n㈡\nMio padre voleva che fossi io a vestire la corona del Regno, mentre la sua seconda moglie spingeva per Fabian...\n@c0@"
  ja: "@a@bヘンリー「あの頃　城の中が　何となく\n\t落ちつかない雰囲気だったのは\n\tそういうワケだったのか。\n@c0@"
396:
  de: "@aMaria@bWenn du nur König geworden wärest, Harry. Dann wäre nichts hiervon geschehen.\n@c0@"
  en: "@aMaria@bIf only you'd become king, Harry. Then none of this would have happened.\n@c0@"
  es: "@aMaría@bSi te hubieran coronado, Froilán..., nada de esto habría sucedido.\n@c0@"
  fr: "@aMaria@bSi seulement tu étais devenu roi, Harry.\r\nRien de tout cela ne se serait produit.\n@c0@"
  it: "@aMaria@bRobert, se tu fossi diventato Re di Coburg, oggi la situazione sarebbe ben diversa.\n@c0@"
  ja: "@a@bマリア「ヘンリーさまが　王位に\n\tついていれば　この国は　今のように\n\tならなかったでしょうにね…。\n@c0@"
397:
  de: "@aHarry@bBücher gibt's hier jedenfalls in rauen Mengen. Vielleicht findet er ja, was er sucht.\n@c0@"
  en: "@aHarry@bThere are certainly plenty of books here, so it's quite possible he'll find what he's looking for.\n@c0@"
  es: "@aFroilán@bAquí hay muchísimos libros, así que es probable que encuentre lo que busca.\n@c0@"
  fr: "@aHarry@bIl y a énormément de livres, ici. Il devrait sûrement trouver ce qu'il cherche.\n@c0@"
  it: "@aRobert@bQui di libri ce n'è a bizzeffe!\nProbabilmente, c'è anche quello di cui parla quel tipo...\n@c0@"
  ja: "@a@bヘンリー「たしかに　城には\n\t書物が　たくさんあるから\n\tめずらしいのも　あるだろうけど……\n@c0@"
398:
  de: "@aHarry@bIch frage mich, was für einen seltsamen Gegenstand er meint. Ich habe noch nie von etwas Derartigem gehört.\n@c0@"
  en: "@aHarry@bI wonder what the curiosity he's heard about might be. I never heard of anything like that.\n@c0@"
  es: "@aFroilán@bMe pregunto qué será esa cosa curiosa de la que ha oído hablar. Nunca había oído nada igual.\n@c0@"
  fr: "@aHarry@bJe me demande ce que peut bien être la curiosité dont il a entendu parler. Moi, je n'ai jamais rien entendu de tel.\n@c0@"
  it: "@aRobert@bE poi mi chiedo quali siano i manufatti particolari a cui si riferisce...\n@c0@"
  ja: "@a@bヘンリー「どれが　めずらしいかなんて\n\tオレには　わかんねえな。\n@c0@"
