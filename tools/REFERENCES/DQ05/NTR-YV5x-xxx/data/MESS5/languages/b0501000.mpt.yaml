  es: "@aFroilán@bMmm. Aquí está ese canciller. Aunque no hay por qué hacer el menor caso de esa criatura despreciable.\n@c0@"
  fr: "@aHarry@bMmpf. Il y a ce chancelier. On n'a pas à se préoccuper de cette créature inutile, je suppose, mais quand même.\n@c0@"
  it: "@aRobert@bSolo il Ministro, ci mancava!\nBah! Non m'importa un fico secco di quel dannato buffone!\n@c0@"
  ja: "@a@bヘンリー「今は　大臣なんかいるんだな。\n\tまあ　いいや…　あんな\n\t知らないヤツのことは　ムシだ　ムシ！\n@c0@"
374:
  de: "@aHarry@bEine Geschichte über einen geheimnisvollen Spiegel? Ja, das kommt mir irgendwie bekannt vor. Aber wie soll uns das weiterhelfen?\n@c0@"
  en: "@aHarry@bA story about a mysterious mirror? Yes, I seem to remember something like that. But how does that help us?\n@c0@"
  es: "@aFroilán@b¿Una historia sobre un misterioso espejo? Sí, creo recordar algo parecido. ¿Pero de qué nos sirve?\n@c0@"
  fr: "@aHarry@bUne histoire à propos d'un miroir mystérieuxⓡ\nOui, je crois me souvenir de quelque chose comme ça. Mais en quoi ça nous aideⓡ\n@c0@"
  it: "@aRobert@bUno specchio misterioso...?\nUhm, se non sbaglio avevo sentito parlare di un oggetto del genere...\n㈡\nPerò non capisco come possa esserci utile in questa situazione...\n@c0@"
  ja: "@a@bヘンリー「ふしぎな鏡の伝説…？\n\tそういえば　そんな話　聞いたような。\n\tしかし　その鏡が　どう関係あるんだ？\n@c0@"
375:
  de: "@aHarry@bDas Verlies... Das ist nicht weit von der Stelle, wo ich entführt wurde. Brrr! Schon beim Gedanken daran läuft mir ein Schauer den Rücken hinunter!\n@c0@"
  en: "@aHarry@bThe castle vault... That's not far from the place I was snatched all those years ago. Brrr! The thought of it sends shivers down my spine!\n@c0@"
  es: "@aFroilán@bLa cámara del tesoro... No está lejos del sitio donde me raptaron hace tantos años. Brrr... ¡Solo de pensarlo me dan escalofríos!\n@c0@"
  fr: "@aHarry@bLa chambre forte du château... Elle n'est pas très\nloin de l'endroit où j'ai été enlevé il y a toutes\nces années.\n㈡\nBrrrⓠ Rien que d'y penser, ça me donne la chair de pouleⓠ\n@c0@"
  it: "@aRobert@bLa sala del tesoro non è lontana dal punto dove fui rapito tanti anni fa. Maledizione! Ripensare a quei momenti mi fa ribollire il sangue nelle vene!\n@c0@"
  ja: "@a@bヘンリー「城の倉庫か……。\n\tオレが昔さらわれた場所の　近くだな。\n\tうう…　思い出したくないぜ。\n@c0@"
376:
  de: "@aHarry@bIch habe noch nie etwas so Lächerliches gehört. Kannst du dir vorstellen, wie es wäre, wenn ein selbstsüchtiger Kerl wie ich König würde?\n@c0@"
  en: "@aHarry@bI've never heard anything so ridiculous. Can you imagine what it would be like if a selfish man like me were king?\n@c0@"
  es: "@aFroilán@bNunca había oído nada tan ridículo. ¿Puedes imaginar cómo sería que un egoísta como yo fuera coronado rey?\n@c0@"
  fr: "@aHarry@bJe n'ai jamais rien entendu d'aussi ridicule.\nTu imagines ce que ça donnerait si quelqu'un\nd'aussi égoïste que moi était roiⓡ\n@c0@"
  it: "@aRobert@bNon dire sciocchezze, Fabian. Io sono solo un ragazzino viziato e capriccioso... Riesci a immaginare i guai che combinerei se salissi sul trono di Coburg?!\n@c0@"
  ja: "@a@bヘンリー「なに言ってやがるんだか。\n\tオレみたいな　ワガママな男に\n\t国王なんて　つとまるもんかよ。\n@c0@"
377:
  de: "@aHarry@bWenn hier jemand zum König geboren ist, dann du, %a000090. Aber lass dir das nicht zu Kopf steigen, ja?\n@c0@"
  en: "@aHarry@bIf anyone around here is cut out for the monarchy, I'd say it's you, %a000090. Don't let that go to your head though, eh.\n@c0@"
  es: "@aFroilán@bSi alguien aquí tiene madera de monarca eres tú, %a000090. Pero que no se te suba a la cabeza, ¿eh?\n@c0@"
  fr: "@aHarry@bS'il y a bien quelqu'un parmi nous qui est taillé pour régner, c'est toi, %a000090. Mais que ça ne te monte pas à la tête, hein.\n@c0@"
  it: "@aRobert@bSe c'è qualcuno tanto equilibrato e saggio da poter portare una corona, quello sei tu, %a000090. Ehi, amico! Ora non montarti la testa, eh?! Ah ah ah!\n@c0@"
  ja: "@a@bヘンリー「本当に　王さま向きなのは\n\t%a000090みたいなヤツかもな。\n\t……なんて　ほめすぎか？\n@c0@"
378:
  de: "@aMaria@bEr hat recht, Harry. Du bist wirklich tapfer.\n@c0@"
  en: "@aMaria@bHe's right, Harry. You really are brave.\n@c0@"
  es: "@aMaría@bTiene razón, Froilán. Tú eres valiente.\n@c0@"
  fr: "@aMaria@bIl a raison, Harry. Tu es vraiment courageux.\n@c0@"
  it: "@aMaria@bHa ragione, Robert.\nSei davvero coraggioso.\n@c0@"
  ja: "@a@bマリア「ヘンリーさまは　本当に\n\t行動力のある方ですよね。\n@c0@"
379:
  de: "@aMaria@bIch werde nie vergessen, wie du dich der Wache entgegengestellt hast, obwohl der Mann eine Peitsche in der Hand hielt. Du warst unglaublich!\n@c0@"
  en: "@aMaria@bI'll never forget that day you stood up to the guard even though he had a whip in his hand. You were incredible.\n@c0@"
  es: "@aMaría@bNunca olvidaré el día que te enfrentaste al guardia, que estaba armado con un látigo. Estuviste increíble.\n@c0@"
  fr: "@aMaria@bJe n'oublierai jamais le jour où tu as tenu tête au garde, alors qu'il tenait un fouet.\r\nTu as été incroyable.\n@c0@"
  it: "@aMaria@bNon dimenticherò mai il giorno in cui affrontasti quella guardia, nonostante avesse con sé una frusta. Fosti fantastico...\n@c0@"
  ja: "@a@bマリア「あの日　看守のムチから\n\t真っ先に　守ってくださったこと…\n\t私　一生　忘れません。\n@c0@"
380:
  de: "@aHarry@bWas für eine lästige kleine Zecke. Kein Wunder, dass Wilbur bei einem solchen Kanzler keine zündenden Ideen kommen.\n@c0@"
  en: "@aHarry@bWhat a tiresome little man. I don't blame Wilbur for feeling so uninspired with a man like that as chancellor.\n@c0@"
  es: "@aFroilán@b¡Qué hombrecillo más fastidioso! Con un canciller así no me extraña que Leonoro no se sintiera inspirado.\n@c0@"
  fr: "@aHarry@bQuel petit homme fatigant. Je ne peux pas reprocher à Will d'être si peu inspiré avec un type pareil comme chancelier.\n@c0@"
  it: "@aRobert@bChe essere odioso!\nCome farà Fabian a sopportarlo, eh?!\nMah!\n@c0@"
  ja: "@a@bヘンリー「なんだか　イヤミな奴だな。\n\tあんなのが大臣じゃ　デ―ルが\n\tやる気なくすのも　無理ないぜ。\n@c0@"
381:
  de: "@aHarry@bVerflixt! Ich hatte gehofft, wir würden die falsche Witwe ein für alle Mal demaskieren!\n@c0@"
  en: "@aHarry@bCurses! I was hoping we'd be able to expose that fake dowager once and for all!\n@c0@"
  es: "@aFroilán@b¡Maldición! ¡Esperaba poder desenmascarar de una vez para siempre a la falsa Reina Madre!\n@c0@"
  fr: "@aHarry@bMalédictionⓠ Et moi qui espérais qu'on pourrait démasquer la fausse douairière une bonne\nfois pour toutesⓠ\n@c0@"
  it: "@aRobert@bDannazione! Speravo di poter smascherare subito la falsa Regina Madre!\r\nNon importa. La resa dei conti è solo rimandata.\n@c0@"
  ja: "@a@bヘンリー「ちぇっ！　ニセ太后に会って\n\t真実を明らかにしてやろうと\n\t思ったのに……。\n@c0@"
382:
  de: "@aHarry@bAber es wird nicht reichen, ihr von Angesicht zu Angesicht gegenüberzustehen. Wir müssen es irgendwie beweisen.\n@c0@"
  en: "@aHarry@bBut meeting with her alone isn't enough.\nWe need some way of proving it.\n@c0@"
  es: "@aFroilán@bPero no basta una reunión a solas con ella.\r\nNecesitamos un modo de probarlo.\n@c0@"
  fr: "@aHarry@bMais la rencontrer seule n'est pas suffisant.\r\nNous devons trouver un moyen de prouver\r\nson imposture.\n@c0@"
  it: "@aRobert@bPerò incontrarla non basterà a mandare a monte il suo piano... Dobbiamo trovare il modo di provare la sua vera identità!\n@c0@"
  ja: "@a@bヘンリー「でも　会えたところで\n\tニセモノって　証明できなくちゃ\n\tどうしようもねえか。\n@c0@"
