  it: "@aRobert@bLa mia matrigna credeva ciecamente nei chiaroveggenti, e la cosa mi lasciava alquanto perplesso.\n@c0@"
  ja: "@a@bヘンリー「オレの　義理のオフクロが\n\t異常に　占いを信じててさ。\n\tちょっと　こわかったな。\n@c0@"
110:
  de: "@aHarry@bDarum höre ich mir solchen Unsinn nie an, weißt du.\n@c0@"
  en: "@aHarry@bSo that's why I never listen to all that rubbish,\r\nyou see.\n@c0@"
  es: "@aFroilán@bPor eso nunca hago caso a esas chorradas.\n@c0@"
  fr: "@aHarry@bC'est pour ça que je n'écoute jamais toutes\r\nces bêtises.\n@c0@"
  it: "@aRobert@bPer me, la lettura del futuro è una solenne sciocchezza!\n@c0@"
  ja: "@a@bヘンリー「だから　オレは\n\t占いって聞くと　どうもな……。\n@c0@"
111:
  de: "@aHarry@bWenn wir diesen selbstzufriedenen Schnösel aus dem Weg räumen würden, könnten wir uns also zwanzig Minimedaillen verdienen?\n@c0@"
  en: "@aHarry@bSo if we did away with the smug brat, we'd acquire twenty mini medals, then?\n@c0@"
  es: "@aFroilán@bAsí que si nos libramos de ese mocoso presumido, logramos veinte minimedallas, ¿no?\n@c0@"
  fr: "@aHarry@bAlors si on réglait son compte à ce sale prétentieux, on pourrait récupérer vingt mini médailles, c'est çaⓡ\n@c0@"
  it: "@aRobert@bSe ci sbarazzassimo di quel tipo ci metteremmo in tasca venti minimedaglie, eh?\nSarebbe un bel colpo!\n@c0@"
  ja: "@a@bヘンリー「今　あの商人をおそえば\n\tちいさなメダルが　２０枚\n\t手に　入るんだな……。\n@c0@"
112:
  de: "@aHarry@bWar doch nur ein Witz! Aber erzähl mir nicht, der Gedanke wäre dir nicht auch durch den Kopf geschossen!\n@c0@"
  en: "@aHarry@bI'm only joking! But don't tell me the thought didn't cross your mind too.\n@c0@"
  es: "@aFroilán@b¡Era broma! Pero no me digas que no se te ha pasado por la cabeza.\n@c0@"
  fr: "@aHarry@bOh, ça vaⓠ C'était pour rireⓠ Mais ne me dis pas que l'idée ne t'a pas effleuré, toi aussi.\n@c0@"
  it: "@aRobert@bAndiamo, stavo solo scherzando!\nSai bene che non farei mai una cosa simile!\nDico davvero!\n@c0@"
  ja: "@a@bヘンリー「じ　冗談だよ。\n\tでも　お前も　ちょこっとくらいは\n\t同じこと　考えただろ？\n@c0@"
113:
  de: "@aHarry@bMit dem ist bestimmt nicht gut Kirschen essen. Am besten stören wir seine Angetraute nicht bei ihrem wohlverdienten Bad!\n@c0@"
  en: "@aHarry@bHe seems like a bit of a bruiser, but he's just a softie at heart, worrying about his wife like that.\n@c0@"
  es: "@aFroilán@bParece un matón, no me gustaría estar en le pellejo de quien haya sido...\n@c0@"
  fr: "@aHarry@bIl n'a pas l'air commode comme ça, heinⓡ Mais vu comme il prend soin de sa femme, je suis sûr que\nc'est une brute au cœur tendre.\n@c0@"
  it: "@aRobert@bQuel tipo è grosso e cattivo.\nAnzi, MOLTO grosso e MOLTO cattivo! Se ci beccasse a dare una sbirciatina, ci farebbe a pezzettini!\n@c0@"
  ja: "@a@bヘンリー「あの戦士　こわそうだな。\n\tのぞくなら　うまくやらないと\n\t本気で　斬られそうだぞ。\n@c0@"
114:
  de: "@aHarry@bEr hat recht. Es geht doch nichts über ein schönes heißes Bad nach so einem harten Arbeitstag!\n@c0@"
  en: "@aHarry@bHe's right. There's nothing like a hot bath after a hard day's work.\n@c0@"
  es: "@aFroilán@b¡Yo nunca me haría pis en el baño! ¡Jamás!\nAunque no puedo hablar por %a000090.\nA saber qué haría él.\n@c0@"
  fr: "@aHarry@bIl a raison. Rien de tel qu'un bon bain après une dure journée de travail.\n@c0@"
  it: "@aRobert@bNon spierei mai una donna che fa il bagno! Mai!\nSono un gentiluomo, io. Purtroppo, non posso dire la stessa cosa di %a000090... Eh eh eh!\n@c0@"
  ja: "@a@bヘンリー「オレは　絶対やらないが\n\t%a000090は　やっちゃうかも\n\t知れないなあ。\n@c0@"
115:
  de: "@aHarry@bHui, die hat mich fast zu Tode erschreckt mit ihrem Gekreische! Äh, ich meine, es war ganz schön laut... Natürlich bin ich nicht erschrocken...\n@c0@"
  en: "@aHarry@bShe scared the life out of me, screaming like that! I mean, er... It was um...very loud. I wasn't scared. Ha!\n@c0@"
  es: "@aFroilán@bVaya griterío, ¿eh?\n@c0@"
  fr: "@aHarry@bElle m'a fait une peur bleue, à crier comme çaⓠ\nEnfin... je veux dire... elle a crié fort, quand même.\nÇa ne m'a pas fait peur, mais j'ai été surpris, quoi...\n@c0@"
  it: "@aRobert@bComplimenti per la recita, eh?\nQuella donna ha un futuro come attrice drammatica...\n@c0@"
  ja: "@a@bヘンリー「わざわざ　悲鳴上げるなんて\n\tノリのいい　オネ―サンだったな。\n@c0@"
116:
  de: "@aMaria@b...\n@c0@"
  en: "@aMaria@b............\n@c0@"
  es: "@aMaría@b...\n@c0@"
  fr: "@aMaria@b............\n@c0@"
  it: "@aMaria@b...\n@c0@"
  ja: "@a@bマリア「……………。\n@c0@"
117:
  de: "@aHarry@bIch glaube, sie sorgt sich zu Recht. Jetzt treiben sich zwischen den Städten viel mehr Monster herum, und sie scheinen auch viel stärker zu sein als früher.\n@c0@"
  en: "@aHarry@bShe's right to be worried, I think. There are more monsters about between towns these days, and they seem a lot stronger now too.\n@c0@"
  es: "@aFroilán@bCreo que tiene motivos para preocuparse. Ahora hay más monstruos entre las ciudades y además parecen mucho más fuertes.\n@c0@"
  fr: "@aHarry@bElle a raison de s'inquiéter, à mon avis. Il y a plus de monstres à l'extérieur des villes, en ce moment,\r\net ils ont l'air d'être beaucoup plus forts.\n@c0@"
  it: "@aRobert@bTemo che abbia ragione a essere preoccupata.\nDi questi tempi, fuori dalle città si aggirano molti mostri aggressivi...\n@c0@"
  ja: "@a@bヘンリー「そういえば　外の魔物の数が\n\t昔より　ずっと　増えてるし\n\t強くなってるような気がするな。\n@c0@"
118:
  de: "@aMaria@bDas ist schrecklich. Wir sollten nicht in einer Welt leben müssen, in der die Kinder beim Spielen nicht mehr sicher sind.\n@c0@"
  en: "@aMaria@bIt's awful. We shouldn't have to live in a world where children can't even play safely.\n@c0@"
  es: "@aMaría@bQué horror. No es normal un mundo en el que los niños no pueden jugar con tranquilidad.\n@c0@"
  fr: "@aMaria@bC'est horrible. On ne devrait pas avoir à vivre\r\ndans un monde où les enfants ne peuvent pas\r\njouer en paix.\n@c0@"
  it: "@aMaria@bÈ orrribile vivere in un mondo dove i bambini non sono nemmeno liberi di giocare in tutta tranquillità...\n@c0@"
  ja: "@a@bマリア「本当に…　子供たちが\n\t安心して　あそべる世の中に\n\tなるといいんですけど……。\n@c0@"
119:
  de: "@aHarry@bWas lächelst du denn so?\nSie hat doch mich gemeint.\n@c0@"
  en: "@aHarry@bWhat are you smiling about?\nShe was talking to me, you know.\n@c0@"
  es: "@aFroilán@b¿Por qué sonríes?\r\nEstaba hablando conmigo, ¿eh?\n@c0@"
  fr: "@aHarry@bQu'est-ce qui te fait sourireⓡ\nC'est à moi qu'elle parlait, ne rêve pas.\n@c0@"
  it: "@aRobert@bTogliti quel sorrisino ebete dalla faccia, caro!\nStava parlando con me, non con te!\n@c0@"
  ja: "@a@bヘンリー「なんだよ　ニヤニヤして。\n\tさっきの　おねえさんは\n\tきっと　オレに言ったんだぞ。\n@c0@"
120:
  de: "@aHarry@bTja, wo er recht hat, hat er recht, nicht?\n@c0@"
  en: "@aHarry@bHe's not far wrong there, is he?\n@c0@"
  es: "@aFroilán@bNo anda muy desencaminado.\n@c0@"
  fr: "@aHarry@bIl n'a pas tout à fait tort, heinⓡ\n@c0@"
  it: "@aRobert@bDopo aver mangiato per dieci anni l'orribile sbobba che ci davano quando eravamo schiavi, qualsiasi cosa commestibile mi sembra un piatto da re!\n@c0@"
  ja: "@a@bヘンリー「……オレたちって\n\tかわいそうか？\n@c0@"
121:
  de: "@aHarry@bAber nicht wir sollten ihm leid tun. Was ist mit all den armen Sklaven, die immer noch am Schrein schuften müssen?\n@c0@"
  en: "@aHarry@bBut it's not us he should be feeling sorry for. What about all the poor slaves still being made to work at the shrine?\n@c0@"
  es: "@aFroilán@bPero no es a nosotros a los que debe compadecer. ¿Qué hay de todos esos esclavos que aún están trabajando en el santuario?\n@c0@"
  fr: "@aHarry@bMais ce n'est pas pour nous qu'il devrait être désolé. Que dire de tous les pauvres esclaves qui sont forcés de travailler au sanctuaireⓡ\n@c0@"
  it: "@aRobert@bOra noi siamo liberi, ma a volte penso a quei poveri sfortunati che lavorano ancora in quell'inferno...\n@c0@"
  ja: "@a@bヘンリー「でも　まだ　神殿で\n\t働かされている人たちのほうが……。\n@c0@"
122:
  de: "@aMaria@bIch glaube, alles Essen ist köstlich, egal, was es ist.\n@c0@"
  en: "@aMaria@bI think all food's delicious, no matter what it is.\n@c0@"
  es: "@aMaría@bA mí toda la comida me parece deliciosa.\n@c0@"
  fr: "@aMaria@bJe trouve que tout ce que l'on mange est délicieux, peu importe ce que c'est.\n@c0@"
  it: "@aMaria@bBisogna avere sempre rispetto per il cibo, di qualunque cosa si tratti.\n@c0@"
  ja: "@a@bマリア「お料理は　どんなものでも\n\tおいしいですわ。\n@c0@"
123:
  de: "@aMaria@bMan schmeckt die liebevolle Hinwendung derer, die das Getreide gesät oder das Vieh gezüchtet haben, und die des Kochs, der das alles zubereitet hat.\n@c0@"
  en: "@aMaria@bYou can taste the loving care of whoever grew the crops or reared the livestock, and of the chef who prepared it all too.\n@c0@"
  es: "@aMaría@bPuedes saborear el amor de quien cultivó o crió los ingredientes, y el del cocinero que los preparó.\n@c0@"
  fr: "@aMaria@bOn peut y sentir l'amour et l'attention de ceux qui\r\nont fait pousser les récoltes ou élevé le bétail\r\net du cuisinier qui les a ensuite préparés.\n@c0@"
  it: "@aMaria@bFrutta, verdura, carne, pesce... Ogni alimento è prodotto, direttamente o indirettamente, dalla terra o dal mare che la nostra buona dea ha creato.\n@c0@"
  ja: "@a@bマリア「食材を育てた方と\n\t料理してくださった方の\n\t気持ちが　こもっていますから。\n@c0@"
124:
  de: "@aHarry@bEs klingt, als würde er sich wirklich nicht trauen, sich mit seiner Frau zu streiten, nicht?\n@c0@"
  en: "@aHarry@bIt sounds like he really doesn't dare argue with his wife about it, doesn't it?\n@c0@"
  es: "@aFroilán@bParece que no se atreve a discutir el asunto con su esposa.\n@c0@"
  fr: "@aHarry@bOn dirait qu'il n'a guère envie de se disputer avec sa femme à ce propos.\n@c0@"
  it: "@aRobert@bQuel tipo non troverà mai il coraggio di parlare alla moglie del suo progetto...\nPoveraccio.\n@c0@"
  ja: "@a@bヘンリー「あのおっさん\n\t奥さんに　てんで\n\tアタマが上がらないんだな。\n@c0@"
125:
  de: "@aHarry@bDas würde ich mir nicht gefallen lassen. Ich hoffe, bei mir läuft das anders, wenn ich mal heirate.\n@c0@"
  en: "@aHarry@bI couldn't stand that. I just hope I don't end up like that if I get married one day.\n@c0@"
  es: "@aFroilán@bYo no lo soportaría. Si algún día me caso, espero no terminar así.\n@c0@"
  fr: "@aHarry@bJe ne supporterais pas ça. J'espère que je ne finirai jamais comme ça, si un jour je me marie.\n@c0@"
  it: "@aRobert@bSanta dea!\nSpero proprio di non fare la sua fine, se un giorno dovessi sposarmi!\n@c0@"
  ja: "@a@bヘンリー「あ～　いやだ　いやだ。\n\tオレは　将来　結婚しても\n\tあんな風には　なりたくないよ。\n@c0@"
126:
  de: "@aMaria@bEr sollte sich klarmachen, dass sich seine Frau nur Sorgen um ihn macht, weil sie ihn liebt.\n@c0@"
  en: "@aMaria@bHe should realise that his wife's just worried about him because she loves him.\n@c0@"
  es: "@aMaría@bDebería comprender que su mujer se preocupa porque le quiere.\n@c0@"
  fr: "@aMaria@bIl devrait comprendre que si son épouse s'inquiète pour lui, c'est parce qu'elle l'aime.\n@c0@"
  it: "@aMaria@bDovrebbe rendersi conto che sua moglie è preoccupata per lui perché lo ama...\n@c0@"
  ja: "@a@bマリア「あの方　早く\n\t奥さまに　愛されていることに\n\t気づくといいですね。\n@c0@"
127:
  de: "@aMaria@bEs ist doch nur natürlich, dass man sich um die, die man liebt, sorgt.\n@c0@"
  en: "@aMaria@bIt's only natural to worry about the people you love.\n@c0@"
  es: "@aMaría@bEs normal preocuparse por la gente a la que amas.\n@c0@"
  fr: "@aMaria@bC'est bien naturel de se faire du souci pour les gens qu'on aime.\n@c0@"
  it: "@aMaria@bÈ naturale preoccuparsi delle persone a cui si tiene, non credi?\n@c0@"
  ja: "@a@bマリア「大切だから　心配だから…\n\tそうおっしゃっているんでしょうに…。\n@c0@"
128:
  de: "@aHarry@bDas ist sicher richtig. Aber ich weiß nicht mal mehr, wie meine Mutter ausgesehen hat. Als sie gestorben ist, war ich noch so klein.\n@c0@"
  en: "@aHarry@bI'm sure it is. But I don't even remember what my mother looked like. She died when I was so young.\n@c0@"
  es: "@aFroilán@bSeguro que sí. Pero no recuerdo cómo era mi madre. Murió cuando yo era muy joven.\n@c0@"
  fr: "@aHarry@bC'est sans doute vrai. Mais je ne me rappelle même pas à quoi ressemblait ma mère. J'étais si jeune quand elle est morte.\n@c0@"
  it: "@aRobert@bSì, dev'essere bello avere la propria famiglia intorno a sé... Purtroppo non ho avuto questa fortuna, perché mia madre morì che ero ancora piccolo...\n@c0@"
  ja: "@a@bヘンリー「家族か……\n\tオレのオフクロは　小さいころ\n\t死んじまって　顔も覚えてないし…\n@c0@"
129:
  de: "@aHarry@bUnd mein Vater war so beschäftigt, dass er gar keine Zeit für mich hatte. Es hat sich gar nicht wie eine richtige Familie angefühlt.\n@c0@"
  en: "@aHarry@bAnd my father was so busy he didn't have any time for me. It didn't really feel much like a family to me.\n@c0@"
  es: "@aFroilán@bY mi padre estaba tan ocupado que no tenía tiempo para mí. Nunca sentí que tuviera una familia.\n@c0@"
  fr: "@aHarry@bEt mon père était si occupé qu'il n'avait jamais de temps à me consacrer. Je n'ai jamais vraiment eu l'impression d'avoir une famille.\n@c0@"
  it: "@aRobert@bE mio padre era così impegnato a governare da non avere mai tempo per me.\nIn realtà, non ho mai avuto una vera famiglia...\n@c0@"
  ja: "@a@bヘンリー「親父は　忙しくて　ほとんど\n\tいっしょに　いられなかったし…\n\t家族って感じが　しなかったよな。\n@c0@"
130:
  de: "@aHarry@bWenn ich heiraten könnte, könnte ich vielleicht alles ganz anders machen und mir meine eigene Familie aufbauen.\n@c0@"
  en: "@aHarry@bMaybe if I were to get married, I could change all that and build my own family.\n@c0@"
  es: "@aFroilán@bAunque podría casarme y crear una propia.\n@c0@"
  fr: "@aHarry@bPeut-être que si je me mariais, je pourrais changer tout ça en fondant ma propre famille.\n@c0@"
  it: "@aRobert@bSe un giorno mi sposerò, farò in modo da stare sempre insieme a mia moglie e ai figli con cui la dea vorrà benedire la nostra unione!\n@c0@"
  ja: "@a@bヘンリー「オレが　結婚でもすれば\n\t本当の家族を　持てるのかな…。\n@c0@"
131:
  de: "@aMaria@bJa, ich weiß nicht, wie ich ohne meinen Bruder klargekommen wäre. Und obwohl wir voneinander getrennt sind, trage ich ihn doch stets im Herzen.\n@c0@"
  en: "@aMaria@bYes, I don't know how I would have managed without my brother. And even though we're apart now, he's still always in my heart.\n@c0@"
  es: "@aMaría@bSí, no sé cómo hubiera salido adelante sin mi hermano. Aunque nos hayamos separado seguirá siempre en mi corazón.\n@c0@"
  fr: "@aMaria@bOui. Je ne sais pas comment je me serais débrouillée sans mon frère. Et même si nous sommes désormais séparés, il est toujours présent dans mon cœur.\n@c0@"
  it: "@aMaria@bNon so proprio come avrei fatto, se non avessi avuto mio fratello accanto a me. Lo sento sempre vicino, anche se ora siamo fisicamente lontanissimi...\n@c0@"
  ja: "@a@bマリア「生活は　苦しかったけど\n\t兄がいてくれたから……。\n\t離れていても兄は　大切な家族です。\n@c0@"
132:
  de: "@aHarry@bDie Leute hier haben eine Menge Spaß, nicht wahr?\n@c0@"
  en: "@aHarry@bThe people here have a great time of it, don't they?\n@c0@"
  es: "@aFroilán@bLa gente se lo pasa genial aquí.\n@c0@"
  fr: "@aHarry@bLes gens ici ont l'air de bien s'amuser, nonⓡ\n@c0@"
  it: "@aRobert@bCerto che la gente di qui ama divertirsi, eh?\n@c0@"
  ja: "@a@bヘンリー「そっかあ…\n\tこの町の人は\n\t楽しく　暮らしてるんだなあ。\n@c0@"
133:
  de: "@aHarry@bDas also ist das Haus der Mystischen Mridula?\n@c0@"
  en: "@aHarry@bSo this is Mystic Mridula's house?\n@c0@"
  es: "@aFroilán@b¿Esta es la casa de la bruja Lola?\n@c0@"
  fr: "@aHarry@bAlors c'est ici la maison d'Irma Cristalⓡ\n@c0@"
  it: "@aRobert@bQuesta dev'essere la casa della Maga Circiona...\n@c0@"
  ja: "@a@bヘンリー「…ということは\n\tここが　占いババの家か。\n@c0@"
134:
  de: "@aHarry@bUm ehrlich zu sein, hätte ich mit mehr seltsamen Pflanzen und eigenartigen Tieren gerechnet!\n@c0@"
  en: "@aHarry@bI was expecting more dodgy-looking herbs and weird animals, to be honest.\n@c0@"
  es: "@aFroilán@bPara ser sinceros, esperaba más hierbas misteriosas y animales raros.\n@c0@"
  fr: "@aHarry@bPour être honnête, je m'attendais à y voir plus d'herbes louches et d'animaux bizarres.\n@c0@"
  it: "@aRobert@bMi sarei aspettato di trovare un ambiente un po' più pittoresco! Che so io, amuleti strani, oggetti magici, teste d'aglio e ali di pipistrello...\n@c0@"
  ja: "@a@bヘンリー「ふ～ん　あやしい薬とか\n\t変な動物は　見あたらないな。\n@c0@"
135:
  de: "@aHarry@bIst sie nicht erstaunlich? Ihre kleine Ansprache ist ihr so in Fleisch und Blut übergegangen, dass sie sie sogar im Schlaf aufsagen kann!\n@c0@"
  en: "@aHarry@bIsn't she amazing? She knows her little speech so well, she can say it in her sleep!\n@c0@"
  es: "@aFroilán@b¿No es asombrosa? ¡Se sabe tan bien su discurso que podría recitarlo dormida!\n@c0@"
  fr: "@aHarry@bAlors ça, c'est incroyable, nonⓡ Elle connaît si bien son petit discours qu'elle est capable de le\ndébiter en dormantⓠ\n@c0@"
  it: "@aRobert@bNon è straordinaria?\nHa imparato talmente bene il suo discorsetto che riesce a ripeterlo persino mentre dorme!\n@c0@"
  ja: "@a@bヘンリー「すげえなあ。\n\t寝てても　教えてくれるなんて\n\tさすが　助手だぜ。\n@c0@"
136:
  de: "@aHarry@bKlingt, als hätte er sich Ärger eingehandelt!\n@c0@"
  en: "@aHarry@bSounds like he's in trouble there!\n@c0@"
  es: "@aFroilán@b¡Parece que está en apuros!\n@c0@"
  fr: "@aHarry@bIl m'a l'air d'être dans de sales drapsⓠ\n@c0@"
  it: "@aRobert@bUhm, ma che sta dicendo quel tipo...?\n@c0@"
  ja: "@a@bヘンリー「……あいつも　もう\n\t痛い目に　あってたんだな………。\n@c0@"
137:
  de: "@aHarry@bBist du verrückt geworden, %a000090? Es ist ein Wagen! Wo sollen wir denn sonst einen auftreiben? Und wann?\n@c0@"
  en: "@aHarry@bAre you off your rocker, %a000090?\nIt's a wagon! Where else are we going to be able to pick one of them up? And when?\n@c0@"
  es: "@aFroilán@b¿Estás loco, %a000090?\n¡Es un carromato! ¿Dónde si no vamos a conseguir uno? ¿Y cuándo?\n@c0@"
  fr: "@aHarry@bTu as perdu la boule, %a000090ⓡ\nC'est un chariotⓠ Où est-ce qu'on réussira à en trouver un autreⓡ Et quandⓡ\n@c0@"
  it: "@aRobert@bMa sei matto, %a000090?!\nChissà dove e quando avremo un'altra occasione di procurarci un carro!\n@c0@"
  ja: "@a@bヘンリー「おい　%a000090。\n\t馬車だぞ　馬車。\n\t今買わないで　いつ買うんだ？\n@c0@"
138:
  de: "@aHarry@bMann! Ich hätte mir nie träumen lassen, dass wir einen Wagen für diesen Betrag kaufen könnten! Das ist ja unglaublich!\n@c0@"
  en: "@aHarry@bWow! I never even dreamed of being able to buy a wagon for that kind of money. It's unbelievable!\n@c0@"
  es: "@aFroilán@b¡Vaya! Nunca hubiera esperado poder comprar un carromato por ese precio. ¡Es increíble!\n@c0@"
  fr: "@aHarry@bWaouhⓠ Je n'aurais jamais cru pouvoir acheter\nun chariot pour si peu. C'est incroyableⓠ\n@c0@"
  it: "@aRobert@bAccidenti, che affare!\nNon avrei mai immaginato di poter comprare un carro per una cifra così misera!\n@c0@"
  ja: "@a@bヘンリー「ひょ～っ！　馬車が\n\tこんな安値で　買えるなんて！\n\tちょっと　考えられないぜ。\n@c0@"
139:
  de: "@aHarry@bDas ist ja furchtbar! Das ist der unglaublichste Preis für einen Wagen, von dem ich je gehört habe, und wir können ihn uns immer noch nicht leisten!\n@c0@"
  en: "@aHarry@bThis is awful! That's the most unbelievable price\r\nfor a wagon I've ever heard, and we still can't afford it!\n@c0@"
