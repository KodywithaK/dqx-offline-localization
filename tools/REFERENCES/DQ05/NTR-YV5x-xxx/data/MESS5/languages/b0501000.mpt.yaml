  ja: "@a@bマリア「私や　兄が　感じたように\n\t%a000090さんたちは　特別な使命を\n\t受けていらっしゃるのですね。\n@c0@"
210:
  de: "@aMaria@bUnd jetzt reise ich mit euch beiden durch die Gegend! Das ist wirklich ein seltsames Gefühl.\n@c0@"
