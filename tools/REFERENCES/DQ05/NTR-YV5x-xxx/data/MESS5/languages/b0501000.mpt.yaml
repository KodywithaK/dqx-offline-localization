  es: "@aFroilán@bAunque ahora que lo hemos leído, supongo que no tenemos más opción que buscar el resto del Equipo de Zenithia. ¡Y al héroe, ya puestos!\n@c0@"
  fr: "@aHarry@bMais bon, maintenant que nous avons lu cette lettre, nous n'avons guère d'autre choix que de partir à la recherche du reste de l'Équipement zénithien...\n㈡\n... et du héros qui va avecⓠ\n@c0@"
  it: "@aRobert@bPerò non credo che abbiamo altra scelta.\r\nDobbiamo trovare il resto dell'Equipaggiamento Zenithiano e l'Eroe Leggendario!\n@c0@"
  ja: "@a@bヘンリー「だが　あの手紙を\n\t読んだからには　天空の防具と\n\t勇者を　さがすんだろうな。\n@c0@"
226:
  de: "@aHarry@bWir sollten wenigstens das Zenithiaschwert mitnehmen, findest du nicht?\n@c0@"
  en: "@aHarry@bWe should at least take the Zenithian Sword with us, don't you think?\n@c0@"
  es: "@aFroilán@bAl menos deberíamos llevarnos la Espada de Zenithia, ¿no crees?\n@c0@"
  fr: "@aHarry@bTu ne crois pas qu'on devrait au moins prendre l'Épée zénithienne avec nousⓡ\n@c0@"
  it: "@aRobert@bForza, prendiamo la Spada Zenithiana.\n@c0@"
