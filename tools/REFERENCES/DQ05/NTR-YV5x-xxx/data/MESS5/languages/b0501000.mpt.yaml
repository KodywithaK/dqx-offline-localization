  it: "@aRobert@bNon abbiamo motivo di stare qui, %a000090...\nDai, muoviamoci.\nAbbiamo molte cose da fare.\n@c0@"
  ja: "@a@bヘンリー「%a000090　ここには\n\t用は　ないはずだろ？\n\t今は　あっちのほうが　先決だぜ。\n@c0@"
219:
