37:
  de: "@aHarry@bEine Stadt mit Schloss im Nordosten? Das kann nicht Tifortu sein. Tifortu ist ein respektabler Ort. Da gibt es nichts, wovor man sich fürchten müsste.\n@c0@"
  en: "@aHarry@bA castle town in the north-east? Well, it can't be Coburg. Coburg's a respectable place. There's certainly nothing scary about Coburg.\n@c0@"
  es: "@aFroilán@b¿Un castillo al noreste? No puede ser Trastámara. Trastámara es un sitio respetable. Ahí no puede haber nada terrorífico.\n@c0@"
  fr: "@aHarry@bUne ville fortifiée au nord-estⓡ Ça ne peut pas\nêtre Cobourg, quand même. Cobourg est un\nlieu respectable. Il n'y a rien d'effrayant, là-bas.\n@c0@"
  it: "@aRobert@bUna città fortificata di cui si dicono cose terribili?!\r\nBeh, non si tratta certo di Coburg.\r\nCoburg è un luogo ospitale e rispettabile, perbacco!\n@c0@"
