  it: "@aRobert@bNon temere, Maria.\nSono certo che tuo fratello sta bene.\n@c0@"
  ja: "@a@bヘンリー「マリア……。\n@c0@"
107:
  de: "@aHarry@bⓞEine Frau, die Euch sehr nahe stehtⓟ... Ob sie damit wohl deine Mutter meint?\n@c0@"
  en: "@aHarry@bⓗA woman who is very close to youⓘ...?\nDo you think she means your mother?\n@c0@"
  es: "@aFroilán@b¿ⓕUna paya que es de su familiaⓖ?\n¿Crees que hablaba de tu madre?\n@c0@"
  fr: "@aHarry@bⓥUne femme qui vous est très procheⓦ...ⓡ\nTu crois qu'elle parle de ta mèreⓡ\n@c0@"
  it: "@aRobert@bⓕUna donna che ti sta molto a cuoreⓖ...?\nCredi che si riferisca a tua madre?\n@c0@"
  ja: "@a@bヘンリー「親しい女って\n\tお前の母さんのことかな？\n@c0@"
108:
