44:
  de: "@aHarry@bAh, der Chef der Geheimniskrämerei! Ich hielt ihn für einen reichen Geschäftsmann und den Laden für sein Steckenpferd, aber jetzt bin ich nicht mehr so sicher.\n@c0@"
  en: "@aHarry@bAh, it's the owner of the Old Curiosity Shop!\r\nI thought he was a rich businessman running the place for a bit of fun, but now I'm not so sure...\n@c0@"
  es: "@aFroilán@b¡Ah, es el propietario de La Vieja Tienda de Curiosidades!\n㈡\nCreía que era un comerciante rico que tenía el negocio por diversión, pero ya no estoy tan seguro.\n@c0@"
  fr: "@aHarry@bAh, c'est le propriétaire de la Petite boutique des curiositésⓠ\n㈡\nMoi qui croyais que c'était un homme d'affaires très riche qui tenait cette boutique pour se distraire.\nJe n'en suis plus si sûr, maintenant...\n@c0@"
  it: "@aRobert@bAh, il proprietario della Bottega Rari & Antichi!\nA volte mi chiedo come gli sia venuto in mente di aprire un negozio del genere...\n@c0@"
  ja: "@a@bヘンリー「アレは　オラクル屋のオヤジ！\n\t金持ちの　道楽商売かと思ったが\n\tいや～　さっぱりした部屋だなあ。\n@c0@"
45:
  de: "@aHarry@bDie Zeit vergeht? Na, in all den Jahren der Sklaverei hatte ich aber nicht den Eindruck.\n@c0@"
  en: "@aHarry@bTime marches on? It certainly didn't feel like it during all those years of slavery.\n@c0@"
  es: "@aFroilán@b¿El tiempo pasa sin parar? Pues no lo parecía durante los largos años de esclavitud.\n@c0@"
  fr: "@aHarry@bLe temps fileⓡ Je n'ai pas vraiment eu cette impression pendant toutes ces années d'esclavage.\n@c0@"
  it: "@aRobert@bCome ha detto? ⓕIl tempo passa. Il tempo corre. Il tempo volaⓖ?! Pfui! Quand'ero schiavo, mi sembra che fosse fermo, assolutamente immobile...\n@c0@"
  ja: "@a@bヘンリー「月日がたつのは早い……か。\n\tドレイをやってた頃は　毎日が\n\tおそろしく長く　感じられたけどな。\n@c0@"
46:
  de: "@aHarry@bAber es ist wirklich seltsam, weißt du. Wenn ich jetzt so auf diese Zeit zurückblicke, kommt es mir fast so vor, als sei sie wie im Nu vergangen.\n@c0@"
  en: "@aHarry@bBut it's rather strange, you know. When I look\r\nback on it now, it does almost seem like it was\r\nover in a flash.\n@c0@"
  es: "@aFroilán@bPero es extraño. Cuando miro atrás, casi me parece que todo pasó en un instante.\n@c0@"
  fr: "@aHarry@bMais c'est plutôt étrange, tu sais. Quand j'y repense aujourd'hui, j'ai effectivement l'impression que tout s'est passé à la vitesse de l'éclair.\n@c0@"
  it: "@aRobert@bPerò è strano, sai?\nOra che tutto è finito, ho quasi l'impressione che quell'orribile esperienza sia volata via in un lampo...\n@c0@"
  ja: "@a@bヘンリー「でもそれも　過ぎてしまえば\n\tほんの　短い間のことに思えるから\n\t不思議なもんだよな。\n@c0@"
47:
  de: "@aHarry@bNa ja, das hätte dir doch jeder sagen können, oder nicht? Wahrsagerin hin oder her.\n@c0@"
