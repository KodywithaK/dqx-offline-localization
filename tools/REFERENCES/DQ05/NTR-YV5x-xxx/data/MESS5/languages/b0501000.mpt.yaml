  ja: "@a@bヘンリー「%a000090　オレに\n\tできることがあったら\n\tなんでも　言ってくれよっ。\n@c0@"
217:
  de: "@aHarry@bIch weiß, das sagst du nur, damit ich mich besser fühle, aber ich danke dir trotzdem.\n@c0@"
