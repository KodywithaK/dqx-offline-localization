  it: "@aRobert@bAccidenti, quanto sono piccole quelle celle!\n@c0@"
  ja: "@a@bヘンリー「こういう　せまい所に\n\t閉じ込められてる人を見ると\n\tどうも　他人事に思えないんだよな。\n@c0@"
52:
  de: "@aHarry@bIch meine, es ist doch eigentlich eine Schande, findest du nicht?\n@c0@"
