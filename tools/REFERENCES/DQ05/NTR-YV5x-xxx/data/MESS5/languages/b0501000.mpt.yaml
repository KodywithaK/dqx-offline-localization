  ja: "@a@bヘンリー「とりあえず　この町へ\n\t来たからには　パ～ッと\n\t遊んでいこうぜ！\n@c0@"
98:
  de: "@aMaria@bWas für eine quirlige Stadt! Da muss man ja gute Laune bekommen! Aber wir dürfen uns jetzt nicht ablenken lassen.\n@c0@"
  en: "@aMaria@bWhat a vibrant town! Busy places can be so uplifting. But we mustn't let ourselves be distracted now.\n@c0@"
