  it: "@aMaria@bOdio le caverne!\nMi fanno pensare agli anni che abbiamo trascorso in quell'orribile tempio!\n@c0@"
  ja: "@a@bマリア「私は…　洞くつは　苦手です。\n\tなんだか　あの神殿のことを\n\t思い出してしまって……。\n@c0@"
220:
  de: "@aHarry@bDas ist ein interessant aussehendes Schwert. Und wo wir schon mal da sind, solltest du dir auch die Schatztruhe einmal ansehen.\n@c0@"
  en: "@aHarry@bThis is an interesting-looking sword. You should check that treasure chest while we're here too, %a000090.\n@c0@"
  es: "@aFroilán@bEs una espada interesante. Ya que estamos aquí deberías mirar dentro de ese cofre, %a000090.\n@c0@"
  fr: "@aHarry@bCette épée a l'air intéressante. Tu devrais jeter un coup d'œil à ce coffre au trésor aussi, tant que nous y sommes, %a000090.\n@c0@"
  it: "@aRobert@bChe bella spada, eh?\nGià che ci sei, dai anche un'occhiata in quello scrigno, %a000090.\n@c0@"
  ja: "@a@bヘンリー「この剣は　いったい？\n\t%a000090　あの　宝箱も\n\t調べてみようぜ。\n@c0@"
221:
  de: "@aHarry@bDas also ist das Zenithiaschwert. Unglaublich, wie blank die Klinge ist, obwohl sie so alt ist. Das Schwert muss über starke Kräfte verfügen.\n@c0@"
  en: "@aHarry@bSo this is the Zenithian Sword. It's incredible how shiny the blade is even though it's so ancient. It must have amazing powers.\n@c0@"
  es: "@aFroilán@bAsí que esta es la Espada de Zenithia. Es increíble cómo brilla la hoja, pese a su antigüedad. Debe de tener poderes asombrosos.\n@c0@"
  fr: "@aHarry@bVoici donc l'Épée zénithienne. Sa lame est incroyablement luisante, malgré son âge.\r\nElle doit posséder des pouvoirs incroyables.\n@c0@"
  it: "@aRobert@bE così questa è la famosa Spada Zenithiana...\nLa lama è incredibilmente lucente, nonostante sia tanto antica. Dev'essere un'arma straordinaria...\n@c0@"
  ja: "@a@bヘンリー「これが　天空のつるぎか。\n\t古い物なのに　刃がこんなに\n\tかがやいて…　すごい力を感じるよ。\n@c0@"
222:
  de: "@aHarry@bEs ist eine Schande, dass nur der legendäre Held das Zenithiaschwert benutzen kann.\n@c0@"
  en: "@aHarry@bIt's a shame that only the legendary hero can use the Zenithian Sword.\n@c0@"
