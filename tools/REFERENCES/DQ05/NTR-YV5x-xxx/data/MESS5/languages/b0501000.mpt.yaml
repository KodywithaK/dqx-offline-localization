  es: "@aFroilán@b¿Has oído eso? ¡Se ha salido! ¡Vamos!\r\n¡Puede que nosotros también tengamos suerte!\r\n¡Es hora de arrasar en el casino!\n@c0@"
  fr: "@aHarry@bTu as entendu çaⓡ Il a gagné grosⓠ Viensⓠ\nIl y en a encore de l'argent à ramasserⓠ\nÀ notre tour de faire sauter la banqueⓠ\n@c0@"
  it: "@aRobert@bHai sentito?! Ha vinto!\nI prossimi fortunati potremmo essere noi!\nForza! Andiamo al casinò!\n@c0@"
  ja: "@a@bヘンリー「く～っ！\n\tオレたちも　負けてられないぞ！\n\tさあ　カジノへ　レッツゴ～！\n@c0@"
102:
