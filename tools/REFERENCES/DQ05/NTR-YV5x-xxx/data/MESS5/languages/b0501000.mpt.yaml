0:
  de: "@aHarry@bUff! Hier ist ja ganz schön was los! Wenn ich nur sehe, wie hier alle durcheinanderlaufen, wird mir schon ganz schwindelig.\n@c0@"
  en: "@aHarry@bPhew! What a lively place! Just looking at everyone running around makes me dizzy.\n@c0@"
  es: "@aFroilán@b¡Uf! ¡Qué sitio más animado! Ver a todo el mundo corriendo de un lado para otro me marea un poco.\n@c0@"
  fr: "@aHarry@bPfiouⓠ Quel endroit animé. Voir tout ce monde courir dans tous les sens, ça me donne le tournis.\n@c0@"
  it: "@aRobert@bAccipicchia, che atmosfera vivace!\nVedere tutta questa gente mi mette di buonumore!\n@c0@"
  ja: "@a@bヘンリー「はぁ～　にぎやかな町だなあ。\n\tなんだか　オレ　見てるだけで\n\tクラクラしてきちゃったよ。\n@c0@"
1:
  de: "@aHarry@bIch weiß, es war ein Schock für dich zu sehen, wie es in Steinach jetzt aussieht. Mir ging's genauso.\n@c0@"
  en: "@aHarry@bI know the state of Whealbrook's come as a bit of a shock to you. It has to me too, as it happens.\n@c0@"
  es: "@aFroilán@bSé que el estado de Arroyofrío te ha impresionado mucho. A mí también.\n@c0@"
  fr: "@aHarry@bJe sais que ça t'a fait un choc de voir Ruycelieu dans un tel état. Et pour tout dire, à moi aussi.\n@c0@"
  it: "@aRobert@bCapisco che tu sia profondamente turbato dalla situazione in cui si trova Valcava...\nAnch'io sono sconvolto.\n@c0@"
  ja: "@a@bヘンリー「サンタローズのことは\n\tオレも　お前も　かなり\n\tショックだったと思うが……\n@c0@"
2:
  de: "@aHarry@bAber da wir nun einmal hier sind, sollten wir das Beste daraus machen und uns ein wenig amüsieren, findest du nicht?\n@c0@"
  en: "@aHarry@bBut now we're here, we should make the most of it and have some fun, don't you think?\n@c0@"
  es: "@aFroilán@bPero ahora que estamos aquí debemos aprovechar y divertirnos, ¿no crees?\n@c0@"
  fr: "@aHarry@bMais maintenant que nous sommes là, autant en profiter et essayer de s'amuser, tu ne crois pasⓡ\n@c0@"
  it: "@aRobert@bMa ora siamo qui, e dovremmo cercare di non pensare ai nostri problemi almeno per qualche ora.\nProviamo a rilassarci un po', d'accordo?\n@c0@"
  ja: "@a@bヘンリー「とりあえず　この町へ\n\t来たからには　パ～ッと\n\t遊んでいこうぜ！\n@c0@"
3:
  de: "@aMaria@bWas für eine quirlige Stadt! Da muss man ja gute Laune bekommen! Aber wir dürfen uns jetzt nicht ablenken lassen.\n@c0@"
  en: "@aMaria@bWhat a vibrant town! Busy places can be so uplifting. But we mustn't let ourselves be distracted now.\n@c0@"
  es: "@aMaría@b¡Qué sitio más vibrante! Me animan los lugares bulliciosos.\r\nPero no debemos distraernos ahora.\n@c0@"
  fr: "@aMaria@bQuelle ville pleine de vieⓠ Les endroits animés\npeuvent être tellement stimulants. Mais nous ne devons pas nous laisser distraire maintenant.\n@c0@"
  it: "@aMaria@bChe città piena di vita! I luoghi affollati mi mettono allegria! Peccato che in questo momento non possiamo permetterci troppe distrazioni...\n@c0@"
  ja: "@a@bマリア「活気のある町ですね。\n\t見ているだけで　元気になれそうです。\n\tでも　今は　先を急がないと……。\n@c0@"
4:
  de: "@aHarry@bAuf gar keinen Fall! Wir müssen uns auf das Wesentliche konzentrieren, %a000090! Erst die Arbeit, dann das Vergnügen.\n@c0@"
  en: "@aHarry@bAbsolutely! We must stay focused, %a000090.\nNo slipping off to have fun!\n@c0@"
  es: "@aFroilán@b¡Desde luego! Debemos concentrarnos, %a000090.\n¡Nada de diversiones!\n@c0@"
  fr: "@aHarry@bExactementⓠ Nous devons rester concentrés, %a000090. Pas d'escapade pour s'amuserⓠ\n@c0@"
  it: "@aRobert@bHai ragione. Dobbiamo rimanere concentrati, %a000090.\nIl divertimento può attendere!\n@c0@"
  ja: "@a@bヘンリー「そうだ　そうだ！\n\t%a000090　寄り道は　良くないぞ！\n@c0@"
5:
  de: "@aHarry@bⓞ... wo alles möglich istⓟ? Im Moment bin ich da gar nicht sehr zuversichtlich.\n@c0@"
  en: "@aHarry@bⓗLand of hope and gloryⓘ? I don't really have any particular hopes at the moment, as far as I know.\n@c0@"
  es: "@aFroilán@b¿ⓕTierra de gloria y esperanzaⓖ? Pues ahora mismo no tengo muchas esperanzas.\n@c0@"
  fr: "@aHarry@bⓥLa ville où tous vos rêves peuvent devenir réalitéⓦⓡ Je n'ai pas vraiment de rêves,\npour l'instant.\n@c0@"
  it: "@aRobert@bLa città della speranza e della buona sorte?\nSembra promettente, non trovi?\n@c0@"
  ja: "@a@bヘンリー「ふ～ん…　でも\n\tオレには　今のところ\n\t夢なんて　なんにもないけどな。\n@c0@"
6:
  de: "@aHarry@bAch, komm schon! Guck doch nicht so. Im Moment haben wir doch nichts allzu Dringendes vor. Entspann dich!\n@c0@"
  en: "@aHarry@bOh, come on! Don't look like that. There's nothing too pressing we need to do right now. Loosen up!\n@c0@"
  es: "@aFroilán@b¡Oh, venga! No pongas esa cara. No tenemos nada urgente que hacer. ¡Relájate!\n@c0@"
  fr: "@aHarry@bOh, allezⓠ Ne fais pas cette tête. On n'a rien de très urgent à faire, pour l'instant. Détends-toiⓠ\n@c0@"
  it: "@aRobert@bIn questo momento non abbiamo nulla di urgente da fare. Possiamo prendercela con calma e rilassarci un po', non credi?\n@c0@"
  ja: "@a@bヘンリー「おっと　そんなカオするなよ。\n\tなんにも　しばられてないってのは\n\tけっこう　気楽で　いいもんだぜ。\n@c0@"
7:
  de: "@aHarry@bTja, es wäre schön, wenn wir Tifortus früheren Glanz wiederauferstehen lassen könnten.\n@c0@"
  en: "@aHarry@bWell, what I'm hoping for right now is to restore Coburg to its former glory.\n@c0@"
  es: "@aFroilán@bBueno, espero poder restaurar la antigua gloria de Trastámara.\n@c0@"
  fr: "@aHarry@bEh bien, tout ce que j'espère pour le moment, c'est rendre à Cobourg sa gloire d'autrefois.\n@c0@"
  it: "@aRobert@bLa mia speranza è di riportare Coburg alla gloria di un tempo...\n@c0@"
  ja: "@a@bヘンリー「夢って言えるか　わからないけど\n\t今のところの　オレの夢は\n\tラインハットを元に　ってところだな。\n@c0@"
8:
  de: "@aHarry@bEr hat verloren? Wobei? Ich frage mich, was in dieser Stadt vor sich geht.\n@c0@"
  en: "@aHarry@bHe lost? At what? I wonder what kind of things go on in this town.\n@c0@"
  es: "@aFroilán@b¿Ha perdido? ¿A qué? Me pregunto qué está pasando en esta ciudad.\n@c0@"
  fr: "@aHarry@bIl a perduⓡ À quoiⓡ Je me demande ce qui se passe dans cette ville.\n@c0@"
  it: "@aRobert@bHa perso? A cosa?\nNon ho capito bene quali attività si svolgono in questo posto, ma sono sicuramente divertenti!\n@c0@"
  ja: "@a@bヘンリー「負けたって\n\tいったい　なにに？\n\tこの町には　なにか　あるのかな？\n@c0@"
9:
  de: "@aHarry@bIch hätte nichts dagegen, mich im Kasino auch ein wenig zu amüsieren.\n@c0@"
  en: "@aHarry@bI wouldn't mind having some fun at the\r\ncasino myself.\n@c0@"
  es: "@aFroilán@bNo me importaría divertirme un poco en el casino.\n@c0@"
  fr: "@aHarry@bJe ne serais pas contre aller faire un petit tour au casino pour m'amuser, personnellement.\n@c0@"
  it: "@aRobert@bNon mi dispiacerebbe andare a spassarmela un po' al casinò...\n@c0@"
  ja: "@a@bヘンリー「う～　オレも　カジノへ\n\t行きたくなってきたぞ～。\n@c0@"
10:
  de: "@aHarry@bAber nein! Das geht nicht, oder? Wir haben schließlich viel vor. Das Kasino wird bis zum nächsten Mal warten müssen.\n@c0@"
  en: "@aHarry@bBut no! We can't, can we? We have things to do.\r\nThe casino's going to have to wait until next time.\n@c0@"
  es: "@aFroilán@b¡Pero no! No podemos, ¿no? Tenemos cosas que hacer.\r\nEl casino deberá esperar a otra ocasión.\n@c0@"
  fr: "@aHarry@bMais nonⓠ Ce n'est pas possible, heinⓡ\nNous avons des choses à faire.\nLe casino devra attendre jusqu'à la prochaine fois.\n@c0@"
  it: "@aRobert@bUhm, no. Non possiamo farlo.\nAbbiamo affari ben più importanti da sbrigare.\nIl casinò può aspettare, tanto non scappa mica...\n@c0@"
  ja: "@a@bヘンリー「……と思ったが\n\tオレたちには　やることがある！\n\tカジノは　また今度にしようぜ。\n@c0@"
11:
  de: "@aHarry@bEs ist so groß wie eine Burgstadt. Ich wette, hier geht es nachts richtig rund.\n@c0@"
  en: "@aHarry@bIt's as big as a castle town.\r\nI bet it's pretty lively of a night.\n@c0@"
  es: "@aFroilán@bEs tan grande como un castillo.\r\nSeguro que de noche está muy animado.\n@c0@"
  fr: "@aHarry@bCet endroit est aussi grand qu'une ville fortifiée.\r\nJe parie que la vie nocturne est très animée.\n@c0@"
  it: "@aRobert@bAccidenti, quant'è grande!\nScommetto che di notte c'è un bel movimento...\n@c0@"
  ja: "@a@bヘンリー「城みたいに　大きな町だから\n\t夜も　にぎやかだろうなあ。\n@c0@"
12:
  de: "@aHarry@bEs ist schön, wenn jemand Träume und Visionen hat. Aber das brauche ich dir ja nicht zu sagen, oder?\n@c0@"
  en: "@aHarry@bIt's a fine thing for a person to have dreams\r\nand ambitions. Mind you, I don't need to tell\r\nyou that, do I?\n@c0@"
  es: "@aFroilán@bEstá bien tener sueños y ambiciones. Aunque a ti no tengo que decírtelo, ¿no?\n@c0@"
  fr: "@aHarry@bC'est bien d'avoir des rêves et des ambitions.\nEnfin, inutile de te dire ça à toi, heinⓡ\n@c0@"
  it: "@aRobert@bÈ importante avere sogni e ambizioni...\n@c0@"
  ja: "@a@bヘンリー「お前もそうだけど\n\t人生に　夢や目的があるってのは\n\tいいことだよな。\n@c0@"
13:
  de: "@aHarry@bJa, ich glaube, ich brauche einen Traum. Vielleicht finde ich ihn jetzt, auf der Reise.\n@c0@"
  en: "@aHarry@bYes, I think I need a dream. Perhaps I'll come across something with all this travelling I'm doing now.\n@c0@"
  es: "@aFroilán@bSí, creo que necesito un sueño. Quizá lo descubra en los muchos viajes que hago ahora.\n@c0@"
  fr: "@aHarry@bOui, je crois qu'il me faudrait un rêve, à moi aussi. Peut-être qu'avec tous les voyages qu'on fait, il me viendra une idée.\n@c0@"
  it: "@aRobert@bIn questo momento sento di aver bisogno di un sogno, e chissà che non ne trovi uno proprio durante questo nostro viaggio...\n@c0@"
  ja: "@a@bヘンリー「旅を続けてりゃ\n\tオレにも　そのうち　なにか\n\tやりたいことが　見つかるかな？\n@c0@"
14:
  de: "@aMaria@bDieses junge Mädchen war so voller Schwung und Energie. Ich beneide sie fast ein wenig.\n@c0@"
  en: "@aMaria@bThat young girl was so full of spirit and energy.\r\nI think I might be a bit jealous.\n@c0@"
  es: "@aMaría@bEsa joven estaba llena de vitalidad y energía.\r\nCreo que estoy un poco celosa.\n@c0@"
  fr: "@aMaria@bCette jeune fille fait preuve d'un tel enthousiasme et d'une telle énergie... Je crois que je suis un peu jalouse.\n@c0@"
  it: "@aMaria@bQuella ragazza era piena d'entusiasmo!\nConfesso che un po' la invidio...\n@c0@"
  ja: "@a@bマリア「さっきの女の方\n\tとっても　いきいきして　はなやかで…\n\t少し　うらやましいです。\n@c0@"
15:
  de: "@aHarry@bEin Laden, der ungewöhnliche Dinge verkauft und nur nachts geöffnet hat?\n@c0@"
  en: "@aHarry@bA shop selling unusual items that's only open at night?\n@c0@"
  es: "@aFroilán@b¿Una tienda de objetos inusuales que solo abre de noche?\n@c0@"
  fr: "@aHarry@bUne boutique qui vend des objets très particuliers et qui n'ouvre que la nuitⓡ\n@c0@"
  it: "@aRobert@bUn negozio di oggetti strani che è aperto solo di notte?\n@c0@"
