  ja: "@a@bヘンリー「……と思ったが\n\tオレたちには　やることがある！\n\tカジノは　また今度にしようぜ。\n@c0@"
103:
  de: "@aHarry@bGlaubst du, er meint den Orden vom Zugzwang?\n@c0@"
