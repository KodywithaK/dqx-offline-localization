  it: "@aRobert@bProbabilmente quest'eroe misterioso avrà delle capacità speciali che permettono solo a lui di usarla...\n@c0@"
  ja: "@a@bヘンリー「やっぱり　伝説の勇者にしか\n\t装備できないって　いうんだから\n\t特別な資格が　必要なんだろうか。\n@c0@"
209:
  de: "@aMaria@bMein Bruder und ich haben gespürt, dass du und Harry ein besonderes Schicksal habt, %a000090.\n@c0@"
