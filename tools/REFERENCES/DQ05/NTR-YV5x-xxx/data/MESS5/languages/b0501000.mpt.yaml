105:
  de: "@aMaria@bMein Bruder hatte die Gerüchte auch gehört ⓚⓛ und geglaubt. Darum hat er sich dem Orden angeschlossen.\n㈡\nHätte er das nur nicht getan, dann wäre er vielleicht...\n@c0@"
  en: "@aMaria@bMy brother heard the rumours too. And believed them. That's why he joined the order.\r\nIf only he hadn't, maybe he'd be...\n@c0@"
  es: "@aMaría@bMi hermano también oyó los rumores. Y los creyó. Por eso se unió a la orden.\r\nSi no lo hubiera hecho, quizás...\n@c0@"
  fr: "@aMaria@bMon frère aussi a entendu les rumeurs.\nEt il les a crues. C'est pour ça qu'il a rejoint l'Ordre.\n㈡\nSi seulement il ne les avait pas écoutées...\nPeut-être qu'il n'aurait jamais...\n@c0@"
  it: "@aMaria@bAnche mio fratello aveva sentito parlar bene della setta, e per questo decise di unirsi a essa.\nSe non l'avesse fatto, forse...\n@c0@"
  ja: "@a@bマリア「私たち兄弟も　その話を信じて\n\t教団に　入れていただいたのですが\n\tそんなことしなければ　兄は……。\n@c0@"
106:
  de: "@aHarry@bKeine Sorge, Maria. Deinem Bruder geht es sicher gut.\n@c0@"
