  fr: "@aHarry@bC'est vraiment dommage que seul le héros légendaire puisse utiliser l'Épée zénithienne.\n@c0@"
  it: "@aRobert@bPeccato che solo l'Eroe Leggendario possa usare la Spada Zenithiana...\n@c0@"
  ja: "@a@bヘンリー「でも　天空の剣は\n\t伝説の勇者しか\n\t装備できないみたいだな……。\n@c0@"
223:
  de: "@aHarry@bWeißt du, eine Weile habe ich ja überlegt, ob du das nicht sein könntest, aber das war wohl ein Irrtum.\n@c0@"
  en: "@aHarry@bYou know, I did wonder for a while if you might be him, but it looks like I was wrong.\n@c0@"
  es: "@aFroilán@bAl principio pensé que podrías ser tú, ¿sabes? Pero parece que me equivoqué.\n@c0@"
  fr: "@aHarry@bTu sais, pendant un moment, je me suis demandé\r\nsi ça ne pouvait pas être toi, mais apparemment,\r\nje me suis trompé.\n@c0@"
  it: "@aRobert@bSai, per un attimo mi ero illuso che quell'eroe fossi tu...\n@c0@"
  ja: "@a@bヘンリー「じつは　ひょっとしたら\n\tお前なら……って\n\t思ってたんだけど。\n@c0@"
224:
  de: "@aHarry@bEine dunkle Welt namens Nadiria, das Zenithiaschwert, der legendäre Held... Das klingt doch alles ziemlich weit hergeholt, findest du nicht?\n@c0@"
  en: "@aHarry@bA dark world called Nadiria, the Zenithian Sword, the legendary hero... It's all a bit far-fetched, don't you think?\n@c0@"
  es: "@aFroilán@bUn mundo oscuro llamado Nadiria, la Espada de Zenithia, el héroe legendario... Parece un poco fantasioso, ¿no crees?\n@c0@"
  fr: "@aHarry@bUn monde obscur appelé Nadiria, l'Épée zénithienne,\nle héros légendaire... tout ça est un peu tiré par les cheveux, tu ne crois pasⓡ\n@c0@"
  it: "@aRobert@bUn mondo oscuro chiamato Nadiria, la Spada Zenithiana, l'Eroe Leggendario...\nSembra tutto così inverosimile, non trovi?\n@c0@"
  ja: "@a@bヘンリー「魔界に　天空の剣に\n\t伝説の勇者か……。\n\tまったく　とほうもない話だぜ。\n@c0@"
225:
  de: "@aHarry@bAber jetzt, da wir es gelesen haben, bleibt uns wohl nichts anderes übrig, als auch die restliche Zenithia-Ausrüstung zu finden und den Helden obendrein!\n@c0@"
