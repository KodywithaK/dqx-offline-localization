  fr: "@aHarry@bIl enlevait des gensⓡⓐ Tu... Tu ne crois quand même pas que c'est l'une des brutes qui m'a enlevé du château il y a toutes ces années, heinⓡ\n@c0@"
  it: "@aRobert@bEra un rapitore di bambini?!\r\nNon avrà mica fatto parte della banda di delinquenti che mi portò via dal castello tanti anni fa...?\n@c0@"
  ja: "@a@bヘンリー「人をさらって　って　おい！\n\tまさか　オレをさらいやがったのは\n\tアイツかぁ！？\n@c0@"
54:
  de: "@aHarry@bUnglaublich! Und wenn ich dran denke, dass mir die Insassen der Zellen schon fast leidgetan haben! Der kann von mir aus in seiner Zelle versauern.\n@c0@"
  en: "@aHarry@bUnbelievable! And to think I almost felt sorry for the people in these cells! He can stay in here for life as far as I'm concerned.\n@c0@"
  es: "@aFroilán@b¡Increíble! ¡Y pensar que casi sentí lástima por los de esas celdas! Por lo que a mí respecta puede quedarse dentro de por vida.\n@c0@"
  fr: "@aHarry@bIncroyableⓠ Dire que je me sentais presque désolé pour les gens enfermés dans ces cellulesⓠ En ce qui me concerne, il peut bien moisir là à perpétuité.\n@c0@"
  it: "@aRobert@bE io che provavo quasi pena per lui, chiuso in questa piccola cella maleodorante...! Per quanto mi riguarda, può marcire qui dentro tutta la vita.\n@c0@"
