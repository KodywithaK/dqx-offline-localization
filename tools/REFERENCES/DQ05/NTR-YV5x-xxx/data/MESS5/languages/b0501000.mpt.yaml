  fr: "@aHarry@bMême si le héros est mort, il est possible qu'il ait des petits-enfants. On devrait commencer par chercher cet équipement légendaire.\n@c0@"
  it: "@aRobert@bAnche se l'eroe fosse morto, potrebbe comunque aver lasciato dei discendenti, non credi?\n㈡\nIo suggerirei di cominciare a cercare l'equipaggiamento leggendario...\n@c0@"
  ja: "@a@bヘンリー「勇者は　死んでいても\n\t子孫がいるかもしれないだろ？\n\tまずは　防具さがしから始めようぜ。\n@c0@"
213:
