50:
  de: "@aHarry@bEin Häschenmädel? Glaubst du, Monty zwingt sie, so was zu tragen? Als Uniform, meine ich. Uh! Da läuft es mir ja kalt den Rücken runter!\n@c0@"
  en: "@aHarry@bA bunny girl? Do you think Monty makes her\r\nwear that? As a uniform, I mean. Uurgh...\r\nI shudder to think!\n@c0@"
  es: "@aFroilán@b¿Una conejita? ¿Crees que Moncho le obliga a llevar eso? Como uniforme, quiero decir. Urgh...\r\n¡Me dan escalofríos solo de pensarlo!\n@c0@"
  fr: "@aHarry@bUne serveuseⓡ Tu crois que Ciobair l'oblige à\nporter çaⓡ Comme uniforme, j'entends. Baaah...\nJ'en frissonne rien que d'y penserⓠ\n@c0@"
  it: "@aRobert@bMa hai visto com'è vestita quella ragazza?!\nIo non riuscirei mai a lavorare se la mia assistente mi girasse intorno agghindata in quel modo...\n@c0@"
  ja: "@a@bヘンリー「な　なんで　じいさんの\n\t助手が　バニー姿なんだ！？\n\tじいさんの趣味か？　か～～っ！\n@c0@"
51:
  de: "@aHarry@bEs ist gar nicht so leicht, sich rauszuhalten, wenn Leute in so engen Zellen eingeschlossen werden.\n@c0@"
  en: "@aHarry@bIt's hard to turn a blind eye when you see people confined in such tiny cells.\n@c0@"
