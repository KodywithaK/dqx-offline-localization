  it: "@aRobert@b%0%a000090, venivi spesso qui quand'eri piccolo, vero?\n@c0@"
  ja: "@a@bヘンリー「%a000090も　小さいころ\n\tこの洞くつへ　来たって？\n@c0@"
214:
