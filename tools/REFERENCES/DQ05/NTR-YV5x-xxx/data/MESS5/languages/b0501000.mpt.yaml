  de: "@aHarry@bWarum sind wir hier, %a000090? Ich wüsste jedenfalls nicht, was wir hier sollten.\n@c0@"
  en: "@aHarry@bWhy have we come here, %a000090?\nI certainly can't think of any good reason.\n@c0@"
  es: "@aFroilán@b¿Por qué hemos venido aquí, %a000090?\nNo se me ocurre ninguna buena razón.\n@c0@"
  fr: "@aHarry@bPourquoi est-on venus ici, %a000090ⓡ\nJ'ai beau chercher une raison, je n'en vois pas.\n@c0@"
  it: "@aRobert@bPerché siamo venuti qui, %a000090?\nNon riesco a pensare a una sola ragione valida...\n@c0@"
  ja: "@a@bヘンリー「なあ　%a000090。\n\tこの城に　いったい　何の用が\n\tあるって言うんだ？\n@c0@"
289:
  de: "@aHarry@bAußer... Außer dich hat plötzlich die Nostalgie gepackt?\n@c0@"
  en: "@aHarry@bUnless! Are you taking us on a trip down memory lane with you, by any chance?\n@c0@"
  es: "@aFroilán@bNo nos estarás arrastrando a un viaje por tus recuerdos, ¿no?\n@c0@"
  fr: "@aHarry@bSauf si... Tu ne serais pas en train de nous faire faire un petit voyage-souvenir, par hasardⓡ\n@c0@"
  it: "@aRobert@bA meno che... \nDi' un po', non ci avrai mica portati qui per farci vedere i luoghi delle tue scorribande d'infanzia, eh?\n@c0@"
  ja: "@a@bヘンリー「あっ！　まさか　お前\n\t自分の思い出の地めぐりに　オレを\n\tつき合わせてんじゃないだろうな？\n@c0@"
290:
  de: "@aHarry@bHe! Hast du das gesehen? Ob das ein Geist war? Schauen wir mal nach!\n@c0@"
  en: "@aHarry@bHey! Did you see that!? I wonder if it was a ghost. Let's go and see!\n@c0@"
  es: "@aFroilán@b¡Eh! ¿Has visto eso? ¿Será un fantasma? ¡Vamos a ver!\n@c0@"
  fr: "@aHarry@bHéⓠ Tu as vu çaⓡⓐ\nJe me demande si c'était un fantôme. Allons voirⓠ\n@c0@"
  it: "@aRobert@bEhi! Hai visto anche tu, vero?!\nCredi che fosse un fantasma?\nForza, andiamo a controllare!\n@c0@"
  ja: "@a@bヘンリー「おわっ！　なんだ？\n\tまさか　今のは　ユウレイなのか！？\n\t%a000090　行ってみようぜ！\n@c0@"
291:
  de: "@aHarry@bOch ⓚⓛ da freut man sich auf einen Geist, und dann ist es bloß ein ausgebüchstes Pärchen! Die hätte ich hier nicht erwartet.\n@c0@"
  en: "@aHarry@bThere was I hoping I'd seen a ghost, when it was nothing more than a runaway couple!\r\nI didn't expect to find them here.\n@c0@"
  es: "@aFroilán@b¡Yo que creía haber visto un fantasma y no era más que una pareja fugada!\r\nNo esperaba encontrarlos aquí.\n@c0@"
  fr: "@aHarry@bEt moi qui espérais voir un fantôme, alors que ce n'était qu'un couple en fuiteⓠ Je ne m'attendais\npas à trouver quelqu'un ici.\n@c0@"
  it: "@aRobert@bPensavo di aver visto un fantasma... e invece erano solo due innamorati in fuga! Devono essere davvero disperati, per aver scelto di rifugiarsi qui dentro...\n@c0@"
  ja: "@a@bヘンリー「ユウレイかと思ったら\n\t駆け落ちカップルだったのか。\n\tまったく　ビックリさせやがるぜ。\n@c0@"
292:
  de: "@aMaria@bHach, verbotene Liebe über die Klassenschranken hinweg... Wenigstens hatten sie das Glück, diesen Ort zu finden, an dem sie zusammen sein können.\n@c0@"
  en: "@aMaria@bAaah, forbidden love across the class boundaries... At least they were lucky enough to find this place to live in together.\n@c0@"
  es: "@aMaría@b¡Ah!, amor prohibido entre distintas clases... Al menos, han tenido la suerte de encontrar este sitio donde vivir.\n@c0@"
  fr: "@aMaria@bAaah, l'amour interdit qui transcende les barrières des classes... Ils ont au moins eu la chance de trouver cet endroit pour y vivre ensemble.\n@c0@"
  it: "@aMaria@bIl vero amore sa andare oltre gli assurdi confini imposti dalle classi sociali... Comunque, sono felice che quei due abbiano trovato un posto dove vivere.\n@c0@"
  ja: "@a@bマリア「身分ちがいの恋ですか……\n\tでも　今　こうして一緒にいられて\n\t本当に　良かったですね。\n@c0@"
293:
  de: "@aHarry@bGut, dass die zwei das mit dem Sterben nicht durchgezogen haben. Wer tot ist, ist tot und kann daran nichts mehr ändern.\n@c0@"
  en: "@aHarry@bIt's good that the two of them didn't go through with the dying idea. Once you're dead, you're dead. There's no changing your mind then.\n@c0@"
  es: "@aFroilán@bMe alegro de que no siguieran con sus intenciones suicidas. Una vez mueres, muerto estás. Después no puedes cambiar de idea.\n@c0@"
  fr: "@aHarry@bC'est une bonne chose qu'ils n'aient pas poussé plus avant leur idée de mourir. Quand on est mort, on est mort. Après, on ne peut plus changer d'avis.\n@c0@"
  it: "@aRobert@bPer fortuna quei due ragazzi non si sono tolti la vita.\nNon avrebbero risolto nulla, se l'avessero fatto...\n@c0@"
  ja: "@a@bヘンリー「まあ　何にせよ　あのふたり\n\t死ななくて　よかったよ。\n\t人間　死んだら　おしまいだもんな。\n@c0@"
294:
  de: "@aMaria@bDie beiden sehen so glücklich aus. So ein Anblick macht mich selbst auch froh.\n@c0@"
  en: "@aMaria@bThey both seem so happy. Seeing people like that makes me feel happy too.\n@c0@"
  es: "@aMaría@bParecen muy felices. Ver a la gente feliz me anima mucho.\n@c0@"
  fr: "@aMaria@bIls ont l'air si heureux, tous les deux. Quand je vois des gens comme ça, je suis heureuse, moi aussi.\n@c0@"
  it: "@aMaria@bSembrano così felici, eh? Vedere persone che si vogliono bene mi riempie il cuore di gioia!\nE poi, come si dice? ⓕGente allegra, la dea l'aiutaⓖ!\n@c0@"
  ja: "@a@bマリア「あの方々　本当に　幸せそう。\n\t幸せな方を　見ていると　こちらまで\n\tあたたかい気持ちに　なりますわ。\n@c0@"
295:
  de: "@aHarry@bEin merkwürdiger Graf, der seinen Friedhof auf dem Burgdach anlegt!\n@c0@"
  en: "@aHarry@bWhat a strange count he must've been to have put his graveyard up on the castle roof!\n@c0@"
  es: "@aFroilán@b¡Debió ser un conde de lo más peculiar para instalar su panteón en el tejado del castillo!\n@c0@"
  fr: "@aHarry@bIl devait être un peu spécial, comme comte, pour installer sa pierre tombale sur le toit du châteauⓠ\n@c0@"
  it: "@aRobert@bCerto che il conte dev'essere stato proprio un tipo originale, per mettere il cimitero sul tetto del castello!\n@c0@"
  ja: "@a@bヘンリー「城の屋上に\n\t墓を建てるなんて\n\t変わった　王さまだな。\n@c0@"
296:
  de: "@aHarry@bDie Menschen in diesen Gräbern haben dich gebeten, die Geister zu besiegen? Das hört sich ja ziemlich abgedreht an!\n@c0@"
  en: "@aHarry@bThe people in these graves asked you to defeat the ghosts? That all sounds a bit far-fetched!\n@c0@"
  es: "@aFroilán@b¿La gente de esas tumbas te pidió que derrotaras a los fantasmas? ¡Suena un poco fantasioso!\n@c0@"
  fr: "@aHarry@bCe sont les gens dans ces tombes qui t'ont demandé de vaincre les fantômesⓡ Ça paraît un peu tiré par les cheveux.\n@c0@"
  it: "@aRobert@bLe persone sepolte in queste tombe ti chiesero di sconfiggere dei fantasmi?!\nMi stai prendendo in giro, non è vero...?\n@c0@"
  ja: "@a@bヘンリー「このお墓の　人たちに\n\tお化け退治を　たのまれたって？\n\t……そんな　バカな。\n@c0@"
297:
  de: "@aHarry@bDieser Mann hat kaum einen Schatten. Aber v-vielleicht bilde ich mir das ja auch nur ein. Ha ha!\n@c0@"
  en: "@aHarry@bThat man doesn't seem to have much of a shadow.\nM-Maybe I'm just imagining it, though. Ha ha!\n@c0@"
  es: "@aFroilán@bEse hombre no parece que tenga sombra.\r\nQ-quizá son imaginaciones mías. ¡Ja, ja!\n@c0@"
  fr: "@aHarry@bOn dirait que cet homme n'a pas d'ombre.\nM-Mais peut-être que je m'invente des choses\ntout seul. Ha ha haⓠ\n@c0@"
  it: "@aRobert@bMa quell'uomo non proietta alcuna ombra...!\r\nAh, dev'essere uno scherzo della mia immaginazione...\r\nAh ah ah!\n@c0@"
  ja: "@a@bヘンリー「あそこにいる　おじさん\n\tなんだか　カゲが　うすいんだけど…\n\tき　気のせいだよな。　ははは…。\n@c0@"
298:
  de: "@aHarry@bDie anderen Kontinente kann man von hier aus nur mit dem Schiff erreichen.\n@c0@"
  en: "@aHarry@bThe only way to reach any of the other continents from here is by boat.\n@c0@"
  es: "@aFroilán@bDesde aquí hace falta un barco para llegar a cualquiera de los otros continentes.\n@c0@"
  fr: "@aHarry@bD'ici, le seul moyen de rejoindre les autres continents, c'est par bateau.\n@c0@"
  it: "@aRobert@bL'unico modo per raggiungere gli altri continenti da qui è via mare.\n@c0@"
  ja: "@a@bヘンリー「ほかの大陸に　行きたいなら\n\tここから船に　乗っていくしか\n\t方法は　ないと思うぞ。\n@c0@"
299:
  de: "@aMaria@bDer Anblick des Meeres macht mich ganz unruhig. Irgendwo da draußen sind mein Bruder und all die armen Leute, die als Sklaven gehalten werden.\n@c0@"
  en: "@aMaria@bI feel so unsettled when I look at the ocean. On the other side of it is my brother and all those poor people trapped as slaves.\n@c0@"
  es: "@aMaría@bMe siento muy inquieta cuando miro el océano. Al otro lado están mi hermano y todos esos pobres esclavos atrapados.\n@c0@"
  fr: "@aMaria@bJe me sens tellement mal à l'aise quand je regarde l'océan. De l'autre côté se trouvent mon frère et tous ces pauvres gens réduits en esclavage.\n@c0@"
  it: "@aMaria@bQuando guardo l'oceano, mi commuovo... Penso a mio fratello, che si trova dall'altro lato di quest'immensa distesa d'acqua, e agli schiavi che sono con lui...\n@c0@"
  ja: "@a@bマリア「海を見ると　心がざわめきます。\n\tこの海の向こうに　兄や\n\tドレイにされている人たちがいるから。\n@c0@"
300:
  de: "@aHarry@bKeine Sorge, Maria. Deinem Bruder geht es sicher gut.\n@c0@"
  en: "@aHarry@bDon't worry, Maria, I'm sure your brother's fine.\n@c0@"
  es: "@aFroilán@bNo te preocupes, María, seguro que tu hermano está bien.\n@c0@"
  fr: "@aHarry@bNe t'inquiète pas, Maria. Je suis sûr que ton frère\r\nva bien.\n@c0@"
  it: "@aRobert@bNon preoccuparti, Maria.\nSono certo che tuo fratello sta bene.\n@c0@"
  ja: "@a@bヘンリー「マリア……。\n@c0@"
301:
  de: "@aHarry@b...\n@c0@"
  en: "@aHarry@b............\n@c0@"
  es: "@aFroilán@b...\n@c0@"
  fr: "@aHarry@b............\n@c0@"
  it: "@aRobert@b...\n@c0@"
  ja: "@a@bヘンリー「……………。\n@c0@"
302:
  de: "@a@bHarry scheint tief in Gedanken versunken zu sein.\n@c0@"
  en: "@a@bHarry appears to be deep in thought.\n@c0@"
  es: "@a@bFroilán parece meditabundo.\n@c0@"
  fr: "@a@bHarry semble profondément plongé dans ses pensées.\n@c0@"
  it: "@a@bRobert è immerso nei suoi pensieri...\n@c0@"
  ja: "@a@bヘンリーは　なにやら\n考えこんでいるようすだ……。\n@c0@"
303:
  de: "@aHarry@bIch kann mir kaum vorstellen, dass Wilbur so streng sein würde. Er gehörte nie zu den Willensstärksten.\n@c0@"
  en: "@aHarry@bI find it hard to imagine Wilbur giving out\r\nsuch strict orders. He was never the most\r\nstrong-minded of chaps.\n@c0@"
  es: "@aFroilán@bMe cuesta imaginar a Leonoro dando órdenes tan estrictas. Nunca fue un tipo firme.\n@c0@"
  fr: "@aHarry@bJ'imagine mal Will donner des ordres aussi stricts.\r\nIl n'a jamais eu un tempérament très autoritaire.\n@c0@"
  it: "@aRobert@bMi riesce difficile immaginare che Fabian possa aver impartito ordini del genere. Non ne è il tipo!\nAlmeno, non lo era quando vivevo al castello...\n@c0@"
  ja: "@a@bヘンリー「あの気の弱かったデールが\n\tそんな命令を出すなんて\n\tオレには　とても考えられないよ。\n@c0@"
304:
  de: "@aHarry@bAll das wird sich ändern, wenn wir den Schwindel aufdecken.\n@c0@"
  en: "@aHarry@bAll of this will change when we oust that impostor.\n@c0@"
  es: "@aFroilán@bTodo eso cambiará cuando expulsemos a ese impostor.\n@c0@"
  fr: "@aHarry@bTout ça va changer quand nous aurons chassé\r\ncet imposteur.\n@c0@"
  it: "@aRobert@bLa situazione cambierà presto...\nOh, se cambierà!\n@c0@"
  ja: "@a@bヘンリー「それもこれも\n\tあの　ニセモノをなんとかすれば\n\tカタがつきそうだな。\n@c0@"
305:
  de: "@aHarry@b...\n@c0@"
  en: "@aHarry@b............\n@c0@"
  es: "@aFroilán@b...\n@c0@"
  fr: "@aHarry@b............\n@c0@"
  it: "@aRobert@b...\n@c0@"
  ja: "@a@bヘンリー「……………。\n@c0@"
306:
  de: "@a@bHarry lässt stumm den Kopf hängen.\n@c0@"
  en: "@a@bHarry is hanging his head low in silence.\n@c0@"
  es: "@a@bFroilán guarda silencio con la cabeza gacha.\n@c0@"
  fr: "@a@bTête basse, Harry garde le silence.\n@c0@"
  it: "@a@bRobert, silenzioso, tiene il capo chino sul petto...\n@c0@"
  ja: "@a@bヘンリーは\nだまって　うつむいている……。\n@c0@"
307:
  de: "@aHarry@bGenehmigung? So etwas habe ich als Kind nie gebraucht!\n@c0@"
  en: "@aHarry@bPermission!? I didn't need anything of the sort when I was a child!\n@c0@"
  es: "@aFroilán@b¿Permiso? ¡Cuando era niño no necesitaba nada por el estilo!\n@c0@"
  fr: "@aHarry@bLa permissionⓡⓐ Je n'en avais pas besoin, quand j'étais enfantⓠ\n@c0@"
  it: "@aRobert@bL'accesso è vietato a chi è senza permesso?!\nQuando vivevo qui si poteva passare senza chiedere il permesso a nessuno!\n@c0@"
  ja: "@a@bヘンリー「許可証か……。\n\tオレが　子供の頃には　そんなもの\n\t必要なかったはずだけどな。\n@c0@"
308:
  de: "@aHarry@bIch weiß, du willst hingehen, %a000090. Aber ich fürchte, nach Tifortu zieht mich im Moment gar nichts mehr.\n@c0@"
  en: "@aHarry@bI know you want to go, %a000090. But I'm afraid Coburg holds no attraction for me whatsoever any more.\n@c0@"
  es: "@aFroilán@bSé que quieres ir, %a000090, pero me temo que Trastámara ya no guarda ningún atractivo para mí.\n@c0@"
  fr: "@aHarry@bJe sais que tu as envie d'y aller, %a000090.\nMais je crains que Cobourg n'ait plus aucun attrait pour moi, désormais.\n@c0@"
  it: "@aRobert@bMi spiace, %a000090...\nSo che vuoi andare a Coburg, ma non sono sicuro di avere voglia di accompagnarti...\n@c0@"
  ja: "@a@bヘンリー「%a000090の気持ちも\n\tわかるけど…　オレは　もう\n\tラインハットには　もどらないよ。\n@c0@"
309:
  de: "@aHarry@bDas ist Carl. Früher war er ein ganz gewöhnlicher Diener. Und nun schau ihn dir an ⓚⓛ jetzt ist er Soldat mit allem Drum und Dran!\n@c0@"
  en: "@aHarry@bThat's Frank. He used to just be a lowly servant. And yet look at him now, a soldier and everything!\n@c0@"
  es: "@aFroilán@bEse es Ran. Antes era un vulgar sirviente, y míralo ahora: ¡hecho todo un soldado!\n@c0@"
  fr: "@aHarry@bC'est Christophe. Avant, ce n'était qu'un humble domestique. Et regarde-le, maintenant... un soldat, rien que çaⓠ\n@c0@"
  it: "@aRobert@bQuello è Dick Huanonsipas. Era l'umile figlio di un ancor più umile servitore, e ora guardalo come si pavoneggia, con la sua bella uniforme da soldato!\n@c0@"
  ja: "@a@bヘンリー「あいつは　トムっていって\n\t昔は　城詰めの召使いだったんだが\n\tまさか　兵士になってるなんてな。\n@c0@"
310:
  de: "@aHarry@bDas Einzige, was ihm Angst macht, sind große Frösche! Die habe ich früher aus Jux überall verteilt, um ihm einen Schrecken einzujagen!\n@c0@"
  en: "@aHarry@bHis one weakness is large frogs. He's so scared of them! I used to have a lot of fun planting them about the place to give him a fright!\n@c0@"
  es: "@aFroilán@bSu debilidad son las ranas grandes. ¡Le aterran! ¡Me lo pasaba genial dejándolas por todos lados para asustarlo!\n@c0@"
  fr: "@aHarry@bSon point faible, ce sont les grenouilles. Il en a une trouille bleueⓠ Qu'est-ce que j'ai pu m'amuser à en mettre partout pour lui flanquer la frousseⓠ\n@c0@"
  it: "@aRobert@bDa piccolo aveva una paura matta delle rane. Io lo sapevo, e gliene tiravo addosso di continuo. Così, tanto per divertirmi un po'... Ero una peste, lo so.\n@c0@"
  ja: "@a@bヘンリー「大のカエル嫌いなのが\n\t面白くて　あのころは　いろいろ\n\tイタズラを　しかけたもんだよ。\n@c0@"
311:
  de: "@aHarry@bDas ist Tifortu, da auf der anderen Seite des Flusses. Ah ⓚⓛ (schnüff) ⓚⓛ eine frische Brise! Genau wie früher.\n@c0@"
  en: "@aHarry@bThat's Coburg just across the river. The wind smells just the same as it used to in the old days.\n@c0@"
  es: "@aFroilán@bAl otro lado del río está Trastámara. El viento me trae los olores de los viejos tiempos.\n@c0@"
  fr: "@aHarry@bCobourg est juste là, de l'autre côté de la rivière. Les odeurs que porte le vent sont les mêmes qu'autrefois.\n@c0@"
  it: "@aRobert@bCoburg si trova proprio dall'altro lato del fiume.\nSai? Riconosco i profumi di questi luoghi.\nMi ricordano la mia infanzia...\n@c0@"
  ja: "@a@bヘンリー「川をはさんで向こうは\n\tもう　ラインハットの国だ。\n\t風のにおいは　昔と　変わらないな。\n@c0@"
312:
  de: "@aHarry@bStrengere Gesetze? Was meint er wohl? Wir müssen herausbekommen, was da los ist.\n@c0@"
  en: "@aHarry@bHeavy-handed laws? I wonder what he means.\r\nWe'll have to find out what's going on.\n@c0@"
  es: "@aFroilán@b¿Estricta? ¿Qué querrá decir eso?\r\nHay que descubrir qué está pasando.\n@c0@"
  fr: "@aHarry@bDes lois de plus en plus duresⓡ Je me demande\nce qu'il veut dire. Nous allons devoir découvrir\nce qui se passe.\n@c0@"
  it: "@aRobert@bLeggi ingiuste e tasse insostenibili?!\nMa che accidenti sta succedendo a Coburg?!\nDevo assolutamente scoprirlo!\n@c0@"
  ja: "@a@bヘンリー「知らないうちに\n\tおそろしい法律が　できてしまう！？\n\tこれは　ほっておけないな。\n@c0@"
313:
  de: "@aHarry@bIch hätte nicht gedacht, dass ich je wieder einen Fuß nach Tifortu hineinsetzen würde. Doch da bin ich nun!\n@c0@"
  en: "@aHarry@bI didn't imagine I'd be setting foot in this place again. And yet here I am!\n@c0@"
  es: "@aFroilán@bNunca imaginé que volvería a este lugar. ¡Pero aquí estoy!\n@c0@"
  fr: "@aHarry@bJe n'imaginais pas remettre un jour les pieds dans cet endroit. Et pourtant, j'y suisⓠ\n@c0@"
  it: "@aRobert@bCredevo che non avrei più messo piede in questo posto...\nE invece rieccomi qui!\n@c0@"
  ja: "@a@bヘンリー「もう　ここに\n\t戻ることはないと　思ってたんだが…\n\tとうとう　来ちまったな。\n@c0@"
314:
  de: "@aHarry@bHier sieht es ja ganz anders aus als früher. Alles ist so heruntergekommen!\n@c0@"
  en: "@aHarry@bThings seem to have changed an awful lot. The place looks really run-down.\n@c0@"
  es: "@aFroilán@bLas cosas parecen haber cambiado mucho. Este sitio se ha hundido.\n@c0@"
  fr: "@aHarry@bOn dirait que les choses ont énormément changé.\r\nLe royaume a l'air en bien triste état.\n@c0@"
  it: "@aRobert@bSanta dea, cos'è successo?!\nQuasi non riconosco il mio Regno, per quanto è cambiato!\n@c0@"
  ja: "@a@bヘンリー「城下町のようすが\n\tずいぶん　変わっちまったな。\n\tなんだか　うす汚れた感じがするよ。\n@c0@"
315:
  de: "@aMaria@bWenn ich dran denke, dass du Prinz in einem so majestätisch aussehenden Schloss warst, Harry!\n@c0@"
  en: "@aMaria@bTo think that you were prince of such a grand-looking castle, Harry!\n@c0@"
  es: "@aMaría@b¡Y pensar que fuiste príncipe de este grandioso castillo, Froilán!\n@c0@"
  fr: "@aMaria@bDire que tu étais le prince d'un château si imposant, Harryⓠ\n@c0@"
  it: "@aMaria@bPensare che tu eri il Principe di un castello così maestoso, Robert...\n@c0@"
  ja: "@a@bマリア「ヘンリーさまが\n\tこんな　大きなお城の\n\t王子さまでしたなんて……。\n@c0@"
316:
  de: "@aMaria@bDas ist mir jetzt richtig peinlich. Ich habe so unbefangen mit dir gesprochen ⓚⓛ habe ich es da womöglich an Respekt fehlen lassen?\n@c0@"
  en: "@aMaria@bNow I feel all ashamed. Have I been disrespectful, speaking to you in such a familiar way?\n@c0@"
  es: "@aMaría@bAhora me siento avergonzada. ¿Habré sido irrespetuosa al tratarte con tanta familiaridad?\n@c0@"
  fr: "@aMaria@bMaintenant, j'ai honte. Est-ce que je ne t'ai pas manqué de respect en te parlant aussi familièrementⓡ\n@c0@"
  it: "@aMaria@bTi prego di perdonarmi.\nNon avrei dovuto rivolgermi a te in maniera tanto informale...\n@c0@"
