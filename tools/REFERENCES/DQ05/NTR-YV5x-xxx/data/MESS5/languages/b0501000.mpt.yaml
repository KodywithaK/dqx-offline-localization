  ja: "@a@bヘンリー「この町は　夜も明るいな。\n\tカジノのネオンが　まぶしいぜ！\n@c0@"
101:
  de: "@aHarry@bHast du das gehört? Der hat ganz groß gewonnen! Komm schon! Wo der herkommt, da ist bestimmt noch mehr zu holen! Jetzt ist das Kasino dran!\n@c0@"
