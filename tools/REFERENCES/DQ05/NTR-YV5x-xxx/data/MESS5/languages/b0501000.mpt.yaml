  ja: "@a@bヘンリー「ううっ…。\n\tなんだか　悲しくなってきたぞ。\n@c0@"
53:
  de: "@aHarry@bEr hat früher Leute entführt? D-Du glaubst doch nicht, dass er einer der Grobiane ist, die mich vor all den Jahren aus dem Schloss entführt haben, oder?\n@c0@"
  en: "@aHarry@bHe used to kidnap people!? Y-You don't think he's\r\none of the thugs who took me from the castle all those years ago, do you?\n@c0@"
