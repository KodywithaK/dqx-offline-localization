38:
  de: "@aHarry@bIch glaube, sie hat recht. Es wäre klüger, sie würden sich im Moment von Tifortu fernhalten.\n@c0@"
  en: "@aHarry@bI'm afraid she's right. They'd be very wise to stay away from Coburg at the moment.\n@c0@"
  es: "@aFroilán@bMe temo que tiene razón. En este momento harían bien en mantenerse alejados de Trastámara.\n@c0@"
