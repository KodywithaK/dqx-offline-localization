  it: "@aRobert@bSe devo essere sincero, non credo a maghi, chiaroveggenti e simili. Però spero che la predizione di questa donna si avveri...\n@c0@"
  ja: "@a@bヘンリー「オレは　占いはキライだけど\n\tこの占いの結果だけは\n\t当たっててほしいと　思うよ。\n@c0@"
109:
