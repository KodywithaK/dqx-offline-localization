0:
  de: "@aBianca@bMit einem Haus hätte ich hier wirklich nicht gerechnet.\n@c0@"
  en: "@aBianca@bI didn't expect to find a house in a place like this.\n@c0@"
  es: "@aBianca@bNo me esperaba encontrar una casa en un sitio así, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne m'attendais pas à trouver une maison dans\r\nun endroit pareil.\n@c0@"
  it: "@aBianca@bNon mi aspettavo di trovare un'abitazione proprio qui...\n@c0@"
  ja: "@a@bビアンカ「こんなところに\n\t家があるなんて　思わなかったわ。\n@c0@"
1:
  de: "@aNera@bDas Häuschen ist bezaubernd, aber es muss schrecklich einsam sein, so ganz allein hier draußen.\n@c0@"
  en: "@aNera@bIt's a lovely-looking house, but it must be terribly lonely being stuck all the way out here all alone.\n@c0@"
  es: "@aNera@bEs una casa veramente bella, pero debe de ser bastante solitaria, aquí en mitad de la nada.\n@c0@"
  fr: "@aNera@bCette maison est très jolie, mais on doit se sentir\r\ntrès isolé, coincé ici sans personne alentour.\n@c0@"
  it: "@aNera@bQuesta casa è davvero bella... E dev'essere anche incredibilmente tranquilla, visto che si trova in mezzo al nulla! Chissà, magari ci abita un eremita...\n@c0@"
  ja: "@a@bフローラ「すてきな　おうちですけど\n\tこんなところに　ポツンとあるんじゃ\n\tさみしいですわよね。\n@c0@"
2:
  de: "@a%0%a001240@bDas kenn' ich doch! Hier wohnt ein Gelehrter, der einfach alles weiß!\n@c0@"
  en: "@a%0%a001240@bI know this place! There's a scholar here who knows absolutely everything!\n@c0@"
  es: "@a%0%a001240@b¡Sé dónde estamos! Aquí hay un erudito que lo sabe todo de todo.\n@c0@"
  fr: "@a%0%a001240@bJe connais cet endroitⓠ C'est ici que vit un érudit\nqui sait absolument tout sur toutⓠ\n@c0@"
  it: "@a%0%a001240@bConosco questo posto!\nCi vive uno studioso che sa tutto di tutto!\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\tここには　もの知りな学者さんが\n\t住んでるんだよ！\n@c0@"
3:
  de: "@a%0%a001250@bHier war ich schon mal.\n@c0@"
  en: "@a%0%a001250@bI remember coming here before.\n@c0@"
  es: "@a%0%a001250@bRecuerdo haber venido aquí.\n@c0@"
  fr: "@a%0%a001250@bJe me souviens être déjà venue ici.\n@c0@"
  it: "@a%0%a001250@bMi ricordo di questo posto...\nCi sono già stata qualche tempo fa.\n@c0@"
  ja: "@a@b%a001250「ここは　前にも\n\t来たことがあるの。\n@c0@"
4:
  de: "@aBianca@bNa komm schon, %a000090. Du solltest dir wenigstens anhören, was er zu sagen hat.\n@c0@"
  en: "@aBianca@bDun't be so lazy, %a000090. You should at least listen to what he has to say.\n@c0@"
  es: "@aBianca@bNo me seas así, %a000090. Al menos deberías escuchar lo que quiere decirte, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bNe sois pas si paresseux, %a000090.\nTu devrais au moins écouter ce qu'il a à te dire.\n@c0@"
  it: "@aBianca@bQuanto sei scortese, %a000090!\nDai, sentiamo cos'ha da dirci questo signore...\n@c0@"
  ja: "@a@bビアンカ「%a000090　せっかちね。\n\t話くらい　ちゃんと\n\t聞いてあげなさいよ。\n@c0@"
5:
  de: "@aNera@bDas war aber ziemlich unhöflich von dir, findest du nicht?\n@c0@"
  en: "@aNera@bDon't you think that was rather rude of you?\n@c0@"
  es: "@aNera@b¿No crees que has sido un po' maleducado?\n@c0@"
  fr: "@aNera@bTu ne trouves pas que c'était un peu mal élevé\nde ta partⓡ\n@c0@"
  it: "@aNera@bSei stato proprio sgarbato!\nE presuntuoso, anche!\nCome fai a sapere cosa ha da dirci, eh?\n@c0@"
  ja: "@a@bフローラ「あなた　いくらなんでも　今のは\n\tすこし　失礼だったのでは……？\n@c0@"
6:
  de: "@a%0%a001240@bDu solltest dir ruhig anhören, was er zu sagen hat, Papa. Der kennt sich aus.\n@c0@"
  en: "@a%0%a001240@bYou should listen to this guy, Dad.\nHe knows his stuff!\n@c0@"
  es: "@a%0%a001240@bDeberías escuchar a este tipo, papi.\n¡Sabe de lo que habla!\n@c0@"
  fr: "@a%0%a001240@bTu devrais écouter ce que ce type a à te dire, papa. Il en connaît un rayonⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ascoltiamolo, dai.\nSecondo me questo signore può dirci qualcosa di interessante...\n@c0@"
  ja: "@a@b%a001240「ちゃんと聞いたほうがいいよ。\n\tあのおじいさんって　すっごく\n\tもの知りなんだよ！\n@c0@"
7:
  de: "@aSancho@bDu bist immer noch derselbe Heißsporn wie früher, nisst wahr?\n@c0@"
  en: "@aSancho@bYou are estill the esame hot-headed kid, eh?\n@c0@"
  es: "@aSancho@bSigues siendo el mismo chamaco reterudo, ¿eh?\n@c0@"
  fr: "@aSancho@bTu es t-toujours oune tête de bois, chicoⓠ\n@c0@"
  it: "@aSancho@bChico, sei siempre el solito espiritoso...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんは　どうも\n\tせっかちなところが\n\t直ってないようですね。\n@c0@"
8:
  de: "@aSancho@bWenn du nisst ein bisssen geduldiger wirst, Chico, wirst du niemals finden, was du suchst.\n@c0@"
  en: "@aSancho@bEef you no change thees about yourself, friend, you never gonna find what you are looking for.\n@c0@"
  es: "@aSancho@bSi no cambias esa actitud, chamaco, nunca encontrarás lo que buscas.\n@c0@"
  fr: "@aSancho@bS-Si tu ne fais pas oun effort pour t'améliorer\r\nsur ce p-p-point, tu ne trouveras jamais\r\nce que t-tu cherches.\n@c0@"
  it: "@aSancho@bAscoltiamo cos'ha da dirce...\n¡Potrebbe essere interessantes!\n@c0@"
  ja: "@a@bサンチョ「それじゃあ　見つかるものも\n\t見つけられませんよ！\n@c0@"
9:
  de: "@aOtto@bOho! Wir heben wohl allmählich ein wenig ab, wie? Selbst der Erretter der Welt kann wohl gelegentlich einen guten Rat gebrauchen, oder meint Ihr nicht?\n@c0@"
  en: "@aTuppence@bDear, dear! Getting a bit big for our boots, aren't we? Surely even he who saves the world could do with a bit of advice every now and then.\n@c0@"
  es: "@aAlazar@b¡Ay, ay! ¿Nos hemos pasado un pelo, no? Supongo que hasta al que va a salvar el mundo le vendrá bien algún consejo que otro.\n@c0@"
  fr: "@aInnocent@bEh bien, dites-moiⓠ On commence à avoir les chevilles qui gonflentⓡ Pourtant, même le sauveur du monde peut avoir besoin d'un conseil, de temps en temps.\n@c0@"
  it: "@aSimon@bSanti numi, Maestà! Non la facevo così presuntuoso!\nCrede davvero di sapere già tutto?! Guardi che nella vita non si finisce mai di imparare...\n@c0@"
  ja: "@a@bピピン「おおっ！　世界を　マタにかける\n\t%a000090さまにとっては　今さら\n\t助言など　必要ないということですね？\n@c0@"
10:
  de: "@a%0%a001250@bFelsenbomben benutzen wohl ganz gern den Kamikaze-Zauber. Das kann einem richtig Angst machen.\n@c0@"
  en: "@a%0%a001250@bRockbombs seem quite fond of using the Kamikazee spell. It's really scary.\n@c0@"
  es: "@a%0%a001250@bA las rocobombas les encanta utilizar el conjuro Kamikaze. ¡Dan mucho miedo!\n@c0@"
  fr: "@a%0%a001250@bLes rochexplosifs sont très friands du sort Kamikaze. Ça fait vraiment très peur.\n@c0@"
  it: "@a%0%a001250@bGli Esplo-sassi lanciano spesso l'incantesimo ⓕKamikazeⓖ...\nSono molto pericolosi!\n@c0@"
  ja: "@a@b%a001250「メガンテって\n\tばくだんいわさんが　好きな呪文でしょ？\n\tわたし　あの呪文は　すごくこわいの。\n@c0@"
11:
  de: "@aSancho@bDiese Information, sie ist sehr nützliss, nisst wahr?\n@c0@"
  en: "@aSancho@bThees information, ees very useful, sí?\nMuchas gracias again, señor.\n@c0@"
  es: "@aSancho@bEsa información es reteútil, ¿verdad?\nMuchas gracias, señor.\n@c0@"
  fr: "@aSancho@bC-Cette information est muy utile, noⓡ\nEncore muchas gracias, señor.\n@c0@"
  it: "@aSancho@b¡Ay, que información preciosa!\nMuchas gracias, señor.\n@c0@"
  ja: "@a@bサンチョ「このたびも　貴重な情報を…\n\tありがたいことです。\n@c0@"
12:
  de: "@aSancho@bHättest du doch nur gesagt, dass wir heute hier vorbeischauen, hätte iss ein kleines Geschenk vorbereitet.\n@c0@"
  en: "@aSancho@bEef you tell me we are coming here today,\r\nI prepare esometheeng as a geeft.\n@c0@"
  es: "@aSancho@bSi hubiera sabido que veníamos habría traído algún presente.\n@c0@"
  fr: "@aSancho@bSi tu m'avais dit qu'on allait v-venir ici aujourd'hui, j'aurais p-préparé oun cadeau.\n@c0@"
  it: "@aSancho@bChico, si tu me avessi detto que saremmo venutos aquí, avrei preparato un pentolon de paella por ringraziare quell'hombre...\n@c0@"
  ja: "@a@bサンチョ「今日　ここへ来るなら\n\t来ると言ってくだされば\n\t手みやげを　用意しましたのに……。\n@c0@"
13:
  de: "@aSancho@bDieser Señor, er hat uns so sehr geholfen, als wir nach dem Stolosstab suchten, weißt du.\n@c0@"
  en: "@aSancho@bThees señor, he helped us muchos when we are looking for Stolos' estaff, you know.\n@c0@"
  es: "@aSancho@bEste señor nos ayudó mucho cuando andábamos buscando el báculo de Stolas, ¿sabes?\n@c0@"
  fr: "@aSancho@bC-Ce señor, il nous a aidé mucho quand nous cherchions le b-bâton de Stolos, tu sais.\n@c0@"
  it: "@aSancho@bCe aiutò un saccos cuando estavamo cercando la bacchetta de Stolos.\nSì, quello es un señor muy gentil.\n@c0@"
  ja: "@a@bサンチョ「あの方には　ストロスの杖を\n\tさがしだすとき　とても\n\tお世話になったんですよ。\n@c0@"
14:
  de: "@aBianca@bEs muss komisch sein, hier oben zu leben, ganz allein, nur mit einer Katze zur Gesellschaft.\n@c0@"
  en: "@aBianca@bIt must be a funny old life, bein' stuck here on your own with only a cat for company.\n@c0@"
  es: "@aBianca@bDebe de ser una vida bastante peculiar, aquí solo con un gato, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa doit être une drôle de vie d'être coincé ici avec un chat pour seule compagnie.\n@c0@"
  it: "@aBianca@bChissà come dev'essere vivere qui da soli, con un gatto come unico amico...\n@c0@"
  ja: "@a@bビアンカ「こんな場所で\n\tネコと　ふたりきりで…\n\t生活できるのかしら？\n@c0@"
15:
  de: "@a%0%a001240@bWir waren schon mal hier, als wir eine Möglichkeit gesucht haben, euch aus Stein wieder in Menschen zu verwandeln.\n@c0@"
  en: "@a%0%a001240@bWe stopped by here when we were trying to figure out how to turn you back out of stone.\n@c0@"
  es: "@a%0%a001240@bPasamos por aquí mientras estábamos buscando el modo de devolverte la vida cuando eras una estatua.\n@c0@"
  fr: "@a%0%a001240@bOn s'est arrêtés ici quand on essayait de trouver le moyen de te redonner ta forme humaine.\n@c0@"
  it: "@a%0%a001240@bRicordo che venimmo qui quando stavamo cercando il modo per farti tornare un uomo in carne e ossa...\n@c0@"
  ja: "@a@b%a001240「石化をとく方法を\n\tさがしてたとき……\n@c0@"
16:
  de: "@a%0%a001240@bDer Gelehrte hier hat empfohlen, den Stolosstab zu benutzen. Er weiß wirklich, wovon er redet!\n@c0@"
  en: "@a%0%a001240@bThe scholar here recommended using Stolos' staff.\nHe really knows what he's talking about!\n@c0@"
  es: "@a%0%a001240@bEste erudito nos recomendó que usáramos el báculo de Stolas.\n¡Sabe lo que se dice!\n@c0@"
  fr: "@a%0%a001240@bC'est cet érudit qui nous a recommandé d'utiliser\nle bâton de Stolos. Il sait vraiment de quoi il parleⓠ\n@c0@"
  it: "@a%0%a001240@bFu quello studioso a consigliarci di usare la bacchetta di Stolos, sai?\nÈ un tipo davvero in gamba!\n@c0@"
  ja: "@a@b%a001240「ここの学者さんが\n\tストロスの杖のこと\n\t教えてくれたんだよっ！\n@c0@"
17:
  de: "@a%0%a001250@bDer Mann hier weiß über einfach alles Bescheid! Er ist sehr klug!\n@c0@"
  en: "@a%0%a001250@bThe man who lives here knows all there is to know. He's amazing!\n@c0@"
  es: "@a%0%a001250@bEl hombre que vive aquí sabe todo de todo. ¡Es asombroso!\n@c0@"
  fr: "@a%0%a001250@bL'homme qui vit ici sait absolument tout\nce qu'il y a à savoir. Il est prodigieuxⓠ\n@c0@"
  it: "@a%0%a001250@bIl signore che vive qui sa una montagna di cose!\nÈ una persona coltissima!\n@c0@"
  ja: "@a@b%a001250「この家の　おじいさん\n\tなんでも知ってるの。\n\tとても　すごい人なのよ！\n@c0@"
18:
  de: "@aOtto@bUh! An was für einen trostlosen und abgelegenen Ort habt Ihr mich denn hier geschleppt! Nur ein einziger Mann und seine Katze als Unterhaltung!\n@c0@"
  en: "@aTuppence@bUrgh! What a dull and remote place you've brought me to. Why, there's only one man and his cat here for entertainment!\n@c0@"
  es: "@aAlazar@b¡Agh! Este sitio es el más aburrido del mundo. Solo hay un hombre y un gato, ¡menuda juerga!\n@c0@"
  fr: "@aInnocent@bAhⓠ Vous m'avez emmené dans un endroit vraiment triste et perdu. C'est vraiⓢ en guise de divertissement, il n'y a qu'un homme seul et son chatⓠ\n@c0@"
  it: "@aSimon@bLa popolazione di questo posto ammonta a un uomo e a un gatto. Nah, non fa per me.\nNon vivrei qui nemmeno se m'inchiodassero al suolo...\n@c0@"
  ja: "@a@bピピン「こんな　へんぴな場所で…\n\tしかも　じいさんとネコしかいない\n\t家なんて　ボクには　たえられません！\n@c0@"
19:
  de: "@a%0%a001250@bHallo, Katze! Wollen wir wieder ein bisschen zusammen spielen?\n@c0@"
  en: "@a%0%a001250@bHello, cat! Shall we play together again?\n@c0@"
  es: "@a%0%a001250@b¡Hola, gato! ¿Te apetece jugar un poco?\n@c0@"
  fr: "@a%0%a001250@bBonjour, le chatⓠ Tu veux qu'on joue encore une fois ensembleⓡ\n@c0@"
  it: "@a%0%a001250@bCiao, micino!\nAnzi... ⓕMiaoⓖ, micino!\nTi va di giocare con me?\n@c0@"
  ja: "@a@b%a001250「わ～い！\n\tネコさん　また遊びに来たよ！\n@c0@"
20:
  de: "@aGriselda@bWas machen wir hier in dieser Einöde?\n@c0@"
  en: "@aDebora@bWhat are we doing all the way out here?\n@c0@"
  es: "@aStefania@b¿Ma, se puede saber qué hacemos aquí?\n@c0@"
  fr: "@aPandora@bMais qu'est-ce qu'on fait perdus iciⓡ\n@c0@"
  it: "@aViola@bPerché siamo venuti qui?\nTi dispiacerebbe spiegarmelo, caro?\n@c0@"
  ja: "@a@bデボラ「こんな場所に　何の用？\n@c0@"
21:
  de: "@aGriselda@bDu weißt bereits, was er sagen wollte, oder?\n@c0@"
  en: "@aDebora@bYou already know what he wanted to say, right?\n@c0@"
  es: "@aStefania@bYa sabes lo que quería decir, ¿vero?\n@c0@"
  fr: "@aPandora@bTu sais déjà ce qu'il a à te direⓡ\n@c0@"
  it: "@aViola@bMa tu guarda! Non credevo che sapessi leggere nel pensiero! Quell'uomo non aveva nemmeno parlato, ma gli hai risposto che già sapevi cosa voleva dirti...\n@c0@"
  ja: "@a@bデボラ「何が言いたかったか\n\t分かってるんでしょ？\n@c0@"
22:
  de: "@aGriselda@bNa, wenn das so ist, können wir ja auch gehen.\n@c0@"
  en: "@aDebora@bIn that case, we may as well get going.\n@c0@"
  es: "@aStefania@bEntonces, andiamo presto.\n@c0@"
  fr: "@aPandora@bDans ce cas, autant continuer notre route.\n@c0@"
  it: "@aViola@bSei troppo presuntuoso, caro. Dovresti prendere esempio da me, che faccio sempre sfoggio di modestia nonostante le mie innumerevoli qualità!\n@c0@"
  ja: "@a@bデボラ「なら　ここには　もう\n\t用はないわね。\n@c0@"
