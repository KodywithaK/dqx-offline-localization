0:
  de: "@a%0%a001240@bJuchhu! Es ist Papa, es ist Papa!\n@c0@"
  en: "@a%0%a001240@bYippee! It's Dad! It's Dad! It's Dad!\n@c0@"
  es: "@a%0%a001240@b¡Yupiii! ¡Es papá! ¡Es papá! ¡Es papá!\n@c0@"
  fr: "@a%0%a001240@bYoupiⓠ C'est papaⓠ C'est papaⓠ C'est papaⓠ\n@c0@"
  it: "@a%0%a001240@bEvviva!\nÈ papà! È papà!\n@c0@"
  ja: "@a@b%a001240「わ～い！\n\tお父さんだ　お父さんだ　お父さんだ！\n@c0@"
1:
  de: "@a%0%a001240@bDu siehst mir ziemlich ähnlich, Papa.\n@c0@"
  en: "@a%0%a001240@bYou look quite a lot like me, Dad.\n@c0@"
  es: "@a%0%a001240@bTe pareces mucho a mí, papá.\n@c0@"
  fr: "@a%0%a001240@bTu me ressembles beaucoup, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, lo sai che ci assomigliamo tanto?\n@c0@"
  ja: "@a@b%a001240「お父さんって\n\tボクに　顔が　そっくりだねっ。\n@c0@"
2:
  de: "@a%0%a001250@bWir haben uns gedacht, dass du müde bist, darum haben wir dich auch in Ruhe schlafen lassen.\n@c0@"
  en: "@a%0%a001250@bWe knew you'd probably be tired, so we decided to leave you be until you woke up.\n@c0@"
  es: "@a%0%a001250@bSabíamos que podías estar cansado, así que decidimos dejarte en paz hasta que te despertases.\n@c0@"
  fr: "@a%0%a001250@bOn savait que tu serais sûrement très fatigué,\nalors on a décidé de te laisser tranquille jusqu'à\nce que tu te réveilles.\n@c0@"
  it: "@a%0%a001250@bImmaginavamo che tu fossi stanco, quindi abbiamo deciso di non disturbarti fino al tuo risveglio.\n@c0@"
  ja: "@a@b%a001250「お父さん　つかれてると\n\t思ったから　起きてくれるまで\n\tがまんして　待っていたの。\n@c0@"
3:
  de: "@a%0%a001250@bHach, es gibt ja so viel zu erzählen!\n@c0@"
  en: "@a%0%a001250@bThere's so much we want to talk about with you!\n@c0@"
  es: "@a%0%a001250@b¡Tenemos tantas cosas que contarte!\n@c0@"
  fr: "@a%0%a001250@bOn a tellement de choses à te raconterⓠ\n@c0@"
  it: "@a%0%a001250@bCi sono tantissime cose che ti vogliamo chiedere, sai?\n@c0@"
  ja: "@a@b%a001250「いっぱい\n\tお話ししようね　お父さんっ。\n@c0@"
4:
  de: "@a%0%a001250@bEs ist schon lange her, seit du hier in der Burg warst, nicht wahr, Papa? Aber keine Sorge, ich kann dir alles zeigen.\n@c0@"
  en: "@a%0%a001250@bIt's been a long time since you were last here in the castle, hasn't it, Dad? But don't worry, I can show you around.\n@c0@"
  es: "@a%0%a001250@bHa pasado mucho tiempo desde la última vez que estuviste en el castillo, ¿verdad, papá? Pero no te preocupes, yo te guiaré.\n@c0@"
  fr: "@a%0%a001250@bÇa faisait longtemps que tu n'étais pas revenu dans ce château, hein, papaⓡ Mais ne t'inquiète pas, je peux te faire visiter.\n@c0@"
  it: "@a%0%a001250@bPapà, è da tanto tempo che manchi dal castello, non è vero?\nTi ricordi ancora com'è fatto?\n@c0@"
  ja: "@a@b%a001250「お父さん　お城の中は\n\tひさしぶりでしょ？\n\tわたしが　いろいろ　教えてあげる。\n@c0@"
5:
  de: "@a%0%a001240@bMach dir um die Amme keine Sorgen, sie ist nur etwas rührselig.\n@c0@"
  en: "@a%0%a001240@bDon't worry about her, she always bursts into tears at the drop of a hat.\n@c0@"
  es: "@a%0%a001240@bNo te preocupes por ella, se echa a llorar por cualquier cosa.\n@c0@"
  fr: "@a%0%a001240@bNe t'inquiète pas pour elle, elle pleure toujours pour un rien.\n@c0@"
  it: "@a%0%a001240@bQuella signora ci vuole un gran bene, ma si commuove troppo facilmente...\n@c0@"
  ja: "@a@b%a001240「あの　おばさん\n\tすぐ泣くんだよ。\n@c0@"
6:
  de: "@a%0%a001240@bⓞPrinz %a001240 ist ganz alleine auf diese Säule geklettert (Schluchz). ⓟ ⓞPrinz %a001240 ist schon solch ein großer Junge (Schluchz).ⓟ Du weißt schon.\n@c0@"
  en: "@a%0%a001240@bⓗPrince %a001240 can climb that pillar all by himself (sob).ⓘ ⓗPrince %a001240 can break chairs (sob).ⓘ You know the kind of thing.\n@c0@"
  es: "@a%0%a001240@bⓕEl príncipe %a001240 puede escalar esa columna solo (snif)ⓖ. ⓕEl príncipe %a001240 puede romper sillas (snif)ⓖ. Ya sabes de qué va.\n@c0@"
  fr: "@a%0%a001240@bⓥLe prince %a001240 arrive à grimper tout seul à ce pilier (snif).ⓦ ⓥLe prince %a001240 arrive à casser les chaises (snif).ⓦ Tu vois le genre.\n@c0@"
  it: "@a%0%a001240@bⓕIl principe %a001240 è cresciuto tantissimo! Sob!ⓖ e giù una lacrima!\n㈡\nⓕIl principe %a001240 somiglia tanto a suo padre! Sob!ⓖ e giù un'altra lacrima! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「%a001240さまが　ひとりで\n\t柱に　のぼれるようになって　とか\n\tイスを　こわせるようになって　とか。\n@c0@"
7:
  de: "@a%0%a001250@b%0%a001240 spielt ihr immer Streiche und versucht ständig, sie zu erschrecken.\n@c0@"
  en: "@a%0%a001250@b%0%a001240 always plays pranks on her and tries to give her a fright one way or another.\n@c0@"
  es: "@a%0%a001250@b%0%a001240 siempre le gasta bromas y le intenta dar sustos.\n@c0@"
  fr: "@a%0%a001250@b%0%a001240 lui fait toujours des farces et essaie de lui donner des frayeurs à la moindre occasion.\n@c0@"
  it: "@a%0%a001250@b%0%a001240 le fa sempre un mucchio di scherzi.\nMio fratello è un discolo dispettoso!\n@c0@"
  ja: "@a@b%a001250「%a001240ったら\n\tあの　おばさんを\n\tおどろかせてばかり　いたのよ。\n@c0@"
8:
  de: "@a%0%a001250@bEinmal ist %a001240 auf die Veranda geklettert, da hat sie so laut geschrien, dass mich fast der Schlag getroffen hätte!\n@c0@"
  en: "@a%0%a001250@bI nearly had a heart attack once when I heard\nher shrieking about him walking along the edge\nof the veranda.\n@c0@"
  es: "@a%0%a001250@bUna vez casi me da un ataque cuando la oí gritar que el príncipe estaba caminando por la barandilla del balcón.\n@c0@"
  fr: "@a%0%a001250@bUne fois, j'ai failli avoir une attaque quand je l'ai entendue hurler parce qu'il marchait sur le rebord de la galerie.\n@c0@"
  it: "@a%0%a001250@bUna volta si è messo a camminare sul bordo della veranda...\nCi è mancato poco che a quella povera donna venisse un infarto!\n@c0@"
  ja: "@a@b%a001250「ベランダのへりを　歩いたときは\n\tおばさんの悲鳴で　わたしが\n\tショック死するかと　思ったわ。\n@c0@"
9:
  de: "@aOtto@bEin einfacher Soldat wie ich im Schlafzimmer des großen %a000090!\nWelch eine Ehre! Da wird mir gleich ganz anders.\n@c0@"
  en: "@aTuppence@bA lowly soldier like me in the great %a000090's bedroom, of all places! The thought of it makes me go weak at the knees.\n@c0@"
  es: "@aAlazar@b¡Un humilde soldado como yo, en el dormitorio del gran %a000090! Solo de pensarlo me fallan las piernas.\n@c0@"
  fr: "@aInnocent@bUn humble soldat comme moi dans la chambre du grand %a000090, vous vous rendez compteⓠ Rien que d'y penser, j'en ai les jambes qui flageolent.\n@c0@"
  it: "@aSimon@bUn soldato come me negli alloggi del grande %a000090...!\nIl solo pensiero mi fa tremare da capo a piedi...\n@c0@"
  ja: "@a@bピピン「ボクのような　ただの兵士が\n\t%a000090さまの寝室に……！？\n\tなんだか　きんちょうしますね。\n@c0@"
10:
  de: "@a%0%a001240@bDie Leute von Humburg feiern dich wie einen Helden, Papa! Ist das nicht großartig?\n@c0@"
  en: "@a%0%a001240@bThe people of Gotha treat you like some kind of idol, Dad! Isn't that amazing?\n@c0@"
  es: "@a%0%a001240@b¡La gente de Pankraz te trata como a una persona famosa, papi! ¿No es genial?\n@c0@"
  fr: "@a%0%a001240@bLes gens de Gotha te traitent un peu comme\nune idole, papaⓠ C'est incroyable, nonⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, sei l'idolo degli abitanti di Denim!\nSei troppo forte!\n@c0@"
  ja: "@a@b%a001240「お父さんは　国民のみんなから\n\t慕われているんだね。　すごいやっ！\n@c0@"
11:
  de: "@a%0%a001250@bDie Leute waren alle sehr traurig, als du nicht da warst. Darum haben wir ja auch alles getan, um dich so schnell wie möglich zu finden.\n@c0@"
  en: "@a%0%a001250@bPeople really were on tenterhooks waiting for you to come back. That's why we tried so hard to find you as fast as we could.\n@c0@"
  es: "@a%0%a001250@bLa gente te estaba esperando como agua de mayo. Por eso intentamos encontrarte lo antes posible.\n@c0@"
  fr: "@a%0%a001250@bLes gens étaient vraiment sur des charbons ardents en attendant ton retour. C'est pour ça qu'on a essayé de te retrouver le plus vite possible.\n@c0@"
  it: "@a%0%a001250@bCi siamo messi alla tua ricerca perché i sudditi di Denim volevano che tu tornassi a casa presto...\nE anche perché ti vogliamo bene, ovviamente.\n@c0@"
  ja: "@a@b%a001250「本当に　みんな　待ってたの。\n\tだから　わたし　はやく\n\tお父さんを　見つけなきゃって……。\n@c0@"
12:
  de: "@a%0%a001240@bDu warst noch nie am Geburtsort von Großmutter, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bYou've never been to Grandma's birthplace\nhave you, Dad?\n@c0@"
  es: "@a%0%a001240@bNunca has estado en el pueblo natal de la abuela, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bTu n'as jamais été dans le village natal\nde grand-mère, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, tu non sei mai stato nel villaggio dove è nata la nonna, vero?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さんは\n\tおばあちゃんの　ふるさとに\n\t行ったこと　ないんでしょ？\n@c0@"
13:
  de: "@a%0%a001240@bIch auch nicht. Vielleicht könnten wir ja zusammen dorthin gehen? Das wäre ein Spaß!\n@c0@"
  en: "@a%0%a001240@bNeither have I. So I was thinking that maybe it'd be fun if we could go together!\n@c0@"
  es: "@a%0%a001240@bYo tampoco. ¡Estaba pensando que sería divertido que fuésemos juntos!\n@c0@"
  fr: "@a%0%a001240@bMoi non plus. Je me disais que ça pourrait être drôle d'y aller ensembleⓠ\n@c0@"
  it: "@a%0%a001240@bNemmeno io, ma mi piacerebbe tanto visitarlo.\nChe ne diresti se ci andassimo insieme?\n@c0@"
  ja: "@a@b%a001240「ボクも　ないよ。\n\tだから　お父さんと\n\tいっしょに行くの　楽しみなんだ！\n@c0@"
14:
  de: "@a%0%a001250@bWir wollten eigentlich Steile Höh besuchen, aber erst mussten wir ja dich finden, Papa.\n@c0@"
  en: "@a%0%a001250@bWe wanted to visit Lofty Peak, but we had to find you first, Dad.\n@c0@"
  es: "@a%0%a001250@bQueríamos visitar Cumbre Excelsa, pero antes teníamos que encontrarte, papá.\n@c0@"
  fr: "@a%0%a001250@bOn voulait aller voir Haute-Cime, mais il fallait d'abord qu'on te retrouve, papa.\n@c0@"
  it: "@a%0%a001250@bVolevamo andare a Picco Maximo, ma prima dovevamo trovarti.\n@c0@"
  ja: "@a@b%a001250「わたしたち　エルヘブンにも\n\t行きたかったけど　お父さんを\n\t見つけるのが　先だと　思ったの。\n@c0@"
15:
  de: "@a%0%a001250@bWir haben uns gedacht, dass du auch zu Großmutters Geburtsstätte möchtest.\n@c0@"
  en: "@a%0%a001250@bWe knew you'd definitely want to go with us to Grandma's birthplace.\n@c0@"
  es: "@a%0%a001250@bSabíamos que querrías acompañarnos a la tierra natal de la abuela.\n@c0@"
  fr: "@a%0%a001250@bOn savait que tu voudrais absolument nous accompagner au village natal de grand-mère.\n@c0@"
  it: "@a%0%a001250@bAbbiamo pensato che anche tu volessi visitare il villaggio dove è nata la nonna...\n@c0@"
  ja: "@a@b%a001250「だって　おばあちゃんの\n\tふるさとなら　絶対　お父さんが\n\t行きたいって言うと思って……。\n@c0@"
16:
  de: "@a%0%a001240@bOnkel Bastl ist wirklich nett. Er steckt uns immer heimlich Süßigkeiten zu.\n@c0@"
  en: "@a%0%a001240@bUncle Bertie's really kind. He always gives us secret stashes of sweets.\n@c0@"
  es: "@a%0%a001240@bTío Agila es muy amable. Siempre tiene chuches escondidas para nosotros.\n@c0@"
  fr: "@a%0%a001240@bTonton Albert est vraiment gentil. Il nous donne toujours plein de bonbons en secret.\n@c0@"
  it: "@a%0%a001240@bLo zio Alberto è troppo simpatico, sai?\nE poi ci regala sempre un sacco di caramelle!\n@c0@"
  ja: "@a@b%a001240「オジロンおじさんって\n\tやさしいんだよ。　いつも\n\tナイショで　おかし　くれるんだ。\n@c0@"
17:
  de: "@a%0%a001250@bOnkel Bastl hätte schrecklich gerne Enkelkinder, aber Kusine Traudl meint, dass sie nie heiraten würde.\n@c0@"
  en: "@a%0%a001250@bUncle Bertie really wants grandchildren, but Cousin Gertie says she's never getting married.\n@c0@"
  es: "@a%0%a001250@bTío Agila tiene muchas ganas de tener nietos, pero la prima Frede dice que no se quiere casar.\n@c0@"
  fr: "@a%0%a001250@bTonton Albert a très envie d'avoir des\npetits-enfants, mais cousine Gégé dit\nqu'elle ne se mariera jamais.\n@c0@"
  it: "@a%0%a001250@bLo zio Alberto vorrebbe avere dei nipoti, ma nostra cugina Gertrude dice che non si sposerà mai!\n@c0@"
  ja: "@a@b%a001250「オジロンおじさんったら\n\tマゴがほしいのに　ドリスが　ぜんぜん\n\t結婚してくれないって　言うの。\n@c0@"
18:
  de: "@a%0%a001250@bEigentlich schade...\n@c0@"
  en: "@a%0%a001250@bIt's all a bit of a puzzle, really.\n@c0@"
  es: "@a%0%a001250@bEs todo muy confuso, la verdad.\n@c0@"
  fr: "@a%0%a001250@bJe n'y comprends vraiment rien.\n@c0@"
  it: "@a%0%a001250@bChissà, forse cambierà idea quando diventerà più grande...\n@c0@"
  ja: "@a@b%a001250「でも　そんなこと\n\tわたしに言われても　困るよね。\n@c0@"
19:
  de: "@aSancho@bSi, es ist wahr...\nAlles hat angefangen, als siss Señor Ludwig verlaufen hat und in Steile Höh gelandet ist.\n@c0@"
  en: "@aSancho@bSí, ees true...\r\nEverytheeng, eet estarts when señor Pankraz, he was lost and he estumbled upon Lofty Peak.\n@c0@"
  es: "@aSancho@bSí, es verdad...\r\nTodo empezó con el señor Teudis, que se perdió y apareció sin quererlo en Cumbre Excelsa.\n@c0@"
  fr: "@aSancho@bSi, c'est vrai... T-Tout a commencé quand le señor\r\nP-Petros s'est perdu et qu'il est t-t-tombé par hasard sur Haute-Cime.\n@c0@"
  it: "@aSancho@bLa storia cominciò cuando el señor Russel se perse y arrivò al villaggios de Picco Maximo...\n@c0@"
  ja: "@a@bサンチョ「思えば　パパスさまが\n\tエルヘブンに　迷いこまれたことが\n\tすべての　始まりだったのかも……。\n@c0@"
20:
  de: "@aOtto@bPrinz Sebastian ist ein guter und aufrichtiger Mann. Er ist sehr beliebt beim Volk.\n@c0@"
  en: "@aTuppence@bPrince Albert is a cheery, kind-hearted man.\r\nYes, he's very popular with the people.\n@c0@"
  es: "@aAlazar@bAgila es un hombre alegre y bondadoso.\r\nLa gente le quiere mucho.\n@c0@"
  fr: "@aInnocent@bLe prince Albert est un homme bon et jovial.\r\nOui, il est vraiment très aimé de son peuple.\n@c0@"
  it: "@aSimon@bIl principe Alberto è una persona buona e generosa.\nStimo molto Sua Altezza il Principe Reggente.\n@c0@"
  ja: "@a@bピピン「オジロンさまは　気さくで\n\tおやさしくて　民たちにも\n\t大変　人気が　おありですよ。\n@c0@"
21:
  de: "@a%0%a001240@bLeider haben wir den Stolosstab nicht mehr.\n@c0@"
  en: "@a%0%a001240@bWe don't have Stolos' staff any more.\n@c0@"
  es: "@a%0%a001240@bYa no tenemos el báculo de Stolas.\n@c0@"
  fr: "@a%0%a001240@bOn n'a plus le bâton de Stolos.\n@c0@"
  it: "@a%0%a001240@bPurtroppo non abbiamo più la bacchetta di Stolos...\n@c0@"
  ja: "@a@b%a001240「ストロスの杖は\n\tなくなっちゃったけど……\n@c0@"
22:
  de: "@a%0%a001240@bAber wir werden es trotzdem schaffen, Mama und Großmutter zu retten.\n@c0@"
  en: "@a%0%a001240@bBut I'm sure we'll still be able to rescue Mum and Grandma if we put our minds to it!\n@c0@"
  es: "@a%0%a001240@b¡Pero seguro que aún podremos rescatar a mamá y a la abuela si nos empeñamos!\n@c0@"
  fr: "@a%0%a001240@bMais je suis sûr qu'on arrivera quand même à sauver maman et grand-mère si on se creuse\nun peu la têteⓠ\n@c0@"
  it: "@a%0%a001240@bMa sono certo che, impegnandoci al massimo, riusciremo a salvare mamma e nonna!\n@c0@"
  ja: "@a@b%a001240「ボク　お父さんとなら\n\tぜったい　お母さんも　おばあちゃんも\n\t助けられると思うんだ！\n@c0@"
23:
  de: "@a%0%a001250@bWir sind schon acht Jahre alt, Papa. Wir können dir also bei vielen Sachen helfen.\n@c0@"
  en: "@a%0%a001250@bWe're eight years old already, Dad. That means we can do lots of things to help you.\n@c0@"
  es: "@a%0%a001250@bYa tenemos ocho años, papá. Podemos ayudarte de muchas formas.\n@c0@"
  fr: "@a%0%a001250@bOn a déjà huit ans, papa. Ça veut dire qu'on peut faire plein de choses pour t'aider.\n@c0@"
  it: "@a%0%a001250@bPapà, noi abbiamo già otto anni, sai?\nNon siamo più dei bambini!\nPotremo aiutarti in tanti modi!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tわたしたち　もう　８才になったのよ。\n\tいっぱい　お手伝いしてあげるね。\n@c0@"
24:
  de: "@a%0%a001240@bSancho ist ganz schön stark, weißt du.\n@c0@"
  en: "@a%0%a001240@bSancho's pretty strong, you know.\n@c0@"
  es: "@a%0%a001240@bSancho es muy fuerte, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bSancho est plutôt fort, tu sais.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho è molto forte, sai?\n@c0@"
  ja: "@a@b%a001240「サンチョって\n\tけっこう　強いんだよ。\n@c0@"
25:
  de: "@a%0%a001240@bAllerdings ist er immer schnell außer Atem...\n@c0@"
  en: "@a%0%a001240@bHe does get out of breath quite quickly\nnowadays, though.\n@c0@"
  es: "@a%0%a001240@bAunque últimamente se queda pronto sin aliento...\n@c0@"
  fr: "@a%0%a001240@bMais il s'essouffle assez vite, maintenant.\n@c0@"
  it: "@a%0%a001240@bPerò si stanca subito.\nSecondo me sta diventando vecchio...\n@c0@"
  ja: "@a@b%a001240「でも　最近は　すぐに\n\tゼイゼイと　息切れしちゃうように\n\tなっちゃったんだ。\n@c0@"
26:
  de: "@a%0%a001250@bWir waren die ganze Zeit mit Sancho zusammen, und er hat uns eine Menge beigebracht.\n@c0@"
  en: "@a%0%a001250@bWe travelled all over with Sancho, and he taught us all sorts of things.\n@c0@"
  es: "@a%0%a001250@bHemos viajado con Sancho por todas partes y nos ha enseñado muchas cosas.\n@c0@"
  fr: "@a%0%a001250@bOn a voyagé partout avec Sancho et il nous a appris plein de trucs.\n@c0@"
  it: "@a%0%a001250@bAbbiamo viaggiato tanto insieme allo zio Sancho, sai?\nCi ha insegnato tantissime cose!\n@c0@"
  ja: "@a@b%a001250「わたしたち　サンチョと\n\t何度も　旅をして　いろいろなことを\n\t教えてもらったのよ。\n@c0@"
27:
  de: "@a%0%a001250@bEr war auch dabei, als wir den Stolosstab gefunden haben.\n@c0@"
  en: "@a%0%a001250@bWe were with him that time we found Stolos'\nstaff too.\n@c0@"
  es: "@a%0%a001250@bY, cuando encontramos el báculo de Stolas, estábamos con él.\n@c0@"
  fr: "@a%0%a001250@bEt c'est aussi avec lui qu'on a trouvé le bâton de Stolos.\n@c0@"
  it: "@a%0%a001250@bÈ stato lui a trovare la bacchetta di Stolos.\n@c0@"
  ja: "@a@b%a001250「ストロスの杖を　さがすときも\n\tいっしょに　行ったんだから。\n@c0@"
28:
  de: "@aOtto@bSancho ist eine kleine Berühmtheit hier in Humburg. Ein treuer Anhänger des Königshauses!\n@c0@"
  en: "@aTuppence@bSancho's quite a hero here in Gotha, you know.\r\nA loyal royal servant!\n@c0@"
  es: "@aAlazar@bSancho es un héroe aquí, en Pankraz.\r\n¡Un servidor leal del Rey!\n@c0@"
  fr: "@aInnocent@bSancho est un héros ici, à Gotha, vous savez.\nUn serviteur royal on ne peut plus loyalⓠ\n@c0@"
  it: "@aSimon@bSancho è un vero eroe a Denim.\nÈ considerato il più fedele tra tutti gli aiutanti della famiglia reale!\n@c0@"
  ja: "@a@bピピン「サンチョさんって　かつて\n\tグランバニアに　その人あり\n\tといわれたほどの　うで前とか……。\n@c0@"
29:
  de: "@aOtto@bAnscheinend hat der vorherige König großes Vertrauen in ihn g'habt. Ich hoff', dass ich mir eines Tages auch solch einen Ruf erarbeiten kann.\n@c0@"
  en: "@aTuppence@bThe previous king placed great trust in him, apparently. I hope I have a reputation like that one day too.\n@c0@"
  es: "@aAlazar@bParece que el anterior rey confiaba mucho en él. Espero que algún día yo también tenga tan buena reputación.\n@c0@"
  fr: "@aInnocent@bLe roi précédent lui accordait une grande confiance, apparemment. J'espère avoir un jour une réputation comme la sienne, moi aussi.\n@c0@"
  it: "@aSimon@bEra addirittura il braccio destro del nostro precedente sovrano. Spero che un giorno anch'io avrò il privilegio di servire personalmente il Re.\n@c0@"
  ja: "@a@bピピン「先代の王からも　絶大なる信頼を\n\tおかれていたみたいだし……。\n\tボクも　いつか　そうなりたいですね。\n@c0@"
30:
  de: "@a%0%a001250@bWenn es oben im Himmel gar kein Schloss mehr gibt, ist es wahrscheinlich runtergefallen, oder? Und was ist, wenn es in tausend Stücke zerschellt ist?\n@c0@"
  en: "@a%0%a001250@bIf there's no castle up in the sky any more, does\nthat mean it fell down? What if it broke into lots of little pieces?\n@c0@"
  es: "@a%0%a001250@bSi ya no hay ningún castillo en el cielo, ¿quiere decir que se cayó? ¿Y si se hizo añicos, qué?\n@c0@"
  fr: "@a%0%a001250@bS'il n'y a plus de château dans le ciel, ça veut\ndire qu'il est tombéⓡ Et s'il s'était cassé en\nmille morceauxⓡ\n@c0@"
  it: "@a%0%a001250@bSe il Castello di Zenithia non fluttua più in cielo, forse vuol dire che è caduto...\nForse ora sarà ridotto in frantumi... Che peccato!\n@c0@"
  ja: "@a@b%a001250「天空のお城が　ないってことは\n\t落ちちゃったの？\n\tこなごなに　こわれたら　どうしよう。\n@c0@"
31:
  de: "@aSancho@bSi. Eine Señorita von Zenithia ist hierhin ins Castillo gekommen, als sie siss verlaufen hatte. Darum hat Señor Ludwig auch die Suche angeordnet.\n@c0@"
  en: "@aSancho@bSí. One Zenithian señorita, eshe came here to the castle when eshe was lost. Thees ees why señor Pankraz ordered the researches to be done.\n@c0@"
  es: "@aSancho@bSí. Una señorita de Zenithia, se perdió y acudió al castillo. Por eso el señor Teudis ordenó que se iniciase esa investigación.\n@c0@"
  fr: "@aSancho@bSi. Oune señorita zénithienne est venue ici, au château, p-parce qu'elle était p-perdue. C'est pour ça que le señor Petros a ordonné ces recherches.\n@c0@"
  it: "@aSancho@bMucho tiempo fa, una señorita de Zenithia se perse y arrivò al castillo. Es por esto motivo que el señor Russel ordinò de compiere ricercas su Zenithia...\n@c0@"
  ja: "@a@bサンチョ「パパスさまが　天空城について\n\t研究させたのは　この城に　天空人が\n\t迷いこんできてからなのです。\n@c0@"
32:
  de: "@aSancho@bWeißt du, diese Señorita musste hier in Humburg bleiben, weil sie nisst wusste, wie sie nach Hause kommt. Das ist ja so traurig...\n@c0@"
  en: "@aSancho@bYou know, thees Zenithian señorita, eshe estay here een Gotha because eshe no know how to go home. Ees, ees eso esad...\n@c0@"
  es: "@aSancho@bEsa pobre señorita de Zenithia se quedó aquí en Pankraz pues porque no sabía volver a casa, ¡híjole! Qué triste... Snif...\n@c0@"
  fr: "@aSancho@bVous savez, cette s-señorita zénithienne reste à Gotha parce qu'elle ne s-sait pas comment rentrer chez elle. C'est très t-t-triste...\n@c0@"
  it: "@aSancho@bLa señorita zenithiana es rimasta a Denim por qué no sabeva como tornare a casa...\n@c0@"
  ja: "@a@bサンチョ「天空城が見つからず\n\t帰れない天空人を　この城に\n\t住まわせ　お世話しておられました。\n@c0@"
33:
  de: "@a%0%a001240@bDieser Soldat hat noch nie mit mir gespielt. Er steht immer nur da und hält Wache ⓚⓛ echt langweilig!\n@c0@"
  en: "@a%0%a001240@bI can never get that soldier to play with me. He always just stands there on guard, and he won't stop concentrating even for a second.\n@c0@"
  es: "@a%0%a001240@bEse soldado nunca quiere jugar conmigo. Está siempre ahí de pie, haciendo guardia, y no pierde su concentración ni un momento.\n@c0@"
  fr: "@a%0%a001240@bCe soldat ne veut jamais jouer avec moi. Il monte toujours la garde ici et ne se déconcentre jamais, même pas une seconde.\n@c0@"
  it: "@a%0%a001240@bVorrei tanto giocare con quel soldato, ma lui dice che non può distrarsi nemmeno per un istante, perché deve fare la guardia!\n@c0@"
  ja: "@a@b%a001240「あのおじさんは　ぜんぜん\n\t遊んでくれないんだよ。\n\tいっつも　まじめに　立ってるんだ。\n@c0@"
34:
  de: "@a%0%a001240@bEigentlich darf ich gar nicht hierhin, weil es gefährlich ist und so.\n@c0@"
  en: "@a%0%a001240@bI'm not supposed to come up here because\nit's dangerous.\n@c0@"
  es: "@a%0%a001240@bSe supone que no debo subir aquí porque es peligroso.\n@c0@"
  fr: "@a%0%a001240@bNormalement, je n'ai pas le droit de venir ici\nparce que c'est dangereux.\n@c0@"
  it: "@a%0%a001240@bDi solito non mi è permesso venire qui, perché questo è un posto pericoloso per un bambino.\n@c0@"
  ja: "@a@b%a001240「ここは　危ないから\n\t上がってきちゃダメだって……。\n@c0@"
35:
  de: "@a%0%a001240@bAber du bist ja heute bei mir, also kann keiner was sagen.\n@c0@"
  en: "@a%0%a001240@bBut you're with me today, so no one can tell me off.\n@c0@"
  es: "@a%0%a001240@bPero, como hoy estás conmigo, nadie puede regañarme.\n@c0@"
  fr: "@a%0%a001240@bMais aujourd'hui tu es avec moi, alors personne ne peut me disputer.\n@c0@"
  it: "@a%0%a001240@bPerò oggi siamo insieme e nessuno può dirmi di andare via.\n@c0@"
  ja: "@a@b%a001240「でも　今日は\n\tお父さんと　いっしょだから\n\tなにも　言われないねっ。\n@c0@"
36:
  de: "@a%0%a001250@bIch bin oft hierher gekommen, um die Aussicht zu genießen...\n@c0@"
  en: "@a%0%a001250@bI used to like sneaking up here to look at the view.\n@c0@"
  es: "@a%0%a001250@bAntes me gustaba escaparme aquí arriba para ver el panorama.\n@c0@"
  fr: "@a%0%a001250@bJ'aimais bien venir ici en cachette pour regarder\nle paysage.\n@c0@"
  it: "@a%0%a001250@bA volte venivo qui di nascosto...\n@c0@"
  ja: "@a@b%a001250「わたしは　こっそり　ここに来て\n\t景色を見ているのが　好きだったの。\n@c0@"
37:
  de: "@a%0%a001250@b... Und habe mich gefragt, wo du und Mama wohl seid...\n@c0@"
  en: "@a%0%a001250@bI'd stand here and wonder where in the world you and Mum might be.\n@c0@"
  es: "@a%0%a001250@bMientras contemplaba el paisaje, me preguntaba dónde podíais estar mamá y tú.\n@c0@"
  fr: "@a%0%a001250@bJe restais là, à me demander où maman et toi vous pouviez bien être.\n@c0@"
  it: "@a%0%a001250@bRestavo qui per ore e ore, chiedendomi dove foste tu e la mamma...\n@c0@"
  ja: "@a@b%a001250「お父さんとお母さんが\n\tこの世界の　どこかに\n\tいるんだなって……。\n@c0@"
38:
  de: "@aOtto@bIch liebe dieses Königreich, wisst Ihr. Ich würd' einfach alles tun, um es zu verteidigen.\n@c0@"
  en: "@aTuppence@bI adore this kingdom, you know. I'd do absolutely anything to defend it if I had to.\n@c0@"
  es: "@aAlazar@bAdoro este reino. Haría cualquier cosa para defenderlo.\n@c0@"
  fr: "@aInnocent@bJ'adore ce royaume, vous savez. S'il le fallait, je serais prêt à tout pour le défendre.\n@c0@"
  it: "@aSimon@bAmo la mia patria.\nFarei di tutto per difenderla. Sono pronto a dare la mia vita per Denim, se ce ne sarà bisogno.\n@c0@"
  ja: "@a@bピピン「ボクは　この国が　好きです。\n\tこの国を守るためなら\n\tいくらでも　たたかいますよ！\n@c0@"
39:
  de: "@a%0%a001240@bIch bin mal an der Burgmauer hochgeklettert, weil ich sehen wollte, wie hoch ich komme.\n@c0@"
  en: "@a%0%a001240@bI had a go at climbing the castle walls a while back to see how high I could get.\n@c0@"
  es: "@a%0%a001240@bNo hace mucho intenté escalar los muros del castillo para ver hasta dónde era capaz de llegar.\n@c0@"
  fr: "@a%0%a001240@bIl y a longtemps, j'ai essayé d'escalader les\nmurailles du château pour voir jusqu'à\nquelle hauteur j'arriverais.\n@c0@"
  it: "@a%0%a001240@bUn po' di tempo fa ho provato a scalare le mura del castello, per vedere se riuscivo ad arrivare fino in cima.\n@c0@"
  ja: "@a@b%a001240「この前　お城のカベを\n\tどこまで　のぼれるか\n\tちょうせんしてみたんだ！\n@c0@"
40:
  de: "@a%0%a001240@bIch hab aber nur den zweiten Stock erreicht, dann musste ich wieder runter, weil mich jemand gesehen hatte...\n@c0@"
  en: "@a%0%a001240@bBut, just as I cleared the second floor, I was spotted and told to get down.\n@c0@"
  es: "@a%0%a001240@bPero me descubrieron nada más pasar del segundo piso y me mandaron que bajase.\n@c0@"
  fr: "@a%0%a001240@bMais quelqu'un m'a vu au moment où je dépassais le deuxième étage et on m'a ordonné de redescendre.\n@c0@"
  it: "@a%0%a001240@bPerò, quando raggiunsi il secondo piano, mi videro e mi ordinarono di scendere giù.\n㈡\nChe peccato...\nSe non mi avessero fermato, sarei riuscito a raggiungere la vetta!\n@c0@"
  ja: "@a@b%a001240「２階まで　のぼったところで\n\tおばさんに　見つかって\n\tおろされちゃった！\n@c0@"
41:
  de: "@a%0%a001250@bIch find's schön in der Burg, aber am liebsten bin ich draußen.\n@c0@"
  en: "@a%0%a001250@bI like being indoors too, but I really love\nbeing outside.\n@c0@"
  es: "@a%0%a001250@bNo es que no me guste estar dentro de casa, pero estar fuera me encanta.\n@c0@"
  fr: "@a%0%a001250@bJ'aime bien être à l'intérieur aussi, mais ce que je préfère, c'est être dehors.\n@c0@"
  it: "@a%0%a001250@bAdoro star fuori ad ascoltare il cinguettio degli uccellini!\n@c0@"
  ja: "@a@b%a001250「わたしは\n\tお部屋の中も好きだけど\n\t外にいるほうが　ずっと好き！\n@c0@"
42:
  de: "@a%0%a001250@bEs ist doch wunderbar, all den kleinen Vögeln zuzuhören.\n@c0@"
  en: "@a%0%a001250@bIt's such good fun hearing all the little birds chatter away to each other.\n@c0@"
  es: "@a%0%a001250@bEs muy divertido oír a los pajaritos hablarse unos a otros.\n@c0@"
  fr: "@a%0%a001250@bC'est vraiment amusant d'écouter tous les petits oiseaux se parler entre eux.\n@c0@"
  it: "@a%0%a001250@bSono così carini!\nVederli volare in cielo mi mette allegria!\n@c0@"
  ja: "@a@b%a001250「小鳥さんたちの\n\tおしゃべりって　楽しいのよ。\n@c0@"
43:
  de: "@aSancho@bIss weiß noch genau, wie Señor Ludwig das Castillo verlassen und Señora Magda den Hof gemacht hat.\n@c0@"
  en: "@aSancho@bI remember the time señor Pankraz, he leave thees castle to go and look for señora Mada.\n@c0@"
  es: "@aSancho@bRecuerdo cuando el señor Teudis partió del castillo para ir en busca de la señora Perséfone.\n@c0@"
  fr: "@aSancho@bJe me r-rappelle la fois où le señor Petros a\r\nq-q-quitté ce château pour partir à la recherche\r\nde la señora Magdalena.\n@c0@"
  it: "@aSancho@bMe recuerdo el día que el señor Russel lasciò el castillo por andare alla ricerca della señora Mada...\n@c0@"
  ja: "@a@bサンチョ「かつて　パパスさまは\n\tこの城を出て　マーサさまをさがしに\n\t旅立たれました。\n@c0@"
44:
  de: "@aSancho@bUnd jetzt bist du an der Reihe, Chico... Das ist wohl Schicksal, si? Und es ist meine Schicksal, mit dir zu gehen.\n@c0@"
  en: "@aSancho@bAnd now ees, ees my friend's turn...\r\nThees ees fate, sí? And ees my fate to\r\ngo weeth you.\n@c0@"
  es: "@aSancho@bY ahora le toca a mi chamaquito...\r\nEs el destino, ¿verdad? Y mi destino es ir contigo, ándale.\n@c0@"
  fr: "@aSancho@bEt maintenant, c'est au tour de mon petit niño...\nC'est le d-destin, noⓡ Et c'est mon d-d-destin\nà moi de t'accompagner.\n@c0@"
  it: "@aSancho@bY ahora tocca a ti andare alla ricerca della tua mujer. Sì, esto es el tuo destino.\n¡Y el mio es de venir contigo!\n@c0@"
  ja: "@a@bサンチョ「そして今　坊っちゃんも……。\n\tこれが運命ならば　このサンチョ\n\tどこまででも　お供しますよ！\n@c0@"
45:
  de: "@aOtto@bBevor ich Euch zugeteilt wurde, hab ich immer auf dem Burggelände patrouilliert.\n@c0@"
  en: "@aTuppence@bIt used to be my duty to patrol the castle grounds. Before I was assigned to travel with you, that is.\n@c0@"
  es: "@aAlazar@bAntes solía tener asignada la misión de patrullar los terrenos del castillo. Eso fue antes de acompañaros en vuestros viajes, claro.\n@c0@"
  fr: "@aInnocent@bAvant d'être affecté à vos côtés, j'étais chargé de patrouiller à l'intérieur du château.\n@c0@"
  it: "@aSimon@bDa quando sono nell'esercito di Denim, ho sempre svolto mansioni di guardia di palazzo.\n@c0@"
  ja: "@a@bピピン「ずっと　お城の見まわりが\n\tボクの仕事だったんです。\n\tそれが今は　みなさんと旅を。\n@c0@"
46:
  de: "@aOtto@bIch muss leider zugeben, dass ich ziemlich nervös bin. Hoffentlich werd' ich Euch auch von Nutzen sein.\n@c0@"
  en: "@aTuppence@bI must admit that I am rather nervous. I do hope that I'll be of some use to you.\n@c0@"
  es: "@aAlazar@bDebo admitir que estoy un poco nervioso. Espero ser de alguna utilidad.\n@c0@"
  fr: "@aInnocent@bJe dois reconnaître que je suis plutôt nerveux. J'espère vraiment que je vous serai utile.\n@c0@"
  it: "@aSimon@bQuesto mio nuovo ruolo di ⓕScorta del Reⓖ mi mette un po' d'ansia... Spero di essere all'altezza dell'incarico che mi è stato affidato.\n@c0@"
  ja: "@a@bピピン「うーん　きんちょうするなあっ。\n\tボク　絶対　お役に立ちますからね！\n@c0@"
47:
  de: "@a%0%a001240@bÄhm, du hast gar nicht so viel Geld, nicht wahr, Papa? Aber keine Sorge, du brauchst mir nichts zu kaufen...\n@c0@"
  en: "@a%0%a001240@bUm, you don't have all that much money, right, Dad? So don't worry about buying anything for me,\nwill you?\n@c0@"
  es: "@a%0%a001240@bNo tienes demasiado dinero, ¿verdad, papá? Entonces no hace falta que me compres nada, de verdad.\n@c0@"
  fr: "@a%0%a001240@bHum, tu n'as pas beaucoup d'argent, hein, papaⓡ Alors ne t'embête pas à m'acheter des choses, d'accordⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, credo che tu non abbia molti soldi in questo momento... Non comprarmi regali inutili, ma risparmia per le cose veramente necessarie. Va bene?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん\n\tあんまり　お金ないでしょ？\n\tボクのお買い物はしなくていいからね。\n@c0@"
48:
  de: "@a%0%a001250@bDas Geld des Königreichs stammt vom Volk und es muss auch für das Volk ausgegeben werden, wenn ich das richtig verstanden habe.\n@c0@"
  en: "@a%0%a001250@bThe kingdom's money comes from the kingdom's people and it has to be used for them, apparently.\n@c0@"
  es: "@a%0%a001250@bEl dinero del reino viene de sus súbditos y debe usarse en su beneficio, al parecer.\n@c0@"
  fr: "@a%0%a001250@bL'argent du royaume vient de son peuple et doit\nêtre utilisé pour lui, apparemment.\n@c0@"
  it: "@a%0%a001250@bIl denaro che arriva dalle tasse pagate dai sudditi di Denim dovrebbe essere speso per il bene del Regno...\n@c0@"
  ja: "@a@b%a001250「国のお金は\n\t国民のお金だから　みんなのために\n\tつかうものなんだって……\n@c0@"
49:
  de: "@a%0%a001250@bDarum mussten wir auch immer sparen und unser eigenes Geld ausgeben, wenn wir mal etwas wollten...\n@c0@"
  en: "@a%0%a001250@bIf we ever wanted anything for ourselves, we always had to save up and buy it with our own money.\n@c0@"
  es: "@a%0%a001250@bSi alguna vez queríamos algo para nosotros, teníamos que ahorrar y comprarlo con nuestro propio dinero.\n@c0@"
  fr: "@a%0%a001250@bSi on voulait quelque chose pour nous, on devait toujours économiser et se l'acheter avec notre propre argent.\n@c0@"
  it: "@a%0%a001250@bSe avremo bisogno di armi o di oggetti per uso personale, dovremo comprarli con i nostri soldi.\n@c0@"
  ja: "@a@b%a001250「だから　ほしいものは\n\tわたしたち　自分のお金を\n\tためて買っていたのよ。\n@c0@"
50:
  de: "@a%0%a001240@bGroßartig! Das wird ein Spaß, zusammen auf Reisen zu gehen, Papa!\n@c0@"
  en: "@a%0%a001240@bBrilliant! It'll be fun travelling around together\nagain, Dad.\n@c0@"
  es: "@a%0%a001240@b¡Genial! Será divertido volver a viajar contigo, papi.\n@c0@"
  fr: "@a%0%a001240@bSuperⓠ Ça va être marrant de voyager enfin\navec toi, papa.\n@c0@"
  it: "@a%0%a001240@bChe meraviglia!\nPapà, sarà bellissimo viaggiare insieme a te!\n@c0@"
  ja: "@a@b%a001240「やったねっ。\n\tお父さんと　また　いっしょに\n\t行けるなんて　うれしいな！\n@c0@"
51:
  de: "@a%0%a001250@bJuchhu! Danke, Papa. Ich werde dich auch nicht enttäuschen.\n@c0@"
  en: "@a%0%a001250@bYay! Thanks, Dad. I won't let you down.\n@c0@"
  es: "@a%0%a001250@b¡Bien! Gracias, papi. No te defraudaré.\n@c0@"
  fr: "@a%0%a001250@bOuaisⓠ Merci, papa. Tu pourras compter sur moi.\n@c0@"
  it: "@a%0%a001250@bEvviva!\nVedrai che non ti deluderò, papà!\n@c0@"
  ja: "@a@b%a001250「うれしいっ\n\tお父さん　ありがとう。\n\tわたし　がんばるね。\n@c0@"
52:
  de: "@aSancho@bGracias, Chico. Es ist so schön, wieder mit dir reisen zu können. Olé! Lass uns aufbrechen!\n@c0@"
  en: "@aSancho@bGracias, friend. Ees eso good to be travelling together again. Olé! Let's go!\n@c0@"
  es: "@aSancho@bGracias, chamaco. Es padrísimo volver a viajar juntos. ¡En marcha!\n@c0@"
  fr: "@aSancho@bGracias, chico. C'est b-b-bien de voyager à\nnouveau ensemble. Oléⓠ Allons-yⓠ\n@c0@"
  it: "@aSancho@b¡Gracias, chico!\n¡Yo soy muy feliz de viaggiare contigo!\n¡Vamonos!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　私を\n\t仲間に　入れてくださるんですね。\n\tそれでは　はりきって　行きますぞ！\n@c0@"
53:
  de: "@aOtto@bEs ist mir eine Ehre, in Eurem Dienst zu stehen, Eure Majestät.\nIch werd' Euch bestimmt keine Last sein!\n@c0@"
  en: "@aTuppence@bIt's an honour to be summoned, Your Majesty.\r\nI'll endeavour not to be a burden to you.\n@c0@"
  es: "@aAlazar@bEs un honor que me haya llamado, Majestad.\r\nProcuraré no representar una carga para vos.\n@c0@"
  fr: "@aInnocent@bC'est un honneur d'être convoqué, Votre Majesté.\r\nJe ferai tout mon possible pour ne pas être un fardeau pour vous.\n@c0@"
  it: "@aSimon@bMaestà, sono onorato che lei mi abbia scelto.\nFarò del mio meglio per non deluderla!\n@c0@"
  ja: "@a@bピピン「呼んでいただけて　光栄です。\n\t足をひっぱらないように\n\tがんばらせていただきますっ！\n@c0@"
54:
  de: "@a%0%a001240@bSancho meint, er sei ziemlich stark, deshalb könne er auch so viel vertragen beim Trinken. Bedeutet das etwa, dass dieser Mann da schwach ist?\n@c0@"
  en: "@a%0%a001240@bSancho says he's really strong when it comes to drinking. Does that man's head hurt because he's\ntoo weak?\n@c0@"
  es: "@a%0%a001240@bSancho dice que es muy resistente bebiendo. Si a ese hombre le duele la cabeza, ¿es porque es un débil?\n@c0@"
  fr: "@a%0%a001240@bSancho dit qu'il est vraiment fort quand il s'agit de boire. Est-ce que ce monsieur a mal à la tête parce qu'il n'est pas assez fortⓡ\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non ha mai mal di testa.\nVuol dire che è più forte di quell'uomo? Oppure significa che va sempre a dormire con le galline?\n@c0@"
  ja: "@a@b%a001240「サンチョは　お酒が\n\t強いんだって！　…ということは\n\tあの人は　お酒に負けたの？\n@c0@"
55:
  de: "@aOtto@bAlso ehrlich! Hat dieser Kerl denn gar kein Schamgefühl, so etwas vor dem König höchstpersönlich zuzugeben?!\n@c0@"
  en: "@aTuppence@bHonestly! Does the man have no shame, admitting to such a thing in the presence of His Majesty!?\n@c0@"
  es: "@aAlazar@b¡Hay que ver! ¡¿Es que no le da vergüenza a ese hombre admitir una cosa así en presencia de Su Majestad?!\n@c0@"
  fr: "@aInnocent@bFranchementⓠ Cet homme n'a donc aucune honteⓠⓑ Tenir ce genre de propos en présence de\nSa Majesté...\n@c0@"
  it: "@aSimon@bAh, che vergogna!\nMaestà, non tema! Io non marcherò mai visita per aver fatto tardi la notte precedente!\n@c0@"
  ja: "@a@bピピン「もうっ！\n\t王さまの前だっていうのに\n\tいつまでも　だらしないヤツだなあ。\n@c0@"
56:
  de: "@a%0%a001250@bIch glaube, ich werde nie etwas trinken, wenn ich danach so aussehe! Auch nicht, wenn ich groß bin.\n@c0@"
  en: "@a%0%a001250@bIf that's what happens, then there's no way I'm ever going to drink, even when I'm all grown up.\n@c0@"
  es: "@a%0%a001250@bSi eso es lo que te pasa, no probaré nunca la bebida, ni siquiera cuando sea mayor.\n@c0@"
  fr: "@a%0%a001250@bSi c'est ça le résultat, pas question que je boive, même une fois que je serai grande.\n@c0@"
  it: "@a%0%a001250@bSe è così che ci si sente la mattina dopo aver fatto tardi, me ne andrò sempre a dormire presto, anche quando sarò grande!\n@c0@"
  ja: "@a@b%a001250「わたし　あんなふうになるなら\n\tおとなになっても　ぜったい\n\tお酒を　飲まないわ。\n@c0@"
57:
  de: "@a%0%a001240@bKanzler Konrad war ein böser Mann, nicht wahr?\nWas? Er wurde getötet?! Das nennt man Pech...\n@c0@"
  en: "@a%0%a001240@bChancellor Jeeves was a bad man, wasn't he?\n...No way! He was killed!? That's a bit unlucky.\n@c0@"
  es: "@a%0%a001240@bEl canciller Ambrosio era una mala persona, ¿a que sí?\n¡No! ¡¿Que lo mataron?! Vaya, qué mala suerte.\n@c0@"
  fr: "@a%0%a001240@bLe chancelier Tiquette était méchant, heinⓡ\n... Non, c'est vraiⓡ Il a été tuéⓠⓑ C'est pas de bol.\n@c0@"
  it: "@a%0%a001240@bHo sentito dire che il ministro Ligio è stato ucciso.\nAnche se era un uomo cattivo, mi dispiace che sia morto...\n@c0@"
  ja: "@a@b%a001240「大臣って悪い人だったんでしょ？\n\t……えっ？　殺されちゃったの？\n\tそれは　ちょっとかわいそうだね……。\n@c0@"
58:
  de: "@a%0%a001250@bIch dachte, das wäre immer schon Onkel Bastls Gemach gewesen.\n@c0@"
  en: "@a%0%a001250@bI thought this was Uncle Bertie's room from ages ago.\n@c0@"
  es: "@a%0%a001250@bPensaba que esta era la antigua habitación del tío Agila.\n@c0@"
  fr: "@a%0%a001250@bJe croyais que cette pièce était la chambre de\ntonton Albert depuis déjà longtemps.\n@c0@"
  it: "@a%0%a001250@bCredevo che questi fossero sempre stati gli alloggi dello zio Alberto, sai?\n@c0@"
  ja: "@a@b%a001250「ここって　ずっと前から\n\tオジロンおじさんたちの\n\tお部屋だったんだって　思ってた……。\n@c0@"
59:
  de: "@aOtto@bSeit diesem Gfrett mit dem Kanzler geht's auf der Burg überaus friedlich zu.\n@c0@"
  en: "@aTuppence@bIt's been as peaceful as can be here at the castle ever since that debacle with the Chancellor.\n@c0@"
  es: "@aAlazar@bDesde la debacle del Canciller ha reinado la calma en el castillo.\n@c0@"
  fr: "@aInnocent@bTout est paisible au château désormais, depuis ce qui s'est passé avec le chancelier.\n@c0@"
  it: "@aSimon@bDa quando il ministro Ligio è scomparso dal Castello di Denim, non abbiamo più avuto problemi di nessun genere.\n@c0@"
  ja: "@a@bピピン「大臣のことがあってから\n\tこのお城は　ウソのように\n\tずっと平和でした。\n@c0@"
60:
  de: "@a%0%a001240@bIch war selten hier, aber %a001250 schon, sie hat hier oft gespielt.\n@c0@"
  en: "@a%0%a001240@bI didn't used to hang out much here, but %a001250 would come and play here quite often.\n@c0@"
  es: "@a%0%a001240@bYo no solía venir mucho por aquí, pero %a001250 venía a jugar a menudo.\n@c0@"
  fr: "@a%0%a001240@bMoi, je ne traînais pas souvent par ici, mais %a001250 venait y jouer assez souvent.\n@c0@"
  it: "@a%0%a001240@bOgni tanto %a001250 veniva qui a giocare, sai?\n@c0@"
  ja: "@a@b%a001240「ボクは　あまり\n\tこの部屋には　遊びに来なかったけど\n\t%a001250は　よく　来てたみたいだよ。\n@c0@"
61:
  de: "@a%0%a001250@bKusine Traudl hat mir oft erzählt, wie es war, bevor sie eine Prinzessin wurde. Das war vielleicht lustig!\n@c0@"
  en: "@a%0%a001250@bI often used to get Cousin Gertie to tell me what it was like before she became a princess. We had lots of fun chatting!\n@c0@"
  es: "@a%0%a001250@bSolía preguntarle a la prima Frede cómo era su vida antes de ser princesa. ¡Nos lo pasábamos muy bien charlando!\n@c0@"
  fr: "@a%0%a001250@bJe demandais souvent à cousine Gégé de me raconter comment c'était avant qu'elle ne devienne princesse. On a eu plein de discussions amusantesⓠ\n@c0@"
  it: "@a%0%a001250@bLa cugina Gertrude mi ha detto che si divertiva tantissimo, prima di diventare Principessa.\nOra, invece, si annoia un po'...\n@c0@"
  ja: "@a@b%a001250「よく　ドリスおねえちゃんに\n\tお姫さまになる前の　お話を\n\t聞かせてもらったの。　楽しかった！\n@c0@"
62:
  de: "@aOtto@bPrinzessin Gertraud hat viel Ähnlichkeit mit meiner Traumfrau. Welchem Burschen würd' solch ein ehrliches und aufg'wecktes Mädel nicht g'fallen?\n@c0@"
  en: "@aTuppence@bPrincess Gertrude is actually not far from being my ideal woman. What man wouldn't find such a candid, lively beast attractive?\n@c0@"
  es: "@aAlazar@bLa princesa Fredegunda es casi mi mujer ideal. Ningún hombre podría no encontrar atractiva a esa monstruita alegre e inocente.\n@c0@"
  fr: "@aInnocent@bPour moi, la princesse Gertrude n'est pas loin de la femme idéale. Quel homme ne serait pas attiré par une fille aussi vive et aussi candideⓡ\n@c0@"
  it: "@aSimon@bTrovo la principessa Gertrude molto attraente.\nMi piacerebbe diventare la sua guardia del corpo...\nEhm...\n@c0@"
  ja: "@a@bピピン「じつは　ボク　ドリスさまも\n\tけっこう　タイプなんですよね。\n\t気さくで元気なお姫さまってステキだ！\n@c0@"
63:
  de: "@aSancho@bIss glaube, Señorita Gertraud bereitet dem armen Señor Sebastian ganz schön viel Ärger.\n@c0@"
  en: "@aSancho@bThe truth ees, señorita Gertrude, eshe makes eso much trouble for señor Albert.\n@c0@"
  es: "@aSancho@bLa verdad es que la señorita Fredegunda causa muchos problemas al señor Agila.\n@c0@"
  fr: "@aSancho@bLa vérité, c'est que la señorita Gertrude cause\r\nb-bien du souci au señor Albert.\n@c0@"
  it: "@aSancho@bLa señorita Gertrude crea siempre un mucchios de grattacapos al Principe Alberto...\n¡Quella muchacha ha un caracter muy difícil!\n@c0@"
  ja: "@a@bサンチョ「本当に　オジロンさまには\n\t迷わくを　かけっぱなしで\n\t頭が　あがりませんよ。\n@c0@"
64:
  de: "@aSancho@bEs ist gut für ihn, wenn wir bald unsere Mission erfüllen. Dann kann er endliss Siesta halten, si?\n@c0@"
  en: "@aSancho@bEes good for heem eef we finish our quest esoon. Then he can have the siesta, sí?\n@c0@"
  es: "@aSancho@bSerá mejor para él que acabemos pronto nuestra misión. Pues así podrá echarse la siesta al fin.\n@c0@"
  fr: "@aSancho@bCe serait bien p-p-pour lui aussi qu'on finisse\nvite cette quête. Il pourrait alors faire oune\npetite siesta, noⓡ\n@c0@"
  it: "@aSancho@b¡Quella muchacha ha un caracter muy difícil!\n¡Ay, no invidio proprio el povero hombre que la esposerà!\n@c0@"
  ja: "@a@bサンチョ「１日も　早く　目的を達成して\n\tオジロンさまには　ゆっくり\n\t休んでいただきたいものですね。\n@c0@"
65:
  de: "@a%0%a001240@bGlaubst du denn, es ist in Ordnung, wenn wir die Burg verlassen? Wo doch nur so wenig Soldaten übrig sind...\n@c0@"
  en: "@a%0%a001240@bIf there are so few people left, do you think it's okay for us to just leave the castle?\n@c0@"
  es: "@a%0%a001240@bSi queda tan poca gente, ¿crees que está bien que nos vayamos del castillo y ya está?\n@c0@"
  fr: "@a%0%a001240@bS'il ne reste que si peu de monde, tu crois que c'est une bonne idée qu'on quitte le châteauⓡ\n@c0@"
  it: "@a%0%a001240@bForse non dovremmo andarcene, se al castello ci sono pochi soldati...\n@c0@"
  ja: "@a@b%a001240「人が　少ないのに\n\tボクたちまで　出ていって\n\tこのお城　大丈夫かな……。\n@c0@"
66:
  de: "@a%0%a001240@bAber darum können wir uns wohl nicht auch noch kümmern. Erst einmal müssen wir den Bösewichten dieser Welt das Handwerk legen!\n@c0@"
  en: "@a%0%a001240@bI suppose we can't worry about that. It's more important that we go after the baddies and sort them out first.\n@c0@"
  es: "@a%0%a001240@bSupongo que no podemos preocuparnos por eso. Es más importante que vayamos antes a encargarnos de los malos.\n@c0@"
  fr: "@a%0%a001240@bMais on ne doit pas se préoccuper de ça. Le plus important, c'est qu'on trouve d'abord les méchants\net qu'on leur règle leur compte.\n@c0@"
  it: "@a%0%a001240@bD'altra parte, abbiamo una missione molto importante da svolgere. Cerchiamo di eliminare tanti mostri cattivi, così il castello correrà meno rischi!\n@c0@"
  ja: "@a@b%a001240「でも　今は\n\t悪いヤツを　やっつけにいくのが\n\tいちばん　いい方法なんだよね。\n@c0@"
67:
  de: "@aSancho@bMansse Leute verschwinden einfach. Und andere verlassen das Land, weil sie Angst haben.\n@c0@"
  en: "@aSancho@bEsome people, they just go missing. Others,\r\nthey leave because they eso worried\r\nabout everytheeng.\n@c0@"
  es: "@aSancho@bHay personas pues que desaparecen. Otras pues se van porque les preocupa todo.\n@c0@"
  fr: "@aSancho@bCertaines p-personnes disparaissent simplement. D'autres s'en v-vont parce qu'elles sont t-t-trop inquiètes de la situation.\n@c0@"
  it: "@aSancho@bMoltas personas sono andatas via da Denim por qué piensavano que un Regno senza Rey no avesse futuros...\n@c0@"
  ja: "@a@bサンチョ「行方知れずになった者…\n\t不安で国をはなれた者…　いなくなった\n\t者たちの　理由はさまざまです。\n@c0@"
68:
  de: "@aSancho@bAber jetzt hat Humburg wieder einen König, das wird ihnen Mut geben, no?\n@c0@"
  en: "@aSancho@bNow Gotha has once again eets king, maybe the good times, they estart again.\n@c0@"
  es: "@aSancho@bAhorita que Pankraz vuelve a tener rey, quizá regresen los buenos tiempos.\n@c0@"
  fr: "@aSancho@bMaintenant que Gotha a r-r-retrouvé son roi,\r\npeut-être que ce sera comme au b-bon vieux temps.\n@c0@"
  it: "@aSancho@bPerò, ahora que a Denim es tornato el Rey, las prospettivas sono nuovamentes roseas.\n¡Almenos espero!\n@c0@"
  ja: "@a@bサンチョ「王がもどられたことで\n\t活気づき　もとの　にぎわいを\n\t取りもどしてくれると　いいのですが。\n@c0@"
69:
  de: "@a%0%a001240@bEs gab einen Edelstein in dem Dorf, in dem du gelebt hast? Den will ich sehen!\n@c0@"
  en: "@a%0%a001240@bThere was a gemstone in the village you used to live in? I want to go and find it!\n@c0@"
  es: "@a%0%a001240@b¿Dices que en el pueblo en el que vivías había una gema? ¡Yo quiero ir a buscarla!\n@c0@"
  fr: "@a%0%a001240@bIl y avait une pierre précieuse dans le village où tu vivaisⓡ Je veux qu'on y aille pour la retrouverⓠ \n@c0@"
  it: "@a%0%a001240@bMa è vero che nel villaggio dove vivevi da piccolo ci sono delle pietre preziose?\nVoglio andare a cercarle!\n@c0@"
  ja: "@a@b%a001240「お父さんが　小さい頃いた村って\n\t宝石がとれるの？　すごいやっ！\n\tボクも　さがしにいきたいな！\n@c0@"
70:
  de: "@a%0%a001250@bIch frage mich, ob wir diesen berühmten Handwerker überhaupt finden würden, wenn wir nach Steinach gingen. \n㈡\nVielleicht ist er ja schon woanders hingegangen.\n@c0@"
  en: "@a%0%a001250@bI wonder if we'd find this famous craftsman if we went to Whealbrook. Maybe he's already moved\non somewhere else.\n@c0@"
  es: "@a%0%a001250@b¿Tú crees que encontraríamos a ese famoso artesano si fuésemos a Arroyofrío? A lo mejor ya se ha ido a otra parte.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si on trouverait ce célèbre artisan\nen allant à Ruycelieu. Peut-être qu'il a déjà déménagé ailleurs.\n@c0@"
  it: "@a%0%a001250@bChissà, se andassimo a Valcava potremmo trovare quell'artigiano...\nA patto che viva ancora lì, eh!\n@c0@"
  ja: "@a@b%a001250「サンタローズの洞くつに行ったら\n\t名工のおじさんに　会えるかな？\n\tもう　どっかに　行っちゃったかな。\n@c0@"
71:
  de: "@a%0%a001240@bEs wäre doch großartig, wenn wir Vater und Sohn wieder zusammenbringen könnten, nicht?\n@c0@"
  en: "@a%0%a001240@bIt'd be nice to bring the old man home to his son one day, wouldn't it?\n@c0@"
  es: "@a%0%a001240@bEstaría bien llevar al viejo de vuelta a casa de su hijo, ¿no?\n@c0@"
  fr: "@a%0%a001240@bCe serait bien de ramener le vieil homme chez son fils un jour, nonⓡ\n@c0@"
  it: "@a%0%a001240@bChe storia triste...\nMi piacerebbe tanto che il padre di quell'uomo tornasse a casa...\n@c0@"
  ja: "@a@b%a001240「いつか　あのおじさんを\n\tお父さんのところへ\n\t連れていってあげたいね。　ねっ？\n@c0@"
72:
  de: "@a%0%a001250@bZum Glück weiß er jetzt, dass sein Vater noch am Leben ist. Das muss eine große Erleichterung für ihn sein.\n@c0@"
  en: "@a%0%a001250@bIt's nice that he knows his dad's alive now. I can understand what a big relief that must be.\n@c0@"
  es: "@a%0%a001250@bAhora sabe que su padre está vivo, eso está bien. Debe de ser un gran alivioⓓ lo digo por experiencia.\n@c0@"
  fr: "@a%0%a001250@bC'est bien qu'il sache que son père est en vie.\nJe comprends quel soulagement ça doit être pour lui.\n@c0@"
  it: "@a%0%a001250@bAdesso che sa che suo padre è vivo, si sentirà sollevato, non credi?\n@c0@"
  ja: "@a@b%a001250「あのおじさん　お父さんが\n\t生きていると知って　うれしそうね。\n\tわたしも　あの気持ち　わかるな。\n@c0@"
73:
  de: "@a%0%a001240@bIch nehme an, dass du deine Mutter genauso gerne finden würdest wie ich meine...\n@c0@"
  en: "@a%0%a001240@bYou must be desperate to find your mum, just like I'm desperate to find mine.\n@c0@"
  es: "@a%0%a001240@bDebes de estar ansioso por encontrar a tu mamá, como yo por encontrar a la mía.\n@c0@"
  fr: "@a%0%a001240@bTu dois avoir aussi envie de retrouver ta maman que moi j'ai envie de retrouver la mienne.\n@c0@"
  it: "@a%0%a001240@bPapà, so che per te è importante trovare la tua mamma...\nPerò anch'io vorrei incontrare la mia!\n@c0@"
  ja: "@a@b%a001240「お父さんが　おばあちゃんに\n\t会いたい気持ちって　ボクがお母さんに\n\t会いたい気持ちと　同じだよね。\n@c0@"
74:
  de: "@a%0%a001250@bGroßmutter soll sich gut mit Monstern verstanden haben. Genau wie du.\n@c0@"
  en: "@a%0%a001250@bGrandma was good at making friends with monsters, right, Dad? Just like you are.\n@c0@"
  es: "@a%0%a001250@bA la abuela se le daba bien hacerse amiga de los monstruos, ¿verdad, papá? Como a ti.\n@c0@"
  fr: "@a%0%a001250@bGrand-mère était douée pour se faire des amis parmi les monstres, hein, papaⓡ Comme toi.\n@c0@"
  it: "@a%0%a001250@bPapà, è vero che anche la nonna era brava ad addomesticare i mostri?\nÈ lei che ti ha insegnato come si fa?\n@c0@"
  ja: "@a@b%a001250「おばあちゃんも　お父さんと\n\tいっしょで　魔物さんたちと\n\t仲良しだったんでしょ？\n@c0@"
75:
  de: "@a%0%a001250@bWie gerne würde ich sie kennenlernen.\n@c0@"
  en: "@a%0%a001250@bI really want to meet her.\n@c0@"
  es: "@a%0%a001250@bMe gustaría mucho conocerla.\n@c0@"
  fr: "@a%0%a001250@bJ'ai vraiment envie de la rencontrer.\n@c0@"
  it: "@a%0%a001250@bVorrei tanto conoscerla!\n@c0@"
  ja: "@a@b%a001250「だから　わたしも\n\tおばあちゃんに　会ってみたいの。\n@c0@"
76:
  de: "@aSancho@bDas ist eine gute Idee, Chico! Bitte, würdest du das für deine Onkel Chico tun, si?\n@c0@"
  en: "@aSancho@bEes a fine idea, friend! Please, you do thees for your Uncle Sancho, sí?\n@c0@"
  es: "@aSancho@b¡Qué buena idea, amigo! ¡Hazlo por tu tito Sancho, ándale!\n@c0@"
  fr: "@aSancho@bC'est oune bonne idée, chicoⓠ Fais ça pour\nt-tonton Sancho, de acuerdoⓡ\n@c0@"
  it: "@aSancho@bSì, chico.\nSarebbe veramentes una cosa meravigliosa...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！　私からも\n\tお願いします。　いつか　その\n\tペンダントを完成させてくださいね。\n@c0@"
77:
  de: "@a%0%a001240@bDiese Frau lebt normalerweise oben im Himmel, oder? Sie ist wunderschön.\n@c0@"
  en: "@a%0%a001240@bThat woman usually lives up in the sky, doesn't she? She's really pretty.\n@c0@"
  es: "@a%0%a001240@bEsa mujer vivía ahí arriba, en el cielo, ¿no? Es muy guapa.\n@c0@"
  fr: "@a%0%a001240@bCette femme vit dans le ciel, d'habitude, c'est çaⓡ Elle est vraiment jolie.\n@c0@"
  it: "@a%0%a001240@bQuella donna viveva in cielo, non è vero?\nÈ davvero carina...\n@c0@"
  ja: "@a@b%a001240「あの人　本当は\n\tお空の上に　住んでるんだよね。\n\tきれいな人だなあ……。\n@c0@"
78:
  de: "@a%0%a001250@bWir haben diese Dame schon oft besucht, aber sie hat nie mit uns gesprochen.\n@c0@"
  en: "@a%0%a001250@bWe used to visit that lady every once in a while,\nbut she'd never talk to us.\n@c0@"
  es: "@a%0%a001250@bA veces íbamos a visitar a esa dama, pero ella nunca nos dirigió la palabra.\n@c0@"
  fr: "@a%0%a001250@bOn venait voir cette dame, de temps en temps, mais elle ne nous parlait jamais.\n@c0@"
  it: "@a%0%a001250@bOgni tanto andavamo a trovare quella signora, ma lei era sempre silenziosa...\n@c0@"
  ja: "@a@b%a001250「あの人ね　今まで\n\tわたしたちが　会いに行っても\n\tおしゃべりして　くれなかったの。\n@c0@"
79:
  de: "@a%0%a001250@bIch bin wirklich froh, dass sie es jetzt tut.\n@c0@"
  en: "@a%0%a001250@bI'm really happy that she will now.\n@c0@"
  es: "@a%0%a001250@bMe alegro mucho de que ahora sí lo haga.\n@c0@"
  fr: "@a%0%a001250@bJe suis contente qu'elle le fasse, maintenant.\n@c0@"
  it: "@a%0%a001250@bOra, però, ci parla!\nChissà come mai ha cambiato idea...\n@c0@"
  ja: "@a@b%a001250「やっと　おしゃべりできて\n\tわたし　うれしい……。\n@c0@"
80:
  de: "@aOtto@bIch hatte ja keine Ahnung, dass in der Burg eine Frau aus Zenithia wohnt.\n@c0@"
  en: "@aTuppence@bI had no idea that there was a Zenithian living in the castle until you brought me here, Your Majesty.\n@c0@"
  es: "@aAlazar@bNo tenía ni idea de que había una zenithia viviendo en el castillo hasta que me trajisteis aquí, Majestad.\n@c0@"
  fr: "@aInnocent@bAvant que vous m'ameniez ici, Votre Majesté, j'ignorais totalement qu'une Zénithienne\r\nvivait dans le château.\n@c0@"
  it: "@aSimon@bMaestà, non avevo idea che al castello vivesse una donna zenithiana...\n@c0@"
  ja: "@a@bピピン「ボク　王に連れてこられるまで\n\tこの城に　天空人が住んでいたなんて\n\t知りませんでした。\n@c0@"
81:
  de: "@aOtto@bDie meisten anderen Leute hier wahrscheinlich auch net. Solch eine schöne Frau würd' sich vor lauter Verehrern ja gar net retten können!\n@c0@"
  en: "@aTuppence@bI should imagine most other folk don't realise, either. A beautiful woman like that would be surrounded by admirers if they did!\n@c0@"
  es: "@aAlazar@bImagino que casi nadie lo sabe. ¡Si lo supieran, una mujer así de hermosa estaría siempre rodeada de admiradores!\n@c0@"
  fr: "@aInnocent@bJe suppose que c'est la même chose pour la plupart des gens. Une belle femme comme ça serait entourée d'admirateurs si cela se savaitⓠ\n@c0@"
  it: "@aSimon@bSe mi è concesso dirlo, è una ragazza davvero affascinante!\n@c0@"
  ja: "@a@bピピン「ほかの人たちも　ほとんど\n\t知らないんじゃないかな？　でなきゃ\n\tあんな美人　ほっときませんよ！\n@c0@"
82:
  de: "@aSancho@bDas erste Mal, als %a001240 das Zenithiaschwert in die Hand nahm, war iss unglaubliss stolz!\n@c0@"
  en: "@aSancho@bThe first time %a001240, he took the Zenithian Sword, I, I was eso moved!\n@c0@"
  es: "@aSancho@b¡La primera vez que %a001240 agarró la espada de Zenithia me emocioné mucho, híjole!\n@c0@"
  fr: "@aSancho@bQuand %a001240 s'est saisi pour la p-première fois de l'Épée zénithienne, j'ai été mucho émuⓠ\n@c0@"
  it: "@aSancho@bLa primera vez que %a001240 ha impugnato la Spada Zenithiana, me sono estupito.\n@c0@"
  ja: "@a@bサンチョ「%a001240さまが　天空のつるぎを\n\t初めて　そうびなさった時は\n\t本当に　しょうげきを　受けました。\n@c0@"
83:
  de: "@aSancho@bEr konnte gerade erst laufen und schon fuchtelte er mit dem Schwert herum.\n@c0@"
  en: "@aSancho@bAs esoon as he can walk, %a001240 ees holding thees esword, and waving eet around.\n@c0@"
  es: "@aSancho@bEn cuanto comenzó a andar, %a001240 sostuvo la espada y comenzó a agitarla a un lado y a otro.\n@c0@"
  fr: "@aSancho@bDès qu'il a su marcher, %a001240 s'est mis à\np-p-porter cette épée et à l'agiter dans tous les sens.\n@c0@"
  it: "@aSancho@bEra appenas en grado de camminare, ma già la teneva en mano como un grande guerrero...\n@c0@"
  ja: "@a@bサンチョ「歩けるようになったばかりの頃\n\t%a001240さまは　天空のつるぎを\n\t手に取り　軽々とふり回されたのです。\n@c0@"
84:
  de: "@aSancho@bJetzt weiß iss wieso. Es war Schicksal, dass das Schwert in meine Hände gelangte.\n@c0@"
  en: "@aSancho@bNow I know. Thees ees why the esword, eet came to be een my hands.\n@c0@"
  es: "@aSancho@bAhorita sé por qué la espada cayó en mis manos.\n@c0@"
  fr: "@aSancho@bMaintenant je sais. C'est p-p-pour ça que j'ai eu cette épée entre les mains.\n@c0@"
  it: "@aSancho@bSi ce penso, yo...\nYo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あの日　私の手に　つるぎが\n\t残ったのは　こういうワケだったのかと\n\t妙に　なっとくしましたよ。\n@c0@"
85:
  de: "@a%0%a001240@b%0%a001250 schließt immer schnell Freundschaft mit Tieren und Monstern.\n@c0@"
  en: "@a%0%a001240@b%0%a001250's really friendly with animals and monsters, you know.\n@c0@"
  es: "@a%0%a001240@b%0%a001250 se hace amiga enseguida de los animales y de los monstruos.\n@c0@"
  fr: "@a%0%a001240@b%0%a001250 est vraiment très amie avec les animaux et les monstres, tu sais.\n@c0@"
  it: "@a%0%a001240@b%0%a001250 si diverte tantissimo a fare amicizia con gli animali e con i mostri.\n@c0@"
  ja: "@a@b%a001240「そういえば　%a001250って\n\t魔物たちや　動物たちと\n\tすっごく　仲良しなんだよ。\n@c0@"
86:
  de: "@a%0%a001240@bDu doch auch, oder, Papa? Es ist schön, dass ihr was gemeinsam habt.\n@c0@"
  en: "@a%0%a001240@bSo are you, right, Dad? It's nice that you've got that in common.\n@c0@"
  es: "@a%0%a001240@bComo tú, papá. Es genial que tengáis eso en común.\n@c0@"
  fr: "@a%0%a001240@bToi aussi, hein, papaⓡ C'est chouette que vous\nayez ça en commun.\n@c0@"
  it: "@a%0%a001240@bProprio come te!\nÈ bello che abbiate questa capacità in comune!\n@c0@"
  ja: "@a@b%a001240「お父さんもでしょ？\n\tいいなあ　ふたりとも　おそろいで。\n\tちぇっ……。\n@c0@"
87:
  de: "@aSancho@bEh, Chico! Bist du bereit für unsere Reise? Hast du auch die Heilkräuter und die Chimärenflügel eingepackt?\n@c0@"
  en: "@aSancho@bEh, friend! Are you ready to leave yet?\r\nYou no forget the medicinal herbs and the chimaera wings, no?\n@c0@"
  es: "@aSancho@b¡Eh, chamaco! ¿Estás listo para salir ya?\r\nNo te olvides las plantas medicinales y las alas de quimera, ¿ok?\n@c0@"
  fr: "@aSancho@bHé, chicoⓠ Tu es prêt à p-p-partirⓡ\nN'oublie pas les herbes médicinales\net les ailes de chimère, siⓡ\n@c0@"
  it: "@aSancho@b¿Chico, sei prontos por partire?\n¡Me raccomando, no dementicare l'erba medicinale y l'ala de chimera!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！　旅のしたくは\n\tすべて　すみましたか？　薬草と\n\tキメラのつばさは　持ちましたか？\n@c0@"
88:
  de: "@aSancho@bDu weißt ja, es ist immer gut, noch einmal in seinen Beutel zu schauen, bevor man aufbrisst.\n@c0@"
  en: "@aSancho@bYou know, ees always a good idea to check your baggages one more time before you go.\n@c0@"
  es: "@aSancho@bEs una buena idea repasar el equipaje una última vez antes de salir.\n@c0@"
  fr: "@aSancho@bTu sais, c'est t-t-toujours oune bonne idée de vérifier ses b-bagages oune dernière fois\r\navant de partir.\n@c0@"
  it: "@aSancho@b¡Bisogna siempre essere preparatos por todo!\nNo se sabe mai que puede succedere cuando se viaggia...\n@c0@"
  ja: "@a@bサンチョ「もう大丈夫！　と思っても\n\tもういっぺん　荷物をたしかめて\n\tそれから　出発するんですよ！\n@c0@"
89:
  de: "@aOtto@bWenn man ein Ziel verfolgt, sollte man sich immer vorstellen, was man alles tut, wenn man es schließlich erreicht hat.\n@c0@"
  en: "@aTuppence@bWhen you're striving towards a goal, it's always good to think about what you might want to do\r\nonce you've achieved it, right?\n@c0@"
  es: "@aAlazar@bCuando se quiere alcanzar una meta, es una buena idea pensar en lo que se hará si se alcanza, ¿no?\n@c0@"
  fr: "@aInnocent@bLorsqu'on a un objectif, c'est bien de réfléchir\nà ce qu'on fera une fois qu'on l'aura atteint,\nn'est-ce pasⓡ\n@c0@"
  it: "@aSimon@bSecondo me, quando si ha un obiettivo, è importante sapere cosa fare una volta che si è raggiunta la meta.\n@c0@"
  ja: "@a@bピピン「何か　成しとげようとするときは\n\t成しとげたあとのことを\n\t思い描くといいって言いますよね？\n@c0@"
90:
  de: "@aOtto@bSollte je wieder Frieden in der Welt herrschen, werd' ich mir als Allererstes eine hübsche Braut suchen.\n@c0@"
  en: "@aTuppence@bMy first task when the world's peaceful again will be to find myself a beautiful bride.\n@c0@"
  es: "@aAlazar@bCuando el mundo vuelva a estar en paz, mi primera misión será encontrar una esposa guapetona.\n@c0@"
  fr: "@aInnocent@bUne fois que le monde sera en paix, ma première tâche consistera à me trouver une belle épouse.\n@c0@"
  it: "@aSimon@bPer esempio, io so perfettamente cosa farò dopo che avremo salvato il mondo: mi troverò una fanciulla giovane e bella e la sposerò!\n@c0@"
  ja: "@a@bピピン「世界が　平和になったら\n\tかわいいお嫁さんを　もらって……\n@c0@"
91:
  de: "@aOtto@bHm... aber warum eigentlich warten?\n㈡\nIch könnt' mich ja schon mal während unserer Rettet-die-Welt-Mission umsehen und zwei Fliegen mit einer Klappe schlagen!\n@c0@"
  en: "@aTuppence@bHang on a minute! Why bother waiting? I could hunt her out during my world-saving travels and kill two birds with one stone!\n@c0@"
  es: "@aAlazar@b¡Espera un minuto! ¿Por qué esperar? ¡Puedo ponerme a buscarla mientras viajo salvando el mundo y así mato dos pájaros de un tiro!\n@c0@"
  fr: "@aInnocent@bQuoique... Pourquoi attendreⓡ Je pourrais profiter de mes voyages à travers le monde pour la chercher et faire d'une pierre deux coupsⓠ\n@c0@"
  it: "@aSimon@bAnzi, perché aspettare?! Potrei cominciare a cercarla fin da subito, approfittando dei tempi morti tra un combattimento e l'altro!\n@c0@"
  ja: "@a@bピピン「そうだ！　この旅で\n\tついでに　お嫁さんさがしも\n\tしちゃおうかなあ……。\n@c0@"
92:
  de: "@a%0%a001240@bOnkel Bastl hat alle Vorbereitungen für dich getroffen, Papa.\n@c0@"
  en: "@a%0%a001240@bUncle Bertie got everyone together for\nyour sake, Dad.\n@c0@"
  es: "@a%0%a001240@bTío Agila ha reunido a todo el mundo por ti, papi.\n@c0@"
  fr: "@a%0%a001240@bTonton Albert a rassemblé tout le monde pour toi, papa.\n@c0@"
  it: "@a%0%a001240@bLo zio Alberto è proprio un gran simpaticone, sai?\nDice tante cose divertentissime, e mi regala sempre le caramelle!\n@c0@"
  ja: "@a@b%a001240「オジロンおじさんが\n\tお父さんのために　って\n\tみんなを　集めてくれたんだよ。\n@c0@"
93:
  de: "@a%0%a001250@bMonty, der Monsterhüter, ist einfach klasse! Ich mag sowieso alle Leute, die mit Monstern befreundet sind.\n@c0@"
  en: "@a%0%a001250@bI really love Monty the monster monitor. Any friend of monsters is a friend of mine.\n@c0@"
  es: "@a%0%a001250@bLe tengo mucho cariño a Moncho, el cuidador de monstruos. Cualquier amigo de los monstruos es amigo mío.\n@c0@"
  fr: "@a%0%a001250@bJ'aime vraiment beaucoup Ciobair, le berger.\nTous les amis des monstres sont mes amis.\n@c0@"
  it: "@a%0%a001250@bMister Muster è una persona adorabile!\nChiunque sia amico dei mostri è anche mio amico!\n@c0@"
  ja: "@a@b%a001250「わたしね\n\tモンスターじいさんって\n\t魔物さんと　お友だちだから　大好き。\n@c0@"
94:
  de: "@a%0%a001240@bEs gibt keine Kinder in unserem Alter hier, deshalb haben wir auch nicht viele Freunde.\n@c0@"
  en: "@a%0%a001240@bThere aren't any other children of our age here, so we don't really have any friends.\n@c0@"
  es: "@a%0%a001240@bAquí no hay otros niños de nuestra edad, así que en realidad no tenemos amigos.\n@c0@"
  fr: "@a%0%a001240@bIl n'y a aucun enfant de notre âge, ici, alors on n'a pas vraiment de copains.\n@c0@"
  it: "@a%0%a001240@bQui ci sono pochi bambini della nostra età, quindi non abbiamo molti amici...\n@c0@"
  ja: "@a@b%a001240「ここには　ボクたちぐらいの\n\t子供がいないんだ。\n\tだから　友だちとかいなくって……。\n@c0@"
95:
  de: "@a%0%a001240@b%a001250 und ich haben Glück, dass wir Zwillinge sind und nie alleine sind.\n@c0@"
  en: "@a%0%a001240@bIt's lucky that %a001250 and I are twins and have each other.\n@c0@"
  es: "@a%0%a001240@bQué suerte que %a001250 y yo seamos gemelos y nos tengamos el uno al otro.\n@c0@"
  fr: "@a%0%a001240@bHeureusement qu'avec %a001250, on est jumeaux et qu'on peut être ensemble.\n@c0@"
  it: "@a%0%a001240@bPer fortuna io e %a001250 siamo gemelli, così possiamo giocare tra noi!\n@c0@"
  ja: "@a@b%a001240「%a001250と　ふたごで\n\t本当に　よかったよ。\n@c0@"
96:
  de: "@a%0%a001250@bAlle hier in der Burg sind sehr nett zu mir. Trotzdem fühle ich mich manchmal ein wenig einsam...\n@c0@"
  en: "@a%0%a001250@bEveryone here in the castle is really kind.\nAnd yet...I still always felt a bit lonely.\n@c0@"
  es: "@a%0%a001250@bEn el castillo todo el mundo es muy amable.\nPero... siempre me siento un poco sola.\n@c0@"
  fr: "@a%0%a001250@bTout le monde est vraiment très gentil, dans le château. Et pourtant... je me sens toujours\nun petit peu seule.\n@c0@"
  it: "@a%0%a001250@bTutte le persone che vivono al Castello sono buone e gentili con me, eppure a volte mi sento sola...\n@c0@"
  ja: "@a@b%a001250「お城の人たちは\n\tみんな　親切なの。\n\tでも　わたし…　さみしかった。\n@c0@"
97:
  de: "@aOtto@bIch liebe Humburg, aber manchmal ist es hier schon ein wenig einsam. Ein paar Frauen und Kinder mehr würden net schaden.\n@c0@"
  en: "@aTuppence@bI do love Gotha, but I've always found the place has a rather lonely feel to it. It needs more young women and children.\n@c0@"
  es: "@aAlazar@bClaro que me gusta Pankraz, pero siempre he pensado que era un lugar algo melancólico. Necesita más chicas jóvenes y niños.\n@c0@"
  fr: "@aInnocent@bJ'adore Gotha, mais j'ai toujours trouvé qu'il y régnait une atmosphère de solitude. Ça manque\r\nde jeunes femmes et d'enfants.\n@c0@"
  it: "@aSimon@bCredo che a Denim dovrebbero esserci più donne e bambini... Porterebbero tanta allegria e renderebbero il posto più vivace.\n@c0@"
  ja: "@a@bピピン「この国は　大好きなのですが\n\t若い女の人も　子供もいなくて\n\tさみしい感じがしますよね。\n@c0@"
98:
  de: "@aOtto@bVielleicht sollte ich die Sache selbst in die Hand nehmen und eine hübsche Braut mit nach Hause bringen.\n㈡\nDie kann mir dann jede Menge Kinderchen schenken!\n@c0@"
  en: "@aTuppence@bMaybe I'll have to take matters into my own\r\nhands and bring back a lovely bride to have\r\nlots of children with!\n@c0@"
  es: "@aAlazar@b¡A lo mejor tendría que tomármelo como algo personal y traerme una esposa guapetona para tener un montón de niños con ella!\n@c0@"
  fr: "@aInnocent@bPeut-être que je devrais me charger moi-même\nde ce problème et ramener avec moi une jolie\népouse pour qu'on ait plein d'enfantsⓠ\n@c0@"
  it: "@aSimon@bÈ per questo motivo che ho deciso di sposare una bella fanciulla e di avere tanti figli con lei!\nSì, lo farò! Per il bene di Denim!\n@c0@"
  ja: "@a@bピピン「やっぱりここは　ボクが\n\tかわいいお嫁さんを　もらって\n\tたくさん　子供を……！？\n@c0@"
99:
  de: "@aSancho@bSeit sie kleine Babys waren, ist dieses Castillo wie eine Spielplatz für %a001240 und %a001250.\n@c0@"
  en: "@aSancho@bThees castle, eet ees the playground for %a001240 and %a001250 esince they are the leettle bebés.\n@c0@"
  es: "@aSancho@bEste castillo es el patio de juegos de %a001240 y %a001250 desde que eran unos bebes, nomás.\n@c0@"
  fr: "@aSancho@bPour %a001240 et %a001250,\nce château est leur t-t-terrain de jeu\ndepuis qu'ils sont p-p-petits bébés.\n@c0@"
  it: "@aSancho@b%0%a001240 y %a001250 adorano giocare nel castillo.\n@c0@"
  ja: "@a@bサンチョ「お小さい頃から　%a001240さまも\n\t%a001250さまも　この城下町を\n\t遊び場にしておられました。\n@c0@"
100:
  de: "@aSancho@bUnd wenn nisst diese schrecklisse Sache mit Señora Magda passiert wäre, hättest vielleisst auch du hier eine glücklisse Kindheit verbringen können, Chico.\n@c0@"
  en: "@aSancho@bAnd eef thees terrible theeng no happen\r\nto señora Mada, maybe you would have the\r\nchildhood like thees too, friend.\n@c0@"
  es: "@aSancho@bY si no le hubiera pasado eso tan terrible a la señora Perséfone, quizá tu niñez también habría sido así, chamaco.\n@c0@"
  fr: "@aSancho@bEt s'il n'était pas arrivé m-m-malheur à la señora Magdalena, peut-être que tu aurais eu oune enfance similaire, chico.\n@c0@"
  it: "@aSancho@bSi la señora Mada no fosse estata rapita, anche tu ce avresti giocato, chico...\n@c0@"
  ja: "@a@bサンチョ「マーサさまが　あんなことに\n\tならなければ　坊っちゃんも\n\tそうして　育ったかも知れませんね。\n@c0@"
101:
  de: "@a%0%a001240@bDu wurdest auch hier in der Burg geboren, nicht wahr, Papa? Da haben wir ja schon wieder was gemeinsam!\n@c0@"
  en: "@a%0%a001240@bYou were born in this castle like I was, right, Dad? So we're the same!\n@c0@"
  es: "@a%0%a001240@bTú naciste en el castillo, como yo, ¿verdad, papá? ¡Somos iguales!\n@c0@"
  fr: "@a%0%a001240@bTu es né dans ce château comme moi, hein, papaⓡ Alors on est pareilsⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, è vero che anche tu sei nato nel Castello di Denim?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さんも\n\tこのお城で　生まれたんでしょ？\n\tボクたちと　いっしょだねっ！\n@c0@"
102:
  de: "@a%0%a001250@bWir sollen nicht so viel mit den Soldaten sprechen, um sie nicht von der Arbeit abzulenken.\n@c0@"
  en: "@a%0%a001250@bWe're not supposed to talk to the soldiers too much because it disturbs them from their work.\n@c0@"
  es: "@a%0%a001250@bSe supone que no podemos hablar demasiado con los soldados para no distraerlos de su tarea.\n@c0@"
  fr: "@a%0%a001250@bOn n'a pas trop le droit de parler aux soldats\nparce que ça les distrait de leur travail, il paraît.\n@c0@"
  it: "@a%0%a001250@bNon dovremmo parlare tanto con i soldati, altrimenti finiremo per distrarli e non svolgeranno il loro lavoro come si deve!\n@c0@"
  ja: "@a@b%a001250「兵士さんには　あんまり\n\t話しかけちゃいけないんだって…\n\tお仕事の　ジャマになるから。\n@c0@"
103:
  de: "@aOtto@bIch werd' das Gefühl net los, dass mich einige der anderen Soldaten finster anguck'n. Vielleicht sind sie neidisch, dass ich mit dem König reisen darf...\n@c0@"
  en: "@aTuppence@bI can't help feeling some of my fellow soldiers glaring at me somewhat. They must be jealous that I get to travel with His Majesty.\n@c0@"
  es: "@aAlazar@bNo puedo evitarlo, noto que algunos de mis compañeros soldados me miran raro.\n㈡\nDeben de estar celosos porque soy yo el que viaja con Su Majestad.\n@c0@"
  fr: "@aInnocent@bJ'ai un peu l'impression que certains de mes collègues soldats me dévisagent de façon bizarre.\n㈡\nIls doivent être jaloux que je voyage avec\nSa Majesté.\n@c0@"
  it: "@aSimon@bHo la sensazione che i miei commilitoni mi guardino con un pizzico d'invidia. Credo che anche a loro farebbe piacere accompagnarla in missione, Maestà!\n@c0@"
  ja: "@a@bピピン「王の旅に同行しているせいか\n\tなんだか　仲間からの視線が熱くって。\n\tうらやましいんでしょうね。\n@c0@"
104:
  de: "@a%0%a001240@bDieser Hund vergöttert %a001250 geradezu. Wenn er sie sieht, wedelt er viel mehr mit dem Schwanz als bei mir.\n@c0@"
  en: "@a%0%a001240@bThat dog really loves %a001250. He wags his tail much more when he sees her than when he sees me.\n@c0@"
  es: "@a%0%a001240@bEse perro le tiene mucho cariño a %a001250. Cuando la ve a ella menea más la cola que cuando me ve a mí.\n@c0@"
  fr: "@a%0%a001240@bCe chien aime vraiment beaucoup %a001250.\nIl remue la queue bien plus fort quand il la voit\nque quand c'est moi.\n@c0@"
  it: "@a%0%a001240@bQuel cagnolino ha un debole per %a001250!\nOgni volta che la vede, scondinzola come un matto!\n@c0@"
  ja: "@a@b%a001240「あの犬　%a001250のことが\n\t大好きなんだよ。　ボクの時とじゃ\n\tしっぽのふり方が　全然　ちがうんだ。\n@c0@"
105:
  de: "@a%0%a001240@b%0%a001250 meint, sie könne verstehen, was die Tiere sagen...\n@c0@"
  en: "@a%0%a001240@b%0%a001250 reckons she can understand what animals are saying, you know.\n@c0@"
  es: "@a%0%a001240@b%0%a001250 dice que puede entender lo que dicen los animales, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bTu sais, %a001250 dit qu'elle arrive à comprendre ce que disent les animaux.\n@c0@"
  it: "@a%0%a001240@bA proposito di animali!\nLo sai che %a001250 dice di essere in grado di capire il loro linguaggio?\n@c0@"
  ja: "@a@b%a001240「それに　%a001250は\n\t動物たちの　言っていることも\n\tわかるみたいなんだよ。\n@c0@"
106:
  de: "@a%0%a001250@bIch liebe Tiere! Und zwar alle Tiere!\n@c0@"
  en: "@a%0%a001250@bI love animals! All animals!\n@c0@"
  es: "@a%0%a001250@b¡Me encantan los animales! ¡Todos!\n@c0@"
  fr: "@a%0%a001250@bJ'adore les animauxⓠ Tous les animauxⓠ\n@c0@"
  it: "@a%0%a001250@bIo amo gli animali!\nTutti gli animali!\n@c0@"
  ja: "@a@b%a001250「わたしね……\n\t動物さんは　みんな　大好き！\n@c0@"
107:
  de: "@aOtto@bDieser Hund war schon hier, als ich noch ein kleiner Junge war. Er muss ganz schön alt sein.\n@c0@"
  en: "@aTuppence@bThat dog's been around ever since I was a young boy. He must be a fair old age by now.\n@c0@"
  es: "@aAlazar@bEse perro lleva por aquí desde que yo era niño. Debe de ser bastante viejo ya.\n@c0@"
  fr: "@aInnocent@bCe chien était déjà ici quand j'étais enfant.\r\nIl doit être très vieux, maintenant.\n@c0@"
  it: "@aSimon@bÈ una vita che conosco quel cane...\nRicordo che, quand'ero bambino, mi veniva sempre incontro per farmi le feste.\n@c0@"
  ja: "@a@bピピン「あの犬は　ボクが子供の頃から\n\tずっといますよね。\n\t長生きして欲しいなあ。\n@c0@"
108:
  de: "@a%0%a001240@bÄhm, Papa... War es eigentlich einsam als Statue, all die ganzen Jahre?\n@c0@"
  en: "@a%0%a001240@bUm, Dad... Was it lonely being on your own as a statue for all those years?\n@c0@"
  es: "@a%0%a001240@bMmm, papi... ¿Te has sentido solo tantos años en forma de estatua?\n@c0@"
  fr: "@a%0%a001240@bHum, papa... Est-ce que tu t'es senti seul pendant toutes ces années où tu as été une statueⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, ti sei sentito molto solo mentre eri una statua?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\t８年も　ひとりぼっちで石になって\n\tさみしくなかった？\n@c0@"
109:
  de: "@a%0%a001240@bIch meine, ich bin der große Bruder, mir hat das nichts ausgemacht, aber %a001250 war schon oft traurig.\n@c0@"
  en: "@a%0%a001240@bI'm the big brother, so I was okay, but %a001250 seemed really sad and upset about it all.\n@c0@"
  es: "@a%0%a001240@bYo soy el hermano mayor, así que estaba bien, pero %a001250 parecía triste y disgustada por todo lo sucedido.\n@c0@"
  fr: "@a%0%a001240@bC'est moi le plus grand, alors ça allait, mais %a001250 avait l'air vraiment triste et préoccupée, parfois.\n@c0@"
  it: "@a%0%a001240@bIo e %a001250 ci siamo arrabbiati tanto quando abbiamo scoperto cosa ti era successo, sai?\nPer fortuna ora siamo di nuovo insieme!\n@c0@"
  ja: "@a@b%a001240「ボクは　お兄ちゃんだから\n\t平気だったけど　%a001250は\n\tすっごく　さみしそうだったよ。\n@c0@"
110:
  de: "@aSancho@bWaren das wirkliss acht Jahre? Manssmal vergeht die Zeit schnell und manssmal ganz langsam.\n@c0@"
  en: "@aSancho@bEes really eight years? Esometimes eet feels long, and esometimes eet feels eshort.\n@c0@"
  es: "@aSancho@b¡Híjole! ¿De verdad han pasado ocho años? A veces parece mucho tiempo, otras parece poco.\n@c0@"
  fr: "@aSancho@bÇa fait v-v-vraiment huit ansⓡ Parfois, ça\np-p-paraît long, et p-p-parfois très court.\n@c0@"
  it: "@aSancho@bChico, cuando pienso a todo el tiempo que hai trascorso trasformato en una estatua...\n@c0@"
  ja: "@a@bサンチョ「あれから　８年ですか。\n\t長いような　短いような。\n@c0@"
111:
  de: "@aSancho@bWenn iss daran denke, was mit Señor Ludwig geschehen ist... Und wie schwer das alles für diss sein muss, Chico... I-Iss... (Schluchz)\n@c0@"
  en: "@aSancho@bWhen I theenk what happened to señor Pankraz...\nAnd how, how hard eet ees for you, friend...\nI, I... (sob)\n@c0@"
  es: "@aSancho@bCuando pienso lo que le pasó al señor Teudis...\r\nY lo duro que es ahora para ti, mi chamaco...\r\nYo, yo... (snif)\n@c0@"
  fr: "@aSancho@bQuand je p-p-pense à ce qui est arrivé au señor Petros... et à quel point c'est d-d-difficile pour toi, chico... je... je... (snif)\n@c0@"
  it: "@aSancho@bY quando pienso a quello que es successo al señor Russel...\nYo... Yo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「パパスさまも　そうでしたが\n\t坊っちゃんも　苦労ばっかりで\n\tうっ　うっ……。\n@c0@"
112:
  de: "@a%0%a001250@bAuf unserer Reise hat uns ein kleiner Vogel gezwitschert, dass du und Mama zu Stein verwandelt wurdet.\n@c0@"
  en: "@a%0%a001250@bWe found out you and Mum had been turned to stone when a little bird told us on our travels.\n@c0@"
  es: "@a%0%a001250@bDurante nuestros viajes, un pajarito nos dijo que a mamá y a ti os habían convertido en estatuas.\n@c0@"
  fr: "@a%0%a001250@bOn a découvert que maman et toi aviez été transformés en statues quand un petit oiseau\nnous l'a dit pendant notre voyage.\n@c0@"
  it: "@a%0%a001250@bAbbiamo scoperto che tu e la mamma eravate stati trasformati in statue mentre stavamo viaggiando con lo zio Sancho.\n@c0@"
  ja: "@a@b%a001250「お父さんたちが\n\t石にされたっていうのは\n\t旅のとちゅうで　鳥さんに聞いたの。\n@c0@"
113:
  de: "@a%0%a001250@bDann haben wir nach dem Stolosstab gesucht und dich endlich gefunden.\n@c0@"
  en: "@a%0%a001250@bThen we went looking for Stolos' staff, and then finally we found you.\n@c0@"
  es: "@a%0%a001250@bEntonces fuimos a buscar el báculo de Stolas y, finalmente, te encontramos a ti.\n@c0@"
  fr: "@a%0%a001250@bAlors on s'est mis à chercher le bâton de Stolos,\net puis on t'a retrouvé.\n@c0@"
  it: "@a%0%a001250@bCosì ci siamo messi alla ricerca della bacchetta di Stolos, perché solo con quella potevamo farvi tornare in vita.\n@c0@"
  ja: "@a@b%a001250「それから\n\tストロスの杖を　さがして\n\tお父さんを　見つけたのよ。\n@c0@"
114:
  de: "@a%0%a001250@bIch weiß auch nicht mehr, wie Mama aussieht.\n@c0@"
  en: "@a%0%a001250@bI don't remember what Mum looks like, either.\n@c0@"
  es: "@a%0%a001250@bTampoco recuerdo qué aspecto tiene mamá.\n@c0@"
  fr: "@a%0%a001250@bMoi non plus, je ne me souviens pas à quoi\nressemble maman.\n@c0@"
  it: "@a%0%a001250@bNemmeno io mi ricordo com'è fatta la mamma...\n@c0@"
  ja: "@a@b%a001250「わたし　お母さんの顔\n\tおぼえてないの……。\n@c0@"
115:
  de: "@a%0%a001250@bAber ich weiß noch, dass es immer warm in ihren Armen war und dass sie gut gerochen hat.\n@c0@"
  en: "@a%0%a001250@bBut I can remember her feeling all warm and\nsmelling nice.\n@c0@"
  es: "@a%0%a001250@bPero recuerdo la sensación de calidez y un olor agradable.\n@c0@"
  fr: "@a%0%a001250@bMais je me souviens qu'elle était toute douce et qu'elle sentait bon.\n@c0@"
  it: "@a%0%a001250@bPerò tutti dicono che è una donna molto bella.\nÈ vero, papà?\n@c0@"
  ja: "@a@b%a001250「でも　いいにおいがして\n\tあったかかったような　気がする……。\n@c0@"
116:
  de: "@aOtto@bIch kann mich kaum noch erinnern, wie sie aussah, aber ich weiß, dass Königin %a001230 eine echte Schönheit war.\n@c0@"
  en: "@aTuppence@bI can only vaguely remember how she looked, but I do know Queen %a001230 was a real beauty.\n@c0@"
  es: "@aAlazar@bSolo recuerdo su aspecto vagamente, pero sé que la reina %a001230 era una verdadera belleza.\n@c0@"
  fr: "@aInnocent@bJe ne me souviens que très vaguement à quoi ressemblait la reine %a001230, mais je sais que c'était une vraie beauté.\n@c0@"
  it: "@aSimon@bNon ricordo con precisione il suo aspetto, ma so che la regina %a001230 era una donna di una bellezza straordinaria.\n@c0@"
  ja: "@a@bピピン「ボクも　おぼろげにしか\n\tおぼえてないけど　%a001230さまって\n\tとても　ステキな方でしたよね。\n@c0@"
117:
  de: "@aOtto@bIch beneide Euch, Eure Majestät. Ich hoffe, selbst einmal solch eine zauberhafte Frau zu finden.\n@c0@"
  en: "@aTuppence@bI do envy you, Your Majesty. I hope I manage to find myself such a stunning wife one of these days.\n@c0@"
  es: "@aAlazar@bOs envidio, Majestad. Espero poder encontrar una esposa así de hermosa para mí algún día.\n@c0@"
  fr: "@aInnocent@bJe vous envie, Votre Majesté. J'espère réussir\r\nà me trouver une épouse aussi magnifique,\r\nun de ces jours.\n@c0@"
  it: "@aSimon@bSpero che presto potrà riabbracciarla, Maestà.\nGlielo auguro con tutto il cuore.\n@c0@"
  ja: "@a@bピピン「いいなあ……。\n\tボクも　あんな　ステキな方と\n\tお知り合いになりたいです。\n@c0@"
118:
  de: "@aSancho@bDieser Otto ist kein schlechter Señor, no? Warum fragst du ihn nisst, ob er uns begleiten möchte?\n@c0@"
  en: "@aSancho@bThees Tuppence, he no eseem like a bad señor, no?\nWhy don't you ask heem to accompany you?\n@c0@"
  es: "@aSancho@bEste Alazar no parece un mal señor, ¿verdad?\r\n¿Por qué no le pides que te acompañe?\n@c0@"
  fr: "@aSancho@bCet Innocent n'a pas l'air d'être oun mauvais\nbougre, noⓡ Pourquoi ne pas lui d-d-demander\nde t'accompagnerⓡ\n@c0@"
  it: "@aSancho@bEl señor Simon es un bravo hombre, chico...\n¿Por qué non gli chiedi de accompagnarte?\n@c0@"
  ja: "@a@bサンチョ「あの　ピピンという兵士\n\tなかなか　見どころがあるそうです。\n\tどうです　旅に同行させては？\n@c0@"
119:
  de: "@a%0%a001240@bOtto ist einer der Wachleute, die immer um die Burg patrouillieren. Ich finde seinen Namen so lustig, deshalb habe ich ihn behalten.\n@c0@"
  en: "@a%0%a001240@bTuppence is one of the guards who's always patrolling the castle. I remember his name because\nit sounds a bit funny!\n@c0@"
  es: "@a%0%a001240@bAlazar es uno de los guardias que está siempre patrullando por el castillo. ¡Recuerdo cómo se llama porque suena gracioso!\n@c0@"
  fr: "@a%0%a001240@bInnocent est l'un des gardes qui patrouillent en permanence dans le château. Je me souviens de\nson nom parce qu'il est un peu rigoloⓠ\n@c0@"
  it: "@a%0%a001240@bSimon è una delle migliori guardie del Castello di Denim. Tutti dicono che è forte, buono e coraggioso.\nEd è anche simpatico!\n@c0@"
  ja: "@a@b%a001240「ピピンって　いっつも\n\tお城の　見まわりをしてる人だよね。\n\tボク　名前おぼえてるよ！\n@c0@"
120:
  de: "@a%0%a001240@bIch mag Otto. Wir sollten ihn wieder mitnehmen!\n@c0@"
  en: "@a%0%a001240@bI quite like Tuppence. We should take him along with us again!\n@c0@"
  es: "@a%0%a001240@bMe cae bien Alazar. ¡Deberíamos llevarlo con nosotros otra vez!\n@c0@"
  fr: "@a%0%a001240@bJ'aime bien Innocent. J'aimerais bien qu'il nous accompagne à nouveauⓠ\n@c0@"
  it: "@a%0%a001240@bSimon è proprio una brava persona.\nForse potremmo portarlo con noi qualche altra volta, non credi?\n@c0@"
  ja: "@a@b%a001240「ピピン　けっこう\n\tボク　好きだったな。\n\tまた　連れていってあげようよ！\n@c0@"
121:
  de: "@aSancho@bSiehst du, Chico. Alle lieben diss. Dieser Señor weiß, dass du großartig bist.\n@c0@"
  en: "@aSancho@bYou see, friend. You are loved by everyone.\nThees señor, he knows how great you are.\n@c0@"
  es: "@aSancho@bYa lo ves, chamaco, todo el mundo te quiere.\r\nPues hasta este señor sabe que eres una gran persona.\n@c0@"
  fr: "@aSancho@bTu vois, chico. Tout le monde t'aime. Ce señor, il sait que tu es f-f-fantastique.\n@c0@"
  it: "@aSancho@bEl señor Simon nutre grandissima estima por ti, chico.\n@c0@"
  ja: "@a@bサンチョ「おやおや　坊っちゃん。\n\t宿屋のせがれに　ずいぶん\n\tしたわれましたね。\n@c0@"
122:
  de: "@aSancho@bDu solltest ihn bitten, uns wieder zu begleiten, no?\n@c0@"
  en: "@aSancho@bYou eshould ask heem to accompany you again, no?\n@c0@"
  es: "@aSancho@b¿No crees que deberías pedirle que te acompañase otra vez?\n@c0@"
  fr: "@aSancho@bTu devrais lui demander de nous accompagner\noune nouvelle fois, noⓡ\n@c0@"
  it: "@aSancho@b¿Por qué non gli chiedi de venire con nosotros qualche altras vez?\n@c0@"
  ja: "@a@bサンチョ「せっかくですから　どうです？\n\t連れていってやっては？\n@c0@"
123:
  de: "@aSancho@bIss habe miss schon gefragt, warum iss gar kein Schach mehr spiele, aber jetzt iss weiß. Es ist wegen Otto, er hat das Schachspiel.\n@c0@"
  en: "@aSancho@bI ask myself, ⓗWhy you no esee thees chess no more, Sancho?ⓘ, and now I know. Ees because señor Tuppence, he has eet all the time.\n@c0@"
  es: "@aSancho@bYo me preguntaba, ⓕSancho, ¿por qué ya nunca ves ese monstriajedrez?ⓖ, y ahorita ya lo sé. Es porque el señor Alazar lo tuvo siempre.\n@c0@"
  fr: "@aSancho@bEt moi qui me demandais ⓥPourquoi tu ne vois plus le jeu d'échecs, Sanchoⓡⓦ. Maintenant, je sais. C'est\np-p-parce que le señor Innocent le gardait avec lui.\n@c0@"
  it: "@aSancho@b¡Ahora entiendo por qué la escacchiera de los mostros era esparita! El señor Simon l'aveva nascosta, en quantos es un oggetto muy pericolosos!\n@c0@"
  ja: "@a@bサンチョ「見かけないと　思っていたら\n\tピピンが　しまっていたんですね。\n@c0@"
124:
  de: "@aSancho@bUnd es stimmt. Si, si. Iss erinnere miss an den Glanz in den Augen der Männer, wenn sie Schach spielen. Das ist gar nisst gut, no.\n@c0@"
  en: "@aSancho@bAnd ees true. Sí, sí. I remember the look een the men's eyes when they play thees chess.\r\nEsometheeng was no right.\n@c0@"
  es: "@aSancho@bY es verdad. ¡Órale!, recuerdo bien la mirada en los ojos de los soldados cuando jugaban a este monstriajedrez.\n㈡\nAlgo no andaba bien.\n@c0@"
  fr: "@aSancho@bEt c'est vrai, ce qu'il d-dit. Si, si. Je me rappelle du regard de ces hommes, quand ils j-j-jouaient aux échecs. Il y avait quelque chose de pas normal.\n@c0@"
  it: "@aSancho@bMe recuerdo que, cuando giocavano con la escacchiera, los soldados erano como en trance.\n¡Ay, que bruttas cosas!\n@c0@"
  ja: "@a@bサンチョ「たしかに　あの頃\n\tこのチェスをする者の目つきには\n\t異様なものが　ありましたよ。\n@c0@"
125:
  de: "@a%0%a001250@bIch weiß nicht warum, aber irgendwie macht mir dieses Schachspiel Angst. Du lässt mich doch nicht mit ihm allein, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bI find that chess set a bit scary for some reason. You won't leave me alone with it, will you, Dad?\n@c0@"
  es: "@a%0%a001250@bPor algún motivo, ese monstriajedrez me da miedo. No me dejes sola con él, ¿vale, papi?\n@c0@"
  fr: "@a%0%a001250@bCe jeu d'échecs me fait un peu peur. Tu ne me laisseras pas toute seule avec, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ho paura di quella scacchiera!\nTienila lontana da me!\n@c0@"
  ja: "@a@b%a001250「わたし　そのチェス\n\tなんだか　こわい……。\n\tお父さん　ちゃんと　そばにいてね。\n@c0@"
126:
  de: "@a%0%a001240@bIch hab heute gar nicht ins Bett gemacht, Papa!\n@c0@"
  en: "@a%0%a001240@bI didn't wet the bed today, Dad! Ahem!\n@c0@"
  es: "@a%0%a001240@b¡Hoy no he mojado la cama, papá! ¡Ejem!\n@c0@"
  fr: "@a%0%a001240@bJe n'ai pas fait pipi au lit aujourd'hui, papaⓠ Humⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, che facciamo ora?\n@c0@"
  ja: "@a@b%a001240「ボク　今日は\n\tおねしょ　しなかったよ。　エッヘン！\n@c0@"
127:
  de: "@a%0%a001250@bDu hast es gut, Papa. Du kannst in aller Ruhe schlafen. %0%a001240 steht dauernd auf und macht Krach.\n@c0@"
  en: "@a%0%a001250@bYou sleep all nice and quietly, Dad. %0%a001240 moves about all the time and makes a terrible noise.\n@c0@"
  es: "@a%0%a001250@bTú duermes muy bien, papá. %0%a001240 se mueve todo el rato y hace un ruido tremendo.\n@c0@"
  fr: "@a%0%a001250@bToi, tu dors bien tranquillement, papa. Mais %a001240, il n'arrête pas de remuer et de faire du bruit.\n@c0@"
  it: "@a%0%a001250@bPapà, quando dormi non ti muovi e non fai rumore.\n%0%a001240, invece, è peggio di un terremoto!\n@c0@"
  ja: "@a@b%a001250「お父さんって\n\tねぞうが　いいのね。\n\t%a001240ったら　もう　ひどくって！\n@c0@"
128:
  de: "@aOtto@bEs ist schon lustig, unter diesen Umständen in seinem eigenen Heim zu übernachten.\n@c0@"
  en: "@aTuppence@bIt's quite amusing staying in one's own home under these circumstances.\n@c0@"
  es: "@aAlazar@bEs divertido quedarte en tu propia casa en estas circunstancias.\n@c0@"
  fr: "@aInnocent@bC'est assez amusant de dormir chez soi dans ces circonstances.\n@c0@"
  it: "@aSimon@bSe avessi un paio d'ore libere, andrei volentieri a farmi un delizioso stufato di Cinghialorco, ma temo che dovrò rimandare a un altro momento...\n@c0@"
  ja: "@a@bピピン「自分の家に\n\tこういう泊まりかたを　するのって\n\tなんだか　しんせんですよ。\n@c0@"
129:
  de: "@a%0%a001240@bWir waren nicht oft hier. Vielleicht sollten wir das nächste Mal Ja sagen.\n@c0@"
  en: "@a%0%a001240@bWe never really stayed here very much.\nWe should say yes next time.\n@c0@"
  es: "@a%0%a001240@bNunca nos hemos quedado mucho aquí.\nLa próxima vez tenemos que decir que sí.\n@c0@"
  fr: "@a%0%a001240@bOn n'est pas restés beaucoup ici. On devrait dire oui, la prochaine fois.\n@c0@"
  it: "@a%0%a001240@bLa prossima volta mi piacerebbe fermarmi in questo posto.\nSembra proprio carino!\n@c0@"
  ja: "@a@b%a001240「ボクたち　ここには\n\tあんまり　泊まったことが　ないんだ。\n\t今度　泊まろうね！\n@c0@"
130:
  de: "@a%0%a001250@bDu siehst müde aus, Papa. Geht es dir gut? Du musst hin und wieder auch ein wenig schlafen, hörst du?\n@c0@"
  en: "@a%0%a001250@bYou seem a bit tired, Dad. Are you alright?\nYou must rest every now and then, you know.\n@c0@"
  es: "@a%0%a001250@bPareces un poco cansado, papá. ¿Estás bien?\nTienes que descansar de vez en cuando, ¿vale?\n@c0@"
  fr: "@a%0%a001250@bTu as l'air un peu fatigué, papa. Tu vas bienⓡ\nTu dois te reposer de temps en temps, tu sais.\n@c0@"
  it: "@a%0%a001250@bPapà, mi sembri un po' stanco...\nOgni tanto dovresti fermarti per riposare un po', sai?\n@c0@"
  ja: "@a@b%a001250「お父さん　すこし\n\tつかれてるみたいだけど　大丈夫？\n\t旅は　ムリしちゃいけないのよ。\n@c0@"
131:
  de: "@aOtto@bMan sollte immer das Beste aus der Situation machen, auch wenn die Herberge überlaufen und ein wenig heruntergekommen ist.\n@c0@"
  en: "@aTuppence@bIf you don't mind the place being rather cramped and shabby, then please do avail yourself of it whenever you wish.\n@c0@"
  es: "@aAlazar@bSi no os importa que el sitio sea pequeño y humilde, por favor, acomodaos según os parezca.\n@c0@"
  fr: "@aInnocent@bSi ça ne vous ennuie pas que l'endroit soit un peu exigu et défraîchi, alors profitez-en aussi souvent que vous voudrez.\n@c0@"
  it: "@aSimon@bCerto, la sistemazione è tutt'altro che principesca, ma va più che bene per riposare e recuperare energie...\n@c0@"
  ja: "@a@bピピン「%a000090さま　どうぞ\n\tせまくて　きたない所ですけど\n\t良かったら　泊まっていってください。\n@c0@"
132:
  de: "@aOtto@bEs ist die Pflicht eines jeden Soldaten, das Volk seines Landes zu b'schützen.\n@c0@"
  en: "@aTuppence@bIt's the given duty of a soldier to protect the people of his land.\n@c0@"
  es: "@aAlazar@bEs el deber de un soldado proteger a las personas de su patria.\n@c0@"
  fr: "@aInnocent@bLe devoir d'un soldat est de protéger les habitants de son pays.\n@c0@"
  it: "@aSimon@bIl primo dovere di un soldato è proteggere la sua patria e i suoi concittadini.\n@c0@"
  ja: "@a@bピピン「国の人々を守るのは\n\t兵士として　当然のつとめです。\n@c0@"
133:
  de: "@aOtto@bUnd es ist die Pflicht eines Mannes, seine Familie zu b'schützen. Stimmt's, Eure Majestät?\n@c0@"
  en: "@aTuppence@bAnd it's the given duty of a man to protect his family. Isn't that right, Your Majesty?\n@c0@"
  es: "@aAlazar@bY es el deber de un hombre proteger a su familia. ¿Verdad, Majestad?\n@c0@"
  fr: "@aInnocent@bEt le devoir d'un homme est de protéger sa famille. Vous n'êtes pas d'accord, Votre Majestéⓡ\n@c0@"
  it: "@aSimon@bMaestà, le prometto che farò tutto quanto è in mio potere per difendere Denim e i suoi abitanti da qualsiasi minaccia!\n@c0@"
  ja: "@a@bピピン「そして　家族を守るのは\n\t男として　やらねばならぬこと。\n\tそうですよねっ　%a000090さま。\n@c0@"
134:
  de: "@a%0%a001240@bOtto hat recht. Allerdings hätte ich nie gedacht, dass er so etwas Tiefsinniges von sich gibt...\n@c0@"
  en: "@a%0%a001240@bTuppence is right. I wouldn't have expected him to come out with something so deep, though.\n@c0@"
  es: "@a%0%a001240@bAlazar tiene razón. Pero es una sorpresa que se le haya ocurrido algo así de profundo.\n@c0@"
  fr: "@a%0%a001240@bInnocent a raison. Mais je suis surpris de l'entendre dire des choses aussi profondes.\n@c0@"
  it: "@a%0%a001240@bSai una cosa, papà?\nHa proprio ragione!\n@c0@"
  ja: "@a@b%a001240「ピピンって　いいこと言うね。\n\tふだんのピピンからは\n\t想像も　できないなあ……。\n@c0@"
135:
  de: "@a%0%a001250@bDiese Nonne war mal unsere Lehrerin.\n@c0@"
  en: "@a%0%a001250@bThat nun used to be our teacher.\n@c0@"
  es: "@a%0%a001250@bEsa monja solía ser nuestra maestra.\n@c0@"
  fr: "@a%0%a001250@bCette religieuse était notre professeur.\n@c0@"
  it: "@a%0%a001250@bPapà, lo sai?\nQuella suora è stata una nostra insegnante!\nEra proprio brava...\n@c0@"
  ja: "@a@b%a001250「わたしたち　あのシスターから\n\tお勉強を　おそわったのよ。\n@c0@"
136:
  de: "@a%0%a001240@b%0%a001250 ist wirklich schlau. Sie kann schon das große Einmaleins.\n@c0@"
  en: "@a%0%a001240@b%0%a001250's really clever. She can do all the three Rs.\n@c0@"
  es: "@a%0%a001240@b%0%a001250 es inteligente de verdad. Se sabe hasta la tabla del siete.\n@c0@"
  fr: "@a%0%a001240@b%0%a001250 est vraiment intelligente. Elle sait lire, écrire et compter.\n@c0@"
  it: "@a%0%a001240@b%0%a001250 è molto brava a scuola...\n@c0@"
  ja: "@a@b%a001240「%a001250って　頭がいいんだよ。\n\t読み書きや計算も　すぐにおぼえてさ。\n@c0@"
137:
  de: "@a%0%a001240@bIch... Na ja, ich bin nicht ganz so gut. Aber ich strenge mich wirklich an!\n@c0@"
  en: "@a%0%a001240@bI'm... Well, I'm not quite so clever. But I do try hard!\n@c0@"
  es: "@a%0%a001240@bYo... Bueno, yo no soy tan listo. ¡Pero me esfuerzo mucho!\n@c0@"
  fr: "@a%0%a001240@bMoi... euh, eh bien moi, je ne suis pas aussi doué.\nMais je fais tout ce que je peuxⓠ\n@c0@"
  it: "@a%0%a001240@bE io sono bravo come lei!\nEhm, quasi come lei...\nPerò sono più bravo con la spada! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「ボクは……\n\tちょっと　苦手だったけど　でも\n\t一生けんめい　がんばったよ！\n@c0@"
138:
  de: "@aSancho@bDie Göttin wird immer über Humburg wachen. Als du nisst da warst, Chico, sind die Monster oft über das Castillo geflogen...\n@c0@"
  en: "@aSancho@bThe Goddess, eshe always watches over Gotha.\r\nWhen you are no here, friend, the monsters, eso many times they come flying to the castle...\n@c0@"
  es: "@aSancho@bLa Diosa siempre vela por Pankraz.\r\nCuando tú no estabas aquí, chamaco, los monstruos venían volando al castillo...\n@c0@"
  fr: "@aSancho@bLa Déesse veille toujours sur Gotha. Quand tu n'étais p-pas, là, chico, les m-monstres sont souvent venus jusqu'au château.\n@c0@"
  it: "@aSancho@bChico, la dea buena y misericordiosa protegge siempre Denim... Cuando tu no estava aquí, sono arrivatos dei mostros volantes...\n@c0@"
  ja: "@a@bサンチョ「神の祝福といえば…　じつは\n\t坊っちゃんがいない間　この城へ何度か\n\t魔物が　飛来したことがあったのです。\n@c0@"
139:
  de: "@aSancho@bAber dann hat das Zenithiaschwert hell geleuchtet und sie alle verscheucht.\n@c0@"
  en: "@aSancho@bBut when they come, the Sword of Zenithia, eet makes the bright light and drives them away.\n@c0@"
  es: "@aSancho@bPero entonces la espada de Zenithia brillaba muy fuerte y los alejaba.\n@c0@"
  fr: "@aSancho@bMais quand ils approchaient, l'Épée de Zénithia se\r\nm-m-mettait à briller d'oune lumière très forte et les r-r-repoussait.\n@c0@"
  it: "@aSancho@bMa la Spada de Zenithia ha emesso una luce muy fuerte, y los mostros sono escappatos.\n@c0@"
  ja: "@a@bサンチョ「その度に　天空のつるぎが\n\tふしぎな光を放ち　魔物たちは\n\t何もせずに　去ったのです。\n@c0@"
140:
  de: "@aSancho@bWenn iss so darüber nachdenke, ist das schon seltsam.\nVielleisst war es das Werk der Göttin...\n@c0@"
  en: "@aSancho@bNow I remember thees, eet was very estrange.\r\nMaybe ees the work of the Goddess.\n@c0@"
  es: "@aSancho@bAhora que lo recuerdo, era bien raro.\r\nQuizá pues fuera obra de la Diosa.\n@c0@"
  fr: "@aSancho@bJe m'en souviens, maintenant, si. C'était t-t-très étrange. C'était peut-être l'œuvre de la Déesse.\n@c0@"
  it: "@aSancho@b¡Esta es la dimostrazione que la dea es muy affezionata al Regno de Denim!\n@c0@"
  ja: "@a@bサンチョ「今　思い出してみても\n\tあれは　本当に　ふしぎな光景でした。\n@c0@"
141:
  de: "@a%0%a001240@bWar dieser alte Mann etwa schon alt, als du klein warst?\n@c0@"
  en: "@a%0%a001240@bHas that old man been old even since you were little?\n@c0@"
  es: "@a%0%a001240@bEse viejo, ¿ya era viejo cuando tú eras niño?\n@c0@"
  fr: "@a%0%a001240@bEst-ce que ce vieux monsieur était déjà vieux quand tu étais petitⓡ\n@c0@"
  it: "@a%0%a001240@bAccidenti che tosse!\n@c0@"
  ja: "@a@b%a001240「あの　おじいさん\n\tお父さんが子供の頃から\n\tずっと　おじいさんだったの？\n@c0@"
142:
  de: "@a%0%a001240@bOh Mann! Dann muss er ja wirklich steinalt sein!\n@c0@"
  en: "@a%0%a001240@bWow! Then he must be ancient!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Entonces debe de ser muy antiguo!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Alors il doit vraiment être très âgéⓠ\n@c0@"
  it: "@a%0%a001240@bQuel signore avrebbe bisogno di andare da un medico...\n@c0@"
  ja: "@a@b%a001240「すごいなあ……。\n\tいったい　なん才なんだろう。\n@c0@"
143:
  de: "@aOtto@bBei der Göttin! Ich hoff' wirklich, dass er den Frieden noch erleben wird.\n@c0@"
  en: "@aTuppence@bOh dear! I do hope he lives to see the day when things are peaceful again.\n@c0@"
  es: "@aAlazar@b¡Diosa mía! Espero vivir para ver cómo la paz vuelve a estas tierras.\n@c0@"
  fr: "@aInnocent@bOhⓠ J'espère vraiment qu'il vivra assez longtemps pour voir enfin revenir la paix.\n@c0@"
  it: "@aSimon@bNon mi piacciono i pessimisti...\nPreferisco pensare che, grazie al nostro impegno, le cose andranno a posto in fretta!\n@c0@"
  ja: "@a@bピピン「さみしいこと言うなあ……。\n\tこりゃ　ぜひとも　平和な時代を\n\t見てもらわなくっちゃ！\n@c0@"
144:
  de: "@aSancho@bFür deine Onkel Sancho wäre es das Größte zu sehen, dass du und deine Familia wieder glückliss vereint seid.\n@c0@"
  en: "@aSancho@bFor your Uncle Sancho, I hope to esee the day when you and your family, they are all happily together again.\n@c0@"
  es: "@aSancho@bTu tito Sancho espera ver el día en que tú y tu familia estéis juntos y felices de nuevo, nomás.\n@c0@"
  fr: "@aSancho@bTon tonton Sancho attend avec impatience le\r\nj-j-jour où toute la famille sera enfin réounie et heureuse.\n@c0@"
  it: "@aSancho@bChico, espero que el mundo tornerà en pace muy prestos...\n@c0@"
  ja: "@a@bサンチョ「私も　目の黒いうちに\n\t坊っちゃんの　ご家族みんなが\n\tそろった姿を　見たいものです。\n@c0@"
145:
  de: "@aSancho@bDas ist unsere Ziel, Chico!\n@c0@"
  en: "@aSancho@bFor thees we must work, friend!\n@c0@"
  es: "@aSancho@b¡Tenemos que trabajar para eso, chamaco!\n@c0@"
  fr: "@aSancho@bOn doit t-t-travailler à ça, chicoⓠ\n@c0@"
  it: "@aSancho@b¡Es por esto motivo que dobbiamo impegnarce al maximo!\n@c0@"
  ja: "@a@bサンチョ「さあ　坊っちゃんっ！\n\tがんばりましょう！\n@c0@"
146:
  de: "@aSancho@bSi. Das glaube iss auch. Señora Magda und Señora %a001230 sind beide am Leben.\n@c0@"
  en: "@aSancho@bSí. I believe thees too.\nSeñora Mada and señora %a001230, they are both of them alive.\n@c0@"
  es: "@aSancho@bSí. Yo también lo creo, híjole.\nLa señora Perséfone y la señora %a001230 están vivas, las dos.\n@c0@"
  fr: "@aSancho@bMoi aussi, c'est ce que je p-p-pense.\nLa señora Magdalena et la señora %a001230\nsont toutes les deux en vie.\n@c0@"
  it: "@aSancho@bSì, anche yo pienso que la señora Mada y la señora %a001230 sono vivas y estanno bien.\n@c0@"
  ja: "@a@bサンチョ「そうですとも。\n\tマーサさまも　%a001230さまも\n\tきっと　生きていらっしゃいますとも！\n@c0@"
147:
  de: "@a%0%a001240@bNa, so viel ist ja mal klar! Wir werden Mama und Großmutter ja wohl kaum sterben lassen, nicht?!\n@c0@"
  en: "@a%0%a001240@bWell, we know that much! We're hardly just going to leave Mum and Grandma to die, right!?\n@c0@"
  es: "@a%0%a001240@b¡Bueno, una cosa está clara! ¡No vamos a dejar morir a mamá y a la abuela, ¿verdad?!\n@c0@"
  fr: "@a%0%a001240@bBen, évidemmentⓠ On ne va quand même pas laisser maman et grand-mère mourir, quand mêmeⓡⓐ\n@c0@"
  it: "@a%0%a001240@bCerto che sono vive e stanno bene!\nE noi le salveremo!\n@c0@"
  ja: "@a@b%a001240「そんなの　当たり前だよね。\n\tお母さんもおばあちゃんも　ボクたちを\n\tおいて　死んじゃったりするもんか！\n@c0@"
148:
  de: "@a%0%a001240@bWir sind oft hier gewesen. Das war viel lustiger als in der Burg.\n@c0@"
  en: "@a%0%a001240@bWe used to stay here every now and then. It's more fun than sleeping at the castle.\n@c0@"
  es: "@a%0%a001240@bSolíamos quedarnos aquí de vez en cuando. Es más divertido que dormir en el castillo.\n@c0@"
  fr: "@a%0%a001240@bOn venait dormir ici, de temps en temps.\nC'est bien plus rigolo que de dormir au château.\n@c0@"
  it: "@a%0%a001240@bOgni tanto io e %a001250 dormivamo qui.\nEra più divertente che stare al castello!\n@c0@"
  ja: "@a@b%a001240「ボクたち　ときどき\n\tこの家で　お泊まりしたんだよ。\n\tお城より　面白いんだもん！\n@c0@"
149:
  de: "@a%0%a001250@bSancho hat uns immer Paella gemacht, wenn wir hier waren.\n@c0@"
  en: "@a%0%a001250@bSancho always used to make us a delicious paella whenever we came to stay here.\n@c0@"
  es: "@a%0%a001250@bSancho siempre nos hacía unos burritos deliciosos cuando veníamos aquí.\n@c0@"
  fr: "@a%0%a001250@bQuand on venait ici, Sancho nous préparait\ntoujours une délicieuse paella.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho ci preparava la paella tutte le volte che andavamo a trovarlo, sai?\n@c0@"
  ja: "@a@b%a001250「この家に　泊まったときは\n\tサンチョが　いつも　おいしい\n\tシチューを　つくってくれたの！\n@c0@"
150:
  de: "@a%0%a001250@bAber wenn ich nachts mal wach geworden bin, stand Sancho immer traurig am Fenster... ⓚⓛ das war gar nicht schön.\n@c0@"
  en: "@a%0%a001250@bBut if I ever woke up at night, I'd catch him looking really miserable, so it was a bit worrying sometimes.\n@c0@"
  es: "@a%0%a001250@bPero a veces, cuando me despertaba de noche, me lo encontraba tristísimoⓓ me preocupaba.\n@c0@"
  fr: "@a%0%a001250@bMais quand il m'arrivait de me relever la nuit,\nje le voyais parfois avec un air vraiment très malheureux, alors je me faisais du souci.\n@c0@"
  it: "@a%0%a001250@bPerò lui sembrava tanto triste, anche se si sforzava di sorridere. Credo che fosse molto preoccupato per te e per la mamma...\n@c0@"
  ja: "@a@b%a001250「でも　夜中に　起きると\n\tサンチョは　いつも　さみしそうな\n\t顔をしていて　かわいそうだった……。\n@c0@"
151:
  de: "@aSancho@bWenn du im Castillo sisser sein willst, musst du draußen Wache halten.\n@c0@"
  en: "@aSancho@bEef you would like to be esafe eenside the castle, you must keep watching outside.\n@c0@"
  es: "@aSancho@bSi quieres estar a salvo dentro del castillo pues tienes que mantener vigilancia fuera.\n@c0@"
  fr: "@aSancho@bPour pouvoir être en sécurité à l'intérieur du château, il f-f-faut regarder ce qui se p-p-passe dehors.\n@c0@"
  it: "@aSancho@bEs muy importante assicurarse que no ce siano problemas nei paraggios del castillo...\n@c0@"
  ja: "@a@bサンチョ「城の中の安全は　城の外に\n\t注意を　はらってこそのものですから。\n@c0@"
152:
  de: "@aSancho@bSeñor Sebastian hat miss gebeten, drinnen zu bleiben, aber es ist meine Pflisst, hier zu wachen.\n@c0@"
  en: "@aSancho@bSeñor Albert, he ask me to estay eenside, but ees my duty to be on guard here.\n@c0@"
  es: "@aSancho@bEl señor Agila me pide que me quede dentro, pero mi deber es hacer guardia aquí, órale.\n@c0@"
  fr: "@aSancho@bLe señor Albert me demande de rester à l'intérieur, mais c'est mon d-d-devoir de monter la garde ici.\n@c0@"
  it: "@aSancho@bEl señor Alberto me ha chiesto de restare dentros, ma yo preferisco montare de guardias aquí.\n@c0@"
  ja: "@a@bサンチョ「オジロンさまは　城の中で\n\tともに暮らせとおっしゃいますが　私は\n\tここで　城を見守りたかったのです。\n@c0@"
153:
  de: "@a%0%a001240@bGlaubst du, es ist in Ordnung, wenn Wachleute schlafen?\n@c0@"
  en: "@a%0%a001240@bDo you think it's okay for guards to be asleep?\n@c0@"
  es: "@a%0%a001240@b¿Crees que es correcto que los guardias se duerman?\n@c0@"
  fr: "@a%0%a001240@bTu crois que les gardes ont le droit de dormirⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto soldato è di guardia, non è vero?\nE allora perché sta dormendo?!\n@c0@"
  ja: "@a@b%a001240「見はりの人も　ねちゃって\n\t大丈夫なのかな？\n@c0@"
154:
  de: "@aOtto@bIch hoffe sehr, dass er keinen Dienst mehr hat.\n@c0@"
  en: "@aTuppence@bI should imagine that he's no longer on duty for\r\nthe day.\n@c0@"
  es: "@aAlazar@bImagino que ya ha acabado su servicio hoy.\n@c0@"
  fr: "@aInnocent@bJe suppose qu'il a terminé sa garde pour la journée.\n@c0@"
  it: "@aSimon@bIl suo turno di guardia dev'essere finito per oggi...\n@c0@"
  ja: "@a@bピピン「あの人の　今日の仕事は\n\t終わっているはずだけど……。\n@c0@"
155:
  de: "@aOtto@bAber vielleicht schläft er ja nur hier, um g'schwind zur Stelle zu sein, falls etwas g'schieht.\n@c0@"
  en: "@aTuppence@bBut he's probably sleeping out here instead of his quarters so that he can be quick to notice if there's trouble afoot.\n@c0@"
  es: "@aAlazar@bPero debe de estar durmiendo aquí en lugar de en su cuarto, para enterarse enseguida en caso de que haya algún problema.\n@c0@"
  fr: "@aInnocent@bMais il dort sans doute à l'extérieur plutôt que dans ses quartiers pour pouvoir réagir au plus vite s'il se passe quelque chose d'anormal.\n@c0@"
  it: "@aSimon@bImmagino che abbia deciso di dormire qui, invece che nei suoi alloggiamenti, in modo da essere subito pronto in caso di bisogno.\n@c0@"
  ja: "@a@bピピン「仮眠室で寝ずに　ここで\n\t寝ているのは　外の変化に　いち早く\n\t気づくためかも知れませんね。\n@c0@"
156:
  de: "@aSancho@bEs gibt nisst mehr viele Leute in Humburg. Die Wachleute arbeiten einfach zu hart.\n@c0@"
  en: "@aSancho@bEes no eso many people here een Gotha these days.\nThe guards, they are working too hard.\n@c0@"
  es: "@aSancho@bPues ya no queda mucha gente en Pankraz.\r\nLos guardias trabajan demasiado.\n@c0@"
  fr: "@aSancho@bIl n'y a p-p-pas beaucoup de monde à Gotha, en ce moment. Les gardes sont obligés de travailler trop.\n@c0@"
  it: "@aSancho@bLos soldados de Denim estanno lavorando muy duramentes en esto periodo...\n@c0@"
  ja: "@a@bサンチョ「この国も　人が\n\t少なくなりましたから…　兵士たちも\n\t手いっぱいなんでしょうね。\n@c0@"
157:
  de: "@aSancho@bVielleisst arbeiten die Wachmänner ja zu viel, no? Sie haben gar keine Zeit für eine Siesta.\n@c0@"
  en: "@aSancho@bMaybe the guards, they are working too much, no? They no have the time for enough siesta.\n@c0@"
  es: "@aSancho@bPues igual los guardias trabajan demasiado, ¿no? No tienen tiempo para la siesta.\n@c0@"
  fr: "@aSancho@bPeut-être que les g-g-gardes travaillent trop, noⓡ Ils n'ont pas assez de temps pour la siesta.\n@c0@"
  it: "@aSancho@b¿Chico, no piensi que las guardias estanno lavorando troppos? No hanno nemmenos el tiempo por fare una siesta como se deve...\n@c0@"
  ja: "@a@bサンチョ「兵士たちにも　少し\n\tムリを　させてしまっていますね。\n\t今の人数では　仮眠もままなりません。\n@c0@"
158:
  de: "@a%0%a001250@bDer Soldat ist wirklich müde, trotzdem ist er immer noch wach, um Humburg zu beschützen. Das ist echt nett von ihm.\n@c0@"
  en: "@a%0%a001250@bThat soldier's really sleepy, but he's still working hard to guard the people of Gotha. What a good man!\n@c0@"
  es: "@a%0%a001250@bEse soldado está muerto de sueño, pero sigue trabajando duro para proteger a la gente de Pankraz. ¡Qué buen hombre!\n@c0@"
  fr: "@a%0%a001250@bCe soldat a vraiment sommeil, mais il continue à travailler dur pour protéger les habitants de Gotha. C'est un brave hommeⓠ\n@c0@"
  it: "@a%0%a001250@bChe bravo quel soldato!\nÈ stanco morto, ma non smette di fare la guardia, pur di proteggere la gente di Denim!\n@c0@"
  ja: "@a@b%a001250「あの兵士さん　眠いのに\n\t国のみんなのために　見はりしてくれて\n\tいるんでしょ？　えらいよね。\n@c0@"
159:
  de: "@aOtto@bUnsere Reisen durch die Weltgeschichte mögen anstrengend sein, doch die Soldaten hier in der Burg haben es noch viel schwerer.\n@c0@"
  en: "@aTuppence@bIt may be arduous for me sometimes during our travels together, but it's hard work for the soldiers left behind at the castle too.\n@c0@"
  es: "@aAlazar@bCuando viajo con vos, a veces el trabajo es duro, pero también lo es para los soldados que se quedan en el castillo.\n@c0@"
  fr: "@aInnocent@bIl y a parfois des moments difficiles pendant nos voyages, mais le travail des gardes restés au château n'est pas de tout repos non plus.\n@c0@"
  it: "@aSimon@bI soldati del castello stanno lavorando al limite delle loro possibilità.\n@c0@"
  ja: "@a@bピピン「%a000090さまとの旅も\n\t大変だけど　城に残っている兵士たちも\n\t大変なんですよね。\n@c0@"
160:
  de: "@aOtto@bIch werd' mein Möglichstes tun, um meinen Teil beizutragen!\n@c0@"
  en: "@aTuppence@bI must try my absolute hardest to do my bit!\n@c0@"
  es: "@aAlazar@b¡Debo poner todo mi empeño para aportar mi granito de arena!\n@c0@"
  fr: "@aInnocent@bJe dois vraiment faire tout mon possible pour accomplir ma part du travailⓠ\n@c0@"
  it: "@aSimon@bAnch'io ce la metterò tutta per difendere Denim e il mondo intero dall'oscura minaccia che incombe su tutti noi!\n@c0@"
  ja: "@a@bピピン「ボク　がんばらなくっちゃ……！\n@c0@"
161:
  de: "@a%0%a001240@bIch bin wirklich müde, Papa.\n@c0@"
  en: "@a%0%a001240@bI'm really sleepy, Dad.\n@c0@"
  es: "@a%0%a001240@bTengo mucho sueño, papá.\n@c0@"
  fr: "@a%0%a001240@bJ'ai vraiment sommeil, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, sono stanco...\n@c0@"
  ja: "@a@b%a001240「お父さん　ボクもう\n\t眠いよう……。\n@c0@"
162:
  de: "@a%0%a001250@bMir ist es egal, wo wir die Nacht verbringen, Papa. Hauptsache, wir können bald irgendwo schlafen.\n@c0@"
  en: "@a%0%a001250@bI don't care where we stay, Dad. Just as long as\nI can get some sleep soon.\n@c0@"
  es: "@a%0%a001250@bNo me importa dónde nos quedemos, papi, mientras pueda dormir un poco pronto.\n@c0@"
  fr: "@a%0%a001250@bPeu importe où on dort, papa, du moment qu'on peut aller se coucher bientôt.\n@c0@"
  it: "@a%0%a001250@bPapà, sto morendo di sonno...\nNon potremmo fermarci da qualche parte?\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん\n\tどこでもいいから　もう　ねようよ。\n@c0@"
163:
  de: "@aOtto@bMacht es Euch bequem, Eure Majestät.\n@c0@"
  en: "@aTuppence@bDo make yourself at home if you wish, Your Majesty.\n@c0@"
  es: "@aAlazar@bAcomodaos como si fuese vuestro propio hogar, Majestad.\n@c0@"
  fr: "@aInnocent@bFaites comme chez vous si cela vous tente, Majesté.\n@c0@"
  it: "@aSimon@bMaestà, decida lei quando sarà il momento di riposare.\r Se preferisce proseguire, non sarò certo io a chiederle di fermarsi.\n@c0@"
  ja: "@a@bピピン「どうぞ　%a000090さま。\n\tごえんりょなさらずに　ぜひ\n\t泊まっていってください。\n@c0@"
164:
  de: "@a%0%a001250@bDer Hund hat gesagt, ich würde Großmutter Magda sehr ähnlich sehen.\n@c0@"
  en: "@a%0%a001250@bThat dog says I look a lot like Grandma Mada.\n@c0@"
  es: "@a%0%a001250@bEse perro dice que me parezco mucho a la abuela Perséfone.\n@c0@"
  fr: "@a%0%a001250@bLe chien dit que je ressemble à grand-mère Magda.\n@c0@"
  it: "@a%0%a001250@bIl cane ha detto che somiglio tanto a nonna Mada.\n@c0@"
  ja: "@a@b%a001250「あの犬さんね　わたしが\n\tマーサおばあさまに　にてるって\n\tいってくれたの。\n@c0@"
165:
  de: "@a%0%a001250@bMeinst du, er ist schon lange genug hier in der Burg, um das zu wissen?\n@c0@"
  en: "@a%0%a001250@bDo you think he's been living here in the castle long enough to know?\n@c0@"
  es: "@a%0%a001250@b¿Crees que lleva tanto tiempo viviendo en el castillo como para saberlo?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il a vraiment vécu assez longtemps au château pour le savoirⓡ\n@c0@"
  it: "@a%0%a001250@bCome fa a conoscere il volto di tua madre?\nCredi che l'abbia conosciuta?\n@c0@"
  ja: "@a@b%a001250「あの犬さんは　そんなに\n\t昔から　このお城にいるのね。\n@c0@"
166:
  de: "@a%0%a001240@bSieht ganz so aus, als schlafen alle. Wir sollten besser leise sein, sonst wecken wir noch jemanden auf.\n@c0@"
  en: "@a%0%a001240@bLooks like everyone's asleep. We'd better keep quiet. We wouldn't want to wake people up.\n@c0@"
  es: "@a%0%a001240@bParece que todos están durmiendo. Vayamos con cuidado de no despertar a nadie.\n@c0@"
  fr: "@a%0%a001240@bTout le monde dort, on dirait. On ne doit pas faire de bruit si on ne veut pas réveiller les gens.\n@c0@"
  it: "@a%0%a001240@bDormono tutti...\nFacciamo piano, non vorrei svegliare qualcuno...\n@c0@"
  ja: "@a@b%a001240「……みんな　ねてるみたい。\n\tしずかに　歩こうね。\n\t起こしたら　かわいそうだもん。\n@c0@"
167:
  de: "@aOtto@bAah! Das Ende eines langen und arbeitsamen Tages!\n@c0@"
  en: "@aTuppence@bAah! The end of another good day's work!\n@c0@"
  es: "@aAlazar@b¡Aah! ¡Un día menos!\n@c0@"
  fr: "@aInnocent@bAahⓠ Voici la fin d'une bonne journée de travailⓠ\n@c0@"
  it: "@aSimon@bE anche questa dura giornata è finita.\nFinalmente un po' di riposo!\n@c0@"
  ja: "@a@bピピン「いやーっ　今日も\n\t充実した　１日でしたね！\n\tいい汗かいたなあ。\n@c0@"
168:
  de: "@a%0%a001250@bNachts habe ich immer ein wenig Angst in der Burg. Es heißt, dass Mama nachts entführt wurde.\n@c0@"
  en: "@a%0%a001250@bThe castle's a bit scary of a night. People say it was night-time when Mum was kidnapped.\n@c0@"
  es: "@a%0%a001250@bEl castillo da un poco de miedo por la noche. Dicen que a mamá la secuestraron por la noche.\n@c0@"
  fr: "@a%0%a001250@bLe château fait un peu peur, la nuit. Les gens disent que c'est pendant la nuit que maman a été enlevée.\n@c0@"
  it: "@a%0%a001250@bQuand'è buio, il castello mi mette paura.\nHo sentito dire che la mamma fu rapita di notte...\n@c0@"
  ja: "@a@b%a001250「夜のお城って　少し　こわい。\n\tお母さんが　さらわれたのも\n\t夜だって　聞いたし……。\n@c0@"
169:
  de: "@a%0%a001250@bDer alte Mann scheint irgendwie immer zu schlafen, selbst tagsüber.\n@c0@"
  en: "@a%0%a001250@bThat old man always seems to be asleep, even during the day.\n@c0@"
  es: "@a%0%a001250@bEse anciano siempre parece estar dormido, hasta de día.\n@c0@"
  fr: "@a%0%a001250@bCe vieux monsieur a toujours l'air de dormir,\nmême en journée.\n@c0@"
  it: "@a%0%a001250@bMa quell'uomo dorme anche di giorno?\n@c0@"
  ja: "@a@b%a001250「あのおじいさん\n\t昼も夜も　寝たきりなの。\n@c0@"
170:
  de: "@a%0%a001250@bWenn wir zurück sind und wieder Frieden herrscht, wäre es doch nett, mal einen Ausflug mit ihm zu machen.\n@c0@"
  en: "@a%0%a001250@bWhen we've finished travelling and\neverywhere's peaceful again, it'd be\nnice to take him out somewhere.\n@c0@"
  es: "@a%0%a001250@bCuando acabemos de viajar y la paz haya vuelto a todas partes, estaría bien llevarlo de excursión a algún lado.\n@c0@"
  fr: "@a%0%a001250@bQuand nous aurons terminé notre voyage et que ce sera de nouveau la paix, ce serait bien de l'emmener quelque part, pour le sortir.\n@c0@"
  it: "@a%0%a001250@bBuon per lui che ci riesce!\n@c0@"
  ja: "@a@b%a001250「この旅が終わって\n\t平和になったら　いっしょに\n\tお外に　つれていってあげたいな。\n@c0@"
171:
  de: "@a%0%a001240@bEs war nicht einfach, den Stolosstab zu finden, aber wir haben alle gut zusammen gearbeitet.\n@c0@"
  en: "@a%0%a001240@bIt was a bit tricky finding Stolos' staff, but we all pulled together and got it in the end.\n@c0@"
  es: "@a%0%a001240@bNo fue fácil encontrar el báculo de Stolas, pero todos contribuimos y al final lo logramos.\n@c0@"
  fr: "@a%0%a001240@bÇa a été un peu compliqué de trouver le bâton\nde Stolos, mais on s'y est tous mis et on a fini\npar y arriver.\n@c0@"
  it: "@a%0%a001240@bNon fu facile trovare la bacchetta di Stolos, ma alla fine ce la facemmo.\n@c0@"
  ja: "@a@b%a001240「ストロスの杖を　さがすの\n\tちょっとだけ　大変だったんだよっ。\n\tでも　みんなで　がんばったんだ。\n@c0@"
172:
  de: "@a%0%a001240@bDu kannst froh sein, dass du solch schlaue Kinder wie uns hast, was, Papa? Ha ha ha!\n@c0@"
  en: "@a%0%a001240@bIt's a good job you have clever kids like us, eh, Dad? Ha ha ha!\n@c0@"
  es: "@a%0%a001240@bQué suerte tener hijos listos como nosotros, ¿eh, papá? ¡Ja, ja, ja!\n@c0@"
  fr: "@a%0%a001240@bC'est bien d'avoir des enfants malins comme nous, hein, papaⓡ Ha ha haⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, sei proprio fortunato ad avere dei figli in gamba come noi, sai?\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「お父さん！　ボクたちみたいな\n\tたのもしい子供がいて　よかったね！\n\tえっへん！\n@c0@"
173:
  de: "@aSancho@bWeißt du, %a001240 und %a001250 arbeiten sehr hart für ihren Padre.\n@c0@"
  en: "@aSancho@bYou know, %a001240 and %a001250, they work very hard for their papá.\n@c0@"
  es: "@aSancho@bSabes, %a001240 y %a001250 trabajan bien duro por su viejo.\n@c0@"
  fr: "@aSancho@bTu sais, %a001240 et %a001250\nt-t-travaillent très dur pour leur papá.\n@c0@"
  it: "@aSancho@b%0%a001240 y %a001250 se sono impegnatos muchissimos por aiutarte, chico.\n@c0@"
  ja: "@a@bサンチョ「お父さんたちのためにと\n\t%a001240さまも　%a001250さまも\n\tたいそう　がんばっておられました。\n@c0@"
174:
  de: "@aSancho@bAh, es gibt doch nissts Schöneres, als stolz auf die Niños sein zu können, no?\n@c0@"
  en: "@aSancho@bEes notheeng makes you more proud than having the wonderful children, sí?\n@c0@"
  es: "@aSancho@bTener unos hijos maravillosos es lo que más llena de orgullo a un padre, ¿verdad?\n@c0@"
  fr: "@aSancho@bRien ne doit te rendre plus f-f-fier que d'avoir des enfants aussi merveilleux, noⓡ\n@c0@"
  it: "@aSancho@b¡Devi essere muy orgoglioso de los tuos figlios!\n@c0@"
  ja: "@a@bサンチョ「よい子供たちがいて\n\t%a000090王は　幸せ者ですね。\n@c0@"
175:
  de: "@a%0%a001240@bDieser Mann hat früher ganz schrecklich gesungen, doch dann hat er geübt und ist viel besser geworden. Alles ist möglich!\n@c0@"
  en: "@a%0%a001240@bThat man used to be rubbish at singing, but then he practised and got a lot better. Anything's possible!\n@c0@"
  es: "@a%0%a001240@bEse hombre solía cantar como una rana, pero a base de practicar ha mejorado mucho. ¡Todo es posible!\n@c0@"
  fr: "@a%0%a001240@bCe type était vraiment un très mauvais chanteur, mais il s'est entraîné et s'est beaucoup amélioré.\nTout est possibleⓠ\n@c0@"
  it: "@a%0%a001240@bRicordo che quel tipo era incredibilmente stonato, poi ha preso lezioni di canto e la sua voce è diventata dolce come quella di un usignolo.\n@c0@"
  ja: "@a@b%a001240「あのおじさん　昔は\n\t歌が　ヘタだったんだって。　練習して\n\tうまくなったんだよ。　すごいね！\n@c0@"
176:
  de: "@aOtto@bMein Zuhause ist net weit von hier. Der Gesang dieses Mannes hat mich früher immer in den Schlaf g'wiegt.\n@c0@"
  en: "@aTuppence@bMy home's not too far away from here, so that man's songs were like lullabies to me in my younger years.\n@c0@"
  es: "@aAlazar@bMi casa no está lejos, así que las canciones de ese hombre eran como una nana para mí cuando era niño.\n@c0@"
  fr: "@aInnocent@bJe n'habite pas très loin d'ici, alors les chansons\r\nde cet homme me servaient de berceuses quand\r\nj'étais plus jeune.\n@c0@"
  it: "@aSimon@bLe canzoni di quell'uomo hanno accompagnato la mia infanzia.\n@c0@"
  ja: "@a@bピピン「家が近かったこともあって\n\tあの方の歌声は　毎晩\n\tボクの子守歌に　なっていました。\n@c0@"
177:
  de: "@aOtto@bManchmal hab ich ihn allerdings auch schreien hören, wenn er g'schlafen hat...\n@c0@"
  en: "@aTuppence@bI sometimes heard him cry out in his sleep too,\r\nmind you!\n@c0@"
  es: "@aAlazar@b¡A veces hasta le oía vociferar en sueños!\n@c0@"
  fr: "@aInnocent@bIl m'est même arrivé de l'entendre crier dans son sommeil, vous vous rendez compteⓠ\n@c0@"
  it: "@aSimon@bQuando iniziò la sua attività di poeta e cantante, era più stonato di una campana, però con il tempo è migliorato...\n@c0@"
  ja: "@a@bピピン「たまに　うなされたことも\n\tありましたが……。\n@c0@"
178:
  de: "@a%0%a001240@bKeine Sorge, ich werde erst einschlafen, wenn ich im Bett liege.\n@c0@"
  en: "@a%0%a001240@bDon't worry, I won't fall asleep before I get to bed.\n@c0@"
  es: "@a%0%a001240@bNo te preocupes, no me dormiré antes de llegar a la cama.\n@c0@"
  fr: "@a%0%a001240@bNe t'inquiète pas, je ne m'endormirai pas avant d'être au lit.\n@c0@"
  it: "@a%0%a001240@bHo sonno, voglio andare a nanna...\n@c0@"
  ja: "@a@b%a001240「大丈夫　ボク\n\tちゃんと　お部屋につくまで\n\t寝るの　がまんするよ。\n@c0@"
179:
  de: "@a%0%a001240@bAber vielleicht nehmen wir ja vorher noch ein Bad... (Gähn)\n@c0@"
  en: "@a%0%a001240@bI was thinking we could have a bath first, anyway.\n(yawn)\n@c0@"
  es: "@a%0%a001240@bAunque estaba pensando en darme un baño antes.\n¡Aaah!\n@c0@"
  fr: "@a%0%a001240@bJe me disais qu'il fallait peut-être qu'on prenne un bain avant d'aller se coucher, de toute façon. (bâillement)\n@c0@"
  it: "@a%0%a001240@bPerò prima vorrei fare un bel bagno caldo, e mi piacerebbe anche mangiare qualcosa!\n@c0@"
  ja: "@a@b%a001240「それに　今日は\n\tお父さんと　おふろに　入るんだ。\n\tムニャ……。\n@c0@"
180:
  de: "@aSancho@bEh, Chico. Kommst du mit in Hildas Schänke? Wir trinken was und amüsieren uns, si?\n@c0@"
  en: "@aSancho@bEh, friend. You come weeth me to Patty's pub?\nWe dreenk and have esome laughs, eh?\n@c0@"
  es: "@aSancho@b¡Eh!, chamaco. ¿Vienes conmigo a la taberna de \nCone-Cone?\r\nBeberemos y nos reiremos nomás, ¿eh?\n@c0@"
  fr: "@aSancho@bHé, chico. Tu veux venir avec moi faire oun tour\nà la taverne de Tulipeⓡ On p-p-prendra oun verre et on rira oun peu, siⓡ\n@c0@"
  it: "@aSancho@b¿Chico, que ne dici de andare a mangiare un boccon al locale de Greta?\n@c0@"
  ja: "@a@bサンチョ「どうです？　坊っちゃん。\n\t今度　ルイーダの酒場で一杯。\n\tつもる話も　ありますし……\n@c0@"
181:
  de: "@aSancho@bEh! No, no! Erst wenn wir Señora %a001230 und Señora Magda gerettet haben.\n@c0@"
  en: "@aSancho@bEh! No, no!\nThees we do after we esave señora %a001230 and señora Mada.\n@c0@"
  es: "@aSancho@b¡Eh! ¡No, no!\nLo haremos después de salvar a la señora %a001230 y a la señora Perséfone, híjole.\n@c0@"
  fr: "@aSancho@bEuhⓠ No, noⓠ\nOn fera ça seulement après avoir sauvé la señora %a001230 et la señora Magdalena.\n@c0@"
  it: "@aSancho@bNo. Es mejor que no. Retiro la mia propostas.\nAhora dobbiamo riflettere su cosa fare por salvare la señora %a001230 y la señora Mada...\n@c0@"
  ja: "@a@bサンチョ「いや　いや！\n\t%a001230さまと　マーサさまを\n\t無事に助けてからの　話ですよ！\n@c0@"
182:
  de: "@aOtto@bHilda die Hortmutter ist 'ne ganz schöne Wucht. Allein bei ihrem Anblick bekomme ich schon heftiges Herzklopfen.\n@c0@"
  en: "@aTuppence@bPatty the party planner is a provocative peach. It gives me palpitations just looking at her.\n@c0@"
  es: "@aAlazar@bCone-Cone la organizadora de grupos es un bombón. Con solo mirarla se me acelera el corazón.\n@c0@"
  fr: "@aInnocent@bTulipe, la chef d'équipe, est assez provocante.\r\nRien qu'à la regarder, j'en ai des palpitations.\n@c0@"
  it: "@aSimon@bGreta l'Organizzagruppo è una splendida figliola.\nOgni volta che la vedo, il mio cuore comincia a scalpitare come una mandria di Bufalmoni!\n@c0@"
  ja: "@a@bピピン「酒場の　ルイーダさんって\n\t色っぽいですよね。\n\tボク　ドキドキしちゃって。\n@c0@"
183:
  de: "@a%0%a001250@bIch bin mit ihm befreundet, aber seine beste Menschenfreundin ist Großmutter Magda.\n@c0@"
  en: "@a%0%a001250@bI'm friends with him, but his best human friend is Grandma Mada.\n@c0@"
  es: "@a%0%a001250@bSoy amiga suya, pero su mejor amiga humana es la abuela Perséfone.\n@c0@"
  fr: "@a%0%a001250@bJe suis amie avec lui, mais sa meilleure amie humaine est grand-mère Magda.\n@c0@"
  it: "@a%0%a001250@bQuello Slime è amico di nonna Mada.\nPerò anch'io sono sua amica!\n@c0@"
  ja: "@a@b%a001250「わたし　あの子と　仲よしなの。\n\tでも　あの子は　やっぱり\n\tマーサおばあちゃんが　いちばんなのね。\n@c0@"
184:
  de: "@aSancho@bSi. Es ist spät. Alle schlafen schon. Vielleisst sollten wir auch langsam ins Bett gehen, no?\n@c0@"
  en: "@aSancho@bSí. Ees late. Everyone ees esleeping now. Maybe ees time for us to esleep esoon too, no?\n@c0@"
  es: "@aSancho@bSí. Es tarde. Todos están durmiendo ya.\r\nA lo mejor deberíamos irnos también a dormir pronto.\n@c0@"
  fr: "@aSancho@bSi. Il est tard. Tout le monde dort, pour l'instant. Peut-être qu'il est l'heure de d-d-dormir pour nous aussi, noⓡ\n@c0@"
  it: "@aSancho@bEstanno dormendo todos, chico.\n¿Que ne diresti de andare a fare una bella siesta anche nosotros?\n@c0@"
  ja: "@a@bサンチョ「さすがに　この時間だと\n\tみな　寝ているようですね。\n\tわれわれも　そろそろ休みましょう。\n@c0@"
185:
  de: "@aOtto@bKeiner da. Vielleicht könnt' ich mich ja mal ganz g'schwind auf den Thron hocken...\n@c0@"
  en: "@aTuppence@bThere's no one about now. I could probably get away with a little sit on the royal throne...\n@c0@"
  es: "@aAlazar@bNo hay nadie por aquí. Creo que no pasará nada si me siento un momento en el trono real...\n@c0@"
  fr: "@aInnocent@bIl n'y a personne dans les parages.\r\nJe pourrais peut-être essayer de m'asseoir\r\nvite fait sur le trône royal...\n@c0@"
  it: "@aSimon@bNon c'è nessuno in giro...\nQuasi quasi potrei provare l'ebbrezza di sedermi sul trono...\n@c0@"
  ja: "@a@bピピン「今なら　誰もいないから\n\t玉座の　座りごこちを……\n@c0@"
186:
  de: "@aOtto@bÄh... Nichts! Ich hab nur so vor mich hin g'murmelt...\n@c0@"
  en: "@aTuppence@bEr! Um! Nothing! I was just mumbling.\n@c0@"
  es: "@aAlazar@bEjem... Esto... ¡Nada! Solo estaba farfullando.\n@c0@"
  fr: "@aInnocent@bEuhⓠ Humⓠ Non, rienⓠ Je marmonnais tout seul.\n@c0@"
  it: "@aSimon@bEhm! Intendevo dire che volevo provare se il trono è abbastanza comodo da ospitare le sue regali terga, Maestà!\n@c0@"
  ja: "@a@bピピン「あっ！　いえっ。\n\tなんでもないです！\n@c0@"
187:
  de: "@a%0%a001240@bIch bin ganz schön müde. Meine Füße tun so weh.\n@c0@"
  en: "@a%0%a001240@bI'm pretty tired now. My feet are killing me.\n@c0@"
  es: "@a%0%a001240@bEstoy un poco cansado. Los pies me están matando.\n@c0@"
  fr: "@a%0%a001240@bJe suis vraiment fatigué, maintenant.\nJ'ai très mal aux pieds.\n@c0@"
  it: "@a%0%a001240@bSono stanchissimo!\nMi fanno male i piedi!\n@c0@"
  ja: "@a@b%a001240「今日は　つかれたなあー。\n\t足が　クタクタだよ。\n@c0@"
188:
  de: "@a%0%a001250@bEin Bad? Ich bin alt genug, um alleine ein Bad zu nehmen! Es wäre mir peinlich, wenn du mitkommen würdest...\n@c0@"
  en: "@a%0%a001250@bA bath? I'm old enough to have a bath on my own now. It's embarrassing if anyone comes in with me!\n@c0@"
  es: "@a%0%a001250@b¿Un baño? Ya soy lo suficientemente mayor como para bañarme sola. ¡Me da vergüenza que venga alguien conmigo!\n@c0@"
  fr: "@a%0%a001250@bUn bainⓡ Je suis assez grande pour prendre mon bain toute seule, maintenant. Ça me gêne de le prendre avec quelqu'un d'autreⓠ\n@c0@"
  it: "@a%0%a001250@bSono stanca morta...\nAvrei proprio bisogno di un bel bagnetto per rilassarmi un po'.\n@c0@"
  ja: "@a@b%a001250「えっ　おふろですか？\n\tひとりで　はいれます。\n\tお父さんとじゃ　はずかしい……。\n@c0@"
189:
  de: "@a%0%a001240@bViele Leute scheinen im Schlaf zu sprechen. Ich frage mich, was ich nachts so erzähle...\n@c0@"
  en: "@a%0%a001240@bLoads of people seem to talk in their sleep.\nI wonder what kinds of things I say.\n@c0@"
  es: "@a%0%a001240@bUn montón de personas hablan en sueños.\nMe pregunto qué clase de cosas dicen.\n@c0@"
  fr: "@a%0%a001240@bOn dirait qu'il y a plein de gens qui parlent dans leur sommeil. Je me demande quel genre de choses\nje raconte, moi.\n@c0@"
  it: "@a%0%a001240@bForse anch'io parlo nel sonno...\nChissà cosa dico...!\n@c0@"
  ja: "@a@b%a001240「みんな　寝ながら\n\tなにか　言ってるね。\n\tボクも　なんか　言ってるのかなあ。\n@c0@"
190:
  de: "@a%0%a001250@bKeiner scheint zu wissen, wo der Drachengott ist. Auch die Monster und Tiere wissen nichts.\n@c0@"
  en: "@a%0%a001250@bNo one seems to know where the Dragon God's gone. The monsters and the animals don't know, either.\n@c0@"
  es: "@a%0%a001250@bParece que nadie sabe dónde se ha metido el Dios Dragón. Ni siquiera los monstruos y los animales lo saben.\n@c0@"
  fr: "@a%0%a001250@bPersonne ne semble savoir où est parti le dieu dragon. Les animaux et les monstres ne le\nsavent pas non plus.\n@c0@"
  it: "@a%0%a001250@bNessuno sa dove sia finito il Drago Divino.\nAnche gli animali e i mostri lo ignorano.\n@c0@"
  ja: "@a@b%a001250「竜の神さま　どこに行ったか\n\tだれも　知らないみたい。\n\t魔物さんも　動物さんたちも……。\n@c0@"
191:
  de: "@a%0%a001240@bSancho wollte immer, dass wir uns vor dem Zubettgehen die Zähne putzen.\n@c0@"
  en: "@a%0%a001240@bSancho always nagged us to clean our teeth\nbefore bed.\n@c0@"
  es: "@a%0%a001240@bSancho siempre nos fastidiaba con lo de cepillarnos los dientes antes de ir a dormir.\n@c0@"
  fr: "@a%0%a001240@bSancho nous a toujours embêtés en nous obligeant à nous laver les dents avant d'aller nous coucher.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho si arrabbia moltissimo se dimentichiamo di lavarci i denti prima di andare a dormire.\n@c0@"
  ja: "@a@b%a001240「寝る前は　いっつも\n\t歯みがきしなさいーって\n\tサンチョが　うるさいんだよ。\n@c0@"
192:
  de: "@a%0%a001240@bEr hat gesagt, du hättest dir jeden Abend die Zähne geputzt, ohne zu murren. Stimmt das, Papa?\n@c0@"
  en: "@a%0%a001240@bHe said you used to do it every night without being asked. Is that true, Dad?\n@c0@"
  es: "@a%0%a001240@bDecía que tú lo hacías cada noche sin que te lo mandasen. ¿Es verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bIl nous disait que toi, tu le faisais tous les soirs sans qu'il ait besoin de te le demander. C'est vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bCi ha detto che tu te li lavavi senza che nessuno te lo ricordasse.\nÈ vero, papà?\n@c0@"
  ja: "@a@b%a001240「お父さんは　言われなくても\n\tきちんとしてたって。\n\tホント？　お父さん。\n@c0@"
193:
  de: "@a%0%a001250@bHm? Was ist los... Papa? Zzz...\n@c0@"
  en: "@a%0%a001250@bHm? What is it...Dad? Zzzz...\n@c0@"
  es: "@a%0%a001250@b¿Mmm? ¿Qué pasa? ¿Papi? Zzzz...\n@c0@"
  fr: "@a%0%a001250@bMmmⓡ Qu'est-ce que c'est... Papaⓡ Zzzz...\n@c0@"
  it: "@a%0%a001250@bRonf...\nChe c'è, papà?\nZzz...\n@c0@"
  ja: "@a@b%a001250「ん？\n\tなーに　お父さん…　ぐう……。\n@c0@"
194:
  de: "@aSancho@bChico! Nisst vergessen. Immer schön die Zähne putzen und Pipi machen, bevor du ins Bett gehst...\n@c0@"
  en: "@aSancho@bFriend! You no forget now! You clean your teeth and do a wee-wee before you go to bed, okay?\n@c0@"
  es: "@aSancho@b¡Chamaquito! ¡No te olvides! Cepíllate los dientes y haz pipí antes de irte a la cama, órale.\n@c0@"
  fr: "@aSancho@bChicoⓠ N'oublie pas, heinⓠ Tu te brosses les dents et tu fais pipi avant d'aller au lit, de acuerdoⓡ\n@c0@"
  it: "@aSancho@b¡Chico, no dementicarte de lavarte los dentes y de andare en bagno antes de addormentarte!\n¿Claro?\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん。\n\tお休み前には　歯みがきと\n\tトイレに行くのを　忘れずに！\n@c0@"
195:
  de: "@aSancho@bDu hast nun selbst ein paar Niños. Du musst ihnen eine gute Vorbild sein.\n@c0@"
  en: "@aSancho@bYou have the children now.\nThey must learn from their papá.\n@c0@"
  es: "@aSancho@bAhora tienes hijitos.\r\nTienen que aprender de su viejo.\n@c0@"
  fr: "@aSancho@bTu as des enfants, maintenant.\nTu dois m-m-montrer l'exemple.\n@c0@"
  it: "@aSancho@b¡Ahora hai dei figlios y devi dare loro el buen ejemplo!\n@c0@"
  ja: "@a@bサンチョ「父親の　%a000090王は\n\t子供たちの　お手本なんです。\n\tピシっとしてくださいねっ。\n@c0@"
196:
  de: "@a%0%a001240@bDiese Frau hat immer auf uns aufgepasst.\n@c0@"
  en: "@a%0%a001240@bThat woman looked after us lots.\n@c0@"
  es: "@a%0%a001240@bEsa mujer nos cuidaba mucho.\n@c0@"
  fr: "@a%0%a001240@bCette femme s'est beaucoup occupée de nous.\n@c0@"
  it: "@a%0%a001240@bQuella donna si è sempre presa cura di noi.\n@c0@"
  ja: "@a@b%a001240「あのおばさんが　ずっと\n\tボクたちの　お世話を\n\tしてくれてたんだよ。\n@c0@"
197:
  de: "@a%0%a001250@bSie hat sich um uns gekümmert, als wären wir ihre eigenen Kinder. Trotzdem war es nicht das Gleiche.\n@c0@"
  en: "@a%0%a001250@bShe took care of us like we were her own children, but it wasn't quite the same.\n@c0@"
  es: "@a%0%a001250@bSe encargaba de nosotros como si fuésemos sus propios hijos, pero no era exactamente lo mismo.\n@c0@"
  fr: "@a%0%a001250@bElle a pris soin de nous comme si on était ses\npropres enfants, mais ça n'était pas exactement\nla même chose.\n@c0@"
  it: "@a%0%a001250@bQuella signora ci vuole un bene dell'anima, proprio come se fossimo figli suoi!\n@c0@"
  ja: "@a@b%a001250「あのおばさんは　わたしたちを\n\t自分の子供みたいに　かわいがって\n\tくれたけど……　でも　ちがうの。\n@c0@"
198:
  de: "@a%0%a001250@bSelbst wenn wir ungezogen waren, hat sie uns nicht bestraft. Ich wette, unsere richtige Mutter hätte uns ausgeschimpft...\n@c0@"
  en: "@a%0%a001250@bEven if we were bad, she never scolded us.\nI bet our real mum would've done.\n@c0@"
  es: "@a%0%a001250@bCuando nos portábamos mal, ni siquiera nos reñía.\nSeguro que nuestra mamá sí lo hubiera hecho.\n@c0@"
  fr: "@a%0%a001250@bMême quand on n'était pas gentils, elle ne nous disputait jamais. Je parie que notre vraie maman l'aurait fait.\n@c0@"
  it: "@a%0%a001250@bÈ tanto buona e dolce, però preferirei avere la mia mamma accanto a me...\n@c0@"
  ja: "@a@b%a001250「わたしたち　悪いことしても\n\tしかられないの。　お母さんだったら\n\tきっと　しかってくれるよね。\n@c0@"
199:
  de: "@aOtto@bDass ich mal in den königlichen Gemächern schlafen würde... Wer hätte das gedacht?\n@c0@"
  en: "@aTuppence@bFancy being able to sleep with His Majesty in the royal quarters! Ah, life's good!\n@c0@"
  es: "@aAlazar@b¡Quién iba a decir que iba a dormir con Su Majestad en los aposentos reales! ¡Ah, la vida es bella!\n@c0@"
  fr: "@aInnocent@bPouvoir dormir avec Sa Majesté dans les appartements royaux, vous vous rendez compteⓡ Ah, la vie est belleⓠ\n@c0@"
  it: "@aSimon@bChi avrebbe mai immaginato che un giorno avrei dormito insieme al mio Sire negli alloggi reali, eh?\nLa vita riserva sempre tante sorprese!\n@c0@"
  ja: "@a@bピピン「王さまの寝室で　いっしょに\n\t休ませていただけたなんて…\n\tあ～っ　生きてて良かった！\n@c0@"
200:
  de: "@a%0%a001240@bEs wäre großartig, wenn wir hier alle schlafen könnten! Dummerweise gibt es nur ein Bett...\n@c0@"
  en: "@a%0%a001240@bIt'd be cool if we could all sleep here together!\nOh, but there's only one bed...\n@c0@"
  es: "@a%0%a001240@b¡Estaría bien si pudiéramos dormir aquí todos juntos!\n¡Oh!, pero solo hay una cama...\n@c0@"
  fr: "@a%0%a001240@bCe serait super si on pouvait dormir ici tous ensembleⓠ Oh, mais il n'y a qu'un lit...\n@c0@"
  it: "@a%0%a001240@bPeccato che ci sia un solo letto!\nMi avrebbe fatto piacere dormire tutti insieme nella stessa stanza...\n@c0@"
  ja: "@a@b%a001240「みんなで　ここに寝たら\n\tきっと　おもしろいよね！\n\tでも　ベッドが　１つしかないか……。\n@c0@"
201:
  de: "@a%0%a001250@bSancho hat uns immer viele Geschichten hier erzählt. Geschichten aus seiner Vergangenheit.\n@c0@"
  en: "@a%0%a001250@bWe heard lots of stories here in this house.\nStories from Sancho's past.\n@c0@"
  es: "@a%0%a001250@bHemos oído contar muchas historias en esta casa.\nHistorias sobre la vida de Sancho.\n@c0@"
  fr: "@a%0%a001250@bOn a entendu beaucoup d'histoires dans cette\nmaison. Des histoires du passé de Sancho.\n@c0@"
  it: "@a%0%a001250@bQuando dormivamo qui, lo zio Sancho ci raccontava sempre tante cose su re Russel...\n@c0@"
  ja: "@a@b%a001250「この　おうちで\n\tいろんな　お話を聞いたの。\n\tサンチョとおじいちゃんのお話。\n@c0@"
202:
  de: "@a%0%a001250@bIch glaube, wir wissen einfach alles über Großvater Ludwig!\n@c0@"
  en: "@a%0%a001250@bI think we probably know everything there is to know about Grandpa Pankraz!\n@c0@"
  es: "@a%0%a001250@b¡Creo que sabemos todo lo que se puede saber sobre el abuelo Teudis!\n@c0@"
  fr: "@a%0%a001250@bJe crois que maintenant, on sait tout ce qu'il y a à savoir sur grand-père Petrosⓠ\n@c0@"
  it: "@a%0%a001250@bOrmai sappiamo tutto della vita del nonno!\n@c0@"
  ja: "@a@b%a001250「だから　パパスおじいちゃんのこと\n\tわたしたち　なんでも知ってるよ。\n@c0@"
203:
  de: "@aSancho@bNachdem iss Humburg mit Señor Ludwig verlassen hatte, habe iss immer Essen gemacht.\n@c0@"
  en: "@aSancho@bAfter I left Gotha weeth señor Pankraz, every day I make the dinner.\n@c0@"
  es: "@aSancho@bDesde que salí de Pankraz con el señor Teudis, cada día hacía la cena.\n@c0@"
  fr: "@aSancho@bAprès avoir quitté Gotha avec le señor Petros,\r\nj'ai p-p-préparé le repas tous les jours.\n@c0@"
  it: "@aSancho@bCuando partimmo da Denim con el señor Russel, yo avevo el compitos de preparare los pastos.\n@c0@"
  ja: "@a@bサンチョ「パパスさまと旅に出てから\n\t毎日　私が　お食事を作っていました。\n@c0@"
204:
  de: "@aSancho@bEs war nisst einfach, wenn der kleine Chico mal wieder nisst essen wollte, aber wenn iss jetzt zurückdenke, waren es glücklisse Zeiten... (Schluchz)\n@c0@"
  en: "@aSancho@bEes no easy to look after the young friend when you no used to eet, but when I look back now, ees, ees eso happy times... (sob)\n@c0@"
  es: "@aSancho@bNo es fácil cuidar a un chamaco cuando no estás acostumbrado, pero cuando recuerdo esos tiempos... Fui muy feliz... (snif)\n@c0@"
  fr: "@aSancho@bÇa n'est pas facile de s'occuper d'oun petit chico quand on n'a pas l'habitude, mais q-q-quand j'y repense, c'était le bon temps... (snif)\n@c0@"
  it: "@aSancho@b¡Me recuerdo que te piaceva muchissimo la paella que te preparavo con tanto amor!\n@c0@"
  ja: "@a@bサンチョ「なれない子守りも　大変でしたが\n\t今となっては　あの旅の頃ばかりが\n\t思い出されて……。\n@c0@"
205:
  de: "@a%0%a001250@bSancho spricht oft im Schlaf, er scheint wirklich beunruhigt zu sein.\n@c0@"
  en: "@a%0%a001250@bSancho calls out in his sleep sometimes. He always sounds really upset.\n@c0@"
  es: "@a%0%a001250@bA veces Sancho grita en sueñosⓓ suena como si estuviese muy alterado.\n@c0@"
  fr: "@a%0%a001250@bSancho crie parfois dans son sommeil.\nIl a toujours l'air très malheureux.\n@c0@"
  it: "@a%0%a001250@bA volte lo zio Sancho parla nel sonno.\nAnzi, non parla: urla!\nSembra quasi che ce l'abbia con qualcuno...\n@c0@"
  ja: "@a@b%a001250「サンチョ　ときどき\n\t夜中に　うなされてるの。\n\tすごく悲しそうで　かわいそう……。\n@c0@"
206:
  de: "@a%0%a001250@bIch bin sehr gerne hier, aber ich mag es nicht, wenn er sich solche Sorgen macht...\n@c0@"
  en: "@a%0%a001250@bI really like staying here, but I've seen him call out like that loads of times and it's not very nice.\n@c0@"
  es: "@a%0%a001250@bMe gusta mucho que esté aquí, pero le he visto gritar así muchas veces, y no es agradable.\n@c0@"
  fr: "@a%0%a001250@bJ'aime bien être ici, mais je l'ai entendu crier comme ça plein de fois, et ça, j'aime pas trop.\n@c0@"
  it: "@a%0%a001250@bA me piace molto dormire a casa sua, però quando grida mi spavento!\n@c0@"
  ja: "@a@b%a001250「わたし　この家に泊まるの\n\t好きだけど　サンチョがうなされてるの\n\tなん度も　見ちゃった……。\n@c0@"
207:
  de: "@a%0%a001240@bIst Großvater Ludwig denn wirklich tot? Kann er nicht irgendwie wieder auferstehen? Sancho ist doch so traurig.\n@c0@"
  en: "@a%0%a001240@bIs Grandpa Pankraz really dead? Can't he come back to life somehow? Poor Sancho seems so sad.\n@c0@"
  es: "@a%0%a001240@b¿De verdad que el abuelo Teudis está muerto? ¿Y no puede volver a la vida de alguna forma? El pobre Sancho parece muy triste.\n@c0@"
  fr: "@a%0%a001240@bEst-ce que grand-père Petros est vraiment mortⓡ\nIl ne pourrait pas revivreⓡ Le pauvre Sancho a l'air si triste.\n@c0@"
  it: "@a%0%a001240@bAllo zio Sancho dispiace moltissimo che nonno Russel non ci sia più...\nGli spiace quasi quanto a me!\n@c0@"
  ja: "@a@b%a001240「ねえ　本当に　おじいちゃんは\n\t死んじゃったの？　生きかえらないの？\n\tサンチョが　かわいそうだよ。\n@c0@"
208:
  de: "@a%0%a001240@bBleibt Sancho etwa hier? Ich wünschte, er würde mit uns kommen.\n@c0@"
  en: "@a%0%a001240@bAre we leaving Sancho behind? I'd rather he came along with us.\n@c0@"
  es: "@a%0%a001240@b¿Vamos a dejar a Sancho? Preferiría que viniese con nosotros.\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'on laisse Sancho iciⓡ J'aimerais mieux\nqu'il vienne avec nous.\n@c0@"
  it: "@a%0%a001240@bNon portiamo lo zio Sancho con noi?\nMi piacerebbe se ci accompagnasse, sai?\n@c0@"
  ja: "@a@b%a001240「サンチョは　お留守番なの？\n\tボク　サンチョも　いっしょがいいな。\n@c0@"
209:
  de: "@a%0%a001250@bEs ist ein wenig einsam ohne Sancho...\n@c0@"
  en: "@a%0%a001250@bIt's a bit lonely without Sancho...\n@c0@"
  es: "@a%0%a001250@bSin Sancho me siento un poco sola...\n@c0@"
  fr: "@a%0%a001250@bÇa n'est pas pareil, sans Sancho.\n@c0@"
  it: "@a%0%a001250@bMi sento un po' triste senza lo zio Sancho...\n@c0@"
  ja: "@a@b%a001250「サンチョが　いないと\n\tちょっと　さみしい……。\n@c0@"
210:
  de: "@a%0%a001250@bAber das heißt natürlich nicht, dass ich nicht gerne mit dir zusammen bin, Papa! Tut mir leid...\n@c0@"
  en: "@a%0%a001250@bOh, but that doesn't mean I'm not happy to have you around, Dad. Sorry!\n@c0@"
  es: "@a%0%a001250@b¡Oh!, pero eso no quiere decir que no sea feliz por tenerte cerca, papi. ¡Lo siento!\n@c0@"
  fr: "@a%0%a001250@bOh, mais ça ne veut pas dire que je ne suis pas contente d'être avec toi, papa. Désoléeⓠ\n@c0@"
  it: "@a%0%a001250@bLui è troppo simpatico e poi prepara una paella da leccarsi i baffi!\n@c0@"
  ja: "@a@b%a001250「あっ　でも　こんなこと言うと\n\tお父さんが　さみしいね。\n\tごめんなさい……。\n@c0@"
211:
  de: "@aOtto@bSancho muss sich auch mal ein wenig ausruhen... Aber er steckt immer noch voller Tatendrang.\n@c0@"
  en: "@aTuppence@bSancho must be getting on a bit, mustn't he?\r\nHe's still very full of beans, though.\n@c0@"
  es: "@aAlazar@bSancho ya debe de estar haciéndose mayorcito, ¿no?\r\nPero aún está lleno de energía.\n@c0@"
  fr: "@aInnocent@bSancho doit commencer à prendre de l'âge, nonⓡ Pourtant, il est encore plein d'énergie.\n@c0@"
  it: "@aSimon@bSancho ha ancora un sacco di energie, per essere un vecch... Ehm, volevo dire che è una persona esperta e piena di vitalità!\n@c0@"
  ja: "@a@bピピン「サンチョさんって\n\tけっこう　お年なんですよね。\n\tそのわりには　元気だなあ……。\n@c0@"
212:
  de: "@aSancho@bWeißt du, dein Padre hätte diss niemals aus die Augen gelassen.\n@c0@"
  en: "@aSancho@bYou know, your father, he never let you out of hees esight.\n@c0@"
  es: "@aSancho@b¿Sabes?, tu padre nunca te perdía de vista.\n@c0@"
  fr: "@aSancho@bTu sais, ton père ne te quittait j-j-jamais des yeux, chico.\n@c0@"
  it: "@aSancho@b¿Chico, Maestà, me permetti de dirte una cosas?\n@c0@"
  ja: "@a@bサンチョ「思えば　パパスさまは\n\tいつでも　坊っちゃんを\n\tそばから　はなしませんでした。\n@c0@"
213:
  de: "@aSancho@bVielleisst solltest du %a001240 mitnehmen, no?\n@c0@"
  en: "@aSancho@bMaybe you eshould take %a001240 weeth you, no?\n@c0@"
  es: "@aSancho@bQuizá deberías llevarte a %a001240 contigo, ¿sí?\n@c0@"
  fr: "@aSancho@bPeut-être que tu devrais emmener %a001240 avec toi, noⓡ\n@c0@"
  it: "@aSancho@b¿Por qué no porti %a001240 contigo?\nSarebbe entusiastas de accompagnarte.\n@c0@"
  ja: "@a@bサンチョ「どうか　%a001240さまも\n\t連れていってあげてください。\n@c0@"
214:
  de: "@a%0%a001250@bWir müssen %a001240 mitnehmen, Papa! Immerhin ist er der Held, oder?!\n@c0@"
  en: "@a%0%a001250@bWe have to take %a001240 with us, Dad!\nHe's the hero, right!?\n@c0@"
  es: "@a%0%a001250@b¡Tenemos que llevar a %a001240 con nosotros, papá!\n¡Él es el héroe, ¿no?!\n@c0@"
  fr: "@a%0%a001250@bIl faut qu'on emmène %a001240 avec nous, papaⓠ C'est lui le héros légendaire, après toutⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, dobbiamo portare %a001240 con noi!\nNon possiamo lasciare indietro il nostro piccolo grande eroe!\n@c0@"
