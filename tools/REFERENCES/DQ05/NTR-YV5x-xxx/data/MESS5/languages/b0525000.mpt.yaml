0:
  de: "@aBianca@bUi...\nHier sieht's aber geheimnisvoll aus.\n@c0@"
  en: "@aBianca@bWow...\nWhat a mysterious-lookin' place.\n@c0@"
  es: "@aBianca@bVaya...\r\n¡Qué sitio tan misterioso!\n@c0@"
  fr: "@aBianca@bWaouh...\nCet endroit semble vraiment mystérieux.\n@c0@"
  it: "@aBianca@bChe luogo magico...\n@c0@"
  ja: "@a@bビアンカ「きれい……\n\t神秘的な　建物ね……。\n@c0@"
1:
  de: "@aBianca@bDas mag vielleicht das Heim der Königsfamilie sein, aber eine Burg ist es nicht. Lass uns zur Burg gehen, %a000090.\n@c0@"
  en: "@aBianca@bThis may well be the domain of the royal family, but it en't no castle. Let's go to the castle, %a000090.\n@c0@"
  es: "@aBianca@bPuede que sean dominios de la familia real, pero un castillo no es. Vamos al castillo, %a000090.\n@c0@"
  fr: "@aBianca@bC'est peut-être le domaine de la famille royale, mais ce n'est pas un château. Allons au château, %a000090.\n@c0@"
  it: "@aBianca@bSarà anche proprietà della famiglia reale, %a000090, ma di certo non è il castello!\nForza, andiamo.\n@c0@"
  ja: "@a@bビアンカ「ここは　ゆかりの地かも\n\t知れないけれど　お城じゃないわね。\n\t%a000090　お城へ　いきましょうよ。\n@c0@"
2:
  de: "@aNera@bHier ist es aber hübsch! Wo wohl das Licht herkommt?\n@c0@"
  en: "@aNera@bWhat a pretty place. I wonder where the light's coming in from.\n@c0@"
  es: "@aNera@bQué sitio tan bello. Me pregunto de dove vendrá la luz.\n@c0@"
  fr: "@aNera@bQuel bel endroit. Je me demande d'où vient la lumière.\n@c0@"
  it: "@aNera@bQuesto posto è un vero incanto!\nUhm, non riesco a capire da dove arriva la luce...\n@c0@"
  ja: "@a@bフローラ「きれいですね。\n\tこの　光のつぶは　どこから\n\t入ってくるのかしら？\n@c0@"
3:
  de: "@aNera@bEs scheint so was wie ein Zufluchtsort zu sein. Wozu er wohl da ist?\n@c0@"
  en: "@aNera@bThis place feels sort of like a sanctuary.\r\nI wonder what it's here for.\n@c0@"
  es: "@aNera@bEste sitio parece como un santuario.\r\n¿Per qué estará aquí?\n@c0@"
  fr: "@aNera@bCet endroit ressemble à un sanctuaire.\r\nJe me demande à quoi il sert.\n@c0@"
  it: "@aNera@bChe luogo particolare...\nSembra quasi un santuario...\n@c0@"
  ja: "@a@bフローラ「ここは　聖域\n\tという感じが　しますわね。\n\tいったい　どういう場所なのかしら？\n@c0@"
4:
  de: "@aGriselda@bEs ist sehr hübsch hier, wie ein Sternenhimmel. Aber es ist trotzdem bloß eine modrige Höhle. Igitt! Bestimmt setzt sich der Gestank in meine Kleider!\n@c0@"
  en: "@aDebora@bIt's very pretty here, just like a starry night sky. But it's still a cave, and it reeks of mould.\r\nUrgh! My clothes are going to stink.\n@c0@"
  es: "@aStefania@bEsto es molto bello, parece una noche estrellada. Ma sigue siendo una cueva y apesta a moho.\r\n¡Agh! Mi ropa va a quedarse con ese olor.\n@c0@"
  fr: "@aPandora@bC'est très joli, ici, on dirait un ciel étoilé. Mais ça reste une grotte qui sent le moisi. Beurkⓠ Mes vêtements vont sentir mauvais.\n@c0@"
  it: "@aViola@bChe atmosfera particolare... Sembra di guardare un cielo stellato! Non avrei mai detto che una grotta potesse essere tanto bell...\n㈡\nBleah!\nChe orribile puzza di muffa!\nI miei vestiti puzzeranno come capre bagnate!\n@c0@"
  ja: "@a@bデボラ「星空みたいで　キレイだけど\n\tやっぱり　洞くつだけに　カビくさいわね。\n\tカビのにおいが　服にうつりそう……。\n@c0@"
5:
  de: "@aGriselda@bWo wohl diese kleinen Lichtflecke herkommen? Ich glaube nicht, dass das Glühwürmchen sind.\n@c0@"
  en: "@aDebora@bI wonder where the little chinks of light are coming from. It doesn't look like they're fireflies.\n@c0@"
  es: "@aStefania@bMe pregunto de dónde vienen esos puntitos de luce. No parecen luciérnagas.\n@c0@"
  fr: "@aPandora@bJe me demande d'où viennent les petits points de lumière. Ça n'a pas l'air d'être des lucioles.\n@c0@"
  it: "@aViola@bCosa saranno quelle lucine?\nSembrano delle lucciole...\n@c0@"
  ja: "@a@bデボラ「この光のつぶは\n\tいったい　どこから来ているのかしら？\n\tホタル　とは　ちがうみたいね……。\n@c0@"
