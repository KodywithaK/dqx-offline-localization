0:
  de: "@a%0%a001240@bHe, das kommt mir bekannt vor! Hier hast du doch all die Jahre als Statue rumgestanden, nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bHey, I remember this place! This is where you spent all those years as a statue, right, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Eh! Me acuerdo de este sitio. Aquí es donde pasaste todos esos años cuando eras un estatua, ¿no, papi?\n@c0@"
  fr: "@a%0%a001240@bHé, je me souviens de cet endroitⓠ C'est là où tu as passé toutes ces années comme statue, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, mi ricordo di questo posto!\nÈ dove era finita la tua statua! Cioè, dove fosti messo quando ti trasformarono in statua, no?\n@c0@"
  ja: "@a@b%a001240「あ！　ここ覚えてる！\n\t石になった　お父さんが\n\tずっといた場所だよね？\n@c0@"
1:
  de: "@a%0%a001250@bIch habe lange überlegt, was ich zu dir sagen sollte, wenn ich dich finden würde, Papa.\n@c0@"
  en: "@a%0%a001250@bI thought long and hard about how to first greet you when I found you, Dad.\n@c0@"
  es: "@a%0%a001250@bEstuve pensando mucho en qué decirte cuando te encontrase, papá.\n@c0@"
  fr: "@a%0%a001250@bJ'ai longtemps réfléchi à la façon dont je te saluerais la première fois que je te verrais, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, ricordi le parole che ti dissi, quando finalmente ti ritrovammo?\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんに\n\tなんて　ごあいさつしようか\n\tずっと　考えて　練習してたの。\n@c0@"
2:
  de: "@a%0%a001250@bAber dann war's irgendwie ganz leicht.\n@c0@"
  en: "@a%0%a001250@bI hope I made a good job of it.\n@c0@"
  es: "@a%0%a001250@bEspero que te gustara.\n@c0@"
  fr: "@a%0%a001250@bJ'espère que je m'en suis bien sortie.\n@c0@"
  it: "@a%0%a001250@bMi ero preparata quel discorsetto per mesi, e spero che ti sia piaciuto!\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんに\n\t上手に　あいさつできてたかな……。\n@c0@"
3:
  de: "@a%0%a001250@bSchön, dass du wieder lebst und atmest, Papa. Und nicht mehr in Stein verwandelt als Statue herumstehst.\n@c0@"
  en: "@a%0%a001250@bIt's nice to see you living and breathing again, Dad. Not like the statue you were all those years.\n@c0@"
  es: "@a%0%a001250@bMe alegra verte vivito y coleando, papi. No hecho una estatua como todos aquellos años.\n@c0@"
  fr: "@a%0%a001250@bC'est super de te voir de nouveau vivre et respirer, papa. Pas comme cette statue que tu as été toutes ces années.\n@c0@"
  it: "@a%0%a001250@bPapà, sai una cosa?\nTi preferisco ora, vivo e animato, rispetto a quando eri una statua.\n@c0@"
  ja: "@a@b%a001250「お父さん　あったかい……。\n\tもう　石じゃないもんね。\n@c0@"
4:
  de: "@aSancho@bEin Glück, dass der Señor, der hier lebt, kein Hitzkopf ist, findest du nisst, Chico?\n@c0@"
  en: "@aSancho@bEes lucky the señor who ees leeving here, he ees no hot een the head, eh?\n@c0@"
  es: "@aSancho@bPues menos mal que el señor que vive acá no es loco, ¿eh?\n@c0@"
  fr: "@aSancho@bC'est oune chance que le señor qui vit ici, il ne soit pas c-c-colérique, noⓡ\n@c0@"
  it: "@aSancho@bChico, siamo estatos fortunatos que el señor que vive aquí es una persona calma...\n@c0@"
  ja: "@a@bサンチョ「ここのご主人が\n\t短気な方でなくて　よかった。\n@c0@"
5:
  de: "@aSancho@bNisst auszudenken, wenn er deine Statue zerbrochen hätte, Chico... Iss... Iss weiß nisst, was iss dann getan hätte! (Schnüff)\n@c0@"
  en: "@aSancho@bEef he had broken your estatue, friend...\nI, I no know what I would do! (sniff)\n@c0@"
  es: "@aSancho@bImagina que hubiera roto tu estatua, chamaco...\nNo sé qué hubiera hecho. (snif)\n@c0@"
  fr: "@aSancho@bS'il avait cassé ta s-statue, chico...\nJe ne sais p-pas ce que j'aurais f-faitⓠ (snif)\n@c0@"
  it: "@aSancho@b¡Piensa que sarebbe estato de ti si lui, arrabbiato por el rapimentos del figlio, se fosse esfogato sulla tua estatua y l'avesse fatta a pezzos!\n㈡\n¡Ay, no lo voglio nemmenos pensar!\n@c0@"
  ja: "@a@bサンチョ「もし　石像の坊っちゃんを\n\tこわされていたらと思うと\n\tぞっとしますよ……。\n@c0@"
6:
  de: "@aSancho@bOhne deine klugen Kinderssen stündest du immer noch als eine Statue im Garten. Dafür haben sie wirkliss großes Lob verdient, Chico.\n@c0@"
  en: "@aSancho@bEes because of your wonderful children that you are back to normal now. You must eshower them weeth praises later, friend.\n@c0@"
  es: "@aSancho@bSi vuelve a ser normal es gracias a lo padrísimos que son sus hijos. Luego, pues me los llena de alabanzas.\n@c0@"
  fr: "@aSancho@bC'est grâce à tes m-merveilleux enfants que tu\r\nas r-retrouvé ton apparence normale, chico.\r\nPlus t-tard, pense à les f-féliciter.\n@c0@"
  it: "@aSancho@bChico, devi essere muy orgoglioso de los tuos figlios... No se sono mai persos d'animos, y hanno siempre creduto que te avremmo trovato.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんが　元にもどれたのは\n\tお子さまたちが　がんばったからです。\n\tあとで　ほめてあげてくださいね。\n@c0@"
7:
  de: "@aOtto@bHier also habt Ihr all die Jahre als Statue gestanden, %a000090?\n@c0@"
  en: "@aTuppence@bSo this is where you spent all those years as a statue, is it, %a000090?\n@c0@"
  es: "@aAlazar@bAquí es donde pasasteis todos esos años cuando erais una estatua, ¿no, %a000090?\n@c0@"
  fr: "@aInnocent@bAlors c'est ici que vous avez passé toutes ces années transformé en statue, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, è questo il luogo dove lei ha trascorso tanti anni sotto forma di statua, non è vero?\n@c0@"
  ja: "@a@bピピン「へえーっ　ここが\n\t%a000090さまが　石像として\n\tすごされた場所ですか。\n@c0@"
8:
  de: "@aOtto@bWas für ein lauschiges Plätzchen! Da wäre ich gar net überrascht, wenn die Insel schon bald vom Tourismus entdeckt würd'.\n@c0@"
  en: "@aTuppence@bWhat a lovely spot! I wouldn't be surprised if this island ends up on the tourist map before long.\n@c0@"
  es: "@aAlazar@b¡Es un sitio precioso! No me extrañaría que acabase siendo un lugar turístico.\n@c0@"
  fr: "@aInnocent@bQuel charmant endroitⓠ Ça ne m'étonnerait pas\nque cette île figure rapidement sur la liste des destinations touristiques.\n@c0@"
  it: "@aSimon@bBeh, sa una cosa?\nPoteva andarle molto peggio! Questo posto non mi sembra affatto male, caro il mio Sire!\n㈡\nPensi quanto si sarebbe annoiato se l'avessero messa in un museo...!\n@c0@"
  ja: "@a@bピピン「この島は　近いうちに\n\t観光名所になるかも知れませんね。\n@c0@"
9:
  de: "@a%0%a001240@bOh! Dann hast du sicher gesehen, wie er entführt wurde, als du hier als Statue standest!\n@c0@"
  en: "@a%0%a001240@bOh! You must've seen him being snatched while you were standing here as a statue.\n@c0@"
  es: "@a%0%a001240@b¡Oh! Debiste de ver cómo lo secuestraban cuando eras una estatua.\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Tu as dû assister à l'enlèvement quand tu étais ici, transformé en statue.\n@c0@"
  it: "@a%0%a001240@bPapà, immagino che tu abbia assistito al rapimento, visto che la tua statua era proprio qui.\n@c0@"
  ja: "@a@b%a001240「そっか…\n\tお父さん　石になってるとき\n\tさらわれるの見たんだね。\n@c0@"
10:
  de: "@a%0%a001240@bWohin die Ungeheuer ihn wohl verschleppt haben?\n@c0@"
  en: "@a%0%a001240@bI wonder where the monsters can have\ncarried him off to.\n@c0@"
  es: "@a%0%a001240@bMe pregunto adónde se lo habrán llevado los monstruos.\n@c0@"
  fr: "@a%0%a001240@bJe me demande où les monstres ont bien pu l'emmener.\n@c0@"
  it: "@a%0%a001240@bI mostri avranno sicuramente portato il bambino in un nascondiglio segreto...\nMa dove, eh?\n@c0@"
  ja: "@a@b%a001240「魔物がさらったってことは\n\tどこへ　つれていったのかな……。\n@c0@"
11:
  de: "@a%0%a001250@bDer arme kleine Junge ist sicher genauso unglücklich wie seine Eltern, dass sie getrennt wurden.\n@c0@"
  en: "@a%0%a001250@bThat poor little boy must be just as upset as his parents, being separated like that.\n@c0@"
  es: "@a%0%a001250@bEse pobre niño debe de estar tan disgustado como sus padres... Verse separados así.\n@c0@"
  fr: "@a%0%a001250@bCe pauvre petit garçon doit être aussi malheureux que ses parents d'être séparé d'eux comme ça.\n@c0@"
  it: "@a%0%a001250@bPovero piccolo!\nChissà come soffre, lontano dalla sua famiglia...\n@c0@"
  ja: "@a@b%a001250「ジージョちゃんも\n\tお父さんや　お母さんいなくて\n\tさみしいよね……。\n@c0@"
12:
  de: "@a%0%a001250@bIch kann mir vorstellen, wie ihm zumute sein muss. So ähnlich war es ja auch für uns.\n@c0@"
  en: "@a%0%a001250@bI can imagine how he must feel. It's a bit like how it was for us.\n@c0@"
  es: "@a%0%a001250@bMe imagino como se siente. Es más o menos lo que nos pasó a nosotros.\n@c0@"
  fr: "@a%0%a001250@bJ'imagine ce qu'il doit ressentir. Ça a été un peu\nla même chose pour nous.\n@c0@"
  it: "@a%0%a001250@bE noi sappiamo bene quanto sia doloroso essere separati dai propri cari...\n@c0@"
  ja: "@a@b%a001250「気持ちわかるな…\n\tわたしたちも　そうだったから……。\n@c0@"
13:
  de: "@aSancho@bWeiß denn immer noch niemand, wo siss der kleine Micki befindet?\n@c0@"
  en: "@aSancho@bEstill no one knows where ees Georgie?\n@c0@"
  es: "@aSancho@b¿Todavía nadie sabe dónde está Antón?\n@c0@"
  fr: "@aSancho@bP-Personne ne s-sait où est Édouardⓡ\n@c0@"
  it: "@aSancho@b¿Ancora no se sabe donde está Lino?\n@c0@"
  ja: "@a@bサンチョ「あれから　ずっと\n\tジージョさんの居所は\n\tわからないままだと？\n@c0@"
14:
  de: "@aSancho@bDer arme kleine Chico! Und erst seine arme Mamá und Papá! Beten wir! Beten wir zur Göttin, dass er ist in Sisserheit!\n@c0@"
  en: "@aSancho@bThe poor boy! And hees poor madre and papá! We pray! We pray to the Goddess that he ees esafe.\n@c0@"
  es: "@aSancho@b¡Pobre chavito! Y sus pobres padres. ¡Habrá que rezar! Recemos nomás para que la Diosa nos lo guarde.\n@c0@"
  fr: "@aSancho@bLe p-pauvre chicoⓠ Et ses p-pauvres parentsⓠ Prions la D-Déesse qu'il soit sain et sauf.\n@c0@"
  it: "@aSancho@b¡Ay, povero niño! ¡Y poveros anche sua madre y suo padre! Esperiamo que la dea lo restituisca prestos all'affetto de los suos caros...\n@c0@"
  ja: "@a@bサンチョ「せめて　祈りましょう。\n\t無事であるように。\n@c0@"
15:
  de: "@aOtto@bIch wünscht', wir könnten ihn finden und zurückbringen... Wahrscheinlich hofft sie das auch insgeheim.\n@c0@"
  en: "@aTuppence@bIf only we could find him and bring him back... In fact, I wonder if that's what she's hoping.\n@c0@"
  es: "@aAlazar@bSi pudiéramos encontrarlo y traérselo de vuelta... De hecho, me pregunto si es lo que espera de nosotros.\n@c0@"
  fr: "@aInnocent@bSi seulement on pouvait le trouver et le ramener...\r\nJe me demande si ce n'est pas ce qu'elle espère,\r\nen fait.\n@c0@"
  it: "@aSimon@bUn prode avventuriero dovrebbe salvare quel bimbo innocente e riportarlo a casa, eh?\nMaestà, non le ronzano le orecchie...?\n@c0@"
  ja: "@a@bピピン「連れもどしてくれないものかねえ…\n\tって　それって　やっぱり\n\tボクたちに　言ってるんでしょうか？\n@c0@"
16:
  de: "@a%0%a001250@bSie weint im Schlaf, genau wie Sancho.\n@c0@"
  en: "@a%0%a001250@bShe's crying out in her sleep just like Sancho does.\n@c0@"
  es: "@a%0%a001250@bLlora por la noches, igual que Sancho.\n@c0@"
  fr: "@a%0%a001250@bElle pleure dans son sommeil, comme Sancho.\n@c0@"
  it: "@a%0%a001250@bLa disperazione di quella donna mi riempie il cuore di tristezza...\n@c0@"
  ja: "@a@b%a001250「うなされてる…\n\tサンチョと　いっしょ……。\n@c0@"
17:
  de: "@a%0%a001240@bOb es Mama wohl auch so ginge, wenn ich entführt würde?\n@c0@"
  en: "@a%0%a001240@bI wonder if Mum would be like that if\nI ever got kidnapped.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si mamá también lo haría si me secuestraran.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si maman serait dans cet état\nsi quelqu'un m'enlevait.\n@c0@"
  it: "@a%0%a001240@bAnche la mia mamma si dispererebbe in quel modo, se io o %a001250 fossimo rapiti...\n@c0@"
  ja: "@a@b%a001240「もし　ボクが\n\tいなくなったら　お母さんも\n\tあんなふうに　なるのかな……。\n@c0@"
18:
  de: "@aSancho@bIss kann nisst länger mit ansehen, wie diese Frau leidet! Komm, Meine Majestät! Lass uns nach ihm suchen gehen, por favor!\n@c0@"
  en: "@aSancho@bI, I can no watch thees woman esuffer any more! Come, My Majesty! We go now, por favor.\n@c0@"
  es: "@aSancho@bNi modo puedo ver a esta señora sufrir así. ¡Majestad! Vayámonos, por favor.\n@c0@"
  fr: "@aSancho@bJe ne p-peux par regarder cette femme s-souffrir plus longtempsⓠ Viens, Ma Majestéⓠ P-Partons\ntout de suite, por favor.\n@c0@"
  it: "@aSancho@b¡La sofferenza de esta señora me espezza el corazon!\n¡No resisto! Por favor, chico, vamonos...\n@c0@"
  ja: "@a@bサンチョ「見てられませんよ！\n\t%a000090王っ　行きましょう！\n@c0@"
19:
  de: "@a%0%a001240@bWarum er wohl nicht selbst nach seinem Sohn sucht? Du tätest das sofort, Papa, oder nicht?\n@c0@"
  en: "@a%0%a001240@bI wonder why he doesn't go off looking for his son. That's what you'd do, right, Dad?\n@c0@"
  es: "@a%0%a001240@bMe pregunto por qué no sale en busca de su hijo. Tú lo harías, ¿verdad papa?\n@c0@"
  fr: "@a%0%a001240@bJe me demande pourquoi il ne part pas à\nla recherche de son fils. Toi, c'est ce que\ntu ferais, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPerché quel signore non va a cercare suo figlio?\nScommetto che tu correresti subito a salvarci, se noi fossimo rapiti!\n@c0@"
  ja: "@a@b%a001240「あの人　どうして\n\t子どもをさがしに　行かないんだろ。\n\tお父さんなら　さがすよね？\n@c0@"
20:
  de: "@a%0%a001250@bDer arme Mann!\n@c0@"
  en: "@a%0%a001250@bThat poor man!\n@c0@"
  es: "@a%0%a001250@b¡Pobre hombre!\n@c0@"
  fr: "@a%0%a001250@bPauvre hommeⓠ\n@c0@"
  it: "@a%0%a001250@bPoverino, quel signore...\n@c0@"
  ja: "@a@b%a001250「かわいそう……。\n@c0@"
21:
  de: "@aSancho@bWeißt du, die Leute, sie spressen nisst viel darüber, aber es passiert trotzdem.\n@c0@"
  en: "@aSancho@bYou know, the people, they are no talking about eet eso often, but eet ees estill happening.\n@c0@"
  es: "@aSancho@bPues ya la gente no platica tanto sobre el tema, pero ocurre.\n@c0@"
  fr: "@aSancho@bT-Tu sais, les gens n'en p-parlent pas très souvent, m-mais ce genre de choses arrive quand même.\n@c0@"
  it: "@aSancho@bChico, purtroppos ce sono ancoras delinquentes que rapiscono niños. Se ne habla menos, ma estos crimines orribiles continuano a essere perpetratos...\n@c0@"
  ja: "@a@bサンチョ「あまり　表ざたには\n\tなっていないようですが　世界中で\n\tこういうことが　起きています。\n@c0@"
22:
  de: "@aSancho@bWenn ein kleines Kind entführt wird, das... das ist so fursstbar!\n@c0@"
  en: "@aSancho@bFor the young child to be kidnapped...\nEes, ees too horrible!\n@c0@"
  es: "@aSancho@bQue secuestren chamaquitos...\n¡Es horroroso!\n@c0@"
  fr: "@aSancho@bL'enlèvement des p-petits niños...\nC'est t-t-trop horribleⓠ\n@c0@"
  it: "@aSancho@bEs una cosa troppos crudele, chico...\nLa dea no dovrebbe permettere que accadano aziones tantos disumanas...\n@c0@"
  ja: "@a@bサンチョ「子供が　さらわれるなど…\n\tあってはならないことですよ！\n@c0@"
23:
  de: "@aBianca@bAlso hast du all die Jahre als Statue hier im Garten gestanden, %a000090?\n@c0@"
  en: "@aBianca@bSo you spent all those years as a statue in the garden here, eh, %a000090?\n@c0@"
  es: "@aBianca@bAsí que pasaste tus años de estatua en este jardín, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bAlors tu as passé toutes ces années comme statue ici, dans le jardin, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, è qui che hai trascorso tanti anni sotto forma di statua, non è vero?\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\t石になった後　%a000090は\n\tこの家の庭にかざられてたのね。\n@c0@"
24:
  de: "@aBianca@bJetzt ist nicht die richtige Zeit, um über die Vergangenheit zu brüten. Wir sollten weitergehen.\n@c0@"
  en: "@aBianca@bNow's not the time for dwellin' on the past.\r\nWe should move on.\n@c0@"
  es: "@aBianca@bBueno, el pasado, pasado está.\nHay que continuar, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe n'est pas le moment de s'attarder sur le passé. Nous devrions continuer notre route.\n@c0@"
  it: "@aBianca@bQuesto non è il momento di pensare al passato, amore mio.\nDai, muoviamoci...\n@c0@"
  ja: "@a@bビアンカ「でも　今は\n\t思い出にひたっているヒマはないわ。\n\tさあ　行きましょう？\n@c0@"
25:
  de: "@aNera@bHier also hast du all die Jahre als Statue verbracht, Liebling.\n@c0@"
  en: "@aNera@bSo this is the place where you spent all those years as a statue, darling.\n@c0@"
  es: "@aNera@bAsí que fue aquí dove pasaste tutti esos años como estatua, caro mio.\n@c0@"
  fr: "@aNera@bAlors c'est ici que tu as passé toutes ces années transformé en statue, mon chéri.\n@c0@"
  it: "@aNera@bTesoro, allora è questo il luogo dove sei rimasto pietrificato per tanto tempo...\n@c0@"
  ja: "@a@bフローラ「そう…　あなたは\n\tここで　石像としての時間を\n\t何年も過ごしたのね……。\n@c0@"
26:
  de: "@aNera@bDas ist wirklich weit von dem Tempel entfernt, wo ich die ganze Zeit stand.\n@c0@"
  en: "@aNera@bThis place is certainly a fair distance from the temple I was at all that time.\n@c0@"
  es: "@aNera@bEste lugar está veramente lontano del templo en el que estuve yo.\n@c0@"
  fr: "@aNera@bCet endroit est assez loin du temple où je me trouvais à l'époque.\n@c0@"
  it: "@aNera@bQui siamo lontani dal tempio in cui era stata messa la mia statua...\n@c0@"
  ja: "@a@bフローラ「ここは　私が置かれていた\n\t神殿から　ずいぶん遠いわね。\n@c0@"
27:
  de: "@aNera@bEine scheußliche Vorstellung, dir so fern gewesen zu sein.\n@c0@"
  en: "@aNera@bIt's horrible to think about how far apart we were.\n@c0@"
  es: "@aNera@bEs horribile pensare lo lejos que estábamos el uno de otro.\n@c0@"
  fr: "@aNera@bC'est horrible de penser à toute la distance qui\r\nnous séparait.\n@c0@"
  it: "@aNera@bRipensare agli anni che abbiamo trascorso separati mi fa star male...\n㈡\nDevo guardare avanti, %a000090, a ciò che potremo fare insieme, senza tornare con la mente al tempo che hanno rubato alla nostra felicità...\n@c0@"
  ja: "@a@bフローラ「あなたと　こんなに\n\tはなされていたなんて……。\n@c0@"
28:
  de: "@a%0%a001240@bHe, das kommt mir bekannt vor! Hier hast du doch all die Jahre als Statue rumgestanden, nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bHey, I remember this place! This is where you spent all those years as a statue, right, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Eh! Me acuerdo de este sitio. Aquí es donde pasaste todos esos años cuando eras un estatua, ¿no, papi?\n@c0@"
  fr: "@a%0%a001240@bHé, je me souviens de cet endroitⓠ C'est là où tu as passé toutes ces années comme statue, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, mi ricordo di questo posto!\nÈ dove era finita la tua statua! Cioè, dove fosti messo quando ti trasformarono in statua, no?\n@c0@"
  ja: "@a@b%a001240「あ！　ここ覚えてる！\n\t石になった　お父さんが\n\tずっといた場所だよね？\n@c0@"
29:
  de: "@a%0%a001240@bWir wussten schon eine ganze Weile, bevor wir zu deiner Rettung kamen, dass du hier warst.\n@c0@"
  en: "@a%0%a001240@bWe knew you were here for a while before we actually came and rescued you.\n@c0@"
  es: "@a%0%a001240@bAntes de venir a rescatarte, ya sabíamos que estabas aquí desde hacía tiempo.\n@c0@"
  fr: "@a%0%a001240@bNous avons appris où tu te trouvais bien avant le moment où nous sommes réellement venus te sauver.\n@c0@"
  it: "@a%0%a001240@bQuando venimmo a salvarti, sapevamo già da un bel po' di tempo dove si trovava la tua statua...\n@c0@"
  ja: "@a@b%a001240「お父さんが　ここにいるって\n\tもう少し前から　知ってたんだ。\n@c0@"
30:
  de: "@a%0%a001240@bAber wir mussten ja erst herausfinden, wie man eine Statue wieder in einen Menschen verwandelt. Es tut mir leid, dass wir dich haben warten lassen.\n@c0@"
  en: "@a%0%a001240@bBut we didn't know how to turn a statue back into a human again. Sorry we kept you waiting a bit.\n@c0@"
  es: "@a%0%a001240@bPero no sabíamos como devolver a la vida una estatua. Siento que tuvieses que esperar.\n@c0@"
  fr: "@a%0%a001240@bMais à ce moment-là, nous ne savions pas comment faire pour transformer de nouveau une statue en être humain. Désolé de t'avoir un peu fait attendre.\n@c0@"
  it: "@a%0%a001240@bPerò non avevamo idea di come farti tornare un uomo in carne e ossa!\n㈡\nSarebbe stato pericoloso portarti con noi, così decidemmo che saremmo tornati a prenderti solo dopo aver trovato il modo di rianimarti...\n@c0@"
  ja: "@a@b%a001240「でも　石になった人を\n\t元にもどす方法が　わからなくて。\n\tごめんね…　来るの　おそくなって。\n@c0@"
31:
  de: "@a%0%a001250@bIch habe lange überlegt, was ich zu dir sagen sollte, wenn ich dich finden würde, Papa.\n@c0@"
  en: "@a%0%a001250@bI thought long and hard about how to first greet you when I found you, Dad.\n@c0@"
  es: "@a%0%a001250@bEstuve pensando mucho en qué decirte cuando te encontrase, papá.\n@c0@"
  fr: "@a%0%a001250@bJ'ai longtemps réfléchi à la façon dont je te saluerais la première fois que je te verrais, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, ricordi le parole che ti dissi, quando finalmente ti ritrovammo?\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんに\n\tなんて　ごあいさつしようか\n\tずっと　考えて　練習してたの。\n@c0@"
32:
  de: "@a%0%a001250@bAber dann war's irgendwie ganz leicht.\n@c0@"
  en: "@a%0%a001250@bI hope I made a good job of it.\n@c0@"
  es: "@a%0%a001250@bEspero que te gustara.\n@c0@"
  fr: "@a%0%a001250@bJ'espère que je m'en suis bien sortie.\n@c0@"
  it: "@a%0%a001250@bMi ero preparata quel discorsetto per mesi, e spero che ti sia piaciuto!\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんに\n\t上手に　あいさつできてたかな……。\n@c0@"
33:
  de: "@a%0%a001250@bSchön, dass du wieder lebst und atmest, Papa. Und nicht mehr in Stein verwandelt als Statue herumstehst.\n@c0@"
  en: "@a%0%a001250@bIt's nice to see you living and breathing again, Dad. Not like the statue you were all those years.\n@c0@"
  es: "@a%0%a001250@bMe alegra verte vivito y coleando, papi. No hecho una estatua como todos aquellos años.\n@c0@"
  fr: "@a%0%a001250@bC'est super de te voir de nouveau vivre et respirer, papa. Pas comme cette statue que tu as été toutes ces années.\n@c0@"
  it: "@a%0%a001250@bPapà, sai una cosa?\nTi preferisco ora, vivo e animato, rispetto a quando eri una statua.\n@c0@"
  ja: "@a@b%a001250「お父さん　あったかい……。\n\tもう　石じゃないもんね。\n@c0@"
34:
  de: "@aSancho@bEin Glück, dass der Señor, der hier lebt, kein Hitzkopf ist, findest du nisst, Chico?\n@c0@"
  en: "@aSancho@bEes lucky the señor who ees leeving here, he ees no hot een the head, eh?\n@c0@"
  es: "@aSancho@bPues menos mal que el señor que vive acá no es loco, ¿eh?\n@c0@"
  fr: "@aSancho@bC'est oune chance que le señor qui vit ici, il ne soit pas c-c-colérique, noⓡ\n@c0@"
  it: "@aSancho@bChico, siamo estatos fortunatos que el señor que vive aquí es una persona calma...\n@c0@"
  ja: "@a@bサンチョ「ここのご主人が\n\t短気な方でなくて　よかった。\n@c0@"
35:
  de: "@aSancho@bNisst auszudenken, wenn er deine Statue zerbrochen hätte, Chico... Iss... Iss weiß nisst, was iss dann getan hätte! (Schnüff)\n@c0@"
  en: "@aSancho@bEef he had broken your estatue, friend...\nI, I no know what I would do! (sniff)\n@c0@"
  es: "@aSancho@bImagina que hubiera roto tu estatua, chamaco...\nNo sé qué hubiera hecho. (snif)\n@c0@"
  fr: "@aSancho@bS'il avait cassé ta s-statue, chico...\nJe ne sais p-pas ce que j'aurais f-faitⓠ (snif)\n@c0@"
  it: "@aSancho@b¡Piensa que sarebbe estato de ti si lui, arrabbiato por el rapimentos del figlio, se fosse esfogato sulla tua estatua y l'avesse fatta a pezzos!\n㈡\n¡Ay, no lo voglio nemmenos pensar!\n@c0@"
  ja: "@a@bサンチョ「もし　石像の坊っちゃんを\n\tこわされていたらと思うと\n\tぞっとしますよ……。\n@c0@"
36:
  de: "@aSancho@bOhne deine klugen Kinderssen stündest du immer noch als eine Statue im Garten. Dafür haben sie wirkliss großes Lob verdient, Chico.\n@c0@"
  en: "@aSancho@bEes because of your wonderful children that you are back to normal now. You must eshower them weeth praises later, friend.\n@c0@"
  es: "@aSancho@bSi vuelve a ser normal es gracias a lo padrísimos que son sus hijos. Luego, pues me los llena de alabanzas.\n@c0@"
  fr: "@aSancho@bC'est grâce à tes m-merveilleux enfants que tu\nas r-retrouvé ton apparence normale, chico.\nPlus t-tard, pense à les f-féliciter.\n@c0@"
  it: "@aSancho@bChico, devi essere muy orgoglioso de los tuos figlios... No se sono mai persos d'animos, y hanno siempre creduto que te avremmo trovato.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんが　元にもどれたのは\n\tお子さまたちが　がんばったからです。\n\tあとで　ほめてあげてくださいね。\n@c0@"
37:
  de: "@aOtto@bHier also habt Ihr all die Jahre als Statue gestanden, %a000090?\n@c0@"
  en: "@aTuppence@bSo this is where you spent all those years as a statue, is it, %a000090?\n@c0@"
  es: "@aAlazar@bAquí es donde pasasteis todos esos años cuando erais una estatua, ¿no, %a000090?\n@c0@"
  fr: "@aInnocent@bAlors c'est ici que vous avez passé toutes ces années transformé en statue, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, è questo il luogo dove lei ha trascorso tanti anni sotto forma di statua, non è vero?\n@c0@"
  ja: "@a@bピピン「へえーっ　ここが\n\t%a000090さまが　石像として\n\tすごされた場所ですか。\n@c0@"
38:
  de: "@aOtto@bWas für ein lauschiges Plätzchen! Da wäre ich gar net überrascht, wenn die Insel schon bald vom Tourismus entdeckt würd'.\n@c0@"
  en: "@aTuppence@bWhat a lovely spot! I wouldn't be surprised if this island ends up on the tourist map before long.\n@c0@"
  es: "@aAlazar@b¡Es un sitio precioso! No me extrañaría que acabase siendo un lugar turístico.\n@c0@"
  fr: "@aInnocent@bQuel charmant endroitⓠ Ça ne m'étonnerait pas\nque cette île figure rapidement sur la liste des destinations touristiques.\n@c0@"
  it: "@aSimon@bBeh, sa una cosa?\nPoteva andarle molto peggio! Questo posto non mi sembra affatto male, caro il mio Sire!\n㈡\nPensi quanto si sarebbe annoiato se l'avessero messa in un museo...!\n@c0@"
  ja: "@a@bピピン「この島は　近いうちに\n\t観光名所になるかも知れませんね。\n@c0@"
39:
  de: "@aBianca@bWie schön, so viel Glück zu sehen! Und alles, weil du den grässlichen Orden vom Zugzwang in seine Schranken verwiesen hast, %a000090.\n@c0@"
  en: "@aBianca@bIt's nice to see someone so happy. And it's all thanks to you, %a000090, for puttin' that nasty Order of Zugzwang lot in their place.\n@c0@"
  es: "@aBianca@b¡Qué alegría ver a alguien tan feliz! Y es todo gracias a ti, %a000090, por haberle dado su merecido a esa Orden de Zugzwang, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bon de voir quelqu'un d'aussi heureux.\nEt tout ça grâce à toi, %a000090ⓠ Tu as réussi à neutraliser cet ignoble Ordre du Zugzwang.\n@c0@"
  it: "@aBianca@bÈ sempre bello vedere la gente piangere di gioia, %a000090...\nE il merito è tutto tuo!\n㈡\nSenza il tuo intervento, la Setta di Zugzwang starebbe ancora seminando dolori e dispiaceri in tutto il mondo!\n@c0@"
  ja: "@a@bビアンカ「うれしそう……。\n\tそれもこれも　光の教団を\n\tたおした　%a000090たちのおかげね。\n@c0@"
40:
  de: "@aNera@bWie schön! Da sieht man, dass sich all die Mühe, den Orden vom Zugzwang zu besiegen, voll gelohnt hat.\n@c0@"
  en: "@aNera@bHow lovely! This just goes to show how all of your efforts to defeat the Order of Zugzwang paid off.\n@c0@"
  es: "@aNera@b¡Va bene! Esto demuestra que tutti tus esfuerzos para vencer a la Orden de Zugzwang merecieron la pena.\n@c0@"
  fr: "@aNera@bC'est fantastiqueⓠ Voilà qui prouve bien que tous\ntes efforts pour vaincre l'Ordre du Zugzwang ont été payants.\n@c0@"
  it: "@aNera@bSei stato grande, %a000090!\n㈡\nPer fortuna hai sgominato la Setta di Zugzwang, altrimenti chissà quanta altra gente avrebbe sofferto per causa loro...\n@c0@"
  ja: "@a@bフローラ「よかったですわ。\n\tあなたたちが　チカラを　あわせて\n\t教団と　たたかったからですわね。\n@c0@"
41:
  de: "@a%0%a001240@bSie weint vor Freude! Das macht einen ja ganz verlegen!\n@c0@"
  en: "@a%0%a001240@bShe's so happy that she's actually crying!\nHow embarrassing!\n@c0@"
  es: "@a%0%a001240@b¡Está tan feliz que se le saltan las lágrimas!\n¡Qué vergüenza!\n@c0@"
  fr: "@a%0%a001240@bElle est tellement heureuse qu'elle en pleureⓠ\nC'est un peu gênant.\n@c0@"
  it: "@a%0%a001240@bÈ talmente felice che sta piangendo!\nOh, se fossi un tenerone come lo zio Sancho mi commuoverei anch'io!\n@c0@"
  ja: "@a@b%a001240「泣くほど　よろこばれると\n\tこまっちゃうよね。\n\tなんだか　テレくさいや！\n@c0@"
42:
  de: "@a%0%a001250@bManchmal muss man vor lauter Glück einfach weinen. Das ging mir auch so, als ich Mama gefunden hab.\n@c0@"
  en: "@a%0%a001250@bWhen you're really happy, you sometimes cry. That's what happened to me when we found Mum.\n@c0@"
  es: "@a%0%a001250@bA veces se puede llorar de felicidad. Es lo que me pasó cuando encontramos a mamá.\n@c0@"
  fr: "@a%0%a001250@bParfois, quand on est vraiment très heureux,\non pleure. Moi, ça m'est arrivé quand on a\nretrouvé maman.\n@c0@"
  it: "@a%0%a001250@bA volte si può piangere per la troppa gioia.\nAnche a me è successo quando abbiamo ritrovato la mamma...\n@c0@"
  ja: "@a@b%a001250「すごく　うれしいと\n\tなみだが　出るのよね。　わたしも\n\tお母さんに会えたとき　出ました。\n@c0@"
43:
  de: "@aSancho@bJetzt wissen wir ganz sisser, dass die Leute des Ordens vom Zugzwang die Verbresser sind.\n@c0@"
  en: "@aSancho@bNow we know for esure that thees Order of Zugzwang, they are the desperados.\n@c0@"
  es: "@aSancho@bAhora estamos reteseguros de que los malvados eran los de la Orden de Zugzwang.\n@c0@"
  fr: "@aSancho@bMaintenant, on est s-sûrs que l'Ordre du Zugzwang,\r\nil est finito.\n@c0@"
  it: "@aSancho@bAhora sappiamo con certezza que la Setta de Zugzwang no era un ordine religioso, ma un gruppo de bandidos. ¡Ay, que maledettos!\n@c0@"
  ja: "@a@bサンチョ「こうして考えると\n\tやはり　光の教団は\n\t悪の権化だったと　わかりますね。\n@c0@"
44:
  de: "@aOtto@bEs ist schön, wenn den Menschen so viel aneinander liegt. Wir sollten auch mal wieder in Humburg vorbeischauen, wisst Ihr.\n@c0@"
  en: "@aTuppence@bIt's nice to see people caring about each other so much. We should go home to Gotha every once in a while, you know.\n@c0@"
  es: "@aAlazar@bEs bonito ver cómo la gente se quiere. Deberíamos pasarnos por Pankraz de vez en cuando, ¿sabéis?\n@c0@"
  fr: "@aInnocent@bC'est sympa de voir des gens aussi attachés\r\nles uns aux autres. Nous devrions aller faire\r\nun tour à Gotha de temps à autre, vous savez.\n@c0@"
  it: "@aSimon@bMaestà, assistere al felice ricongiungimento di questa famiglia mi ha fatto venire nostalgia di casa... Sigh! Voglio tornare a Denim...\n@c0@"
  ja: "@a@bピピン「人を思いあうって　いいですね。\n\tボクたちも　たまには\n\tグランバニアへ帰りましょう。\n@c0@"
45:
  de: "@aBianca@bEs gibt nichts Wichtigeres als die Familie. Das ist mir jetzt mehr denn je bewusst.\n@c0@"
  en: "@aBianca@bThere's nothin' more important than family.\r\nI feel that more strongly than ever now.\n@c0@"
  es: "@aBianca@bNo hay nada más importante que la familia.\nAhora soy más consciente que nunca.\n@c0@"
  fr: "@aBianca@bIl n'y a rien de plus important que la famille.\r\nJe le ressens plus que jamais, aujourd'hui.\n@c0@"
  it: "@aBianca@bNon esiste nulla di più importante al mondo della propria famiglia...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　家族の\n\tだんらんって　大切なものよね。\n\t私も　今　強くそう思うわ。\n@c0@"
46:
  de: "@aNera@bIch gebe zu, dass mich das ein wenig neidisch macht. Es wäre so schön, wenn wir eines Tages ein normales Familienleben führen könnten.\n@c0@"
  en: "@aNera@bI must admit that I feel a little bit envious.\r\nIt would be so nice if we could have a normal\r\nfamily life one day.\n@c0@"
  es: "@aNera@bVeramente sento un po' de envidia.\nMe gustaría tener una famiglia normale algún día.\n@c0@"
  fr: "@aNera@bJe dois admettre que je les envie un peu. Ce serait tellement bien de pouvoir avoir une vie de famille normale, un jour.\n@c0@"
  it: "@aNera@bSpero che anche noi potremo presto tornare a essere una famiglia normale, come tutte le altre, e lasciarci alle spalle questa bruttissima storia...\n@c0@"
  ja: "@a@bフローラ「うらやましいですわ。\n\t私たちも　できるだけ　家族で\n\tふれあう時間を　作りたいですわね。\n@c0@"
47:
  de: "@a%0%a001240@bIhm scheint nicht klar zu sein, dass du die Statue bist, von der er spricht!\n@c0@"
  en: "@a%0%a001240@bHe doesn't seem to realise that you're the statue he's talking about!\n@c0@"
  es: "@a%0%a001240@bNo parece darse cuenta de sobre qué estatua está hablando.\n@c0@"
  fr: "@a%0%a001240@bIl n'a pas l'air de réaliser que la statue dont il parle, c'est toiⓠ\n@c0@"
  it: "@a%0%a001240@bQuel signore non ha capito che tu sei la statua di cui stava parlando!\n@c0@"
  ja: "@a@b%a001240「今の人　お父さんが来たのに\n\tわからないみたいね。\n@c0@"
48:
  de: "@a%0%a001240@bUnd das, nachdem du ihnen doch angeblich solches Glück gebracht hast! Wie unhöflich!\n@c0@"
  en: "@a%0%a001240@bAnd after you were supposed to have brought such good luck to them too. How rude!\n@c0@"
  es: "@a%0%a001240@bY encima les has traído buena suerte al final. ¡Qué desagradecidos!\n@c0@"
  fr: "@a%0%a001240@bAprès la chance que tu es censé leur avoir apportée, en plusⓠ C'est très grossierⓠ\n@c0@"
  it: "@a%0%a001240@bEppure ti ha avuto sotto il naso per un bel po' di anni!\nEvidentemente, non è un buon fisionomista...\n@c0@"
  ja: "@a@b%a001240「守り神とか言ってるのに\n\t冷たいなー。\n@c0@"
49:
  de: "@aSancho@bEs macht miss so froh, den Señor lachen zu sehen wie einen Arlequín. Es ist herzerwärmend, findest du nisst? (Schnüff)\n@c0@"
  en: "@aSancho@bEes eso wonderful to esee thees señor laughing like the buffoon. Eet warms your heart, no? (sniff)\n@c0@"
  es: "@aSancho@bMe encanta ver a este señor contento como castañuelas. Es que me enternece, nomás. (snif)\n@c0@"
  fr: "@aSancho@bC'est tellement m-merveilleux de voir ce señor\nrire c-comme ça. Ça réchauffe le cœur, noⓡ (snif)\n@c0@"
  it: "@aSancho@b¡Ay, que bueno! ¡Soy muy feliz que esto señor es tornato a sorridere!\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あのご主人が　あんなに笑って…\n\tいや　本当に　良かったですねえ。\n\tうっうっ……。\n@c0@"
50:
  de: "@aSancho@bDas sind gute Nachrissten für alle. Die Zeit hatte für sie stillgestanden, aber nun kann ihr Leben wieder weitergehen.\n@c0@"
  en: "@aSancho@bThees ees good news for everyone. The time,\r\neet was estopped for them, but now they can estart their lives again.\n@c0@"
  es: "@aSancho@bQué noticias tan padre para todos. Parecía que el tiempo no pasaba para ellos, pero ahora pueden comenzar de nuevo, órale.\n@c0@"
  fr: "@aSancho@bC'est oune bonne nouvelle p-pour tout le monde.\r\nLe t-temps s'était arrêté pour eux, mais à présent, ils p-peuvent recommencer à v-vivre.\n@c0@"
  it: "@aSancho@bAhora esta familia puede finalmentes ricominciare a vivere...\n¡Es una cosa fantastica, chico!\n@c0@"
  ja: "@a@bサンチョ「それは　良かったです。\n\tあの人たちの　止まっていた時間が\n\t動き出したんですね。\n@c0@"
51:
  de: "@aNera@bEs erging ihr wie mir: sie hatte keine Chance, ihr Kind aufwachsen zu sehen.\n@c0@"
  en: "@aNera@bShe's just like me, not having had the chance to watch her baby grow up.\n@c0@"
  es: "@aNera@bEs come yo, no ha podido ver a il suo bambino crecer.\n@c0@"
  fr: "@aNera@bElle est comme moi. Elle n'a pas eu la chance\r\nde voir son bébé grandir.\n@c0@"
  it: "@aNera@bQuella donna non ha avuto la possibilità di veder crescere suo figlio...\nCome la capisco...\n@c0@"
  ja: "@a@bフローラ「あの方も　子供の成長を\n\tそばで　見られなかったのね……。\n@c0@"
52:
  de: "@a%0%a001240@bIch brauch' kein Spielzeug! Was soll ich mit Spielzeug, wenn ich doch mit dem Zenithiaschwert spielen kann?\n@c0@"
  en: "@a%0%a001240@bI don't need toys! Why would I need toys when I have the Zenithian Sword to play with!?\n@c0@"
  es: "@a%0%a001240@b¡Yo no necesito juguetes! Para qué iba a necesitarlos si ya pudo jugar con la Espada de Zenithia.\n@c0@"
  fr: "@a%0%a001240@bMoi, je n'ai pas besoin de jouetsⓠ Pourquoi il m'en faudrait alors que j'ai déjà l'Épée zénithienneⓡⓐ\n@c0@"
  it: "@a%0%a001240@bA me non servono giocattoli!\nIo ho la Spada Zenithiana!\n@c0@"
  ja: "@a@b%a001240「ん？　おもちゃなら\n\tボク　いらないよ！\n\t天空のつるぎだって　あるし！\n@c0@"
53:
  de: "@aBianca@bNa, na, na! Das Zenithiaschwert ist doch nicht zum Spielen da! Ein bisschen mehr Respekt, wenn ich bitten darf!\n@c0@"
  en: "@aBianca@bHey! The Zenithian Sword en't a toy, you know!\r\nA bit of respect wouldn't go amiss!\n@c0@"
  es: "@aBianca@b¡Eh, la Espada de Zenithia no es ningún juguete!\nMuestra un poco de respeto, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bDis doncⓠ L'Épée zénithienne n'est pas un jouet, tu saisⓠ Tu devrais montrer un peu plus de respectⓠ\n@c0@"
  it: "@aBianca@bGuarda che la Spada Zenithiana non è mica un gioco!\nÈ un'arma molto pericolosa, e devi usarla solo quando è necessario!\n@c0@"
  ja: "@a@bビアンカ「こらー！\n\t天空のつるぎと　おもちゃを\n\tいっしょにするんじゃありませんっ！\n@c0@"
54:
  de: "@a%0%a001240@bTut mir leid, Mama!\n@c0@"
  en: "@a%0%a001240@bSorry, Mum!\n@c0@"
  es: "@a%0%a001240@b¡Perdón, mamá!\n@c0@"
  fr: "@a%0%a001240@bPardon, mamanⓠ\n@c0@"
  it: "@a%0%a001240@bAh, già... Me n'ero dimenticato.\nD'accordo, mammina. Allora me lo compri qualche giocattolo, sì?\n@c0@"
  ja: "@a@b%a001240「……は～い。\n@c0@"
55:
  de: "@aBianca@bUnsere Arbeit ist noch nicht getan, aber es ist schön, wenn man zwischendurch mal ein Dankeschön zu hören bekommt!\n@c0@"
  en: "@aBianca@bOur job en't done yet, but it's nice to get some thanks along the way.\n@c0@"
  es: "@aBianca@bNuestra misión no ha concluido, pero es bueno recibir un poco de agradecimiento entretanto, ¿sabes?\n@c0@"
  fr: "@aBianca@bNotre tâche n'est pas encore finie, mais c'est appréciable de récolter quelques remerciements\r\nen chemin.\n@c0@"
  it: "@aBianca@bI ringraziamenti fanno sempre piacere!\nSe la gente ci ringrazia, vuol dire che stiamo facendo un buon lavoro!\n@c0@"
  ja: "@a@bビアンカ「まだ　すべて\n\t終わったわけじゃないけど\n\t感謝されるのって　悪くないわね。\n@c0@"
56:
  de: "@aNera@bEr wurde durch den Orden vom Zugzwang entführt, nicht wahr? Es ist wunderbar, dass du ihn retten konntest.\n@c0@"
  en: "@aNera@bHe was taken in by the Order of Zugzwang, wasn't he? It's wonderful that you were able to rescue him.\n@c0@"
  es: "@aNera@bFue secuestrado por la Orden de Zugzwang, ¿vero? Qué bien que pudieses rescatarlo.\n@c0@"
  fr: "@aNera@bIl avait été enlevé par l'Ordre du Zugzwang,\nc'est çaⓡ C'est merveilleux que tu aies réussi\nà le sauver.\n@c0@"
  it: "@aNera@bQuel ragazzo era stato rapito dalla Setta di Zugzwang, non è vero?\nPer fortuna sei riuscito a liberarlo...\n@c0@"
  ja: "@a@bフローラ「あの方　教団に\n\tいらっしゃったのね。\n\t助けてあげられて　良かった……。\n@c0@"
57:
  de: "@a%0%a001240@bWenn wir diese Ungeheuer aus der Unterwelt sich selbst überlassen, dann geht die ganze Geschichte nur wieder von vorne los.\n@c0@"
  en: "@a%0%a001240@bIf we leave those monsters from the underworld\nto their own devices, the same thing is bound to happen again.\n@c0@"
  es: "@a%0%a001240@bSi permitimos que los monstruos del inframundo sigan haciendo su voluntad, volverá a pasar lo mismo.\n@c0@"
  fr: "@a%0%a001240@bSi on laisse les monstres des Enfers réaliser leurs plans, ce genre de chose se reproduira forcément.\n@c0@"
  it: "@a%0%a001240@bNon possiamo lasciare che le perfide creature del Regno degli Inferi continuino a seminare terrore...\n@c0@"
  ja: "@a@b%a001240「もしも　魔界の悪いヤツを\n\tほうっておいたら　きっと\n\tまた　同じことが　起こるよね！\n@c0@"
58:
  de: "@a%0%a001240@bWir müssen nach Nadiria, Papa, und zwar schnell!\n@c0@"
  en: "@a%0%a001240@bWe have to get to Nadiria, Dad, and fast!\n@c0@"
  es: "@a%0%a001240@bHay que ir a Nadiria, papá, ¡y pronto!\n@c0@"
  fr: "@a%0%a001240@bIl faut qu'on aille à Nadiria, papa, et viteⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, dobbiamo andare a Nadiria!\nE in fretta!\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\tはやく　魔界へ行こうよ！\n@c0@"
59:
  de: "@a%0%a001250@bSind wir ihm denn schon mal begegnet? Ich kann mich nicht recht erinnern... He he he!\n@c0@"
  en: "@a%0%a001250@bDid we meet him before? I don't really remember...\nHe he he!\n@c0@"
  es: "@a%0%a001250@b¿Lo conocemos? No me acuerdo, la verad...\n¡Ji, ji, ji!\n@c0@"
  fr: "@a%0%a001250@bOn l'a déjà rencontréⓡ Je ne m'en rappelle pas vraiment... Hi hi hiⓠ\n@c0@"
  it: "@a%0%a001250@bSono proprio contenta di aver liberato Lino e di avergli dato la possibilità di ricongiungersi alla sua famiglia...\n@c0@"
  ja: "@a@b%a001250「今の人と　前に会った？\n\t……わたし　忘れちゃった。\n\tえへへ……。\n@c0@"
60:
  de: "@aOtto@bNach allem, was wir getan haben, wär's eigentlich nur recht und billig, wenn uns die Leute auf Händen... Ähem! Schon gut, schon gut! Ich hab nix gesagt!\n@c0@"
  en: "@aTuppence@bWhen you consider all we did, we deserve a lot more gratitude than we geⓚⓛ Er, don't mind me! I'm just mumbling away!\n@c0@"
  es: "@aAlazar@bDespués de todo lo que hemos hecho, nos merecemos más gratitud de la que... Estooo, da igual. Estaba hablando solo.\n@c0@"
  fr: "@aInnocent@bQuand on voit tout ce qu'on a fait, on mériterait un peu plus de reconnaissance, quand... Euh, ne faites pas attention à moi. Je parle tout seulⓠ\n@c0@"
  it: "@aSimon@bPerché la gente, invece di essere riconoscente a parole, non ci invita a cena?\nUn pollo arrosto vale più di mille ⓕgrazieⓖ.\n@c0@"
  ja: "@a@bピピン「我々が　したことを考えれば\n\tまだまだ　感謝が足りな……\n\tっと　何か　聞こえました？\n@c0@"
61:
  de: "@aGriselda@bAlso hat man dich hier in diesem Garten aufgestellt, ja?\n@c0@"
  en: "@aDebora@bSo you were put on display here in this garden?\n@c0@"
  es: "@aStefania@b¿Así que te pusieron de decoración en este giardino?\n@c0@"
  fr: "@aPandora@bAlors c'est ici, dans ce jardin, que tu as été exposéⓡ\n@c0@"
  it: "@aViola@bLa tua statua fu messa in questo giardino, caro?\n@c0@"
  ja: "@a@bデボラ「ふうん…　あんたは　この庭に\n\tかざられてたんだ……。\n@c0@"
62:
  de: "@aGriselda@bTja, das bestätigt mal wieder, dass unsere Rollen als Diener und Herrscherin vorbestimmt waren...\n㈡\nImmerhin stand ich in Krokodilopolis und nicht in irgendeinem Garten!\n@c0@"
  en: "@aDebora@bI was in pride of place at the Crocodilopolis and you were stuck here. Our roles as servant and master are obviously predestined!\n@c0@"
  es: "@aStefania@bYo estaba en un lugar de honor en Cocodrilópolis y tú estabas aquí. ¡Estábamos predestinati a ser ama y sirviente!\n@c0@"
  fr: "@aPandora@bJ'étais à la place d'honneur à Crocodilopolis et toi,\ntu étais coincé ici. Apparemment, nous étions prédestinés à nos rôles de maître et de domestiqueⓠ\n@c0@"
  it: "@aViola@bLa mia, invece, venne sistemata nel punto più importante di Rettilopolis.\n㈡\nChi mi piazzò lì deve aver pensato che la mia sfolgorante bellezza avrebbe dato un tocco di classe ed eleganza a quel luogo triste e desolato...\n@c0@"
  ja: "@a@bデボラ「私が　大神殿で　あんたは　ここ。\n\t主人と　しもべの差は\n\tやっぱり　大きかったってことね。\n@c0@"
63:
  de: "@aGriselda@bWenn Sancho und die Kinder dich nicht gefunden hätten, ständest du jetzt immer noch hier.\n@c0@"
  en: "@aDebora@bIf Sancho and the children hadn't found you, you'd have ended up standing here forever.\n@c0@"
  es: "@aStefania@bSi Sancho y los bambini no te hubiesen trobato, te habrías quedado aquí para siempre.\n@c0@"
  fr: "@aPandora@bSi Sancho et les enfants ne t'avaient pas retrouvé, tu serais resté planté ici à jamais.\n@c0@"
  it: "@aViola@bSe Sancho e i bambini non ti avessero trovato, probabilmente saresti ancora qui...\nSono stati loro a salvarti.\n@c0@"
  ja: "@a@bデボラ「サンチョと　子供たちが\n\t元にもどしてくれなかったら　この庭に\n\tかざられたまま　ずっと……。\n@c0@"
64:
  de: "@aGriselda@bHach, was du uns allen für einen Ärger bereitet hast!\n@c0@"
  en: "@aDebora@bSee how much trouble you've caused us all!\n@c0@"
  es: "@aStefania@b¡Es que no haces más que causarnos problemi!\n@c0@"
  fr: "@aPandora@bTu vois un peu tous les soucis que tu nous as causésⓠ\n@c0@"
  it: "@aViola@bPer mostrare tutta la tua gratitudine, dovresti dedicare loro... una statua!\nIh ih ih!\n@c0@"
  ja: "@a@bデボラ「あんたって　私だけでなく\n\tサンチョと　子どもたちにも\n\t苦労かけてるのね。\n@c0@"
65:
  de: "@aGriselda@bUnd alles nur, weil mein Diener den Orden vom Zugzwang besiegt hat. Da wäre ein kleines Dankeschön ja wohl angebracht!\n@c0@"
  en: "@aDebora@bThat's all down to my servant having defeated the Order of Zugzwang. More thanks are in order if you ask me!\n@c0@"
  es: "@aStefania@bEso es porque mi sirviente derrotó a la Orden de Zugzwang. ¡Deberían darme las gracias più volte!\n@c0@"
  fr: "@aPandora@bC'est uniquement grâce à mon domestique que\nl'Ordre du Zugzwang a été vaincu. Un peu plus de reconnaissance ne serait pas de trop, à mon avisⓠ\n@c0@"
  it: "@aViola@bSiamo stati proprio bravi, eh?\nTu il braccio e io la mente, caro: siamo una squadra formidabile.\n@c0@"
  ja: "@a@bデボラ「それも　これも　私のしもべが\n\t光の教団を　たたきこわした　おかげよね。\n\tさあ　もっと　感謝しなさい！\n@c0@"
66:
  de: "@aGriselda@bBin ich froh, wenn wir diesen ganzen Unsinn hinter uns haben und ich mich endlich wieder entspannen kann. Also mach schnell, %a000090, hörst du?\n@c0@"
  en: "@aDebora@bI'd like to get all this nonsense over with and relax at last too, so you'd better pull your finger out, %a000090.\n@c0@"
  es: "@aStefania@bMe gustaría dejar atrás todo este lío y relajarme, así que ya puedes mover el trasero %a000090. ¿Capisci?\n@c0@"
  fr: "@aPandora@bJ'aimerais moi aussi pouvoir mettre un terme\nà toutes ces histoires et me reposer enfin.\nIl va falloir que tu te remues un peu, %a000090.\n@c0@"
  it: "@aViola@bChissà come mai somigli a quella statua, eh?\n㈡\nPer fortuna sei tornato un uomo in carne e ossa, anche se a volte dimostri di avere la testa dura come un sasso!\n@c0@"
  ja: "@a@bデボラ「私たちも　早く\n\tすべて終わらせて　のんびりしたいわ。\n\tだから　がんばってね　%a000090。\n@c0@"
67:
  de: "@aGriselda@bSie hat das Gleiche durchgemacht wie ich und ihr Baby nicht aufwachsen sehen...\n@c0@"
  en: "@aDebora@bShe's had the same experience as me, not having seen her baby grow up.\n@c0@"
  es: "@aStefania@bHa pasado por lo mismo que io: no ha podido ver crecer a il suo bambino.\n@c0@"
  fr: "@aPandora@bElle a vécu la même chose que moi en ne voyant pas son bébé grandir.\n@c0@"
  it: "@aViola@bAnche quella donna è stata privata della gioia di veder crescere suo figlio...\nSob!\n㈡\nSob! No, non sto piangendo...\nSob! Mi lacrimano gli occhi perché prima ho tagliato una cipolla! Sob! Sob!\n@c0@"
  ja: "@a@bデボラ「私と同じで　この人も\n\t子供たちが　大きくなるところを\n\t見られなかったのね……。\n@c0@"
68:
  de: "@aGriselda@bWenn er in deiner Schuld steht, dann auch in meiner. Schließlich habe ich hier das Sagen!\n@c0@"
  en: "@aDebora@bIf he's in your debt, then he's in mine too.\r\nI'm the boss around here after all.\n@c0@"
  es: "@aStefania@bCon quien está en deuda de verdad es con me: aquí sono yo la que toma las decisiones.\n@c0@"
  fr: "@aPandora@bS'il te doit quelque chose, alors il me le doit à moi aussi. C'est moi qui commande ici, après tout.\n@c0@"
  it: "@aViola@bNon montarti la testa, caro: le parole di riconoscenza e i ringraziamenti sono indirizzati a me, che sono il capo carismatico del gruppo.\n㈡\nTu sei solo l'umile esecutore dei miei ordini...\n@c0@"
  ja: "@a@bデボラ「%a000090は　この人にとって\n\t守り神さまだとすると\n\t私は　大女神さまかしらね。\n@c0@"
