150:
  de: "@a@b*: Manchmal findet man eine in der Wüste. Wenn Ihr eine für mich auftreibt, gebe ich Euch gern etwas Badesalz dafür.\n@c0@"
  en: "@a@b*: You sometimes come across them in the desert. If you could find me one, I'd be more than happy to give you some sinter in exchange.\n@c0@"
  es: "@a@b*: A veces te las encuentras en el desierto. Si me %H0860%Xconsigues%Yconseguís%Z una, %H0860%Xte%Yos%Z doy sales de esas.\n@c0@"
  fr: "@a@b*ⓢ Comme son nom l'indique, on en trouve dans le désert. Si jamais vous en trouviez une, je serais prêt à vous l'échanger contre des sels scintillants.\n@c0@"
  it: "@a@b*: Ho sentito dire che ce ne sono diverse nelle aree desertiche, ma soffro tremendamente il caldo, e non ho voglia di andarmene in giro tra le dune infuocate.\n㈡\n*: Se %H0860%Xti capitasse di trovare una di quelle rose, portamela. In cambio ti%Yvi capitasse di trovare una di quelle rose, portatemela. In cambio vi%Z darò dei sali da bagno.\n@c0@"
