0:
  de: "@a@b*: Das ist La Guardia, der Wachturm.\n@c0@"
  en: "@a@b*: This is La Guardia, the lookout tower.\n@c0@"
  es: "@a@b*: Esto es La Guardia, nuestra atalaya.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes à La Guardia, la tour de guet.\n@c0@"
  it: "@a@b*: Questa è la torre di sorveglianza di La Guardia.\n@c0@"
  ja: "@a@b＊「ここは　見はらしの塔。\n@c0@"
1:
  de: "@a@b*: Den hat Herr Onassetti bauen lassen, damit wir es rechtzeitig sehen, wenn Monster Mostroferrato angreifen wollen.\n@c0@"
  en: "@a@b*: Mr Briscoletti had it built so we'd know if ever monsters were coming to attack Mostroferrato.\n@c0@"
  es: "@a@b*: Don Rimaldi la construyó para poder detectar a tiempo cualquier monstruo que se acerque a Mostroferrato.\n@c0@"
  fr: "@a@b*ⓢ Monsieur Oscuroni l'a fait construire afin que nous puissions voir si des monstres approchent de Mostroferrato.\n@c0@"
  it: "@a@b*: Mister Fosconi ha voluto costruirla per conoscere in anticipo i movimenti dei mostri intorno a Mostroferrato.\n@c0@"
  ja: "@a@b＊「魔物たちが　おそって来たら\n\tすぐ　分かるようにと\n\tルドマンさんが　建てたのだ。\n@c0@"
2:
  de: "@a@b*: Es gibt eine alte Legende über einen Mann, der die Kontrolle über die Evolution erlangt und sich selbst in ein Monster verwandelt hat.\n@c0@"
  en: "@a@b*: There's an old legend about a man who mastered control of evolution and turned himself into a monster.\n@c0@"
  es: "@a@b*: Una vieja leyenda cuenta que un hombre domeñó la evolución y se transformó en monstruo.\n@c0@"
  fr: "@a@b*ⓢ Une ancienne légende raconte qu'un homme aurait maîtrisé le Secret de l'évolution et qu'il se serait transformé en monstre.\n@c0@"
  it: "@a@b*: Tempo fa mi raccontarono una storia.\nNarrava di un uomo che aveva appreso il segreto dell'evoluzione e si era trasformato in un mostro.\n@c0@"
  ja: "@a@b＊「かつて　究極の進化をもとめ\n\tおのれ自身を　魔物に\n\t変えてしまった者が　いたという。\n@c0@"
3:
  de: "@a@b*: Aber das große Böse in ihm erweckte den Zorn der Götter, und so wurde er in die Unterwelt verbannt.\n@c0@"
  en: "@a@b*: But the great evil within him provoked the anger of the gods, and he was sealed away in the underworld.\n@c0@"
  es: "@a@b*: Pero el gran mal que lo corrompía provocó la ira de los dioses, y fue encerrado en el inframundo.\n@c0@"
  fr: "@a@b*ⓢ Le mal qui le rongeait provoqua la colère des dieux et il fut enfermé dans le monde souterrain.\n@c0@"
  it: "@a@b*: Il male invase il suo spirito, e gli dei lo punirono confinandolo negli inferi.\n@c0@"
  ja: "@a@b＊「その　あまりの邪悪さゆえ\n\t神のいかりをかって　魔界へ\n\t封じられたというが……。\n@c0@"
4:
  de: "@a@b*: Er war bekannt als Großmeister Nimzo. Wenn die Legende stimmt, dann wäre er ganz bestimmt der Herrscher der Unterwelt.\n@c0@"
  en: "@a@b*: He was known as Grandmaster Nimzo. If the legend's true, he'd be the ruler of the underworld for sure.\n@c0@"
  es: "@a@b*: Se le conocía como Gran Maestro Nimzo. Si la leyenda es cierta, sin duda será el señor del inframundo.\n@c0@"
  fr: "@a@b*ⓢ Il est connu sous le nom de Grand Maître Nimzo.\nSi cette légende dit vrai, ce serait lui le maître des Enfers.\n@c0@"
  it: "@a@b*: Quell'uomo si chiamava Nimzo e, dopo essere stato imprigionato, divenne il Gran Maestro degli Inferi...\n@c0@"
  ja: "@a@b＊「その者の名は　ミルドラース！\n\tそんなヤツが　本当にいたとしたら\n\t魔界の王にでも　なりかねないな。\n@c0@"
5:
  de: "@a@b*: Aah! Diese Hitze! Ich... ich kann nicht weitergehen!\n@c0@"
  en: "@a@b*: Argh! The heat! It's...impossible to go any further!\n@c0@"
  es: "@a@b*: ¡Argh! ¡Qué calor! ¡No... no se puede ir más allá!\n@c0@"
  fr: "@a@b*ⓢ Ahⓠ Quelle chaleurⓠ ... Impossible d'aller plus loinⓠ\n@c0@"
  it: "@a@b*: Argh! Il calore è insopportabile!\nNon ce la faccio a proseguire...!\n@c0@"
  ja: "@a@b＊「ひゃー！　暑い　暑い！！\n\tとても　この先には\n\t進めないぞ！\n@c0@"
6:
  de: "@aLothar@bIch sehe, ich bin nicht der Einzige, der entschlossen genug ist, um so weit zu kommen.\n@c0@"
  en: "@aCrispin@bI see I'm not the only one determined enough to get this far.\n@c0@"
  es: "@aCrispín@bVeo que no soy el único lo bastante decidido para llegar aquí.\n@c0@"
  fr: "@aGaëtan Poura@bJe vois que je ne suis pas le seul à être suffisamment déterminé pour continuer.\n@c0@"
  it: "@aCandido@bVedo che non sono il solo che farebbe di tutto pur di sposare Nera...\n@c0@"
  ja: "@a@bアンディ「やあ　あなたも\n\tここまで　来たんですか！\n@c0@"
7:
  de: "@aLothar@bDer Ring des Feuers ist irgendwo in diesen Höhlen. Also... möge der Bessere gewinnen!\n@c0@"
  en: "@aCrispin@bThe Circle of Fire is in these caves somewhere.\r\nSo...may the best man win!\n@c0@"
  es: "@aCrispín@bEl Anillo de Fuego está oculto en estas cuevas.\r\nAsí que... ¡que gane el mejor!\n@c0@"
  fr: "@aGaëtan Poura@bL'Anneau du Feu est quelque part dans ces grottes.\nAlors... que le meilleur gagneⓠ\n@c0@"
  it: "@aCandido@bL'Anello di Fuoco è nascosto da qualche parte in queste grotte.\nBeh... Che vinca il migliore, dico io!\n@c0@"
  ja: "@a@bアンディ「この　洞くつの奥には\n\t炎のリングが　眠っているはず。\n\tおたがい　がんばりましょう。\n@c0@"
8:
  de: "@aLothar@bUuuh... Ist das heiß... Gleich schmilzt mir mein Gehirn weg... Aber ich werde nicht aufgeben!\n@c0@"
  en: "@aCrispin@bUuugh... It's so hot...\nMy head feels like it's melting...\nBut I won't give up!\n@c0@"
  es: "@aCrispín@b¡Ugh!... Hace tanto calor...\r\nSe me derrite la cabeza...\r\n¡Pero no me rendiré!\n@c0@"
  fr: "@aGaëtan Poura@bAaargh... Il fait si chaud...\nJ'ai l'impression que je vais fondre...\nMais je ne vais pas abandonner pour autantⓠ\n@c0@"
  it: "@aCandido@bUuurgh... Fa un caldo incredibile...\nNon resisto più...\nMa non posso arrendermi proprio adesso...\n@c0@"
  ja: "@a@bアンディ「うーん　暑いなあ。\n\tくらくらする……。\n\tでも　負けないぞ……。\n@c0@"
9:
  de: "@a@bIm Felsen ist ein Ring zu sehen, der wie ein glühendes Scheit leuchtet.\n@c0@"
  en: "@a@bThere's a ring buried in the rock, shining like\r\na fiery ember.\n@c0@"
  es: "@a@bEn la roca hay enterrado un anillo que brilla como un ascua.\n@c0@"
  fr: "@a@bUn anneau est incrusté dans la pierre et brille tel un morceau de braise rougeoyant.\n@c0@"
  it: "@a@bIncastonato nella roccia, un anello riluce come un tizzone ardente.\n@c0@"
  ja: "@a@b岩に　うめこまれた　リングが\nもえさかる炎のごとく\nかがやいている！\n@c0@"
10:
  de: "@a@b%0%a000120 erhält den Ring des Feuers!\n@c0@"
  en: "@a@b%0%a000120 obtains the Circle of Fire!\n@c0@"
  es: "@a@b¡%0%a000120 obtiene el Anillo de Fuego!\n@c0@"
  fr: "@a@b%0%a000120 obtient l'Anneau de Feuⓠ\n@c0@"
  it: "@a@b%0%a000120 ha trovato l'Anello di Fuoco!\n@c0@"
  ja: "@a@b%a000120は　炎のリングを　見つけた！\n@c0@"
11:
  de: "@a@b%0%a000180 steckt den Ring des Feuers ein!\n@c0@"
  en: "@a@b%0%a000180 acquires the Circle of Fire.\n@c0@"
  es: "@a@b¡%0%a000120 recibe el Anillo de Fuego!\n@c0@"
  fr: "@a@b%0%a000180 récupère l'Anneau de Feu.\n@c0@"
  it: "@a@b%0%a000180 prende l'Anello di Fuoco!\n@c0@"
  ja: "@a@b%a000180は　炎のリングを\n手に入れた！\n@c0@"
12:
  de: "@aLothar@bWenn ich es schaffe, zu einem Mann zu werden, der Neras würdig ist, dann bekommt Griselda vielleicht auch ein bisschen Respekt vor mir!\n@c0@"
  en: "@aCrispin@bIf I succeed in becoming a man worthy of Nera, then maybe Debora will begin to respect me too.\n@c0@"
  es: "@aCrispín@bSi consigo convertirme en un hombre digno de Nera, quizás Stefania empiece a respetarme.\n@c0@"
  fr: "@aGaëtan Poura@bSi je réussis à être digne de Nera, peut-être que Pandora commencera à me respecter, elle aussi.\n@c0@"
  it: "@aCandido@bSe riuscirò a conquistare Nera, otterrò anche il rispetto di sua sorella Viola.\n@c0@"
  ja: "@a@bアンディ「がんばって　フローラに\n\tふさわしい男になれば　デボラも\n\t認めてくれるはず……。\n@c0@"
13:
  de: "@a@b*: Willkommen in Mostroferrato, dem altehrwürdigen Sitz der Familie Onassetti.\n@c0@"
  en: "@a@b*: Welcome to Mostroferrato, ancient stronghold of the Briscoletti family.\n@c0@"
  es: "@a@b*: Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a Mostroferrato, antigua fortaleza de la familia Rimaldi.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Mostroferrato, l'ancien bastion de la famille Oscuroni.\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xgiovanotto. Benvenuto%Z%B0110%Xsignorina. Benvenuta%Z%Y%R0000%Xsignorine. Benvenute%Ysignori. Benvenuti%Z%Z a Mostroferrato, feudo dell'illustre famiglia Fosconi.\n@c0@"
  ja: "@a@b＊「ここは　サラボナの町よ。\n@c0@"
14:
  de: "@a@b*: Ich habe Gerüchte gehört, wisst Ihr.\n@c0@"
  en: "@a@b*: I've heard rumours, you know.\n@c0@"
  es: "@a@b*: Corren rumores...\n@c0@"
  fr: "@a@b*ⓢ Il y a des rumeurs qui circulent, vous savez.\n@c0@"
  it: "@a@b*: Ho sentito una notizia molto interessante...\n@c0@"
  ja: "@a@b＊「本当か　どうかは\n\t知りませんが……。\n@c0@"
15:
  de: "@a@b*: Es heißt, der Schild der Onassettis ist kein anderer als der legendäre Zenithiaschild.\n@c0@"
  en: "@a@b*: People say the Briscoletti family shield is actually none other than the legendary Zenithian Shield.\n@c0@"
  es: "@a@b*: La gente dice que el escudo familiar de los Rimaldi no es otro que el legendario Escudo de Zenithia.\n@c0@"
  fr: "@a@b*ⓢ Certains disent que le bouclier de la famille\nOscuroni serait en fait le légendaire Bouclier zénithien.\n@c0@"
  it: "@a@b*: Pare che lo stemma della famiglia Fosconi non sia altro che il leggendario Scudo Zenithiano!\n@c0@"
  ja: "@a@b＊「ルドマンさんの家にある　盾は\n\t天空の盾とかいう　すごい\n\t宝だという　ウワサですよ。\n@c0@"
16:
  de: "@a@b*: Gerade kam ein Mann namens Lothar in die Stadt zurückgekrochen. Sein ganzer Körper war übersät von schlimmen Brandwunden!\n@c0@"
  en: "@a@b*: A man called Crispin just crawled into town with really bad burns all over him!\n@c0@"
  es: "@a@b*: ¡Hace poco llegó a la ciudad un tal Crispín lleno de horribles quemaduras!\n@c0@"
  fr: "@a@b*ⓢ Un monsieur appelé Gaëtan vient d'arriver en ville. Il avait des brûlures partoutⓠ\n@c0@"
  it: "@a@b*: Candido Roast è appena tornato al villaggio.\nAveva il corpo coperto di ustioni, quel poverino...\n@c0@"
  ja: "@a@b＊「ちょっと前　アンディって人が\n\t大ケガをして　帰ってきて\n\t大変だったんだよ！\n@c0@"
17:
  de: "@aBingo@bWuff, wuff...\n@c0@"
  en: "@aBingo@bAaarf, aaarf...\n@c0@"
  es: "@aBingo@bAaarf, aaarf...\n@c0@"
  fr: "@aBingo@bOuaf, ouaf...\n@c0@"
  it: "@aBingo@bArf! Arf! Arf...\n@c0@"
  ja: "@a@bリリアン「く～ん　く～ん。\n@c0@"
18:
  de: "@a@b*: Seht Ihr? Lothar hat sich wirklich schwer verletzt.\n@c0@"
  en: "@a@b*: You see? Crispin hurt himself really badly.\n@c0@"
  es: "@a@b*: %H0860%XVerás%YVeréis%Z... Crispín está fatal.\n@c0@"
  fr: "@a@b*ⓢ Vous avez vuⓡ Gaëtan a été salement brûlé.\n@c0@"
  it: "@a@b*: A momenti Candido ci lasciava la pelle...\n@c0@"
  ja: "@a@b＊「アンディさんは　ケガを\n\tしたんだってねえ。\n@c0@"
19:
  de: "@a@b*: Seid nur vorsichtig. Ihr solltet auf jeden Fall noch ein paar nützliche Dinge kaufen, bevor Ihr wieder loszieht. Geiz zahlt sich da nicht aus!\n@c0@"
  en: "@a@b*: You need to be careful. You'll definitely be wanting to buy a few useful items here before you go off again. It doesn't pay to be parsimonious!\n@c0@"
  es: "@a@b*: Hay que ir con cuidado. Antes de salir de nuevo, no estaría de más que %H0860%Xte compraras%Yos comprarais%Z algunas cosas. ¡La tacañería no conduce a nada!\n@c0@"
  fr: "@a@b*ⓢ Faites attention. Vous feriez mieux d'acheter quelques articles bien utiles avant de repartir. Il ne faut pas être pingre dans ce genre de situationⓠ\n@c0@"
  it: "@a@b*: Bisogna dotarsi del miglior equipaggiamento possibile, prima di imbarcarsi in imprese tanto pericolose!\nIl risparmio non è mai guadagno!\n㈡\n*: A proposito, non è che %H0860%Xti%Yvi%Z andrebbe di comprare qualcosa?\n@c0@"
  ja: "@a@b＊「あなたも　気をつけないと。\n\tうちで　いろいろ\n\t買ってった方が　いいですよ。\n@c0@"
20:
  de: "@a@b*: Ihr habt den Ring des Feuers? Tja, da habt Ihr jedenfalls mehr erreicht als Lothar. Er ist in einem furchtbaren Zustand zurückgekommen.\n@c0@"
  en: "@a@b*: You got the Circle of Fire?\r\nWell you did better than Crispin, then.\r\nHe came back in a terrible state.\n@c0@"
  es: "@a@b*: ¿Tienes el Anillo de Fuego?\r\nEntonces has superado a Crispín.\r\nVolvió en un estado lamentable.\n@c0@"
  fr: "@a@b*ⓢ Vous avez récupéré l'Anneau du Feuⓡ\nVous avez fait mieux que Gaëtan, alors.\nIl était en piteux état quand il est revenu.\n@c0@"
  it: "@a@b*: Hai trovato l'Anello di Fuoco?! Complimenti!\nCandido ha trovato solo ustioni e bruciature...\nEvidentemente, sei più in gamba di lui.\n@c0@"
  ja: "@a@b＊「炎のリングを　みつけたのか！\n\tアンディさんは　大ケガして\n\t帰って来たのに。\n@c0@"
21:
  de: "@a@b*: Immerhin wird er von Nera gepflegt, also hat die Sache ja auch noch ihr Gutes!\n@c0@"
  en: "@a@b*: Mind you, he is being nursed by Nera,\r\nso it's not all bad!\n@c0@"
  es: "@a@b*: Aunque lo está cuidando Nera: ¡no salió tan mal parado!\n@c0@"
  fr: "@a@b*ⓢ Remarquez, c'est Nera qui le soigne, alors ça pourrait être pireⓠ\n@c0@"
  it: "@a@b*: O forse lui è stato più furbo e fortunato di te, visto che adesso Nera gli sta facendo da crocerossina!\n㈡\n*: Chissà che non si sia ridotto in quello stato di proposito!\n@c0@"
  ja: "@a@b＊「でも　フローラさんが\n\t看病してくれるんだから\n\tいいよなあ……。\n@c0@"
22:
  de: "@a@b*: Ich wäre nicht überrascht, wenn Ihr es auch schaffen würdet, den Ring des Wassers zu holen.\n@c0@"
  en: "@a@b*: I wouldn't be surprised if you managed to get the Circle of Water too.\n@c0@"
  es: "@a@b*: No me sorprendería que obtuvieras también el Anillo de Agua.\n@c0@"
  fr: "@a@b*ⓢ Ça ne m'étonnerait pas que vous arriviez à récupérer l'Anneau de l'Eau aussi.\n@c0@"
  it: "@a@b*: Non mi stupirei affatto se tu riuscissi a trovare anche l'Anello d'Acqua, sai?\n@c0@"
  ja: "@a@b＊「キミなら　水のリングも\n\t手に入れるだろうな。\n@c0@"
23:
  de: "@a@b*: Wenn Ihr Euch das Ganze anders überlegt, könnt Ihr den Ring ja immer noch mir geben, was?\n@c0@"
  en: "@a@b*: If you change your mind about all this, you can always give me the ring, eh?\n@c0@"
  es: "@a@b*: Si cambias de opinión, siempre puedes darme el anillo, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Si vous changez d'avis, vous pouvez toujours me donner l'anneau, hein.\n@c0@"
  it: "@a@b*: Comunque, se cambiassi idea e volessi ritirarti dalla competizione per la mano di Nera, puoi sempre darmi l'anello!\n@c0@"
  ja: "@a@b＊「で　もし　気が変わったら\n\tオレに　リングを　おくれよ！\n@c0@"
24:
  de: "@a@b*: Tja, aber das ist wohl eine vergebliche Hoffnung!\n@c0@"
  en: "@a@b*: No, I guess that's not going to happen!\n@c0@"
  es: "@a@b*: ¡No, supongo que no!\n@c0@"
  fr: "@a@b*ⓢ Enfin, je crois que je peux toujours rêverⓠ\n@c0@"
  it: "@a@b*: Anzi, potrai darmeli tutti e due, se ti riuscisse di mettere le mani anche sul secondo!\nBella la mia idea, eh?\n@c0@"
  ja: "@a@b＊「なーんちゃって\n\tダメだろうなあ……。\n@c0@"
25:
  de: "@a@b*: Ihr wärt ein guter Fang, nicht wahr?\n@c0@"
  en: "@a@b*: You'd be quite a catch, wouldn't you?\n@c0@"
  es: "@a@b*: Menudo partidazo eres, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Vous savez que vous feriez un bon partiⓡ\n@c0@"
  it: "@a@b*: Detto tra noi, sei un bocconcino davvero niente male, sai?\n@c0@"
  ja: "@a@b＊「お兄さんって　ちょっと\n\tステキね。\n@c0@"
26:
  de: "@a@b*: Ich wette, Nera kommt ganz schön ins Grübeln, welcher junge Mann ihr der Liebste wäre! Hi hi hi!\n@c0@"
  en: "@a@b*: I bet Nera's having a hard time making up her mind which boy to choose! Hee hee hee!\n@c0@"
  es: "@a@b*: ¡A Nera le estará costando decidirse por un pretendiente! ¡Ji, ji, ji!\n@c0@"
  fr: "@a@b*ⓢ Je suis sûre que Nera doit avoir du mal à choisirⓠ Hé hé héⓠ\n@c0@"
  it: "@a@b*: Se Nera facesse la difficile e non volesse saperne di sposarti, vieni pure a piangere sulle mie... spalle.\nSarò lieta di consolarti! Eh eh eh!\n@c0@"
  ja: "@a@b＊「フローラさんが　悩むのも\n\t無理は　ないわ。\n\tうふふ。\n@c0@"
27:
  de: "@a@b*: Noch so einer, der um die Hand Neras anhält? Ach du meine Güte!\n@c0@"
  en: "@a@b*: So you're another suitor of Nera's, are you?\r\nDear oh dear!\n@c0@"
  es: "@a@b*: Entonces eres otro pretendiente de Nera, ¿verdad? ¡Vaya, vaya!\n@c0@"
  fr: "@a@b*ⓢ Alors, vous êtes l'un des prétendants de Nera, n'est-ce pasⓡ Ah là làⓠ\n@c0@"
  it: "@a@b*: Sei uno dei corteggiatori di Nera, non è così?\n@c0@"
  ja: "@a@b＊「お客さんも　フローラさんと\n\t結婚したいんだって？\n\tいやあ　大変だねえ。\n@c0@"
28:
  de: "@a@b*: Lothar hat sich in der Höhle mit flüssiger Lava ganz schlimm verbrannt.\n@c0@"
  en: "@a@b*: Crispin suffered some very serious injuries in that cave of molten lava.\n@c0@"
  es: "@a@b*: Crispín sufrió heridas muy graves en esa cueva de lava fundida.\n@c0@"
  fr: "@a@b*ⓢ Gaëtan a subi de graves blessures dans cette grotte pleine de lave en fusion.\n@c0@"
  it: "@a@b*: Candido è rimasto gravemente ferito in quella caverna piena di lava.\n@c0@"
  ja: "@a@b＊「アンディが\n\t溶岩の流れる　洞くつで\n\t大ヤケドしたんだよ。\n@c0@"
29:
  de: "@a@b*: Er hat allen große Sorgen gemacht, auch Nera. Also wirklich, was hat er sich nur dabei gedacht?\n@c0@"
  en: "@a@b*: He's caused everyone a lot of worry, including Nera. Honestly, what was he thinking?\n@c0@"
  es: "@a@b*: Todos estamos muy preocupados, incluida Nera. ¿Pero en qué estaba pensando?\n@c0@"
  fr: "@a@b*ⓢ Tout le monde s'est fait beaucoup de souci pour lui, même Nera. Sérieusement, qu'est-ce qui lui est passé par la têteⓡ\n@c0@"
  it: "@a@b*: Ci ha fatto preoccupare tutti, Nera per prima!\nMa che pensava di fare quello sconsiderato, eh?!\n@c0@"
  ja: "@a@b＊「フローラにまで　心配かけて\n\tしょうのない息子だよ。\n@c0@"
30:
  de: "@a@b*: Nera fühlt sich verantwortlich für das, was Lothar zugestoßen ist. Darum pflegt sie ihn rund um die Uhr.\n@c0@"
  en: "@a@b*: Nera says she feels responsible for what happened to Crispin, so she's been nursing\r\nhim night and day.\n@c0@"
