  fr: "@a@b*ⓢ Attendezⓠ N'en parlez surtout pas aux villageois.\nC'est juste entre vous et moi.\n@c0@"
  it: "@a@b*: Mi raccomando, %H0860%Xnon dire nulla agli abitanti del villaggio. Questa cosa deve rimanere tra me e te%Ynon dite nulla agli abitanti del villaggio. Questa cosa deve rimanere tra me e voi%Z.\n@c0@"
