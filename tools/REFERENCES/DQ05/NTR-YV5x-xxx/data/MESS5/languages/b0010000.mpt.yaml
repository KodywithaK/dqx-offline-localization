  fr: "@a@b*ⓢ Enfin, rien de ce qui fait du bien n'est gratuit.\nEn fait, ce que je voudrais vraiment, c'est une rose des sables.\n@c0@"
  it: "@a@b*: Purtroppo le cose belle sono sempre le più difficili da ottenere. A me, per esempio, piacerebbe avere una rosa del deserto.\n@c0@"
