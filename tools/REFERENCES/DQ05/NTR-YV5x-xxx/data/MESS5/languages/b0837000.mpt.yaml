14:
  de: "@aExotik-Annett@bWenn Ihr ein eigenes Stück Firlefanz herstellt, könnt Ihr es exportieren, wenn Ihr einem externen Kurator aus einer anderen Welt begegnet.\n@c0@"
  en: "@aExotic Annette@bIf you knock up an original knick-knack of your own, you can export it when you encounter an external exhibitor from another world.\n@c0@"
  es: "@aMontseta Troca i Porta@bSi consigue crear una cosina original propia, podrá exportarla cuando se encuentre con un gestor d'un altre mundo, tú.\n@c0@"
  fr: "@aAnnette Rouvaille@bSi vous créez de vos propres mains un objet de collection original, vous pouvez l'exporter lorsque vous rencontrez un exposant d'un autre monde.\n@c0@"
  it: "@aRamona@bSe %H0860%Xrealizzi%Yrealizzate%Z un souvenir originale, %H0860%Xpotrai%Ypotrete%Z scambiarlo con altri esperti di Souvexotic.\n@c0@"
  ja: "@a@bルル「%a000090さんが　オリジナルの\n\t名産品を作って　別世界とすれちがえば\n\t別世界の館長さんに　届きます。\n@c0@"
15:
  de: "@aExotik-Annett@bUnd im Austausch erhaltet Ihr von ihm oder ihr ein exotisches Firlefanz-Exemplar. Ist das nicht extraordinär?\n@c0@"
  en: "@aExotic Annette@bAnd in exchange, you'll extract a piece of exotica from him or her too. Isn't it extraordinary?\n@c0@"
  es: "@aMontseta Troca i Porta@bY a cambio, aconseguirá una cosina de importación suya. ¿A que es meravellos, eh?\n@c0@"
  fr: "@aAnnette Rouvaille@bEt en échange, vous recevrez de sa part une trouvaille de sa propre collection.\nN'est-ce pas extraordinaireⓡ\n@c0@"
  it: "@aRamona@bIn cambio del tuo Souvexotic %H0860%Xriceverai%Yriceverete%Z le loro creazioni esclusive! Non %H0860%Xtrovi%Ytrovate%Z che sia una cosa entusiasmante?\n@c0@"
  ja: "@a@bルル「そうすれば　受けとった館長さんから\n\tお礼の　オリジナル名産品が\n\t送られてくるんです。\n@c0@"
16:
  de: "@aExotik-Annett@bEuer frisch erworbenes Exponat wird mit extremer Sorgfalt im Expo-Saal ausgestellt.\n@c0@"
  en: "@aExotic Annette@bYour newly acquired piece of exotica will be exhibited with extreme care in the expo hall.\n@c0@"
  es: "@aMontseta Troca i Porta@bSu nueva cosina dⓘimportació s'exhibirà con gran orgullo en la sala d'exposicions.\n@c0@"
  fr: "@aAnnette Rouvaille@bL'objet de collection que vous viendrez d'acquérir sera alors disposé avec grand soin dans la salle d'exposition.\n@c0@"
  it: "@aRamona@bIl nuovo souvenir che %H0860%Xavrai%Yavrete%Z ottenuto farà bella mostra di sé nella sala dei Souvexotic.\n@c0@"
  ja: "@a@bルル「別世界の館長さんから届いた　名産品は\n\tたいせつに　この奥の　展示室に\n\tかざりますから　安心してくださいね。\n@c0@"
17:
  de: "@aExotik-Annett@bNatürlich werden auch Eure eigenen Exponate in den Expos der anderen Welten, auf die Ihr trefft, zu sehen sein.\n@c0@"
  en: "@aExotic Annette@bOf course, you can expect examples of your own expertise to be on display in the expos of the other worlds you encounter too.\n@c0@"
  es: "@aMontseta Troca i Porta@bY claro, ejemplos de su propio arte s'exhibirán en las exposicions d'altres mundos con los que haya entrado en contacte.\n@c0@"
  fr: "@aAnnette Rouvaille@bBien entendu, certaines de vos œuvres seront sans doute elles aussi exposées dans les salles des autres mondes que vous aurez rencontrés.\n@c0@"
  it: "@aRamona@bOvviamente, il Souvexotic creato da %H0860%Xte%Yvoi%Z troverà posto nelle collezioni degli altri esperti di souvenir...\n@c0@"
  ja: "@a@bルル「もちろん　%a000090さんの名産品も\n\tすれちがった別世界で　展示室に\n\tかざられるはずですよ。\n@c0@"
18:
  de: "@aExotik-Annett@bAlso, äh... Dann wollen wir das Ganze nicht extrem in die Länge ziehen, sondern werden wir kreativ! Hurtig ans Werk!\n@c0@"
  en: "@aExotic Annette@bSo, er...stop exterminating time and let's get creative! Expediency is the key!\n@c0@"
  es: "@aMontseta Troca i Porta@b¡Hala! Més crear i menys picar. Deje volar su creativitat, ¿eh?\n@c0@"
  fr: "@aAnnette Rouvaille@bBon, euh... assez tergiversé. Place à la création.\nIl ne faut pas traînerⓠ\n@c0@"
  it: "@aRamona@bSpero di essere stata chiara, quindi... Bando alle ciance! Prima %H0860%Xinizierai%Yinizierete%Z a lavorare, prima le %H0860%Xtue%Yvostre%Z creazioni saranno esportate in tutto il mondo!\n@c0@"
  ja: "@a@bルル「ええと……\n\tでは　そろそろ　オリジナル名産品を\n\t作っていただきましょう。\n@c0@"
19:
  de: "@aExotik-Annett@bMit welchen Firlefanz-Exemplaren wollt Ihr nun Eure Experimente durchführen?\n@c0@"
  en: "@aExotic Annette@bWhat type of knick-knack are you hoping to experiment with, then?\n@c0@"
  es: "@aMontseta Troca i Porta@bEscolti, ¿con qué tipo de cosina quiere experimentar?\n@c0@"
  fr: "@aAnnette Rouvaille@bAlors, à quel type d'objet de collection voulez-vous vous essayerⓡ\n@c0@"
  it: "@aRamona@bAllora, con quale tipo di souvenir %H0860%Xvuoi cimentarti%Yvolete cimentarvi%Z?\n@c0@"
  ja: "@a@bルル「まずは　どんなタイプの名産品を\n\t作りたいか　えらんでください。\n@c0@"
20:
  de: "@aExotik-Annett@bIhr erschafft damit eine Expression Eures Wesens, also solltet Ihr etwas Mühe exerzieren, um eine Form zu suchen, die dem Auge exquisit erscheint.\n@c0@"
  en: "@aExotic Annette@bIt'll be an expression of your self, so expend some energy on choosing a form that you expect to be easy on the eye.\n@c0@"
  es: "@aMontseta Troca i Porta@bTenga en cuenta que es una forma d'expressió, así que elija algo con lo que se sienta %A0110%Xidentificat%Z%B0110%Xidentificada%Z.\n@c0@"
  fr: "@aAnnette Rouvaille@bIl reflètera ce que vous êtes, cela vaut donc la peine de passer un peu de temps à choisir un objet qui sera agréable à regarder.\n@c0@"
  it: "@aRamona@b%H0860%XRicorda che i Souvexotic che creerai ti rappresenteranno in tutto il mondo, quindi realizzali con la massima cura possibile%YRicordate che i Souvexotic che creerete vi rappresenteranno in tutto il mondo, quindi realizzateli con la massima cura possibile%Z.\n@c0@"
  ja: "@a@bルル「%a000090さんの　オリジナルですから\n\tどんな見た目がよいのか　その形を\n\tしんちょうに　決めてくださいね。\n@c0@"
21:
  de: "@aExotik-Annett@bJetzt ist es Zeit, Eurem exklusiven Exotika-Exemplar einen Namen zu geben...\n@c0@"
  en: "@aExotic Annette@bNow it's time to give your exceptional piece of exotica a name...\n@c0@"
  es: "@aMontseta Troca i Porta@bBien, ahora hay que darle un nom a su cosina de importació...\n@c0@"
