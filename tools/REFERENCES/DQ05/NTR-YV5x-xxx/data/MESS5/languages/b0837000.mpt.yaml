0:
  de: "@a@b*: Dieser Ort hat mich irgendwie unwiderstehlich angezogen, als zöge mich ein starker Wille hierher. Der Wille einer Person, die ich noch nicht kenne.\n@c0@"
  en: "@a@b*: I don't know why, but I was drawn to this place, as if by the strength of someone's will. Someone as yet unknown to me.\n@c0@"
  es: "@a@b*: No entiendo el motivo, pero he sido transportada a este lugar como por voluntad de alguien. Alguien desconocido para mí.\n@c0@"
  fr: "@a@b*ⓢ J'ignore pourquoi, mais j'ai été attirée dans cet endroit. Comme par la force d'une volonté encore inconnue.\n@c0@"
  it: "@a@b*: Non so come mai io sia finita qui. È come se fossi stata attirata dalla volontà di una persona a me sconosciuta...\n@c0@"
  ja: "@a@b＊「私は　旅の尼。\n\tどなたかの　強い思念に　みちびかれて\n\tこの地へ　やってまいりました。\n@c0@"
1:
  de: "@a@b*: Zweifellos ist das alles von der Göttin so vorherbestimmt. Ich hoffe nur, dass ich hier von Nutzen sein kann.\n@c0@"
  en: "@a@b*: It is all in the Goddess's grand plan, I have no doubt. I just hope I can be of use here.\n@c0@"
  es: "@a@b*: Los caminos de la Diosa son inescrutables. Solo espero ser de utilidad aquí.\n@c0@"
  fr: "@a@b*ⓢ Mais tout cela fait partie du grand plan de la Déesse, je n'en doute pas. J'espère juste pouvoir être utile, ici.\n@c0@"
  it: "@a@b*: Forse è stata la dea a richiedere la mia presenza in questo luogo. Qualunque sia il mio compito, spero di svolgerlo correttamente.\n@c0@"
  ja: "@a@b＊「これも　なにかの　ご縁ですわ。\n\tお役に立てれば　よいのですが……。\n@c0@"
2:
  de: "@a@b*: Oh, Tagchen auch! Ihr müsst der neue Firlefanz-Experte sein. Der neue Kurator? Exzellent! Ich bin Annett. Man nennt mich Exotik-Annett.\n@c0@"
  en: "@a@b*: Well, hel-lo! You must be the exciting new knick-knack expert. The new curator? Excellent!\r\nI'm Annette. People call me Exotic Annette.\n@c0@"
  es: "@a@b*: ¡Hola, %A0110%Xmaco%Z%B0110%Xmaca%Z! Debe de ser %O0960%Xel nou gestor%Y%A0110%Xamigo del nou gestor%Z%B0110%Xamiga del nou gestor%Z%Z, l'%A0110%Xexpert%Z%B0110%Xexperta%Z en cosinas. ¡Molt bé! Yo soy la Montseta, Montseta Troca i Porta.\n@c0@"
  fr: "@a@b*ⓢ Oh, bonjourⓠ Vous devez être %A0110%Xle nouvel expert%Z%B0110%Xla nouvelle experte%Z en trouvailles. %A0110%XLe nouveau conservateur%Z%B0110%XLa nouvelle conservatrice%Zⓡ Parfaitⓠ Je suis Annette. Annette Rouvaille, pour être précise.\n@c0@"
  it: "@a@b*: Salve! Tu sei %A0110%Xil nuovo esperto%Z%B0110%Xla nuova esperta%Z di souvenir, vero?\nIo sono Ramona, piacere di conoscerti.\n@c0@"
  ja: "@a@bルル「こんにちは。\n\t新しい館長さんですね？\n\t私は　ルル。\n@c0@"
3:
  de: "@aExotik-Annett@bDies ist die Exotika-Netz-Expo, bei der man extrafeine Exemplare extravaganten Firlefanzes mit anderen exzentrischen Exploratoren austauscht.\n@c0@"
  en: "@aExotic Annette@bThis is the extra-special Exotica Net Expo where you exhibit and exchange exemplary knick-knacks with other excentric explorers.\n@c0@"
  es: "@aMontseta Troca i Porta@bEsto es la Red de Exhibición de Importaciones, donde se pueden exhibir e intercambiar todo tipo de cosinas con altres aventurers, ¿eh?\n@c0@"
  fr: "@aAnnette Rouvaille@bVous êtes dans la très belle Expo des trouvailles, où vous pouvez exposer et échanger de remarquables objets avec d'autres explorateurs excentriques.\n@c0@"
  it: "@aRamona@bQuesta è la Exotica Net Expo, il luogo dove puoi esporre souvenir e scambiarli con altri collezionisti di questi meravigliosi oggetti.\n@c0@"
  ja: "@a@bルル「こちらの　お部屋は\n\t別世界の名産博物館と　すれちがう\n\t別世界コーナーです。\n@c0@"
4:
  de: "@aExotik-Annett@bLasst es mich erklären%O0960%X, %a000090%Y%Z. Seht Ihr, Ihr seid ja nicht allein. Es gibt noch viele weitere Firlefanzer in unserer großen Welt.\n@c0@"
  en: "@aExotic Annette@bLet me explain%O0960%X, %a000090%Y%Z. You're not exclusive, you see. There are other knick-knackerers in this expansive world of ours.\n@c0@"
  es: "@aMontseta Troca i Porta@bA ver%O0960%X, %a000090%Y%Z. No es %A0110%Xl'únic%Z%B0110%Xl'única%Z coleccionista de cosinas del mundo.\n@c0@"
  fr: "@aAnnette Rouvaille@bLaissez-moi vous expliquer%O0960%X, %a000090%Y%Z. Il existe d'autres personnes comme vous, d'autres amateurs d'objets de collection dans notre vaste monde.\n@c0@"
  it: "@aRamona@bLascia che ti spieghi come funziona l'Exotica Net Expo%O0960%X, %a000090%Y%Z. Vedi, tu non sei la sola persona al mondo a cui piace collezionare souvenir...\n@c0@"
  ja: "@a@bルル「じつは　この広い世界には\n\t%a000090さんのように　名産博物館の\n\t館長をしている人たちが　いて……\n@c0@"
5:
  de: "@aExotik-Annett@bBeim Exotika-Netz geht es darum, exotischen Firlefanz, oder ⓞExotikaⓟ, mit externen Kuratoren auszutauschen.\n@c0@"
  en: "@aExotic Annette@bExchanging exotic knick-knacks, or ⓗexoticaⓘ, with external exhibitors is exactly what Exotica Net is all about!\n@c0@"
  es: "@aMontseta Troca i Porta@bPor eso s'ha creat la Red de Exhibición de Importaciones, para intercambiar cosinas d'importació o ⓕimportacionesⓖ.\n@c0@"
  fr: "@aAnnette Rouvaille@bEt c'est là qu'intervient notre Réseau des trouvaillesⓠ\n㈡\nIl vous permet d'échanger des objets de collection exotiques, des ⓥtrouvaillesⓦ, avec des exposants extérieurs.\n@c0@"
  it: "@aRamona@bL'Exotica Net Expo permette di scambiare i particolarissimi souvenir chiamati ⓕSouvexoticⓖ con appassionati di tutto il mondo.\n@c0@"
  ja: "@a@bルル「そんな館長さんたちと　交流して\n\t名産品の輪を　広げるのが\n\tすれちがい通信　なんですよ。\n@c0@"
6:
  de: "@aExotik-Annett@bUnd hier könnt Ihr auch mit Euren eigenen Exotika experimentieren. Hier könnt Ihr eigenen Firlefanz für den Export in andere Welten erfinden.\n@c0@"
  en: "@aExotic Annette@bAnd you can experiment with exotica yourself here too. You can invent your own knick-knacks for export to other worlds.\n@c0@"
  es: "@aMontseta Troca i Porta@bY también puede hacer sus propias cosinas d'importació: puede crear cosinas que exportar a altres mundos.\n@c0@"
  fr: "@aAnnette Rouvaille@bEt ici, vous avez aussi la possibilité de vous essayer vous-même à la création de trouvailles.\n㈡\nVous pouvez inventer vos propres objets de collection à exporter vers d'autres mondes.\n@c0@"
  it: "@aRamona@bIn realtà, all'Exotica Net Expo puoi sbizzarrirti tu %A0110%Xstesso%Z%B0110%Xstessa%Z a creare nuovi Souvexotic, che potrai poi barattare con quelli realizzati da altri appassionati.\n@c0@"
  ja: "@a@bルル「館長さんが　こちらで\n\tオリジナルの　名産品を作って\n\tどこかの世界に送れば……\n@c0@"
7:
  de: "@aExotik-Annett@bUnd auch Kuratoren von Sammlungen wie Eurer werden Euch extrem gern ein Exemplar ihrer eigenen Exotika expedieren.\n@c0@"
  en: "@aExotic Annette@bCurators of exhibitions like yours will be extremely happy to send an example of their own original exotica back to you too.\n@c0@"
  es: "@aMontseta Troca i Porta@bLos gestores d'altres exposiciones com la suya también estarán encantats d'enviar un ejemplo de sus propias creaciones d'importació originals.\n@c0@"
  fr: "@aAnnette Rouvaille@bEt les autres conservateurs de musées semblables au vôtre seront ravis de vous envoyer en échange des exemplaires de leurs propres créations.\n@c0@"
  it: "@aRamona@bInfatti, gli altri esperti di souvenir saranno ben lieti di contraccambiare il tuo dono inviandoti i Souvexotic da loro prodotti.\n@c0@"
  ja: "@a@bルル「その世界の　館長さんが\n\t受けとって　お返しに　オリジナルの\n\t名産品を　送ってくれるんです。\n@c0@"
8:
  de: "@aExotik-Annett@bHabe ich Euch die Vorteile des Exotika-Netzes nun extensiv und exakt genug erklärt? Dann viel Spaß beim Austausch!\n@c0@"
  en: "@aExotic Annette@bSo, have I extolled the virtues of Exotica Net\r\nenough to excite you? Don't be excluded from\r\nthe fun, okay?\n@c0@"
  es: "@aMontseta Troca i Porta@bBueno, ¿se da cuenta de la utilitat de la Red de Exhibición de Importaciones?\r\nRecuerde: la importació es la importació.\n@c0@"
  fr: "@aAnnette Rouvaille@bAlors, ai-je suffisamment bien vanté les mérites du Réseau des trouvailles pour susciter votre intérêtⓡ Ne passez pas à côté, surtoutⓠ\n@c0@"
  it: "@aRamona@bPartecipare all'Exotica Net Expo è divertentissimo!\n@c0@"
  ja: "@a@bルル「せっかくですから　%a000090さんも\n\t館長として　別世界の人と\n\t交流してみてはいかがでしょう。\n@c0@"
9:
  de: "@aExotik-Annett@bSicher wollt Ihr doch den Spaß nicht verpassen, oder? Euch erwartet die aufregende Welt der Exotika!\n@c0@"
  en: "@aExotic Annette@bI'm sure you don't want to be excluded from the fun, do you? The exciting world of exotica awaits!\n@c0@"
  es: "@aMontseta Troca i Porta@bSeguro que está molt %A0110%Xinteressat%Z%B0110%Xinteressada%Z en el mundo de las importaciones, ¿eh? ¡Escolti, a importar sense parar!\n@c0@"
  fr: "@aAnnette Rouvaille@bJe suis sûre que vous ne voulez pas passer à côté d'une telle source de divertissement, n'est-ce pasⓡ Le monde surprenant des trouvailles vous attendⓠ\n@c0@"
  it: "@aRamona@b%H0860%XDivertiti%YDivertitevi%Z con noi!\nIl favoloso mondo dei Souvexotic %H0860%Xti%Yvi%Z aspetta!\n@c0@"
  ja: "@a@bルル「せっかくですから　%a000090さんも\n\t館長として　別世界の人と\n\t交流してみてはいかがでしょう。\n@c0@"
10:
  de: "@aExotik-Annett@bAber erst braucht Ihr noch ein paar exaktere Kenntnisse über den Firlefanz in dieser Welt.\nSonst bringt Ihr nie was Eigenes zustande.\n@c0@"
  en: "@aExotic Annette@bBut first you must extract a few more of the knick-knacks from this world. Otherwise you'll never be able to craft an original work.\n@c0@"
  es: "@aMontseta Troca i Porta@bPero primero ha de lograr hacerse con més informació sobre las cosinas de este mundo. De otro modo no podrás realizar creacions originals.\n@c0@"
  fr: "@aAnnette Rouvaille@bMais vous devez d'abord connaître un peu mieux les objets de collection de ce monde. Sinon, vous ne réussirez jamais à réaliser une œuvre originale.\n@c0@"
  it: "@aRamona@bPrima, però, %H0860%Xdovrai ampliare le tue%Ydovrete ampliare le vostre%Z conoscenze sui souvenir, altrimenti non %H0860%Xsarai%Ysarete%Z in grado di creare oggetti originali.\n@c0@"
  ja: "@a@bルル「ただし　もうすこし　この世界の\n\t名産品を　集めて研究しないと\n\tオリジナルは　作れませんね……。\n@c0@"
11:
  de: "@aExotik-Annett@bSicher kann man es auch ohne extensive Kenntnisse fertigbringen, mehr als fünf oder sechs neue Firlefanz-Exemplare zu sammeln, nicht wahr?\n@c0@"
  en: "@aExotic Annette@bI'm sure it won't take %H0860%Xan experienced explorer%Yexperienced explorers%Z like you long to acquire something in excess of five or six new knick-knacks though, will it?\n@c0@"
  es: "@aMontseta Troca i Porta@bSeguro que para %A0110%Xun aventurer%Z%B0110%Xuna aventurera%Z com usted hacerse con unas cuantas cosinas es bufar i fer ampolles, ¿eh?\n@c0@"
  fr: "@aAnnette Rouvaille@bIl ne doit pas falloir longtemps à %H0860%X%A0110%Xun explorateur%Z%B0110%Xune exploratrice%Z%Y%R0000%Xdes exploratrices %Ydes explorateurs%Z%Z comme vous pour acquérir 5 ou 6 exemplaires d'un objet de collection que vous possédez déjà, nonⓡ\n@c0@"
  it: "@aRamona@bSono certa che per %H0860%X%A0110%Xun esploratore in gamba come te%Z%B0110%Xun'esploratrice in gamba come te%Z%Y%R0000%Xesploratrici in gamba come voi%Yesploratori in gamba come voi%Z%Z sarà un gioco da ragazzi trovare cinque o sei souvenir!\n@c0@"
  ja: "@a@bルル「%a000090さんたちなら　きっと\n\tすぐに　５～６個くらい　集められますわ。\n\tがんばってくださいね。\n@c0@"
12:
  de: "@aExotik-Annett@bTagchen auch! Und willkommen bei der Exotika-Netz-Expo!\n@c0@"
  en: "@aExotic Annette@bHel-lo! And welcome to the Exotica Net Expo!\n@c0@"
  es: "@aMontseta Troca i Porta@b*: ¡Hola, %A0110%Xmaco%Z%B0110%Xmaca%Z! Bienvenid%A0110%Xo%Z%B0110%Xa%Z a la Red de Exhibición de Importaciones.\n@c0@"
  fr: "@aAnnette Rouvaille@bBonjourⓠ Et bienvenue à l'Expo des trouvaillesⓠ\n@c0@"
