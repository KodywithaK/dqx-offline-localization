  en: "@aSister@bWell, no doubt you need some time to get used to the idea. It's all very sudden.\n@c0@"
  es: "@aHermana@bSeguro que necesitas un poco de tiempo para acostumbrarte a la idea. Es todo tan repentino...\n@c0@"
  fr: "@aReligieuse@bEh bien, il va sans doute vous falloir un peu de temps pour vous faire à cette idée. C'est si soudain.\n@c0@"
  it: "@aSister@bTi ci vorrà del tempo per abituarti all'idea.\nCerte cose sembrano capitare all'improvviso, ma ti cambiano la vita per sempre.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんとビアンカちゃんの\n\t子供だから　きっと　玉のように\n\tかわいい　赤ちゃんが生まれますよ！\n@c0@"
318:
  de: "@aBianca@bTut mir leid, dass ich nicht schon eher was gesagt habe, %a000090.\n@c0@"
  en: "@aBianca@bSorry for not tellin' you before, %a000090.\n@c0@"
  es: "@aBianca@bSiento no habértelo dicho antes, %a000090.\n@c0@"
  fr: "@aBianca@bDésolée de ne t'avoir rien dit, %a000090.\n@c0@"
  it: "@aBianca@b%0%a000090, mi spiace di non averti detto nulla...\n@c0@"
  ja: "@a@bシスター「では　私は　これで。\n\tどうか　お大事に……。\n@c0@"
319:
