  ja: "@a@bデボラ「あら　起きたわね。\n\tやっぱり　お城のベッドは　いいわ。\n@c0@"
595:
  de: "@aGriselda@bJa, ich bin wirklich eine gute Menschenkennerin.\n㈡\nIch meine, du siehst aus wie ein Schlappschwanz, aber als du den Ring des Feuers und den Ring des Wassers gefunden hast, da wusste ich Bescheid.\n@c0@"
  en: "@aDebora@bYes, I am a great judge of character. I mean, you look like a total wimp, but when you got the Circle of Fire and the Circle of Water, I knew.\n@c0@"
  es: "@aStefania@bSí, veramente, tengo ojo para los hombres. Es decir, sembras poca cosa, ma cuando conseguiste el Anillo de Fuego y el Anillo de Agua lo supe.\n@c0@"
