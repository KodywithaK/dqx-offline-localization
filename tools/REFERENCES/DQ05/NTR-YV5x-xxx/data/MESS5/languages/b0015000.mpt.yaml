  it: "@aViola@bDevo congratularmi con me stessa.\nT'avevo giudicato bene fin dall'inizio...\n㈡\nNonostante sembri un pappamolle, sei riuscito a recuperare l'Anello di Fuoco e l'Anello d'Acqua.\nE ora si scopre anche che sei di sangue reale!\n@c0@"
  ja: "@a@bデボラ「さ　ボサッとしてないで\n\tやることがあるなら\n\tさっさと　でかけなさい。\n@c0@"
596:
