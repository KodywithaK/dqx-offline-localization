  ja: "@a@bサンチョ「すでに　ご存じでしょうが\n\tだんなさまは……　パパスさまは\n\tこの国の　王だったのです。\n@c0@"
561:
  de: "@aSancho@bNisst doch! Spiel deinem Onkel Sancho keine Streisse! Iss weiß, dass du es bist!\n@c0@"
  en: "@aSancho@bUf! You no trick your Uncle Sancho, friend!\nI know ees you.\n@c0@"
  es: "@aSancho@b¡Uf! ¡No tomes el pelo a tu tito Sancho, chamaco!\r\nSé que eres tú.\n@c0@"
  fr: "@aSancho@bHeinⓡ T-Tu ne feras pas croire ça à oncle Sancho, chicoⓠ J-Je sais que c'est toi.\n@c0@"
  it: "@aSancho@b¡Uffà, chico!\nNo fare escherzi allo zio Sancho.\nTanto yo lo so que sei tu...\n@c0@"
  ja: "@a@bサンチョ「今は　パパスさまの弟\n\tオジロンさまが　国王に\n\tなられていますが。\n@c0@"
562:
  de: "@aPrinz Sebastian@bNa geht, Sancho, alter Freund! Ihr seht ja ganz begeistert aus! Ihr habts wohl gute Nachrichten?\n@c0@"
  en: "@aPrince Albert@bAh, Sancho, you old dog! You look tickled pink!\r\nGood news, is it?\n@c0@"
  es: "@aRey Agila@b¡Ah, Sancho, chatín! ¡Te veo radiante!\r\nBuenas noticias, ¿no?\n@c0@"
  fr: "@aPrince Albert@bSancho, espèce de canailleⓠ Tu as l'air aux angesⓠ Tu as de bonnes nouvellesⓡ\n@c0@"
  it: "@aPrincipe Alberto@bSancho, vecchio mio! Come va? A giudicare dalla tua agitazione, direi che hai delle notizie da comunicarmi, e voglio sperare che siano buone.\n@c0@"
  ja: "@a@bサンチョ「さあ　坊っちゃん。\n\t私に　ついてきてください。\n@c0@"
563:
  de: "@aSancho@bSí, Señor! Wundervolle Nachrissten! Das hier ist...\n@c0@"
  en: "@aSancho@bSí, señor!\nThe wonderful news!\nThees ees...\n@c0@"
  es: "@aSancho@b¡Sí, señor!\r\n¡Noticias padrísimas!\r\nEste es...\n@c0@"
  fr: "@aSancho@bSi, señorⓠ De t-très bonnes nouvellesⓠ C-C'est...\n@c0@"
  it: "@aSancho@b¡Si, señor Altezza!\n¡Porto ottimas noticias!\nEsto chico es...\n@c0@"
  ja: "@a@bサンチョ「いいえ！\n\tそんなことを言っても\n\tこのサンチョには　わかります！\n@c0@"
564:
  de: "@aPrinz Sebastian@bGrundgütige! Ludwigs Sohn, sagt Ihr? %0%a000090 ist noch am Leben?\n@c0@"
  en: "@aPrince Albert@bGood Goddess! You mean, Pankraz's son?\n%0%a000090...is alive?\n@c0@"
  es: "@aRey Agila@b¡Santa Diosa! ¿Quieres decir que el hijo de Teudis... %a000090... está vivo?\n@c0@"
  fr: "@aPrince Albert@bPar la Déesseⓠ Le fils de Petrosⓡ\n%0%a000090... est vivantⓡ\n@c0@"
  it: "@aPrincipe Alberto@bSanta dea! Il figlio di Russel?!\nMa allora %a000090 è vivo?!\n@c0@"
  ja: "@a@bオジロン「おお　サンチョか。\n\tなにやら　うれしそうな顔。\n\tいい事でも　あったのかな？\n@c0@"
565:
  de: "@aPrinz Sebastian@bAber ja, du bist's wirklich, %a000090! Diese Augen! Genau wie die Frau Mama.\n@c0@"
  en: "@aPrince Albert@bBy Jove, it is you, %a000090!\nThose eyes! They're just like Mada's.\n@c0@"
  es: "@aRey Agila@b¡Por todas las diosas, eres tú, %a000090!\n¡Esos ojos! Son como los de Perséfone.\n@c0@"
  fr: "@aPrince Albert@bQue le grand cric me croqueⓠ\n%0%a000090, c'est toiⓡ\nCes yeuxⓠ Tu as le même regard que ta mère.\n@c0@"
  it: "@aPrincipe Alberto@bPerbacco! %0%a000090, sei davvero tu?\nSì, non c'è dubbio. Hai gli stessi occhi della povera Mada.\n@c0@"
  ja: "@a@bサンチョ「じつは　王さま……。\n@c0@"
566:
  de: "@aPrinz Sebastian@bNa, wer hätte das gedacht? Ich hätt' mir net träumen lassen, dass aus dem brüllenden Putzerl so ein g'standener junger Bursche werden würd'!\n@c0@"
  en: "@aPrince Albert@bWell, whoever would've guessed it? I never\r\nimagined that bawling baby would turn into\r\nsuch a fine young fellow!\n@c0@"
  es: "@aRey Agila@b¿Quién lo podría haber imaginado? ¡Nunca pensé que ese mocoso gritón se convertiría en un joven tan apuesto!\n@c0@"
  fr: "@aPrince Albert@bQui l'aurait cruⓡ Je n'aurais jamais pensé que ce petit bébé qui braillait à tout bout de champ se transformerait en un si beau jeune hommeⓠ\n@c0@"
  it: "@aPrincipe Alberto@bNon avrei mai immaginato di rivederti qui a Denim!\n@c0@"
  ja: "@a@bオジロン「なんと！　パパスの……\n\t兄上の息子の　%a000090が\n\t生きていたと申すかっ！\n@c0@"
567:
  de: "@aPrinz Sebastian@bAber was red' ich denn da! Ich hab mich ja net mal vorg'stellt, net wahr? Ich bin der Onkel Sebastian. Ludwig, dein Vater, war mein älterer Bruder.\n@c0@"
  en: "@aPrince Albert@bListen to me! I haven't even introduced myself, have I? I'm your uncle. Your father, Pankraz, was my older brother.\n@c0@"
  es: "@aRey Agila@bPero ¡qué digo! Si ni siquiera me he presentado. Soy tu tío. Tu padre, Teudis, era mi hermano mayor.\n@c0@"
  fr: "@aPrince Albert@bEt je ne me suis même pas présentéⓠ Je suis ton oncle. Ton père, Petros, était mon frère aîné.\n@c0@"
  it: "@aPrincipe Alberto@bMa non mi sono ancora presentato! Che imperdonabile mancanza... Io sono tuo zio Alberto, fratello minore di Russel.\n@c0@"
  ja: "@a@bオジロン「おお！　その目は\n\tまさしく　兄上の奥方\n\tマーサどのに　生きうつし！\n@c0@"
568:
  de: "@aPrinz Sebastian@bUnd wer ist dieses bombige Mädel, das du uns da mitg'bracht hast?\n@c0@"
  en: "@aPrince Albert@bAnd who's this bally bombshell of a girl you've brought with you, eh?\n@c0@"
  es: "@aRey Agila@bY quién es esta deslumbrante belleza que te acompaña ¿eh?\n@c0@"
  fr: "@aPrince Albert@bEt qui est cette charmante jeune femme pleine d'atouts que tu nous amènesⓡ\n@c0@"
  it: "@aPrincipe Alberto@bE chi è la vivace fanciulla che hai al tuo fianco?\n@c0@"
  ja: "@a@bオジロン「あの時の　赤ん坊が\n\tこれほど　りっぱに成長して\n\t帰ってくるとは……。\n@c0@"
569:
  de: "@aGriselda@bHmpf. Ihr seid der König? Für einen König seht Ihr aber nicht gerade sehr imposant aus. Mein Papa hat das pompöse Getue viel besser drauf.\n@c0@"
  en: "@aDebora@bHmph. You're the King? You're not very imposing for a king, are you? My papa does a better job of looking pompous than you.\n@c0@"
  es: "@aStefania@bPfff... ¿Y este es el Rey? Ma no impone niente, ¿vero?\nIl mio papino sí que sabe lo que es imponer...\n@c0@"
  fr: "@aPandora@bMmpf. C'est vous, le roiⓡ Vous n'en imposez pas beaucoup, pour un roi, nonⓡ Même mon père arrive\nà paraître plus pompeux que vous.\n@c0@"
  it: "@aViola@bTu saresti il capo di questo posto, non è così? Non vorrei sembrare scortese, ma non ne hai affatto l'aspetto. Mi sembri un po' un mollaccione...\n@c0@"
  ja: "@a@bオジロン「申しおくれたが\n\tわしは　そなたの父　パパスの弟の\n\tオジロンじゃ。\n@c0@"
570:
  de: "@aPrinz Sebastian@bHoppala! Alles in Ordnung, Gnädigste?\n@c0@"
  en: "@aPrince Albert@bSteady on there, old girl!\nAre you alright?\n@c0@"
  es: "@aRey Agila@b¡Cuidado, chatina!\r\n¿Estás bien?\n@c0@"
  fr: "@aPrince Albert@bNe bougez pas, jeune fille. Tout va bienⓡ\n@c0@"
  it: "@aPrincipe Alberto@bChe ti succede, ragazza mia?\nNon ti senti bene?\n@c0@"
  ja: "@a@bオジロン「して　となりにいる\n\tキレイな　おじょうさんは……？\n@c0@"
571:
  de: "@aSancho@bG-G-Griselda!\n@c0@"
  en: "@aSancho@bDebora!\n@c0@"
  es: "@aSancho@b¡Estefanía!\n@c0@"
  fr: "@aSancho@bP-P-Pandoraⓠ\n@c0@"
  it: "@aSancho@b¡Viola!\n@c0@"
  ja: "@a@bデボラ「ふ～ん　あなたが　王さま？\n\tなんだか　私のパパより\n\tカンロクないみたい……。\n@c0@"
572:
  de: "@aSancho@bDer Göttin sei Dank.\nGriselda, sie ist wieder wach.\n@c0@"
  en: "@aSancho@bThanks to the Goddess.\nDebora, eshe ees awake again.\n@c0@"
  es: "@aSancho@bGracias a la Diosa.\nEstefanía recién despertó.\n@c0@"
  fr: "@aSancho@bLa Déesse soit louée.\nPandora a r-repris ses esprits.\n@c0@"
  it: "@aSancho@bViola se es esvegliata.\n¡Ay, que bueno!\n@c0@"
  ja: "@a@bオジロン「こ　これは　いったい\n\tどうしたことだっ！？\n@c0@"
573:
  de: "@aSchwester@bIch weiß net, was in sie gefahr'n ist, in ihrem Zustand zu reisen.\n@c0@"
  en: "@aSister@bI don't know what she was thinking of, travelling in her condition.\n@c0@"
  es: "@aHermana@bNo sé qué se le ha pasado por la cabeza, viajar en su estado.\n@c0@"
  fr: "@aReligieuse@bJe ne comprends pas ce qui lui est passé par la tête. Voyager dans son état...\n@c0@"
  it: "@aSuora@bNon riesco a capire come mai questa ragazza abbia deciso di mettersi in viaggio, date le sue condizioni...\n@c0@"
  ja: "@a@bサンチョ「デ　デボラさん！\n@c0@"
574:
  de: "@aSchwester@bSie sagte, sie sei auch unterwegs in Bussolingen einmal zusammengebrochen.\n@c0@"
  en: "@aSister@bShe said she collapsed in Battenberg on the way here too.\n@c0@"
  es: "@aHermana@bHa dicho que se desmayó también en Habsburgo, viniendo hacia aquí.\n@c0@"
  fr: "@aReligieuse@bElle a dit qu'elle s'était aussi évanouie à Técarlo, en venant ici.\n@c0@"
  it: "@aSuora@bMi ha anche detto di aver perso i sensi a Neviternia.\n@c0@"
  ja: "@a@bサンチョ「よかった。\n\tデボラさん\n\t気が　ついたようですよ。\n@c0@"
575:
  de: "@aSchwester@bUnd was, wenn es zum Schlimmsten gekommen wär?\n@c0@"
  en: "@aSister@bWhat did she think she was going to do if the\r\nworst happened?\n@c0@"
  es: "@aHermana@b¿Qué tendría pensado hacer si ocurría lo peor?\n@c0@"
  fr: "@aReligieuse@bQu'aurait-elle fait si le pire était arrivéⓡ\n@c0@"
  it: "@aSuora@bNo, non avrebbe mai dovuto sottoporsi a un simile sforzo.\n@c0@"
  ja: "@a@bシスター「まったく　そんな身体で\n\t旅を　してくるなんて……。\n@c0@"
576:
  de: "@aSancho@bIst es etwas Ernstes, Schwester? Ist sie sehr krank?\n@c0@"
  en: "@aSancho@bEes eserious, Sister?\nEshe ees very esick?\n@c0@"
  es: "@aSancho@b¿Es grave, hermana?\r\n¿Está muy enfermita?\n@c0@"
  fr: "@aSancho@bC-C'est grave, ma Sœurⓡ Elle est t-très maladeⓡ\n@c0@"
  it: "@aSancho@b¿Davvero, sorella?\n¿Es muy malata?\n@c0@"
  ja: "@a@bシスター「聞けば　山の上の村でも\n\t一度　たおれたというし……。\n@c0@"
577:
  de: "@aSchwester@bKrank? So würd' ich es net nennen.\n@c0@"
  en: "@aSister@bSick? I don't think you could call it sick.\n@c0@"
  es: "@aHermana@b¿Enferma? No creo que se le pueda llamar enfermedad.\n@c0@"
  fr: "@aReligieuse@bMaladeⓡ On ne peut pas appeler ça une maladie.\n@c0@"
  it: "@aSuora@bMalata? Oh, no!\nNon direi proprio che la nostra giovane amica soffra di qualche malattia...\n@c0@"
  ja: "@a@bシスター「もしものことが　あったら\n\tどうなさる　おつもり\n\tだったのかしら。\n@c0@"
578:
  de: "@aSchwester@bNet etwas so Schönes wie ihren Zustand.\n@c0@"
  en: "@aSister@bNot something as wonderful as this.\n@c0@"
  es: "@aHermana@bMás bien es algo maravilloso.\n@c0@"
  fr: "@aReligieuse@bPas quelque chose d'aussi merveilleux.\n@c0@"
  it: "@aSuora@bIl suo malore è il sintomo di qualcosa di meraviglioso...\n@c0@"
  ja: "@a@bサンチョ「そ　そんなに\n\tひどいのですか　シスター？\n@c0@"
579:
  de: "@aSancho@bQué?\n@c0@"
  en: "@aSancho@bQué?\n@c0@"
  es: "@aSancho@b¿Qué?\n@c0@"
  fr: "@aSancho@bQuéⓡ\n@c0@"
  it: "@aSancho@bNo entiendo...\n@c0@"
  ja: "@a@bシスター「ひどいも　なにも……。\n@c0@"
580:
  de: "@aSchwester@bGlückwunsch, %a000090.\nBald werdet Ihr Vater werden. Freut Ihr Euch schon?\n@c0@"
  en: "@aSister@bCongratulations, %a000090.\nAre you ready to be a father?\n@c0@"
  es: "@aHermana@b¡Enhorabuena, %a000090!\nPronto vas a ser padre. Menuda sorpresa, ¿eh?\n@c0@"
  fr: "@aReligieuse@bFélicitations, %a000090. Vous serez bientôt papa.\nVous saisissezⓡ\n@c0@"
  it: "@aSuora@bCongratulazioni, %a000090.\nPresto diventerai padre!\nSei felice, non è vero?\n@c0@"
  ja: "@a@bシスター「おめでたです。\n@c0@"
581:
  de: "@aSchwester@bJa. Eure Frau erwartet ein Kind. Mit ihr ist wirklich alles in Ordnung. Sie benötigt nur ein wenig Ruhe.\n@c0@"
  en: "@aSister@bYes. Your wife is with child. There's absolutely nothing wrong with her. She just needs rest.\n@c0@"
  es: "@aHermana@bSí. Tu esposa está en estado de buena esperanza. No le pasa absolutamente nada. Solo necesita descansar.\n@c0@"
  fr: "@aReligieuse@bOui. Votre femme est enceinte. Elle n'a aucun problème de santé. Elle a juste besoin de repos.\n@c0@"
  it: "@aSuora@bTua moglie è incinta, e presto partorirà.\nSta bene, ma ha bisogno di molto riposo.\n@c0@"
  ja: "@a@bサンチョ「へっ？\n@c0@"
582:
  de: "@aSchwester@bNoch ist kaum etwas zu sehen, aber nach dem, was sie mir erzählt hat, ist sie bereits recht weit.\n@c0@"
  en: "@aSister@bShe's hardly showing at all yet, but according to what she's told me, I'd say she's already quite well progressed.\n@c0@"
  es: "@aHermana@bApenas se le nota aún pero, por lo que me ha contado, yo diría que el embarazo está bastante avanzado.\n@c0@"
  fr: "@aReligieuse@bCela ne se voit pas encore, mais d'après ce qu'elle m'a dit, sa grossesse est déjà bien avancée.\n@c0@"
  it: "@aSuora@bInizialmente non ce n'eravamo resi conto perché la ragazza non ha ancora il pancione, ma credo che presto la sua gravidanza diventerà ben visibile.\n@c0@"
  ja: "@a@bシスター「おめでとうございます。\n\t%a000090さまは　もうすぐ\n\tお父さまに　なられますよ。\n@c0@"
583:
  de: "@aSancho@bDas ist ja herrliss!\n@c0@"
  en: "@aSancho@bThees ees wonderful!\n@c0@"
  es: "@aSancho@b¡Eso es padrísimo!\n@c0@"
  fr: "@aSancho@bC-C'est magnificoⓠ\n@c0@"
  it: "@aSancho@b¡Ma esta es una noticia esplendida!\n@c0@"
  ja: "@a@bシスター「そう……。\n\tデボラさんの　お腹の中に\n\t赤ちゃんが　いるのです。\n@c0@"
584:
  de: "@aSancho@bEin Bebé! Ein Bebé für meinen Chico! Du und Griselda... Sí, das wird ein wunderschönes Kind...\n@c0@"
  en: "@aSancho@bA bebé! My friend's bebé! You and Debora...\r\nSí, eet weell be esuch a beautiful child.\n@c0@"
  es: "@aSancho@b¡Un bebito! ¡El bebe de mi chamaquito! Tú y Estefanía...\nPues será un muchacho retecuero.\n@c0@"
  fr: "@aSancho@bOun bébéⓠ Oun bébé de mon chicoⓠ\nToi et Pandora... Si, ce sera oun b-beau bébé.\n@c0@"
  it: "@aSancho@b¡El mi chico diventerà padre!\nTu y Viola avrete un figlio...\n¡Soy seguro que sarà un niño maravilloso!\n@c0@"
  ja: "@a@bシスター「あまり　お腹が\n\t目立ちませんが　聞けば\n\tかなり　育っているようですね。\n@c0@"
585:
  de: "@aSchwester@bNun, ich lasse Euch jetzt allein. Passt auf Euch auf. Und denkt daran, dass Eure Frau jetzt guter Hoffnung ist.\n@c0@"
  en: "@aSister@bWell, I'll leave you alone now. Take care. And remember, your wife is in a delicate state now.\n@c0@"
  es: "@aHermana@bBueno, ahora me voy a retirar. Cuidaos. Y recuerda que el estado de tu esposa es delicado.\n@c0@"
  fr: "@aReligieuse@bEh bien, je vais vous laisser. À bientôt. N'oubliez pas que vous ne devez pas brusquer votre femme.\n@c0@"
  it: "@aSuora@bVi lascio soli. Abbi cura di tua moglie, adesso più che mai. La gravidanza richiede attenzioni, comprensione e tanto, tanto riposo.\n@c0@"
  ja: "@a@bサンチョ「こいつは　めでたい！\n@c0@"
586:
  de: "@aSchwester@bNun, sicher braucht Ihr etwas Zeit, um Euch an den Gedanken zu gewöhnen. Das kam ja recht plötzlich.\n@c0@"
  en: "@aSister@bWell, no doubt you need some time to get used to the idea. It's all very sudden.\n@c0@"
  es: "@aHermana@bSeguro que necesitas un poco de tiempo para acostumbrarte a la idea. Es todo tan repentino...\n@c0@"
  fr: "@aReligieuse@bEh bien, il va sans doute vous falloir un peu de temps pour vous faire à cette idée. C'est si soudain.\n@c0@"
  it: "@aSister@bTi ci vorrà del tempo per abituarti all'idea.\nCerte cose sembrano capitare all'improvviso, ma ti cambiano la vita per sempre.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんとデボラさんの\n\t子供だから　きっと　玉のように\n\tかわいい　赤ちゃんが生まれますよ！\n@c0@"
587:
  de: "@aGriselda@bWas? Ob ich das nicht wusste?\n@c0@"
  en: "@aDebora@bWhat? Didn't I know?\n@c0@"
  es: "@aStefania@b¿Come? ¿Qué si no lo sabía?\n@c0@"
  fr: "@aPandora@bQuoiⓡ Si je le savaisⓡ\n@c0@"
  it: "@aViola@bChe cosa?!\nMa che razza di domande mi fai, testone che non sei altro?!\n@c0@"
  ja: "@a@bシスター「では　私は　これで。\n\tどうか　お大事に……。\n@c0@"
588:
  de: "@aGriselda@bNatürlich wusste ich es, du Dumpfbacke! Aber wenn ich was gesagt hätte, hätte man mich doch zurück ins sterbenslangweilige Mostroferrato geschickt.\n@c0@"
  en: "@aDebora@bOf course I knew, you wally!\r\nBut if I'd let on, everyone would've tried to make me go back home to boring old Mostroferrato.\n@c0@"
  es: "@aStefania@bMa claro que lo sabía, lerdo.\nPero si hubiera dicho algo, la famiglia me hubiera enviado de vuelta a casa al aburrido Mostroferrato.\n@c0@"
  fr: "@aPandora@bBien sûr que oui, andouilleⓠ Mais si je l'avais dit, tout le monde aurait essayé de m'obliger à rentrer à la maison et je serais morte d'ennui à Mostroferrato.\n\n@c0@"
  it: "@aViola@bCerto che sapevo di aspettare un bambino!\nPerò, se lo avessi detto, avresti insistito per farmi tornare a Mostroferrato!\n㈡\nSaresti stato una lagna insopportabile!\n@c0@"
  ja: "@a@bシスター「まあっ。\n\tでも　無理ありませんわ。\n\tとつぜん　ですものね。\n@c0@"
589:
  de: "@aGriselda@bNa ja. Ich konnte es schließlich nicht ewig vor dir verheimlichen.\n@c0@"
  en: "@aDebora@bOh, well. I suppose you had to find out eventually.\n@c0@"
  es: "@aStefania@bVa bene. Tarde o temprano te ibas a enterar.\n@c0@"
  fr: "@aPandora@bEt puis zut. Il fallait bien que tu sois au courant un jour, après tout.\n@c0@"
  it: "@aViola@bE comunque, prima o poi lo avresti scoperto, no?!\nQuindi di cosa ti lamenti?!\n@c0@"
  ja: "@a@bデボラ「なに？　気がついていたんじゃ\n\tないかって？\n@c0@"
590:
  de: "@aGriselda@bAber keine Bange. Ich mach schon keinen Stress.\nIch hab beschlossen, in Humburg zu bleiben und das Kind hier zur Welt zu bringen.\n@c0@"
  en: "@aDebora@bDon't worry. I won't kick up a fuss. I've decided I'm going to stay in Gotha and have the baby here.\n@c0@"
  es: "@aStefania@bMa non ti preoccupare. No voy a hacer locuras. He decidido quedarme en Pankraz y tener al mio bambino aquí.\n@c0@"
  fr: "@aPandora@bNe t'inquiète pas, je ne vais pas en faire tout un plat. J'ai décidé de rester à Gotha et d'avoir le bébé ici.\n@c0@"
  it: "@aViola@bA ogni modo, ho deciso che partorirò a Denim.\nResterò qui fin quando il bambino non sarà nato.\n@c0@"
  ja: "@a@bデボラ「それは　気がついていたけど\n\tだからって　旅をやめて\n\tサラボナに帰るのは　つまらないし～。\n@c0@"
591:
  de: "@aGriselda@bIch weiß, dass du ohne mich ziemlich aufgeschmissen sein wirst, aber... damit wirst du klarkommen müssen!\n@c0@"
  en: "@aDebora@bI know you'll be lost without me by your side, but, well...get over it!\n@c0@"
  es: "@aStefania@bSé que sin me lo vas a pasar mal, ma tendrás que superarlo...\n@c0@"
