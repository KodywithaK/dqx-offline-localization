  es: "@a@b*: Lo siento. Los únicos que pueden entrar aquí sin permiso explícito del Rey son los miembros de la familia real.\n@c0@"
  fr: "@a@b*ⓢ Je suis désolé. Seuls les membres de la famille royale peuvent entrer ici sans l'autorisation préalable du roi.\n@c0@"
  it: "@a@b*: Mi spiace, ma le uniche persone a cui è consentito l'ingresso senza l'esplicito permesso del sovrano sono i membri della famiglia reale.\n@c0@"
  ja: "@a@bちいさなメダルを　いくつ見つけたかは\n『つよさ』で　馬車シンボルをえらぶと\n見ることができるぞ。　かくにんしよう！\n@c0@"
192:
  de: "@a@b*: Ihr g'hört aber nicht dazu, net wahr?\n@c0@"
  en: "@a@b*: You're not royalty, are you?\n@c0@"
  es: "@a@b*: ¿%H0860%XEs%YSon%Z de la realeza?\n@c0@"
  fr: "@a@b*ⓢ Vous faites partie de la famille royaleⓡ\n@c0@"
  it: "@a@b*: %H0860%XTu fai parte%YVoi fate parte%Z della famiglia reale?\n@c0@"
  ja: "@a@b%a000120は　%a000100を\n%a001400に　入れた！\n@c0@"
193:
  de: "@a@b*: Ha ha ha ha hah! Netter Versuch! Der war gut! So einer wie Ihr, und von Adel? Ha ha hah!\n@c0@"
  en: "@a@b*: Ha ha ha ha hah! Nice try! That's a good one! Someone like you, royalty? Ha ha hah!\n@c0@"
  es: "@a@b*: ¡Ja, ja, ja, ja, ja! ¡Buen intento! ¡Esa sí que es buena! ¿%H0860%XAlguien como tú%YGente como %R0000%Xvosotras%Yvosotros%Z%Z, de la realeza? ¡Ja, ja, ja!\n@c0@"
  fr: "@a@b*ⓢ Ha ha ha ha haⓠ Bien tentéⓠ\nVous, membre de la famille royaleⓡ Ha ha haⓠ\n@c0@"
  it: "@a@b*: Questa sì che è bella! Dico davvero!\nÈ una battuta fantastica.\nPeccato che io non abbia alcuna voglia di scherzare.\n@c0@"
  ja: "@a@b＊「王さまの　許しなく\n\tこの中に入れるのは\n\t王族のかたたち　だけだ。\n@c0@"
194:
  de: "@a@b*: Dann muss ich Euch bitten zu gehen.\n@c0@"
  en: "@a@b*: Then I must ask you to go away.\n@c0@"
  es: "@a@b*: Entonces debo pedir%H0860%Xle%Yles%Z que %H0860%Xse vaya%Yse vayan%Z.\n@c0@"
  fr: "@a@b*ⓢ Dans ce cas, je dois vous demander de circuler.\n@c0@"
  it: "@a@b*: %H0860%XDevo chiederti di andartene%YDevo chiedervi di andarvene%Z.\n@c0@"
  ja: "@a@b＊「それとも　お前が\n\t王族だと　いうのか？\n@c0@"
195:
  de: "@a@b*: Dies ist das Gemach des Königs. Doch Seine Majestät ruht zurzeit.\n@c0@"
  en: "@a@b*: This is the King's chamber.\nBut His Majesty is resting at the moment.\n@c0@"
  es: "@a@b*: Estos son los aposentos del Rey,\r\npero Su Majestad está descansando.\n@c0@"
  fr: "@a@b*ⓢ Ce sont les appartements du roi, mais Sa Majesté se repose en ce moment.\n@c0@"
  it: "@a@b*: Questi sono gli alloggi reali.\nIn questo momento, Sua Altezza sta riposando, e non è possibile disturbarlo.\n@c0@"
  ja: "@a@b＊「わっはっはっはっ。\n\tお前は　なかなか\n\t冗談が　うまいなっ。\n@c0@"
196:
  de: "@a@b*: Ich muss Euch bitten, ein andermal wiederzukommen.\n@c0@"
  en: "@a@b*: I must ask you to come back at another time.\n@c0@"
  es: "@a@b*: Debo pedir%H0860%Xle que vuelva%Yles que vuelvan%Z en otro momento.\n@c0@"
  fr: "@a@b*ⓢ Je dois vous demander de revenir plus tard.\n@c0@"
  it: "@a@b*: %H0860%XDovrai%YDovrete%Z tornare più tardi.\n@c0@"
  ja: "@a@b＊「出直してくるがよい。\n@c0@"
197:
  de: "@a@b*: Fräulein Gertraud will einfach nicht auf mich hören!\n@c0@"
  en: "@a@b*: Mistress Gertrude doesn't listen to a word I say!\n@c0@"
  es: "@a@b*: ¡Lady Fredegunda no me hace ningún caso!\n@c0@"
  fr: "@a@b*ⓢ Mademoiselle Gertrude ne veut pas m'écouterⓠ\n@c0@"
  it: "@a@b*: La signorina Gertrude non ascolta nemmeno una parola di ciò che dico.\n@c0@"
  ja: "@a@b＊「ここは　王の間。\n\tしかし　王さまは今\n\t休んでおられる。\n@c0@"
198:
  de: "@aGertraud@bIch wollte doch gar keine Prinzessin werden!\n@c0@"
  en: "@aGertrude@bI never asked to be a princess.\n@c0@"
  es: "@aFredegunda@bYo nunca pedí ser princesa.\n@c0@"
  fr: "@aGertrude@bJe n'ai jamais demandé à devenir princesse.\n@c0@"
  it: "@aGertrude@bIo non ho mai voluto essere una principessa!\nMai!\n@c0@"
  ja: "@a@b＊「出直してくるがよい。\n@c0@"
199:
  de: "@aGertraud@bUnd bloß, weil sie meinen Papa zum König von Humburg g'macht haben. Denen ist doch ganz egal, was ich denk'. Ich hab gar nichts zu sagen!\n@c0@"
  en: "@aGertrude@bIt's only because my father's become King of Gotha. It doesn't matter what I think. I don't have any say in it!\n@c0@"
  es: "@aFredegunda@bLo que pasa es que mi padre se ha convertido en rey de Pankraz. No importa lo que yo diga. ¡Mi opinión no cuenta para nada!\n@c0@"
  fr: "@aGertrude@bC'est juste parce que mon père a été sacré roi de Gotha. Tout le monde se moque de ce que je pense.\r\nJe n'ai pas mon mot à dire.\n@c0@"
  it: "@aGertrude@bPerò, siccome mio padre è diventato il Principe Reggente di Denim, ora mi tocca fare la principessa per forza! Uffà!\n@c0@"
  ja: "@a@b＊「ドリスさまったら\n\tちっとも　私のいうことを\n\t聞いてくれなくて……。\n@c0@"
200:
  de: "@aGertraud@bDas ist ungerecht! Ich will doch einfach nur spielen.\n@c0@"
  en: "@aGertrude@bIt's not fair.\nI just want to play.\n@c0@"
  es: "@aFredegunda@bNo es justo.\r\nYo solo quiero jugar.\n@c0@"
  fr: "@aGertrude@bCe n'est pas juste. Je veux juste m'amuser.\n@c0@"
  it: "@aGertrude@bNon è giusto.\nIo voglio giocare come fanno tutte le ragazzine della mia età!\n@c0@"
  ja: "@a@bドリス「あたしはさ\n\tお姫さまなんかに\n\tなりたくなかったのよ。\n@c0@"
201:
  de: "@a@b*: Ich kann mich noch an die langen Tage erinnern, als ich hier stand und darauf gewartet hab, dass König Ludwig zurückkommen würd'.\n@c0@"
  en: "@a@b*: I remember all those long days I stood here, waiting for King Pankraz to return.\n@c0@"
  es: "@a@b*: Recuerdo los largos días que pasaba aquí de pie, esperando que el rey Teudis regresase.\n@c0@"
  fr: "@a@b*ⓢ Je me souviens de ces longues journées passées ici à attendre le retour du roi Petros.\n@c0@"
  it: "@a@b*: Ricordo ancora i lunghi giorni che ho trascorso qui, in attesa del ritorno di re Russel...\n@c0@"
  ja: "@a@bドリス「でも　親父が\n\t王さまになったもんだから\n\t私もお姫さまに　されちゃってさ。\n@c0@"
202:
  de: "@a@b*: Und dann sah ich eines Tages plötzlich Herrn Sancho zur Burg heraufkommen.\n@c0@"
  en: "@a@b*: Then finally one day, I spotted Mr Sancho approaching the castle.\n@c0@"
  es: "@a@b*: Y, por fin, un día vi al señor Sancho acercándose al castillo.\n@c0@"
  fr: "@a@b*ⓢ Et un jour, j'ai vu monsieur Sancho qui approchait du château.\n@c0@"
  it: "@a@b*: Finalmente, un giorno vidi il signor Sancho che si stava avvicinando al castello.\n@c0@"
  ja: "@a@bドリス「あーあ。\n\tもっと　気楽に\n\t暮らしたかったなあ。\n@c0@"
203:
  de: "@a@b*: Ich kann Euch gar net sagen, wie froh ich war, ihn zu sehen!\n@c0@"
  en: "@a@b*: I can't tell you how happy I was to see him!\n@c0@"
  es: "@a@b*: ¡No hay palabras para describir lo contento que me puse!\n@c0@"
  fr: "@a@b*ⓢ Vous ne pouvez pas savoir comme j'étais heureux de le voirⓠ\n@c0@"
  it: "@a@b*: Ero felicissimo!\nCredevo che il nostro Re fosse con lui!\n@c0@"
  ja: "@a@b＊「かつて　私は　ここで毎日\n\tパパス王の　帰りを\n\t待っていました。\n@c0@"
204:
  de: "@a@b*: Aber so sehr ich auch schaute, von König Ludwig war nichts zu sehen.\n@c0@"
  en: "@a@b*: But however many times and however hard I looked, King Pankraz wasn't with him.\n@c0@"
  es: "@a@b*: Pero, por mucho que agucé la vista, no pude ver al rey Teudis con él.\n@c0@"
  fr: "@a@b*ⓢ Mais j'ai eu beau m'abîmer les yeux à scruter,\nle roi Petros n'était pas avec lui.\n@c0@"
  it: "@a@b*: Invece no.\nPer quanto guardassi, non riuscivo a scorgere la figura forte e fiera di re Russel.\n@c0@"
  ja: "@a@b＊「そして　ついに　城にやってくる\n\tサンチョどのの姿を\n\t見つけたのでした！\n@c0@"
205:
  de: "@a@b*: Ich war so traurig, dass er net bei ihm war!\n@c0@"
  en: "@a@b*: I can't tell you how sad I was not to see him!\n@c0@"
  es: "@a@b*: ¡No hay palabras para describir lo triste que me puse!\n@c0@"
  fr: "@a@b*ⓢ Vous ne pouvez pas imaginer combien j'étais triste de ne pas le voirⓠ\n@c0@"
  it: "@a@b*: Di colpo, fui colto da un'indicibile tristezza...\n@c0@"
  ja: "@a@b＊「あの時ほど\n\tうれしかったことは　ありません。\n@c0@"
206:
  de: "@a@b*: Willkommen in Humburg!\n@c0@"
  en: "@a@b*: Welcome to Gotha!\n@c0@"
  es: "@a@b*: ¡%H0860%X%A0110%XBienvenido%Z%B0110%XBienvenida%Z%Y%R0000%XBienvenidas%YBienvenidos%Z%Z a Pankraz!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Gothaⓠ\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto%Z%B0110%XBenvenuta%Z%Y%R0000%XBenvenute%YBenvenuti%Z%Z a Denim!\n@c0@"
  ja: "@a@b＊「しかし　いくら　目をこらしても\n\tそのあとに　いるはずの\n\tパパス王の姿が　見えませんでした。\n@c0@"
207:
  de: "@a@b*: Dies ist die Burgstadt Humburg!\n@c0@"
  en: "@a@b*: This is the castle town of Gotha.\n@c0@"
  es: "@a@b*: Esta es la ciudad fortificada de Pankraz.\n@c0@"
  fr: "@a@b*ⓢ Voici la ville fortifiée de Gothaⓠ\n@c0@"
  it: "@a@b*: Questa è la città-fortezza di Denim.\n@c0@"
  ja: "@a@b＊「サンチョどのの知らせを\n\t聞いたときほど\n\t悲しかったことは　ありません。\n@c0@"
208:
  de: "@a@b*: Unser alter König Ludwig war ein sehr kluger Herrscher, wisst Ihr.\n@c0@"
  en: "@a@b*: Our old king, King Pankraz, was a very sharp ruler, you see.\n@c0@"
  es: "@a@b*: Teudis, nuestro antiguo rey, era un gobernante muy astuto.\n@c0@"
  fr: "@a@b*ⓢ Notre ancien roi, le roi Petros, était un monarque très malin.\n@c0@"
  it: "@a@b*: Il nostro precedente sovrano, il grande re Russel, era un acuto stratega.\n@c0@"
  ja: "@a@b＊「ようこそ\n\tグランバニアへ！\n@c0@"
209:
  de: "@a@b*: Darum hat er b'schlossen, dass wir Humburger alle innerhalb der Burgmauern leben sollten, zum Schutz vor unseren Feinden.\n@c0@"
  en: "@a@b*: That's why he decided that all Gothans\r\nshould live within the castle walls, to protect\r\nus from our enemies.\n@c0@"
  es: "@a@b*: Por eso decidió que todos los ciudadanos de Pankraz viviesen dentro de las murallas, para protegernos de los enemigos.\n@c0@"
  fr: "@a@b*ⓢ Il avait décidé que tous les habitants du royaume devaient habiter dans l'enceinte du château pour être à l'abri en cas d'attaque.\n@c0@"
  it: "@a@b*: Decise che tutti gli abitanti di Denim dovessero vivere all'interno del castello, così sarebbe stato più semplice proteggerli da eventuali attacchi nemici.\n@c0@"
  ja: "@a@b＊「ここは\n\tグランバニアの城下町だよ。\n@c0@"
210:
  de: "@a@b*: Wuff! Wuff, wuff!\n@c0@"
  en: "@a@b*: Arf! Arf, arf!\n@c0@"
  es: "@a@b*: ¡Arf! ¡Arf, arf!\n@c0@"
  fr: "@a@b*ⓢ Ouaf, ouaf, ouafⓠ\n@c0@"
  it: "@a@b*: Arf!\nBau! Bau!\n@c0@"
  ja: "@a@b＊「先代の王　パパスさまは\n\tとても　できた王さまでね。\n@c0@"
211:
  de: "@a@b*: Wir waren hier lange Zeit ohne König, wisst Ihr. Er war fort, auf Reisen.\n@c0@"
  en: "@a@b*: We had a long spell here without a king at all.\r\nHe was away travelling, you see.\n@c0@"
  es: "@a@b*: Hemos pasado una larga temporada sin rey aquí.\r\nSe había marchado de viaje.\n@c0@"
  fr: "@a@b*ⓢ Pendant bien longtemps, on n'a pas eu de roi ici. Il était parti en voyage.\n@c0@"
  it: "@a@b*: Pe' troppo tempo er Regno de Denim è stato privo de 'na guida, perché er nostro Re è partito pe'n lungo viaggio dar quale nunn'ha più fatto ritorno.\n@c0@"
  ja: "@a@b＊「国民の安全を考えて\n\t町も　お城の中に\n\tつくったんですよ。\n@c0@"
212:
  de: "@a@b*: Wir haben alle darauf gewartet, dass er zurückkommt, aber... Tja, das ist nie g'schehen.\n@c0@"
  en: "@a@b*: We were all waiting for him to return, but...\r\nWell, he never did in the end.\n@c0@"
  es: "@a@b*: Todos esperábamos su regreso, pero...\r\nBueno, al final no regresó.\n@c0@"
  fr: "@a@b*ⓢ On a tous attendu son retour, mais... il est jamais revenu.\n@c0@"
  it: "@a@b*: L'amo atteso a lungo, ma 'e nostre speranze de rivedello se so' fatte sempre più flebbili, fino a spari' der tutto. Anvedi che storia triste, ahò!\n@c0@"
  ja: "@a@b＊「くーん　くーん。\n@c0@"
213:
  de: "@a@b*: Jetzt ist sein Bruder, Prinz Sebastian, unser neuer König. Er hat den Thron vor etlichen Jahren b'stiegen.\n@c0@"
  en: "@a@b*: Now his brother, Prince Albert, is our new king.\r\nHe took the throne quite a few years ago now.\n@c0@"
  es: "@a@b*: Ahora su hermano, Agila, es nuestro nuevo rey.\r\nYa hace unos años que subió al trono.\n@c0@"
  fr: "@a@b*ⓢ Maintenant, c'est son frère, le prince Albert, qui est notre nouveau roi. Il est monté sur le trône y'a quelques années.\n@c0@"
  it: "@a@b*: Ora è su' fratello Alberto a porta' la corona der Regno de Denim. È salito ar trono quarche anno fa cor titolo de Principe Reggente.\n㈡\n*: Nunn'è 'na perzona cattiva, ma re Russel era troppo più 'ngamba...\n@c0@"
  ja: "@a@b＊「この国は　ずいぶん長い間\n\t王さまが　旅に出てしまって\n\t王のいない時代が　続いたんだぜ。\n@c0@"
214:
  de: "@a@b*: Früher hat mal ein Meisterkunsthandwerker hier auf der Burg g'lebt, wisst Ihr. Er galt als wahrer Goldschmiedegott.\n@c0@"
  en: "@a@b*: There was once a master craftsman who lived here in the castle, you know. Known as a god among jewellers, he was.\n@c0@"
  es: "@a@b*: Hace mucho tiempo vivió en el castillo un maestro artesano. Era venerado por todos los orfebres.\n@c0@"
  fr: "@a@b*ⓢ Autrefois, un maître artisan vivait dans le château. On disait de lui que c'était le Roi des joailliers.\n@c0@"
  it: "@a@b*: Molto tempo fa, qui al castello viveva un abilissimo orefice. Era un artigiano talmente geniale da essersi meritato il soprannome di ⓕSir Gioielloⓖ.\n@c0@"
  ja: "@a@b＊「みんな　王さまの帰りを待ったさ。\n\tしかし　旅に出たまま\n\tついに　もどってこなくて……。\n@c0@"
215:
  de: "@a@b*: Aber nachdem König Ludwig die Burg verlassen hatte, ging auch er fort.\n@c0@"
  en: "@a@b*: But after King Pankraz left the castle, he left too.\n@c0@"
  es: "@a@b*: Pero, cuando el rey Teudis se fue del castillo, él también se fue.\n@c0@"
  fr: "@a@b*ⓢ Mais après le départ de Petros, il est parti\nlui aussi.\n@c0@"
  it: "@a@b*: Dopo la partenza di re Russel, anche l'orefice andò via.\n@c0@"
  ja: "@a@b＊「数年前　王位についた\n\tオジロンさまが\n\t今の王さまってわけさ。\n@c0@"
216:
  de: "@a@b*: Sein Sohn lebt aber immer noch hier. Er betreibt den Waffenladen oben.\n@c0@"
  en: "@a@b*: His son still lives here, though.\nHe runs the weapon shop upstairs.\n@c0@"
  es: "@a@b*: Aunque su hijo sigue viviendo aquí.\r\nEs el que lleva la armería del piso de arriba.\n@c0@"
  fr: "@a@b*ⓢ En revanche, son fils habite toujours ici.\nIl tient le magasin d'armes en haut.\n@c0@"
  it: "@a@b*: Suo figlio, però, vive ancora qui.\nGestisce il negozio d'armi che si trova al piano di sopra.\n@c0@"
  ja: "@a@b＊「かつて　この城には\n\t宝石細工の神さま　とまで言われた\n\t名工が　いたんだが……。\n@c0@"
217:
  de: "@a@b*: Wenn ich groß bin, werde ich Soldat und verteidige Humburg bis zum Letzten!\n@c0@"
  en: "@a@b*: When I grow up, I'm going to be a soldier, and I'm going to guard Gotha to the end!\n@c0@"
  es: "@a@b*: ¡Cuando crezca voy a ser soldado, y voy a proteger Pankraz hasta la muerte!\n@c0@"
  fr: "@a@b*ⓢ Quand je serai grand, je serai un soldat et je défendrai Gotha jusqu'au boutⓠ\n@c0@"
  it: "@a@b*: Da grande farò il soldato!\nDifenderò il Regno di Denim e tutti i suoi abitanti!\n@c0@"
  ja: "@a@b＊「パパス王が　城を出たあと\n\tその名工も　城を\n\t出てしまったんだよ。\n@c0@"
218:
  de: "@a@b*: Mein Papa ist Soldat. Soldaten sind klasse!\n@c0@"
  en: "@a@b*: My dad's a soldier. Soldiers are cool!\n@c0@"
  es: "@a@b*: Mi papá es soldado. ¡Los soldados son geniales!\n@c0@"
  fr: "@a@b*ⓢ Mon papa est un soldat et j'aime bien les soldatsⓠ\n@c0@"
  it: "@a@b*: Mio padre è un soldato.\nI soldati sono troppissimo fortissimi!\nE poi alle ragazze piacciono i soldati! Eh eh eh!\n@c0@"
  ja: "@a@b＊「その人の　息子なら\n\t今も　２階の武器屋に\n\t住んでるけどね。\n@c0@"
219:
  de: "@a@b*: Ich hoffe, auf der Welt wird wieder Frieden eingekehrt sein, wenn der Bub erst groß ist.\n@c0@"
  en: "@a@b*: I hope the world's a more peaceful place by the time my little boy grows up.\n@c0@"
  es: "@a@b*: Espero que el mundo sea un lugar más tranquilo cuando mi hijo se haga mayor.\n@c0@"
  fr: "@a@b*ⓢ J'espère que le monde sera plus sûr quand mon petit garçon sera grand.\n@c0@"
  it: "@a@b*: Spero che il mondo torni a essere un luogo sereno e tranquillo.\nLo vorrei non tanto per me, quanto per mio figlio...\n@c0@"
  ja: "@a@b＊「ボク　大きくなったら\n\t兵士になって\n\tこの国を　守るんだ！\n@c0@"
220:
  de: "@a@b*: Heute war Herr Sancho schon wieder nicht da. Ich frage mich, was da los ist.\n@c0@"
  en: "@a@b*: That's another day Mr Sancho hasn't been in. I wonder what's happened.\n@c0@"
  es: "@a@b*: Ya ha pasado otro día sin que aparezca el señor Sancho. Me pregunto qué le habrá sucedido.\n@c0@"
  fr: "@a@b*ⓢ Aujourd'hui non plus, monsieur Sancho n'est pas venu. Je me demande ce qui lui est arrivé.\n@c0@"
  it: "@a@b*: Il signor Sancho non è passato nemmeno oggi.\nNon gli sarà mica capitata una disgrazia?\n@c0@"
  ja: "@a@b＊「うん。　ボクのお父さんも\n\t兵士なんだよっ。\n@c0@"
221:
  de: "@a@b*: Er kam doch immer jeden Tag zur Kirche, um zu beten.\n@c0@"
  en: "@a@b*: He used to come to church to pray every single day.\n@c0@"
  es: "@a@b*: Solía venir a la iglesia a rezar todos los días.\n@c0@"
  fr: "@a@b*ⓢ Il avait l'habitude de venir tous les jours à l'église pour prier.\n@c0@"
  it: "@a@b*: Non trascorreva giorno che non venisse in chiesa a pregare.\nAdesso, invece, è un pezzo che non si fa vedere.\n@c0@"
  ja: "@a@b＊「うちの子が　大きくなるまでに\n\t平和な時代が　やってくると\n\tいいんだけど……。\n@c0@"
222:
  de: "@a@b*: Herr Sancho wird ja auch net jünger...\n@c0@"
  en: "@a@b*: Mr Sancho's getting on a bit now, I suppose...\n@c0@"
  es: "@a@b*: Supongo que el señor Sancho se está haciendo un poco mayor ya...\n@c0@"
  fr: "@a@b*ⓢ J'imagine que monsieur Sancho a dû reprendre du poil de la bête...\n@c0@"
