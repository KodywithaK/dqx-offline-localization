  es: "@aBianca@bQuería hacerlo, pero me preocupaba que dejases el viaje colgado por mi culpa, oye.\n@c0@"
  fr: "@aBianca@bJ'y ai pensé à un moment, mais j'avais peur que tu renonces à ton expédition à cause de moi.\n@c0@"
  it: "@aBianca@bAvrei voluto farlo, ma temevo che avresti rinunciato al viaggio per me.\n@c0@"
  ja: "@a@bシスター「まあっ。\n\tでも　無理ありませんわ。\n\tとつぜん　ですものね。\n@c0@"
320:
  de: "@aBianca@bAber ich höre jetzt auf, immer nur an mich zu denken. Ich werde nicht mehr darauf bestehen, mit dir durch die Weltgeschichte zu reisen.\n@c0@"
  en: "@aBianca@bI'll stop bein' so selfish now, though. I'm not goin' to insist on travellin' about with you no more.\n@c0@"
  es: "@aBianca@bPero ya no volveré a ser egoísta. No voy a volver a dar la lata con acompañarte en tus viajes, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bMais je vais arrêter d'être égoïste. Je n'insisterai plus pour voyager avec toi.\n@c0@"
  it: "@aBianca@bAdesso non potrò più accompagnarti nella tua ricerca...\nNon sono in condizioni di farlo.\n@c0@"
  ja: "@a@bビアンカ「%a000090　ごめんね。\n\t今まで　かくしていて……。\n@c0@"
321:
