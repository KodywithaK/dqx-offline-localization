  de: "@a@b*: Nein. Ich habe zu viel gesagt. Solch vergebliches Wunschdenken wird ihn nicht zurückbringen.\n@c0@"
  en: "@a@b*: No. I have said too much. Such vain wishes shall not bring him back.\n@c0@"
  es: "@a@b*: No. He hablado demasiado. Los fútiles deseos no pueden hacer que vuelva.\n@c0@"
  fr: "@a@b*ⓢ J'en ai trop dit. Inutile d'essayer de refaire le passé. Cela ne le ramènera pas.\n@c0@"
  it: "@a@b*: Povero Russel...\n@c0@"
  ja: "@a@b＊「そして　先代のパパス王には\n\tずいぶん　お世話になったのです。\n@c0@"
498:
  de: "@a@b*: Schlagt mich nicht zu Matsch! Ich bin schon so schlüpfrig genug. Und ich bin kein schlechter Schleim, wisst Ihr! Nein, wirklich nicht!\n@c0@"
  en: "@a@b*: Don't beat me to a pulp! I'm gooey enough as it is.\r\nAnd I'm not a bad slime, you know! Really! I promise!\n@c0@"
  es: "@a@b*: ¡No me %H0860%Xglopees%Yglopeéis%Z! Ya soy lo bastante viscoso.\n¡Y soy un limo bueno, en serio! ¡De verdad! ¡Lo promeglop!\n@c0@"
  fr: "@a@b*ⓢ Me réduisez pas en puuurée. Je suis déjà assez gluant comme ça. Et je suis pas méchantⓠ Je vous prooometsⓠ\n@c0@"
  it: "@a@b*: Non %H0860%Xslurpicchiarmi%Yslurpicchiatemi%Z! Non sono uno Slime malvagio! Per favore, non %H0860%Xfarmi%Yfatemi%Z dello slimale!\n@c0@"
  ja: "@a@b＊「もし　マーサさまが\n\tあんなことに　ならなければ\n\tパパス王は　きっと……。\n@c0@"
499:
  de: "@a@b*: Vor langer Zeit einmal war ich Königin Magdas Lieblingsschleim.\n@c0@"
  en: "@a@b*: It's a long time agoo now, but I uoozed to be Queen Mada's pet slime once.\n@c0@"
  es: "@a@b*: Fue hace glubcho tiempo, pero fui el limo mascota de la reina Perséfone.\n@c0@"
  fr: "@a@b*ⓢ Il y a trèèès longtemps, j'étais le gluant domestique de la reine Magdalena.\n@c0@"
  it: "@a@b*: Sono talmente bravo e bene educato che un tempo ero lo Slime da compagnia della regina Mada.\n@c0@"
  ja: "@a@b＊「やめましょう。\n\t今さら　こんなことを言っても\n\tしかたありませんものね。\n@c0@"
500:
  de: "@a@b*: Willkommen in Humburg!\n@c0@"
  en: "@a@b*: Welcome to Gotha!\n@c0@"
  es: "@a@b*: ¡%H0860%X%A0110%XBienvenido%Z%B0110%XBienvenida%Z%Y%R0000%XBienvenidas%YBienvenidos%Z%Z a Pankraz!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Gothaⓠ\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto%Z%B0110%XBenvenuta%Z%Y%R0000%XBenvenute%YBenvenuti%Z%Z a Denim!\n@c0@"
  ja: "@a@b＊「いじめないでね。\n\tボクは　悪いスライムじゃないよ。\n@c0@"
501:
  de: "@a@b*: Dies ist die Burgstadt Humburg!\n@c0@"
  en: "@a@b*: This is the castle town of Gotha.\n@c0@"
  es: "@a@b*: Esta es la ciudad fortificada de Pankraz.\n@c0@"
  fr: "@a@b*ⓢ Voici la ville fortifiée de Gothaⓠ\n@c0@"
  it: "@a@b*: Questa è la città-fortezza di Denim.\n@c0@"
  ja: "@a@b＊「昔　この城の王妃さまだった\n\tマーサさまに　飼われてたんだよ。\n@c0@"
502:
  de: "@a@b*: Unser alter König Ludwig war ein sehr kluger Herrscher, wisst Ihr.\n@c0@"
  en: "@a@b*: Our old king, King Pankraz, was a very sharp ruler, you see.\n@c0@"
  es: "@a@b*: Teudis, nuestro antiguo rey, era un gobernante muy astuto.\n@c0@"
  fr: "@a@b*ⓢ Notre ancien roi, le roi Petros, était un monarque très malin.\n@c0@"
  it: "@a@b*: Il nostro precedente sovrano, il grande re Russel, era un acuto stratega.\n@c0@"
  ja: "@a@b＊「ようこそ\n\tグランバニアへ！\n@c0@"
503:
  de: "@a@b*: Darum hat er b'schlossen, dass wir Humburger alle innerhalb der Burgmauern leben sollten, zum Schutz vor unseren Feinden.\n@c0@"
  en: "@a@b*: That's why he decided that all Gothans\r\nshould live within the castle walls, to protect\r\nus from our enemies.\n@c0@"
  es: "@a@b*: Por eso decidió que todos los ciudadanos de Pankraz viviesen dentro de las murallas, para protegernos de los enemigos.\n@c0@"
  fr: "@a@b*ⓢ Il avait décidé que tous les habitants du royaume devaient habiter dans l'enceinte du château pour être à l'abri en cas d'attaque.\n@c0@"
  it: "@a@b*: Decise che tutti gli abitanti di Denim dovessero vivere all'interno del Castello, così sarebbe stato più semplice proteggerli da eventuali attacchi nemici.\n@c0@"
  ja: "@a@b＊「ここは\n\tグランバニアの城下町だよ。\n@c0@"
504:
  de: "@a@b*: Wuff! Wuff, wuff, wuff!\n@c0@"
  en: "@a@b*: Woof! Woof, woof, woof!\n@c0@"
  es: "@a@b*: ¡Guau! ¡Guau, guau, guau!\n@c0@"
  fr: "@a@b*ⓢ Ouafⓠ Ouaf, ouaf, ouafⓠ\n@c0@"
  it: "@a@b*: Bau bau!\nBau bau bau!\n@c0@"
  ja: "@a@b＊「先代の王　パパスさまは\n\tとても　できた王さまでね。\n@c0@"
505:
  de: "@a@b*: Wir waren hier lange Zeit ohne König, wisst Ihr. Er war fort, auf Reisen.\n@c0@"
  en: "@a@b*: We had a long spell here without a king at all.\r\nHe was away travelling, you see.\n@c0@"
  es: "@a@b*: Hemos pasado una larga temporada sin rey aquí.\r\nSe había marchado de viaje.\n@c0@"
  fr: "@a@b*ⓢ Pendant bien longtemps, on n'a pas eu de roi ici. Il était parti en voyage.\n@c0@"
  it: "@a@b*: Pe' troppo tempo er Regno de Denim è stato privo de 'na guida, perché er nostro Re è partito pe'n lungo viaggio dar quale nunn'ha più fatto ritorno.\n@c0@"
  ja: "@a@b＊「国民の安全を考えて\n\t町も　お城の中に\n\tつくったんですよ。\n@c0@"
506:
  de: "@a@b*: Wir haben alle darauf gewartet, dass er zurückkommt, aber... Tja, das ist nie geschehen.\n@c0@"
  en: "@a@b*: We were all waiting for him to return, but...\r\nWell, he never did in the end.\n@c0@"
  es: "@a@b*: Todos esperábamos su regreso, pero...\r\nBueno, al final no regresó.\n@c0@"
  fr: "@a@b*ⓢ On a tous attendu son retour, mais... il est jamais revenu.\n@c0@"
  it: "@a@b*: L'amo atteso a lungo, ma 'e nostre speranze de rivedello se so' fatte sempre più flebbili, fino a spari' der tutto. Anvedi che storia triste, ahò!\n@c0@"
  ja: "@a@b＊「わん　わん　わん。\n@c0@"
507:
  de: "@a@b*: Jetzt ist sein Bruder, Prinz Sebastian, unser neuer König. Er hat den Thron vor etlichen Jahren b'stiegen.\n@c0@"
  en: "@a@b*: Now his brother, Prince Albert, is our new king.\r\nHe took the throne quite a few years ago now.\n@c0@"
  es: "@a@b*: Ahora su hermano, Agila, es nuestro nuevo rey.\r\nYa hace unos años que subió al trono.\n@c0@"
  fr: "@a@b*ⓢ Maintenant, c'est son frère, le prince Albert, qui est notre nouveau roi. Il est monté sur le trône y'a quelques années.\n@c0@"
  it: "@a@b*: Ora è su' fratello Alberto a porta' la corona der Regno de Denim. È salito ar trono quarche anno fa cor titolo de Principe Reggente.\n㈡\n*: Nunn'è 'na perzona cattiva, ma re Russel era troppo più 'ngamba...\n@c0@"
  ja: "@a@b＊「この国は　ずいぶん長い間\n\t王さまが　旅に出てしまって\n\t王のいない時代が　続いたんだぜ。\n@c0@"
508:
  de: "@a@b*: Früher hat mal ein Meisterkunsthandwerker hier auf der Burg g'lebt, wisst Ihr. Er galt als wahrer Goldschmiedegott.\n@c0@"
  en: "@a@b*: There was once a master craftsman who lived here in the castle, you know. Known as a god among jewellers, he was.\n@c0@"
  es: "@a@b*: Hace mucho tiempo vivió en el castillo un maestro artesano. Era venerado por todos los orfebres.\n@c0@"
  fr: "@a@b*ⓢ Autrefois, un maître artisan vivait dans le château. On disait de lui que c'était le Roi des joailliers.\n@c0@"
  it: "@a@b*: Molto tempo fa, qui al Castello viveva un abilissimo orefice. Era un artigiano talmente geniale da essersi meritato il soprannome di ⓕSir Gioielloⓖ.\n@c0@"
  ja: "@a@b＊「みんな　王さまの帰りを待ったさ。\n\tしかし　旅に出たまま\n\tついに　もどってこなくて……。\n@c0@"
509:
  de: "@a@b*: Aber nachdem König Ludwig die Burg verlassen hatte, ging auch er fort.\n@c0@"
  en: "@a@b*: But after King Pankraz left the castle, he left too.\n@c0@"
  es: "@a@b*: Pero, cuando el rey Teudis se fue del castillo, él también se fue.\n@c0@"
  fr: "@a@b*ⓢ Mais après le départ de Petros, il est parti\nlui aussi.\n@c0@"
  it: "@a@b*: Dopo la partenza di re Russel, anche l'orefice andò via.\n@c0@"
  ja: "@a@b＊「数年前　王位についた\n\tオジロンさまが\n\t今の王さまってわけさ。\n@c0@"
510:
  de: "@a@b*: Sein Sohn lebt aber immer noch hier. Er betreibt den Waffenladen oben.\n@c0@"
  en: "@a@b*: His son still lives here, though.\nHe runs the weapon shop upstairs.\n@c0@"
  es: "@a@b*: Aunque su hijo sigue viviendo aquí.\r\nEs el que lleva la armería del piso de arriba.\n@c0@"
  fr: "@a@b*ⓢ En revanche, son fils habite toujours ici.\nIl tient le magasin d'armes en haut.\n@c0@"
  it: "@a@b*: Suo figlio, però, vive ancora qui.\nGestisce il negozio d'armi che si trova al piano di sopra.\n@c0@"
  ja: "@a@b＊「かつて　この城には\n\t宝石細工の神さま　とまで言われた\n\t名工が　いたんだが……。\n@c0@"
511:
  de: "@a@b*: Wenn ich groß bin, werde ich Soldat und verteidige Humburg bis zum Letzten!\n@c0@"
  en: "@a@b*: When I grow up, I'm going to be a soldier, and I'm going to guard Gotha to the end!\n@c0@"
  es: "@a@b*: ¡Cuando crezca voy a ser soldado, y voy a proteger Pankraz hasta la muerte!\n@c0@"
  fr: "@a@b*ⓢ Quand je serai grand, je serai un soldat et je défendrai Gotha jusqu'au boutⓠ\n@c0@"
  it: "@a@b*: Da grande farò il soldato!\nDifenderò il Regno di Denim e tutti i suoi abitanti!\n@c0@"
  ja: "@a@b＊「パパス王が　城を出たあと\n\tその名工も　城を\n\t出てしまったんだよ。\n@c0@"
512:
  de: "@a@b*: Mein Papa ist Soldat. Soldaten sind klasse!\n@c0@"
  en: "@a@b*: My dad's a soldier. Soldiers are cool!\n@c0@"
  es: "@a@b*: Mi papá es soldado. ¡Los soldados son geniales!\n@c0@"
  fr: "@a@b*ⓢ Mon papa est un soldat et j'aime bien les soldatsⓠ\n@c0@"
  it: "@a@b*: Mio padre è un soldato.\nI soldati sono troppissimo fortissimi!\nE poi alle ragazze piacciono i soldati! Eh eh eh!\n@c0@"
  ja: "@a@b＊「その人の　息子なら\n\t今も　２階の武器屋に\n\t住んでるけどね。\n@c0@"
513:
  de: "@a@b*: Ich hoffe, auf der Welt wird wieder Frieden eingekehrt sein, wenn der Bub erst groß ist.\n@c0@"
  en: "@a@b*: I hope the world's a more peaceful place by the time my little boy grows up.\n@c0@"
  es: "@a@b*: Espero que el mundo sea un lugar más tranquilo cuando mi hijo se haga mayor.\n@c0@"
  fr: "@a@b*ⓢ J'espère que le monde sera plus sûr quand mon petit garçon sera grand.\n@c0@"
  it: "@a@b*: Spero che il mondo torni a essere un luogo sereno e tranquillo. Lo vorrei non tanto per me, quanto per mio figlio...\n@c0@"
  ja: "@a@b＊「ボク　大きくなったら\n\t兵士になって\n\tこの国を　守るんだ！\n@c0@"
514:
  de: "@aSchwester@bIhr kommt mir irgendwie so vertraut vor... Ich weiß net, vielleicht bild' ich mir das auch nur ein.\n@c0@"
  en: "@aSister@bThere's something very warm and familiar about you... I don't know, maybe I'm just imagining it.\n@c0@"
  es: "@aHermana@b%H0860%XTransmites%YTransmitís%Z una sensación cálida y familiar... No sé, a lo mejor son imaginaciones mías.\n@c0@"
  fr: "@aReligieuse@bIl y a quelque chose qui se dégage de vous...\r\nQuelque chose de chaleureux et de familier.\r\nMais je me fais peut-être des idées...\n@c0@"
  it: "@aSuora@bIl tuo aspetto mi è stranamente familiare...\nOh, forse è solo una mia impressione.\n@c0@"
  ja: "@a@b＊「うん。　ボクのお父さんも\n\t兵士なんだよっ。\n@c0@"
515:
  de: "@a@b*: König Ludwig tot? Pah, das glaub ich net!\n@c0@"
  en: "@a@b*: King Pankraz dead?\nPah! I don't believe a word of it!\n@c0@"
  es: "@a@b*: ¿El rey Teudis, muerto?\r\n¡Bah! ¡No me lo creo!\n@c0@"
  fr: "@a@b*ⓢ Le roi Petros est mortⓡ Pfffⓠ\nJe n'y crois pas une seule secondeⓠ\n@c0@"
  it: "@a@b*: Re Russel morto?! Sono baggianate! Frottole! Panzane!\nNon ci crederò mai e poi mai!\n@c0@"
  ja: "@a@b＊「うちの子が　大きくなるまでに\n\t平和な時代が　やってくると\n\tいいんだけど……。\n@c0@"
516:
  de: "@a@b*: Jedes Mal, wenn ich die Augen schließ', seh' ich seine kühne Gestalt stolz und aufrecht vor mir stehen. Wie kann er da tot sein, häh?\n@c0@"
  en: "@a@b*: Every time I shut my eyes I see his valiant figure standing proud and tall. So how can he possibly be gone, hm?\n@c0@"
  es: "@a@b*: Cada vez que cierro los ojos puedo ver su silueta, orgullosa y desafiante. Así que ¿cómo puede haberse ido? ¿Eh?\n@c0@"
  fr: "@a@b*ⓢ Chaque fois que je ferme les yeux, je revois sa silhouette courageuse faisant face à tout danger. Comment pourrait-il mourir, mmmⓡ\n@c0@"
  it: "@a@b*: Vorrei proprio sapere chi è quel disfattista che ha messo in circolazione una voce del genere!\n@c0@"
  ja: "@a@bシスター「あなたには　なにかしら\n\tなつかしいものを　感じますわ。\n\t気のせいかしら……。\n@c0@"
517:
  de: "@a@b*: Ich mochte König Ludwig viel lieber als seinen Bruder Sebastian, um ehrlich zu sein.\n@c0@"
  en: "@a@b*: I was more of a fan of King Pankraz than his brother Albert, to be honest.\n@c0@"
  es: "@a@b*: A decir verdad, me gustaba más el rey Teudis que su hermano Agila.\n@c0@"
  fr: "@a@b*ⓢ Pour être sincère, je préférais le roi Petros à son frère Albert.\n@c0@"
  it: "@a@b*: Ho sempre ritenuto che re Russel fosse una persona molto più valida di suo fratello, il principe Alberto.\n@c0@"
  ja: "@a@b＊「パパス王が　死んだなど\n\tわしには　まだ\n\t信じられんわい……。\n@c0@"
518:
  de: "@a@b*: König Ludwig hatte Weitsicht. Er hatte Träume!\n@c0@"
  en: "@a@b*: King Pankraz had vision. He had dreams!\n@c0@"
  es: "@a@b*: El rey Teudis era un visionario. ¡Tenía sueños!\n@c0@"
  fr: "@a@b*ⓢ Le roi Petros était un visionnaire.\nIl avait des rêvesⓠ\n@c0@"
  it: "@a@b*: Re Russel era un visionario, uno stratega, un sognatore.\nRe Russel era un grande sovrano.\n@c0@"
  ja: "@a@b＊「ほれ　こうして目をつぶると\n\tパパス王の　たくましい姿が\n\t今でも　目にうかぶぞ。\n@c0@"
519:
  de: "@a@b*: Leider werden wir jetzt nie mehr erfahren, was für Träume. Aber er hatte welche, und nur das zählt!\n@c0@"
  en: "@a@b*: Sadly, now we'll never know what those dreams were. But he had them, and that's what counts!\n@c0@"
  es: "@a@b*: Por desgracia, nunca sabremos cuáles eran esos sueños. ¡Pero tenía sueños, que es lo que cuenta!\n@c0@"
  fr: "@a@b*ⓢ Malheureusement, nous ne saurons jamais quels étaient ces rêves. L'important, c'est qu'il en avait. C'est ça qui compte.\n@c0@"
  it: "@a@b*: Il Regno di Denim ha perso il migliore dei propri figli...\n@c0@"
  ja: "@a@b＊「私は　今のオジロン王より\n\tパパス王が　好きでしたね。\n@c0@"
520:
  de: "@aSancho@bAls dein Vater aus Humburg fortging, wollte er diss eigentliss zurücklassen.\n@c0@"
  en: "@aSancho@bWhen your father decided to leave Gotha,\r\nhe planned to leave you behind.\n@c0@"
  es: "@aSancho@bCuando tu apá decidió abandonar Pankraz, pues tenía previsto dejarte aquí.\n@c0@"
  fr: "@aSancho@bQuand ton padre a décidé de p-partir de Gotha,\r\nil voulait te laisser ici.\n@c0@"
  it: "@aSancho@bCuando decise de lasciare Denim, tuo padre no voleva que tu abbandonassi el castillo.\n@c0@"
  ja: "@a@b＊「パパス王には\n\tなにかしら　夢があった。\n@c0@"
521:
  de: "@aSancho@bAber du hast so sehr geweint, Chico.\n@c0@"
  en: "@aSancho@bBut you cried eso hard, friend.\n@c0@"
  es: "@aSancho@bPero llorabas mucho, chamaco.\n@c0@"
  fr: "@aSancho@bMais tu as c-crié si fuerte, chico.\n@c0@"
  it: "@aSancho@bAlloras tu iniziasti a piangere como una fontana, chico.\n@c0@"
  ja: "@a@b＊「その夢が　なんだったのか\n\t今となっては\n\t知るすべも　ありませんが……。\n@c0@"
522:
  de: "@aSancho@bAm Ende mussten wir diss doch mitnehmen.\n@c0@"
  en: "@aSancho@bEen the end, we had to breeng you weeth us.\n@c0@"
  es: "@aSancho@bFinalmente tuvo que llevarte con nosotros, nomás.\n@c0@"
  fr: "@aSancho@bÀ la fin, nous avons dû t'emmener avec n-nous.\n@c0@"
  it: "@aSancho@bAlla fines, Russel decise que te avrebbe portato con nosotros.\n@c0@"
  ja: "@a@bサンチョ「父上が　旅に出るとき\n\t本当は　坊っちゃんを\n\t置いて行こうと　したんですよ。\n@c0@"
523:
  de: "@aSancho@bAber wir konnten nisst wissen, was uns alles zustoßen würde.\n@c0@"
  en: "@aSancho@bBut no one, they deedn't know what would\r\nhappen to us.\n@c0@"
  es: "@aSancho@bPero, pues nadie sabía lo que nos iba a suceder.\n@c0@"
  fr: "@aSancho@bMais p-personne ne savait ce qui a-allait nous arriver.\n@c0@"
  it: "@aSancho@bNessuno sabeva cosa sarebbe successo.\nNessuno podeva saberlo...\n@c0@"
  ja: "@a@bサンチョ「しかし　坊っちゃんは\n\t火がついたように　泣き出して……。\n@c0@"
524:
  de: "@aSancho@bDeine Vater, er hat miss gebeten, dir nisst zu sagen, dass du ein Prinz bist.\n@c0@"
  en: "@aSancho@bYour father, he asked me to no tell you that you were a prince.\n@c0@"
  es: "@aSancho@bTu apá me pidió que no te dijese que eras príncipe.\n@c0@"
  fr: "@aSancho@bTon père, il m'a d-demandé de ne pas te dire que tu étais oun p-prince.\n@c0@"
  it: "@aSancho@bTuo padre me chiese de no rivelarte que eri el Principe de Denim.\n@c0@"
  ja: "@a@bサンチョ「結局\n\tつれて行くことに　したんです。\n@c0@"
525:
  de: "@aSancho@bEs tut mir leid, Chico! Iss hatte versprochen, es dir nisst zu sagen!\n@c0@"
  en: "@aSancho@bI'm esorry, friend! I promised I would no\r\ntell you!\n@c0@"
  es: "@aSancho@b¡Lo siento, chamaco! ¡Fue una promesa que hice, mⓘhijo!\n@c0@"
  fr: "@aSancho@bJe suis désolé, chicoⓠ\nJ-J'avais promis de ne rien te direⓠ\n@c0@"
  it: "@aSancho@b¡Lo siento, chico!\n¡Me despiace!\nAvevo promesso que no te lo avrei detto...\n@c0@"
  ja: "@a@bサンチョ「けれど　つれて行く限りは\n\tこの先　なにがあるかも知れぬ。\n@c0@"
526:
  de: "@aSancho@bVerzeih mir! Verzeih deinem Onkel Sancho!\n@c0@"
  en: "@aSancho@bForgeeve me. Forgeeve your Uncle Sancho!\n@c0@"
  es: "@aSancho@bPerdóname. ¡Perdona a tu tito Sancho!\n@c0@"
  fr: "@aSancho@bPardonne-moi. P-Pardonne à ton tonton Sanchoⓠ\n@c0@"
  it: "@aSancho@bPor favor, perdoname.\n¡Perdona el tuo povero zio Sancho!\n@c0@"
  ja: "@a@bサンチョ「無事に　城にもどるまでは\n\t王子であることを　明かすなって\n\tそう　おっしゃられて……。\n@c0@"
527:
  de: "@aSancho@bUnd jetzt musst du das tun, worum Prinz Sebastian diss bittet. Du musst der König von Humburg werden.\n@c0@"
  en: "@aSancho@bAnd now you must do as Prince Albert, he ees asking you. You must become the King of Gotha.\n@c0@"
