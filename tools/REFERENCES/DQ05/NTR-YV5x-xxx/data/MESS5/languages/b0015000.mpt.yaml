  ja: "@a@bサンチョ「とにかく\n\t坊っちゃんが　帰ってきたことを\n\tオジロン王に　知らせなきゃ。\n@c0@"
288:
  de: "@aSancho@bKomm, Chico. Iss zeige dir.\n@c0@"
  en: "@aSancho@bCome, friend. I eshow you.\n@c0@"
