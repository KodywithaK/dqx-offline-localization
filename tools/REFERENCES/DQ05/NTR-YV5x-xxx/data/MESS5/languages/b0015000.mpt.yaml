  it: "@aSuora@bNo, non avrebbe mai dovuto sottoporsi a un simile sforzo.\n@c0@"
  ja: "@a@bシスター「まったく　そんな身体で\n\t旅を　してくるなんて……。\n@c0@"
307:
  de: "@aSancho@bIst es etwas Ernstes, Schwester? Ist sie sehr krank?\n@c0@"
