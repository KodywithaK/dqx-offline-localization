  fr: "@aGarde@bBonjour Sancho.\nQu'est-ce que je peux faire pour vousⓡ\n@c0@"
  it: "@aGuardia@bSalve, Sancho!\nPosso aiutarti?\n@c0@"
  ja: "@a@bサンチョ「さあ　坊っちゃん。\n\t私に　ついてきてください。\n@c0@"
291:
  de: "@aSancho@bIss muss sehen den König! Rápido!\nIss muss ihm etwas Wisstiges mitteilen!\n@c0@"
