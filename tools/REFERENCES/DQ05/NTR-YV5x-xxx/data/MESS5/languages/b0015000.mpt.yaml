  ja: "@a@bシスター「おめでたです。\n@c0@"
351:
  de: "@aSchwester@bJa. Eure Frau ist guter Hoffnung. Ihr fehlt gar nichts. Sie braucht nur Ruhe.\n@c0@"
  en: "@aSister@bYes. Your wife is with child. There's absolutely nothing wrong with her. She just needs rest.\n@c0@"
  es: "@aHermana@bSí. Tu esposa está en estado de buena esperanza. No le pasa absolutamente nada. Solo necesita descansar.\n@c0@"
  fr: "@aReligieuse@bEh oui. Votre femme est enceinte. Elle n'a aucun problème de santé. Elle a juste besoin de repos.\n@c0@"
  it: "@aSuora@bTua moglie è incinta.\nSta benissimo, ma ha bisogno di molto riposo.\n@c0@"
  ja: "@a@bサンチョ「へっ？\n@c0@"
352:
  de: "@aSchwester@bNoch ist kaum etwas zu sehen, aber nach dem, was sie mir erzählt hat, ist sie bereits recht weit.\n@c0@"
  en: "@aSister@bShe's hardly showing at all yet, but according to what she's told me, I'd say she's already quite well progressed.\n@c0@"
  es: "@aHermana@bApenas se le nota aún pero, por lo que me ha contado, yo diría que el embarazo está bastante avanzado.\n@c0@"
  fr: "@aReligieuse@bCela ne se voit pas encore, mais d'après ce qu'elle m'a dit, sa grossesse est déjà bien avancée.\n@c0@"
  it: "@aSuora@bInizialmente non ce n'eravamo resi conto perché la ragazza non ha ancora il pancione, ma credo che presto la sua gravidanza diventerà ben visibile.\n@c0@"
  ja: "@a@bシスター「おめでとうございます。\n\t%a000090さまは　もうすぐ\n\tお父さまに　なられますよ。\n@c0@"
353:
  de: "@aSancho@bDas ist ja herrliss!\n@c0@"
  en: "@aSancho@bThees ees wonderful!\n@c0@"
  es: "@aSancho@b¡Eso es padrísimo!\n@c0@"
  fr: "@aSancho@bC-C'est magnificoⓠ\n@c0@"
  it: "@aSancho@b¡Ma esta es una noticia esplendida!\n@c0@"
  ja: "@a@bシスター「そう……。\n\tフローラさんの　お腹の中に\n\t赤ちゃんが　いるのです。\n@c0@"
354:
  de: "@aSancho@bEin Bebé! Das Bebé von meine Chico! Du und Nera... Sí, das wird ein wunderhübsches Kind.\n@c0@"
  en: "@aSancho@bA bebé! My friend's bebé! You and Nera...\r\nSí, eet weell be esuch a beautiful child.\n@c0@"
  es: "@aSancho@b¡Un bebito! ¡El bebe de mi chamaquito! Tú y Nera...\r\nPues será un muchacho retecuero.\n@c0@"
  fr: "@aSancho@bOun bébéⓠ Oun bébé de mon chicoⓠ Toi et Nera...\nSi, ce sera oun b-beau bébé.\n@c0@"
  it: "@aSancho@b¡El mi chico está por diventare padre!\nTu y Nera avrete un figlio...\n¡Soy seguro que sarà un niño bellissimo!\n@c0@"
  ja: "@a@bシスター「あまり　お腹が\n\t目立ちませんが　聞けば\n\tかなり　育っているようですね。\n@c0@"
355:
  de: "@aSchwester@bNun, ich lasse Euch jetzt allein. Passt auf Euch auf. Und denkt daran, dass Eure Frau jetzt guter Hoffnung ist.\n@c0@"
  en: "@aSister@bWell, I'll leave you alone now. Take care. And remember, your wife is in a delicate state now.\n@c0@"
  es: "@aHermana@bBueno, ahora me voy a retirar. Cuidaos. Y recuerda que el estado de tu esposa es delicado.\n@c0@"
  fr: "@aReligieuse@bEh bien, je vais vous laisser. À bientôt. N'oubliez pas que vous ne devez pas brusquer votre femme.\n@c0@"
  it: "@aSuora@bVi lascio soli. Abbi cura di tua moglie, adesso più che mai. La gravidanza richiede attenzioni, comprensione e tanto, tanto riposo.\n@c0@"
  ja: "@a@bサンチョ「こいつは　めでたい！\n@c0@"
356:
  de: "@aSchwester@bNun, sicher braucht Ihr etwas Zeit, um Euch an den Gedanken zu gewöhnen. Das kam ja recht plötzlich.\n@c0@"
  en: "@aSister@bWell, no doubt you need some time to get used to the idea. It's all very sudden.\n@c0@"
  es: "@aHermana@bSeguro que necesitas un poco de tiempo para acostumbrarte a la idea. Es todo tan repentino...\n@c0@"
  fr: "@aReligieuse@bEh bien, il va sans doute vous falloir un peu de temps pour vous faire à cette idée. C'est si soudain.\n@c0@"
  it: "@aSister@bTi ci vorrà del tempo per abituarti all'idea.\nCerte cose sembrano capitare all'improvviso, ma ti cambiano la vita per sempre.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんとフローラさんの\n\t子供だから　きっと　玉のように\n\tかわいい　赤ちゃんが生まれますよ！\n@c0@"
357:
  de: "@aNera@bEs tut mir so leid, %a000090. Ich weiß, ich hätte es dir sagen müssen, aber...\n@c0@"
  en: "@aNera@bI'm so sorry, %a000090.\nI know I should have told you, but...\n@c0@"
  es: "@aNera@bLo siento, %a000090.\nSé que debería habértelo dicho, ma...\n@c0@"
  fr: "@aNera@bJe suis désolée, %a000090.\nJe sais que j'aurais dû t'en parler, mais...\n@c0@"
  it: "@aNera@bScusami, %a000090.\nNon avrei dovuto nasconderti la mia gravidanza...\n@c0@"
  ja: "@a@bシスター「では　私は　これで。\n\tどうか　お大事に……。\n@c0@"
358:
  de: "@aNera@bIch kenne dich. Du bist so lieb und rücksichtsvoll. Hätte ich es dir gesagt, dann hättest du deine Suche aufgegeben. Und ich weiß, wie viel sie dir bedeutet.\n@c0@"
  en: "@aNera@bI know you. You're so kind and considerate. If I'd told you, you would have stopped your quest.\nAnd I know how much that means to you.\n@c0@"
  es: "@aNera@bTe conozco. Eres tan amable y considerado... Si te lo hubiese dicho, habrías interrumpido la tua misión.\r\nY sé lo que significa para ti.\n@c0@"
  fr: "@aNera@bJe te connais bien. Tu es si gentil et si prévenant.\r\nSi je te l'avais dit, tu aurais renoncé à ta quête et je sais qu'elle te tient vraiment à cœur.\n@c0@"
  it: "@aNera@bSo bene quanto tu sia premuroso nei miei riguardi, e temevo che avresti rinunciato a cercare tua madre per starmi vicino.\n㈡\nNon volevo che facessi questo per me.\n@c0@"
  ja: "@a@bシスター「まあっ。\n\tでも　無理ありませんわ。\n\tとつぜん　ですものね。\n@c0@"
359:
  de: "@aNera@bAber jetzt werde ich nichts mehr riskieren. Ich weiß, ich kann nicht weiter mit dir herumreisen.\n@c0@"
  en: "@aNera@bBut I won't take any chances now. I know I can't carry on travelling with you.\n@c0@"
  es: "@aNera@bPero ya no voy a correr más riesgos. Sé que no puedo proseguire il viaggio contigo.\n@c0@"
  fr: "@aNera@bMais je ne vais plus prendre de risques. Je me rends compte que je ne peux plus voyager à tes côtés.\n@c0@"
  it: "@aNera@bComprendo di aver sbagliato, e ho deciso di non proseguire il viaggio con te.\nNon voglio mettere a rischio la vita di nostro figlio.\n@c0@"
  ja: "@a@bフローラ「あなた　ごめんなさいね。\n\t今まで　かくしていて……。\n@c0@"
360:
  de: "@aNera@bIch werde hierbleiben und dafür sorgen, dass du das wundervolle, gesunde Baby bekommst, das du verdienst.\n@c0@"
  en: "@aNera@bI'll stay here and rest, and make sure I can give you the wonderful, healthy child you deserve.\n@c0@"
  es: "@aNera@bMe quedaré aquí a reposare y a asegurarme de que tengamos el bambino sano y hermoso que merecemos.\n@c0@"
  fr: "@aNera@bJe vais rester ici et me reposer. Je veux que tout se passe bien et que tu aies le plus beau bébé qui puisse être.\n@c0@"
  it: "@aNera@bResterò qui e mi riposerò.\nDarò alla luce un bambino meraviglioso!\nSarà bello e forte come suo padre, vedrai!\n@c0@"
  ja: "@a@bフローラ「もしやとは　思ってたけど\n\t言ったら　あなたは　私のために\n\t旅を　やめてしまったでしょう？\n@c0@"
361:
  de: "@aNera@bIch liebe dich, %a000090.\n@c0@"
  en: "@aNera@bI love you, %a000090.\n@c0@"
  es: "@aNera@bTi amo, %a000090.\n@c0@"
  fr: "@aNera@bJe t'aime, %a000090.\n@c0@"
  it: "@aNera@bTi amo, %a000090.\n@c0@"
  ja: "@a@bフローラ「でも　もう\n\tいっしょに　旅をしたいなんて\n\tわがままを　言わないわ。\n@c0@"
362:
  de: "@a@bPrinz Sebastian muss sehr beunruhigt sein. Man sollte ihn am besten zuerst einmal von seinen Sorgen befreien.\n@c0@"
  en: "@a@bPrince Albert must be extremely worried.\nBetter set his mind at ease first.\n@c0@"
  es: "@a@bEl rey Agila debe de estar muy preocupado.\r\nSerá mejor tranquilizarlo primero.\n@c0@"
  fr: "@a@bLe prince Albert doit être très inquiet.\r\nIl vaudrait mieux aller le rassurer d'abord.\n@c0@"
  it: "@a@bIl principe Alberto dev'essere molto preoccupato.\nForse è meglio andare a tranquillizzarlo...\n@c0@"
  ja: "@a@bフローラ「身体に　気をつけて\n\tきっと　かわいい赤ちゃんを\n\t産みます。\n@c0@"
363:
  de: "@aPrinz Sebastian@bMeinen allerherzlichsten Glückwunsch, Bursche! Der Pinguin hat's mir schon g'sagt!\n@c0@"
  en: "@aPrince Albert@bCongratulations, you old devil!\r\nOld penguin features told me the news.\n@c0@"
  es: "@aRey Agila@b¡Enhorabuena, chatín!\r\nEsa vieja pingüina me ha dado la noticia.\n@c0@"
  fr: "@aPrince Albert@bFélicitations, petite canaille.\r\nLa bonne sœur m'a déjà annoncé la nouvelle.\n@c0@"
  it: "@aPrincipe Alberto@bCongratulazioni, caro nipote!\nLa suora mi ha dato la splendida notizia!\n@c0@"
  ja: "@a@bフローラ「愛しているわ　あなた……。\n@c0@"
364:
  de: "@aPrinz Sebastian@bIch würd' mit dir gern etwas besprechen. Komm doch mal hier rüber, %a000090.\n@c0@"
  en: "@aPrince Albert@bActually, there's something I want to talk to you about. Would you come over here, %a000090?\n@c0@"
  es: "@aRey Agila@bEn realidad quería comentarte algo. ¿Puedes acercarte un momento, %a000090?\n@c0@"
  fr: "@aPrince Albert@bEn fait, il y a quelque chose dont j'aimerais te parler. Approche-toi un peu, %a000090ⓠ\n@c0@"
  it: "@aPrincipe Alberto@bA tal proposito, vorrei dirti una cosa.\nPuoi avvicinarti, %a000090?\n@c0@"
  ja: "@a@bしかし　まずは\n心配をかけた　オジロンに\nあいさつしたほうが　いいだろう。\n@c0@"
365:
  de: "@aPrinz Sebastian@bDie Sache ist die, %a000090, ich hab b'schlossen, die Zügel an dich zu übergeben. Ich hab g'nug von der ganzen Regiererei.\n@c0@"
  en: "@aPrince Albert@bThe thing is, %a000090, I've decided to hand over the reins to you. I've rather had my fill of the old kinging game.\n@c0@"
  es: "@aRey Agila@bVeras, %a000090, he decidido cederte las riendas del reino. Ya estoy bastante harto de esto de jugar a ser rey.\n@c0@"
  fr: "@aPrince Albert@bÉcoute bien, %a000090. J'ai décidé de te passer les rênes. J'en ai assez de faire le roi.\n@c0@"
  it: "@aPrincipe Alberto@bEssere a capo di Denim è una gran bella cosa, ma ti confesso di averne fin sopra la corona degli obblighi di corte...\n㈡\nE così, %a000090, ho deciso di cederti il trono.\nAllora? Che ne dici?\n@c0@"
  ja: "@a@bオジロン「おお！　すでに\n\tシスターから　聞いたぞよ。\n\tめでたいかぎりじゃ。\n@c0@"
366:
  de: "@aKanzler Konrad@bAber Eure Majestät! Traditionsgemäß solltet Ihr derartige Angelegenheiten doch zunächst mit Eurem Kanzler diskutier'n, oder net?\n@c0@"
  en: "@aChancellor Jeeves@bYour Majesty! It is considered traditional to discuss such matters with one's chancellor first.\n@c0@"
  es: "@aCanciller Ambrosio@b¡Majestad! La tradición es comentar primero tales asuntos con el canciller.\n@c0@"
  fr: "@aChancelier Tiquette@bVotre Majestéⓠ Normalement, ces affaires doivent être d'abord discutées avec le chancelier.\n@c0@"
  it: "@aMinistro Ligio@bMaestà! Mi permetto di farle notare che il protocollo di Denim prevede che argomenti di tale importanza siano prima discussi con il Ministro del Regno.\n@c0@"
  ja: "@a@bオジロン「そこで　%a000090に\n\t話したいことが　あるのだ。\n\tさあさあ　こっちへ。\n@c0@"
367:
  de: "@aPrinz Sebastian@bImmer mit der Ruhe, Konrad. Ich will Euch doch net sekkier'n. Es ist doch ganz logisch.\n@c0@"
  en: "@aPrince Albert@bNow now, Jeeves. Don't get your knickers in a twist. It makes perfect sense.\n@c0@"
  es: "@aRey Agila@bBueeeno, Ambrosio. No te me pongas nervioso. Es muy razonable.\n@c0@"
  fr: "@aPrince Albert@bMon bon Tiquette, ne vous affolez pas.\r\nJ'ai bien réfléchi.\n@c0@"
  it: "@aPrincipe Alberto@bMinistro, Ministro!\nSuvvia, siamo pratici!\n@c0@"
  ja: "@a@bオジロン「じつはな　%a000090。\n\tわしは　そなたに\n\t王位を　ゆずろうと思うのだ。\n@c0@"
368:
  de: "@aPrinz Sebastian@bIch mein', ich hab's versucht, aber Glanz und Gloria sind doch net so ganz meine Welt, net wahr?\n@c0@"
  en: "@aPrince Albert@bI mean, I'm a good sport and all that, but I'm hardly kingly material, am I?\n@c0@"
  es: "@aRey Agila@bA ver, yo soy bastante buen tipo, pero como rey no doy mucho la talla, ¿verdad?\n@c0@"
  fr: "@aPrince Albert@bC'est vrai. Je suis un bon bougre, mais je n'ai pas l'étoffe d'un roi.\n@c0@"
  it: "@aPrincipe Alberto@bSono stufo di protocolli di corte, cerimonie ufficiali e discorsi formali. Non credo di essere un cattivo reggente, ma non mi sento a mio agio in questo ruolo.\n@c0@"
  ja: "@a@b大臣「オジロン王！\n\t私に　なんの相談もなく\n\tとつぜん　なにを言われる！\n@c0@"
369:
  de: "@aPrinz Sebastian@bJetzt, da der Sohn meines Bruders zurückgekehrt ist, wär's net recht von mir, ihm den Thron net zurückzugeb'n.\n@c0@"
  en: "@aPrince Albert@bNow that my brother's son has returned, it would be a trifle ungentlemanly of me not to hand over the throne to its rightful heir.\n@c0@"
  es: "@aRey Agila@bAhora que el hijo de mi hermano ha regresado, no sería demasiado caballeroso por mi parte no cederle el trono a su legítimo heredero.\n@c0@"
  fr: "@aPrince Albert@bMaintenant que le fils de mon frère est revenu, ce ne serait pas très courtois de ma part de ne pas céder le trône à celui à qui il revient de droit.\n@c0@"
  it: "@aPrincipe Alberto@bDa tempo pensavo di lasciare il trono, e non potrebbe esserci occasione migliore di questa per farlo!\n㈡\nIl figlio di mio fratello Russel è tornato a Denim, e lui è il legittimo erede alla corona.\n@c0@"
  ja: "@a@bオジロン「まあまあ\n\tいいではないか　大臣。\n@c0@"
370:
  de: "@aKanzler Konrad@bGanz wie's beliebt, gnädigster Herr.\n@c0@"
  en: "@aChancellor Jeeves@bAs you wish, sir.\n@c0@"
  es: "@aCanciller Ambrosio@bComo guste, señor.\n@c0@"
  fr: "@aChancelier Tiquette@bSi Votre Majesté l'entend ainsi...\n@c0@"
  it: "@aMinistro Ligio@bCome desidera, Maestà.\n@c0@"
  ja: "@a@bオジロン「わしは　もともと\n\t人がいいだけで\n\t王のうつわでは　ないのじゃ。\n@c0@"
371:
  de: "@aKanzler Konrad@bNatürlich wär da noch die G'schicht'n mit den Maturahöhlen. Da sollte doch jeder hoffnungsfrohe Königsanwärter seine Prüfung ableg'n.\n@c0@"
  en: "@aChancellor Jeeves@bOf course, there is the small matter of Riteof Passage. It is required that any would-be king undertake the trial there.\n@c0@"
  es: "@aCanciller Ambrosio@bPor supuesto, está el detalle sin importancia de la Cueva Ritual.\n㈡\nEs un requisito para cualquier aspirante a rey superar la prueba en el lugar mencionado.\n@c0@"
  fr: "@aChancelier Tiquette@bCependant, il ne faut pas oublier la balme des Débutants. Toute personne aspirant au trône doit réussir cette épreuve.\n@c0@"
  it: "@aMinistro Ligio@bMi permetto solo di ricordare che il futuro Re di Denim dovrà superare la prova dell'Antro della Successione, come prevedono le leggi del Regno.\n@c0@"
  ja: "@a@bオジロン「兄上の息子　%a000090が\n\t帰ってきた以上　%a000090に王位を\n\tつがせるのが道理というものだ。\n@c0@"
372:
  de: "@aKanzler Konrad@bAch, aber bittschön, Konrad! Da wimmelt's inzwischen doch von Monstern! Es ist net mehr wie früher. Die Zeiten haben sich geändert, wisst Ihr.\n@c0@"
  en: "@aPrince Albert@bOh, come now, Jeeves! The place is positively riddled with monsters these days. It's not like it used to be. Times have changed, you know.\n@c0@"
  es: "@aRey Agila@b¡Vamos, Ambrosio! Últimamente ese sitio está plagado de monstruos. Ya no es lo que era. Los tiempos cambian, chatín.\n@c0@"
  fr: "@aPrince Albert@bVoyons, Tiquetteⓠ Cet endroit grouille de monstres, maintenant. Ce n'est plus comme autrefois.\nLes temps ont changé.\n@c0@"
  it: "@aPrincipe Alberto@bAndiamo, Ministro! Quel posto è pieno zeppo di mostri!\nLa prova dell'Antro della Successione è una cosa che appartiene al passato! I tempi sono cambiati!\n@c0@"
  ja: "@a@b大臣「そこまで　言われるなら……。\n@c0@"
373:
  de: "@aKanzler Konrad@bSehr wohl, gnädigster Herr. Aber dennoch, 's ist nun einmal Tradition, gnädigster Herr, net wahr?\n@c0@"
  en: "@aChancellor Jeeves@bIndeed, sir. Nevertheless, one is bound by tradition, is one not?\n@c0@"
  es: "@aCanciller Ambrosio@bPor supuesto, señor. Sin embargo, la tradición nos obliga, ¿no es así?\n@c0@"
  fr: "@aChancelier Tiquette@bJe le sais bien, Votre Majesté. Cependant, vous devez respecter les traditions, n'est-ce pasⓡ\n@c0@"
  it: "@aMinistro Ligio@bMaestà, concordo che i tempi siano cambiati, ma non crede anche lei che noi per primi dovremmo rispettare le leggi del nostro Regno?\n@c0@"
  ja: "@a@b大臣「しかし　代々　王に\n\tなられるお方は　試練の洞くつに\n\tゆくのが　わが国のしきたり。\n@c0@"
374:
  de: "@aPrinz Sebastian@bHmpf. Jaja... Nun ja...\nDa werdet Ihr wohl recht haben.\n@c0@"
  en: "@aPrince Albert@bHmph. Yes, well...\nI suppose...\n@c0@"
  es: "@aRey Agila@bMmf. Sí, bueno...\r\nSupongo que sí...\n@c0@"
  fr: "@aPrince Albert@bMmpf. Oui, enfin... Je suppose...\n@c0@"
  it: "@aPrincipe Alberto@bEhm... D'accordo, Ministro.\nNon posso darti torto.\nDel resto, la legge è uguale per tutti, no?\n@c0@"
  ja: "@a@bオジロン「だが　大臣。\n\t昔とちがい　今では\n\tあの洞くつにも　怪物たちが……。\n@c0@"
375:
  de: "@aPrinz Sebastian@b%0%a000090, hast verstanden, worum's hier ging?\n@c0@"
  en: "@aPrince Albert@b%0%a000090.\nDid you follow all that?\n@c0@"
  es: "@aRey Agila@b%0%a000090.\n¿Has seguido lo que íbamos diciendo?\n@c0@"
  fr: "@aPrince Albert@b%0%a000090.\nTu as entenduⓡ\n@c0@"
  it: "@aPrincipe Alberto@b%0%a000090, hai sentito che ci tocca fare?\n@c0@"
  ja: "@a@b大臣「どんな事が　あろうとも\n\tしきたりは　しきたり。\n\t守っていただかぬと！\n@c0@"
376:
  de: "@aPrinz Sebastian@bWenn's nach mir ginge, ich tät einfach sag'n: ⓞSeht, liebe Leute! Das hier ist euer neuer König von Humburg!ⓟ\n@c0@"
  en: "@aPrince Albert@bIf it was up to me, I'd just say, ⓗListen up, chaps! This is the new King of Gotha.ⓘ\n@c0@"
  es: "@aRey Agila@bSi fuese por mí, diría simplemente ⓕ¡Eh, amigos! Este es el nuevo rey de Pankrazⓖ.\n@c0@"
  fr: "@aPrince Albert@bSi ça ne tenait qu'à moi, je dirais simplementⓢ\nⓥÉcoutez-moi tousⓠ Voici le nouveau roi de Gotha.ⓦ\n@c0@"
  it: "@aPrincipe Alberto@bDipendesse da me, radunerei i nostri sudditi e direi loro: ⓕEhi, gente! Questo è il nuovo Re di Denim! Vogliategli bene.ⓖ\n@c0@"
  ja: "@a@bオジロン「ふむ……。\n\tそれも　そうか……。\n@c0@"
377:
  de: "@aPrinz Sebastian@bAber ich fürchte, du musst zu den sogenannten Maturahöhlen gehen und dort die Königlichen Insignien holen.\n@c0@"
  en: "@aPrince Albert@bBut I'm afraid you're going to have to go to\r\nthe cave known as Riteof Passage and get\r\nthe Royal Insignia.\n@c0@"
  es: "@aRey Agila@bPero me temo que vas a tener que entrar en la Cueva Ritual y hacerte con la Insignia Real.\n@c0@"
  fr: "@aPrince Albert@bJe suis désolé, mais je crois que tu vas devoir aller dans la grotte appelée la balme des Débutants pour y récupérer l'Emblème royal.\n@c0@"
  it: "@aPrincipe Alberto@bPurtroppo, la legge richiede che tu superi la prova nota come ⓕAntro della Successioneⓖ, e che conquisti lo Stemma Reale.\n@c0@"
  ja: "@a@bオジロン「%a000090よ。\n\t話は　聞いたであろう。\n@c0@"
378:
  de: "@aPrinz Sebastian@bⓙs ist halt Tradition, verstehst. Um zu zeigen, dass du deiner Aufgabe gewachsen bist oder dergleichen. Und dann kann ich dir den Thron überlass'n.\n@c0@"
  en: "@aPrince Albert@bIt's tradition, you see. To prove you're up to the job, or some such rot. Anyway, do that, and I can give you the throne.\n@c0@"
  es: "@aRey Agila@bEs la tradición, ya ves. Para demostrar si estás a la altura o eres un mindundi cualquiera. Bueno, el caso es que, en cuanto lo hagas, te cedo el trono.\n@c0@"
  fr: "@aPrince Albert@bC'est la tradition qui veut ça. Cette épreuve est censée prouver que tu es à la hauteur ou une bêtise dans ce genre. Vas-y et je te rendrai le trône.\n@c0@"
  it: "@aPrincipe Alberto@bÈ una vecchia legge emanata per verificare se il candidato al trono possegga o meno le qualità necessarie per diventare il nuovo Re di Denim.\n㈡\nBeh, per farla breve: supera la prova dell'Antro della Successione e la corona sarà tua.\n@c0@"
  ja: "@a@bオジロン「わしは　そなたに\n\t王位を　ゆずりたいのじゃ。\n@c0@"
379:
  de: "@aPrinz Sebastian@bDie Maturahöhlen befinden sich im Wald östlich von der Burg.\n@c0@"
  en: "@aPrince Albert@bYou'll find Riteof Passage in the forest to the east of the castle.\n@c0@"
  es: "@aRey Agila@bLa Cueva Ritual está en el bosque al este del castillo.\n@c0@"
  fr: "@aPrince Albert@bLa balme des Débutants se trouve dans la forêt, à l'est du château.\n@c0@"
  it: "@aPrincipe Alberto@bL'Antro della Successione si trova nella foresta a est del castello.\n@c0@"
  ja: "@a@bオジロン「たのむっ！\n\t試練の洞くつに　いって\n\t王家のあかしを　取ってきてくれい！\n@c0@"
380:
  de: "@aPrinz Sebastian@bAber heute bist sicherlich fix und fertig.\n@c0@"
  en: "@aPrince Albert@bBut you must be pretty much done in for today, I should think.\n@c0@"
  es: "@aRey Agila@bPero supongo que hoy ya debes de estar muy cansado.\n@c0@"
  fr: "@aPrince Albert@bMais j'imagine que tu as eu assez de surprises pour aujourd'hui.\n@c0@"
  it: "@aPrincipe Alberto@bComunque, penso che per oggi tu abbia già avuto emozioni a sufficienza, no?\n@c0@"
  ja: "@a@bオジロン「そして　その時こそ\n\tそなたに　王位を　ゆずろうぞっ！\n@c0@"
381:
  de: "@aPrinz Sebastian@bDu solltest dich jetzt ausruhen und dich gleich morgen früh auf den Weg machen!\n@c0@"
  en: "@aPrince Albert@bYou should rest now, and crack on with the job first thing tomorrow morning!\n@c0@"
  es: "@aRey Agila@b¡Descansa ahora y ponte manos a la obra mañana a primera hora!\n@c0@"
  fr: "@aPrince Albert@bTu ferais mieux d'aller te reposer pour te mettre en route à l'aube demain matin.\n@c0@"
  it: "@aPrincipe Alberto@bVai a riposarti.\nDomani farai una bella colazione e poi ti occuperai dell'Antro della Successione.\n@c0@"
  ja: "@a@bオジロン「試練の洞くつは\n\tこの城の東　森の中じゃ！\n@c0@"
382:
  de: "@aBianca@bMorgen, %a000090! Wir haben letzte Nacht ja geschlafen wie die Babys, was? Ha ha!\n@c0@"
  en: "@aBianca@bMornin', %a000090. We slept like babies last night, eh? Ha ha!\n@c0@"
  es: "@aBianca@bBuenos días, %a000090. Hoy hemos dormido como bebés, ¿verdad? ¡Ja, ja!\n@c0@"
  fr: "@aBianca@bBonjour, %a000090. On a dormi comme des bébés, pas vraiⓡ Ha haⓠ\n@c0@"
  it: "@aBianca@bBuongiorno, %a000090. Ben svegliato!\nAbbiamo dormito come sassi!\nDovevamo essere davvero esausti...\n@c0@"
  ja: "@a@bオジロン「とはいえ\n\t今日は　長旅で　つかれておろう。\n@c0@"
383:
  de: "@aBianca@bJa, mir geht's wieder gut. Viel besser als gestern.\n@c0@"
  en: "@aBianca@bYeah, I'm feelin' okay now.\r\nMuch better than yesterday.\n@c0@"
  es: "@aBianca@bSí, ya me encuentro bien.\r\nMucho mejor que ayer.\n@c0@"
  fr: "@aBianca@bOui, je me sens bien, aujourd'hui.\r\nBeaucoup mieux qu'hier.\n@c0@"
  it: "@aBianca@bOggi mi sento bene.\nSto molto meglio rispetto a ieri.\n@c0@"
  ja: "@a@bオジロン「出発は　明日にし\n\t今夜は　ゆっくりと　休むがよい！\n@c0@"
384:
  de: "@aBianca@bDas war vielleicht eine Überraschung, was? Rauszufinden, dass du hier Prinz bist?\n@c0@"
  en: "@aBianca@bIt's a bit of a surprise findin' out you're prince of this place, eh?\n@c0@"
  es: "@aBianca@bHa sido toda una sorpresa descubrir que eras el príncipe de todo esto, ¿verdad?\n@c0@"
  fr: "@aBianca@bCe doit être une sacrée surprise d'apprendre que\ntu es le prince de ce royaume, nonⓡ\n@c0@"
  it: "@aBianca@bCerto che per te dev'essere stata una bella sorpresa scoprire che sei il Principe di Denim, non è così?\n@c0@"
  ja: "@a@bビアンカ「おはよう　%a000090。\n\tきのうは　ふたりとも\n\tすごく　ねちゃったね。\n@c0@"
385:
  de: "@aBianca@bWenn du König wirst, dann wird unser Baby wohl ein Prinz oder eine Prinzessin.\n@c0@"
  en: "@aBianca@bIf you become king, then I suppose that'll make our baby a prince or princess.\n@c0@"
  es: "@aBianca@bSi te conviertes en rey, eso querrá decir que nuestro bebé será príncipe, o princesa.\n@c0@"
  fr: "@aBianca@bSi tu montes sur le trône, notre bébé sera prince ou princesse.\n@c0@"
  it: "@aBianca@bQuindi, se diventerai Re, nostro figlio sarà Principe!\nO Principessa... Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「うん　私は　大丈夫よ。\n\tだいぶ　元気になったみたい。\n@c0@"
386:
  de: "@aBianca@bNicht, dass ich mir aus so etwas wirklich was mache.\n@c0@"
  en: "@aBianca@bNot that I really care about that kind of thing, mind.\n@c0@"
  es: "@aBianca@bAunque la verdad es que todas esas cosas me dan absolutamente igual, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bRemarque, ce n'est pas le genre de chose qui m'intéresse.\n@c0@"
  it: "@aBianca@bPosso essere sincera?\nNon m'importa nulla che tu sia principe, re o quant'altro.\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090が\n\tこの国の王子さまだったなんて\n\tびっくり　しちゃったわ。\n@c0@"
387:
  de: "@aBianca@bNein, für mich könnte genauso gut alles so bleiben, wie es jetzt ist.\n@c0@"
  en: "@aBianca@bNah, I'm perfectly happy with things just\r\nas they are.\n@c0@"
  es: "@aBianca@bSoy del todo feliz con las cosas tal como son.\n@c0@"
  fr: "@aBianca@bNon, je suis tellement heureuse comme ça.\n@c0@"
  it: "@aBianca@bMi basta che tu resti sempre così come sei.\nNon cambiare mai...\n@c0@"
  ja: "@a@bビアンカ「もし　%a000090が\n\t王さまに　なっちゃったら\n\t私たちの子供も　王子さまね。\n@c0@"
388:
  de: "@aBianca@bSchön, dass du wieder da bist, %a000090.\n@c0@"
  en: "@aBianca@bIt's good to see you back, %a000090.\n@c0@"
  es: "@aBianca@bMe alegro de verte de vuelta, %a000090.\n@c0@"
  fr: "@aBianca@bJe suis heureuse de te revoir, %a000090.\n@c0@"
  it: "@aBianca@bBentornato, %a000090.\n@c0@"
  ja: "@a@bビアンカ「なあんて\n\tそんなことは　どうでもいいの。\n@c0@"
389:
  de: "@aBianca@bGehst du jetzt ins Bett?\n@c0@"
  en: "@aBianca@bYou turnin' in for the night now?\n@c0@"
  es: "@aBianca@b¿Vienes a descansar esta noche?\n@c0@"
  fr: "@aBianca@bTu es revenu pour la nuitⓡ\n@c0@"
  it: "@aBianca@bVieni a dormire?\n@c0@"
  ja: "@a@bビアンカ「私は　今のままで\n\tじゅうぶんに　しあわせよ。\n@c0@"
390:
  de: "@aBianca@bSchlaf gut, ja?\n@c0@"
  en: "@aBianca@bSleep well, eh?\n@c0@"
  es: "@aBianca@b¡Que duermas bien!\n@c0@"
  fr: "@aBianca@bDors bien.\n@c0@"
  it: "@aBianca@bSogni d'oro, maritino!\n@c0@"
  ja: "@a@bビアンカ「%a000090\n\tもどってきて　くれたのね。\n@c0@"
391:
  de: "@aBianca@bMorgen, %a000090.\n@c0@"
  en: "@aBianca@bMornin', %a000090.\n@c0@"
  es: "@aBianca@bBuenos días, %a000090.\n@c0@"
  fr: "@aBianca@bBonjour, %a000090.\n@c0@"
  it: "@aBianca@bBuongiorno, %a000090.\n@c0@"
  ja: "@a@bビアンカ「今日は　もう休む？\n@c0@"
392:
  de: "@aBianca@bSchön heute, nicht?\n@c0@"
  en: "@aBianca@bLovely day today, en't it?\n@c0@"
  es: "@aBianca@bQué día más majo, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est une journée magnifique.\n@c0@"
  it: "@aBianca@bOggi è una bellissima giornata, non è vero?\n@c0@"
  ja: "@a@bビアンカ「おやすみ　%a000090。\n@c0@"
393:
  de: "@aBianca@bWir beide, wir haben letzte Nacht wieder geschlafen wie die Babys.\n@c0@"
  en: "@aBianca@bWe both slept like babies again last night.\n@c0@"
  es: "@aBianca@bAnoche volvimos a dormir los dos como bebés.\n@c0@"
  fr: "@aBianca@bNous avons encore dormi comme des souches.\n@c0@"
  it: "@aBianca@bLa notte scorsa abbiamo dormito come ghiri!\n@c0@"
  ja: "@a@bビアンカ「おはよう　%a000090。\n@c0@"
394:
  de: "@aBianca@bDu siehst lustig aus, wenn du so total geschafft bist.\n@c0@"
  en: "@aBianca@bYou look ever so funny when you're zonked like that.\n@c0@"
  es: "@aBianca@bCuando estás así de hecho polvo tienes una pinta muy divertida.\n@c0@"
  fr: "@aBianca@bTu es tellement drôle lorsque tu es complètement vanné.\n@c0@"
  it: "@aBianca@bSai?\nMi piace guardarti mentre dormi...\n@c0@"
  ja: "@a@bビアンカ「今日は　とっても\n\tいい天気よ。\n@c0@"
395:
  de: "@aBianca@bAber mir geht's ja auch nicht besser! Ha ha!\n@c0@"
  en: "@aBianca@bNot that I can talk, prob'ly! Ha ha!\n@c0@"
  es: "@aBianca@bClaro que ¡mira quién fue a hablar! ¡Ja, ja!\n@c0@"
  fr: "@aBianca@bEnfin, je suis sûrement mal placée pour parlerⓠ\nHa haⓠ\n@c0@"
  it: "@aBianca@bPerò la notte scorsa ero troppo stanca per farlo!\nAh ah ah!\n@c0@"
  ja: "@a@bビアンカ「きのうは　ふたりとも\n\tすごく　ぐっすり　ねちゃったね。\n@c0@"
396:
  de: "@aBianca@bIch wünschte, ich könnte mit dir mitkommen, aber jetzt darf ich nicht mehr nur an mich denken, nicht?\n@c0@"
  en: "@aBianca@bI wish I could tag along with you, but I can't just go thinkin' about myself any more, eh?\n@c0@"
  es: "@aBianca@bMe gustaría ir contigo, pero ya no puedo pensar solo en mí, ¿eh?\n@c0@"
  fr: "@aBianca@bJ'aimerais tellement te suivre, mais je ne dois plus penser qu'à moi, désormais.\n@c0@"
  it: "@aBianca@bVorrei tanto venire con te, ma so che non è possibile.\nNon voglio far correre alcun rischio al nostro bambino...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tすごく　ねぞうが悪いんだもん。\n@c0@"
397:
  de: "@aBianca@bIch muss darauf achten, dass unser Baby gesund zur Welt kommt. Ich kann's gar nicht abwarten, dein Gesicht zu sehen, wenn es endlich da ist!\n@c0@"
  en: "@aBianca@bI have to make sure I give you a healthy baby, after all. I can't wait to see the look on your face when the little one arrives!\n@c0@"
  es: "@aBianca@bLo principal es que tengamos un niño bien sano. ¡Me muero de ganas de ver la cara que pondrás cuando llegue el pequeñajo!\n@c0@"
  fr: "@aBianca@bJe dois faire attention pour pouvoir te donner un joli bébé. J'ai hâte de voir ta tête quand il arriveraⓠ\n@c0@"
  it: "@aBianca@bPartorirò un bimbo sano e robusto!\nSarai orgoglioso di me e di nostro figlio!\n@c0@"
  ja: "@a@bビアンカ「なあんて\n\t私も　人のこと　言えないけどね。\n\tうふふ。\n@c0@"
398:
  de: "@aBianca@bIch wünschte, ich könnte mit dir mitkommen, aber jetzt darf ich nicht mehr nur an mich denken, nicht?\n@c0@"
  en: "@aBianca@bI wish I could tag along with you, but I can't just go thinkin' about myself any more, eh?\n@c0@"
  es: "@aBianca@bMe gustaría ir contigo, pero ya no puedo pensar solo en mí, ¿eh?\n@c0@"
  fr: "@aBianca@bJ'aimerais tellement te suivre, mais je ne dois plus penser qu'à moi, désormais.\n@c0@"
  it: "@aBianca@bVorrei tanto venire con te, ma so che non è possibile.\nNon voglio far correre alcun rischio al nostro bambino...\n@c0@"
  ja: "@a@bビアンカ「私も　いっしょに\n\t冒険に　でたいけど\n\tもう　わがまま　言わないわ。\n@c0@"
399:
  de: "@aBianca@bIch muss darauf achten, dass unser Baby gesund zur Welt kommt. Ich kann's gar nicht abwarten, dein Gesicht zu sehen, wenn es endlich da ist!\n@c0@"
  en: "@aBianca@bI have to make sure I give you a healthy baby, after all. I can't wait to see the look on your face when the little one arrives!\n@c0@"
  es: "@aBianca@bLo principal es que tengamos un niño bien sano. ¡Me muero de ganas de ver la cara que pondrás cuando llegue el pequeñajo!\n@c0@"
  fr: "@aBianca@bJe dois faire attention pour pouvoir te donner un joli bébé. J'ai hâte de voir ta tête quand il arriveraⓠ\n@c0@"
  it: "@aBianca@bPartorirò un bimbo sano e robusto!\nSarai orgoglioso di me e di nostro figlio!\n@c0@"
  ja: "@a@bビアンカ「だって　丈夫な赤ちゃんを\n\t産んで　%a000090の\n\tよろこぶ顔が　見たいもんね。\n@c0@"
400:
  de: "@aNera@bGuten Morgen, Liebling. Ich habe wunderbar geschlafen.\n@c0@"
  en: "@aNera@bGood morning, darling. I had a wonderful night's sleep last night.\n@c0@"
  es: "@aNera@bBuongiorno, caro mio. Esta notte he dormido como un ángel.\n@c0@"
  fr: "@aNera@bBonjour, mon chéri. J'ai très bien dormi cette nuit.\n@c0@"
  it: "@aNera@bBuongiorno, amore!\nAh, ho dormito proprio bene!\n@c0@"
  ja: "@a@bビアンカ「私も　いっしょに\n\t冒険に　でたいけど\n\tもう　わがまま　言わないわ。\n@c0@"
401:
  de: "@aNera@bJa, ich fühle mich jetzt viel besser.\n@c0@"
  en: "@aNera@bYes, I'm feeling much better now.\n@c0@"
  es: "@aNera@bSí, ya me siento mucho mejor.\n@c0@"
  fr: "@aNera@bOui, je me sens bien mieux, aujourd'hui.\n@c0@"
  it: "@aNera@bStamattina mi sento molto meglio, sai?\n@c0@"
  ja: "@a@bビアンカ「だって　丈夫な赤ちゃんを\n\t産んで　%a000090の\n\tよろこぶ顔が　見たいもんね。\n@c0@"
402:
  de: "@aNera@bIch hatte ja keine Ahnung, dass du ein Prinz bist!\n@c0@"
  en: "@aNera@bI had no idea you were a prince!\n@c0@"
  es: "@aNera@b¡No tenía ni idea de que fueses príncipe!\n@c0@"
  fr: "@aNera@bJe ne savais pas que tu étais princeⓠ\n@c0@"
  it: "@aNera@bNon avevo idea che tu fossi il Principe di Denim...\nE nemmeno tu, a quanto ho capito!\n@c0@"
  ja: "@a@bフローラ「おはようございます\n\tあなた。　きのうは　とっても\n\tよく　眠れたわ。\n@c0@"
403:
  de: "@aNera@bAber ich wusste immer, dass du anders bist als die anderen. Etwas ganz Besonderes.\n@c0@"
  en: "@aNera@bAlthough I always knew there was something different about you. Something special.\n@c0@"
  es: "@aNera@bAunque sempre pensé que había algo distinto en ti, alguna cosa especial.\n@c0@"
  fr: "@aNera@bMais j'ai toujours pensé que tu étais différent des autres. Vraiment différent.\n@c0@"
  it: "@aNera@bDal primo momento che ti ho visto ho pensato che tu fossi una persona speciale, ma non avrei mai immaginato nulla del genere.\n@c0@"
  ja: "@a@bフローラ「ええ　私は　大丈夫よ。\n\tもう　気分も　良くなったし。\n@c0@"
404:
  de: "@aNera@bIch hoffe, ich kann mich eines Prinzen als würdig erweisen. Ich möchte dich nicht enttäuschen, %a000090.\n@c0@"
  en: "@aNera@bI hope I can be worthy of a prince.\nI don't want to let you down, %a000090.\n@c0@"
  es: "@aNera@bEspero ser merecedora de un príncipe.\nNo querría decepcionarte, %a000090.\n@c0@"
  fr: "@aNera@bJ'espère que je serai digne d'un prince.\nJe ne veux pas te décevoir, %a000090.\n@c0@"
  it: "@aNera@bOra che ci penso, però, io ti ho sempre considerato un principe...\nIl principe del mio cuore, %a000090.\n@c0@"
  ja: "@a@bフローラ「でも　%a000090さんが\n\tこの国の王子さまだったなんて\n\tびっくり　しちゃったわ。\n@c0@"
405:
  de: "@aNera@bOh, du bist für heute zurück, %a000090?\n@c0@"
  en: "@aNera@bOh, you're back for the day, are you, %a000090?\n@c0@"
  es: "@aNera@b¿Ya has regresado per descansare, %a000090?\n@c0@"
  fr: "@aNera@bOh, tu es revenu, %a000090ⓡ\n@c0@"
  it: "@aNera@bSei di ritorno, %a000090?\n@c0@"
  ja: "@a@bフローラ「あなたには　どこかしら\n\t他の人と　ちがう　雰囲気が\n\tあると　感じていたけど…。\n@c0@"
406:
  de: "@aNera@bBist du müde? Möchtest du dich ausruhen?\n@c0@"
  en: "@aNera@bAre you tired? Do you want to rest?\n@c0@"
  es: "@aNera@b¿Estás fatigado? ¿Quieres dormire?\n@c0@"
  fr: "@aNera@bTu es fatiguéⓡ Tu veux te reposerⓡ\n@c0@"
  it: "@aNera@bSei stanco?\nHai bisogno di riposare?\n@c0@"
  ja: "@a@bフローラ「私も　がんばって\n\tあなたに　ふさわしい女性に\n\tなるわ。\n@c0@"
407:
  de: "@aNera@bDann gute Nacht, Liebling.\n@c0@"
  en: "@aNera@bGood night then, darling.\n@c0@"
  es: "@aNera@bBuona notte pues, caro mio.\n@c0@"
  fr: "@aNera@bBonne nuit, mon chéri.\n@c0@"
  it: "@aNera@bBuonanotte, amore mio.\n@c0@"
  ja: "@a@bフローラ「%a000090さん\n\tもどってきてくださったのね。\n@c0@"
408:
  de: "@aNera@bGuten Morgen, Liebling.\n@c0@"
  en: "@aNera@bGood morning, darling.\n@c0@"
  es: "@aNera@bBuongiorno, caro mio.\n@c0@"
  fr: "@aNera@bBonjour, mon chéri.\n@c0@"
  it: "@aNera@bBuongiorno, caro.\n@c0@"
  ja: "@a@bフローラ「今日は　もう休む？\n@c0@"
409:
  de: "@aNera@bHeute ist ein wundervoller Tag. Das Wetter ist fantastisch.\n@c0@"
  en: "@aNera@bIt's a glorious day today. The weather's fantastic.\n@c0@"
  es: "@aNera@bHoy hace un día espléndido. El tiempo es fantástico.\n@c0@"
  fr: "@aNera@bC'est une très belle journée. Le temps est magnifique.\n@c0@"
  it: "@aNera@bChe giornata fantastica...!\nIl tempo è meraviglioso!\n@c0@"
  ja: "@a@bフローラ「おやすみなさい　あなた…。\n@c0@"
410:
  de: "@aNera@bDu hast ja geschlafen wie ein Baby, nicht?\n@c0@"
  en: "@aNera@bYou slept like a baby last night, didn't you?\n@c0@"
  es: "@aNera@bHas dormido como un bebé questa notte, ¿vero?\n@c0@"
  fr: "@aNera@bTu as dormi comme une souche, cette nuit.\n@c0@"
  it: "@aNera@bHai dormito come un ghiro.\nSembravi un bambino che riposa dopo una giornata trascorsa a correre sui prati...\n@c0@"
  ja: "@a@bフローラ「おはようございます　あなた。\n@c0@"
411:
  de: "@aNera@bIch nicht. Ich hatte einen schrecklichen Traum.\n@c0@"
  en: "@aNera@bI didn't. I had a terrible dream.\n@c0@"
  es: "@aNera@bYo no: tuve un sogno espantoso.\n@c0@"
  fr: "@aNera@bMoi non. J'ai fait un cauchemar horrible.\n@c0@"
  it: "@aNera@bIo, invece, non ho riposato molto bene.\nHo avuto un incubo tremendo.\n@c0@"
  ja: "@a@bフローラ「今日は　とっても\n\tいい天気よ。\n@c0@"
412:
  de: "@aNera@bDu... Du wirst mich doch nicht verlassen, %a000090, oder?\n@c0@"
  en: "@aNera@bYou... You won't leave me, will you, %a000090?\n@c0@"
  es: "@aNera@bTú... No me dejarás nunca, ¿vero, %a000090?\n@c0@"
  fr: "@aNera@bTu... Tu ne me quitteras jamais, hein, %a000090ⓡ\n@c0@"
  it: "@aNera@bPromettimi che non mi lascerai mai, %a000090.\n@c0@"
  ja: "@a@bフローラ「きのうは　あなたも\n\tすごく　ぐっすり\n\t眠れたみたいね。\n@c0@"
413:
  de: "@aNera@bIch möchte immer an deiner Seite sein, aber ich weiß, das ist selbstsüchtig. Ich muss auch an unser Kind denken.\n@c0@"
  en: "@aNera@bI want to be right by your side always, but I know that's selfish. I have to think of our child too.\n@c0@"
  es: "@aNera@bQuiero estar siempre con te, pero es un pensamiento egoísta. Debo pensar también en nuestro figlio.\n@c0@"
  fr: "@aNera@bJ'aimerais toujours rester à tes côtés, mais ce serait égoïste. Je dois aussi penser à notre enfant.\n@c0@"
  it: "@aNera@bVorrei restare sempre al tuo fianco, ogni attimo della nostra vita, ma sarei egoista se ti chiedessi di venire con te. Adesso devo pensare a nostro figlio.\n@c0@"
  ja: "@a@bフローラ「ゆうべは　ちょっと\n\tこわい夢を　見たの。\n@c0@"
414:
  de: "@aNera@bIch kann mir nichts Schöneres vorstellen als dein lächelndes Gesicht, wenn das Kind dann endlich da ist.\n@c0@"
  en: "@aNera@bI can't imagine anything better than seeing your smiling face after our baby is born.\n@c0@"
  es: "@aNera@bNo puedo imaginar nada más placentero que contemplar tu sonrisa cuando nazca nuestro piccolo bambino.\n@c0@"
  fr: "@aNera@bIl n'y a rien qui me réjouisse plus que d'imaginer ton sourire quand tu verras notre bébé pour la première fois.\n@c0@"
  it: "@aNera@bSe chiudo gli occhi, vedo il volto felice che avrai quando il nostro bambino nascerà.\nSarà un momento meraviglioso...\n@c0@"
  ja: "@a@bフローラ「%a000090さん……\n\t私を　はなさないでね……。\n@c0@"
415:
  de: "@aNera@bIch möchte immer an deiner Seite sein, aber ich weiß, das ist selbstsüchtig. Ich muss auch an unser Kind denken.\n@c0@"
  en: "@aNera@bI want to be right by your side always, but I know that's selfish. I have to think of our child too.\n@c0@"
  es: "@aNera@bQuiero estar siempre con te, pero es un pensamiento egoísta. Debo pensar también en nuestro figlio.\n@c0@"
  fr: "@aNera@bJ'aimerais toujours rester à tes côtés, mais ce serait égoïste. Je dois aussi penser à notre enfant.\n@c0@"
  it: "@aNera@bVorrei restare sempre al tuo fianco, ogni attimo della nostra vita, ma sarei egoista se ti chiedessi di venire con te. Adesso devo pensare a nostro figlio.\n@c0@"
  ja: "@a@bフローラ「私も　いっしょに\n\t冒険に　でたいけど\n\tもう　わがまま　言わないわ。\n@c0@"
416:
  de: "@aNera@bIch kann mir nichts Schöneres vorstellen als dein lächelndes Gesicht, wenn das Kind dann endlich da ist.\n@c0@"
  en: "@aNera@bI can't imagine anything better than seeing your smiling face after our baby is born.\n@c0@"
  es: "@aNera@bNo puedo imaginar nada más placentero que contemplar tu sonrisa cuando nazca nuestro piccolo bambino.\n@c0@"
  fr: "@aNera@bIl n'y a rien qui me réjouisse plus que d'imaginer ton sourire quand tu verras notre bébé pour la première fois.\n@c0@"
  it: "@aNera@bSe chiudo gli occhi, vedo il volto felice che avrai quando il nostro bambino nascerà.\nSarà un momento meraviglioso...\n@c0@"
  ja: "@a@bフローラ「だって　丈夫な赤ちゃんを\n\t産んで　あなたの　よろこぶ顔が\n\t見たいもの。\n@c0@"
417:
  de: "@a@b*: Seine Majestät der König hat Euch gebeten, etwas für ihn zu tun, nicht wahr?\n@c0@"
  en: "@a@b*: His Majesty the King's asked you to do something for him, hasn't he?\n@c0@"
  es: "@a@b*: Su Majestad el Rey te ha encomendado una misión, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Sa Majesté vous a demandé de faire quelque chose pour lui, nonⓡ\n@c0@"
  it: "@a@b*: Il Principe Reggente ti ha chiesto di sbrigare una commissione per lui, non è vero?\n@c0@"
  ja: "@a@bフローラ「私も　いっしょに\n\t冒険に　でたいけど\n\tもう　わがまま　言わないわ。\n@c0@"
418:
  de: "@a@b*: Na, macht Euch nur keine Sorgen. Ich werde mich um Eure Frau kümmern. Bei mir ist sie in guten Händen!\n@c0@"
  en: "@a@b*: Well don't you worry about a thing, pet.\nI'll look after your wife. She's in safe hands with me!\n@c0@"
  es: "@a@b*: No te preocupes por nada, querido.\r\nYo cuidaré de tu mujer. ¡Conmigo está en buenas manos!\n@c0@"
  fr: "@a@b*ⓢ Ne vous inquiétez pas, mon petit.\nJe vais m'occuper de votre femme.\nElle est en de bonnes mains avec moi.\n@c0@"
  it: "@a@b*: Vai tranquillo.\nAvrò la massima attenzione per tua moglie.\nTi garantisco che è in ottime mani!\n@c0@"
  ja: "@a@bフローラ「だって　丈夫な赤ちゃんを\n\t産んで　あなたの　よろこぶ顔が\n\t見たいもの。\n@c0@"
419:
  de: "@a@b*: Ich weiß, der König ist ein sehr gütiger Mann, aber er würde net jeden Daherg'laufenen bei sich aufnehmen.\n@c0@"
  en: "@a@b*: I know the King's a kind man, but he wouldn't just let any old passers-by stay here.\n@c0@"
  es: "@a@b*: El Rey es muy amable, pero no dejaría quedarse aquí a cualquier persona.\n@c0@"
  fr: "@a@b*ⓢ Je sais que le roi est un homme généreux, mais il ne laisserait pas des voyageurs de passage séjourner ici.\n@c0@"
  it: "@a@b*: Il Principe Reggente è una persona molto generosa, ma non permetterebbe mai a nessun forestiero di restare qui.\n@c0@"
  ja: "@a@b＊「王さまから　なにか\n\tたのまれたんだね。\n@c0@"
420:
  de: "@a@b*: Ihr müsst jemand ganz B'sonderes sein.\n@c0@"
  en: "@a@b*: You must be someone special.\n@c0@"
  es: "@a@b*: Debes de ser alguien muy especial.\n@c0@"
  fr: "@a@b*ⓢ Vous devez être quelqu'un de spécial.\n@c0@"
  it: "@a@b*: Devi essere una persona molto importante per lui.\n@c0@"
  ja: "@a@b＊「留守中の　奥さまのお世話は\n\tこの私が　ひきうけたよっ。\n@c0@"
421:
  de: "@a@b*: Nur keine Sorge, ich sag's niemandem! Ich hab keine Ahnung, dass Ihr zur königlichen Familie g'hört. Ich hab keine Ahnung von gar nichts!\n@c0@"
  en: "@a@b*: I won't tell anyone, don't you worry! I don't know you're part of the royal family. I don't know anything about it!\n@c0@"
  es: "@a@b*: ¡No se lo diré a nadie, no se preocupe! Yo no sé que usted forma parte de la familia real. ¡Yo no sé nada de eso!\n@c0@"
  fr: "@a@b*ⓢ Je ne dirai rien à personne, ne vous inquiétez pasⓠ Je ne sais pas que vous faites partie de la famille royale. Je ne sais strictement rien.\n@c0@"
  it: "@a@b*: Non dirò niente a nessuno, non tema!\nNon rivelerò a nessuno che lei è un membro della famiglia reale. Può stare tranquillo!\n@c0@"
  ja: "@a@b＊「いくら　人のいい王さまでも\n\tただの通りすがりの旅の人に\n\tベッドを　貸すわけはないし……。\n@c0@"
422:
  de: "@a@b*: Der Kanzler hat unmissverständlich klargemacht, dass jeder, der auch nur ein Wörtchen verlauten lässt, in ernsten Schwierigkeiten steckt.\n@c0@"
  en: "@a@b*: The Chancellor made it very clear that anyone who spills the beans will be in serious trouble.\n@c0@"
  es: "@a@b*: El Canciller dejó muy claro que si alguien se iba de la lengua se metería en un buen lío.\n@c0@"
  fr: "@a@b*ⓢ Le chancelier nous a fait comprendre que ceux qui parleraient auraient de sacrés problèmes.\n@c0@"
  it: "@a@b*: Il Ministro ha detto che mozzerà personalmente la lingua a chiunque si lasciasse sfuggire una sola parola. E io alla mia lingua ci tengo!\n@c0@"
  ja: "@a@b＊「あなたたち\n\tいったい　何者なの？\n@c0@"
423:
  de: "@aPrinz Sebastian@bWenn's nach mir ginge, ich tät einfach sag'n: ⓞSeht, liebe Leute! Das hier ist euer neuer König von Humburg!ⓟ\n@c0@"
  en: "@aPrince Albert@bIf it was up to me, I'd just say, ⓗListen up, chaps! This is the new King of Gotha.ⓘ\n@c0@"
  es: "@aRey Agila@bSi fuese por mí, diría simplemente ⓕ¡Eh, amigos! Este es el nuevo rey de Pankrazⓖ.\n@c0@"
  fr: "@aPrince Albert@bSi ça ne tenait qu'à moi, je dirais simplementⓢ\nⓥÉcoutez-moi tousⓠ Voici le nouveau roi de Gotha.ⓦ\n@c0@"
  it: "@aPrincipe Alberto@bDipendesse da me, radunerei i nostri sudditi e direi loro: ⓕEhi, gente! Questo è il nuovo Re di Denim! Vogliategli bene.ⓖ\n@c0@"
  ja: "@a@b＊「%a000090さまが\n\t王族だったなんて　ぜったいに\n\t人には　言いません！\n@c0@"
424:
  de: "@aPrinz Sebastian@bAber ich fürchte, du musst zu den sogenannten Maturahöhlen gehen und dort die Königlichen Insignien holen.\n@c0@"
  en: "@aPrince Albert@bBut I'm afraid you're going to have to go to\r\nthe cave known as Riteof Passage and get\r\nthe Royal Insignia.\n@c0@"
  es: "@aRey Agila@bPero me temo que vas a tener que entrar en la Cueva Ritual y hacerte con la Insignia Real.\n@c0@"
  fr: "@aPrince Albert@bJe suis désolé, mais je crois que tu vas devoir aller dans la grotte appelée la balme des Débutants pour y récupérer l'Emblème royal.\n@c0@"
  it: "@aPrincipe Alberto@bPurtroppo, la legge richiede che tu superi la prova nota come ⓕAntro della Successioneⓖ, e che conquisti lo Stemma Reale.\n@c0@"
  ja: "@a@b＊「大臣からも　きつく\n\tクチ止め　されていますから……。\n@c0@"
425:
  de: "@aPrinz Sebastian@bⓙs ist halt Tradition, verstehst. Um zu zeigen, dass du deiner Aufgabe gewachsen bist oder dergleichen. Und dann kann ich dir den Thron überlass'n.\n@c0@"
  en: "@aPrince Albert@bIt's tradition, you see. To prove you're up to the job, or some such rot. Anyway, do that, and I can give you the throne.\n@c0@"
  es: "@aRey Agila@bEs la tradición, ya ves. Para demostrar si estás a la altura o eres un mindundi cualquiera. Bueno, el caso es que, en cuanto lo hagas, te cedo el trono.\n@c0@"
  fr: "@aPrince Albert@bC'est la tradition qui veut ça. Cette épreuve est censée prouver que tu es à la hauteur ou une bêtise dans ce genre. Vas-y et je te rendrai le trône.\n@c0@"
  it: "@aPrincipe Alberto@bÈ una vecchia legge emanata per verificare se il candidato al trono abbia o meno le qualità necessarie per diventare il nuovo Re di Denim.\n㈡\nBeh, per farla breve: supera la prova dell'Antro della Successione e la corona sarà tua.\n@c0@"
  ja: "@a@bオジロン「わしは　そなたに\n\t王位を　ゆずりたいのじゃ。\n@c0@"
426:
  de: "@aPrinz Sebastian@bDie Maturahöhlen befinden sich im Wald östlich von der Burg.\n@c0@"
  en: "@aPrince Albert@bYou'll find Riteof Passage in the forest to the east of the castle.\n@c0@"
  es: "@aRey Agila@bLa Cueva Ritual está en el bosque al este del castillo.\n@c0@"
  fr: "@aPrince Albert@bLa balme des Débutants se trouve dans la forêt, à l'est du château.\n@c0@"
  it: "@aPrincipe Alberto@bL'Antro della Successione si trova nella foresta a est del Castello.\n@c0@"
  ja: "@a@bオジロン「たのむっ！\n\t試練の洞くつに　いって\n\t王家のあかしを　取ってきてくれい！\n@c0@"
427:
  de: "@aKanzler Konrad@bIch glaub, es wär g'scheit, über Eure Verbindung zu König Ludwig Stillschweigen zu bewahr'n, gnädigster Herr.\n@c0@"
  en: "@aChancellor Jeeves@bI think it would be prudent if we remained discreet about your relation to King Pankraz, sir.\n@c0@"
  es: "@aCanciller Ambrosio@bEstimo que sería prudente mantener la discreción acerca de su relación con el rey Teudis, señor.\n@c0@"
  fr: "@aChancelier Tiquette@bJe pense qu'il serait prudent que vous gardiez secrète votre parenté avec le roi Petros.\n@c0@"
  it: "@aMinistro Ligio@bAltezza, ritengo opportuno tenere ancora nascosta la sua appartenenza alla famiglia reale.\n@c0@"
  ja: "@a@bオジロン「そして　その時こそ\n\tそなたに　王位を　ゆずろうぞっ！\n@c0@"
428:
  de: "@aKanzler Konrad@bEure Reise zu den Maturahöhlen könnt' sich als recht g'fährlich erweisen. Man weiß ja nie, was geschehen könnte.\n@c0@"
  en: "@aChancellor Jeeves@bYour excursion to Riteof Passage could be rather dangerous. One never knows what might happen.\n@c0@"
  es: "@aCanciller Ambrosio@bSu incursión en la Cueva Ritual podría resultar algo peligrosa. Nunca se sabe lo que podría acontecer...\n@c0@"
  fr: "@aChancelier Tiquette@bVotre expédition dans la balme des Débutants risque d'être dangereuse. On ne sait jamais ce qui pourrait arriver.\n@c0@"
  it: "@aMinistro Ligio@bLa prova dell'Antro della Successione è molto pericolosa, e c'è la possibilità che lei ci lasci la pell...\n㈡\nEhm, c'è la possibilità che lei non la superi.\n@c0@"
  ja: "@a@bオジロン「試練の洞くつは\n\tこの城の東　森の中じゃ！\n@c0@"
429:
  de: "@aKanzler Konrad@bⓙs wär doch höchst unglücklich, wenn das Volk von Humburg verfrüht in einen Freudentaumel geraten würd'.\n@c0@"
  en: "@aChancellor Jeeves@bIt would be most unfortunate were the people of Gotha to celebrate prematurely.\n@c0@"
  es: "@aCanciller Ambrosio@bSería francamente inoportuno que los habitantes de Pankraz se lanzasen a una celebración prematura.\n@c0@"
  fr: "@aChancelier Tiquette@bCe serait véritablement malheureux que les gens de Gotha se réjouissent prématurément.\n@c0@"
  it: "@aMinistro Ligio@bPer questo motivo, consiglio che i sudditi di Denim non siano ancora informati sulla sua ⓕrealeⓖ identità.\n㈡\nAh ah ah! Capito il doppio senso? ⓕRealeⓖ identità!\nAh ah ah! Ehm, scusi la facezia. Comunque sia, non vorrei che festeggiassero, ehm... prematuramente.\n@c0@"
  ja: "@a@b大臣「%a000090どのが\n\t先代パパス王の子供であることは\n\tまだ　ヒミツですぞ。\n@c0@"
430:
  de: "@a@b*: Passt auf Euch auf, gnädiger Herr.\n@c0@"
  en: "@a@b*: Take care, sir.\n@c0@"
  es: "@a@b*: Tenga cuidado, señor.\n@c0@"
  fr: "@a@b*ⓢ Faites bien attention, Monsieur.\n@c0@"
  it: "@a@b*: In bocca al lupo!\n@c0@"
  ja: "@a@b大臣「試練の洞くつで\n\tどんな事が　あるやも知れず……。\n@c0@"
431:
  de: "@a@b*: Ich weiß. 's ist alles unter dem Siegel der strengsten Verschwiegenheit, net wahr? Dass Ihr zur königlichen Familie gehört, mein' ich.\n@c0@"
  en: "@a@b*: I know. It's all hush-hush, right?\nThat you're part of the royal family, I mean.\n@c0@"
  es: "@a@b*: Lo sé. Es todo secreto, ¿verdad?\r\nLo de que es usted de la familia real, quiero decir.\n@c0@"
  fr: "@a@b*ⓢ Je sais. C'est top secret, pas vraiⓡ\nLe fait que vous fassiez partie de la famille royale, je veux dire.\n@c0@"
  it: "@a@b*: So tutto! Nelle sue vene scorre sangue reale!\nNon si preoccupi, Altezza.\nDalla mia bocca non uscirà una sola parola.\n@c0@"
  ja: "@a@b大臣「国民たちを\n\tぬかよろこび　させても\n\tいけませんでな。\n@c0@"
432:
  de: "@a@b*: Der Kanzler würd' uns ein schönes G'schrei veranstalten, wenn wir was verraten würden.\n@c0@"
  en: "@a@b*: The Chancellor would have our guts for garters if we let the cat out of the bag.\n@c0@"
  es: "@a@b*: Si nos fuésemos de la lengua, el Canciller nos colgaría de los pulgares.\n@c0@"
  fr: "@a@b*ⓢ Le chancelier nous ferait couper la langue s'il apprenait que quelqu'un a lâché le morceau.\n@c0@"
  it: "@a@b*: Il ministro Ligio ha giurato che strapperà personalmente i denti a chiunque svelasse la sua identità.\n㈡\n*: E io ci tengo ai miei denti! Non vorrei mangiare semolino per il resto della mia vita!\n@c0@"
  ja: "@a@b＊「どうか　お気をつけて。\n@c0@"
433:
  de: "@a@b*: König Ludwig, der frühere König, trug mir auf, das legendäre Schloss eines Ortes namens Zenithia zu erforschen.\n@c0@"
  en: "@a@b*: I was instructed by King Pankraz, the former king, to research the legendary castle of a place known as Zenithia.\n@c0@"
  es: "@a@b*: El rey Teudis, nuestro antiguo rey, me ordenó que investigase el legendario castillo de un lugar denominado Zenithia.\n@c0@"
  fr: "@a@b*ⓢ Le roi Petros, l'ancien roi, m'avait demandé de faire des recherches sur un château légendaire situé dans un lieu appelé Zénithia.\n@c0@"
  it: "@a@b*: Anni fa re Russel mi diede ordine di effettuare delle ricerche sul leggendario castello chiamato Zenithia.\n@c0@"
  ja: "@a@b＊「分かっております。　\n\t%a000090さまが　王族だということは\n\tナイショなのですよね。\n@c0@"
434:
  de: "@a@b*: Aber nun, da Seine Majestät nicht mehr da ist, weiß ich net, ob es überhaupt einen Zweck hat, meine Forschungen fortzusetz'n.\n@c0@"
  en: "@a@b*: The problem is, now that His Majesty is no longer around, I don't know if there's any point in continuing my research.\n@c0@"
  es: "@a@b*: El problema es que, ahora que Su Majestad ya no está, no sé si tiene mucho sentido que prosiga con la investigación.\n@c0@"
  fr: "@a@b*ⓢ Le problème, c'est que Sa Majesté a disparu et je ne sais pas si ça vaut la peine que je poursuive mes recherches.\n@c0@"
  it: "@a@b*: Ora, però, Russel non è più a Denim, e mi è venuto un dubbio atroce! Abbandono le ricerche su Zenithia oppure le continuo? Che faccio?\n@c0@"
  ja: "@a@b＊「大臣からも　きつく\n\tクチ止め　されていますし……。\n@c0@"
435:
  de: "@a@b*: Ach, verflixt! Ich habe schon wieder verloren. Otto ist einfach zu gut für mich.\n@c0@"
  en: "@a@b*: Oh, bother! I lost again. Thruppence is just too good for me, I suppose.\n@c0@"
  es: "@a@b*: ¡Oh, caray! He vuelto a perder. Supongo que Ale Atorio es mucho mejor que yo.\n@c0@"
  fr: "@a@b*ⓢ Et zutⓠ J'ai encore perdu.\nVirtus est vraiment trop fort pour moi.\n@c0@"
  it: "@a@b*: Oh, accidenti! Ho perso un'altra volta! Devo riconoscerlo: Echex è troppo forte per me.\n@c0@"
  ja: "@a@b＊「私は　先代のパパス王に命じられ\n\tかつて　天空にあったといわれる\n\t伝説の城について研究しています。\n@c0@"
436:
  de: "@a@b*: Hm? Wovon ich red'? Na, von dem, wovon alle reden! Vom Monsterschach natürlich! Das ist im Moment der allerletzte Schrei!\n@c0@"
  en: "@a@b*: Hm? What am I talking about? What's everyone talking about!? Monster chess of course! Everyone's crazy about it at the moment.\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Que de qué estoy hablando? ¡De lo que habla todo el mundo! ¡De monstriajedrez, claro! Todo el mundo está obsesionado por ese juego.\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ De quoi je parleⓡ À votre avisⓠⓑ\nDu jeu d'échecs monstrueux, bien sûrⓠ\nC'est la grande mode en ce momentⓠ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici?! Vorresti farmi credere che non sai%Ydite?! Vorreste farmi credere che non sapete%Z di cosa sto parlando?!\n㈡\nMa degli ⓕscacchi dei mostriⓖ, no?!\nÈ la mania collettiva che ha contagiato tutti i soldati dell'esercito di Denim ultimamente.\n@c0@"
  ja: "@a@b＊「しかし　パパス王　亡き今\n\tこの研究が　いったい\n\tなにになると　いうのでしょうか！\n@c0@"
437:
  de: "@a@b*: Der Kanzler hat vor kurzem all diese Schachfiguren in der Schatzkammer gefunden.\n@c0@"
  en: "@a@b*: The Chancellor found all these chess pieces in the vault recently, you see.\n@c0@"
  es: "@a@b*: El Canciller encontró hace poco todas esas piezas de monstriajedrez en la cámara del tesoro.\n@c0@"
  fr: "@a@b*ⓢ Le chancelier a trouvé ces pièces d'échec dans la chambre forte il y a quelques temps.\n@c0@"
  it: "@a@b*: Poco tempo fa il nostro Ministro ha trovato una scacchiera nella sala del tesoro del castello.\n@c0@"
  ja: "@a@b＊「あ～あ　また負けちまったよ。\n\tまったく　パピンには\n\tかなわないなあ……。\n@c0@"
438:
  de: "@a@b*: Und seitdem sind wir Soldaten alle ganz verrückt danach. Wir können schon an gar nichts anderes mehr denken!\n@c0@"
  en: "@a@b*: Ever since then, all us soldiers have been completely hooked on it. It's all we think about now!\n@c0@"
  es: "@a@b*: Desde entonces, todos los soldados nos hemos enganchado al juego. ¡No pensamos en nada más!\n@c0@"
  fr: "@a@b*ⓢ Depuis, tous les soldats sont vraiment accros.\nOn ne pense qu'à çaⓠ\n@c0@"
  it: "@a@b*: Da quel momento in avanti, noi soldati non abbiamo smesso di giocare nemmeno per un istante!\nNon pensiamo ad altro che agli scacchi!\n@c0@"
  ja: "@a@b＊「なんの話かって？\n\tこの城で　はやっているゲーム……\n\tチェス　の話だよ。\n@c0@"
439:
  de: "@a@b*: Ich hab net g'wusst, dass Ihr ein Freund vom Sancho seid.\n@c0@"
  en: "@a@b*: I didn't realise you were a friend of Sancho's.\n@c0@"
  es: "@a@b*: No me di cuenta de que %H0860%Xeras %A0110%Xamigo%Z%B0110%Xamiga%Z%Yerais %R0000%Xamigas%Yamigos%Z%Z de Sancho.\n@c0@"
  fr: "@a@b*ⓢ Je n'avais pas compris que vous étiez un%A0110%X ami%Z%B0110%Xe amie%Z de Sancho.\n@c0@"
  it: "@a@b*: Mi scuso per il mio comportamento di prima.\nNon sapevo che tu fossi amico del signor Sancho.\n@c0@"
  ja: "@a@b＊「しばらく前に　大臣が\n\t宝物庫から　チェスのコマを\n\t見つけてきてさ。\n@c0@"
440:
  de: "@a@b*: Ich hoff', Ihr seid hier noch net abgewiesen worden. Fremde dürfen eigentlich net hinein, wisst Ihr.\n@c0@"
  en: "@a@b*: I hope you weren't turned away from here before. Strangers aren't usually allowed in, you see.\n@c0@"
  es: "@a@b*: Espero que no %H0860%Xte%Yos%Z echasen de aquí antes. Los extraños no suelen ser bienvenidos.\n@c0@"
  fr: "@a@b*ⓢ J'espère qu'on ne vous avait pas déjà envoyé%H0860%X%A0110%X%Z%B0110%Xe%Z%Y%R0000%Xes%Ys%Z%Z paître auparavant. Les étrangers n'ont généralement pas le droit d'entrer, vous comprenez.\n@c0@"
  it: "@a@b*: Abbiamo ricevuto l'ordine tassativo di non far entrare estranei.\nSai, le solite misure di sicurezza...\n@c0@"
  ja: "@a@b＊「それ以来　われわれ\n\t兵士の間で　大人気ってわけ。\n@c0@"
441:
  de: "@a@b*: Fräulein Gertraud will einfach nicht auf mich hören!\n@c0@"
  en: "@a@b*: Mistress Gertrude doesn't listen to a word I say!\n@c0@"
  es: "@a@b*: ¡Lady Fredegunda no me hace ningún caso!\n@c0@"
  fr: "@a@b*ⓢ Mademoiselle Gertrude ne veut pas m'écouterⓠ\n@c0@"
  it: "@a@b*: La signorina Gertrude non ascolta nemmeno una parola di ciò che dico.\n@c0@"
  ja: "@a@b＊「サンチョどのの　お知り合いとは\n\t知りませんでした！\n@c0@"
442:
  de: "@aGertraud@bIch wollte doch gar keine Prinzessin werden!\n@c0@"
  en: "@aGertrude@bI never asked to be a princess.\n@c0@"
  es: "@aFredegunda@bYo nunca pedí ser princesa.\n@c0@"
  fr: "@aGertrude@bJe n'ai jamais demandé à devenir princesse.\n@c0@"
  it: "@aGertrude@bIo non ho mai voluto fare la principessa.\nNon l'ho mai nemmeno pensato!\n@c0@"
  ja: "@a@b＊「先日は　失礼しました！\n@c0@"
443:
  de: "@aGertraud@bUnd bloß, weil sie meinen Papa zum König von Humburg g'macht haben. Denen ist doch ganz egal, was ich denk'. Ich hab gar nichts zu sagen!\n@c0@"
  en: "@aGertrude@bIt's only because my father's become King of Gotha. It doesn't matter what I think. I don't have any say in it!\n@c0@"
  es: "@aFredegunda@bLo que pasa es que mi padre se ha convertido en rey de Pankraz. No importa lo que yo diga. ¡Mi opinión no cuenta para nada!\n@c0@"
  fr: "@aGertrude@bC'est juste parce que mon père a été sacré roi de Gotha. Tout le monde se moque de ce que je pense.\r\nJe n'ai pas mon mot à dire.\n@c0@"
  it: "@aGertrude@bPerò, siccome mio padre è diventato il Principe Reggente di Denim, ora mi tocca diventare principessa per forza! Uffà!\n@c0@"
  ja: "@a@b＊「ドリスさまったら\n\tちっとも　私のいうことを\n\t聞いてくれなくて……。\n@c0@"
444:
  de: "@aGertraud@bDas ist ungerecht! Ich will doch einfach nur spielen.\n@c0@"
  en: "@aGertrude@bIt's not fair.\nI just want to play.\n@c0@"
  es: "@aFredegunda@bNo es justo.\r\nYo solo quiero jugar.\n@c0@"
  fr: "@aGertrude@bCe n'est pas juste. Je veux juste m'amuser.\n@c0@"
  it: "@aGertrude@bNon è giusto.\nIo voglio giocare come fanno tutte le ragazzine della mia età!\n@c0@"
  ja: "@a@bドリス「あたしはさ\n\tお姫さまなんかに\n\tなりたくなかったのよ。\n@c0@"
445:
  de: "@a@b*: Ich kann mich noch an die langen Tage erinnern, als ich hier stand und darauf gewartet hab, dass König Ludwig zurückkommen würd'.\n@c0@"
  en: "@a@b*: I remember all those long days I stood here, waiting for King Pankraz to return.\n@c0@"
  es: "@a@b*: Recuerdo los largos días que pasaba aquí de pie, esperando que el rey Teudis regresase.\n@c0@"
  fr: "@a@b*ⓢ Je me souviens de ces longues journées passées ici à attendre le retour du roi Petros.\n@c0@"
  it: "@a@b*: Ricordo ancora i lunghi giorni che ho trascorso qui, in attesa del ritorno di re Russel...\n@c0@"
  ja: "@a@bドリス「でも　親父が\n\t王さまになったもんだから\n\t私もお姫さまに　されちゃってさ。\n@c0@"
446:
  de: "@a@b*: Und dann sah ich eines Tages plötzlich Herrn Sancho zur Burg heraufkommen.\n@c0@"
  en: "@a@b*: Then finally one day, I spotted Mr Sancho approaching the castle.\n@c0@"
  es: "@a@b*: Y, por fin, un día vi al señor Sancho acercándose al castillo.\n@c0@"
  fr: "@a@b*ⓢ Et un jour, j'ai vu monsieur Sancho qui approchait du château.\n@c0@"
  it: "@a@b*: Finalmente, un giorno vidi il signor Sancho che si stava avvicinando al Castello.\n@c0@"
  ja: "@a@bドリス「あーあ。\n\tもっと　気楽に\n\t暮らしたかったなあ。\n@c0@"
447:
  de: "@a@b*: Ich kann Euch gar net sagen, wie froh ich war, ihn zu sehen!\n@c0@"
  en: "@a@b*: I can't tell you how happy I was to see him!\n@c0@"
  es: "@a@b*: ¡No hay palabras para describir lo contento que me puse!\n@c0@"
  fr: "@a@b*ⓢ Vous ne pouvez pas savoir comme j'étais heureux de le voirⓠ\n@c0@"
  it: "@a@b*: Ero felicissimo! Credevo che il nostro Re fosse con lui!\n@c0@"
  ja: "@a@b＊「かつて　私は　ここで毎日\n\tパパス王の　帰りを\n\t待っていました。\n@c0@"
448:
  de: "@a@b*: Aber so sehr ich auch schaute, von König Ludwig war nichts zu sehen.\n@c0@"
  en: "@a@b*: But however many times and however hard I looked, King Pankraz wasn't with him.\n@c0@"
  es: "@a@b*: Pero, por mucho que agucé la vista, no pude ver al rey Teudis con él.\n@c0@"
  fr: "@a@b*ⓢ Mais j'ai eu beau m'abîmer les yeux à scruter,\nle roi Petros n'était pas avec lui.\n@c0@"
  it: "@a@b*: Invece no.\nPer quanto guardassi, non riuscivo a scorgere la figura forte e fiera di re Russel.\n@c0@"
  ja: "@a@b＊「そして　ついに　城にやってくる\n\tサンチョどのの姿を\n\t見つけたのでした！\n@c0@"
449:
  de: "@a@b*: Ich war so traurig, dass er net bei ihm war!\n@c0@"
  en: "@a@b*: I can't tell you how sad I was not to see him!\n@c0@"
  es: "@a@b*: ¡No hay palabras para describir lo triste que me puse!\n@c0@"
  fr: "@a@b*ⓢ Vous ne pouvez pas imaginer combien j'étais triste de ne pas le voirⓠ\n@c0@"
  it: "@a@b*: Di colpo, fui colto da un'indicibile tristezza.\n@c0@"
  ja: "@a@b＊「あの時ほど\n\tうれしかったことは　ありません。\n@c0@"
450:
  de: "@a@b*: Ihr seid doch ein Freund vom Sancho, net wahr? Bitte tretet ein.\n@c0@"
  en: "@a@b*: You're a friend of Sancho's, aren't you?\nYou're free to enter.\n@c0@"
  es: "@a@b*: %H0860%XEres %A0110%Xamigo%Z%B0110%Xamiga%Z%YSois %R0000%Xamigas%Yamigos%Z%Z de Sancho ¿no?\n%H0860%XPuedes%YPodéis%Z entrar.\n@c0@"
  fr: "@a@b*ⓢ Vous connaissez Sancho, c'est çaⓡ\nVous pouvez entrer.\n@c0@"
  it: "@a@b*: Tu sei amico del signor Sancho, vero?\nAllora puoi entrare liberamente.\n@c0@"
  ja: "@a@b＊「しかし　いくら　目をこらしても\n\tそのあとに　いるはずの\n\tパパス王の姿が　見えませんでした。\n@c0@"
451:
  de: "@a@b*: Seine Majestät, der große Prinz Sebastian, tut genau, was der ⓚⓛ hick! ⓚⓛ Kanzler ihm sagt.\n@c0@"
  en: "@a@b*: His Majesty, the great Prince Albert, just does whatever the ⓚⓛ Hic! ⓚⓛ Chancellor tells him.\n@c0@"
  es: "@a@b*: Su Maguestad, el gran rey Agila, no hace más gue lo gue... ¡hip!... el Ganciller le dice.\n@c0@"
  fr: "@a@b*ⓢ Sa Majesté le prince Albert fait toujours ⓚ hicⓠ ⓚ ce que le chancelier lui dit.\n@c0@"
  it: "@a@b*: Shua Maeshtoshità il Prinshipe Alberto fa tuuutto quello che gli dishe il Mineshtro.\nHic! Volevo dire il Minishtro... Hic!\n@c0@"
  ja: "@a@b＊「サンチョどのの知らせを\n\t聞いたときほど\n\t悲しかったことは　ありません。\n@c0@"
452:
  de: "@a@b*: Manchmal weiß man net, wer ⓚⓛ hick! ⓚⓛ von beiden die Gefäfte schürt.\n@c0@"
  en: "@a@b*: It's tard to hell which one of ⓚⓛ Hic! ⓚⓛ them is running the place sometimes.\n@c0@"
  es: "@a@b*: A veces no se sabe guién es... ¡hip!... el gue manda aguí.\n@c0@"
  fr: "@a@b*ⓢ Des fois, on a du mal à savoir lequel ⓚ hicⓠ ⓚ des deux gouverne.\n@c0@"
  it: "@a@b*: Io penshavo che i Prinshipi foshero più potenti dei Minishtri, ma evidentemente a Denim le coshe vanno divershamente... Hic!\n@c0@"
  ja: "@a@b＊「サンチョさんの\n\tお知り合いの　かたですね。\n\tどうぞ　お入りください。\n@c0@"
453:
  de: "@a@b*: Prinz Sebastian ist ein großer Mann. Eine wirklich gütige Seele.\n@c0@"
  en: "@a@b*: Prince Albert is a great man. A truly\r\nkind-hearted soul.\n@c0@"
  es: "@a@b*: El rey Agila es un gran hombre. Una persona de amable corazón.\n@c0@"
  fr: "@a@b*ⓢ Le prince Albert est vraiment un grand homme.\nC'est quelqu'un de profondément bon.\n@c0@"
  it: "@a@b*: Il principe Alberto è un uomo gentile e generoso.\n@c0@"
  ja: "@a@b＊「オジロン王は　とにかく\n\t大臣の　言いなりなのだ！\n@c0@"
454:
  de: "@a@b*: Natürlich mache ich mir manchmal etwas Sorgen, dass er womöglich allzu gütig ist. Viel Rückgrat hat er ja net.\n@c0@"
  en: "@a@b*: Of course, I do worry sometimes that he's a bit too kind-hearted. He could be a bit of a soft touch.\n@c0@"
  es: "@a@b*: Claro que a veces me preocupa que sea tan amable. Creo que en realidad es un poco blando.\n@c0@"
  fr: "@a@b*ⓢ C'est vrai qu'il est parfois trop bon même.\nCertains pourraient abuser de sa bonté.\n@c0@"
  it: "@a@b*: Che la cosa resti tra di noi, ma a volte penso che sia fin troppo gentile e generoso! Non vorrei che qualcuno si approfittasse del suo buon carattere...\n@c0@"
  ja: "@a@b＊「あれでは　どっちが　王さまか\n\tわからないぞ！　ヒック……。\n@c0@"
455:
  de: "@a@b*: Dies ist die Kasernenkneipe. Für die Soldaten, net wahr? Aber Ihr seht mir net wie einer aus.\n@c0@"
  en: "@a@b*: This is the barracks bar.\r\nIt's for the soldiers, see.\r\nBut you don't look like one of them.\n@c0@"
  es: "@a@b*: Esta es la cantina del cuartel.\r\nEs para los soldados.\r\nPero tú no pareces un soldado.\n@c0@"
  fr: "@a@b*ⓢ C'est la taverne de la caserne. Elle est réservée aux soldats. Et vous n'avez pas l'air de faire partie de la garde.\n@c0@"
  it: "@a@b*: Questa mensa è riservata ai soldati e alle guardie, e tu non mi sembri affatto uno di loro.\nBeh, per questa volta fingerò di non averti visto.\n@c0@"
  ja: "@a@b＊「オジロン王は\n\t本当に　いい人なのだが……。\n@c0@"
456:
  de: "@a@b*: Ich mach mir ein bisserl Sorgen um sie. Sie sind ganz narrisch auf dieses neumodische Monsterschach.\n@c0@"
  en: "@a@b*: I'm a bit worried about them, actually.\r\nThey've all gone mad about this new\r\nmonster chess craze.\n@c0@"
  es: "@a@b*: En realidad, me preocupan un poco.\r\nEstán todos completamente enganchados a esta nueva moda del monstriajedrez.\n@c0@"
  fr: "@a@b*ⓢ Ils m'inquiètent un peu en ce moment.\nIls sont tous complètement fous de ce nouveau jeu d'échecs monstrueux.\n@c0@"
  it: "@a@b*: Sai? Ultimamente sono un po' preoccupata.\nTutti i militari del Regno sono impazziti per gli scacchi dei mostri, e non fanno altro che giocare.\n@c0@"
  ja: "@a@b＊「ちょっと　おひとよしすぎる\n\t気も　するな。\n@c0@"
457:
  de: "@a@b*: Sie denken an gar nichts anderes mehr. Ich hoff' nur, ihre Arbeit kommt dabei nicht zu kurz.\n@c0@"
  en: "@a@b*: It's all they think about now. I hope they're paying enough attention to their work.\n@c0@"
  es: "@a@b*: No piensan en nada más. Espero que presten a su trabajo la atención necesaria.\n@c0@"
  fr: "@a@b*ⓢ Ils ne pensent qu'à ça. J'espère au moins qu'ils font leur boulot correctement.\n@c0@"
  it: "@a@b*: Per loro è diventata un'ossessione!\nVa bene distrarsi un po', ma non vorrei che trascurassero i loro doveri di soldati!\n@c0@"
  ja: "@a@b＊「ここは　兵士たちの酒場よ。\n\tでも　あなたは\n\t兵士には　見えないわね。\n@c0@"
458:
  de: "@a@b*: Na aber geh, Ottmar! Die muss doch irgendwo sein! Ich hab's doch grad noch gezählt und die Figuren war'n alle da, aber jetzt fehlt eine.\n@c0@"
  en: "@a@b*: Come on, Thruppence! It must be here somewhere!\r\nI just counted them and all the pieces were here, but there's one missing now.\n@c0@"
  es: "@a@b*: ¡Vamos, Ale Atorio! ¡Debe de estar por alguna parte!\n㈡\n*: Las acabo de contar y estaban todas, pero justo ahora falta una pieza.\n@c0@"
  fr: "@a@b*ⓢ Allez, Virtusⓠ Elle ne doit pas être loinⓠ\nJe venais de les compter et toutes les pièces\ny étaient. Mais maintenant, il en manque une.\n@c0@"
  it: "@a@b*: Echex, ti dico che è qui da qualche parte! Avevo appena contato i pezzi, e c'erano tutti. Ora, però, ne manca uno! Non può essere sparito nel nulla, no?\n@c0@"
  ja: "@a@b＊「さいきん　兵士たちの間で\n\tチェスが　すごく\n\tはやってるんだけど……\n@c0@"
459:
  de: "@aOttmar@bWas mach ich denn jetzt nur? Wenn ich net mehr alle Figuren hab, kann ich doch kein Monsterschach mehr spielen!\n@c0@"
  en: "@aThruppence@bWhat am I going to do? You can't play monster chess without all the pieces!\n@c0@"
  es: "@aAle Atorio@b¿Qué voy a hacer? ¡No se puede jugar a monstriajedrez si no se tienen todas las piezas!\n@c0@"
  fr: "@aVirtus@bQu'est-ce qu'on va faireⓡ On ne peut pas jouer aux échecs monstrueux s'il n'y a pas toutes les piècesⓠ\n@c0@"
  it: "@aEchex@bSarà anche come dici tu, ma il problema rimane: qui manca un pezzo! E adesso come facciamo a giocare agli scacchi dei mostri?!\n@c0@"
  ja: "@a@b＊「みんな　夢中になっちゃって\n\t仕事に身が入らないみたいよ。\n\t大丈夫かしら？\n@c0@"
460:
  de: "@a@bDa ist ein kleiner, schleimförmiger Stein auf dem Boden. Ottmar Bescheid sagen?\n@c0@"
  en: "@a@bThere's a small, slime-shaped stone on the floor.\r\nLet Thruppence know?\n@c0@"
  es: "@a@bEn el suelo hay una pequeña piedra con forma de limo.\r\n¿Decírselo a Ale Atorio?\n@c0@"
  fr: "@a@bIl y a une pièce en forme de gluant par terre.\nLe dire à Virtusⓡ\n@c0@"
  it: "@a@bSul pavimento c'è una piccola pietra a forma di Slime.\nVuoi dirlo a Echex?\n@c0@"
  ja: "@a@bパピン「おや？　おかしいな…\n\tさっきまで　全部あったはずなのに\n\tチェスのコマが　たりないぞ？\n@c0@"
461:
  de: "@aOttmar@bDa ist sie ja! Ihr habt sie für mich gefunden.\n@c0@"
  en: "@aThruppence@bThere it is! You found it for me.\n@c0@"
  es: "@aAle Atorio@b¡Ahí está! La %H0860%Xhas%Yhabéis%Z encontrado.\n@c0@"
  fr: "@aVirtus@bAhⓠ Vous l'avez trouvée.\n@c0@"
  it: "@aEchex@bEcco il pezzo mancante!\nGrazie per averlo trovato!\n@c0@"
  ja: "@a@bパピン「ああっ！\n\tコマがないと……！\n\tどこへ　いっちゃったのかな？\n@c0@"
462:
  de: "@aOttmar@b... Moment mal...\n@c0@"
  en: "@aThruppence@b...Just a minute...\n@c0@"
  es: "@aAle Atorio@bUn momento...\n@c0@"
  fr: "@aVirtus@b... Attendez...\n@c0@"
  it: "@aEchex@bEhi?!\nMa cosa mi è successo?!\n@c0@"
  ja: "@a@bスライムのような形の\nちいさな石が　おちている。\nパピンに　知らせますか？\n@c0@"
463:
  de: "@aOttmar@bJetzt schau ich grad zum ersten Mal seit Ewigkeiten von meinem Schachspiel hoch. Ich hab an gar nichts anderes mehr denken können als Monsterschach.\n@c0@"
  en: "@aThruppence@bThat's the first time I've looked up from my board in ages. I haven't been thinking about anything other than monster chess.\n@c0@"
  es: "@aAle Atorio@bEs la primera vez que levanto los ojos del tablero desde hace un siglo. Llevo mucho tiempo sin pensar en nada más que en el monstriajedrez.\n@c0@"
  fr: "@aVirtus@bC'est la première fois depuis longtemps que je lève les yeux de mon échiquier. Je n'arrive pas à penser à autre chose qu'à ce jeu.\n@c0@"
  it: "@aEchex@bNon ricordo nemmeno da quanto tempo non levavo lo sguardo dalla scacchiera! Era un pezzo che non pensavo ad altro che agli scacchi dei mostri.\n@c0@"
  ja: "@a@bパピン「そ　それは\n\tモンスターチェスのコマ！\n\t見つけてくれたんだねっ。\n@c0@"
464:
  de: "@aOttmar@bDas ist komisch, wisst Ihr. Wenn man erst mal angefangen hat, kann man gar net mehr aufhör'n.\n@c0@"
  en: "@aThruppence@bIt's funny, you know. Once you start, you just\r\ncan't stop.\n@c0@"
  es: "@aAle Atorio@bEs curioso, %H0860%X¿sabes?%Y¿sabéis?%Z Cuando empiezas, no hay forma de parar.\n@c0@"
  fr: "@aVirtus@bC'est bizarre. Une fois que vous commencez\r\nà y jouer, vous n'arrivez plus à vous arrêter.\n@c0@"
  it: "@aEchex@bGli scacchi dei mostri sono una trappola.\nDivertentissima e meravigliosa, ma pur sempre una trappola: se inizi a giocare, non smetti più.\n@c0@"
  ja: "@a@bパピン「……　……。\n\tでも　ちょっと　待ってくれ……。\n@c0@"
465:
  de: "@aOttmar@bDen anderen Soldaten geht's genauso. Es ist so schlimm geworden, dass sie ihre Pflichten vernachlässigen.\n@c0@"
  en: "@aThruppence@bAll the other soldiers are the same.\nIt's got so bad, they're neglecting their duties.\n@c0@"
  es: "@aAle Atorio@bA los otros soldados les pasa lo mismo.\r\nHa llegado al punto de que están descuidando sus obligaciones.\n@c0@"
  fr: "@aVirtus@bC'est pareil pour tous les autres soldats.\r\nC'en est arrivé à un point tel qu'ils font leur travail par-dessus la jambe.\n@c0@"
  it: "@aEchex@bTutti noi soldati ne siamo letteralmente stregati.\nDedichiamo talmente tanto tempo agli scacchi che abbiamo dimenticato quali sono i nostri compiti...\n@c0@"
  ja: "@a@bパピン「じつは　このチェスを\n\tやりはじめてから　どうも\n\tおかしな気がして……。\n@c0@"
466:
  de: "@aOttmar@bErst als ich die Figur verloren hatte, hab ich wieder gesehen, was um mich herum vor sich geht.\n@c0@"
  en: "@aThruppence@bIt was only when I lost this piece that I finally snapped out of it.\n@c0@"
  es: "@aAle Atorio@bHe tenido que perder esta pieza para poder desengancharme.\n@c0@"
  fr: "@aVirtus@bC'est quand j'ai perdu cette pièce que j'ai finalement réussi à m'en détacher.\n@c0@"
  it: "@aEchex@bPossibile che mi sia reso conto della gravità della situazione solo dopo aver perso un pezzo degli scacchi?!\n@c0@"
  ja: "@a@bパピン「自分でも　どうしてか\n\t分からないけど　やりはじめると\n\tとまらないんだ。\n@c0@"
467:
  de: "@aOttmar@bIch glaube, ich sollte es wegpacken. Dürft' ich Euch bitten, es mir abzunehmen? Ihr würdet mir damit einen G'fallen tun.\n@c0@"
  en: "@aThruppence@bI think it's time I packed it in. I couldn't ask you\r\nto take it off my hands, could I? You'd be doing\r\nme a favour.\n@c0@"
  es: "@aAle Atorio@bCreo que ha llegado el momento de guardarlo. ¿%H0860%XSerías tan amable%YSeríais tan amables%Z de quitarlo de mi vista? Me %H0860%Xharías%Yharíais%Z un favor.\n@c0@"
