  es: "@aSancho@b¿Es grave, hermana?\r\n¿Está muy enfermita?\n@c0@"
  fr: "@aSancho@bC-C'est grave, ma Sœurⓡ Elle est t-très maladeⓡ\n@c0@"
  it: "@aSancho@b¿Davvero, sorella?\n¿Es muy malata?\n@c0@"
  ja: "@a@bシスター「聞けば　山の上の村でも\n\t一度　たおれたというし……。\n@c0@"
308:
  de: "@aSchwester@bKrank? So würd' ich es net nennen.\n@c0@"
  en: "@aSister@bSick? I don't think you could call it sick.\n@c0@"
  es: "@aHermana@b¿Enferma? No creo que se le pueda llamar enfermedad.\n@c0@"
  fr: "@aReligieuse@bMaladeⓡ On ne peut pas appeler ça une maladie.\n@c0@"
  it: "@aSuora@bMalata? Oh, no!\nNon direi proprio che la nostra giovane amica soffra di qualche malattia...\n@c0@"
  ja: "@a@bシスター「もしものことが　あったら\n\tどうなさる　おつもり\n\tだったのかしら。\n@c0@"
309:
  de: "@aSchwester@bNet etwas so Schönes wie ihren Zustand.\n@c0@"
  en: "@aSister@bNot something as wonderful as this.\n@c0@"
  es: "@aHermana@bMás bien es algo maravilloso.\n@c0@"
  fr: "@aReligieuse@bPas quelque chose d'aussi merveilleux.\n@c0@"
  it: "@aSuora@bIl suo malore è il sintomo di qualcosa di meraviglioso...\n@c0@"
  ja: "@a@bサンチョ「そ　そんなに\n\tひどいのですか　シスター？\n@c0@"
310:
  de: "@aSancho@bQué?\n@c0@"
  en: "@aSancho@bQué?\n@c0@"
  es: "@aSancho@b¿Qué?\n@c0@"
  fr: "@aSancho@bQuéⓡ\n@c0@"
  it: "@aSancho@bNo entiendo...\n@c0@"
  ja: "@a@bシスター「ひどいも　なにも……。\n@c0@"
311:
  de: "@aSchwester@bGlückwunsch, %a000090.\nBald werdet Ihr Vater werden. Freut Ihr Euch schon?\n@c0@"
  en: "@aSister@bCongratulations, %a000090.\nAre you ready to be a father?\n@c0@"
  es: "@aHermana@b¡Enhorabuena, %a000090!\nPronto vas a ser padre. Menuda sorpresa, ¿eh?\n@c0@"
  fr: "@aReligieuse@bFélicitations, %a000090. Vous serez bientôt papa.\nVous saisissezⓡ\n@c0@"
  it: "@aSuora@bCongratulazioni, %a000090.\nPresto diventerai padre!\nSei felice, non è vero?\n@c0@"
  ja: "@a@bシスター「おめでたです。\n@c0@"
312:
  de: "@aSchwester@bJa. Eure Frau ist guter Hoffnung. Ihr fehlt gar nichts. Sie braucht nur Ruhe.\n@c0@"
  en: "@aSister@bYes. Your wife is with child. There's absolutely nothing wrong with her. She just needs rest.\n@c0@"
  es: "@aHermana@bSí. Tu esposa está en estado de buena esperanza. No le pasa absolutamente nada. Solo necesita descansar.\n@c0@"
  fr: "@aReligieuse@bEh oui. Votre femme est enceinte. Elle n'a aucun problème de santé. Elle a juste besoin de repos.\n@c0@"
  it: "@aSuora@bTua moglie è incinta.\nSta benissimo, ma ha bisogno di molto riposo.\n@c0@"
  ja: "@a@bサンチョ「へっ？\n@c0@"
313:
  de: "@aSchwester@bNoch ist kaum etwas zu sehen, aber nach dem, was sie mir erzählt hat, ist sie bereits recht weit.\n@c0@"
  en: "@aSister@bShe's hardly showing at all yet, but according to what she's told me, I'd say she's already quite well progressed.\n@c0@"
  es: "@aHermana@bApenas se le nota aún pero, por lo que me ha contado, yo diría que el embarazo está bastante avanzado.\n@c0@"
  fr: "@aReligieuse@bCela ne se voit pas encore, mais d'après ce qu'elle m'a dit, sa grossesse est déjà bien avancée.\n@c0@"
  it: "@aSuora@bInizialmente non ce n'eravamo resi conto perché la ragazza non ha ancora il pancione, ma credo che presto la sua gravidanza diventerà ben visibile.\n@c0@"
  ja: "@a@bシスター「おめでとうございます。\n\t%a000090さまは　もうすぐ\n\tお父さまに　なられますよ。\n@c0@"
314:
  de: "@aSancho@bDas ist ja herrliss!\n@c0@"
  en: "@aSancho@bThees ees wonderful!\n@c0@"
  es: "@aSancho@b¡Eso es padrísimo!\n@c0@"
  fr: "@aSancho@bC-C'est magnificoⓠ\n@c0@"
  it: "@aSancho@b¡Ma esta es una noticia esplendida!\n@c0@"
  ja: "@a@bシスター「そう……。\n\tビアンカさんの　お腹の中に\n\t赤ちゃんが　いるのです。\n@c0@"
315:
