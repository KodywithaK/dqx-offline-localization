  en: "@aSancho@bA bebé! My friend's bebé! You and Bianca...\r\nSí, eet weell be esuch a beautiful child.\n@c0@"
  es: "@aSancho@b¡Un bebito! ¡El bebe de mi chamaquito! Tú y Bianca...\r\nPues será un muchacho retecuero.\n@c0@"
  fr: "@aSancho@bOun bébéⓠ Oun bébé de mon ch-chicoⓠ Toi et Bianca... Si, ce sera oun beau bébé.\n@c0@"
  it: "@aSancho@b¡El mi chico está por diventare padre!\nTu y Bianca avrete un figlio...\r\n¡Soy seguro que sarà un niño bellissimo!\n@c0@"
  ja: "@a@bシスター「あまり　お腹が\n\t目立ちませんが　聞けば\n\tかなり　育っているようですね。\n@c0@"
316:
  de: "@aSchwester@bNun, ich lasse Euch jetzt allein. Passt auf Euch auf. Und denkt daran, dass Eure Frau jetzt guter Hoffnung ist.\n@c0@"
  en: "@aSister@bWell, I'll leave you alone now. Take care. And remember, your wife is in a delicate state now.\n@c0@"
  es: "@aHermana@bBueno, ahora me voy a retirar. Cuidaos. Y recuerda que el estado de tu esposa es delicado.\n@c0@"
  fr: "@aReligieuse@bEh bien, je vais vous laisser. À bientôt. N'oubliez pas que vous ne devez pas brusquer votre femme.\n@c0@"
  it: "@aSuora@bVi lascio soli. Abbi cura di tua moglie, adesso più che mai. La gravidanza richiede attenzioni, comprensione e tanto, tanto riposo.\n@c0@"
  ja: "@a@bサンチョ「こいつは　めでたい！\n@c0@"
317:
