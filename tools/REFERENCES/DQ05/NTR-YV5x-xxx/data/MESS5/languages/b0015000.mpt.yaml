  en: "@aBianca@bNope, I'll stay here and rest, and be sure to give you a nice, healthy baby at the end of it all.\n@c0@"
  es: "@aBianca@bNo, me quedaré descansando y procurando que el niño nazca fuerte y sano.\n@c0@"
  fr: "@aBianca@bNon, je vais rester ici et me reposer pour te donner un joli bébé.\n@c0@"
  it: "@aBianca@bResterò qui e mi riposerò e, quando verrà il momento, darò alla luce un bambino bellissimo.\nAvrà i tuoi occhi, ne sono convinta!\n@c0@"
  ja: "@a@bビアンカ「そうかなって　思ってたけど\n\t言ったら　%a000090は　私のために\n\t旅を　やめちゃうような気がして。\n@c0@"
322:
  de: "@aBianca@bIch liebe dich, %a000090.\n@c0@"
  en: "@aBianca@bI love you, %a000090.\n@c0@"
  es: "@aBianca@bTe quiero, %a000090.\n@c0@"
  fr: "@aBianca@bJe t'aime, %a000090.\n@c0@"
  it: "@aBianca@bTi amo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「でも　もう\n\tいっしょに　旅をしたいなんて\n\tわがままを　言わないわ。\n@c0@"
323:
