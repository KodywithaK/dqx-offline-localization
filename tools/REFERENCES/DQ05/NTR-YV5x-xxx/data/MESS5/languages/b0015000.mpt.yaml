  ja: "@a@bデボラ「まあ　バレたら\n\tしかたないわね。\n@c0@"
592:
  de: "@aGriselda@bOh, du bist ja wach. Ich mag diese Burgbetten. Ja, ich habe so ein Bett verdient. Du musst mir unbedingt eins kaufen.\n@c0@"
