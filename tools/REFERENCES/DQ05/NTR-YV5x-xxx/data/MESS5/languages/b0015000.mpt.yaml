99:
  de: "@a@b*: Dann müsst Ihr ja einen Blick auf die Burg erhascht haben.\n@c0@"
  en: "@a@b*: Then you must've got a view from there of\r\nthe castle.\n@c0@"
  es: "@a@b*: Entonces %H0860%Xhabrás%Yhabréis%Z podido ver el castillo desde allí.\n@c0@"
  fr: "@a@b*ⓢ Alors vous avez dû admirer cette vue magnifique sur le château.\n@c0@"
  it: "@a@b*: Allora %H0860%Xavrai%Yavrete%Z certamente goduto della vista panoramica sul castello!\n@c0@"
  ja: "@a@b＊「昔はのう　怪物なぞ　でなくて\n\t誰でも　カンタンに\n\tこの村まで　来られたものじゃ。\n@c0@"
100:
  de: "@a@b*: Das ist das Königreich Humburg.\nRecht beeindruckend, nicht?\n@c0@"
  en: "@a@b*: That's the Kingdom of Gotha.\r\nPretty impressive, isn't it?\n@c0@"
  es: "@a@b*: Eso es el reino de Pankraz.\r\nImpresionante, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ C'est le royaume de Gotha.\nImpressionnant, n'est-ce pasⓡ\n@c0@"
  it: "@a@b*: Quello è il cuore del Regno di Denim.\nÈ davvero spettacolare...\n@c0@"
  ja: "@a@b＊「もう　橋を渡りましたか？\n@c0@"
101:
  de: "@a@b*: Wenn Ihr die Brücke überquert und durch die Höhle nach unten geht, gelangt Ihr schließlich zum Königreich Humburg.\n@c0@"
  en: "@a@b*: If you cross the bridge and descend down through the cave, you'll eventually come to the Kingdom of Gotha.\n@c0@"
  es: "@a@b*: Si se cruza el puente y se baja a través de la cueva se acaba llegando al reino de Pankraz.\n@c0@"
  fr: "@a@b*ⓢ Si vous franchissez le pont et que vous passez les grottes, vous parviendrez au royaume de Gotha.\n@c0@"
  it: "@a@b*: Una volta superato il ponte e attraversata una grotta, si arriva nel territorio del Regno di Denim.\n@c0@"
  ja: "@a@b＊「橋の上から\n\tお城が　見えたでしょう。\n@c0@"
102:
  de: "@a@b*: Oh nein! Das gibt bestimmt Ärger! Ich hab den Kompass zerbrochen, den mir meine Oma gemacht hat.\n@c0@"
  en: "@a@b*: Uh-oh! I'm in a lot of trouble now. I broke the compass that my granny made for me.\n@c0@"
  es: "@a@b*: ¡Oh, oh! Me he metido en un buen lío. He roto la brújula que me hizo mi abuela.\n@c0@"
  fr: "@a@b*ⓢ Oh ohⓠ Je suis dans de sales draps. J'ai cassé la boussole que ma mamie m'avait fabriquée.\n@c0@"
  it: "@a@b*: Oh-oh! Accidenti, ho combinato un bel guaio!\nHo rotto la bussola che mia nonna mi aveva costruito...\n@c0@"
  ja: "@a@b＊「あの城が\n\tグランバニアの　お城ですよ。\n@c0@"
103:
  de: "@a@b*: Dafür werd' ich mir wahrscheinlich 'ne stunden-\nlange Standpauke anhören dürfen! Menno! Müsst'\nich bloß nicht nach Hause gehen und es ihr sagen!\n@c0@"
  en: "@a@b*: She'll probably give me a right earful for this!\nOh! I don't want to go home and face her!\n@c0@"
  es: "@a@b*: ¡Seguro que me da un capón por esto!\r\n¡Oh! ¡No quiero volver a casa y encontrarme con ella!\n@c0@"
  fr: "@a@b*ⓢ Elle va me tailler les oreilles en pointeⓠ\nJe veux pas rentrer à la maisonⓠ\n@c0@"
  it: "@a@b*: So già che si arrabbierà a morte con me.\nNon ho nessuna voglia di tornare a casa e sorbirmi la sua ramanzina...\n@c0@"
  ja: "@a@b＊「橋を渡って\n\t洞くつを　下に　おりると\n\tグランバニアの国ですよ。\n@c0@"
104:
  de: "@a@b*: Miau.\n@c0@"
  en: "@a@b*: Meow.\n@c0@"
  es: "@a@b*: Miau.\n@c0@"
  fr: "@a@b*ⓢ Miaou.\n@c0@"
  it: "@a@b*: Miao...\n@c0@"
  ja: "@a@b＊「うわ～っ　やばいっ！\n\tばあちゃんに　作ってもらった\n\tコンパス　こわれちゃったよ！\n@c0@"
105:
  de: "@a@b*: Dieser kleine Bursche bringt mich noch ins Grab. Er will einfach nichts essen.\n@c0@"
  en: "@a@b*: This little boy will be the death of me.\r\nHe won't eat a bite.\n@c0@"
  es: "@a@b*: Este chiquillo va a acabar conmigo.\r\nNo me come nada.\n@c0@"
  fr: "@a@b*ⓢ Ce gamin va finir par avoir ma peau.\nIl ne veut rien manger.\n@c0@"
  it: "@a@b*: Questo bambino mi manderà al manicomio!\nNon vuole proprio saperne di mangiare!\n@c0@"
  ja: "@a@b＊「叱られちゃうなあ……\n\tあ～　どうしよう！！\n@c0@"
106:
  de: "@a@b*: Und das nach all der Mühe, die ich mir gegeben hab. Ich hab ihm extra eine Suppe gekocht, um die Möhren zu tarnen, die er angeblich nicht ausstehen kann!\n@c0@"
  en: "@a@b*: And after all the effort I went to, making\r\na soup to disguise the carrots he says he hates so much!\n@c0@"
  es: "@a@b*: ¡Y mira que me he esforzado para hacer puré y disimular las zanahorias que tanto odia!\n@c0@"
  fr: "@a@b*ⓢ Je me suis donné du mal pour faire cette soupe.\nIl fallait cacher le goût des carottes, parce qu'il dit qu'il déteste çaⓠ\n@c0@"
  it: "@a@b*: Avevo impiegato ore per nascondergli le carote nella zuppa! %H0860%XSai%YSapete%Z, a lui le carote proprio non piacciono...\n@c0@"
  ja: "@a@b＊「ニャーゴ。\n@c0@"
107:
  de: "@a@b*: Jetzt komm schon! Wenn du deinen Teller nicht leer isst, kommen dich die Ungeheuer holen, genau wie die arme Königin von Humburg!\n@c0@"
  en: "@a@b*: Come on now! If you don't eat it all up, you'll be kidnapped by monsters just like the poor Queen of Gotha!\n@c0@"
  es: "@a@b*: ¡Venga! ¡Si no te lo comes todo, te secuestrarán los monstruos como a la pobre reina de Pankraz!\n@c0@"
  fr: "@a@b*ⓢ Allezⓠ Si tu ne finis pas tout, les monstres vont venir te chercher, comme la pauvre reine de Gothaⓠ\n@c0@"
  it: "@a@b*: Avanti, su... Apri la boccuccia... Se non mangi la tua zuppa, arriveranno i mostri e ti porteranno via, proprio come fecero con la povera Regina di Denim!\n@c0@"
  ja: "@a@b＊「もう　この子ったら\n\tちっとも　食べないんですよ。\n@c0@"
108:
  de: "@a@b*: Bäh, ich mag keine Möhren!\n@c0@"
  en: "@a@b*: Urgh. I hate carrots!\n@c0@"
  es: "@a@b*: ¡Argh! ¡Odio las zanahorias!\n@c0@"
  fr: "@a@b*ⓢ Beurk. Je déteste les carottesⓠ\n@c0@"
  it: "@a@b*: Bleah!\nIo odio le carote!\n@c0@"
  ja: "@a@b＊「きらいな小魚を\n\t食べやすいように　フライに\n\tしてあげたのに……。\n@c0@"
109:
  de: "@a@b*: Frauen haben hier oben in den Bergen kein einfaches Leben.\n@c0@"
  en: "@a@b*: It's not easy for a woman living up in the mountains like this.\n@c0@"
  es: "@a@b*: No es fácil para una mujer vivir en las montañas.\n@c0@"
  fr: "@a@b*ⓢ Ce n'est pas facile pour une femme d'habiter ces montagnes.\n@c0@"
  it: "@a@b*: Non è facile per una donna vivere su queste montagne...\n@c0@"
  ja: "@a@b＊「ほらほら　身体にいいんだから\n\tきちんと　食べなさい！\n@c0@"
110:
  de: "@a@b*: Vielleicht sind die Männer hier droben deswegen so gut zu uns! Ha ha ha!\n@c0@"
  en: "@a@b*: Maybe that's why the menfolk here are so good to us all! Ha ha!\n@c0@"
  es: "@a@b*: ¡Quizá por eso los hombres de aquí son tan buenos con nosotras! ¡Ja, ja!\n@c0@"
  fr: "@a@b*ⓢ C'est peut-être pour ça que les hommes du coin sont si gentils avec nousⓠ Ha haⓠ\n@c0@"
  it: "@a@b*: Forse è per questo motivo che i nostri uomini ci rispettano tanto...\nPerché siamo più forti di loro! Hah!\n@c0@"
  ja: "@a@b＊「うえーん\n\t小魚は　ちくちくして　イヤだー。\n@c0@"
111:
  de: "@a@b*: Ihr seid verheiratet, nicht wahr? Das sehe ich doch sofort. Ihr beide passt wirklich gut zueinander.\n@c0@"
  en: "@a@b*: You're married, aren't you? You can tell straight off. You really suit each other.\n@c0@"
  es: "@a@b*: Estáis casados, ¿verdad? Se nota enseguida. Sois el uno para el otro.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes mariés, nonⓡ Ça se voit au premier coup d'œil. Vous allez si bien ensemble.\n@c0@"
  it: "@a@b*: Voi due siete marito e moglie, non è vero?\nCi avrei giurato!\nSembrate fatti l'uno per l'altra.\n@c0@"
  ja: "@a@b＊「山で暮らすのって　女には\n\tけっして　楽じゃないのよ。\n@c0@"
112:
  de: "@a@b*: Das Leben in den Bergen ist nicht leicht für eine Frau, aber ich schätze, Eure Angetraute würde damit fertigwerden.\n@c0@"
  en: "@a@b*: Living in the mountains isn't easy on\r\na woman, but I reckon your wife would be\r\njust fine.\n@c0@"
  es: "@a@b*: Vivir en las montañas no es fácil para una mujer, pero me da la sensación de que tu esposa se adaptaría bien.\n@c0@"
  fr: "@a@b*ⓢ Ce n'est pas facile pour une femme de vivre dans les montagnes, mais je pense que votre femme n'aurait pas de problème.\n@c0@"
  it: "@a@b*: Vivere tra i monti non è facile per una donna, ma sono certa che tua moglie se la caverebbe benissimo.\n@c0@"
  ja: "@a@b＊「だから　ここに住む男の人は\n\t女の人に　親切なの。\n\tうふふ。\n@c0@"
113:
  de: "@a@b*: Sie gehört zu denen, die mit dem Mann, den sie lieben, durch Dick und Dünn gehen würden, stimmt's?\n@c0@"
  en: "@a@b*: She's the sort who'd go anywhere for the man she loved, right?\n@c0@"
  es: "@a@b*: Es del tipo de personas que irían a cualquier lugar por el hombre al que aman, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Je suis sûre qu'elle serait capable de suivre partout l'homme qu'elle aime.\n@c0@"
  it: "@a@b*: Si vede che ha carattere!\nScommetto che farebbe di tutto per restare accanto al suo uomo.\n@c0@"
  ja: "@a@b＊「あなたたち　夫婦でしょ？\n\tお似合いだもん\n\tひと目で　わかったわ。\n@c0@"
114:
  de: "@a@b*: Das solltet Ihr besser nicht für selbstverständlich halten. Gebt gut auf sie acht, hört Ihr?\n@c0@"
  en: "@a@b*: Then you'd better not take her for granted.\nTake good care of her, won't you?\n@c0@"
  es: "@a@b*: Entonces será mejor que la valores.\r\nCuida bien de ella, ¿de acuerdo?\n@c0@"
  fr: "@a@b*ⓢ Alors faites attention. Ne lui en demandez pas trop et prenez soin d'elle, entenduⓡ\n@c0@"
  it: "@a@b*: Cerca di non dimenticare che l'amore va conquistato e mantenuto giorno dopo giorno...\nNon trascurare mai la tua dolce metà.\n@c0@"
  ja: "@a@b＊「山で暮らすのって　女には\n\t楽じゃないんだけど　あなたの\n\t奥さんなら　大丈夫そうね。\n@c0@"
115:
  de: "@a@b*: Ihr seid doch verheiratet, nicht wahr?\nSo eine Heirat kann auch ihre Tücken haben.\n@c0@"
  en: "@a@b*: You're married, aren't you?\nMarriage can be a tricky old business.\n@c0@"
  es: "@a@b*: Estáis casados, ¿verdad? El matrimonio es un asunto complicado.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes mariés, c'est çaⓡ Ça n'est pas toujours simple, le mariage, vous savez.\n@c0@"
  it: "@a@b*: Siete sposati, non è vero?\nIl matrimonio è uno dei pochi eventi che ti cambia davvero l'esistenza...\n@c0@"
  ja: "@a@b＊「好きな人の　ためなら\n\tどこまでも　ついて来てくれる\n\tタイプでしょ？\n@c0@"
116:
  de: "@a@b*: Das Leben kann sich von einem Moment auf den anderen komplett umkrempeln, je nachdem, wem man das Jawort gibt.\n@c0@"
  en: "@a@b*: Your life can change unbelievably depending on who you decide to tie the knot with.\n@c0@"
  es: "@a@b*: Tu vida puede cambiar radicalmente según con quién te cases.\n@c0@"
  fr: "@a@b*ⓢ Votre vie peut changer du tout au tout selon la personne que vous décidez d'épouser.\n@c0@"
  it: "@a@b*: E questo è vero soprattutto per noi donne!\nLa nostra vita cambia radicalmente dopo le nozze.\n㈡\n*: Può cambiare in meglio, oppure in peggio.\nTutto dipende da chi ci siamo scelte per marito...\n@c0@"
  ja: "@a@b＊「ステキな奥さんを\n\t大切に　してあげてね。\n@c0@"
117:
  de: "@a@b*: Aber der stärkere Partner in dieser Beziehung spürt das wohl nicht so sehr.\n@c0@"
  en: "@a@b*: I suppose the strong person in the relationship doesn't feel it quite so much, though.\n@c0@"
  es: "@a@b*: Aunque supongo que quien lleva las riendas de la relación no lo nota tanto.\n@c0@"
  fr: "@a@b*ⓢ Mais je crois que dans un couple, la personne la plus solide des deux ne le ressent pas tellement.\n@c0@"
  it: "@a@b*: Gli uomini, invece, non cambiano mai...\n@c0@"
  ja: "@a@b＊「あなたたち　夫婦でしょ？\n\tでも　つくづく\n\t結婚って　大変よね。\n@c0@"
118:
  de: "@a@b*: Es ist gemeinhin der Schwächere der beiden, den bisweilen Zweifel oder Sorgen plagen.\n@c0@"
  en: "@a@b*: It's the weaker one of the two who tends to find they experience the odd doubt or worry every now and then.\n@c0@"
  es: "@a@b*: Es la otra persona la que de vez en cuando tiene sus dudas.\n@c0@"
  fr: "@a@b*ⓢ C'est plutôt celui des deux qui est le plus fragile qui est parfois en proie à des doutes ou des inquiétudes de temps à autre.\n@c0@"
  it: "@a@b*: Forse è per questo motivo che le donne tengono al matrimonio più di quanto non facciano i maschietti...\n@c0@"
  ja: "@a@b＊「どんな人と結婚するかで\n\t自分の人生が\n\t変わっちゃうけど……\n@c0@"
119:
  de: "@a@b*: Seht auf jeden Fall zu, dass es Eurer Frau bei Euch immer gut geht.\n@c0@"
  en: "@a@b*: You should make sure you take good care of your wife, anyway.\n@c0@"
  es: "@a@b*: En fin, lo importante es que cuides bien de tu mujer.\n@c0@"
  fr: "@a@b*ⓢ Quoi qu'il en soit, vous devez prendre bien soin de votre femme.\n@c0@"
  it: "@a@b*: Lo vuoi un consiglio?\nAbbi sempre cura di tua moglie.\nAmala e rispettala ogni giorno della tua vita.\n@c0@"
  ja: "@a@b＊「主導権をもつほうは　誰と結婚しても\n\tそんなには　自分の人生は\n\t変わらないでしょ。\n@c0@"
120:
  de: "@a@b*: Ts, ts, ts!\n@c0@"
  en: "@a@b*: Tsk, tsk, tsk!\n@c0@"
  es: "@a@b*: ¡Vaya, vaya!\n@c0@"
  fr: "@a@b*ⓢ Tsss, tsssⓠ\n@c0@"
  it: "@a@b*: Ma come si fa, eh?!\nCome si fa?!\n@c0@"
  ja: "@a@b＊「だから　結婚については\n\tついていく人のほうが\n\tあれこれ　なやむものなのよ。\n@c0@"
121:
  de: "@a@b*: Einen der kostbaren Bussolinger Kompasse zu verlieren! Also, manchmal frage ich mich, womit ich das verdient habe.\n@c0@"
  en: "@a@b*: Fancy losing a precious Batten binnacle!\r\nI despair sometimes.\n@c0@"
  es: "@a@b*: ¡%H0860%XImagina%YImaginad%Z, perder una valiosa bitácora de Habs!\nA veces me desespero.\n@c0@"
  fr: "@a@b*ⓢ Perdre une boussole de Técarloⓠ\nJe ne sais plus quoi faire de lui.\n@c0@"
  it: "@a@b*: Come si fa a perdere una preziosissima bussola delle nevi?! Bisogna proprio avere il vuoto pneumatico nella capoccia, per farla tanto grossa!\n@c0@"
  ja: "@a@b＊「というわけで\n\t奥さんを　大切にしてあげてね。\n@c0@"
122:
  de: "@a@b*: Hm? Ach, Ihr seid doch der Idiot, der seine Frau bis an den Rand des Zusammenbruchs getrieben hat, nicht wahr?\n@c0@"
  en: "@a@b*: Hm? Oh, you're the fool who pushed his wife to the point of collapse, aren't you?\n@c0@"
  es: "@a@b*: ¿Mmm? Tú eres el idiota que puso a su mujer al borde del colapso, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Oh, c'est vous l'idiot qui a poussé sa femme à bout de forceⓡ\n@c0@"
  it: "@a@b*: Ah! Se non mi hanno detto una sciocchezza, tu sei l'intelligentone che ha fatto stancare la moglie fino a portarla sull'orlo del collasso!\n@c0@"
  ja: "@a@b＊「うと　うと……。\n@c0@"
123:
  de: "@a@b*: Ihr habt Euch wohl in den Bergen verlaufen und habt sie bis zur Erschöpfung weitergescheucht, hm? Dann nehmt Ihr besser das hier.\n@c0@"
  en: "@a@b*: I suppose you lost your way in the mountains and wore her out, eh? You'd better have this.\n@c0@"
  es: "@a@b*: Supongo que te perdiste en las montañas y la agotaste, ¿no? Será mejor que lleves esto.\n@c0@"
  fr: "@a@b*ⓢ J'imagine que vous vous êtes perdus dans les montagnes et qu'elle s'est épuiséeⓡ\nAlors tenez, ça peut vous être utile.\n@c0@"
  it: "@a@b*: Voglio sperare che ti fossi perso, e che non l'abbia sfiancata di proposito... Tutto sommato, non mi sembri una cattiva persona. Ecco, prendi.\n@c0@"
  ja: "@a@b＊「チゾットのコンパス……\n\tなくすんでねえぞ。\n\tぐう　ぐう……。\n@c0@"
124:
  de: "@a@b%0%a000120 erhält einen Bussolinger Kompass!\n@c0@"
  en: "@a@b%0%a000120 receives a Batten binnacle!\n@c0@"
  es: "@a@b¡%0%a000120 recibe una bitácora de Habs!\n@c0@"
  fr: "@a@b%0%a000120 reçoit une boussole de Técarloⓠ\n@c0@"
  it: "@a@b%0%a000120 ha ricevuto una bussola delle nevi!\n@c0@"
  ja: "@a@b＊「ん？　おめえは　ヨメっこ\n\t倒れさせた　バカモノでねえけえ。\n@c0@"
125:
  de: "@a@b%0%a000180 steckt den Bussolinger Kompass ein!\n@c0@"
  en: "@a@b%0%a000180 acquires a Batten binnacle!\n@c0@"
  es: "@a@b¡%0%a000180 obtiene una bitácora de Habs!\n@c0@"
  fr: "@a@b%0%a000180 récupère la boussole de Técarloⓠ\n@c0@"
  it: "@a@b%0%a000180 prende la bussola delle nevi!\n@c0@"
  ja: "@a@b＊「ムダに　山道　歩きまわって\n\tつかれさせたんだろ。\n\t……これ　持ってけや。\n@c0@"
126:
  de: "@a@b*: Damit findet Ihr Euch in Zukunft hoffentlich besser zurecht. Gebt gut auf Eure Frau acht.\n@c0@"
  en: "@a@b*: That should help you find your way better in future. Take care of that wife of yours.\n@c0@"
  es: "@a@b*: Te ayudará a encontrar tu camino en el futuro. Cuida bien de tu mujer.\n@c0@"
  fr: "@a@b*ⓢ Comme ça, vous saurez retrouver votre chemin la prochaine fois. Et prenez soin de votre femme, maintenant.\n@c0@"
  it: "@a@b*: Questa bussola ti aiuterà a non perdere l'orientamento in futuro. E mi raccomando: abbi a cuore la salute di tua moglie.\n@c0@"
  ja: "@a@b%a000120は　チゾットのコンパスを\n受けとった！\n@c0@"
127:
  de: "@a@b*: Ts, ts, ts!\n@c0@"
  en: "@a@b*: Tsk, tsk, tsk!\n@c0@"
  es: "@a@b*: ¡Vaya, vaya!\n@c0@"
  fr: "@a@b*ⓢ Tsss, tsssⓠ\n@c0@"
  it: "@a@b*: Ma come si fa, eh?! Come si fa?!\n@c0@"
  ja: "@a@b%a000180は　チゾットのコンパスを\n手に入れた！\n@c0@"
128:
  de: "@a@b*: Einen der kostbaren Bussolinger Kompasse zu verlieren! Also, manchmal frage ich mich, womit ich das verdient habe.\n@c0@"
  en: "@a@b*: Fancy losing a precious Batten binnacle!\r\nI despair sometimes.\n@c0@"
  es: "@a@b*: ¡%H0860%XImagina%YImaginad%Z, perder una valiosa bitácora de Habs!\nA veces me desespero.\n@c0@"
  fr: "@a@b*ⓢ Perdre une boussole de Técarloⓠ\nJe ne sais plus quoi faire de lui.\n@c0@"
  it: "@a@b*: Come si fa a perdere una preziosissima bussola delle nevi! Bisogna proprio avere il vuoto pneumatico nella zucca, per farla tanto grossa!\n@c0@"
  ja: "@a@b＊「ヨメっこさ　大切にしろよ。\n@c0@"
129:
  de: "@a@b*: Der König von Humburg ist vor vielen Jahren aufgebrochen, um seine Frau zu retten, aber seither wurde keiner von ihnen mehr gesehen.\n@c0@"
  en: "@a@b*: The King of Gotha set out to rescue his wife years ago now, but there's been no sign of either of them since.\n@c0@"
  es: "@a@b*: El rey de Pankraz salió al rescate de su esposa ya hace años, pero desde entonces nadie ha sabido nada de ellos.\n@c0@"
  fr: "@a@b*ⓢ Le roi de Gotha est parti sauver sa femme il y a des années, mais nous n'avons plus entendu parler d'eux depuis.\n@c0@"
  it: "@a@b*: Diversi anni fa, il Re di Denim partì alla ricerca di sua moglie, che era sparita.\nNessuno dei due, però, ha mai fatto ritorno...\n@c0@"
  ja: "@a@b＊「うと　うと……。\n@c0@"
130:
