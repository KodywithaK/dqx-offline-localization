  de: "@aGriselda@bIch bin Griselda. %0%a000090 ist mein Mann.\nUnd das heißt natürlich, dass uns hier auch eine Vorzugsbehandlung zuteilwird, oder㈢ ni...㈢ nicht?\n@c0@"
