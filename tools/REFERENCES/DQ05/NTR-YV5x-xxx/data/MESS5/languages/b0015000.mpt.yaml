  ja: "@a@b＊「いくら　人のいい王さまでも\n\tただの通りすがりの旅の人に\n\tベッドを　貸すわけはないし……。\n@c0@"
331:
  de: "@a@b*: Seine Majestät wartet unten auf Euch. Bitte geht einfach durch.\n@c0@"
