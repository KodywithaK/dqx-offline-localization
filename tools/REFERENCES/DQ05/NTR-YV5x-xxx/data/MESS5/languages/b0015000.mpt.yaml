  it: "@aSancho@b¡Devo vedere el principe Alberto immediatamentes!\n¡Ho importanti novità da comunicare a Sua Maestà!\n@c0@"
  ja: "@a@bサンチョ「いいえ！\n\tそんなことを言っても\n\tこのサンチョには　わかります！\n@c0@"
292:
  de: "@aWache@bZu Befehl, Herr Sancho!\n@c0@"
