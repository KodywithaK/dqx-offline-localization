  it: "@aBianca@bSarebbe una cosa orribile!\nDobbiamo impedirglielo!\n@c0@"
  ja: "@a@bビアンカ「そんなことになったら\n\t大変だわ。　なんとしてでも\n\t私たちで　とめないと。\n@c0@"
65:
  de: "@a%0%a001240@bÄhm, Papa... Dieser Mann kam aus Zenithia, oder?\n@c0@"
  en: "@a%0%a001240@bUm, Dad. That man was a Zenithian, right?\n@c0@"
  es: "@a%0%a001240@bMmm, papá... Ese hombre era de Zenithia, ¿no?\n@c0@"
  fr: "@a%0%a001240@bEuh, papa. Cet homme, c'était un Zénithien, nonⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, quello era uno Zenithiano, non è vero?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\t今の人って　天空城の人だよね？\n@c0@"
66:
  de: "@a%0%a001240@bEs ist ein wenig seltsam, in Nadiria Leute aus Zenithia anzutreffen...\n@c0@"
  en: "@a%0%a001240@bIt's a bit of a surprise to see one of them in Nadiria.\n@c0@"
  es: "@a%0%a001240@bSorprende un poco ver a alguien de allí en Nadiria.\n@c0@"
  fr: "@a%0%a001240@bC'est surprenant d'en voir un à Nadiria.\n@c0@"
  it: "@a%0%a001240@bNon credevo che ci fossero Zenithiani qui a Nadiria...\nSecondo te vive qui o è solo di passaggio?\n@c0@"
  ja: "@a@b%a001240「こんな所にまでいるなんて\n\tおどろいたなあ。\n@c0@"
67:
  de: "@a%0%a001250@bEr war nicht gerade auf der Höhe. Hoffentlich geht's ihm bald wieder besser.\n@c0@"
  en: "@a%0%a001250@bHe seemed to be quite badly injured.\nI hope he's alright.\n@c0@"
  es: "@a%0%a001250@bParecía estar muy malherido.\nEspero que esté bien.\n@c0@"
  fr: "@a%0%a001250@bIl avait l'air mal en point. J'espère que ça va aller.\n@c0@"
  it: "@a%0%a001250@bPresto Nimzo sarà in grado di invadere il mondo degli uomini?!\nAh, che bella notizia...\n@c0@"
  ja: "@a@b%a001250「なんだか　ひどいケガ\n\tしてたみたい……。　平気かな。\n@c0@"
68:
  de: "@aBianca@bIhr Funke Leben wird immer schwächer? Oh nein! Wir müssen uns beeilen, %a000090!\n@c0@"
  en: "@aBianca@bHer spark of life is growin' weaker?\nOh no! We have to hurry, %a000090!\n@c0@"
  es: "@aBianca@b¿Que se está debilitando su chispa de la vida?\n¡Oh, no! ¡Hay que darse prisa, %a000090!\n@c0@"
  fr: "@aBianca@bL'étincelle de vie qui brûle en elle faiblit de jour en jourⓡ Oh nonⓠ On doit se dépêcher, %a000090ⓠ\n@c0@"
  it: "@aBianca@bLa fiamma di vita che ha sempre brillato in Mada si sta spegnendo?!\nOh, no! Dobbiamo sbrigarci, %a000090!\n@c0@"
  ja: "@a@bビアンカ「お母さまの\n\t命の　ともしびが……！？\n\t%a000090　急ぎましょ！\n@c0@"
69:
  de: "@aBianca@bIch werde den Gesichtsausdruck deiner Mutter nie vergessen, als ihre Zeit gekommen war.\n@c0@"
  en: "@aBianca@bI'll never forget that look your mum had on her face when the time come.\n@c0@"
  es: "@aBianca@bNunca olvidaré la mirada de tu madre cuando le llegó la hora, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'oublierai jamais le regard de ta maman lors de ses derniers instants.\n@c0@"
  it: "@aBianca@bNon dimenticherò mai l'espressione serena di tua madre quando è giunta la sua ora...\n@c0@"
  ja: "@a@bビアンカ「……あのときの　お母さまの顔\n\t私　一生　忘れないわ。\n@c0@"
70:
  de: "@aBianca@bAller Druck schien von ihr abzufallen, als sie deinen Vater erblickte.\n@c0@"
  en: "@aBianca@bShe seemed to relax a bit when your dad appeared on the scene.\n@c0@"
  es: "@aBianca@bPareció tranquilizarse cuando apareció tu padre.\n@c0@"
  fr: "@aBianca@bElle a semblé se détendre un peu quand ton père est apparu.\n@c0@"
  it: "@aBianca@bForse è stata solo una mia impressione, ma mi è parso che, nel momento in cui è comparso Russel, si sia tranquillizzata...\n@c0@"
  ja: "@a@bビアンカ「お父さまが　現れたとき\n\tほんのすこし　安心したような\n\t顔をしてた……。\n@c0@"
71:
  de: "@aNera@bOh nein! Deine Mutter schwebt in großer Gefahr. Wir müssen uns beeilen!\n@c0@"
  en: "@aNera@bOh dear! It sounds like your mother is in terrible peril. We have to hurry!\n@c0@"
  es: "@aNera@b¡Oh, mamma mia! Sembra que la tua mamma corre un grave peligro. ¡Hay que darse prisa!\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Apparemment, ta mère est en grand danger. Nous devons nous dépêcherⓠ\n@c0@"
  it: "@aNera@bSanta dea!\nTua madre è in grave pericolo, %a000090!\nNon c'è un solo istante da perdere!\n@c0@"
  ja: "@a@bフローラ「お母さまが　そんなに……！？\n\tあなた　急ぎましょう。\n@c0@"
72:
  de: "@aNera@bDer Funke Leben deiner Mutter ist nun erloschen, %a000090.\n@c0@"
  en: "@aNera@bYour mother's spark of life has been\r\nextinguished now.\n@c0@"
  es: "@aNera@bLa chispa de la vita de la tua mamma ya se ha extinguido.\n@c0@"
  fr: "@aNera@bL'étincelle de vie de ta mère s'est éteinte.\n@c0@"
  it: "@aNera@bLa fiamma vitale che ardeva nel cuore di tua madre si è spenta...\n@c0@"
  ja: "@a@bフローラ「お母さまの　命のともしびは\n\t消えてしまったけど……\n@c0@"
73:
  de: "@aNera@bDoch ich bin mir sicher, dass sie zusammen mit deinem Vater über uns wacht und uns ihren Segen schickt.\n@c0@"
  en: "@aNera@bBut I'm sure she's watching over us from above with your father and sending us her blessings.\n@c0@"
  es: "@aNera@bMa sicuro que nos protege desde arriba con il tuo padre y nos envía bendiciones.\n@c0@"
  fr: "@aNera@bJe suis sûre qu'elle nous regarde depuis les cieux avec ton père et qu'elle est avec nous.\n@c0@"
  it: "@aNera@bPerò sento che Mada non ci ha abbandonati.\nSono certa che, anche adesso, continua a vegliare su di noi e a proteggerci dall'alto...\n@c0@"
  ja: "@a@bフローラ「きっと　お父さまと　ふたりで\n\t天国から　私たちを\n\t見まもっていてくださいますわ。\n@c0@"
74:
  de: "@a%0%a001250@bDas ist ja schrecklich! Wir dürfen keine Zeit verlieren, Papa!\n@c0@"
  en: "@a%0%a001250@bThat's terrible! There's no time to lose, Dad!\n@c0@"
  es: "@a%0%a001250@b¡Es horrible! ¡No hay tiempo que perder, papi!\n@c0@"
  fr: "@a%0%a001250@bC'est terribleⓠ Il ne faut pas perdre de temps, papaⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, è una cosa terribile!\nDobbiamo far presto!\n@c0@"
  ja: "@a@b%a001250「そんなの…　いや……。\n\tお父さん　はやく　行かないと。\n@c0@"
75:
  de: "@a%0%a001250@bGroßmutter...\n@c0@"
  en: "@a%0%a001250@bGrandma...\n@c0@"
  es: "@a%0%a001250@bAbuela...\n@c0@"
  fr: "@a%0%a001250@bGrand-mère...\n@c0@"
  it: "@a%0%a001250@bNonna...\n@c0@"
  ja: "@a@b%a001250「おばあちゃん……。\n@c0@"
76:
  de: "@aSancho@bOh, wie lange kämpft Señora Magda schon für das Gute...\n@c0@"
  en: "@aSancho@bHow long ees señora Mada fighting all on\r\nher own?\n@c0@"
  es: "@aSancho@b¿Cuánto tiempo lleva la señora Perséfone combatiéndolo todo solita?\n@c0@"
  fr: "@aSancho@bD-Depuis combien de tiempo la señora M-Magdalena se bat-elle toute seuleⓡ\n@c0@"
  it: "@aSancho@bDa troppos años la señora Mada está combattendo contro el potere de Nimzo...\n@c0@"
  ja: "@a@bサンチョ「もう　どれだけの\n\t長い時間　おひとりで\n\tたたかっておられたことか……\n@c0@"
77:
  de: "@aSancho@bChico, wir dürfen keine Zeit verlieren. Du musst deine Madre helfen, aber rápido!\n@c0@"
  en: "@aSancho@bMy Majesty! Ees no time to lose.\nYou must help your madre rápido!\n@c0@"
  es: "@aSancho@b¡Majestad! No hay tiempo que perder.\n¡Debe usted ayudar a su madre ahorita mismo!\n@c0@"
  fr: "@aSancho@bMa Majestéⓠ Il y a p-pas de temps à perdre.\nT-Tu dois aider ta madre, et v-viteⓠ\n@c0@"
  it: "@aSancho@b¡Chico, no ce está tiempo da perdere!\n¡Dobbiamo correre ad aiutare tua madre!\n¡Rapido!\n@c0@"
  ja: "@a@bサンチョ「%a000090王！\n\tいっこくも　はやく　マーサさまを\n\tお助けしなくては！\n@c0@"
78:
  de: "@aBianca@bHa! Sieht aus, als könne ein kleines Gläschen in dieser Welt schwerwiegende Folgen haben...\n@c0@"
  en: "@aBianca@bHa! Looks like havin' a tipple in this world could have some pretty serious consequences!\n@c0@"
  es: "@aBianca@b¡Ja! ¡Parece que tomarse una copita en este mundo tiene consecuencias graves!\n@c0@"
  fr: "@aBianca@bEh bienⓠ On dirait que boire un coup peut avoir de sacrées conséquences dans ce mondeⓠ\n@c0@"
  it: "@aBianca@bUn mostro che conduce una vita sana e regolare nel Regno degli Inferi...\r\nDetta così, sembra una barzelletta, eh?\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\tこの世界でのお酒は\n\t特別な意味を　持っているみたいね。\n@c0@"
79:
  de: "@a%0%a001240@bDas wusste ich nicht! Man wird also ein Monster, wenn man Alkohol trinkt?\n@c0@"
  en: "@a%0%a001240@bI didn't know that! So drinking turns people\ninto monsters?\n@c0@"
  es: "@a%0%a001240@b¡No lo sabía! Entonces, ¿la bebida te convierte en monstruo?\n@c0@"
  fr: "@a%0%a001240@bJe savais pasⓠ Boire, ça transforme les gens en monstresⓡ\n@c0@"
  it: "@a%0%a001240@bMa allora sono i vizi e gli eccessi che trasformano gli uomini in mostri...?\n@c0@"
  ja: "@a@b%a001240「えっ　お酒を飲むと\n\t魔物に　もどっちゃうの？\n@c0@"
80:
  de: "@aSancho@bWie heißt es doch so schön? Wenn man zu viel trinkt, wird man wie eine Monster. Und hier ist es tatsächliss so, si?\n㈡\nVielleisst werden die Monster mit die Alkohol auf die Probe gestellt...\n@c0@"
  en: "@aSancho@bThey esay eef you dreenk too much alcohol, you become like a monster. Here, ees really true, sí?\r\nMaybe the alcohol, ees here to test the monsters.\n@c0@"
  es: "@aSancho@b¿No dicen que si tomas mucho te vuelves un monstruo? Pues aquí es la puritita verdad, nomás.\n㈡\nQuizás el licor está aquí para probar a los monstruos.\n@c0@"
  fr: "@aSancho@bOn d-dit que quand on b-boit trop, on se comporte comme oun m-monstre. Ici, c'est v-vraiment le cas, siⓡ Peut-être que l'alcool sert à tester les monstres.\n@c0@"
  it: "@aSancho@bSì, claro.\nSi se conduce una vida irregular, piena de vicios y de eccessos, es facil trasformarse en un mostro...\n@c0@"
  ja: "@a@bサンチョ「酒は魔物　とは　申しますが\n\tこの世界では　魔物をためすために\n\t使われているのかも知れませんね。\n@c0@"
81:
  de: "@aSancho@bPerdón, Chico. Iss vergesse immer wieder, dass du jetzt alt genug bist, um auf diss selbst aufzupassen.\n@c0@"
  en: "@aSancho@bEh! Perdón, friend. I forget you are no old enough to understand thees theengs.\n@c0@"
  es: "@aSancho@b¡Eh! Perdón, chamaco. Se me olvida que no eres lo bastante mayor para comprender esas cosas.\n@c0@"
  fr: "@aSancho@bAhⓠ Perdón, chico. J'oublie toujours que t-tu n'es pas assez v-vieux pour comprendre ce genre de choses.\n@c0@"
  it: "@aSancho@bMe raccomando, chico: comportate bien, così resterai siempre la persona maravillosa que sei.\n@c0@"
  ja: "@a@bサンチョ「……いや　坊っちゃんには\n\t少々　むずかしい話でしたかな。\n@c0@"
82:
  de: "@aNera@bNa, wir möchten auf keinen Fall etwas tun, das wir später bereuen könnten.\n@c0@"
  en: "@aNera@bWell, we don't want to do anything that will cause us any regrets.\n@c0@"
  es: "@aNera@bVa bene, no queremos hacer niente de lo que arrepentirnos después.\n@c0@"
  fr: "@aNera@bNous ne voulons rien faire que nous pourrions regretter.\n@c0@"
  it: "@aNera@bNella vita di ciascuno di noi deve esserci spazio per il divertimento e l'allegria.\nL'importante è non esagerare...\n@c0@"
  ja: "@a@bフローラ「後悔…　ね。\n\t私たちは　後悔することのないように\n\t考えて行動したいですわね。\n@c0@"
83:
  de: "@a%0%a001250@bAber wenn das Trinken doch so schlecht ist, verstehe ich nicht, warum es hier überhaupt eine Schänke gibt...\n@c0@"
  en: "@a%0%a001250@bIf drinking is so bad, then what's the point in there being a pub here?\n@c0@"
  es: "@a%0%a001250@bSi beber es tan malo, ¿para qué tienen aquí una taberna?\n@c0@"
  fr: "@a%0%a001250@bSi ce n'est pas bien de boire, pourquoi il y a une taverne, alorsⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, io non credo che divertirsi e cedere a qualche innocua tentazione sia una cosa sbagliata, sai?\nSono gli eccessi che fanno male!\n@c0@"
  ja: "@a@b%a001250「飲んじゃダメなら\n\t酒場が　なかったらいいと思うの。\n@c0@"
84:
  de: "@aOtto@bMan kann einem Mann kaum einen Vorwurf machen, wenn er hier etwas trinken möchte. Nicht, wenn solch eine Schönheit hinter der Theke steht...\n@c0@"
  en: "@aTuppence@bYou can't blame a man for succumbing to a drink here. Not with a beauty like that serving it up to you.\n@c0@"
  es: "@aAlazar@bNo puedes reprocharle a un hombre que sucumba al alcohol en este sitio. Con esa belleza sirviéndotelo...\n@c0@"
  fr: "@aInnocent@bVous ne pouvez pas en vouloir à un homme de se laisser tenter par un verre ici. Difficile de résister à la beauté de la serveuse.\n@c0@"
  it: "@aSimon@bIo cerco sempre di evitare qualsiasi eccesso...\nNon sarò per caso una persona eccessivamente cauta?!\n@c0@"
  ja: "@a@bピピン「でも　あんなに　きれいな人が\n\t酒場にいたら　誰だって\n\t飲みたくなっちゃいますよね？\n@c0@"
85:
  de: "@a%0%a001240@bWow! Was für ein riesiges Rad!\n@c0@"
  en: "@a%0%a001240@bWow! What a huge wheel!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Qué rueda más enorme!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Quelle roue énormeⓠ\n@c0@"
  it: "@a%0%a001240@bChe ruota gigantesca!\n@c0@"
  ja: "@a@b%a001240「うわ～\n\tすごく大きい　歯車だね。\n@c0@"
86:
  de: "@a%0%a001250@bAua! Mein Nacken tut schon ganz weh, weil ich die ganze Zeit nach oben gucken muss!\n@c0@"
  en: "@a%0%a001250@bOuch! My neck's started to hurt from looking up\nso much!\n@c0@"
  es: "@a%0%a001250@b¡Aaay! ¡Me empieza a doler el cuello de tanto mirar hacia arriba!\n@c0@"
  fr: "@a%0%a001250@bOuilleⓠ Mon cou me fait mal à force de regarder en l'air tout le tempsⓠ\n@c0@"
  it: "@a%0%a001250@bAhia!\nHo guardato troppo a lungo verso l'alto, e mi è venuto il torcicollo!\n@c0@"
  ja: "@a@b%a001250「いたた……。\n\t上　見てたら\n\tクビが　痛くなっちゃった。\n@c0@"
87:
  de: "@aSancho@bSei vorsisstig! Wenn du diss in die Rad verfängst, ist dir nisst mehr nach Lachen zumute...\n@c0@"
  en: "@aSancho@bBe careful! Eef you are caught een the teeth, ees no gonna be eso pretty, eh?\n@c0@"
  es: "@aSancho@b¡Ten cuidado! Si te quedas atrapado entre los dientes, no te gustará tanto, ¿verdad?\n@c0@"
  fr: "@aSancho@bAttentionⓠ Si t-tu te fais prendre dedans, ça ne sera pas joli, joli, heinⓡ\n@c0@"
  it: "@aSancho@b¡Attenziones a no restare encastrato nellos dentes de la ruota, chico!\nPienso que no sarebbe una experiencia piacevole...\n@c0@"
  ja: "@a@bサンチョ「気をつけてくださいね！\n\t歯車に　まきこまれたら\n\tひとたまりも　ありませんよ！\n@c0@"
88:
  de: "@aBianca@bDiese arme Kreatur kam mir sehr einsam vor. Ich frage mich, warum er ganz alleine hier ist...\n@c0@"
  en: "@aBianca@bThat poor creature seemed a bit lonely.\r\nI wonder why it was all by itself here.\n@c0@"
  es: "@aBianca@bEsa pobre criatura parecía algo solitaria.\n¿Por qué estaría aquí sola?\n@c0@"
  fr: "@aBianca@bCette pauvre créature avait l'air bien triste.\r\nJe me demande ce qu'elle fait toute seule ici.\n@c0@"
  it: "@aBianca@bQuella povera creatura aveva un'aria molto malinconica.\nChissà quali rimpianti tormentano il suo animo...\n@c0@"
  ja: "@a@bビアンカ「なんだか　すごく\n\tさみしそうだったわね。\n\tこんな所に　ひとりぼっちだし。\n@c0@"
89:
  de: "@a%0%a001240@bJa, das ist tatsächlich schön. Hoffentlich bleibt es auch so!\n@c0@"
  en: "@a%0%a001240@bIt does feel quite good, actually.\nLong may it last!\n@c0@"
  es: "@a%0%a001240@bPues es muy agradable, la verdad.\n¡Que dure mucho!\n@c0@"
  fr: "@a%0%a001240@bC'est vrai que c'est plutôt agréable, en fait.\nPourvu que ça dureⓠ\n@c0@"
  it: "@a%0%a001240@bNessun rimpianto, grazie.\nHo sempre cercato di fare tutto ciò che potevo, nel miglior modo possibile...\n@c0@"
  ja: "@a@b%a001240「うん。　ボク　生きていくよ。\n\tりっぱかどうかは\n\tまだ　わからないけど。\n@c0@"
90:
  de: "@aNera@bIch kann immer noch nicht glauben, dass Menschen sich in Monster verwandeln können.\n@c0@"
  en: "@aNera@bI don't really believe that humans can turn\r\ninto monsters.\n@c0@"
  es: "@aNera@bNo me acabo de credere que los humanos puedan convertirse en mostri.\n@c0@"
  fr: "@aNera@bJe ne suis pas convaincue que les humains puissent se transformer en monstres.\n@c0@"
  it: "@aNera@bNon credo che gli esseri umani possano davvero trasformarsi in mostri...\n@c0@"
  ja: "@a@bフローラ「禁断の巻物？　まあ\n\t人間が　魔物に変わっていくなんて\n\tそんなこと　信じたくないわ。\n@c0@"
91:
  de: "@aNera@bOder besser gesagt, ich möchte es nicht glauben! Stell dir doch nur mal vor, wie schrecklich es sein muss, halb Mensch, halb Monster zu sein!\n@c0@"
  en: "@aNera@bOr I don't want to believe it! Imagine how terrifying a half-man half-beast would be!\n@c0@"
  es: "@aNera@b¡O no me lo quiero creer! ¡Imagina lo espantoso que sería alguien mezzo humano y mezzo fiera!\n@c0@"
  fr: "@aNera@bOu peut-être que je ne veux pas y croireⓠ\nImagine une créature mi-homme mi-monstre...\nCe serait terrifiantⓠ\n@c0@"
  it: "@aNera@bO forse non lo voglio credere... L'idea che un uomo possa diventare una belva guidata esclusivamente da istinti animaleschi mi fa inorridire!\n@c0@"
  ja: "@a@bフローラ「……半分魔物で\n\t半分人間の姿って\n\tかなり…　こわいですし……。\n@c0@"
92:
  de: "@a%0%a001250@bBereust du etwas aus tiefstem Herzen, Papa? Ich hoffe nicht. Das würde mich sehr traurig machen...\n@c0@"
  en: "@a%0%a001250@bHave you got any regrets, Dad? I hope not.\nI'd feel really bad for you if you did.\n@c0@"
  es: "@a%0%a001250@b¿Te arrepientes de algo, papi? Espero que no.\nMe apenaría mucho que lo hicieras.\n@c0@"
  fr: "@a%0%a001250@bTu as des regrets, papaⓡ J'espère que non.\nJe serais vraiment désolée pour toi si tu en avais.\n@c0@"
  it: "@a%0%a001250@bPapà, spero che tu non abbia rimpianti...\nNella vita bisognerebbe sempre guardare avanti, facendo tesoro degli errori commessi in passato.\n㈡\nI rimpianti non aiutano a vivere, l'esperienza e l'autocritica invece sì...\n@c0@"
  ja: "@a@b%a001250「お父さん　後悔してるの？\n\tお父さんが　そんな気持ちだと\n\tわたしも　悲しくなっちゃう……。\n@c0@"
93:
  de: "@aBianca@bMeinst du, er spricht über Nimzo?\n@c0@"
  en: "@aBianca@bYou dun't think he's talkin' about Nimzo, do you?\n@c0@"
  es: "@aBianca@b¿Crees que se refiere a Nimzo?\n@c0@"
  fr: "@aBianca@bTu crois qu'il pourrait s'agir de Nimzoⓡ\n@c0@"
  it: "@aBianca@bCredi che si riferisca a Nimzo...?\n@c0@"
  ja: "@a@bビアンカ「まさか　それが\n\tミルドラースってこと？\n@c0@"
94:
  de: "@aNera@bEr muss wirklich böse gewesen sein, wenn er sich in ein Monster verwandelt hat! Trotzdem frage ich mich, ob es solch ein allumfassendes Böses tatsächlich gibt.\n@c0@"
  en: "@aNera@bHe must have had a really evil heart to have turned into a monster! I wonder if such all-encompassing evil really does exist.\n@c0@"
  es: "@aNera@b¡Si se convirtió en monstruo, será que tenía un cuore veramente malvado! Me pregunto si de verdad existe una maldad così de inmensa.\n@c0@"
  fr: "@aNera@bIl devait vraiment avoir un mauvais fond pour s'être transformé un monstre. Je me demande si un mal aussi absolu existe.\n@c0@"
  it: "@aNera@bDev'essere stata una creatura davvero cattiva, per trasformarsi in un mostro! Ma com'è possibile covare tanta malvagità dentro di sé?!\n@c0@"
  ja: "@a@bフローラ「人を魔物に　変えてしまうほどの\n\t邪悪な心だなんて……。\n\tそれほどの闇が　あるんでしょうか。\n@c0@"
95:
  de: "@a%0%a001250@bWas, glaubst du, ist am Ende mit ihm passiert? Vielleicht hat man ihn ja angegriffen, weil er ein Monster war.\n@c0@"
  en: "@a%0%a001250@bWhat do you suppose happened to him in the end? Maybe he got attacked for being a monster.\n@c0@"
  es: "@a%0%a001250@b¿Qué crees que le pasó al final? Puede que lo atacaran por ser un monstruo.\n@c0@"
  fr: "@a%0%a001250@bEt ensuite, qu'est-ce qu'il a bien pu devenir, d'après toiⓡ Vu qu'il était devenu un monstre, peut-être que quelqu'un l'a attaqué.\n@c0@"
  it: "@a%0%a001250@bE poi? Come continua la storia?\nNon può mica finire così!\nChe fine ha fatto quel mostro?!\n@c0@"
  ja: "@a@b%a001250「その人　どうなったのかな？\n\t人間に　もどすことができないから\n\tやっつけられちゃったのかな？\n@c0@"
96:
  de: "@aOtto@bIch frage mich, warum er unbedingt ein Gott werden wollte.\n@c0@"
  en: "@aTuppence@bI wonder why he wanted to become a god.\n@c0@"
  es: "@aAlazar@b¿Por qué querría llegar a ser un dios?\n@c0@"
  fr: "@aInnocent@bJe me demande bien pourquoi il voulait devenir\r\nun dieu.\n@c0@"
  it: "@aSimon@bCome mai quell'uomo voleva diventare un dio?\n@c0@"
  ja: "@a@bピピン「その人　どうして　神さまに\n\tなりたかったのかな？\n@c0@"
97:
  de: "@aOtto@bIch glaube nicht, dass das so schön ist. Man denke doch nur an diesen Dr. Ache...\n@c0@"
  en: "@aTuppence@bI'm not too sure that's ever a good idea. I mean, think of that Dr Agon character.\n@c0@"
  es: "@aAlazar@bNo tengo claro que sea una buena idea. No hay más que ver a ese Dr. Agón.\n@c0@"
  fr: "@aInnocent@bJe ne suis pas sûr que ce soit une bonne idée.\r\nC'est vrai, regardez le Dr Agon, par exemple.\n@c0@"
  it: "@aSimon@bNon era contento della propria natura umana, limitata e fallibile e, proprio per questo, così varia e affascinante?\n㈡\nAh, che razza di domande sto facendo?!\nSono un guerriero, io, mica un filosofo!\n@c0@"
  ja: "@a@bピピン「ボクは　プサンさんっていう人も\n\t知りましたし　神さまになるのは\n\tえんりょしたいですね。\n@c0@"
98:
  de: "@aGriselda@bEs gibt also eine Stadt in Nadiria. Zu schade, dass sie keine Bekleidungsgeschäfte hier haben. Die Mode wäre bestimmt sehr interessant...\n@c0@"
  en: "@aDebora@bSo there's a town in Nadiria. It's a pity they don't have a clothes shop. The fashion here could be quite interesting if they did.\n@c0@"
  es: "@aStefania@bAsí que hay una città en Nadiria. Es una pena que no tengan una tienda de ropa. Sicuro que la moda de aquí sería muy interesante.\n@c0@"
  fr: "@aPandora@bAlors il existe une ville à Nadiria. Dommage qu'ils n'aient pas de boutique de vêtements. La mode d'ici pourrait être assez intéressante.\n@c0@"
  it: "@aViola@bE così a Nadiria c'è persino un villaggio!\nDubito, però, che qui ci siano negozi di abbigliamento...\n㈡\nPeccato.\nMi sarebbe piaciuto comprare qualche abitino ⓕinfernaleⓖ...\n@c0@"
  ja: "@a@bデボラ「ふ～ん　魔界にも　町があるのね。\n\t洋服店がないのと　ファッションが\n\tふつうなのが　残念だわ。\n@c0@"
99:
  de: "@aGriselda@bEs wird immer noch viel von deiner Mutter gesprochen, selbst nach ihrem Tod.\n@c0@"
  en: "@aDebora@bThere's still lots of talk of your mother here, even after her death.\n@c0@"
  es: "@aStefania@bAún se parla molto de la tua mamma aquí, incluso después de muerta.\n@c0@"
  fr: "@aPandora@bOn parle encore beaucoup de ta mère, ici,\r\nmême après sa mort.\n@c0@"
  it: "@aViola@bTua madre non è più tra noi, ma le creature del luogo ne parlano come se fosse ancora viva...\n@c0@"
  ja: "@a@bデボラ「あんたの　ママが　亡くなっても\n\tこの町は　いつまでも　あり続けるのね。\n@c0@"
100:
  de: "@aGriselda@bNur eine Stadt... Ich würde Papa ja gerne ein Andenken kaufen, aber ich kann einfach keinen Laden entdecken.\n@c0@"
  en: "@aDebora@bOnly one town... I'd quite like to buy Papa a souvenir, but I can't see anywhere to buy one.\n@c0@"
  es: "@aStefania@bSolo una città... Me gustaría comprarle un souvenir al mio papino, pero no sé donde.\n@c0@"
  fr: "@aPandora@bUne seule ville... J'aimerais assez rapporter un souvenir à papa, mais je ne vois nulle part où en acheter.\n@c0@"
  it: "@aViola@bQuesto è l'unico centro abitato di tutta Nadiria?\nMi piacerebbe comprare un souvenir per il mio paparino, ma non so proprio cosa prendergli...\n@c0@"
  ja: "@a@bデボラ「ただ　ひとつの町……。\n\tパパに　魔界みやげ　買っておきたいけど\n\tおみやげは　売ってなさそうね。\n@c0@"
101:
  de: "@aGriselda@bDeine Mutter war wirklich etwas Besonderes.\n㈡\nAber heißt es nicht, dass die Kinder eher unscheinbar werden, wenn die Eltern klug und eindrucksvoll sind?\n@c0@"
  en: "@aDebora@bYour mother was really quite special.\nThey do say that if a parent shines too much, their children will be dull, mind you...\n@c0@"
  es: "@aStefania@bLa tua mamma era una donna speziale.\nClaro que se dice que, si un padre brilla troppo, sus bambini resultan grises...\n@c0@"
  fr: "@aPandora@bTa mère était vraiment exceptionnelle. Mais on dit aussi que lorsque des parents brillent trop, leurs enfants seront ternes... \n@c0@"
  it: "@aViola@bTua madre era una donna eccezionale.\nMi riesce difficile che abbia avuto per figlio un pappamolle come te...\n㈡\nNo, scusami.\nQuesto non è proprio il momento di scherzare...\n@c0@"
  ja: "@a@bデボラ「あんたのママ　とても　りっぱね。\n\t親が　りっぱすぎると　子どもは\n\t成長しないっていうけど？\n@c0@"
102:
  de: "@aGriselda@bAlso sind die Einwohner hier alle einmal Monster gewesen.\n@c0@"
  en: "@aDebora@bSo the inhabitants of this place all used to\r\nbe monsters.\n@c0@"
  es: "@aStefania@bAsí que tutti los habitantes de este sitio solían ser mostri.\n@c0@"
  fr: "@aPandora@bAlors les habitants de ce lieu étaient tous\ndes monstresⓡ\n@c0@"
  it: "@aViola@bQuindi gli abitanti di questo posto originariamente erano dei mostri?\n@c0@"
  ja: "@a@bデボラ「どうやら　この町の人たちは\n\t魔物だったようね。\n@c0@"
103:
  de: "@aGriselda@bWann wirst du endlich zu etwas Besonderem wie deine Mutter, %a000090?\n@c0@"
  en: "@aDebora@bWhen are you going to become someone special like your mother was, %a000090?\n@c0@"
  es: "@aStefania@b¿Cuándo te convertirás en una persona speziale como la tua mamma, %a000090?\n@c0@"
  fr: "@aPandora@bQuand vas-tu devenir quelqu'un d'aussi exceptionnel que ta mère, %a000090ⓡ\n@c0@"
  it: "@aViola@bE Mada ha avuto la capacità di trasformarli in creature buone e sensibili.\nChe donna eccezionale...\n@c0@"
  ja: "@a@bデボラ「%a000090も　あんたのママのように\n\tはやく　りっぱな人間に　おなり。\n@c0@"
104:
  de: "@aGriselda@bRund?! Er meint, er wäre rund?! Ich würde das eher als ⓞfettⓟ bezeichnen!\n@c0@"
  en: "@aDebora@bHow silly! He can't blame being fat on being\r\nwell-rounded!\n@c0@"
  es: "@aStefania@b¡Qué tontería! ¡Qué tendrá que ver ser gordo con sopesar!\n@c0@"
  fr: "@aPandora@bC'est idiotⓠ Ce n'est pas parce qu'on dévore la vie\nà pleines dents qu'on est forcément gloutonⓠ\n@c0@"
  it: "@aViola@bBeh, i peccati di gola sono tollerabili, se paragonati alle nefandezze che avrà commesso quando era un mostro malvagio...\n@c0@"
  ja: "@a@bデボラ「太ったのは　ひとがらが\n\t丸くなったから　じゃないわよ。\n@c0@"
105:
  de: "@aGriselda@bAußerdem bin auch ich rundum zufrieden. Und ich habe kein einziges Gramm Fett auf den Rippen!\n@c0@"
  en: "@aDebora@bI'm the most well-rounded person I know, and there's not a scrap of fat on me!\n@c0@"
  es: "@aStefania@b¡Io sonno la persona que más sopesa las cosas conozco y no tengo ni un gramo de grasa!\n@c0@"
  fr: "@aPandora@bMoi, je dévore la vie plus que personne, mais je garde parfaitement la ligneⓠ\n@c0@"
  it: "@aViola@bIo, però, sto molto attenta alla mia alimentazione, perché alla mia linea ci tengo!\n@c0@"
  ja: "@a@bデボラ「だって　私\n\tひとがらが　丸いのに\n\t太ってないですもの。\n@c0@"
106:
  de: "@aGriselda@bWenn er Nimzo immer noch hörig ist, ist er ausgesprochen loyal. Wahrscheinlich würde er einen ausgezeichneten Diener abgeben...\n@c0@"
  en: "@aDebora@bHe's incredibly loyal to still respect Nimzo even now. He'd probably make an excellent servant.\n@c0@"
  es: "@aStefania@bSu lealtad es incredibileⓓ sigue respetando a Nimzo. Sicuro que sería un excelente sirviente.\n@c0@"
  fr: "@aPandora@bIl est incroyablement loyal pour continuer\r\nà respecter Nimzo encore maintenant.\r\nIl ferait sans doute un excellent domestique.\n@c0@"
  it: "@aViola@bLa sua fedeltà a Nimzo mi lascia senza parole...\n@c0@"
  ja: "@a@bデボラ「今でも　そんけいしているなんて\n\tなかなかの　忠誠心ね。\n\tしもべとしては　りっぱだわ。\n@c0@"
107:
  de: "@aGriselda@bAber es ist Nimzo, der keine Chance hat, nicht unser Held. Da hatte er Unrecht!\n@c0@"
  en: "@aDebora@bIt's Nimzo who'd be powerless, though, not our hero. He was wrong there!\n@c0@"
  es: "@aStefania@bPero el que no tendría ninguna possibilità será Nimzo. ¡Se equivocaba!\n@c0@"
  fr: "@aPandora@bMais il a tort sur un pointⓢ c'est Nimzo qui serait impuissant en la présence de notre héros, et non l'inverseⓠ\n@c0@"
  it: "@aViola@bIl suo signore, però, conoscerà presto la sconfitta per mano dell'Eroe Leggendario!\nNimzo ha le ore contate!\n@c0@"
  ja: "@a@bデボラ「でもね\n\t足元にも　およばないのは\n\t大魔王の方よ。\n@c0@"
108:
  de: "@aGriselda@bWarum stiehlt er überhaupt? Solange ich Geld habe, würde ich gar nicht auf die Idee kommen, etwas zu stehlen.\n@c0@"
  en: "@aDebora@bWhy would he steal like that? As long as I had money, I'd never think of stealing.\n@c0@"
  es: "@aStefania@b¿Per qué iba a robar? Mientras tenga dinero, nunca se me ocurrirá robar.\n@c0@"
  fr: "@aPandora@bPourquoi voler comme çaⓡ Du moment que j'ai de l'argent, il ne me viendrait jamais à l'idée de dérober quoi que ce soit.\n@c0@"
  it: "@aViola@bDannato ladro!\nNon potrebbe guadagnarsi da vivere onestamente invece di rubare?!\n@c0@"
  ja: "@a@bデボラ「なんで　盗みなんて　するのかしら。\n\tお金があれば　盗みなんて　考えないわ。\n@c0@"
109:
  de: "@aGriselda@bErkennst du diesen Stab? Oh! Ist das etwa der von %a001250?\n@c0@"
  en: "@aDebora@bDo you recognise that staff?\nOh! It's %a001250's?\n@c0@"
  es: "@aStefania@b¿Reconoces el báculo?\n¡Oh! ¿Es de %a001250?\n@c0@"
  fr: "@aPandora@bTu reconnais ce bâtonⓡ\nOhⓠ Il appartient à %a001250ⓡ\n@c0@"
  it: "@aViola@bCome mai stai fissando quella bacchetta, %a000090?\nCome dici? È la bacchetta di %a001250?!\n@c0@"
  ja: "@a@bデボラ「あんた　この杖　知ってるの？\n\tえ？　%a001250の　持ってた杖？\n@c0@"
110:
  de: "@aGriselda@bIch kann nicht glauben, dass der Dieb es den ganzen Weg nach Nadiria geschafft hat. Er muss uns gefolgt sein, nachdem wir das Tor geöffnet haben...\n@c0@"
  en: "@aDebora@bIt's quite impressive that the thief made it all the way to Nadiria, don't you think? He must've come after we opened the way.\n@c0@"
  es: "@aStefania@bEs impresionante que el ladrón haya llegado hasta Nadiria, ¿vero? Debe de haber venido después de que abriésemos el camino.\n@c0@"
  fr: "@aPandora@bC'est assez impressionnant de voir que ce voleur a réussi à atteindre Nadiria, tu ne trouves pasⓡ Il a dû arriver après que nous ayons ouvert le passage.\n@c0@"
  it: "@aViola@bA proposito... Come avrà fatto quel ladro a raggiungere Nadiria? Pensi che si sia intrufolato qui dentro quando abbiamo aperto il varco?\n@c0@"
  ja: "@a@bデボラ「はぁ……　どろぼうも\n\t魔界まで　逃げ込むなんて　感心するわ。\n\t魔界への道が　開いたあと　来たのね。\n@c0@"
111:
  de: "@aGriselda@bSo sieht also eine nadirianische Herberge aus. Wie hier wohl das Essen schmeckt?\n@c0@"
  en: "@aDebora@bSo this is what a Nadirian inn looks like.\nI wonder how the food tastes.\n@c0@"
  es: "@aStefania@bAsí que así son las posadas de Nadiria.\n¿Come será la comida?\n@c0@"
  fr: "@aPandora@bAlors c'est à ça que ressemble une auberge nadirienne. Je me demande quel goût a la nourriture.\n@c0@"
  it: "@aViola@bMai e poi mai avrei immaginato di soggiornare in una locanda a Nadiria...\nChissà cosa si mangia da queste parti...\n@c0@"
  ja: "@a@bデボラ「ここが　魔界の宿屋か。\n\t食事は　おいしいんでしょうね？\n@c0@"
112:
  de: "@aGriselda@bKein Grund, solch ein Geschrei anzustimmen. Wir kümmern uns schon um Nimzo.\n@c0@"
  en: "@aDebora@bThere's no need for him to make such a song and dance about it. We'll sort Nimzo out.\n@c0@"
  es: "@aStefania@bVeramente, no es necesario que haga tantos aspavientos. Nosotros nos encargaremos de Nimzo.\n@c0@"
  fr: "@aPandora@bPas la peine de nous en faire tout un fromage,\r\nnon plus. On va régler son compte à Nimzo.\n@c0@"
  it: "@aViola@bNo, si sbaglia.\nNoi fermeremo Nimzo.\n@c0@"
  ja: "@a@bデボラ「そんなに　苦しまなくても\n\t私たちが　大魔王を\n\tけちらしてあげるわ。\n@c0@"
113:
  de: "@aGriselda@bHmpf. Er hört nicht zu. Vielleicht sollten wir ihm einen Klaps geben. Er muss doch endlich aus seinem Alptraum aufwachen.\n@c0@"
  en: "@aDebora@bHmph. He's not listening.\r\nMaybe we should give him a slap.\r\nHe obviously needs waking up from his nightmare.\n@c0@"
  es: "@aStefania@bMmmf. No me escucha.\nDebería darle un bofetón.\nTiene que despertar de la sua pesadilla.\n@c0@"
  fr: "@aPandora@bMmpf. Il n'écoute pas. On devrait peut-être lui coller une gifle. Il a manifestement besoin qu'on le tire de son cauchemar.\n@c0@"
  it: "@aViola@bHo un piano infallibile, %a000090...\nSenti un po' se ti piace.\n㈡\nIo lo distrarrò con la mia sfolgorante bellezza, tenendomi prudentemente a distanza, e tu lo colpirai senza pietà, mettendo a repentaglio la tua vita...\n@c0@"
  ja: "@a@bデボラ「……って　聞こえてないわね。\n\tひっぱたいて　起こしたら\n\t悪夢から　解放されるんじゃない？\n@c0@"
114:
  de: "@aGriselda@bUnd du wirst derjenige sein, der sie retten wird! Wir haben jetzt keine Zeit, in Schänken zu sitzen!\n@c0@"
  en: "@aDebora@bAnd you're the one to do it! Now's not the time to be hanging around in pubs!\n@c0@"
  es: "@aStefania@b¡Y tú eres la persona adecuada para hacerlo! ¡Ahora non è momento de entretenerse en la taberna!\n@c0@"
  fr: "@aPandora@bEt c'est toi qui vas t'en chargerⓠ Ce n'est pas\ndu tout le moment de traîner dans les tavernesⓠ\n@c0@"
  it: "@aViola@bNoi fermeremo Nimzo!\n㈡\nCioè, caro, tu lo fermerai. Io mi limiterò a dirigere le operazioni da lontano, per vedere se hai finalmente imparato a cavartela da solo...\n@c0@"
  ja: "@a@bデボラ「酒場で　ぐちぐちしてる\n\tそこのあんたも　なんとかしなさいよ！\n@c0@"
115:
  de: "@aGriselda@bWir haben keine Zeit, hier herumzusitzen. Wir müssen uns endlich für das an Nimzo rächen, was er deiner Mutter angetan hat.\n@c0@"
  en: "@aDebora@bWe don't have time to hang around here. It's time to make Nimzo pay for what he did to your mother.\n@c0@"
  es: "@aStefania@bNo tenemos tiempo para entretenernos aquí. Es hora de hacer que Nimzo pague por lo que le hizo a la tua mamma.\n@c0@"
  fr: "@aPandora@bNous n'avons pas le temps de traîner par ici. Le moment est venu de faire payer Nimzo pour\r\nce qu'il a fait à ta mère.\n@c0@"
  it: "@aViola@bNon perdiamo altro tempo qui, %a000090...\nÈ giunta l'ora di presentare il conto a Nimzo!\nVendicheremo la morte di tua madre!\n@c0@"
  ja: "@a@bデボラ「ぐちぐちしてる　ヒマはないわ。\n\tあんたのママを　苦しめた　憎たらしい\n\t大魔王を　ぶんなぐりに行きましょ。\n@c0@"
116:
  de: "@aGriselda@bIn unserer Welt gibt es einen Haufen Leute, die sich in Monster verwandeln, wenn sie zu viel getrunken haben...\n@c0@"
  en: "@aDebora@bThere are plenty of people in our world who turn into monsters when they've had a drink.\n@c0@"
  es: "@aStefania@bHay muchas personas en nuestro mundo que se convierten en mostri después de due copas.\n@c0@"
  fr: "@aPandora@bDans notre monde, il y a plein de gens qui se transforment en monstres lorsqu'ils ont bu.\n@c0@"
  it: "@aViola@bSono d'accordo solo in parte.\nIl mio motto è:\nⓕniente vizi, niente eccessi, niente esercizio fisicoⓖ.\n@c0@"
  ja: "@a@bデボラ「オモテの世界でも　お酒を飲むと\n\t魔物になる人たちって　いるわよね。\n@c0@"
117:
  de: "@aGriselda@bWarum guckst du so schockiert? Ich habe doch gar nicht dich gemeint!\n@c0@"
  en: "@aDebora@bWhy are you looking so aggravated?\r\nI wasn't pointing any fingers!\n@c0@"
  es: "@aStefania@bMa, ¿por qué pones esa cara?\n¡No estaba señalando a nadie!\n@c0@"
  fr: "@aPandora@bPourquoi tu fais cette têteⓡ Je ne désignais personne en particulierⓠ\n@c0@"
  it: "@aViola@bInfatti, delego tutti i compiti faticosi a te, maritino mio caro.\n@c0@"
  ja: "@a@bデボラ「……なに　あんた\n\tしんこくな顔してるの？\n\t私のは　例え話よ。\n@c0@"
118:
  de: "@aGriselda@bNa, die hat's gut, arbeitet in einer Schänke und will einem nichts zu trinken geben! Solch eine Arbeit hätte ich auch mal gerne!\n@c0@"
  en: "@aDebora@bShe has an easy time of it, working in a pub and refusing to serve drink! Even I wouldn't mind working in a pub like that.\n@c0@"
  es: "@aStefania@bSe lo monta bene, no hay duda: ¡trabaja en la taberna y se niega a servir bebidas! Yo también podría trabajar así en una taberna.\n@c0@"
  fr: "@aPandora@bÇa n'est pas dur pour elle de travailler dans une taverne si elle refuse de servir à boireⓠ Même moi,\nje serais prête à travailler ici, dans ces conditions.\n@c0@"
  it: "@aViola@bIo resisto sempre ai vizi e alle tentazioni.\n㈡\nCioè, quasi sempre: quando entro in un negozio d'abbigliamento ben fornito, vado fuori di testa e compro tutto ciò che mi piace! Tanto paghi tu, caro...\n@c0@"
  ja: "@a@bデボラ「お酒出さない酒場って　楽ね。\n\tはたらくとしたら　私\n\tこういうお店で　はたらきたいわ。\n@c0@"
119:
  de: "@aGriselda@bRichtige Antwort! Natürlich bereust du nichts, schließlich bist du mit mir verheiratet.\n@c0@"
  en: "@aDebora@bCorrect answer! You shouldn't have any regrets, what with being married to me and everything.\n@c0@"
  es: "@aStefania@b¡Correcto! No debes lamentarte de nadaⓓ ¡después de tutto, estás casado con me!\n@c0@"
  fr: "@aPandora@bBonne réponseⓠ Tu ne dois pas avoir de regrets,\nvu que tu es marié avec moi.\n@c0@"
  it: "@aViola@bTu hai diritto ad avere un unico rimpianto, %a000090: quello di non avermi conosciuta prima.\n㈡\nSi può tranquillamente dire che hai iniziato a vivere solo dopo essere diventato mio marito.\n@c0@"
  ja: "@a@bデボラ「そりゃ　そうよね。\n\t私と結婚した　あんたが\n\t人生に　後悔するはずないわ。\n@c0@"
120:
  de: "@aGriselda@bWas?! Wie kannst du etwas bereuen? Du bist doch mit mir verheiratet!\n@c0@"
  en: "@aDebora@bHow dare you! You can't possibly have any regrets. You're married to me, remember!\n@c0@"
  es: "@aStefania@b¡Ma come te atreves! Tú no tienes niente de qué lamentarte. Estás casado con me, ¿capisci?\n@c0@"
  fr: "@aPandora@bComment oses-tuⓡ Tu ne peux pas avoir de regrets. Tu es marié avec moi, je te rappelleⓠ\n@c0@"
  it: "@aViola@bE che rimpianti avresti tu, eh?!\nPuoi solo rimpiangere di non avermi incontrata prima, caro mio!\n㈡\nRicorda che senza di me saresti ancora il pappamolle che eri un tempo!\n@c0@"
  ja: "@a@bデボラ「どういうこと　あんた。\n\t私と結婚しておきながら\n\t人生に　後悔しているわけ？\n@c0@"
121:
  de: "@aGriselda@bWelch ein Narr. Er hat von Anfang an alles falsch gemacht. Ein Gott sein zu wollen ⓚⓛ was für ein Unfug!\n@c0@"
  en: "@aDebora@bWhat a fool. He had it all wrong from the outset, wanting to become a god.\n@c0@"
  es: "@aStefania@bQué idiota. ¡Mira que querer ser un dio! Eso ya es empezar mal.\n@c0@"
  fr: "@aPandora@bQuel imbécile. Il avait tout faux depuis le début,\r\nà vouloir devenir un dieu.\n@c0@"
  it: "@aViola@bUn uomo desiderava trasformarsi in una divinità, e invece divenne un mostro...\n@c0@"
  ja: "@a@bデボラ「バカな人間ね。\n\t神になりたがる\n\tおごりきった心こそが　悪なのよ。\n@c0@"
122:
  de: "@aGriselda@bEr ist auch nicht besser als all die Idioten, die im Kasino ein Vermögen machen wollen und dann mit leeren Händen wieder nach Hause gehen.\n@c0@"
  en: "@aDebora@bHe sounds just like the idiots who turn up at the casino to make their fortunes and end up penniless.\n@c0@"
  es: "@aStefania@bEs como los lerdos que van al casino para fare fortuna y acaban sin una moneta.\n@c0@"
  fr: "@aPandora@bIl me fait penser à tous ces idiots qui vont au casino pour faire fortune et qui finissent sans le sou.\n@c0@"
  it: "@aViola@bUn mostro dal cuore gonfio d'odio...\n@c0@"
  ja: "@a@bデボラ「もうけたいと思って\n\tカジノへ向かい　すっからかんになる\n\t人間と　同じくらい　バカな話だわ。\n@c0@"
