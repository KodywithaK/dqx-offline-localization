  fr: "@a%0%a001240@bLe monde des humains, c'est le monde dans lequel on vit, c'est çaⓡ Je ne savais pas qu'il avait un nom.\n@c0@"
  it: "@a%0%a001240@bSì, noi siamo uomini.\nMa queste creature non mi sembrano meno umane di noi...\n@c0@"
