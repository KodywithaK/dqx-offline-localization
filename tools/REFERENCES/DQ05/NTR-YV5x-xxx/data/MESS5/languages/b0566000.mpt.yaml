  fr: "@aNera@bC'était un humain, nonⓡ Bizarreⓠ On dirait que les humains sont plus méchants que les monstres par ici.\n@c0@"
  it: "@aNera@bQuel tipo è la dimostrazione che, quando ci si mettono, gli uomini sono peggiori dei mostri!\n@c0@"
  ja: "@a@bフローラ「今のは　人でしたわよね？\n\tこの町では　人のほうが\n\t悪いだなんて……。\n@c0@"
56:
  de: "@a%0%a001240@bDas hätte ich nicht erwartet! Er war keiner von den Guten, oder?\n@c0@"
  en: "@a%0%a001240@bThat took me by surprise! He was a baddie,\nwasn't he?\n@c0@"
  es: "@a%0%a001240@b¡Eso no me lo esperaba! Él era uno de los malos, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bAlors là, il m'a eu par surpriseⓠ\nC'était un méchant, nonⓡ\n@c0@"
  it: "@a%0%a001240@bAccidenti!\nA momenti mi prende un colpo!\nQuello era un uomo cattivo, non è vero?\n@c0@"
  ja: "@a@b%a001240「あ～　びっくりした。\n\tあの人　悪い人だったんだね。\n@c0@"
57:
  de: "@a%0%a001250@bEr hat einen Schatz gestohlen? Oje, der Bestohlene ist jetzt bestimmt sehr traurig.\n@c0@"
  en: "@a%0%a001250@bHe stole some treasure? The person he took it from must be really upset.\n@c0@"
  es: "@a%0%a001250@b¿Que robó un tesoro? La persona a la que se lo robó estará muy disgustada.\n@c0@"
  fr: "@a%0%a001250@bIl a volé un trésorⓡ La personne à qui il l'a volé doit vraiment être énervée.\n@c0@"
  it: "@a%0%a001250@bQuel tipo ha rubato un tesoro?\nChe razza di delinquente!\nE poi dicono male dei mostri...\n@c0@"
  ja: "@a@b%a001250「盗んだ…　って　どこから？\n\t盗まれた人　こまってるよね……。\n@c0@"
58:
  de: "@aOtto@bMit einem Kampf hätt' ich hier net g'rechnet! Aber da kann man mal wieder sehen, dass wir unsere Deckung nie vernachlässigen sollten.\n@c0@"
  en: "@aTuppence@bI didn't expect to have a battle sprung on me here!\r\nIt looks like we really can't afford to let down our guard in this place.\n@c0@"
  es: "@aAlazar@b¡No esperaba verme envuelto en una batalla aquí!\nParece que en este sitio no podemos bajar la guardia.\n@c0@"
  fr: "@aInnocent@bJe ne m'attendais pas à devoir me battre iciⓠ\nOn dirait qu'il ne faut jamais baisser sa garde\ndans ce pays.\n@c0@"
  it: "@aSimon@bUhm, in questo posto non ci si può distrarre nemmeno per un secondo...\nIl pericolo è sempre dietro l'angolo.\n@c0@"
  ja: "@a@bピピン「まさか　こんなところで\n\t戦うことになるとは……。\n\tやはり　この町はゆだんなりませんね。\n@c0@"
59:
  de: "@aBianca@bDu machst so ein komisches Gesicht, %a000090. Hat dieser Stab irgendeine Bedeutung für dich?\n@c0@"
  en: "@aBianca@bYou've got a bit of a funny look on your face, %a000090. Does that staff mean somethin' to you?\n@c0@"
  es: "@aBianca@bHas puesto una cara un poco rara, %a000090. ¿Te recuerda a algo ese báculo?\n@c0@"
  fr: "@aBianca@bTu as l'air bizarre tout à coup, %a000090.\nTu as déjà vu ce bâtonⓡ\n@c0@"
  it: "@aBianca@bPerché hai quell'espressione, %a000090?\nQuella bacchetta ti ricorda qualcosa?\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tふしぎそうな顔してるわよ。\n\tこの杖に　なにか思い出でもあるの？\n@c0@"
60:
  de: "@a%0%a001250@bWer hätte gedacht, dass wir hier einen Stolosstab finden? Es ist so schön, wieder einen zu besitzen!\n@c0@"
  en: "@a%0%a001250@bWho'd have thought we'd find a Stolos' staff here? It's really nice to have one again.\n@c0@"
  es: "@a%0%a001250@b¿Quién iba a pensar que encontraríamos un báculo de Stolas aquí? ¡Qué bien, volver a tener uno!\n@c0@"
