0:
  de: "@aBianca@bKaum vorstellbar, dass jemand an solch einem Ort wohnt, was?\n@c0@"
  en: "@aBianca@bIt's hard to believe that anyone lives in a place like this, eh?\n@c0@"
  es: "@aBianca@bCuesta creer que alguien viva en un sitio así, ¿eh?\n@c0@"
  fr: "@aBianca@bOn se demande comment quelqu'un peut vivre dans un endroit pareil, heinⓡ\n@c0@"
  it: "@aBianca@bNon riesco a credere che qualcuno possa vivere in un luogo del genere...\n@c0@"
  ja: "@a@bビアンカ「こんな場所に\n\t人が　住んでるなんて……。\n\t本当に　信じられないわ。\n@c0@"
1:
  de: "@aNera@bIch hätte nie gedacht, dass es in Nadiria eine Stadt gibt. Damit hätte ich nun wirklich nicht gerechnet.\n@c0@"
  en: "@aNera@bI never imagined there'd be a town here in Nadiria. That was the last thing I expected.\n@c0@"
  es: "@aNera@bNo imaginaba que hubiera una città così en Nadiria. Es lo último que esperaba.\n@c0@"
  fr: "@aNera@bJamais je n'aurais pensé qu'il y avait une ville\r\nà Nadiria. C'est la dernière chose à laquelle je m'attendais.\n@c0@"
  it: "@aNera@bNon avrei mai immaginato che a Nadiria ci fosse un villaggio...\nEra l'ultima cosa che mi sarei aspettata di trovare...\n@c0@"
  ja: "@a@bフローラ「まさか　魔界に\n\t町が　あるなんて……。\n\t思ってもみませんでしたわ。\n@c0@"
2:
  de: "@a%0%a001240@bWie gut, dass wir eine Stadt gefunden haben. Die Monster hier sind ganz schön stark, da ist es wichtig, dass wir uns ausruhen können.\n@c0@"
  en: "@a%0%a001240@bIt's good to find a town like this. The monsters\nare really strong around here, so we could do\nwith a rest.\n@c0@"
  es: "@a%0%a001240@bQué bien que hayamos encontrado una ciudad. Por aquí los monstruos son muy fuertes, nos vendrá bien un descanso.\n@c0@"
  fr: "@a%0%a001240@bJe suis content qu'il y ait une ville ici. Les monstres sont vraiment costauds dans le coin. Ça va nous faire du bien de nous reposer.\n@c0@"
  it: "@a%0%a001240@bPer fortuna abbiamo trovato un villaggio. Con tutti i mostri che ci sono in giro, un luogo tranquillo dove poter riposare un po' è proprio quel che ci vuole.\n@c0@"
  ja: "@a@b%a001240「このあたりの敵は　強いから\n\tここに町があって　助かったあ。\n\tねえ　少しだけゆっくりしていこうよ。\n@c0@"
3:
  de: "@a%0%a001250@bWas für eine seltsame Stadt. Sie hat ein bisschen die Form einer Blume, wenn man sie aus der Ferne betrachtet.\n@c0@"
  en: "@a%0%a001250@bWhat a strangely shaped town. It looks a bit like a flower when you see it from a distance.\n@c0@"
  es: "@a%0%a001250@bQué forma tan rara tiene esta ciudad. Si la miras desde lejos, recuerda a una flor.\n@c0@"
  fr: "@a%0%a001250@bElle est bizarre, cette ville. De loin, elle a un peu la forme d'une fleur.\n@c0@"
  it: "@a%0%a001250@bQuesto villaggio ha una forma decisamente insolita...\nVisto da lontano sembra quasi un fiore, non trovi?\n@c0@"
  ja: "@a@b%a001250「ふしぎな形の町ね。\n\t遠くから見たら\n\tお花が咲いてるみたいだった。\n@c0@"
4:
  de: "@aSancho@bDraußen herrscht eine wirkliss düstere Atmosphäre, aber hier in die Stadt ist das nisst so. Ein Glück.\n@c0@"
  en: "@aSancho@bOutside, ees a very dark atmosphere, but here een the town, ees no like that. Ees nice.\n@c0@"
  es: "@aSancho@bFuera nomás está todo oscuro, pero aquí en la ciudad es otra cosa. Es agradable.\n@c0@"
  fr: "@aSancho@bD-Dehors, l'atmosphère est sinistre, mais d-dans la ville, ce n'est pas p-pareil. C'est agréable.\n@c0@"
  it: "@aSancho@bFuori es muy pericoloso, ma el villaggio sembra tranquillo, chico...\n@c0@"
  ja: "@a@bサンチョ「外は　まがまがしい気配に\n\t満ちているのに　この町だけは\n\tなにやら　なごやかですね。\n@c0@"
5:
  de: "@aSancho@bWeißt du, Chico, vielleisst solltest du hier alle nötigen Vorbereitungen treffen, bevor wir weiterziehen.\n@c0@"
  en: "@aSancho@bYou know, friend, maybe ees a good idea to make preparations for our journey here before we leave.\n@c0@"
  es: "@aSancho@bYa sabes, chamaco, sería buena idea ir preparando nuestro viaje acá antes de irnos.\n@c0@"
  fr: "@aSancho@bT-Tu sais, chico, peut-être qu'on devrait faire\r\ndes p-préparatifs pour notre expédition avant\r\nde p-partir.\n@c0@"
  it: "@aSancho@bPienso que sarebbe una buena idea fermarce un po' aquí prima de proseguire el nuestro viaggio.\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\tここで　もう一度\n\t旅じたくを　整えなおしましょう。\n@c0@"
6:
  de: "@aOtto@bGlaubt Ihr, dass Königin Magdalena hier irgendwo in der Nähe ist?\n@c0@"
  en: "@aTuppence@bYou don't suppose Queen Mada is here somewhere, do you?\n@c0@"
  es: "@aAlazar@bNo creeréis que la reina Perséfone está por aquí, ¿eh?\n@c0@"
  fr: "@aInnocent@bVous croyez que la reine Magdalena est\nquelque part iciⓡ\n@c0@"
  it: "@aSimon@bMaestà, crede che la regina Mada sia tenuta prigioniera da queste parti?\n@c0@"
  ja: "@a@bピピン「太后さまは　この町には\n\tおられないのでしょうか……？\n@c0@"
7:
  de: "@aOtto@bNa, selbst wenn nicht, allzu weit kann's ja nimmer sein...\n@c0@"
  en: "@aTuppence@bWell, even if she's not, I doubt she can be too far away now.\n@c0@"
  es: "@aAlazar@bBueno, aunque no esté, dudo que ande muy lejos.\n@c0@"
  fr: "@aInnocent@bEh bien, même si ce n'est pas le cas, elle ne doit plus être très loin.\n@c0@"
  it: "@aSimon@bHo la sensazione che non sia molto lontana...\n@c0@"
  ja: "@a@bピピン「いずれにせよ\n\tじょじょに　近づいているのは\n\tたしかなんですよね……。\n@c0@"
8:
  de: "@aBianca@bIch hätte nie gedacht, noch mal hierhin zurückzukehren.\n@c0@"
  en: "@aBianca@bI never thought we'd find ourselves back here again.\n@c0@"
  es: "@aBianca@bNunca creí que volveríamos aquí.\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais pensé que nous nous retrouverions ici.\n@c0@"
  it: "@aBianca@bNon credevo che saremmo tornati qui...\n@c0@"
  ja: "@a@bビアンカ「こんなふうに\n\tこの町に　もどってくるなんて\n\t思わなかったわ……。\n@c0@"
9:
  de: "@aBianca@bDieser Ort erinnert mich an deine Mutter...\n@c0@"
  en: "@aBianca@bBeing here reminds me of your mum, you see.\n@c0@"
  es: "@aBianca@bEstar aquí me recuerda a tu madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit me rappelle ta maman.\n@c0@"
  it: "@aBianca@bQuesto posto mi fa tornare in mente tua madre...\n@c0@"
  ja: "@a@bビアンカ「だって　この町にいると\n\tお母さまのこと　思い出すから……。\n@c0@"
10:
  de: "@aNera@bAlles in Ordnung, Liebling? Hier wird viel über deine Mutter gesprochen, nicht wahr?\n@c0@"
  en: "@aNera@bAre you alright, darling? There's lots of talk of your mother here, isn't there?\n@c0@"
  es: "@aNera@b¿Stai bene, caro? Se habla mucho aquí de la tua mamma, ¿vero?\n@c0@"
  fr: "@aNera@bTout va bien, mon chériⓡ Tout le monde parle de ta mère ici, heinⓡ\n@c0@"
  it: "@aNera@bCaro, hai notato che da queste parti parlano tutti di tua madre?\n@c0@"
  ja: "@a@bフローラ「あなた　大丈夫？\n\tここには　お母さまの話が\n\tあふれていますものね……。\n@c0@"
11:
  de: "@a%0%a001240@bIch werde nicht eher ruhen, bis ich Großmutters Tod gerächt habe!\n@c0@"
  en: "@a%0%a001240@bI'll never rest until I've avenged Grandma's death!\n@c0@"
  es: "@a%0%a001240@b¡No descansaré hasta vengar la muerte de la abuela!\n@c0@"
  fr: "@a%0%a001240@bJe ne m'arrêterai que lorsque j'aurai vengé la mort de grand-mère.\n@c0@"
  it: "@a%0%a001240@bNon troverò pace fino a quando non avrò vendicato la morte di mia nonna!\n@c0@"
  ja: "@a@b%a001240「おばあちゃんのカタキ……。\n\tボクは　絶対に　ゆるさない！\n@c0@"
12:
  de: "@a%0%a001250@bWas für eine seltsame Stadt. Sie hat ein bisschen die Form einer Blume, wenn man sie aus der Ferne betrachtet.\n@c0@"
  en: "@a%0%a001250@bWhat a strangely shaped town. It looks a bit like a flower when you see it from a distance.\n@c0@"
  es: "@a%0%a001250@bQué forma tan rara tiene esta ciudad. Si la miras desde lejos, recuerda a una flor.\n@c0@"
  fr: "@a%0%a001250@bElle est bizarre, cette ville. De loin, elle a un peu la forme d'une fleur.\n@c0@"
  it: "@a%0%a001250@bQuesto villaggio ha una forma decisamente insolita...\nVisto da lontano sembra quasi un fiore, non trovi?\n@c0@"
  ja: "@a@b%a001250「ふしぎな形の町ね。\n\t遠くから見たら\n\tお花が咲いてるみたいだった。\n@c0@"
13:
  de: "@aSancho@bIss kann immer noch die Macht von Señora Magda in diese Stadt spüren, auch wenn sie nisst mehr bei uns ist...\n@c0@"
  en: "@aSancho@bI estill feel the power from señora Mada here een thees town, even after eshe has passed away now.\n@c0@"
  es: "@aSancho@bAún siento el poder de la señora Perséfone en esta ciudad, aunque ella ya no viva.\n@c0@"
  fr: "@aSancho@bJ-Je sens toujours le p-pouvoir de la señora\r\nMagdalena dans cette ville, même si elle est\r\nm-morte.\n@c0@"
  it: "@aSancho@bLa povera señora Mada sia muerta, ma yo avverto ancoras la sua presenza...\n@c0@"
  ja: "@a@bサンチョ「マーサさまが\n\t亡くなられた今も　町のチカラは\n\t消えてはいないようですね。\n@c0@"
14:
  de: "@aSancho@bAber sie ist in die Himmel und schaut auf uns herab, da bin iss ganz sisser...\n@c0@"
  en: "@aSancho@bEes reaching us, even from the heavens, eso far, far away.\n@c0@"
  es: "@aSancho@bLlega hasta nosotros incluso desde el cielo, tan apartado.\n@c0@"
  fr: "@aSancho@bIl nous v-vient des cieux, de très très loin.\n@c0@"
  it: "@aSancho@bTua madre ce protegge anche da lassù, chico, ne soy seguro.\n@c0@"
  ja: "@a@bサンチョ「きっと　天のかなたより\n\tマーサさまの　おチカラが\n\t届いているのでしょう。\n@c0@"
15:
  de: "@aOtto@bMein Kampfeswille ist ungebrochen! Schließlich ist Gewinnen nur eine Frage der Einstellung. Solange wir net aufgeben, können wir auch siegen!\n@c0@"
  en: "@aTuppence@bThere's still plenty of fight in me! Winning is all about attitude. As long as you never give in, victory can't be too far away.\n@c0@"
  es: "@aAlazar@b¡Aún me quedan ganas de luchar! Para ganar, lo importante es la actitud. Mientras no te rindas, la victoria puede ser tuya.\n@c0@"
  fr: "@aInnocent@bJ'ai encore beaucoup de ressourcesⓠ La victoire est une question d'état d'esprit. Tant que vous n'abandonnez pas, la victoire est possible.\n@c0@"
  it: "@aSimon@bMaestà, sono pronto a combattere!\nSe ce la metteremo tutta, la vittoria non potrà sfuggirci!\n@c0@"
  ja: "@a@bピピン「ええ　ボクは　あきらめません！\n\tあきらめない限り　勝利は\n\t限りなく近づくものですよね！\n@c0@"
16:
  de: "@a%0%a001240@bIch dachte, der Schleim würde ihn ärgern, aber es sieht ganz so aus, als wären sie Freunde.\n@c0@"
  en: "@a%0%a001240@bI thought that slime was picking on him for a minute, but it looks like they're friends.\n@c0@"
  es: "@a%0%a001240@bCreí que ese limo lo estaba poniendo verde, pero parece que son amigos.\n@c0@"
  fr: "@a%0%a001240@bPendant une seconde, j'ai cru que ce gluant l'embêtait, mais on dirait qu'ils sont copains.\n@c0@"
  it: "@a%0%a001240@bQuanto tempo ci vorrà perché uno slime si trasformi in un essere umano?\n@c0@"
  ja: "@a@b%a001240「子供が　スライムに\n\tいじめられてるのかと思ったら\n\t友だちだったんだね。\n@c0@"
17:
  de: "@a%0%a001250@bSchnodder? Wer kommt denn auf die Idee, einen Schleim Schnodder zu nennen?!\n@c0@"
  en: "@a%0%a001250@bRocket? Who would give a slime a name like Rocket!?\n@c0@"
  es: "@a%0%a001250@b¿Rocket? ¡¿A quién se le ocurriría llamar Rocket a un limo?!\n@c0@"
  fr: "@a%0%a001250@bGlubulleⓡ Qui appellerait un gluant Glubulleⓠⓑ\n@c0@"
  it: "@a%0%a001250@bRazzo?!\nMa ti sembra un nome adatto a uno Slime, eh?!\n@c0@"
  ja: "@a@b%a001250「スラタロウ……。\n\tだれが　名前つけたのかな……。\n@c0@"
18:
  de: "@a%0%a001250@bHa ha! Dieser Schleim hat aber ein lustiges Gesicht.\n@c0@"
  en: "@a%0%a001250@bHa ha! That slime had a really funny face.\n@c0@"
  es: "@a%0%a001250@b¡Ja, ja! Ese limo tenía una cara muy graciosa.\n@c0@"
  fr: "@a%0%a001250@bHa haⓠ Ce gluant avait vraiment une tête marrante.\n@c0@"
  it: "@a%0%a001250@bChe carino quello Slime!\nHa proprio un'espressione simpatica!\n@c0@"
  ja: "@a@b%a001250「うふふ。\n\tさっきの　スライムさん\n\tおもしろい顔してる！\n@c0@"
19:
  de: "@aBianca@bAlso gibt es nur eine Stadt in der Unterwelt. Danach sind wir wohl ab jetzt auf uns allein gestellt, was?\n@c0@"
  en: "@aBianca@bSo there's only one town in the whole place. Looks like we're on our own from here on in then, eh?\n@c0@"
  es: "@aBianca@bDe modo que en este sitio hay una sola ciudad. Parece que a partir de ahora tendremos que arreglárnoslas solos, ¿eh?\n@c0@"
  fr: "@aBianca@bIl n'y a donc qu'une ville dans ce monde. Alors on est livrés à nous-mêmes partout ailleurs, heinⓡ\n@c0@"
  it: "@aBianca@bQuesto è l'unico centro abitato di tutta Nadiria. Fuori dal villaggio non potremo contare che sulle nostre forze, amore mio. Dobbiamo essere pronti a tutto.\n@c0@"
  ja: "@a@bビアンカ「ただ　ひとつの町ですって。\n\tということは　この先には\n\tもう　助けはないってことね。\n@c0@"
20:
  de: "@aNera@bHast du die Blumen dort hinten gesehen? Sie hat ihren eigenen kleinen Garten!\n@c0@"
  en: "@aNera@bDid you see the flowers there? She's got her own little garden going.\n@c0@"
  es: "@aNera@b¿Has visto esas fiori? Ha plantado su propio jardín.\n@c0@"
  fr: "@aNera@bTu as vu ces fleursⓡ Elle a son propre petit jardin.\n@c0@"
  it: "@aNera@bUn giardino nel Regno degli Inferi...\nNon credevo che anche qui potessero sbocciare i fiori... La forza della natura è davvero immensa!\n@c0@"
  ja: "@a@bフローラ「お花まで　咲いていて……。\n\tちょっとした　空中庭園の\n\tようですわね。\n@c0@"
21:
  de: "@a%0%a001240@bWow. Hier wohnen ja eine Menge Leute. Wer hätte das gedacht?\n@c0@"
  en: "@a%0%a001240@bWow. There are loads of people living here.\nI never expected that.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! Aquí vive un montón de gente.\nNunca lo hubiera imaginado.\n@c0@"
  fr: "@a%0%a001240@bWaouh. Il y a vraiment beaucoup d'habitants ici.\nJe ne l'aurais jamais cru.\n@c0@"
  it: "@a%0%a001240@bAccidenti, quanta gente!\nNon avevo idea che qui vivessero tante persone, sai?\n@c0@"
  ja: "@a@b%a001240「わあ　たくさんの人が\n\t住んでいるんだね。\n\tおどろいたよ。\n@c0@"
22:
  de: "@a%0%a001250@bDieser Ort ist zwar seltsam, hat aber eine angenehme Atmosphäre. Es ist überhaupt nicht unheimlich.\n@c0@"
  en: "@a%0%a001250@bThis place has a strange feel to it. A sort of warmth. It's not scary at all.\n@c0@"
  es: "@a%0%a001250@bEste lugar me produce una sensación peculiar. Es como acogedor. No da nada de miedo.\n@c0@"
  fr: "@a%0%a001250@bCet endroit est vraiment étrange. Une sorte de chaleur s'en dégage. Il ne fait pas peur du tout.\n@c0@"
  it: "@a%0%a001250@bQuesto luogo non mi mette affatto paura.\nSi respira un'atmosfera calma, quasi rassicurante...\n@c0@"
  ja: "@a@b%a001250「あのね。\n\tここだけ　ふしぎな感じ。\n\tあったかくて　こわくないの……。\n@c0@"
23:
  de: "@aOtto@bDiese Stadt heißt also Präkaries, ja? Oder war es Prokuria? Nein... Ich glaube, sie sagte Promiskuitus!\n@c0@"
  en: "@aTuppence@bSo this place is called Precarius, is it?\r\nOr was it Precautionary? No... I do believe\r\nshe said Promiscuous!\n@c0@"
  es: "@aAlazar@bAsí que este sitio se llama Precaria, ¿no?\n¿O era Precavida? No... ¡Creo que ella lo llamó Promiscua!\n@c0@"
  fr: "@aInnocent@bCet endroit s'appelle Précarius, c'est çaⓡ\nOu Précarréⓡ Non... je crois qu'elle a dit Passionariaⓠ\n@c0@"
  it: "@aSimon@bE così questo villaggio si chiama Civitascura...\nMi sembra un nome appropriato, per un luogo situato nel Regno degli Inferi...\n@c0@"
  ja: "@a@bピピン「ここが　ジャナンハですか。\n\tん？　ハナンジャ…　あれ？\n\tナンジャハ　だったかな？？\n@c0@"
24:
  de: "@aBianca@bWer hätte das gedacht? Deine Mutter scheint hier als eine Art Retterin angesehen zu werden...\n@c0@"
  en: "@aBianca@bNow there's a surprise. Sounds like your\r\nmum's thought of as somethin' of a saviour\r\n'round these parts.\n@c0@"
  es: "@aBianca@bMenuda sorpresa. Parece que a tu madre la tienen por una especie de salvadora aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vraiment surprenant. On dirait que ta maman est considérée comme une bienfaitrice par ici.\n@c0@"
  it: "@aBianca@bGli abitanti del luogo considerano tua madre la loro salvatrice...\n@c0@"
  ja: "@a@bビアンカ「おどろいたわ。\n\tお母さまが　この町の\n\t救い主だったなんて。\n@c0@"
25:
  de: "@aNera@bWie deine Mutter sich bloß gefühlt haben muss... Sie rettet diesen Ort, obwohl sie selbst Hilfe benötigt hätte.\n@c0@"
  en: "@aNera@bI wonder how your mother can have felt, rescuing this place when she was in dire need of being rescued herself.\n@c0@"
  es: "@aNera@bQué sentiría la tua mamma al salvar este sitio, cuando era ella la que necesitaba que la salvaran.\n@c0@"
  fr: "@aNera@bJe me demande ce que ta mère a pu ressentir. Sauver cet endroit alors qu'elle avait besoin d'aide elle-même...\n@c0@"
  it: "@aNera@bTua madre dev'essere una delle persone più generose mai esistite.\n㈡\nHa pensato a rendere questo posto vivibile, quando lei era la prima ad aver bisogno di essere aiutata.\n@c0@"
  ja: "@a@bフローラ「とらわれたまま　この町を\n\tどんな想いで　救われたのかしら……。\n\tああ　お母さま……。\n@c0@"
26:
  de: "@a%0%a001240@bJetzt verstehe ich. Es ist das Weihwasser, das die Monster von diesem Ort fernhält.\n@c0@"
  en: "@a%0%a001240@bI get it. It must be the holy water that keeps the monsters away from this place.\n@c0@"
  es: "@a%0%a001240@bYa lo entiendo. Debe ser el agua bendita lo que mantiene a los monstruos alejados.\n@c0@"
  fr: "@a%0%a001240@bJ'ai compris. Ça doit être l'eau sacrée qui empêche les monstres de s'approcher.\n@c0@"
  it: "@a%0%a001240@bHo capito!\nDev'essere l'acqua santa che tiene lontani i mostri cattivi!\n@c0@"
  ja: "@a@b%a001240「ふ～ん…　この町の中に\n\t魔物が　入ってこられないのは\n\t聖なる水の　おかげなんだね。\n@c0@"
27:
  de: "@a%0%a001250@bIch hoffe, dass wir Großmutter bald finden. Sie scheint ja etwas ganz Besonderes zu sein.\n@c0@"
  en: "@a%0%a001250@bI hope we get to meet Grandma soon.\nShe sounds really special.\n@c0@"
  es: "@a%0%a001250@bEspero que encontremos pronto a la abuela.\nParece una persona muy especial.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'on verra bientôt grand-mère.\nElle a l'air vraiment spéciale.\n@c0@"
  it: "@a%0%a001250@bHo fretta di conoscere nonna Mada!\nDev'essere una persona davvero speciale!\n@c0@"
  ja: "@a@b%a001250「わたし　早く\n\tおばあちゃんに会いたいな。\n\tきっと　ステキな人だもん。\n@c0@"
28:
  de: "@aSancho@bQué? Magdalena? Das ist die Name von Señora Magda! Glaubst du, sie war hier, in diese Stadt?!\n@c0@"
  en: "@aSancho@bQué!? Madalena? Thees ees the name of señora Mada! You mean, eshe was here, een thees town!?\n@c0@"
