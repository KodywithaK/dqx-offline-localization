  it: "@a%0%a001250@bUna bacchetta di Stolos?! Non credevo che ne avremmo trovata una qui! Buon per noi!\nQuest'oggettino potrà esserci molto utile.\n@c0@"
  ja: "@a@b%a001250「こんなところにも\n\tストロスの杖が　あったなんて……。\n\tまた　この杖を持てて　うれしいな。\n@c0@"
61:
  de: "@aBianca@bZum Glück gibt es in Nadiria wenigstens eine Herberge, was?\n@c0@"
