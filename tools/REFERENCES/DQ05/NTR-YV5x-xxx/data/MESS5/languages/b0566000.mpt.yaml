  es: "@aBianca@bEs buena cosa que tengamos una posada aquí en Nadiria, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien qu'il y ait une auberge à Nadiria, heinⓡ\n@c0@"
  it: "@aBianca@bPer fortuna abbiamo trovato una locanda...\n@c0@"
  ja: "@a@bビアンカ「魔界にも　宿屋があるなんて\n\t助かるわね。\n@c0@"
62:
  de: "@a%0%a001250@bWow! Sieh dir nur all die Bücher an! Das ist ja fast wie in einer Bibliothek...\n@c0@"
  en: "@a%0%a001250@bWow! Look at all those books! This place is more like a library than an inn.\n@c0@"
  es: "@a%0%a001250@b¡Vaya! ¡Mira cuántos libros! Este sitio parece más una biblioteca que una posada.\n@c0@"
  fr: "@a%0%a001250@bWaouhⓠ Regarde tous ces livresⓠ On se croirait plus dans une bibliothèque que dans une auberge.\n@c0@"
  it: "@a%0%a001250@bAccidenti, quanti libri!\nQuesto posto sembra più una biblioteca che una locanda!\n@c0@"
  ja: "@a@b%a001250「わ～　宿屋さんなのに\n\t本が　いっぱい。\n@c0@"
63:
  de: "@aBianca@bWill er damit sagen, dass Nimzo gewaltsam in die Welt der Menschen eindringen könnte?\n@c0@"
  en: "@aBianca@bIs he sayin' Nimzo might force his way into the\r\nhuman world?\n@c0@"
  es: "@aBianca@b¿Qué dice? ¿Que Nimzo podría irrumpir en el mundo humano?\n@c0@"
  fr: "@aBianca@bIl veut dire que Nimzo pourrait se frayer un chemin jusqu'au monde des humainsⓡ\n@c0@"
  it: "@aBianca@bNon vorrà mica dire che Nimzo sta per attaccare il mondo degli uomini?!\n@c0@"
  ja: "@a@bビアンカ「大魔王みずからが\n\tオモテの世界にですって？\n@c0@"
64:
  de: "@aBianca@bDas wäre ja schrecklich. Wir müssen ihn aufhalten, bevor es so weit kommt.\n@c0@"
  en: "@aBianca@bThat'd be terrible. We have to stop him before it comes to that.\n@c0@"
  es: "@aBianca@bSería horroroso. Debemos detenerle antes de que pueda hacerlo.\n@c0@"
