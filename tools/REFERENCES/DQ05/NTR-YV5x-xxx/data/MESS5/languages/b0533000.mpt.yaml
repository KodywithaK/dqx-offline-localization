0:
  de: "@a%0%a001240@bWenn ich schon größer gewesen wäre, als Mama entführt wurde, hätte ich vielleicht was tun können.\n@c0@"
  en: "@a%0%a001240@bIf only I'd been bigger when Mum was snatched away, then I could've done something.\n@c0@"
  es: "@a%0%a001240@bSi yo hubiera sido mayor cuando secuestraron a mamá, podría haber hecho algo.\n@c0@"
  fr: "@a%0%a001240@bSi seulement j'avais été plus grand quand maman a été enlevée... j'aurais pu faire quelque chose.\n@c0@"
  it: "@a%0%a001240@bSe io fossi stato più grande quando la mamma venne portata via, avrei dato una bella lezione ai suoi rapitori!\n@c0@"
  ja: "@a@b%a001240「……くやしいんだ。\n\tお母さんが　さらわれた時\n\tボクが　もっと大きかったら……。\n@c0@"
1:
  de: "@a%0%a001250@bIch war schon einmal hier, mit Sancho und %a001240. Wir wollten all die Orte sehen, an denen du auch gewesen bist.\n@c0@"
  en: "@a%0%a001250@bI came here before with Sancho and %a001240. We wanted to see the places you'd been through yourself.\n@c0@"
  es: "@a%0%a001250@bYa he estado aquí con Sancho y %a001240. Queríamos ver los sitios por los que tú habías pasado.\n@c0@"
  fr: "@a%0%a001250@bJe suis déjà venue ici avec Sancho et %a001240. On voulait voir les endroits où tu étais toi-même passé.\n@c0@"
  it: "@a%0%a001250@bSono già stata qui insieme a %a001240 e allo zio Sancho.\nVolevamo vedere i luoghi che avevi visitato.\n@c0@"
  ja: "@a@b%a001250「%a001240と　サンチョと\n\tいっしょに　ここへ来たの。\n\tお父さんのたどった道を見てみたくて。\n@c0@"
2:
  de: "@a%0%a001240@bDu bist schon einmal hier gewesen mit einem Paar Flügelschuhe, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bYou came here before with some talaria,\ndidn't you, Dad?\n@c0@"
  es: "@a%0%a001240@bLlegaste aquí con unas sandalias aladas, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bTu es déjà venu ici avec des chaussures ailées, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, tu sei già stato qui, non è vero?\nLo zio Sancho mi ha detto che usasti dei talari...\n@c0@"
  ja: "@a@b%a001240「お父さんは　昔　\n\tそらとぶくつで　ここに\n\t来たことが　あるんでしょ？\n@c0@"
3:
  de: "@a%0%a001240@bIch frage mich, wie man auf die Idee kommt, solche Schuhe herzustellen...\n@c0@"
  en: "@a%0%a001240@bI wonder who would make flying shoes like that. What a funny idea!\n@c0@"
  es: "@a%0%a001240@bMe pregunto quién hará esos zapatos voladores. ¡Qué idea tan graciosa!\n@c0@"
  fr: "@a%0%a001240@bJe me demande qui peut bien s'amuser à fabriquer des chaussures volantes. Quelle drôle d'idéeⓠ\n@c0@"
  it: "@a%0%a001240@bCerto che bisogna avere un bel po' di fantasia per creare un paio di scarpe volanti, non credi?\n@c0@"
  ja: "@a@b%a001240「そらとぶくつ　なんて\n\t誰が　作ったのかなあ。\n@c0@"
4:
  de: "@aSancho@bEs ist gar nisst schön, wieder hier zu sein.\n@c0@"
  en: "@aSancho@bI no eso happy to be here again.\n@c0@"
  es: "@aSancho@bNo me hace muy feliz volver acá.\n@c0@"
  fr: "@aSancho@bJe ne suis p-p-pas très heureux de r-revenir ici.\n@c0@"
  it: "@aSancho@bNo me gusta estare aquí, chico.\nEsto luego me fa venire en mente cosas muy tristes...\n@c0@"
  ja: "@a@bサンチョ「……ここに来るのは\n\tあまり　好きじゃないんです。\n@c0@"
5:
  de: "@aSancho@bWenn iss an all den Schmerz und das Leid denke, das du durchmachen musstest, Chico, werde iss ganz traurig... (Schluchz)\n@c0@"
  en: "@aSancho@bWhen I theenk about all the pain and the esuffering you have been through, friend, eet, eet makes me eso miserable... (sob)\n@c0@"
  es: "@aSancho@bCuando pienso en todo el dolor y sufrimiento que has pasado, chamaquito, me pongo retetriste... (snif)\n@c0@"
  fr: "@aSancho@bQuand je pense à t-t-toute la souffrance que tu as endurée, chico, ça me r-r-rend très triste... (snif)\n@c0@"
  it: "@aSancho@bSe pienso a todas las sofferenzas que hai dovuto sopportare...\r\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あの時の　坊っちゃんの\n\tくやしさや　つらさを思うと\n\t私は　もう……！　うっうっ……。\n@c0@"
6:
  de: "@aOtto@bDieser Kanzler... Die Menschen können ganz schön seltsam werden, wenn Monster im Spiel sind...\n@c0@"
  en: "@aTuppence@bWhen I think about the Chancellor, it strikes\r\nme how odd people can be, being taken in\r\nby monsters like that.\n@c0@"
  es: "@aAlazar@bCuando pienso en el Canciller, me sorprende pensar que alguien se pueda dejar engañar así por los monstruos.\n@c0@"
  fr: "@aInnocent@bQuand je pense au chancelier, je me dis que les gens peuvent être vraiment bizarres parfois, pour se faire avoir comme ça par des monstres.\n@c0@"
  it: "@aSimon@bAncora non riesco a credere che una persona colta e seria come il ministro Ligio si sia fatta abbindolare dai mostri. Mi sembra una cosa fuori dal mondo!\n@c0@"
  ja: "@a@bピピン「大臣のことは　うかがっています。\n\t魔物に　つけ込まれるなんて\n\t人間の心って　わからないものですね。\n@c0@"
7:
  de: "@aBianca@bIch glaube, ich bin hier vorbeigekommen, als die Monster mich entführt haben, aber ich bin mir nicht sicher.\n@c0@"
  en: "@aBianca@bI think I came by here when the monsters snatched me, but I can't be sure.\n@c0@"
  es: "@aBianca@bCreo que pasé por aquí cuando me secuestraron los monstruos, pero no estoy nada segura, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que je suis passée par ici quand les monstres m'ont enlevée, mais je n'en suis pas absolument certaine.\n@c0@"
  it: "@aBianca@bSe non sbaglio, i mostri mi portarono qui subito dopo avermi rapita, ma non ne sono del tutto sicura...\n@c0@"
  ja: "@a@bビアンカ「魔物にさらわれたとき\n\tこのあたりを　通ったんだと思うけど\n\tあまり　おぼえてないな……。\n@c0@"
8:
  de: "@aNera@bIch hatte gar nicht so viel Angst, als die Monster mich entführt haben.\n@c0@"
  en: "@aNera@bI wasn't all that scared when the monsters snatched me away.\n@c0@"
  es: "@aNera@bNo tenía tanto miedo cuando me secuestraron los mostri.\n@c0@"
  fr: "@aNera@bJe n'ai pas eu si peur que ça quand les monstres m'ont enlevée.\n@c0@"
  it: "@aNera@bRicordo che non ero spaventata quando i mostri mi rapirono...\n@c0@"
  ja: "@a@bフローラ「魔物にさらわれたときは\n\t別に　こわくなかったの。\n@c0@"
9:
  de: "@aNera@bIch habe mir viel mehr Sorgen darum gemacht, dass du verletzt werden könntest, wenn du versuchst, mich zu retten.\n@c0@"
  en: "@aNera@bI was much more worried about you getting hurt if you tried to come and rescue me.\n@c0@"
  es: "@aNera@bMe daba molto più miedo que te hirieran a ti si venías a rescatarme.\n@c0@"
  fr: "@aNera@bJe craignais surtout que tu puisses être blessé en essayant de venir à mon secours.\n@c0@"
  it: "@aNera@bIn realtà cominciai a preoccuparmi solo quando pensai ai rischi che avresti corso se fossi venuto a cercarmi...\n@c0@"
  ja: "@a@bフローラ「助けに来てくれた　あなたが\n\t傷つくほうが　ずっとこわかった……。\n@c0@"
10:
  de: "@a%0%a001240@bIch weiß alles darüber! Normale Tinte verblasst und wird schwer lesbar, wenn sie alt ist.\n@c0@"
  en: "@a%0%a001240@bI know all about this! Normal ink goes all faint and hard to read if it's left for a long time.\n@c0@"
  es: "@a%0%a001240@b¡Eso lo sé bien! Con el tiempo, la tinta normal se va desdibujando y es difícil leerla.\n@c0@"
  fr: "@a%0%a001240@bJe sais tout, là-dessusⓠ Après un certain temps, l'encre normale pâlit et devient difficile à lire.\n@c0@"
  it: "@a%0%a001240@bLo so!\nUna suora a Denim mi ha spiegato che l'inchiostro normale scolorisce con il trascorrere del tempo!\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\tふつうのインクは　時間がたつと\n\tうすくなったり　消えたりするから……\n@c0@"
11:
  de: "@a%0%a001240@bAlso müssen die Leute alles wieder neu schreiben, damit die Schrift nicht verloren geht. Ich weiß noch, wie die Nonne in Humburg immerzu geschrieben hat.\n@c0@"
  en: "@a%0%a001240@bSo people have to rewrite everything before it ends up impossible to read. I remember the nun in Gotha doing it.\n@c0@"
  es: "@a%0%a001240@bAsí que la gente tiene que reescribirlo todo antes de que sea imposible leerlo. Me acuerdo de que la monja de Pankraz hacía eso.\n@c0@"
  fr: "@a%0%a001240@bAlors des gens doivent tout réécrire avant que ça devienne vraiment impossible à déchiffrer. C'est ce que faisait la religieuse, à Gotha.\n@c0@"
  it: "@a%0%a001240@bCosì è necessario fare delle copie dei libri prima che diventino illeggibili.\nÈ un lavoro affascinante, non è vero?\n@c0@"
  ja: "@a@b%a001240「読めなくなる前に　内容を\n\t書きうつさないと　いけないんだよね。\n\tグランバニアのシスターも　やってた。\n@c0@"
12:
  de: "@aNera@bIch habe das Manuskript einmal gesehen, als ich in der Abtei war. Es ist eine wundervolle Arbeit.\n@c0@"
  en: "@aNera@bI remember being shown the manuscript during my time at the abbey. It's a wonderful piece of work.\n@c0@"
  es: "@aNera@bRicordo que me enseñaron el manuscrito cuando estaba en la abadía. Es una obra maravillosa.\n@c0@"
  fr: "@aNera@bJe me souviens que l'on m'a montré le manuscrit, pendant mon séjour à l'abbaye. C'est un ouvrage magnifique.\n@c0@"
  it: "@aNera@bRicordo di aver visto una copia del libro quando ero all'Abbazia di Su'ncyel.\nÈ un libro meraviglioso...\n@c0@"
  ja: "@a@bフローラ「私も　昔　修道院にいた頃\n\t見せていただきましたが　本当に\n\tすばらしい書　でした。\n@c0@"
13:
  de: "@aNera@bStell dir nur vor, eigens dafür wurde eine Tinte hergestellt! Das beweist doch, wie großartig dieses Manuskript sein muss.\n@c0@"
  en: "@aNera@bImagine being written in its own special ink!\r\nThat shows how grand it must be.\n@c0@"
  es: "@aNera@b¡Incluso está escrito con su propia tinta speciale!\nEso demuestra lo importante que debe de ser.\n@c0@"
  fr: "@aNera@bÉcrit avec cette encre spéciale, imagine un peuⓠ\nÇa prouve à quel point c'est une œuvre importante. \n@c0@"
  it: "@aNera@bPerò non immaginavo che fosse stato scritto con un inchiostro speciale.\nCiò lo rende ancora più prezioso!\n@c0@"
  ja: "@a@bフローラ「わざわざ　特別なインクを\n\t使用して　お書きになるだけのことは\n\tありましたわ。\n@c0@"
14:
  de: "@a%0%a001240@bEs ist komisch, in einer Herberge mit einer Kirche zu schlafen. Aber vielleicht wacht die Göttin ja über die Menschen, die hier übernachten.\n@c0@"
  en: "@a%0%a001240@bIt's weird to find an inn with a church upstairs.\nBut maybe it means the Goddess watches over\npeople who sleep here.\n@c0@"
  es: "@a%0%a001240@bEs extraño encontrar una posada con una iglesia arriba.\n㈡\nPero tal vez eso signifique que la Diosa vela por la gente que duerme aquí.\n@c0@"
  fr: "@a%0%a001240@bC'est bizarre de trouver une auberge avec une église à l'étage. Peut-être que ça veut dire que la Déesse veille d'en haut sur ceux qui dorment ici. \n@c0@"
  it: "@a%0%a001240@bNon avevo mai visto una locanda che avesse al suo interno una chiesa! Forse anche la dea pernotta qui ogni tanto?\n@c0@"
  ja: "@a@b%a001240「教会の下に　宿屋があるなんて\n\t変わってるね。　でも　ここに泊まると\n\t神さまに　見守ってもらえるかな？\n@c0@"
15:
  de: "@a%0%a001240@bIst das diese besondere Tinte, von der alle reden? Die würde ich gern mal ausprobieren!\n@c0@"
  en: "@a%0%a001240@bIs this the amazing ink people talk about so much?\nI'd love to try using it sometime!\n@c0@"
  es: "@a%0%a001240@b¿Esta es la tinta maravillosa de la que tanto habla la gente?\n¡Me encantaría usarla alguna vez!\n@c0@"
  fr: "@a%0%a001240@bC'est cette encre incroyable dont tout le monde parle tantⓡ J'adorerais l'essayer, un jourⓠ\n@c0@"
  it: "@a%0%a001240@bÈ questo l'inchiostro speciale di cui ho sentito parlare?\nMi piacerebbe usarlo qualche volta, sai?\n@c0@"
  ja: "@a@b%a001240「これが　そのすごいインク？\n\tいいなあ……\n\tボクも　いつか　使ってみたいな！\n@c0@"
16:
  de: "@a%0%a001250@bGlaubst du wirklich, dass sie nicht verblasst, selbst nach hundert oder tausend Jahren?\n@c0@"
  en: "@a%0%a001250@bDo you think this ink really stays put for, say, a hundred or even a thousand years?\n@c0@"
  es: "@a%0%a001250@b¿Crees que esta tinta dura hasta cien o incluso mil años?\n@c0@"
  fr: "@a%0%a001250@bTu crois que cette encre dure vraiment, disons... cent ou mille ansⓡ\n@c0@"
  it: "@a%0%a001250@bMa davvero quest'inchiostro non scolorisce nemmeno dopo cent'anni?\nNemmeno dopo mille anni?!\n@c0@"
  ja: "@a@b%a001250「このインク\n\t１００年とか　１０００年とかたっても\n\t本当に　消えないのかな？\n@c0@"
17:
  de: "@a%0%a001250@bDas heißt aber auch, dass man keine Fehler beim Schreiben machen darf, sonst lachen einen die Leute in der Zukunft ja aus...\n@c0@"
  en: "@a%0%a001250@bThat means you can't write anything too weird, otherwise people in the future will be laughing\nat you.\n@c0@"
  es: "@a%0%a001250@bEso significa que no puedes escribir tonterías, porque entonces la gente del futuro se reiría de ti.\n@c0@"
  fr: "@a%0%a001250@bÇa veut dire qu'il ne faut pas écrire de bêtises avec, sinon les gens du futur se moqueront de nous.\n@c0@"
  it: "@a%0%a001250@bAllora dovrei stare attenta a non scrivere sciocchezze, altrimenti la gente riderebbe di me per l'eternità!\n@c0@"
  ja: "@a@b%a001250「あんまり　変なこと書けないね。\n\t知らない　未来の人に笑われたら\n\tやだもん。\n@c0@"
18:
  de: "@aSancho@bMadre mía! Sie reift mehrere Jahre?! Du musst gut auf sie aufpassen, Chico.\n@c0@"
  en: "@aSancho@bAnda! Ees cooking for eseveral years!?\nYou must look after eet well, friend.\n@c0@"
  es: "@aSancho@b¡Ándale! ¿Se madura varios años?\nDebes cuidarla bien, chamaco.\n@c0@"
  fr: "@aSancho@bAndaⓠ Elle macère p-p-pendant plousieurs annéesⓡⓐ Tu dois en p-p-prendre bien soin, alors, chico.\n@c0@"
  it: "@aSancho@b¡Caramba! ¿Ce vuole un saccos de tiempo por preparare esto inchiostro, sì?\r\n¡Abbine curas, chico! Es una cosa muy preciosa...\n@c0@"
  ja: "@a@bサンチョ「何年もかけて　じゅくせいとは\n\tいやはや　大変ですね。\n\t大事にしましょうね　坊っちゃん。\n@c0@"
19:
  de: "@aOtto@bGlaubt Ihr wirklich, wir können diese Tinte annehmen, wenn es so schwierig war, sie herzustellen? Wahrscheinlich kostet sie ein Vermögen!\n@c0@"
  en: "@aTuppence@bDo you think it's really alright for us to accept this ink if it took so much effort to make it? I should imagine it would cost a fortune to buy.\n@c0@"
  es: "@aAlazar@b¿Creéis que está bien aceptar una tinta que cuesta tanto esfuerzo fabricar? Supongo que comprarla costaría una fortuna.\n@c0@"
  fr: "@aInnocent@bVous croyez qu'on fait bien d'accepter cette encre\nsi sa fabrication représente autant d'effortsⓡ\nElle doit coûter une fortune.\n@c0@"
  it: "@aSimon@bChe fortuna ricevere in dono quest'inchiostro pregiato, eh? Se avessimo dovuto comprarlo, avremmo speso un occhio della testa!\n@c0@"
  ja: "@a@bピピン「そんなに　苦労して作ったインクを\n\tもらっちゃって　いいんでしょうか？\n\t買うと　すごく高そうですよ　コレ。\n@c0@"
20:
  de: "@a%0%a001240@bIch habe den Mann schon mal gesehen. Er arbeitet bereits seit Jahren an der Tinte.\n@c0@"
  en: "@a%0%a001240@bI've seen that man here before. He's been working on that ink for ages.\n@c0@"
  es: "@a%0%a001240@bHe visto antes a este hombre. Lleva siglos trabajando en esa tinta.\n@c0@"
  fr: "@a%0%a001240@bJ'ai déjà vu cet homme ici. Ça fait des années qu'il travaille sur cette encre.\n@c0@"
  it: "@a%0%a001240@bSono anni che quel signore lavora alla realizzazione dell'inchiostro. Chissà se ogni tanto se ne va in giro a prendere una boccata d'aria...\n@c0@"
  ja: "@a@b%a001240「あの学者さま　前にも\n\tここで　見たことがあるよ。\n\tずっと　インクを　作ってたんだね。\n@c0@"
21:
  de: "@aOtto@bAlso, wenn Ihr die Tinte net wollt, %a000090, könnte ich... Nein, natürlich net. Ich bin mir sicher, Ihr habt recht.\n@c0@"
  en: "@aTuppence@bI say! If you don't want any, %a000090, then I'd beⓚⓛ No, never mind. I'm sure you're right.\n@c0@"
  es: "@aAlazar@b¡Vaya! Si vos no la queréis, %a000090, yo estaría... No, déjalo. Seguro que tenéis razón.\n@c0@"
  fr: "@aInnocent@bBen çaⓠ Si vous n'en voulez pas, %a000090, moi je serais rav... Euh, non, rien. Vous avez sûrement raison.\n@c0@"
  it: "@aSimon@bMaestà, se lei non lo vuole l'inchiostro, lo prendo io!\n㈡\nLo userò per scrivere ⓕSimon è stato quiⓖ ovunque andiamo, così da lasciare una traccia eterna del mio passaggio!\n@c0@"
  ja: "@a@bピピン「えっ　%a000090さまが\n\tいらないんでしたら　このボクが……\n\tいえ　なんでもないです。\n@c0@"
22:
  de: "@a%0%a001250@bEr ist so glücklich mit seiner Tinte, dass er an gar nichts anderes mehr denken kann!\n@c0@"
  en: "@a%0%a001250@bHe seems so happy that he's succeeded that he can't manage to think of anything else!\n@c0@"
  es: "@a%0%a001250@b¡Parece tan feliz de haberlo conseguido que no es capaz de pensar en otra cosa!\n@c0@"
  fr: "@a%0%a001250@bIl semble tellement content d'avoir réussi qu'il n'arrive à penser à rien d'autreⓠ\n@c0@"
  it: "@a%0%a001250@bQuel tipo è così orgoglioso di aver raggiunto il suo scopo che vorrebbe farlo sapere al mondo intero! \n@c0@"
  ja: "@a@b%a001250「学者さま\n\tできあがったのが　うれしくて\n\tなにも　考えられないのかな？\n@c0@"
23:
  de: "@a%0%a001240@bWenn ich er wäre, würde ich allen das Geheimnis verraten und sie Tinte für mich machen lassen.\n@c0@"
  en: "@a%0%a001240@bIf I were him, I'd tell everyone how it's done and have them all making ink for me.\n@c0@"
  es: "@a%0%a001240@bSi yo fuera él, le diría a todo el mundo como se hace y los pondría a todos a fabricarme tinta.\n@c0@"
  fr: "@a%0%a001240@bSi j'étais lui, j'expliquerais à tout le monde comment\nla fabriquer et je laisserais les gens s'en charger à ma place.\n@c0@"
  it: "@a%0%a001240@bSe fossi in lui, assumerei qualche aiutante e inizierei a produrre in serie l'inchiostro speciale!\n@c0@"
  ja: "@a@b%a001240「ボクだったら　インクの作り方を\n\tみんなに教えてあげて　みんなに\n\t使ってもらうんだけどな。\n@c0@"
24:
  de: "@a%0%a001250@bMit diesen regionalen Spezialitäten kann man viel Geld machen. Darum sind sie wohl auch so wichtig für die Leute.\n@c0@"
  en: "@a%0%a001250@bThese local specialities can bring in so much\nmoney to places. I suppose that's why they're\nso important to people.\n@c0@"
  es: "@a%0%a001250@bLos productos típicos pueden traer mucho dinero a los sitios. Supongo que por eso son importantes para la gente.\n@c0@"
  fr: "@a%0%a001250@bCes spécialités locales rapportent parfois beaucoup d'argent aux villages. C'est sûrement pour ça qu'elles sont si importantes pour les habitants.\n@c0@"
  it: "@a%0%a001250@bI prodotti tipici hanno spesso grande valore economico, ma esprimono anche gli usi e le tradizioni dei paesi di provenienza.\n㈡\nPer questo sono così importanti!\n@c0@"
  ja: "@a@b%a001250「名産は　その地域の人々の\n\t生活を支えるものなんでしょ？\n\tだから大切にしないといけないのよね。\n@c0@"
25:
  de: "@aSancho@bIss erinnere miss an diese Tinte, wir bestellten sie damals, als iss in Humburg lebte.\n@c0@"
  en: "@aSancho@bI remember thees eenk, we order eet once when I was leeving een Gotha.\n@c0@"
  es: "@aSancho@bRecuerdo esa tinta, la encargamos una vez cuando yo vivía en Pankraz.\n@c0@"
  fr: "@aSancho@bJe me souviens qu'on avait c-c-commandé cette encre oune fois, quand je vivais à Gotha.\n@c0@"
  it: "@aSancho@bMe recuerdo que cuando vivevo a Denim ordinai una certa quantità de esto inchiostro especial.\n@c0@"
  ja: "@a@bサンチョ「グランバニアでも　以前\n\t少しだけ　あのインクを\n\t買ったことがありましたっけ……。\n@c0@"
26:
  de: "@aSancho@bDamit haben Señor Ludwig und Señora Magda ihre Hochzeitsurkunde unterschrieben. Ach, war das eine glücklisse Zeit damals!\n@c0@"
  en: "@aSancho@bEet was used at the wedding of señor Pankraz and señora Mada for esigning the marriage certificate. Eet, eet was esuch a happy time!\n@c0@"
  es: "@aSancho@bSirvió para firmar el certificado del casorio del señor Teudis y la señora Perséfone. ¡Eran tiempos tan felices...!\n@c0@"
  fr: "@aSancho@bElle a servi à la s-s-signature de l'acte de mariage du señor Petros et de la señora Magdalena.\nC'était oun moment t-t-très joyeuxⓠ\n@c0@"
  it: "@aSancho@bVenne usato per los documentos del matrimonios tra el señor Russel y la señora Mada. Se pienso a quel tiempo feliz... Yo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「パパスさまと　マーサさまが\n\tご結婚なさったときの証明書を\n\t書くのに　使われたはずですよ。\n@c0@"
27:
  de: "@a%0%a001240@bIch frage mich, was das für Statuen sind. Glaubst du, Mama sieht auch so aus?\n@c0@"
  en: "@a%0%a001240@bI wonder what the statues here are of. Do you think Mum looks something like this?\n@c0@"
  es: "@a%0%a001240@bMe pregunto de qué estarán hechas esas estatuas. ¿Crees que mamá tendrá un aspecto parecido?\n@c0@"
  fr: "@a%0%a001240@bJe me demande en quoi sont faites les statues d'ici. Tu crois que maman ressemble un peu à çaⓡ\n@c0@"
  it: "@a%0%a001240@bCosa sono queste statue?\nSecondo te somigliano alla mamma?\n@c0@"
  ja: "@a@b%a001240「ここにある像って\n\tなんの像だろう？\n\tお母さんって　こんな感じかな？\n@c0@"
28:
  de: "@aBianca@bDu hast wirklich die halbe Welt mobilisiert, als du mich gesucht hast, was, %a000090?\n@c0@"
  en: "@aBianca@bYou really had everyone worried when you went off lookin' for me, %a000090.\n@c0@"
  es: "@aBianca@bTodos se preocuparon cuando saliste a buscarme, %a000090.\n@c0@"
  fr: "@aBianca@bTu as vraiment inquiété tout le monde quand tu es parti à ma recherche, %a000090.\n@c0@"
  it: "@aBianca@bCaro %a000090, facemmo preoccupare un mucchio di gente quando fummo trasformati in statue...\n@c0@"
  ja: "@a@bビアンカ「%a000090が　私を\n\t追ってきたせいで　国のみんなに\n\t心配を　かけてしまったのね。\n@c0@"
29:
  de: "@aBianca@bWie schön wäre es, wenn die Menschen sich keine Sorgen mehr machen müssten...\n@c0@"
  en: "@aBianca@bIn an ideal world, it would be nice not to have to worry them again, but still...\n@c0@"
  es: "@aBianca@bEn un mundo ideal, sería bonito que no tuvieran que volver a preocuparse, pero...\n@c0@"
  fr: "@aBianca@bDans un monde parfait, ce serait bien de ne plus avoir à les inquiéter, mais bon...\n@c0@"
  it: "@aBianca@bSpero che nessuno debba più stare in ansia per causa nostra.\n@c0@"
  ja: "@a@bビアンカ「本当なら　もう二度と\n\t国のみんなに　心配を\n\tかけちゃいけないんだけど……。\n@c0@"
30:
  de: "@aNera@bWer hätte damals gedacht, dass wir erst nach so vielen Jahren gesund und munter zurückkehren würden?\n@c0@"
  en: "@aNera@bWho would have thought back then that it would\r\nbe so many years before we returned home safe and sound?\n@c0@"
  es: "@aNera@b¿Quién habría pensado en aquel momento que tardaríamos tanto en ritornare a casa sanos y salvos?\n@c0@"
  fr: "@aNera@bQui aurait cru, à l'époque, qu'il se passerait tant d'années avant que nous rentrions chez nous sains et saufsⓡ\n@c0@"
  it: "@aNera@bChi l'avrebbe mai detto che il nostro ritorno a casa sarebbe stato tanto lungo e difficoltoso?\n@c0@"
  ja: "@a@bフローラ「あの時は　まさか　私たちが\n\t何年も　帰れないことになるとは\n\t思わなかったもの……。\n@c0@"
31:
  de: "@aNera@bEs ist eine Schande, dass wir all den Leuten so viel Ärger und Sorgen bereitet haben.\n@c0@"
  en: "@aNera@bIt's such a shame that we caused so much trouble and worry for everyone.\n@c0@"
  es: "@aNera@bEs una pena que hayamos causado tanta preoccupazione y problemas a tutti.\n@c0@"
  fr: "@aNera@bC'est vraiment dommage d'avoir dû causer tant d'inquiétude et d'ennuis à tout le monde.\n@c0@"
  it: "@aNera@bMi spiace che tante brave persone siano state in pena per causa nostra...\n@c0@"
  ja: "@a@bフローラ「みなさんに\n\t心配やめいわくを　かけてしまって\n\t本当に　申し訳なかったわ。\n@c0@"
32:
  de: "@a%0%a001240@bDie Leute haben immer schon versucht, dich zu finden, seit ich ganz klein war.\n@c0@"
  en: "@a%0%a001240@bEver since we were tiny, I remember that people were always trying their hardest to find you again.\n@c0@"
  es: "@a%0%a001240@bDesde que éramos pequeños, recuerdo a la gente esforzándose por encontrarte.\n@c0@"
  fr: "@a%0%a001240@bDéjà quand on était tout petits, je me souviens que tout le monde faisait de son mieux pour essayer de te retrouver.\n@c0@"
  it: "@a%0%a001240@bRicordo che, quando eravamo piccoli, tante persone si davano da fare per trovarti...\n@c0@"
  ja: "@a@b%a001240「ボクたちが　小さい頃から\n\tみんな　お父さんのこと\n\tずーっと　さがしてたよ。\n@c0@"
33:
  de: "@a%0%a001240@bUnd schlussendlich waren es %a001250 und ich, die dich gefunden haben, als wir endlich groß genug waren!\n@c0@"
  en: "@a%0%a001240@bAnd in the end, %a001250 and I grew big enough to be able to come looking for you ourselves.\n@c0@"
  es: "@a%0%a001240@bY finalmente, %a001250 y yo nos hicimos lo bastante mayores para poder buscarte nosotros.\n@c0@"
  fr: "@a%0%a001240@bEt finalement, %a001250 et moi sommes devenus assez grands pour pouvoir partir nous-mêmes à ta recherche.\n@c0@"
  it: "@a%0%a001240@bPoi io e %a001250 siamo cresciuti e siamo partiti anche noi alla tua ricerca.\nE ti abbiamo trovato!\n@c0@"
  ja: "@a@b%a001240「そのうち　大きくなったボクと\n\t%a001250も　お父さんを\n\tさがすようになったんだよ。\n@c0@"
34:
  de: "@a%0%a001250@bBitte geh nicht noch mal von uns weg, ja, Papa? Es war wirklich ganz schön schwierig, dich zu finden.\n@c0@"
  en: "@a%0%a001250@bDon't go disappearing again, will you, Dad.\nIt was really hard work trying to find you.\n@c0@"
  es: "@a%0%a001250@bNo vuelvas a desaparecer, ¿vale, papi?\nHa costado mucho trabajo encontrarte.\n@c0@"
  fr: "@a%0%a001250@bNe disparais plus jamais, d'accord, papaⓡ\nÇa a vraiment été très difficile de te retrouver.\n@c0@"
  it: "@a%0%a001250@bPapà, mi prometti che non sparirai mai più?\nAbbiamo fatto una fatica incredibile per trovarti...\n@c0@"
  ja: "@a@b%a001250「お父さん　もう\n\tいなくならないでね。\n\tさがすの　たいへんだから……。\n@c0@"
35:
  de: "@aSancho@bIss weiß noch, als du verschwunden warst, Chico. Prinz Sebastian ist fast umgekommen vor Sorge.\n@c0@"
  en: "@aSancho@bI remember when you were missing, friend. Prince Albert, he would no esleep unteel you were found.\n@c0@"
  es: "@aSancho@bRecuerdo bien cuando desapareciste, chamaco. El príncipe Agila no quería ni dormir hasta que te encontraran.\n@c0@"
  fr: "@aSancho@bJe me souviens qu'après ta d-d-disparition, chico,\r\nle prince Albert ne voulait plus f-f-fermer l'œil avant qu'on t'ait retrouvé.\n@c0@"
  it: "@aSancho@bEl principe Alberto era muy preoccupato cuando no se sapeva donde fossi finito, chico...\n@c0@"
  ja: "@a@bサンチョ「あの時は　オジロンさまなど\n\t坊っちゃんの無事を　確かめるまで\n\t寝ずに指揮を取るとおっしゃって。\n@c0@"
36:
  de: "@aSancho@bDu hast so eine Glück, Chico... Iss meine, Meine Majestät. Du wirst von so vielen Leuten geliebt...\n@c0@"
  en: "@aSancho@bYou are eso lucky, friend... I mean, My Majesty.\nYou are loved by eso many peoples...\n@c0@"
  es: "@aSancho@bTienes mucha suerte, chamaco. Quiero decir, Majestad.\nHay mucha gente que le estima...\n@c0@"
  fr: "@aSancho@bTu as beaucoup de chance, chico... Je veux dire, Ma Majesté. Il y a t-t-tant de gens qui t'aiment...\n@c0@"
  it: "@aSancho@bTodo el mundo te ama, %a000090, por qué tu sei una persona muy buena...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！　いえ\n\t%a000090王は　幸せ者ですよ。\n\tみんなに　愛されて……。\n@c0@"
37:
  de: "@aOtto@bDieser Ort ist net allzu weit von Humburg entfernt, aber zu Fuß kommt man hier net hin. Welch eine Leistung, hierher zu gelangen.\n@c0@"
  en: "@aTuppence@bThis place isn't all that far from Gotha, but you\r\ncan't get here on foot. It must've been quite tricky for them.\n@c0@"
  es: "@aAlazar@bEste lugar no está tan lejos de Pankraz, pero no se puede venir a pie. Debe de haber sido complicado para ellos.\n@c0@"
  fr: "@aInnocent@bCet endroit n'est pas très éloigné de Gotha, mais\r\nil est impossible d'y accéder à pied. Ça a dû être difficile, pour eux.\n@c0@"
  it: "@aSimon@bNon siamo molto lontani da Denim, ma non è possibile raggiungere questo posto a piedi. I soldati devono aver fatto una bella fatica ad arrivare fin qui...\n@c0@"
  ja: "@a@bピピン「ここは　グランバニアから近いけど\n\t歩いては来られない場所ですからね。\n\t当時は　大変だったでしょう。\n@c0@"
38:
  de: "@aSancho@bQué? Wer ist stärker, du oder Señor Ludwig?\n@c0@"
  en: "@aSancho@bQué? Who ees the estronger man, you or señor Pankraz?\n@c0@"
  es: "@aSancho@b¿Qué? ¿Que quién es más fuerte, tú o el señor Teudis?\n@c0@"
  fr: "@aSancho@bQuéⓡ Qui est le plus f-f-fort, toi ou le señor Petrosⓡ\n@c0@"
  it: "@aSancho@bSì, el señor Russel era un hombre fuerte, saggio y coraggioso...\n@c0@"
  ja: "@a@bサンチョ「え？　パパスさまと\n\tどっちが　いい男かって？\n@c0@"
39:
  de: "@aSancho@bNo, no, Chico. Du bist noch ein Niño. Du kannst diss nisst mit deine Padre vergleichen.\n@c0@"
  en: "@aSancho@bNo, no, friend. You are estill just a child. You can no compare yourself to your father.\n@c0@"
  es: "@aSancho@bNo, no, chamaquito. Todavía eres un chamaco. No te puedes comparar con tu apá.\n@c0@"
  fr: "@aSancho@bNo, no, chico. Tu es encore oun enfant. Tu ne peux pas te comparer à ton padre.\n@c0@"
  it: "@aSancho@bTu sei ancora giovanes, chico.\nNo sarebbe giustos paragonarte a tuo padre...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんは\n\tまだまだ　子供ですし……\n\tパパスさまとは　くらべられませんよ。\n@c0@"
40:
  de: "@aBianca@bSie hat ja so recht. Ludwig war wirklich ein beeindruckender Mann.\n@c0@"
  en: "@aBianca@bNever a truer word has bin spoken. Pankraz really was an incredible man.\n@c0@"
  es: "@aBianca@bTiene toda la razón. Teudis era un hombre realmente increíble.\n@c0@"
  fr: "@aBianca@bC'est on ne peut plus vrai. Petros était vraiment un homme incroyable.\n@c0@"
  it: "@aBianca@bSottoscrivo pienamente: Russel era un uomo davvero eccezionale!\n@c0@"
  ja: "@a@bビアンカ「そうなのよね。\n\tパパスさんって　本当に\n\tかっこよかったわよね。\n@c0@"
41:
  de: "@aBianca@bSchau mich nicht so an, %a000090! Immerhin bist du Ludwigs Sohn. Also kannst du so schlecht nicht sein...\n@c0@"
  en: "@aBianca@bDon't look at me like that, %a000090!\nYou're Pankraz's son, after all. So you en't\nthat bad neither!\n@c0@"
  es: "@aBianca@b¡No pongas esa cara, %a000090!\nAl fin y al cabo, eres el hijo de Teudis. ¡Así que tampoco estás tan mal!\n@c0@"
  fr: "@aBianca@bNe me regarde pas comme ça, %a000090ⓠ Tu es son fils, après tout. Alors tu n'es pas mal non plusⓠ\n@c0@"
  it: "@aBianca@bE sono certa che tu diventerai più grande di lui, %a000090! Dopo tutto sei suo figlio, no?\nCome si dice? ⓕBuon sangue non menteⓖ!\n@c0@"
  ja: "@a@bビアンカ「なによ　そんな顔して。\n\t%a000090はパパスさんの子供なんだから\n\tじゅうぶん　素質あると思うわよ！\n@c0@"
42:
  de: "@aNera@bIn meinem ganzen Leben ist mir kein soliderer Mensch als du untergekommen. He he he!\n@c0@"
  en: "@aNera@bIn all my years in this world, I don't think I've ever met a more solid character than you! He he he!\n@c0@"
  es: "@aNera@bEn tutti mis años de vita, no creo haber conocido a nadie de tan recto carácter como tú! ¡Ji, ji, ji!\n@c0@"
  fr: "@aNera@bEt moi, au cours de toutes mes années sur cette terre, je ne crois pas avoir jamais croisé une personne au caractère aussi trempé que toiⓠ Hi hiⓠ\n@c0@"
  it: "@aNera@bIo non ho mai conosciuto un uomo più forte, saggio e coraggioso di te, amore mio!\r\nEh eh eh!\n@c0@"
  ja: "@a@bフローラ「私は　このトシになるまで\n\tあなたほどの　ええ男は\n\t見たことが　ないですわ！　うふふ。\n@c0@"
43:
  de: "@aOtto@bVerstehe! Also spielt das Aussehen doch eine Rolle. Vielleicht sollte ich irgendwas mit meinen Augenbrauen machen...\n@c0@"
  en: "@aTuppence@bI see! That means looks are probably a factor in all this too. Maybe I should spend more time working on my eyebrows...\n@c0@"
  es: "@aAlazar@b¡Ya veo! O sea, que probablemente el aspecto también influye. Debería dedicar más tiempo a arreglarme las cejas...\n@c0@"
  fr: "@aInnocent@bJe voisⓠ Ça veut sans doute dire que l'apparence est aussi un facteur. Peut-être que je devrais passer un peu de temps à travailler mes sourcils...\n@c0@"
  it: "@aSimon@bNon mi stupisco di vedere che il ricordo di re Russel è ancora ben impresso nel cuore della gente...\nEra una persona dotata di straordinarie qualità.\n@c0@"
  ja: "@a@bピピン「そうか！　人間　顔も大事なんだ。\n\tこれからは　毎日　眉の手入れも\n\tがんばるぞ！\n@c0@"
44:
  de: "@a%0%a001250@bWenn Großvater solch ein großartiger Mann war, musst du ganz fantastisch sein, Papa!\n@c0@"
  en: "@a%0%a001250@bIf Grandpa was such a good man, then that means you must be pretty amazing too, Dad.\n@c0@"
  es: "@a%0%a001250@bSi el abuelo era un hombre tan bueno, eso significa que tú también serás bastante genial, papi.\n@c0@"
  fr: "@a%0%a001250@bSi grand-père était vraiment quelqu'un d'aussi bien, ça veut dire que tu dois être assez incroyable, toi aussi, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, per me tu sei la persona più speciale del mondo!\nAnche più di nonno Russel!\n@c0@"
  ja: "@a@b%a001250「おじいちゃんが　いい男だったから\n\tお父さんも　ちょっと\n\tかっこいいんだね。　ぽっ……。\n@c0@"
45:
  de: "@aGriselda@bIch erinnere mich an diesen Ort. Als ich von den Monstern entführt wurde, habe ich mich ganz schön gewehrt, weißt du.\n@c0@"
  en: "@aDebora@bI remember this place. When I was kidnapped by those monsters, I put up quite a fight!\n@c0@"
  es: "@aStefania@bRicordo este sitio. ¡Cuando me secuestraron esos monstruos, me resistí como un animale feroce!\n@c0@"
  fr: "@aPandora@bJe me souviens de cet endroit. Quand j'ai été enlevée par ces monstres, Je me suis sacrément débattueⓠ\n@c0@"
  it: "@aViola@bMi ricordo di questo posto!\nQuando fui rapita dai mostri provai a vendere cara la pelle, ma loro erano troppo più forti di me...\n@c0@"
  ja: "@a@bデボラ「この辺りね……。\n\t魔物にさらわれたとき\n\tアゴに　一発　おみまい　したのは。\n@c0@"
46:
  de: "@aGriselda@bIch kann mir nichts Langweiligeres vorstellen, als den lieben langen Tag Texte zu kopieren...\n@c0@"
  en: "@aDebora@bI can't think of a job more boring than transcribing text to make copies of a manuscript.\n@c0@"
  es: "@aStefania@bFare copias de manuscritos debe de ser el trabajo más aburrido del mondo.\n@c0@"
  fr: "@aPandora@bJe n'imagine pas de travail plus ennuyeux que transcrire un texte pour faire des copies d'un manuscrit.\n@c0@"
  it: "@aViola@bCaro, voglio che tu scriva la mia biografia.\nProvvederò io stessa a dettartela, per assicurarmi che non vi siano imprecisioni.\n@c0@"
  ja: "@a@bデボラ「書物を　書き写すなんて\n\tよく　そんな退屈な仕事が\n\tできるわね。\n@c0@"
47:
  de: "@aGriselda@bAllein der Gedanke daran lässt mich schon einschlafen.\n@c0@"
  en: "@aDebora@bThe idea alone almost sends me to sleep.\n@c0@"
  es: "@aStefania@bMe entra sogno solo de pensar en ello.\n@c0@"
  fr: "@aPandora@bÀ elle seule l'idée m'endort presque.\n@c0@"
  it: "@aViola@bOvviamente, dovrai usare un inchiostro indelebile, così la mia bellezza vivrà in eterno... anche se solo sulle pagine di un libro.\n@c0@"
  ja: "@a@bデボラ「考えただけで　眠くなるわ。\n@c0@"
48:
  de: "@aGriselda@bIch weiß, die Leute haben sich große Sorgen gemacht, als ich verschwunden war, aber ich kann ja auch nichts dafür, dass sie mich so verehren.\n@c0@"
  en: "@aDebora@bI know I caused people a lot of worry when I went missing, but I can't help it if they hold me in such high regard.\n@c0@"
  es: "@aStefania@bYa sé que tutti se preocuparon molto cuando desaparecí, ma ¿cómo voy a culparlos por tenerme en tan alta consideración?\n@c0@"
  fr: "@aPandora@bJe sais que j'ai causé de l'inquiétude à beaucoup de gens quand j'ai disparu, mais je n'y peux rien si tout le monde me tient en si haute estime.\n@c0@"
  it: "@aViola@bMolte persone sono state in ansia per me quando sono scomparsa... È bello sapere che gli altri si preoccupano per te.\n@c0@"
  ja: "@a@bデボラ「あの時は　ずいぶんと\n\tめいわく　かけたと思うけど\n\tそれだけ　したわれていたってことよ。\n@c0@"
49:
  de: "@aGriselda@bSchließlich warst du ja nicht der Einzige, der mich gesucht hat, oder? Da waren doch sicher noch andere Soldaten?\n@c0@"
  en: "@aDebora@bBy the way, it wasn't just you who was out looking for me all that time, was it? There were other soldiers too, right?\n@c0@"
  es: "@aStefania@bPor cierto, no me estarías buscando tú solo todo este tiempo, ¿verdad? También había otros soldati, ¿no?\n@c0@"
  fr: "@aPandora@bÀ propos, tu n'étais pas le seul à me chercher pendant tout ce temps, n'est-ce pasⓡ Il y avait aussi d'autres guerriers, nonⓡ\n@c0@"
  it: "@aViola@bNon eri mica solo tu a cercarmi, caro.\nSchiere di baldi giovani si erano gettate alla mia ricerca nella speranza di trovarmi...\n@c0@"
  ja: "@a@bデボラ「ところで　あんた以外に\n\t私をさがしてくれた　兵士は\n\tもちろん　いたんでしょうね？\n@c0@"
50:
  de: "@aGriselda@bDa steht doch ein durch und durch solider Mensch direkt vor ihm. Nicht wahr, %a000090?\n@c0@"
  en: "@aDebora@bThere's a solid character standing right in front of him. Don't you agree, %a000090?\n@c0@"
  es: "@aStefania@b¡Ja!, yo sí que tengo un carácter recto. Estarás de acuerdo con me, ¿no, %a000090?\n@c0@"
  fr: "@aPandora@bIl y a pourtant une personne au caractère bien trempé juste devant lui. Tu n'es pas d'accord, %a000090ⓡ\n@c0@"
  it: "@aViola@bTuo padre era uomo forte, saggio e coraggioso?\nAllora com'è che non gli somigli affatto, %a000090?!\n@c0@"
  ja: "@a@bデボラ「目の前に\n\tええ男が　いるじゃない\n\tねぇ　%a000090。\n@c0@"
51:
  de: "@aGriselda@bJetzt steh nicht so dumm in der Gegend rum! Nimm Haltung an, sei ein guter Diener!\n@c0@"
  en: "@aDebora@bOh, don't just stand there looking gormless!\r\nSnap to attention now, there's a good servant!\n@c0@"
  es: "@aStefania@b¡No te quedes ahí con faccia de pasmado!\n¡Ponte firme! ¡Así, va bene!\n@c0@"
  fr: "@aPandora@bOh, ne reste pas planté là avec cet air absent. Écoute-moi bien, maintenant, voilà un bon domestiqueⓠ\n@c0@"
  it: "@aViola@bIh ih ih!\nDai, non fare quella faccia! Ti stavo solo prendendo in giro, maritino mio! O forse no...? Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「なに　ぼーっと　してんのよ。\n\t私の　しもべに　見合うように　もっと\n\tしゃきっとしなさい　しゃきっと。\n@c0@"
