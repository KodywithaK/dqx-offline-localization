  en: "@aPankraz@bRight, then! On with the task in hand: rescuing\r\nPrince Harry!\n@c0@"
  es: "@aTeudis@bBien, manos a la obra: ¡hay que rescatar al príncipe Froilán!\n@c0@"
  fr: "@aPetros@bBonⓠ Poursuivons notre missionⓢ sauver le prince Harryⓠ\n@c0@"
  it: "@aRussel@bD'accordo!\nMettiamoci al lavoro: dobbiamo ritrovare il principe Robert!\n@c0@"
  ja: "@a@bパパス「さて　ともかく\n\t王子を助け出さねば！\n@c0@"
19:
  de: "@aLudwig@bGeh du voran. Ich werde dir den Rücken decken.\n@c0@"
  en: "@aPankraz@bYou take the lead. I'll keep an eye out for danger from the rear.\n@c0@"
  es: "@aTeudis@bAdelántate. Yo me encargaré de los peligros desde la retaguardia.\n@c0@"
  fr: "@aPetros@bC'est toi qui prends la tête des opérations.\r\nJe couvrirai tes arrières.\n@c0@"
  it: "@aRussel@bPrendi tu il comando.\nIo ti coprirò le spalle.\n@c0@"
  ja: "@a@bパパス「お前が　先に行け。\n\t後ろの守りは　父さんが\n\t引きうけたぞ！\n@c0@"
