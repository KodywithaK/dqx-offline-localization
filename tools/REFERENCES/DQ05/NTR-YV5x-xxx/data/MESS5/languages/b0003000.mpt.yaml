30:
  de: "@a@b*: Hui, was haste denn da im Schlepptau? 'ne Säbelzahnkatze? Potzblitz, ⓚⓛ hick! ⓚⓛ gehörste etwa auch zu denen? Den Monstern, mein ich...\n@c0@"
  en: "@a@b*: Wot's that you've got wiv ya? A great sabrecat? Blimey, ⓚⓛ Hic! ⓚⓛ you must be one o' them as well, eh? A monster, I mean...\n@c0@"
  es: "@a@b*: ¿Qué es la cosa esa? ¿Un dientes de sable? Rayos... ¡hip! Tú vas a ser uno de esos, ¿eh? Un monstruo, digo...\n@c0@"
  fr: "@a@b*ⓢ C'est quoi, ce truc avec toiⓡ Un smilodonⓡ Sacrebleu ⓚ hicⓠ ⓚ tu dois en être un aussi, alorsⓡ De monstre, j'veux dire...\n@c0@"
  it: "@a@b*: Che è quell'affare là, eh?\nUn Koguar?! 'Mmazza, ahò!\nMa che, sei un mostro pure te?!\n@c0@"
  ja: "@a@b＊「ああ　キラーパンサーを\n\t連れているところを見ると\n\tお前も魔族だな。　ひっく……。\n@c0@"
31:
  de: "@a@b*: Geht doch nix über 'nen kleinen Schluck, wenn man 'nen harten Tag hinner sich hat!\n@c0@"
  en: "@a@b*: Aaah! Nuffin' like a drink after an 'ard day's graft!\n@c0@"
  es: "@a@b*: ¡Aaah! ¡Nada como un trago tras un largo día de trapicheos!\n@c0@"
  fr: "@a@b*ⓢ Aaahⓠ Rien de tel qu'une petite rasade après une grosse journée de boulotⓠ\n@c0@"
  it: "@a@b*: Aaah! She voleva proprio...!\nNun sh'è gnente de mejo de 'na bottijia de robba bbona quanno she fenishe de lavora', ahò!\n@c0@"
  ja: "@a@b＊「かー！　仕事の後の酒は\n\tたまんねえなあ。\n@c0@"
32:
  de: "@a@b*: Is' leicht verdiente Kohle, ehrlich. Musste einfach bloß 'n paar Kinner entführ'n, und die kaufen sie dir ab. Is' mir doch egal, ob die Sklaven draus machen.\n@c0@"
  en: "@a@b*: Mind you, it's easy money, this. Just kidnap a few kids an' they'll buy 'em off ya for cash. It don't bovver me if they use 'em as slaves.\n@c0@"
