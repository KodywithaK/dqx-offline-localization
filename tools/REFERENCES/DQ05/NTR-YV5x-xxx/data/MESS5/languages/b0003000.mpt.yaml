0:
  de: "@a@b*: Haben wir uns nicht schon mal irgendwo gesehen, Junge?\nJa, jetzt fällt's mir wieder ein!\n@c0@"
  en: "@a@b*: Haven't we met somewhere before, boy?\n...Yes! I remember!\n@c0@"
  es: "@a@b*: ¿No nos hemos visto antes, muchacho?\r\n¡Sí, ya recuerdo!\n@c0@"
  fr: "@a@b*ⓢ On ne s'est pas déjà croisés, petitⓡ\n... Oui, je me souviensⓠ\n@c0@"
  it: "@a@b*: Ehi, ragazzino!\nNon ci siamo già visti da qualche parte, eh?\nOh, sì! Adesso ricordo!\n@c0@"
  ja: "@a@b＊「はて？　どこかで\n\t会ったかのう　坊や？\n\tおお　そうじゃ！\n@c0@"
1:
  de: "@a@b*: Du bist doch der Junge, der vor geraumer Zeit mit diesem gütigen Mann durchgekommen ist, deinem Vater.\n@c0@"
  en: "@a@b*: You're the young fellow who passed by here all that time ago with that kind man for a father.\n@c0@"
  es: "@a@b*: Tú eres aquel niño que pasó por aquí hace mucho con su padre, un hombre muy amable.\n@c0@"
  fr: "@a@b*ⓢ Tu es le jeune garçon qui est passé par ici il y a longtemps, en compagnie de son père, un homme très gentil.\n@c0@"
  it: "@a@b*: Tempo fa passasti di qua con quel brav'uomo di tuo padre.\n@c0@"
  ja: "@a@b＊「いつぞや　たくましい父親に\n\t連れられ　ここを通っていった\n\t坊やじゃなっ。\n@c0@"
2:
  de: "@a@b*: Er begleitet dich heute nicht, was?\nHab ihn nicht vorbeikommen sehen.\n@c0@"
  en: "@a@b*: Not with you today, eh?\r\nI haven't seen him pass by.\n@c0@"
  es: "@a@b*: Hoy no te acompaña, ¿eh?\r\nNo lo he visto por aquí.\n@c0@"
  fr: "@a@b*ⓢ Il n'est pas avec toi aujourd'huiⓡ\nJe ne l'ai pas vu passer.\n@c0@"
  it: "@a@b*: Oggi sei da solo, eh?\nBeh, cerca di fare attenzione...\n@c0@"
  ja: "@a@b＊「父親は　どうした？\n\tいや　見かけなかったぞ。\n@c0@"
3:
  de: "@a@b*: Wenn ich hier so stehe und dem Fluss zusehe, wie er vorbeifließt, kann ich einfach nicht anders: Ich mache mir Sorgen um das Schicksal unserer Welt.\n@c0@"
  en: "@a@b*: When I stand here watching the river flow by, I can't help but worry about what's to become of our world.\n@c0@"
  es: "@a@b*: Cuando observo el río no puedo evitar preocuparme por lo que le espera a nuestro mundo.\n@c0@"
  fr: "@a@b*ⓢ Quand je reste ici à regarder la rivière couler, je ne peux m'empêcher de me demander ce qu'il adviendra de notre monde.\n@c0@"
  it: "@a@b*: Quando osservo l'incessante scorrere del fiume, non riesco a fare a meno di preoccuparmi del futuro del mondo.\n@c0@"
  ja: "@a@b＊「こうして　川の流れを\n\t見つめていると　この世のゆく末が\n\t不吉なものに　思えてならん……。\n@c0@"
4:
  de: "@a@b*: Du solltest auf deinen Vater aufpassen, Junge. Wir werden starke Männer wie ihn brauchen, möchte ich wetten.\n@c0@"
  en: "@a@b*: You should take care of that father of yours, boy. We'll be needing good, strong men like him, I'll wager.\n@c0@"
  es: "@a@b*: Cuida de ese padre tuyo, muchacho. Creo que pronto necesitaremos hombres buenos y fuertes como él.\n@c0@"
  fr: "@a@b*ⓢ Tu dois prendre soin de ton père, mon garçon.\nNous allons avoir besoin d'hommes forts et bons comme lui, j'en suis sûr.\n@c0@"
  it: "@a@b*: Abbi cura di tuo padre, piccolo.\nHo paura che presto avremo molto bisogno di uomini forti e coraggiosi come lui...\n@c0@"
  ja: "@a@b＊「坊や　父上を大事にしなさい。\n\tあのような　強いまなざしを持つ者が\n\tこれからの世には　必要なのじゃ。\n@c0@"
5:
  de: "@aGregor der Grenzer@bIch muss dich leider bitten umzukehren, Junge. Hier lang geht es in fremde Länder.\n@c0@"
  en: "@aCheckpoint Charlie@bI'm afraid I'm going to have to ask you to turn back, boy. Beyond this point lie foreign lands.\n@c0@"
  es: "@aAndrea Duana@bMe temo que deberás dar media vuelta, muchacho. Más allá se extienden tierras extranjeras.\n@c0@"
  fr: "@aGarde-frontière@bJe regrette, mais je vais devoir te demander de repartir d'où tu viens, mon garçon. Au-delà de ce poste-frontière, ce sont des terres étrangères.\n@c0@"
  it: "@aGuardia di Coburg@bPiccoletto, mi spiace ma devo chiederti di fare marcia indietro. Oltre questo punto si estendono territori ignoti e pericolosi.\n@c0@"
  ja: "@a@b＊「坊や　わるいことは言わない。\n\tもどりなさい。\n\tここから先は　よその国だよ。\n@c0@"
6:
  de: "@a@b*: Hoppla! Was haben wir denn hier?\n@c0@"
  en: "@a@b*: Eh up! What 'ave we got 'ere, then?\n@c0@"
  es: "@a@b*: ¡Pero bueno! ¿Qué tenemos aquí?\n@c0@"
  fr: "@a@b*ⓢ Tiens, tiensⓠ Regardez qui voilàⓠ\n@c0@"
  it: "@a@b*: Allora? Chi c'avemo qua, eh?\n@c0@"
  ja: "@a@b＊「ん？　なんだ　お前は？\n@c0@"
7:
  de: "@a@b*: He he! Schau mal. Der kleine Bengel is' ohne Mama und Papa ausgebüchst.\n@c0@"
  en: "@a@b*: Heh heh! Look at that. The little brat's wandered off wivout 'is mum 'n' dad.\n@c0@"
  es: "@a@b*: ¡Je, je! Mira tú. Un mocoso que se ha perdido, ¿y su papi y su mami?\n@c0@"
  fr: "@a@b*ⓢ Hé héⓠ Visez un peu. Le morveux se balade sans son papa et sa maman.\n@c0@"
  it: "@a@b*: Ah ah ah! Ma guarda!\nEr piccoletto se n'è annato a fasse 'na passeggiata senza 'iggenitori, ahò!\n@c0@"
  ja: "@a@b＊「ははーん。　さては\n\t親と　はぐれて　こんな所に\n\t来てしまったのだな。\n@c0@"
8:
  de: "@a@b*: Ui! Was soll jetzt bloß aus dem werden, hm? He he he! Noch 'n Sklave für...\n@c0@"
  en: "@a@b*: Oh, dear! Wotever will become of 'im, eh?\nHeh heh heh! Another slave for theⓚⓛ\n@c0@"
  es: "@a@b*: ¡Vaya! ¿Qué será de él?\r\n¡Je, je, je! Otro esclavo para...\n@c0@"
  fr: "@a@b*ⓢ Dommageⓠ Il risque de lui arriver des bricoles, heinⓡ Hé hé héⓠ Ça fera un esclave de plus pour...\n@c0@"
  it: "@a@b*: Ahò, c'ho avuto 'n'idea stramboliante!\nIo dico che potemo pija' 'sto mocciosetto e fallo diventa' 'no schiavo pe'...\n@c0@"
  ja: "@a@b＊「おい。　ちょうどいいぜ！\n\tこいつを　神殿に……。\n@c0@"
9:
  de: "@a@b*: Nö, das können wir doch nich' machen, oder?\nSie haben uns doch gesagt, sie nich' zu entführen, wenn wir nich' wissen, woher sie kommen, oder?\n@c0@"
  en: "@a@b*: Nah, we can't, can we? They said not to kidnap 'em unless we know where they come from, right?\n@c0@"
  es: "@a@b*: ¡Buah!, no podemos, ¿no? Nos han dicho que nada de raptos si no sabemos de dónde vienen, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Ben non, on peut pas. Ils ont dit de pas les enlever quand on sait pas d'où ils viennent.\n@c0@"
  it: "@a@b*: No, nunn'o potemo fa'.\nC'hanno detto che nun potemo rapi' li regazzini si nun sapemo de chi so fiji.\n@c0@"
  ja: "@a@b＊「いや　いかん！　むやみに\n\t身元のわからんガキを　さらうなと\n\t言われてるだろう。\n@c0@"
10:
  de: "@a@b*: Potzblitz, da haste ja recht. Wir lassen den besser laufen.\n@c0@"
  en: "@a@b*: Blimey, ye're right, an' all. We better leave off 'im.\n@c0@"
  es: "@a@b*: ¡Bah!, pues tienes razón. Mejor pasamos de él.\n@c0@"
  fr: "@a@b*ⓢ Sacrebleu, t'as raison, vieux.\nVaut mieux le laisser, alors.\n@c0@"
  it: "@a@b*: Anvedi, ahò!\nMe l'ero proprio scordato!\nC'hai ragione marcia, c'hai. Lassamolo perde', va'...\n@c0@"
  ja: "@a@b＊「ちっ！　そうだったな……。\n@c0@"
11:
  de: "@a@b*: Na los, Kleiner! Hau schon ab, ehe du Ärger kriegst!\n@c0@"
  en: "@a@b*: Oi, kid! Beat it, before ya get yerself in trouble!\n@c0@"
  es: "@a@b*: ¡Eh, niñato! ¡Aire!, que vas a acabar metido en un lío.\n@c0@"
  fr: "@a@b*ⓢ Hé, le morveuxⓠ Dégage fissa si tu veux pas avoir d'ennuisⓠ\n@c0@"
  it: "@a@b*: Ah regazzi', vedi d'annattene, prima che te succede 'nguajo...\n@c0@"
  ja: "@a@b＊「おい！　いつまでも\n\tそんな所に　つっ立ってないで\n\t帰れ　帰れ！！\n@c0@"
12:
  de: "@a@b*: Ich hab doch gesagt, hau ab, Kleiner!\n@c0@"
  en: "@a@b*: I said beat it, kid!\n@c0@"
  es: "@a@b*: ¡He dicho que aire!\n@c0@"
  fr: "@a@b*ⓢ J'ai dit dégage, le miocheⓠ\n@c0@"
  it: "@a@b*: Ah regazzi', t'ho detto che te ne devi d'anna'!\n@c0@"
  ja: "@a@b＊「いつまでも　そんな所に\n\tつっ立ってないで　帰れ　帰れ！！\n@c0@"
13:
  de: "@a@b*: Weg mit dir, Kleiner! Ich hab dir nix zu sagen.\n@c0@"
  en: "@a@b*: Get lost, kid. I ain't got nuffin' to say to you.\n@c0@"
  es: "@a@b*: Date el piro, nene. No tengo nada que decirte.\n@c0@"
  fr: "@a@b*ⓢ Fiche le camp, gamin. J'ai rien à te dire.\n@c0@"
  it: "@a@b*: Nanerottolo, smamma, che nun c'ho vojia de parla' co'tte.\n@c0@"
  ja: "@a@b＊「悪いが　お前のような　ガキには\n\t用はないんだ。\n@c0@"
14:
  de: "@a@bLudwig kämpft gegen einige Monster!\n@c0@"
  en: "@a@bPankraz is battling some monsters!\n@c0@"
  es: "@a@b¡Teudis está luchando con unos monstruos!\n@c0@"
  fr: "@a@bPetros est en train de combattre des monstresⓠ\n@c0@"
  it: "@a@bRussel sta combattendo contro alcuni mostri!\n@c0@"
  ja: "@a@bなんと　パパスが\n魔物たちと　戦っている！！\n@c0@"
15:
  de: "@aLudwig@bWas machst du denn hier, %a000090?\n@c0@"
  en: "@aPankraz@bWhat are you doing here, %a000090?\n@c0@"
  es: "@aTeudis@b¿Qué haces aquí, %a000090?\n@c0@"
  fr: "@aPetros@bQue fais-tu ici, %a000090ⓡ\n@c0@"
  it: "@aRussel@bEh?!\nE tu che ci fai qui, %a000090?\n@c0@"
  ja: "@a@bパパス「おお！　%a000090か！\n@c0@"
16:
  de: "@aLudwig@bIch habe dich im Schloss aus den Augen verloren, doch die Zeit drängte. Ich hätte ja nie gedacht, dass du es alleine hierher schaffen würdest.\n@c0@"
  en: "@aPankraz@bI lost sight of you back at the castle, but there was no time to lose. I never imagined you'd make it\r\nhere on your own.\n@c0@"
  es: "@aTeudis@bTe perdí de vista en el castillo, pero no había tiempo que perder. Nunca creí que pudieras llegar hasta aquí tú solo.\n@c0@"
  fr: "@aPetros@bJe t'ai perdu de vue au château, mais il n'y avait pas une minute à perdre. Je n'aurais jamais cru que tu arriverais jusqu'ici tout seul.\n@c0@"
  it: "@aRussel@bNon ti ho più visto al castello, e sono andato via senza di te perché non c'era tempo da perdere.\n㈡\nNon credevo che saresti riuscito ad arrivare fin qui da solo!\n@c0@"
  ja: "@a@bパパス「お城で　はぐれてしまったと\n\t思ったが　こんな所まで\n\tやって来るとは……\n@c0@"
17:
  de: "@aLudwig@bDu bist wohl kein kleiner Junge mehr. Du entwickelst dich sehr schnell. Ich bin stolz auf dich, mein Sohn.\n@c0@"
  en: "@aPankraz@bI suppose you're not a boy any more. You're growing up fast. I'm proud of you, son.\n@c0@"
  es: "@aTeudis@bSupongo que ya no eres un crío. Te haces mayor deprisa. Estoy orgulloso de ti, hijo mío.\n@c0@"
  fr: "@aPetros@bMais tu n'es plus vraiment un petit garçon, maintenant. Tu grandis vite. Je suis fier de toi, fiston.\n@c0@"
  it: "@aRussel@bForse dovrei cominciare a pensare che non sei più un bambino... Stai crescendo in fretta e bene, figliolo.\nSono fiero di te.\n@c0@"
  ja: "@a@bパパス「お前も　ずいぶん\n\t成長したものだな。\n\t父さんは　うれしいぞ！\n@c0@"
18:
