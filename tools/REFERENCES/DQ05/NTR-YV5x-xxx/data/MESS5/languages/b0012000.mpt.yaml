  es: "@a@b%3Por desgracia, no hay tiempo para disfrutar del casino, ya que %a000090 debe devolver a todos a Mostroferrato.%4\n@c0@"
  fr: "@a@b%3Ils n'eurent malheureusement pas le temps\nd'aller au casino, car %a000090 dut ramener\ntout le monde à Mostroferrato.%4\n@c0@"
