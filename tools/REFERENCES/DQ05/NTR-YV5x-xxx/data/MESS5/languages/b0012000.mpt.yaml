59:
  de: "@aPriester@bSegne sie mit deiner immerwährenden Liebe und wache über sie mit deiner ewigen Gnade.\n@c0@"
  en: "@aPriest@bBless them with your everlasting love and watch over them with your eternal compassion.\n@c0@"
  es: "@aSacerdote@bBendícelos con tu amor eterno y cuida de ellos con tu infinita compasión.\n@c0@"
