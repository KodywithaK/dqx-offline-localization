  ja: "@a@bルドマン「おお　気がついたようだな！\n\tいや　すまなかった　%a000090。\n@c0@"
30:
  de: "@aRodrigo Onassetti@bIch möchte deine kleine Siesta nicht stören, aber die Hochzeitsfeier fängt gleich an, und ohne den Bräutigam geht es nicht!\n@c0@"
  en: "@aRodrigo Briscoletti@bI don't like to disturb your little siesta like this, but the wedding ceremony is about to start, and the groom is required!\n@c0@"
  es: "@aDon Rimaldi@b¡No me gustaría interrompire la tua siesta, pero va a empezar la ceremonia nupcial y hace falta un novio!\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe ne veux pas te déranger dans ta petite siesta, mais le mariage va bientôt commencer et il faudrait que le marié soit làⓠ\n@c0@"
  it: "@aRick Fosconi@bSono costretto a interrompere tuo riposo perché matrimonio sta per iniziare...\nE senza sposo non ci può essere matrimonio, yes!\n@c0@"
  ja: "@a@bルドマン「ゆっくり　休んでもらいたい\n\tところだが　もう　結婚式が\n\t始まる時間のようだ。\n@c0@"
31:
  de: "@aRodrigo Onassetti@bDieser gute Mann wird dir den Ablauf erläutern.\n@c0@"
  en: "@aRodrigo Briscoletti@bThis good man will explain the plan of action to you.\n@c0@"
  es: "@aDon Rimaldi@bEste buen uomo te explicará el plan de acción.\n@c0@"
  fr: "@aRodrigo Oscuroni@bCe brave homme va tout t'expliquer sur le déroulement de la cérémonie.\n@c0@"
  it: "@aRick Fosconi@bA proposito, per questo evento very speciale ho ingaggiato miglior esperto di cerimonie di tutto il world.\nLui ti spiegherà quello che you devi fare.\n@c0@"
  ja: "@a@bルドマン「結婚式の　段取りは\n\tこの男から　聞いてくれ。\n@c0@"
32:
  de: "@a@b*: Et bien! Die 'ochzeit rückt nä'er! Le grand jour, eh? \n@c0@"
  en: "@a@b*: Et bien!\r\n'Ere we go!\r\nZe big day, eh?\n@c0@"
  es: "@a@b*: ¡Et bien!\r\n¡Allons!\r\nEs el gran día, ¿non?\n@c0@"
  fr: "@a@b*ⓢ Alors, c'est le grand jourⓡ\nVous devez être excité comme une puceⓠ\n@c0@"
  it: "@a@b*: Saaalve, come va? Ma che spettaaacolo!\nTrovo il tuo look molto trendy!\nCosì deliziosamente kitsch, con un tocco di nouvelle-punk.\n@c0@"
  ja: "@a@b＊「あ　それでは　ご説明いたします。\n@c0@"
33:
  de: "@a@b*: Zunächst, Monsieur ⓚⓛ und darf isch sagen, dass Ihr 'eute einfach großartig ausseht ⓚⓛ werdet Ihr Euren Platz vor dem Priester einnehmen.\n@c0@"
  en: "@a@b*: First of all, you monsieur ⓚⓛ and may I say you look sensational today ⓚⓛ you will take your position before ze priest.\n@c0@"
  es: "@a@b*: Antes de nada, monsieur, y pegrmítame decigrle que está spectaculaire, se colocagrá usted ante el sacegrdote.\n@c0@"
  fr: "@a@b*ⓢ Vous, Monsieur, vous serez le premier à prendre place au début de l'allée... Et permettez-moi de vous dire que je vous trouve fort élégant.\n@c0@"
  it: "@a@b*: Ovviamente, io non mi vestirei maaai così, ma non divaghiamo.\nDunque, tu dovrai prendere posizione davanti al sacerdote.\n@c0@"
  ja: "@a@b＊「まず　花ムコさまは　先に\n\t神父さまのところへ　お連れします。\n@c0@"
34:
  de: "@a@b*: Dort 'arrt Ihr Eurer ⓚⓛ ah! ⓚⓛ 'olden Braut!\n@c0@"
  en: "@a@b*: You will wait zere for your ⓚⓛ Ah! ⓚⓛ\nexquisite bride!\n@c0@"
  es: "@a@b*: Allí espegragrá a su... ¡ah!, ¡a su exquisita fiancée!\n@c0@"
  fr: "@a@b*ⓢ Là, vous attendrez l'arrivée de votre future épouseⓠ Ahⓠ Elle est à croquerⓠ\n@c0@"
  it: "@a@b*: Lì attenderai la tua spleeendida sposa.\nA proposito, l'acconciatura che ha scelto non le dona.\n㈡\n*: Avrei consigliato un taglio più barocco, in linea con i dettami degli stylist più fashionable.\n@c0@"
  ja: "@a@b＊「そこで　花嫁さまを　\n\tお待ちください。\n@c0@"
35:
  de: "@a@b*: Die Braut, sie wird geführt von ihrem Vater von diesem Antichambre, den Gang 'inunter, an Eure stolze und männlische Seite.\n@c0@"
  en: "@a@b*: Ze bride, she will zen be escorted by 'er father from zis antichambre, down ze aisle, to your proud and masculine side.\n@c0@"
  es: "@a@b*: La fiancée segrá escoltada pogr su père desde esta antecámagra y llegagrá pogr el pasillo hasta su masculina y ogrgullosa pgresencia.\n@c0@"
  fr: "@a@b*ⓢ La mariée patientera dans cette antichambre, depuis laquelle son père la conduira jusqu'à vous, un futur mari viril et rassurant.\n@c0@"
  it: "@a@b*: La fanciulla verrà accompagnata dal suo muniiifico padre, sul cui look preferisco tacere, e si porterà accanto a te.\n@c0@"
  ja: "@a@b＊「花嫁さまは　この特別室から\n\tお父さまと　一緒に　お歩きになって\n\t花ムコさまの　もとへ。\n@c0@"
36:
  de: "@a@b*: Und dann werdet Ihr beide vor dem Altar zusammenkommen, wo der Priester ste'en wird. Ah oui! Das wird eine 'immlische 'ochzeit!\n@c0@"
  en: "@a@b*: And ze two of you will come together in front of ze altar where ze priest will be standing.\r\nOui! It will be perfection itself!\n@c0@"
  es: "@a@b*: Après, los dos igrán juntos hasta el altagr, donde estagrá el sacegrdote.\r\n¡Oui! ¡Segrá pegrfecto!\n@c0@"
  fr: "@a@b*ⓢ Ensuite, main dans la main, vous remonterez l'allée jusqu'à l'autel où le prêtre vous attendra.\nÇa va être beauⓠ Je suis déjà tout émuⓠ\n@c0@"
  it: "@a@b*: Poi vi sistemerete di fronte al sacerdote, vicino all'altare, che avrei decorato con dei flower dal design chic e minimalista, ma non divaghiamo.\n@c0@"
  ja: "@a@b＊「神父さまの　いらっしゃる祭壇の前で\n\tおふたりが　出会います。\n@c0@"
37:
  de: "@a@b*: Nach einer kurzen Ansprache werdet Ihr die Ringe tauschen, während in Euren Augen die Leidenschaft der jungen Liebe lodert!\n@c0@"
  en: "@a@b*: After 'e 'as said a few words, you will échange ze rings wiz ze look of passion burning in your eyes! Ze passion of ze newly-weds!\n@c0@"
  es: "@a@b*: ¡Cuando él diga unas palabgras, ustedes integrcambiagrán los anillos con una migrada passionée!\n㈡\n*: ¡La pasión de los grecién casados!\n@c0@"
  fr: "@a@b*ⓢ Après son discours, vous échangerez les alliances en y mettant toute la passion de l'amourⓠ\nCe sera comme dans les romansⓠ\n@c0@"
  it: "@a@b*: Lui vi dirà delle cose, poi vi scambierete gli anelli e...\n@c0@"
  ja: "@a@b＊「そこで　神父さまからの\n\tお話が　ありまして　あとは\n\t指輪の交換となります。\n@c0@"
38:
  de: "@a@b*: Und ⓚⓛ fertig! Voilà! Ihr seid ver'eiratet! Alors. Seid Ihr bereit, den ⓞgroßen Schritt zu wagenⓟ?\n@c0@"
  en: "@a@b*: And zat's it! Voilà! You will be 'itched!\nAlors. Are you ready to ⓗtake ze plungeⓘ?\n@c0@"
  es: "@a@b*: ¡Y ya está! ¡Voilà! ¡Bodogrio concluido!\r\nAlors. ¿Listo pagra dagr el salto?\n@c0@"
  fr: "@a@b*ⓢ Et voilàⓠ Vous serez mariésⓠ\nAlorsⓡ Vous êtes prêt pour le ⓥgrand sautⓦⓡ\n@c0@"
  it: "@a@b*: Voilà!\nLes jeux sont faits!\nAllora, hai capito bene cosa devi fare?\n@c0@"
  ja: "@a@b＊「それでは　お時間ですので\n\tさっそく　始めますが\n\tよろしいですか？\n@c0@"
39:
  de: "@a@b*: Bien. Folgt mir, Monsieur, und isch bringe Eusch den Gang 'inunter zum Priester. 'altet Euren Kopf 'och, damit sisch alle in Eusch verlieben, eh?! (Zwinker)\n@c0@"
  en: "@a@b*: Bien. Follow me, monsieur, and I will take you down ze aisle to ze priest. Keep your 'ead 'eld 'igh, so everyone falls in love wiz you, eh!? (wink)\n@c0@"
  es: "@a@b*: Très bien. Sígame, monsieur, y lo conducigré pogr el pasillo hasta el sacegrdote.\n㈡\n*: Mantenga bien alta la tête pagra que todo el mundo se enamogre de usted. (guiño)\n@c0@"
  fr: "@a@b*ⓢ Parfait. Suivez-moi, Monsieur, je vais vous conduire à l'allée au bout de laquelle se trouve le prêtre.\n㈡\n*ⓢ Gardez la tête bien haute pour que tout le monde puisse vous admirer. (clin d'œil)\n@c0@"
  it: "@a@b*: Ora andremo dal sacerdote. Mi raccomando, cammina lentamente, così tutti potranno ammirare lo style così vintage e post-urban del tuo essere cool.\n@c0@"
  ja: "@a@b＊「それでは　花ムコさま。\n\t神父さまのもとへ\n\t私が　ご案内いたします。\n@c0@"
40:
  de: "@a@b*: Non? Ihr seid naturellement nervös, da Ihr so ein Juwel e'elischen werdet, eh? Bien. Isch erkläre es Eusch encore une fois.\n@c0@"
  en: "@a@b*: Non? It is understandable zat you are nervous when you are to marry such a jewel, eh?\r\nBien. I will explain it once again.\n@c0@"
  es: "@a@b*: ¿Non? Es très nogrmal que tenga negrvios pogr casagrse con una joya así, ¿non?\r\nTrès bien. Se lo explicagré otgra vez.\n@c0@"
  fr: "@a@b*ⓢ Nonⓡ Je comprends que vous soyez un peu nerveux de vous marier à une telle beauté.\nJe vais tout vous réexpliquer.\n@c0@"
  it: "@a@b*: Lo supponevo. Guarda, caro, non è difficile.\nAscoltami attentamente e vedrai che ce la farai.\n㈡\nAh, che pazienza bisogna avere con questi nuovi ricchi...!\n@c0@"
  ja: "@a@b＊「では　もう１度\n\tご説明いたします。\n@c0@"
41:
  de: "@aPriester@bWir sind vor der allmächtigen Göttin zusammengekommen, um den gesegneten Bund zwischen %a000090 und Nera zu bezeugen.\n@c0@"
  en: "@aPriest@bWe are gathered here in the presence of the Goddess, to witness the blessed union of %a000090 and Nera.\n@c0@"
  es: "@aSacerdote@bEstamos aquí reunidos, en presencia de la Diosa, para celebrar la sagrada unión de %a000090 y Nera.\n@c0@"
  fr: "@aPrêtre@bNous sommes tous réunis ici en présence de la Déesse pour célébrer l'union %G0090%Xd'%Yde %Z%a000090 et Nera.\n@c0@"
  it: "@aSacerdote@bSiamo oggi qui riuniti alla presenza della dea misericordiosa per celebrare l'unione tra Nera Fosconi e %a000090.\n@c0@"
  ja: "@a@b神父「それでは　本日　これより\n\t神の御名において　%a000090と\n\tフローラの結婚式を　行います。\n@c0@"
42:
  de: "@aPriester@bBitte wendet Euch zum Achterdeck, wo jetzt die Braut erscheinen wird!\n@c0@"
