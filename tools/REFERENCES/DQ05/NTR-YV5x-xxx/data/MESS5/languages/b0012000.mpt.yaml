  ja: "@a@b＊「く～ん……。\n@c0@"
386:
  de: "@a@b*: Ein Mann mit meinem Beruf ist immer im Dienst. Ich muss Tag und Nacht auf dem Posten sein, damit hier niemand über die Stränge schlägt.\n@c0@"
