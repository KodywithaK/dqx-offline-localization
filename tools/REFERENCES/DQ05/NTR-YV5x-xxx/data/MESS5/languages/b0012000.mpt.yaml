  es: "@aNera@bJusto después de la ceremonia nos trajiste de vuelta a todos directamente. Lanzar Telerregreso para tutti debió de ser agotador.\n@c0@"
  fr: "@aNera@bRemarque, tu nous as tous ramenés ici après la cérémonie. Utiliser ce sort pour tant de personnes doit être très fatigant.\n@c0@"
  it: "@aNera@bTi capisco. Dopo la cerimonia ci hai riportati tutti a casa usando ⓕTeletrasportoⓖ. Trasferire tante persone in quel modo non dev'essere facile...\n@c0@"
