66:
  de: "@a@b%3Und dann bricht der Tag an...%4\n@c0@"
  en: "@a@b%3And then, day breaks...%4\n@c0@"
  es: "@a@b%3Y por fin despunta el día...%4\n@c0@"
  fr: "@a@b%3Puis le jour se leva...%4\n@c0@"
  it: "@a@b%3Il giorno successivo...%4\n@c0@"
