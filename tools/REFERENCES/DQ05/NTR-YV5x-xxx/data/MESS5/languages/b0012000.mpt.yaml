  it: "@aSacerdote@bPrometti di amarla e rispettarla, nella buona e nella cattiva sorte, in salute e in malattia, finché la dea vi concederà di tornare in vita nella sua chiesa?\n@c0@"
  ja: "@a@b神父「すこやかなる時も\n\t病める時も　その身を\n\t共にすることを　誓いますか？\n@c0@"
