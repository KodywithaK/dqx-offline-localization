  es: "@a@b*: ¡Mira%H0860%X%Yd%Z! ¡Mira%H0860%X%Yd%Z qué magistral movimiento de...!\n¡Ooh, auu! ¡Ay!, mi cadera...\n@c0@"
  fr: "@a@b*ⓢ Regardezⓠ Je vais vous montrer comment...\nOuilleⓠ C'est encore ma hanche...\n@c0@"
  it: "@a@b*: Ah, come ballo bene! Vai col ritmo...\nOps! Ehm, chi farebbe tanto cortefe da ridarmi la dentiera?\n@c0@"
  ja: "@a@b＊「見よ！　この　美しいステップ……\n\tうっ！　コシが……。\n@c0@"
402:
  de: "@a@b*: Mein Haar ist ganz salzverkrustet, weil ich so lange draußen an der Seeluft war. Normalerweise ringelt es sich in schönen Locken!\n@c0@"
  en: "@a@b*: My hair's all sticky because I was out in the sea air for so long. Normally it looks great!\n@c0@"
  es: "@a@b*: Tengo el pelo pegajoso de estar tanto tiempo en la mar. ¡Normalmente es precioso!\n@c0@"
