405:
  de: "@a@b*: Fünfzehn Mann auf 'ner ollen Fresskiste, Ⓠ\nYo ho ho und 'ne Buddel Sprungsprudel. Ⓠ\nSchnaps stand stets auf der Höllenfahrtsliste... Ⓡ\n@c0@"
