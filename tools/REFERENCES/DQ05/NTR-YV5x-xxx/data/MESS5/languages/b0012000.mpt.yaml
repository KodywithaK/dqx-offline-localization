  it: "@aSacerdote@bRivolgi il tuo sguardo benevolente su questi due giovani, e concedi loro di vivere in pace e in armonia.\n@c0@"
  ja: "@a@b神父「どうか　末永く　このふたりを\n\t見守って下さいますよう！\n\tアーメン……。\n@c0@"
