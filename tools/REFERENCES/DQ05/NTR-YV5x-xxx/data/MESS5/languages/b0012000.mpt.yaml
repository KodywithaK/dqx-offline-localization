  es: "@aSacerdote@b¡Volved la vista a popa, va a entrar la novia!\n@c0@"
  fr: "@aPrêtre@bQue tout le monde se tourne pour assister à l'entrée de la mariéeⓠ\n@c0@"
  it: "@aSacerdote@bChe la sposa faccia il suo ingresso!\n@c0@"
  ja: "@a@b神父「皆さん　甲板後方の　特別室を\n\tご注目ください。　花嫁　フローラの\n\t入場です！\n@c0@"
43:
  de: "@aPriester@bGnadenreiche Göttin. Wir danken dir, dass du diese zwei Seelen an diesem freudevollen Tag hierher geleitet hast.\n@c0@"
  en: "@aPriest@bDear Goddess. Thank you for guiding these two souls to meet here, on this most joyous of days.\n@c0@"
  es: "@aSacerdote@bDiosa mía, gracias por reunir a estas dos almas aquí hoy, el más gozoso de los días.\n@c0@"
  fr: "@aPrêtre@bChère Déesse, nous te remercions d'avoir guidé ces deux êtres jusqu'ici en ce jour béni.\n@c0@"
  it: "@aSacerdote@bDea buona e misericordiosa, guida verso la felicità queste due anime pure che hanno deciso di unirsi in matrimonio!\n@c0@"
  ja: "@a@b神父「おお　神よ。　このよき日\n\tよき場所に　この　花嫁と　花婿が\n\tみちびかれました。\n@c0@"
44:
  de: "@aPriester@bBitte segne sie mit deiner ewigen Liebe und lass sie miteinander glücklich werden..\n@c0@"
  en: "@aPriest@bMay you bless them with your eternal\r\nlove and happiness.\n@c0@"
  es: "@aSacerdote@bBendícelos con tu dicha y amor eternos.\n@c0@"
  fr: "@aPrêtre@bPuisses-tu leur offrir l'amour et le bonheur éternels.\n@c0@"
  it: "@aSacerdote@bBenedicile con la pace, l'amore e l'armonia che solo tu puoi donare a noi, fedeli pecorelle del tuo gregge.\n@c0@"
  ja: "@a@b神父「この　ふたりの　出会いを\n\tどうぞ　祝福してください。\n@c0@"
45:
  de: "@aPriester@bKommen wir nun zu eurem Ehegelübde.\n@c0@"
  en: "@aPriest@bNow we will move on to your vows.\n@c0@"
  es: "@aSacerdote@bAhora pasaremos a los votos.\n@c0@"
  fr: "@aPrêtre@bNous allons procéder à l'échange des consentements.\n@c0@"
  it: "@aSacerdote@bBene, e ora veniamo a voi...\n@c0@"
  ja: "@a@b神父「さあ　それでは\n\tおふたりの　誓いの言葉を。\n@c0@"
46:
  de: "@aPriester@bWillst du, %a000090, Nera zu deiner Frau nehmen?\n@c0@"
  en: "@aPriest@bDo you, %a000090, take Nera to be your wife?\n@c0@"
  es: "@aSacerdote@b%0%a000090, ¿quieres tomar a Nera como legítima esposa?\n@c0@"
  fr: "@aPrêtre@b%0%a000090, voulez-vous prendre Nera pour épouseⓡ\n@c0@"
  it: "@aSacerdote@bVuoi tu, %a000090, prendere in moglie la qui presente Nera Fosconi?\n@c0@"
  ja: "@a@b神父「なんじ　%a000090は\n\tフローラを　妻とし……\n@c0@"
47:
