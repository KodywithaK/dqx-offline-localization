71:
  de: "@aNera@bAber ich bin so glücklich! Zusammen zu sein, nur wir beide, das ist wie ein wahr gewordener Traum!\n@c0@"
  en: "@aNera@bBut I'm so happy! Being together like this, just the two of us, is like a dream come true!\n@c0@"
