  de: "@aNera@bWaah!\n@c0@"
  en: "@aNera@bWaah!\n@c0@"
  es: "@aNera@b¡Aaah!\n@c0@"
  fr: "@aNera@bAaaahⓠ\n@c0@"
  it: "@aNera@bAaaaahhh!!!\n@c0@"
  ja: "@a@bフローラ「きゃあっ！\n@c0@"
