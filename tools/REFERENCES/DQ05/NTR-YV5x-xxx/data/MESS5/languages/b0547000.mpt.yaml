  de: "@aNera@bEntschuldigung! Da war so ein pelziges Insekt, das meinen Fuß berührt hat. Darauf war ich nicht gefasst...\n@c0@"
  en: "@aNera@bSorry! There was some kind of furry insect by my foot. It took me by surprise, that's all.\n@c0@"
  es: "@aNera@b¡Scusi! Era un insecto peludo que me ha pasado por el pie. Veramente, no me lo esperaba.\n@c0@"
  fr: "@aNera@bDésoléeⓠ Il y avait une espèce d'insecte poilu sur mon pied. J'ai été surprise, c'est tout.\n@c0@"
  it: "@aNera@bUn ragno peloso!\nHo visto un ragno peloso!\nIo odio i ragni pelosi!\n㈡\nPosso affrontare senza paura qualsiasi mostro, ma ho una fifa blu dei ragni pelosi!\nAaaaahhh!!!\n@c0@"
  ja: "@a@bフローラ「足もとに　ゲジゲジみたいな\n\t虫がいましたの……。\n\tビックリしましたわ。\n@c0@"
54:
  de: "@aNera@bWir sollten wirklich weiterziehen, wenn du bereit bist, Liebling. Wir haben nicht viel Zeit.\n@c0@"
  en: "@aNera@bWe should really try to move on if you're ready to, darling. We don't have much time.\n@c0@"
  es: "@aNera@bSi ya estás a punto, caro mio, deberíamos pensar en ponernos en marcha. No tenemos demasiado tiempo.\n@c0@"
  fr: "@aNera@bNous devrions vraiment partir si tu es prêt,\r\nmon chéri. Le temps nous est compté.\n@c0@"
  it: "@aNera@bTesoro, che ne dici di andare?\nCi rimane poco tempo e abbiamo ancora molte cose da fare...\n@c0@"
  ja: "@a@bフローラ「あなた　用がすんだら\n\t先を　急ぎましょうね。\n\t私たちには　あまり　時間がないわ。\n@c0@"
55:
  de: "@a%0%a001240@bDu warst hier schon mal, als du klein warst, nicht wahr, Papa? Mit dieser Fee...\n@c0@"
  en: "@a%0%a001240@bYou came here when you were little, right, Dad?\nWith that faerie friend of yours.\n@c0@"
  es: "@a%0%a001240@bTú viniste aquí cuando eras niño, ¿verdad, papá?\nCon ese hada amiga tuya, ¿no?\n@c0@"
  fr: "@a%0%a001240@bTu es venu ici quand tu étais petit, papaⓡ\nAvec ta copine la fée, c'est çaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, è qui che venisti da piccolo insieme alla tua amica fata?\n@c0@"
  ja: "@a@b%a001240「お父さん　小さいとき\n\tここにも来たんでしょ？\n\t友だちの妖精と。\n@c0@"
56:
  de: "@a%0%a001240@bDu hast ja so ein Glück! Es hat bestimmt Spaß gemacht, mit einer Fee auf Abenteuerreise zu gehen!\n@c0@"
  en: "@a%0%a001240@bYou're so lucky! It'd be so much fun to go off adventuring with a faerie.\n@c0@"
  es: "@a%0%a001240@b¡Qué suerte! Debe de ser genial poder irse de aventuras con un hada.\n@c0@"
  fr: "@a%0%a001240@bTu as de la chanceⓠ Ça doit être vraiment génial de partir à l'aventure avec une fée.\n@c0@"
  it: "@a%0%a001240@bNon so che darei per esplorare una grotta insieme a una fata!\n@c0@"
  ja: "@a@b%a001240「いいなあ～\n\t妖精と冒険なんて　絶対　楽しいよ！\n@c0@"
57:
  de: "@a%0%a001240@bWir sollten wirklich jeden kleinsten Winkel erkunden, wo wir schon mal da sind. Ich möchte alles sehen, was du gesehen hast, als du damals hier warst.\n@c0@"
  en: "@a%0%a001240@bNow we're here, we should explore every nook and cranny. I want to see everything you saw when you were here last.\n@c0@"
  es: "@a%0%a001240@bYa que estamos aquí, deberíamos explorar todos los rincones. Quiero ver todo lo que tú viste cuando estuviste aquí.\n@c0@"
  fr: "@a%0%a001240@bPuisqu'on est là, on devrait explorer les moindres recoins de cette grotte. Je veux voir tout ce que tu as vu quand tu es venu.\n@c0@"
  it: "@a%0%a001240@bPapà, possiamo stare qui ancora per un po'?\nMi piacerebbe esplorare questa grotta da cima a fondo.\n@c0@"
  ja: "@a@b%a001240「せっかく　来たんだから\n\tすみずみまで　探検していこうよ。\n\tお父さんが冒険した場所　見たいんだ。\n@c0@"
58:
  de: "@a%0%a001240@bHier hast du also ⓞDes Schlossers Schläueⓟ gefunden...\n@c0@"
  en: "@a%0%a001240@bSo this is where you came to find ⓗLots about Locksⓘ...\n@c0@"
  es: "@a%0%a001240@bAsí que aquí fue donde encontraste ⓕTrucos de cerrajeroⓖ...\n@c0@"
  fr: "@a%0%a001240@bDonc c'est là que tu es venu récupérer ⓥLes Clefs des serruresⓦ...\n@c0@"
  it: "@a%0%a001240@bPapà, il libro ⓕL'arte delle porte aperteⓖ l'hai trovato qui, è vero?\n@c0@"
  ja: "@a@b%a001240「ふ～ん…　ここには\n\tカギの技法っていうのを\n\tさがしに来たんだね。\n@c0@"
59:
  de: "@a%0%a001240@bIch wünschte, du hättest das Buch jetzt bei dir. Ich würde gerne wissen, was drin steht.\n@c0@"
  en: "@a%0%a001240@bIf only you still had the book with you now.\nI'd love to know what was in it.\n@c0@"
  es: "@a%0%a001240@bQué pena que ya no tengas el libro.\nMe gustaría ver qué decía.\n@c0@"
  fr: "@a%0%a001240@bC'est bête que tu n'aies plus ce livre.\nJ'aurais adoré le lire.\n@c0@"
  it: "@a%0%a001240@bÈ un peccato che tu non l'abbia più con te.\nAvrei tanto voluto leggerlo...\n@c0@"
  ja: "@a@b%a001240「ボクも覚えたいな　その技法。\n\tえっ　もう　その本ないの？\n\tガッカリ……。\n@c0@"
60:
  de: "@a%0%a001250@bIch hab mir diese Höhle viel schöner vorgestellt, wo sie doch im Reich der Feen ist und so.\n@c0@"
  en: "@a%0%a001250@bI thought this cave would be so much nicer, what with it being in the Faerie Realm and everything.\n@c0@"
  es: "@a%0%a001250@bPensaba que esta cueva sería más agradable, con eso de que estaba en el Reino de las Hadas y tal.\n@c0@"
  fr: "@a%0%a001250@bJe pensais que cette grotte serait plus jolie,\nvu qu'elle est dans le royaume des Fées...\n@c0@"
  it: "@a%0%a001250@bVisto che si trova nel Regno delle Fate, credevo che questa grotta fosse molto più bella!\n@c0@"
  ja: "@a@b%a001250「妖精さんの国の　洞くつだから\n\tもっと　楽しいと思ってた……。\n@c0@"
61:
  de: "@a%0%a001250@bIch dachte, es wären Blumen an den Wänden und andere schöne Dinge. Hmpf.\n@c0@"
  en: "@a%0%a001250@bI imagined flowers all over the walls, and lots of shiny things everywhere. Hmph.\n@c0@"
  es: "@a%0%a001250@bImaginaba que habría flores en las paredes y montones de cosas brillantes por todos lados. Vaya.\n@c0@"
  fr: "@a%0%a001250@bJe m'attendais à voir des fleurs partout sur les parois et plein d'objets brillants partout. Pfff.\n@c0@"
  it: "@a%0%a001250@bMe la immaginavo colorata, profumata, piena di luce!\nChe delusione...\n@c0@"
  ja: "@a@b%a001250「カベ　いっぱいに\n\tお花が咲いていたり\n\tもっと　キラキラしててもいいよね。\n@c0@"
62:
  de: "@a%0%a001250@bIch hab mich noch nie in einer Höhle verlaufen.\n@c0@"
  en: "@a%0%a001250@bI've never got lost in a cave before.\n@c0@"
  es: "@a%0%a001250@bNunca me había perdido en una cueva.\n@c0@"
  fr: "@a%0%a001250@bJe ne me suis encore jamais perdue dans une grotte.\n@c0@"
  it: "@a%0%a001250@bHo un buon senso dell'orientamento e di solito riesco sempre a ricordare la strada che ho fatto.\n@c0@"
  ja: "@a@b%a001250「わたし　洞くつで\n\t迷ったことないの。\n@c0@"
63:
  de: "@a%0%a001250@bAber %a001240 schon. Er läuft einfach drauf los, ohne einen Gedanken daran zu verschwenden, wie er wieder rauskommt.\n@c0@"
  en: "@a%0%a001250@bBut %a001240 gets lost all the time. He just wanders on in without giving any thought to how to get back out again.\n@c0@"
  es: "@a%0%a001250@bPero %a001240 siempre se pierde. Se mete sin pensar ni un momento en cómo se las va a arreglar para salir.\n@c0@"
  fr: "@a%0%a001250@bMais %a001240 se perd tout le temps. Il se promène sans se demander comment il va revenir.\n@c0@"
  it: "@a%0%a001250@b%0%a001240, invece, si perde sempre! Va avanti sparato, senza prestare attenzione a ciò che lo circonda, e poi non sa come tornare indietro!\n@c0@"
  ja: "@a@b%a001250「でも　お兄ちゃんは\n\tダメみたい。　いつも\n\tなにも考えないで　行っちゃうのよ。\n@c0@"
64:
  de: "@a%0%a001250@bImmer wenn ich in einer Höhle bin, frage ich mich, wie es wäre, wenn plötzlich die Sonne scheinen würde...\n@c0@"
  en: "@a%0%a001250@bWhenever I walk through a cave, I always wonder what would happen if the sun suddenly shone right into the middle of it.\n@c0@"
  es: "@a%0%a001250@bCada vez que entro en una cueva me pregunto qué pasaría si el sol se pusiese a brillar dentro de ella.\n@c0@"
  fr: "@a%0%a001250@bQuand je me promène dans une grotte, je me demande toujours ce que ça ferait si le soleil\nse mettait à briller à l'intérieur tout à coup.\n@c0@"
  it: "@a%0%a001250@bLe grotte sarebbero molto più belle se in ognuna di esse splendesse un piccolo sole.\n@c0@"
  ja: "@a@b%a001250「わたし　洞くつを歩くと\n\tもし　この奥までお日さまが当たったら\n\tどうなるかなって　いつも　思うの。\n@c0@"
65:
  de: "@a%0%a001250@bDas würde alle ganz schön erschrecken, was?\n@c0@"
  en: "@a%0%a001250@bIt would certainly give everyone a shock,\nwouldn't it?\n@c0@"
  es: "@a%0%a001250@b¡Menuda sorpresa!, ¿eh?\n@c0@"
  fr: "@a%0%a001250@bJe pense que tout le monde aurait un choc, heinⓡ\n@c0@"
  it: "@a%0%a001250@bScusami, ho detto una sciocchezza colossale.\nCredo di aver avuto un improvviso calo di zuccheri...\n@c0@"
  ja: "@a@b%a001250「みんな　きっと\n\tビックリするよね。\n@c0@"
66:
  de: "@aSancho@bAh, schon wieder eine Höhle. Si, si... Als iss mit Señor Ludwig auf Reisen war, haben wir auch viele Höhlen gesehen. Viele, viele Höhlen...\n@c0@"
  en: "@aSancho@bAh, ees another cave. Sí, sí...\r\nWhen I travelled weeth señor Pankraz, we explored een many, many caves.\n@c0@"
  es: "@aSancho@bÁndale, otra cueva.\nCuando viajaba con el señor Teudis exploramos muchísimas cuevas.\n@c0@"
  fr: "@aSancho@bAh, oune autre g-grotte. Si, si... Quand je voyageais avec le señor P-Petros, nous en avons exploré des g-grottes.\n@c0@"
  it: "@aSancho@bPienso que ormai conosco todas las grottas del mundo... Ho cominciato a esplorarlas con el señor Russel, y da allora no me sono mai fermato...\n㈡\n¡Ne ho abbastanzas de estas estupidas grottas!\n@c0@"
  ja: "@a@bサンチョ「洞くつですか……。\n\tパパスさまのお供で\n\tなん度も　もぐったことがありますよ。\n@c0@"
67:
  de: "@aSancho@bWeißt du, es ist nisst leisst, eine kleine Baby mit auf Reisen zu nehmen... Si, Señor Ludwig, er war eine starke Mann, eine Macho.\n@c0@"
  en: "@aSancho@bYou know, ees no eso easy to take a young bebé weeth you when you are travelling.\r\nSí, señor Pankraz, he was eso tough. Eso macho.\n@c0@"
  es: "@aSancho@bNo fue fácil viajar llevando a un bebe como tú, ¿sabes, chamaco?\nSí, el señor Teudis era muy duro... Un puro macho.\n@c0@"
  fr: "@aSancho@bT-Tu sais, ce n'est pas facile de voyager avec oun pequeño niño. Si, le señor P-Petros était si f-fort,\r\nsi macho.\n@c0@"
  it: "@aSancho@bEl señor Russel fu muy coraggioso a portarte con sé durante el suo viaggio, chico.\r\nNo es facil girar el mundo tirandose dietro un bebè...\n@c0@"
  ja: "@a@bサンチョ「幼子を守りながらの旅なんて\n\t大変だったでしょうに　パパスさまは\n\t本当に　よくやっておられました。\n@c0@"
68:
  de: "@aSancho@bManchmal siehst du genau aus wie deine Padre, Chico.\n@c0@"
  en: "@aSancho@bEsometimes now, friend, you look just like your father, señor Pankraz.\n@c0@"
  es: "@aSancho@bA veces, chamaco, me recuerdas a tu padre, el señor Teudis.\n@c0@"
  fr: "@aSancho@bParfois, chico, t-tu ressembles vraiment à ton padre, le señor P-Petros.\n@c0@"
  it: "@aSancho@bChico, tu es incredibilmentes simile a tuo padre, el señor Russel.\n@c0@"
  ja: "@a@bサンチョ「最近　%a000090王の\n\tふとした表情が　パパスさまに\n\t見えることがありますよ……。\n@c0@"
69:
  de: "@aSancho@bSi. Du bist zu eine stattlisse Mann herangewachsen, wie Señor Ludwig.\n@c0@"
  en: "@aSancho@bSí. You have grown eento a fine man now, My Majesty.\n@c0@"
  es: "@aSancho@bSí, se ha convertido en un hombretón padrísimo, Majestad.\n@c0@"
  fr: "@aSancho@bSi. T-Tu es devenu oun homme b-bueno, Ma Majesté.\n@c0@"
  it: "@aSancho@bCuando te vedo pienso a lui, y...\n¡Claro! ¿Me esto commuovendos, no?\n¿Que altros potrei fare, eh? ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「大きくなりましたね。\n\t坊っちゃん……。\n@c0@"
70:
  de: "@aSancho@bEs ist nisst gut, in solch eine Höhle zu sein, wenn nissts geschieht, weißt du. Es ist unheimliss.. Iss fange noch an, zu zittern wie Kastagnetten.\n@c0@"
  en: "@aSancho@bEes no good to be een a cave like thees where ees no action, you know. I estart to chatter like the castanets.\n@c0@"
  es: "@aSancho@bNo me gusta estar en una cueva sin hacer nada. Siempre acabo parloteando como guacamayo.\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas bueno de rester dans une g-grotte où il ne se passe rien. Je c-commence à grelotter et mes dents font des c-castagnettes.\n@c0@"
  it: "@aSancho@b¿Chico, piensi que hablo troppos?\n@c0@"
  ja: "@a@bサンチョ「どうも　ダメですね。\n\tこういう　何もない洞くつにはいると\n\tついつい口数が多くなってしまって。\n@c0@"
71:
  de: "@aOtto@bDie Monster in dieser Gegend sind allesamt etwas mickrig. Ich könnte sie sogar besiegen, wenn ich eine Hand hinter dem Rücken festgebunden hätte!\n@c0@"
  en: "@aTuppence@bThe monsters around here are rather puny.\r\nI could fight these fellows off with one hand\r\ntied behind my back!\n@c0@"
  es: "@aAlazar@bLos monstruos que hay por aquí son más bien enclenques.\n¡Podría con ellos hasta con una mano a la espalda!\n@c0@"
  fr: "@aInnocent@bLes monstres du coin sont plutôt chétifs. Je pourrais les battre avec une main attachée dans le dosⓠ\n@c0@"
  it: "@aSimon@bI mostri che vivono da queste parti sono delle mammolette! Potrei affrontarli a occhi chiusi, con le mani legate e saltellando su una gamba sola...\n@c0@"
  ja: "@a@bピピン「このあたりの魔物は　弱いですね。\n\tこれなら　ボクひとりでも\n\t大丈夫ですよ。　まかせてください！\n@c0@"
72:
  de: "@aOtto@bAber wenn die Lage brenzlig wird, hätte ich gegen ein wenig Unterstützung natürlich nichts einzuwenden...\n@c0@"
  en: "@aTuppence@bI wouldn't turn down a bit of assistance if things took a dangerous turn, mind you.\n@c0@"
  es: "@aAlazar@bClaro que, si las cosas se pusieran feas, no me importaría que me echasen una manita.\n@c0@"
  fr: "@aInnocent@bEn même temps, je ne dirais pas non à un coup de main si les choses tournaient mal.\n@c0@"
  it: "@aSimon@bPoi aprirei gli occhi, mi farei slegare le mani e metterei entrambi i piedi per terra, altrimenti quelle belve mi farebbero a pezzi!\n@c0@"
  ja: "@a@bピピン「でも　危なくなったら\n\t助けてくださいね。\n\tたのみますよ　%a000090王！\n@c0@"
73:
  de: "@aOtto@bHier scheint es keine einzige Fee zu geben. Sollten wir net langsam weiterziehen?\n@c0@"
  en: "@aTuppence@bThere don't appear to be any faeries here.\r\nShall we be heading off, then?\n@c0@"
  es: "@aAlazar@bParece que aquí no hay ningún hada.\n¿Nos vamos, pues?\n@c0@"
  fr: "@aInnocent@bIl ne semble pas y avoir de fées dans le secteur.\nOn pourrait peut-être partir dans ce cas, nonⓡ\n@c0@"
  it: "@aSimon@bMaestà, che ne dice di andar via?\nNon mi pare che qui abbiamo altro da fare...\n@c0@"
  ja: "@a@bピピン「ここには　妖精は\n\tいないみたいですね。\n\tもう　出ていいですか？\n@c0@"
74:
  de: "@aNera@bWahrscheinlich machen sich Mama und Papa ständig Sorgen um mich...\n@c0@"
  en: "@aNera@bI'm afraid I'm probably causing Mama and Papa no end of worry.\n@c0@"
  es: "@aNera@bMe temo que la mia mamma e il mio papino estarán muy inquietos por culpa mía.\n@c0@"
  fr: "@aNera@bJ'ai bien peur de causer un souci permanent\r\nà mamma et papa.\n@c0@"
  it: "@aNera@bTesoro, a volte penso che sto creando un mucchio di preoccupazioni ai miei genitori...\n@c0@"
  ja: "@a@bフローラ「私も　ずいぶんと\n\tお父さまや　お母さまに\n\t心配をかけてしまっていますわね……。\n@c0@"
75:
  de: "@aNera@bLiebling, glaubst du, wir könnten einen kleinen Umweg über Mostroferrato machen, um sie zu beruhigen?\n@c0@"
  en: "@aNera@bDarling, I don't suppose it would be possible to take the occasional detour to Mostroferrato to put their minds at ease, would it?\n@c0@"
  es: "@aNera@bCaro mio, ¿crees que podríamos desviarnos hacia Mostroferrato de vez en cuando para tranquilizarlos un po'?\n@c0@"
  fr: "@aNera@bMon chéri. Tu crois qu'il serait possible de faire de temps en temps un petit détour par Mostroferrato pour les rassurerⓡ\n@c0@"
  it: "@aNera@bPosso chiederti un favore? Ti spiacerebbe se passassimo da Mostroferrato ogni tanto? Così potremmo salutarli e dir loro che stiamo bene...\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた。\n\t通りがかりにでも　いいですから　たまには\n\tサラボナにも　立ち寄ってくださいましね。\n@c0@"
76:
  de: "@aGriselda@bWie ich Papa kenne, macht er sich so viele Sorgen, dass er viel zu angespannt ist zum Sterben! Aber um Mama habe ich schon ein wenig Angst.\n@c0@"
  en: "@aDebora@bKnowing Papa, he'd worry himself so much that he'd be too tense to die! I am a bit concerned about Mama, though.\n@c0@"
  es: "@aStefania@b¡Sicuro que il mio papino se preocuparía tanto que no se moriría de pura tensión! Pero la mia mamma me preocupa.\n@c0@"
  fr: "@aPandora@bConnaissant papa, il s'inquiéterait tellement qu'il serait de toute façon trop tendu pour mourirⓠ\nMais je m'inquiète un peu pour mamma.\n@c0@"
  it: "@aViola@bSai, caro? Sono un po' in ansia per i miei genitori.\nTemo che siano preoccupati per la mia prolungata assenza da casa, soprattutto la mia cara mammina.\n@c0@"
  ja: "@a@bデボラ「うちのパパの場合は　心配だから\n\t死ねないって　タイプのようだけど。\n\tママのことは　ちょっとだけ心配だわ。\n@c0@"
77:
  de: "@aGriselda@bWir sollten hin und wieder in Mostroferrato vorbeischauen, %a000090.\n@c0@"
  en: "@aDebora@bWe should stop by in Mostroferrato every once in a while, %a000090.\n@c0@"
  es: "@aStefania@bDeberíamos pasar por Mostroferrato de vez en cuando, %a000090.\n@c0@"
  fr: "@aPandora@bOn devrait passer à Mostroferrato de temps en temps, %a000090.\n@c0@"
  it: "@aViola@bCerchiamo di andare a Mostroferrato quando ne avremo la possibilità, così potranno riabbracciare la loro amatissima figlia.\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090。\n\tたまには　サラボナにもいこうよね。\n@c0@"
78:
  de: "@aGriselda@bAlso ich habe nichts dagegen. Wesen wie er geben die perfekten Dienstboten ab, wenn man sie richtig ausbildet...\n@c0@"
  en: "@aDebora@bIt's good news as far as I'm concerned.\r\nCharacters like him make perfect servants if you train them right.\n@c0@"
  es: "@aStefania@bA mí me parece tutto bene.\nCon un buen entrenamiento, las personas como él son sirvientes excelentes.\n@c0@"
  fr: "@aPandora@bEn ce qui me concerne, ce sont de bonnes nouvelles. Les gens comme lui font d'excellents domestiques\r\ns'ils sont bien formés.\n@c0@"
  it: "@aViola@bQuel tipo potrebbe esserci molto utile, caro.\nHa l'aria di chi esegue gli ordini senza battere ciglio e con la massima efficienza.\n@c0@"
  ja: "@a@bデボラ「私も　喜んでいるわよ。\n\tザイルみたいなタイプはね　きっちりと\n\t教育すれば　いいしもべになるの。\n@c0@"
79:
  de: "@aGriselda@bWie bedauerlich! Ich wollte ihn zu einem perfekten Diener ausbilden. Lass dir bitte etwas einfallen, %a000090!\n@c0@"
  en: "@aDebora@bHow annoying! I was looking forward to putting him into shape. You'll have to sort something out, %a000090.\n@c0@"
