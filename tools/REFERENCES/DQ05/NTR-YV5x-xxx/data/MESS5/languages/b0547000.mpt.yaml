  es: "@aBianca@b¿Cómo? ¿Que has vivido en Cocodrilópolis? ¡Ja! ¡Bueno, ⓕvividoⓖ en un sentido amplio, claro! ... Lo siento. No quería traerte malos recuerdos, ¿sabes?\n@c0@"
