0:
  de: "@a%0%a001240@bDu kennst Winz und diesen Schleim, nicht wahr, Papa? Manchmal kommt es mir so vor, als würdest du fast jeden auf der Welt kennen!\n@c0@"
  en: "@a%0%a001240@bYou know Dwight and that slime, don't you, Dad? Sometimes it feels like you know everyone in the whole world!\n@c0@"
  es: "@a%0%a001240@bConoces a Dojo y a ese limo, ¿verdad, papá? ¡A veces parece que conoces a todo el mundo!\n@c0@"
  fr: "@a%0%a001240@bTu connais Antonin et ce gluant, papaⓡ Des fois, j'ai l'impression que tu connais vraiment tout le mondeⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ma conosci anche Ralph e quello Slime?!\nQuando li hai incontrati?\n@c0@"
  ja: "@a@b%a001240「お父さん　あのスライムのことも\n\tザイルのことも　知ってるんでしょ？\n\t世界中に　知ってる人がいるんだね。\n@c0@"
1:
  de: "@a%0%a001250@bIch würde gern mit einem Schleim in einer Höhle leben... Na ja, vielleicht ist es ja doch keine so gute Idee...\n@c0@"
  en: "@a%0%a001250@bI wouldn't mind living in a cave if I had a slime to keep me company. ...But maybe it's not such a \ngood idea.\n@c0@"
  es: "@a%0%a001250@bNo me importaría vivir en una cueva si tuviera un limo para hacerme compañía. ... Bueno, a lo mejor no es una buena idea.\n@c0@"
  fr: "@a%0%a001250@bÇa ne me dérangerait pas d'habiter dans une grotte si j'avais un gluant pour me tenir compagnie.\n... Mais ce n'est peut-être pas une bonne idée.\n@c0@"
  it: "@a%0%a001250@bNon mi dispiacerebbe vivere in una caverna se ci fosse uno Slime a tenermi compagnia... Uhm, no.\nRipensandoci, preferisco stare alle luce del sole!\n@c0@"
  ja: "@a@b%a001250「わたし　スライムさんと\n\tいっしょなら　洞くつの中に\n\t住んでもいいな。　……ダメ？\n@c0@"
2:
  de: "@aOtto@bDer alte Mann ist vor lauter Kummer um Winz gestorben? Puh, dieser Winz muss ein richtiger kleiner Teufel sein...\n@c0@"
  en: "@aTuppence@bSo the poor old man worried himself to death?\nWhat a fiend this Dwight character must be!\n@c0@"
  es: "@aAlazar@bEntonces, ¿ese pobre se murió de preocupación?\n¡Ese Dojo es un desalmado!\n@c0@"
  fr: "@aInnocent@bAlors comme ça, le pauvre homme s'est tant inquiété qu'il en est mortⓡ Cet Antonin doit vraiment être diaboliqueⓠ\n@c0@"
  it: "@aSimon@bⓕSlimaleⓖ?!\nⓕSlurpreoccupareⓖ?!\nMa come accidenti parlano questi Slime, eh?!\n@c0@"
  ja: "@a@bピピン「気苦労のせいで\n\tおじいさん　亡くなったんですかね。\n\tザイルとやら　許せんやつですね。\n@c0@"
3:
  de: "@aBianca@bZu viel Kummer ist definitiv schlecht für die Gesundheit. Du darfst dich nicht allzu sehr reinsteigern, hörst du, %a000090?\n@c0@"
  en: "@aBianca@bI s'pose too much worry could kill you if you weren't careful. Dun't you go gettin' too stressed out, will you, %a000090?\n@c0@"
  es: "@aBianca@bSupongo que, si no te andas con ojo, te puedes morir de preocupación. Tú no te estreses demasiado, ¿vale, %a000090?\n@c0@"
  fr: "@aBianca@bÊtre trop inquiet doit pouvoir finir par tuer, si l'on n'y prend garde. Essaie de ne pas trop t'en faire, d'accord %a000090ⓡ\n@c0@"
  it: "@aBianca@bChe storia triste...\nSe corrisponde a verità, questo Ralph sarà lacerato dai sensi di colpa...\n@c0@"
  ja: "@a@bビアンカ「あまりに　心労がたたると\n\t身体をこわしてしまうかも知れないわね。\n\t%a000090も　気をつけてね。\n@c0@"
4:
  de: "@a%0%a001240@bEs ist doch schön, mit vielen verschiedenen Leuten zu reisen, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bWell, it's fun travelling around with lots of different characters, right, Dad?\n@c0@"
  es: "@a%0%a001240@bQué divertido es viajar con tanta gente distinta, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bMoi, je trouve ça drôle de voyager avec plein de gens différents, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bMi piace quando nuovi personaggi si aggiungono al nostro gruppo!\nAdesso ci divertiremo ancora di più!\n@c0@"
  ja: "@a@b%a001240「だって　おおぜいで\n\t旅したほうが　おもしろいもんね！\n\tお父さんも　そう思うでしょ？\n@c0@"
5:
  de: "@a%0%a001250@bWinz ist immer sehr still. Schade eigentlich...\n@c0@"
  en: "@a%0%a001250@bDwight never says very much, though.\nIt's a bit of a shame, really.\n@c0@"
  es: "@a%0%a001250@bAunque Dojo no habla mucho, la verdad.\n¡Qué lástima!\n@c0@"
  fr: "@a%0%a001250@bEn tout cas, Antonin ne parle pas beaucoup.\nC'est un peu dommage.\n@c0@"
  it: "@a%0%a001250@bPapà, sai dirmi che tipo è questo Ralph?\nA me sembra una brava persona, ma tu lo conosci meglio di me...\n@c0@"
  ja: "@a@b%a001250「でも　ザイルさん\n\t全然　お話ししてくれないから\n\tちょっと　さみしいね。\n@c0@"
6:
  de: "@a%0%a001250@bSein Großvater ist bestimmt froh. Er muss Winz sehr gern haben.\n@c0@"
  en: "@a%0%a001250@bHis grandad is definitely happy for him.\nHe's really very fond of Dwight.\n@c0@"
  es: "@a%0%a001250@bSu abuelo se alegrará por él, eso seguro.\nEstá claro que quiere mucho a Dojo.\n@c0@"
  fr: "@a%0%a001250@bSon grand-père est forcément content pour lui.\nIl adore Antonin.\n@c0@"
  it: "@a%0%a001250@bAnch'io penso che il nonno di Ralph sarebbe contento di sapere che il nipote si è unito a noi per una missione tanto importante.\n@c0@"
  ja: "@a@b%a001250「おじいさん\n\t本当に　よろこんでるよ。\n\tザイルさんのこと　大好きなのね。\n@c0@"
7:
  de: "@aSancho@bDiese Señor Winz ist scharf wie eine Machete. Iss glaube, er ist eine gute Kamerad und eine ausgezeissnete Matador.\n@c0@"
  en: "@aSancho@bThees señor Dwight, he ees esharp like the machete. I believe he ees a valuable comrade\r\nand a fine matador.\n@c0@"
  es: "@aSancho@bEste señor Dojo es duro como machete. Creo que es un compañero de viaje padrísimo y un matador de primera.\n@c0@"
  fr: "@aSancho@bCe señor Antonin, il est très m-malin. C'est oun\r\nc-camarade de valeur et oun bueno matador.\n@c0@"
  it: "@aSancho@bEsto Ralph es una persona muy intelligente.\n¡Soy seguro que el nuestro gruppo ha fatto un ottimo acquisto!\n@c0@"
  ja: "@a@bサンチョ「でも　ザイル君は\n\tすじが良さそうですよ。\n\tあの性格が　戦い向きなんでしょうね。\n@c0@"
8:
  de: "@aOtto@bHa! Aber wohl nur, weil er auf seinen Reisen bestimmt in Schwierigkeiten geraten wird.\n@c0@"
  en: "@aTuppence@bHa! Only because he'll more than likely come to some harm on his travels!\n@c0@"
  es: "@aAlazar@b¡Ja! ¡Eso es solo porque lo más normal es que le pase algo malo en sus viajes!\n@c0@"
  fr: "@aInnocent@bHaⓠ Tout ça parce qu'il sera sûrement blessé pendant notre péripleⓠ\n@c0@"
  it: "@aSimon@bScommetto che Ralph non vale una cicca in battaglia!\n@c0@"
  ja: "@a@bピピン「それって　旅をすると\n\t危険な目に　あうからでしょうか？\n@c0@"
9:
  de: "@aOtto@bDer alte Herr konnte Winz net b'sonders gut leiden, was? Nein? Dann hab ich wohl was missverstanden...\n@c0@"
  en: "@aTuppence@bThe old man couldn't stand Dwight, could he?\nNo? Barking up the wrong tree, am I?\n@c0@"
  es: "@aAlazar@bEl viejo no aguantaba a Dojo, ¿verdad?\n¿Sí? Estoy metiendo la pata, ¿a que sí?\n@c0@"
  fr: "@aInnocent@bCe vieux grigou ne supporte pas Antonin, c'est çaⓡ Nonⓡ Alors je n'ai rien comprisⓡ\n@c0@"
  it: "@aSimon@bMaestà, non faccia affidamento su di lui, non vorrei che restasse deluso... D'altra parte, LUI non è mica un valoroso soldato di Denim. Non so se mi spiego...\n@c0@"
  ja: "@a@bピピン「じいさん　ザイルのこと\n\tうらんでたんでしょうねえ……。\n\tえっ？　ちがうって！？\n@c0@"
10:
  de: "@aBianca@bDer hat Nerven, uns einfach ⓞlustigⓟ zu nennen! Aber trotzdem ist es schön, dass jemand mal offen seine Meinung sagt...\n@c0@"
  en: "@aBianca@bHe's got a nerve, callin' us funny! Still, it's refreshin' to hear someone speak their mind, eh?\n@c0@"
  es: "@aBianca@b¡El sí que es curioso! Aunque en realidad da gusto escuchar a alguien que dice lo que piensa, ¿eh?\n@c0@"
  fr: "@aBianca@bIl a l'air d'avoir des idées très arrêtées sur les humainsⓠ En même temps, ça fait du bien d'entendre quelqu'un dire ce qu'il pense, heinⓡ\n@c0@"
  it: "@aBianca@bMa siamo sicuri di aver fatto un buon affare a prendere questo Ralph con noi? Non vorrei che fosse un peso per il nostro gruppo...\n@c0@"
  ja: "@a@bビアンカ「物好きだなんて\n\tひどい言いようね。\n\tまあ　口が悪いのは認めるけど！\n@c0@"
11:
  de: "@aNera@bEs spricht doch nichts dagegen, wenn ein junger Mann mal etwas über die Stränge schlägt. %0%a001240 ist immer so anständig.\n@c0@"
  en: "@aNera@bThere's nothing wrong with a young man having a bit of spirit like that. %0%a001240's so well-behaved.\n@c0@"
  es: "@aNera@bNo pasa niente porque un ragazzo tenga un poco de energía. %0%a001240 se porta demasiado bene.\n@c0@"
  fr: "@aNera@bMoi, je ne trouve pas ça si mal que les jeunes fassent preuve d'un certain culot. %0%a001240 est si bien élevé.\n@c0@"
  it: "@aNera@bRalph mi sembra una persona vivace e intelligente.\nChissà che il nostro %a001240 non benefici della sua compagnia…\n@c0@"
  ja: "@a@bフローラ「でも　男の子は　あれくらい\n\t元気でも　いいですわよね。\n\t%a001240は　とても　いい子だから。\n@c0@"
12:
  de: "@a%0%a001240@bHey! Soll das etwa heißen, dass du lieber so einen wie Winz als Sohn hättest?!\n@c0@"
  en: "@a%0%a001240@bHey! Are you saying you'd rather have a kid who's more like Dwight?\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¿Quieres decir que preferirías que tu hijo se pareciera más a Dojo?\n@c0@"
  fr: "@a%0%a001240@bHéⓠ Tu veux dire que tu préférerais avoir un fils comme Antoninⓡ\n@c0@"
  it: "@a%0%a001240@bEhi!\nNon starai mica insinuando che quel Ralph è più sveglio di me, eh?!\n@c0@"
  ja: "@a@b%a001240「なんだよ。　お母さんは\n\tザイルみたいな子のほうが\n\t好きなの？\n@c0@"
13:
  de: "@aNera@bAch Unsinn, Liebes! Du weißt doch, dass du und %a001250 mir die liebsten Menschen auf der Welt seid. Und dein Vater natürlich.\n@c0@"
  en: "@aNera@bDon't be silly, dear! You know you and %a001250 are my favourite people in all the world. Along with your father, of course.\n@c0@"
  es: "@aNera@b¡No digas tonterías, caro! Sabes que tú y %a001250 sois mis favoritos de tutto il mondo. Bueno, y vuestro padre, claro.\n@c0@"
  fr: "@aNera@bNe dis pas n'importe quoi, mon chériⓠ Tu sais que ta sœur et toi êtes ce que j'ai de plus cher au monde.\nAvec votre père, bien sûr.\n@c0@"
  it: "@aNera@bAssolutamente no, %a001240! Volevo solo dire che ti farà bene confrontarti con altre persone...\nNon credevo che tu fossi tanto suscettibile!\n@c0@"
  ja: "@a@bフローラ「バカね。\n\t%a001240と%a001250が　いちばん好きに\n\t決まってるでしょ？　あと　パパもね。\n@c0@"
14:
  de: "@a%0%a001240@bIch freu mich schon, zu sehen, wie Winz sich bei einem Kampf schlägt. Ha ha!\n@c0@"
  en: "@a%0%a001240@bIt'll be fun to see how Dwight behaves on the battlefield, won't it, Dad? Ha ha!\n@c0@"
  es: "@a%0%a001240@bSerá divertido ver qué hace Dojo en el campo de batalla, ¿verdad, papi? ¡Ja, ja!\n@c0@"
  fr: "@a%0%a001240@bÇa va être drôle de voir comment Antonin se bat, hein, papaⓡ Ha haⓠ\n@c0@"
  it: "@a%0%a001240@bSecondo me quel Ralph se la farà sotto non appena metterà piede sul campo di battaglia!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tザイルさんって　どんな\n\t戦い方するのかな？　楽しみだね！\n@c0@"
15:
  de: "@a%0%a001250@bHast du Winz mal in einem Kampf besiegt, Papa?\n@c0@"
  en: "@a%0%a001250@bDid you beat Dwight in a fight once, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Venciste a Dojo en combate una vez, papá?\n@c0@"
  fr: "@a%0%a001250@bEst-ce que tu as déjà battu Antonin, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, una volta hai lottato contro Ralph, non è vero?\nSono sicura che lo hai sconfitto!\n@c0@"
  ja: "@a@b%a001250「ザイルさんって\n\t昔　お父さんに　負けたの？\n@c0@"
16:
  de: "@a%0%a001250@bPuh! Dann muss ich mir also keine Sorgen machen, solange du in der Nähe bist...\n@c0@"
  en: "@a%0%a001250@bPhew! Then I don't have to worry about him being around as long as you're here too.\n@c0@"
  es: "@a%0%a001250@b¡Fiuu! Entonces no tengo que preocuparme porque esté con nosotros, mientras tú también estés aquí.\n@c0@"
  fr: "@a%0%a001250@bPfiouⓠ Dans ce cas, je n'ai pas à avoir peur de lui tant que tu seras là.\n@c0@"
  it: "@a%0%a001250@bNessuno può battere il mio paparone!\n@c0@"
  ja: "@a@b%a001250「じゃあ　安心ね！\n\tお父さんがいたら　ザイルさんと\n\tいっしょでも　こわくないよ。\n@c0@"
17:
  de: "@aSancho@bTs! Das hatte iss nisst erwartet!\n@c0@"
  en: "@aSancho@bAnda! I was no expecting thees!\n@c0@"
  es: "@aSancho@b¡Ándale! ¡Esto no me lo esperaba ni tantito!\n@c0@"
  fr: "@aSancho@bEh b-bienⓠ Je ne m'attendais p-pas à çaⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que bueno!\n¡Ahora el gruppo puede contar su un nuevo guerrero!\n@c0@"
  ja: "@a@bサンチョ「おやまあ　こんな所で\n\t思わぬ出会いですね。\n@c0@"
18:
  de: "@aOtto@bIch gehe wohl recht in der Annahme, dass er mit den anderen Monstern reisen wird, nicht wahr? Er wird kein Teil Eurer Elitetruppe sein, oder?\n@c0@"
  en: "@aTuppence@bHe's just going to be lumped in with the other monsters though, correct? He won't be part\r\nof your select elite like I am.\n@c0@"
  es: "@aAlazar@bPero formará parte del grupo de los demás monstruos, ¿no? No será parte de la élite, como yo.\n@c0@"
  fr: "@aInnocent@bDites-moiⓠ Il va rester avec les autres monstresⓡ Il ne fera pas partie des compagnons de choix tels que moiⓡ\n@c0@"
  it: "@aSimon@bMaestà, non vorrà mica schierare in prima linea un nanerottolo che non è nemmeno in grado di dire il proprio nome, vero? Vero?!\n㈡\nSanta dea, proteggici tu!\n@c0@"
  ja: "@a@bピピン「あくまで　仲間モンスターの\n\t一員としてですよね？\n\tボクという　精鋭がいるんですから！\n@c0@"
19:
  de: "@a%0%a001240@bSeltsam. Warum konnte Winz sich uns nicht anschließen? Haben wir schon zu viele Monster bei uns?\n@c0@"
  en: "@a%0%a001240@bThat's weird. How come Dwight couldn't join us? Have we got too many monsters already?\n@c0@"
  es: "@a%0%a001240@b¡Qué raro! ¿Por qué Dojo no se ha podido unir a nosotros? ¿Es que ya tenemos demasiados monstruos?\n@c0@"
  fr: "@a%0%a001240@bC'est bizarre. Comment ça se fait qu'Antonin n'a pas pu se joindre à nousⓡ On a déjà trop de monstresⓡ\n@c0@"
  it: "@a%0%a001240@bCome mai non hai voluto accettare Ralph nel gruppo?\n㈡\nCapisco che non sia un guerriero abile quanto me, ma un po' di bassa manovalanza ci avrebbe fatto comodo... Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「あれ？　ザイルさん\n\t仲間にできなかったの？\n\tモンスター　いっぱいだっけ？\n@c0@"
20:
  de: "@a%0%a001250@bUm ehrlich zu sein, bin ich ganz froh. Aus irgendeinem Grund macht mir dieser Winz Angst...\n@c0@"
  en: "@a%0%a001250@bTo be honest, I'm quite relieved. Dwight gives me the creeps for some reason.\n@c0@"
  es: "@a%0%a001250@bLa verdad es que me siento aliviada. Sea por lo que sea, Dojo me da escalofríos.\n@c0@"
  fr: "@a%0%a001250@bPour être honnête, je suis plutôt soulagée. Je ne sais pas trop pourquoi, mais Antonin me fait un peu peur.\n@c0@"
  it: "@a%0%a001250@bSai una cosa, papà?\nUn po' mi dispiace che tu non abbia voluto Ralph nel gruppo. Mi era simpatico...\n@c0@"
  ja: "@a@b%a001250「ちょっと　ホッとしたの。\n\tだって　ザイルさん\n\tなんだか　こわいんだもん。\n@c0@"
21:
  de: "@a%0%a001240@bMan muss immer Bitte sagen, wenn man möchte, dass jemand einem einen Gefallen tut, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bYou should always say please when you ask someone a favour, right, Dad?\n@c0@"
  es: "@a%0%a001240@bCuando se pide un favor a alguien siempre se dice “por favor”, ¿no, papá?\n@c0@"
  fr: "@a%0%a001240@bIl ne faut jamais oublier le mot magique quand on demande quelque chose, pas vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, come mai Ralph non riesce a pronunciare il suo nome?\nForse è troppo stupido per riuscirci? Eh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「人に　ものを　たのむときは\n\tお願いしますって　言わないと\n\tいけないんだよねっ？\n@c0@"
22:
  de: "@a%0%a001250@bDu bist gar nicht gefühllos! Du tust einfach nur, was das Beste für uns ist, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001250@bYou're not cold! You're just doing what's best for us, aren't you, Dad?\n@c0@"
  es: "@a%0%a001250@b¡Que no se queja! Pero si no hace otra cosa...\n@c0@"
  fr: "@a%0%a001250@bTu n'es pas froidⓠ Tu fais seulement ce qui te paraît le mieux pour nous, n'est-ce pas, papaⓡ\n@c0@"
  it: "@a%0%a001250@bNon sei una persona fredda e insensibile! Hai fatto solo ciò che ritenevi più giusto per tutti noi!\nGrrrrr! Ora quel Ralph mi sta proprio antipatico!\n@c0@"
  ja: "@a@b%a001250「お父さんは　冷たくないもん！\n\tわたしたちに　やさしいんだもん！\n\tねっ？\n@c0@"
23:
  de: "@aSancho@bDiese Señor, er ist voller Garbanzos, no? Warum willst du nisst, dass er siss uns anschließt?\n㈡\nEs ist immer gut, einen feurigen Kämpfer zu haben. Si, feurig wie Jalapeño.\n@c0@"
  en: "@aSancho@bThees señor, he ees full of garbanzos, sí?\r\nYou no want heem to join us? Ees good to have esuch a fiery fighter. Sí, fiery like a jalapeño.\n@c0@"
  es: "@aSancho@bEse señor pues tiene demasiadas energías.\n¿No quieres que se venga con nosotros? Está bueno tener un luchador así, peleón como chile.\n@c0@"
  fr: "@aSancho@bCe señor, il a la patata. T-Tu ne veux pas de luiⓡ Ce serait b-bien d'avoir oun combattant comme lui, aussi fort qu'oun jalapeño.\n@c0@"
  it: "@aSancho@bChico, yo pienso que el señor Ralph es muy bueno en battaglia...\r\n¿Sei seguro que no vuoi farlo entrare nel gruppo?\n@c0@"
  ja: "@a@bサンチョ「おやまあ　元気な人ですね。\n\tどうです　仲間にしてあげては？\n\t戦力は多いほうが　いいですし……。\n@c0@"
24:
  de: "@aOtto@bBei der allmächtigen Göttin! Wie kann er es wagen, dem König von Humburg mit solch einer Respektlosigkeit zu begegnen?\n@c0@"
  en: "@aTuppence@bThe cheek of it! How dare he address the King of Gotha with such insolence!\n@c0@"
  es: "@aAlazar@b¡Hay que ver qué cara! ¿Cómo se atreve a hablar con el rey de Pankraz con esa insolencia?\n@c0@"
  fr: "@aInnocent@bQuelle audaceⓠ Comment ose-t-il parler au roi de Gotha de cette manièreⓡ\n@c0@"
  it: "@aSimon@bQuel Ralph è un dannato insolente!\nCome osa rivolgersi al Re di Denim in quel modo?!\n@c0@"
  ja: "@a@bピピン「なんですか　アイツは？\n\t%a000090王に　あんな\n\t無礼なクチをきいて！\n@c0@"
25:
  de: "@a%0%a001240@bWinz ist ganz schön wild, was? Und genauso kämpft er auch... Das muss man echt gesehen haben!\n@c0@"
  en: "@a%0%a001240@bDwight's pretty wild, isn't he? The way he fights has to be seen to be believed!\n@c0@"
  es: "@a%0%a001240@bDojo es un poco bestia, ¿no? ¡Cuando pelea, hay que verlo para creerlo!\n@c0@"
