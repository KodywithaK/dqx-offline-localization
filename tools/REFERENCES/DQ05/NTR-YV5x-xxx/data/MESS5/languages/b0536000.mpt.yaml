0:
  de: "@a%0%a001240@bGlaubst du, dass er einfach so aufgeben wird? Ich würde nie aufgeben, wenn ich schon so weit gekommen wäre!\n@c0@"
  en: "@a%0%a001240@bDo you think he's just going to give up? I'd never give up having got this far!\n@c0@"
  es: "@a%0%a001240@b¿Crees que se va a rendir y ya está?\n¡Yo no me rendiría después de llegar hasta aquí!\n@c0@"
  fr: "@a%0%a001240@bTu crois qu'il va abandonnerⓡ\nMoi, je n'abandonnerais pas si\nj'étais arrivé aussi loinⓠ\n@c0@"
  it: "@a%0%a001240@bHa intenzione di rinunciare?\nDopo aver fatto tanta fatica per arrivare fin qui?!\nCerta gente non la capisco...\n@c0@"
  ja: "@a@b%a001240「あの人　こんなところで\n\tあきらめちゃうのかな？\n\tボクなら　絶対　あきらめないけどね！\n@c0@"
1:
  de: "@a%0%a001250@bDieser Mann scheint keinen fliegenden Teppich gehabt zu haben. Wie er wohl hier hoch gekommen ist?\n@c0@"
  en: "@a%0%a001250@bIt didn't look like that man had a flying carpet.\nI wonder how he managed to get here.\n@c0@"
  es: "@a%0%a001250@bNo parecía que aquel hombre tuviese ninguna alfombra voladora.\n¿Cómo habrá llegado hasta aquí?\n@c0@"
  fr: "@a%0%a001250@bJe ne crois pas que cet homme ait un tapis volant.\nJe me demande comment il a fait pour arriver là.\n@c0@"
  it: "@a%0%a001250@bNon mi è sembrato che quel tipo avesse un tappeto volante...\nCome avrà fatto ad arrivare qui?\n@c0@"
  ja: "@a@b%a001250「さっきの人　まほうのじゅうたん\n\t持ってなさそうなのに\n\tよくここまで　来られたよね。\n@c0@"
2:
  de: "@aOtto@bDieser Schatz gehört uns!\nÄh, ich meine, Euch, %a000090.\n@c0@"
  en: "@aTuppence@bThat treasure's ours!\nEr, I mean, yours, %a000090.\n@c0@"
  es: "@aAlazar@b¡Ese tesoro es nuestro!\nDigo, vuestro, %a000090.\n@c0@"
  fr: "@aInnocent@bLe trésor est à nousⓠ\nEuh, je veux dire, il est à vous, %a000090.\n@c0@"
  it: "@aSimon@bEvviva! Il tesoro è nostro!\nCioè, il tesoro è suo, re %a000090...\n@c0@"
  ja: "@a@bピピン「お宝は　ボクたちが……\n\tいや　%a000090さまが\n\tイタダキですよっ！\n@c0@"
3:
  de: "@a%0%a001240@bOh! Dann befindet sich Zenithia jetzt auf dem Grund eines Sees? Also doch kein Luftschloss!\n@c0@"
  en: "@a%0%a001240@bOh! So Zenithia's at the bottom of a lake now?\nSo much for it being a castle in the sky!\n@c0@"
  es: "@a%0%a001240@b¡Oh! ¿Así que ahora Zenithia está en el fondo de un lago?\n¡Vamos, que ni castillo en el aire ni nada!\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Alors comme ça, Zénithia se trouve au fond d'un lac, maintenantⓡ Dommage pour un château qui est censé être dans le cielⓠ\n@c0@"
  it: "@a%0%a001240@bE così il Castello di Zenithia è in fondo a un lago?\nSperiamo che gli Zenithiani sappiano nuotare!\n@c0@"
  ja: "@a@b%a001240「えっ？\n\t天空城は　湖の底なの？\n\tそれじゃ　天空城って言えないよ！\n@c0@"
4:
  de: "@aSancho@bDiese Hombre war eine Zenithianer, no?\n@c0@"
  en: "@aSancho@bThees man, he ees Zenithian, no?\n@c0@"
  es: "@aSancho@bEse señor es de Zenithia, ¿no?\n@c0@"
  fr: "@aSancho@bCet hombre, c'est oun Z-Zénithien, noⓡ\n@c0@"
  it: "@aSancho@b¿Quell'hombre es uno Zenithiano?\n@c0@"
  ja: "@a@bサンチョ「なんと　天空人さんじゃ\n\tないですか。\n@c0@"
5:
  de: "@aSancho@bErinnerst du diss noch an die Señora aus Zenithia in Humburg? Es wird sie sisser freuen, dass wir diesen Hombre gesehen haben! Wundervolle Neuigkeiten!\n@c0@"
  en: "@aSancho@bYou remember the Zenithian señora een Gotha?\r\nEshe, eshe be eso happy that we esee thees man here! Ees wonderful news for her!\n@c0@"
  es: "@aSancho@b¿Recuerdas a la señora de Zenithia que vive en Pankraz?\n㈡\n¡Qué feliz será cuando sepa que hemos visto a este hombre! ¡Pues será una noticia padrísima para ella!\n@c0@"
  fr: "@aSancho@bV-Vous vous rappelez de cette señora zénithienne à G-Gothaⓡ Elle s-serait si heureuse qu'on ait vu\nc-cet hommeⓠ C'est oune bonne nouvelle pour elleⓠ\n@c0@"
  it: "@aSancho@bLa señora zenithiana que vive a Denim sarebbe muy feliz de sabere que abbiamo encontrato un suo concittadino... ¿O se dovrebbe dire ⓕconcastillanoⓖ?\n@c0@"
  ja: "@a@bサンチョ「あの方を見たら\n\tグランバニアの　天空人の女性も\n\t元気が出るんじゃないでしょうか？\n@c0@"
6:
  de: "@a%0%a001250@bIch kann gut mit Stäben umgehen, Papa. Komm, ich zeig's dir!\n@c0@"
  en: "@a%0%a001250@bI'm quite good at using staffs. Let me try it out, Dad!\n@c0@"
  es: "@a%0%a001250@bSoy bastante buena con los báculos. ¡Déjamelo probar, papá!\n@c0@"
  fr: "@a%0%a001250@bJe me débrouille bien avec les bâtons.\nLaisse-moi essayer, papaⓠ\n@c0@"
  it: "@a%0%a001250@bLasciami provare, papà.\nSono brava a usare bacchette e bastoni!\n@c0@"
  ja: "@a@b%a001250「わたし\n\t杖を使うのは　得意です！\n\tお父さん　わたしに　使わせてね。\n@c0@"
7:
  de: "@aOtto@bDie Treppe nach oben hört einfach hier auf. Ich frage mich, ob es dort tatsächlich jemals ein Schloss gegeben hat...\n@c0@"
  en: "@aTuppence@bThe stairs leading up cut off just there. I wonder if there really used to be a castle at the top of them.\n@c0@"
  es: "@aAlazar@bLas escaleras que llevan hacia arriba se cortan aquí. ¿De verdad habría un castillo al final?\n@c0@"
  fr: "@aInnocent@bL'escalier qui monte ne va pas plus loin. Je me demande s'il y avait vraiment un château en haut.\n@c0@"
  it: "@aSimon@bLe scale sembrano finire lì.\nChissà se in cima c'era davvero un castello...\n@c0@"
  ja: "@a@bピピン「上への階段が　あそこで\n\tとぎれちゃってますね。\n\t本当は　あの先にお城があったのかな？\n@c0@"
8:
  de: "@a%0%a001240@bHm? Wo ist denn der alte Mann hin? Meinst du, er ist zurück in den Himmel gegangen?\n@c0@"
  en: "@a%0%a001240@bHey! Where did that old man go? Do you think he went home to the sky?\n@c0@"
  es: "@a%0%a001240@b¡Eh!, ¿adónde ha ido ese abuelete? ¿Crees que habrá vuelto a su casa del cielo?\n@c0@"
  fr: "@a%0%a001240@bHéⓠ Où est parti le papyⓡ Tu crois qu'il est reparti chez lui, dans le cielⓡ\n@c0@"
  it: "@a%0%a001240@bEhi! Dov'è andato quel signore?\nCredi che sia tornato in cielo, a casa sua?\n@c0@"
  ja: "@a@b%a001240「あれ？\n\tさっきのおじいさん　消えちゃったよ？\n\tお空に　帰っちゃったのかな？\n@c0@"
9:
  de: "@a%0%a001250@bWar der alte Mann ein Geist? Er war gar nicht so furchteinflößend.\n@c0@"
  en: "@a%0%a001250@bWas that old man a ghost? He wasn't at all scary.\n@c0@"
  es: "@a%0%a001250@bEse anciano ¿era un fantasma? Pues no daba miedo ni nada.\n@c0@"
  fr: "@a%0%a001250@bCe vieil homme était un fantômeⓡ\nIl ne faisait pas peur du tout.\n@c0@"
  it: "@a%0%a001250@bÈ sparito!\nNon sarà stato mica un fantasma?!\n@c0@"
  ja: "@a@b%a001250「あのおじいさん\n\tゆうれいさん　だったの？\n\tでも　こわくなかったよね……。\n@c0@"
10:
  de: "@aOtto@bEr hätte uns ruhig mitteilen können, in welchen See das Schloss gefallen ist, bevor er einfach so verschwindet.\n@c0@"
  en: "@aTuppence@bIt would've been helpful if he could've told us which lake the castle is in before he disappeared like that.\n@c0@"
  es: "@aAlazar@bPodría habernos dicho en qué lago está el castillo antes de desaparecer así.\n@c0@"
  fr: "@aInnocent@bAvant de disparaître comme ça, il aurait pu nous dire dans quel lac se trouve le château.\n@c0@"
  it: "@aSimon@bCerto che prima di sparire avrebbe anche potuto dirci in fondo a quale lago è precipitato il castello, no?! Cosa gli costava?!\n@c0@"
  ja: "@a@bピピン「消えちゃう前に\n\tどこの湖に　沈んでいるのか\n\t教えてほしかったですよ。\n@c0@"
11:
  de: "@aSancho@bKeine Problema. Es gibt ja gar nisst so viele Seen auf diese Welt, no? Wir gehen einfach zu jede See hin und finden das Castillo, si?\n@c0@"
  en: "@aSancho@bEes okay. Een thees world, there are no eso\r\nmany lakes. We visit them all, and we find\r\nthees castle, sí?\n@c0@"
  es: "@aSancho@bNo pasa nadaⓓ no hay muchos lagos en este mundo. Los visitaremos todos, nomás, y pues daremos con el castillo.\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas g-grave. Il n'y a pas tant de lacs que ça dans le mundo. On fait le t-tour et on trouve le castelⓠ\n@c0@"
  it: "@aSancho@b¡Muy bien! ¡Ahora no dobbiamo fare altros que esplorare todos los lagos del mundo, y escopriremo donde es precipitato el castillo!\n@c0@"
  ja: "@a@bサンチョ「大丈夫です。　この世界に\n\t湖は　たくさん　ありませんから……。\n\tひとつずつ　当たってみましょう。\n@c0@"
12:
  de: "@a%0%a001240@bWas für ein beeindruckender Turm! Es scheint wirklich so, als würde er in den Himmel ragen!\n@c0@"
  en: "@a%0%a001240@bWhat an amazing tower! It really does feel like it reaches up to the sky!\n@c0@"
  es: "@a%0%a001240@b¡Menuda torre! ¡Parece que llegue hasta el cielo de verdad!\n@c0@"
  fr: "@a%0%a001240@bCette tour est vraiment impressionnanteⓠ\nOn dirait qu'elle touche le cielⓠ\n@c0@"
  it: "@a%0%a001240@bQuesta torre è altissima!\nSembra davvero che arrivi fino in cielo!\n@c0@"
  ja: "@a@b%a001240「すごい　塔だね！\n\tホントに　空に届きそうだよ。\n@c0@"
13:
  de: "@a%0%a001250@bDu führst mich doch, oder, Papa? Ich hab nämlich die Augen geschlossen, weißt du...\n@c0@"
  en: "@a%0%a001250@bMake sure you guide me, won't you, Dad? I'm walking with my eyes shut, you see!\n@c0@"
  es: "@a%0%a001250@bTú me guías, ¿vale, papi? ¡Estoy andando con los ojos cerrados!\n@c0@"
  fr: "@a%0%a001250@bPapa, tu me guides, heinⓡ Parce qu'en fait, j'avance les yeux fermésⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, mi guideresti tu?\nNon ho il coraggio di aprire gli occhi, perché soffro di vertigini...\n@c0@"
  ja: "@a@b%a001250「お父さん　ちゃんと\n\tみちびいてね。\n\tわたし　目をつむって　歩くから！\n@c0@"
14:
  de: "@aSancho@bWenn du so hoch kletterst, Chico, musst du manchmal schlucken, weißt du. Sonst tun dir irgendwann die Ohren weh.\n@c0@"
  en: "@aSancho@bWhen you are climbing eso high up, ees important to eswallow sometimes.\r\nOtherwise your ears, they estart to hurt.\n@c0@"
  es: "@aSancho@bCuando subes muy arribota, es importante tragar de vez en cuando.\nSi no lo haces, te comienzan a doler los oídos.\n@c0@"
  fr: "@aSancho@bQ-Quand tu montes si haut, il faut d-d-déglutir de temps en temps. Sinon, tu peux avoir mal aux oreilles.\n@c0@"
  it: "@aSancho@bCuando se sale così en altos, se deve deglutire ogni tantos, altrimenti se otturano las orecchias.\n@c0@"
  ja: "@a@bサンチョ「上の階へ　あがったら\n\tときどき　ツバを飲んでくださいね。\n\t耳が　おかしくなりますよ。\n@c0@"
15:
  de: "@aOtto@bSeid Ihr auch sicher, dass dieser Turm solide gebaut ist? Nicht, dass er unter uns zusammenbricht, meine ich...\n@c0@"
  en: "@aTuppence@bAre you sure this tower is perfectly safe? It won't collapse while we're climbing, will it?\n@c0@"
  es: "@aAlazar@b¿Seguro que esta torre es segura? No se caerá mientras estamos subiéndola, ¿verdad?\n@c0@"
  fr: "@aInnocent@bVous êtes sûr qu'il n'y a aucun dangerⓡ La tour ne va pas s'effondrer pendant qu'on monteⓡ\n@c0@"
  it: "@aSimon@bSiamo sicuri che questa torre è solida?\nNon vorrei che crollasse proprio mentre la scaliamo...\n@c0@"
  ja: "@a@bピピン「この塔　大丈夫ですか？\n\tボクたちがいる間に\n\tくずれたりしませんように……！\n@c0@"
16:
  de: "@a%0%a001240@bHier gibt es so viele Säulen! Wie viele es wohl genau sind?\n@c0@"
  en: "@a%0%a001240@bThere are so many pillars here! I wonder how many there are exactly...\n@c0@"
  es: "@a%0%a001240@b¡Esto está lleno de columnas! Me pregunto cuántas habrá...\n@c0@"
  fr: "@a%0%a001240@bRegarde tous ces piliersⓠ Je me demande combien\nil y en a exactement...\n@c0@"
  it: "@a%0%a001240@bMa quante colonne ci saranno qui?!\nSono tantissime!\n@c0@"
  ja: "@a@b%a001240「ここって　柱が　いっぱいだね。\n\tいったい　何本あるのかなあ？\n@c0@"
17:
  de: "@a%0%a001250@bÄhm... das ist doch eigentlich das Erdgeschoss, oder? Warum ist es dann so hoch?\n@c0@"
  en: "@a%0%a001250@bUm... This is basically the first floor, right?\nSo why is it so high?\n@c0@"
  es: "@a%0%a001250@bMmm... Esto viene a ser el primer piso, ¿no?\n¿Y por qué está tan alto?\n@c0@"
  fr: "@a%0%a001250@bMmm... C'est le rez-de-chaussée, nonⓡ\nAlors pourquoi est-il si hautⓡ\n@c0@"
  it: "@a%0%a001250@bChe strano...\nSiamo solo al primo piano, eppure mi sembra di stare molto in alto!\n@c0@"
  ja: "@a@b%a001250「あの…　ここって\n\tいちおう　１階でしょ？\n\tなのに　なんで　こんな高いの！？\n@c0@"
18:
  de: "@aSancho@bPuh! Morgen werden wir alle haben eine steife Nacken, no?\n@c0@"
  en: "@aSancho@bUf! Tomorrow, we wake up esteeff like the estale tortilla, eh?\n@c0@"
  es: "@aSancho@b¡Uf! Mañana nos vamos a despertar más tiesos que tortilla de tres días, ¿eh?\n@c0@"
  fr: "@aSancho@bPfiouⓠ D-Demain, on sera aussi frais qu'une vieille\nt-tortilla.\n@c0@"
  it: "@aSancho@b¡Ay, que faticas!\nMañana avrò todos los muscolos indolenzitos...\n@c0@"
  ja: "@a@bサンチョ「こりゃ　明日から\n\tしばらく　筋肉痛だ。\n\tとほほほほ……。\n@c0@"
19:
  de: "@aOtto@bIch habe lange als Burgwache gearbeitet, die Höhe macht mir also keine Angst. Wir müssen einfach weiterklettern!\n@c0@"
  en: "@aTuppence@bI'm fine with high places after all my time working as a castle guard. So let's just keep on climbing!\n@c0@"
  es: "@aAlazar@bDespués de trabajar de guardia en el castillo, las alturas no me molestan. ¡Vamos a seguir escalando!\n@c0@"
  fr: "@aInnocent@bJe n'ai plus le vertige après tout ce temps passé\nà garder le château. Continuons à monterⓠ\n@c0@"
  it: "@aSimon@bSono giovane e forte: potrei arrivare fino in cima di corsa e cantando a squarciagola! Comunque, una pausa ogni tanto non ci starebbe affatto male...\n@c0@"
  ja: "@a@bピピン「お城の見まわりで\n\tボク　高い所は　なれてるんです。\n\tどんどん行きましょう！\n@c0@"
20:
  de: "@a%0%a001250@bHuch! Der Boden hat überall Risse! Er wird doch nicht unter uns einstürzen, oder?\n@c0@"
  en: "@a%0%a001250@bYikes! The floor's all cracked. You don't think it'll collapse, do you?\n@c0@"
  es: "@a%0%a001250@b¡Uy! El suelo está agrietado. No se derrumbará, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bOh làⓠ Le sol est tout abîmé. Tu n'as pas peur qu'il s'effondreⓡ\n@c0@"
  it: "@a%0%a001250@bAccidenti! Il pavimento è ridotto maluccio...\nNon è che ci crollerà sotto i piedi?\n@c0@"
  ja: "@a@b%a001250「あっ！\n\t……ヒビの床　ふんじゃった。\n\tわれない……よね？\n@c0@"
21:
  de: "@aOtto@bIch hätte mich schon hoffnungslos verlaufen, wenn ich alleine hier wäre. Wie gut, dass Ihr den Weg kennt, %a000090.\n@c0@"
  en: "@aTuppence@bI'd be completely lost by now if I were here\non my own. Thank the Goddess you know the\nway, %a000090!\n@c0@"
  es: "@aAlazar@bSi estuviese aquí solo ya estaría más que perdido. ¡Menos mal que vos sabéis el camino, %a000090!\n@c0@"
  fr: "@aInnocent@bJe serais complètement perdu si j'étais tout seul. Heureusement que vous êtes là, %a000090ⓠ\n@c0@"
  it: "@aSimon@bSe fossi qui da solo, mi sarei perso da un pezzo.\nPer fortuna lei conosce la strada, Maestà!\n@c0@"
  ja: "@a@bピピン「ひとりで来てたら\n\t絶対　迷っちゃいましたよ。\n\tさすが　%a000090さまですね！\n@c0@"
22:
  de: "@a%0%a001240@bFalls sich hier irgendwo Monster verstecken, brauchst du dir keine Sorgen zu machen. Ich werd' schon mit ihnen fertig!\n@c0@"
  en: "@a%0%a001240@bDon't worry about monsters jumping out on us.\nI can handle them!\n@c0@"
  es: "@a%0%a001240@bNo te preocupes por los ataques de los monstruos.\n¡Yo me encargo de ellos!\n@c0@"
  fr: "@a%0%a001240@bT'inquiète pas si des monstres nous attaquent.\nJe m'en occuperaiⓠ\n@c0@"
  it: "@a%0%a001240@bNon preoccuparti dei mostri...\nA loro ci penso io! Se oseranno farsi vedere, li farò fettine sottili sottili!\n@c0@"
  ja: "@a@b%a001240「魔物が出たって\n\tへっちゃらだよ！\n\tボク　がんばるから！\n@c0@"
23:
  de: "@a%0%a001250@bDer Turm ist zwar schon etwas runtergekommen, aber trotzdem ist er hübsch.\nOder hört sich das jetzt doof an?\n@c0@"
  en: "@a%0%a001250@bIt's in a bit of a state now, but it's quite a pretty tower. Or is that a silly thing to say?\n@c0@"
  es: "@a%0%a001250@bAuque ahora está en un estado un poco lamentable, es una bonita torre. No he dicho una tontería, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bCette tour n'est pas en très bon état, mais elle est jolie. Tu trouves que c'est idiot de dire çaⓡ\n@c0@"
  it: "@a%0%a001250@bAnche se non è in buone condizioni, questa torre resta pur sempre un vero prodigio architettonico...\n@c0@"
  ja: "@a@b%a001250「ボロボロだけど　きれいな塔ね。\n\t……あれ？　なんか\n\t変な言いかたしちゃった！\n@c0@"
24:
  de: "@aSancho@bHah... hah... Es... hah... wird immer... hah ... schwieriger zu atmen, no?\nHah... hah...\n@c0@"
  en: "@aSancho@bHahh...hahh...\r\nEes...hahh...getting hard to...hahh...breathe, no?\r\nHahh...hahh...\n@c0@"
  es: "@aSancho@bAaah..., aaah...\r\nHíjole... ahhh... cada vez... ahh... es más difícil... respirar.\n@c0@"
  fr: "@aSancho@bAaah... Aaah... Ç-Ça devient de plus en plus difficile de r-r-respirer. Aaah... Aaah...\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh...\nMe mancaaah... el fiaaahto...\nHaaahhh... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「ふう　ふう……。\n\tちょ　ちょっとばかり\n\t息が切れてきました……。\n@c0@"
25:
  de: "@aOtto@bIch möcht' noch einmal zum Ausdruck bringen, wie schön ich es finde, dass ich durch Euch so viele Orte in der Welt kennenlernen darf, %a000090!\n@c0@"
  en: "@aTuppence@bI must say that I'm delighted you've been able to bring me to so many different places, %a000090.\n@c0@"
  es: "@aAlazar@bEstoy muy satisfecho de haberos podido acompañar a sitios tan distintos, %a000090.\n@c0@"
  fr: "@aInnocent@bJe dois avouer que je suis ravi que vous m'ayez fait découvrir autant d'endroits, %a000090.\n@c0@"
  it: "@aSimon@bRe %a000090, con lei sto scoprendo luoghi dei quali ignoravo persino l'esistenza! Sono onorato che mi abbia scelto per accompagnarla in missione!\n@c0@"
  ja: "@a@bピピン「ボク　%a000090さまに\n\tいろいろな所へ　連れてきてもらえて\n\tうれしいですっ！\n@c0@"
26:
  de: "@a%0%a001240@bEs ist wirklich gut, wenn man weiß, dass man nicht alleine kämpft, nicht? Ich fühl mich dann jedenfalls, als ob ich's mit allem aufnehmen könnte.\n@c0@"
  en: "@a%0%a001240@bIt really helps to have people fighting alongside\nyou, don't you think? That's why I feel like I can handle anything.\n@c0@"
  es: "@a%0%a001240@bEsto de tener personas que luchen a tu lado siempre ayuda, ¿verdad? Por eso tengo la sensación de que puedo con cualquier cosa.\n@c0@"
  fr: "@a%0%a001240@bÇa aide d'avoir des compagnons quand il faut\nse battre. Du coup, ça me donne l'impression\nque je peux affronter n'importe quoi.\n@c0@"
  it: "@a%0%a001240@bQuando so di poter contare su compagni fidati, mi sento di poter affrontare qualunque avversario!\nFatevi sotto, mostracci cattivi!\n@c0@"
  ja: "@a@b%a001240「みんなが　いてくれるって\n\t心強いよね。\n\tだから　ボク　がんばれるんだ。\n@c0@"
27:
  de: "@a%0%a001250@bEs ist schön, von hier aus in den Himmel zu gucken. Aber runtersehen ist überhaupt nicht schön!\n@c0@"
  en: "@a%0%a001250@bIt's nice to be able to see up into the sky from here. But it's annoying not to be able to look down!\n@c0@"
  es: "@a%0%a001250@bQué bonito es mirar al cielo desde aquí. ¡Pero es un fastidio no poder mirar hacia abajo!\n@c0@"
  fr: "@a%0%a001250@bJe trouve ça chouette de pouvoir voir le ciel d'ici.\nLe problème, c'est de ne pas pouvoir regarder\nen basⓠ\n@c0@"
  it: "@a%0%a001250@bDa quassù si potrà certo ammirare un panorama incredibile! Peccato che non lo vedrò mai, perché soffro di vertigini e non ho il coraggio di guardare!\n@c0@"
  ja: "@a@b%a001250「塔から　お空を見るのは\n\tいいけど…　下は見られないよ。\n\tすいこまれそう……。\n@c0@"
28:
  de: "@aSancho@bNoch mehr Treppen?! Du kennst deine Onkel Sancho, iss mag keine Höhen... da wird mir immer ganz schwindelig!\n@c0@"
  en: "@aSancho@bMore estairs!? You know Sancho, he no like heights eso much... I estart to feel dizzy.\n@c0@"
  es: "@aSancho@b¡¿Más escaleras?! A Sancho no le gustan demasiado las alturas... Me comienzo a marear.\n@c0@"
  fr: "@aSancho@bEncore des escaliersⓠⓑ Sancho n'aime pas mucho les escaliers... Je c-commence à avoir le v-v-vertige.\n@c0@"
  it: "@aSancho@b¿Ancoras escalas?\n¡Argh!\nQuasi quasi lo zio Sancho te aspetta aquí, chico.\n㈡\nMentre tu arrivi en cima, yo me mangio una ricca paella y después faccio una siesta...\n@c0@"
  ja: "@a@bサンチョ「ああ　もうっ　階段ばっかり！\n\tぜえぜえ…　なんだか\n\t気が　遠くなってきました。\n@c0@"
29:
  de: "@aOtto@bGute Göttin! Welch unglaubliche Aussicht. Um uns herum ist nur noch Himmel.\n@c0@"
  en: "@aTuppence@bGood heavens! What an incredible view. The only thing around us now is sky.\n@c0@"
  es: "@aAlazar@b¡Cielo santo! ¡Que increíble vista! Estamos rodeados de cielo.\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ La vue est magnifique. On est tout simplement entourés par le ciel.\n@c0@"
  it: "@aSimon@bSanti numi, che spettacolo!\nIntorno a noi c'è solo il cielo!\nMi sembra di volare...\n@c0@"
  ja: "@a@bピピン「すごいですねえ。\n\tもう　まわりは　空しか見えませんよ。\n@c0@"
30:
  de: "@a%0%a001240@bHey! Ist das etwa eine Sackgasse?\n@c0@"
  en: "@a%0%a001240@bHey! Are we at a dead end?\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¿Es un callejón sin salida?\n@c0@"
  fr: "@a%0%a001240@bHéⓠ C'est un cul-de-sac ou quoiⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto ha tutta l'aria di essere un vicolo cieco...\n@c0@"
  ja: "@a@b%a001240「あれ？\n\tここって　行き止まり　かな？\n@c0@"
31:
  de: "@aSancho@bMachen wir noch keine Siesta, Chico? Du weißt, deine Onkel Sancho ist nisst mehr der Jüngste...\n@c0@"
  en: "@aSancho@bEes no time for siesta, friend? Your Uncle Sancho, he no eso young these days, you know.\n@c0@"
  es: "@aSancho@b¿No es la hora de la siesta ya, chamaco? Tito Sancho ya no está para estos trotes.\n@c0@"
  fr: "@aSancho@bC-C'est pas l'heure de la siesta, chicoⓡ\nT-Ton oncle Sancho n'est plus très jeune, tu sais.\n@c0@"
  it: "@aSancho@b¿Chico, por qué no ce reposiamo un pocos?\r\nLo zio Sancho ha bisognos de reprendere fiatos...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！\n\tここらで　ちょっと休けいを！\n\tサンチョも　トシを取りました。\n@c0@"
32:
  de: "@a%0%a001250@bDieses ganze Hoch- und Runterklettern ist ziemlich ermüdend...\n@c0@"
  en: "@a%0%a001250@bI'm a bit tired after all that climbing up and down.\n@c0@"
  es: "@a%0%a001250@bEstoy un poco cansada de tanto subir y bajar escaleras.\n@c0@"
  fr: "@a%0%a001250@bJe suis un peu fatiguée à force de monter et descendre sans arrêt.\n@c0@"
  it: "@a%0%a001250@bSono stanchissima!\nTutte quelle scale mi hanno lasciata senza forze...\n@c0@"
  ja: "@a@b%a001250「あがったり　おりたりで\n\tちょっと　つかれちゃった……。\n@c0@"
33:
  de: "@aOtto@bHm? Warum sind wir noch mal hier?\n@c0@"
  en: "@aTuppence@bHm? What is it we're doing here again?\n@c0@"
  es: "@aAlazar@b¿Mmm? ¿Se puede saber qué hacemos otra vez aquí?\n@c0@"
  fr: "@aInnocent@bMmmⓡ Qu'est-ce qu'on fait à nouveau iciⓡ\n@c0@"
  it: "@aSimon@bUhm, cos'è che siamo venuti a fare qui?\nMi sa che l'ho dimenticato...\n@c0@"
  ja: "@a@bピピン「あれ？\n\tそもそも　ここへは\n\tなにをしに来たんでしたっけ？？\n@c0@"
34:
  de: "@a%0%a001240@bMann, ist das hoch hier! Sieh nur, Papa, schau dir diese Aussicht an!\n@c0@"
  en: "@a%0%a001240@bWow! We're so high up!\nLook, Dad! Look at that view!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Qué alto estamos!\n¡Mira, papá! ¡Mira qué vista!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Qu'est-ce qu'on est hautⓠ Regarde, papaⓠ Regarde la vueⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti, quanto siamo in alto!\nIl panorama è meraviglioso!\n@c0@"
  ja: "@a@b%a001240「うわー　高いなあ。\n\t見て見て！　お父さん！　\n\tすっごく　ながめがいいよ！\n@c0@"
35:
  de: "@a%0%a001240@bIch hoffe, dass wir das irgendwann auch Mama zeigen können...\n@c0@"
  en: "@a%0%a001240@bI hope we get to show Mum this place sometime too.\n@c0@"
  es: "@a%0%a001240@bEspero que podamos venir aquí con mamá algún día.\n@c0@"
  fr: "@a%0%a001240@bJ'espère qu'on pourra montrer cet endroit à maman, un jour.\n@c0@"
  it: "@a%0%a001240@bUn giorno mi piacerebbe tornare qui con la mamma.\nSono sicuro che questo posto le piacerebbe tantissimo!\n@c0@"
  ja: "@a@b%a001240「いつか　お母さんにも\n\t見せてあげたいねっ！\n@c0@"
36:
  de: "@aSancho@bWenn es... hah... eben ist... hah... fühle iss miss jung... hah...\nHier fühle iss miss alt...\n@c0@"
  en: "@aSancho@bWhen the ground...hahh...ees flat...hahh...I feel...hahh...eso young...hahh...\r\nHere, I am feeling old...\n@c0@"
  es: "@aSancho@bCuando el suelo... ahh... está plano... me siento... ahh... muy joven.\nAquí me siento ruco, nomás...\n@c0@"
  fr: "@aSancho@bQuand le s-sol... han... est plat... han... je me sens... han... j-jeune... han... Ici, j-je... me sens... vieux...\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh... ¡Que panorama esplendido!\r\nSi avessi ancoras un poco de fiatos dentros los polmones, me commuoverei... Haaahhh... Haaahhh...\n@c0@"
  ja: "@a@bサンチョ「いつまでも……　若いと\n\t思って……たんですが……\n\tぜえぜえ…　い　息が……。\n@c0@"
37:
  de: "@a%0%a001240@bAua! Mein Nacken tut ganz weh, weil wir immerzu nach oben gestarrt haben, zur Turmspitze hoch.\n@c0@"
  en: "@a%0%a001240@bOuch! My neck really hurts now after all that craning to look up at the top of the tower.\n@c0@"
  es: "@a%0%a001240@b¡Aaay! Me duele el cuello de tanto estirarlo para mirar hacia la cima de la torre.\n@c0@"
  fr: "@a%0%a001240@bOuilleⓠ J'ai mal au cou à force de regarder vers le haut.\n@c0@"
  it: "@a%0%a001240@bA furia di guardare in alto per vedere dove finisce la torre, m'è venuto il torcicollo!\n@c0@"
  ja: "@a@b%a001240「いたたッ！\n\t塔のてっぺんを　見上げてたら\n\t首が　痛くなっちゃった。\n@c0@"
38:
  de: "@a%0%a001250@bWir sind doch jetzt fertig hier, oder? Können wir dann bitte gehen? Ich hab's nicht so mit Höhen...\n@c0@"
  en: "@a%0%a001250@bWe're finished here now, right? Can we go, then?\nI'm not very good with heights.\n@c0@"
  es: "@a%0%a001250@bYa hemos acabado aquí, ¿no? ¿Y si nos vamos?\nLas alturas no son lo mío.\n@c0@"
  fr: "@a%0%a001250@bOn n'a plus rien à faire ici, nonⓡ\nAlors on peut y aller maintenantⓡ\nJ'ai un peu le vertige.\n@c0@"
  it: "@a%0%a001250@bAbbiamo finito?\nPossiamo andarcene da qui?\nLo sai che soffro di vertigini...\n@c0@"
  ja: "@a@b%a001250「もう　ここに用事ないよね？\n\tねえ　帰ろうよ。\n\t高いところ　イヤなの……。\n@c0@"
39:
  de: "@aSancho@bHinunterklettern kann auch sehr gefährliss sein. Du musst vorsisstig sein, Chico.\n@c0@"
  en: "@aSancho@bEes more easy for losing your feets on the way down. You must be careful.\n@c0@"
  es: "@aSancho@bPues es más fácil perder pie bajando. Hay que tener cuidado.\n@c0@"
  fr: "@aSancho@bC-C'est facile de trébucher en descendant.\r\nF-Faites bien attention.\n@c0@"
  it: "@aSancho@b¡Salire es faticoso, ma escendere es pericoloso!\n¡Bisogna fare attenziones a no escivolare!\n@c0@"
  ja: "@a@bサンチョ「のぼりより　くだりのほうが\n\t足を　ふみはずしやすいんです。\n\t坊っちゃん　お気をつけて！\n@c0@"
40:
  de: "@aOtto@bWäre es nicht nett, hier oben auf dem Turm ein Picknick zu machen? Oh, das wäre geradezu entzückend!\n@c0@"
  en: "@aTuppence@bI imagine it would be rather nice to have a picnic at the top of the tower here. Delightful, in fact!\n@c0@"
  es: "@aAlazar@bHacer un picnic en la cima de la torre sería muy agradable, creo yo. Qué digo, ¡sería genial!\n@c0@"
  fr: "@aInnocent@bJe me dis que ça doit être bien agréable de faire un pique-nique en haut de la tour. Ça doit être magnifique, mêmeⓠ\n@c0@"
  it: "@aSimon@bDev'essere fantastico fare un picnic in cima alla torre! Soprattutto se si è in compagnia di una bella fanciulla...\n@c0@"
  ja: "@a@bピピン「この塔の　てっぺんで\n\tおべんとうを　食べたら\n\tきっと　おいしいでしょうね！\n@c0@"
41:
  de: "@aBianca@bDas ist also der Turm nach Zenithia, ja? Hm, gut in Schuss ist er ja nicht gerade, aber sehr imposant. Wenn man seine Geschichte bedenkt und so.\n@c0@"
  en: "@aBianca@bSo this is the tower to Zenithia? It's a bit of a mess, but I s'pose it's pretty impressive considerin' its history and all that.\n@c0@"
  es: "@aBianca@b¿Así que esto es la Escalera a Zenithia?\n㈡\nEstá un poco hecha polvo, pero supongo que es bonita teniendo en cuenta su historia y todo ese rollo, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est donc la tour qui mène à Zénithiaⓡ Elle est en piteux état, mais elle reste impressionnante, surtout quand on sait tout ce qui s'y est passé.\n@c0@"
  it: "@aBianca@bQuesta è la torre che conduceva a Zenithia?\nBeh, non è in perfette condizioni, ma resta pur sempre uno spettacolo incredibile!\n@c0@"
  ja: "@a@bビアンカ「ここが　天空へ続く塔なの？\n\tちょっとボロボロだけど　歴史に\n\t立ち会ってるみたいで　感動ね。\n@c0@"
42:
  de: "@aNera@bÜber diesen Turm erreicht man also Zenithia? Ich frage mich, wie viele tapfere Leute ihn schon erklommen haben.\n@c0@"
  en: "@aNera@bSo this tower used to connect to Zenithia? I wonder how many heroic people climbed it in the past.\n@c0@"
  es: "@aNera@b¿Así que questa torre solía llevar a Zenithia? Me pregunto cuántos héroes subieron por ella en el pasado.\n@c0@"
  fr: "@aNera@bAlors cette tour mène à Zénithiaⓡ Je me demande combien de personnes l'ont vaillamment gravie par\nle passé.\n@c0@"
  it: "@aNera@bQuesta è la torre per Zenithia, non è vero?\nChissà se qualche essere umano è mai riuscito a raggiungerne la vetta...\n@c0@"
  ja: "@a@bフローラ「昔は　この塔が　天空のお城へと\n\t続いていたのね。　いったい\n\t何人の勇者が　のぼったのかしら？\n@c0@"
43:
  de: "@aBianca@bHast du diesen Schatz nicht schon, %a000090?\n@c0@"
  en: "@aBianca@bEn't you got that treasure already, %a000090?\n@c0@"
  es: "@aBianca@b¿No tienes ya ese tesoro, %a000090?\n@c0@"
  fr: "@aBianca@bTu n'as pas déjà pris ce trésor, %a000090ⓡ\n@c0@"
  it: "@aBianca@bMa non l'hai già trovato tu il tesoro, %a000090?\n@c0@"
  ja: "@a@bビアンカ「で　そのお宝は\n\t%a000090たちが　もう\n\t持っていっちゃったのよね？\n@c0@"
44:
  de: "@aBianca@bDann hättest du das dem armen Kerl ruhig sagen können! Das war gar nicht nett von dir.\n@c0@"
  en: "@aBianca@bThen you should've told him, the poor bloke!\r\nThat was a bit mean of you.\n@c0@"
  es: "@aBianca@b¡Entonces debías habérselo dicho, pobre tipo!\nEso no ha estado bien, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bTu aurais dû le dire à ce pauvre hommeⓠ\nC'est un peu méchant de ta part.\n@c0@"
  it: "@aBianca@bE perché non gliel'hai detto?\nSei stato proprio cattivo!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「だったら　はやく\n\t教えてあげればいいのに。\n\t%a000090も　人が悪いわね。\n@c0@"
45:
  de: "@aNera@bOje! Aufzugeben, wo er doch schon so weit gekommen ist!\n@c0@"
  en: "@aNera@bOh dear! Fancy giving up after coming this far!\n@c0@"
  es: "@aNera@b¡Diosa mía! ¡Veramente, rendirse después de llegar hasta aquí!\n@c0@"
  fr: "@aNera@bLe pauvreⓠ Être obligé d'abandonner après avoir fait tout ce cheminⓠ\n@c0@"
  it: "@aNera@bNon vorrà mica rinunciare dopo essere arrivato fin qua?!\nSarebbe uno stupido se lo facesse!\n@c0@"
  ja: "@a@bフローラ「まあ！　こんな所まで\n\tいらしたわりには　あきらめが\n\t早い方　ですわね。\n@c0@"
46:
  de: "@a%0%a001240@bEr hat doch von dem Magmastab gesprochen, oder? Meinst du nicht, wir sollten ihm sagen, dass wir ihn schon gefunden haben?\n@c0@"
  en: "@a%0%a001240@bHe was talking about the magma staff, right? Don't you think we should tell him we already found it?\n@c0@"
  es: "@a%0%a001240@bSe refería al báculo de magma, ¿no? ¿No deberíamos decirle que ya lo hemos encontrado?\n@c0@"
  fr: "@a%0%a001240@bIl parlait du bâton de lave, c'est çaⓡ Tu ne crois pas qu'on devrait lui dire qu'on l'a déjà trouvéⓡ\n@c0@"
  it: "@a%0%a001240@bStava parlando del bastone di magma, non è così?\nNon credi che avremmo dovuto dirgli che l'abbiamo già trovato?\n@c0@"
  ja: "@a@b%a001240「宝って　マグマの杖のこと？\n\tボクたちが　見つけたこと\n\t教えてあげなくていいかな……？\n@c0@"
47:
  de: "@aBianca@bIch wette, der legendäre Held hat diesen Turm auch erklommen.\n@c0@"
  en: "@aBianca@bI'll bet the legendary hero climbed this tower,\r\nyou know.\n@c0@"
  es: "@aBianca@bSeguro que el héroe legendario subió por esta torre, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe parie que le héros légendaire est monté dans\r\ncette tour.\n@c0@"
  it: "@aBianca@bScommetto che l'Eroe Leggendario è arrivato fino alla sommità della torre.\n@c0@"
  ja: "@a@bビアンカ「昔話に出てくる\n\t伝説の勇者も　きっと\n\tこの塔を　のぼったのね……。\n@c0@"
48:
  de: "@aNera@bEigentlich bin ich ja nicht gerne so hoch oben, aber hier stört es mich nicht. Ich weiß auch nicht, warum...\n@c0@"
  en: "@aNera@bI'm not usually very good with heights, but I don't mind this place. It doesn't seem to bother me for\r\nsome reason.\n@c0@"
  es: "@aNera@bNo se me dan muy bien las alturas. pero aquí estoy bene. Por algún motivo, no me preocupa.\n@c0@"
  fr: "@aNera@bD'ordinaire, j'ai le vertige, mais ici, tout va bien.\r\nJe ne sais pas pourquoi, mais ça ne me dérange pas.\n@c0@"
  it: "@aNera@bNon mi piacciono i luoghi elevati, ma questa torre non mi dà alcun fastidio.\r\nBeh, meglio così...\n@c0@"
  ja: "@a@bフローラ「私は　高いところが苦手だけど\n\tここなら　大丈夫。\n\tなぜか　こわい感じがしないんですの。\n@c0@"
49:
  de: "@a%0%a001240@bEs wäre doch schön, den Turm zu reparieren und ihm wieder zu seiner alten Pracht zu verhelfen, oder?\n@c0@"
  en: "@a%0%a001240@bIt'd be nice to fix this place up and have it looking all grand again.\n@c0@"
  es: "@a%0%a001240@bEstaría bien restaurar esto para que volviese a tener un aspecto imponente.\n@c0@"
  fr: "@a%0%a001240@bÇa serait vraiment bien de remettre cette tour en état... comme elle était dans le temps.\n@c0@"
  it: "@a%0%a001240@bPapà, ho avuto un'idea! Perché non restauriamo la torre e la facciamo diventare la locanda più alta del mondo? Secondo me faremmo affari d'oro!\n@c0@"
  ja: "@a@b%a001240「この塔　いつか　なおして\n\tピカピカにしてあげたいよね！\n@c0@"
50:
  de: "@a%0%a001250@bIch versuche ja immer, nichts allzu Kindisches von mir zu geben, aber das sage ich jetzt trotzdem...\n@c0@"
  en: "@a%0%a001250@bI usually try my best not to say anything too babyish. But I'm going to say this anyway...\n@c0@"
  es: "@a%0%a001250@bNormalmente intento no decir cosas muy infantiles, pero voy a decirlo de todos modos.\n@c0@"
  fr: "@a%0%a001250@bD'habitude, j'essaie d'éviter de dire des choses puériles, mais je vais quand même te poser la question...\n@c0@"
  it: "@a%0%a001250@bLo so che la mia è una paura stupida e che non dovrei nemmeno pensare a una cosa del genere...\n@c0@"
  ja: "@a@b%a001250「わたし　いつも　泣きごと\n\t言わないように　がんばろうと\n\t思ってるの…　でも言っちゃうの……。\n@c0@"
51:
  de: "@a%0%a001250@bDu wirst mich doch immer lieb haben, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bYou won't stop liking me, will you, Dad?\n@c0@"
  es: "@a%0%a001250@bNo dejarás nunca de quererme, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bTu m'aimeras toujours, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPerò voglio chiedertelo lo stesso: papà, mi vuoi bene anche se soffro di vertigini?\n@c0@"
  ja: "@a@b%a001250「お父さん　わたしのこと\n\tキライにならないでね……？\n@c0@"
52:
  de: "@aSancho@bHah... hah... Es... hah... wird immer... hah ... schwieriger zu atmen, no?\nHah... hah...\n@c0@"
  en: "@aSancho@bHahh...hahh...\r\nEes...hahh...getting hard to...hahh...breathe, no?\r\nHahh...hahh...\n@c0@"
  es: "@aSancho@bAaah..., aaah...\r\nHíjole... ahhh... cada vez... ahh... es más difícil... respirar.\n@c0@"
  fr: "@aSancho@bAaah... Aaah... Ç-Ça devient de plus en plus difficile de r-r-respirer. Aaah... Aaah...\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh...\nMe mancaaah... el fiaaahto...\nHaaahhh... Haaahhh...\n@c0@"
