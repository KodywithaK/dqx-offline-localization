96:
  de: "@a%0%a001240@b%0%a001250 kann viel besser malen als ich...\n@c0@"
  en: "@a%0%a001240@b%0%a001250's much better than me when it comes to painting.\n@c0@"
  es: "@a%0%a001240@bA %a001250 se le da mucho mejor la pintura que a mí.\n@c0@"
  fr: "@a%0%a001240@b%0%a001250 est beaucoup plus douée que moi pour la peinture.\n@c0@"
  it: "@a%0%a001240@b%0%a001250 è molto più brava di me a disegnare...\nPerò io so usare la spada meglio di lei!\n@c0@"
  ja: "@a@b%a001240「お絵描きはね\n\t%a001250のほうが　上手なんだよ。\n@c0@"
97:
  de: "@a%0%a001250@bDer Junge auf dem Bild sieht genauso aus wie %a001240!\n@c0@"
  en: "@a%0%a001250@bThe boy in that picture looks just like %a001240!\n@c0@"
  es: "@a%0%a001250@b¡El chico del cuado es igual que %a001240!\n@c0@"
  fr: "@a%0%a001250@bLe garçon du tableau ressemble à %a001240ⓠ\n@c0@"
  it: "@a%0%a001250@bIl ragazzo nel quadro somiglia tantissimo a %a001240!\n@c0@"
  ja: "@a@b%a001250「あの絵に描かれてるの\n\tお兄ちゃんに　そっくり……。\n@c0@"
98:
  de: "@aSancho@bIss weiß noch genau, wie du geboren wurdest, Chico. Si, damals ist auch eine Künstler gekommen, um ein Bild von dir zu malen.\n@c0@"
  en: "@aSancho@bI remember when you were born, My Majesty.\r\nSí, an artist, he came to draw your\r\npicture too.\n@c0@"
  es: "@aSancho@bRecuerdo que cuando nació, Majestad, un artista vino a pintar su retrato.\n@c0@"
  fr: "@aSancho@bJ-Je me souviens de ta n-naissance, Ma Majesté.\r\nSi, oun artiste était venu pour faire ton p-portrait, à toi aussi.\n@c0@"
  it: "@aSancho@bChico, cuando tu nascesti, un famoso pittore venne a farte el ritratto...\nMe lo recuerdo como si fosse ieri.\n@c0@"
  ja: "@a@bサンチョ「ああ　思い出しますねえ。\n\t%a000090王が　生まれた時も\n\t肖像画を　描かせておられました。\n@c0@"
99:
  de: "@aBianca@bIrgendwie kommt mir die Szene auf dem Bild bekannt vor. Ich kann mich nur nicht recht erinnern...\n@c0@"
  en: "@aBianca@bI can't help feelin' like I've bin to the place in that picture. I just can't quite fathom where it is.\n@c0@"
  es: "@aBianca@bNo puedo evitarlo, siento como si hubiera estado en el sitio que aparece en ese cuadro. Pero no tengo ni idea de dónde es, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai l'impression d'être déjà allée à l'endroit représenté sur ce tableau. Mais je n'arrive\r\npas à me rappeler où c'est.\n@c0@"
  it: "@aBianca@bHo la sensazione di essere stata nel luogo raffigurato nel quadro, ma non riesco a ricordare che posto sia...\n@c0@"
  ja: "@a@bビアンカ「あの絵の風景…\n\tどこかで見たような　気がするのよね。\n\tう～ん…　どこだったかしら……。\n@c0@"
100:
  de: "@aNera@bDas ist ein herrliches Bild. Hoffentlich bringst du mich noch mal hierher, damit ich es mir ansehen kann.\n@c0@"
  en: "@aNera@bI really love that picture. I hope you'll bring me here to look at it again one day.\n@c0@"
  es: "@aNera@bEse cuadro me encanta, caro mio. Espero que me vuelvas a traer otro giorno para poder verlo de nuevo.\n@c0@"
  fr: "@aNera@bJ'adore ce tableau. J'espère qu'un jour, on pourra revenir ici pour le revoir.\n@c0@"
  it: "@aNera@bQuel quadro è molto bello.\nSpero che mi riporterai a vederlo, tesoro mio...\n@c0@"
  ja: "@a@bフローラ「私　あの絵が\n\t気に入りましたわ。\n\tまた　見につれてきてくださる？\n@c0@"
101:
  de: "@a%0%a001250@bDieses Bild ist wirklich schön. Es strahlt Wärme und Geborgenheit aus.\n@c0@"
  en: "@a%0%a001250@bThat picture has a really nice feel to it.\nSort of warm somehow.\n@c0@"
  es: "@a%0%a001250@bEse cuadro da una sensación agradable.\nEs como cálido o algo así.\n@c0@"
  fr: "@a%0%a001250@bCe tableau est vraiment agréable à regarder.\nIl dégage une sensation de réconfort.\n@c0@"
  it: "@a%0%a001250@bQuel dipinto mi ispira grande serenità.\nNon so come mai, ma quando lo guardo mi sento calma e rilassata...\n@c0@"
  ja: "@a@b%a001250「あの絵　すごく\n\tやさしい感じがする……。\n\tあったかいね。\n@c0@"
102:
  de: "@aOtto@bDer Zenithdrache war doch dieser Dr. Ache, net wahr?\n@c0@"
  en: "@aTuppence@bThe Zenith Dragon was that Dr Agon chap,\r\nwasn't he?\n@c0@"
  es: "@aAlazar@bEl Dragón de Zenithia era ese tal Dr. Agón, ¿verdad?\n@c0@"
  fr: "@aInnocent@bEn réalité, le Dragon du Zénith, c'était le Dr Agon, c'est bien çaⓡ\n@c0@"
  it: "@aSimon@bIl Drago di Zenithia sarebbe il Dottor Agon, non è vero?\n@c0@"
  ja: "@a@bピピン「マスタードラゴンって\n\tプサンだった人ですよね？\n@c0@"
103:
  de: "@aOtto@bIch kann mir nur schwer vorstellen, dass ein Mann wie er ein Bild verschenkt...\n@c0@"
  en: "@aTuppence@bIt's rather difficult to imagine a man like him giving a picture as a present!\n@c0@"
  es: "@aAlazar@b¡No me imagino a un tipo como él regalando un cuadro!\n@c0@"
  fr: "@aInnocent@bJ'ai un peu de mal à imaginer un homme comme lui donner un tableau en cadeauⓠ\n@c0@"
  it: "@aSimon@bCome mai avrà regalato questo quadro?\nAh, non importa: a dipinto donato da un drago non si guarda la cornice... o qualcosa del genere!\n@c0@"
  ja: "@a@bピピン「あの人が　絵のプレゼントだなんて\n\t……ううっ　似合わない～～。\n@c0@"
104:
  de: "@a%0%a001240@bEine Weile? Wie lang das wohl sein mag... Vielleicht hängen sie ja ein anderes Bild auf, wenn endlich Frieden in der Welt herrscht...\n@c0@"
  en: "@a%0%a001240@bFor a while? I wonder how long...\nMaybe they'll change it when we\nbring peace to the world.\n@c0@"
  es: "@a%0%a001240@b¿En un tiempo? ¿Y cuánto tiempo será eso?\nA lo mejor lo cambian cuando traigamos la paz al mundo.\n@c0@"
  fr: "@a%0%a001240@bAvant un bon momentⓡ Je me demande combien de temps... Peut-être qu'ils le remplaceront quand on aura ramené la paix dans le monde.\n@c0@"
  it: "@a%0%a001240@bL'immagine cambia di tanto in tanto?!\nQuesta sì che è bella! Scommetto che si modificherà dopo che avremo salvato il mondo!\n@c0@"
  ja: "@a@b%a001240「ずいぶん先？\n\tじゃあ　世界が平和になったら…\n\tとかかな？\n@c0@"
105:
  de: "@aOtto@bOh! Ich hoffe doch sehr, dass das nächste Bild, das sie aufhängen werden, ein Porträt von meiner Wenigkeit ist!\n@c0@"
  en: "@aTuppence@bOoh! I can't help hoping that the next painting they hang will be one in my honour!\n@c0@"
  es: "@aAlazar@b¡Oooh! ¡Espero que el próximo cuadro que cuelguen sea uno en mi honor!\n@c0@"
  fr: "@aInnocent@bOohⓠ J'espère que le prochain qu'ils accrocheront sera un tableau en mon honneurⓠ\n@c0@"
  it: "@aSimon@bPresto sarò raffigurato nel dipinto, ne sono certo!\r\nSarà il giusto premio per il valore e il coraggio che ho dimostrato!\n@c0@"
  ja: "@a@bピピン「次はぜひ\n\tこのボクを　たたえる絵を\n\tかざってほしいものです。\n@c0@"
106:
  de: "@a%0%a001240@bDie Katze spricht ja! Glaubst du, dass sie wirklich ein Magier ist?\n@c0@"
  en: "@a%0%a001240@bThat cat just spoke to us! Do you think it really is\na magician?\n@c0@"
  es: "@a%0%a001240@b¡Ese gato acaba de hablarnos! ¿Crees que en realidad es un mago?\n@c0@"
  fr: "@a%0%a001240@bCe chat nous a parléⓠ Tu crois que c'est vraiment un magicienⓡ\n@c0@"
  it: "@a%0%a001240@bUn gatto parlante?!\nCredi davvero che sia un mago trasformatosi in animale?!\n@c0@"
  ja: "@a@b%a001240「あのネコ　しゃべったよ？\n\t魔法使いだって！　本当？\n@c0@"
107:
  de: "@a%0%a001250@bAh! Die Katze hat mir einen ganz schönen Schrecken eingejagt!\n@c0@"
  en: "@a%0%a001250@bUrgh! That cat gives me the creeps.\n@c0@"
  es: "@a%0%a001250@b¡Agh! Ese gato me pone los pelos de punta.\n@c0@"
  fr: "@a%0%a001250@bArghⓠ Ce chat me donne la chair de poule.\n@c0@"
  it: "@a%0%a001250@bQuel gatto mi fa venire i brividi, eppure io amo gli animali!\n@c0@"
  ja: "@a@b%a001250「いや～ん！\n\tあのネコ　気持ちわるい～！！\n@c0@"
108:
  de: "@aOtto@bWie einfallsreich! Ich wünschte, ich könnte mich in eine Katze verwandeln... Die Möglichkeiten wären schier endlos!\n@c0@"
  en: "@aTuppence@bHow ingenious! If only I could learn how to turn myself into a cat. The possibilities would be endless!\n@c0@"
  es: "@aAlazar@b¡Qué ingenioso! Cómo me gustaría poder convertirme en gato. ¡Podría hacer miles de cosas!\n@c0@"
  fr: "@aInnocent@bQuelle judicieuse idéeⓠ Si seulement je pouvais apprendre à me transformer en chat... Je n'imagine même pas tout ce que je pourrais faireⓠ\n@c0@"
  it: "@aSimon@bAnche a me piacerebbe trasformarmi in gatto a mio piacimento! Farei le fusa a tutte le belle fanciulle del mondo, e mi accoccolerei sulle loro gambe...\n@c0@"
  ja: "@a@bピピン「むむむっ…\n\tぜひ　ボクにもネコになる魔法を……！\n@c0@"
109:
  de: "@aBianca@bWarum sollten wir die Katze verraten? Das alles geht uns nichts an...\n@c0@"
  en: "@aBianca@bWell, it takes all sorts. Who are we to interfere?\n@c0@"
  es: "@aBianca@bEn fin, de todo tiene que haber. ¿Quiénes somos nosotros para criticar?\n@c0@"
  fr: "@aBianca@bIl faut de tout pour faire un monde. Je crois que nous n'avons pas à intervenir.\n@c0@"
  it: "@aBianca@bSentilo, come miagola!\nCredi che quel gatto abbia fame?\n@c0@"
  ja: "@a@bビアンカ「まあ　こういうのって\n\t本人が良ければ\n\tそれで　いいのよね。\n@c0@"
110:
  de: "@aNera@bIch bin mir sicher, dass die Feen ganz genau wissen, was es mit dieser Katze auf sich hat. Glaubst du nicht auch, Liebling?\n@c0@"
  en: "@aNera@bI'm sure the faeries must know what's really going on with that cat. Don't you think, darling?\n@c0@"
  es: "@aNera@bEstoy sicura de que las hadas deben de saber lo de ese gato. ¿No crees, caro mio?\n@c0@"
  fr: "@aNera@bJe suis sûre que les fées savent que ce n'est pas vraiment un chat. Tu ne penses pas, mon chériⓡ\n@c0@"
  it: "@aNera@bCosa vorrà quel gatto?\nForse gli abbiamo pestato la coda per sbaglio...?\n@c0@"
  ja: "@a@bフローラ「あんなことして　妖精さんが\n\t本当に　気づかないわけが\n\tありませんわ。　ねえ　あなた？\n@c0@"
111:
  de: "@aOtto@bMiau! Miau! Miau!\n@c0@"
  en: "@aTuppence@bMeow! Meow! Meow!\n@c0@"
  es: "@aAlazar@b¡Miau! ¡Miau! ¡Miau!\n@c0@"
  fr: "@aInnocent@bMiaouⓠ Miaouⓠ Miaouⓠ\n@c0@"
  it: "@aSimon@bMiao! Miao! Miao!\n@c0@"
  ja: "@a@bピピン「にゃお　にゃお　にゃお～ん！\n@c0@"
112:
  de: "@aOtto@bIch wollte nur schon einmal etwas üben, falls ich eines Tages doch dazu fähig sein sollte, mich in eine Katze zu verwandeln...\n@c0@"
  en: "@aTuppence@bI thought I'd better get in some practice in case I ever manage to turn myself into a cat!\n@c0@"
  es: "@aAlazar@b¡He pensado que me convenía practicar un poco, por si alguna vez me puedo convertir en gato!\n@c0@"
  fr: "@aInnocent@bJe me suis dit qu'il fallait que je m'entraîne au cas où je réussirais à me transformer en chat un jourⓠ\n@c0@"
  it: "@aSimon@bNo, non sono impazzito.\nMi sto solo esercitando a miagolare come un vero micio.\n㈡\nSe imparassi a miagolare, sarei molto più interessante per le fanciulle che amano gli animali...\n@c0@"
  ja: "@a@bピピン「いつネコに　してもらっても\n\tいいように　練習しとかなくちゃ！\n@c0@"
113:
  de: "@aGriselda@bWas für ein Nebel! Da kann man sich leicht verlaufen, wenn man nicht achtgibt. Lass uns Händchen halten, ja?\n@c0@"
  en: "@aDebora@bWhat a mist! We could get really lost in here if we weren't careful. Hold my hand, okay?\n@c0@"
  es: "@aStefania@b¡Vaya niebla! Si no vas con cuidado, es facile perderse. Dame la mano, per favore.\n@c0@"
  fr: "@aPandora@bQuel brouillardⓠ Si on ne fait pas attention, on peut facilement se perdre, ici. On se tient par la main, d'accordⓡ\n@c0@"
  it: "@aViola@bAccidenti, che nebbione!\nTienimi la mano, caro, così non mi perderò...\n@c0@"
  ja: "@a@bデボラ「濃い霧ねえ。\n\tはぐれたら　分からなくなりそうだから。\n\tちゃんと　手をつないでてよね。\n@c0@"
114:
  de: "@aGriselda@bHey, was machst du denn da?! Ich habe mit den Kleinen gesprochen, nicht mit dir, %a000090!\n@c0@"
  en: "@aDebora@bHey! What are you doing? I was talking to the kids, not you, %a000090!\n@c0@"
  es: "@aStefania@b¡Eh! ¿Cosa fai? ¡Estaba hablando a uno de los bambini, no a ti, %a000090!\n@c0@"
  fr: "@aPandora@bHéⓠ Mais qu'est-ce que tu faisⓡ C'est aux enfants que je parlais, %a000090, pas à toiⓠ\n@c0@"
  it: "@aViola@bEhm, volevo dire di tenermi la mano, così non correrai il rischio di perderti!\n@c0@"
  ja: "@a@bデボラ「って　%a000090　なにしてるの？\n\t今のは　あんたじゃなくて\n\t子供に　言ったのよ。\n@c0@"
115:
  de: "@aGriselda@bWas für ein hinreißender See. Fast so hinreißend wie ich!\n@c0@"
  en: "@aDebora@bWhat a lovely lake.\r\nAlmost as lovely as me!\n@c0@"
  es: "@aStefania@bQué bello lago.\n¡Casi tanto come io!\n@c0@"
  fr: "@aPandora@bQuel lac ravissant.\nPresque aussi ravissant que moiⓠ\n@c0@"
  it: "@aViola@bChe splendido lago!\nÈ bello quasi quanto me.\n@c0@"
  ja: "@a@bデボラ「ずいぶん　キレイな湖ね。\n\tまるで　私みたい。\n@c0@"
116:
  de: "@aGriselda@bWas für ein niedlicher Ort...\n@c0@"
  en: "@aDebora@bIt's quite a sweet-looking place, don't you think?\n@c0@"
  es: "@aStefania@bMa qué sitio más dulce, ¿vero?\n@c0@"
  fr: "@aPandora@bCet endroit est assez mignon, tu ne trouves pasⓡ\n@c0@"
  it: "@aViola@bRiconosco che il posto sia davvero carino...\n@c0@"
  ja: "@a@bデボラ「ずいぶん　かわいらしい感じの\n\tつくりに　なってるわね。\n@c0@"
117:
  de: "@aGriselda@bObwohl ich es bevorzugen würde, wenn das Schloss ein wenig glanzvoller wäre.\n@c0@"
  en: "@aDebora@bI don't mind it, but I prefer my palaces to look a bit more glitzy.\n@c0@"
  es: "@aStefania@bNon c'è male, pero prefiero que mis palacios tengan un poco más de glamour.\n@c0@"
  fr: "@aPandora@bJe le trouve agréable, mais j'aimerais que mes palais paraissent un peu plus clinquants.\n@c0@"
  it: "@aViola@bIo, però, preferisco i posti più movimentati, dove c'è più vita e qualche negozio d'abbigliamento alla moda...\n@c0@"
  ja: "@a@bデボラ「キライじゃ　ないけど\n\tもっと　きらびやかなほうが\n\t私は　好きね。\n@c0@"
118:
  de: "@aGriselda@bTja, wenn ich das Blut Zenithias in mir trage, tut Nera es auch, fürchte ich...\n@c0@"
  en: "@aDebora@bIf I'm a descendant of the Zenithians, then I suppose that makes Nera one as well.\n@c0@"
  es: "@aStefania@bSi sonno descendiente de Zenithia, Nera también debe de serlo.\n@c0@"
  fr: "@aPandora@bSi je suis une descendante de Zénithiens,\r\nalors Nera l'est aussi, normalement.\n@c0@"
  it: "@aViola@bSe io sono di discendenza zenithiana, allora anche quella tenera gattina di Nera lo è.\nChi l'avrebbe mai detto?!\n@c0@"
  ja: "@a@bデボラ「私が　天空人の子孫ってことは\n\tフローラも　そうってことよね。\n@c0@"
119:
  de: "@aGriselda@bWie es aussieht, hat die Göttin es so eingerichtet, dass du mir zur Verfügung stehst. Wie nett von ihr!\n@c0@"
  en: "@aDebora@bSo the Goddess obviously intended for me to have you at my disposal. Nice idea!\n@c0@"
  es: "@aStefania@bObviamente, el designio de la Diosa es que tú estuvieras siempre a la mia disposizione. ¡Ma quale idea!\n@c0@"
  fr: "@aPandora@bAlors comme ça, la Déesse avait apparemment prévu de te mettre à ma disposition. Bonne idéeⓠ\n@c0@"
  it: "@aViola@bQuindi è stata la dea a volere che tu fossi il mio amato maritino nonché fedele servitore...\n@c0@"
  ja: "@a@bデボラ「なるほど。　神さまが\n\t%a000090を　私に尽くさせるよう\n\tしむけたわけね。\n@c0@"
120:
  de: "@aGriselda@bManchmal zahlt es sich also doch aus, gläubig zu sein.\n@c0@"
  en: "@aDebora@bIt obviously pays to have a bit of faith sometimes.\n@c0@"
  es: "@aStefania@bParece que avere un po' di fe da resultados.\n@c0@"
  fr: "@aPandora@bC'est payant d'avoir un peu la foi,\r\nde temps en temps.\n@c0@"
  it: "@aViola@bRicordati di ringraziare la nostra protettrice onnipotente, caro.\nHa fatto di te l'uomo più fortunato del mondo...\n@c0@"
  ja: "@a@bデボラ「神さまってのも\n\tたまには　いいことしてくれるわね。\n@c0@"
121:
  de: "@aGriselda@bLiebst du etwa eine Andere, %a000090?\n@c0@"
  en: "@aDebora@bDo you love someone other than me, %a000090?\n@c0@"
  es: "@aStefania@b¿Quieres a alguien más aparte de a mí, %a000090?\n@c0@"
  fr: "@aPandora@bEst-ce que tu aimes quelqu'un d'autre que moi, %a000090ⓡ\n@c0@"
  it: "@aViola@bUna persona che ti è molto cara?!\nDi' un po', %a000090...\nNon sarai mica innamorato di un'altra donna, eh?!\n@c0@"
  ja: "@a@bデボラ「あんた　私以外に\n\t愛しい人が　いるわけ？\n@c0@"
122:
  de: "@aGriselda@b... Ah, natürlich. Tja, wenn es dir so wichtig ist, diese ⓞAndereⓟ zu sehen, dann mach nur, ich habe nichts dagegen...\n@c0@"
  en: "@aDebora@b...Ah, of course. Well, if you must go and see your other ⓗloveⓘ, I suppose I'll allow it.\n@c0@"
  es: "@aStefania@b¡Ah!, claro. Va bene, supongo que, si quieres ir a ver a tu otro ⓕamoreⓖ, te daré permiso.\n@c0@"
  fr: "@aPandora@b... Oui, bien sûr. Bon, eh bien, si tu dois aller voir ton autre ⓥamourⓦ, je vais t'y autoriser, alors.\n@c0@"
  it: "@aViola@bBah... La cosa non mi convince del tutto, ma ti concedo il permesso di andare.\nMi raccomando, caro! Comportati bene!\n@c0@"
  ja: "@a@bデボラ「………って　ああ　あの人ね。\n\tまあ　あの人に会いたいなら\n\t許してあげても　いいわ。\n@c0@"
123:
  de: "@aGriselda@bWäre es nicht leichter gewesen, sich als Fee zu verkleiden statt als Katze...?\n@c0@"
  en: "@aDebora@bSurely it would be easier to get in disguised as a faerie rather than a cat.\n@c0@"
  es: "@aStefania@bSicuro que es más fácil entrar disfrazada de hada que de gatto.\n@c0@"
  fr: "@aPandora@bCe serait pourtant plus facile d'entrer ici déguisé\nen fée qu'en chat, nonⓡ\n@c0@"
  it: "@aViola@bCerto che miagola proprio bene, per essere un mago travestito da gatto!\nComplimenti a lui!\n@c0@"
  ja: "@a@bデボラ「ネコじゃなくて　妖精に\n\t化ければ　中に入れるんじゃないの？\n@c0@"
124:
  de: "@aNera@bObwohl wir schon fast überall gewesen sind, weiß ich immer noch nicht, wer meine wahren Eltern sind...\n@c0@"
  en: "@aNera@bIt is rather odd not to have heard anything about my true parents despite all this travelling about we're doing.\n@c0@"
  es: "@aNera@bEs un poco raro que, después de tanto viaggio, no hayamos oído nada sobre mis padres auténticos.\n@c0@"
  fr: "@aNera@bC'est plutôt étrange de n'avoir jamais entendu parler de mes parents dans aucun des nombreux endroits que nous avons traversés.\n@c0@"
  it: "@aNera@bCredo che siano stati numerosi gli Zenithiani che hanno visitato il mondo degli uomini...\n@c0@"
  ja: "@a@bフローラ「これだけ　旅をしていても\n\t私の　本当の親についての話が\n\t聞けないっていうことは……\n@c0@"
125:
  de: "@aNera@bIch nehme an, dass im Laufe der Zeit so einige Zenithianer in unsere Welt gekommen sind. Sie müssen eine ganze Menge Nachfahren haben.\n@c0@"
  en: "@aNera@bI suppose there are lots and lots of Zenithians who came down to our world at some time or another. They must have lots of descendants here.\n@c0@"
  es: "@aNera@bSupongo que hay montones de habitantes de Zenithia que han venido a nuestro mondo en algún momento. Sicuro que hay muchos descendientes suyos.\n@c0@"
  fr: "@aNera@bJ'imagine qu'il y a eu beaucoup de Zénithiens qui sont descendus dans notre monde à un moment ou à un autre. Ils doivent avoir beaucoup de descendants ici.\n@c0@"
  it: "@aNera@bProbabilmente, in giro ci sono più persone di discendenza zenithiana di quante pensiamo.\n@c0@"
  ja: "@a@bフローラ「地上におりた　天空人って\n\t意外と　多いのかも知れないわね。\n\tじつは子孫も　何人もいたりして……。\n@c0@"
126:
  de: "@aNera@bDa fällt mir auf... Wenn ich von den Zenithianern abstamme, dann tut Griselda das doch auch!\n@c0@"
  en: "@aNera@bOoh, I just realised! If I'm a descendant of the Zenithians, then Debora must be too!\n@c0@"
  es: "@aNera@b¡Oh, ahora me doy cuenta! ¡Si io sonno descendiente de Zenithia, Stefania también lo es!\n@c0@"
  fr: "@aPandora@bOh, mais je viens de me rendre compteⓠ\nSi je suis une descendante de Zénithiens,\nça veut dire que Pandora doit l'être aussiⓠ\n@c0@"
  it: "@aNera@bTra l'altro, se io ho sangue zenithiano nelle vene, anche Viola ne ha!\n@c0@"
  ja: "@a@bフローラ「あら？　私が　天空人の\n\t子孫ということは　デボラお姉さんも？\n@c0@"
