0:
  de: "@a%0%a001240@bStreck mal deine Hand aus, Papa... Sie verschwindet, lustig, oder?\n@c0@"
  en: "@a%0%a001240@bHave you seen what happens if you stretch your hand out in front of you? It disappears!\n@c0@"
  es: "@a%0%a001240@b¿Has visto lo que pasa si extiendes la mano hacia delante? ¡Desaparece!\n@c0@"
  fr: "@a%0%a001240@bTu as vu ce qui se passe si tu tends la main devant toiⓡ Elle disparaîtⓠ\n@c0@"
  it: "@a%0%a001240@bHai visto?\nSe l'allunghi davanti a te, la mano scompare!\n@c0@"
  ja: "@a@b%a001240「こうやって\n\tうでを前に　出すでしょ？\n\t……ほら　見えなくなっちゃった！\n@c0@"
1:
  de: "@a%0%a001240@bHa ha! Ich liebe es, im Nebel herumzulaufen.\n@c0@"
  en: "@a%0%a001240@bHa ha! It's fun walking around in the mist like this.\n@c0@"
  es: "@a%0%a001240@b¡Ja, ja! Qué divertido caminar así por la niebla.\n@c0@"
  fr: "@a%0%a001240@bHa haⓠ C'est drôle de marcher dans la brume\ncomme ça.\n@c0@"
  it: "@a%0%a001240@bAh ah ah!\nÈ divertente camminare in questa specie di nebbia magica!\n@c0@"
  ja: "@a@b%a001240「えへへっ。\n\t霧の中って　おもしろいね！\n@c0@"
2:
  de: "@a%0%a001250@bOh, wie unheimlich. Ist das etwa Nebel? Ich kann ja überhaupt nichts sehen!\n@c0@"
  en: "@a%0%a001250@bOoh, this is really weird. Is it some kind of mist?\nI can't see a thing!\n@c0@"
  es: "@a%0%a001250@bUf, esto es muy raro. ¿Es una especie de niebla?\n¡No veo nada!\n@c0@"
  fr: "@a%0%a001250@bOoh, c'est vraiment bizarre. C'est une sorte de brumeⓡ Je ne vois strictement rienⓠ\n@c0@"
  it: "@a%0%a001250@bQuesta foschia è orribile!\nNon si vede niente!\n@c0@"
  ja: "@a@b%a001250「うわ～　すごい。\n\tこれが霧なの？\n\t前が　ぜんぜん　見えないね。\n@c0@"
3:
  de: "@a%0%a001250@bKomisch, so im Nebel herumzulaufen. Stell dir doch nur mal vor, eine Fee würde plötzlich hinter einem Baum hervorspringen!\n@c0@"
  en: "@a%0%a001250@bIt feels weird walking around in the mist. Just think, a faerie could jump out at us at any moment!\n@c0@"
  es: "@a%0%a001250@bQué extraña sensación, caminar en la niebla. ¡En cualquier momento un hada podría darnos un susto!\n@c0@"
  fr: "@a%0%a001250@bC'est bizarre de se promener comme ça dans la brume. Imagine, une fée pourrait nous sauter dessus à tout momentⓠ\n@c0@"
  it: "@a%0%a001250@bChe strano camminare nella nebbia...\nPotremmo essere a un metro da una fata e non accorgercene nemmeno!\n@c0@"
  ja: "@a@b%a001250「霧の中って　ふしぎな感じ。\n\t妖精さんとかが　今にも\n\t飛び出してきそう……。\n@c0@"
4:
  de: "@aSancho@bEs ist kalt hier. Du bist doch hoffentliss warm angezogen, eh, Chico?\n@c0@"
  en: "@aSancho@bEes cold here. You put on more clothes, okay?\n@c0@"
  es: "@aSancho@bQué frío hace aquí. Abrígate, ¿ok?\n@c0@"
  fr: "@aSancho@bIl fait f-froid ici. T-Tu dois bien te c-couvrir.\n@c0@"
  it: "@aSancho@bQue umidità que ce está aquí...\nMe raccomando, chico: coprete bien.\n@c0@"
  ja: "@a@bサンチョ「なんだか　肌寒いですね。\n\tカゼをひかないように　もう１枚\n\t着ておいてください！\n@c0@"
5:
  de: "@aOtto@bEs ist so geheimnisvoll und unwirklich... Aber wo im Namen der Göttin sind wir hier eigentlich?\n@c0@"
  en: "@aTuppence@bIt's so mysterious, so exquisite...\nBut where in the Goddess' name are we?\n@c0@"
  es: "@aAlazar@bEs misterioso, exquisito incluso...\nPero, en nombre de la Diosa, ¿dónde estamos?\n@c0@"
  fr: "@aInnocent@bC'est si mystérieux et si joli à la fois...\nMais où sommes-nousⓡ\n@c0@"
  it: "@aSimon@bChe atmosfera magica, misteriosa...\nPeccato che non ho idea di dove ci troviamo!\n@c0@"
  ja: "@a@bピピン「ミステリアース！\n\tビューティホー！！\n\t……で　ここ　何なんですか？\n@c0@"
6:
  de: "@aOtto@bJetzt! Das ist meine Chance! Der Nebel wird meinen Angriff verhüllen, und das Königreich ist mein! Niemand wird etwas merkⓚⓛ\n@c0@"
  en: "@aTuppence@bNow! Now's my chance! The mist will mask my attack, and the kingdom will be mine!\nNo one will know it wasⓚⓛ\n@c0@"
  es: "@aAlazar@b¡Ahora! ¡Es mi oportunidad! ¡La niebla ocultará mi ataque, y el reino será mío!\nNadie sabrá que yo...\n@c0@"
  fr: "@aInnocent@bC'est maintenant ou jamaisⓠ Mon attaque\nsera dissimulée par la brume et le royaume m'appartiendraⓠ Personne ne saura que c'était m...\n@c0@"
  it: "@aSimon@bQuesta è la mia grande opportunità!\nLa nebbia sarà la mia complice!\n㈡\nColpirò il Re e salirò al trono!\nNessuno saprà che sono stato io!\n@c0@"
  ja: "@a@bピピン「……今が　チャンスだ。\n\tこの霧に乗じて　国王の座を……\n@c0@"
7:
  de: "@aOtto@bOh! Was?\nHa ha ha! Nein, nein. Ich habe nur... ach, gar nichts!\n@c0@"
  en: "@aTuppence@bOh! What?\nHa ha hah! No, no. I was just... Nothing!\n@c0@"
  es: "@aAlazar@b¡Oh! ¿Eh?\n¡Ja, ja, ja! No, no. Solo estaba... ¡Nada!\n@c0@"
  fr: "@aInnocent@bOhⓠ Commentⓡ\nHa ha haⓠ Non, non. J'étais juste... Rienⓠ\n@c0@"
  it: "@aSimon@bCome dice, Maestà?\nSe stavo parlando di lei?!\nPerché?! Mi ha forse sentito dire qualcosa?!\n\n@c0@"
  ja: "@a@bピピン「はっ！？\n\tい　いえっ　何でもありません！\n@c0@"
8:
  de: "@a%0%a001240@bMoment mal! Vielleicht ist das ja der Ort, den wir gesucht haben, Papa.\n@c0@"
  en: "@a%0%a001240@bHang on a minute! Maybe this is the place we were looking for, Dad.\n@c0@"
  es: "@a%0%a001240@b¡Espera un momento! A lo mejor es el sitio que estábamos buscando, papi.\n@c0@"
  fr: "@a%0%a001240@bAttends un peuⓠ C'est peut-être l'endroit qu'on cherchait, papa.\n@c0@"
  it: "@a%0%a001240@bAspetta un attimo!\nPapà, forse questo è il posto che stavamo cercando!\n@c0@"
  ja: "@a@b%a001240「……あれ？\n\tお父さん。　ここって　もしかして\n\t探してた場所じゃない？\n@c0@"
9:
  de: "@a%0%a001240@bDieser Nebel ist wirklich unglaublich. Ich kann dich kaum sehen, Papa!\n@c0@"
  en: "@a%0%a001240@bThis mist is pretty incredible. I can hardly see you there, Dad!\n@c0@"
  es: "@a%0%a001240@bEsta niebla es increíble. ¡Casi no te veo, papá!\n@c0@"
  fr: "@a%0%a001240@bCette brume est vraiment impressionnante.\nJ'ai du mal à te voir, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, non allontanarti, altrimenti ti perderò di vista.\nLa nebbia è troppo fitta...\n@c0@"
  ja: "@a@b%a001240「それにしても　すごい霧だね。\n\tお父さんの顔が　よく見えないよ。\n@c0@"
10:
  de: "@a%0%a001250@bHmm... Mir ist, als würde jemand nach uns rufen...\n@c0@"
  en: "@a%0%a001250@bHmm... I feel like someone's calling out to us.\n@c0@"
  es: "@a%0%a001250@bMmm... Es como si alguien nos estuviese atrayendo.\n@c0@"
  fr: "@a%0%a001250@bMmm... J'ai l'impression que quelqu'un nous appelle.\n@c0@"
  it: "@a%0%a001250@bHo la sensazione che qualcuno ci stia chiamando...\n@c0@"
  ja: "@a@b%a001250「……あれ？\n\tさっきから　誰かが呼んでいるような\n\t気がするの……。\n@c0@"
11:
  de: "@a%0%a001250@bEs ist alles so weiß! Dieser Nebel ist ganz schön eigenartig...\n@c0@"
  en: "@a%0%a001250@bIt's all so beautiful and white! So this is what it feels like to be in the mist.\n@c0@"
  es: "@a%0%a001250@b¡Qué bonito y qué blanco! ¡Esto es lo que se siente al estar rodeada de niebla!\n@c0@"
  fr: "@a%0%a001250@bC'est si joli et si blancⓠ C'est donc ça l'impression qu'on a quand on marche dans la brume.\n@c0@"
  it: "@a%0%a001250@bEssere circondati dalla nebbia dà una sensazione incredibile...\nSembra di essere immersi nell'ovatta.\n@c0@"
  ja: "@a@b%a001250「まっしろで　きれい……。\n\t雲の中って　こんな感じかな？\n@c0@"
12:
  de: "@aSancho@bIss mag keine Orte, an denen es zu schön ist. Das macht miss immer so emotional. D-Das... ist einfach zu viel für miss... (Schluchz)\n@c0@"
  en: "@aSancho@bI no like places eef they are too pretty.\r\nThey make me eso, eso emotional.\r\nEes, ees too much for me. I, I... (sob)\n@c0@"
  es: "@aSancho@bNo me gustan los sitios que son demasiado lindos.\nMe conmueven.\nEs demasiado para mí... Yo... (snif)\n@c0@"
  fr: "@aSancho@bJ-Je n'aime pas les endroits t-trop jolis. J-Je suis tout ému après. C-C'est trop pour m-moi. Je... (sanglot)\n@c0@"
  it: "@aSancho@bEsto posto es muy bello. ¡Anche troppos, por los mios gustos! No vorrei que ce aspettasse una brutta sorpresa da qualche partes...\n@c0@"
  ja: "@a@bサンチョ「きれいすぎる場所は\n\tどうも　苦手ですよ。\n\t人ならざる者の領域と言いますか……。\n@c0@"
