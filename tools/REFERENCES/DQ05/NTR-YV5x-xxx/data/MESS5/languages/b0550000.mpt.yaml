15:
  de: "@a%0%a001240@bDer Nebel hat sich gelichtet! Ich wusste, dass wir hier richtig sind.\n@c0@"
  en: "@a%0%a001240@bThe mist's lifted! I had a feeling this was where\nwe were.\n@c0@"
  es: "@a%0%a001240@b¡Se ha levantado la niebla! Ya me parecía que era aquí donde estábamos.\n@c0@"
  fr: "@a%0%a001240@bLa brume s'est levéeⓠ Je me doutais qu'on était bien là où on est.\n@c0@"
  it: "@a%0%a001240@bLa nebbia se n'è andata!\nToh! Siamo proprio dove credevo che fossimo...\n@c0@"
  ja: "@a@b%a001240「霧が晴れたよ！\n\tやっぱり　ここが\n\tあの場所だったんだね！\n@c0@"
16:
  de: "@a%0%a001250@bIst das nicht das Feenschloss? Komm, Papa! Lass uns schnell reingehen!\n@c0@"
  en: "@a%0%a001250@bIsn't that the Faerie Palace?\nCome on, Dad! Let's hurry inside!\n@c0@"
  es: "@a%0%a001250@b¿No es esto el Palacio de las Hadas?\n¡Vamos, papi! ¡Vamos adentro!\n@c0@"
  fr: "@a%0%a001250@bCe ne serait pas le palais des Féesⓡ\nViens, papaⓠ On va à l'intérieurⓠ\n@c0@"
  it: "@a%0%a001250@bMa quella non è la Reggia Fatata?\nDai, papà! Entriamo!\n@c0@"
  ja: "@a@b%a001250「あれが　妖精の女王さまのお城？\n\tねえ　お父さん　早く入りたい！\n@c0@"
17:
  de: "@aSancho@bOlé! Diese Horn hat tatsächliss funktioniert, eh?\n@c0@"
  en: "@aSancho@bOlé! Thees horn, eet really works, eh?\n@c0@"
  es: "@aSancho@b¡Padre! Ese cuerno funciona, ¿eh?\n@c0@"
  fr: "@aSancho@bOléⓠ Cette c-corne, elle marche v-vraiment, heinⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que maravilla!\n¡El corno funziona davveros!\n@c0@"
  ja: "@a@bサンチョ「いや～\n\t上手に　ホルンが吹けて\n\t良かったですね。\n@c0@"
18:
  de: "@aOtto@bWelch ein himmlischer Klang. Mir ist, als wäre mein unwürdiges Herz mit einem Schlag rein gewaschen worden!\n@c0@"
  en: "@aTuppence@bWhat a delightful tone. I feel as if my unworthy heart has been washed as clean as a whistle!\n@c0@"
  es: "@aAlazar@b¡Qué agradable tono! ¡Es como si mi indigno corazón hubiese quedado limpio como una patena!\n@c0@"
  fr: "@aInnocent@bQuel doux sonⓠ C'est comme si mon cœur venait d'être lavé de toutes ses impuretésⓠ\n@c0@"
  it: "@aSimon@bChe splendido suono! Mi sento come se il mio spirito fosse stato purificato! Anzi, mi sento come se avessi tra le braccia una splendida fanciulla...\n@c0@"
  ja: "@a@bピピン「なんて　きれいな音色だったんだ。\n\tボクの　きたない心が\n\t洗われてゆくようです……。\n@c0@"
19:
  de: "@a%0%a001240@bEin Schloss inmitten eines Sees... Bedeutet das, dass Feen nie seekrank werden?\n@c0@"
  en: "@a%0%a001240@bA palace in the middle of a lake...\nDoes that mean faeries never get seasick?\n@c0@"
  es: "@a%0%a001240@bUn palacio en mitad de un lago...\nEso querrá decir que las hadas no se marean nunca, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bUn palais au milieu d'un lac... Est-ce que ça veut dire que les fées ne connaissent pas le mal de merⓡ\n@c0@"
  it: "@a%0%a001240@bUn palazzo in mezzo a un lago...\nCon l'umidità che ci sarà, spero che le fate siano immuni dai reumatismi!\n@c0@"
  ja: "@a@b%a001240「湖の上のお城か。\n\t妖精って　船酔いしないのかな？\n@c0@"
20:
  de: "@a%0%a001250@bIch freue mich so darauf, noch einmal ein paar Feen zu sehen. Komm, lass uns ins Schloss gehen!\n@c0@"
  en: "@a%0%a001250@bI really want to meet with the faeries again.\nCan we hurry on over to the palace?\n@c0@"
  es: "@a%0%a001250@bTengo muchas ganas de volver a ver a las hadas.\n¡Démonos prisa en llegar al palacio!\n@c0@"
  fr: "@a%0%a001250@bJ'ai vraiment envie de revoir les fées. On ne peut pas aller directement au palaisⓡ\n@c0@"
  it: "@a%0%a001250@bVoglio incontrare ancora le fate!\nSbrighiamoci ad arrivare al palazzo!\n@c0@"
  ja: "@a@b%a001250「また　妖精さんに会いたいの。\n\tはやく　お城　行こ？\n@c0@"
21:
  de: "@aSancho@bDiese Feenherrin, sie ist die wisstigste Person bei den Feen, no? Dass du mir nissts Unanständiges sagst, hörst du, Chico?\n@c0@"
  en: "@aSancho@bThees Faerie Queen, eshe ees the most important of all the faeries, sí? You no esay notheeng loco, okay, friend?\n@c0@"
  es: "@aSancho@bEsta Reina de las Hadas es la mera mera de las hadas, ¿ok? No me vayas a decir tonterías, chamaco.\n@c0@"
  fr: "@aSancho@bCette r-reine des fées, c'est la plus importante des fées, siⓡ Tu ne dis pas de b-bêtises, hein, chicoⓡ\n@c0@"
  it: "@aSancho@bLa Reina de las Fatas es la más importante de todos aquí.\n¡Me raccomando, chico: comportate bien!\n@c0@"
  ja: "@a@bサンチョ「妖精の女王といえば\n\t妖精の世界で　一番えらい方。\n\t%a000090王　そそうのないように。\n@c0@"
22:
  de: "@aOtto@bDas Feenschloss ist also im Nebel versteckt... Oder ist es gar net dort im Nebel?\n@c0@"
  en: "@aTuppence@bSo the Faerie Palace is hidden in the mist...\nOr maybe it's not there in the mist at all!?\n@c0@"
  es: "@aAlazar@bAsí que el Palacio de las Hadas está oculto en la niebla...\n¡O a lo mejor no está dentro de la niebla ni nada!\n@c0@"
  fr: "@aInnocent@bAlors comme ça, le palais des Fées est caché dans la brume... Ou peut-être qu'il n'est pas du tout dans la brumeⓡ\n@c0@"
  it: "@aSimon@bE così la Reggia Fatata è nascosta nella nebbia...\nUhm, è un ottimo stratagemma difensivo...\n@c0@"
  ja: "@a@bピピン「この霧の中に　妖精のお城が\n\tあるんですよね……。\n\tそれとも　霧の中には　ないのかな？？\n@c0@"
23:
  de: "@aBianca@bDas ist mal ein Nebel, was? Du bist doch noch da, oder, %a000090?\n@c0@"
  en: "@aBianca@bThis is a mist and a half, eh?\nYou are there, en't you, %a000090?\n@c0@"
  es: "@aBianca@bEsta niebla es como un puré de patatas de densa, ¿eh?\n¿Sigues ahí, %a000090?\n@c0@"
  fr: "@aBianca@bQuelle purée de poisⓠ Tu es bien là, %a000090, heinⓡ\n@c0@"
  it: "@aBianca@bChe nebbia fitta! Sei sempre qui, %a000090?\n%0%a000090? Ehi, %a000090?!\n%0 %a000090, ci sei?!\n@c0@"
  ja: "@a@bビアンカ「すごい霧ねえ。\n\tねえ　%a000090\n\tちゃんと　そこにいる？\n@c0@"
24:
  de: "@aNera@bEs kommt mir so vor, als könnte ich jeden Augenblick vom Nebel verschluckt werden... Bleib schön in meiner Nähe, hörst du, Liebling?\n@c0@"
  en: "@aNera@bI feel like I might just melt away into the mist at any minute! Stay close, won't you, darling?\n@c0@"
  es: "@aNera@b¡Me siento como si fuese a desaparecer en esta niebla en cualquier momento! ¡No te alejes, caro mio!\n@c0@"
  fr: "@aNera@bJ'ai l'impression que je vais me dissoudre dans la brume à tout momentⓠ Tu restes près de moi, hein, mon chériⓡ\n@c0@"
  it: "@aNera@bAmore mio, stammi vicino...\nHo paura di essere inghiottita dalla nebbia!\n@c0@"
  ja: "@a@bフローラ「このまま　霧の中に\n\tとけてしまいそうですわ。\n\tちゃんと　つかまえていてね　あなた。\n@c0@"
25:
  de: "@a%0%a001240@bWas für ein schöner See. Und die Oberfläche ist wie ein Spiegel!\n@c0@"
  en: "@a%0%a001240@bWhat a pretty lake. The surface is just like a mirror!\n@c0@"
  es: "@a%0%a001240@bQué lago más bonito. ¡La superficie parece un espejo!\n@c0@"
  fr: "@a%0%a001240@bQuel joli lacⓠ On dirait un miroir.\n@c0@"
  it: "@a%0%a001240@bChe bello questo lago!\nLa superficie sembra uno specchio...\n@c0@"
  ja: "@a@b%a001240「ここって　本当にきれいな\n\t湖だったんだね。\n\t水面が　カガミみたいだよ！\n@c0@"
26:
  de: "@a%0%a001250@bSieh nur, Papa! Der Himmel spiegelt sich auf der Oberfläche des Sees!\n@c0@"
  en: "@a%0%a001250@bLook, Dad! It looks like the sky's right there in\nthe lake!\n@c0@"
  es: "@a%0%a001250@b¡Mira, papi! ¡Es como si el cielo estuviese dentro del lago!\n@c0@"
  fr: "@a%0%a001250@bRegarde, papaⓠ On dirait que le ciel est dans le lacⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto come il cielo si riflette nel lago?\nÈ uno spettacolo favoloso!\n@c0@"
  ja: "@a@b%a001250「お父さん　見て！\n\t湖の中にも　お空があるみたい。\n@c0@"
27:
  de: "@aSancho@bEs ist seltsam hier, no? Diese Schönheit, das ist einfach zu schön, um wahr zu sein. Deine Onkel Sancho traut die Braten nisst...\n@c0@"
  en: "@aSancho@bEes estrange here, no? Thees beauty, ees like\r\nees no real. Your Uncle Sancho, he no trust eet.\n@c0@"
  es: "@aSancho@bQué raro es esto, ¿no? Tanta belleza, no parece de verdad. Tito Sancho no se fía.\n@c0@"
  fr: "@aSancho@bC-C'est bizarre, noⓡ Cette beauté est presque\ns-surnaturelle. Ton oncle S-Sancho, il n'a pas\nc-confiance.\n@c0@"
  it: "@aSancho@bEs estrano...\nHo la sensación que esta bellezza no sia real...\n@c0@"
  ja: "@a@bサンチョ「どうも　このあたりは\n\t現実ばなれした　美しさで…\n\tなんだか　落ちつきませんね。\n@c0@"
28:
  de: "@aOtto@bNa, wenn sie das ganze Schloss im Nebel verstecken können, brauchen sie keine besonderen Schutzmaßnahmen.\n㈡\nDarum sieht hier wohl alles so hübsch aus...\n@c0@"
  en: "@aTuppence@bThey don't need much of a defence if they can hide the whole palace in the mist. I suppose that's why it looks so unencumbered.\n@c0@"
  es: "@aAlazar@bSi pueden ocultar el palacio entero en la niebla no necesitan demasiadas defensas. Será por eso que no parece nada fortificado.\n@c0@"
  fr: "@aInnocent@bElles n'ont pas besoin de soldats pour les défendre si elles arrivent à cacher le palais entier dans la brume. Ce doit être pour ça qu'il a l'air si vide.\n@c0@"
  it: "@aSimon@bSe il palazzo è interamente nascosto nella nebbia, non servono altri sistemi difensivi: se i nemici non ti trovano, non possono attaccarti!\n@c0@"
  ja: "@a@bピピン「霧で　お城を　かくせるから\n\t城壁とかが　いらないんですよね。\n\tだから　こんなに自然なのか……。\n@c0@"
29:
  de: "@aBianca@bWer hätte gedacht, dass sich solch ein Anblick hinter dem Nebel verbirgt? Ich bin sprachlos.\n@c0@"
  en: "@aBianca@bWho'd have thought there'd be a view like this hidden in the mist!? I'm a bit bowled over.\n@c0@"
  es: "@aBianca@b¿Quién iba a pensar que en la niebla se escondía un panorama así? Me he quedado pasmada, ¿sabes?\n@c0@"
  fr: "@aBianca@bQui aurait pu penser qu'on verrait quelque chose d'aussi joli dans la brumeⓡ C'est stupéfiant.\n@c0@"
  it: "@aBianca@bMa è incredibile!\nNon avrei mai immaginato che la nebbia nascondesse uno spettacolo simile!\n@c0@"
  ja: "@a@bビアンカ「あの霧の中に\n\tこんな景色が　かくされていたなんて。\n\tもうっ　ステキじゃないの！\n@c0@"
30:
  de: "@aNera@bIch komme mir vor wie in einem Traum. Ich kann kaum glauben, dass so etwas Schönes tatsächlich existiert...\n@c0@"
  en: "@aNera@bI feel like I'm in some kind of dream. I can hardly believe something so beautiful really exists.\n@c0@"
  es: "@aNera@bSembra como una especie di sogno. Apenas puedo creer que exista algo así de bello.\n@c0@"
  fr: "@aNera@bJ'ai l'impression d'être dans un rêve. J'ai du mal\r\nà croire que quelque chose d'aussi beau existe.\n@c0@"
  it: "@aNera@bMi sembra di essere in un sogno...\nNon credo ai miei occhi.\nÈ troppo bello per essere vero...\n@c0@"
  ja: "@a@bフローラ「夢を見ているみたい……。\n\tこんな　きれいな場所が\n\tこの世界に　あったなんて。\n@c0@"
31:
  de: "@a%0%a001240@bWas für ein komisches Schloss! Es ist alles so schemenhaft... Wie in einem Traum!\n@c0@"
  en: "@a%0%a001240@bWhat a weird palace! It's all wobbly where we're walking, just like being in a dream.\n@c0@"
  es: "@a%0%a001240@b¡Qué palacio más raro! Todo está como difuso, es como un sueño.\n@c0@"
  fr: "@a%0%a001240@bIl est bizarre ce palaisⓠ Ça bouge là où on marche, un peu comme dans un rêve.\n@c0@"
  it: "@a%0%a001240@bHai visto quant'è strano questo palazzo?\nHai visto come trema quando camminiamo?\nDi che materiale sarà fatto?\n@c0@"
  ja: "@a@b%a001240「ふしぎなお城だね……。\n\t足下が　ふわふわする。\n\t夢の中みたい……。\n@c0@"
32:
  de: "@a%0%a001240@bGlaubst du, dass dieses Schloss wirklich echt ist? Ich meine, in dem Nebel war doch gar nichts, oder?\n@c0@"
  en: "@a%0%a001240@bDo you think this palace is really real? I mean, there wasn't anything there in that mist, was there?\n@c0@"
  es: "@a%0%a001240@b¿Crees que este palacio es de verdad de la buena? Quiero decir que en la niebla no había nada, ¿verdad que no?\n@c0@"
  fr: "@a%0%a001240@bTu crois que ce palais est réelⓡ C'est vrai,\nil n'y avait rien dans cette brume avant, nonⓡ\n@c0@"
  it: "@a%0%a001240@bQuest'edificio esiste davvero o è solo un'allucinazione?\nVoglio dire, è spuntato fuori praticamente dal nulla!\n@c0@"
  ja: "@a@b%a001240「このお城　本物かな？\n\tだって　あの霧の中には\n\t何もなかったよね？\n@c0@"
33:
  de: "@a%0%a001250@bWir gehen doch nicht schon wieder, oder, Papa? Ich möchte so lang wie möglich in diesem Schloss bleiben!\n@c0@"
  en: "@a%0%a001250@bLet's not rush too much, okay, Dad? I want to spend as long here in this palace as we possibly can!\n@c0@"
  es: "@a%0%a001250@bNo vayamos muy de prisa, papi, por favor. ¡Quiero pasar todo el tiempo que podamos en este palacio!\n@c0@"
  fr: "@a%0%a001250@bOn ne va pas aller trop vite, d'accord, papaⓡ\nJe veux passer autant de temps que possible\ndans ce palaisⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, possiamo esplorare questo posto con calma?\nMi piacerebbe restare qui un po' di tempo...\n@c0@"
  ja: "@a@b%a001250「お父さん　ゆっくり歩いてね。\n\tわたし　お城の中　いっぱい\n\t見たいから……。\n@c0@"
34:
  de: "@a%0%a001250@bDas ist alles so wunderschön! Wenn ich mal ein eigenes Zimmer habe, soll es genauso aussehen!\n@c0@"
  en: "@a%0%a001250@bIt's so beautiful! When I have a room of my own,\nI want to make it just like this.\n@c0@"
  es: "@a%0%a001250@b¡Es precioso! Cuando tenga una habitación para mí sola, será exactamente así.\n@c0@"
  fr: "@a%0%a001250@bIl est si joli. Quand j'aurai ma chambre à moi, je veux qu'elle soit exactement comme ça.\n@c0@"
  it: "@a%0%a001250@bChe meraviglia!\nMi piacerebbe tantissimo vivere in un posto come questo!\n@c0@"
  ja: "@a@b%a001250「すごく　きれい。\n\tわたしの　お部屋があったら\n\tこんなふうにしたいな……。\n@c0@"
35:
  de: "@aSancho@bIss glaube nisst, dass diese Ort real ist. Manchmal weiß man halt nisst, was echt ist und was man siss nur einbildet...\n@c0@"
  en: "@aSancho@bI no believe thees place, eet really exists!\r\nYou no comprende what ees real, and what\r\nees just your imagination.\n@c0@"
  es: "@aSancho@b¡No me creo que este sitio exista de verdad!\nNo se distingue lo verdadero de las meras imaginaciones.\n@c0@"
  fr: "@aSancho@bJ-Je ne crois pas que cet endroit existe vraimentⓠ On ne peut pas d-distinguer ce qui est vrai de ce\nqui est imaginaire.\n@c0@"
  it: "@aSancho@bYo no pienso que esto posto es realmentes real.\nPor mi es solo opera della mia imaginacion.\n@c0@"
  ja: "@a@bサンチョ「いやはや　こんな場所が\n\t本当にあったとは…　もう\n\t何が現実で　何が空想なのやら……。\n@c0@"
36:
  de: "@aOtto@bMeint Ihr, die Feenherrin ist vielleicht alleinstehend? Das würde mich wirklich sehr interessieren...\n@c0@"
  en: "@aTuppence@bDo you suppose the Queen of the Faeries is single?\r\nI wonder...\n@c0@"
  es: "@aAlazar@b¿Creéis que la Reina de las Hadas es soltera?\nMe pregunto...\n@c0@"
  fr: "@aInnocent@bD'après vous, la reine des Fées est-elle célibataireⓡ Je me demande...\n@c0@"
  it: "@aSimon@bChissà se la Regina delle Fate è sposata...\nMagari deve ancora trovare il suo principe azzurro, eh? Ehm...\n@c0@"
  ja: "@a@bピピン「妖精の女王さまって\n\t独身でしょうか？\n\tねっ　どう思われます？\n@c0@"
37:
  de: "@aBianca@bHier ist es wirklich wie im Märchen. Alles zu schön, um wahr zu sein.\n@c0@"
  en: "@aBianca@bThis is just like bein' in a faerie tale, eh?\r\nIt certainly dun't feel like it could be real.\n@c0@"
  es: "@aBianca@bEs como estar en un cuento de hadas, ¿eh?\nUno no tiene sensación de que esto sea de verdad.\n@c0@"
  fr: "@aBianca@bOn a l'impression d'être dans un conte de fées, heinⓡ Je n'arrive pas à me dire que tout ceci peut exister dans la réalité.\n@c0@"
  it: "@aBianca@bNon so se tutto questo sia reale o se stiamo vivendo un'allucinazione collettiva...\n@c0@"
  ja: "@a@bビアンカ「本当に　おとぎ話の中に\n\t入っちゃったみたい。\n\t現実って感じがしないわね。\n@c0@"
38:
  de: "@aNera@bIch komme mir plötzlich so leicht vor, als ob mein ganzer Körper schweben würde...\n@c0@"
  en: "@aNera@bI feel like my whole body is suddenly lighter than usual, like I'm floating.\n@c0@"
  es: "@aNera@bSiento como si il mio corpo fuese más ligero, como si flotase.\n@c0@"
  fr: "@aNera@bC'est comme si tout mon corps était plus léger que d'habitude. J'ai l'impression de flotter.\n@c0@"
  it: "@aNera@bMi sembra di fluttuare, come se il mio corpo fosse più leggero del solito... Eh eh eh! Ora potrei pesarmi senza temere il responso della bilancia!\n@c0@"
  ja: "@a@bフローラ「なんだか　身体が\n\tかるくなったみたい。\n@c0@"
39:
  de: "@a%0%a001240@bEs ist genauso, wie Vanilla es uns beschrieben hat!\n@c0@"
  en: "@a%0%a001240@bIt's just like Sherbet told us!\n@c0@"
  es: "@a%0%a001240@b¡Es como lo que nos contó Melaza!\n@c0@"
  fr: "@a%0%a001240@bC'est exactement comme Ambroisie nous l'avait dit.\n@c0@"
  it: "@a%0%a001240@bMa è proprio come ci aveva detto Lybrina!\n@c0@"
  ja: "@a@b%a001240「やっぱり！\n\tルナの言ったとおりだ。\n\tねっ　お父さん。\n@c0@"
40:
  de: "@aSancho@bKomm her, Chico. Sieh deine Onkel Sancho mal an. Si, si... Die Strähne aus die Gesisst... und so... Jetzt ist gut!\n@c0@"
  en: "@aSancho@bCome here, friend. Look at your Uncle Sancho.\nSí, sí... I just do thees...and thees...and...\nOkay!\n@c0@"
  es: "@aSancho@bVen aquí, chamaco. Mira a tu tito Sancho.\nDéjame que haga esto... y esto...\n¡Órale!\n@c0@"
  fr: "@aSancho@bViens ici, chico. R-Regarde ton oncle Sancho.\nSi, si... J-Je remets ça c-comme ça... et ça... et...\nVoilàⓠ\n@c0@"
  it: "@aSancho@bVieni aquí, chico...\nFatte mettere en ordines...\n@c0@"
  ja: "@a@bサンチョ「%a000090王\n\tちょっと　こっちを向いて。\n\t……うん。　よしっ。\n@c0@"
41:
  de: "@aSancho@bJetzt kannst du der Königin unter die Augen treten. Wie eine stolze Matador!\n@c0@"
  en: "@aSancho@bNow you are ready for your meeting weeth\r\nthe Faerie Queen. You look handsome like a\r\nproud matador!\n@c0@"
  es: "@aSancho@bYa estás a punto para ver a la Reina de las Hadas. ¡Estás bien buenón!\n@c0@"
  fr: "@aSancho@bMaintenant, tu es prêt à rencontrer la reine des Fées. T-Tu es beau comme oun fier matadorⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que bueno!\n¡Ahora sei pronto por encontrar la Reina de las Fatas!\n@c0@"
  ja: "@a@bサンチョ「いえいえ。\n\t妖精の女王さまに　ごあいさつする前に\n\t身だしなみを　整えませんとね。\n@c0@"
42:
  de: "@aBianca@bVon Privatsphäre hat sie wohl noch nie was gehört... Aber es stimmt, was sie gesagt hat.\n@c0@"
  en: "@aBianca@bShe dun't mind spillin' the beans about people's private lives, eh? Still, it's not like it's a bad thing\r\nshe told us.\n@c0@"
  es: "@aBianca@bEsta lo suelta todo sobre la vida de la gente sin inmutarse... Aunque eso que nos ha dicho tampoco es que sea nada malo, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bÇa ne la dérange pas de raconter la vie privée des gensⓡ En même temps, ce n'est pas comme si elle\nnous avait dit quelque chose de méchant.\n@c0@"
  it: "@aBianca@bCi ha detto una cosa interessante, ma spero che non vada a spifferarla ai quattro venti! Non mi piacciono le persone che non si fanno gli affari loro!\n@c0@"
  ja: "@a@bビアンカ「人の家の　ふくざつな事情を\n\tサラッと　言ってくれちゃうわね！\n\t……まあいいか　悪口じゃないしね。\n@c0@"
43:
  de: "@a%0%a001240@bOh... Was ist denn ein Nachfahre?\n@c0@"
  en: "@a%0%a001240@bOh, I get it! I know what a descendant is.\n@c0@"
  es: "@a%0%a001240@b¡Ah, ya entiendo! Ya sé lo que es una descendiente.\n@c0@"
  fr: "@a%0%a001240@bOh, j'ai comprisⓠ Je sais ce que c'est une descendante.\n@c0@"
  it: "@a%0%a001240@bMa davvero?!\nNon l'avrei mai detto!\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\t子孫って　子どものことだよ。\n\tえーと……だから……\n@c0@"
44:
  de: "@a%0%a001240@bIst das jemand, der nach uns in dem Wagen fährt? Nein, das kann es nicht sein...\n@c0@"
  en: "@a%0%a001240@bIt means Mum likes going down wells, right?\nNo, maybe not...\n@c0@"
  es: "@a%0%a001240@bQuiere decir que mamá baja a los pozos, ¿verdad?\nNo, a lo mejor no es eso...\n@c0@"
  fr: "@a%0%a001240@bÇa veut dire que maman aime descendre dans les puits, c'est çaⓡ Quoique, peut-être pas...\n@c0@"
  it: "@a%0%a001240@bD'altra parte, la mia mamma doveva per forza essere una persona speciale, dato che ha dato alla luce un bambino forte e coraggioso come me!\n@c0@"
  ja: "@a@b%a001240「わかった！\n\tお母さん　伝説の勇者なんだ！\n\tえ？　ちがうの？\n@c0@"
45:
  de: "@a%0%a001250@bAber warum haben die Nachfahren denn keine Flügel? Zu schade, ich finde sie nämlich sehr hübsch...\n@c0@"
  en: "@a%0%a001250@bI wonder when the descendants stopped having wings. It seems a shame to have lost them.\nThey're so pretty.\n@c0@"
  es: "@a%0%a001250@bMe pregunto por qué los descendientes dejaron de tener alas. Qué lástima perderlas, con lo bonitas que son.\n@c0@"
  fr: "@a%0%a001250@bJe me demande quand les descendants des Zénithiens n'ont plus eu d'ailes. C'est dommage qu'ils les aient perdues. Elles sont si jolies.\n@c0@"
  it: "@a%0%a001250@bChissà come mai i discendenti degli Zenithiani non hanno le ali... Sarebbe stata una bella comodità, se ne fossero stati dotati!\n@c0@"
  ja: "@a@b%a001250「その天空人さんの子孫は\n\tいつから羽がなくなっちゃったのかな？\n\tもったいないよね…　羽キレイなのに。\n@c0@"
46:
  de: "@aSancho@bSi, si. Señor Ludwig und du, Chico, ihr habt eine gute Auge für Señoras. Si, si.\n@c0@"
  en: "@aSancho@bSí, sí. Señor Pankraz and you, friend, you both have a good eye. Sí, sí, sí.\n@c0@"
  es: "@aSancho@b¡Ándale! El señor Teudis y tú, chamaco, los dos tenéis buen ojo. Sí, sí, sí.\n@c0@"
  fr: "@aSancho@bSi, si. Le señor P-Petros et toi, chico, v-vous avez l'œil. Si, si, si.\n@c0@"
  it: "@aSancho@b¿Hai sentito, chico?\nEsta es una notizia muy interessante...\n¿Ma forse già lo sospettavi, eh?\n@c0@"
  ja: "@a@bサンチョ「パパスさまといい\n\t%a000090王といい　おふたりとも\n\t見る目が高いですねえ。　うんうん。\n@c0@"
47:
  de: "@aBianca@bWenn ich also nicht mit dir zusammen gekommen wäre, müsste ich jetzt nicht all diese Qualen durchstehen...\n@c0@"
  en: "@aBianca@bSo if I hadn't got together with you, I wouldn't have had to go through all this trauma...\n@c0@"
  es: "@aBianca@bAsí que, si no me hubiese juntado contigo, me hubiese ahorrado todo este trauma...\n@c0@"
  fr: "@aBianca@bDonc si je ne t'avais pas épousé, je n'aurais pas eu à subir tout ça...\n@c0@"
  it: "@aBianca@bSe non ti avessi conosciuto, forse l'Eroe Leggendario non sarebbe mai nato...\n@c0@"
  ja: "@a@bビアンカ「%a000090と　いっしょに\n\tならなければ　私も　こんなに\n\t苦労は　しなかったでしょうね……。\n@c0@"
48:
  de: "@aBianca@bHa ha! Nein, keine Angst, ich mach nur Spaß. Na, komm schon, %a000090! Jetzt mach nicht so ein Gesicht!\n@c0@"
  en: "@aBianca@bHa ha! I'm only pullin' your leg! I dun't mean it, really. Oh, come on, %a000090! Dun't look at me like that!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Te estoy tomando el pelo, tonto! No lo decía en serio. ¡Vamos, %a000090! ¡No pongas esa cara!\n@c0@"
  fr: "@aBianca@bHa haⓠ Je te fais marcherⓠ Je n'en pense pas un mot. Allez, %a000090ⓠ Ne me regarde pas comme çaⓠ\n@c0@"
  it: "@aBianca@bForse la dea ha voluto che ci incontrassimo per generare colui che potrà salvare il mondo dalla minaccia dell'oscurità...\n@c0@"
  ja: "@a@bビアンカ「……なーんて　ウソウソ！\n\tじょーだんよ！　ほら　%a000090\n\tそんな顔　しないでよっ！\n@c0@"
49:
  de: "@aNera@bDas alles war also der Wille der Göttin... Aber trotzdem habe ich mich in dich verliebt und entschieden, bei dir zu bleiben.\n@c0@"
  en: "@aNera@bSo this was all the Goddess' plan...\r\nAnd yet I thought I chose to be with\r\nyou out of my own will.\n@c0@"
  es: "@aNera@bAsí que tutto era parte del plan de la Diosa...\nY yo que pensaba que te había elegido per la mia voluntad.\n@c0@"
  fr: "@aNera@bAlors c'est la Déesse qui a tout décidé... Pourtant, j'étais convaincue que c'était moi qui avais choisi d'être avec toi.\n@c0@"
  it: "@aNera@bSembra che la nostra unione fosse scritta nelle stelle...\nEra destino che io e te ci sposassimo, %a000090.\n@c0@"
  ja: "@a@bフローラ「神のご意志だったのかしら…\n\t私は　私の意志で　あなたを\n\t選んだのだと思っていましたけど……。\n@c0@"
50:
  de: "@a%0%a001240@bAber dann müsste doch auch %a001250 eine legendäre Heldin sein, oder? Oh, aber sie kann ja gar keine besonderen Sachen ausrüsten...\n@c0@"
  en: "@a%0%a001240@bThen shouldn't that make %a001250 a legendary hero too? Oh, but she can't equip any of the special stuff...\n@c0@"
  es: "@a%0%a001240@bEntonces, %a001250 es también una heroína legendaria, ¿no? ¡Oh!, pero no puede equipar ningún objeto especial...\n@c0@"
  fr: "@a%0%a001240@bMais du coup, %a001250 ne devrait pas être une héroïne légendaire, elle aussiⓡ Et pourtant, elle ne peut pas s'équiper de tous ces objets spéciaux...\n@c0@"
  it: "@a%0%a001240@bCome mai %a001250 non è un'Eroina Leggendaria?\nPerché lei non può usare l'Equipaggiamento Zenithiano?\n@c0@"
  ja: "@a@b%a001240「それなら\n\t%a001250だって　勇者だよね？\n\t伝説の装備は　できないけど……\n@c0@"
51:
  de: "@a%0%a001240@bTrotzdem, mit ihrer Hilfe konnten wir Dinge tun, zu denen wir sonst nicht imstande gewesen wären.\n@c0@"
  en: "@a%0%a001240@bStill, having her along has certainly helped us do things we wouldn't have managed otherwise.\n@c0@"
  es: "@a%0%a001240@bNo importa, nos ha ayudado a hacer cosas que no hubiéramos sido capaces de hacer.\n@c0@"
  fr: "@a%0%a001240@bCeci dit, je pense que, d'une manière ou d'une autre, elle nous a sûrement aidés à faire des trucs qu'on n'aurait pas pu réussir autrement.\n@c0@"
  it: "@a%0%a001240@bCredo che anche lei sia speciale: senza il suo aiuto, non saremmo mai riusciti ad arrivare fin qua!\n@c0@"
  ja: "@a@b%a001240「でも　%a001250が\n\tいっしょに　いてくれたから　\n\tできたことって　いっぱいあるんだ！\n@c0@"
52:
  de: "@a%0%a001250@bWenn ich doch nur auch eine legendäre Heldin wäre. Dann könnte ich %a001240 einen Teil seiner schweren Last abnehmen...\n@c0@"
  en: "@a%0%a001250@bIf only I could have been a legendary hero too. Then I could've shared half of the burden with %a001240.\n@c0@"
  es: "@a%0%a001250@bQué pena no ser yo también una heroína legendaria... Así podría haber compartido la carga con %a001240.\n@c0@"
  fr: "@a%0%a001250@bSi seulement j'avais pu être une héroïne légendaire, moi aussi... Comme ça, on aurait pu se partager le travail avec %a001240.\n@c0@"
  it: "@a%0%a001250@bSe anch'io fossi dotata di capacità particolari, avrei potuto aiutare %a001240 e rendere più sopportabile il peso che grava su di lui...\n@c0@"
  ja: "@a@b%a001250「わたしも　勇者だったら\n\t%a001240の　使命を\n\t半分　持ってあげられたのに……。\n@c0@"
53:
  de: "@aOtto@bWenn Ihr mit einer Zenithianerin den legendären Helden gezeugt habt, frage ich mich, was wohl entstehen würde, wenn ich mit einer Fee...\n@c0@"
  en: "@aTuppence@bIf you produced the legendary hero by being with a Zenithian, I wonder what I'd produce if I got together with a faerie...\n@c0@"
  es: "@aAlazar@bSi tú has engendrado al héroe legendario al unirte a una habitante de Zenithia, me pregunto qué podríamos engendrar un hada y yo...\n@c0@"
  fr: "@aInnocent@bSi vous avez donné naissance au héros légendaire en étant avec une Zénithienne, je me demande ce\r\nque ça donnerait si j'étais avec une fée...\n@c0@"
  it: "@aSimon@bSe l'Eroe Leggendario è nato dall'unione tra un discendente dalla stirpe di Picco Maximo e una Zenithiana...\n@c0@"
  ja: "@a@bピピン「%a000090さまと　天空人から\n\t伝説の勇者が生まれるなら\n\tボクと　妖精族だと……\n@c0@"
54:
  de: "@aOtto@bHi hi! Das könnte äußerst interessant werden!\n@c0@"
  en: "@aTuppence@bTee hee! This could be rather interesting.\n@c0@"
  es: "@aAlazar@b¡Ji, ji! ¡Sí, sería muy interesante!\n@c0@"
  fr: "@aInnocent@bTi-hiⓠ Ça pourrait être intéressant.\n@c0@"
  it: "@aSimon@bCosa potrà mai nascere dal matrimonio tra una guardia di palazzo di Denim e una fata?\nUhm, domanda interessante...\n@c0@"
  ja: "@a@bピピン「ふふふっ　かなり有望だ！\n@c0@"
55:
  de: "@a%0%a001240@bIch hab ein wenig Angst, die Königin zu treffen. Mein Herz schlägt wie verrückt!\n@c0@"
  en: "@a%0%a001240@bI'm a bit nervous about meeting the Queen.\nMy heart's beating like mad!\n@c0@"
  es: "@a%0%a001240@bEstoy nervioso por conocer a la Reina.\n¡Mira cómo me late el corazón!\n@c0@"
  fr: "@a%0%a001240@bÇa me rend un peu nerveux de rencontrer la reine. Mon cœur s'emballeⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, non hai paura di incontrare la Regina delle Fate? Se fossi al posto tuo, il cuore mi batterebbe come un tamburo!\n@c0@"
  ja: "@a@b%a001240「女王さまに会うの\n\tちょっと　きんちょうするね……。\n\tドキドキしてきちゃった。\n@c0@"
56:
  de: "@aSancho@bGut, Chico. Mach deine Onkel Sancho keine Schande, hörst du? Es wird Zeit, dass du zu die Königin gehst.\n@c0@"
  en: "@aSancho@bOkay, friend. You no let your Uncle Sancho down, okay? Ees time for you to meet the Queen.\n@c0@"
  es: "@aSancho@bMuy bien, chamaco. No le falles a tu tito Sancho, ¿ok? Vamos, ve ya a ver a la Reina.\n@c0@"
  fr: "@aSancho@bNe d-déçois pas ton oncle S-Sancho, chico, heinⓡ\nLe moment est v-venu de rencontrer la reine.\n@c0@"
  it: "@aSancho@b¿Chico, sei pronto?\nEs giunto el momento de encontrare la Reina de las Fatas...\n@c0@"
  ja: "@a@bサンチョ「ほらほら　%a000090王！\n\tあの兵士の言うとおりです。\n\tまずは　女王さまに　お目通りを！\n@c0@"
57:
  de: "@a%0%a001240@bHier gibt es nicht besonders viele Jungen, oder? Glaubst du, dass sich all diese Mädchen nicht manchmal langweilen?\n@c0@"
  en: "@a%0%a001240@bThere aren't many boys about in this place,\nare there? Don't you think they get a bit bored,\nall girls together?\n@c0@"
  es: "@a%0%a001240@bNo hay muchos chicos por aquí, ¿verdad? ¿No se aburrirán todas esas niñas solas?\n@c0@"
  fr: "@a%0%a001240@bY'a pas beaucoup de garçons dans le coin.\nTu ne crois pas qu'elles doivent s'ennuyer\nen restant entre fillesⓡ\n@c0@"
  it: "@a%0%a001240@bNon ci sono molti maschietti da queste parti...\nNon è che le ragazze si annoiano a star sempre tra di loro?\n@c0@"
  ja: "@a@b%a001240「このお城って　男の人が\n\t少ないよね。　女の子ばかりで\n\tつまんなくないのかな？\n@c0@"
58:
  de: "@aOtto@bDas erinnert mich an meine Zeit auf der Burg. Dort hab ich auch oft am Eingang g'standen und Wache g'halten.\n@c0@"
  en: "@aTuppence@bThat reminds me of my days at the castle. I often used to stand guard at the entrance like that.\n@c0@"
  es: "@aAlazar@bMe recuerda cuando estaba en el castillo. Allí solía hacer guardia en la entrada.\n@c0@"
  fr: "@aInnocent@bÇa me rappelle quand j'étais au château.\r\nJe montais souvent la garde à l'entrée.\n@c0@"
  it: "@aSimon@bAnch'io regolavo il flusso dei visitatori, quand'ero una guardia di palazzo al Castello di Denim.\r\nLa mia vita era molto più tranquilla allora...\n@c0@"
  ja: "@a@bピピン「お城にいた頃を　思い出すなあ。\n\tボクも　昔　出入り口の見はりを\n\tしていたことが　ありましたよ。\n@c0@"
59:
  de: "@aBianca@bWas, nur %a001240 bekommt den zuckersüßen Segen? Und was ist mit dem Rest von uns?\n@c0@"
  en: "@aBianca@bSo only %a001240 gets these sweet, sugar-plum blessings? What about the rest of us, eh?\n@c0@"
  es: "@aBianca@b¿Así que las dulces bendiciones de azúcar son solo para %a001240? ¿Y los demás, qué?\n@c0@"
  fr: "@aBianca@bAlors ces douces bénédictions ne sont que pour %a001240ⓡ Et nous alorsⓡ\n@c0@"
  it: "@aBianca@bAllora la dea protegge e benedice solo %a001240?! E noialtri?\nDobbiamo restare alla mercé dei mostri, eh?!\n@c0@"
  ja: "@a@bビアンカ「神の祝福は　%a001240にだけ？\n\t私たちは　どーでもいいってこと？\n\t……な～んちゃって！\n@c0@"
60:
  de: "@a%0%a001240@bDie Leute tun immer so, als ob ich was Besonderes wäre, dabei fühle ich mich ganz normal.\n@c0@"
  en: "@a%0%a001240@bLots of people talk about me being this special hero, but I feel pretty normal really.\n@c0@"
  es: "@a%0%a001240@bTodo el mundo habla de que soy un héroe especial y eso, pero yo me siento muy normal.\n@c0@"
  fr: "@a%0%a001240@bJ'entends plein de gens me dire que je suis ce célèbre héros, mais moi, je me sens parfaitement normal.\n@c0@"
  it: "@a%0%a001240@bSarò anche l'Eroe Leggendario, ma mi sento una persona assolutamente normale!\n@c0@"
  ja: "@a@b%a001240「いろんな人が　ボクのこと\n\t勇者だって言うけど…\n\tなんか　ピンとこないよ。\n@c0@"
61:
  de: "@a%0%a001250@b%0%a001240 ist doch noch gar nicht alt genug, um eine Legende zu sein, und trotzdem nennt ihn jeder so...\n@c0@"
  en: "@a%0%a001250@b%0%a001240's not really old enough to be a legend, and yet that's what everyone calls him.\n@c0@"
  es: "@a%0%a001250@b%0%a001240 no tiene aún edad para ser una leyenda, pero todo el mundo dice que lo es.\n@c0@"
  fr: "@a%0%a001250@b%0%a001240 n'est pas encore assez grand pour être une légende et pourtant, tout le monde dit qu'il est légendaire.\n@c0@"
  it: "@a%0%a001250@bSono la sorella dell'Eroe Leggendario...\nCerto che è strano: per me lui è semplicemente %a001240, il mio caro fratello e compagno di giochi!\n@c0@"
  ja: "@a@b%a001250「%a001240って　伝説っていうほど\n\tまだ　長生きしてないよね。\n\tなのに　伝説…　なの？\n@c0@"
62:
  de: "@aOtto@bDann werden sie auch wissen, dass ich geboren bin. Immerhin bin ich der Vasall des Vaters des legendären Helden!\n@c0@"
  en: "@aTuppence@bThen they must know I've been born too. I'm vassal to the father of the legendary hero, after all!\n@c0@"
  es: "@aAlazar@bEntonces también sabrán que he nacido yo. ¡Después de todo, soy vasallo del padre del héroe legendario!\n@c0@"
  fr: "@aInnocent@bDans ce cas, elles doivent aussi être au courant de mon existence. Je suis le vassal du père du héros légendaire, après tout.\n@c0@"
  it: "@aSimon@bQuindi io sono il fedele servitore del padre dell'Eroe Leggendario!\nIl mio è un ruolo da non sottovalutare, eh!\n@c0@"
  ja: "@a@bピピン「伝説の勇者の父上の\n\t家臣である　このボクの誕生も\n\tとうぜん　知ってますよね！\n@c0@"
63:
  de: "@a%0%a001240@bFür mich sieht das wie eine Goldkugel aus. Meinst du nicht, wir könnten es trotzdem mit ihr probieren?\n@c0@"
  en: "@a%0%a001240@bIt looks like a gold orb to me. Are you sure there's no way of making it work?\n@c0@"
  es: "@a%0%a001240@bA mí me parece un orbe de oro. ¿Seguro que no hay manera de hacerlo funcionar?\n@c0@"
  fr: "@a%0%a001240@bOn dirait vraiment un orbe d'or. Tu es sûr qu'on ne peut pas le faire marcherⓡ\n@c0@"
  it: "@a%0%a001240@bA me sembra proprio un globo d'oro...\nSiamo sicuri che non c'è verso di farlo funzionare?\n@c0@"
  ja: "@a@b%a001240「きれいな金色なのに\n\tこれじゃ　ダメなの？\n\t……どうしても？\n@c0@"
64:
  de: "@a%0%a001240@bHm... wie dumm. Und da sind wir den ganzen Weg hierher gekommen...\n@c0@"
  en: "@a%0%a001240@bHuh! How annoying, after coming all this way!\n@c0@"
  es: "@a%0%a001240@b¡Pues qué fastidio, después de llegar hasta aquí!\n@c0@"
  fr: "@a%0%a001240@bPfffⓠ C'est embêtant, après avoir fait tout ce cheminⓠ\n@c0@"
  it: "@a%0%a001240@bCerto che è proprio un peccato, dopo tutta la fatica che abbiamo fatto per arrivare fin qui!\n@c0@"
  ja: "@a@b%a001240「せっかく　ボクたち\n\tがんばって　ここまで来たのに……。\n@c0@"
65:
  de: "@a%0%a001250@bIch bin mir sicher, dass sich alles zum Guten wenden wird. Irgendwie... Mach dir keine Sorgen, Papa.\n@c0@"
  en: "@a%0%a001250@bUm... I'm sure everything will work out.\nYes, somehow... You mustn't worry, Dad.\n@c0@"
  es: "@a%0%a001250@bMmm... Seguro que todo irá bien, de un modo u otro. No te preocupes, papi.\n@c0@"
  fr: "@a%0%a001250@bHum... Je suis sûre qu'on arrivera à quelque chose. Oui... Ne t'inquiète pas, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, sono sicura che andrà tutto bene.\nAbbi fiducia: vedrai che ce la faremo.\n@c0@"
  ja: "@a@b%a001250「あの…\n\tきっと　だいじょうぶよ？\n\tうまくいくの。　たぶん……。\n@c0@"
66:
  de: "@aOtto@bDie Feenherrin ist eine richtige Schönheit, genauso, wie ich sie mir vorgestellt hatte.\n@c0@"
  en: "@aTuppence@bThat Faerie Queen is quite a beauty,\r\njust as I imagined.\n@c0@"
  es: "@aAlazar@bComo imaginaba, esa Reina de las Hadas es un bombón.\n@c0@"
  fr: "@aInnocent@bCette reine des fées est vraiment belle, exactement comme je l'imaginais.\n@c0@"
  it: "@aSimon@bLa Regina delle Fate è graziosissima, proprio come immaginavo.\nAnzi, no! È molto più bella di quanto pensassi!\n@c0@"
  ja: "@a@bピピン「妖精の女王さまって\n\tやっぱり　きれいだなあ……。\n@c0@"
67:
  de: "@a%0%a001240@bWas meinte sie denn mit dem ⓞLauf der Zeitⓟ? Mann, ist das alles kompliziert...\n@c0@"
  en: "@a%0%a001240@bWhat did she mean about altering the passage of time? It's all far too complicated for me to follow.\n@c0@"
  es: "@a%0%a001240@b¿Qué quería decir con eso de alterar el paso del tiempo? Es demasiado complicado para mí.\n@c0@"
  fr: "@a%0%a001240@bJe n'ai pas compris ce qu'elle a dit sur l'écoulement du temps. C'est vraiment trop compliqué pour moi.\n@c0@"
  it: "@a%0%a001240@bNoi abbiamo il potere di alterare lo scorrere del tempo?!\nE come?! Non capisco...\n@c0@"
  ja: "@a@b%a001240「それって　どういうこと？\n\t時の流れ…？　女王さまの言うことって\n\tむずかしくて　よくわからないや。\n@c0@"
68:
  de: "@a%0%a001250@bLass uns doch einfach ein wenig durch das Schloss spazieren, ja? Ich finde immer, es tut ganz gut, sich die Beine zu vertreten, wenn man Sorgen hat.\n@c0@"
  en: "@a%0%a001250@bLet's just walk around the palace lots, shall we?\nIt's always good to walk about if you have something on your mind.\n@c0@"
  es: "@a%0%a001250@bVamos a pasearnos por el palacio un buen rato, ¿vale?\nCuando algo te preocupa, pasear es bueno.\n@c0@"
  fr: "@a%0%a001250@bEt si on se baladait autour du palaisⓡ\nC'est toujours bien de marcher quand\non réfléchit à quelque chose.\n@c0@"
  it: "@a%0%a001250@bFacciamo una passeggiata, ci aiuterà a schiarirci le idee...\n@c0@"
  ja: "@a@b%a001250「とりあえず　お城の中\n\tいっぱい　歩こうよ。\n\t考えごとするときは　歩くといいのよ？\n@c0@"
69:
  de: "@aOtto@bWie ich die Lage einschätze, ist die Feenherrin tatsächlich alleinstehend. Das sind gute Aussichten...\n@c0@"
  en: "@aTuppence@bI'd say it seems the lovely Faerie Queen is single, after all. Things are looking up!\n@c0@"
  es: "@aAlazar@bParece que, después de todo, la preciosa Reina de las Hadas está soltera. ¡La cosa promete!\n@c0@"
  fr: "@aInnocent@bSelon moi, cette jolie reine des fées est célibataire.\nIl y a de l'espoirⓠ\n@c0@"
  it: "@aSimon@bA occhio e croce, la bellissima Regina delle Fate non è sposata.\nForse potrei invitarla a visitarmi a Denim...\n@c0@"
  ja: "@a@bピピン「あの様子だと　たぶん\n\t妖精の女王さまは　独身ですね。\n\tよし　がんばるぞっ！\n@c0@"
70:
  de: "@a%0%a001240@bWow! Da muss seine Hand aber ganz schön wehtun, wenn er all das niederschreibt!\n@c0@"
  en: "@a%0%a001240@bWow! You'd think it would make his hand ache too much, writing so much stuff!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Seguro que le duele la mano después de tanto escribir!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Sa main ne tremble même pas à force\nd'écrire autantⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti!\nCon tutto quello che c'è da scrivere, le verranno i crampi alla mano!\n@c0@"
  ja: "@a@b%a001240「うわあ……。\n\tあんなに　いっぱい本を書いて\n\t手が　くたびれないのかな？\n@c0@"
71:
  de: "@a%0%a001250@bAber das Tintenhorn kommt doch aus der Welt der Menschen. Ich hätte nicht gedacht, dass es so etwas im Feenschloss gibt.\n@c0@"
  en: "@a%0%a001250@bI thought eyevory tusk-tusk ink was a souvenir from the human world. I didn't expect to find some here in the Faerie Palace.\n@c0@"
  es: "@a%0%a001250@bPensaba que la tinta de tantor solo se encontraba en el mundo de los humanos. No esperaba encontrarla aquí, en el Palacio de las Hadas.\n@c0@"
  fr: "@a%0%a001250@bJe croyais que l'encre de stigmammouth n'était fabriquée que dans le monde des humains. Je ne pensais pas en trouver dans le palais des Fées.\n@c0@"
  it: "@a%0%a001250@bCredevo che i magicalamai fossero souvenir tipici del mondo degli umani! Non mi aspettavo di trovarne anche qui nella Reggia Fatata...\n@c0@"
  ja: "@a@b%a001250「パオームのインクって\n\t人間の世界の　名産だと思ってたけど\n\t妖精さんのお城でも　使われてたのね。\n@c0@"
72:
  de: "@aOtto@bEine komplette Geschichte der Welt? Dann wird er wohl irgendwann auch etwas über mich schreiben, wenn ich verheiratet bin. \n@c0@"
  en: "@aTuppence@bA history of the entire world? Then he'll probably end up writing about me once I'm married.\n@c0@"
  es: "@aAlazar@b¿Una crónica completa del mundo? Entonces seguro que acabo saliendo yo, después de que me case.\n@c0@"
  fr: "@aInnocent@bUne histoire complète du monde entierⓡ\nAlors il y aura sûrement un passage sur\nmoi quand je me serai marié.\n@c0@"
  it: "@aSimon@bAlla storia del mondo manca ancora un capitolo di fondamentale importanza...\n@c0@"
  ja: "@a@bピピン「世界の歴史を！？\n\tじゃあ　ボクが結婚したら　ああやって\n\tボクのことも　書かれるわけですね。\n@c0@"
73:
  de: "@aOtto@bIch plane nämlich, bald berühmt zu werden, wisst Ihr... Um einiges berühmter, als ich es jetzt bin.\n@c0@"
  en: "@aTuppence@bI'm planning on becoming rather more famous than I am at present, you see.\n@c0@"
  es: "@aAlazar@bEs que tengo pensado hacerme mucho más famoso de lo que soy ahora.\n@c0@"
  fr: "@aInnocent@bJe compte bien devenir plus célèbre que je ne le suis à l'heure actuelle, voyez-vous. \n@c0@"
  it: "@aSimon@bOssia quello relativo alla mia ascesa alla gloria eterna e immortale!\nEhm, Maestà, secondo lei sto esagerando...?\n@c0@"
  ja: "@a@bピピン「なんてったって\n\tボクは　これから　もっともっと\n\t大人物になる予定ですから！\n@c0@"
74:
  de: "@aBianca@bDie Tinte aus dem Tintenhorn und eine Feenfeder... Hört sich an wie die perfekte Kombination. Genau wie du und ich, was?\n@c0@"
  en: "@aBianca@bThe ink of an eyevory tusk-tusk and a faerie quill... Sounds like the perfect combination. Just like you and me, eh?\n@c0@"
  es: "@aBianca@bTinta de tantor y una pluma de hada...\nParece una combinación perfecta. Igual que tú y yo, ¿verdad?\n@c0@"
  fr: "@aBianca@bDe l'encre de stigmammouth et une plume féerique...\r\nLa combinaison parfaite. Un peu comme nous deux.\n@c0@"
  it: "@aBianca@bL'inchiostro di Chiostrofante e una penna fatata...\nUna coppia perfetta, direi.\nProprio come noi due, amore!\n@c0@"
  ja: "@a@bビアンカ「きっと　パオームのインクと\n\t妖精の羽ペンって　相性がいいのね。\n\t私と　%a000090みたいに。　うふふ。\n@c0@"
75:
  de: "@a%0%a001240@bDas muss aber schlimm sein, mit solch einer Tinte zu schreiben.\n@c0@"
  en: "@a%0%a001240@bI can't think of anything worse than ink like that.\n@c0@"
  es: "@a%0%a001240@bEsa tinta que cuenta es de lo peor.\n@c0@"
  fr: "@a%0%a001240@bUne encre comme ça, c'est un vrai cauchemarⓠ\n@c0@"
  it: "@a%0%a001240@bL'inchiostro di Chiostrofante è un'invenzione terribile!\n@c0@"
  ja: "@a@b%a001240「ボクは　そんなペンも\n\tインクも　いらないからね！\n@c0@"
76:
  de: "@a%0%a001240@bJa, was ist, wenn man sich verschreibt?\nDas kann man dann ja nie wieder löschen!\n@c0@"
  en: "@a%0%a001240@bWhat if you made a mistake?\nYou'd never be able to erase it!\n@c0@"
  es: "@a%0%a001240@b¿Y si te equivocas?\n¡No hay forma de borrarla!\n@c0@"
  fr: "@a%0%a001240@bSi on fait une faute, impossible de l'effacerⓠ\n@c0@"
  it: "@a%0%a001240@bSe si commettesse un errore, non sarebbe possibile cancellarlo! Resterebbe in eterno! No, preferisco l'inchiostro normale, oppure una matita!\n@c0@"
  ja: "@a@b%a001240「まちがえても\n\tずーっと　消えないんでしょ？\n\tうわ～　イヤだ。\n@c0@"
77:
  de: "@a%0%a001250@bIch wünschte, ich hätte eine Feenfeder...\n@c0@"
  en: "@a%0%a001250@bI wish I had a faerie quill...\n@c0@"
  es: "@a%0%a001250@bCómo me gustaría tener una pluma de hada...\n@c0@"
  fr: "@a%0%a001250@bJ'aimerais bien avoir une plume féerique...\n@c0@"
  it: "@a%0%a001250@bQuanto mi piacerebbe avere una penna fatata!\n@c0@"
  ja: "@a@b%a001250「妖精の羽ペン　わたしも\n\tほしいな……。\n@c0@"
78:
  de: "@a%0%a001240@bSogar hier wünscht man sich nichts sehnlicher als den Frieden. Wir müssen unsere Mission erfüllen, Papa!\n@c0@"
  en: "@a%0%a001240@bThe world being at peace or not even has an impact here. We have to succeed, Dad!\n@c0@"
  es: "@a%0%a001240@bHasta aquí importa si hay paz en el mundo. ¡Tenemos que conseguirlo, papi!\n@c0@"
  fr: "@a%0%a001240@bLa situation du monde des humains semble aussi avoir des conséquences ici. Il faut qu'on y arrive, papaⓠ\n@c0@"
  it: "@a%0%a001240@bI tesori non portano la pace, è vero.\n㈡\nLa ricchezza non dà la felicità, ma gli uomini continuano a inseguirla, come se fosse la cosa più importante del mondo...\n@c0@"
  ja: "@a@b%a001240「きっと　世界の平和が\n\tここにも　えいきょうするんだね。\n\tお父さん　がんばろうね。\n@c0@"
79:
  de: "@aSancho@bWir haben Glück, no? Aber wir müssen vorsisstig mit diese Geschenke umgehen. Sonst wird die Göttin noch sehr, sehr böse...\n@c0@"
  en: "@aSancho@bWe are lucky, no? Eef we no use these\r\ngeefts carefully, the Goddess, eshe weell be\r\nvery, very angry.\n@c0@"
  es: "@aSancho@bQué suerte tenemos, ¿verdad? Pero si no usamos estos regalos con cuidado, la Diosa se enojará...\n@c0@"
  fr: "@aSancho@bOn a de la chance, noⓡ Mais si on n'utilise pas ces cadeaux comme il f-faut, la Déesse sera mucho en c-colère contre nous.\n@c0@"
  it: "@aSancho@b¡Esta sì que es una fortuna!\r\nCerchiamo de fare un bueno uso de estos regalos, chico...\n@c0@"
  ja: "@a@bサンチョ「ああ言ってくださるんです。\n\t大事に　使わないと\n\tバチが当たりますよ！\n@c0@"
80:
  de: "@aOtto@bDiese Feen sind sehr großzügig, findet Ihr net?\n@c0@"
  en: "@aTuppence@bFaeries are ever so generous, aren't they?\n@c0@"
  es: "@aAlazar@bQué generosas son las hadas, ¿verdad?\n@c0@"
  fr: "@aInnocent@bLes fées sont si généreuses...\n@c0@"
  it: "@aSimon@bLe fate sono creature davvero generose...\n@c0@"
  ja: "@a@bピピン「妖精って　ずいぶん\n\t気前がいいんですね。\n@c0@"
81:
  de: "@aOtto@bIch frage mich, ob sie auch so großzügig mit ihrem Herzen sind und meinen Heiratsantrag annehmen...\n@c0@"
  en: "@aTuppence@bI wonder if they'd be as generous with their hearts, and agree to be married...\n@c0@"
  es: "@aAlazar@bMe pregunto si serán igual de generosas con su corazón y querrán casarse conmigo...\n@c0@"
  fr: "@aInnocent@bJe me demande si elles donnent leur cœur et leur main aussi facilement...\n@c0@"
  it: "@aSimon@bForse hanno letto nei nostri cuori che siamo buoni e degni della loro gentilezza...\n@c0@"
  ja: "@a@bピピン「ついでに　ポーンと\n\tボクの　お嫁さんに\n\tなってくれないかなあ。\n@c0@"
82:
  de: "@a%0%a001250@bWie nett! Wenn die Göttin uns ihren Segen schenkt, kann ja nichts mehr schiefgehen!\n@c0@"
  en: "@a%0%a001250@bHow sweet! I'm sure we'll be fine with the Goddess sending us her blessings.\n@c0@"
  es: "@a%0%a001250@b¡Qué encanto! Con la bendición de la Diosa, seguro que no nos puede pasar nada malo.\n@c0@"
  fr: "@a%0%a001250@bComme c'est gentilⓠ Je suis sûre que tout ira bien\nsi la Déesse nous bénit ainsi.\n@c0@"
  it: "@a%0%a001250@bSe la dea illuminerà il nostro cammino, sono certa che arriveremo presto a destinazione!\n@c0@"
  ja: "@a@b%a001250「うん　大丈夫よ。\n\tわたしたちには　本当に　神さまが\n\tついていてくださってるから。\n@c0@"
83:
  de: "@a%0%a001240@bWarum musst du sie denn halten, Papa? Das verstehe ich nicht. Es hieß doch, das Ding sei nutzlos...\n@c0@"
  en: "@a%0%a001240@bI wonder why you have to be holding it, Dad.\nI don't get it. I thought that thing was supposed\nto be useless, anyhow.\n@c0@"
  es: "@a%0%a001240@b¿Por qué tienes que sostenerla en la mano, papi?\nNo lo entiendo. Pensaba que eso no servía para nada.\n@c0@"
  fr: "@a%0%a001240@bJe me demande pourquoi tu dois l'avoir dans les mains, papa. Je ne comprends pas. Je croyais que\nce truc ne servait à rien.\n@c0@"
  it: "@a%0%a001240@bCome mai devi stringerla tra le mani?\nCredevo fosse un oggetto del tutto inutile...\n@c0@"
  ja: "@a@b%a001240「お父さんが　持ってないと\n\tダメなの？　どうして？　あれって\n\t役に立たないんじゃなかったの？\n@c0@"
84:
  de: "@aSancho@bJetzt du bist eine wirklisse Mann, Chico. Es ist gut, dass du für die wisstigen Dinge verantwortliss bist...\n@c0@"
  en: "@aSancho@bNow you are a real man, friend. Ees right that you are responsible for the important items.\n@c0@"
  es: "@aSancho@bAhora ya eres un hombre de verdad, chamaco. Tienes que hacerte responsable de las cosas importantes.\n@c0@"
  fr: "@aSancho@bMaintenant, t-tu es oun vrai hombre, chico. C'est toi qui es r-responsable des objets importants.\n@c0@"
  it: "@aSancho@b¿Chico, no ce está bisognos que te recuerdo de aver cura de los oggettos importantes, sì?\n@c0@"
  ja: "@a@bサンチョ「やっぱり　大事な物は\n\tご自分で　持たないと……。\n\tもう　大人なんですからね。\n@c0@"
85:
  de: "@a%0%a001250@bVersuch doch mal, was sie gesagt hat, Papa. Stell dich vor das Bild.\n@c0@"
  en: "@a%0%a001250@bWhy don't you try doing what she said, Dad?\nTry standing in front of the picture.\n@c0@"
  es: "@a%0%a001250@b¿Por qué no intentas hacer lo que te ha dicho, papi?\nPonte frente al cuadro.\n@c0@"
  fr: "@a%0%a001250@bPourquoi tu n'essaies pas de faire ce qu'elle dit, papaⓡ Mets-toi devant le tableau.\n@c0@"
  it: "@a%0%a001250@bPapà, perché non provi a fare ciò che ti ha detto?\nMettiti davanti al dipinto.\n@c0@"
  ja: "@a@b%a001250「お父さん　とりあえず\n\tあの人の言うとおり\n\t絵の前に　立ってみたら？\n@c0@"
86:
  de: "@a%0%a001240@bAlles in Ordnung, Papa? Du hast dich überhaupt nicht bewegt, es war fast so, als wärst du bewusstlos! Wir haben uns wirklich Sorgen gemacht.\n@c0@"
  en: "@a%0%a001240@bAre you okay, Dad? You just wouldn't move or anything, like you were unconscious! We were\nreally worried.\n@c0@"
  es: "@a%0%a001240@b¿Estás bien, papi? ¡No te movías ni nada, como si estuvieras inconsciente! ¡Nos tenías muy preocupados!\n@c0@"
  fr: "@a%0%a001240@bÇa va, papaⓡ Tu ne bougeais plus, comme si tu étais inconscient. On a vraiment eu peur.\n@c0@"
  it: "@a%0%a001240@bPapà, stai bene?!\nCi siamo preoccupati!\nSembrava che tu fossi caduto in trance!\n@c0@"
  ja: "@a@b%a001240「お父さん　大丈夫！？\n\tずーっと　気を失ったみたいに\n\tかたまってたから　ボク心配したよ！\n@c0@"
87:
  de: "@a%0%a001240@bHey! Das ist doch nicht die vergoldete Kugel, die du von Königin Karamella bekommen hast, oder? Was geht hier vor?\n@c0@"
  en: "@a%0%a001240@bHey! That's not the gold bauble you got from Queen Caramel, is it, Dad? What's going on?\n@c0@"
  es: "@a%0%a001240@b¡Eh, no es esa la esfera dorada que te dio la reina Chocolate? ¿Qué pasa aquí?\n@c0@"
  fr: "@a%0%a001240@bHéⓠ Ce n'est pas la boule dorée que la reine Caramiel t'a donnée, pas vraiⓡ Qu'est-ce qui se passeⓡ\n@c0@"
  it: "@a%0%a001240@bEhi!\nMa quella non è la sfera dorata che hai ricevuto dalla regina Caramel! Papà, che sta succedendo?!\n@c0@"
  ja: "@a@b%a001240「あれ？　お父さん\n\tそれって　女王さまにもらったオーブと\n\tちがうよね？　どうしたの？\n@c0@"
88:
  de: "@a%0%a001240@bNein, sag nichts! Ich will es alleine herausfinden... Hm... ähm... Hmmm...\n@c0@"
  en: "@a%0%a001240@bNo, don't tell me! Let me figure it out for myself...\nUm... Er... Hmmm...\n@c0@"
  es: "@a%0%a001240@b¡Espera, no me lo digas! Deja que lo adivine yo mismo...\nMmm... Estooo... Mmm...\n@c0@"
  fr: "@a%0%a001240@bNon, me dis rienⓠ Je vais essayer de trouver tout seul... Mmm... Euh... Mmm...\n@c0@"
  it: "@a%0%a001240@bNo! Non dirmelo! Ci voglio arrivare da solo!\nUhm...\n...\n㈡\n...\n...\nNo, non mi viene in mente niente...\n@c0@"
  ja: "@a@b%a001240「あっ　言わないで！\n\tボク　自分で考えるから…\n\tえ～と　え～と……。\n@c0@"
89:
  de: "@a%0%a001250@bEs ist schön, dass du wieder da bist, Papa.\nSchon in Ordnung. Du brauchst nichts zu erklären.\n@c0@"
  en: "@a%0%a001250@bIt's good to have you back, Dad. It's okay.\nYou don't have to explain a thing.\n@c0@"
  es: "@a%0%a001250@bMe alegro de que hayas vuelto, papá. Está bien, no pasa nada.\nNo hace falta que expliques nada.\n@c0@"
  fr: "@a%0%a001250@bJe suis contente que tu sois revenu, papa.\nNe t'inquiète pas. Tu n'as rien à expliquer.\n@c0@"
  it: "@a%0%a001250@bBentornato, papà!\nNon preoccuparti, non ci devi nessuna spiegazione.\nL'importante è che tu sia di nuovo qui!\n@c0@"
  ja: "@a@b%a001250「……おかえりなさい。\n\tいいの　なにも言わなくて。\n@c0@"
90:
  de: "@aSancho@bAlles in Ordnung? Wir haben jetzt keine Zeit für eine Siesta, weißt du.\n@c0@"
  en: "@aSancho@bAre you okay? Ees, ees no time for a siesta now, you know.\n@c0@"
  es: "@aSancho@b¿Estás bien, chamaco? Este no es momento de dormir la siesta...\n@c0@"
  fr: "@aSancho@bT-Tout va bienⓡ Ce n'est pas le moment de faire la siesta, tu sais.\n@c0@"
  it: "@aSancho@bEhi, chico...\n¿Como estai?\n¿Todo bien?\n@c0@"
  ja: "@a@bサンチョ「どうしたんです？\n\tぼんやりして。\n\tまだ寝る時間には　早いですよ。\n@c0@"
91:
  de: "@aOtto@bIst alles in Ordnung mit Euch, %a000090? Ich wollte schon nach einem Doktor rufen...\n@c0@"
  en: "@aTuppence@bAre you alright, %a000090? I was just about to send for a doctor, you know.\n@c0@"
