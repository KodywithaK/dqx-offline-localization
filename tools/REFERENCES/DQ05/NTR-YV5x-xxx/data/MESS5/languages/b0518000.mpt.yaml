  ja: "@a@bデボラ「この戦士　また迷っているのね。\n\t私には　関係ないから\n\tどうでもいいけど。\n@c0@"
537:
  de: "@aGriselda@bIch würde dich nie auf dem Boden schlafen lassen, %a000090. Du musst doch eigentlich froh sein, dass ich nicht so streng mit dir bin.\n@c0@"
