  it: "@aNera@bLo sappiamo, lo sappiamo.\nÈ stato proprio lui a darci la possibilità di usare ⓕTeletrasportoⓖ.\n@c0@"
  ja: "@a@bフローラ「ルーラを　復活させて\n\tくださったのは　助かりましたわよね。\n@c0@"
82:
  de: "@aNera@bEs wäre so schön, wenn er noch ein paar Zauber wiederentdecken würde, aber für die Stadtbewohner scheint das doch sehr lästig zu sein.\n@c0@"
  en: "@aNera@bIt would be lovely if he could keep working on some new spells, but it does seem a terrible inconvenience for the townspeople.\n@c0@"
  es: "@aNera@bSería espléndido que pudiera seguir trabajando con nuevos conjuros, pero parece que a sus paisanos no les cae muy bene.\n@c0@"
