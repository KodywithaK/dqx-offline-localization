  ja: "@a@bデボラ「伝説の勇者が　現れるまで\n\tただ　待っているだけって　おかしくない？\n@c0@"
526:
  de: "@aGriselda@bDas Mindeste, was sie tun können, ist, sich zusammenzutun und nach ihm zu suchen. Das würde auf jeden Fall uns die Arbeit erleichtern.\n@c0@"
  en: "@aDebora@bThe least they could do is all club together and\r\ngo looking for him. That'd make our task easier,\r\nat any rate.\n@c0@"
  es: "@aStefania@bAl menos, podían reunirse y buscarlo. A nosotros nos vendría bene, seguro.\n@c0@"
  fr: "@aPandora@bLe moins qu'ils pourraient faire, c'est de se rassembler et de partir tous ensemble à sa recherche. Ça nous simplifierait un peu la tâche.\n@c0@"
  it: "@aViola@bLa gente dovrebbe organizzarsi in gruppi e partire alla sua ricerca, proprio come abbiamo fatto noi!\n㈡\nAnzi, potrebbero darci il cambio: gli altri cercherebbero l'Eroe Leggendario, e noi ce ne staremmo in panciolle ad attendere che lo trovino...\n@c0@"
  ja: "@a@bデボラ「せめて　みんなで　勇者を\n\t探すくらいのことは　してもいいと思うわ。\n\tそうすれば　私たちも楽だし。\n@c0@"
527:
  de: "@aGriselda@bSchon traurig, dass die Leute etwas trinken wollen, das so übel sein soll, dass es die Monster abschreckt.\n@c0@"
  en: "@aDebora@bIt's sad that people want to drink something that's supposed to be so evil it frightens monsters away.\n@c0@"
  es: "@aStefania@bEs triste que la gente quiera beber algo apertamente tan maligno que asusta a los mostri.\n@c0@"
  fr: "@aPandora@bC'est triste que les gens aient envie de boire quelque chose d'apparemment tellement mauvais que ça fait fuir les monstres.\n@c0@"
  it: "@aViola@bChi potrebbe mai voler bere una roba tanto cattiva da allontanare i mostri?!\nE soprattutto, che sapore avrà?!\n@c0@"
  ja: "@a@bデボラ「魔物さえも　にげだす……\n\tと　言われると　ほしくなるのが\n\t人間の悲しい性よね。\n@c0@"
528:
  de: "@aGriselda@bAber das musst du selbst wissen ⓚⓛ ich mische mich da nicht ein.\n@c0@"
  en: "@aDebora@bOf course, it's up to you if you want to try it.\n@c0@"
  es: "@aStefania@bVa bene, tú verás si quieres probarlo.\n@c0@"
  fr: "@aPandora@bEnfin, si tu veux y goûter, libre à toi.\n@c0@"
  it: "@aViola@bVorrei tanto scoprirlo, ma non ho alcuna intenzione di assaggiare quell'intruglio. Qui serve un'idea...\nEhi! Ci sono! Caro, sarai il mio assaggiatore ufficiale!\n㈡\nSe la Delizia di Milleventi fosse buona, me la passerai, mentre se avesse un gusto orribile la berrai tu fino all'ultima goccia. Che te ne pare, eh?\n@c0@"
  ja: "@a@bデボラ「もちろん　お酒を飲む権利は\n\tあんたに　あげるわ。\n@c0@"
529:
  de: "@aGriselda@bSchade. Ich hatte mich schon auf dein Gesicht gefreut, wenn er eklig geschmeckt hätte, aber eigentlich schmeckt er ganz gut.\n@c0@"
  en: "@aDebora@bThat's a shame. I was looking forward to\r\nseeing your face if it tasted foul, but it's\r\nactually quite nice.\n@c0@"
  es: "@aStefania@bQué pena. Esperaba verte la cara si sabía mal, pero está bastante buono.\n@c0@"
  fr: "@aPandora@bDommage. J'avais hâte de voir ta tête si ça avait eu un sale goût, mais c'est vraiment bon, en fait.\n@c0@"
  it: "@aViola@bAvrei voluto vedere la tua espressione se il gusto fosse stato pessimo, invece ha proprio un buon sapore! Peccato...\n@c0@"
  ja: "@a@bデボラ「残念……。　マズイお酒を\n\t飲ませてあげようと　思ってたけど\n\tおいしいのよね　このお酒。\n@c0@"
530:
  de: "@aGriselda@bDiese ganze Zauberforschung ist ja schön und gut, aber wenn er sich dabei totschuftet, ist keinem damit geholfen.\n@c0@"
  en: "@aDebora@bThis spell research is all well and good, but it won't be any use to anyone if he kills himself in the process.\n@c0@"
  es: "@aStefania@bEstá bene todo esto de investigar conjuros, ma de nada vale si se mata en el processo.\n@c0@"
  fr: "@aPandora@bC'est bien joli, toutes ces recherches sur les sorts, mais ça ne servira à personne s'il se tue à la tâche.\n@c0@"
  it: "@aViola@bMille anni?!\nPensa davvero di campare tanto a lungo?\n@c0@"
  ja: "@a@bデボラ「呪文の研究も　いいけれど\n\tムリをして　本当に死んでしまったりしたら\n\tどうするつもりなのかしら。\n@c0@"
531:
  de: "@aGriselda@bJetzt verstehe ich, warum sie daraus ein Geheimnis machen. Du solltest besser gut darauf aufpassen, %a000090.\n@c0@"
  en: "@aDebora@bI can see why they try to keep it under wraps now. You'd better take good care of it, %a000090.\n@c0@"
  es: "@aStefania@bEntiendo que quieran tenerlo entre algodones. Ya puedes cuidarlo bene, %a000090.\n@c0@"
  fr: "@aPandora@bJe comprends mieux pourquoi il essaie de garder ça secret, maintenant. Tu as intérêt à en prendre bien soin, %a000090.\n@c0@"
  it: "@aViola@bEcco spiegato come mai la gente del luogo parla male della Delizia di Milleventi... Mi raccomando, %a000090: abbi cura di quel nettare.\n@c0@"
  ja: "@a@bデボラ「なるほどね。　そういう理由なら\n\tかくしておきたくなるのも　わかるわ。\n\t%a000090　それ　大事に持っておいてね。\n@c0@"
532:
  de: "@aGriselda@bIch glaube, er ist vielleicht einsam. Er strahlte auf einmal so, als er dich sah.\n@c0@"
  en: "@aDebora@bI think he might be lonely, you know.\nHis face lit up when he saw you.\n@c0@"
  es: "@aStefania@bCredo que podría sentirse solo.\nSe le iluminó la cara cuando te vio.\n@c0@"
  fr: "@aPandora@bJe crois qu'il se sent un peu seul, tu sais.\r\nSon visage s'est illuminé quand il t'a vu.\n@c0@"
  it: "@aViola@bSai, caro?\nCredo che tu stia simpatico al Professor Pitagora.\nAppena ti ha visto, il volto gli si è illuminato.\n@c0@"
  ja: "@a@bデボラ「本当は　１人で\n\t寂しいんじゃない？　このおじいさん。\n\tあんたの顔をみた時　うれしそうだったわ。\n@c0@"
533:
  de: "@aGriselda@bMan sagt ja, dass Katzen anfangen zu sprechen, wenn sie alt werden, und es stimmt! Ich finde das gruselig.\n@c0@"
