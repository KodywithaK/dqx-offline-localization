  ja: "@a@bビアンカ「汚いなあ　もお。\n\tツバを飛ばしながら　怒鳴るなんて\n\t貴婦人のすることじゃないわね。\n@c0@"
76:
  de: "@aNera@bWenn sie immer so wütend schaut, wird ihr Gesicht irgendwann aussehen wie eine geohrfeigte Kehrseite!\n@c0@"
