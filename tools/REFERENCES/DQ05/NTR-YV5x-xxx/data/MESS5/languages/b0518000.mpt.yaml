  ja: "@a@bデボラ「ルーラを復活させるのに　必要だった\n\t材料って　もうとっくに　届けたのよね？\n\tこの男　いつの話をしているのかしら。\n@c0@"
544:
  de: "@aGriselda@bWenn er bis in den Himmel ragt, dann muss er ganz schön hoch sein.\n@c0@"
  en: "@aDebora@bIf it goes right up to the heavens, it must be\r\npretty tall.\n@c0@"
  es: "@aStefania@bSi llega hasta el cielo debe de ser molto alta.\n@c0@"
  fr: "@aPandora@bSi elle monte vraiment jusqu'aux cieux, elle doit être sacrément haute.\n@c0@"
  it: "@aViola@bDev'essere una torre incredibilmente alta. Arrivare fino in cima dev'essere una faticaccia mostruosa che io, ovviamente, non mi sognerei mai di fare.\n㈡\nHo deciso: non salirò mai su quella torre.\n@c0@"
  ja: "@a@bデボラ「天空へ通じる　っていうくらいだから\n\t相当に　高い塔なんでしょうね。\n@c0@"
545:
  de: "@aGriselda@bDa klettere ich nicht hoch. Wenn du bis nach ganz oben willst, wirst du mich schon tragen müssen.\n@c0@"
  en: "@aDebora@bYou won't catch me climbing it. If you're determined to go to the top, you'll have to carry me.\n@c0@"
  es: "@aStefania@bA mí no me verán subiéndola. Si quieres ir hasta la última planta tendrás que llevarme en brazos, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu ne m'y verras pas grimper en tout cas.\r\nSi tu veux vraiment aller jusqu'au sommet,\r\nil faudra que tu m'y portes.\n@c0@"
  it: "@aViola@bA meno che tu non mi carichi in spalla e mi porti in vetta...\n@c0@"
  ja: "@a@bデボラ「私　そんな塔に　のぼりたくないわ。\n\tどうしても　のぼりたいなら\n\t私を　抱きかかえて　のぼりなさいね。\n@c0@"
546:
  de: "@aGriselda@bDa ist was dran. Wenn es den legendären Helden gibt, sucht er sicher auch die Zenithia-Ausrüstung. Wenn wir Glück haben, laufen wir ihm über den Weg.\n@c0@"
  en: "@aDebora@bThat's a point. If the legendary hero does exist, he's probably looking for the Zenithian Equipment too. We might bump into him if we're lucky.\n@c0@"
  es: "@aStefania@bEstá bien visto. Si el héroe legendario existe es probabile que esté buscando el Equipo de Zenithia.\r\nSi somos fortunatos nos lo encontraremos.\n@c0@"
  fr: "@aPandora@bIl a raison. Si le héros légendaire existe, il cherche probablement l'Équipement zénithien, lui aussi. On pourrait peut-être tomber sur lui, qui saitⓡ\n@c0@"
  it: "@aViola@bIn effetti, se l'Eroe Leggendario esistesse davvero, starebbe cercando anch'egli l'Equipaggiamento Zenithiano, e prima o poi potremmo incontrarlo.\n㈡\nDopotutto, il mondo non è poi tanto grande...\n@c0@"
  ja: "@a@bデボラ「確かにそうね。　勇者がいるのなら\n\t向こうも　天空の装備を探しているはず。\n\tいつか　会えるかもしれないわ。\n@c0@"
