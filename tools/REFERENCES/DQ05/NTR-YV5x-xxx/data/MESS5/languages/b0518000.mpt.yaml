81:
  de: "@aNera@bDer alte Mann hat uns sehr geholfen, indem er den Teleportationszauber wiedergefunden hat.\n@c0@"
  en: "@aNera@bThe old man certainly helped us out by getting the Zoom spell up and running again.\n@c0@"
