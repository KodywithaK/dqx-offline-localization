  it: "@aNera@bSe continua a gridare in questo modo, le tonsille le schizzeranno fuori dalla gola...\n@c0@"
  ja: "@a@bフローラ「おこってばかりいると\n\tそういう顔になってしまうそうですわ。\n\tあの方も　気をつけないと……。\n@c0@"
77:
  de: "@aBianca@bBei so einem Diener wäre ich vielleicht auch schlecht gelaunt.\n@c0@"
