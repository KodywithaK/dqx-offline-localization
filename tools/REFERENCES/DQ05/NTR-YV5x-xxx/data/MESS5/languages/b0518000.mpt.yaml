  ja: "@a@bフローラ「ここは　段差が\n\tいっぱいあって\n\t大変そうな町ですわね。\n@c0@"
59:
  de: "@aBianca@bIch habe mal von einem verrückten alten Forscher gehört, der hier leben soll.\n@c0@"
