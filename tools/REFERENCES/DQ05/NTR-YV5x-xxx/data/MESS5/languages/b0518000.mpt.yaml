  ja: "@a@bデボラ「神父が　まよってしまったら\n\tいったい　誰に\n\tみちびいてもらうのかしら？\n@c0@"
540:
  de: "@aGriselda@bDas ist wirklich nicht dein Problem. Vergiss es einfach.\n@c0@"
