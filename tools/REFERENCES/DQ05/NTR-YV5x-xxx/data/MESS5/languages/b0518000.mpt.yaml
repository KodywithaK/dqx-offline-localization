  ja: "@a@bデボラ「それでも　行ってみたいって言うなら\n\t私は別に　止めはしないけど。\n@c0@"
543:
  de: "@aGriselda@bDu hast ihm doch die Zutat schon gebracht, die er für den Teleportationszauber brauchte? Der Kerl ist mit seinem Tratsch wirklich nicht auf dem Laufenden.\n@c0@"
