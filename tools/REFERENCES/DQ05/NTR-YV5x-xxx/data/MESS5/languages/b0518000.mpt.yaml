  es: "@aNera@b¿Crees que pasa algo raro?\n@c0@"
  fr: "@aNera@bTu ne trouves pas qu'il se passe quelque chose\nd'un peu bizarreⓡ\n@c0@"
  it: "@aNera@bTu ci capisci niente?\nIo no.\n@c0@"
  ja: "@a@bフローラ「なにか　やましいことでも\n\tあるんでしょうか……。\n@c0@"
80:
  de: "@aBianca@bAuch wenn es manchen Stadtbewohnern lästig sein mag, scheint der alte Mann doch ein gutes Werk zu tun.\n@c0@"
  en: "@aBianca@bIt seems to be a bit of a bother for some of the townsfolk, but it sounds like the old man's doin'\r\nsome good work.\n@c0@"
