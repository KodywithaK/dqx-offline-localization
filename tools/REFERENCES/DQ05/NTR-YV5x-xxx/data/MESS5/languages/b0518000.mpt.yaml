  es: "@aStefania@bEs culpa suya por no elegir sabiamente a il su ocompañero de viaggio. Yo no cometería ese errore.\n@c0@"
  fr: "@aPandora@bC'est de sa faute à elle si elle n'a pas su choisir son compagnon de voyage. Je n'aurais jamais fait une erreur pareille.\n@c0@"
  it: "@aViola@bDovrebbe prendersela solo con sé stessa, per aver scelto il compagno di viaggio sbagliato! Io non avrei mai commesso un errore così madornale.\n@c0@"
  ja: "@a@bデボラ「お供にする人間えらびを　\n\tまちがえたのは　自分のミスでしょうに。\n\t私は　そんな失敗しなかったわよ。\n@c0@"
539:
  de: "@aGriselda@bWenn der Priester auf den falschen Weg geraten ist, an wen sollen sich dann die Leute wenden, die nach Rat suchen?\n@c0@"
