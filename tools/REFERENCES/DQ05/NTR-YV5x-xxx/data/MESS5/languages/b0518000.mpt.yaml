362:
  de: "@aGriselda@bWenn du unseren Kindern das antust, was dieses Mädchen ertragen musste, werde ich dir das nie verzeihen, %a000090. Hast du mich verstanden?\n@c0@"
  en: "@aDebora@bPut our kids through what this girl's been through, and I'll never forgive you, %a000090. Got it?\n@c0@"
  es: "@aStefania@bHaz pasar a nuestros hijos por lo que ha pasado esa ragazza y sabrás lo que es bueno, %a000090. ¿Capisci?\n@c0@"
  fr: "@aPandora@bSi tu fais subir une seule fois à nos enfants ce que cette fillette a enduré, je ne te le pardonnerai jamais, %a000090. Comprisⓡ\n@c0@"
  it: "@aViola@bMi piacerebbe sapere cosa sta sognando questa piccina...\n@c0@"
  ja: "@a@bデボラ「いい？　%a000090。\n\t私たちの子供に　この子みたいな思いを\n\tさせたりしたら　許さないわよ。\n@c0@"
363:
  de: "@aGriselda@bFrüher war ich mit Papa und Nera oft hier, aber Papa hat uns nie irgendwo mitspielen lassen.\n@c0@"
  en: "@aDebora@bI've been here lots of times in the past with Papa and Nera, but Papa would never let us go on anything.\n@c0@"
  es: "@aStefania@bHe estado muchas veces aquí con il mio papino y Nera, ma nunca nos dejaba hacer nada.\n@c0@"
  fr: "@aPandora@bJe suis venue très souvent ici avec papa et Nera, autrefois, mais papa ne nous laissait jamais toucher à rien.\n@c0@"
  it: "@aViola@bIn passato sono venuta qui spesso con Nera e con il mio paparino.\n@c0@"
  ja: "@a@bデボラ「ここのカジノには　何度か　パパや\n\tフローラといっしょに　来たことがあるわ。\n\t私は　遊ばせてもらえなかったけど。\n@c0@"
364:
  de: "@aGriselda@bAber dieses Mal hole ich alles nach! Schließlich habe ich dich als meinen wandelnden Geldbeutel dabei, %a000090!\n@c0@"
  en: "@aDebora@bI'm going to really go for it this time, though!\nI've got you, my walking wallet, with me after all, %a000090!\n@c0@"
  es: "@aStefania@b¡Pero questa volta voy en serio!\n¡Te tengo a te, mi banco ambulante, %a000090!\n@c0@"
  fr: "@aPandora@bMais cette fois, je vais vraiment me lâcherⓠ\nAprès tout, je t'ai toi, mon porte-monnaie ambulant,\nà mes côtés, %a000090ⓠ\n@c0@"
  it: "@aViola@bQuesta volta, però, è un'esperienza diversa! Sono con il mio maritino, che soddisferà ogni mio capriccio e farà tutto ciò che gli chiederò! Non è vero, caro?\n@c0@"
  ja: "@a@bデボラ「でも　今回は　\n\t思うぞんぶん　楽しませてもらうわ。\n\t%a000090っていう　サイフがいるし。\n@c0@"
365:
  de: "@aGriselda@bJetzt herrscht hier jede Menge Leben, aber früher war es anscheinend fast so etwas wie eine Geisterstadt.\n@c0@"
  en: "@aDebora@bThe place is bustling now, but apparently it used to be a bit of a ghost town.\n@c0@"
  es: "@aStefania@bAhora esto está lleno, pero al parecer era una città fantasma.\n@c0@"
  fr: "@aPandora@bCet endroit est très animé, aujourd'hui, mais apparemment, c'était un peu une ville fantôme avant.\n@c0@"
  it: "@aViola@bOggi questo è un posto vivace, movimentato...\nUn tempo, però, era un villaggio fin troppo noioso.\n@c0@"
  ja: "@a@bデボラ「今でこそ　にぎやかだけど\n\tここの町って　ずっと昔は\n\tさびれた　村だったって話よ。\n@c0@"
366:
  de: "@aGriselda@bWenn sich eine Geisterstadt in so ein geschäftiges Örtchen verwandeln kann, dann besteht wohl auch für dich noch Hoffnung.\n@c0@"
  en: "@aDebora@bIf a ghost town can transform itself into such a thriving city, then I suppose that means there's hope for you yet.\n@c0@"
  es: "@aStefania@bSi una città fantasma puede convertirse en un sitio así, aún hay esperanzas per te.\n@c0@"
  fr: "@aPandora@bSi une ville fantôme peut se transformer en une cité aussi prospère, ça veut dire qu'il y a sûrement encore de l'espoir pour toi.\n@c0@"
  it: "@aViola@bSe un paesino da quattro soldi può trasformarsi in una città piena di vita, allora anche un pappamolle può diventare un vero duro!\n㈡\nSu con la vita!\nC'è speranza anche per te!\n@c0@"
  ja: "@a@bデボラ「村だって　なにかのきっかけで\n\tこんなふうに　華やかになるんだから\n\tあんたもいつかは　立派になれるわよ。\n@c0@"
367:
  de: "@aGriselda@bEigentlich habe ich's gar nicht auf Geld abgesehen. Ich bin doch schon reich.\n@c0@"
  en: "@aDebora@bI don't really want to make any money.\r\nI'm already rich.\n@c0@"
  es: "@aStefania@bEn realità no quiero ganar dinero.\r\nYa soy rica.\n@c0@"
  fr: "@aPandora@bJe ne tiens pas spécialement à gagner de l'argent.\r\nJe suis déjà riche.\n@c0@"
  it: "@aViola@bNon m'interessa vincere al gioco, però mi piace l'atmosfera che si respira qui dentro...\n@c0@"
  ja: "@a@bデボラ「私は別に\n\tお金をかせぎたいとは　思わないわ。\n\tだって　もともと　金持ちだから。\n@c0@"
368:
  de: "@aGriselda@bUnd wenn ich Geld gewinnen wollte, würde ich das lieber dir überlassen, %a000090.\n@c0@"
  en: "@aDebora@bEven if I did want to make money, I'd leave that up to you, %a000090.\n@c0@"
  es: "@aStefania@bY aunque quisiera dinero, te encargaría de eso a ti, %a000090.\n@c0@"
  fr: "@aPandora@bEt puis même si j'avais envie d'en gagner, je te laisserais t'en charger, %a000090.\n@c0@"
  it: "@aViola@bInoltre, anche se giocassi e perdessi, la cosa non mi disturberebbe affatto. Dopotutto, perderei i gettoni che tu hai comprato con i tuoi soldi, %a000090.\n@c0@"
  ja: "@a@bデボラ「もし　かせぎたくなっても\n\tそれは　%a000090の役目だし。\n@c0@"
369:
  de: "@aGriselda@bWenn die Leute schon solche Gerüchte verbreiten, dann sollten sie wenigstens denen Anerkennung zollen, die sie verdient haben.\n@c0@"
  en: "@aDebora@bIf people are going to spread rumours like that, you'd think they'd at least give credit where it's due.\n@c0@"
  es: "@aStefania@bSi la gente va a extender rumores, veramente podrían dar crédito a quien corresponde.\n@c0@"
  fr: "@aPandora@bSi les gens sont prêts à faire circuler des rumeurs comme ça, ils pourraient au moins rendre à César\r\nce qui appartient à César.\n@c0@"
  it: "@aViola@bTutto qui?\nNon sa dire nulla di più preciso?\n@c0@"
  ja: "@a@bデボラ「ウワサを流すのなら\n\t平和にした人間の　名前も\n\tちゃんと　広めるべきよ。\n@c0@"
370:
  de: "@aGriselda@bEr sieht einigermaßen intelligent aus, da sollte man doch erwarten können, dass er keine Lügen verbreitet. Männer...! \n@c0@"
  en: "@aDebora@bHe looks intelligent enough, so you'd think he'd try and get his facts straight. You men are all useless!\n@c0@"
  es: "@aStefania@bSembra inteligente, así que podría intentar enterarse bien de las cosas. ¡Los hombres son inútiles!\n@c0@"
  fr: "@aPandora@bIl a l'air plutôt intelligent, pourtant. On pourrait croire qu'il essaierait de se renseigner, avant\nde parler.\n㈡\nVous les hommes, vous n'êtes vraiment tous\nque des bons à rienⓠ\n@c0@"
  it: "@aViola@bNo, non ci siamo.\nNon ci siamo affatto.\nLa gente vuole dettagli, informazioni accurate!\n@c0@"
  ja: "@a@bデボラ「詩人なんだから\n\tそのくらい　調べてから話をしなさいよね。\n\tまったく…　使えない男だわ。\n@c0@"
371:
  de: "@aGriselda@bAls ich klein war, habe ich davon geträumt, eine ganze Armee von Dienern zu haben, die mir jeden Wunsch von den Augen ablesen würden.\n@c0@"
  en: "@aDebora@bMy dream when I was young was to have a\r\nwhole army of servants to attend to my every\r\nwhim and wish.\n@c0@"
  es: "@aStefania@bMi sueño de ragazza era tener un ejército de sirvientes para atender cada uno de mis deseos.\n@c0@"
  fr: "@aPandora@bQuand j'étais jeune, mon rêve était de disposer de toute une armée de domestiques prêts à satisfaire mes moindres désirs en un clin d'œil.\n@c0@"
  it: "@aViola@bIl mio sogno da bambina era di avere un esercito di servitori pronti a esaudire qualsiasi mio desiderio.\n㈡\nTu non sei propriamente un ⓕesercitoⓖ, ma va bene anche così.\nCiò che conta è che tu esegua ogni mio ordine, caro...\n@c0@"
  ja: "@a@bデボラ「私の　子供の頃からの夢は\n\t大勢のしもべを　はべらせて\n\tいい暮らしを　させてもらうことだったわ。\n@c0@"
372:
  de: "@aGriselda@bIch würde nicht nörgeln, wenn du abends um die Häuser ziehen willst. \nIch würde einfach mitkommen!\n@c0@"
  en: "@aDebora@bI wouldn't complain if you wanted to go gadding about at night. I'd just come along with you.\n@c0@"
  es: "@aStefania@bYo no me quejaría si quisieras irte por ahí de notte. Iría con te.\n@c0@"
  fr: "@aPandora@bSi tu avais envie de traîner la nuit, je ne me plaindrais pas. Je viendrais avec toi et c'est tout.\n@c0@"
  it: "@aViola@bRicorda che per te vige il coprifuoco, caro il mio %a000090. Non ti è permesso uscire dopo il tramonto, se non insieme a me.\n@c0@"
  ja: "@a@bデボラ「私は別に　あんたが夜に出歩いても\n\tうるさく言ったりは　しないわ。\n\tだまって　いっしょに　ついていくだけよ。\n@c0@"
373:
  de: "@aGriselda@bSelbst wenn du ⓞmein Herrⓟ bist, bin ich noch lange nicht ⓞmeine Dameⓟ! Ich bin ⓞSignorinaⓟ, und das bleibe ich auch!\n@c0@"
  en: "@aDebora@bEven if you're ⓗmisterⓘ, I'm definitely not ⓗmissusⓘ.\nI'm ⓗSignorinaⓘ, and I always will be!\n@c0@"
  es: "@aStefania@bEvidentemente, te a tratado a ti de usted. Yo soy troppo joven para eso.\n@c0@"
  fr: "@aPandora@bMême si tu es un ⓥmonsieurⓦ, je ne suis certainement pas une ⓥmadameⓦ. Je suis une ⓥsignorinaⓦ, un point c'est toutⓠ\n@c0@"
  it: "@aViola@bⓕSignoreⓖ tu?! Uhm, tecnicamente la cosa è corretta... Ma io sono troppo giovane per essere chiamata ⓕsignoraⓖ! Chiaro?!\n@c0@"
  ja: "@a@bデボラ「%a000090が　おじさんでも\n\t私は　お姉さまよ。\n\tそう　お姉さま。　お姉さまなの！\n@c0@"
374:
  de: "@aGriselda@bWenn er es wagt, mich ⓞmeine Dameⓟ zu nennen, dann kriegt er von mir was zu hören! Ich weiß, er ist noch klein, aber das ist keine Entschuldigung!\n@c0@"
  en: "@aDebora@bIf he dares call me ⓗmissusⓘ, I'll grab him by the scruff of the neck! I know he's young, but that's\nno excuse.\n@c0@"
  es: "@aStefania@b¡Si se atreve a tratarme de usted le retuerzo el colletto! Es un ragazzo, pero eso no es excusa.\n@c0@"
  fr: "@aPandora@bS'il ose m'appeler ⓥmadameⓦ, je vais l'attraper\npar la peau du couⓠ Je sais qu'il est jeune,\nmais ça n'est pas une excuse.\n@c0@"
  it: "@aViola@bNon m'importa se è solo un ragazzino: se si azzarda a chiamarmi ⓕsignoraⓖ lo prendo per la collottola e lo sbatacchio come un tappeto!\n@c0@"
  ja: "@a@bデボラ「いくら子供でも\n\tこの私を　おばさんだなんて　言ったら\n\t絶対に　許さないんだから。\n@c0@"
375:
  de: "@aGriselda@bOh ja. Papa wollte auch mal so eine haben. Offenbar ist er nicht der Einzige, der eine Schwäche für seltsame und wunderbare Dinge hat.\n@c0@"
  en: "@aDebora@bOh yes. Papa wanted one of those once. Looks like he's not the only one with a penchant for the weird and the wonderful.\n@c0@"
  es: "@aStefania@b¡Oh!, sí. Il mio papino quería uno. Sembra que no es el único con un gusto por lo extraño e meraviglioso.\n@c0@"
  fr: "@aPandora@bAh oui. Papa en voulait une, autrefois. On dirait\r\nqu'il n'est pas le seul a avoir un penchant pour\r\ntout ce qui est étrange et merveilleux.\n@c0@"
  it: "@aViola@bIl mio paparino avrebbe pagato un patrimonio per una cintura degli Slime, ma non gli è mai riuscito di procurarsene una...\n@c0@"
  ja: "@a@bデボラ「そういえば　昔　パパも\n\tあの　のれんを　欲しがっていたわ。\n\t……パパ以外にも　物好きがいるのね。\n@c0@"
376:
  de: "@aGriselda@bJa, Papa wollte vor langer Zeit auch so was haben.\n@c0@"
  en: "@aDebora@bYes, Papa wanted one of those a long time ago.\n@c0@"
  es: "@aStefania@bSí. Hace tiempo, il mio papino quería uno.\n@c0@"
  fr: "@aPandora@bOui. Papa en voulait une, il y a longtemps.\n@c0@"
  it: "@aViola@bMi chiedo cos'abbia di tanto strano questa Bottega Rari & Antichi...\n@c0@"
  ja: "@a@bデボラ「そういえば　昔　パパも\n\tあの　のれんを　欲しがっていたわ。\n@c0@"
377:
  de: "@aGriselda@bEr hat schon immer gern seltsame Dinge gesammelt.\n@c0@"
  en: "@aDebora@bHe's always been keen on collecting strange things.\n@c0@"
  es: "@aStefania@bSempre le gustaron las cosas extrañas.\n@c0@"
  fr: "@aPandora@bIl a toujours aimé collectionner les objets bizarres.\n@c0@"
  it: "@aViola@bChe dici, caro?\nNon sarebbe il caso di farci un salto quando abbiamo un po' di tempo libero?\n@c0@"
  ja: "@a@bデボラ「パパって　昔から\n\t変なものを　ほしがるクセがあるのよね。\n@c0@"
378:
  de: "@aGriselda@bAchte gut auf den Schild, %a000090. Man kann nicht vorsichtig genug sein.\n@c0@"
  en: "@aDebora@bMake sure you look after that shield, %a000090. You can't be too careful.\n@c0@"
  es: "@aStefania@bTú cuida de ese escudo, %a000090. Sirviente precavido vale por due.\n@c0@"
  fr: "@aPandora@bFais attention à bien t'occuper de ce bouclier, %a000090. On n'est jamais trop prudent.\n@c0@"
  it: "@aViola@bMi raccomando, %a000090: abbi cura di quello scudo.\nSai bene quanto è importante...\n@c0@"
  ja: "@a@bデボラ「……%a000090。\n\tあの盾　しっかりしまっておきなさいよ。\n\t用心をするに　こしたことはないわ。\n@c0@"
379:
  de: "@aGriselda@bDamit du's weißt, %a000090... Wenn du dich so aufführen würdest, würde ich dir das nie verzeihen.\n@c0@"
  en: "@aDebora@bJust so you know, %a000090...\nI'd never forgive you if you behaved like that.\n@c0@"
  es: "@aStefania@bPara que lo sepas, %a000090:\nyo nunca te perdonaría un comportamento así.\n@c0@"
  fr: "@aPandora@bJuste pour que tu sois au courant, %a000090...\nJe ne te le pardonnerais jamais si un jour tu te comportais comme ça.\n@c0@"
  it: "@aViola@bSe ti allontanassi da me per fare un giro al casinò senza la mia autorizzazione, ti verrei a prendere e ti riporterei a casa trascinandoti per le orecchie.\n㈡\nUomo avvisato, orecchio salvato.\n@c0@"
  ja: "@a@bデボラ「……%a000090。\n\tあんたは　あんなマネをしたら\n\t許さないわよ。\n@c0@"
380:
  de: "@aGriselda@bMan muss seinen Mann fest an die Kandare nehmen, damit er nicht aufmuckt. So wie ich.\n@c0@"
  en: "@aDebora@bYou have to keep a tight rein on your man if you want to control him properly. Just like I do with you.\n@c0@"
  es: "@aStefania@bA los hombres hay que atarlos corto para que no se te rebelen. Come hago io con te.\n@c0@"
  fr: "@aPandora@bIl faut tenir la bride bien serrée si on veut contrôler son mari correctement. Exactement ce que je fais avec toi.\n@c0@"
  it: "@aViola@bAh, quella donna ha sbagliato tutto con suo marito!\nSono certa che gli ha lasciato troppa libertà, e ora ne paga le conseguenze.\n㈡\nDovrebbe imparare da me come si tratta il proprio uomo!\n@c0@"
  ja: "@a@bデボラ「男をうまく　あやつるには\n\t女が　しっかりと　タヅナをとらないと\n\tダメなのよ。　私みたいに。\n@c0@"
381:
  de: "@aGriselda@bWarum machen sie den Laden nicht einfach tagsüber zu und öffnen nur nachts? Das wäre doch die einfachste Lösung.\n@c0@"
  en: "@aDebora@bWhy don't they just shut up shop during the day and only open up at night then? It doesn't take a genius to work that out.\n@c0@"
  es: "@aStefania@b¿Por qué no cierran de día y abren solo de notte, pues? No hace falta ser un genio para pensar en eso.\n@c0@"
  fr: "@aPandora@bDans ce cas, pourquoi ils ne ferment pas tout simplement boutique en journée pour n'ouvrir que de nuitⓡ Pas besoin d'être un génie pour penser à ça.\n@c0@"
  it: "@aViola@bAllora perché non tiene aperto il locale solo di sera? In questo modo ridurrebbe i costi di gestione e i profitti aumenterebbero! Sono un genio, lo so.\n@c0@"
  ja: "@a@bデボラ「それなら　昼間は店を閉めて\n\t夜だけ　開くようにすればいいのに。\n\t少し考えれば　わかることよね。\n@c0@"
382:
  de: "@aGriselda@bDein trautes Heim ist dort, wo ich mich gerade aufhalte. Aber das versteht sich ja von selbst.\n@c0@"
  en: "@aDebora@bYour home is wherever I happen to be.\nThat goes without saying, of course.\n@c0@"
  es: "@aStefania@bIl tuo hogar está donde yo estoy.\nNo hay ni que decirlo.\n@c0@"
  fr: "@aPandora@bIl va sans dire que ta maison, c'est là où je me trouve, évidemment..\n@c0@"
  it: "@aViola@bDa quando ho lasciato Mostroferrato non ho mai avuto nostalgia di casa, perché casa mia è accanto al mio fedele e ubbidiente maritino...\n@c0@"
  ja: "@a@bデボラ「あんたの　帰ってくるところは\n\t私のいる場所よ。\n\t言わなくても　わかっているでしょうけど。\n@c0@"
383:
  de: "@aGriselda@bTagsüber ein Nickerchen halten zu können, das ist ein echtes Statussymbol. So sehe ich auch mein Leben.\n@c0@"
  en: "@aDebora@bBeing able to nap during the day is a sign of high status. That's just how I want to live.\n@c0@"
  es: "@aStefania@bPoder dormir un sonnellino de día es una muestra de posición. Así quiero vivire yo.\n@c0@"
  fr: "@aPandora@bPouvoir faire la sieste en journée est la marque d'un statut social élevé. C'est exactement comme ça\r\nque je veux vivre.\n@c0@"
  it: "@aViola@bNon tutti hanno la fortuna di poter dormire di giorno.\nDi solito è un privilegio riservato ai ricchi...\n@c0@"
  ja: "@a@bデボラ「昼間から寝ているだなんて\n\t本当に　いいご身分だこと。\n\t私も　あやかりたいものだわ。\n@c0@"
384:
  de: "@aGriselda@bJetzt ähnelt Papa zwar mehr einem gestrandeten Wal, aber früher ist er auch auf Forschungstouren gegangen. Sagt er jedenfalls. Ich weiß ja nicht.\n@c0@"
  en: "@aDebora@bPapa may be a bit of a beached whale nowadays, but he used to be an explorer back in his day.\r\nSo he says, anyway. I can hardly believe it.\n@c0@"
  es: "@aStefania@bPapa parece una ballena varada, ma en sus tiempos exploraba mucho.\r\nO eso dice, yo no sé si creerlo.\n@c0@"
  fr: "@aPandora@bPapa ressemble un peu à une baleine échouée, aujourd'hui, mais c'était un explorateur autrefois. Enfin, c'est du moins ce qu'il raconte.\n㈡\nJ'ai un peu de mal à le croire.\n@c0@"
  it: "@aViola@bOra che è grasso quanto una balena non si direbbe, ma il mio paparino in gioventù è stato un grande avventuriero. Almeno, così dice lui...\n@c0@"
  ja: "@a@bデボラ「うちのパパも　今はあんなふうだけど\n\t若い頃は　冒険家だったらしいわ。\n\tとても　信じられないでしょうけど。\n@c0@"
385:
  de: "@aGriselda@bEs ist modrig und dunkel und beklemmend... Könntest du also bitte mal zum Ende kommen, damit wir hier wegkönnen?\n@c0@"
  en: "@aDebora@bIt's mouldy and dark and claustrophobic...\r\nCan you hurry up and finish what you're doing\r\nhere so we can leave?\n@c0@"
  es: "@aStefania@bHay humedad y está oscuro y me está entrando claustrofobia... Acaba lo que tengas que hacer y larguémonos, ¿capisci?\n@c0@"
  fr: "@aPandora@bIl fait sombre, ça sent le moisi et on étouffe, ici...\nTu ne peux pas te dépêcher de terminer ce que\ntu as à faire pour qu'on puisse partirⓡ\n@c0@"
  it: "@aViola@bQuesto posto non mi piace per niente: è buio, umido e puzza come una stalla. %0%a000090, sbrigati a fare quello che devi e andiamo via.\n@c0@"
  ja: "@a@bデボラ「カビくさい…　暗い…　せまい……。\n\tねえ　%a000090\n\t早く用をすませて　ここを出るわよ。\n@c0@"
386:
  de: "@aGriselda@bEin Häschenmädel in einer Höhle? Das ist ja fast wie ein Fisch ohne Wasser!\n@c0@"
  en: "@aDebora@bA bunny girl stuck down in a cave?\nTalk about a fish out of water!\n@c0@"
  es: "@aStefania@bMa, ¿una conejita en una cueva?\nEs como un pez fora del acqua.\n@c0@"
  fr: "@aPandora@bUne serveuse coincée dans une grotteⓡ\nC'est un peu comme un poisson hors de l'eau, nonⓡ\n@c0@"
  it: "@aViola@bMa come fa quella tipa a lavorare in un postaccio del genere?! Io non resisterei qui più di cinque minuti nemmeno se mi dessero un milione di monete d'oro!\n㈡\nBeh, magari per un milione di monete il sacrificio potrei anche farlo...\n@c0@"
  ja: "@a@bデボラ「こんなところに　バニーとか……\n\t私には　理解できない光景だわ。\n@c0@"
387:
  de: "@aGriselda@bSelbst ich würde dir nie etwas auftragen, was dich ins Gefängnis bringen würde, %a000090, also keine Sorge.\n@c0@"
  en: "@aDebora@bEven I'd never give you an order that would put you in jail, %a000090, don't worry.\n@c0@"
  es: "@aStefania@bNi siquiera yo te daría una orden que te mandara a prisión, %a000090, non ti preoccupare.\n@c0@"
  fr: "@aPandora@bNe t'inquiète pas, %a000090. Même moi je n'irais pas te donner un ordre qui t'oblige à finir en prison.\n@c0@"
  it: "@aViola@bCerca di non finire mai in galera, %a000090.\nSe ti mandassero in prigione, perderei il mio fedele e devoto servitore! Non potrei sopravvivere!\n@c0@"
  ja: "@a@bデボラ「いくら私でも　%a000090が\n\t牢屋に入らなければ　いけなくなるような\n\t命令はしないから　安心してね。\n@c0@"
388:
  de: "@aGriselda@bWenn er Leute entführt, dann hat er sich sein Elend selbst zuzuschreiben. Es ist immer schön zu sehen, wie die Gerechtigkeit am Ende siegt.\n@c0@"
  en: "@aDebora@bHe deserves what he gets if he went about kidnapping people. It's always good to see\r\npeople get their comeuppance.\n@c0@"
  es: "@aStefania@bSe merece lo que le pasa si fue secuestrando gente. Está bien ver que se fare onore a la justicia.\n@c0@"
  fr: "@aPandora@bS'il a enlevé des gens, il n'a pas volé ce qui lui arrive. C'est toujours bien de voir que les gens ont ce qu'ils méritent. \n@c0@"
  it: "@aViola@bSe quello è un rapitore di bambini, merita di marcire in cella fino alla fine dei suoi giorni, e anche oltre!\n@c0@"
  ja: "@a@bデボラ「人さらいだなんて\n\tシュミの悪いことをするから\n\tバチが当たったのね。　いい気味よ。\n@c0@"
389:
  de: "@aGriselda@bKasinos machen Spaß, aber ich würde mich davon nie zu sehr aus der Ruhe bringen lassen. Vielleicht deswegen, weil ich bereits reich bin.\n@c0@"
  en: "@aDebora@bCasinos are fun, but I'd never get that worked up about them. Maybe it's because I'm already rich.\n@c0@"
  es: "@aStefania@bLos casinos son divertenti, ma no me gustan tanto. Como ya soy rica...\n@c0@"
  fr: "@aPandora@bC'est amusant, les casinos, mais je ne me mettrais jamais dans un état pareil pour ça. C'est peut-être parce que je suis déjà riche.\n@c0@"
  it: "@aViola@bCaro, mi raccomando: non sprecare soldi al casinò.\nIl denaro che abbiamo serve per i sedici abiti nuovi che hai promesso di regalarmi...\n@c0@"
  ja: "@a@bデボラ「カジノって　楽しいけれど\n\tそれほど　熱中できるものでもないわね。\n\t私が　金持ちだから　なのかしら。\n@c0@"
390:
  de: "@aGriselda@bKasinos sollen einfach nur Spaß machen. Wenn man erst mal anfängt, über Geld nachzudenken, ist Schluss mit Lustig.\n@c0@"
  en: "@aDebora@bCasinos are just fun and games. If you start to obsess over money, that's when the fun ends.\n@c0@"
  es: "@aStefania@bLos casinos son divertimento y giocco. Si te obsesionas con el dinero, se acabó el divertimento. \n@c0@"
  fr: "@aPandora@bLes casinos, ça n'est fait que pour jouer et se divertir. Si on commence à ne plus penser qu'à l'argent, c'est la fin du plaisir.\n@c0@"
  it: "@aViola@bIo non ho mai bisogno di soldi, caro.\nQuando mi serve del denaro lo chiedo a te...\n@c0@"
  ja: "@a@bデボラ「あくまで　カジノは　遊びだものね。\n\tお金になってしまったら　もう\n\t遊びじゃなくなるわ。\n@c0@"
391:
  de: "@aGriselda@bPapa hat gesagt, es ist wichtig, ruhig zu sein, wenn man jede Menge Geld setzt, aber der Mann hatte ganz blutunterlaufene Augen.\n@c0@"
  en: "@aDebora@bPapa said it's important to be calm when you're betting lots of money, but that man's eyes were \r\nall bloodshot.\n@c0@"
  es: "@aStefania@bEl mio papino dice que hay estar calmo al apostar mucho, pero ese hombre está histérico.\n@c0@"
  fr: "@aPandora@bPapa dit que c'est important de rester calme quand on parie de grosses sommes d'argent, mais les yeux de cet homme étaient injectés de sang.\n@c0@"
  it: "@aViola@bSe quel tipo non si dà una calmata, gli verrà un colpo secco...\n@c0@"
  ja: "@a@bデボラ「大きく賭ける時は　落ち着くことが\n\tいちばん大切だって　パパが言ってたけど\n\tあの男　目が血走っていたわね。\n@c0@"
392:
  de: "@aGriselda@bIn diesem Zustand muss er ja verlieren. Aber solange ich es nicht bin, kann's mir ja egal sein.\n@c0@"
  en: "@aDebora@bHe's sure to lose if he's in that sort of state. Still, as long as it's not me losing, then why should I care?\n@c0@"
  es: "@a@bEn ese stato lo perderá tutto. Ma mientras no sea yo, ¿qué más da?\n@c0@"
  fr: "@aPandora@bS'il est dans un état pareil, il est sûr de perdre. Enfin, tant que ça n'est pas moi qui perds, je ne vois pas pourquoi je m'en soucierais.\n@c0@"
  it: "@aViola@bCerta gente non dovrebbero nemmeno farla entrare nei casinò!\n㈡\nSono i fanatici come lui che rovinano l'atmosfera di divertimento che si dovrebbe respirare qui dentro!\n@c0@"
  ja: "@a@bデボラ「あれじゃ　失敗するでしょうね……\n\tまあ　私が損をするわけじゃないから\n\tどうでもいいけど。\n@c0@"
393:
  de: "@aGriselda@bIch glaube, ich habe noch nie jemanden kennengelernt, auf den die Bezeichnung ⓞTrottelⓟ besser passt als auf den Typen. Ist doch kaum zu fassen!\n@c0@"
  en: "@aDebora@bI don't think I've ever met someone as deserving of the description ⓗbuffoonⓘ as this character.\nI can hardly believe it.\n@c0@"
  es: "@aStefania@bCreo que nunca había conocido a alguien tan merecedor de ser llamado ⓕbufónⓖ. Incredibile.\n@c0@"
  fr: "@aPandora@bJe crois n'avoir jamais rencontré personne qui\nmérite autant que ce type le qualificatif de ⓥbouffonⓦ. J'en reviens à peine.\n@c0@"
  it: "@aViola@bRoba da non credersi...\nSe fosse mio marito, io gli...\nNo, che sto dicendo?\n㈡\nNon sposerei un cretino come lui nemmeno se me l'ordinasse il mio medico di fiducia, quindi è totalmente inutile che io finisca la frase.\n@c0@"
  ja: "@a@bデボラ「バカという言葉が\n\tこんなにもふさわしい人間を　この目で\n\t見ることができるなんて。　おどろいたわ。\n@c0@"
394:
  de: "@aGriselda@bDie Vorstellung ist gar nicht so übel. Aber mir würde das Kleid natürlich viel besser stehen.\n@c0@"
  en: "@aDebora@bI suppose it's not a bad performance. The dress would obviously suit me much better, though.\n@c0@"
  es: "@aStefania@bNo es un mal espectáculo. Ma, obviamente, el vestido me quedaría mucho megliore a mí.\n@c0@"
  fr: "@aPandora@bÇa n'est pas mal, comme représentation. La robe m'irait quand même bien mieux qu'à elle, évidemment.\n@c0@"
  it: "@aViola@bLo spettacolo non è male, ma quei costumi farebbero tutto un altro effetto se li indossassi io...\n@c0@"
  ja: "@a@bデボラ「まあ…　悪くはないわね。\n\tでも　ああいうドレスは\n\t私が着たほうが　似合うと思うわ。\n@c0@"
395:
  de: "@aGriselda@bRecht hat er. Sobald man ängstlich wird, verliert man seinen Schwung. Er ist klüger, als er aussieht.\n@c0@"
  en: "@aDebora@bHe's right. If you let the fear get to you, it really puts you off your stride. He's wiser than he looks.\n@c0@"
  es: "@aStefania@b¡È vero! Si dejas que el miedo te invada, se acabó la buena racha. Es más listo de lo que parece.\n@c0@"
  fr: "@aPandora@bIl a raison. Si on commence à se laisser gagner\r\npar la peur, ça éloigne définitivement la chance.\r\nIl est plus sage qu'il n'en a l'air.\n@c0@"
  it: "@aViola@bVorrebbe una ricompensa per aver detto una cosa tanto ovvia?!\nCerta gente è proprio senza vergogna!\n@c0@"
  ja: "@a@bデボラ「そうね。　弱気になったら\n\tツキは逃げていくものだから。\n\tなかなかいいことを言うわね　この男。\n@c0@"
396:
  de: "@aGriselda@bJeder ist seines Glückes Schmied. Man braucht nur ein wenig Geduld, dann kann man das Blatt zu seinen Gunsten wenden.\n@c0@"
  en: "@aDebora@bYou make your own luck. You just need a bit of patience and courage and you can turn the tide in your favour.\n@c0@"
  es: "@aStefania@bLa suerte se busca. Solo hay que tener un po' de paciencia y las cosas pueden volverse a il tuo favore.\n@c0@"
  fr: "@aPandora@bLa chance, il faut se la créer. Il suffit d'un peu de patience et de courage pour retourner les choses\r\nen sa faveur.\n@c0@"
  it: "@aViola@bQuel tipo dev'essere matto. Andiamo via, caro.\nNon voglio perdere nemmeno un altro secondo a sentire le sue assurdità.\n@c0@"
  ja: "@a@bデボラ「ツキは　自分で呼び込むものよ。\n\tガマンしていれば　そのうち\n\t流れは　こっちにくるわ。\n@c0@"
397:
  de: "@aGriselda@bIch hätte eigentlich gar nichts dagegen, wenn die Nacht ewig dauern würde.\n@c0@"
  en: "@aDebora@bI wouldn't particularly mind if the night went\r\non forever.\n@c0@"
  es: "@aStefania@bA vivir que son due notte.\n@c0@"
  fr: "@aPandora@bÇa ne me gênerait pas plus que ça qu'il fasse nuit\r\nen permanence.\n@c0@"
  it: "@aViola@bIo mi godo la vita ogni giorno!\n@c0@"
  ja: "@a@bデボラ「別に　１日中　夜になっても\n\t私は　気にしないけど。\n@c0@"
398:
  de: "@aGriselda@bHa ha! Weiß ich doch, dass er es so nicht gemeint hat! Ich hab doch nur einen Witz gemacht.\n@c0@"
  en: "@aDebora@bHa ha! I do know that's not what he meant, you know. I was just joking.\n@c0@"
  es: "@aStefania@b¡Ja ja! Sé que no es lo que quería decir. Solo bromeaba.\n@c0@"
  fr: "@aPandora@bHa haⓠ Mais bien sûr que je sais que ce n'est pas ce qu'il voulait dire. Je plaisantais, tu sais.\n@c0@"
  it: "@aViola@bFaccio solo le cose che mi piacciono, e affido a te tutti i compiti sgradevoli. Ti ringrazio per avermi reso una donna felice e realizzata, caro.\n@c0@"
  ja: "@a@bデボラ「……わかってるわよ！\n\tそういう意味じゃ　ないなんてことは。\n\tちょっと　言ってみただけよ。\n@c0@"
399:
  de: "@aGriselda@bMann, was gibt es viele hässliche Leute! Sicher wäre es lustig, eine Weile die Leute zu beobachten. Hier treibt sich wirklich alles mögliche Volk herum.\n@c0@"
  en: "@aDebora@bThere are certainly plenty of uglies!\r\nI suppose it could be quite fun to people-watch.\r\nThe customers here are such a mixed bag.\n@c0@"
  es: "@aStefania@b¡Veramente hay gente regulera!\nSicuro que se lo pasa bien mirando a la gente.\nHay clientes de tutta condición.\n@c0@"
  fr: "@aPandora@bIl y a effectivement pas mal de truandsⓠ Ça doit être assez amusant de regarder les gens. La clientèle d'ici est plutôt mélangée.\n@c0@"
  it: "@aViola@bIo sono buona e bella, ma quando qualcuno mi fa arrabbiare divento MOLTO cattiva. Hai capito, %a000090? A buon intenditor, poche parole...\n@c0@"
  ja: "@a@bデボラ「確かに　見ているだけで\n\tあきない連中が　そろっているものね。\n\tある意味　スリルがあって　面白いわ。\n@c0@"
400:
  de: "@aGriselda@bWenn es den legendären Helden gibt, sollte er sich doch langsam mal blicken lassen! Aber herumreisen und ihn suchen ist ja auch ganz lustig.\n@c0@"
  en: "@aDebora@bIf the legendary hero exists, you'd think he'd just hurry up and show his face. Still, travelling about looking for him is quite good fun, I suppose.\n@c0@"
  es: "@aStefania@bSi el héroe legendario existiera, ya podría salir y dar la cara. Aunque viajar buscándolo es divertente.\n@c0@"
  fr: "@aPandora@bSi le héros légendaire existait, on pourrait penser qu'il se dépêcherait de montrer sa tête. Mais voyager à sa recherche est assez amusant, au fond.\n@c0@"
  it: "@aViola@bIo scommetto centomila monete che l'Eroe Leggendario esiste!\nCaro, per favore, passami centomila monete...\n@c0@"
  ja: "@a@bデボラ「勇者がいるなら　いるで\n\tさっさと　出てきてもらいたいものよね。\n\t探す旅は　それなりに　楽しいけど。\n@c0@"
401:
  de: "@aGriselda@bWenn hier wer auf die Bühne geht, dann bin ich das. Das solltest du doch wissen, %a000090.\n@c0@"
  en: "@aDebora@bIf anyone's going to get up on stage, it should be me. You know that, %a000090.\n@c0@"
  es: "@aStefania@bSi alguien se va a mettere in scena debería ser yo, %a000090. Ya lo sabes.\n@c0@"
  fr: "@aPandora@bSi quelqu'un doit monter sur scène, c'est bien moi.\nTu le sais, %a000090.\n@c0@"
  it: "@aViola@bDiamine, che testo profondo!\nMa chi è l'autore?\nUna rapa?\n@c0@"
  ja: "@a@bデボラ「舞台に上がるなんて\n\t私にこそ　ふさわしいことよ。\n\tわかっているじゃない　%a000090。\n@c0@"
402:
  de: "@aGriselda@bIch wünschte, ich könnte auch so ein Kleid tragen. Wenn's nur nicht so unpraktisch wäre für die Gegenden, in die du mich schleppst.\n@c0@"
  en: "@aDebora@bI wish I could wear a dress like that. It just isn't practical for the kind of places you take me, though.\n@c0@"
  es: "@aStefania@bMe gustaría llevar un vestido así. Ma no es práctico para los lugares a los que me llevas.\n@c0@"
  fr: "@aPandora@bSi seulement je pouvais porter une robe comme ça. C'est juste que ça n'est pas pratique pour le genre de lieux où tu m'emmènes.\n@c0@"
  it: "@aViola@bMi piace il costume indossato dall'attrice...\nCaro, voglio che me ne regali quattro.\nLo voglio in blu, verde, giallo e arancio.\n@c0@"
  ja: "@a@bデボラ「本当は　ああいうドレスを着て\n\t旅をしたい　ところだけれど……\n\tあんまり　実用的じゃ　ないのよね。\n@c0@"
403:
  de: "@aGriselda@bMir ist es egal, ob ein Mann reich ist oder nicht. Ich hab selbst Geld genug.\n@c0@"
  en: "@aDebora@bI don't care if a man's rich or not.\r\nI have enough money of my own.\n@c0@"
  es: "@aStefania@bA mí tutto esto me parece una cursilería.\n@c0@"
  fr: "@aPandora@bÇa m'est égal qu'un homme soit riche ou pas.\r\nJ'ai déjà assez d'argent en propre.\n@c0@"
  it: "@aViola@bPassi per il pane e cipolla, ma che almeno mi siano serviti su un vassoio d'oro in una lussuosissima villa sul mare!\n@c0@"
  ja: "@a@bデボラ「男は　お金持ちでなくちゃ\n\tダメだなんて　思っていないわ。\n\tだって　私は　すでに　金持ちだから。\n@c0@"
404:
  de: "@aGriselda@bWenn du ihn öffnen willst, dann tu's doch einfach. Mich interessiert das nicht.\n@c0@"
  en: "@aDebora@bIf you want to open it, just open it.\nI'm not interested, personally.\n@c0@"
  es: "@aStefania@bSi quieres abrirlos, ábrelos. Ma que parezca un accidente.\n@c0@"
  fr: "@aPandora@bSi tu veux l'ouvrir, ouvre-le, ce vestiaire. Personnellement, ça ne m'intéresse pas.\n@c0@"
  it: "@aViola@bMi piace il tono di quella ragazza!\nHa l'aria di chi non si fa mettere i piedi in testa da nessuno! Brava! Così si fa!\n@c0@"
  ja: "@a@bデボラ「開けたいなら　開ければ？\n\t私は　別に興味ないけど。\n@c0@"
405:
  de: "@aGriselda@bJa, ich glaube nicht, dass ich sie gesehen habe, als ich damals mit Papa und Nera hier war.\n@c0@"
  en: "@aDebora@bYes, I didn't think I saw them when I was here with Papa and Nera in the past.\n@c0@"
  es: "@aStefania@bSí, no creo haberlo visto cuando estuve aquí con il mio papino y Nera.\n@c0@"
  fr: "@aPandora@bOui. Je ne me rappelle pas les avoir vu quand je\r\nsuis venue ici avec papa et Nera, autrefois.\n@c0@"
  it: "@aViola@bChissà se la compagnia ha intenzione di esibirsi anche a Mostroferrato...\n@c0@"
  ja: "@a@bデボラ「そういえば　前に\n\tパパやフローラたちと　来たときには\n\tあの劇団　いなかったような気がするわね。\n@c0@"
406:
  de: "@aGriselda@bWir haben hier nichts weiter zu erledigen, oder? Dann lass uns schnell verschwinden!\n@c0@"
  en: "@aDebora@bWe don't have anything we need to do here, right? Then let's hurry up and leave!\n@c0@"
  es: "@aStefania@bNo tenemos nada que hacer aquí, ¿no? ¡Pues vámonos presto!\n@c0@"
  fr: "@aPandora@bOn n'a rien à faire ici, je me trompeⓡ\nAlors dépêchons-nous de partir.\n@c0@"
  it: "@aViola@bNon credo che abbiamo qualcosa da fare qui, dico bene?\nAllora andiamo via.\n@c0@"
  ja: "@a@bデボラ「こんなところに　用はないわよね？\n\tだったら　さっさと　外に出なさい！\n@c0@"
407:
  de: "@aGriselda@bWas für lustige bunte Schleime! Es wäre bestimmt lustig, sich ein paar davon als Haustiere zu halten.\n@c0@"
  en: "@aDebora@bWhat funny-coloured slimes! It could be quite fun to keep a few as pets.\n@c0@"
  es: "@aStefania@b¡Qué colores tan divertenti tienen estos limos! Sería estupendo tener unos cuantos de mascota.\n@c0@"
  fr: "@aPandora@bIls ont de drôles de couleurs, ces gluantsⓠ\nÇa serait rigolo d'en garder quelques-uns\ncomme animaux de compagnie.\n@c0@"
  it: "@aViola@bMa che belli questi Slime colorati!\nCaro, devi assolutamente procurarmene qualcuno!\nOvviamente, in tinta con le mie borsette...\n@c0@"
  ja: "@a@bデボラ「めずらしい色の　スライムたちね。\n\tああいう子たちを　ペットにできたら\n\t面白そうだわ。\n@c0@"
408:
  de: "@aGriselda@bEr hat sich da ein bisschen reingesteigert, oder? Obwohl es ganz witzig ist, ihm zuzusehen.\n@c0@"
  en: "@aDebora@bHe's a little bit too carried away with it all, isn't he? It's quite funny to watch him, though.\n@c0@"
  es: "@aStefania@bSe emociona un poco demasiado, ¿no? Aunque es divertente mirarlo.\n@c0@"
  fr: "@aPandora@bIl se laisse un peu emporter avec tout ça, nonⓡ Remarque, c'est assez rigolo de le regarder.\n@c0@"
  it: "@aViola@bTu, invece, sei assolutamente prevedibile: ti comporterai sempre come io ti ordinerò di fare.\n@c0@"
  ja: "@a@bデボラ「あの　おじいさん\n\tスライムレースに　ハマりすぎね。\n\t見ているこっちは　面白いけど。\n@c0@"
409:
  de: "@aGriselda@bVielleicht versuche ich eines Tages mal ein Bett mit ein paar Schleimen zu teilen. Sie sind so weich, da sind sie bestimmt total gemütlich.\n@c0@"
  en: "@aDebora@bMaybe I'll try sharing a bed with some slimes one day. They're so soft, I'm sure it'd be comfortable.\n@c0@"
  es: "@aStefania@bUn día quizá pruebe a compartir cama con algunos limos. Son tan blandengues que debe de ser muy cómodo.\n@c0@"
  fr: "@aPandora@bJe devrais peut-être essayer de partager mon lit avec des gluants, un jour. Ils sont si moelleux, je suis sûre que ça serait très confortable.\n@c0@"
  it: "@aViola@bUhm, ho avuto un'idea...\nPotremmo prendere degli Slime morbidi e paciocconi e usarli come cuscini...\n@c0@"
  ja: "@a@bデボラ「スライムと　いっしょに寝たら\n\tぷにぷにしていて　気持ち良さそうね。\n\t今度　ためしてみようかしら。\n@c0@"
410:
  de: "@aGriselda@bDu würdest mir doch ein paar Schleime besorgen, wenn ich es wollte, oder, %a000090?\n@c0@"
  en: "@aDebora@bYou'd get me a few slimes if I wanted, wouldn't you, %a000090?\n@c0@"
  es: "@aStefania@bAsí que igual un día te pido algunos limos, %a000090,¿capisci?\n@c0@"
  fr: "@aPandora@bTu pourrais m'attraper quelques gluants si je voulais, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, ti dispiacerebbe portarmi qui qualche Slime?\n@c0@"
  ja: "@a@bデボラ「%a000090なら\n\t私のために　スライムを何匹でも\n\tつれてきてくれるもの。　ね　%a000090？\n@c0@"
411:
  de: "@aGriselda@bEs ist eigentlich ganz praktisch, dich um mich zu haben. Das Gewünschte beschaffen zu können ist das Merkmal eines guten Dieners, weißt du.\n@c0@"
  en: "@aDebora@bYou're quite useful, you are. Being able to deliver the goods is the mark of a good servant, you know.\n@c0@"
  es: "@aStefania@bMira que eres útil. Tienes todo lo que necesita un buen servitore.\n@c0@"
  fr: "@aPandora@bTu es plutôt utile, franchement. Être capable de fournir de la marchandise, c'est la marque d'un\r\nbon domestique, tu sais.\n@c0@"
  it: "@aViola@bGrazie, caro.\nTu non mi deludi mai.\nBeh, quasi mai...\n@c0@"
  ja: "@a@bデボラ「あんたって　本当に便利だわ。\n\t持つべきものは　使える　しもべよね。\n@c0@"
412:
  de: "@aGriselda@bDu bist doch sicher nicht... eifersüchtig?! Oder?\n@c0@"
  en: "@aDebora@bSurely you're not...jealous!? No?\n@c0@"
  es: "@aStefania@bNo estarás... celoso, ¿vero?\n@c0@"
  fr: "@aPandora@bTu n'es quand même pas... jalouxⓡⓐ Nonⓠ\n@c0@"
  it: "@aViola@bNo?\nCome osi rifiutarti di esaudire una mia richiesta?!\n@c0@"
  ja: "@a@bデボラ「あら　もしかして\n\tスライムに　やきもちを　やいているの？\n\t……え　ちがう？\n@c0@"
413:
  de: "@aGriselda@bSie wären zu schleimig, um sie zu knuddeln? Hm... Da könntest du recht haben. Dann lasse ich das vielleicht erst mal.\n@c0@"
  en: "@aDebora@bThey'd be too slimy to cuddle?\r\nHmm... You could have a point there.\r\nMaybe I'll give it a miss for now.\n@c0@"
  es: "@aStefania@b¿Demasiado limosos?\r\nMmm... Podría ser.\r\nQuizás lo deje pasar per esta volta.\n@c0@"
  fr: "@aPandora@bIls seraient trop gluants pour être câlinésⓡ Mmm...\nTu marques un point, là-dessus. Je vais peut-être laisser tomber l'idée pour l'instant.\n@c0@"
  it: "@aViola@bAh, pensi che gli Slime siano troppo viscidi e scivolerebbero via da sotto la testa?\n㈡\nUhm, non hai tutti i torti...\nNon avevo pensato a questo piccolo inconveniente.\n@c0@"
  ja: "@a@bデボラ「抱きつくと　べとべとになるですって？\n\tそ　そう…　まあ　%a000090がそう言うなら\n\t今回だけは　ガマンしておいてあげるわ。\n@c0@"
414:
  de: "@aGriselda@bDann reden Monster also auch übers Wetter, genau wie wir Manschen. Schlabberlot, wer hätte das gedacht!\n@c0@"
  en: "@aDebora@bSo monsters worry about the weather just like us humans. Now there's a slurprise!\n@c0@"
  es: "@aStefania@bAsí que a los mostri les preocupa el tiempo, como a los humanos. ¡Qué glopresa!\n@c0@"
  fr: "@aPandora@bAlors les monstres se soucient du temps qu'il fait exactement comme nous, les humains.\nÇa c'est une slurpriseⓠ\n@c0@"
  it: "@aViola@bUno Slime meteorologo?!\n@c0@"
  ja: "@a@bデボラ「魔物も　人間みたいに\n\t天気を　気にするものなのね。\n\tちょっとだけ　おどろいたわ。\n@c0@"
415:
  de: "@aGriselda@bVielleicht gibt's irgendwo da draußen sogar eine Stadt, in der hauptsächlich Monster leben! Aber nein, das kann ich mir nicht vorstellen.\n@c0@"
  en: "@aDebora@bMaybe there's even a town out there that's full of just monsters. I doubt it, though.\n@c0@"
  es: "@aStefania@bQuizás hasta exista una città llena de mostri. Aunque lo dudo.\n@c0@"
  fr: "@aPandora@bPeut-être même qu'il existe quelque part une ville peuplée exclusivement de monstres. Mais ça m'étonnerait, quand même.\n@c0@"
  it: "@aViola@bDi Slime ne avevo visti di tutti i tipi, colori e dimensioni, ma questo mi mancava!\n@c0@"
  ja: "@a@bデボラ「と　いうことは　どこかに\n\t魔物だけの町が　あったりしてね。\n\tまさかとは　思うけど。\n@c0@"
416:
  de: "@aGriselda@bIch bin beeindruckt, dass sie es geschafft haben, so ein großes T&T-Brett zu bauen.\n@c0@"
  en: "@aDebora@bI'm impressed that they managed to build a T 'n' T board this big.\n@c0@"
  es: "@aStefania@bMe impresiona que lograran construir un tablero de T y T así de grosso.\n@c0@"
  fr: "@aPandora@bJe suis impressionnée que quelqu'un ait réussi à construire un jeu de TNT aussi grand.\n@c0@"
  it: "@aViola@bQuesta Tavola della Sorte è impressionante...\nMa l'hai vista?!\nÈ gigantesca!\n@c0@"
  ja: "@a@bデボラ「よく　こんな大きなすごろく場を\n\tつくったものよね。　感心するわ。\n@c0@"
417:
  de: "@aGriselda@bWenn man was daran deichseln könnte, welche Zahl die Würfel zeigen, dann könnte man so oft gewinnen, wie man nur wollte.\n@c0@"
  en: "@aDebora@bIf you could fix how the die rolled, you'd be able to win as many times as you liked.\n@c0@"
  es: "@aStefania@bSi pudieras alterare los dados podrías ganar cuantas veces quisieras.\n@c0@"
  fr: "@aPandora@bSi on pouvait décider du résultat du lancer de dé, on pourrait gagner aussi souvent qu'on le voudrait.\n@c0@"
  it: "@aViola@bL'unico modo sicuro per vincere quando si gioca alla Tavola della Sorte è usare un dado truccato...\n@c0@"
  ja: "@a@bデボラ「サイコロの目を　思い通りに\n\t出せるように　改造することができれば\n\t好きなだけ　勝てるのに。\n@c0@"
418:
  de: "@aGriselda@bIch gewinne für mein Leben gern. Egal, was es kostet.\n@c0@"
  en: "@aDebora@bI love winning. No matter what it takes.\n@c0@"
  es: "@aStefania@bMe encanta ganar. Como sea, ¿capisci?\n@c0@"
  fr: "@aPandora@bJ'adore gagner. Peu importe à quel prix.\n@c0@"
  it: "@aViola@bAltrimenti bisogna affidarsi ai capricci di madama fortuna e sperare di raggiungere il traguardo...\n@c0@"
  ja: "@a@bデボラ「私は　勝つのが好きなのよ。\n\tたとえ　どんな手を　使ってもね。\n@c0@"
419:
  de: "@aGriselda@bDer braucht gar nicht so zu feixen ⓚⓛ ich wette, der ist auch schon mal runtergefallen.\n@c0@"
  en: "@aDebora@bHe said ⓗtooⓘ, which implies he fell off as well,\nso he's hardly in a position to be laughing at us.\n@c0@"
  es: "@aStefania@bHa dicho ⓕtambiénⓖ, ¿vero? Entonces no sé de qué se ríe.\n@c0@"
  fr: "@aPandora@bIl a dit ⓥvous aussiⓦ, ce qui implique qu'il est également tombé. Il est plutôt mal placé pour se moquer de nous, dans ce cas.\n@c0@"
  it: "@aViola@bSe quell'idiota si permette di ridere un'altra volta delle nostre disgrazie, gli strappo i denti e glieli faccio ingoiare!\n@c0@"
  ja: "@a@bデボラ「あなたも…　ってことは\n\t自分だって　落ちたってことじゃないの？\n\t人のことを　笑える立場なのかしら。\n@c0@"
420:
  de: "@aGriselda@bKannst du es glauben, dass er sich darüber freut, wie die Leute runterplumpsen?\n@c0@"
  en: "@aDebora@bCan you believe that he's getting his kicks out of watching people fall?\n@c0@"
  es: "@aStefania@b¿Puedes credere que disfrute viendo caer a la gente?\n@c0@"
  fr: "@aPandora@bTu le crois, çaⓡ Il s'éclate à regarder\nles gens tomberⓠ \n@c0@"
  it: "@aViola@bSi diverte a vedere gli altri cadere?!\n@c0@"
  ja: "@a@bデボラ「すごろくから\n\t人が落ちてくるのを見て　楽しむだなんて。\n\tつまらないことを　しているわね。\n@c0@"
421:
  de: "@aGriselda@bIch glaube ja, es macht viel mehr Spaß, selbst zu fallen als dabei zuzusehen.\n@c0@"
  en: "@aDebora@bI think it's more fun to be the one falling than the\r\none watching.\n@c0@"
  es: "@aStefania@bPenso que es más divertente ser el que se cae que el que mira.\n@c0@"
  fr: "@aPandora@bMoi je trouve que c'est plus rigolo d'être celui qui tombe que celui qui regarde.\n@c0@"
  it: "@aViola@bPoverino.\nLa sua dev'essere una vita molto triste.\nChe pena mi fa...\n@c0@"
  ja: "@a@bデボラ「見ているより　自分で落とすほうが\n\t面白いと思うんだけど。\n@c0@"
422:
  de: "@aGriselda@bHier tobt das Leben! Hier geht erst abends so richtig die Post ab.\n@c0@"
  en: "@aDebora@bIt's very lively. This place really comes into its own at night.\n@c0@"
  es: "@aStefania@bEstá veramente animado. Este lugar no es el mismo de notte.\n@c0@"
  fr: "@aPandora@bIl y a une sacrée ambiance. C'est vraiment de nuit que cet endroit donne sa pleine mesure.\n@c0@"
  it: "@aViola@bDi notte questo posto è ancora più vivace.\nSi respira proprio una bella atmosfera!\n@c0@"
  ja: "@a@bデボラ「ずいぶんと　にぎやかね。\n\t夜こそが　この町の\n\t本当の顔…　と　いうことかしら。\n@c0@"
423:
  de: "@aGriselda@bGegen ein bisschen Spaß habe ich nichts, %a000090, aber ich mache nicht gern die Nächte durch. Das ist nicht gut für die Haut.\n@c0@"
  en: "@aDebora@bI don't mind having a bit of fun, %a000090, but I refuse to do an all-nighter. It's bad for your skin.\n@c0@"
  es: "@aStefania@bNo me importa divertirme un poco, %a000090, pero me niego a estar toda la notte levantada. Es malo per la pelle.\n@c0@"
  fr: "@aPandora@bJe ne suis pas contre m'amuser un peu, %a000090, mais je refuse de faire une nuit blanche. C'est mauvais pour la peau.\n@c0@"
  it: "@aViola@bDivertiamoci anche noi, %a000090!\nAnzi, no: io mi divertirò, e tu farai del tuo meglio perché io mi diverta.\n@c0@"
  ja: "@a@bデボラ「%a000090。　遊ぶのはいいけど\n\t夜更かしは　絶対にダメよ。\n\tおハダに　よくないから。\n@c0@"
424:
  de: "@aGriselda@bWenn du ein bisschen spielen möchtest, dann kannst du das von mir aus tun. Aber nicht zu lange.\n@c0@"
  en: "@aDebora@bIf you want to have a bit of a gamble, then I'll allow it. Not for long, though.\n@c0@"
  es: "@aStefania@bSi quieres jugar un po', te doy permiso. Ma non troppo.\n@c0@"
  fr: "@aPandora@bSi tu veux t'amuser à parier un peu, je t'y autorise. Mais pas longtemps, hein.\n@c0@"
  it: "@aViola@bSe hai voglia di fare una partitina, chiedimelo con gentilezza.\nChissà, forse potrei darti il permesso...\n@c0@"
  ja: "@a@bデボラ「%a000090が　カジノで\n\t遊びたいって言うなら\n\t少しだけ　つきあってあげてもいいわよ。\n@c0@"
425:
  de: "@aGriselda@bEine Insel im Süden ⓚⓛ das ist nichts für mich. Mir ist eine große Villa in einer quirligen Großstadt lieber.\n@c0@"
  en: "@aDebora@bAn island in the south doesn't really appeal to me.\r\nI'd rather live in a huge mansion in a big bustling city.\n@c0@"
  es: "@aStefania@bUna isola en el sur no me llama la atención.\r\nPrefiero una mansión gigante en una gran città.\n@c0@"
  fr: "@aPandora@bUne île au sud, ça ne me parle pas plus que ça.\r\nJe préfèrerais un immense manoir dans une\r\ngrande ville très animée.\n@c0@"
  it: "@aViola@bNon mi piacerebbe abitare su un'isoletta sperduta, tutta pace e tranquillità. Ci trascorrerei volentieri qualche mese di vacanze, ma niente di più.\n@c0@"
  ja: "@a@bデボラ「私は　南国の小さな島よりも\n\t都会のかおりがする町の　大きな屋敷で\n\tぜいたくな　暮らしをしたいわ。\n@c0@"
426:
  de: "@aGriselda@bOder ein Schloss, wenn es keine Villen gibt. Ich bin da gar nicht anspruchsvoll, %a000090.\n@c0@"
  en: "@aDebora@bOr a castle, if there are no mansions available.\nI'm really not that fussy, %a000090.\n@c0@"
  es: "@aStefania@bO un castello, de no haber mansiones.\nSoy de gustos sencillos, %a000090.\n@c0@"
  fr: "@aPandora@bOu alors un château, s'il n'y a pas de manoir de disponible. Je ne suis vraiment pas si difficile\nque ça, %a000090.\n@c0@"
  it: "@aViola@bSono un animale da città.\nPreferisco vivere in un posto movimentato e pieno di negozi.\n@c0@"
  ja: "@a@bデボラ「あ　屋敷がムリなら\n\tお城でも　かまわないわよ。\n\tそういうわけだから　よろしく　%a000090。\n@c0@"
427:
  de: "@aGriselda@bIch werde heute Abend wieder baden, %a000090. Du weißt ja wohl, was das für dich bedeutet?\n@c0@"
  en: "@aDebora@bI'm going to have a bath again tonight, %a000090. You know what you need to do, right?\n@c0@"
  es: "@aStefania@bEsta notte voy a darme otro bagno, %a000090. ¿Ya sabes lo tienes que hacer?\n@c0@"
  fr: "@aPandora@bJe vais à nouveau prendre un bain ce soir, %a000090. Tu sais ce que tu as à faire,\nn'est-ce pasⓡ\n@c0@"
  it: "@aViola@bStasera farò un bagno rilassante prima di andare a dormire, %a000090.\nSai già cosa devi fare, non è vero?\n@c0@"
  ja: "@a@bデボラ「私　今夜も　お風呂に入るから。\n\t%a000090　あんたが　やるべきことは\n\tもちろん　わかってるわよね？\n@c0@"
428:
  de: "@aGriselda@bGenau. Du wirst Wache stehen. Ich kann mich wohl hoffentlich darauf verlassen, dass du das ordentlich machst.\n@c0@"
  en: "@aDebora@bThat's right. Make sure you stand guard.\nI should think I can trust you to do that properly.\n@c0@"
  es: "@aStefania@bBuon ragazzone. Asegúrate de montar guardia.\nConfío en que lo harás correctamente.\n@c0@"
  fr: "@aPandora@bC'est exact. Monter la garde. Je pense que je\r\npeux te faire confiance pour faire ça correctement, au moins.\n@c0@"
  it: "@aViola@bEsatto. Devi fare la guardia fuori dalla porta per assicurarti che nessuno provi a spiarmi dal buco della serratura.\n@c0@"
  ja: "@a@bデボラ「しっかり　見はっておいてね。\n\tこれでも　私　あんたのこと\n\t少しは　信用してあげてるんだから。\n@c0@"
429:
  de: "@aGriselda@bDu musst natürlich Wache stehen, genau wie er, wie es sich für einen treu sorgenden Gatten gebührt. Das ist doch wohl klar!\n@c0@"
  en: "@aDebora@bYou have to stand guard like this man. He's a fine example of devotion to one's lady wife.\n@c0@"
  es: "@aStefania@bTienes que montar guardia como él para que nadie se haga pis en la mia bañera. ¿Capisci?\n@c0@"
  fr: "@aPandora@bPrends exemple sur cet homme qui veille à ce que\r\nrien ne vienne déranger sa femme. Ça, c'est du dévouement.\n@c0@"
  it: "@aViola@bMa come?! L'hai già dimenticato?! Devi fare la guardia fuori dalla porta per assicurarti che nessuno provi a spiarmi dal buco della serratura!\n㈡\nSanti numi, %a000090!\nCome fai a non ricordare una cosa tanto elementare, eh?!\n@c0@"
  ja: "@a@bデボラ「この男みたいに\n\t私がのぞかれないように　番をすることに\n\t決まっているでしょう？　バカね。\n@c0@"
430:
  de: "@aGriselda@bAlberne Gans! Ich wette, du bist froh, dass du nicht so eine wild kreischende Verrückte geheiratet hast!\n@c0@"
  en: "@aDebora@bStupid girl, screaming like that! I bet you're glad you didn't marry an irrational, screeching monster like her, aren't you, %a000090?\n@c0@"
  es: "@aStefania@b¡Balorda! ¡Qué manera de gritar! ¡Y osa proferir amenazas delante di me! Igual sufre un accidente...\n@c0@"
  fr: "@aPandora@bMais elle est malade de crier comme çaⓡⓐ Tu dois être content de ne pas avoir épousé ce genre de pimbêche hystérique, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@bⓕCoccoⓖ?!\nCome si permette di rivolgersi con tanta confidenza al mio caro maritino, eh?!\n@c0@"
  ja: "@a@bデボラ「この美しい私が　そばにいるのに\n\t%a000090が　他の女を　見ることはないわ。\n\t何を考えてるのかしら　この女。\n@c0@"
431:
  de: "@aGriselda@bEs wäre gut, wenn es keine Monster mehr gäbe, aber dann hättest du auch keine kleinen Freunde mehr, die dir aushelfen könnten.\n@c0@"
  en: "@aDebora@bIt'd be good if there were no more monsters, but then you wouldn't have any of your little friends to help you out.\n@c0@"
  es: "@aStefania@bEstaría bene que no hubiera más mostri, ma entonces no tendrías a tus amiguitos para ayudarte.\n@c0@"
  fr: "@aPandora@bCe serait bien qu'il n'y ait plus de monstres, mais dans ce cas, tu n'aurais plus aucun de tes petits amis pour t'aider, non plus.\n@c0@"
  it: "@aViola@bNon tutti i mostri sono pericolosi.\nQuelli con cui hai fatto amicizia, per esempio, sono docili e ubbidienti.\n@c0@"
  ja: "@a@bデボラ「魔物が出なくなるのは　いいけど\n\tそうすると　%a000090の部下も\n\t見つけづらくなるのよね。\n@c0@"
432:
  de: "@aGriselda@bAber das ist dein Problem, nicht meins.\n@c0@"
  en: "@aDebora@bStill, that's your problem, not mine.\n@c0@"
  es: "@aStefania@bPero ese es il tuo problema, no el mío.\n@c0@"
  fr: "@aPandora@bEnfin, c'est ton problème, pas le mien de toute façon.\n@c0@"
  it: "@aViola@bOra che ci penso, potrei addestrare qualcuno di loro a servirmi e riverirmi come una regina!\nNiente male come idea, eh?!\n@c0@"
  ja: "@a@bデボラ「まあ　部下がいなくて\n\t忙しくなるのは　%a000090だから\n\t私は　関係ないけど。\n@c0@"
433:
  de: "@aGriselda@bⓞSchatzⓟ? Der hast du wohl den Kopf verdreht. Einen hässlichen Mann würde ich auch nicht haben wollen. Wie sähe das denn aus!\n@c0@"
  en: "@aDebora@bHandsome? Well, I wouldn't be seen with an ugly man. We'd look so unbalanced.\n@c0@"
  es: "@aStefania@b¿Guapo? Va bene, a mí no me verán con un feo. Sería demasiado desequilibrado.\n@c0@"
  fr: "@aPandora@bMignonⓡ Elle ne voudrait quand même pas que je\nme promène avec un laideron. On aurait l'air trop\nmal assortis.\n@c0@"
  it: "@aViola@bHai sentito? Ti ha chiamato ⓕbel fustoⓖ.\nQuando ti ho conosciuto eri un pappamolle, ma adesso sei un bocconcino più che appetibile.\n㈡\nMi pare inutile sottolineare che il merito della tua trasformazione è tutto mio, ovviamente.\n@c0@"
  ja: "@a@bデボラ「この私が　見ばえの悪い男を\n\t連れて歩くわけが　ないじゃない。\n\tつりあいがとれないのは　美しくないし。\n@c0@"
434:
  de: "@aGriselda@bIch brauche mich nicht mit Kochen zu belasten. Wozu gibt's Köche?\n@c0@"
  en: "@aDebora@bI don't need to trouble myself with cooking.\r\nThat's why people have chefs.\n@c0@"
  es: "@aStefania@bYo no me preocupo con la cucina.\r\nPara eso se inventaron los cocineros.\n@c0@"
  fr: "@aPandora@bJe n'ai pas besoin de m'ennuyer à faire la cuisine. C'est pour ça que les gens ont des cuisiniers.\n@c0@"
  it: "@aViola@bIo me la cavo benissimo in cucina.\nA mangiare.\n@c0@"
  ja: "@a@bデボラ「私に　料理のウデは必要ないの。\n\t料理は　シェフに作らせるものであって\n\t私が　することではないから。\n@c0@"
435:
  de: "@aGriselda@bAber den hier zu beschäftigen lohnt sich offenbar nicht.\n@c0@"
  en: "@aDebora@bIt doesn't sound like the one here is worth\r\nemploying, though.\n@c0@"
  es: "@aStefania@bAunque el de aquí veramente no parece merecer la pena.\n@c0@"
  fr: "@aPandora@bMais on dirait qu'il y a eu une petite erreur\r\nde recrutement sur celui d'ici.\n@c0@"
  it: "@aViola@bA cucinare, invece, ci devi pensare tu.\nIo ti dico cosa desidero per pranzo e cena, e tu prepari la pappa.\n㈡\nOvviamente, devi anche apparecchiare e sparecchiare la tavola e lavare le stoviglie.\nNon posso mica fare tutto io, eh?!\n@c0@"
  ja: "@a@bデボラ「でも　ここのシェフをやとうのは\n\tやめておいたほうが　よさそうね。\n@c0@"
436:
  de: "@aGriselda@bMerkwürdiges Geschäftsgebaren! Aber nicht dumm, Kunden erst den einen Artikel zu verkaufen, bevor sie noch etwas anderes kaufen können.\n@c0@"
  en: "@aDebora@bWhat an odd way of doing business! Quite a clever way, mind you, making you buy something before he'll sell you something else.\n@c0@"
  es: "@aStefania@b¡Qué modo tan extraño de hacer negocios! Es veramente astuto hacerte comprar algo antes de que te venda otra cosa.\n@c0@"
  fr: "@aPandora@bQuelle drôle de façon de faire des affairesⓠ Mais c'est assez malinⓢ il t'oblige à acheter quelque chose avant d'accepter de te vendre autre chose.\n@c0@"
  it: "@aViola@bAstuto, quel commerciante! Se vuoi acquistare il ⓕLibro delle Bestieⓖ, devi prima comprare un carro!\nCosì ti vende due oggetti invece che uno solo!\n@c0@"
  ja: "@a@bデボラ「ふうん…　そうやって\n\t別のものも　売りつける…　ってわけね。\n\t変わっているというか　商売上手なだけよ。\n@c0@"
437:
  de: "@aGriselda@bIch habe es dir vermutlich schon erzählt, aber früher habe ich oft mit Mama und Papa gestritten.\n@c0@"
  en: "@aDebora@bI've probably told you this before, but I often used to fight with Mama and Papa.\n@c0@"
  es: "@aStefania@bYa te lo habré dicho, ma antes peleaba mucho con la mia mamma e il mio papino.\n@c0@"
  fr: "@aPandora@bJe te l'ai sûrement déjà raconté, mais je me\r\ndisputais souvent avec mamma et papa.\n@c0@"
  it: "@aViola@bIn passato ho discusso spesso con i miei genitori, a volte in modo molto animato.\n@c0@"
  ja: "@a@bデボラ「前にも　話したかもしれないけれど\n\t私って　いつも　パパやママと\n\tケンカばかり　していたのよ。\n@c0@"
438:
  de: "@aGriselda@bIch habe ihnen ein paar furchtbare Dinge an den Kopf geworfen, aber sie haben nie auch nur angedeutet, dass sie mich loswerden wollen.\n@c0@"
  en: "@aDebora@bI said some terrible things, but they never once even hinted that they'd like me to leave.\n@c0@"
  es: "@aStefania@bLes decía cosas terribles, ma nunca insinuaron siquiera que quisieran que me fuera.\n@c0@"
  fr: "@aPandora@bJe leur ai dit des choses terribles, mais jamais une seule fois ils n'ont ne serait-ce que laissé entendre qu'ils voulaient que je parte.\n@c0@"
  it: "@aViola@bHo detto loro cose anche sgradevoli, ma spero che sappiano che li adoro.\n@c0@"
  ja: "@a@bデボラ「……でも　私が　どんなに\n\tわがまま言っても　家を\n\t追い出されることは　なかったわ。\n@c0@"
439:
  de: "@aGriselda@bIch habe nie verstanden, warum sie sich das von mir gefallen ließen. Ich meine, sie sind nicht mal meine leiblichen Eltern.\n@c0@"
  en: "@aDebora@bI couldn't understand why they put up with me for so long. I mean, they're not even my real parents.\n@c0@"
  es: "@aStefania@bNo sé cómo me aguantaron tanto. ¡Si ni siquiera son mis verdaderos padres!\n@c0@"
  fr: "@aPandora@bJe n'arrivais pas à comprendre pourquoi ils m'avaient supportée aussi longtemps. C'est vrai, ce ne sont même pas mes vrais parents.\n@c0@"
  it: "@aViola@bNon di rado mi sono chiesta come facciano a sopportarmi, sai? Vedi, forse non te ne sei accorto, ma io non ho un carattere facile...\n㈡\nE pensare che non sono nemmeno i miei veri genitori!\nEh, sì... Credo che anche loro mi vogliano molto bene...\n@c0@"
  ja: "@a@bデボラ「私たち　本当の親子じゃないのに\n\tなぜ　そこまで　ガマンしてくれたのか\n\tずっと　わからなかったよ。　でも……。\n@c0@"
440:
  de: "@aGriselda@bAber jetzt, da ich eine eigene Familie habe, wird mir langsam klar, wie ihnen dabei zumute gewesen sein muss.\n@c0@"
  en: "@aDebora@bNow I have a family of my own, though, I've started to have an idea of how they must've felt.\n@c0@"
  es: "@aStefania@bAhora tengo una famiglia propia y empiezo a capire cómo se habrán sentido.\n@c0@"
  fr: "@aPandora@bMais maintenant que j'ai ma propre famille, je commence à avoir une idée de ce qu'ils ont pu ressentir.\n@c0@"
  it: "@aViola@bOra che sono sposata, però, comincio a capire quanto sia difficile tenere le redini di una famiglia.\n@c0@"
  ja: "@a@bデボラ「家族ができた　今の私には\n\t少しだけ　あの頃の　２人の気もちが\n\tわかるような　気がするの。\n@c0@"
441:
  de: "@aGriselda@b... Aber egal! Ich weiß gar nicht, was in mich gefahren ist, dir all das zu erzählen. Und jetzt spute dich, %a000090! Es wird Zeit, dass wir weiterkommen!\n@c0@"
  en: "@aDebora@b...Anyway! I don't know what's got into me, coming out with all this. Hurry up, %a000090.\nTime to move on!\n@c0@"
  es: "@aStefania@b¡Va bene! No sé qué me ha dado para salir con esto. Vamos, %a000090.\n¡Andiamo!\n@c0@"
  fr: "@aPandora@b... Enfin brefⓠ Je ne sais pas ce qui m'a pris de déballer tout ça. Dépêche-toi, %a000090.\nIl est temps qu'on se bougeⓠ\n@c0@"
  it: "@aViola@bOh, ma che sto dicendo?!\nNon è da me fare discorsi tanto sdolcinati!\nForza, %a000090! Andiamo!\n@c0@"
  ja: "@a@bデボラ「……って　こんな言い方\n\t私らしくないわねっ！\n\tほら　もう　いくよ　%a000090！\n@c0@"
442:
  de: "@aGriselda@bEr muss bedeutend sein, wenn er es sich leisten kann, jeden Tag in der Schänke zu verbringen.\n@c0@"
  en: "@aDebora@bHe must be important if he can afford to spend every day in the pub.\n@c0@"
  es: "@aStefania@bDebe de ser alguien importante si puede pasar tutto el día en el bar.\n@c0@"
  fr: "@aPandora@bIl doit être important pour se permettre de passer toutes ses journées à la taverne.\n@c0@"
  it: "@aViola@bChe c'è di male se un uomo se ne va alla taverna ogni tanto? Ovviamente, la tua situazione è diversa, %a000090!\n㈡\nTu puoi andarci solo per cinque minuti, di giorno, e dopo avermi chiesto l'autorizzazione per iscritto!\n@c0@"
  ja: "@a@bデボラ「毎日　酒場に　いりびたりなんて\n\tいいご身分ね　そのおじいさん。\n@c0@"
443:
  de: "@aGriselda@bWahrsagerei ist Mumpitz. Jedermann bestimmt selbst seinen Weg. Ich hab's jedenfalls immer so gemacht.\n@c0@"
  en: "@aDebora@bFortune-telling is a load of rubbish. You make your own fortune in this life. I know I always have.\n@c0@"
  es: "@aStefania@bLo de leer el futuro es una bobada. El futuro te lo labras tú. Al menos así sempre ha sido per me.\n@c0@"
  fr: "@aPandora@bLa bonne aventure, c'est bobards et compagnie, pour l'essentiel. C'est à chacun de se créer ses propres opportunités, dans la vie. Moi, je l'ai toujours fait.\n@c0@"
  it: "@aViola@bNessuno ha il potere di predire il futuro.\nChi dice di saperlo fare è un bugiardo.\nO una bugiarda, in questo caso...\n@c0@"
  ja: "@a@bデボラ「占いなんて　アテにならないわよ。\n\t自分の道は　自分で決める。\n\t私は　いつだって　そうしてきたわ。\n@c0@"
444:
  de: "@aGriselda@bDu solltest entweder schlafen oder wach sein, Mädel, aber doch nicht irgendwas dazwischen! Das war ja fast gruselig.\n@c0@"
  en: "@aDebora@bEither be awake or be asleep, girl, not somewhere in the middle! That was creepy.\n@c0@"
  es: "@aStefania@bO dormida o despierta ma no las due cosas a la vez. ¡Santa Diosa!\n@c0@"
  fr: "@aPandora@bIl faut choisir, ma filleⓢ tu es endormie ou éveillée, pas quelque part entre les deuxⓠ\nÇa m'a fait froid dans le dos.\n@c0@"
  it: "@aViola@bImpressionante!\nSta dormendo, eppure ha ripetuto la lezioncina senza nemmeno una sbavatura!\n@c0@"
  ja: "@a@bデボラ「寝てるのか　起きているのか\n\tハッキリしなさいよね。\n\t……ビックリしたじゃないの。\n@c0@"
445:
  de: "@aGriselda@bMan sagt ja so schön, Schlafende sehen aus wie Engel, aber auf den trifft das jedenfalls nicht zu.\n@c0@"
  en: "@aDebora@bThey say a sleeping face is like that of an angel,\r\nbut that certainly doesn't apply to him.\n@c0@"
  es: "@aStefania@bDicen que el rostro de los dormidos es el de un angelo, ma en el suo caso...\n@c0@"
  fr: "@aPandora@bOn dit qu'un visage endormi est le reflet de celui des anges, mais ça m'étonnerait que de dicton s'applique au sien, de visage.\n@c0@"
  it: "@aViola@bQuesto dev'essere un gran pezzo di delinquente.\nMi piacerebbe scoprire cosa sta sognando...\n@c0@"
  ja: "@a@bデボラ「寝顔は天使　なんて言葉があるけど\n\tこの男には　当てはまらないわね。\n@c0@"
446:
  de: "@aGriselda@bWir haben gutes Geld dafür bezahlt, also können wir es uns genauso gut ansehen. Mich interessiert es nicht unbedingt, aber ich warte, solange du guckst.\n@c0@"
  en: "@aDebora@bWe did pay good money for it, so we should probably have a look. I'm not interested myself, but I'll hang around while you look.\n@c0@"
  es: "@aStefania@bPagamos molto por él, de modo que deberíamos echar un vistazo. A mí no me interesa, ma me quedaré mientras miras.\n@c0@"
  fr: "@aPandora@bOn l'a payé assez cher, alors on devrait peut-être\r\ny jeter un œil. Moi, ça ne m'intéresse pas trop, mais\r\nje vais rester à côté pendant que tu le regardes.\n@c0@"
  it: "@aViola@bSono curiosa di sapere di cosa tratta, ma ora non ho voglia di leggere...\n㈡\nFammi un favore, %a000090: guarda un po' di che parla, poi mi farai un riassuntino veloce e dettagliato. Intesi?\n@c0@"
  ja: "@a@bデボラ「わざわざお金を出して買ったんでしょ？\n\tせっかくだし　見てみれば？\n\t私は　興味ないけど　横にいてあげるから。\n@c0@"
447:
  de: "@aGriselda@bWenn du sie nicht haben willst, dann kauf sie nicht. Du kannst immer noch mal wiederkommen, wenn du es dir anders überlegst.\n@c0@"
  en: "@aDebora@bIf you don't want it, then don't buy it.\nYou can always come back another time if you change your mind.\n@c0@"
  es: "@aStefania@bSi no lo quieres no lo compres.\nSiempre puedes ritornare si cambias de opinión.\n@c0@"
  fr: "@aPandora@bSi tu n'en veux pas, ne l'achète pas.\r\nTu pourras toujours revenir à un autre moment\r\nsi tu changes d'avis.\n@c0@"
  it: "@aViola@bSe l'oggetto non ti convince, non comprarlo.\nTanto puoi sempre tornare a prenderlo più tardi, nel caso cambiassi idea.\n@c0@"
  ja: "@a@bデボラ「買いたくないのなら　好きにすれば？\n\tほしくなった時に\n\tまた　来ればいいだけのことだし。\n@c0@"
448:
  de: "@aGriselda@bDu wolltest es kaufen und du hast es gekauft. Mich geht das nichts an.\n@c0@"
  en: "@aDebora@bYou wanted to buy it and you bought it.\r\nNone of my business.\n@c0@"
  es: "@aStefania@bTú querías comprarlo y lo hiciste.\r\nNo es cosa mía.\n@c0@"
  fr: "@aPandora@bTu voulais l'acheter et tu l'as acheté.\r\nCe ne sont pas mes oignons.\n@c0@"
  it: "@aViola@bLa volevi e l'hai acquistata.\nDopo avermi chiesto il permesso, ovvio.\nSai che non puoi prendere decisioni autonomamente...\n@c0@"
  ja: "@a@bデボラ「まあ　あんたが好きで買ったものだし\n\t私は　何も言わないわ。\n@c0@"
449:
  de: "@aGriselda@bWenn du etwas kaufen möchtest, dann schau erst nach, ob du es dir leisten kannst. Bring mich nicht noch einmal in so eine peinliche Lage.\n@c0@"
  en: "@aDebora@bIf you want to buy something, make sure you can afford it. Don't embarrass me like that again.\n@c0@"
  es: "@aStefania@bSi quieres comprare debes poder permitírtelo. No vuelvas a avergonzarme así, ¿capisci?\n@c0@"
  fr: "@aPandora@bSi tu veux acheter quelque chose, assure-toi d'abord que tu peux te le permettre. Ne me mets\r\nplus jamais dans l'embarras comme ça.\n@c0@"
  it: "@aViola@bMa che figura mi fai fare, %a000090?!\nLa prossima volta che vorrai comprare un oggetto, assicurati di avere i soldi necessari!\n@c0@"
  ja: "@a@bデボラ「買いたかったのなら　お金くらい\n\tちゃんと　用意しておきなさいよね。\n\tまったく　恥ずかしいったらないわ。\n@c0@"
450:
  de: "@aGriselda@bDie haben wohl eine recht große Stammkundschaft. Leute wie du können es sich einfach nicht verkneifen, komischen Kram zu sammeln.\n@c0@"
  en: "@aDebora@bThis place must do quite a trade with its regular customers. People like you can't resist collecting strange things.\n@c0@"
  es: "@aStefania@bEste sitio hará un gran negocio con los clientes habituales. La gente come tú no deja de coleccionar rarezas.\n@c0@"
  fr: "@aPandora@bCet endroit doit faire pas mal d'argent avec ses clients réguliers. Les gens comme toi ne peuvent pas s'empêcher de collectionner des trucs bizarres.\n@c0@"
  it: "@aViola@bQuesto negozio farà sicuramente affari d'oro, considerando quante persone sono interessate a oggetti rari e particolari...\n@c0@"
  ja: "@a@bデボラ「こういう店は　固定の客さえつかめば\n\tけっこう　商売になるものよ。\n\tたとえば　あんたみたいな　物好きとか。\n@c0@"
451:
  de: "@aGriselda@bKasinos machen Spaß, aber ich würde mich davon nie zu sehr aus der Ruhe bringen lassen. Vielleicht deswegen, weil ich bereits reich bin.\n@c0@"
  en: "@aDebora@bCasinos are fun, but I'd never get that worked up about them. Maybe it's because I'm already rich.\n@c0@"
  es: "@aStefania@bLos casinos son divertenti, ma no me gustan tanto. Como ya soy rica...\n@c0@"
  fr: "@aPandora@bC'est amusant, les casinos, mais je ne me mettrais jamais dans un état pareil pour ça. C'est peut-être parce que je suis déjà riche.\n@c0@"
  it: "@aViola@bCaro, mi raccomando: non sprecare soldi al casinò.\nIl denaro che abbiamo serve per i sedici abiti nuovi che hai promesso di regalarmi...\n@c0@"
  ja: "@a@bデボラ「カジノって　楽しいけれど\n\tそれほど　熱中できるものでもないわね。\n\t私が　金持ちだから　なのかしら。\n@c0@"
452:
  de: "@aGriselda@bKasinos sollen einfach nur Spaß machen. Wenn man erst mal anfängt, über Geld nachzudenken, ist Schluss mit Lustig.\n@c0@"
  en: "@aDebora@bCasinos are just fun and games. If you start to obsess over money, that's when the fun ends.\n@c0@"
  es: "@aStefania@bLos casinos son divertimento y giocco. Si te obsesionas con el dinero, se acabó el divertimento. \n@c0@"
  fr: "@aPandora@bLes casinos, ça n'est fait que pour jouer et se divertir. Si on commence à ne plus penser qu'à l'argent, c'est la fin du plaisir.\n@c0@"
  it: "@aViola@bIo non ho mai bisogno di soldi, caro.\nQuando mi serve del denaro lo chiedo a te...\n@c0@"
  ja: "@a@bデボラ「あくまで　カジノは　遊びだものね。\n\tお金になってしまったら　もう\n\t遊びじゃなくなるわ。\n@c0@"
453:
  de: "@aGriselda@bEr hat sich viel zu sehr reingesteigert. Ich finde es schon peinlich, ihn überhaupt nur anzusehen.\n@c0@"
  en: "@aDebora@bHe's far too carried away. I'm embarrassed just looking at him.\n@c0@"
  es: "@aStefania@bSe ha pasado tres pueblos. Veramente, me avergüenza solo mirarlo.\n@c0@"
  fr: "@aPandora@bIl se laisse bien trop emporter. Je me sens gênée\r\nrien qu'à le regarder.\n@c0@"
  it: "@aViola@bVia, andiamocene!\nNon voglio stare vicina a quest'indemoniato!\nPotrebbe essere contagioso!\n@c0@"
  ja: "@a@bデボラ「あの男　こうふんしすぎよ。\n\t見ているこっちが　恥ずかしくなるわ。\n@c0@"
454:
  de: "@aGriselda@bDas passiert, wenn man sich zu sehr mitreißen lässt. Die Hundert-Jeton-Automaten sind nur für Reiche. Das darf man nicht vergessen.\n@c0@"
  en: "@aDebora@bThis is what happens if you get too carried away. The hundred-token slots are only for rich people. It's important to remember that.\n@c0@"
  es: "@aStefania@bEsto es lo que pasa si no te controlas. Las máquinas de cien fichas son solo para ricos.\r\nEs veramente importante recordarlo.\n@c0@"
  fr: "@aPandora@bVoilà ce qui se passe quand on se laisse emporter. Les machines à sous à cent jetons sont réservées aux gens riches. C'est important de s'en souvenir.\n@c0@"
  it: "@aViola@bQuesto è il prezzo che si paga quando si agisce senza riflettere: la slot machine da cento gettoni può farti perdere un patrimonio in un baleno!\n@c0@"
  ja: "@a@bデボラ「調子に乗るから　こうなるのよ。\n\t１００コインスロットは　金持ちの楽しみ。\n\t分を　わきまえないとね。\n@c0@"
455:
  de: "@aGriselda@bWenn ich auftreten würde, dann würde ich gleich auf meinem eigenen Umkleideraum bestehen. Nicht, dass ich tatsächlich Künstlerin werden wollte.\n@c0@"
  en: "@aDebora@bIf I became a performer, I'd have my own changing room right from the start. Not that I ever want to become a performer, of course.\n@c0@"
  es: "@aStefania@bSi yo fuera artista tendría mi propio camerino desde el primer giorno. No es que tenga el menor interés en serlo, claro está.\n@c0@"
  fr: "@aPandora@bSi j'étais artiste, j'aurais ma loge privée dès le départ. Non que j'aie l'intention de devenir une artiste, évidemment.\n@c0@"
  it: "@aViola@bSe io fossi una cantante o una ballerina, oltre al camerino pretenderei quattro o cinque inservienti al mio totale ed esclusivo servizio.\n@c0@"
  ja: "@a@bデボラ「もし　私が　役者になったら\n\tすぐにでも　ひかえ室くらい　もらえるわ。\n\t別に　役者に　興味はないけど。\n@c0@"
456:
  de: "@aGriselda@bMann, was gibt es viele hässliche Leute! Sicher wäre es lustig, eine Weile die Leute zu beobachten. Hier treibt sich wirklich alles mögliche Volk herum.\n@c0@"
  en: "@aDebora@bThere are certainly plenty of uglies!\r\nI suppose it could be quite fun to people-watch.\r\nThe customers here are such a mixed bag.\n@c0@"
  es: "@aStefania@b¡Veramente hay gente regulera!\nSicuro que se lo pasa bien mirando a la gente.\nHay clientes de tutta condición.\n@c0@"
  fr: "@aPandora@bIl y a effectivement pas mal de truandsⓠ Ça doit être assez amusant de regarder les gens. La clientèle d'ici est plutôt mélangée.\n@c0@"
  it: "@aViola@bIo sono buona e bella, ma quando qualcuno mi fa arrabbiare divento MOLTO cattiva. Hai capito, %a000090? A buon intenditor, poche parole...\n@c0@"
  ja: "@a@bデボラ「確かに　見ているだけで\n\tあきない連中が　そろっているものね。\n\tある意味　スリルがあって　面白いわ。\n@c0@"
457:
  de: "@aGriselda@bWenn es den legendären Helden gibt, sollte er sich doch langsam mal blicken lassen! Aber herumreisen und ihn suchen ist ja auch ganz lustig.\n@c0@"
  en: "@aDebora@bIf the legendary hero exists, you'd think he'd just hurry up and show his face. Still, travelling about looking for him is quite good fun, I suppose.\n@c0@"
  es: "@aStefania@bSi el héroe legendario existiera, ya podría salir y dar la cara. Aunque viajar buscándolo es divertente.\n@c0@"
  fr: "@aPandora@bSi le héros légendaire existait, on pourrait penser qu'il se dépêcherait de montrer sa tête. Mais voyager à sa recherche est assez amusant, au fond.\n@c0@"
  it: "@aViola@bIo scommetto centomila monete che l'Eroe Leggendario esiste!\nCaro, per favore, passami centomila monete...\n@c0@"
  ja: "@a@bデボラ「勇者がいるなら　いるで\n\tさっさと　出てきてもらいたいものよね。\n\t探す旅は　それなりに　楽しいけど。\n@c0@"
458:
  de: "@aGriselda@bIch tanze viel besser als sie. Das muss ich dir irgendwann mal zeigen. Wenn ich in Stimmung bin.\n@c0@"
  en: "@aDebora@bI can dance much better than them. I'll have to show you one of these days. When I'm in the mood, that is.\n@c0@"
  es: "@aStefania@bYo bailo mucho mejor. Un día de estos te lo demostraré. Cuando esté de umore, claro.\n@c0@"
  fr: "@aPandora@bJe sais bien mieux danser qu'elles. Il faudra\r\nque je te montre ça, un de ces quatre.\r\nQuand je serai d'humeur, bien sûr.\n@c0@"
  it: "@aViola@bSo ballare molto meglio di loro.\nUna di queste sere organizzerò uno spettacolo privato esclusivamente per te, maritino mio bello...\n@c0@"
  ja: "@a@bデボラ「私のほうが　もっと　上手く踊れるわ。\n\tそのうち　見せてあげてもいいわよ。\n\t私の気が向いたら　だけど。\n@c0@"
459:
  de: "@aGriselda@bIch glaube, das ist kein berühmtes Lied. Aber schlecht ist es nicht.\n@c0@"
  en: "@aDebora@bI don't think it's a famous song.\nI suppose it's not too bad, though.\n@c0@"
  es: "@aStefania@bNo creo que sea una canzone famosa.\nAunque no está del todo mal.\n@c0@"
  fr: "@aPandora@bJe ne crois pas que ce soit une chanson connue.\r\nMais elle n'est pas trop mal quand même.\n@c0@"
  it: "@aViola@bChe ne pensi di questa canzone, caro?\nTi piace, vero?\nA me no. È banale, noioso, per nulla coinvolgente.\n@c0@"
  ja: "@a@bデボラ「流行の歌　って感じではないわね。\n\tでも　まあ　悪くはないんじゃないかしら。\n@c0@"
460:
  de: "@aGriselda@bPah! Ich habe viel mehr Klasse als sie. Aber egal. Geh einfach von der Bühne runter.\n@c0@"
  en: "@aDebora@bHuh! I'm much classier than she is.\nNever mind. Just get off the stage.\n@c0@"
  es: "@aStefania@b¡Ja! Yo soy mucho más picante que ella.\nDa igual, ya te estás bajando del escenario, ¿capisci?\n@c0@"
  fr: "@aPandora@bPfffⓠ De la classe, j'en ai bien plus qu'elle,\nalors descends de cette scène.\n@c0@"
  it: "@aViola@bIo sono infinitamente più sensuale di quella lì, %a000090.\nE tu lo sai bene, maritino mio...\n\n@c0@"
  ja: "@a@bデボラ「私のほうが　\n\tこの女よりも　ずっと色っぽいわよ。\n\tいいから　早く　ステージから下りなさい。\n@c0@"
461:
  de: "@aGriselda@bFordert sie mich etwa heraus? Wenn sie mich wirklich tanzen sehen will, bitte, das kann sie haben. Da-da-daa, da-da-da-daaa... Ⓠ Na bitte!\n@c0@"
  en: "@aDebora@bIs she challenging me? If she really wants to see me dance, I'll dance. Da-da-daa, Da-da-da-daaa... Ⓠ There!\n@c0@"
  es: "@aStefania@b¿Me está desafiando? Si de verdad quiere verme danzare, lo haré.\nDa-da-daa, Da-da-da-daaa... Ⓠ ¡Toma!\n@c0@"
  fr: "@aPandora@bElle me lance un défi, c'est çaⓡ Si elle veut vraiment me voir danser, je vais le faire.\nLa-la-laa, La-la-la-laaa... Ⓠ Et voilàⓠ\n@c0@"
  it: "@aViola@bMa che fa?! Vuole sfidarmi?!\nGliela faccio vedere io, a quella sgallettata!\nDa-da-daa, Da-da-da-daaa Ⓡ\n@c0@"
  ja: "@a@bデボラ「私に対する　挑戦かしら？\n\tそんなに見たいなら　踊ってあげるわよ。\n\tシャン　シャン　シャン♪\n@c0@"
462:
  de: "@aGriselda@bHe, du bist gar nicht mal schlecht. Mit mir natürlich nicht zu vergleichen.\n@c0@"
  en: "@aDebora@bHey, you're not actually that bad.\nNot a patch on me, of course.\n@c0@"
  es: "@aStefania@b¡Eh!, no lo haces mal del tutto. Salvando las distancias, claro.\n@c0@"
  fr: "@aPandora@bHé, tu n'es pas si mauvais, en fait. Bon, c'est sûr,\r\ntu ne m'arrives quand même pas à la cheville.\n@c0@"
  it: "@aViola@bNon sei malaccio, sai?\nCon un po' d'allenamento potresti quasi avvicinarti al mio livello di bravura...\n@c0@"
  ja: "@a@bデボラ「あら　あんた　やるじゃない。\n\tでも　私には　かなわないけど。\n@c0@"
463:
  de: "@aGriselda@bKeine Sorge. Halt dich nur an mich, dann kann dir nichts passieren.\n@c0@"
  en: "@aDebora@bThere's no need to worry. If you stick by me, there's nothing to fear.\n@c0@"
  es: "@aStefania@bNo hay por qué preocuparse. Si te quedas junto a me no tienes nada que temer.\n@c0@"
  fr: "@aPandora@bInutile de s'inquiéter. Si tu restes près de moi,\r\ntu n'as rien à craindre.\n@c0@"
  it: "@aViola@bNon preoccuparti, caro, non hai nulla da temere.\nResta sempre accanto a me e vedrai che nessun mostro oserà torcerti un capello.\n@c0@"
  ja: "@a@bデボラ「不安がらなくても　いいわよ。\n\tこの私に　ついてくれば\n\t怖いものなんて　なにもないわ。\n@c0@"
464:
  de: "@aGriselda@bHier ist wirklich der Hund begraben, was? Ich bin viel lieber in der Stadt als auf dem Land.\n@c0@"
  en: "@aDebora@bThere really is nothing here, is there?\r\nI much prefer being in town to being in\r\nthe countryside.\n@c0@"
  es: "@aStefania@bAquí no hay nada, ¿no?\r\nPrefiero cualquier città al campo.\n@c0@"
  fr: "@aPandora@bIl n'y a vraiment rien, ici, heinⓡ Je préfère de loin être en ville plutôt qu'à la campagne.\n@c0@"
  it: "@aViola@bI villaggi di campagna sono sereni, placidi, tranquilli...\nIn altre parole, sono una noia colossale.\nPreferisco di gran lunga le città.\n@c0@"
  ja: "@a@bデボラ「見事なまでに　何もない村ね。\n\t私は　もう少し　都会的な場所のほうが\n\t好みなんだけど。\n@c0@"
465:
  de: "@aGriselda@bIch gehe, %a000090.\nWas meinst du mit ⓞwarumⓟ? Bist du denn taub für dezente kleine Hinweise?\n@c0@"
  en: "@aDebora@bI'm leaving, %a000090.\nWhat do you mean, why?\nCan't you take a hint?\n@c0@"
  es: "@aStefania@bMe voy, %a000090.\n¿Cómo que por qué?\n¿Ma es que no lo has captado?\n@c0@"
  fr: "@aPandora@bJe m'en vais, %a000090.\nComment ça, pourquoiⓡ\nÀ ton avisⓡ...\n@c0@"
  it: "@aViola@bAndiamo via, %a000090.\nQuesto posto mi mette addosso una tristezza che la metà basta...\n@c0@"
  ja: "@a@bデボラ「帰るわよ　%a000090。\n\tどうして　って……\n\tあんたって　本当に　お人好しなのね。\n@c0@"
466:
  de: "@aGriselda@bDie Felder sehen furchtbar aus, das ist mal sicher. Vielleicht kommt das Monster hierher wüten, weil es auch nichts mehr zu fressen hat.\n@c0@"
  en: "@aDebora@bThe fields are in a mess, that's for sure.\r\nMaybe the monster's coming on the rampage\r\nbecause he's low on food too.\n@c0@"
  es: "@aStefania@bLos campos están fatal, è vero.\r\nQuizá el monstruo ataca porque también se está quedando sin alimentos.\n@c0@"
  fr: "@aPandora@bC'est vrai que les champs sont dans un sale état. Peut-être que ce monstre fait des ravages parce qu'il manque lui aussi de nourriture.\n@c0@"
  it: "@aViola@bCerto che i campi sono ridotti proprio male...\nSecondo me il mostro li devasta perché è spinto dalla fame.\n@c0@"
  ja: "@a@bデボラ「たしかに　ひどい　荒らされ方ね。\n\tでも　魔物が荒らしに来るってことは\n\t魔物も　エサが不足しているのかしら。\n@c0@"
467:
  de: "@aGriselda@bEs hat gar keinen Sinn, auf der Suche nach etwas zu essen in die Hügel zu gehen. Das ist, als würde man sein eigenes Todesurteil unterzeichnen.\n@c0@"
  en: "@aDebora@bThere's no point heading into the hills for food.\r\nThat's like signing your own death warrant.\n@c0@"
  es: "@aStefania@bNo tiene sentido ir a las montañas a por comida.\r\nEs firmar la sua sentencia de muerte.\n@c0@"
  fr: "@aPandora@bÇa ne sert à rien de partir pour chercher de la nourriture dans ce coin. Ça revient à signer son propre arrêt de mort.\n@c0@"
  it: "@aViola@bSe questa povera gente dovesse emigrare sarebbe un dramma... Non credo che troverebbero facilmente un'altra area fertile come questa.\n@c0@"
  ja: "@a@bデボラ「山まで　食べ物を探しに行くって\n\t意味じゃないわよね　今のは。\n\t自ら　死を選ぼうってこと……？\n@c0@"
468:
  de: "@aGriselda@bIch bin sicher, Papa würde Essen schicken, wenn ich ihn darum bitten würde. Aber damit wäre ihr Monsterproblem noch nicht aus der Welt geschafft.\n@c0@"
  en: "@aDebora@bI'm sure Papa would send some food if I asked\r\nhim. That wouldn't solve their problem with the monster, though.\n@c0@"
  es: "@aStefania@bEstoy segura de que il mio papino mandaría alimentos si se lo pido. Ma eso no resolvería el problema del monstruo.\n@c0@"
  fr: "@aPandora@bJe suis sûre que papa leur enverrait de la nourriture, si je le lui demandais. Mais ça ne résoudrait pas leur problème avec le monstre.\n@c0@"
  it: "@aViola@bIl mio paparino sarebbe più che felice di mandare qui un po' di provviste, se glielo chiedessi.\n㈡\nTuttavia, la cosa non risolverebbe il problema che questi poveretti hanno con il mostro che devasta i loro campi.\n@c0@"
  ja: "@a@bデボラ「パパにたのめば　すぐに\n\t食べ物を　送ってくれるだろうけど…　\n\t原因をどうにかしないと　意味がないわね。\n@c0@"
469:
  de: "@aGriselda@bIch hab nichts dagegen, ihnen zu helfen, %a000090, wenn du das willst. Und es könnte Spaß machen, das Ungeheuer zu erledigen.\n@c0@"
  en: "@aDebora@bI don't mind helping them if that's what you want to do, %a000090. Could be quite good fun putting that monster in its place.\n@c0@"
  es: "@aStefania@bNon mi dispiace ayudarlos si es lo que quieres, %a000090. Puede ser divertido poner a ese monstruo en il suo sitio.\n@c0@"
  fr: "@aPandora@bÇa ne m'ennuie pas de les aider, si c'est ce que tu veux faire, %a000090. Ça pourrait même être assez amusant de remettre ce monstre à sa place.\n@c0@"
  it: "@aViola@bChe ne diresti di aiutarli, %a000090? Faremmo una buona azione e ci terremmo in allenamento in vista delle nostre prossime avventure.\n@c0@"
  ja: "@a@bデボラ「私は　%a000090がその気なら\n\t手伝ってあげても　いいわよ。\n\t魔物をひざまづかせるのは　面白そうだし。\n@c0@"
470:
  de: "@aGriselda@bFür heute Nacht werd ich hiermit wohl vorliebnehmen müssen. Aber morgen suchst du uns besser eine anständige Herberge.\n@c0@"
  en: "@aDebora@bI suppose I'll put up with this place for tonight.\r\nYou'd better find us a decent inn tomorrow, though.\n@c0@"
  es: "@aStefania@bSupongo que por esta notte toleraré este sitio.\r\nMa domani, por tu bien, encuentra una posada decente.\n@c0@"
  fr: "@aPandora@bJe suppose que je peux m'accommoder de cet endroit pour ce soir. Mais tu as intérêt à nous trouver une auberge décente dès demain.\n@c0@"
  it: "@aViola@bChe cosa?!\nIO dovrei dormire QUI?!\n㈡\nPer stavolta passi, caro il mio %a000090, ma fai in modo che domani io abbia una sistemazione degna di me!\n@c0@"
  ja: "@a@bデボラ「今日は　ここでガマンしてあげる。\n\tでも　次は　もう少し\n\tちゃんとした宿を　探してよね。\n@c0@"
471:
  de: "@aGriselda@bSie ist sehr mager, nicht? Wahrscheinlich, weil sie nicht genug zu essen bekommt.\n@c0@"
  en: "@aDebora@bShe's very skinny, isn't she? Must be because she's not eating a decent diet.\n@c0@"
  es: "@aStefania@bVeramente está en los huesos, ¿no? Será porque no come adecuadamente.\n@c0@"
  fr: "@aPandora@bElle est vraiment maigre, nonⓡ Ça doit être\nparce qu'elle ne mange pas assez équilibré.\n@c0@"
  it: "@aViola@bHai visto? È magra come un chiodo...\nChissà da quanto tempo non fa un pasto degno di questo nome...\n@c0@"
  ja: "@a@bデボラ「いまの娘　ずいぶんやせてたわね。\n\tきっと　ロクなものを\n\t食べていないせいだわ……。\n@c0@"
472:
  de: "@aGriselda@bAlso lässt sich das Monster von den Vogelscheuchen nicht ins Bockshorn jagen... Egal. Dann werde ich es in Angst und Schrecken versetzen, bis es sich fügt!\n@c0@"
  en: "@aDebora@bSo the monster isn't intimidated by the scarecrows... Never mind. I'm sure I'll be able to terrify him\r\ninto submission!\n@c0@"
  es: "@aStefania@bAsí que al mostro no le asustan los spaventapasseri... ¡Da igual! ¡Seguro que yo logro aterrarlo y someterlo!\n@c0@"
  fr: "@aPandora@bAlors le monstre n'est pas intimidé par les épouvantailsⓡ Peu importe. J'arriverai à le terroriser suffisamment pour qu'il se soumetteⓠ\n@c0@"
  it: "@aViola@bE così la belva non ha paura nemmeno dello spaventamostri... Temo che non sarà facile sbarazzarci di una creatura tanto coraggiosa...\n@c0@"
  ja: "@a@bデボラ「コワモテかかしに\n\t動じない　化け物ね……。\n\tひざまずかせて　みたいわ。\n@c0@"
473:
  de: "@aGriselda@bIch glaube, ich habe westlich von hier eine Höhle gesehen. Vielleicht verbirgt sich das Monster dort.\n@c0@"
  en: "@aDebora@bI've got a feeling I saw a cave to the west of here. Maybe that's where the monster's hiding out.\n@c0@"
  es: "@aStefania@bMe parece que vi una grotta al oeste de aquí. Quizás ahí se haya escondido il mostro.\n@c0@"
  fr: "@aPandora@bJ'ai l'impression d'avoir vu une grotte, à l'ouest d'ici. Peut-être que c'est là que se cache le monstre.\n@c0@"
  it: "@aViola@bSe non ricordo male, a ovest di qui c'è una grotta...\nE se fosse quello il nascondiglio del mostro?\n@c0@"
  ja: "@a@bデボラ「そういえば　ここから西に\n\t洞くつが　あったような気がするわ。\n\t魔物は　そこから来ているのかもね。\n@c0@"
474:
  de: "@aGriselda@bEs greift vielleicht keine Menschen an, aber es greift ihr Essen an, und das läuft aufs Gleiche hinaus.\n@c0@"
  en: "@aDebora@bIt may not be attacking people, but it's attacking their food, which amounts to the same thing.\n@c0@"
  es: "@aStefania@bQuizás no ataque a la gente, ma les quita la comida, y al final es lo mismo.\n@c0@"
  fr: "@aPandora@bIl n'attaque peut-être pas les gens, mais il attaque leur nourriture, ce qui revient au même.\n@c0@"
  it: "@aViola@bMagari il mostro non attacca direttamente gli esseri umani ma, rubando loro tutto il cibo, li condanna a una morte lenta e dolorosa. Il risultato non cambia...\n@c0@"
  ja: "@a@bデボラ「人は　おそわないかもしれないけれど\n\t畑を荒らして　苦しめているんだから\n\t結局　魔物は　魔物なのよね。\n@c0@"
475:
  de: "@aGriselda@bGlaubst du, das war das Ungeheuer? Es könnte schwierig werden, diesem Ding Herr zu werden!\n@c0@"
  en: "@aDebora@bDo you think that was the monster? Could be a bit tricky getting the better of that thing!\n@c0@"
  es: "@aStefania@b¿Crees que fue el mostro? ¡Esto puede ser dificile...!\n@c0@"
  fr: "@aPandora@bTu crois que c'était le monstreⓡ Ça risque d'être un peu compliqué de venir à bout de cette choseⓠ\n@c0@"
  it: "@aViola@bCredi che quello fosse il mostro?\nUhm, ho la sensazione che sarà dura avere la meglio su una belva simile...\n@c0@"
  ja: "@a@bデボラ「あら　今のが　例の化け物……？\n\tあんなだと　ひざまずかせるのは\n\tむずかしそうね。\n@c0@"
476:
  de: "@aGriselda@bHier ist nichts zu sehen und zu hören. Nicht das kleinste Geräusch! Es ist viel zu ruhig, wenn du mich fragst. Eine unheimliche Stille.\n@c0@"
  en: "@aDebora@bThere's nothing to this place. Not even a sound!\r\nIt's far too quiet if you ask me. The silence is creepy.\n@c0@"
  es: "@aStefania@bAquí no hay nada. ¡Ni un ruido!\r\nDemasiado calmo para mi gusto. El silencio me pone nerviosa.\n@c0@"
  fr: "@aPandora@bIl n'y a rien, ici. Même pas un bruitⓠ C'est bien trop tranquille, si tu veux mon avis. Un tel silence fait froid dans le dos.\n@c0@"
  it: "@aViola@bQuesto silenzio non mi piace affatto...\nNon si sente nemmeno un rumore...\nStiamo in guardia, %a000090.\n@c0@"
  ja: "@a@bデボラ「ここは　何もない村だけど\n\t音までないとは　思わなかったわ。\n\t本当に　静かね……　怖いくらいに。\n@c0@"
477:
  de: "@aGriselda@bTypisch Landeier, die Türen zu dieser Zeit schon abzuschließen! In Mostroferrato würde dir das nicht passieren.\n@c0@"
  en: "@aDebora@bTypical country folk, locking their doors at this hour! You'd never find that in Mostroferrato.\n@c0@"
  es: "@aStefania@b¡Típicos campesinos, mira que cerrar a questa hora! Esto no pasa en Mostroferrato.\n@c0@"
  fr: "@aPandora@bC'est typique des gens de la campagne de verrouiller leurs portes à une heure pareilleⓠ On ne verrait jamais ça à Mostroferrato.\n@c0@"
  it: "@aViola@bStrano che sia chiuso a chiave...\nDi solito gli abitanti dei paesini di campagna non prendono questa precauzione.\n@c0@"
  ja: "@a@bデボラ「こんな時間に　カギをかけるだなんて\n\tさすがに　イナカなのね。\n\tサラボナでは　ありえないわ。\n@c0@"
478:
  de: "@aGriselda@bÜbernachten wir hier? Dann nehme ich das bequem aussehende Bett da drüben. Du kannst doch überall schlafen, nicht?\n@c0@"
  en: "@aDebora@bAre we going to stay here? If we are, I'm taking\r\nthat decent-looking bed over there. You'll sleep anywhere, right?\n@c0@"
  es: "@aStefania@b¿Vamos a quedarnos aquí? Si es así, yo me pido ese letto con tan buena pinta. Tú duerme donde sea.\n@c0@"
  fr: "@aPandora@bEst-ce qu'on va rester iciⓡ Si c'est le cas, je prends le lit là-bas, celui qui a l'air correct. Toi, tu peux dormir n'importe où, de toute façon, nonⓡ\n@c0@"
  it: "@aViola@bQuesta non è certo la migliore sistemazione che abbia mai avuto in vita mia, ma non è nemmeno la peggior... No, no: ripensandoci, è proprio la peggiore...\n@c0@"
  ja: "@a@bデボラ「ふわぁぁ～……　ここに泊まるの？\n\tなら　私　そっちのキレイな　ベッドね。\n\tあんたは　どこででも　ねられるでしょ？\n@c0@"
479:
  de: "@aGriselda@bViel Aufmerksamkeit hat mir noch nie etwas ausgemacht, aber es gefällt mir nicht, wie uns hier alle anstarren. Als hätten sie Angst vor mir.\n@c0@"
  en: "@aDebora@bI've never had a problem with getting lots of attention, but I don't like the way they stare here. It's like they're scared of me.\n@c0@"
  es: "@aStefania@bNunca me ha preocupado llamar la atenzione, ma no me gusta cómo miran aquí. Parece que me tienen miedo.\n@c0@"
  fr: "@aPandora@bÇa ne m'a jamais posé de problème d'attirer l'attention, mais je n'aime pas la façon dont ils me dévisagent, ici. C'est comme s'ils avaient peur de moi.\n@c0@"
  it: "@aViola@bSono abituata a sentirmi addosso gli sguardi ammirati degli uomini, ma stavolta credo di non essere al centro dell'attenzione per la mia bellezza...\n@c0@"
  ja: "@a@bデボラ「注目を　集めるのは\n\tキライじゃないけど　この視線は……\n\tまるで　この私を　恐れているみたいね。\n@c0@"
480:
  de: "@aGriselda@bNa, reizend! Nach allem, was wir durchgemacht haben, um ihr Problem für sie zu lösen, ist das der Dank?!\n@c0@"
  en: "@aDebora@bCharming! After we went to all that effort to figure out their problem for them, this is the thanks we get!\n@c0@"
  es: "@aStefania@b¡Ma non è possibile! Después de lo que hemos hecho para solventare el suo problema, ¡así nos lo agradecen!\n@c0@"
  fr: "@aPandora@bAh c'est charmantⓠ Après tous les efforts qu'on a faits pour résoudre leur problème à leur place,\nc'est tous les remerciements qu'on aⓠ\n@c0@"
  it: "@aViola@bMa come?!\nAbbiamo risolto il loro problema con il mostro e ci ringraziano così?!\n@c0@"
  ja: "@a@bデボラ「せっかく　原因を\n\t取りのぞいて　あげたっていうのに……\n\tこんな扱いを受けるのは　頭にくるわね。\n@c0@"
481:
  de: "@aGriselda@bDer Mann hat ja praktisch gezittert vor Angst! Aber es ist wohl verständlich.\n@c0@"
  en: "@aDebora@bThat man was actually shaking with fear!\nStill, I suppose that's understandable.\n@c0@"
  es: "@aStefania@b¡Ese hombre temblaba de miedo! Supongo que es comprensibile.\n@c0@"
  fr: "@aPandora@bCet homme tremblait littéralement de peurⓠ\nEnfin, je crois que c'est compréhensible.\n@c0@"
  it: "@aViola@bMa che dice?! Nessuno ha intenzione di fargli del male! Tuttavia, se non la pianta di frignare in quel modo, un cazzotto in testa glielo tiro volentieri!\n@c0@"
  ja: "@a@bデボラ「あのおじさん\n\t本当に　おびえていたわね。\n\tまあ　無理もないけど。\n@c0@"
482:
  de: "@aGriselda@bAber %a001210 würde ihm doch nie was tun! Er muss doch deswegen nicht um sein Leben fürchten, der alte Dummkopf.\n@c0@"
  en: "@aDebora@bBut %a001210 wouldn't do him any harm! He needn't be afraid for his life like that, the silly man.\n@c0@"
  es: "@aStefania@b¡Ma %a001210 no le haría ningún daño! Blandengue... No se puede tener tanto miedo.\n@c0@"
  fr: "@aPandora@bMais %a001210 ne lui ferait aucun malⓠ Il ne devrait pas craindre pour sa vie comme ça, l'idiot.\n@c0@"
  it: "@aViola@b%0%a001210 non farebbe male a una mosca!\nCioè, in combattimento è assolutamente letale, ma non se la prenderebbe mai con degli innocenti.\n@c0@"
  ja: "@a@bデボラ「%a001210は　いい子なのに……\n\tまぁ　いいわ。\n\t命だけは　助けてあげましょ。\n@c0@"
483:
  de: "@aGriselda@bDie alte Frau hat Mut. Ich wette, als junges Ding war sie ganz schön temperamentvoll.\n@c0@"
  en: "@aDebora@bThat old woman has courage. I'll bet she was a feisty girl like me back in her day.\n@c0@"
  es: "@aStefania@bEsa vecchia tiene valor. Seguro que en época era un terremoto como yo.\n@c0@"
  fr: "@aPandora@bCette vieille femme a du courage. Je parie que c'était une fille téméraire, comme moi, quand elle était jeune.\n@c0@"
  it: "@aViola@bUn porco come animale domestico?\nUhm...\nPerché no? Potrei lanciare una nuova moda...\n@c0@"
  ja: "@a@bデボラ「このおばあさん　度胸があるわね。\n\t若い頃は　きっと　私みたいに\n\tしっかりした女だったに　ちがいないわ。\n@c0@"
484:
  de: "@aGriselda@bKinder sind so unschuldig. Und sie kennen keine Furcht.\n@c0@"
  en: "@aDebora@bChildren are so innocent.\nThey know no fear, either.\n@c0@"
  es: "@aStefania@bQué inocentes son los bambini. No conocen el timore.\n@c0@"
  fr: "@aPandora@bLes enfants sont si innocents.\nIls ignorent la peur.\n@c0@"
  it: "@aViola@bNo, stavolta proprio non ho capito cos'ha detto.\nE, se proprio devo essere sincera, non m'importa nemmeno di saperlo...\n@c0@"
  ja: "@a@bデボラ「子供って　素直よね。\n\t怖いもの知らずでも　あるけど。\n@c0@"
485:
  de: "@aGriselda@bIch wusste schon lange, dass du ein Monsterbändiger bist.\n@c0@"
  en: "@aDebora@bI've known for a long time that you're a\r\nmonster tamer.\n@c0@"
  es: "@aStefania@bSé desde hace tiempo que eres domador de monstruos.\n@c0@"
  fr: "@aPandora@bJe le sais depuis longtemps que tu es un\r\ndresseur de monstres.\n@c0@"
  it: "@aViola@bHo sempre saputo che sei un grandissimo domatore di mostri, caro...\n@c0@"
  ja: "@a@bデボラ「あんたが　モンスター使いだなんて\n\tとっくの昔に　わかっていたわよ。\n@c0@"
486:
  de: "@aGriselda@bAber vor allem und in erster Linie bist du immer noch mein Leibdiener, vergiss das nicht!\n@c0@"
  en: "@aDebora@bBut you're still my servant first and foremost,\r\nand don't you forget it!\n@c0@"
  es: "@aStefania@bMa por encima de todo eres il mio servitore. ¡Que no se te olvide!\n@c0@"
  fr: "@aPandora@bMais tu es mon domestique avant toute autre chose, et ne t'avise pas de l'oublierⓠ\n@c0@"
  it: "@aViola@bMa io sono riuscita a domare te, %a000090.\nTi ho battuto, caro. Come sempre, del resto...\n@c0@"
  ja: "@a@bデボラ「だからといって\n\t私の　しもべであることに\n\t変わりはないけど。\n@c0@"
487:
  de: "@aGriselda@bEr muss nicht gleich betteln. Mich hält hier gar nichts. Gehen wir, %a000090.\n@c0@"
  en: "@aDebora@bThere's no need for him to beg. I'll gladly stay away. Let's go, %a000090.\n@c0@"
  es: "@aStefania@bNo tiene por qué suplicar, me largo encantada. Andiamo, %a000090.\n@c0@"
  fr: "@aPandora@bIl n'a pas besoin de supplier. Je serai très contente de partir d'ici. Allons-nous-en, %a000090.\n@c0@"
  it: "@aViola@bAndiamo via, %a000090.\nQui non ci vogliono...\n@c0@"
  ja: "@a@bデボラ「頼まれたって　もうこの村には\n\t来てあげやしないわ。\n\t行くわよ　%a000090。\n@c0@"
488:
  de: "@aGriselda@bIst mir doch schnurzpiepegal, was die von uns denken. Wir haben nichts Böses getan.\n@c0@"
  en: "@aDebora@bI couldn't care less what they think of us.\nWe haven't done anything wrong.\n@c0@"
  es: "@aStefania@bMe importa bien poco lo que piensen de nosotros. No hemos hecho niente malo.\n@c0@"
  fr: "@aPandora@bJe me moque royalement de ce qu'ils pensent de nous. Nous n'avons rien fait de mal.\n@c0@"
  it: "@aViola@bNon m'importa un fico secco di ciò che questa gentaglia irriconoscente pensa di noi!\nNon abbiamo fatto niente di male!\n@c0@"
  ja: "@a@bデボラ「気にすることはないわ。\n\t別に　私たちは\n\t後ろ暗いことなんて　何も　してないし。\n@c0@"
489:
  de: "@aGriselda@bVielleicht sollten wir sie als Belohnung nehmen. Eventuell kann sie uns mal nützlich sein.\n@c0@"
  en: "@aDebora@bMaybe we should take it as our reward.\r\nIt could come in useful.\n@c0@"
  es: "@aStefania@bDeberíamos llevárnoslo como ricompensa.\r\nPodría ser útil.\n@c0@"
  fr: "@aPandora@bPeut-être qu'on devrait le prendre en guise de récompense. Ça pourrait nous être utile.\n@c0@"
  it: "@aViola@bDirei di prenderlo come ricompensa per l'egregio lavoro che abbiamo svolto.\nChissà che un giorno o l'altro non ci torni utile...\n@c0@"
  ja: "@a@bデボラ「……まあ　お礼ってことで\n\tもらっていきましょうか。\n\t物事は　何でも　前向きに考えないとね。\n@c0@"
490:
  de: "@aGriselda@bHuh! Ich will mich mit dem scheußlichen Ding aber nicht abschleppen. Das ist deine Sache, %a000090. Verstanden?\n@c0@"
  en: "@aDebora@bUrgh! I don't want to carry it, though.\nThat's your job, %a000090. Got it?\n@c0@"
  es: "@aStefania@b¡Urg! Ma no quiero cargar con él.\nEse es il tuo lavoro, %a000090, ¿capisci?\n@c0@"
  fr: "@aPandora@bMais... beurkⓠ Je ne veux pas le porter moi-même. C'est ton boulot, %a000090. Comprisⓡ\n@c0@"
  it: "@aViola@bCi pensi tu a portarlo, %a000090?\nOh, scusa... Ho fatto una domanda inutile.\nÈ ovvio che lo porterai tu!\n@c0@"
  ja: "@a@bデボラ「あ　私は　そんなもの\n\t持ちたくなんかないから　持っていくなら\n\t%a000090が持つのよ。　わかったわね。\n@c0@"
491:
  de: "@aGriselda@bSo Furcht einflößend ist sie gar nicht, oder? Äh... wieso schaust du so zwischen ihr und mir hin und her?\n@c0@"
  en: "@aDebora@bIt's not that scary at all, is it? Um...why are you eyeing it up against me like that?\n@c0@"
  es: "@aStefania@bNo asusta nada, ¿eh? Mmm... ¿Ma por qué lo miras così?\n@c0@"
  fr: "@aPandora@bIl ne fait pas si peur que ça, quand même, heinⓡ Hum... Pourquoi tu le mets pour qu'il reagarde dans ma direction, comme çaⓡ\n@c0@"
  it: "@aViola@bQuesto spaventamostri non mi sembra poi tanto terrificante.\n@c0@"
  ja: "@a@bデボラ「全然　こわくないわよね。\n\tって　ちょっと　%a000090。\n\tどうして　私とかかしを　見比べてるのよ。\n@c0@"
492:
  de: "@aGriselda@bIch würde sagen, es ist sehr viel trotteliger von ihm, die gemeinen Gerüchte über uns zu glauben, als uns vertraut zu haben.\n@c0@"
  en: "@aDebora@bI'd say it's more loopy of him to believe the nasty rumours about us than it was for him to have trusted us in the first place.\n@c0@"
  es: "@aStefania@bEs más gañán per creer eso ahora que per haber confiado en nostoros al principio.\n@c0@"
  fr: "@aPandora@bÀ mon avis, c'est plus idiot de sa part de croire les vilaines rumeurs qui courent sur nous que de nous avoir fait confiance au départ.\n@c0@"
  it: "@aViola@bNe ho abbastanza! Li abbiamo liberati dal mostro, no?! E allora la piantassero! Se credono che li abbiamo ingannati, il problema è loro, non nostro!\n@c0@"
  ja: "@a@bデボラ「勝手に信じて　勝手な思いこみで\n\tうたがいを　かけてくるほうが\n\tよっぽど　バカなんじゃないかしら。\n@c0@"
493:
  de: "@aGriselda@bWenigstens eine Person ist hier noch nicht völlig verblödet. Mann! Was für ein hoffnungsloser Haufen von Landeiern!\n@c0@"
  en: "@aDebora@bAt least there's one person here that isn't a complete idiot. Huh! What a load of bumpkins!\n@c0@"
  es: "@aStefania@bAl menos hay alguien aquí que no es un completo stupido. ¡Ja! ¡Vaya panda de gañanes!\n@c0@"
  fr: "@aPandora@bIl y a au moins une personne ici qui n'est pas totalement stupide. Pfffⓠ Quelle bande de péquenaudsⓠ\n@c0@"
  it: "@aViola@bToh! Sembra che anche in questa mandria di burini deficienti e malfidati ci sia una persona intelligente!\nDev'essere l'eccezione che conferma la regola...\n@c0@"
  ja: "@a@bデボラ「この村にも　ちゃんと\n\t真実が見える人が　いたってわけね。\n\t……少し　救われたわね。\n@c0@"
494:
  de: "@aGriselda@bDu wirst doch wohl mit ein, zwei Monstern fertig, %a000090, oder? Dann kann ich mich in Ruhe zurücklehnen und das Schauspiel genießen.\n@c0@"
  en: "@aDebora@bYou'll be able to take care of a monster or two,\nwon't you, %a000090? I can just sit back and spectate.\n@c0@"
  es: "@aStefania@bPodrás encargarte de un mostro o dos, ¿no, %a000090? Yo me sentaré a ver qué tal lo haces.\n@c0@"
  fr: "@aPandora@bTu vas bien être capable de t'occuper d'un monstre ou deux, hein, %a000090ⓡ Je peux me contenter de rester assise ici à regarder.\n@c0@"
  it: "@aViola@bCaro, pensa tu a togliere di mezzo il mostro cattivo.\nIo resto qui a farmi le unghie.\nA proposito...\n㈡\nCerca di non rovinargli la pelliccia, che mi ci vorrei fare un cappottino.\n@c0@"
  ja: "@a@bデボラ「化け物の　１匹や２匹\n\tあんたなら　どうにでもできるでしょう？\n\t私は　ゆっくり　見物させてもらうわ。\n@c0@"
495:
  de: "@aGriselda@bDu glaubst doch wohl nicht, dass all die Knochen hier von...?\nSchon gut. Mir machen die keine Angst!\n@c0@"
  en: "@aDebora@bYou don't think all the bones around here are fromⓚⓛ Never mind. It doesn't scare me!\n@c0@"
  es: "@aStefania@bNo creerás que los huesos que hay por aquí sean de... Va bene. ¡No tengo miedo!\n@c0@"
  fr: "@aPandora@bTu ne crois quand même pas que tous les ossements qu'on voit ici sont ceux de... Peu importe. Ça ne me fait pas peurⓠ\n@c0@"
  it: "@aViola@bQueste ossa non saranno mica resti umani, eh?!\nMa non s'era detto che il mostro non attaccava gli uomini?! Odio ricevere informazioni inesatte!\n@c0@"
  ja: "@a@bデボラ「このあたりに　ちらばっている\n\t骨って　もしかして……\n\tべ　別に　怖いわけじゃないわよ。\n@c0@"
496:
  de: "@aGriselda@bHier sind überall Löcher. Pass auf, wo du hintrittst!\n@c0@"
  en: "@aDebora@bThere are holes all over the place.\nYou'd better watch where you're walking.\n@c0@"
  es: "@aStefania@bHay agujeros por tutti partes.\nCuidado con donde pisas.\n@c0@"
  fr: "@aPandora@bIl y a des trous partout. Tu as intérêt à regarder où tu mets les pieds.\n@c0@"
  it: "@aViola@bCi sono buche ovunque...\nSarà meglio procedere con estrema cautela...\n@c0@"
  ja: "@a@bデボラ「そこいらじゅう　穴だらけね。\n\t足もとに　気をつけなさいよ。\n@c0@"
497:
  de: "@aGriselda@bWenn wir in ein Loch fallen, fällst du zuerst. Dann falle ich wenigstens weich. Blaue Flecken stehen mir nämlich gar nicht!\n@c0@"
  en: "@aDebora@bIf we're going to fall down a hole, you're going first. And you're going to break my fall! I won't look too kindly on you if you don't.\n@c0@"
  es: "@aStefania@bSi vamos a caer por un agujero, tú vas primero. ¡Y más te vale que frenes la mia caída o te enteras! ¿Capisci?\n@c0@"
  fr: "@aPandora@bSi on doit tomber dans un trou, tu passes le premier. Et ensuite, tu amortis ma chuteⓠ Ça risque de mal se passer pour toi si tu ne le fais pas.\n@c0@"
  it: "@aViola@bPrendimi per mano, così se cadrò in una buca potrai tenermi.\n㈡\nSe invece fossi tu a cadere, ricordati di mollare istantaneamente la presa. Non vorrai mica che precipiti con te, vero?!\n@c0@"
  ja: "@a@bデボラ「穴に落ちるなら　あんたが先よ。\n\tそして　私を抱きとめるの。\n\t失敗は　許さないから　そのつもりでね。\n@c0@"
498:
  de: "@aGriselda@bOb's dem Soldaten wohl gut geht? Er ist eine ziemliche Memme, nicht? Du könntest bestimmt hundertmal runterfallen und wärst immer noch putzmunter.\n@c0@"
  en: "@aDebora@bDo you think that soldier's alright? He's a bit of a wimp, isn't he? I reckon you could fall down a hundred times and still live to tell the tale.\n@c0@"
  es: "@aStefania@b¿Estará bien ese soldado? Es un mezza calzetta. Tú podrías caerte cien veces y sobrevivir.\n@c0@"
  fr: "@aPandora@bTu crois que ce soldat va bienⓡ C'est un peu une mauviette, nonⓡ Je parie que tu pourrais tomber une centaine de fois sans te casser le cou.\n@c0@"
  it: "@aViola@bSanto cielo, che imbranato!\nE io che chiamavo te ⓕpappamolleⓖ!\nCaro, potrai mai perdonarmi?\n@c0@"
  ja: "@a@bデボラ「今の　大丈夫だったかしら。\n\tあんたなら　１００回くらい　落ちても\n\t生きてそうだけど……。\n@c0@"
499:
  de: "@aGriselda@bEr ist derjenige, der uns einen Schrecken eingejagt hat, nicht umgekehrt! Wenn du mich so erschreckt hättest, hätte ich dich zurück ins Loch geschubst!\n@c0@"
  en: "@aDebora@bHe's the one who gave us a fright, not the other way around! I'd have chucked you down the hole again if you made me jump like that!\n@c0@"
  es: "@aStefania@bMa, ¡fue él quien nos asustó y no al revés! ¡Si me vuelve a asustar de ese modo le devuelvo al agujero!\n@c0@"
  fr: "@aPandora@bC'est lui qui nous a fichu la frousse, pas l'inverseⓠ Je t'aurais repoussé dans le trou si tu m'avais causé une frayeur pareilleⓠ\n@c0@"
  it: "@aViola@bChe colpa abbiamo noi se questo tipo sobbalza per un nonnulla? Farebbe meglio a starsene a casa, attaccato alla sottana della madre...\n@c0@"
  ja: "@a@bデボラ「おどろいたのは　こっちの方よ。\n\t相手が　あんただったら　罰として\n\tもう一度　穴から　落としてたわ。\n@c0@"
500:
  de: "@aGriselda@bDas also ist das berühmte Ungeheuer? Hmm... Eine prachtvolle Kreatur wie diese im Gefolge zu haben, das würde mir wahrscheinlich gut stehen.\n@c0@"
  en: "@aDebora@bSo that's the famous monster? Hmm... Having a magnificent creature like that as a pet would probably reflect quite well on me.\n@c0@"
  es: "@aStefania@b¿Este es el famoso mostro? Mmm... Tener una criatura espléndida como esta de mascota seguro que me da estatus.\n@c0@"
  fr: "@aPandora@bAlors c'est le fameux monstreⓡ Mmm... Posséder une créature aussi magnifique comme animal domestique me mettrait sans doute à mon avantage.\n@c0@"
  it: "@aViola@bÈ quello il mostro feroce che ha seminato il terrore a Punta Campestre?\n㈡\nMa che carino! È bello, forte, maestoso...\nNon mi dispiacerebbe averlo come animale da compagnia...\n@c0@"
  ja: "@a@bデボラ「あれが　ウワサの化け物なの？\n\tあんな　りっぱなトラを　ペットにしたら\n\t私の　いい引き立て役に　なりそうね。\n@c0@"
501:
  de: "@aGriselda@bIst nicht wahr! Dieses Biest gehörte dir, als du noch klein warst?\n@c0@"
  en: "@aDebora@bNo way! This beast used to be your pet when you were little?\n@c0@"
  es: "@aStefania@b¡Anda ya! ¿Que este animale era tu mascota de bambino?\n@c0@"
  fr: "@aPandora@bSans rireⓡ Cette bestiole était ton animal de compagnie quand tu étais petitⓡ\n@c0@"
  it: "@aViola@bQuindi conosci questa belva fin da quando eri piccolo...\n@c0@"
  ja: "@a@bデボラ「えっ？　このトラ\n\tあんたが　子供の頃に　飼ってた\n\tペットだったの！？\n@c0@"
502:
  de: "@aGriselda@bUnd in all den Jahren seit damals hat es für dich auf das Schwert deines Vaters aufgepasst. Es stimmt wohl doch, dass ein Tier seinem Herrn ähnlich ist!\n@c0@"
  en: "@aDebora@bAnd he looked after your father's sword for all those years since. It's true that pets resemble\r\ntheir masters.\n@c0@"
  es: "@aStefania@bY ha cuidado de la espada del tuo papino todos estos años... Es cierto que las mascotas se parecen a los amos.\n@c0@"
  fr: "@aPandora@bEt depuis, il a veillé sur l'épée de ton père pendant toutes ces années. C'est vrai que les animaux ressemblent à leurs maîtres.\n@c0@"
  it: "@aViola@bE questa creatura ha fatto la guardia alla spada di tuo padre per tutti questi anni... È proprio vero che a volte i mostri hanno più cuore di noi umani!\n@c0@"
  ja: "@a@bデボラ「%a000090と　別れた後も\n\tあんたのパパの　剣を守っていたなんて。\n\tペットは飼い主に似る　って　本当なのね。\n@c0@"
503:
  de: "@aGriselda@bIch glaube, ich habe die Zeichen auf dem Schwert deines Vaters schon mal irgendwo gesehen. Aber wo war das nur...?\n@c0@"
  en: "@aDebora@bI can't help feeling that I've seen the insignia on your father's sword somewhere before. Now where can it have been...?\n@c0@"
  es: "@aStefania@bNo puedo evitar la sensazione de que he visto antes la insignia de la spada d'il tuo pappio. ¿Ma, dove?\n@c0@"
  fr: "@aPandora@bJe ne peux pas m'empêcher de penser que j'ai déjà vu quelque part le symbole qui figure sur l'épée de ton père. Mais où cela pouvait-il bien êtreⓡ...\n@c0@"
  it: "@aViola@bSono sicurissima di aver già visto l'emblema che campeggia sulla spada di tuo padre, ma non riesco a ricordare dove...\n@c0@"
  ja: "@a@bデボラ「それにしても　あんたのパパの剣に\n\tついている　紋章を　どこかで見たような\n\t気がするんだけど……　どこだったかしら。\n@c0@"
504:
  de: "@aGriselda@bWie genau willst du das eigentlich den Bauerntölpeln in Bauernsiepen erklären? Ich kann mir nicht vorstellen, dass das denen gefallen wird.\n@c0@"
  en: "@aDebora@bHow exactly are you planning on explaining all of this to those bumpkins in Hay? I don't think they're going to like this somehow.\n@c0@"
  es: "@aStefania@b¿Cómo piensas explicar tutto esto a los gañanes de Puebla del Heno? No creo que les vaya a hacer gracia.\n@c0@"
  fr: "@aPandora@bComment comptes-tu expliquer tout ça à tous ces péquenauds de Chaumesⓡ Ça risque fort de ne pas leur plaire, à mon avis.\n@c0@"
  it: "@aViola@bAdesso non ci resta che spiegare agli abitanti di Punta Campestre che il mostro è amico nostro e che non hanno nulla da temere da lui...\n㈡\nVedrai come saranno contenti! Si sentiranno così sollevati per essersi liberati dalla sua minaccia che ci riserveranno un'accoglienza da trionfatori!\n@c0@"
  ja: "@a@bデボラ「それはそうと　カボチの人たちには\n\tこのことを　どうやって説明するつもり？\n\tやっかいなことに　なりそうだけど。\n@c0@"
505:
  de: "@aGriselda@bDiese Stadt ist ein richtiger Irrgarten. Ich verirre mich ja niemals, aber ich mache mir etwas Sorgen um dich, %a000090.\n@c0@"
  en: "@aDebora@bThis town's like a maze. I never lose my way, but I'm a bit worried that you might, %a000090.\n@c0@"
  es: "@aStefania@bEste sitio es come un labirinto. Yo nunca me pierdo, ma temo per te, %a000090.\n@c0@"
  fr: "@aPandora@bCette ville est un vrai labyrinthe. Je ne me perds jamais, mais j'ai bien peur que ça t'arrive, %a000090. \n@c0@"
  it: "@aViola@bQuesta città è un labirinto, %a000090, e io non ho nessuna voglia di procedere alla cieca...\n㈡\nVai avanti tu, caro: tornerai a prendermi dopo che avrai capito che strada fare. Io resterò qui buona buona a limarmi le unghie.\n@c0@"
  ja: "@a@bデボラ「何なのよ　この　迷路みたいな町は。\n\t私なら　迷ったりはしないけど\n\t%a000090は大丈夫かしら。\n@c0@"
506:
  de: "@aGriselda@bHier lebt der Mann, der dir den Teleportationszauber beigebracht hat?\n@c0@"
  en: "@aDebora@bThe man who taught you the Zoom spell lives here?\n@c0@"
  es: "@aStefania@b¿El uomo que te enseñó Telerregreso vive aquí?\n@c0@"
  fr: "@aPandora@bC'est ici que vit l'homme qui t'a appris\nle sort Téléportationⓡ\n@c0@"
  it: "@aViola@bLa persona che ti ha insegnato ⓕTeletrasportoⓖ vive qui?\n@c0@"
  ja: "@a@bデボラ「あんたに　ルーラの呪文をくれた人が\n\tこの町に　住んでいるの？\n@c0@"
507:
  de: "@aGriselda@bDu solltest ihm dankbar sein, weißt du. Er hat es dir erspart, mich über die Gebirgszüge tragen zu müssen.\n@c0@"
  en: "@aDebora@bYou should be grateful to him, you know. He's saved you the task of carrying me across mountain ranges.\n@c0@"
  es: "@aStefania@bDeberías estarle veramente agradecido. Te ha evitado tener que llevarme a caballito por los pasos de montagna.\n@c0@"
  fr: "@aPandora@bTu devrais lui en être reconnaissant, tu sais. Il t'a épargné la peine d'avoir à me porter pour franchir les chaînes de montagnes.\n@c0@"
  it: "@aViola@bChe il cielo lo conservi in salute a lungo! Senza quell'incantesimo, non so nemmeno io quanto tempo avremmo perso per spostarci da un posto all'altro!\n@c0@"
  ja: "@a@bデボラ「その人に　感謝しなさい。\n\tおかげで　%a000090が　私をおぶって\n\t山をこえたりしなくてすんでるんだし。\n@c0@"
508:
  de: "@aGriselda@bWenn der Rauch ihn zum Husten reizt, warum zieht er nicht einfach um? Bei manchen Leuten fragt man sich wirklich, wo sie ihren Verstand gelassen haben.\n@c0@"
  en: "@aDebora@bIf the smoke's making him cough, then why doesn't he just move? Some people don't have the brains they were born with!\n@c0@"
  es: "@aStefania@bSi el humo le hace toser, ¿por qué no se mueve? ¡Veramente, hay gente que no sé dónde tiene el cerebro!\n@c0@"
  fr: "@aPandora@bSi la fumée le fait tousser, pourquoi il ne déménage pas, simplementⓡ Certaines personnes ne se servent pas de la cervelle qu'on leur a donnée, décidémentⓠ\n@c0@"
  it: "@aViola@bArgh!\nIl fumo ostruirà i pori della mia pelle, impedendo la corretta traspirazione!\n㈡\n%0%a000090!\nSoffia via il fumo cattivo che minaccia la bellezza della tua cara mogliettina!\n@c0@"
  ja: "@a@bデボラ「あんなに　セキがでるほど\n\tけむたいのなら　どうしてここに\n\tいるのかしら。　理解に苦しむわ。\n@c0@"
509:
  de: "@aGriselda@bIch bin überrascht, dass sogar hier draußen noch von Tifortu geredet wird. Dabei liegt inzwischen ein halber Kontinent zwischen Tifortu und uns!\n@c0@"
  en: "@aDebora@bI'm surprised to hear talk of Coburg all the way out here. We're half the world away!\n@c0@"
  es: "@aStefania@bMe sorprende oír hablar de Trastámara aquí. ¡Estamos a mezzo mondo de distancia!\n@c0@"
  fr: "@aPandora@bJe suis surprise d'entendre parler de Cobourg jusque dans un endroit pareil. On est presque à l'autre bout de la planèteⓠ\n@c0@"
  it: "@aViola@bAh, interessante!\nChissà se quel tipo ha qualche altra notizia di cronaca mondana da segnalare...\n@c0@"
  ja: "@a@bデボラ「こんな所にまで　ラインハットの話が\n\t流れて　きているだなんて　おどろいたわ。\n\tほとんど　世界の反対側　なのに。\n@c0@"
510:
  de: "@aGriselda@bJa, sie war recht hübsch. Das will ich gern zugeben. Aber sie besitzt natürlich nicht mal annähernd meine Schönheit.\n@c0@"
  en: "@aDebora@bYes, she was quite pretty. I don't mind admitting that. But she didn't possess anything like my beauty.\n@c0@"
  es: "@aStefania@bSí, era bastante mona. No me importa admitirlo. Ma ni se acercaba a la mia bellezza.\n@c0@"
  fr: "@aPandora@bOui, elle était assez jolie. Je suis prête à l'admettre. Mais elle était loin de posséder ma beauté.\n@c0@"
  it: "@aViola@bLa moglie di Robert è una donna attraente.\nCerto non è bella come me, ma del resto si sa che di Viola ce n'è una sola...\n@c0@"
  ja: "@a@bデボラ「たしかに　美人では　あったわね。\n\t私も　そのくらいは　認めているのよ。\n\tそれでも　私のほうが　キレイだけど。\n@c0@"
511:
  de: "@aGriselda@bHier kann man sich ja wirklich schlecht orientieren. Ob sich die Leute hier wohl je beim Einkaufen verirren?\n@c0@"
  en: "@aDebora@bIt is quite a frustrating place to navigate.\r\nI wonder if the people here ever get lost\r\non their way to the shops.\n@c0@"
  es: "@aStefania@bEste sitio puede ser veramente frustrante.\nMe pregunto si la gente se perderá aquí de camino a las tiendas.\n@c0@"
  fr: "@aPandora@bC'est assez pénible de se déplacer dans cet endroit. Je me demande si les gens se perdent parfois quand ils vont faire les boutiques.\n@c0@"
  it: "@aViola@bCaro, non dirmi che ci siamo persi anche noi...\n@c0@"
  ja: "@a@bデボラ「本当に　歩きづらい町よね。\n\tここの住人は　買い物に行くたびに\n\t迷ったりは　しないのかしら？\n@c0@"
512:
  de: "@aGriselda@bHier ist es ganz hübsch. Vielleicht mache ich ein kleines Nickerchen. Du hältst Wache, ja, %a000090?\n@c0@"
  en: "@aDebora@bIt is quite pleasant here. Maybe I'll take a little nap. You'll stand guard, won't you, %a000090?\n@c0@"
  es: "@aStefania@bEste sitio es bastante piacevole. Quizá me eche un sueñecito. Tú monta guardia, %a000090, ¡y no te duermas!\n@c0@"
  fr: "@aPandora@bOn est plutôt bien, ici. Je vais peut-être y faire un petit somme. Tu montes la garde, d'accord, %a000090ⓡ\n@c0@"
  it: "@aViola@bQui si sta proprio bene!\nQuasi quasi mi faccio una bella dormitina.\n㈡\nSenti, %a000090, perché non vai a prendermi qualcosa da mangiare mentre io riposo?\nGrazie, caro.\n@c0@"
  ja: "@a@bデボラ「たしかに　気持ちがいいわね。\n\tここで　お昼寝でもしようかしら。\n\tあ　%a000090は　見はりをよろしくね。\n@c0@"
513:
  de: "@aGriselda@bKomisch. Als ich sie gerade beobachtet habe, hatte ich ein merkwürdiges Déjà-vu-Gefühl. Das muss ich mir wohl eingebildet haben.\n@c0@"
  en: "@aDebora@bThat's strange. Watching her gave me an odd sense of déjà vu. I must just be imagining it, though.\n@c0@"
  es: "@aStefania@bEs molto raro. Al verla tuve una sensazione de déjà vu. Serán imaginaciones mías.\n@c0@"
  fr: "@aPandora@bC'est étrange. Quand je la regarde, j'ai comme une impression de déjà-vu. Mais ça doit être mon imagination.\n@c0@"
  it: "@aViola@bChe donna odiosa!\nSentila come sbraita! Le donne che si comportano da despota sono le più antipatiche che esist...\n㈡\nEhm, bella giornata oggi...\nVero, caro...?\nEhm...\n@c0@"
  ja: "@a@bデボラ「おかしいわね。　これって\n\tどこかで　見たことのあるような光景だわ。\n\t気のせいだと　思うけど。\n@c0@"
514:
  de: "@aGriselda@bWas für ein Taugenichts von einem Diener! Seine Chefin verfügt ganz offenbar nicht über meine Menschenkenntnis.\n@c0@"
  en: "@aDebora@bWhat a useless servant! His mistress obviously doesn't have the good eye for people that I have.\n@c0@"
  es: "@aStefania@b¡Qué inutile servitore! Su signora veramente no tiene mi ojo para el servicio.\n@c0@"
  fr: "@aPandora@bQuel domestique inutileⓠ De toute évidence, sa maîtresse n'a pas un aussi bon œil que moi quand il s'agit de juger les gens.\n@c0@"
  it: "@aViola@bLa colpa non è sua, ma della sua padrona!\nAvrebbe dovuto accorgersi prima di essersi messa in casa un servitore incapace!\n@c0@"
  ja: "@a@bデボラ「本当に　使えない　しもべだわね。\n\t後ろにいるおばさんは　私とちがって\n\tずいぶんと　人を見る目がないのね。\n@c0@"
515:
  de: "@aGriselda@bWenn er einen neuen Zauber herausfindet, müssen wir sofort wieder hierherkommen und ihn erlernen.\n@c0@"
  en: "@aDebora@bIf he manages to come up with a new spell, we'll have to come and learn it straight away.\n@c0@"
  es: "@aStefania@bSi logra dar con un nuevo conjuro tendremos que venir a aprenderlo subito.\n@c0@"
  fr: "@aPandora@bS'il arrive à mettre au point un nouveau sort,\r\nil faudra qu'on vienne ici pour l'apprendre immédiatement.\n@c0@"
  it: "@aViola@bSe quello scienziato riuscirà a recuperare qualche altro incantesimo, dovrai immediatamente tornare qui per chiedergli di insegnartelo!\n@c0@"
  ja: "@a@bデボラ「ルーラ以外にも\n\t便利な呪文が　復活したら\n\tさっそく　覚えに来ましょうね。\n@c0@"
516:
  de: "@aGriselda@bDas heißt, du kannst ihn erlernen. Dann kannst du ihn für mich wirken, wenn ich es für nötig erachte.\n@c0@"
  en: "@aDebora@bWell, you can learn it. I'll just have you use it for me whenever I feel like it.\n@c0@"
  es: "@aStefania@bBueno, a aprenderlo tú. Luego te ordenaré que lo uses para lo que me apetezca.\n@c0@"
  fr: "@aPandora@bEnfin, c'est toi qui l'apprendras. Je te demanderai juste de l'utiliser pour moi quand j'en aurai envie.\n@c0@"
  it: "@aViola@bCosì, dopo che lo avrai imparato, potrai usarlo tutte le volte che vorrò.\n@c0@"
  ja: "@a@bデボラ「覚えるのは　もちろん%a000090よ。\n\t私は　ただ　利用させてもらえれば\n\tいいだけだから。\n@c0@"
517:
  de: "@aGriselda@bEr hat sicher viel Zeit, wenn er hier herumstehen und darauf warten kann, dass die Schänke aufmacht.\n@c0@"
  en: "@aDebora@bHe must have plenty of time on his hands to be just standing around here waiting for the place to open.\n@c0@"
  es: "@aStefania@bDebe de sobrarle el tempo para estar ahí, dando vueltas esperando a que abran.\n@c0@"
  fr: "@aPandora@bIl doit avoir beaucoup de temps à perdre pour rester ici sans rien faire, à attendre que ça ouvre.\n@c0@"
  it: "@aViola@bPotrebbe bere dell'acqua, no?\nL'acqua è la bevanda della bellezza e della salute: non ingrassa e lava via le impurità.\n@c0@"
  ja: "@a@bデボラ「開店前から　待っているだなんて\n\tこの男　本当に　ヒマなのね。\n@c0@"
518:
  de: "@aGriselda@bHa! Er dachte, du würdest in der Schänke arbeiten! Da sieht man mal wieder, dass du tatsächlich der Dienertyp bist, %a000090.\n@c0@"
  en: "@aDebora@bHa! He thought you worked in the pub!\nJust goes to show that you look like the\nserving type, %a000090.\n@c0@"
  es: "@aStefania@b¡Ja! ¡Creía que trabajabas en el bar!\nEso demuestra que tienes pinta de servitore, %a000090.\n@c0@"
  fr: "@aPandora@bHaⓠ Il croyait que tu travaillais à la taverneⓠ Ça prouve que tu as bien l'air du genre à faire le service, %a000090.\n@c0@"
  it: "@aViola@bAh ah ah! Ti ha preso per il cameriere, %a000090!\n...\n㈡\nEhi!\nCome si permette di scambiare il mio adorato maritino per un cameriere?!\n@c0@"
  ja: "@a@bデボラ「店員さんと　まちがえられるなんて\n\tさすが　%a000090は　人に\n\t使われるタイプなだけあるわね。\n@c0@"
519:
  de: "@aGriselda@bSicher verbrauchen sie all das doch nicht an einem Abend? Ah... Das erklärt natürlich, warum es in der Stadt aussieht wie Kraut und Rüben.\n@c0@"
  en: "@aDebora@bSurely they don't get through that much in a night? Ah... That explains why the town's so higgledy-piggledy.\n@c0@"
  es: "@aStefania@bNo podrán con todo eso en una notte, ¿no? Ah... Eso explica la confusione en este pueblo.\n@c0@"
  fr: "@aPandora@bIls n'arrivent quand même pas à descendre tout ça rien qu'en une nuitⓡ Ah... Mais ça expliquerait pourquoi la ville est aussi désordonnée.\n@c0@"
  it: "@aViola@bNon ho mai assaggiato il latte d'orco...\n@c0@"
  ja: "@a@bデボラ「あの量が　ひと晩用ですって！？\n\t……なるほどね　酔っぱらいが多いから\n\tあんなふうに　道が曲がっているんだわ。\n@c0@"
520:
  de: "@aGriselda@bWarum? Weil die Leute, die sie geplant haben, alle blau wie ein Veilchen waren, darum!\n@c0@"
  en: "@aDebora@bWhy? Because the people who planned it were all three sheets to the wind, of course!\n@c0@"
  es: "@aStefania@b¿Por qué? ¡Porque la gente que lo construyó estaba veramente borracha!\n@c0@"
  fr: "@aPandora@bPourquoiⓡ Mais parce que les gens qui l'ont conçue en tenaient une sévère, évidemmentⓠ\n@c0@"
  it: "@aViola@bE nemmeno immaginavo che gli orchi si potessero mungere, a dirla tutta.\n@c0@"
  ja: "@a@bデボラ「なんで　って…\n\t町を設計した人が　酔っぱらいながら\n\t仕事をしたからに　きまってるでしょ。\n@c0@"
521:
  de: "@aGriselda@bDer Mann lügt. So leicht lasse ich mich nicht hinters Licht führen.\n@c0@"
  en: "@aDebora@bThat man's lying. He can't pull the wool over my eyes that easily.\n@c0@"
  es: "@aStefania@bEse uomo es un mentiroso. A mí no me engaña tan facilmente.\n@c0@"
  fr: "@aPandora@bCet homme ment. Je ne me laisse pas embobiner\r\naussi facilement.\n@c0@"
  it: "@aViola@bPerché ha detto che la Delizia di Milleventi è robaccia? Credevo che fosse una bevanda famosa in tutto il mondo per il suo gusto unico e inimitabile...\n@c0@"
  ja: "@a@bデボラ「あの男……　ウソをついているわね。\n\t私は　そうカンタンに\n\tだまされたりは　しないわよ。\n@c0@"
522:
  de: "@aGriselda@bIm Moment sind wir nur zu zweit, aber sicher werden wir eines Tages eine größere Familie haben, also solltest du uns besser eine Villa organisieren.\n@c0@"
  en: "@aDebora@bIt's just the two of us at the moment, but I'm sure we'll have a bigger family one day, so you'd better hurry up and sort us out a mansion.\n@c0@"
  es: "@aStefania@bAhora solo estamos los dos, ma seguro que un día tendremos famiglia, así que ya puedes ir consiguiendo presto un palazzo.\n@c0@"
  fr: "@aPandora@bPour l'instant nous ne sommes que tous les deux, mais je suis sûre que la famille s'agrandira un jour. Tu dois donc te dépêcher de nous trouver un manoir.\n@c0@"
  it: "@aViola@bCaro, prima e poi avremo dei figli, e per allora ci servirà una casa spaziosa e confortevole.\n㈡\nPerché non cominci a informarti se c'è qualche bel castello in vendita da queste parti?\n@c0@"
  ja: "@a@bデボラ「今は　２人きりだけれど…　そのうち\n\tここみたいに　人数が増えるでしょうから\n\tそうなる前に　立派な屋敷を　用意してね。\n@c0@"
523:
  de: "@aGriselda@bSie macht sich zu viele Sorgen. Aber bei all dem Rauch, der da herausquillt, könnte er tatsächlich mal ein Feuer verursachen.\n@c0@"
  en: "@aDebora@bShe's worrying too much. Mind you, he could well start a fire with all that smoke billowing away.\n@c0@"
  es: "@aStefania@bSe preocupa troppo. Claro, que puede empezar un incendio con tanto humo.\n@c0@"
  fr: "@aPandora@bElle s'inquiète beaucoup trop. Quoique, c'est vrai\r\nqu'il pourrait bien mettre le feu avec toute la fumée qui s'élève dans tous les coins.\n@c0@"
  it: "@aViola@bComprendo la sua ansia: basta una scintilla malandrina, una folata di vento improvvisa e...\nPuf! La città finisce in cenere!\n@c0@"
  ja: "@a@bデボラ「心配しすぎ……\n\tと　言いたいところだけど　たしかに\n\t火事は　気をつけてほしいわ。\n@c0@"
524:
  de: "@aGriselda@bAlso, ich bin eigentlich immer am glücklichsten, wenn ich tun kann, was ich will.\n@c0@"
  en: "@aDebora@bI suppose the thing that makes me happiest is being able to do whatever I please.\n@c0@"
  es: "@aStefania@bSupongo que lo que más felice me hace es poder hacer lo que me apetece.\n@c0@"
  fr: "@aPandora@bJe crois que ce qui me rend le plus heureuse, dans\r\nla vie, c'est de pouvoir faire tout ce que je veux.\n@c0@"
  it: "@aViola@bCaro, m'è venuta fame...\nPreparami subito uno sfilatino con prosciutto di Cinghialorco e carciofini sott'olio.\n㈡\nAnzi, facciamo due sfilatini con prosciutto di Cinghialorco e carciofini sott'olio!\nMeglio abbondare, no?\n@c0@"
  ja: "@a@bデボラ「私にとっての　幸せは\n\t何でも自由に　好きなことがやれて\n\tいい暮らしが　できることかしら。\n@c0@"
525:
  de: "@aGriselda@bIst das nicht ein bisschen naiv ⓚⓛ Däumchen zu drehen und darauf zu hoffen, dass der legendäre Held irgendwann auftaucht?\n@c0@"
  en: "@aDebora@bIsn't it a bit weird, just waiting and hoping that the legendary hero will make an appearance?\n@c0@"
  es: "@aStefania@b¿No es veramente raro limitarse a desear y esperar que aparezca el héroe legendario?\n@c0@"
  fr: "@aPandora@bÇa n'est pas un peu bizarre de se contenter d'attendre dans l'espoir que le héros légendaire\nse montrera un jourⓡ\n@c0@"
