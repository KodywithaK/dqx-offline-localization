  it: "@aNera@bEh, sì...\nIl principe Robert ha sposato una donna meravigliosa...\n@c0@"
  ja: "@a@bフローラ「そうですわよね。\n\tあんなに　きれいな方を花嫁にできて\n\tヘンリーさんは　幸せな方ですわ。\n@c0@"
68:
  de: "@aBianca@bMoment mal! Haben wir uns etwa auch verirrt?\n@c0@"
