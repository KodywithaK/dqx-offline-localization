  it: "@aNera@bChe panorama fantastico!\nLascia senza fiato...\n@c0@"
  ja: "@a@bフローラ「ここは　ながめもいいし\n\t最高に　くつろげるでしょうね。\n@c0@"
75:
  de: "@aBianca@bMeine Güte! Dieses Geschimpfe und Gekeife würde man von einer Dame eigentlich nicht erwarten, was?\n@c0@"
