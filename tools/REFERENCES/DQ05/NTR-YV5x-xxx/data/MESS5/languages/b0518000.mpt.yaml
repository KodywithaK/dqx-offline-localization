  it: "@aNera@bMa cosa sta farfugliando quel tipo?\n@c0@"
  ja: "@a@bフローラ「どうして　一泊したいと\n\tはっきり　言えないのでしょう？\n@c0@"
79:
  de: "@aNera@bMeinst du, da geht irgendwas Zwielichtiges vor sich?\n@c0@"
