  fr: "@aPandora@bJe ne t'ai jamais donné l'ordre de dormir par terre, %a000090. Tu dois être soulagé d'avoir une patronne aussi facile à vivre.\n@c0@"
  it: "@aViola@bQualche volta anch'io ti ho ordinato di dormire sul pavimento, %a000090, ma l'ho fatto per il tuo bene.\n㈡\nErano utili esercizi di addestramento volti a temprare il carattere e lo spirito di sacrificio.\n@c0@"
  ja: "@a@bデボラ「私は　%a000090に\n\t床で寝ろ！　だなんて　言わないわよ。\n\t私が　やさしい主人で　よかったわね。\n@c0@"
538:
  de: "@aGriselda@bEs ist ihre eigene Schuld, weil sie ihre Reisebegleitung unklug gewählt hat. Das könnte mir nie passieren.\n@c0@"
