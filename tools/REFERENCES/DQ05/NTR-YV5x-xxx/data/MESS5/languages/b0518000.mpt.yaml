  it: "@aBianca@bAdesso ho capito!\nLa signora è arrabbiata con lui!\n@c0@"
  ja: "@a@bビアンカ「使用人が　これじゃあ\n\t後ろで待ってる奥さまが\n\tご立腹なのも　ムリないわね。\n@c0@"
78:
  de: "@aNera@bWarum sagt er nicht einfach, dass sie hier übernachten möchten?\n@c0@"
