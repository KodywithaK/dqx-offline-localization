  fr: "@aBianca@bJe me rappelle avoir entendu parler d'un vieux savant qui faisait des recherches ici.\n@c0@"
  it: "@aBianca@bTempo fa un amico mi disse che qui vive uno studioso che non ha tutte le rotelle a posto...\n@c0@"
