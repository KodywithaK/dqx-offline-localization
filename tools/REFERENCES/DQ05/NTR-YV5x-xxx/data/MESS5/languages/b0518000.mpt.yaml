  it: "@aBianca@bSe vuole sciacquarsi la gola, perché non si fa una bella bevuta d'acqua di rubinetto? Non è ⓕrobbaⓖ abbastanza ⓕbbonaⓖ per il suo palato raffinato?\n@c0@"
  ja: "@a@bビアンカ「飲みたいのは　わかるけど\n\tこんな　誰もいないところで\n\tよく　ひとりで　待ってられるものね。\n@c0@"
84:
  de: "@aNera@bEr trinkt offenbar sehr gern ein paar Gläschen, wenn er es schon kaum erwarten kann, dass die Schänke ihre Tore öffnet!\n@c0@"
  en: "@aNera@bHe must really love to drink if he's waiting for the pub doors to open!\n@c0@"
  es: "@aNera@b¡Debe de ser molto aficionado a la bebida para estar aquí esperando que abran la taberna!\n@c0@"
  fr: "@aNera@bIl doit vraiment aimer boire pour attendre comme ça l'ouverture des portes de la taverneⓠ\n@c0@"
  it: "@aNera@bMi chiedo come faccia questo poveretto a sopravvivere il giorno di chiusura settimanale del locale...\n@c0@"
  ja: "@a@bフローラ「開店前から　待ってるなんて\n\tよほど　お酒が　お好きなのね。\n@c0@"
85:
  de: "@aBianca@bMeine Güte! Hier konnte es jemand aber gar nicht mehr abwarten, was zu trinken zu bekommen, was?\n@c0@"
  en: "@aBianca@bBlimey! Somebody was obviously desperate for a drink, eh?\n@c0@"
  es: "@aBianca@b¡Cuernos! Parece que está ansioso por echar un trago, ¿eh?\n@c0@"
  fr: "@aBianca@bBon sangⓠ J'en connais un qui avait désespérément besoin d'un verre, heinⓡ\n@c0@"
  it: "@aBianca@bIo a quel tipo non passo nessuna bottiglia se non me lo chiede con calma e per favore!\n@c0@"
  ja: "@a@bビアンカ「なに　あれ？\n\tこんな時間から　そんなに\n\tお酒が　飲みたかったのかしら。\n@c0@"
86:
  de: "@aNera@bOh je. Offenbar haben wir den armen Mann verwechselt und ihn ganz verlegen gemacht.\n@c0@"
  en: "@aNera@bOh dear. We seem to have confused the poor chap and made him all embarrassed.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Credo que hemos dejado desconcertado a ese pobre hombre.\n@c0@"
  fr: "@aNera@bMince. Je crois que nous avons semé la confusion dans la tête de ce pauvre type. Il est tout gêné, maintenant.\n@c0@"
  it: "@aNera@bMa ha proprio tanta sete?!\nNon potrebbe aspettare che arrivi il proprietario del locale?\n@c0@"
  ja: "@a@bフローラ「まちがえられてしまいましたね。\n\tまぎらわしいことを　してしまって\n\tあの方には　申し訳なかったですわ。\n@c0@"
87:
  de: "@aBianca@bRiech doch mal! Ich wette, hier könnte man allein vom Atmen schon beschwipst werden!\n@c0@"
  en: "@aBianca@bSmell that booze in the air! I reckon you could get a bit tipsy just from breathin' in this place!\n@c0@"
  es: "@aBianca@b¡El ambiente apesta a alcohol! ¡Creo que te puedes poner un poco piripi con solo respirar aquí!\n@c0@"
  fr: "@aBianca@bTu sens un peu cette odeurⓡ Je parie que le simple fait de respirer l'air d'ici fait tourner la têteⓠ\n@c0@"
  it: "@aBianca@bLatte d'orco?!\nBleah!\nNo, grazie! M'è passata la sete!\n@c0@"
  ja: "@a@bビアンカ「うわ～　すごいお酒のニオイ。\n\tここにいるだけで　クラクラ\n\tしちゃいそうだわ。\n@c0@"
88:
  de: "@aNera@bMeinst du, sie verbrauchen an einem Abend wirklich so viel von dem Zeug?\n@c0@"
  en: "@aNera@bDo you think they can really get through that much drink in one night?\n@c0@"
  es: "@aNera@b¿Tú crees que pueden acabar con esa cantidad de bebida en una sola notte?\n@c0@"
  fr: "@aNera@bTu penses vraiment qu'ils arrivent à boire autant rien qu'en une nuitⓡ\n@c0@"
  it: "@aNera@bNiente latte d'orco per me, grazie.\nPreferirei una spremuta d'arancia non filtrata...\n@c0@"
  ja: "@a@bフローラ「あんなに　大量のお酒が\n\tひと晩で　なくなってしまうのかしら。\n@c0@"
89:
  de: "@aBianca@bHmm. Ich habe das Gefühl, er verschweigt uns etwas.\n@c0@"
  en: "@aBianca@bHmm. I can't help feelin' like he's hidin' somethin'.\n@c0@"
  es: "@aBianca@bMmm. Me da la sensación de que oculta algo.\n@c0@"
  fr: "@aBianca@bMmm. Je ne peux pas m'empêcher de penser qu'il nous cache quelque chose.\n@c0@"
  it: "@aBianca@bCredevo che la Delizia di Milleventi fosse una bevanda gustosa e saporita...\n@c0@"
  ja: "@a@bビアンカ「なんか　かくしている\n\tクチぶりね。　あやしいわ。\n@c0@"
90:
  de: "@aNera@bMeinst du nicht, dass er gerade etwas verschlagen geguckt hat? Als würde er uns aus irgendeinem Grund anlügen.\n@c0@"
  en: "@aNera@bDon't you think he looked a little shifty? Almost as if he was fibbing to us for some reason.\n@c0@"
  es: "@aNera@b¿No crees que tenía aspecto sospettoso? Come si nos estuviese queriendo engañar por algún motivo.\n@c0@"
  fr: "@aNera@bIl avait l'air un peu sournois, tu ne trouves pasⓡ Comme s'il nous racontait des craques.\n@c0@"
  it: "@aNera@bLa Delizia di Milleventi è robaccia? Ecco perché mio padre non riesce a trovarla da nessuna parte!\nDevono aver smesso di produrla...\n@c0@"
  ja: "@a@bフローラ「あの方　目をそらしましたわ。\n\tウソを　ついていらっしゃるのね。\n@c0@"
91:
  de: "@aBianca@bHier wohnen offenbar ziemlich viele Leute zusammen, was?\n@c0@"
  en: "@aBianca@bLooks like lots of folk live here together, eh?\n@c0@"
  es: "@aBianca@bParece que aquí vive un montonazo de gente, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait qu'il y a plein de gens qui vivent ensemble, ici, nonⓡ\n@c0@"
  it: "@aBianca@bMa quanta gente vive qui dentro, eh?!\n@c0@"
  ja: "@a@bビアンカ「ここって　いろいろな人たちが\n\tみんなで　住んでいるみたいね。\n@c0@"
92:
  de: "@aNera@bEs muss Spaß machen, mit so vielen anderen zusammenzuleben. Da wird es bestimmt nie langweilig!\n@c0@"
  en: "@aNera@bIt must be fun living with lots of people like they do here. Never a dull moment!\n@c0@"
  es: "@aNera@bDebe de ser divertente vivir con tanta gente, como hacen aquí. ¡No hay tiempo para aburrirse!\n@c0@"
  fr: "@aNera@bÇa doit être amusant de vivre avec plein de gens, comme ici. On ne s'ennuie jamaisⓠ\n@c0@"
  it: "@aNera@bÈ divertente vivere con tante altre persone!\nNon ci si annoia mai!\n@c0@"
  ja: "@a@bフローラ「ここのように　みんなで\n\tにぎやかに暮らすのって\n\t楽しそうですわ。\n@c0@"
93:
  de: "@aNera@bWir waren nur zu viert in der Familie ⓚⓛ Mama, Papa, Griselda und ich. Aber wir hatten viel Spaß miteinander.\n@c0@"
  en: "@aNera@bIt was only Mama, Papa, Debora and I in our family, but we still had lots of fun.\n@c0@"
  es: "@aNera@bMi famiglia éramos solo la mia mamma, il mio papino, Stefania y yo, pero nos divertíamos.\n@c0@"
  fr: "@aNera@bNous n'étions que quatre, dans notre familleⓢ papa, mamma, Pandora et moi, mais on s'amusait quand même beaucoup.\n@c0@"
  it: "@aNera@bSai, tesoro?\nSe penso a quando abitavo con i miei genitori e con Viola, mi viene un po' di nostalgia...\n@c0@"
  ja: "@a@bフローラ「私は　４人家族でしたけれど\n\tやっぱり　楽しかったですわ。\n@c0@"
94:
  de: "@aBianca@bJa, der Verdacht ist wohl nicht unbegründet. Ich würde mir bestimmt auch Sorgen machen, wenn ich hier leben würde.\n@c0@"
  en: "@aBianca@bYeah, I s'pose that's fair enough. I'd probably worry about the same thing if I lived here.\n@c0@"
  es: "@aBianca@bSí, supongo que es normal. Si yo viviese aquí también estaría preocupada, ¿sabes?\n@c0@"
  fr: "@aBianca@bOuaip. Je crois que j'aurais la même inquiétude\r\nsi je vivais là.\n@c0@"
  it: "@aBianca@bLa capisco.\nAnch'io sarei preoccupata, se vivessi in questa zona...\n@c0@"
  ja: "@a@bビアンカ「たしかにねえ……\n\t私も　この町に住んでたら\n\t同じ心配したでしょうね。\n@c0@"
95:
  de: "@aNera@bEin Feuer ist das Eine, aber mache mir auch Sorgen über die Auswirkungen, die dieser Qualm auf ihn hat.\n@c0@"
  en: "@aNera@bA fire's one thing, but I'm worried about the effect all that smoke is having on him too.\n@c0@"
  es: "@aNera@bEl fuoco es una cosa, pero también me preocupa el efecto del humo.\n@c0@"
  fr: "@aNera@bLe feu, c'est une chose, mais je m'inquiète des\r\neffets que la fumée peut aussi avoir sur lui.\n@c0@"
  it: "@aNera@bIn effetti, ⓕdove c'è fumo c'è fuocoⓖ.\nLo dice anche il proverbio!\n@c0@"
  ja: "@a@bフローラ「火事も　心配ですけど\n\t煙が　身体にあたえる　えいきょうも\n\t心配でしょうね……。\n@c0@"
96:
  de: "@aBianca@bTja, so lange ihn das glücklich macht...! Jedem das Seine.\n@c0@"
  en: "@aBianca@bIf that's what floats his boat, then who are we\r\nto argue?\n@c0@"
  es: "@aBianca@bSi eso es lo que le hace feliz, no creo que tengamos nada que decir, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi c'est ça qui lui permet de garder le moral,\non n'a pas à discuter, heinⓡ\n@c0@"
  it: "@aBianca@bProsciutto di Cinghialorco?! Sì, è buono, ma un po' troppo grasso. Preferisco la carne magra e delicata del Pescetrippa. Ci tengo alla linea, io!\n@c0@"
  ja: "@a@bビアンカ「本人が幸せなら　他人が　\n\tとやかく　言うことはないわね。\n@c0@"
97:
  de: "@aNera@bHauptsache, wir beide sind zusammen, Liebling. Das ist es, was mich glücklich macht.\n@c0@"
  en: "@aNera@bThe thing that makes me happiest is being\r\nwith you, darling.\n@c0@"
  es: "@aNera@bLo que me hace feliz a mí es estar con te, caro mio.\n@c0@"
  fr: "@aNera@bMoi, ce qui me rend le plus heureuse, c'est d'être avec toi, mon chéri.\n@c0@"
  it: "@aNera@bCaro, a te piace il Prosciutto di Cinghialorco?\nSe vuoi posso preparartelo per cena, una di queste sere...\n@c0@"
  ja: "@a@bフローラ「私にとっての　幸せは\n\t%a000090さんと　いっしょに\n\tいることです。　ぽっ……。\n@c0@"
98:
  de: "@aBianca@bHm. Das heißt aber nicht, dass die Leute einfach rumsitzen und darauf warten sollten, oder?\n@c0@"
  en: "@aBianca@bThat dun't mean folk should just sit around waitin' for it to happen, though, eh?\n@c0@"
  es: "@aBianca@bEso no quiere decir que haya que sentarse a esperar que suceda, ¿no?\n@c0@"
  fr: "@aBianca@bÇa n'est pas une raison pour que les gens\nrestent assis sans rien faire en attendant\nque ça se produise, heinⓡ\n@c0@"
  it: "@aBianca@bQuella signora sembra assolutamente certa che prima o poi l'Eroe Leggendario arriverà e metterà a posto le cose...\n@c0@"
  ja: "@a@bビアンカ「だからといって　なにもしないで\n\tただ　待っていればいいって\n\tいうもんじゃ　ないと思うのよね。\n@c0@"
99:
  de: "@aNera@bJa, vielleicht kommt tatsächlich der legendäre Held und bringt alles in Ordnung. Aber bis es so weit ist, sollten die Leute für alle Fälle auch selbst etwas tun!\n@c0@"
  en: "@aNera@bMaybe the legendary hero will come and save the day. But people should do what they can themselves in the meantime, just in case.\n@c0@"
  es: "@aNera@bQuizá el héroe legendario venga a salvar la situazione. Ma, mientras tanto, las personas deben hacer lo que esté en su mano, por si acaso.\n@c0@"
  fr: "@aNera@bPeut-être que le héros légendaire viendra sauver tout le monde. Mais les gens devraient quand même faire ce qu'ils peuvent, en attendant.\n@c0@"
  it: "@aNera@bForse l'Eroe Leggendario verrà a salvarci, ma credo che ognuno di noi dovrebbe fare la sua parte per scongiurare la minaccia che incombe sul mondo!\n@c0@"
  ja: "@a@bフローラ「勇者さまが　現れるかも\n\t知れませんけど　その前に　自分でも\n\tできるだけのことを　したいですわ。\n@c0@"
100:
  de: "@aBianca@bWenn er so übel ist, wie er klingt, kann ich mir durchaus vorstellen, dass er auch die Kunden abschrecken könnte.\n@c0@"
  en: "@aBianca@bI imagine it'd frighten away the customers too, if it's as bad as it sounds.\n@c0@"
  es: "@aBianca@bSi es tan malo como parece, supongo que también espantará a los clientes...\n@c0@"
  fr: "@aBianca@bJe suppose que ça ferait aussi peur aux clients,\r\nsi c'est aussi mauvais que ça en a l'air.\n@c0@"
  it: "@aBianca@bSe il commento di chi l'ha assaggiato è stato ⓕSbleurghⓖ, non mi stupisco che non se ne trovi più in giro...\n@c0@"
  ja: "@a@bビアンカ「そんな　お酒を出したら\n\tお客さんが　へっちゃうでしょうね。\n@c0@"
101:
  de: "@aBianca@bOffenbar erlauben sich die Leute hier ein kleines Späßchen mit ihrem Sprungsprudel. Wir sagen dazu lieber mal nichts, was?\n@c0@"
  en: "@aBianca@bSeems like the folk here like to have a bit of fun where the old Zoomshine's concerned. Let's just\r\nkeep quiet, eh?\n@c0@"
  es: "@aBianca@bParece que a la gente de por aquí le gusta divertirse con el telelicor ese. Será mejor que no digamos nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que les gens d'ici aiment bien s'amuser\ndès qu'il est question du télétord-boyaux.\nNe faisons pas de commentaires, d'accordⓡ\n@c0@"
  it: "@aBianca@bDelizia di Milleventi... Ⓠ\nChe bevanda misteriosa... Ⓡ\nDa-da-da... Daaa-daaaaah... Ⓡ\n@c0@"
  ja: "@a@bビアンカ「まあ　あのお酒は　この町の人の\n\t楽しみみたいだから　ここは\n\t知らないふりを　しておきましょうよ。\n@c0@"
102:
  de: "@aNera@bWarum sollte der Ort so berühmt dafür sein, wenn er so furchtbar schmeckt?\n@c0@"
  en: "@aNera@bWhy would it be their famous brew if it tastes\r\nso terrible?\n@c0@"
  es: "@aNera@bSi sabe tan male, ¿per qué es su bebida más famosa?\n@c0@"
  fr: "@aNera@bPourquoi leur boisson locale serait aussi célèbre\nsi elle avait aussi mauvais goûtⓡ\n@c0@"
  it: "@aNera@bHo capito, però c'è una cosa che non mi spiego: se questa bevanda è tanto orribile, come ha fatto a diventare tanto famosa in tutto il mondo?\n@c0@"
  ja: "@a@bフローラ「マズイのに　銘酒とは\n\tいったい　どういう品なんでしょう？\n@c0@"
103:
  de: "@aNera@bEr muss nicht gleich übertreiben. Wir wollen ja nicht gerade alle Vorräte der Stadt aufkaufen oder so!\n@c0@"
  en: "@aNera@bThere's no need for him to be quite so vocal.\r\nIt's not like we'd wipe the town out of its supplies\r\nor anything!\n@c0@"
  es: "@aNera@bNo es necesario ponerse così.\r\n¡Tampoco pensábamos acabar con todas sus reservas ni niente parecido!\n@c0@"
  fr: "@aNera@bIl n'a pas besoin d'en faire autant. Ce n'est pas comme si on avait l'intention de vider la ville\nde ses réserves, non plusⓠ\n@c0@"
  it: "@aNera@bPerché non si dà una calmata?\nNon abbiamo nessuna intenzione di prosciugargli le riserve della sua amata bevanda!\n@c0@"
  ja: "@a@bフローラ「あんなに　力説しなくても\n\t私たち　この町のお酒を　根こそぎ\n\t持っていこうなんて　しませんわよね。\n@c0@"
104:
  de: "@aBianca@bAn was für einem Zauber er wohl diesmal arbeitet? Das ist ganz schön aufregend, was?\n@c0@"
  en: "@aBianca@bI wonder what kind of spell he's workin' on this time. It's pretty excitin', eh?\n@c0@"
  es: "@aBianca@bMe pregunto en qué clase de conjuro estará trabajando. ¡Qué nervios!, ¿verdad?\n@c0@"
  fr: "@aBianca@bJe me demande sur quel genre de sort il travaille, cette fois. C'est assez intrigant, heinⓡ\n@c0@"
  it: "@aBianca@bChissà a quale incantesimo sta lavorando...\n@c0@"
  ja: "@a@bビアンカ「今度の呪文って\n\tどんな呪文なのかしら。\n\t完成が　楽しみね。\n@c0@"
105:
  de: "@aNera@bDer arme alte Mann scheint etwas wunderlich zu werden. Das war vermutlich zu erwarten, er gönnt sich ja keine Pause.\n@c0@"
  en: "@aNera@bThe poor old man seems a bit worse for wear.\r\nI suppose it's only to be expected with how much\r\nhe pushes himself.\n@c0@"
  es: "@aNera@bEse pobre anciano tiene un aspecto veramente desmejorado.\r\nSupongo que es normal después de tanto sforzo.\n@c0@"
  fr: "@aNera@bLe pauvre homme semble éreinté. Mais ça n'est guère étonnant, quand on voit quelle énergie il déploie.\n@c0@"
  it: "@aNera@bIl Professore ne ha sempre una nuova per la testa, eh? Sono curiosa di sapere a quali esperimenti sta lavorando adesso...\n@c0@"
  ja: "@a@bフローラ「おじいさんたら　弱気になって。\n\tでも　あんなに　こんをつめては\n\tお身体に　さわりますわ。\n@c0@"
106:
  de: "@aBianca@bOh, ich verstehe! Darum also geht es! Wenn das Zeug so wertvoll ist, dann sollten wir es wohl nicht so einfach wegsüffeln!\n@c0@"
  en: "@aBianca@bOh, I get it! So that's what it's all about. We'd better not go guzzlin' it down if it's that valuable, then!\n@c0@"
  es: "@aBianca@b¡Ah, ya entiendo! Así que eso es lo que pasa. Entonces será mejor que no nos pongamos a tragarlo si cuesta tanto, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh, je comprendsⓠ C'est donc ça. On n'a pas intérêt\nà tout siffler trop vite, si c'est aussi précieuxⓠ\n@c0@"
  it: "@aBianca@bCapperi! Ehm, volevo dire che è proprio un bel regalo! Se questa bottiglia è tanto preziosa, suggerisco di conservarla per un'occasione speciale...\n@c0@"
  ja: "@a@bビアンカ「そういうワケだったのね。\n\tそんな　貴重なお酒なら　飲まずに\n\t大事に持っておきましょう。\n@c0@"
107:
  de: "@aNera@bIch glaube, von diesem Sprungsprudel hat nicht mal Papa gewusst. Wir müssen sorgsam damit umgehen.\n@c0@"
  en: "@aNera@bI don't think even Papa knew about this Zoomshine. We must make sure we look after it carefully.\n@c0@"
  es: "@aNera@bNo creo que il mio papino tuviese ni idea sobre este telelicor. Debemos tener mucho cuidado con él.\n@c0@"
  fr: "@aNera@bJe crois que même papa n'était pas au courant\r\npour ce télétord-boyaux. Nous devons y faire\r\nbien attention.\n@c0@"
  it: "@aNera@bAh-ah!\nAdesso capisco perché gli abitanti della zona parlano male della Delizia di Milleventi!\n@c0@"
  ja: "@a@bフローラ「こんなお酒があったなんて\n\t父も　知らないと思いますわ。\n\t大切に　持っていましょうね。\n@c0@"
108:
  de: "@aBianca@bHier ist es viel zu verqualmt, als dass man sich erholen könnte.\n@c0@"
  en: "@aBianca@bIt's way too smoky here to even think about relaxin'.\n@c0@"
  es: "@aBianca@bAquí hay demasiado humo, así no hay forma de relajarse, ¿sabes?\n@c0@"
  fr: "@aBianca@bL'endroit est bien trop enfumé pour penser\r\nune seconde à s'y détendre.\n@c0@"
  it: "@aBianca@bRiposare?!\nCon questo fumo?!\nNon ci riuscirei mai!\n@c0@"
  ja: "@a@bビアンカ「うっ……　でも\n\tあまり　ゆっくりは　したくない\n\tけむたい家よね。\n@c0@"
109:
  de: "@aNera@bWas ist er doch für ein netter alter Mann! Ich hoffe, er kann sein Verhältnis zu den anderen Einwohnern irgendwie verbessern.\n@c0@"
  en: "@aNera@bWhat a friendly old man he is. I do hope he can improve his relations with the other townspeople somehow.\n@c0@"
  es: "@aNera@bQué anciano más amabile. Espero que sus relaciones con sus paisanos mejoren.\n@c0@"
  fr: "@aNera@bQuel vieil homme chaleureux. J'espère qu'il arrivera un jour à améliorer ses relations avec les autres habitants.\n@c0@"
  it: "@aNera@bSecondo me il Professore è una persona molto intelligente. Dovrebbe solo cercare di migliorare i rapporti con i suoi concittadini...\n@c0@"
  ja: "@a@bフローラ「こうして話すと　人のいい\n\tやさしい　おじいさんですわよね。\n\t町の方とも　うまくできるといいのに。\n@c0@"
110:
  de: "@aBianca@bHuch! Hab ich mir das nur eingebildet oder hat diese Katze gerade wirklich mit uns gesprochen? Vielleicht lernen sie das, wenn sie älter werden.\n@c0@"
  en: "@aBianca@bCrikey! Did I imagine it, or did that cat just talk to us!? Maybe they learn how to do it as they get older.\n@c0@"
  es: "@aBianca@b¡Rayos! ¡¿Son imaginaciones mías, o ese gato acaba de hablarnos?! Puede que aprendan a hacerlo con la edad...\n@c0@"
  fr: "@aBianca@bBon sangⓠ Je rêve ou ce chat vient juste de nous parlerⓡⓐ Peut-être qu'ils finissent par apprendre notre langue en vieillissant.\n@c0@"
  it: "@aBianca@bQuel gatto parla! Ha detto che in quasi tutte le aree del mondo ci sono degli oggetti tipici! Già che c'era poteva anche dire qualcosa di meno scontato, no?!\n@c0@"
  ja: "@a@bビアンカ「うわっ　さっきのネコ\n\tしゃべったわよ。　年とったネコは\n\t話せるって　ホントなのね。\n@c0@"
111:
  de: "@aNera@bUnser Hund Bingo spricht auch manchmal mit mir, wenn wir allein sind, weißt du. He he he!\n@c0@"
  en: "@aNera@bOur dog Bingo chatters away to me sometimes when we're alone, you know. He he he!\n@c0@"
  es: "@aNera@bA veces, il nostro cane, Bingo, charla conmigo cuando estamos solos. ¡Ji, ji, ji!\n@c0@"
  fr: "@aNera@bTu sais, notre chien Bingo me parle aussi parfois, quand nous sommes seuls. Hi hi hiⓠ\n@c0@"
  it: "@aNera@bUn gatto parlante? I gatti di Mostroferrato stanno zitti e muti. Al massimo fanno ⓕmiaoⓖ o ⓕpurrⓖ ogni tanto, ma niente di più...\n@c0@"
  ja: "@a@bフローラ「うちの　リリアンも\n\t私と　ふたりきりの時は　いろいろ\n\t話してくれますのよ。　うふふ。\n@c0@"
112:
  de: "@aBianca@bDas war mal wieder ein langer Tag, nicht? Vielleicht sollten wir allmählich daran denken, uns aufs Ohr zu legen.\n@c0@"
  en: "@aBianca@bIt's bin another tirin' day, eh? Maybe we should think about gettin' some sleep before long.\n@c0@"
  es: "@aBianca@bUn día menos, ¿eh? Deberíamos pensar en dormir un poco, y pronto, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa a encore été une rude journée, heinⓡ\nPeut-être qu'on ne devrait pas trop tarder\nà aller dormir un peu.\n@c0@"
  it: "@aBianca@bSono esausta...\nVoglio andare a dormire...\n@c0@"
  ja: "@a@bビアンカ「今日も　いろいろあって\n\tつかれたわね。\n\tそろそろ　やすみましょうか。\n@c0@"
113:
  de: "@aNera@bIch würde gern bald zum Übernachten irgendwo einkehren, wenn es dir recht ist, Liebling. In letzter Zeit fühle ich mich immer so matt.\n@c0@"
  en: "@aNera@bIs it alright if we turn in for the night soon, darling? I seem to be feeling terribly sleepy just lately.\n@c0@"
  es: "@aNera@b¿Te parece que nos vayamos a dormir pronto, caro mio?\nMe siento molto assonnata.\n@c0@"
  fr: "@aNera@bÇa t'ennuie si on ne tarde pas trop à aller se coucher, mon chériⓡ J'ai terriblement sommeil.\n@c0@"
  it: "@aNera@bTesoro, sono terribilmente stanca...\nChe ne diresti di trovare un posto dove trascorrere la notte?\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた。\n\t今夜は　もう　やすみませんか？\n\t私…　最近　なんだか　眠くって。\n@c0@"
114:
  de: "@aBianca@bWie lange irrt denn dieser Soldat schon hier herum?!\n@c0@"
  en: "@aBianca@bJust how long has that soldier bin lost!?\n@c0@"
  es: "@aBianca@b¡Pero ¿cuánto hace que está perdido ese soldado?!\n@c0@"
  fr: "@aBianca@bDepuis combien de temps ce soldat est-il perduⓡ\n@c0@"
  it: "@aBianca@bEh?!\nAncora non ha scoperto dove andare per andare dove deve andare?!\n@c0@"
  ja: "@a@bビアンカ「あの戦士さん　いったい\n\tいつから　迷っているのかしら……。\n@c0@"
115:
  de: "@aNera@bMir macht es nichts aus, mich auf komplizierten Straßen zurechtfinden zu müssen, solange wir beide zusammen sind.\n@c0@"
  en: "@aNera@bI don't mind navigating my way through complicated streets as long as we're together.\n@c0@"
  es: "@aNera@bNo me importa pasar por estas calles tan enmarañadas mientras estemos juntos, caro mio.\n@c0@"
  fr: "@aNera@bÇa m'est égal d'arpenter en tout sens des rues compliquées, du moment que nous sommes\r\ntous les deux.\n@c0@"
  it: "@aNera@bNon m'importa di perdermi. Anzi, mi sono già persa...\r\nMi sono persa nella profonda intensità dei tuoi occhi, tesoro mio!\n@c0@"
  ja: "@a@bフローラ「%a000090さんと　歩けるなら\n\tどんなに　ふくざつな道でも\n\t私は　楽しいですわ。\n@c0@"
116:
  de: "@aBianca@bEs muss doch eiskalt sein, so auf dem Fußboden zu schlafen. Ob sie ihn wohl dazu verdonnert hat?\n@c0@"
  en: "@aBianca@bIt must be freezin' sleepin' on the floor like that.\r\nI wonder if she made him.\n@c0@"
  es: "@aBianca@bSe debe de estar muriendo de frío, durmiendo en el suelo.\r\nMe pregunto si será cosa de ella, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl doit être gelé, à dormir comme ça par terre.\r\nJe me demande si c'est elle qui l'y oblige.\n@c0@"
  it: "@aBianca@bCome mai dorme sul pavimento?\nScommetto che è stata la sua padrona a costringerlo a riposare per terra...\n@c0@"
  ja: "@a@bビアンカ「こんな床で　ねたら\n\t身体が　痛くなっちゃうのに。\n\t奥さまに　言われたのかしら……。\n@c0@"
117:
  de: "@aNera@bMeine Güte! Er muss ja einen schrecklich ruhelosen Schlaf haben, wenn er in dieser Lage gelandet ist!\n@c0@"
  en: "@aNera@bDear me! He must be a terribly restless sleeper to have ended up in that position!\n@c0@"
  es: "@aNera@b¡Oh, cielos! ¡Debe de ser una persona molto inquieta para haber acabado durmiendo en esa postura!\n@c0@"
  fr: "@aNera@bMinceⓠ Il doit énormément bouger pendant son sommeil pour s'être retrouvé dans une position pareilleⓠ\n@c0@"
  it: "@aNera@bOh, santa dea! Quel poveretto dev'essere terribilmente stanco per essere crollato sul pavimento in questo modo!\n@c0@"
  ja: "@a@bフローラ「まあ！\n\tこんなところまで　転がるなんて\n\tすごい　ねぞう　ですわ。\n@c0@"
118:
  de: "@aBianca@bDie sind schon ein komisches Pärchen, was? Diese vornehme Dame und ihr Diener, der da auf dem Boden schläft.\n@c0@"
  en: "@aBianca@bThey're a pretty funny couple, eh? That posh woman and her servant sleepin' there on the floor.\n@c0@"
  es: "@aBianca@bQué pareja más curiosa, ¿verdad? Esa mujer tan remilgada y todo eso y su sirviente durmiendo en el suelo.\n@c0@"
  fr: "@aBianca@bC'est un drôle de couple, heinⓡ Cette femme snob et son domestique qui dort par terre.\n@c0@"
  it: "@aBianca@bInsomma, io non ci ho capito niente!\nChi l'avrebbe costretta a dormire con chi, eh?!\n@c0@"
  ja: "@a@bビアンカ「あの　ご婦人と\n\t床で寝ている使用人って\n\t意外と　いいコンビだったりしてね。\n@c0@"
119:
  de: "@aNera@bEs kann doch nicht gesund sein, selbst im Schlaf noch wütend zu sein.\n@c0@"
  en: "@aNera@bSurely it can't be good for you to be angry in\r\nyour sleep.\n@c0@"
  es: "@aNera@bSicuro que no es buono per la salud enfadarse en sueños.\n@c0@"
  fr: "@aNera@bÇa ne doit pas être très bon d'être en colère dans son sommeil.\n@c0@"
  it: "@aNera@bQuella signora si lamenta persino mentre dorme.\nDeve avere proprio un caratteraccio...\n@c0@"
  ja: "@a@bフローラ「眠りながら　怒るのって\n\t身体に悪そうですわ。\n@c0@"
120:
  de: "@aBianca@bEs gibt sicher nicht viele Orte, wo man einen derart derangierten Priester sehen kann, was?\n@c0@"
  en: "@aBianca@bI doubt there's many a place you'd see a priest worse for wear like that, eh?\n@c0@"
  es: "@aBianca@bNo debe de ser muy común ver a un sacerdote así de perjudicado, ¿eh?\n@c0@"
  fr: "@aBianca@bJe ne crois pas qu'il y a beaucoup d'endroits\noù l'on peut voir un prêtre dans cet état, heinⓡ\n@c0@"
  it: "@aBianca@bNumi del cielo! Non avevo mai visto un sacerdote ridursi in quello stato!\nCosa penseranno di lui i suoi parrocchiani, eh?\n@c0@"
  ja: "@a@bビアンカ「あんなに　よっぱらった\n\t神父さまを　見られるのは\n\tここだけでしょうね……。\n@c0@"
121:
  de: "@aNera@bOh weh. Wie kann ein Priester in einer solchen Gemütsverfassung den Leuten noch Halt geben?\n@c0@"
  en: "@aNera@bOh dear. How can a priest possibly give guidance to people when he feels like that?\n@c0@"
  es: "@aNera@b¡Oh, cielos! ¿Come puede un sacerdote guiar a nadie en ese estado?\n@c0@"
  fr: "@aNera@bSeigneur. Comment un prêtre peut-il être un guide pour les autres s'il se sent aussi malⓡ\n@c0@"
  it: "@aNera@bÈ triste vedere un sacerdote che ha perso la fiducia nella nostra amata dea...\n@c0@"
  ja: "@a@bフローラ「神父さまが　あんなことを\n\tおっしゃっては　まよえる者を\n\tみちびけませんわ……。\n@c0@"
122:
  de: "@aBianca@bOb wohl die Leute drüben in Bauernsiepen uns die Geschichte mit %a001210 immer noch übel nehmen?\n@c0@"
  en: "@aBianca@bI wonder if the folk over in Hay are still angry about what happened with %a001210.\n@c0@"
  es: "@aBianca@bMe pregunto si la gente de Puebla del Heno sigue enfadada por lo que pasó con %a001210, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande si les habitants de Chaumes sont toujours en colère à propos de ce qui s'est passé avec %a001210.\n@c0@"
  it: "@aBianca@bA proposito di Punta Campestre, chissà se quei cari zoticoni ce l'hanno ancora con noi per quello che %a001210 ha combinato al loro villaggio...\n@c0@"
  ja: "@a@bビアンカ「カボチ村の人たち\n\tまだ　%a001210のこと\n\tおこっているのかしら……。\n@c0@"
123:
  de: "@aNera@bNach den Erfahrungen mit uns werden die Bauernsiepener Fremden wohl nicht mehr so leicht über den Weg trauen.\n@c0@"
  en: "@aNera@bThe people of Hay are probably finding it hard to trust anyone after what happened with us.\n@c0@"
  es: "@aNera@bDespués de lo que pasó con noi, sicuro que la gente de Puebla del Heno ya no confía en nadie.\n@c0@"
  fr: "@aNera@bLes gens de Chaumes doivent avoir du mal à faire confiance à quiconque après ce qui s'est passé\r\navec nous.\n@c0@"
  it: "@aNera@bSì, sappiamo fin troppo bene che gli abitanti di Punta Campestre sono diffidenti verso i forestieri...\n@c0@"
  ja: "@a@bフローラ「村の人たちは\n\t人が信じられなくなっているのかも\n\t知れませんわね……。\n@c0@"
124:
  de: "@aBianca@bDas klingt gar nicht gut. Vielleicht sollten wir dort mal vorbeischauen und sehen, was los ist.\n@c0@"
  en: "@aBianca@bThat dun't sound good. We should probably pop over there sometime and see what's goin' on.\n@c0@"
  es: "@aBianca@bEso tiene mala pinta. Quizá deberíamos pasarnos por allí a ver qué se cuece, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa sent le roussi. On devrait peut-être aller faire\r\nun tour là-bas pour voir ce qui s'y passe.\n@c0@"
  it: "@aBianca@bPerché non facciamo un salto a Punta Campestre uno di questi giorni? Mi piacerebbe capire come mai la gente di quel posto ce l'ha tanto con i forestieri...\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\tなんだか　気になるわね。\n\t時間があったら　寄ってみましょうよ。\n@c0@"
125:
  de: "@aNera@bVielleicht haben sie schlechte Erfahrungen mit Fremden gemacht und sind dadurch etwas misstrauisch geworden.\n@c0@"
  en: "@aNera@bMaybe they've had bad experiences with outsiders in the past that have made them a bit wary.\n@c0@"
  es: "@aNera@bVeramente, puede que hayan tenido malas experiencias con forasteros antes y eso les hace ser precavidos.\n@c0@"
  fr: "@aNera@bIls ont peut-être déjà été échaudés par des étrangers dans le passé et ça les aura rendus méfiants.\n@c0@"
  it: "@aNera@bForse gli abitanti di Punta Campestre sono diffidenti verso chi non appartiene alla loro comunità perché hanno avuto esperienze negative in passato...\n@c0@"
  ja: "@a@bフローラ「以前　誰かに　だまされたとか\n\tいやな経験が　ある村なのかも\n\t知れませんわね……。\n@c0@"
126:
  de: "@aNera@bWir sollten den Ort besuchen und herausfinden, wo das Problem liegt.\n@c0@"
  en: "@aNera@bWe should visit the place and find out what the problem is.\n@c0@"
  es: "@aNera@bDeberíamos ir de visita y averiguar cuál es el problema.\n@c0@"
  fr: "@aNera@bNous devrions aller faire un tour là-bas pour voir quel est le problème.\n@c0@"
  it: "@aNera@bChe ne diresti di farci un salto, quando avremo un po' di tempo? Magari potremmo aiutarli ad aprirsi un po' verso l'esterno... Sarebbe un bel gesto, no?\n@c0@"
  ja: "@a@bフローラ「一度　行って\n\t話を　聞いてみましょうよ。\n@c0@"
127:
  de: "@aBianca@bDer ist wohl nicht ganz auf dem Laufenden, was? Das kommt davon, wenn man sich zu oft in der Schänke herumtreibt.\n@c0@"
  en: "@aBianca@bHe's a bit behind the times, eh? That's what comes of bein' down the pub too much.\n@c0@"
  es: "@aBianca@bNo se puede decir que esté muy al día, ¿eh? Eso le pasa por pasar demasiado tiempo en la taberna, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a une carriole de retard, heinⓡ Voilà ce qui arrive quand on passe trop de temps à la taverne.\n@c0@"
  it: "@aBianca@bMa davvero?! Eh eh eh!\r\nMi sa che quel tipo non è aggiornato sugli ultimi avvenimenti...\n@c0@"
  ja: "@a@bビアンカ「いつの話を　してるのかしら。\n\tきっと　酒場に入りびたっているから\n\t外の話に　うといのね。\n@c0@"
128:
  de: "@aNera@bDu hast ihm die fehlende Zutat doch schon lange gebracht, oder nicht, %a000090? Das hat der Mann offenbar noch nicht mitbekommen.\n@c0@"
  en: "@aNera@bYou brought him the missing ingredient ages ago, didn't you, %a000090? That man obviously doesn't know yet.\n@c0@"
  es: "@aNera@bHace un siglo que le trajiste ese ingrediente, ¿vero, %a000090? Está claro que ese uomo no lo sabe aún.\n@c0@"
  fr: "@aNera@bMais tu lui as rapporté l'ingrédient manquant il y a un bon bout de temps, non, %a000090ⓡ Apparemment, cet homme n'est pas au courant.\n@c0@"
  it: "@aNera@bMa se è un pezzo che gli abbiamo portato l'ingrediente mancante!\n@c0@"
  ja: "@a@bフローラ「足りない材料って　とっくの昔に\n\t%a000090さんが　届けたんでしょ？\n\tあの方　いつの話をしているのかしら。\n@c0@"
129:
  de: "@aBianca@bBis in den Himmel? Na, das muss aber ein mächtig hoher Turm sein!\n@c0@"
  en: "@aBianca@bRight up to the heavens?\r\nThat must be a blimmin' tall tower!\n@c0@"
  es: "@aBianca@b¿Hasta los cielos?\r\n¡Debe de ser una torre alta de narices!\n@c0@"
  fr: "@aBianca@bJusqu'aux cieuxⓡ Elle doit être sacrément haute, cette tourⓠ\n@c0@"
  it: "@aBianca@bUna torre tanto alta da raggiungere il cielo?\nQuanto tempo ci avranno impiegata a costruirla?\n@c0@"
  ja: "@a@bビアンカ「天空へ通じる…　なんて\n\tいったい　どんな高さの塔なのか\n\t想像もつかないわ。\n@c0@"
130:
  de: "@aNera@bMir würde bestimmt schrecklich schwindelig werden, wenn ich je auf einen so hohen Turm klettern müsste.\n@c0@"
  en: "@aNera@bI'm sure I'd get terribly dizzy if I ever climbed a tower that high.\n@c0@"
  es: "@aNera@bSi subiese a una torre così, seguro que acabaría mareada.\n@c0@"
  fr: "@aNera@bJe suis sûre que j'aurais un vertige abominable\r\nsi je montais sur une tour aussi haute.\n@c0@"
  it: "@aNera@bMi piacerebbe molto salire su una torre alta fino al cielo, così mi sentirei ancora più vicina alla mia amata dea... Peccato che io soffra di vertigini!\n@c0@"
  ja: "@a@bフローラ「そんな高さの塔に\n\tのぼったら　私　きっと\n\t目を回して　たおれてしまいますわ。\n@c0@"
131:
  de: "@aBianca@bDas ist eine ganz schöne Lauferei für uns und für den Helden, was? Diese ganze Suche nach Waffen und dergleichen.\n@c0@"
  en: "@aBianca@bIt's a bit of a hassle for us and the hero, eh? All this huntin' about lookin' for weapons and the like.\n@c0@"
  es: "@aBianca@bEsto de ir por ahí a la busca de armas y cosas así es un poco rollo para nosotros y para el héroe, ¿eh?\n@c0@"
  fr: "@aBianca@bVoilà une histoire qui cause bien des soucis, aussi bien à nous qu'au héros, nonⓡ Cette chasse aux armes et tout ça...\n@c0@"
  it: "@aBianca@bL'Eroe Leggendario... L'Equipaggiamento Zenithiano...\nLa nostra ricerca non è per niente semplice...\n@c0@"
  ja: "@a@bビアンカ「なるほどね。　でも\n\tまず　装備品から　さがさないと\n\tいけないなんて　勇者も大変ね。\n@c0@"
132:
  de: "@aNera@bVielleicht wäre es für den Helden eine Hilfe, wenn wir versuchen würden, die Zenithia-Ausrüstung zusammenzusuchen.\n@c0@"
  en: "@aNera@bMaybe it would be a big help to the hero if we tried to collect the Zenithian Equipment.\n@c0@"
  es: "@aNera@bSería genial para ayudar al héroe si pudiésemos recopilar tutti el equipo de Zenithia.\n@c0@"
  fr: "@aNera@bPeut-être que ça serait très utile au héros si on essayait de rassembler l'intégralité de l'Équipement zénithien.\n@c0@"
  it: "@aNera@bForse ha ragione lui. Se anche l'Eroe Leggendario sta cercando l'Equipaggiamento Zenithiano, prima o poi finiremo per incontrarlo...\n@c0@"
  ja: "@a@bフローラ「天空の装備品集めは\n\t勇者さまの　お手伝いにも\n\tなっているんですわね。\n@c0@"
133:
  de: "@aBianca@bBei dem schrecklichen Lärm von nebenan könnte ich auch nicht schlafen! Und die Schänke unten ist auch nicht gerade leise.\n@c0@"
  en: "@aBianca@bI can see why she can't sleep with that awful\r\nnoise comin' from next door! The pub downstairs\r\nen't quiet neither.\n@c0@"
  es: "@aBianca@b¡No me extraña que no pueda dormir con tanto jaleo aquí al lado! Y la taberna de abajo, tampoco se puede decir que sea tranquila, ¿sabes?\n@c0@"
  fr: "@aBianca@bPas étonnant qu'elle n'arrive pas à fermer l'œil avec le bruit qu'il y a à côtéⓠ Et puis la taverne, en bas, n'est pas franchement calme non plus.\n@c0@"
  it: "@aBianca@bCi credo che non riesce a dormire! Dalla stanza accanto proviene un rumore fastidiosissimo, e la taverna di sotto non è certo il posto più silenzioso del mondo!\n@c0@"
  ja: "@a@bビアンカ「これじゃあ　ねられないわ。\n\tとなりの部屋からは　いやな音……\n\t下の酒場も　にぎやかだもんね。\n@c0@"
134:
  de: "@aNera@bDie arme Frau. Nichts zermürbt einen mehr, als wenn man nicht einschlafen kann.\n@c0@"
  en: "@aNera@bThat poor woman. There's nothing more frustrating than not being able to get to sleep.\n@c0@"
  es: "@aNera@bPobre mujer. No hay nada più agotador que no poder conciliar el sueño.\n@c0@"
  fr: "@aNera@bPauvre femme. Il n'y a rien de plus énervant que de ne pas arriver à fermer l'œil.\n@c0@"
  it: "@aNera@bAh, è orribile non riuscire a dormire quando se ne avrebbe voglia.\nPoveretta, mi spiace tanto per lei...\n@c0@"
  ja: "@a@bフローラ「まあ　お気のどくに……。\n\t眠れないって　本当に\n\tつらいことですものね。\n@c0@"
135:
  de: "@aBianca@bDas also ist das Geräusch, dass wir hören, seit wir hier im Haus sind! Was für ein Getöse!\n@c0@"
  en: "@aBianca@bSo that's the noise we've bin hearin' since we come in this buildin'! What a racket!\n@c0@"
  es: "@aBianca@b¡Así que ese es el ruido que se oía desde que hemos entrado! ¡Vaya jaleo!\n@c0@"
  fr: "@aBianca@bAlors c'est ça, le bruit qu'on entend depuis qu'on est entrésⓡ Tu parles d'un boucanⓠ\n@c0@"
  it: "@aBianca@bEcco cos'è era il rumore che sentivamo!\r\nQuesto sì che si chiama russare!\n@c0@"
  ja: "@a@bビアンカ「この建物に　入ったときから\n\t聞こえていた音は　あれだったのね。\n\tまわりの人は　大変だわ。\n@c0@"
136:
  de: "@aNera@bWenn er weiter so mit den Zähnen knirscht, hat er bald keine mehr übrig.\n@c0@"
  en: "@aNera@bHe won't have any teeth left if he keeps grinding them at that rate!\n@c0@"
  es: "@aNera@b¡Si sigue chirriando così los dientes se los va a desgastar!\n@c0@"
  fr: "@aNera@bS'il continue à grincer des dents comme ça,\nil n'en aura bientôt plusⓠ\n@c0@"
  it: "@aNera@bNon credevo fosse possibile russare in questo modo!\nSe urlasse a squarciagola, sarebbe più silenzioso...\n@c0@"
  ja: "@a@bフローラ「あんなに　すごい歯ぎしりをして\n\t歯が　すりきれて　なくなったり\n\tしないんでしょうか？\n@c0@"
137:
  de: "@aBianca@bIch war überrascht, dass er ein Kumpel von dir ist. Auf du und du mit dem Adel, was?\n@c0@"
  en: "@aBianca@bI was surprised that he's a mate of yours.\r\nFriends with a prince, eh?\n@c0@"
  es: "@aBianca@bMe ha sorprendido que os conocieseis.\r\nAmigo de un príncipe, ¿qué te parece?\n@c0@"
  fr: "@aBianca@bJ'ai été surprise que ce soit l'un de tes amis.\nAmi avec un prince, ça en jette, heinⓡ\n@c0@"
  it: "@aBianca@bSono rimasta senza parole quando ho scoperto che Robert è un tuo amico. Non ti facevo tipo da frequentare le corti reali, sai? Ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「そのヘンリーさまが\n\t%a000090の　友だちだったなんて\n\tビックリしちゃったわ。\n@c0@"
138:
  de: "@aNera@bWas die Leute wohl über unsere Hochzeit gedacht haben?\n@c0@"
  en: "@aNera@bI wonder what people thought of our wedding.\n@c0@"
  es: "@aNera@bMe pregunto qué pensó la gente sobre la nostra boda.\n@c0@"
  fr: "@aNera@bJe me demande ce que les gens ont pensé de notre mariage.\n@c0@"
  it: "@aNera@bChissà cosa s'è detto in giro del nostro matrimonio...\n@c0@"
  ja: "@a@bフローラ「私たちの　結婚式は\n\tほかの方たちの目に　どのように\n\tうつったかしら……。\n@c0@"
139:
  de: "@aNera@bGlaubst du, sie finden, dass wir gut zusammenpassen?\n@c0@"
  en: "@aNera@bDo you think they thought we make a good couple?\n@c0@"
  es: "@aNera@b¿Crees que creían que hacíamos buona pareja?\n@c0@"
  fr: "@aNera@bTu crois qu'ils se sont dit qu'on formait\nun beau coupleⓡ\n@c0@"
  it: "@aNera@bTesoro, posso farti una domanda?\nPerò prometti che mi risponderai sinceramente...\n...\n㈡\nIo ti piaccio davvero?\n@c0@"
  ja: "@a@bフローラ「お似合いの　ふたりだと\n\t思われたかしら……？\n@c0@"
140:
  de: "@aNera@bOh! Wie lieb von dir!\n@c0@"
  en: "@aNera@bOh! That's so sweet, darling!\n@c0@"
  es: "@aNera@b¡Oh! ¡Qué tierno, caro mio!\n@c0@"
  fr: "@aNera@bOhⓠ Tu es vraiment chou, mon chouⓠ\n@c0@"
  it: "@aNera@bOh, che bello sentirtelo dire!\nAnche tu mi piaci tanto, amore mio!\n@c0@"
  ja: "@a@bフローラ「う　うれしい…　あなた！\n@c0@"
141:
  de: "@aNera@bOh... Dann muss ich wohl mehr dafür tun, dass wir wie ein glückliches Paar wirken.\n@c0@"
  en: "@aNera@bOh... Then I'll have to try harder from now on to make us look happier together.\n@c0@"
  es: "@aNera@bOh... Pues a partir de ahora intentaré parecer más felice a tu lado.\n@c0@"
  fr: "@aNera@bOh... Alors il va falloir qu'on montre un peu plus\r\nqu'on est vraiment heureux ensemble.\n@c0@"
  it: "@aNera@bNo? Oh, santa dea!\nDimmi, cos'è che non ti piace di me?\nLa pettinatura? Il trucco? Il mio modo di cucinare?\n@c0@"
  ja: "@a@bフローラ「う……\n\tでも　これから　お似合いと\n\t思われるよう　私　がんばりますわ。\n@c0@"
142:
  de: "@aBianca@bDer Glückliche! Es klingt, als würde er das wirklich genießen!\n@c0@"
  en: "@aBianca@bThe lucky thing! Sounds like he's really enjoyin' that.\n@c0@"
  es: "@aBianca@b¡Menuda suerte! Parece que se lo está pasando de miedo.\n@c0@"
  fr: "@aBianca@bLe veinardⓠ On dirait qu'il aime vraiment ça...\n@c0@"
  it: "@aBianca@bPreferisco un bagno e un bicchiere di latte di mucca...!\n@c0@"
  ja: "@a@bビアンカ「いいなあ…\n\tなんだか　本当に　おいしそう……。\n\tゴクッ……。\n@c0@"
143:
  de: "@aNera@bWenn ich gebadet habe, trinke ich gern ein schönes Glas kalte Milch.\n@c0@"
  en: "@aNera@bI always like to drink a nice glass of cold milk after I've had a bath.\n@c0@"
  es: "@aNera@bMe gusta beber un vaso de latte fría después de un buen bagno.\n@c0@"
  fr: "@aNera@bJ'aime bien boire un bon verre de lait frais après avoir pris un bain.\n@c0@"
  it: "@aNera@bAnche a me piace bere un bicchiere di latte dopo aver fatto il bagno.\nAiuta a reidratare la pelle.\n@c0@"
  ja: "@a@bフローラ「私は　おフロあがりの\n\tいっぱいは　ミルクと\n\t決めておりますの。\n@c0@"
144:
  de: "@aBianca@bHah! Das würde man ihm glatt abkaufen, was? Lassen wir ihn einfach in Ruhe sein Getränk genießen.\n@c0@"
  en: "@aBianca@bHah! He's doin' a good job of lyin', eh? Let's just leave him be to enjoy his drink.\n@c0@"
  es: "@aBianca@b¡Ja! ¡Menudo embustero está hecho! Vamos a dejarle que disfrute de su copa, ¿sabes?\n@c0@"
  fr: "@aBianca@bAhⓠ Il s'en sort bien pour raconter son mensonge, heinⓡ Laissons-le savourer son verre tranquillement.\n@c0@"
  it: "@aBianca@bSenti quant'è convincente quel gran bugiardo!\nSe non sapessi la verità sulla Delizia di Milleventi, sarei tentata di credergli!\n@c0@"
  ja: "@a@bビアンカ「あ～あ…　ムリして\n\tウソつかなくて　いいのにね。\n\tま　そっとしておいてあげましょ。\n@c0@"
145:
  de: "@aNera@bDu solltest die Leute wirklich nicht zum Lügen verführen, %a000090.\n@c0@"
  en: "@aNera@bYou really shouldn't put people in a position where they have to lie to you, %a000090.\n@c0@"
  es: "@aNera@bNo es buono que obligues a la gente a que te mienta, %a000090.\n@c0@"
  fr: "@aNera@bTu ne devrais vraiment pas pousser les gens à te mentir, %a000090.\n@c0@"
  it: "@aNera@bEh eh eh! Va bene, va bene...\nChe dici, %a000090?\nFacciamo finta di credergli? Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「あなた　人にウソを\n\tつかせるようなことを\n\tきいては　いけませんわ。\n@c0@"
146:
  de: "@aBianca@bHier war doch der Ring des Feuers, oder?\n@c0@"
  en: "@aBianca@bThis is where the Circle of Fire was, eh?\n@c0@"
  es: "@aBianca@bAquí estaba el Anillo de Fuego, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est ici que se trouvait l'Anneau du Feu,\nn'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bQuesto è il luogo dove hai trovato l'Anello di Fuoco, non è vero?\n@c0@"
  ja: "@a@bビアンカ「もうひとつの結婚指輪\n\t炎のリングは　ここに　あったのね。\n@c0@"
147:
  de: "@aBianca@bDu hattest ja vielleicht Nerven, als du sagtest, du wolltest ganz allein die Eheringe suchen!\n@c0@"
  en: "@aBianca@bYou certainly had some nerve, sayin' you'd go after them weddin' rings all on your own!\n@c0@"
  es: "@aBianca@b¡La verdad es que hacía falta valor para decir que ibas a ir a buscar los anillos solo!\n@c0@"
  fr: "@aBianca@bTu as eu du cran de déclarer que tu partirais seul à la recherche de ces anneaux de mariageⓠ\n@c0@"
  it: "@aBianca@bAvresti faticato molto meno se mister Fosconi ti avesse chiesto di comprare due fedi nuziali da un gioielliere...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　ひとりで\n\tリングを　さがし出すなんて\n\tなかなか　やるじゃないの！\n@c0@"
148:
  de: "@aBianca@bIch finde, unsere Eheringe sind etwas ganz Besonderes. Sie sind enger miteinander verbunden als irgendwelche anderen Ringe auf der Welt.\n@c0@"
  en: "@aBianca@bI feel like our weddin' rings are really special. They belong together more than any other rings in the world ever could.\n@c0@"
  es: "@aBianca@bTengo la sensazione de que nuestros anillos de boda son muy especiales, que están più unidos que ningún otro objeto del mundo.\n@c0@"
  fr: "@aBianca@bJ'ai le sentiment de nos anneaux de mariage sont vraiment particuliers. Ils sont plus complémentaires que n'importe quelles autres alliances.\n@c0@"
  it: "@aBianca@bLe nostre fedi nuziali sono speciali. Sono gli anelli più belli che esistano al mondo. Sembrano fatti l'uno per l'altro, proprio come noi due...\n@c0@"
  ja: "@a@bビアンカ「私たちの結婚指輪って\n\t世界に　ひと組だけの　すごく\n\t特別なものって感じがするわね。\n@c0@"
149:
  de: "@aBianca@bHier drin ist es ganz schön stickig, oder? Ein bisschen frische Luft wäre jetzt nicht schlecht...\n@c0@"
  en: "@aBianca@bIt's a bit hot under the collar in here, eh?\r\nCan we get some fresh air?\n@c0@"
  es: "@aBianca@bHace calorcillo aquí, ¿eh?\r\nNecesito un poco de aire fresco.\n@c0@"
  fr: "@aBianca@bIl fait un peu chaud ici, nonⓡ On ne pourrait pas aller prendre un peu l'airⓡ\n@c0@"
  it: "@aBianca@bAccidenti, qui dentro fa un caldo bestiale!\nSenti, non potremmo andare a prendere una boccata d'aria fresca?\n@c0@"
  ja: "@a@bビアンカ「それにしても　暑すぎるわ。\n\t%a000090　もう　出ましょうよ。\n@c0@"
150:
  de: "@aNera@bSieh dir nur all die Lava an! Ich hatte ja keine Ahnung, dass der Ring des Feuers an so einem unheimlichen Ort verborgen war!\n@c0@"
  en: "@aNera@bJust look at that lava! I had no idea that the Circle of Fire was hidden in such a scary place!\n@c0@"
  es: "@aNera@b¡Mira tutta esa lava! ¡No tenia ni idea de que el Anillo de Fuego estuviese oculto en un lugare tan terrible!\n@c0@"
  fr: "@aNera@bRegarde toute cette laveⓠ Je n'imaginais pas que l'Anneau du Feu était caché dans un endroit aussi terrifiantⓠ\n@c0@"
  it: "@aNera@bVedere la lava da così vicino mette davvero paura! Non avevo idea che il luogo dov'era nascosto l'Anello di Fuoco fosse tanto pericoloso...\n@c0@"
  ja: "@a@bフローラ「あんなに　溶岩が煮え立って…\n\t炎のリングの　かくされた場所が\n\tこれほど　恐ろしい所だったなんて。\n@c0@"
151:
  de: "@aNera@bOb Papa überhaupt wusste, an was für einen gefährlichen Ort er die Leute geschickt hat?\n@c0@"
  en: "@aNera@bI wonder if Papa realised what a dangerous place he was sending people to.\n@c0@"
  es: "@aNera@bMe pregunto si il mio papino sabía que enviaba a las personas a un sitio così de pericoloso.\n@c0@"
  fr: "@aNera@bJe me demande si papa avait bien conscience du danger que représentait l'endroit où il vous envoyait.\n@c0@"
  it: "@aNera@bCredo che mio padre non si sia mai reso conto dei rischi che fece correre ai pretendenti alla mia mano...\n@c0@"
  ja: "@a@bフローラ「お父さまったら　ここが\n\tこんなにキケンな場所だって\n\t知っていたのかしら？\n@c0@"
152:
  de: "@aNera@bDer Göttin sei Dank, dass bei dem Versuch, den albernen Ring zu finden, niemand sein Leben verloren hat!\n@c0@"
  en: "@aNera@bThank the Goddess that no one lost their life trying to find that silly ring!\n@c0@"
  es: "@aNera@b¡Gracias a la Diosa que nadie ha perdido la vita buscando ese estúpido anillo!\n@c0@"
  fr: "@aNera@bGrâce à la Déesse, personne n'est mort en essayant de retrouver ce stupide anneauⓠ\n@c0@"
  it: "@aNera@bRingrazio la dea che nessuno abbia perso la vita nel tentativo di trovare quell'anello...\n@c0@"
  ja: "@a@bフローラ「リングさがしで　命を\n\t落とす人がいなくて\n\t本当に　よかったですわ。\n@c0@"
153:
  de: "@aBianca@bWas wollen wir denn hier schon wieder, %a000090? Du hängst wohl an dem Ort, was?\n@c0@"
  en: "@aBianca@bWhat are we doin' here again, %a000090? Got a bit of a thing for this place, have you?\n@c0@"
  es: "@aBianca@b¿Qué hacemos aquí otra vez, %a000090? Le tienes cariño a este sitio, ¿eh?\n@c0@"
  fr: "@aBianca@bQu'est-ce qu'on fait encore ici, %a000090ⓡ\nCet endroit te plaît, c'est çaⓡ\n@c0@"
  it: "@aBianca@bChe ci facciamo di nuovo qui, %a000090?\nHai un debole per questo posto, eh?\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　また\n\tここに来るなんて…\n\tよほど　ここが気に入ったのね。\n@c0@"
154:
  de: "@aBianca@bWenn es keine Monster gäbe, dann wäre es wirklich wunderschön hier, oder?\n@c0@"
  en: "@aBianca@bIf only there weren't any monsters here, it'd be a beautiful spot to come to, eh?\n@c0@"
  es: "@aBianca@bSi no fuera por los mostri, este sitio sería agradable de verdad, ¿eh?\n@c0@"
  fr: "@aBianca@bS'il n'y avait pas autant de monstres, cet endroit serait un magnifique site à visiter, heinⓡ\n@c0@"
  it: "@aBianca@bSe non ci fossero tanti mostri nei paraggi, questo sarebbe un vero paradiso...\n@c0@"
  ja: "@a@bビアンカ「魔物さえ　出なかったら\n\tここは　きれいだし\n\t最高の場所なのに……。\n@c0@"
155:
  de: "@aNera@bOh! Eine Höhle hinter dem Wasserfall! Hier also hast du den Ring des Wassers gefunden.\n@c0@"
  en: "@aNera@bOoh! A cave behind a waterfall! So this is where you found the Circle of Water.\n@c0@"
  es: "@aNera@b¡Oooh! ¡Una cueva tras una cascada! Así que aquí encontraste il Anillo de Agua.\n@c0@"
  fr: "@aNera@bOohⓠ Une grotte cachée derrière une cascadeⓠ\nAlors c'est là que tu as trouvé l'Anneau de l'Eau.\n@c0@"
  it: "@aNera@bC'è una caverna dietro la cascata! Che meraviglia!\nAllora è qui che hai trovato l'Anello d'Acqua, non è così?\n@c0@"
  ja: "@a@bフローラ「まあ！　滝の奥に　洞くつが。\n\tここに　水のリングが\n\tかくされていましたのね。\n@c0@"
156:
  de: "@aNera@bHierher bist du doch mit Bianca gekommen, oder nicht?\n@c0@"
  en: "@aNera@bYou came here with Bianca, didn't you?\n@c0@"
  es: "@aNera@bViniste aquí con Bianca, ¿vero?\n@c0@"
  fr: "@aNera@bTu es venu ici avec Bianca, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bSei venuto qui con Bianca, vero?\n@c0@"
  ja: "@a@bフローラ「ここには\n\tビアンカさんと　いっしょに\n\tいらっしゃったんでしょう？\n@c0@"
157:
  de: "@aNera@bJetzt werde ich doch ein klein wenig eifersüchtig. Ich wünschte, wir beide wären auch schon als Kinder befreundet gewesen, %a000090.\n@c0@"
  en: "@aNera@bHmm... That makes me feel a little jealous. If only you and I had been childhood friends, %a000090.\n@c0@"
  es: "@aNera@bMmm... Eso me pone un po' celosa. Si hubiésemos sido amici de niños, %a000090...\n@c0@"
  fr: "@aNera@bMmm... Ça me rend un peu jalouse. Si seulement nous avions été des amis d'enfance, nous aussi, %a000090.\n@c0@"
  it: "@aNera@bCapisco che lei sia la tua più cara amica, ma mentirei se ti dicessi che non sono un po' gelosa di lei, %a000090.\n@c0@"
  ja: "@a@bフローラ「……うらやましいですわ。\n\t私も　%a000090さんと\n\t幼なじみだったら　良かったのに。\n@c0@"
158:
  de: "@aBianca@bAch? Dann darf nur eine Dienerin der Göttin die Türen hier öffnen?\n@c0@"
  en: "@aBianca@bOh yeah? So only a maiden approved by the Goddess gets to open the doors to this place, eh?\n@c0@"
  es: "@aBianca@b¿Ah, sí? Así que solo una doncella que tenga la aprobación de la Diosa puede abrir estas puertas, ¿eh?\n@c0@"
  fr: "@aBianca@bAh ouiⓡ Alors seule une jeune fille bénie par la Déesse peut ouvrir les portes de cet endroitⓡ\n@c0@"
  it: "@aBianca@bChe cosa? Solo una tenera fanciulla il cui cuore è colmo d'amore per la dea può aprire la porta della torre?\n@c0@"
  ja: "@a@bビアンカ「えっ？\n\tこの扉って　神につかえる　乙女にしか\n\t開けられないの？\n@c0@"
159:
  de: "@aBianca@bHmm... Dann komme ich wohl nicht in Frage! Komm, gehen wir!\n@c0@"
  en: "@aBianca@bHmm... I s'pose that counts me out, then!\r\nCome on, let's go!\n@c0@"
  es: "@aBianca@bMmm... ¡Supongo que eso me deja fuera!\r\n¡Vamos, en marcha!\n@c0@"
  fr: "@aBianca@bMmm... Je ne rentre pas dans cette catégorie,\ndans ce casⓠ Viens, allons-nous-enⓠ\n@c0@"
  it: "@aBianca@bAllora io non potrò mai aprirla!\nForza, andiamo.\n@c0@"
  ja: "@a@bビアンカ「ふ～ん……\n\tなんだか　おもしろくないけど\n\tしかたないわね。　もう行きましょ！\n@c0@"
160:
  de: "@aNera@bDiese Türen kann nur eine Dienerin der Göttin öffnen.\n@c0@"
  en: "@aNera@bThe only one who can open these doors is a maiden with the blessing of the Goddess.\n@c0@"
  es: "@aNera@bSolo una doncella que tenga la bendizione de la Diosa puede abrir estas puertas.\n@c0@"
  fr: "@aNera@bLa seule personne à pouvoir ouvrir ces portes est une jeune fille ayant reçu la bénédiction de la Déesse.\n@c0@"
  it: "@aNera@bSolo una tenera fanciulla il cui cuore è colmo d'amore per la dea può aprire la porta della torre...\n@c0@"
  ja: "@a@bフローラ「この塔の入口は\n\t神につかえる　乙女にしか\n\t開くことは　できないのでしたわね。\n@c0@"
161:
  de: "@aNera@bNachdem ich nun verheiratet bin, zähle ich wohl nicht mehr ganz dazu. Ich glaube nicht, dass ich die Türen öffnen könnte.\n@c0@"
  en: "@aNera@bI suppose I'm no longer considered a maiden now I'm married to you. I doubt I'd be able to open the doors.\n@c0@"
  es: "@aNera@bSembra que, ahora que estamos casados, ya no se me puede llamar doncella. Non credo que pueda aprire las puertas.\n@c0@"
  fr: "@aNera@bJe ne fais plus partie de la catégorie des jeunes filles, maintenant que nous sommes mariés.\r\nÇa m'étonnerait que je puisse ouvrir les portes.\n@c0@"
  it: "@aNera@bIo sono una donna adulta.\nNon credo di essere in grado di aprire la porta...\n@c0@"
  ja: "@a@bフローラ「私は　%a000090さんの\n\t妻になりましたから…　もう\n\tこの扉は　開けられないと思いますわ。\n@c0@"
162:
  de: "@aBianca@bAn diesem Ort herrscht eine wirklich geheimnisvolle Atmosphäre. Und außerdem ist es wunderhübsch hier.\n@c0@"
  en: "@aBianca@bThis place has got a really mysterious feel to it.\r\nAnd it's ever so pretty too.\n@c0@"
  es: "@aBianca@bEste sitio tiene un aire misterioso.\r\nY qué bonito es, además.\n@c0@"
  fr: "@aBianca@bCet endroit possède vraiment une atmosphère très mystérieuse. Et il est tellement joli.\n@c0@"
  it: "@aBianca@bQuesto luogo è ammantato da un'atmosfera misteriosa...\nEd è anche incredibilmente bello.\n@c0@"
  ja: "@a@bビアンカ「ここって\n\t神秘的な感じがして　すごく　きれい。\n\t私　この場所　好きだな……。\n@c0@"
163:
  de: "@aNera@bWährend meiner Zeit im Stift bin ich nie hier gewesen.\n@c0@"
  en: "@aNera@bI never came here during my time at the abbey.\n@c0@"
  es: "@aNera@bVeramente, nunca vine aquí mientras estaba en la abadía.\n@c0@"
  fr: "@aNera@bJe ne suis jamais venue ici pendant mon séjour\r\nà l'abbaye.\n@c0@"
  it: "@aNera@bQuando vivevo all'abbazia non sapevo dell'esistenza di questo posto.\n@c0@"
  ja: "@a@bフローラ「ここには　修道院にいたときも\n\t来たことは　ありませんでしたわ。\n@c0@"
164:
  de: "@aNera@bDamals hätte ich nicht mal im Traum daran gedacht, auf eigene Faust herumzureisen.\n@c0@"
  en: "@aNera@bI wouldn't have dreamt of travelling around by myself back in those days.\n@c0@"
  es: "@aNera@bEn aquellos tiempos ni se me hubiese ocurrido viaggiare sola.\n@c0@"
  fr: "@aNera@bJamais je n'aurais imaginé voyager seule, à l'époque.\n@c0@"
  it: "@aNera@bMa anche se ne avessi sentito parlare, non ci sarei venuta. All'epoca non mi sarei mai sognata di mettermi in viaggio da sola...\n@c0@"
  ja: "@a@bフローラ「あの頃は　ひとりで\n\t町の外を歩くなんて\n\t考えたことも　なかったから……。\n@c0@"
165:
  de: "@aBianca@bWie schade. Warum man es wohl nachts nicht benutzen darf?\n@c0@"
  en: "@aBianca@bThat's a shame. I wonder why you're not allowed to pass of a night.\n@c0@"
  es: "@aBianca@b¡Qué pena! Me pregunto por qué no te permite pasar de noche, ¿sabes?\n@c0@"
  fr: "@aBianca@bDommage. Je me demande pourquoi on n'a pas le droit de passer pendant la nuit.\n@c0@"
  it: "@aBianca@bEh?\nCome mai non si può passare di notte?\n@c0@"
  ja: "@a@bビアンカ「ざんねんね。\n\tでも　どうして　夜は\n\t通っちゃいけないのかしら？\n@c0@"
166:
  de: "@aNera@bMeinst du, er muss zu dieser Zeit hier Wache stehen? Wie ermüdend für ihn!\n@c0@"
  en: "@aNera@bDo you think he has to man this place at this hour? How tiring for him!\n@c0@"
  es: "@aNera@b¿Ma qué hace aquí a estas horas haciendo guardia? ¡Qué agotador!\n@c0@"
  fr: "@aNera@bTu crois qu'il est obligé de garder cet endroit à une heure pareilleⓡ Ça doit être très fatigant pour luiⓠ\n@c0@"
  it: "@aNera@bCredi che quell'uomo resti di guardia tutta la notte?\nOppure si darà il cambio con qualche collega?\n@c0@"
  ja: "@a@bフローラ「あのおじいさんは\n\tこんな時間まで　旅の扉の番を\n\tしているのかしら？　大変ですわ。\n@c0@"
167:
  de: "@aBianca@bAch, hier werden Erinnerungen wach... Weißt du noch, wie wir damals auf Gespensterjagd gingen? Das war ganz schön gruselig, was?\n@c0@"
  en: "@aBianca@bComin' here reminds me of the time we came ghost-bustin' together. That was a scary old night, eh?\n@c0@"
  es: "@aBianca@bEste sitio me recuerda a cuando fuimos a cazar fantasmas juntos. Qué miedo pasamos esa noche, ¿eh?\n@c0@"
  fr: "@aBianca@bRevenir ici me rappelle notre chasse aux fantômes. On a eu drôlement peur, cette nuit-làⓠ\n@c0@"
  it: "@aBianca@bRicordi quando venimmo qui al Palazzo delle Ombre per scacciare i fantasmi?\nChe pazzi che fummo!\n@c0@"
  ja: "@a@bビアンカ「ここに来ると　ふたりで\n\tお化け退治したのを　思い出すわね。\n\tいろいろあって　大変だったけど……。\n@c0@"
168:
  de: "@aBianca@bOb wohl der Graf und die Gräfin immer noch in Frieden ruhen?\n@c0@"
  en: "@aBianca@bI wonder if the Count and Countess are still havin' a nice, peaceful rest.\n@c0@"
  es: "@aBianca@bMe pregunto si el Conde y la Condesa seguirán descansando en paz, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande si le comte et la comtesse reposent toujours en paix.\n@c0@"
  it: "@aBianca@bSpero che il Conte e la Contessa De' Functis si stiano godendo il loro eterno riposo...\n@c0@"
  ja: "@a@bビアンカ「エリック王と　ソフィア王妃は\n\t今も　安らかに　ねむっているのかな？\n@c0@"
169:
  de: "@aNera@bWas machen wir denn an einem verfallenen alten Schloss wie dem hier, %a000090?\n@c0@"
  en: "@aNera@bWhat are we doing at a derelict old castle like this, %a000090?\n@c0@"
  es: "@aNera@b¿Qué hacemos nosotros en un castello en ruinas como este, %a000090?\n@c0@"
  fr: "@aNera@bQue faisons-nous dans un vieux château décrépit comme celui-ci, %a000090ⓡ\n@c0@"
  it: "@aNera@bPerché siamo venuti in questo castello, %a000090?\n@c0@"
  ja: "@a@bフローラ「あら　%a000090さん。\n\tこのような古城に　なんのご用ですの？\n@c0@"
170:
  de: "@aNera@bWas?! Hier hast du mit Bianca mal ein Abenteuer erlebt? Hmpf!\n@c0@"
  en: "@aNera@bWhat!? You came here on an adventure with Bianca once? Hmph!\n@c0@"
  es: "@aNera@b¡¿Cómo?! ¿Que viniste aquí con Bianca de aventuras? ¡Umf!\n@c0@"
  fr: "@aNera@bCommentⓡⓐ Tu es parti un jour à l'aventure dans ce château avec Biancaⓡ Mmpfⓠ\n@c0@"
  it: "@aNera@bChe cosa?!\nSei già stato qui con Bianca tanti anni fa?!\nQuando ti ci metti sai essere odioso, lo sai?!\n@c0@"
  ja: "@a@bフローラ「え！？　以前　ここで\n\tビアンカさんと　冒険をしたのですか。\n@c0@"
171:
  de: "@aNera@bDas Schloss könnte hier und da etwas Mörtel und Farbe vertragen. Es könnte fantastisch aussehen, wenn sich jemand ein wenig darum kümmern würde.\n@c0@"
  en: "@aNera@bIt's a little rough around the edges, but I'm sure the place could look fantastic if only someone would give it a bit of attention.\n@c0@"
  es: "@aNera@bEstá un po' estropeado, pero credo que tendría un aspecto fantástico con solo dedicarle un poco de atención.\n@c0@"
  fr: "@aNera@bC'est un peu rustique, mais je suis certaine que\r\ncet endroit pourrait avoir fière allure pour peu\r\nque quelqu'un s'en occupe un peu.\n@c0@"
  it: "@aNera@bCerto, questo posto è ridotto male, ma basterebbe ristrutturarlo e cambiare il colore della facciata per dargli un aspetto più elegante e signorile...\n@c0@"
  ja: "@a@bフローラ「ちょっと　古びているけど\n\t手入れをすれば　ここも　きっと\n\tステキな　お城になるでしょうね。\n@c0@"
172:
  de: "@aBianca@bWas für ein altes Staubloch, findest du nicht?\n@c0@"
  en: "@aBianca@bIt really is a dusty old hole, eh?\n@c0@"
  es: "@aBianca@bMenudo agujero polvoriento, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est vraiment un vieux château poussiéreux, heinⓡ\n@c0@"
  it: "@aBianca@bChe desolazione...\nE quanta polvere c'è qui dentro!\nCoff! Coff!\n@c0@"
  ja: "@a@bビアンカ「こうして　あらためて見ると\n\tずいぶん　ホコリっぽいわね。\n@c0@"
173:
  de: "@aBianca@bEs ist, als hätte die Zeit stillgestanden, seit wir damals das Bossmonster besiegt haben.\n@c0@"
  en: "@aBianca@bIt's like time's stood still ever since we defeated that boss man last time.\n@c0@"
  es: "@aBianca@bEs como si se hubiese parado el tiempo desde que derrotamos a ese cabecilla la última vez, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que le temps s'est arrêté depuis la fois où on a vaincu le chef des monstres.\n@c0@"
  it: "@aBianca@bCoff! Sembra quasi che il tempo non sia trascorso affatto da quando sconfiggemmo quell'orribile creatura, sai? Coff!\n@c0@"
  ja: "@a@bビアンカ「この城は　私たちが\n\t悪霊の親玉を　やっつけたときから\n\t時間が　止まったままなのかもね。\n@c0@"
174:
  de: "@aNera@b(Hust hust)\nHier drin ist es aber wirklich schrecklich staubig!\n@c0@"
  en: "@aNera@b(cough cough)\nIt's terribly dusty in here!\n@c0@"
  es: "@aNera@b(ejem, ejem)\r\n¡Hay tanto polvo aquí!\n@c0@"
  fr: "@aNera@b(toux)\nQu'est-ce qu'il y a comme poussière, iciⓠ\n@c0@"
  it: "@aNera@bCoff!\nQui dentro ci saranno almeno seicentoventi tonnellate di polvere! Coff! Coff!\n@c0@"
  ja: "@a@bフローラ「ごほっ　ごほっ！\n\t……中は　ずいぶん\n\tホコリっぽいですわね。\n@c0@"
175:
  de: "@aBianca@bIch sehe hier drin nichts Furchteinflößendes mehr. Offenbar haben sich die ganzen Ungeheuer endgültig aus dem Staub gemacht.\n@c0@"
  en: "@aBianca@bI dun't sense anythin' nasty here no more. Looks like all the monsters have gone for good.\n@c0@"
  es: "@aBianca@bYa no siento nada malvado aquí. Parece que todos los monstruos se han marchado para siempre, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne sens plus aucune présence maléfique.\r\nOn dirait que les monstres sont partis pour de bon.\n@c0@"
  it: "@aBianca@bNon percepisco alcuna presenza ostile.\nPare proprio che gli spettri se ne siano andati definitivamente.\n@c0@"
  ja: "@a@bビアンカ「邪悪な気配が　感じられないわ。\n\tもう　悪霊は　この城に\n\tいないみたいね。\n@c0@"
176:
  de: "@aBianca@bAll die Schatten und Winkel waren ganz schön gruselig damals, als wir noch klein waren, was?\n@c0@"
  en: "@aBianca@bAll the shadows and nooks and crannies in this place were pretty scary back when we were kids, eh?\n@c0@"
  es: "@aBianca@bCuando éramos críos, las sombras y los rincones de este sitio daban mucho miedo, ¿eh?\n@c0@"
  fr: "@aBianca@bTous les coins, les recoins et les ombres de ce lieu étaient très effrayants quand nous étions gamins, tu te rappellesⓡ\n@c0@"
  it: "@aBianca@bQuando ci venimmo da bambini, questo posto ci sembrò molto più cupo e sinistro.\n@c0@"
  ja: "@a@bビアンカ「子供のころは　この城の\n\tものかげとか　暗やみとかが\n\tものすごく　こわかったな……。\n@c0@"
177:
  de: "@aNera@bAls du noch klein warst, gab's hier doch mal Gespenster, nicht wahr?\n@c0@"
  en: "@aNera@bThere used to be ghosts here when you were little, didn't there?\n@c0@"
  es: "@aNera@bCuando eras pequeño había fantasmas aquí, ¿vero?\n@c0@"
  fr: "@aNera@bIl y avait des fantômes ici quand tu étais petit, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bÈ vero che tanti anni fa questo castello era infestato dai fantasmi?\n@c0@"
  ja: "@a@bフローラ「子供の時は　このお城に\n\tお化けが　出たんでしょう？\n@c0@"
178:
  de: "@aNera@bIhr müsst schrecklich tapfer gewesen sein, trotzdem hierher zu kommen! Ich weiß ja, es war wegen %a001210, aber trotzdem.\n@c0@"
  en: "@aNera@bYou must have been so brave coming here then! I know it was for %a001210's sake, but still.\n@c0@"
  es: "@aNera@b¡Qué valiente fuiste al venir! Ya sé que lo hiciste por %a001210, pero aun así...\n@c0@"
  fr: "@aNera@bTu devais être très courageux pour t'aventurer ici, à l'époqueⓠ Je sais que c'était pour %a001210, mais quand même.\n@c0@"
  it: "@aNera@bFosti molto coraggioso a venire qui.\nE ti dimostrasti anche incredibilmente generoso, perché lo facesti per salvare %a001210!\n@c0@"
  ja: "@a@bフローラ「%a001210ちゃんを\n\t助けるためとはいえ　よく　そんな\n\t勇気のあることが　できましたわね。\n@c0@"
179:
  de: "@aNera@bIch bin ein wenig eifersüchtig auf Bianca. Ich wünschte, ich wäre es gewesen, die damals mit dir auf dieses Abenteuer auszog.\n@c0@"
  en: "@aNera@bI feel a bit jealous of Bianca. I wish I'd been the one to come here on that adventure with you.\n@c0@"
  es: "@aNera@bSiento un po' de celos de Bianca. Me habría gustado ser io la que te acompañase en esa aventura.\n@c0@"
  fr: "@aNera@bJe suis un peu jalouse de Bianca. Si seulement je pouvais être celle qui t'avait accompagné\r\ndans cette aventure\n@c0@"
  it: "@aNera@bTi confesso che sono un po' gelosa di Bianca...\nAvrei voluto esserci io al tuo fianco quando venisti qui per sconfiggere i fantasmi!\n@c0@"
  ja: "@a@bフローラ「ビアンカさんが　うらやましい。\n\tこのお城で　いっしょに冒険したのが\n\t私だったら　よかったのに……。\n@c0@"
180:
  de: "@aBianca@bDas war letztes Mal richtig unheimlich hier, nicht? Jede Menge Blitz und Donner.\n@c0@"
  en: "@aBianca@bIt was a bit scary last time, eh? All the thunder and lightnin' in this place.\n@c0@"
  es: "@aBianca@bQué miedo pasamos aquella vez, ¿verdad? Los truenos y los relámpagos...\n@c0@"
  fr: "@aBianca@bÇa fichait un peu la frousse, la dernière fois, heinⓡ Sans compter les éclairs et le tonnerre qui grondait.\n@c0@"
  it: "@aBianca@bL'atmosfera era più sinistra la prima volta che venimmo qui, non è vero? ⓕEra una notte buia e tempestosaⓖ... Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「あのときは　ビックリしたわね。\n\tカミナリは鳴るわ　さらわれるわで\n\tたいへんだったわよ。\n@c0@"
181:
  de: "@aNera@bWaren hier Särge anstelle von Betten aufgereiht, als ihr das letzte Mal hier wart? Brrr! Das ist wirklich gruselig!\n@c0@"
  en: "@aNera@bWere there coffins lined up in place of beds when you came here last time? Brrr! That's really creepy!\n@c0@"
  es: "@aNera@b¿La última vez que viniste había una fila de ataúdes en lugar de camas, dices? Brrr... ¡Eso es veramente escalofriante!\n@c0@"
  fr: "@aNera@bIl y avait des cercueils alignés à la place des lits,\nla dernière fois que tu es venuⓡ Brrrⓠ Ça fait\nfroid dans le dosⓠ\n@c0@"
  it: "@aNera@bChe cosa?! Quando venisti qui tanti anni fa c'erano delle bare allineate al posto dei letti?!\nSanta dea, che atmosfera macabra!\n@c0@"
  ja: "@a@bフローラ「冒険した時は　ベッドのところが\n\t全部　カンオケだったんですか？\n\tブルブル…　考えただけで恐ろしいわ。\n@c0@"
182:
  de: "@aBianca@bDu glaubst doch nicht, dass das der Graf und die Gräfin gewesen sein könnten, oder? Die sahen mir ein bisschen zu real aus.\n@c0@"
  en: "@aBianca@bYou dun't think that was the Count and Countess, do you? They looked a bit too real.\n@c0@"
  es: "@aBianca@b¿Tú crees que eran el Conde y la Condesa? Parecían demasiado reales.\n@c0@"
  fr: "@aBianca@bTu ne penses pas que c'était le comte et la comtesse, dis-moiⓡ Ils avaient l'air un peu trop réels.\n@c0@"
  it: "@aBianca@bUhm... Non mi pare che fossero il Conte e la Contessa.\nQuelle due figure sembravano troppo vive per essere per essere dei fantasmi.\n@c0@"
  ja: "@a@bビアンカ「今の…　まさか　王と王妃の霊？\n\tそれにしては　姿が\n\tはっきりしてたみたいだけど……。\n@c0@"
183:
  de: "@aNera@bWaren das lebendige Menschen? Oder waren es etwa...?!\nLiebling, ich bin bange!\n@c0@"
  en: "@aNera@bWere they live humans? Or were they...!?\r\nDarling, I'm scared!\n@c0@"
  es: "@aNera@b¿Eso eran humanos vivos? ¡¿O eran...?!\r\n¡Tengo miedo, caro mio!\n@c0@"
  fr: "@aNera@bC'étaient des gens vivantsⓡ Ou bien est-ce c'étaient...ⓡⓐ Chéri, j'ai peurⓠ\n@c0@"
  it: "@aNera@bErano delle persone?!\nO forse erano dei fant-t-tasmi...?\nTesoro, ho paura!\n@c0@"
  ja: "@a@bフローラ「今のは人でしたか　それとも…？\n\tこ　こわいわ　あなた……。\n@c0@"
184:
  de: "@aBianca@bLiebe über die Klassenschranken hinweg, was? Was meinst du, wer der Höherstehende von beiden war? Er oder sie?\n@c0@"
  en: "@aBianca@bLove across class boundaries, eh? Who do you reckon was the upper class one, then? Him or her?\n@c0@"
  es: "@aBianca@bEl amor supera las barreras sociales, ¿eh? ¿Y quién crees que era el de clase alta? ¿Él o ella?\n@c0@"
  fr: "@aBianca@bL'amour qui transcende les barrières sociales...\nQui était noble, à ton avisⓡ Lui ou elleⓡ\n@c0@"
  it: "@aBianca@bIn effetti, lui è un po' uno zotico...\nMa l'amore vero vola oltre ogni barriera!\nAnche quelle sociali, culturali ed economiche!\n@c0@"
  ja: "@a@bビアンカ「身分ちがいの恋かあ……。\n\tで　身分が高いのは　男の人の方？\n\tそれとも　女の人の方かしら？\n@c0@"
185:
  de: "@aNera@bIst es nicht süß, wie sie zueinander gestanden haben, trotz aller Widrigkeiten?\n@c0@"
  en: "@aNera@bIsn't it sweet that they've stayed together in the face of adversity?\n@c0@"
  es: "@aNera@bQué bello es que hayan seguido juntos a pesar de las adversidades.\n@c0@"
  fr: "@aNera@bC'est très beau qu'ils soient restés ensemble,\r\nunis face à l'adversité.\n@c0@"
  it: "@aNera@bChe dolci che sono quei due!\nSi amano nonostante la famiglia di lei osteggi la loro relazione.\n@c0@"
  ja: "@a@bフローラ「それでも　はなれられない\n\tという関係って　ステキだと\n\t思いませんか？\n@c0@"
186:
  de: "@aNera@bWären Mama und Papa gegen meine Hochzeit mit dir gewesen, wäre ich bestimmt auch von zu Hause weggelaufen.\n@c0@"
  en: "@aNera@bIf Mama and Papa had been against me marrying you, I probably would've run away from home too.\n@c0@"
  es: "@aNera@bSi la mia mamma e il mio papino se hubiesen opuesto a il nostro matrimonio, yo también me habría escapado de casa.\n@c0@"
  fr: "@aNera@bSi mamma et papa avaient été contre notre union,\r\nje me serais sûrement enfuie de la maison, moi aussi.\n@c0@"
  it: "@aNera@bSe i miei genitori non avessero acconsentito al nostro matrimonio, probabilmente anch'io sarei scappata di casa...\n@c0@"
  ja: "@a@bフローラ「私も　もし　%a000090さんとの\n\t結婚を　誰かに反対されたら\n\t家出したかも　知れませんわね。\n@c0@"
187:
  de: "@aBianca@bKlingt, als hätten der Graf und die Gräfin sie mit offenen Armen aufgenommen, was?\n@c0@"
  en: "@aBianca@bSounds like the Count and Countess have bin nice and welcomin' to these two, eh?\n@c0@"
  es: "@aBianca@bParece que el Conde y la Condesa han recibido a estos dos con los brazos abiertos, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait que le comte et la comtesse ont été gentils\net accueillants avec ces deux-là, heinⓡ\n@c0@"
  it: "@aBianca@bSi direbbe che i Conti De' Functis siano stati felici di accogliere questi due piccioncini al Palazzo delle Ombre, eh?\n@c0@"
  ja: "@a@bビアンカ「この人たちを　見かねた\n\tやさしい王と　王妃の霊が\n\tお城に　迎えいれてくれたのかもね。\n@c0@"
188:
  de: "@aNera@bDer Göttin sei Dank, dass sie immer noch leben und uns davon erzählen können. Jeder Tag des Lebens kann neue Hoffnung und neues Glück bringen.\n@c0@"
  en: "@aNera@bThank the Goddess that they're still here to tell the tale. Each day of life could bring new hope and happiness, after all.\n@c0@"
  es: "@aNera@bGrazie a la Diosa que siguen vivos para contarlo. Al fin y al cabo, cada día puede traer la esperanza y la felicità.\n@c0@"
  fr: "@aNera@bHeureusement qu'ils sont encore là pour raconter leur histoire. Chaque jour qui passe devrait être source de nouveaux espoirs et de bonheur.\n@c0@"
  it: "@aNera@bPer fortuna la dea ha illuminato i cuori di questi ragazzi e ha allontanato da loro la tentazione di compiere un gesto estremo e irreparabile!\n@c0@"
  ja: "@a@bフローラ「死なずにすんで　良かったわ。\n\t生きているからこそ　新しい幸せも\n\t見つけられるんですものね。\n@c0@"
189:
  de: "@aBianca@bEs sieht aus, als wäre mit den Gräbern alles in Ordnung. Da fällt mir aber ein Stein vom Herzen.\n@c0@"
  en: "@aBianca@bLooks like all's well with the graves, so that's a relief.\n@c0@"
  es: "@aBianca@bParece que las tumbas están bien, es un alivio, ¿sabes?\n@c0@"
  fr: "@aBianca@bTout semble être normal, avec ces tombes.\r\nC'est rassurant.\n@c0@"
  it: "@aBianca@bPer fortuna le tombe mi sembrano a posto!\nAh, che sollievo!\n@c0@"
  ja: "@a@bビアンカ「お墓に　変わりはないようね。\n\t良かった。\n@c0@"
190:
  de: "@aNera@bHier wurde Bianca lebendig begraben?!\n@c0@"
  en: "@aNera@bBianca was buried alive here!?\n@c0@"
  es: "@aNera@b¡¿Veramente, enterraron viva a Bianca aquí?!\n@c0@"
  fr: "@aNera@bBianca a été enterrée vivante ici mêmeⓡⓐ\n@c0@"
  it: "@aNera@bChe cosa?!\nBianca è stata sepolta viva qui?!\n@c0@"
  ja: "@a@bフローラ「ここに　ビアンカさんが\n\t生き埋めに？\n@c0@"
191:
  de: "@aNera@bIch glaube, ich wäre viel zu verängstigt gewesen, um etwas zu sagen. Ich wäre wahrscheinlich hier gestorben!\n@c0@"
  en: "@aNera@bI think I would've been too scared to speak.\r\nI probably would've ended up dying in there!\n@c0@"
  es: "@aNera@bCredo que yo hubiese estado demasiado asustada per decire niente.\r\n¡Sicuro que hubiese muerto aquí!\n@c0@"
  fr: "@aNera@bJe crois que j'aurais eu trop peur pour crier. J'aurais sûrement fini par mourir là-dedansⓠ\n@c0@"
  it: "@aNera@bAl posto suo sarei morta di paura!\nNon avrei avuto nemmeno la forza di gridare!\n@c0@"
  ja: "@a@bフローラ「私だったら　気絶したまま\n\t声も出せず　そのまま\n\t死んでいたかも　知れませんわ。\n@c0@"
192:
  de: "@aBianca@bHier wurde ich lebendig begraben! Witzige Vorstellung, was? Nicht, dass ich es damals sehr komisch gefunden habe.\n@c0@"
  en: "@aBianca@bThis is where I got buried alive! What a laugh, eh!\r\nNot that it was much fun at the time, mind.\n@c0@"
  es: "@aBianca@b¡Aquí es donde me enterraron viva! ¡Qué risa, ¿verdad?!\r\nBueno, en aquel momento no le vi la gracia.\n@c0@"
  fr: "@aBianca@bC'est ici que j'ai été enterrée vivanteⓠ\nQuelle rigolade, heinⓠ Enfin, je riais plutôt\njaune, sur le moment, il faut bien le dire.\n@c0@"
  it: "@aBianca@bQui è dove io fui sepolta viva! Eh eh eh!\nBeh, ora ci rido sopra, ma all'epoca la cosa mi sembrò tutt'altro che divertente...\n@c0@"
  ja: "@a@bビアンカ「ここだわ　ここ！\n\t私が　生き埋めにされた場所は。\n\tなつかしいわ…　つらかったけど……。\n@c0@"
193:
  de: "@aNera@bDer Graf war seiner Frau offenbar sehr ergeben, nicht?\n@c0@"
  en: "@aNera@bThe Count was obviously really devoted to his wife, wasn't he?\n@c0@"
  es: "@aNera@bEl Conde estaba realmente unido a la sua sposa, ¿vero?\n@c0@"
  fr: "@aNera@bDe toute évidence, le comte était très dévoué à son épouse, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bImmagino che il Conte amasse tantissimo sua moglie, non è vero?\n@c0@"
  ja: "@a@bフローラ「この王妃さまは　とても\n\t王さまに　愛されていましたのね。\n@c0@"
194:
  de: "@aBianca@bMeinst du, der Mann ist ein Gespenst, %a000090?\n@c0@"
  en: "@aBianca@bDo you think that bloke's a ghost, %a000090?\n@c0@"
  es: "@aBianca@b¿Crees que ese tipo es un fantasma, %a000090?\n@c0@"
  fr: "@aBianca@b%0%a000090, tu crois que ce type est un fantômeⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, credi che quello sia un fantasma?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tあのおじさん　ゆうれいかな？\n@c0@"
195:
  de: "@aBianca@bJa, er sieht ein wenig durchsichtig aus, nicht? Meinst du, er kann nicht in Frieden ruhen? Oder glaubst du, er ruht einfach zu gern in der Herberge?\n@c0@"
  en: "@aBianca@bYeah, he looks a bit transparent, eh? Do you think he can't go to his rest? Or do you think he just likes restin' at the inn too much?\n@c0@"
  es: "@aBianca@bSí, tiene un aspecto un poco transparente. ¿Crees que no puede descansar en paz? ¡A lo mejor lo que pasa es que le gusta descansar en la posada!\n@c0@"
  fr: "@aBianca@bOui, il m'a l'air un peu transparent, heinⓡ Tu crois\nqu'il ne peut pas trouver le reposⓡ Ou bien qu'il\naime un peu trop se reposer à l'aubergeⓡ\n@c0@"
  it: "@aBianca@bSì, in effetti è trasparente come tutti gli spettri che si rispettino... O forse è un uomo incredibilmente pallido! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「なんだか　すけてるもんね。\n\t成仏できないのかな？\n\tそれとも　宿屋が　好きなのかな？？\n@c0@"
196:
  de: "@aBianca@bWirklich? Vielleicht sollte ich meine Augen mal untersuchen lassen, was?\n@c0@"
  en: "@aBianca@bReally? Maybe I should get my eyes tested, eh?\n@c0@"
  es: "@aBianca@b¿En serio? Quizá debería revisarme la vista, ¿eh?\n@c0@"
  fr: "@aBianca@bVraimentⓡ Je devrais aller faire vérifier ma vue, dans ce cas...\n@c0@"
  it: "@aBianca@bDici di no?\nForse dovrei farmi controllare la vista...\n@c0@"
  ja: "@a@bビアンカ「そう？\n\t私の目が　悪くなったのかしら……。\n\tいやだわ。\n@c0@"
197:
  de: "@aNera@bL-L-Liebling... Der Schatten dieses Mannes ist ziemlich schwach. Glaubst du, er könnte ein G-Gespenst sein?\n@c0@"
  en: "@aNera@bD-D-Darling... That man's shadow is r-r-rather weak. Do you think he might be a ghost?\n@c0@"
  es: "@aNera@bC-caro... La sombra de ese uomo es muy t-tenue. ¿Crees que podría ser un fantasma?\n@c0@"
  fr: "@aNera@bCh-Ch-Chéri... L'ombre de c-cet homme est\nun peu... légère. Tu crois que c'est un fantômeⓡ\n@c0@"
  it: "@aNera@bAmore, ma quel-l-lo è un fant-t-tasma...?\n@c0@"
  ja: "@a@bフローラ「あ　あ　あの…　%a000090さん。\n\tあの方　カゲが　うすいみたいですけど\n\tもしかして　ゆうれいさんでは？\n@c0@"
198:
  de: "@aNera@bOh! Ach herrje! Mir wird ganz komisch! Fängst du mich auf, wenn ich in Ohnmacht falle?\n@c0@"
  en: "@aNera@bOh! Oh dear! I feel all woozy! Can you hold onto me in case I faint?\n@c0@"
  es: "@aNera@b¡Oh! ¡Oh, cielos! Me siento mareada. ¡Sostenme por si me desmayo!\n@c0@"
  fr: "@aNera@bOhⓠ Oh, par la Déesseⓠ J'ai la tête qui tourneⓠ\nTu me retiendras si je m'évanouis, heinⓡ\n@c0@"
  it: "@aNera@bSanta dea, sto per svenire!\nMarito mio, sorreggimi tu!\n@c0@"
  ja: "@a@bフローラ「う　う～～～～ん………。\n\t%a000090さん　私が　たおれないように\n\t支えてくださいね。\n@c0@"
199:
  de: "@aNera@bN-Na gut. Wenn du dir sicher bist.\n@c0@"
  en: "@aNera@bV-Very well. If you're sure.\n@c0@"
  es: "@aNera@bM-muy bien. Si estás sicuro...\n@c0@"
  fr: "@aNera@bT-Très bien. Si tu en es sûr... (gloups)\n@c0@"
  it: "@aNera@bOh, meglio così!\nNon ho molta simpatia per gli spettri...\n@c0@"
  ja: "@a@bフローラ「わ　わかりました。\n\tでは　私も　気にしませんわ。\n@c0@"
200:
  de: "@aGriselda@bIch hatte mich ja schon gefragt, was du in einem Dorf inmitten der Berge willst. Du bringst mich zur Erholung in ein Kurbad mit heißen Quellen!\n@c0@"
  en: "@aDebora@bI wondered what you were doing coming to a village stuck out in the middle of the mountains. \r\nYou were bringing me to a spa resort!\n@c0@"
  es: "@aStefania@bYa me preguntaba cómo habías osado traerme a un villaggio perdido en las montañas. \r\n¡Me querías dar una sorpresa con un spa!\n@c0@"
  fr: "@aPandora@bJe me demandais ce que tu faisais pour venir te perdre dans un village coincé au milieu des montagnes. En fait, tu m'emmenais dans un spaⓠ\n@c0@"
  it: "@aViola@bMi stavo chiedendo perché fossimo venuti in questo villaggio sperduto tra le montagne...\n㈡\nMa ora ho capito che volevi farmi una sorpresa e portarmi alle terme!\n@c0@"
  ja: "@a@bデボラ「こんな山奥の村に\n\t何の用が　あるのかと思ったら\n\t温泉に　つれてきてくれたのね。\n@c0@"
201:
  de: "@aGriselda@bDu zeigst ja Initiative, %a000090! Das sehe ich gern. Nur weiter so, dann werden du und ich sehr glücklich miteinander werden.\n@c0@"
  en: "@aDebora@bI like your initiative there, %a000090. Keep up the good work and you'll make me a happy wife yet.\n@c0@"
  es: "@aStefania@bMe ha gustado esta iniciativa, %a000090. Sigue así y quizá termine siendo una esposa felice.\n@c0@"
  fr: "@aPandora@bC'est une initiative qui me plaît, %a000090. Continue comme ça et tu feras de moi\nune épouse comblée.\n@c0@"
  it: "@aViola@bMi piace il tuo spirito d'inziativa, %a000090.\nContinua così, e vedrai che la tua adorata mogliettina sarà sempre felice!\n@c0@"
  ja: "@a@bデボラ「なかなか　気がきくじゃない。\n\tこの調子で　私のために\n\tがんばりなさい　%a000090。\n@c0@"
202:
  de: "@aGriselda@bDiese Quellen sind gut für die Haut, nicht?\n@c0@"
  en: "@aDebora@bSoaking in baths like these is good for your skin,\r\nisn't it?\n@c0@"
  es: "@aStefania@bBañarse en estas aguas es bueno para la pelle, ¿no?\n@c0@"
  fr: "@aPandora@bSe tremper comme ça dans des bains est bon\npour la peau, nonⓡ\n@c0@"
  it: "@aViola@bAaah..\nLe terme sono un vero toccasana per la pelle!\n@c0@"
  ja: "@a@bデボラ「温泉に入ると　おハダが\n\tキレイになるのよね。\n@c0@"
203:
  de: "@aGriselda@bDir würde das wahrscheinlich gefallen, wenn ich noch schöner würde, was?\n@c0@"
  en: "@aDebora@bYou'd probably be pleased if I became even more beautiful than I am now, wouldn't you?\n@c0@"
  es: "@aStefania@bAnda que no te gustaría que fuera aún más bellina que ahora, ¿eh?\n@c0@"
  fr: "@aPandora@bTu serais sans doute content que je devienne encore plus belle que je ne le suis déjà, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bScommetto che mi hai portata qui per farmi diventare ancora più bella di quanto io non sia già...\nDico bene?\n@c0@"
  ja: "@a@bデボラ「私が　今よりもっと美しくなったら\n\tうれしいわよね　%a000090？\n@c0@"
204:
  de: "@aGriselda@bDachte ich mir doch. Du hast mich schließlich wegen meiner Schönheit geheiratet, da musst du ja glücklich mit mir werden.\n@c0@"
  en: "@aDebora@bI thought so. You married me for my beauty, after all, so you're bound to be happy.\n@c0@"
  es: "@aStefania@bEso pensaba. Después de todo te casaste conmigo por mi belleza...\n@c0@"
  fr: "@aPandora@bJe m'en doutais. Après tout, tu m'as épousée pour\r\nma beauté, alors tu ne pourrais qu'être heureux.\n@c0@"
  it: "@aViola@bLo sapevo.\nBeh, è difficile migliorare ciò che è già perfetto, non trovi? Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\tこの美しい私と　結婚できたんだから\n\tあんたは幸せなのよ　%a000090。\n@c0@"
205:
  de: "@aGriselda@bDu machst dir doch wohl keine Sorgen, wenn ich noch schöner werde? Du bist doch nicht eifersüchtig?\n@c0@"
  en: "@aDebora@bYou're not worried about me becoming more beautiful? Surely you're not jealous?\n@c0@"
  es: "@aStefania@b¿No te preocupa que me haga più guapa todavía?\n@c0@"
  fr: "@aPandora@bÇa t'est égal que je devienne encore plus magnifiqueⓡⓐ Tu n'es pas jaloux, quand mêmeⓡ\n@c0@"
  it: "@aViola@bCome sarebbe a dire ⓕnoⓖ? Ah, ho capito.\nLa tua gelosia aumenterebbe di pari passo con la mia bellezza. Non hai tutti i torti...\n@c0@"
  ja: "@a@bデボラ「あら　私がこれ以上美しくなるのが\n\t心配なの？　もしかして　生意気にも\n\tやきもちを　やいているのかしら？\n@c0@"
206:
  de: "@aGriselda@bAch, das ist ja irgendwie richtig süß. Dann will ich's dir noch mal nachsehen.\n@c0@"
  en: "@aDebora@bI suppose that's quite sweet in a way.\r\nI'll forgive you.\n@c0@"
  es: "@aStefania@bSupongo que eso es dulce, en cierto modo.\r\nPerdonato.\n@c0@"
  fr: "@aPandora@bEnfin, j'imagine que c'est flatteur, dans un sens.\r\nJe te pardonne.\n@c0@"
  it: "@aViola@bLa gelosia è un sentimento negativo, ma è anche segno di amore.\nPer questa volta ti perdono, caro.\n@c0@"
  ja: "@a@bデボラ「けっこう　かわいいわね　あんた。\n\tそういうところ　悪くないわよ。\n@c0@"
207:
  de: "@aGriselda@bEr will Priester werden? Merkwürdige Idee, wenn du mich fragst. Vor einer Weile hatte Nera auch solche Anwandlungen.\n@c0@"
  en: "@aDebora@bHe wants to be a priest? Very strange, if you\r\nask me. Nera was full of similar ideas a while\r\nback, though.\n@c0@"
  es: "@aStefania@b¿Quiere ser sacerdote? Sembra extraño. Aunque Nera también tenía la sua testa llena con esas cosas hace un tiempo.\n@c0@"
  fr: "@aPandora@bIl veut devenir prêtreⓡ Quelle drôle d'idée, je trouve. Remarque, il y a quelques années de ça, Nera aussi a eu des idées de ce genre.\n@c0@"
  it: "@aViola@bSuo figlio vuole diventare sacerdote? Anni fa anche mia sorella Nera aveva intenzione di prendere i voti, ma a mio padre l'idea non piacque affatto...\n@c0@"
  ja: "@a@bデボラ「神父になりたい…　ですって？\n\t物好きがいるものね。　フローラも　昔\n\t似たようなことを　言っていたけど。\n@c0@"
208:
  de: "@aGriselda@bEs war mir gar nicht aufgefallen, dass es dir solche Freude macht, mein Leibdiener zu sein, aber er hat recht, es steht dir ins Gesicht geschrieben.\n@c0@"
  en: "@aDebora@bI hadn't noticed you were quite so overjoyed about becoming my servant, but he's right, it's written all over your face.\n@c0@"
  es: "@aStefania@bNo me había fijado en que te alegrara tanto convertirte en il mio servitore, pero tiene razón: se te nota.\n@c0@"
  fr: "@aPandora@bJe n'avais pas remarqué que tu étais aussi comblé par le fait de devenir mon domestique. Mais il a raison, ça se lit sur ta figure.\n@c0@"
  it: "@aViola@bÈ ovvio che tu sia felice, ⓕgattoneⓖ mio!\nQualunque uomo al mondo sarebbe entusiasta di avermi sposata!\n@c0@"
  ja: "@a@bデボラ「%a000090ったら　私のしもべに\n\tなれたことが　そんなにうれしかったのね。\n\t喜びが　顔にまで出ているなんて。\n@c0@"
209:
  de: "@aGriselda@bDie Leute sagen immer, ich wäre katzig. Damit meinen sie sicher, ich wäre niedlich, oder?\n@c0@"
  en: "@aDebora@bPeople often say that I'm quite cat-like.\r\nThey must mean I'm sweet, right?\n@c0@"
  es: "@aStefania@bLa gente suele decir que soy bastante felina.\r\nDeben referirse a la mia dolcezza, ¿no?\n@c0@"
  fr: "@aPandora@bLes gens disent souvent que je suis une panthère.\nÇa doit vouloir dire qu'ils me trouvent bien plus belle qu'un simple chat, nonⓡ\n@c0@"
  it: "@aViola@bMolti uomini dicono che io sia bella e sinuosa come una gatta, ma io mi sento più una tigre. Comportati bene, caro, se non vuoi assaggiare i miei artigli...\n@c0@"
  ja: "@a@bデボラ「私　ネコみたいな女だって\n\tよく言われるの。　\n\tかわいらしいって意味よね　もちろん。\n@c0@"
210:
  de: "@a@bGriselda sieht stinksauer aus! Vielleicht wäre es ratsam, einen möglichst schnellen Abgang zu machen.\n@c0@"
  en: "@a@bDebora looks livid! It might be wise to make a\r\nswift exit.\n@c0@"
  es: "@a@b¡Stefania está lívida! Sería conveniente marcharse rápidamente.\n@c0@"
  fr: "@a@bPandora est énervée par l'attitude de la jeune femme. Mieux vaut s'éloigner pour éviter un crêpage de chignon.\n@c0@"
  it: "@a@b%3Viola è imbarazzatissima!\nSarà maglio andar via di corsa...%4\n@c0@"
  ja: "@a@bデボラは　怒りをためている！\n早く　この場をはなれたほうが\nよさそうだ……。\n@c0@"
211:
  de: "@aGriselda@bTja, du könntest wirklich ein Bad gebrauchen, %a000090, du riechst ein wenig streng. Aber das wird wohl warten müssen, wir haben zu tun.\n@c0@"
  en: "@aDebora@bI suppose you think that's funny, do you, %a000090?\n@c0@"
  es: "@aStefania@bSeguro que te parece divertente, ¿eh, %a000090?\n@c0@"
  fr: "@aPandora@bAh, quand mêmeⓠ Comment veux-tu que je reste\nbelle et rayonnante si on ne s'arrête pas de temps\nen tempsⓡ\n@c0@"
  it: "@aViola@bSì, questo posticino non è affatto male.\nPeccato non ci sia nemmeno l'ombra di un negozio di abbigliamento alla moda...\n@c0@"
  ja: "@a@bデボラ「ずいぶんと　つまらない\n\tじょうだんを　言ってくれるじゃない？\n\t%a000090。\n@c0@"
212:
  de: "@aGriselda@bDie Quellen hier sind gut für die Haut, weißt du. Wir sind auch gar nicht weit von Mostroferrato, also sollten wir vielleicht bald wieder herkommen.\n@c0@"
  en: "@aDebora@bThe baths here are good for your skin, you know. We're not far from Mostroferrato, either, so maybe we should come again soon.\n@c0@"
  es: "@aStefania@bEstos baños son buenos para la pelle. Y no estamos lejos de Mostroferrato, así que podríamos volver cada poco.\n@c0@"
  fr: "@aPandora@bLes bains d'ici sont bons pour la peau, tu sais. Et nous ne sommes pas très loin de Mostroferrato,\r\nalors on pourrait peut-être y revenir bientôt.\n@c0@"
  it: "@aViola@bL'acqua termale fa bene alla pelle. E questo posto non è nemmeno lontano da Mostroferrato!\r\nVoglio che mi porti alle terme più spesso, caro.\n@c0@"
  ja: "@a@bデボラ「この温泉　おハダに　いいのね。\n\tサラボナからも近いし\n\tそのうち　また来てみるのも悪くないわ。\n@c0@"
213:
  de: "@aGriselda@bHier wohnt Bianca, nicht? Wenn du willst, kannst du kurz bei ihr vorbeischauen.\n@c0@"
  en: "@aDebora@bThis is where that Bianca lives, isn't it?\r\nYou can drop in on her briefly if you like.\n@c0@"
  es: "@aStefania@bAquí es donde vive esa Bianca, ¿no?\r\nTe permito visitarla per breve tempo.\n@c0@"
  fr: "@aPandora@bC'est ici que vit Bianca, n'est-ce pasⓡ Tu peux passer la voir rapidement, si tu veux.\n@c0@"
  it: "@aViola@bSe non sbaglio la tua amica Bianca vive qui.\nSe ti va, ti concedo di andare a salutarla.\n@c0@"
  ja: "@a@bデボラ「たしかここに　あのビアンカ　って娘が\n\t住んでいるのよね？　少しくらいなら\n\t様子を　見に行ってきてもいいわよ。\n@c0@"
214:
  de: "@aGriselda@bIch bin nicht der Typ, der schnell eifersüchtig wird. Ich bin sehr großzügig, wie du weißt.\n@c0@"
  en: "@aDebora@bI'm not the kind to get jealous about that sort of thing. I'm very generous, you know.\n@c0@"
  es: "@aStefania@bNo soy de esas que se ponen celosas por estas cosas. Veramente, soy de lo más generosa, ¿sabes?\n@c0@"
  fr: "@aPandora@bJe ne suis pas du genre à être jalouse de ces choses-là. Je suis très généreuse, tu sais.\n@c0@"
  it: "@aViola@bCome vedi, la mia gelosia non mi impedisce di compiere atti di grande generosità verso di te, maritino mio...\n@c0@"
  ja: "@a@bデボラ「あら　そのくらいのことで\n\t妬かないわよ。　私は　心が広いから。\n@c0@"
215:
  de: "@aGriselda@bHier gibt's gar nichts außer den heißen Quellen. Dann fällt mein Einkaufsbummel wohl ins Wasser.\n@c0@"
  en: "@aDebora@bThere's nothing to this place apart from the baths. Looks like I'll have to give up on my idea of shopping for new clothes.\n@c0@"
  es: "@aStefania@bEn este sitio no hay nada aparte de los baños. Credo que puedo olvidarme de mi idea de comprar un vestido nuovo.\n@c0@"
  fr: "@aPandora@bÀ part les bains, il n'y a rien, ici. Je vais devoir abandonner l'idée de m'acheter de nouveaux vêtements, on dirait.\n@c0@"
  it: "@aViola@bSi direbbe che qui non ci sia nulla oltre le terme...\nE io che speravo di trovare qualche bel negozietto di moda per rinnovare il mio guardaroba...\n@c0@"
  ja: "@a@bデボラ「温泉以外　本当に　何もない村ね。\n\tここで　新しい服を買うのは\n\tあきらめるしか　なさそうだわ。\n@c0@"
216:
  de: "@aGriselda@bAch ja. Hier wurde mein Schleier hergestellt. Er war überraschend hochwertig gefertigt.\n@c0@"
  en: "@aDebora@bOh yes. My veil was made here.\nIt was surprisingly well-crafted.\n@c0@"
  es: "@aStefania@b¡Oh!, sí. Aquí hicieron mi velo. Era veramente excepiconal.\n@c0@"
  fr: "@aPandora@bOh, oui. C'est ici qu'a été fait mon voile.\r\nIl avait été étonnament bien travaillé.\n@c0@"
  it: "@aViola@bQui è dove è stato realizzato il mio meraviglioso velo nuziale. L'artigiano che l'ha tessuto ha fatto un lavoro egregio.\n@c0@"
  ja: "@a@bデボラ「ふうん　あのヴェールって\n\tここで　作られたものだったのね。\n\tなかなか　悪くない出来だったわ。\n@c0@"
217:
  de: "@aGriselda@bDas Paradies des Weißen Königs? Wenn du mich fragst, klingt das wie die fixe Idee irgendeines Spinners.\n@c0@"
  en: "@aDebora@bA White King's Paradise? Sounds like a figment of someone's imagination, if you ask me.\n@c0@"
  es: "@aStefania@b¿Paraíso del Rey Blanco? A mí me suena a parto della fantasia, qué quieres que te diga.\n@c0@"
  fr: "@aPandora@bUn Paradis du Roi blancⓡ Ça ressemble au fruit de l'imagination de quelqu'un, si tu veux mon avis.\n@c0@"
  it: "@aViola@bQuesto ⓕParadiso del Re Biancoⓖ mi sa tanto di fregatura...\n\n@c0@"
  ja: "@a@bデボラ「光の国をつくる　ねえ……。\n\tなんだか　うさんくさい話だわ。\n@c0@"
218:
  de: "@aGriselda@bIch wette, das ist bloß wieder eine Masche, um den Leuten das Geld aus der Tasche zu ziehen. Da ist nichts Frommes dabei!\n@c0@"
  en: "@aDebora@bI bet it's just a scam they've come up with to take money from people. There's nothing holy about that!\n@c0@"
  es: "@aStefania@bSeguro que es una truffa para estafar a la gente. ¡Eso no tiene nada de paradisíaco!\n@c0@"
  fr: "@aPandora@bJe parie que c'est juste une arnaque inventée pour soutirer de l'argent aux gens. Il n'y a rien de divin, là-dedansⓠ\n@c0@"
  it: "@aViola@bSecondo me è solo uno stratagemma escogitato da qualche furbacchione per spillare soldi ai creduloni...\n@c0@"
  ja: "@a@bデボラ「お金を　集めるだけ集めて\n\t教団のえらい連中が　独り占め……\n\tなんてことも　ありそうよね。\n@c0@"
219:
  de: "@aGriselda@bDie Herberge ist nicht schlecht. Man kann die heißen Quellen nutzen, wann immer man will. Hier übernachten wir, %a000090.\n@c0@"
  en: "@aDebora@bThis inn's not bad. You can go in the baths whenever you want and everything. We'll stay here tonight, %a000090.\n@c0@"
  es: "@aStefania@bNo está mal esta posada. Puedes ir a los baños cuando quieres. Esta notte nos quedamos aquí, %a000090.\n@c0@"
  fr: "@aPandora@bL'auberge n'est pas mal. On peut accéder aux bains\nà tout moment. On va passer la nuit ici, %a000090.\n@c0@"
  it: "@aViola@bHo deciso, %a000090: stanotte dormiremo qui.\nLa locanda è carina, e basta un attimo per arrivare ai bagni termali. Cosa potremmo volere di più?\n@c0@"
  ja: "@a@bデボラ「けっこういい宿ね。\n\t好きな時に　温泉に入れるし。\n\t今夜は　ここに泊まるわよ　%a000090。\n@c0@"
220:
  de: "@aGriselda@bIch bin überrascht, in einem so kleinen Dorf eine Schänke zu finden. Die muss für die Quellenbesucher sein.\n@c0@"
  en: "@aDebora@bI'm surprised to see a pub in such a small village.\r\nIt must be for the bath-goers.\n@c0@"
  es: "@aStefania@bMe sorprende ver una taberna en una aldea tan piccola.\r\nDebe de ser por los baños.\n@c0@"
  fr: "@aPandora@bJe suis surprise de voir une taverne dans un village aussi petit. Ça doit être pour les clients des bains.\n@c0@"
  it: "@aViola@bChe carina questa taverna! Scommetto che la maggior parte dei clienti è costituita dai turisti che vanno a fare il bagno alle terme...\n@c0@"
  ja: "@a@bデボラ「こんな小さな村にも\n\t酒場が　あるのね。　おどろいたわ。\n\tきっと　温泉客用なのね。\n@c0@"
221:
  de: "@aGriselda@bWarum sollte jemand mit einem Funken Verstand etwas mit diesem Paradies des Weißen Königs zu tun haben wollen? Das klingt mir doch sehr dubios.\n@c0@"
  en: "@aDebora@bWhy would anyone in their right mind want anything to do with this White King's Paradise? It sounds dodgy as anything to me.\n@c0@"
  es: "@aStefania@b¿Por qué alguien en su sano juicio se interesaría en el Paraíso del Rey Blanco? Veramente, suena de lo más sospechoso.\n@c0@"
  fr: "@aPandora@bQu'est-ce que quelqu'un de censé voudrait bien avoir à faire avec ce Paradis du Roi blancⓡ\nÇa m'a l'air louche comme tout, ce truc.\n@c0@"
  it: "@aViola@bNon capisco come mai tanta gente sia attratta dal Paradiso del Re Bianco.. Ogni volta che lo sento nominare, sento una gran puzza di bruciato.\n@c0@"
  ja: "@a@bデボラ「光の国だなんて\n\tあんな　いかにも　あやしそうな場所に\n\t行きたがるだなんて…　理解できないわ。\n@c0@"
222:
  de: "@aGriselda@bDiese Bianca ist anscheinend heute nicht da.\n@c0@"
  en: "@aDebora@bLooks like that Bianca girl isn't around today.\n@c0@"
  es: "@aStefania@bSembra que la tal Bianca no está hoy.\n@c0@"
  fr: "@aPandora@bOn dirait que cette Bianca n'est pas dans le coin, aujourd'hui.\n@c0@"
  it: "@aViola@bBianca non c'è oggi...\nTi dispiace, eh?\n@c0@"
  ja: "@a@bデボラ「あの　ビアンカって娘\n\t今日は　いないのね。\n@c0@"
223:
  de: "@aGriselda@bWo wir schon mal da sind, können wir auch hier übernachten. Ich nehme noch ein Bad, bevor ich ins Bett gehe.\n@c0@"
  en: "@aDebora@bWe may as well stay the night now we're here.\nI'll have a bath before bed.\n@c0@"
  es: "@aStefania@bYa que estamos aquí podemos pasar la notte.\nMe daré un bagno antes de acostarme.\n@c0@"
  fr: "@aPandora@bPuisqu'on est là, autant passer la nuit sur place.\r\nJe vais prendre un bain avant d'aller au lit.\n@c0@"
  it: "@aViola@bGià che ci siamo, possiamo trascorrere la notte qui.\nCredo che farò un bel bagno rilassante prima di andare a dormire...\n@c0@"
  ja: "@a@bデボラ「せっかく来たんだし\n\t今夜は　ここに泊まるわよ。\n\t私　寝る前に　温泉に入りたいの。\n@c0@"
224:
  de: "@aGriselda@bEs war mir gar nicht aufgefallen, dass es dir solche Freude macht, mein Leibdiener zu sein, aber er hat recht, es steht dir ins Gesicht geschrieben.\n@c0@"
  en: "@aDebora@bI hadn't noticed you were quite so overjoyed about becoming my servant, but he's right, it's written all over your face.\n@c0@"
  es: "@aStefania@bNo me había fijado en que te alegrara tanto convertirte en il mio servitore, pero tiene razón: se te nota.\n@c0@"
  fr: "@aPandora@bJe n'avais pas remarqué que tu étais aussi comblé par le fait de devenir mon domestique. Mais il a raison, ça se lit sur ta figure.\n@c0@"
  it: "@aViola@bÈ ovvio che tu sia felice, ⓕgattoneⓖ mio!\nQualunque uomo al mondo sarebbe entusiasta di avermi sposata!\n@c0@"
  ja: "@a@bデボラ「%a000090ったら　私のしもべに\n\tなれたことが　そんなにうれしかったのね。\n\t喜びが　顔にまで出ているなんて。\n@c0@"
225:
  de: "@aGriselda@bHmm... Vielleicht bist du ja stärker, als du aussiehst. Vielleicht wirkst du ja bloß schmächtiger, als du eigentlich bist.\n@c0@"
  en: "@aDebora@bHmm... Maybe you're stronger than you seem.\r\nMaybe you just look scrawnier than you really are.\n@c0@"
  es: "@aStefania@bMmm... Quizá seas más forte de lo que parece.\r\nQuizá no seas tan enclenque como aparentas.\n@c0@"
  fr: "@aPandora@bMmm... Tu es peut-être plus fort que tu n'en as l'air. Il est possible que cet aspect maigrichon ne reflète pas la réalité. \n@c0@"
  it: "@aViola@bUhm...\nSai? Ti facevo più magrolino.\nForse sei più forte di quanto sembri.\n@c0@"
  ja: "@a@bデボラ「あら　あんたって　見た目より\n\tたくましい身体を　しているじゃないの。\n\t着やせする　タイプなのかしら。\n@c0@"
226:
  de: "@aGriselda@bEs könnte interessant sein, das herauszufinden!\n@c0@"
  en: "@aDebora@bIt should be interesting to find out!\n@c0@"
  es: "@aStefania@b¡Sería interessante descubrirlo!\n@c0@"
  fr: "@aPandora@bÇa devrait être intéressant de le découvrirⓠ\n@c0@"
  it: "@aViola@bSe solo avessi l'atteggiamento da duro, saresti proprio un gran bel pezzo d'uomo!\n@c0@"
  ja: "@a@bデボラ「ふうん…　いろいろと　楽しみだわ。\n@c0@"
227:
  de: "@aGriselda@bDer Schleier war gar nicht schlecht. Schließlich wurde er eigens für mich angefertigt, und er hat mir natürlich wunderbar gestanden.\n@c0@"
  en: "@aDebora@bIt wasn't a bad veil. It was made especially for me for one thing, and it suited me, of course.\n@c0@"
  es: "@aStefania@bNo era un mal velo. Me lo hicieron a medida, claro, y por supuesto me quedaba bene.\n@c0@"
  fr: "@aPandora@bIl n'était pas mal, ce voile. Il avait été fait spécialement pour moi, pour commencer,\r\net puis il m'allait bien, évidemment.\n@c0@"
  it: "@aViola@bIl velo nuziale che ho indossato il giorno del nostro matrimonio era splendido. Indossato da me, poi, sembrava ancora più bello! Mi stava d'incanto.\n@c0@"
  ja: "@a@bデボラ「悪くない　ヴェールだったわ。\n\t私のための　ものなんだから\n\tそれに　ふさわしいものじゃないとね。\n@c0@"
228:
  de: "@aGriselda@bEr schläft tief und fest. Es wird ihm sicher nicht gefallen, wenn wir ihn jetzt wecken, also lass uns gehen.\n@c0@"
  en: "@aDebora@bHe's fast asleep. We won't be very popular if we wake him, so let's get out of here.\n@c0@"
  es: "@aStefania@bEstá in un sonno profondo. No nos haremos muy populares si lo despertamos, así que salgamos, ¿capisci?\n@c0@"
  fr: "@aPandora@bIl dort à poings fermés. Ça risque de n'être pas bien pris si on le réveille, sortons d'ici.\n@c0@"
  it: "@aViola@bDorme come un bambino, e sono sicura che non la prenderà bene se lo svegliamo.\nAndiamo via...\n@c0@"
  ja: "@a@bデボラ「このおじさん　ぐっすり　眠ってるわ。\n\t起こしたら　めんどうなことに\n\tなりそうだし……　早く　行くわよ。\n@c0@"
229:
  de: "@aGriselda@bDu glaubst doch nicht, dass sie aufbleiben will, bis ihr Mann nach Hause kommt? Na, die ist ja ganz schön hinter ihm her!\n@c0@"
  en: "@aDebora@bYou don't think she's planning on staying up waiting for her husband to come home, do you? She's keen!\n@c0@"
  es: "@aStefania@bNo creerás que piensa quedarse despierta esperando a que il suo marido vuelva, ¿no?\n¡Qué amabilidad!\n@c0@"
  fr: "@aPandora@bTu ne crois pas qu'elle a l'intention de rester debout à attendre que son mari rentre à la maison, siⓡ\nElle a le moralⓠ\n@c0@"
  it: "@aViola@bNon dirmi che quella signora ha intenzione di restare sveglia fin quando il marito non rientrerà a casa!\n@c0@"
  ja: "@a@bデボラ「もしかして　この人\n\tダンナがもどってくるまで　起きて\n\t待っているつもり？　物好きね。\n@c0@"
230:
  de: "@aGriselda@bNur damit du nicht auf dumme Ideen kommst: So was werde ich auf gar keinen Fall tun! Und ich würde dich auch nicht vor mir ins Bett gehen lassen.\n@c0@"
  en: "@aDebora@bJust so you know, there's no way I'd ever do that.\r\nI wouldn't let you go to bed before me, either.\n@c0@"
  es: "@aStefania@bPara que lo sepas, yo jamás lo haría.\r\nY tampoco te dejaría andare a dormir antes que yo.\n@c0@"
  fr: "@aPandora@bJuste pour que tu sois au courant, il n'est pas question que je fasse ça un jour. Et puis je ne te laisserai jamais aller te coucher avant moi, non plus.\n@c0@"
  it: "@aViola@bSappi che non ho alcuna intenzione di fare come lei.\nTu andrai sempre a dormire prima di me, e all'ora che ti dirò io!\n@c0@"
  ja: "@a@bデボラ「言っておくけど\n\t私は　そんなマネは　しないわよ。\n\tあんたが先に寝るのは　許さないけど。\n@c0@"
231:
  de: "@aGriselda@bWas denkst du dir eigentlich dabei, die Leute einfach so beim Schlafen zu stören? Willst du dich vielleicht unbeliebt machen?\n@c0@"
  en: "@aDebora@bWhat do you think you're doing, bothering people while they're sleeping? Are you trying to make yourself unpopular?\n@c0@"
  es: "@aStefania@bHay que estar mal de la testa para espiar a la gente durmiendo.\n㈡\n¿Pretendes que crean que estás loco?\n@c0@"
  fr: "@aPandora@bPourquoi est-ce que tu t'acharnes à déranger les gens pendant qu'ils dormentⓡ Tu cherches à te faire détester ou quoiⓡ\n@c0@"
  it: "@aViola@bNon devi guardare le altre donne mentre dormono!\nE nemmeno quando sono sveglie!\nMi sono spiegata?!\n@c0@"
  ja: "@a@bデボラ「他の女の　寝顔を　のぞくだなんて\n\tヘンタイよ。　タイホされても\n\t私は　助けないわよ。　わかってる！？\n@c0@"
232:
  de: "@aGriselda@bWenn du mal jemanden weckst und eine Ohrfeige verpasst kriegst, brauchst du dich nicht an meiner Schulter auszuweinen!\n@c0@"
  en: "@aDebora@bWell don't blame me if you wake someone up and get a clip around the ear!\n@c0@"
  es: "@aStefania@bVa bene, ma si te llevan al manicomio, yo no te pienso sacar.\n@c0@"
  fr: "@aPandora@bAh ouiⓡ Eh bien, ne viens pas te plaindre si quelqu'un finit par t'en coller une pour l'avoir réveilléⓠ\n@c0@"
  it: "@aViola@bPerfetto.\nAllora andiamocene.\n@c0@"
  ja: "@a@bデボラ「わかっているなら\n\tさっさと　そこから　はなれなさいよ！\n@c0@"
233:
  de: "@aGriselda@bNa dann mach, dass du hier wegkommst!\n@c0@"
  en: "@aDebora@bWell get away from her then!\n@c0@"
  es: "@aStefania@b¡Pues aléjate de ella!\n@c0@"
  fr: "@aPandora@bAlors laisse-la tranquille, nom d'un chienⓠ\n@c0@"
  it: "@aViola@bAh, no?!\nAllora te lo spiegherò di nuovo, a suon di cazzotti sul naso!\n@c0@"
  ja: "@a@bデボラ「いいから　早く\n\tそこから　はなれなさい！\n@c0@"
234:
  de: "@aGriselda@bDu willst doch sicher keine andere Frau als mich im Schlaf beobachten, oder? Gehen wir!\n@c0@"
  en: "@aDebora@bSurely you don't want to watch any woman but me sleeping. Let's go!\n@c0@"
  es: "@aStefania@bNo es posible que te interese ver durmiendo a otras mujeres. ¡Andiamo!\n@c0@"
  fr: "@aPandora@bTu ne peux sûrement pas avoir envie de regarder dormir une autre femme que moi. Partonsⓠ\n@c0@"
  it: "@aViola@bL'unica donna che puoi guardare mentre dorme sono io.\nAndiamocene, prima che mi arrabbi...\n@c0@"
  ja: "@a@bデボラ「私以外の　女の寝顔を見ていたって\n\t面白くも　なんともないでしょう？\n\tほら　もう行くわよ。\n@c0@"
235:
  de: "@aGriselda@bEr hat ein gutes Urteilsvermögen. Bianca ist wirklich ein toller Fang. Mit mir natürlich nicht zu vergleichen.\n@c0@"
  en: "@aDebora@bHe has a good eye for people. Bianca is definitely a catch. Not as much of one as me, of course.\n@c0@"
  es: "@aStefania@bTiene buon ojo. Bianca es un buen partido. Ma no tanto como yo, claro está.\n@c0@"
  fr: "@aPandora@bIl a l'œil, pour juger les gens. Bianca est effectivement un beau parti.\r\nPas autant que moi, bien sûr.\n@c0@"
  it: "@aViola@bOvviamente questo tipo non mi ha mai vista, altrimenti sognerebbe me, e non Bianca...\n@c0@"
  ja: "@a@bデボラ「この男　人を見る目があるわね。\n\tあのビアンカって娘は　本当に　いい子よ。\n\t私のほうが　いい女だけど。\n@c0@"
236:
  de: "@aGriselda@bSieht aus, als wäre ich nicht die Einzige, die das Ganze ein bisschen zwielichtig findet.\n@c0@"
  en: "@aDebora@bLooks like I'm not the only one who finds the whole thing a bit fishy.\n@c0@"
  es: "@aStefania@bSembra que no soy la única a la que esto le parece un tanto sospechoso.\n@c0@"
  fr: "@aPandora@bApparemment, je ne suis pas la seule à trouver\r\nque tout ça sent mauvais.\n@c0@"
  it: "@aViola@bPare proprio che io non sia la sola a pensare che questa storia del Paradiso del Re Bianco sia un affare poco chiaro...\n@c0@"
  ja: "@a@bデボラ「私以外にも　光の国の教団を\n\tうさんくさく　感じている人がいたのね。\n@c0@"
237:
  de: "@aGriselda@bDachte ich mir doch. Der hat eine Schwäche für Bianca, oder?\n@c0@"
  en: "@aDebora@bI thought so. He's got a thing for Bianca, hasn't he?\n@c0@"
  es: "@aStefania@b¡Ma claro!. Anda detrás de Bianca, ¿no?\n@c0@"
  fr: "@aPandora@bJe m'en doutais. Il en pince pour Bianca,\nn'est-ce pasⓡ\n@c0@"
  it: "@aViola@bSe il mio fiuto non m'inganna, e il mio fiuto non s'inganna mai, quel tipo ha una cotta per Bianca.\n@c0@"
  ja: "@a@bデボラ「そうじゃないかとは　思っていたけど\n\tやっぱり　あの男\n\tビアンカって娘のことが……。\n@c0@"
238:
  de: "@aGriselda@bIch würde nie so wütend werden, wenn du mal zu viel trinken würdest. Ich würde dir einfach verbieten, je wieder was zu trinken!\n@c0@"
  en: "@aDebora@bI wouldn't get angry like that if you ever had\r\ntoo much to drink. I'd just forbid you from ever drinking again!\n@c0@"
  es: "@aStefania@bYo no me enfadaría así si alguna vez bebieras troppo, ma podrías sufrir un accidente ¿capisci?\n@c0@"
  fr: "@aPandora@bSi jamais un jour tu avais trop bu, je ne me mettrais jamais en colère comme ça. Je t'interdirais tout simplement de toucher un seul verre à l'avenirⓠ\n@c0@"
  it: "@aViola@bForse non te l'ho detto, ma per te vale il coprifuoco: dovrai essere a casa sempre prima di me, e mai dopo il tramonto, altrimenti saranno dolori.\n㈡\nPer te, ovviamente.\n@c0@"
  ja: "@a@bデボラ「あんたが　こんなふうに\n\t飲み過ぎても　別に　怒ったりしないわ。\n\t２度と飲むな！　って　命令するだけよ。\n@c0@"
239:
  de: "@aGriselda@bBlitzendes Badesalz ist eine berühmte regionale Spezialität, wenn ich mich recht erinnere.\n@c0@"
  en: "@aDebora@bScintillating sinter is a famous local speciality,\r\nif I remember rightly.\n@c0@"
  es: "@aStefania@bLas sales destellantes son una famosa especialità local, si mal no recuerdo.\n@c0@"
  fr: "@aPandora@bLes sels scintillants sont une spécialité locale réputée, si je me souviens bien.\n@c0@"
  it: "@aViola@bI sali da bagno scintillanti sono il prodotto tipico di Aprianuam.\n@c0@"
  ja: "@a@bデボラ「秘湯の花って　たしか\n\tこの村の　名産品だったはずよ。\n@c0@"
240:
  de: "@aGriselda@bEs klingt aber nicht so, als käme er von hier. Auf mich wirkt er ein wenig suspekt.\n@c0@"
  en: "@aDebora@bIt doesn't sound like he's from around here, though. He's a bit of a dodgy character, I'd say.\n@c0@"
  es: "@aStefania@bAunque no parece ser de por aquí. A mí me parece un personaggio sospechoso.\n@c0@"
  fr: "@aPandora@bIl n'a pourtant pas l'air d'être du coin. Il est un peu louche, comme type, je trouve.\n@c0@"
  it: "@aViola@bSono famosi in tutto il mondo per le loro proprietà rilassanti e tonificanti.\nAh, dimenticavo: sono anche estremamente rari...\n@c0@"
  ja: "@a@bデボラ「この村の　住人じゃないみたいだし\n\tどうも　うさんくさいわね　あの男。\n@c0@"
241:
  de: "@aGriselda@bDie Bäder duften ganz herrlich. Ob das wohl an dem Blitzenden Badesalz liegt?\n@c0@"
  en: "@aDebora@bThere is a lovely smell coming off the baths, actually. I wonder if that's the scintillating sinter.\n@c0@"
  es: "@aStefania@bDe los baños llega un olor veramente agradable. Me pregunto si será por las sales destellantes.\n@c0@"
  fr: "@aPandora@bLes bains dégagent un délicieux parfum.\nJe me demande si ça vient des sels scintillants.\n@c0@"
  it: "@aViola@bSenti come profumano i sali da bagno scintillanti!\nSono meravigliosi...\n@c0@"
  ja: "@a@bデボラ「そういえば　この村の温泉に近づくと\n\tふわっと　いい香りがしていたわね。\n\tこの秘湯の花と　同じにおいだったわ。\n@c0@"
242:
  de: "@aGriselda@bWir sollten uns wirklich etwas Zeit für ein Bad nehmen, so lange wir hier sind.\n@c0@"
  en: "@aDebora@bWe should definitely take some time for a bath while we're here.\n@c0@"
  es: "@aStefania@bYa que estamos aquí, deberíamos probar los baños.\n@c0@"
  fr: "@aPandora@bIl faut absolument qu'on prenne le temps de se baigner, pendant qu'on est ici.\n@c0@"
  it: "@aViola@bDato che siamo qui, potremmo anche fare un bagno.\nSì, ho proprio voglia di immergermi nelle acque delle terme...\n@c0@"
  ja: "@a@bデボラ「せっかくだから\n\t温泉にも　入っていきましょう。\n@c0@"
243:
  de: "@aGriselda@bWarum steigt er denn dann nicht einfach aus dem Brunnen raus? Oder sitzt er fest? Ist er zu schwach, um allein rauszuklettern?\n@c0@"
  en: "@aDebora@bWhy doesn't he just get out of the well then?\r\nOr is he stuck? Too weak to climb out on his own?\n@c0@"
  es: "@aStefania@bMa entonces, ¿por qué no sale del pozo?\r\n¿Está atascado?\n¿Es demasiado débil para salir solo?\n@c0@"
  fr: "@aPandora@bPourquoi il ne sort pas de ce puits, alorsⓡ\nÀ moins qu'il soit coincéⓡ Trop faible pour\nressortir tout seul en grimpantⓡ\n@c0@"
  it: "@aViola@bCome mai non esce dal pozzo?\nAspetta che qualcuno lo tiri fuori con la forza?\n@c0@"
  ja: "@a@bデボラ「あんなことを　言うくらいなら\n\tさっさと　ここから　出ればいいのに。\n\tもしかして　自力で　外に出られないとか？\n@c0@"
244:
  de: "@aGriselda@bAber er kann wohl nicht gut um Hilfe bitten, wenn er sich hier heimlich das ganze Blitzende Badesalz unter den Nagel reißt.\n@c0@"
  en: "@aDebora@bI suppose he can't ask anyone for help if he is, though, what with being here picking scintillating sinter on the sly.\n@c0@"
  es: "@aStefania@bVa bene, supongo que no podrá pedir ayuda si está cogiendo sales destellantes en secreto.\n@c0@"
  fr: "@aPandora@bSi c'est le cas, j'imagine qu'il ne peut demander de l'aide à personne, vu qu'il était en train de ramasser des sels scintillants en cachette.\n@c0@"
  it: "@aViola@bForse preferisce starsene qui al fresco in compagnia dei suoi preziosi sali da bagno?\n@c0@"
  ja: "@a@bデボラ「だとしても　村の人に助けてもらう\n\tわけには　いかないわよね。\n\tナイショで　秘湯の花を取っているんだし。\n@c0@"
245:
  de: "@aGriselda@bHa ha! Bist du sprachlos angesichts meiner Schönheit, %a000090? Du bist eben doch simpel gestrickt.\n@c0@"
  en: "@aDebora@bHa ha! Are you speechless in the face of my beauty, %a000090? You're a simple little thing at times!\n@c0@"
  es: "@aStefania@b¡Ja ja! ¿Te has quedado sin palabras ante la mia hermosura, %a000090? ¡Qué simple eres a veces!\n@c0@"
  fr: "@aPandora@bHa haⓠ Resterais-tu sans voix face à ma beauté, %a000090ⓡ Tu es une petite chose toute simple, parfoisⓠ\n@c0@"
  it: "@aViola@bChe ti prende, %a000090?\nPerché mi guardi e non favelli? Ancora non ti sei abituato alla mia sfolgorante bellezza?\n@c0@"
  ja: "@a@bデボラ「フフッ　私の美しさを前に\n\t声も出ない……　ってところかしら？\n\tウブなのね　%a000090って。\n@c0@"
246:
  de: "@aGriselda@bDann ist sie eben nicht hier. Und? So oder so kann mir das egal sein.\n@c0@"
  en: "@aDebora@bSo she's not here. So what?\nI'm not bothered either way.\n@c0@"
  es: "@aStefania@bAsí que no está aquí. ¿Y qué?\nEn cualquier caso me da igual.\n@c0@"
  fr: "@aPandora@bElle n'est pas là, donc. Bon, et alorsⓡ\nL'un ou l'autre, ça m'est égal.\n@c0@"
  it: "@aViola@bBianca non è qui.\nPersonalmente, la cosa non mi fa né caldo né freddo, ma immagino che ci tenessi a vederla...\n@c0@"
  ja: "@a@bデボラ「ふうん…\n\tあの娘　今はいないのね。\n\tまあ　私には　興味ないけど。\n@c0@"
247:
  de: "@aGriselda@bEs sieht so aus, als würde Bianca vor heute Abend nicht nach Hause kommen. Hast du eine Ahnung, wo sie stecken könnte, %a000090?\n@c0@"
  en: "@aDebora@bLooks like Bianca won't be home until tonight.\nAny idea where she might be, %a000090?\n@c0@"
  es: "@aStefania@bParece que Bianca no estará en casa hasta questa notte.\n¿Sabes dónde podría estar, %a000090?\n@c0@"
  fr: "@aPandora@bOn dirait que Bianca ne sera pas de retour avant ce soir. Tu as une idée de l'endroit où elle peut être, %a000090ⓡ\n@c0@"
  it: "@aViola@bE così Bianca non tornerà a casa prima di sera...\nHai idea di dove possa essere, %a000090?\n@c0@"
  ja: "@a@bデボラ「夜にならないと　ビアンカは\n\t戻ってこないみたいね。　%a000090　あんた\n\t彼女がどこへ行っているのか　気になる？\n@c0@"
248:
  de: "@aGriselda@bWirklich? Ach, eigentlich ist es mir auch egal.\n@c0@"
  en: "@aDebora@bReally? I don't actually care.\n@c0@"
  es: "@aStefania@b¿Veramente? Me da completamente igual.\n@c0@"
  fr: "@aPandora@bVraimentⓡ Je m'en moque, tu sais.\n@c0@"
  it: "@aViola@bDavvero?\nE come fai a saperlo?\nTe l'ha detto un uccellino?\n@c0@"
  ja: "@a@bデボラ「あ　そう。\n\t私は別に　気になんか　ならないわ。\n@c0@"
249:
  de: "@aGriselda@bDachte ich mir doch. Du hast nur Augen für mich, stimmt's nicht?\n@c0@"
  en: "@aDebora@bI thought so. You're only interested in me,\r\naren't you?\n@c0@"
  es: "@aStefania@bEso pensaba. Solo te intereso yo, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe m'en doutais. Il n'y a que moi qui t'intéresse,\nde toute façon, nonⓡ\n@c0@"
  it: "@aViola@bOvvio che non puoi saperlo!\nL'unica donna di cui ti è consentito interessarti sono io...\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\tあなたが　いちばん気になるのは\n\t私のこと　ですものね。\n@c0@"
250:
  de: "@aGriselda@bDas also ist Biancas Vater? Er freut sich so, dich zu sehen! Er sieht aber nicht sehr gesund aus.\n@c0@"
  en: "@aDebora@bSo that's Bianca's father? He's so happy to see you! He doesn't look well, mind.\n@c0@"
  es: "@aStefania@b¿Ese es el papino de Bianca? ¡Cómo se alegra de verte! Ma no tiene buen aspecto.\n@c0@"
  fr: "@aPandora@bAlors c'est le père de Biancaⓡ Il est vraiment content de te voirⓠ Mais il n'a pas l'air très en forme.\n@c0@"
  it: "@aViola@bQuell'uomo è il padre di Bianca?\nNon mi sembra che goda di ottima salute...\nMi spiace per lui.\n@c0@"
  ja: "@a@bデボラ「このおじさん　ビアンカのパパなの？\n\tあんたに会えて　うれしそうね。\n\tでも　少し　顔色が悪いみたいだわ。\n@c0@"
251:
  de: "@aGriselda@bBianca ist jedenfalls sehr beliebt. Tja, sie ist ja wirklich hübsch, und nett ist sie auch. Wenn auch natürlich nicht so nett wie ich.\n@c0@"
  en: "@aDebora@bBianca's certainly popular. I suppose she's quite pretty, and she's nice enough. Not as nice as me,\r\nof course.\n@c0@"
  es: "@aStefania@bBianca parece muy popular. Supongo que es bellina, y maja. No tanto como yo, claro.\n@c0@"
  fr: "@aPandora@bBianca est très populaire, on dirait. Il faut reconnaître qu'elle est mignonne et plutôt gentille.\r\nPas autant que moi, bien sûr.\n@c0@"
  it: "@aViola@bBianca ha un mucchio di ammiratori, eh?\nCerto, è una ragazza carina. Non bella quanto me, ovviamente, ma è comunque sopra la media...\n@c0@"
  ja: "@a@bデボラ「ビアンカって　人気があるのね。\n\tけっこうキレイだし　いい娘だものね。\n\tもちろん　私には　かなわないけど。\n@c0@"
252:
  de: "@aGriselda@bDas ist schön, %a000090. Bianca scheint es gut zu gehen. Nicht, dass mir das besonders wichtig wäre.\n@c0@"
  en: "@aDebora@bThat's good, %a000090. Bianca seems well.\nNot that it means anything to me.\n@c0@"
  es: "@aStefania@bVa bene, %a000090. Bianca parece estar bien.\nNo es que me importe, claro.\n@c0@"
  fr: "@aPandora@bC'est parfait, %a000090. Bianca a l'air d'aller bien. Non que ça m'importe, par ailleurs.\n@c0@"
  it: "@aViola@bScommetto che sarai contento di aver rivisto Bianca, %a000090.\nBuon per te. A me, invece, di lei importa poco o nulla.\n@c0@"
  ja: "@a@bデボラ「よかったわね　%a000090。\n\tビアンカ　元気そうじゃないの。\n\tまあ　私には　関係ないけど。\n@c0@"
253:
  de: "@aGriselda@bDas ist das Königreich, in dem der Bruder deines Freundes regiert, nicht? Den Freund, der zu unserer Hochzeit gekommen ist, meine ich.\n@c0@"
  en: "@aDebora@bThis is the kingdom your friend's brother rules, isn't it? That friend of yours who came to our wedding,\r\nI mean.\n@c0@"
  es: "@aStefania@bEste es el regno del hermano de il tuo amigo, ¿no? El amigo que vino a nuestra boda, quiero decir.\n@c0@"
  fr: "@aPandora@bC'est le royaume que dirige le frère de ton ami,\nc'est çaⓡ L'ami qui est venu assister à notre mariage, je veux dire.\n@c0@"
  it: "@aViola@bSe non ricordo male, questo è il paese su cui regna il fratello del tuo amico, quel Robert che venne al nostro matrimonio...\n@c0@"
  ja: "@a@bデボラ「ここって　たしか\n\t私たちの結婚式に　来ていた\n\tあんたの友達の弟が　治めている国よね？\n@c0@"
254:
  de: "@aGriselda@bDann hat der Freund meines Dieners also einen König zum Bruder. Na, wenn das nicht gut klingt!\n@c0@"
  en: "@aDebora@bSo my servant's friend is big brother to a king.\r\nThat sounds quite impressive!\n@c0@"
  es: "@aStefania@bAsí que el amigo de il mio sirviente es hermano de un rey.\r\n¡Suena impresionante!\n@c0@"
  fr: "@aPandora@bAlors l'ami de mon domestique est le frère aîné\nd'un roiⓡ Ça impressionne tout de suiteⓠ\n@c0@"
  it: "@aViola@bE così il mio fedele e devoto maritino è amico del fratello di un re...\n㈡\nA guardarti, non si direbbe che tu sia una persona tanto importante, sai?\nA volte le apparenze ingannano...\n@c0@"
  ja: "@a@bデボラ「国王の兄が\n\t私のしもべの　友達だなんて\n\tなかなか　悪くない気分だわ。\n@c0@"
255:
  de: "@aGriselda@bIch habe früher nie etwas Gutes über Tifortu gehört, aber jetzt wirkt es doch sehr friedlich.\n@c0@"
  en: "@aDebora@bI never heard very good things about Coburg in the past, but it seems peaceful enough now.\n@c0@"
  es: "@aStefania@bNunca oí nada buono de Trastámara, pero parece un sitio tranquilo.\n@c0@"
  fr: "@aPandora@bJe n'avais jamais entendu dire tellement de bien de Cobourg, autrefois , mais cela semble un endroit paisible, désormais.\n@c0@"
  it: "@aViola@bIn passato avevo sentito che a Coburg la popolazione era vessata dai regnanti, ma sembra che ora le cose siano notevolmente migliorate.\n@c0@"
  ja: "@a@bデボラ「ラインハットの国については\n\tあまり　いいウワサを　聞いたことが\n\tなかったんだけど…　今は平和みたいね。\n@c0@"
256:
  de: "@aGriselda@bUnd du weißt doch, was Frieden bedeutet? Frieden bedeutet Einkaufsbummel! Vielleicht finde ich ja was Schickes zum Anziehen.\n@c0@"
  en: "@aDebora@bAnd you know what peace means? Peace means shopping! Hopefully I'll find a nice new outfit.\n@c0@"
  es: "@aStefania@b¿Y sabes qué significa la pace? ¡Compras! Espero encontrar un buen vestido.\n@c0@"
  fr: "@aPandora@bEt tu sais ce que ça signifieⓡ Qui dit paix, dit achatsⓠ Espérons que je trouverai une jolie tenue.\n@c0@"
  it: "@aViola@bSe la situazione è più tranquilla, vuol dire che il commercio è ripreso regolarmente!\n㈡\nQuindi potremmo visitare qualche negozio per fare un po' di spese.\nSai, ho bisogno di qualche vestitino nuovo...\n@c0@"
  ja: "@a@bデボラ「平和になったってことは\n\t安全に　買い物もできるってことよね。\n\tいい服を　みつけられるといいんだけど。\n@c0@"
257:
  de: "@aGriselda@bPrinz Harry zu kennen könnte ganz nützlich sein. Den solltest du dir warmhalten.\n@c0@"
  en: "@aDebora@bPrince Harry could be quite a useful person to know. Make sure you keep him onside.\n@c0@"
  es: "@aStefania@bEl príncipe Froilán es un contacto veramente interesante. Asegúrate de conservarlo.\n@c0@"
  fr: "@aPandora@bIl pourrait être utile de connaître quelqu'un comme le prince Harry. Garde-le bien sous le coude, surtout.\n@c0@"
  it: "@aViola@bEssere amici di un principe ha i suoi vantaggi, caro.\nCerca di mantenere sempre ottimi rapporti con Robert, mi raccomando.\n@c0@"
  ja: "@a@bデボラ「ヘンリー王子って\n\tなかなか　使える人みたいね。\n\tあんたも見習って　私に　つかえるのよ。\n@c0@"
258:
  de: "@aGriselda@bIch weiß, dass du glücklich bist, %a000090. Schließlich hast du mich doch geheiratet, nicht?\n@c0@"
  en: "@aDebora@bI know you're happy, %a000090.\nYou married me, didn't you?\n@c0@"
  es: "@aStefania@bSé que eres felice, %a000090.\nEstas casado con me, ¿no?\n@c0@"
  fr: "@aPandora@bJe sais que tu es heureux, %a000090. Après tout, tu m'as épousée, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bSono certa che, dopo avermi vista, quel tipo ha messo la sottoscritta in cima alla lista dei suoi desideri.\n㈡\nSai una cosa, %a000090?\nSei stato fortunato a essere stato scelto come marito da una donna bella come me...\n@c0@"
  ja: "@a@bデボラ「%a000090　あんたは幸せよ。\n\t私みたいな　いい女に\n\t結婚してもらえたんだから。\n@c0@"
259:
  de: "@aGriselda@bHmm... Es gibt da einen Kunsthandwerker in Humburg, den die Leute den König der Kunsthandwerker nennen.\n@c0@"
  en: "@aDebora@bHmm... There's a craftsman in Gotha who people call the King of Jewellers.\n@c0@"
  es: "@aStefania@bMmm... En Pankraz hay un artigiano al que llaman Rey de los Joyeros.\n@c0@"
  fr: "@aPandora@bMmm... Il y a à Gotha un artisan que les gens surnomment le Roi des joailliers.\n@c0@"
  it: "@aViola@bE così a Denim c'era un abilissimo orafo soprannominato ⓕSir Gioielloⓖ, eh?\n@c0@"
  ja: "@a@bデボラ「ふうん…　宝石細工の\n\t神様と呼ばれるほどの　名工が\n\tグランバニアっていう国に　いるのね。\n@c0@"
260:
  de: "@aGriselda@bIch nehme an, ein derart kundiger Mann könnte ein paar Accessoires anfertigen, die selbst für meine hübsche Wenigkeit gut genug sind.\n@c0@"
  en: "@aDebora@bI suppose a man of that skill might be able to make some accessories pretty enough for my lovely self.\n@c0@"
  es: "@aStefania@bSupongo que alguien con su abilità podría crear accesorios lo bastante bonitos hasta para mí.\n@c0@"
  fr: "@aPandora@bJ'imagine qu'un homme aussi talentueux devrait pouvoir améliorer certains accessoires pour qu'ils soient dignes de quelqu'un d'aussi beau que moi.\n@c0@"
  it: "@aViola@bNon mi dispiacerebbe conoscerlo, così potrei chiedergli di mostrarmi qualche monile degno del mio splendore...\n@c0@"
  ja: "@a@bデボラ「それほどの　ウデの持ち主なら\n\t私の身体をかざるのに　ふさわしい\n\tアクセサリーを　作れそうだわ。\n@c0@"
261:
  de: "@aGriselda@bVersuche doch bitte, mich nicht vor Seiner Majestät zu blamieren, %a000090, ja?\n@c0@"
  en: "@aDebora@bDo try not to show me up in front of His Majesty, won't you, %a000090?\n@c0@"
  es: "@aStefania@bIntenta no exhibirme demasiado ante Su Majestad, ¿capisci, %a000090?\n@c0@"
  fr: "@aPandora@bEssaie de ne pas me faire honte devant Sa Majesté, compris, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, non farmi fare brutte figure davanti al Re di Coburg. Comportati bene, e cerca di non dire sciocchezze. Ci siamo intesi?\n\n@c0@"
  ja: "@a@bデボラ「%a000090。\n\t国王の前で　私に恥をかかせないよう\n\t気をつけるのよ。　わかったわね。\n@c0@"
262:
  de: "@aGriselda@bEin Schloss ist vom Himmel gefallen? Das klingt ja sehr unwahrscheinlich! Wie soll es denn überhaupt erst in den Himmel gelangt sein?\n@c0@"
  en: "@aDebora@bA castle fell from the sky? That hardly sounds likely! How could it have got up there in the first place?\n@c0@"
  es: "@aStefania@b¿Un castello caído del cielo? ¡No suena muy verosimil! ¿Cómo lo subieron ahí, para empezar?\n@c0@"
  fr: "@aPandora@bUn château tombé du cielⓡ Ça paraît peu problableⓠ Comment aurait-il pu se retrouver là-haut, pour commencerⓡ\n@c0@"
  it: "@aViola@bNon mi stupisce che un castello sia precipitato a terra... Quello che mi lascia perplessa è che fosse riuscito a salire fino in cielo!\n@c0@"
  ja: "@a@bデボラ「天空から　お城が落ちてきたって？\n\tそんなわけないでしょ。\n\tお城がどうやって空を飛ぶのよ。\n@c0@"
263:
  de: "@aGriselda@bUnd mir ist sowieso nicht klar, wieso deswegen die Monster auf einmal Amok laufen sollen. Das klingt doch alles unsinnig.\n@c0@"
  en: "@aDebora@bAnd I don't see how it can have been the cause of the monsters going on the rampage, anyway. \r\nSounds like a load of cock and bull to me.\n@c0@"
  es: "@aStefania@bY no sé qué tendrá que ver con que los monstruos estén aterrorizando a la gente. \r\nSembra una tontería come un piano de cola.\n@c0@"
  fr: "@aPandora@bEt puis de toute façon, je ne vois pas en quoi il aurait pu être à l'origine du déchaînement des monstres. Ça m'a l'air d'une histoire à dormir debout.\n@c0@"
  it: "@aViola@bE poi, cosa c'entra il maniero caduto al suolo con l'aumento dell'aggressività dei mostri?\nQuesta storia non sta in piedi...\n@c0@"
  ja: "@a@bデボラ「おまけに　それがきっかけで\n\t魔物が　人をおそうようになったとか……\n\tとてもじゃないけど　信じられないわ。\n@c0@"
264:
  de: "@aGriselda@bEs wirft ein gutes Licht auf mich, wenn mein Leibdiener Komplimente bekommt.\n@c0@"
  en: "@aDebora@bIt reflects well on me when my servant receives\r\na compliment.\n@c0@"
  es: "@aStefania@bCuando un servitore mío recibe un cumplido es como si lo recibiera yo.\n@c0@"
  fr: "@aPandora@bÇa me met indirectement en valeur quand mon domestique reçoit un compliment.\n@c0@"
  it: "@aViola@bMi pare quasi superfluo far notare che è solo merito mio se la gente si complimenta con te per ciò che hai fatto.\n㈡\nSenza la mia guida illuminata, saresti ancora un pappamolle un po' burino... E questo vale anche per le imprese che hai compiuto prima di conoscermi!\n@c0@"
  ja: "@a@bデボラ「自分のしもべが\n\tこうして　ほめられるっていうのは\n\tなかなか　気持ちがいいものね。\n@c0@"
265:
  de: "@aGriselda@bIch bezweifle, dass er sich einsam fühlt, wenn er dich und mich zusammen sieht. Nein, nicht einsam ⓚⓛ neidisch!\n@c0@"
  en: "@aDebora@bI doubt looking at you and I makes him feel lonely.\r\nNo, not so much lonely as jealous!\n@c0@"
  es: "@aStefania@bNon credo que mirarnos le haga sentirse solo.\r\n¡Más bien celoso!\n@c0@"
  fr: "@aPandora@bJe doute que nous regarder, toi et moi, puisse le faire se sentir seul. Non, moins seul que jaloux,\nje diraisⓠ\n@c0@"
  it: "@aViola@bCaro, anche tu eri uno scapolo convinto, prima di conoscermi. Poi mi hai vista, e non hai saputo resistere al mio fascino e alla mia classe...\n@c0@"
  ja: "@a@bデボラ「私を見ると　目の保養にはなるけど\n\t毒になんか　絶対に　ならないわ。\n\tね　%a000090。\n@c0@"
266:
  de: "@aGriselda@bDu hattest die Finger aber auch wirklich überall drin, was? Natürlich, von meinem Leibdiener würde ich nichts anderes erwarten.\n@c0@"
  en: "@aDebora@bYou certainly had your finger in a lot of pies, didn't you? Of course, I'd expect no less from a servant of mine.\n@c0@"
  es: "@aStefania@bMira que estabas metido en fregados, ¿eh? Obviamente, no esperaba menos de un servitore mío.\n@c0@"
  fr: "@aPandora@bTu as vraiment mis la main à la pâte partout, heinⓡ Bien sûr, je n'en attends pas moins de mon propre domestique.\n@c0@"
  it: "@aViola@bHai aiutato quell'uomo a tirarsi fuori dai guai?\nHai proprio il cuore d'oro!\nNon per niente ti ho scelto per marito...\n@c0@"
  ja: "@a@bデボラ「あんた　本当に\n\tいろいろなことを　やっていたのね。\n\t私のしもべになれるくらいだもの　当然ね。\n@c0@"
267:
  de: "@aGriselda@bVielleicht könnte ich das Geheimnis der Evolution nutzen, um noch schöner zu werden? ... Nein, ich glaube, da bin ich schon am oberen Anschlag!\n@c0@"
  en: "@aDebora@bMaybe I could use the Secret of Evolution to become even more beautiful? ...No, I think I've reached the upper limit on that one!\n@c0@"
  es: "@aStefania@bQuizá podría usar el Secreto de la Evolución para ser aún más guapa... ¡No, creo que ya he alcanzado el massimo assoluto!\n@c0@"
  fr: "@aPandora@bPeut-être que je devrais me servir du Secret de l'Évolution puor devenir encore plus belleⓡ ... Non,\nje crois que j'ai atteint le summum en la matièreⓠ\n@c0@"
  it: "@aViola@bPotrei usare il Segreto dell'Evoluzione per diventare ancora più bella, se non fosse che è impossibile migliorare ciò che è già perfetto...\n@c0@"
  ja: "@a@bデボラ「秘法の力があれば　いま以上に\n\t美しくなれたりは……　しないわよね。\n\t私はもう　じゅうぶんに　美しいから。\n@c0@"
268:
  de: "@aGriselda@bMich beunruhigt der Gedanke nicht, die Königinwitwe kennenzulernen! Sie ist nicht so bedeutend, dass ich jetzt anfangen würde herumzuschleimen.\n@c0@"
  en: "@aDebora@bI'm not worried about meeting the Queen Dowager! She's not important enough for me to start kowtowing.\n@c0@"
  es: "@aStefania@b¡No me preocupa reunirme con la Regina Madre! No es lo bastante importante.\n@c0@"
  fr: "@aPandora@bÇa ne m'inquiète pas de rencontrer la reine douairièreⓠ Pour moi, elle n'est pas assez importante pour que je commence à lui faire des courbettes.\n@c0@"
  it: "@aViola@bPerò! Carine, le stanze della Regina Madre!\nCaro, ricordami di farmi dare nome e indirizzo del suo architetto...\n@c0@"
  ja: "@a@bデボラ「太后だから　どうだっていうの？\n\t私は　そのていどの　相手に\n\tひれふしたりなんか　しないわよ。\n@c0@"
269:
  de: "@aGriselda@bDie Königinwitwe ist wohl nicht die Hellste, wenn sie sich dermaßen von einem Hochstapler hat abdrängen lassen.\n@c0@"
  en: "@aDebora@bThe Queen Dowager must be a bit stupid to have allowed herself to be usurped by an impostor\r\nlike that.\n@c0@"
  es: "@aStefania@bLa Regina Madre debe de ser un tanto blandengue para dejarse usurpar así por una impostora.\n@c0@"
  fr: "@aPandora@bLa reine douairière doit être un peu stupide pour avoir laissé un imposteur usurper son identité\r\ncomme ça.\n@c0@"
  it: "@aViola@bCerto che la Regina Madre è stata una vera fessacchiotta a farsi mettere nel sacco in quel modo...\n@c0@"
  ja: "@a@bデボラ「ニセモノに　取ってかわられるなんて\n\tすいぶんと　まぬけな太后さまだこと。\n@c0@"
270:
  de: "@aGriselda@bWärest du nicht gewesen, %a000090, dann wäre sie immer noch im Gefängnis. Ich finde, da wäre ein bisschen Dankbarkeit nicht zu viel verlangt.\n@c0@"
  en: "@aDebora@bShe'd still be in jail now if it wasn't for you, %a000090. A bit more gratitude wouldn't go amiss, in my opinion.\n@c0@"
  es: "@aStefania@bDe no ser per te seguiría en prisión, %a000090. En mi opinión, debería mostrar más gratitud.\n@c0@"
  fr: "@aPandora@bSans toi, %a000090, elle moisirait toujours en prison. Un peu plus de gratitude ne serait pas de trop, je trouve.\n@c0@"
  it: "@aViola@bLo dico con il massimo del rispetto, ma è stata proprio fessacchiotta! Se non fosse stato per te, probabilmente a Coburg regnerebbe ancora il caos.\n@c0@"
  ja: "@a@bデボラ「%a000090がいなかったら\n\t今もまだ　牢の中にいたはずよね。\n\tもっと感謝しても　いいと思うんだけど。\n@c0@"
271:
  de: "@aGriselda@bDieses Schloss ist wirklich beeindruckend. In so einem möchte ich eines Tages auch leben.\n@c0@"
  en: "@aDebora@bThis castle's quite impressive. I'd like to live somewhere like this one day.\n@c0@"
  es: "@aStefania@bEste castello es bastante impresionante. Un día me gustaría vivir en uno así.\n@c0@"
  fr: "@aPandora@bCe château est assez impressionnant. J'aimerais bien vivre dans un endroit comme ça, un jour.\n@c0@"
  it: "@aViola@bQuesto castello è davvero splendido.\nMi piacerebbe vivere in un posto del genere.\n@c0@"
  ja: "@a@bデボラ「なかなか立派で　いいお城ね。\n\t私が住むのに　ふさわしいのは\n\tこういう場所だわ。\n@c0@"
272:
  de: "@aGriselda@bDas heißt, du musst dich anstrengen, um mir meinen Traum zu erfüllen, %a000090. Dafür nehme ich ein wenig Warterei gern in Kauf.\n@c0@"
  en: "@aDebora@bThat means you'll have to work hard to make my dream come true, %a000090. I don't mind waiting a little while.\n@c0@"
  es: "@aStefania@bEso significa que tendrás que lavorare duro para hacer mi sueño realità, %a000090. Pero puedo esperar un poco.\n@c0@"
  fr: "@aPandora@bÇa veut dire que tu vas devoir travailler dur pour que mon rêve se réalise, %a000090. Mais je suis prêt à patienter un peu.\n@c0@"
  it: "@aViola@bCiò vuol dire che dovrai fare del tuo meglio per regalarmene uno, %a000090.\n㈡\nNon m'importa se lo compri o lo costruisci con le tue mani: quello che conta è che tu mi doni un bel maniero grande, maestoso e lussuosamente arredato.\n@c0@"
  ja: "@a@bデボラ「と　いうわけだから　%a000090。\n\t私のためにも　がんばって　用意してね。\n\t少しなら　待っていてあげるから。\n@c0@"
273:
  de: "@aGriselda@bWir brauchen den legendären Helden, wenn wir deiner Mutter helfen wollen. Wie lästig, dass keine Spur von ihm zu finden ist.\n@c0@"
  en: "@aDebora@bWe need the legendary hero if we're going to help your mother. It's a pain that he's nowhere to be seen.\n@c0@"
  es: "@aStefania@bPara ayudar a la tua mamma necesitamos al héroe legendario. ¿Por qué no aparece por ningún sitio?\n@c0@"
  fr: "@aPandora@bOn va avoir besoin du héros légendaire, si on veut aider ta mère. C'est pénible qu'on ne puisse le\r\ntrouver nulle part.\n@c0@"
  it: "@aViola@bDobbiamo assolutamente trovare l'Eroe Leggendario, altrimenti non potremo aiutare tua madre.\n㈡\nIl problema è che non abbiamo idea di dove si sia cacciato!\n@c0@"
  ja: "@a@bデボラ「%a000090のママを　助けるためには\n\t伝説の勇者の　助けがいるのよね。\n\t…本当に　いてくれればいいんだけど。\n@c0@"
274:
  de: "@aGriselda@bWie kann er mich denn übersehen haben, wenn ich doch dort war? Er sollte sich vielleicht mal die Augen untersuchen lassen!\n@c0@"
  en: "@aDebora@bHow can he not have noticed me when I was right there? He must need his eyes testing!\n@c0@"
  es: "@aStefania@bMa, ¿cómo ha podido no fijarse en mí si estaba ahí mismo? ¡Tiene que mirarse esa vista!\n@c0@"
  fr: "@aPandora@bComment a-t-il pu ne pas me remarquer alors que j'étais juste làⓡ Il doit avoir des problèmes de vueⓠ\n@c0@"
  it: "@aViola@bSapevi che il tuo amico Robert ha problemi di vista?\nEro davanti a lui, ma non mi ha ammirata a bocca aperta come fanno tutti gli uomini che mi vedono!\n㈡\nFossi in te gli consiglierei di farsi visitare un un bravo oculista...\n@c0@"
  ja: "@a@bデボラ「この私が　そばにいるのに\n\t気づかないだなんて。\n\tこの人　きっと　目が悪いのね。\n@c0@"
275:
  de: "@aGriselda@bIhr beide habt offensichtlich schwere Zeiten durchleben müssen.\n@c0@"
  en: "@aDebora@bSounds like you and he had a bit of a tough time\r\nof it.\n@c0@"
  es: "@aStefania@bParece que no lo pasasteis molto bene.\n@c0@"
  fr: "@aPandora@bOn dirait que vous avez traversé des moments pénibles, lui et toi.\n@c0@"
  it: "@aViola@bTu e Robert dovete aver vissuto delle esperienze orribili...\n@c0@"
  ja: "@a@bデボラ「あんたも　あの王子さまも\n\tいろいろと　大変だったのね。\n@c0@"
276:
  de: "@aGriselda@bAber jetzt lebst du ja glücklich bis an dein Lebensende, und alles nur dank mir! Ich weiß, du wirst mir deine Dankbarkeit zeigen wollen.\n@c0@"
  en: "@aDebora@bBut now you're living happily ever after, and it's all thanks to me. I know you'll be sure to show your gratitude.\n@c0@"
  es: "@aStefania@bPero ahora serás felice per sempre, gracias a me. Sé que sabrás demostrar tu gratitud.\n@c0@"
  fr: "@aPandora@bMais maintenant, tu vis heureux après tout, et tout ça grâce à moi. Je sais que tu ne manqueras pas de me prouver ta gratitude.\n@c0@"
  it: "@aViola@bPerò la vita ha voluto ripagarti di tutto ciò che hai patito facendoti incontrare me. Direi che non puoi proprio lamentarti, maritino caro...\n@c0@"
  ja: "@a@bデボラ「今後は　私のおかげで\n\t幸せな人生を　送れるわ。\n\t感謝して　私に　つくすのよ。\n@c0@"
277:
  de: "@aGriselda@bHarry ist wohl der verspielte Typ, wenn er sich als Andenken für seine Hochzeit Spieldosen ausgesucht hat. Oder glaubst du, das war die Idee seiner Frau?\n@c0@"
  en: "@aDebora@bHarry's quite the imaginative one, having a music box made as a wedding souvenir. Or do you think it was his wife's idea?\n@c0@"
  es: "@aStefania@bFroilán es muy imaginativo, regalando una caja de música como recuerdo de boda. ¿O crees que fue idea de la sua esposa?\n@c0@"
  fr: "@aPandora@bHarry ne manque pas d'imagination pour avoir fait fabriquer une boîte à musique comme souvenir de mariage. C'était peut-être une idée de son épouseⓡ\n@c0@"
  it: "@aViola@bChissà se l'idea di regalare un carillon agli invitati alle loro nozze è venuta a Robert o a sua moglie...\n@c0@"
  ja: "@a@bデボラ「オルゴールを　記念品にするだなんて\n\tあの王子さま　なかなかセンスがいいわね。\n\tそれとも　奥さんの考えだったのかしら？\n@c0@"
278:
  de: "@aGriselda@bDas hat Papa für mich erledigt, aber jetzt wünschte ich mir, ich hätte mich selbst darum gekümmert. So was sollte man wirklich selbst entscheiden.\n@c0@"
  en: "@aDebora@bI let Papa take care of that for my wedding, but now I wish I hadn't. It's the kind of thing you should really decide for yourself.\n@c0@"
  es: "@aStefania@bDejé que il mio papino se encargara del de nuestra boda, ma ahora me arrepiento. Es algo que debería haber elegido yo.\n@c0@"
  fr: "@aPandora@bJ'ai laissé papa s'occuper de ça pour mon mariage, mais maintenant, je le regrette. C'est le genre de chose qu'on doit vraiment décider soi-même.\n@c0@"
  it: "@aViola@bLa cosa è talmente originale che penso sia stata una trovata di Maria. Di solito sono le donne ad avere fantasia: voi uomini siete sempre noiosi e scontati...\n@c0@"
  ja: "@a@bデボラ「私の結婚式の　記念品は\n\tパパに任せたばっかりに　アレだったし。\n\tちゃんと　自分で選ぶべきだったわ……。\n@c0@"
279:
  de: "@aGriselda@bEs ist sicher ein wenig langweilig, für alle Zeit hier im Schloss festzusitzen. Ich kann verstehen, warum er gern mal wieder auf Reisen gehen würde.\n@c0@"
  en: "@aDebora@bIt would be a bit boring if you were stuck here in this castle the whole time. I can see why he wants to go off travelling.\n@c0@"
  es: "@aStefania@bSerá un poco aburrido quedarse encerrada en este castello. Entiendo que quiera viaggiare.\n@c0@"
  fr: "@aPandora@bÇa serait un peu ennuyeux de se retrouver coincé dans ce château en permanence. Je comprends pourquoi il a envie de partir en voyage.\n@c0@"
  it: "@aViola@bMaria è una donna appena carina, ma ha sposato il Principe di Coburg e vive in uno splendido castello, servita e riverita da tutti.\n㈡\nIo, invece, sono una ragazza splendida, ma ho sposato un nullatenente, per di più pappamolle, che è il mio unico servitore! Argh! La vita è ingiusta!\n@c0@"
  ja: "@a@bデボラ「たしかに　ずっとお城の中にいたら\n\tたいくつだものね。　王子さまが\n\t旅をしたくなる気持ちは　よくわかるわ。\n@c0@"
280:
  de: "@aGriselda@bNehmen wir uns heute Nacht hier ein Zimmer? Wenn ja, dann beeil dich. Ich warte nicht gern.\n@c0@"
  en: "@aDebora@bAre we getting a room here tonight? Hurry up about it if we are. I don't like being kept waiting.\n@c0@"
  es: "@aStefania@b¿Vamos a pasar aquí esta notte? Si es así decide presto, no me gusta que me hagan esperar.\n@c0@"
  fr: "@aPandora@bOn prend une chambre ici pour la nuitⓡ Si c'est le cas, dépêche-toi de t'en occuper. Je n'aime pas\nqu'on me fasse attendre.\n@c0@"
  it: "@aViola@bVuoi trascorrere la notte qui?\nD'accordo.\nPer una volta faremo come dici tu.\n@c0@"
  ja: "@a@bデボラ「今夜は　ここで宿をとるの？\n\tだったら　急いでちょうだいね。\n\t私　待たされるのは　キライなの。\n@c0@"
281:
  de: "@aGriselda@bWarum brauchen Männer immer einen Vorwand zum Trinken? Können sie nicht einfach was trinken, weil ihnen gerade danach ist?\n@c0@"
  en: "@aDebora@bWhy is it that men always have to have an excuse for drinking? Can't they just drink because they want a drink?\n@c0@"
  es: "@aStefania@b¿Por qué los hombres siempre tienen una excusa para beber? ¿No pueden beber semplicemente porque les apetece?\n@c0@"
  fr: "@aPandora@bPourquoi les hommes ont-ils toujours une bonne excuse pour boireⓡ Ils ne peuvent donc pas boire juste parce qu'ils en ont envieⓡ\n@c0@"
  it: "@aViola@bSanto cielo!\nQuell'uomo è in uno stato pietoso!\nMaritino mio bello, non osare mai ridurti così!\n@c0@"
  ja: "@a@bデボラ「男って…　どうしてこう　飲むことに\n\t何かの理由を　つけるのかしら？\n\t飲みたいから飲む！　で　いいじゃない。\n@c0@"
282:
  de: "@aGriselda@bDie Sterne sind wirklich hübsch. Sie blinzeln mir zu, weißt du.\n@c0@"
  en: "@aDebora@bThe stars really are pretty. They're twinkling away because of me, you know.\n@c0@"
  es: "@aStefania@bQué bellas son las estrellas. Brillan per me, ¿lo sabías?\n@c0@"
  fr: "@aPandora@bLes étoiles sont vraiment jolies. C'est pour moi\r\nqu'elles scintillent, tu sais.\n@c0@"
  it: "@aViola@bIl cielo stellato è meraviglioso, e visto accanto a me dev'essere ancora più bello.\nCaro, sei stato molto fortunato a sposarmi...\n@c0@"
  ja: "@a@bデボラ「あら　本当に　ステキな星空ね。\n\tあの星たちは　私の力で\n\tかがやいているのよ。\n@c0@"
283:
  de: "@aGriselda@bLeute, die einem immer was unter dem Siegel der Verschwiegenheit erzählen wollen, haben es meist schon aller Welt erzählt.\n@c0@"
  en: "@aDebora@bPeople who say something's just between you and them have usually told the world and his wife.\n@c0@"
  es: "@aStefania@bCuando alguien dice que algo es solo entre tú y él, ya se lo ha contado a tutto il mondo e a la sua esposa.\n@c0@"
  fr: "@aPandora@bLes gens qui disent que les choses restent entre toi et eux en ont généralement déjà parlé à la terre entière.\n@c0@"
  it: "@aViola@bA proposito di guardaroba!\nDevi assolutamente comprarmi sei o sette abiti nuovi, caro.\n@c0@"
  ja: "@a@bデボラ「ここだけの話…　なんて言う人は\n\tたいがい　どんな人にでも\n\tそういうふうに　言うものよ。\n@c0@"
284:
  de: "@aGriselda@bPah! Alles, was wir wollen, ist, ein bisschen Spaß auf unseren Reisen zu haben, ohne uns mit solchem Unfug abgeben zu müssen.\n@c0@"
  en: "@aDebora@bHuh! Here we are trying to enjoy our travels, and we have to put up with that kind of nonsense.\n@c0@"
  es: "@aStefania@b¡Buah! Intentamos disfrutare con nuestros viajes y tenemos que aguantar estas tonterías.\n@c0@"
  fr: "@aPandora@bTsssⓠ On essaie de profiter de nos voyages, et il faut qu'on supporte ce genre de bêtises.\n@c0@"
  it: "@aViola@bAndiamo a far spese, ogni tanto, così potremo rilassarci tra una battaglia e l'altra...\n@c0@"
  ja: "@a@bデボラ「まったく　もう……\n\tせっかく楽しく旅行中なのに\n\tつまらないことを　聞かせないでほしいわ。\n@c0@"
285:
  de: "@aGriselda@bDiese Frau wollte mich wohl ärgern. Warum sollte sie sonst so mit dir flirten?\n@c0@"
  en: "@aDebora@bThat woman must've been trying to provoke me. There's no other reason she'd flirt around you\r\nlike that.\n@c0@"
  es: "@aStefania@bEsa donna intentaba provocarme. ¿Por qué si no iba a flirtear así con te?\n@c0@"
  fr: "@aPandora@bCette femme a dû essayer de me provoquer.\r\nIl n'y a pas d'autre raison à ce qu'elle te tourne autour comme ça.\n@c0@"
  it: "@aViola@bMa quella ragazza non s'è resa conto che sono tua moglie?! Come s'è permessa di parlarti così in mia presenza?!\n㈡\nSe vuole farmi ingelosire, si sbaglia di grosso.\nIo quelle come lei le mangio a colazione insieme ai fiocchi d'avena!\n@c0@"
  ja: "@a@bデボラ「この女…　生意気にも\n\t%a000090を　ゆうわくするだなんて\n\tこの私に対する　挑戦かしら？\n@c0@"
286:
  de: "@aGriselda@bDu wirst dich mit diesem Mädchen treffen, nicht?\n@c0@"
  en: "@aDebora@bYou're going to meet that girl, are you?\n@c0@"
  es: "@aStefania@bVas a ver a esa ragazza, ¿no?\n@c0@"
  fr: "@aPandora@bTu vas rencontrer cette fille, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bSì, dai!\nAndiamo all'appuntamento con quella tipa!\n@c0@"
  ja: "@a@bデボラ「へえ　あの小娘と\n\t待ち合わせを　するのね。\n@c0@"
287:
  de: "@aGriselda@bDas klingt spannend. Ich komme mit.\n@c0@"
  en: "@aDebora@bIt does sound intriguing. I'll come along with you.\n@c0@"
  es: "@aStefania@bSuena intrigante. Iré con te.\n@c0@"
  fr: "@aPandora@bC'est vrai que ça intrigue. Je vais venir avec toi.\n@c0@"
  it: "@aViola@bLo so che l'invito era rivolto solo a te, ma ho deciso di accompagnarti. Sai, potresti perderti strada facendo, e non vorrei che tu arrivassi tardi...\n@c0@"
  ja: "@a@bデボラ「なかなか　面白いじゃない。\n\t私も　ついていってあげるわ。\n@c0@"
288:
  de: "@aGriselda@bHm... Ich würde meine Wahrsagekunst eigentlich auch ganz gern perfektionieren.\n@c0@"
  en: "@aDebora@bHmm... I wouldn't mind perfecting my\r\nfortune-telling, actually.\n@c0@"
  es: "@aStefania@bMmm... No me importaría perfezionare mis habilidades de bruja.\n@c0@"
  fr: "@aPandora@bMmm... En fait, je ne serais pas contre perfectionner un peu mes talents de voyante, moi aussi.\n@c0@"
  it: "@aViola@bA volte penso che potrei imparare anch'io a leggere il futuro...\n@c0@"
  ja: "@a@bデボラ「さて…　と。\n\tなんだか　私も　ぱふぱふの勉強が\n\tしたくなってきたわ。\n@c0@"
289:
  de: "@aGriselda@bDu wirst natürlich mein Versuchskaninchen sein. Bist du bereit, den mysteriösen Worten der Geister zu lauschen?\n@c0@"
  en: "@aDebora@bYou'll have to be my guinea pig, obviously. Are you ready to hear the mysterious words of the spirits?\n@c0@"
  es: "@aStefania@bTú serás el conejillo de Indias, claro está.\n㈡\n¿Listo per sentire el mensaje de los espíritus?\n@c0@"
  fr: "@aPandora@bTu devras me servir de cobaye, évidemment.\nAlors es-tu prêt à entendre les révélations mystérieuses des espritsⓡ\n@c0@"
  it: "@aViola@bChe ne dici?\nTi andrebbe di aiutarmi?\n@c0@"
  ja: "@a@bデボラ「もちろん　練習台は　あんたよ。\n\tそのあと　顔を洗わずに　町の中を\n\t歩き回るの。　……わかったわね？\n@c0@"
290:
  de: "@aGriselda@bAlso gut... Geister, sprecht zu miiir!\nGenau wie ich dachte. Sie sagen, du sollst deine Gattin ehren, die schönste Frau auf der Welt.\n@c0@"
  en: "@aDebora@bOkay, then... Spirits, speak to meee!\r\nJust as I thought. They say to treasure your wife, the most beautiful woman in the world!\n@c0@"
  es: "@aStefania@bAllora, espíritus, manifestaooos...\nCapito. Dicen que cuides de la tua esposa, la donna più bella del mundo.\n@c0@"
  fr: "@aPandora@bParfait, allons-y... Espriiit, es-tu làⓡ\n㈡\nC'est exactement ce que je pensais. Il te dit de veiller précieusement sur ta femme, car c'est la plus belle du mondeⓠ\n@c0@"
  it: "@aViola@bSapevo che non ti saresti tirato indietro, %a000090! So bene che sei molto meno pappamolle di quanto tu voglia far credere!\n@c0@"
  ja: "@a@bデボラ「とびっきりの　美人にしてあげるから\n\t楽しみにしてなさい　%a000090。\n@c0@"
291:
  de: "@aGriselda@bAch, sei still, natürlich bist du es. Also dann...\nGeister, sprecht zu miiir! Ach wirklich? Aha...\nSie sagen, du sollst deiner Herrin brav gehorchen.\n@c0@"
  en: "@aDebora@bShut up, of course you are. Okay, here we go...\r\nSpirits, speak to meee! Oh, really? I see...\r\nThey say that you should obey your mistress more.\n@c0@"
  es: "@aStefania@b¡Ah! Per disgrazia, no puedes decire que no. Allora, espíritus, manifestaooos...\nCapito. Dicen que obedezcas a la tua esposa si sabes lo que te conviene...\n@c0@"
  fr: "@aPandora@bN'importe quoi, je suis sûre que tu l'es.\nBon, allons-y... Espriiit, es-tu làⓡ\n㈡\nOh, vraimentⓡ Je vois...\nIl dit que tu devrais être un domestique plus obéissant.\n@c0@"
  it: "@aViola@bNo?! Beh, meglio così.\nTutto sommato, non mi piacerebbe diventare una chiaroveggente: è un lavoro troppo faticoso...\n\n@c0@"
  ja: "@a@bデボラ「あんたに　断る権利はないのよ。\n\tとびっきりの　美人にしてあげるから\n\t楽しみにしてなさい　%a000090。\n@c0@"
292:
  de: "@aGriselda@bDie Stadt ist ja ein bisschen mickrig, aber immerhin gibt es hier ein paar Geschäfte, also ist es nicht so übel.\n@c0@"
  en: "@aDebora@bIt's a bit of a small town, but it has a few shops, so it's not so bad.\n@c0@"
  es: "@aStefania@bEste sitio es un po' piccolo, ma tiene unas cuantas tiendas... No está mal.\n@c0@"
  fr: "@aPandora@bC'est une petite ville, mais il y a quelques magasins, alors ça n'est pas trop mal.\n@c0@"
  it: "@aViola@bIl villaggio è tutt'altro che grande.\nSperiamo che ci sia qualche negozio di moda...\n@c0@"
  ja: "@a@bデボラ「小さい町だけど\n\tお店はひととおり　そろっているし\n\tまあ　悪くはないわね。\n@c0@"
293:
  de: "@aGriselda@bDu bist wirklich schon ganz schön herumgekommen, was? Das ist geschickt für mich, denn so kennst du dich immerhin schon einigermaßen aus.\n@c0@"
  en: "@aDebora@bYou've been to quite a few places in your time, haven't you? It's great for me because it means you tend to know your way around.\n@c0@"
  es: "@aStefania@bHas visitado bastantes lugares en la tua vita, ¿eh? Por mí genial, porque eso significa que sabes manejarte bien.\n@c0@"
  fr: "@aPandora@bTu as visité pas mal d'endroit autrefois, nonⓡ\nC'est bien pour moi, parce que ça veut dire que\ntu connais ton chemin, dans l'ensemble.\n@c0@"
  it: "@aViola@bSono stupita di vedere che hai girato un bel po' di mondo, sai?\nNon me l'aspettavo da un mezzo pappamolle come te.\n@c0@"
  ja: "@a@bデボラ「それにしても　あんたって　本当に\n\tいろいろな場所を　旅しているのね。\n\tおかげで　迷わないですむし　楽でいいわ。\n@c0@"
294:
  de: "@aGriselda@bHier also ist Bianca aufgewachsen?\n@c0@"
  en: "@aDebora@bThis is where that Bianca grew up, is it?\n@c0@"
  es: "@aStefania@bAquí es donde creció Bianca, ¿vero?\n@c0@"
  fr: "@aPandora@bC'est ici que Bianca a grandi, c'est çaⓡ\n@c0@"
  it: "@aViola@bBianca è cresciuta qui, esatto?\n@c0@"
  ja: "@a@bデボラ「ふうん　ここって\n\tあのビアンカって娘の　故郷なのね。\n@c0@"
295:
  de: "@aGriselda@bWarum gehst du sie nicht besuchen? Na los, geh schon, bevor ich es mir anders überlege.\n@c0@"
  en: "@aDebora@bWhy don't you go and look her up?\r\nGo on, go now before I change my mind.\n@c0@"
  es: "@aStefania@b¿Por qué no vas a verla?\r\nPresto, antes de que cambie de idea.\n@c0@"
  fr: "@aPandora@bPourquoi tu ne vas pas lui rendre une petite visiteⓡ Vas-y tout de suite, avant que je ne change d'avis.\n@c0@"
  it: "@aViola@bTi permetto di andare a visitarla.\nSbrigati, prima che cambi idea...\n@c0@"
  ja: "@a@bデボラ「ビアンカに　会っていけば？\n\t私の気が　変わらないうちに\n\tほら　さっさと　しなさいよ。\n@c0@"
296:
  de: "@aGriselda@bEr hat Glück, noch am Leben zu sein, wenn er desertiert ist. Ich hätte gedacht, dafür würde man hingerichtet.\n@c0@"
  en: "@aDebora@bHe's lucky to be alive if he deserted the army.\r\nI would've thought he'd be executed for that.\n@c0@"
  es: "@aStefania@bTiene suerte de estar vivo si desertó.\r\nVeramente, creía que por eso te ejecutaban.\n@c0@"
  fr: "@aPandora@bIl a de la chance d'être encore en vie s'il a déserté l'armée. J'aurai cru qu'il serait exécuté pour ça.\n@c0@"
  it: "@aViola@bÈ fortunato a essere ancora vivo!\nA quanto ne so, chi diserta può essere condannato a morte!\n@c0@"
  ja: "@a@bデボラ「兵士のくせに　脱走なんかして\n\tよく無事でいられたわね……　この男。\n\tふつうなら　処刑されてるわよ。\n@c0@"
297:
  de: "@aGriselda@b%0%a000090... Ich weiß ja, es ist sehr unwahrscheinlich, aber dir kommt doch nie der Gedanke, von mir davonzulaufen, oder?\n@c0@"
  en: "@aDebora@b%0%a000090... I know this is unlikely, but you don't ever feel like you might want to desert me, do you?\n@c0@"
  es: "@aStefania@b%0%a000090... Sé que es imposibile, ma... ¿se te hapasado por la testa desertar di me?\n@c0@"
  fr: "@aPandora@b%0%a000090... Je sais que c'est improbable, mais as-tu déjà eu envie de... me déserterⓡ\n@c0@"
  it: "@aViola@b%0%a000090, ovviamente anche tu saresti condannato a morte se disertassi dal nostro matrimonio. Lo sai, vero?\n@c0@"
  ja: "@a@bデボラ「%a000090。　まさかとは思うけど\n\tこの私から　逃げ出したい…　なんて\n\t思っていたり　しないわよね？\n@c0@"
298:
  de: "@aGriselda@bDas dachte ich mir. Ich habe es mir auch nicht vorstellen können.\n@c0@"
  en: "@aDebora@bThat's what I thought.\nI knew it was unlikely.\n@c0@"
  es: "@aStefania@b¿Esa es tu idea de una broma? Sempre serás mi servitore, no lo olvides. ¡Y no tienes permiso para desertar!\n@c0@"
  fr: "@aPandora@bC'est ça, ta conception de l'humourⓡ Tu seras toujours mon domestique, ne t'avise pas de l'oublier. Je ne te permettrai jamais de t'enfuirⓠ\n@c0@"
  it: "@aViola@bMolto bene.\nEro certa che conoscevi la pena a cui andresti incontro in caso commettessi un crimine tanto grave.\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\tそんなこと　あるはずないわよね。\n@c0@"
299:
  de: "@aGriselda@bSoll das ein Witz sein? Einmal Leibdiener, immer Leibdiener, merk dir das! Ich werde nicht zulassen, dass du mir davonläufst!\n@c0@"
  en: "@aDebora@bIs that your idea of a joke? You'll always be my servant, and don't you forget it. I won't permit you to run away!\n@c0@"
  es: "@aStefania@bVa bene. Sabes lo que te conviene.\n@c0@"
  fr: "@aPandora@bC'est ce que je pensais.\r\nJe savais que c'était improbable.\n@c0@"
  it: "@aViola@bAdesso lo sai.\nSe ti azzardassi ad allontanarti da me, quello sarebbe l'ultimo errore della tua vita!\n@c0@"
  ja: "@a@bデボラ「面白い　じょうだんを言うのね。\n\tあんたは　これからもずっと　私のしもべ。\n\t絶対に　逃がさないんだから。\n@c0@"
300:
  de: "@aGriselda@bOffenbar hat es sich noch nicht bis hierher herumgesprochen, was du getan hast. Nicht, dass mir das viel ausmachen würde.\n@c0@"
  en: "@aDebora@bLooks like people here haven't heard about what you did. Not that it bothers me particularly.\n@c0@"
  es: "@aStefania@bSembra que aquí la gente no ha oído lo que has hecho. Aunque, francamente, me importa un bledo...\n@c0@"
  fr: "@aPandora@bOn dirait que les gens n'ont pas entendu parler\r\nde ce que tu as fait. Non que ça me dérange particulièrement.\n@c0@"
  it: "@aViola@bPare che non tutti sappiano che fosti tu a salvare Coburg, eh? Credo che tu abbia bisogno di qualcuno che curi le tue pubbliche relazioni, %a000090.\n@c0@"
  ja: "@a@bデボラ「さすがに　ここまでは\n\tあんたの名前は　届いてないみたいね。\n\tまあ　別に　どうでもいいことだけど。\n@c0@"
301:
  de: "@aGriselda@bWir hatten den Zenithiaschild zu Hause, also gibt's den anderen Kram sicher auch. Wo steckt bloß dieser Kerl, der sich mit Legenden auskennt?\n@c0@"
  en: "@aDebora@bWe had the Zenithian Shield at home, so the other items probably exist too. I wonder where this man is who knows all about legends.\n@c0@"
  es: "@aStefania@bTeníamos en casa el Escudo de Zenithia, así que es probabile que los otros objetos existan.\n㈡\n¿Dónde estará ese hombre que supuestamante sabe de leyendas?\n@c0@"
  fr: "@aPandora@bNous possédions le Bouclier zénithien, à la maison, les autres objets doivent donc exister aussi.\n㈡\nJe me demande où est l'homme censé connaître les légendes.\n@c0@"
  it: "@aViola@bChissà se lo Scudo Zenithiano che era a casa dei miei genitori può essere considerato un'arma leggendaria...\n@c0@"
  ja: "@a@bデボラ「私の家に　伝説の盾があったんだし\n\t他の装備があっても　おかしくはないわね。\n\t伝説にくわしい男は　どこよ？\n@c0@"
302:
  de: "@aGriselda@bHier also hat Bianca damals gewohnt.\n@c0@"
  en: "@aDebora@bSo this is where that Bianca used to live all those years ago.\n@c0@"
  es: "@aStefania@bAsi que aquí vivía esa tal Bianca hace anni.\n@c0@"
  fr: "@aPandora@bAlors c'est ici que vivait Bianca, il y a\r\ntoutes ces années.\n@c0@"
  it: "@aViola@bQuesto è il villaggio dove Bianca ha vissuto per qualche anno, non è vero?\n@c0@"
  ja: "@a@bデボラ「この宿屋が\n\tあのビアンカって娘が　昔住んでいた\n\t家だったのね。\n@c0@"
303:
  de: "@aGriselda@bDie Herberge ist nicht schlecht. Hier können wir ein paar Tage bleiben, wenn du willst, %a000090.\n@c0@"
  en: "@aDebora@bThis inn's not bad. We could stay here for a few nights if you like, %a000090.\n@c0@"
  es: "@aStefania@bEsta posada no está male. Te permito que nos quedemos unas noches, %a000090.\n@c0@"
  fr: "@aPandora@bElle n'est pas mal, cette auberge. On pourrait passer quelques nuits ici si tu en as envie, %a000090.\n@c0@"
  it: "@aViola@bQuesta locanda non mi dispiace affatto, %a000090. Quasi quasi potremmo fermarci qui per una notte, o magari due o tre...\n@c0@"
  ja: "@a@bデボラ「なかなか　いい宿屋ね。\n\t%a000090が　そうしたいのなら\n\t何日か　ここに泊まってあげてもいいわよ。\n@c0@"
304:
  de: "@aGriselda@bEs riecht ziemlich gut. Das könnte der perfekte Hintergrund für ein schönes Mittagsschläfchen sein.\n@c0@"
  en: "@aDebora@bIt smells quite nice. Could be the perfect accompaniment to a nice afternoon siesta.\n@c0@"
  es: "@aStefania@b¡Huele que alimenta! Es ideale per una buona siesta.\n@c0@"
  fr: "@aPandora@bÇa sent très bon. Parfait pour accompagner une petite siesta d'après-midi.\n@c0@"
  it: "@aViola@bNon so se a te faccia lo stesso effetto, ma a me questo profumino fa venire voglia di dormire...\nYaaawn...\n@c0@"
  ja: "@a@bデボラ「けっこう　いいにおいがするのね。\n\tこのマクラを使って　お昼寝したら\n\t気持ちがよさそうだわ。\n@c0@"
305:
  de: "@aGriselda@bDu hast viele Erinnerungen an diesen Ort, nicht, %a000090? Aber mir kann's ja egal sein.\n@c0@"
  en: "@aDebora@bYou have a lot of memories of this place, don't you, %a000090? Not that I care much either way,\nof course.\n@c0@"
  es: "@aStefania@bTendrás molti ricordi de este lugar, ¿no, %a000090? ¡Pues vale!\n@c0@"
  fr: "@aPandora@bTu as plein de souvenirs de cet endroit, n'est-ce pas, %a000090ⓡ Non que je m'en soucie particulièrement, bien sûr.\n@c0@"
  it: "@aViola@bQuesto posto ti riporta alla mente tanti ricordi, non è vero?\nTe lo leggo in faccia, %a000090...\n@c0@"
  ja: "@a@bデボラ「この宿は　%a000090の\n\t思い出の場所　ってわけね。\n\tふうん…　まあ　別に　気にしてないけど。\n@c0@"
306:
  de: "@aGriselda@bPapa hat immer gesagt, dass Schänken gut sind, um Informationen zu beschaffen, weil so viele Leute dort ein und aus gehen.\n@c0@"
  en: "@aDebora@bPapa always said that pubs are good places for gathering information because there are so many people coming and going.\n@c0@"
  es: "@aStefania@bIl mio papino sempre decía que las tabernas sirven para obtener información porque mucha gente viene y va.\n@c0@"
  fr: "@aPandora@bPapa disait toujours que les tavernes sont de bons endroits pour récolter des informations, à cause du nombre de gens qui y circulent en permanence.\n@c0@"
  it: "@aViola@bIl mio paparino me lo dice sempre: non esistono posti migliori dei locali pubblici per avere informazioni di ogni genere!\n@c0@"
  ja: "@a@bデボラ「酒場は　いろいろな客が来るから\n\t話があつまりやすい　って\n\tパパから聞いたことがあるわ。\n@c0@"
307:
  de: "@aGriselda@bWir sollten uns ein bisschen mit dem Mann unterhalten, der angeblich alles über Legenden weiß.\n@c0@"
  en: "@aDebora@bWe'll have to try and have a chat with that man who's supposed to know all about legends.\n@c0@"
  es: "@aStefania@bTendremos que parlare con ese hombre que parece saberlo todo sobre leyendas.\n@c0@"
  fr: "@aPandora@bIl va falloir qu'on essaie de discuter avec l'homme\r\nqui est censé tout connaître des légendes.\n@c0@"
  it: "@aViola@bLogico, no? Sono frequentati da tantissime persone, quindi si sentono molte notizie interessanti. Forza, andiamo a parlare con il padre di quella ragazza.\n@c0@"
  ja: "@a@bデボラ「とりあえず　その\n\t伝説に詳しい男とやらに　会ってみるわよ。\n@c0@"
308:
  de: "@aGriselda@bWenn der legendäre Held wirklich existiert hat, dann kann es durchaus sein, dass es irgendwo noch Nachkommen von ihm gibt.\n@c0@"
  en: "@aDebora@bIf the legendary hero really existed, then it's certainly not impossible that there are\r\ndescendants of his out there somewhere.\n@c0@"
  es: "@aStefania@bSi el héroe legendario veramente existió, no es imposible que haya descendientes suyos por ahí.\n@c0@"
  fr: "@aPandora@bSi le héros légendaire a vraiment existé, il n'est pas du tout impossible qu'il ait eu des descendants qui vivent aujourd'hui quelque part.\n@c0@"
  it: "@aViola@bProbabilmente le cose stanno come dice lui.\n㈡\nSe l'Eroe Leggendario è davvero esistito, può darsi che abbia avuto dei figli. Con un po' di fortuna, potremmo trovare qualche suo discendente...\n@c0@"
  ja: "@a@bデボラ「本当に　伝説の勇者がいたのなら\n\tどこかに　子孫がのこっていても\n\tおかしくはないと　思うけど……　ね。\n@c0@"
309:
  de: "@aGriselda@bKannst du dich mal beeilen und uns ein Zimmer suchen? Ich werde müde und muss noch eine Maniküre machen, bevor ich zu Bett gehen kann.\n@c0@"
  en: "@aDebora@bCan you hurry up and find us a room? I'm getting tired now, and I need to give myself a manicure before bed.\n@c0@"
  es: "@aStefania@b¿Por qué no vas presto a buscar habitación? Me estoy cansando y tienes que hacerme las uñas antes de dormire.\n@c0@"
  fr: "@aPandora@bTu ne peux pas te dépêcher de nous trouver une chambreⓡ Je commence à être fatiguée, et je dois\nme faire une manucure avant d'aller me coucher.\n@c0@"
  it: "@aViola@bMa insomma! Vuoi darti una mossa a trovare una sistemazione?! Sono stanca morta, e devo anche fare la manicure prima di andare a letto!\n@c0@"
  ja: "@a@bデボラ「そろそろ　今日の宿を　とってくれる？\n\tなんだか　つかれてきたし\n\tネイルのお手入れも　したいから。\n@c0@"
310:
  de: "@aGriselda@bIch finde unsere Reise gar nicht anstrengend. Das liegt daran, dass ich die mühseligen Aufgaben dir überlasse.\n@c0@"
  en: "@aDebora@bI'm not finding our journey tiresome at all.\r\nThat's because I leave all the annoying jobs to you.\n@c0@"
  es: "@aStefania@bNuestro viaggio no me parece nada cansado.\r\nPorque te dejo a ti todos los trabajos penosos, claro está.\n@c0@"
  fr: "@aPandora@bJe ne trouve pas notre voyage fatigant du tout. Mais c'est parce que je te laisse te charger\r\nde tous les travaux pénibles.\n@c0@"
  it: "@aViola@bNon ti dispiace che ti abbia chiesto di svolgere tutti i lavori faticosi, vero? Non sono una scansafatiche, ma ho una paura matta di spezzarmi un'unghia...\n@c0@"
  ja: "@a@bデボラ「私は　大変な旅とは思ってないわ。\n\tめんどうなことを　全部やってくれる\n\t%a000090がいるから。\n@c0@"
311:
  de: "@aGriselda@bDu redest auch mit Monstern, nicht, %a000090? Aber das kann ja nur...\n@c0@"
  en: "@aDebora@bYou communicate with monsters too, don't you, %a000090? But surely...\n@c0@"
  es: "@aStefania@bTambién te comunicas con mostri, ¿no, %a000090? Ma no serás...\n@c0@"
  fr: "@aPandora@bToi aussi, tu communiques avec les monstres,\nn'est-ce pas, %a000090ⓡ Mais tu n'es\nquand même pas...\n@c0@"
  it: "@aViola@bAnche tu hai la capacità di comunicare con i mostri, %a000090. Non è che per caso...?\nMa no... Che vado mai a pensare?\n@c0@"
  ja: "@a@bデボラ「魔物と心を　通わせるなんて\n\tまるで　%a000090みたいじゃない？\n\tでも　まさか…　ね。\n@c0@"
312:
  de: "@aGriselda@bIch hätte nichts gegen ein Bad. Lass mir eins einlaufen, %a000090, ja?\n@c0@"
  en: "@aDebora@bI wouldn't mind a bath. Get it ready, will you, %a000090?\n@c0@"
  es: "@aStefania@bNo me importaría darme un bagno. Ya me has oído, %a000090.\n@c0@"
  fr: "@aPandora@bJ'aimerais bien prendre un bain.\nPrépare-le, d'accord, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, ti permetto di andare a dormire.\n@c0@"
  ja: "@a@bデボラ「私も　お風呂に入りたいわ。\n\tと　いうわけだから%a000090。\n\t用意しておいてね。\n@c0@"
313:
  de: "@aGriselda@bDas heißt übrigens nicht, dass ich dich auch da drin haben will! Nur, damit wir uns richtig verstehen.\n@c0@"
  en: "@aDebora@bThat doesn't mean I want you to get in it, by the way! Just to be perfectly clear.\n@c0@"
  es: "@aStefania@b¡Y eso no significa que te quiera dentro!, ¿capisci?\n@c0@"
  fr: "@aPandora@bÀ propos, ça ne veut pas dire que j'ai envie\nque tu y viennes aussiⓠ Juste pour que\nles choses soient claires.\n@c0@"
  it: "@aViola@bMa non prima di avermi preparato un bel bagno caldo e uno sfilatino con prosciutto di Cinghialorco!\n@c0@"
  ja: "@a@bデボラ「……２人で　いっしょに入るっていう\n\t意味じゃないわよ？\n\tわかっているとは　思うけど。\n@c0@"
314:
  de: "@aGriselda@bIch bezweifle, dass er die Reise nach Utensiel allein machen könnte, aber vielleicht ist er stärker, als er aussieht.\n@c0@"
  en: "@aDebora@bI doubt he'd manage a trip to Stockenbarrel all on his own, but maybe he's stronger than he looks.\n@c0@"
  es: "@aStefania@bDudo que pudiera viajar a Clavis por su cuenta, pero quizá sea più forte de lo que parece.\n@c0@"
  fr: "@aPandora@bÇa m'étonnerait qu'il arrive à voyager jusqu'à\r\nSaint Éloi tout seul, mais peut-être qu'il est\r\nplus fort qu'il n'en a l'air.\n@c0@"
  it: "@aViola@bSe fosse davvero amico del padre di Bianca, potrebbe anche andare a salutarlo di persona, invece di limitarsi a mandargli i saluti! Dico bene, no?!\n@c0@"
  ja: "@a@bデボラ「この　おじいさん１人だけで\n\t山奥の村まで行くのは　無理っぽいけど\n\t意外と　強かったりするのかしら？\n@c0@"
315:
  de: "@aGriselda@bWas für ein Chaos! Sie hätten den Ort doch wirklich nicht so in Trümmer legen müssen.\n@c0@"
  en: "@aDebora@bWhat a mess! There was no need for them to trash the place quite this much.\n@c0@"
  es: "@aStefania@b¡Qué lío! No había necesidad de que hicieran tutto esto.\n@c0@"
  fr: "@aPandora@bQuel bazarⓠ Il n'était absolument pas nécessaire de leur part de dévaster cet endroit de la sorte.\n@c0@"
  it: "@aViola@bMa cosa avranno fatto gli abitanti del villaggio per meritarsi una punizione simile?!\nSanto cielo, che macello...\n@c0@"
  ja: "@a@bデボラ「ひどい　ありさまね……\n\tここまで　こわしつくすだなんて\n\tいくらなんでも　やりすぎだわ。\n@c0@"
316:
  de: "@aGriselda@bDu siehst etwas blass aus, %a000090. Ich glaube, du solltest lieber früh ins Bett gehen. Und keine Widerrede.\n@c0@"
  en: "@aDebora@bYou look a bit pale, %a000090. I think you'd better have an early night. In fact, that's an order.\n@c0@"
  es: "@aStefania@bEstás bianco, %a000090. Sería mejor acostarnos pronto. De hecho, te lo ordeno.\n@c0@"
  fr: "@aPandora@bTu sembles un peu pâle, %a000090.\nJe crois que tu ferais bien d'aller te coucher tôt.\nC'est un ordre, en fait.\n@c0@"
  it: "@aViola@bStai bene, %a000090? Ti vedo pallido...\nDai, cerca di rilassarti.\nVedrai che dopo ti sentirai meglio...\n@c0@"
  ja: "@a@bデボラ「%a000090　あんた　顔色が悪いわよ。\n\t今日は　早く休みなさい。\n\tいいわね？　これは命令よ。\n@c0@"
317:
  de: "@aGriselda@bWie ärgerlich! Er hatte das, was er brauchte, direkt vor seiner Nase und konnte es nicht benutzen.\n@c0@"
  en: "@aDebora@bHow annoying! He had what he needed right there in front of him, but he couldn't make use of it.\n@c0@"
  es: "@aStefania@b¡Qué lástima! Tenía justo delante lo que necesitaba ma no sabía usarlo.\n@c0@"
  fr: "@aPandora@bComme c'est ennuyeuxⓠ Ce dont il avait besoin se trouvait juste là, devant lui mais il ne pouvait pas s'en servir.\n@c0@"
  it: "@aViola@bMa ti rendi conto?!\nAveva l'oggetto che gli serviva per proseguire la sua ricerca ma non riusciva a usarlo!\n@c0@"
  ja: "@a@bデボラ「本当に　くやしかったでしょうね。\n\t手がかりが　目の前にあったのに\n\t自分では　それが　使えなかったんだから。\n@c0@"
318:
  de: "@aGriselda@bAlso können wir deiner Mutter nur helfen, indem wir den Helden aus einer Geschichte finden, die möglicherweise nichts als eine Legende ist.\n@c0@"
  en: "@aDebora@bSo the only way we can help your mother is to find the hero of what might be nothing but a legend.\n@c0@"
  es: "@aStefania@bAsí que el único modo de ayudar a la tua mamma es dar con un héroe que podría ser tan solo una leyenda.\n@c0@"
  fr: "@aPandora@bAlors la seule façon pour nous d'aider ta mère, c'est de retrouver un héros qui ne pourrait être rien de plus qu'une légende.\n@c0@"
  it: "@aViola@bL'unico modo per aiutare tua madre è trovare un eroe che potrebbe anche non esistere...\nDico bene, %a000090?\n@c0@"
  ja: "@a@bデボラ「おとぎ話の　主人公さがしが\n\tあんたのママを　助けることのできる\n\tたった１つの　手がかりだなんて……。\n@c0@"
319:
  de: "@aGriselda@bHmpf. Tja, wenn's anders nicht geht, dann mal los.\n@c0@"
  en: "@aDebora@bHmph. I suppose if that's the only way, then there's nothing for it.\n@c0@"
  es: "@aStefania@bMmm. Aunque si es el único modo, veramente, no hay más alternativa.\n@c0@"
  fr: "@aPandora@bMmpf. Enfin, si c'est le seul moyen, il n'y a rien d'autre à faire.\n@c0@"
  it: "@aViola@bSiamo messi maluccio, direi.\nBah, non importa...\nAndiamo avanti e vediamo che succede.\n@c0@"
  ja: "@a@bデボラ「でも　本当にそれしか\n\t方法が　ないんだから\n\tやるしか　ないのよね……。\n@c0@"
320:
  de: "@aGriselda@bIch weiß, ich frage wahrscheinlich den Falschen, %a000090, aber was soll's.\n@c0@"
  en: "@aDebora@bI know I'm probably barking up the wrong tree here, %a000090, but I'll ask anyway.\n@c0@"
  es: "@aStefania@bProbabilemente me equivoque, %a000090, pero preguntaré igual.\n@c0@"
  fr: "@aPandora@bJe sais que je me fourre peut-être le doigt dans l'œil, %a000090, mais je vais quand même\nposer la question.\n@c0@"
  it: "@aViola@bDevo chiederti una cosa, %a000090, ed esigo che tu mi risponda sinceramente...\n@c0@"
  ja: "@a@bデボラ「%a000090。　まさかとは思うけど\n\tいちおう　聞いておくわね。\n@c0@"
321:
  de: "@aGriselda@bIch habe doch recht, dass dir unsere Suche nach dem legendären Helden nicht zu viel wird, oder?\n@c0@"
  en: "@aDebora@bI'm right in thinking that you never find our quest for the legendary hero tedious, aren't I?\n@c0@"
  es: "@aStefania@b¿Te aburre un po' todo esto de la búsqueda del héroe legendario?\n@c0@"
  fr: "@aPandora@bAi-je raison de penser que tu ne trouves jamais notre quête du héros légendaire fastidieuseⓡ\n@c0@"
  it: "@aViola@bPensi che io ti stia aiutando nella tua ricerca dell'Eroe Leggendario, vero?\n@c0@"
  ja: "@a@bデボラ「勇者をさがす旅を　本当は\n\tやりたくないだなんて\n\t思っていたりは……　しないわよね？\n@c0@"
322:
  de: "@aGriselda@bDas ist gut. Und gut, dass du nicht versucht hast, mich zu necken und ⓞneinⓟ zu sagen. Ich hab's nicht gern, geneckt zu werden.\n@c0@"
  en: "@aDebora@bThat's good. And it's good that you didn't try to tease me by saying no. I don't have much patience with being teased.\n@c0@"
  es: "@aStefania@bBene. Y grazie por no bromear diciendo que no. No me gusta que se rían di me.\n@c0@"
  fr: "@aPandora@bC'est bien. Et c'est bien aussi que tu n'aies pas essayé de te moquer de moi en prétendant le contraire.\n㈡\nJ'ai très peu de patience, en ce qui concerne les moqueries.\n@c0@"
  it: "@aViola@bAh, sono felice di sentirlo! D'altronde non ti avrei creduto, se mi avessi detto che non ti sono d'aiuto.\nCon tutto quello che sto facendo per te...!\n@c0@"
  ja: "@a@bデボラ「そう。　それならいいけど。\n\tくだらない冗談に　つきあうほど\n\t私は　ヒマじゃないの。　覚えておいて。\n@c0@"
323:
  de: "@aGriselda@bDas ist nicht lustig! Und außerdem hast du dir damit den neunten Minuspunkte geholt. Und beim zehnten... Ach, das willst du gar nicht wissen.\n@c0@"
  en: "@aDebora@bThat's not funny. And it means you've lost nine points so far. When it gets to ten... You don't even want to know what happens when it gets to ten.\n@c0@"
  es: "@aStefania@bNo tiene gracia. Y eso significa que ya has perdido nueve punti. Cuando llegues a dieci... No quieras saber lo que pasa al llegar a dieci.\n@c0@"
  fr: "@aPandora@bÇa n'est pas drôle. Et ça veut dire qu'as ce stade, tu as perdu neuf points. Quand tu arriveras à dix...\n㈡\nTu ne veux même pas savoir ce qui se passera quand tu arriveras à dix.\n@c0@"
  it: "@aViola@bChe spiritoso che sei!\nE pensare che ti avevo anche chiesto di rispondere in maniera sincera...\n@c0@"
  ja: "@a@bデボラ「それこそ　つまらない冗談だわ。\n\tあ　ちなみに　今ので　減点９よ。\n\t１０までいったら…　覚悟しておくのね。\n@c0@"
324:
  de: "@aGriselda@bIch frage mich, wie hier Blumen blühen können. Wie seltsam!\n@c0@"
  en: "@aDebora@bI wonder how flowers are managing to bloom in here. How strange!\n@c0@"
  es: "@aStefania@bNo sé come lograrán las fiori crecer aquí. ¡Qué strano!\n@c0@"
  fr: "@aPandora@bJe me demande comment les fleurs arrivent à éclore dans un endroit pareil. Comme c'est étrangeⓠ\n@c0@"
  it: "@aViola@bÈ incredibile trovare un ramo in fiore proprio in questo posto, non trovi?\n@c0@"
  ja: "@a@bデボラ「どうして　こんなところに\n\t桜の花が　さいているの！？\n\t不思議なことが　あるものね。\n@c0@"
325:
  de: "@aGriselda@bVielleicht als Geschenk für mich, zu Ehren meiner Schönheit...?\n@c0@"
  en: "@aDebora@bMaybe they're a present for me, in honour of\r\nmy beauty...?\n@c0@"
  es: "@aStefania@bQuizá sean un regalo per me por la mia bellezza.\n@c0@"
  fr: "@aPandora@bC'est peut-être un cadeau pour moi, en honneur de ma beauté...ⓡ\n@c0@"
  it: "@aViola@bDev'essere un omaggio che madre natura ha deciso di fare alla mia bellezza...\n@c0@"
  ja: "@a@bデボラ「もしかして　美しい私への\n\tおくりもの　とか……？\n@c0@"
326:
  de: "@aGriselda@bIst das trist hier! Und die Dunkelheit macht es auch nicht besser.\n@c0@"
  en: "@aDebora@bWhat a sad-looking place. It doesn't help that it's night, I suppose.\n@c0@"
  es: "@aStefania@bQué sitio más triste. Supongo que la notte lo empeora, claro.\n@c0@"
  fr: "@aPandora@bQuel endroit désolé. Et puis de nuit, ça ne doit pas aider, j'imagine.\n@c0@"
  it: "@aViola@bNemmeno l'oscurità riesce a mitigare il senso di desolazione che permea questo luogo...\n@c0@"
  ja: "@a@bデボラ「……さびしい所ね。\n\t夜だから　よけいに　そう見えるわ。\n@c0@"
327:
  de: "@aGriselda@bWeißt du, um wen es sich bei dieser Zuckerchen-Type handelt? Was? Eine Fee?! Ha ha ha!\n@c0@"
  en: "@aDebora@bDo you know who this Honey character is?\nA faerie!? Ha ha!\n@c0@"
  es: "@aStefania@b¿Ma quién es esa Dulce? ¿¡Un hada!? ¡Ja, ja!\n@c0@"
  fr: "@aPandora@bTu sais qui est cette Candyⓡ\nUne féeⓡⓐ Ha haⓠ\n@c0@"
  it: "@aViola@bChi sarà quest'Amandina?\nEh? Che cosa? Una fata?!\nWah ah ah ah ah!\n@c0@"
  ja: "@a@bデボラ「ベラとかいう名前に\n\t心当たりが　あるの？\n\t……え？　妖精！？\n@c0@"
328:
  de: "@aGriselda@bDu hörst dich schon an wie Nera. Als wir noch klein waren, hat sie immerfort von Feen gefaselt. Dabei gibt's die doch gar nicht!\n@c0@"
  en: "@aDebora@bYou sound just like Nera. She was always going on about faeries when we were kids. I don't believe in them one bit!\n@c0@"
  es: "@aStefania@bPareces Nera. Cuando éramos pequeñas sempre estaba con lo de las hadas. ¡Hay que ser crédula!\n@c0@"
  fr: "@aPandora@bOn croirait entendre Nera. Quand on était petites, elle parlait sans arrêt des fées. Je ne crois pas une seule seconde aux féesⓠ\n@c0@"
  it: "@aViola@bSei più credulone di mia sorella Nera!\nSai che da piccola diceva di giocare con le fate?\n㈡\nDevo svelarti un segreto, %a000090: quegli esseri fantastici esistono solo nei libri di fiabe.\n@c0@"
  ja: "@a@bデボラ「フローラみたいなことを言うのね。\n\tあの子も昔　よくそんな話をしていたわ。\n\t私は　妖精なんて　信じなかったけど。\n@c0@"
329:
  de: "@aGriselda@bIch hab ganz plötzlich Sehnsucht nach Mama und Papa bekommen.\n@c0@"
  en: "@aDebora@bI suddenly feel this urge to see Mama and Papa.\n@c0@"
  es: "@aStefania@bAll'improviso tengo ganas de ver a mis padres. \n@c0@"
  fr: "@aPandora@bJ'ai très envie de voir mamma et papa,\r\ntout d'un coup.\n@c0@"
  it: "@aViola@bLa mia mamma...\nIl mio papà...\nSob! Ho nostalgia dei miei genitori... Sob!\n@c0@"
  ja: "@a@bデボラ「……なんだか　急に\n\tパパと　ママの顔が\n\t見たくなってきたような気がするわ。\n@c0@"
330:
  de: "@aGriselda@bWas? Du findest wohl, es sieht mir gar nicht ähnlich, so was zu sagen? Na ja, da könntest du recht haben.\n@c0@"
  en: "@aDebora@bWhat? You think it's not like me to say something like that, don't you? I suppose you're right.\n@c0@"
  es: "@aStefania@b¿Qué? ¿Que no te parece algo tipico di me? Supongo que no.\n@c0@"
  fr: "@aPandora@bQuoiⓡ Tu trouves que ça ne me ressemble pas de dire des choses comme çaⓡ Tu as raison, je crois.\n@c0@"
  it: "@aViola@bNon è nulla, %a000090. Ho solo avuto un momento di debolezza. Dammi un istante e tornerò a essere la tigre che conosci e ami...\n@c0@"
  ja: "@a@bデボラ「あら　私らしくないとでも\n\t言いたげな顔を　してるわね。\n\t……自分でも　そう思うけど。\n@c0@"
331:
  de: "@aGriselda@bWollen wir wirklich hier übernachten? Tja, wenn du willst. Mir ist es eigentlich egal.\n@c0@"
  en: "@aDebora@bAre we really staying here for the night?\r\nWell, I suppose if that's what you want.\r\nI'm not bothered either way.\n@c0@"
  es: "@aStefania@b¿De vero vamos a pasar aquí la notte?\r\nBueno, por esta vez te dejo elegire.\r\nPorque me da igual, ¿capisci?\n@c0@"
  fr: "@aPandora@bEst-ce qu'on reste vraiment ici pour la nuitⓡ Bon, si c'est ce que tu veux. Pour moi, peu importe.\n@c0@"
  it: "@aViola@bHai voglia di trascorrere la notte qui, vero?\nChiedimelo per favore, e vedrò se posso accontentarti.\n@c0@"
  ja: "@a@bデボラ「……本当に　ここへ　泊まるの？\n\tまあ　あんたが　そうしたいのなら\n\t私は　かまわないけど。\n@c0@"
332:
  de: "@aGriselda@bDu und deine Höhlen, was? Kaum zu glauben, dass du als Kind schon solche Orte erforscht hast.\n@c0@"
  en: "@aDebora@bYou really love your caves, don't you? It's amazing that you were exploring places like this as a kid.\n@c0@"
  es: "@aStefania@bTe gustan las grottas, ¿eh? Es incredibile que de bambino exploraras sitios así.\n@c0@"
  fr: "@aPandora@bTu aimes vraiment les grottes, n'est-ce pasⓡ\nC'est incroyable que tu aies exploré des endroits pareils quand tu étais petit.\n@c0@"
  it: "@aViola@bHai un debole per le caverne, vero? Mi riesce difficile credere che un pappamolle come te abbia il coraggio di esplorare luoghi tanto pericolosi...\n@c0@"
  ja: "@a@bデボラ「あんたって　洞くつとか　好きそうね。\n\t子供の頃から　こんな場所に\n\t出入りしてた　っていうのが　すごいわ。\n@c0@"
333:
  de: "@aGriselda@bDas war übrigens nicht als Kompliment gemeint, nicht dass du auf komische Ideen kommst. Ich finde es bloß schwer zu verstehen, das ist alles.\n@c0@"
  en: "@aDebora@bThat wasn't a compliment, by the way, so don't get the wrong idea. What I meant was that I find it hard to comprehend, that's all.\n@c0@"
  es: "@aStefania@bY no es un complimento, así que no te confundas. Lo que quiero decir es que me cuesta entenderlo, questo e tutto.\n@c0@"
  fr: "@aPandora@bCe n'était pas un compliment, au fait. Ne te fais pas de fausses idées. Je voulais seulement dire que je trouvais ça difficile à comprendre, rien de plus.\n@c0@"
  it: "@aViola@bSe vuoi, puoi dimenticare che ti abbia dato del ⓕpappamolleⓖ e prendere la frase precedente come un complimento...\n@c0@"
  ja: "@a@bデボラ「ああ　ほめてるわけじゃないから\n\tカンちがい　しないでね。\n\t私には理解できない。　それだけのことよ。\n@c0@"
334:
  de: "@aGriselda@bHöhlen sind feucht und modrig und dunkel und beklemmend, und es gibt kein Tageslicht.\n@c0@"
  en: "@aDebora@bCaves are damp and smelly and dark and claustrophobic, and there's never any sunshine...\n@c0@"
  es: "@aStefania@bLas cuevas son húmedas, apestosas, me agobian y el sole nunca brilla en su interior...\n@c0@"
  fr: "@aPandora@bLes grottes c'est humide, malodorant, sombre, ça rend claustrophobe et on n'y voit jamais la lumière du soleil...\n@c0@"
  it: "@aViola@bLe caverne sono buie, umide e fredde.\nIn altre parole, sono luoghi odiosi.\n\n@c0@"
  ja: "@a@bデボラ「洞くつって　じめじめしてるし\n\tカビくさいし　暗いし　せまいし\n\t太陽だって　見えないし……。\n@c0@"
335:
  de: "@aGriselda@bUnd wenn du sie noch so toll findest, mich kannst du nicht dafür erwärmen.\n@c0@"
  en: "@aDebora@bYou can be as fanatical as you like about them, but you'll never convince me.\n@c0@"
  es: "@aStefania@bDi lo que quieras, ma nunca me convencerás de lo contrario.\n@c0@"
  fr: "@aPandora@bTu peux bien en être aussi fanatique que tu veux, tu n'arriveras jamais à me convaincre.\n@c0@"
  it: "@aViola@bTrovami una caverna dove possa comprare qualche vestitino alla moda, e prenderò in considerazione l'ipotesi di cambiare idea...\n@c0@"
  ja: "@a@bデボラ「あんたが　いくら　洞くつマニアでも\n\t私は　好きになれないわ。\n@c0@"
336:
  de: "@aGriselda@bDas ist ja ganz beeindruckend, dass sie dich hier einfach passieren lassen. Du überraschst mich.\n@c0@"
  en: "@aDebora@bThat's quite impressive, you being let through like that. You surprise me.\n@c0@"
  es: "@aStefania@bVeramente me ha impresionado que te dejen pasar así. Me sorprendes.\n@c0@"
  fr: "@aPandora@bC'est assez impressionnant de voir qu'il te laisse passer comme ça. Tu me surprends.\n@c0@"
  it: "@aViola@bTi ha lasciato passare senza battere ciglio...\nSono senza parole. No, dico sul serio: sei il pappamolle più in gamba che abbia mai conosciuto!\n@c0@"
  ja: "@a@bデボラ「関所を　顔パスだなんて\n\tなかなか　やるじゃない。\n\tちょっとだけ　あんたを見直したわ。\n@c0@"
337:
  de: "@aGriselda@bÜber uns fließt ein Fluss, nicht? Das ist irgendwie ein seltsamer Gedanke. Du glaubst doch nicht, dass das alles hier vollaufen könnte, oder?\n@c0@"
  en: "@aDebora@bThere's a river flowing above us, isn't there?\r\nIt's a bit of an odd feeling. You don't think this\r\nplace could flood, do you?\n@c0@"
  es: "@aStefania@bTenemos un río encima, ¿no?\r\nQué sensazione más rara. No podrá inundarse esto, ¿vero?\n@c0@"
  fr: "@aPandora@bIl y a une rivière qui coule au-dessus de nous, n'est-ce pasⓡ C'est une impression bizarre. Tu ne crois pas que cet endroit pourrait être inondé, heinⓡ\n@c0@"
  it: "@aViola@bSopra di noi scorre il fiume, vero?\nSe la volta crollasse, saremmo sommersi dalle acque, e la mia acconciatura andrebbe a farsi benedire!\n㈡\nSenza dimenticare il non secondario particolare che, con ogni probabilità, annegheremmo come topi...\n@c0@"
  ja: "@a@bデボラ「この上を　川が流れているのよね？\n\tなんだか　不自然だわ。\n\t…くずれてきたり　しないわよね？\n@c0@"
338:
  de: "@aGriselda@bDie frische Brise vom Fluss ist recht angenehm.\n@c0@"
  en: "@aDebora@bThe breeze coming off the river is quite pleasant.\n@c0@"
  es: "@aStefania@bLa brisa que viene del río es molto piacevole.\n@c0@"
  fr: "@aPandora@bLa brise qui vient de la rivière est assez plaisante.\n@c0@"
  it: "@aViola@bHa risolto i problemi di Coburg osservando lo scorrere del fiume?!\n@c0@"
  ja: "@a@bデボラ「川のほうから　吹いてくる風が\n\tけっこう　気持ちいいわね。\n@c0@"
339:
  de: "@aGriselda@bJa, Flüsse genießt man am besten von oben, statt unter ihnen durchzulaufen.\n@c0@"
  en: "@aDebora@bYes, rivers are to be enjoyed from up above, not to be walked underneath.\n@c0@"
  es: "@aStefania@bSí, los ríos hay que disfrutarlos desde arriba, no pasear sotto ellos.\n@c0@"
  fr: "@aPandora@bOui, c'est d'en haut que l'on profite au mieux des rivières, pas quand on marche dessous.\n@c0@"
  it: "@aViola@bDammi la tua opinione, %a000090...\nSecondo te, quel tipo ci è o ci fa?\n@c0@"
  ja: "@a@bデボラ「やっぱり　川は\n\t上から　ながめるものなのであって\n\t下を　通りぬけるものじゃないのよ。\n@c0@"
340:
  de: "@aGriselda@bHier also wurde dein Vater...\n@c0@"
  en: "@aDebora@bSo this is where your father wasⓚⓛ\n@c0@"
  es: "@aStefania@bAsí que aquí fue donde il tuo papino...\n@c0@"
  fr: "@aPandora@bAlors c'est ici que ton père a été...\n@c0@"
  it: "@aViola@bAllora è qui che tuo padre fu...\nSì, voglio dire...\n@c0@"
  ja: "@a@bデボラ「そう　ここで　あんたのパパが……。\n@c0@"
341:
  de: "@a@bGriselda schließt die Augen und neigt den Kopf. Es klingt, als würde sie ein Gebet sprechen, aber %a000090 kann die Worte nicht verstehen.\n@c0@"
  en: "@a@bDebora closes her eyes and bows her head.\nIt sounds like she's saying some kind of prayer, but %a000090 can't make it out.\n@c0@"
  es: "@a@bStefania cierra los ojos y baja la cabeza.\nParece que está rezando, pero %a000090 no está seguro.\n@c0@"
  fr: "@a@bPandora ferme les yeux et incline la tête. On dirait qu'elle est en train de faire une sorte de prière, mais %a000090 n'arrive pas à en être sûr.\n@c0@"
  it: "@a@bViola china il capo e chiude gli occhi, quindi recita una preghiera a bassa voce...\n@c0@"
  ja: "@a@bデボラは　しずかに　目を閉じた……。\n何か　祈りらしき言葉を　つぶやいているが\n%a000090には　聞き取れなかった……。\n@c0@"
342:
  de: "@aGriselda@bWir sollten bald weitergehen. Wir können uns hier nicht ewig aufhalten.\n@c0@"
  en: "@aDebora@bWe should move on soon.\r\nWe can't hang around here forever.\n@c0@"
  es: "@aStefania@bDeberíamos seguir presto.\r\nNo podemos quedarnos a este punto.\n@c0@"
  fr: "@aPandora@bOn devrait se dépêcher de partir. On ne peut pas traîner ici indéfiniment.\n@c0@"
  it: "@aViola@bAndiamo.\nNon possiamo stare qui troppo a lungo.\n@c0@"
  ja: "@a@bデボラ「そろそろ　他の場所へ行くわよ。\n\tいつまでも　ここにいるわけには\n\tいかないでしょう？\n@c0@"
343:
  de: "@aGriselda@bDu hast noch viel zu tun.\n@c0@"
  en: "@aDebora@bYou have lots of things you need to do.\n@c0@"
  es: "@aStefania@bTienes muchas cosas que hacer, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu as beaucoup de choses à faire.\n@c0@"
  it: "@aViola@bHai molte cose da fare, caro.\nDevo essere sempre io a ricordarti i tuoi doveri, eh?!\n@c0@"
  ja: "@a@bデボラ「あんたには　他に　やるべきことが\n\tたくさん　あるんだから。\n@c0@"
344:
  de: "@aGriselda@bEs ist Zeit zu gehen, %a000090. Wir können hier nicht ewig bleiben.\n@c0@"
  en: "@aDebora@bIt's time to go outside now, %a000090.\nWe can't stay in here forever.\n@c0@"
  es: "@aStefania@bHora de salir, %a000090.\nNo podemos quedarnos aquí per sempre.\n@c0@"
  fr: "@aPandora@bOn doit sortir, à présent, %a000090. On ne peut pas rester éternellement dans cet endroit.\n@c0@"
  it: "@aViola@bAvanti, %a000090...\nAndiamo via da questo posto.\n@c0@"
  ja: "@a@bデボラ「%a000090…　いいかげん外へ出るわよ。\n\tいつまでも　ここにいるわけには\n\tいかないわ。\n@c0@"
345:
  de: "@aGriselda@bDas ruft alte Erinnerungen wach... Es ist schon lange her, aber einmal bin ich hier an Bord eines Schiffes gegangen.\n@c0@"
  en: "@aDebora@bThis takes me back. It's a long time ago now, but I once boarded a boat here.\n@c0@"
  es: "@aStefania@b¡Qué recuerdos! Hace ya molto, ma una vez subí aquí a un barco.\n@c0@"
  fr: "@aPandora@bÇa me rappelle des souvenirs. C'était il y a très longtemps, maintenant, mais je suis montée une fois sur un bateau, ici.\n@c0@"
  it: "@aViola@bMi ricordo di questo posto!\nCi venni da bambina, per imbarcarmi su una nave.\n@c0@"
  ja: "@a@bデボラ「なつかしいわ。\n\tずいぶん昔のことだけど　私\n\tこの港から　船に乗ったことがあるのよ。\n@c0@"
346:
  de: "@aGriselda@bEigentlich hab ich mich mehr an Bord des Schiffes gestürzt, wenn man es genau nehmen will.\n@c0@"
  en: "@aDebora@bHurled myself at a boat, actually... That would be a more accurate way to describe it!\n@c0@"
  es: "@aStefania@b¡Va bene!, sería más exacto decir que me metí de cabeza en él\n@c0@"
  fr: "@aPandora@bJe me suis précipitée sur un bateau, pour être exacte... Ça correspond mieux à la réalité des faitsⓠ\n@c0@"
  it: "@aViola@bEra il mio primo viaggio per mare, ed ero talmente felice ed emozionata che mi fiondai a bordo di corsa!\n@c0@"
  ja: "@a@bデボラ「飛び乗った……　と　言ったほうが\n\t正しいのかもしれないけど。\n@c0@"
347:
  de: "@aGriselda@bIch würde die Zeiten nicht unbedingt friedlich nennen. Aber mir ist das egal. Ich tue zu allen Zeiten nur das, was ich will.\n@c0@"
  en: "@aDebora@bI wouldn't exactly call it peaceful now. It doesn't matter, though. I only ever do what I want.\n@c0@"
  es: "@aStefania@bYo no los llamaría tiempos de paz. Ma va bene, yo hago lo que quiero.\n@c0@"
  fr: "@aPandora@bJe ne dirais pas vraiment que la paix règne en ce moment. Mais ça n'a pas d'importante. Je ne fais\r\nque ce que je veux, de toute façon.\n@c0@"
  it: "@aViola@bNon avere il proprio marito tra i piedi sarebbe una bella cosa, se non fosse che la cosa rende impossibile essere servita e riverita dal consorte!\n@c0@"
  ja: "@a@bデボラ「今が平和だなんて　思えないけれど\n\t私は　そんなことは　関係なしに\n\t自分の　やりたいことだけをやるわ。\n@c0@"
348:
  de: "@aGriselda@bAlles, was ich nicht tun will, überlasse ich dir, %a000090.\n@c0@"
  en: "@aDebora@bI leave all the things I don't want to do to you, %a000090.\n@c0@"
  es: "@aStefania@bTe dejo a te todo lo que yo no quiero, %a000090.\n@c0@"
  fr: "@aPandora@bToutes les choses que je n'ai pas envie de faire, je te les laisse, %a000090.\n@c0@"
  it: "@aViola@bÈ per questo motivo che ti voglio sempre ben sveglio e vicino a me, %a000090.\n@c0@"
  ja: "@a@bデボラ「やりたくないことは　全部\n\t%a000090にやってもらえば\n\tいいだけだから。\n@c0@"
349:
  de: "@aGriselda@bNera hat eine Weile hier gelebt, um Theologie zu studieren, weißt du. Hier wurde sie auch in häuslichen Tugenden unterwiesen.\n@c0@"
  en: "@aDebora@bNera came here to study theology for a while, you know. She did something called domestic goddess training too.\n@c0@"
  es: "@aStefania@bNera vino aquí un tempo a estudiar teología. También hizo algo llamado curso de economía doméstica de la Diosa.\n@c0@"
  fr: "@aPandora@bTu sais, Nera est venue ici pendant un temps pour étudier la théologie. Elle a aussi suivi un truc appelé éducation domestique et religieuse\n@c0@"
  it: "@aViola@bNera ha trascorso un bel po' di tempo in questo posto. Credo che abbia frequentato un corso di preparazione al matrimonio, o qualcosa del genere...\n@c0@"
  ja: "@a@bデボラ「昔　フローラは　ここで\n\t神学の勉強を　していたことがあるの。\n\t花嫁修業も　兼ねて…　ね。\n@c0@"
350:
  de: "@aGriselda@bHm? Ich? Ich hatte es nicht nötig, diese Dinge zu studieren, also hab ich mich geweigert. Papa war eine ganze Weile lang recht ungehalten.\n@c0@"
  en: "@aDebora@bHm? Me? There was no need for me to study any of that, so I said no. Papa was a bit peeved for a while.\n@c0@"
  es: "@aStefania@b¿Mmm? ¿Yo? No necesitaba estudiar nada de eso y no quise. Il mio papino estuvo un tiempo enfadado con me.\n@c0@"
  fr: "@aPandora@bHeinⓡ Moiⓡ Je n'avais pas besoin d'étudier aucun\nde ces domaines, alors j'ai dit non. Papa en a été\nun peu énervé pendant quelque temps.\n@c0@"
  it: "@aViola@bIl mio paparino volevo che ci venissi anch'io, ma gli dissi che non ce n'era bisogno.\n㈡\nSapevo già come ci si deve comportare quando si è sposati: la moglie comanda e il marito ubbidisce!\n@c0@"
  ja: "@a@bデボラ「え　私？　そんな修行は\n\t必要ないと思ったから　断ったわ。\n\tしばらくパパに　小言をいわれたけど。\n@c0@"
351:
  de: "@aGriselda@bDu scheinst dich sehr gut mit den Nonnen zu verstehen. Aber mir macht das nichts aus.\n@c0@"
  en: "@aDebora@bYou seem to get on with the nuns here very well.\r\nNot that it bothers me.\n@c0@"
  es: "@aStefania@bSembra que te llevas muy bien con estas monjas.\r\nA mí me da igual, tú sabrás...\n@c0@"
  fr: "@aPandora@bTu as l'air de très bien t'entendre avec les religieuses d'ici. Mais ça ne me pose pas de problème.\n@c0@"
  it: "@aViola@bCome mai conosci quella suora, %a000090?\nNo, non sono gelosa di una religiosa! La mia era una semplice curiosità, fessacchiotto che non sei altro!\n@c0@"
  ja: "@a@bデボラ「あんた　ここのシスターと\n\tずいぶんと　仲がいいのね……。\n\t別に　どうでもいいけど。\n@c0@"
352:
  de: "@aGriselda@bEin Prinz auf einem weißen Pferd? Und ich dachte schon, die gibt's bloß im Märchen.\n@c0@"
  en: "@aDebora@bA prince on a white horse? And there was me thinking they only existed in faerie stories.\n@c0@"
  es: "@aStefania@b¿Un príncipe en un caballo bianco? Y yo que creía que eso era cosa de los cuentos de hadas.\n@c0@"
  fr: "@aPandora@bUn prince sur un cheval blancⓡ Et moi qui croyais qu'ils n'existaient que dans les contes de fées.\n@c0@"
  it: "@aViola@bUn principe in groppa a un magnifico cavallo bianco?!\nE io che credevo che esistessero solo nelle favole...!\n㈡\nSe l'avessi saputo prima, c'avrei pensato su tre o quattro volte prima di sposarti, caro. Ih ih ih!\nDai, non prendertela! Sto scherzando!\n@c0@"
  ja: "@a@bデボラ「白馬に乗って　って……\n\tそんな　絵本みたいなマネをする王子が\n\t本当にいたなんて　おどろきだわ。\n@c0@"
353:
  de: "@aGriselda@bDas kann ich mir vorstellen, dass sie das erschreckt hat. Normalerweise würde man an einem solchen Ort nicht mit Blaublütern rechnen.\n@c0@"
  en: "@aDebora@bIt would be a shock. You don't usually tend to find royalty visiting places like this.\n@c0@"
  es: "@aStefania@bQué brutta sorpresa. La realeza no suele visitar estos lugares.\n@c0@"
  fr: "@aPandora@bEffectivement, ça a dû être un choc. Les personnages royaux visitent assez rarement\r\ndes endroits comme celui-ci.\n@c0@"
  it: "@aViola@bUn principe che sceglie la futura moglie tra le ospiti di un'abbazia?! Ma non è che questa cara suora ci sta prendendo in giro?!\n@c0@"
  ja: "@a@bデボラ「まあ　ふつうは　おどろくわよね。\n\tこういうところに　王族が来るなんて\n\tまず　ありえないことだし。\n@c0@"
354:
  de: "@aGriselda@bOffenbar wirken wir nicht wie ein Ehepaar. Da kann man nichts machen. Vermutlich ist es deswegen, weil du wie mein Leibdiener aussiehst.\n@c0@"
  en: "@aDebora@bWe obviously don't look like husband and wife.\r\nOh well, it can't be helped. You must look like\r\nmy servant, that'll be why.\n@c0@"
  es: "@aStefania@bEstá claro que no parecemos marito y mujer.\r\nQué le vamos a hacer si pareces il mio servitore.\n@c0@"
  fr: "@aPandora@bApparemment, on ne donne pas l'impression d'être mari et femme. Bah, tant pis. On n'y peut rien. Tu dois avoir l'air d'être mon domestique, c'est pour ça.\n@c0@"
  it: "@aViola@bQuesta suora non dev'essere una campionessa di perspicacia, dato che non s'è resa conto che siamo moglie e marito...\n㈡\nDel resto non è facile capirlo: nessuno penserebbe mai che una bellezza come la sottoscritta abbia preso per marito un pappamolle come te. Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「私たち　夫婦に見えないみたいね。\n\tまあ　それは仕方がないわよ。\n\tあんたは　どう見ても　私のしもべだし。\n@c0@"
355:
  de: "@aGriselda@bSie hat recht. Du hast wirklich gütige Augen.\n@c0@"
  en: "@aDebora@bShe's right. You do have kind eyes.\n@c0@"
  es: "@aStefania@bÈ vero. Tienes ojos amables.\n@c0@"
  fr: "@aPandora@bElle a raison. C'est vrai que ton regard est doux.\n@c0@"
  it: "@aViola@bSì, ha ragione: i tuoi occhi sono belli, e il tuo sguardo è gentile.\nÈ per questo che ho deciso di sposart...\n@c0@"
  ja: "@a@bデボラ「このおばさんの言うことは\n\tまちがっては　いないわね。\n\tあんたが　優しいのは　本当だし。\n@c0@"
356:
  de: "@aGriselda@bAber du hast mehr von einem Leibdiener als von einem Ehemann. In der Beziehung lag sie etwas daneben.\n@c0@"
  en: "@aDebora@bYou're more of a servant than a husband, though. That's where she had it a bit wrong.\n@c0@"
  es: "@aStefania@bAunque eres más un servitore que un marito. En eso se ha equivocado.\n@c0@"
  fr: "@aPandora@bMais tu es plus un domestique qu'un mari,\r\nen revanche. Sur ce point, elle n'était pas\r\ntout à fait juste.\n@c0@"
  it: "@aViola@bNo no no! Mi sono sbagliata! Ho deciso di sposarti perché appena ti ho visto ho capito che mi avresti servita e riverita fino alla fine dei tuoi giorni!\n@c0@"
  ja: "@a@bデボラ「もっとも　あんたは\n\t亭主じゃなくて　しもべだから\n\tそこだけは　ちがっているけど。\n@c0@"
357:
  de: "@aGriselda@bEigentlich sollte sie schon längst wieder zurück sein. Vielleicht hat sie einen kleinen Umweg gemacht, um sich ein bisschen zu amüsieren.\n@c0@"
  en: "@aDebora@bShe should definitely be back by now. Maybe she's decided to take a detour and have a bit of fun.\n@c0@"
  es: "@aStefania@bYa debería haber vuelto, sin duda. Quizá decidiera dar un rodeo y divertirse un po'.\n@c0@"
  fr: "@aPandora@bElle devrait effectivement être déjà revenue.\r\nPeut-être qu'elle a décidé de faire un détour\r\npour aller s'amuser un peu.\n@c0@"
  it: "@aViola@bSecondo me la suora ⓕdispersaⓖ ha deciso di vedere com'è il mondo fuori dall'abbazia, e se la sta prendendo comoda...\n@c0@"
  ja: "@a@bデボラ「フローラを送ってきた\n\tシスターなら　とっくに帰ったはずだけど。\n\tどこかで　道草を　くっているのかしら。\n@c0@"
358:
  de: "@aGriselda@bIch weiß nicht, wie es Nera so lange hier ausgehalten hat. Sie fühlt sich schnell einsam.\n@c0@"
  en: "@aDebora@bI don't know how Nera managed to endure this place for so long. She tends to get very lonely.\n@c0@"
  es: "@aStefania@bNon capisco cómo Nera aguantó tanto en este lugar. Tiende a sentirse sola.\n@c0@"
  fr: "@aPandora@bJe ne sais pas comment Nera a fait pour supporter cet endroit pendant si longtemps. Elle a tendance à vite se sentir seule.\n@c0@"
  it: "@aViola@bCome ha fatto Nera a resistere tanto a lungo in questo posto solitario e malinconico?!\nIo sarei scappata dopo venti minuti!\n@c0@"
  ja: "@a@bデボラ「こんなに　静かな場所で\n\tフローラは　よく　ガマンできたわね。\n\tあの子　すごい寂しがりやなのに。\n@c0@"
