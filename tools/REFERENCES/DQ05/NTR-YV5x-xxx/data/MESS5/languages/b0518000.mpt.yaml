  es: "@aStefania@bNera hablaba con il nostro cane, ¿sabes? ¡Menuda tontería!\n@c0@"
  fr: "@aPandora@bNera parlait souvent à notre chien. Ça n'a vraiment aucun sens, si tu veux mon avis.\n@c0@"
  it: "@aViola@bSe dicesse solo cose ovvie e scontate, preferirei lasciar perdere.\nMi farebbe fare solo pessime figure in società.\n@c0@"
  ja: "@a@bデボラ「そういえば　うちで飼っていた犬に\n\tフローラが　よく　ひとりごとを\n\t言っていたけど……　まさか　ね。\n@c0@"
535:
  de: "@aGriselda@bWir sollten uns bald eine Übernachtungsmöglichkeit suchen, %a000090. In letzter Zeit werde ich so schnell müde.\n@c0@"
  en: "@aDebora@bLet's find somewhere to stay the night soon, %a000090. I've been getting a bit tired lately.\n@c0@"
  es: "@aStefania@bBusquemos pronto un sitio donde dormire, %a000090. Últimamente me canso moltissimo.\n@c0@"
  fr: "@aPandora@bEssayons vite de trouver un endroit où passer la nuit, %a000090. Je commence à me sentir fatiguée\n@c0@"
  it: "@aViola@bSbrigati a trovare una sistemazione per stanotte, %a000090.\nHo una gran voglia di fare un bel bagno caldo...\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090。　今日は\n\tそろそろ　宿をとって寝ましょう。\n\t私　最近　なんだか　つかれているのよ。\n@c0@"
536:
  de: "@aGriselda@bOffenbar weiß er immer noch nicht, wo er ist. Na ja. Ist ja nicht mein Problem.\n@c0@"
