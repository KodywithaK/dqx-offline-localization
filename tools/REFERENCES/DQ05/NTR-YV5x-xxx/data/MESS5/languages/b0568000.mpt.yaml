  it: "@aViola@bPer fortuna il tuo carattere avventuroso non ha permesso che la mia indole un po' ⓕselvaticaⓖ ti scoraggiasse.\n㈡\nForse non sono la donna romantica e affettuosa che sognavi di avere accanto, ma voglio dirti che sono felice che tu abbia scelto di sposare me...\n@c0@"
