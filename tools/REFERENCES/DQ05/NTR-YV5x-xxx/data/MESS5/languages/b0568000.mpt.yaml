0:
  de: "@aBianca@bNach all den Jahren, die ich als Statue verbringen musste, kann ich gut verstehen, wie sehr es deine Mutter schmerzt, dir entrissen worden zu sein.\n@c0@"
  en: "@aBianca@bAfter all them years I spent away from you as a statue, I can really understand how painful it must be for your mum to have bin snatched away.\n@c0@"
  es: "@aBianca@bDespués de todos estos años alejada de ti, cuando era una estatua, entiendo muy bien lo doloroso que debió resultarle a tu madre que la secuestraran.\n@c0@"
  fr: "@aBianca@bAprès toutes ces années passées sous forme de statue loin de toi, je comprends combien ça a dû être douloureux pour ta mère de s'être fait enlever.\n@c0@"
  it: "@aBianca@bDopo aver trascorso tanti anni lontano da te, trasformata in una statua, comprendo fino in fondo la sofferenza di tua madre...\n@c0@"
  ja: "@a@bビアンカ「私も　長い間　石になってたから\n\tとらわれている　お母さまの\n\tつらい想いが　痛いほどよくわかるわ。\n@c0@"
1:
  de: "@aNera@bGroßmeister Nimzo ist nicht mehr fern. Der Moment ist endlich gekommen.\n@c0@"
  en: "@aNera@bSo Grandmaster Nimzo is right before us.\r\nThe time has finally come.\n@c0@"
  es: "@aNera@bAsí que el Gran Maestro Nimzo ya está ante nosotros.\nVeramente, ha llegado el momento.\n@c0@"
  fr: "@aNera@bNous allons donc rencontrer le Grand Maître Nimzo.\r\nL'heure est enfin venue.\n@c0@"
  it: "@aNera@bIl Gran Maestro Nimzo ci aspetta.\nÈ arrivato il momento della resa dei conti...\n@c0@"
  ja: "@a@bフローラ「この奥に　ミルドラースが……。\n\tいよいよ　この時が　来ましたのね。\n\tさあ　行きましょう。\n@c0@"
2:
  de: "@a%0%a001240@bGroßmutter muss hier irgendwo sein, richtig? Ich weiß, dass sie da ist. Ich spüre es.\n@c0@"
  en: "@a%0%a001240@bGrandma must be in here somewhere, right?\nI know she is. I can sort of sense it.\n@c0@"
  es: "@a%0%a001240@bLa abuela debe estar ahí dentro en alguna parte, ¿no?\nSé que está. Puedo sentirlo.\n@c0@"
  fr: "@a%0%a001240@bGrand-mère doit être quelque part par ici, nonⓡ\nJ'en suis sûr. Je le sens.\n@c0@"
  it: "@a%0%a001240@bNonna Mada è qui da qualche parte, ne sono sicuro.\nPercepisco la sua presenza...\n@c0@"
  ja: "@a@b%a001240「おばあちゃん\n\tきっと　この先にいるね……。\n\tわかるんだ。　なんとなくだけど。\n@c0@"
3:
  de: "@a%0%a001250@bIch werde das Gefühl nicht los, dass hier überall böse Monster lauern und nur darauf warten, uns anzugreifen...\n@c0@"
  en: "@a%0%a001250@bI'm getting the feeling that there are scary\nmonsters all around us, just waiting for their\nchance to pounce.\n@c0@"
  es: "@a%0%a001250@bMe da la sensación de que estamos rodeados de monstruos terroríficos que saltarán sobre nosotros a la primera oportunidad.\n@c0@"
  fr: "@a%0%a001250@bJ'ai comme l'impression qu'il y a des monstres horribles tout autour de nous et qu'ils s'apprêtent\nà nous sauter dessus à la moindre occasion.\n@c0@"
  it: "@a%0%a001250@bHo la bruttissima sensazione che siamo circondati da mostri ferocissimi, che non attendono altro che l'occasione giusta per saltarci addosso...\n@c0@"
  ja: "@a@b%a001250「こわい魔物さんたちが\n\tあちこちから　わたしたちを\n\tねらってる…　気がするの。\n@c0@"
4:
  de: "@aSancho@bDu muss diss gut konzentrieren, Chico. Iss sage dir, diese Berg steckt voller Gefahren.\n@c0@"
  en: "@aSancho@bYou must estand on your toes.\r\nThees mountain, ees full of dangers.\n@c0@"
  es: "@aSancho@bAcá hay que andar con los ojos bien abiertos.\nEsta montaña está llenita de peligros.\n@c0@"
  fr: "@aSancho@bT-Tu dois faire bien attention. Cette montagne, elle est p-pleine de dangers.\n@c0@"
  it: "@aSancho@bChico, no abbassare la guardia.\nEsta montagna es piena de pericolos.\n@c0@"
  ja: "@a@bサンチョ「気を　ひきしめてください。\n\tこの山は　危険に満ちていますよ。\n@c0@"
5:
  de: "@aOtto@bDa wären wir endlich. Wer hätte je gedacht, dass ich, Otto, Teil eines solch bedeutsamen Ereignisses sein würde?\n@c0@"
  en: "@aTuppence@bSo here we are at last. Who would've thought\r\nthat I, Tuppence, would be part of such a\r\nmomentous event?\n@c0@"
  es: "@aAlazar@bPues ya estamos aquí. ¿Quién iba a pensar que yo, Alazar, formaría parte de tan trascendental momento?\n@c0@"
  fr: "@aInnocent@bNous y voici enfin. Qui aurait pu penser que moi, Innocent, je participerais à un événement d'une importance aussi capitaleⓡ\n@c0@"
  it: "@aSimon@bOrmai manca poco, Maestà. Re %a000090, volevo ringraziarla per avermi dato la possibilità di partecipare a questa fantastica avventura.\n㈡\nLa ringrazio adesso, perché non so se dopo sarò ancora vivo, e i cadaveri non possono ringraziare nessuno.\n@c0@"
  ja: "@a@bピピン「とうとう　ここまで\n\t来てしまいましたね。\n\tこのボクが……。\n@c0@"
6:
  de: "@aBianca@bIch frage mich, wie oft wir diesen Pfad noch betreten müssen, bis Nimzo besiegt ist...\n@c0@"
  en: "@aBianca@bI wonder how many more times we'll have to tread this path before Nimzo's defeated, eh?\n@c0@"
  es: "@aBianca@bNo sé cuántas veces más tendremos que recorrer este camino para derrotar a Nimzo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande combien de fois nous devrons encore emprunter ce chemin avant de vaincre Nimzo, heinⓡ\n@c0@"
  it: "@aBianca@bQuante altre volte dovremo percorrere questo sentiero, prima di riuscire a sconfiggere Nimzo...?\n@c0@"
  ja: "@a@bビアンカ「ミルドラースを　たおすまでに\n\tあと何回　この道を通るのかしらね？\n@c0@"
7:
  de: "@aBianca@bHoffen wir, dass es das letzte Mal ist.\n@c0@"
  en: "@aBianca@bHere's hopin' this is the last.\n@c0@"
  es: "@aBianca@bEspero que sea la última.\n@c0@"
  fr: "@aBianca@bEspérons que ce soit la dernière.\n@c0@"
  it: "@aBianca@bSperiamo di farcela...\n@c0@"
  ja: "@a@bビアンカ「できれば　これを\n\t最後に　したいけど……。\n@c0@"
8:
  de: "@aNera@bAuf, auf! Dieses Mal müssen wir gewinnen und der Welt Frieden bringen!\n@c0@"
  en: "@aNera@bOn we go! We must succeed this time, and bring peace to the world!\n@c0@"
  es: "@aNera@b¡Andiamo! ¡Questa vez debemos lograrlo y llevar la paz al mondo!\n@c0@"
  fr: "@aNera@bC'est partiⓠ Il faut y arriver, cette foisⓠ\nNous devons ramener la paixⓠ\n@c0@"
  it: "@aNera@bAdesso o mai più! Questa volta dovremo battere quella creatura malefica! Solo così riusciremo a riportare la pace nel mondo!\n@c0@"
  ja: "@a@bフローラ「さあ　行きましょう。\n\t今度こそ　世界に\n\t平和を　とりもどすために！\n@c0@"
9:
  de: "@a%0%a001240@bDie Monster hier sind sehr stark, wir müssen also doppelt so gut aufpassen.\n@c0@"
  en: "@a%0%a001240@bThe monsters here are really strong, so we'd better be extra careful this time.\n@c0@"
  es: "@a%0%a001240@bAquí los monstruos son muy fuertes, será mejor que vayamos con muchísimo cuidado.\n@c0@"
  fr: "@a%0%a001240@bLes monstres sont très forts, ici. Il faut faire très attention, cette fois.\n@c0@"
  it: "@a%0%a001240@bI mostri che ci stanno attaccando sono i più pericolosi che abbiamo incontrato finora...\nStiamo in guardia, papà.\n@c0@"
  ja: "@a@b%a001240「ここの魔物は\n\t強いからね。\n\t今度は　気をつけながら行こうね。\n@c0@"
