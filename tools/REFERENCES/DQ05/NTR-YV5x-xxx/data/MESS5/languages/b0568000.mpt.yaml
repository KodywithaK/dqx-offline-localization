  ja: "@a@bピピン「また　ここに\n\t来てしまいましたね。\n\tこのボクが……。\n@c0@"
13:
  de: "@aBianca@bMir macht es ja nichts aus, schnell zu gehen, %a000090, aber es könnte gefährlich sein, wenn wir uns zu sehr beeilen.\n@c0@"
  en: "@aBianca@bI dun't mind goin' fast, %a000090, but it could be dangerous to hurry too much.\n@c0@"
  es: "@aBianca@bNo me importa ir deprisa, %a000090, pero puede ser peligroso correr demasiado, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa ne me dérange pas qu'on aille vite, %a000090, mais ça pourrait être dangereux de se précipiter.\n@c0@"
  it: "@aBianca@b%0%a000090, per me non è un problema tenere il tuo passo, ma forse sarebbe prudente avanzare con maggior cautela...\n@c0@"
  ja: "@a@bビアンカ「%a000090。\n\t急ぐのはいいけど\n\tあせるのは　禁物よ。\n@c0@"
14:
  de: "@aNera@bDieser Ort ist so kalt. Es liegt eine unheilvolle Aura in der Luft.\n@c0@"
  en: "@aNera@bThis place is so cold. The air here has a very sinister feel to it.\n@c0@"
  es: "@aNera@bEste sitio es molto frío. Aquí el aire tiene algo siniestro.\n@c0@"
  fr: "@aNera@bIl fait si froid, ici. Cet endroit est sinistre.\n@c0@"
  it: "@aNera@bC'è un'atmosfera gelida...\nHo i brividi, ma non per il freddo: questo luogo è davvero sinistro!\n@c0@"
  ja: "@a@bフローラ「この場所…　寒気がしますわ。\n\tまがまがしい空気で\n\tあふれているんですもの……。\n@c0@"
15:
  de: "@a%0%a001240@bMir geht's gut. Ich habe keine Angst. Immerhin bin ich dein Sohn, wovor sollte ich also Angst haben?\n@c0@"
  en: "@a%0%a001240@bI'm alright. I'm not scared of anything. \nI'm your son, so I have no fear!\n@c0@"
  es: "@a%0%a001240@bEstoy perfectamente. No tengo miedo de nada. \n¡Soy tu hijo, por eso no tengo miedo!\n@c0@"
  fr: "@a%0%a001240@bTout va bien. Je n'ai peur de rien.\nJe suis ton fils, alors je n'ai pas peurⓠ\n@c0@"
  it: "@a%0%a001240@bSto bene, papà.\nNon ho paura.\nSono tuo figlio e non temo niente e nessuno!\n@c0@"
  ja: "@a@b%a001240「ボクは　大丈夫。\n\tなんにも　こわくないよ。\n\tだって　お父さんの子供だもん。\n@c0@"
16:
  de: "@a%0%a001250@bDiese große Statue da... Sie starrt uns an!\n@c0@"
  en: "@a%0%a001250@bThat big statue looks like it's staring at us.\n@c0@"
  es: "@a%0%a001250@bEsa gran estatua parece mirarnos.\n@c0@"
  fr: "@a%0%a001250@bOn dirait que cette grande statue nous regarde fixement.\n@c0@"
  it: "@a%0%a001250@bSembra che quella statua ci stia fissando...\n@c0@"
  ja: "@a@b%a001250「あの　おおきな像が\n\tわたしたちのこと\n\tじっと　見てるみたい……。\n@c0@"
17:
  de: "@aSancho@bDu musst dir gut merken, woher wir gekommen sind, Chico.\n@c0@"
  en: "@aSancho@bYou must remember the way as we go.\n@c0@"
  es: "@aSancho@bTienes que aprenderte el camino, mientras avanzamos.\n@c0@"
  fr: "@aSancho@bT-Tu dois te rappeler du chemin.\n@c0@"
  it: "@aSancho@bChico, recordiamoce que estrada estiamo facendo.\n@c0@"
  ja: "@a@bサンチョ「なるべく　道順を\n\t覚えながら　進んでいきましょう。\n@c0@"
18:
  de: "@aSancho@bEs wird nisst das einzige Mal sein, dass wir diesen Weg gehen...\n@c0@"
  en: "@aSancho@bEes no gonna be just one time we travel along these paths.\n@c0@"
  es: "@aSancho@bEsta no va a ser la única vez que pasemos por acá.\n@c0@"
  fr: "@aSancho@bCe n'est s-sûrement pas la dernière f-fois qu'on l'emprunte.\n@c0@"
  it: "@aSancho@bCe sarà utile tenere a mente los sentieros que percorriamo...\n@c0@"
  ja: "@a@bサンチョ「この道を通るのが\n\t一度ですむとは　かぎりませんからね。\n@c0@"
19:
  de: "@aOtto@bEs gab einmal einen Punkt in meinem Leben, an dem ich ein wenig enttäuscht über mein ereignisloses Dasein war...\n@c0@"
  en: "@aTuppence@bI reached a point once where I felt rather disappointed at the uneventful sort of life I saw stretching out before me.\n@c0@"
  es: "@aAlazar@bUna vez llegué a un punto en el que me sentí disgustado por el tipo de vida rutinaria que se extendía ante mí.\n@c0@"
  fr: "@aInnocent@bJ'en étais arrivé à me résigner bon gré mal gré à la vie calme et monotone qui m'attendait.\n@c0@"
  it: "@aSimon@bQuando ero una semplice guardia di palazzo, pensavo che la mia vita scorresse noiosa e monotona...\n@c0@"
  ja: "@a@bピピン「思えば　ただ平凡な道を\n\t歩むばかりが　自分の人生だと\n\tあきらめていた時期も　ありました。\n@c0@"
20:
  de: "@aOtto@bUnd jetzt seht, wo ich heute bin! Ich hätte mir nie träumen lassen, einmal Teil eines derart wichtigen Unternehmens zu sein!\n@c0@"
  en: "@aTuppence@bAnd yet look at me here today! I never imagined I'd be involved in something so momentous.\n@c0@"
  es: "@aAlazar@b¡Pero mirad, aquí estoy hoy! Nunca imaginé que me vería implicado en algo tan trascendental.\n@c0@"
  fr: "@aInnocent@bEt regardez-moi maintenantⓠ Je n'aurais jamais pensé que je participerais à quelque chose d'aussi important.\n@c0@"
  it: "@aSimon@bAh, bei tempi quelli!\nMaestà, da quando la seguo nei suoi viaggi, non ho più avuto un solo istante di tranquillità!\n@c0@"
  ja: "@a@bピピン「それが　こんな場面に\n\t立ち会えるとは……。\n@c0@"
21:
  de: "@aBianca@bBald, %a000090. Bald werden wir bei deiner Mutter sein.\n@c0@"
  en: "@aBianca@bNot long now, %a000090. It won't be long before we find your mum at last.\n@c0@"
  es: "@aBianca@bNo queda mucho, %a000090. Pronto encontraremos por fin a tu madre, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bIl n'y en a plus pour longtemps, %a000090.\nNous allons enfin trouver ta mère.\n@c0@"
  it: "@aBianca@bManca poco, %a000090.\nTra non molto potrai finalmente rivedere tua madre...\n@c0@"
  ja: "@a@bビアンカ「もうすぐね　%a000090。\n\tきっと　もうすぐ　お母さまの\n\tいる場所に　たどり着けるはずよ。\n@c0@"
22:
  de: "@aNera@bEs kann nicht mehr lange dauern. Ich spüre, dass deine Mutter nicht mehr fern ist.\n@c0@"
  en: "@aNera@bIt can't be much longer now. I'm sensing that your mother isn't far away.\n@c0@"
  es: "@aNera@bYa no puede faltar molto. Tengo la sensación de que la tua mamma no está lejos.\n@c0@"
  fr: "@aNera@bÇa ne devrait plus être très long, maintenant.\r\nJe sens que ta mère n'est pas loin.\n@c0@"
  it: "@aNera@bCi siamo quasi, tesoro...\nCredo di percepire la presenza di Mada...\n@c0@"
  ja: "@a@bフローラ「きっと　もうすぐですわ。\n\tもうすぐ　お母さまのところに\n\tたどり着けるような　気がします……。\n@c0@"
23:
  de: "@a%0%a001240@bMoment mal... Auf welcher Etage sind wir eigentlich?\n@c0@"
  en: "@a%0%a001240@bHang on a minute... What floor are we on now?\n@c0@"
  es: "@a%0%a001240@bUn momento... ¿En qué planta estamos ahora?\n@c0@"
  fr: "@a%0%a001240@bAttends un peu... On est à quel niveau, làⓡ\n@c0@"
  it: "@a%0%a001240@bAspetta un attimo...\nSu quale piano ci troviamo adesso...?\nHo perso il conto!\n@c0@"
  ja: "@a@b%a001240「あれ？\n\t今　何階だっけ？\n@c0@"
24:
  de: "@a%0%a001250@bIch spüre, dass etwas wahrhaft Unheilvolles uns auflauert, aber es liegt auch eine wohlwollende Kraft in der Luft.\n@c0@"
  en: "@a%0%a001250@bI'm sensing something really sinister lying in wait for us, but I can also feel a benevolent force in the air.\n@c0@"
  es: "@a%0%a001250@bPercibo algo siniestro que nos acecha, pero también siento una fuerza benéfica en el aire.\n@c0@"
  fr: "@a%0%a001250@bJ'ai l'impression que nous allons au-devant de quelque chose de vraiment sinistre, mais je sens aussi une force bienveillante.\n@c0@"
  it: "@a%0%a001250@bChe sensazione strana...! Percepisco delle presenze malvagie più avanti, ma avverto chiaramente anche una forza benigna che ci invita a continuare...\n@c0@"
  ja: "@a@b%a001250「この先に　なんだか\n\tすごく　いやな気配を　感じるの……。\n\tでも　やさしい感じも　まじってる。\n@c0@"
25:
  de: "@aSancho@bBist du müde, Chico?\n@c0@"
  en: "@aSancho@bAre you tired, My Majesty?\n@c0@"
  es: "@aSancho@b¿Está cansado, Majestad?\n@c0@"
  fr: "@aSancho@bT-Tu es fatigué, Ma Majestéⓡ\n@c0@"
  it: "@aSancho@b¿Chico, estai estanco?\n@c0@"
  ja: "@a@bサンチョ「%a000090王\n\tつかれましたか？\n@c0@"
26:
  de: "@aSancho@bDann musst du diss ausruhen. Schließliss liegt unser aller Leben in deine Hände...\n@c0@"
  en: "@aSancho@bThen you turn back esometimes, okay?\r\nThe lives of all of us, they are een your hands.\n@c0@"
  es: "@aSancho@bPues nomás vuelva pⓘatrás cada tantito, ¿ok?\nLas vidas de todos nosotros están en sus manos.\n@c0@"
  fr: "@aSancho@bAlors n'hésite p-pas à faire demi-tour, parfois, heinⓡ N-Notre vida à tous est entre tes m-mains.\n@c0@"
  it: "@aSancho@bAllora fermate y torniamo indietros, si es necessario.\nLas vidas de todos està nellas tuas manos, y no possiamo correre rischios inutiles.\n㈡\nProseguiremo solo cuando sarai al maximo della forma...\n@c0@"
  ja: "@a@bサンチョ「ならば　時にはもどることも\n\t大切です。　%a000090王の判断に\n\t全員の命が　かかってますからな。\n@c0@"
27:
  de: "@aSancho@bDu bist wirkliss erstaunliss, Chico! Iss wünschte, deine Padre könnte diss jetzt sehen!\n@c0@"
  en: "@aSancho@bYou, you are amazing, friend!\nI weesh your papá, he could esee you now.\n@c0@"
  es: "@aSancho@b¡Eres sorprendente, chamaco!\nOjalá estuviera acá tu apá para verte.\n@c0@"
  fr: "@aSancho@bTu es incroyable, chicoⓠ J'aimerais que ton papá,\nil puisse t-te voir en ce moment même.\n@c0@"
  it: "@aSancho@bMuy bien.\n¡Allora vamonos!\n@c0@"
  ja: "@a@bサンチョ「ふむ。　ごりっぱです。\n\t今の%a000090王の姿　パパスさまにも\n\tお見せしたかったです……。\n@c0@"
28:
