  es: "@aStefania@bEso es tutto lo que quería decir. ¡Andiamo, venga!\nPronto estaremos de regreso en Pankraz sanos y salvos.\n@c0@"
  fr: "@aPandora@bC'est tout ce que j'avais à dire. Viens, allons-yⓠ Bientôt, nous serons de retour à Gotha, sains et saufs.\n@c0@"
