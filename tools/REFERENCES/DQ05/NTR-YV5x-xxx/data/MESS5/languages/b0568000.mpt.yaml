  ja: "@a@b%a001250「えぐえぐ……\n\tひっく……　ひっく……。\n@c0@"
58:
  de: "@aSancho@bD-Du musst stolz sein, Chico. Stolz darauf, dass du die Sohn von Señor Ludwig und Señora Magda bist. Das darfst du nie vergessen, hörst du?\n@c0@"
  en: "@aSancho@bYou, you must feel proud, friend. Proud that you are the eson of señor Pankraz and señora Mada. You never forget thees, okay?\n@c0@"
  es: "@aSancho@bDebes estar orgulloso, chamaco. Orgulloso de ser hijo del señor Teudis y la señora Perséfone. Nunca los olvides, ¿ok?\n@c0@"
  fr: "@aSancho@bT-tu dois être fier, chico. Fier d'être le fils du señor P-P-Petros et de la señora Magdalena. N'oublie jamais ça, de acuerdoⓡ\n@c0@"
  it: "@aSancho@bChico, devi sentirte fiero de essere el figlio del señor Russel y della señora Mada.\n¡Devi sentirte orgoglioso!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん。　パパスさまと\n\tマーサさまのお子として生を受けたこと\n\t生涯　誇りと思って　生きてください。\n@c0@"
59:
  de: "@aSancho@bDas ist alles, was dir deine Onkel Sancho jetzt sagen kann. Das ist alles, was... iss... (Schluchz)\n@c0@"
  en: "@aSancho@bEes all your Uncle Sancho can esay to you now. Ees all I can... I can... (sob)\n@c0@"
  es: "@aSancho@bEso es todo lo que tu tito Sancho puede decirte ahorita. Es todo lo que puedo... puedo... (snif)\n@c0@"
  fr: "@aSancho@bC'est tout ce que ton tonton S-S-Sancho peut te dire maintenant. C'est t-t-tout... ce que j-je... (sanglot)\n@c0@"
  it: "@aSancho@bLo zio Sancho vuole que tu...\nYo... Yo me commuovos...\n¡Sob! ¡Sob! ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「それだけです。\n\t私に言えるのは　今はただ\n\tそれだけ……ううっ。\n@c0@"
60:
  de: "@aOtto@bIch werde nie vergessen, was ich am heutigen Tag erlebt habe.\n@c0@"
  en: "@aTuppence@bI'll never forget the events that have unfolded before me today.\n@c0@"
  es: "@aAlazar@bNunca olvidaré los sucesos que he presenciado hoy.\n@c0@"
  fr: "@aInnocent@bJe n'oublierai jamais ce qui s'est passé aujourd'hui.\n@c0@"
  it: "@aSimon@bNon dimenticherò mai lo spettacolo incredibile a cui ho assistito oggi...\n@c0@"
  ja: "@a@bピピン「ボク　今日　見たことは\n\t一生　忘れません……。\n@c0@"
61:
  de: "@aOtto@bDie Liebe zwischen König Ludwig und Königin Magda ist wirklich einzigartig...\n@c0@"
  en: "@aTuppence@bThe love that King Pankraz and Queen Mada have for each other is truly breathtaking to behold.\n@c0@"
  es: "@aAlazar@bHa sido realmente emocionante contemplar el amor que se profesaban el rey Teudis y la reina Perséfone.\n@c0@"
  fr: "@aInnocent@bL'amour que le roi Petros et la reine Magdalena ont l'un pour l'autre est vraiment à couper le souffle.\n@c0@"
  it: "@aSimon@bRe Russel e la regina Mada erano due persone davvero uniche. Il loro amore è stato talmente forte da andare persino oltre la vita...\n㈡\nSono certo che nemmeno la dea oserà dividerli! Li terrà al suo fianco, l'uno accanto all'altra...\n@c0@"
  ja: "@a@bピピン「先代の王と王妃が　どれほど\n\t深い愛情で　結ばれていたか……。\n@c0@"
62:
  de: "@aBianca@bHier herrscht wieder eine ganz andere Atmosphäre. Und keine gute...\n@c0@"
  en: "@aBianca@bThis place has a different sort of air to it.\r\nAnd it's not a nice one.\n@c0@"
  es: "@aBianca@bEste lugar tiene un aire como diferente.\nY no precisamente agradable, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl règne une autre atmosphère ici. Et ce n'est pas une atmosphère agréable.\n@c0@"
  it: "@aBianca@bNon mi piace. Non mi piace affatto...\nHo una brutta sensazione, %a000090...\n@c0@"
  ja: "@a@bビアンカ「なんだか　ここだけ\n\tふんい気が　ちがうわね。\n\t気持ち悪いわ……。\n@c0@"
63:
  de: "@aNera@bHier gefällt es mir ganz und gar nicht. Wahrscheinlich zeigt der Berg jetzt sein wahres Gesicht.\n@c0@"
  en: "@aNera@bThere's a nasty feel to this place. This is probably the true face of the mountain.\n@c0@"
  es: "@aNera@bEste lugar me produce una sensazione desagradable. Sicuramente es la verdadera faz de la montaña.\n@c0@"
  fr: "@aNera@bIl y a quelque chose que je n'aime pas par ici.\r\nLa montagne nous montre probablement son\r\nvrai visage.\n@c0@"
  it: "@aNera@bLa montagna emana un'aura di malvagità, di cattiveria... Temo che adesso ci stia mostrando il suo vero volto...\n@c0@"
  ja: "@a@bフローラ「この場所　気味が悪いわ。\n\tもしかしたら　これが　この山の\n\t本当の姿なのかも　知れませんわね。\n@c0@"
64:
  de: "@a%0%a001250@bAaah! Papa! Die Wand... Sie sieht wie ein Gesicht aus!\n@c0@"
  en: "@a%0%a001250@bYikes! Dad! The wall... It looks like someone's face!\n@c0@"
  es: "@a%0%a001250@b¡Ay! ¡Papi! La pared... ¡Parece la cara de alguien!\n@c0@"
  fr: "@a%0%a001250@bHiiiⓠ Papaⓠ Le mur... On dirait un visageⓠ\n@c0@"
  it: "@a%0%a001250@bGulp!\nPapà, guarda quella roccia!\nSembra un volto!\n@c0@"
  ja: "@a@b%a001250「きゃっ！　お父さん…\n\tカベが…　人の顔に見えるの……。\n@c0@"
65:
  de: "@aBianca@bDieser Ort treibt mich noch in den Wahnsinn. Ich hasse es, wenn ich nicht dahin gehen kann, wo ich will.\n@c0@"
  en: "@aBianca@bThis kind of place really irritates me. I hate not bein' able to walk where I want.\n@c0@"
  es: "@aBianca@bEsta es la clase de sitio que me pone de los nervios. Me agobia no poder ir donde quiero.\n@c0@"
  fr: "@aBianca@bCe genre d'endroit m'énerve vraiment. Je déteste ne pas pouvoir aller où je veux.\n@c0@"
  it: "@aBianca@bI posti come questo mi mandano in bestia!\nOdio non poter camminare dove voglio!\n@c0@"
  ja: "@a@bビアンカ「私　こういうの苦手…\n\t好きなところへ　歩けなくて\n\tイライラしちゃう……。\n@c0@"
66:
  de: "@aNera@bWir müssen unsere Route sorgfältig planen und dürfen nicht zu hektisch werden. Nur so kommen wir hier weiter.\n@c0@"
  en: "@aNera@bWe have to plan out our route carefully and try not to hurry too much. It's the only way to get through a place like this.\n@c0@"
  es: "@aNera@bTenemos que planificar la ruta con cuidado e intentar no avanzar troppo aprisa. Es la única forma atravesar un sitio così.\n@c0@"
  fr: "@aNera@bNous devons anticiper notre trajet et ne pas aller trop vite. Il n'y a que comme ça que nous pourrons traverser ce genre d'endroit.\n@c0@"
  it: "@aNera@bPensiamo bene a come procedere, e muoviamoci con cautela.\nÈ l'unico modo per avanzare qui dentro...\n@c0@"
  ja: "@a@bフローラ「こういう場所では\n\tしかたありませんわ。　あせらず\n\tじっくり考えて　進みましょう。\n@c0@"
67:
  de: "@a%0%a001240@bNormalerweise würde es mir ja Spaß machen, auf dem Boden herumzurutschen.\n@c0@"
  en: "@a%0%a001240@bI'd usually be having a right laugh in a place like this, sliding about on the floor.\n@c0@"
  es: "@a%0%a001240@bNormalmente me partiría de risa en un sitio así, resbalando por el suelo.\n@c0@"
  fr: "@a%0%a001240@bEn temps normal, je me serais bien amusé dans un endroit comme ça. J'aurais fait de grandes glissades.\n@c0@"
  it: "@a%0%a001240@bDi solito mi divertirei un mucchio in un posto del genere, scivolando a destra e a sinistra...\n@c0@"
  ja: "@a@b%a001240「ボク　いつもなら\n\tわ～い！　すべる床って　楽しいな～！\n\tって　さわぐところだけど……\n@c0@"
68:
  de: "@a%0%a001240@bAber heute bin ich einfach nicht in der Stimmung dafür...\n@c0@"
  en: "@a%0%a001240@bI just can't seem to get in the mood today, though.\n@c0@"
  es: "@a%0%a001240@bPero parece que hoy no estoy de humor.\n@c0@"
  fr: "@a%0%a001240@bMais je crois qu'aujourd'hui, j'ai pas trop envie.\n@c0@"
  it: "@a%0%a001240@bOggi, però, non mi va proprio.\nMi sento un po' giù di morale...\n@c0@"
  ja: "@a@b%a001240「今日は　とても\n\tそんな気分になれないよ……。\n@c0@"
69:
  de: "@a%0%a001250@bIch wollte Großmutter noch so viel erzählen. Und spielen wollte ich auch mit ihr.\n@c0@"
  en: "@a%0%a001250@bThere's so much I wanted to say to Grandma.\nAnd I wanted to play lots of games together too.\n@c0@"
  es: "@a%0%a001250@bQuería decirle tantas cosas a la abuela...\nY también quería jugar con ella a muchas cosas.\n@c0@"
  fr: "@a%0%a001250@bJ'avais tellement de choses à dire à grand-mère et j'aurais voulu jouer avec elle, aussi.\n@c0@"
  it: "@a%0%a001250@bAvrei voluto dire tante cose a nonna... Mi sarebbe piaciuto tantissimo giocare con lei...\n@c0@"
  ja: "@a@b%a001250「わたし　おばあちゃんと\n\tいっぱい　お話ししたかった。\n\t遊びたかったし……。\n@c0@"
70:
  de: "@a%0%a001250@bIch hab mir immer vorgestellt, wie wir zusammen nach Humburg zurückkehren. Ach...\n@c0@"
  en: "@a%0%a001250@bI kept imagining us going home to Gotha together. Haa...\n@c0@"
  es: "@a%0%a001250@bNo dejo de imaginarnos volviendo a Pankraz juntas. Aaah...\n@c0@"
  fr: "@a%0%a001250@bJe pensais qu'on rentrerait tous ensemble à Gotha. Aaah...\n@c0@"
  it: "@a%0%a001250@bSognavo di tornare a Denim con nonna Mada, e invece...\nSob!\n@c0@"
  ja: "@a@b%a001250「わたし　おばあちゃんと\n\tお城へ帰ることばかり\n\t考えてたのに……。　ぐすっ……。\n@c0@"
71:
  de: "@aSancho@bDu brauchst dir um Señora Magda keine Sorgen zu machen, Chico. Sie ist jetzt mit Señor Ludwig zusammen, ihr kann nissts mehr geschehen.\n@c0@"
  en: "@aSancho@bEes no need to worry about señora Mada. Eshe ees weeth señor Pankraz. Notheeng can hurt her.\n@c0@"
  es: "@aSancho@bNo hay que apenarse por la señora Perséfone. Está con el señor Teudis. Ni modo podrá hacerle algo daño.\n@c0@"
  fr: "@aSancho@bÇa ne sert à r-rien de s'inquiéter pour la señora Magdalena. Elle est avec le señor P-Petros.\r\nR-Rien ne peut lui arriver.\n@c0@"
  it: "@aSancho@bChico, no estare en pena por la señora Mada.\nTua madre se es finalmente ricongiunta con el suo amato marido...\n@c0@"
  ja: "@a@bサンチョ「マーサさまも　パパスさまと\n\tいっしょに　行かれたのなら\n\tもう　心配は　ないでしょう。\n@c0@"
72:
  de: "@aSancho@bWir sollten glückliss sein, si? Wir haben es diese Desperado, Slon, gezeigt. Und jetzt, wir werden es auch die Großmeister der Unterwelt zeigen!\n@c0@"
  en: "@aSancho@bEes time to feel happy, sí? We pummel thees desperado, Ladja. And now, we gonna pummel the Grandmaster of the Underworld!\n@c0@"
  es: "@aSancho@bEs hora de festejar, nomás. Le dimos tremenda golpiza a ese bandido de Ladja. ¡Y ahora vamos a golpear al Gran Maestro del Inframundo!\n@c0@"
  fr: "@aSancho@bIl f-faut plutôt être c-content, noⓡ On a écrasé le desperado Erebos. Et maintenant, on v-va écraser le Grand Maître des Enfersⓠ\n@c0@"
  it: "@aSancho@b¡Y no temere!\n¡Vendicheremo la sua muerte!\n㈡\n¡Abbiamo già esconfitto el maledettos Skriterioska, y tra poco daremo quel que se merita anche al Gran Maestro de lo Inferos!\n@c0@"
  ja: "@a@bサンチョ「さあ　気持ちを　切りかえて！\n\tとにかく　あの　にっくきゲマは\n\tたおしたのです。　あとは大魔王です！\n@c0@"
73:
  de: "@aOtto@bIch kann mir wirklich nicht vorstellen, dass wir unser Ziel erreichen, wenn wir einfach planlos auf dem Boden herumrutschen...\n@c0@"
  en: "@aTuppence@bI don't suppose we'll be lucky enough to reach\r\nour destination if we just slide about the place willy-nilly, will we?\n@c0@"
  es: "@aAlazar@bNo creo que vayamos a tener tanta suerte de llegar a nuestro destino resbalando por el sitio al azar, ¿no?\n@c0@"
  fr: "@aInnocent@bJe serais surpris qu'on arrive à destination si on continue à avancer au petit bonheur la chance.\n@c0@"
  it: "@aSimon@bE se provassimo ad avanzare a casaccio?!\nSecondo me, prima o poi, raggiungeremmo la nostra destinazione!\n@c0@"
  ja: "@a@bピピン「こういうのって　てきとうに\n\tすべってるうちに　目的の場所へ\n\tついたりしてくれないんでしょうか？\n@c0@"
74:
  de: "@aBianca@bMagda?! Scheint ganz so, als würde deine Mutter über uns wachen, %a000090! Das ist die beste Unterstützung, die wir haben können!\n@c0@"
  en: "@aBianca@bMada!? It sounds like your mum is watchin' over us, %a000090! That's the best encouragement we could hope for.\n@c0@"
  es: "@aBianca@b¡¿Perséfone?! Parece que tu madre nos está protegiendo, %a000090. Es el mejor apoyo que podíamos tener.\n@c0@"
  fr: "@aBianca@bMagdalenaⓠⓑ On dirait que ta maman veille sur nous, %a000090ⓠ On n'aurait pas pu imaginer meilleur encouragement.\n@c0@"
  it: "@aBianca@bMada?!\nTua madre non ci ha abbandonati, %a000090! Questo è il miglior incoraggiamento che potesse darci!\n@c0@"
  ja: "@a@bビアンカ「お母さま…！？\n\t%a000090　お母さまが　見守って\n\tくださっているのね。　心強いわ。\n@c0@"
75:
  de: "@aNera@bWar das... War das die Stimme deiner Mutter? Oh, Liebling! Also ist sie immer noch in der Nähe und passt auf uns auf!\n@c0@"
  en: "@aNera@bWas that... Was that your mother's voice?\r\nOh, darling! So she's still nearby, looking out for us!\n@c0@"
  es: "@aNera@b¿Era eso... era eso la voce de la tua mamma?\n¡Oh, caro...! ¡Entonces sigue cerca, cuidando de nosotros!\n@c0@"
  fr: "@aNera@bC'était... C'était la voix de ta mèreⓡ\nMon chériⓠ Elle est toujours là et elle veille sur nousⓠ\n@c0@"
  it: "@aNera@bMa quella era la voce di tua madre...!\nOh, caro! Lo vedi? Non se n'è andata per sempre!\nLei veglia su di noi!\n@c0@"
  ja: "@a@bフローラ「今のは…　お母さまの声！？\n\tあなた…　お母さまは　まだ近くにいて\n\t私たちを見守ってくださっているのね。\n@c0@"
76:
  de: "@a%0%a001240@bWas ist Aspi... Aspa... Aspersorium? Und wo kriegt man so was?\n@c0@"
  en: "@a%0%a001240@bWhat's aspi...aspa...aspersorium?\nAnd where do you get it?\n@c0@"
  es: "@a%0%a001240@b¿Qué es un aspa... aspi... aspersorio?\n¿Y de dónde lo sacamos?\n@c0@"
  fr: "@a%0%a001240@bC'est quoi un aspi... aspa... aspersoriumⓡ\nEt où est-ce qu'on peut le trouverⓡ\n@c0@"
  it: "@a%0%a001240@bUn'acquasantiera?!\nE dove la troviamo un'acquasantiera, eh?!\nUhm, io non so nemmeno cosa sia un'acquasantiera!\n@c0@"
  ja: "@a@b%a001240「えっ！？\n\t聖なるみずさし　って　なに？\n\tどこにあるのかな？？\n@c0@"
77:
  de: "@a%0%a001250@bWir haben gar kein Aspersorium, oder, Papa? Aber es wäre gut, wenn wir bald eins fänden, am besten hier in der Nähe.\n@c0@"
  en: "@a%0%a001250@bWe don't have an aspersorium, do we, Dad?\nIt would be good if we could find one nearby.\n@c0@"
  es: "@a%0%a001250@bNo tenemos ningún aspersorio, ¿verdad, papi?\nEstaría bien encontrar uno por aquí.\n@c0@"
  fr: "@a%0%a001250@bOn n'a pas d'aspersorium, hein, papaⓡ\nCe serait bien si on pouvait en trouver\nun dans le coin.\n@c0@"
  it: "@a%0%a001250@bNon abbiamo un'acquasantiera, dico bene?\nDovremmo controllare se ce n'è una nei paraggi...\n@c0@"
  ja: "@a@b%a001250「お父さん　わたしたち\n\t聖なるみずさし　持ってないね。\n\tこの近くに　あるといいんだけど……。\n@c0@"
78:
  de: "@a%0%a001250@bDas Aspersorium ist mit kristallklarem Wasser gefüllt.\n@c0@"
  en: "@a%0%a001250@bThe aspersorium is full of really clear and\npure water.\n@c0@"
  es: "@a%0%a001250@bEl aspersorio está lleno de agua cristalina y fresca.\n@c0@"
  fr: "@a%0%a001250@bCet aspersorium est rempli d'eau limpide et pure.\n@c0@"
  it: "@a%0%a001250@bL'acqua nell'acquasantiera è pura e cristallina...\n@c0@"
  ja: "@a@b%a001250「聖なるみずさしって\n\tきれいなお水が　いっぱい\n\tはいっているのね。\n@c0@"
79:
  de: "@a%0%a001250@bVielleicht sollte ich eines Tages meine Pflanzen damit gießen...\n@c0@"
  en: "@a%0%a001250@bMaybe I'll use it one day to water some of my favourite plants.\n@c0@"
  es: "@a%0%a001250@bPuede que un día lo use para regar mis plantas preferidas.\n@c0@"
  fr: "@a%0%a001250@bJe m'en servirai peut-être un jour pour arroser mes plantes préférées.\n@c0@"
  it: "@a%0%a001250@bÈ talmente limpida che potrei usarla per innaffiare le mie piantine preferite!\n@c0@"
  ja: "@a@b%a001250「わたし　今度\n\t大事な　お花さんに　このお水\n\tかけてあげたいな……。\n@c0@"
80:
  de: "@aSancho@bD-Das ist die Stimme von Señora Magda! Sie sprisst aus die Himmel zu uns!\n@c0@"
  en: "@aSancho@bEes, ees the voice of señora Mada!\r\nAll the way from the heavens!\n@c0@"
  es: "@aSancho@b¡Es la mera voz de la señora Perséfone!\n¡Directamente desde los cielos!\n@c0@"
  fr: "@aSancho@bC-C'est la voix de la señora M-Magdalenaⓠ\nElle vient d-du cielⓠ\n@c0@"
  it: "@aSancho@b¡Era la voce della señora Mada!\r\n¡Chico, tua madre ce guarda dall'altos del cielo donde está ahora!\n@c0@"
  ja: "@a@bサンチョ「おおっ　マーサさまが\n\t天国から　お声を……。\n\tうっうっ…　ありがたいことです。\n@c0@"
81:
  de: "@aBianca@bDieser Ort ist so unendlich groß. Ich frage mich, wo Nimzo sich versteckt hält.\n@c0@"
  en: "@aBianca@bThis place is absolutely enormous. I wonder where Nimzo could be lurkin'.\n@c0@"
  es: "@aBianca@bEste lugar es totalmente enorme. Me pregunto dónde se agazapará Nimzo, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit est vraiment énorme. Je me demande bien où se cache Nimzo.\n@c0@"
  it: "@aBianca@bQuesto posto è immenso!\nNimzo potrebbe essere nascosto ovunque...\n@c0@"
  ja: "@a@bビアンカ「まだ　こんな広い部屋が\n\t続いていたなんて……。\n\tミルドラースは　どこにいるの？\n@c0@"
82:
  de: "@aBianca@bStell dir doch nur mal vor, was passieren würde, wenn Nimzo seine teuflischen Kräfte in unserer Welt entfesselt...\n@c0@"
  en: "@aBianca@bImagine what would happen if Nimzo unleashed his evil powers on our world...\n@c0@"
  es: "@aBianca@bImagina lo que ocurriría si Nimzo desatara su malvado poder en nuestro mundo...\n@c0@"
  fr: "@aBianca@bImagine ce qui arriverait si Nimzo utilisait ses pouvoirs maléfiques contre notre monde...\n@c0@"
  it: "@aBianca@bProva a immaginare che catastrofe si verificherebbe se il Gran Maestro Nimzo scatenasse il suo potere contro il mondo degli uomini...\n@c0@"
  ja: "@a@bビアンカ「もし　ミルドラースが\n\tオモテの世界で　魔のチカラを\n\t発動させたりしたら……\n@c0@"
83:
  de: "@aBianca@bWir müssen uns beeilen, %a000090! Ich kann die Menschen nicht länger leiden sehen!\n@c0@"
  en: "@aBianca@bWe have to hurry, %a000090! I can't stand to see folk sufferin' even one minute longer.\n@c0@"
  es: "@aBianca@b¡Hay que darse prisa, %a000090! No aguanto ni un minuto más viendo sufrir a la gente, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl faut se dépêcher, %a000090ⓠ Je n'en peux plus de voir les gens souffrir comme ça.\n@c0@"
  it: "@aBianca@bNon c'è tempo da perdere, %a000090!\nNon possiamo permettere che l'umanità cada sotto il giogo di quell'essere crudele!\n@c0@"
  ja: "@a@bビアンカ「行きましょ　%a000090。\n\tこれ以上　人々が悲しむ姿を\n\t見たくないものね。\n@c0@"
84:
  de: "@aNera@bIst dieser Ort nicht riesig? Man würde nie vermuten, im Innern eines Berges zu sein.\n@c0@"
  en: "@aNera@bThis is a big place, isn't it? You'd never know you were inside a mountain.\n@c0@"
  es: "@aNera@bEste lugar es veramente grande. Nessuno diría que estamos dentro de una montaña.\n@c0@"
  fr: "@aNera@bC'est vraiment grand, ici, heinⓡ On n'a pas l'impression d'être à l'intérieur d'une montagne.\n@c0@"
  it: "@aNera@bQuesto luogo è gigantesco!\nSe non lo sapessi, non crederei mai che ci troviamo all'interno di una montagna...\n@c0@"
  ja: "@a@bフローラ「ずいぶん　広い場所ですわね。\n\t山の中とは　思えませんわ。\n@c0@"
85:
  de: "@aNera@bVielleicht sollten wir das als Hinweis darauf verstehen, wie mächtig Nimzo tatsächlich ist...\n@c0@"
  en: "@aNera@bMaybe it's an indication of just how powerful Nimzo really is.\n@c0@"
  es: "@aNera@bTal vez sea una señal de lo poderoso que es Nimzo veramente.\n@c0@"
  fr: "@aNera@bÇa nous montre aussi combien Nimzo est puissant.\n@c0@"
  it: "@aNera@bLa maestosità del posto è una chiara indicazione di quanto sia potente Nimzo. Tesoro, facciamo attenzione a non farci cogliere di sorpresa...\n@c0@"
  ja: "@a@bフローラ「……これも\n\tミルドラースの　チカラなのかしら。\n@c0@"
86:
  de: "@a%0%a001240@bIch werde da weitermachen, wo Großvater und Großmutter aufgehört haben... Und ich werde Erfolg haben!\n@c0@"
  en: "@a%0%a001240@bI'm going to take up the challenge where Grandpa and Grandma left off...and I'm going to succeed!\n@c0@"
  es: "@a%0%a001240@bVoy a retomar esta batalla donde la dejaron el abuelo y la abuela... ¡y voy a vencer!\n@c0@"
  fr: "@a%0%a001240@bJe vais reprendre là où grand-père et grand-mère se sont arrêtés... et j'y arriveraiⓠ\n@c0@"
  it: "@a%0%a001240@bProseguirò la sfida che nonno Russel e nonna Mada hanno lanciato a Nimzo...\nE la vincerò!\n@c0@"
  ja: "@a@b%a001240「おじいちゃんと　おばあちゃんが\n\tできなかったこと…　ボク　やるよ！\n@c0@"
87:
  de: "@a%0%a001240@bNimzo... Ich glaube, den Namen werde ich mein ganzes Leben lang nicht mehr vergessen.\n@c0@"
  en: "@a%0%a001240@bNimzo... I doubt I'll ever forget that name for the rest of my life.\n@c0@"
  es: "@a%0%a001240@bNimzo... No creo que olvide ese nombre en toda mi vida.\n@c0@"
  fr: "@a%0%a001240@bNimzo... Je me souviendrai de ce nom toute ma vie.\n@c0@"
  it: "@a%0%a001240@bNimzo, il Signore degli Inferi...\nChe essere spregevole!\n@c0@"
  ja: "@a@b%a001240「ミルドラース……。\n\tその名前　一生　忘れるもんか。\n@c0@"
88:
  de: "@a%0%a001250@bPapa... Ich werde mein Bestes geben, weißt du. Ich werde dafür sorgen, dass wir gewinnen.\n@c0@"
  en: "@a%0%a001250@bDad... I'm going to do my best, you know.\nI'm going to make sure we win.\n@c0@"
  es: "@a%0%a001250@bPapi... Que sepas que voy a emplearme a fondo.\nMe aseguraré de que ganemos.\n@c0@"
  fr: "@a%0%a001250@bPapa... Je vais faire de mon mieux, tu sais.\nJe vais faire le maximum pour qu'on gagne.\n@c0@"
  it: "@a%0%a001250@bAbbiamo già battuto Skriterioska, e ora dovremo affrontare Nimzo.\n㈡\nFinché non sconfiggeremo quella belva assetata di sangue, i mostri cattivi non la smetteranno di attaccare gli uomini...\n@c0@"
  ja: "@a@b%a001250「お父さん。\n\tわたし…　絶対に勝つね。\n@c0@"
89:
  de: "@a%0%a001250@bWir haben ja schon Slon besiegt, und jetzt ist Nimzo dran. Denn solange er sein Unwesen treibt, werden auch die Monster nicht verschwinden.\n@c0@"
  en: "@a%0%a001250@bWe already defeated Ladja, but now we have to defeat Nimzo too. As long as he's still around, the nasty monsters won't go away.\n@c0@"
  es: "@a%0%a001250@bYa hemos derrotado a Ladja, pero aún tenemos que vencer a Nimzo. Mientras él siga por aquí, no se irán esos monstruos horribles.\n@c0@"
  fr: "@a%0%a001250@bOn a déjà battu Erebos, mais il faut battre Nimzo aussi. Ses méchants monstres ne s'en iront pas tant qu'il sera encore vivant.\n@c0@"
  it: "@a%0%a001250@bRiusciremo a sconfiggerla.\nSì, ci riusciremo.\n@c0@"
  ja: "@a@b%a001250「ゲマは　やっつけたけど\n\tミルドラースがいるかぎり\n\t悪い魔物が　いなくならないもんね。\n@c0@"
90:
  de: "@aSancho@bDu wirst diss doch wohl nisst verlaufen, eh, Chico? Wir haben nur noch eine Ziel.\n@c0@"
  en: "@aSancho@bYou no become confused now, okay?\r\nEes just one theeng we must do.\n@c0@"
  es: "@aSancho@bAhorita no te distraigas, ¿ok?\nNomás tenemos que hacer una cosa.\n@c0@"
  fr: "@aSancho@bT-Tu dois rester c-concentré.\r\nC'est la d-dernière ligne d-droite.\n@c0@"
  it: "@aSancho@bEstai tranquillo, chico.\nSi restiamo concentratos, ce la faremo.\nAndrà todo bien, vedrai.\n@c0@"
  ja: "@a@bサンチョ「もう　迷うことは\n\tありませんね。　われわれが\n\tなすべきことは　ただひとつ。\n@c0@"
91:
  de: "@aSancho@bDas weißt du doch, si, Chico? Das brauche iss dir nisst mehr zu erklären.\n@c0@"
  en: "@aSancho@bYou know, sí, friend? I no need to espell eet out for you.\n@c0@"
  es: "@aSancho@bSabes cuál, ¿verdad, chamaco? No hace falta que te lo escriba.\n@c0@"
  fr: "@aSancho@bM-Mais tu le sais, chico, heinⓡ\nJ-Je n'ai pas b-besoin de te le dire.\n@c0@"
  it: "@aSancho@bAndrà todo bien, chico...\nAndrà todo bien...\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\t言わずとも　わかってますね？\n\t気を　ひきしめていきましょう。\n@c0@"
92:
  de: "@aOtto@bEs ist schön, dass wir wieder alles sehen können, aber irgendwie scheint mir dieser Ort ein wenig groß geraten.\n㈡\nWir müssen sehr vorsichtig sein, damit wir uns nicht verlaufen.\n@c0@"
  en: "@aTuppence@bIt's good that we can see all around, but this place is a little on the large side. We'll have to be careful not to lose our way.\n@c0@"
  es: "@aAlazar@bEstá bien echar un vistazo por la zona, pero este sitio es más bien grande. Tendremos que estar pendientes de no perdernos.\n@c0@"
  fr: "@aInnocent@bC'est bien d'avoir un champ de vision aussi large, mais cet endroit est quand même un peu grand.\r\nIl faut faire attention à ne pas se perdre.\n@c0@"
  it: "@aSimon@bLa visuale è sgombra da ostacoli, ma questo posto è talmente grande che è facilissimo perdersi!\n@c0@"
  ja: "@a@bピピン「見はらしがいいのは　いいのですが\n\t広すぎて……。　気をつけないと\n\t方向を　見失いそうになりますね。\n@c0@"
93:
  de: "@aOtto@bAls Vertreter der Soldaten von Humburg werde ich dem bösen Nimzo tapfer gegenübertreten und ihn seiner gerechten Strafe zuführen!\n@c0@"
  en: "@aTuppence@bAs representative of the soldiers of Gotha, I will take on the evil Nimzo and bring him to justice!\n@c0@"
  es: "@aAlazar@b¡Como representante de los soldados de Pankraz, atraparé a Nimzo y lo pondré en manos de la justicia!\n@c0@"
  fr: "@aInnocent@bEn qualité de représentant des soldats de Gotha,\nje vais affronter cet effroyable Nimzo pour que justice soit faiteⓠ\n@c0@"
  it: "@aSimon@bMaestà, affronterò e sconfiggerò il perfido Signore degli Inferi! Per l'onore del grande Regno di Denim e del suo glorioso esercito!\n㈡\nE anche un po' per il mio, va'!\n@c0@"
  ja: "@a@bピピン「ボク　グランバニアの兵の\n\t代表として　必ずやミルドラースに\n\tいちげきを　加えてみせますよ……！\n@c0@"
94:
  de: "@aBianca@bÄh, %a000090...\n@c0@"
  en: "@aBianca@bUm, %a000090...\n@c0@"
  es: "@aBianca@bMmm, %a000090...\n@c0@"
  fr: "@aBianca@bHum, %a000090...\n@c0@"
  it: "@aBianca@b%0%a000090...\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090……。\n@c0@"
95:
  de: "@aBianca@bAch, egal. Uns bleibt später noch genug Zeit zum Reden.\n@c0@"
  en: "@aBianca@bNever mind. There'll be plenty of time for us to\r\ntalk later.\n@c0@"
  es: "@aBianca@bNo importa. Tendremos tiempo de sobra para hablar después, ¿sabes?\n@c0@"
  fr: "@aBianca@bNon, rien. Nous aurons tout le temps de parler\r\nplus tard.\n@c0@"
  it: "@aBianca@bNo, niente.\nParleremo dopo...\n@c0@"
  ja: "@a@bビアンカ「……ううん。\n\tなんでもないわ。\n\t話は　また今度　ゆっくりね。\n@c0@"
96:
  de: "@aNera@bÄhm, Liebling...\n@c0@"
  en: "@aNera@bUm, darling...\n@c0@"
  es: "@aNera@bMmm, caro mio...\n@c0@"
  fr: "@aNera@bMmm, mon chéri...\n@c0@"
  it: "@aNera@bTesoro, senti una cosa...\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた……。\n@c0@"
97:
  de: "@aNera@bAch, nichts. Ich wollte dich nicht stören.\n@c0@"
  en: "@aNera@bNo, never mind. Sorry to trouble you.\n@c0@"
  es: "@aNera@bNo, niente. Siento importunarte.\n@c0@"
  fr: "@aNera@bNon, rien. Désolée de t'avoir dérangé.\n@c0@"
  it: "@aNera@bNo, lascia stare.\nDopo avremo tutto il tempo che vorremo per parlare...\n@c0@"
  ja: "@a@bフローラ「いいえ…　なんでもないの。\n\tごめんなさいね。\n@c0@"
98:
  de: "@a%0%a001240@bIch bin froh, dass ich der legendäre Held bin. Wahrscheinlich ist das der Grund dafür, warum ich so stark geworden bin.\n@c0@"
  en: "@a%0%a001240@bI'm glad I turned out to be the hero. I'm sure that's the reason why I've been able to become so strong.\n@c0@"
  es: "@a%0%a001240@bMe alegro de haber resultado ser el héroe. Seguro que por esa razón me he vuelto tan fuerte.\n@c0@"
  fr: "@a%0%a001240@bJe suis content que ce soit moi le héros. Je suis sûr que c'est pour ça que je suis devenu si fort.\n@c0@"
  it: "@a%0%a001240@bSono proprio contento di essere l'Eroe Leggendario, papà... Se non lo fossi stato, non sarei mai diventato così forte.\n@c0@"
  ja: "@a@b%a001240「ボク　勇者で　よかったよ。\n\tだって　ボクが強くなれたのって\n\tきっと勇者だったからだし……。\n@c0@"
99:
  de: "@a%0%a001240@bDas ist genau das, was ich von Anfang an wollte. Ich wollte so stark wie möglich werden, um dir helfen zu können, Papa.\n@c0@"
  en: "@a%0%a001240@bThat's all I ever wanted, right from when we first met. I just wanted to become strong so that I could help you, Dad.\n@c0@"
  es: "@a%0%a001240@bEso es lo que siempre he querido desde que nos encontramos. Quería hacerme fuerte para poder ayudarte, papá.\n@c0@"
  fr: "@a%0%a001240@bC'est tout ce que j'ai toujours voulu depuis que je t'ai retrouvé. Je voulais juste devenir fort pour pouvoir t'aider, papa.\n@c0@"
  it: "@a%0%a001240@bE se non fossi stato forte, non avrei potuto aiutarti nella tua avventura! Invece eccomi qui, pronto a lottare al tuo fianco, contro qualsiasi avversario!\n@c0@"
  ja: "@a@b%a001240「ボク　とにかく　強くなって\n\tお父さんの手伝いがしたかったんだ。\n\tお父さんに　会ったときから……。\n@c0@"
100:
  de: "@a%0%a001250@bDie düstere Atmosphäre hier wird immer unerträglicher...\n@c0@"
  en: "@a%0%a001250@bThe sinister air in here is becoming gradually thicker...\n@c0@"
  es: "@a%0%a001250@bEl aire siniestro de este lugar se está espesando...\n@c0@"
  fr: "@a%0%a001250@bL'atmosphère sinistre devient de plus en plus lourde...\n@c0@"
  it: "@a%0%a001250@bL'atmosfera si sta facendo sempre più pesante e sinistra...\n@c0@"
  ja: "@a@b%a001250「いやな空気が\n\tどんどん　こくなってる……。\n\tお父さん……。\n@c0@"
101:
  de: "@aSancho@bAh! Iss weiß nisst, warum, aber iss kann nisst aufhören, an die Vergangenheit zu denken.\n@c0@"
  en: "@aSancho@bEgh! I no know why, but I can no estop theenking about the past.\n@c0@"
  es: "@aSancho@b¡Agh! No sé por qué, pero solo puedo pensar en el pasado, nomás.\n@c0@"
  fr: "@aSancho@bAhⓠ Je ne sais p-pas pourquoi, mais je n'arrête pas de penser au p-passé.\n@c0@"
  it: "@aSancho@bNo riesco a no piensare al passato...\n@c0@"
  ja: "@a@bサンチョ「こんなときだというのに\n\tなぜか　昔のことが\n\t思い出されてなりません。\n@c0@"
102:
  de: "@aSancho@bAn die Zeit, als iss Señor Ludwig auf seine Reisen begleitet habe, um Señora Magda zu finden...\n@c0@"
  en: "@aSancho@bAbout the time señor Pankraz, he ordered for me to accompany heem on hees journey to find señora Mada.\n@c0@"
  es: "@aSancho@bEn el día que el señor Teudis me ordenó acompañarle en su viaje para buscar a la señora Perséfone.\n@c0@"
  fr: "@aSancho@bÀ l'époque où le señor P-Petros, il m'avait\r\nd-demandé de le suivre dans son v-voyage\r\npour retrouver la señora Magdalena.\n@c0@"
  it: "@aSancho@bMe viene en mentes el día que el señor Russel me chiese de accompagnarlo a cercare la povera señora Mada... Yo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「マーサさまをさがす旅のお供を\n\tパパスさまより　命じられた日のこと…\n\tそのことばかりが　頭を　よぎります。\n@c0@"
103:
  de: "@aOtto@bIch muss noch einmal betonen, wie froh ich bin, dass Ihr mich als Euren Begleiter auserwählt habt, %a000090.\n@c0@"
  en: "@aTuppence@bI must say that I'm ever so grateful you chose me as your companion here, %a000090.\n@c0@"
  es: "@aAlazar@bDebo decir que os estaré siempre agradecido por haberme elegido como compañero, %a000090.\n@c0@"
  fr: "@aInnocent@bJe dois dire que je vous suis très reconnaissant de m'avoir choisi comme compagnon, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, sono onorato che lei abbia pensato a me come compagno per quest'avventura...\n@c0@"
  ja: "@a@bピピン「%a000090さま。\n\tボクみたいな男を　こんな所まで\n\tお供させてくださって感謝しています。\n@c0@"
104:
  de: "@aOtto@bZu Hause werde ich jedem erzählen, dass selbst ein einfacher Bursche wie ich das Unmögliche wahr machen kann, wenn er nur fest daran glaubt!\n@c0@"
  en: "@aTuppence@bWhen we return home to Gotha, I'll be able to tell everyone how even a lowly character like me can\r\ndo anything if he puts his mind to it.\n@c0@"
  es: "@aAlazar@bCuando volvamos a Pankraz, podré contarles a todos que un modesto personaje como yo puede hacer lo que sea si se lo propone.\n@c0@"
  fr: "@aInnocent@bQuand nous serons de retour à Gotha, tout le monde verra que même un humble citoyen comme moi peut arriver à quelque chose s'il s'en donne les moyens. \n@c0@"
  it: "@aSimon@bQuando tornerò a Denim, racconterò a tutti delle nostre imprese. Il suo nome sarà impresso a lettere d'oro negli annali del nostro Regno, Sire!\n㈡\nCome vede, non prendo nemmeno in considerazione l'eventualità che io non faccia ritorno a casa.\nDire certe cosa porta una iella mostruosa...\n@c0@"
  ja: "@a@bピピン「ボクみたいに　平凡な男でも\n\tやればできるってこと　帰れたら\n\t城の仲間たちにも　伝えますね。\n@c0@"
105:
  de: "@aBianca@bWas ist das für ein Ort? Sieht auf jeden Fall ziemlich verwirrend aus...\n@c0@"
  en: "@aBianca@bWhat is this place? It all looks totally confusin' if you ask me.\n@c0@"
  es: "@aBianca@b¿Qué lugar es este? Tiene una pinta de lo más desconcertante, la verdad.\n@c0@"
  fr: "@aBianca@bQu'est-ce que c'est que cet endroitⓡ\nMoi, je n'y comprends rien.\n@c0@"
  it: "@aBianca@bMa che razza di posto è questo...?\nNon ci capisco niente...\n@c0@"
  ja: "@a@bビアンカ「なんなの？　この部屋は。\n\tう～ん…　なんだか　ふくざつそうね。\n@c0@"
106:
  de: "@aBianca@bIn so was bin ich nicht besonders gut. Ich fürchte, da musst du dich drum kümmern, %a000090.\n@c0@"
  en: "@aBianca@bI'm rubbish at figurin' out things like this. I'll have to leave it to you, I'm afraid, %a000090.\n@c0@"
  es: "@aBianca@bSoy malísima averiguando este tipo de cosas. Me parece que tendrás que ocuparte tú, %a000090.\n@c0@"
  fr: "@aBianca@bJe suis nulle pour ces trucs-là. Tu vas devoir te débrouiller tout seul, %a000090.\n@c0@"
  it: "@aBianca@bNon sono brava a risolvere enigmi del genere, %a000090.\nPrego, a te l'onore...\n@c0@"
  ja: "@a@bビアンカ「私　こういうの\n\t苦手だから　ここは\n\t%a000090が　がんばってね。\n@c0@"
107:
  de: "@aNera@bIch weiß! Wir müssen so gehen und dann so und dann... Nein, doch nicht...\n@c0@"
  en: "@aNera@bI see! We have to go like this, and then like that, and then... No, wait a minute...\n@c0@"
  es: "@aNera@b¡Capito! Tenemos que ir así, y luego así, y luego... No, un momento...\n@c0@"
  fr: "@aNera@bJe voisⓠ Il faut passer par là, puis par là, et après... Non, attends voir...\n@c0@"
  it: "@aNera@bAh, ma è facile! Si fa così, poi colì, poi cosà e poi colà! No, ho sbagliato! Si fa prima cosà, poi colì, poi così e infine colà... Oppure no...? Uhm...\n@c0@"
  ja: "@a@bフローラ「ここは　きっと\n\tこうやって　ああやって\n\tあそこをこうして……　あら？\n@c0@"
108:
  de: "@a%0%a001240@bDieser Raum ist wirklich verwirrend. Die Monster, die sich das ausgedacht haben, müssen großen Spaß dabei gehabt haben...\n@c0@"
  en: "@a%0%a001240@bThis room's really weird. The monsters who thought this up must be pretty pleased with themselves.\n@c0@"
  es: "@a%0%a001240@bEsta sala es muy rara. Los monstruos que la inventaron se sentirán muy orgullosos.\n@c0@"
  fr: "@a%0%a001240@bCette pièce est vraiment bizarre. Les monstres qui l'ont créée doivent être fiers d'eux.\n@c0@"
  it: "@a%0%a001240@bQuesta stanza è un incubo!\nFaccio i miei complimenti alla mente contorta che l'ha progettata...\n@c0@"
  ja: "@a@b%a001240「なんか　へんな部屋だね。\n\t魔物たちも　よくこんな　しかけ\n\t考えるなあ……。\n@c0@"
109:
  de: "@aBianca@bMir ist schwindelig ⓚⓛ daran ist nur diese komische Luft schuld. Aber wir dürfen uns von diesem Ort nicht kleinkriegen lassen.\n@c0@"
  en: "@aBianca@bAll this nasty air is startin' to make me dizzy.\r\nBut we can't let this place get the better of us.\n@c0@"
  es: "@aBianca@bEste aire horrible me empieza a marear.\nPero no podemos permitir que este sitio nos supere, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet air nauséabond commence à me faire tourner la tête, mais on ne doit pas laisser cet endroit avoir le dessus.\n@c0@"
  it: "@aBianca@bMi sento male, ma devo resistere!\nNon posso arrendermi proprio adesso!\n@c0@"
  ja: "@a@bビアンカ「まがまがしい空気が\n\tうずまいてて　クラクラするわ。\n\tでも　私たちは　負けないわよ。\n@c0@"
110:
  de: "@aNera@bWenn man so hoch oben ist, wird einem ganz schön schwindelig, nicht? Aber davon dürfen wir uns nicht aufhalten lassen.\n@c0@"
  en: "@aNera@bBeing at this sort of height makes you feel all dizzy, doesn't it? We won't let it stop us now, though.\n@c0@"
  es: "@aNera@bEstar a esta altura resulta mareante, ¿vero? Pero no dejaremos que questo nos detenga.\n@c0@"
  fr: "@aNera@bOn a un peu la tête qui tourne à cette altitude.\r\nMais ce n'est pas ça qui nous arrêtera.\n@c0@"
  it: "@aNera@bChe altezza vertiginosa!\nSe solo penso a dove siamo, mi sento male...\nSanta dea, aiutami tu!\n@c0@"
  ja: "@a@bフローラ「目もくらむような高さですわね。\n\tでも　もう　こんなことくらいでは\n\tひるまないわ。\n@c0@"
111:
  de: "@a%0%a001250@bIch habe Angst. Ich trau mich kaum, nach unten zu sehen! So was nennt man wohl ein Fass ohne Boden...\n@c0@"
  en: "@a%0%a001250@bI'm scared. I don't want to look down!\nIs this what a bottomless pit looks like?\n@c0@"
  es: "@a%0%a001250@bTengo miedo. ¡No quiero mirar abajo!\n¿Es este el aspecto de un pozo sin fondo?\n@c0@"
  fr: "@a%0%a001250@bJ'ai peur. Je ne veux pas regarder en basⓠ\nC'est ça qu'on appelle un puits sans fondⓡ\n@c0@"
  it: "@a%0%a001250@bNon voglio guardare in basso! Soffro di vertigini!\nE poi, perché mai dovrei guardare?!\nSo già che sotto di me c'è un precipizio senza fondo...\n@c0@"
  ja: "@a@b%a001250「こわい…　下が　見えないの。\n\tならくの底って　こんな感じ？\n@c0@"
112:
  de: "@aSancho@bMach dir um miss keine Sorgen, Chico. Aber du musst aufpassen, wo du deine Füße hinsetzt, hörst du? Iss werde diss nisst retten, wenn du fällst!\n@c0@"
  en: "@aSancho@bI, I esure ees gonna be okay, but...you be\r\ncareful where you put your feets, okay?\r\nI no gonna esave you eef you fall!\n@c0@"
  es: "@aSancho@bYa sé que todo va a ir bien, pero... mira bien dónde pones los pies, ¿ok?\n¡No voy a salvarte si te caes!\n@c0@"
  fr: "@aSancho@bJe s-suis sûr que tout v-va bien se passer, mais... t-tu fais attention où tu mets les p-pieds, heinⓡ\nJe ne p-pourrai pas te s-sauver si tu tombesⓠ\n@c0@"
  it: "@aSancho@bChico, estai attento a donde metti los piedes...\nSi fai un passo falso, tu sei muerto...\n¡Ay, no ce voglio nemmenos pensar!\n@c0@"
  ja: "@a@bサンチョ「大丈夫だと思いますが\n\t足もとに　気をつけてくださいね。\n\tここから落ちたら　助かりませんよ！\n@c0@"
113:
  de: "@a%0%a001240@bIch wette, auch der alte legendäre Held war ein wenig nervös, als der Kampf mit dem Herrn der Unterwelt kurz bevorstand...\n@c0@"
  en: "@a%0%a001240@bI'll bet the ancient legendary hero felt a bit scared when the time came to do battle with the\nLord of the Underworld.\n@c0@"
  es: "@a%0%a001240@bApuesto a que el héroe legendario tuvo un poco de miedo cuando le llegó la hora de luchar con el Señor del Inframundo.\n@c0@"
  fr: "@a%0%a001240@bJe suis sûr que le précédent héros légendaire a eu un peu peur quand l'heure du combat avec le Seigneur des Enfers a sonné.\n@c0@"
  it: "@a%0%a001240@bScommetto che anche il precedente Eroe Leggendario ebbe un po' di paura quando si trovò di fronte il Signore degli Inferi...\n@c0@"
  ja: "@a@b%a001240「昔の伝説の勇者だって\n\t大魔王をたおすときは　きっと\n\tこわくて　しかたなかったはずだよ。\n@c0@"
114:
  de: "@a%0%a001240@bAlso ist es auch nicht schlimm, wenn ich ein bisschen Angst habe. Auf jeden Fall werde ich gewinnen!\n@c0@"
  en: "@a%0%a001240@bSo it doesn't mean anything that I'm a bit nervous.\nI'm definitely going to win!\n@c0@"
  es: "@a%0%a001240@b¡O sea, que no pasa nada porque yo esté algo nervioso!\n¡Está claro que voy a vencer!\n@c0@"
  fr: "@a%0%a001240@bAlors c'est normal que je sois un peu nerveux.\nJe vais gagner. J'en suis sûrⓠ\n@c0@"
  it: "@a%0%a001240@bCiò, però, non gli impedì di ottenere la vittoria.\nQuindi è positivo che io sia terrorizzato...\nVuol dire che anche stavolta il bene trionferà!\n㈡\nSperiamo che pure il Gran Maestro degli Inferi tenga conto di questo significativo precedente...\n@c0@"
  ja: "@a@b%a001240「だから　ボクは　どんなに\n\tこわくても　絶対に　負けない！\n@c0@"
115:
  de: "@a%0%a001250@bEigentlich habe ich sogar große Angst, aber wenn du bei mir bist, geht es, Papa.\n@c0@"
  en: "@a%0%a001250@bI'm actually really scared, but being with you makes it a little bit easier, Dad.\n@c0@"
  es: "@a%0%a001250@bEstoy asustada de verdad, pero estar contigo me lo hace más fácil, papi.\n@c0@"
  fr: "@a%0%a001250@bJ'ai vraiment très peur, mais ça me rassure un peu d'être avec toi, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, ho paura...\nIl fatto di stare accanto a te, però, mi dà la forza di andare avanti...\n@c0@"
  ja: "@a@b%a001250「本当は　すごく\n\tこわいんだけど…　お父さんといると\n\tすこしだけ　こわくないの。\n@c0@"
116:
  de: "@a%0%a001250@bIch bin sehr froh, dass ich deine Tochter bin. Tut mir leid... Ich weiß nicht so genau, wie ich mich ausdrücken soll.\n@c0@"
  en: "@a%0%a001250@bI'm really glad I was born your daughter. Sorry...\nI don't know how to say what I mean very well.\n@c0@"
  es: "@a%0%a001250@bEstoy muy contenta de ser hija tuya. Perdona...\nNo sé cómo expresar bien lo que quiero decir.\n@c0@"
  fr: "@a%0%a001250@bJe suis contente d'être ta fille. Désolée... Je ne sais pas trop comment dire ce que je ressens.\n@c0@"
  it: "@a%0%a001250@bSono felice di essere la figlia di un uomo così coraggioso!\n@c0@"
  ja: "@a@b%a001250「わたし…　お父さんの子で\n\tよかった…　と思う。\n\tごめんなさい　上手に言えなくて。\n@c0@"
117:
  de: "@aSancho@bSi. Es ist Zeit...\n@c0@"
  en: "@aSancho@bSí. Ees time...\n@c0@"
  es: "@aSancho@b¡Ándale! Ya es hora...\n@c0@"
  fr: "@aSancho@bSi. C'est le m-moment...\n@c0@"
  it: "@aSancho@bSì, ce la faremo, chico...\n@c0@"
  ja: "@a@bサンチョ「いよいよですね。\n\tええ…　わかりますとも。\n@c0@"
118:
  de: "@aSancho@bEs wird Zeit für deine Onkel Sancho, das zu beenden, was Señor Ludwig angefangen hat.\n㈡\nDieser Nimzo wird siss bald von diese Welt verabschieden müssen!\n@c0@"
  en: "@aSancho@bEes time for your Uncle Sancho to finish what señor Pankraz, he estarted. Thees Nimzo,\r\nhe no gonna be around much longer.\n@c0@"
  es: "@aSancho@bYa es hora de que el tito Sancho termine lo que el señor Teudis comenzó. Ese Nimzo no va a durar mucho más.\n@c0@"
  fr: "@aSancho@bC'est le m-moment pour ton tonton Sancho de\r\nf-f-finir ce que le señor Petros a commencé.\r\nCe N-Nimzo, il n'en a p-plus pour longtemps.\n@c0@"
  it: "@aSancho@bEsta vez completeremo l'opera que el señor Russel aveva cominciato.\nNimzo ha las oras contatas!\n@c0@"
  ja: "@a@bサンチョ「パパスさまに　代わって\n\tこのサンチョ　ミルドラースの\n\tいきの根を　とめてみせますぞっ！\n@c0@"
119:
  de: "@aOtto@bIch hoffe doch sehr, dass Ihr an unseren kleinen Plaudereien während der Reise Gefallen hattet, oder, %a000090?\n@c0@"
  en: "@aTuppence@bI trust you've been enjoying these little chats with me along the way, %a000090?\n@c0@"
  es: "@aAlazar@bEspero que hayáis disfrutado de conversar un poco conmigo por el camino, %a000090.\n@c0@"
  fr: "@aInnocent@bJ'espère que vous avez apprécié toutes nos petites conversations durant ce voyage, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, ha gradito le chiacchiere con cui ho cercato di allietare il suo viaggio?\n@c0@"
  ja: "@a@bピピン「%a000090さま\n\t道中での　ボクのおしゃべり\n\t楽しんでいただけましたか？\n@c0@"
120:
  de: "@aOtto@bOh, das ist gut! Das hört man gerne. Ich hätte mir keine schönere Antwort vorstellen können.\n@c0@"
  en: "@aTuppence@bOh good! That is nice to hear. I couldn't have wished for a better answer.\n@c0@"
  es: "@aAlazar@b¡Qué bien! Me alegro de oírlo. No podría desear mejor respuesta.\n@c0@"
  fr: "@aInnocent@bVraimentⓡ C'est agréable à entendre.\nVous ne pouviez pas me faire plus plaisir.\n@c0@"
  it: "@aSimon@bDavvero? Grazie!\nIn effetti, mi riconosco il merito di essere un conversatore decisamente gradevole...\n@c0@"
  ja: "@a@bピピン「それは　よかったです！\n\tありがたき　しあわせ。\n\tもう思いのこすことは　ありませんよ。\n@c0@"
121:
  de: "@aOtto@bOh... verstehe. Wie schade. Ich habe mich sehr bemüht, Euch zu unterhalten, wisst Ihr.\n@c0@"
  en: "@aTuppence@bOh, er... I see. What a pity. I put so much effort into trying to keep you entertained.\n@c0@"
  es: "@aAlazar@b¡Oh!, estooo... Entiendo. ¡Qué pena! Me he esforzado mucho por teneros entretenido.\n@c0@"
  fr: "@aInnocent@bOh, euh... Je vois. C'est dommage. J'ai pourtant fait tout mon possible pour essayer de vous distraire.\n@c0@"
  it: "@aSimon@bAh, no?! Beh, la cosa è reciproca!\nSe proprio vuol saperlo, ho trovato i suoi discorsi vuoti e privi di senso!\n@c0@"
  ja: "@a@bピピン「そ　そんな…　ボク\n\t%a000090さまに　楽しんでいただこうと\n\t自分をすてて　がんばったのに！\n@c0@"
122:
  de: "@aBianca@bÄh, %a000090...\n@c0@"
  en: "@aBianca@bUm, %a000090...\n@c0@"
  es: "@aBianca@bMmm, %a000090...\n@c0@"
  fr: "@aBianca@bHum, %a000090...\n@c0@"
  it: "@aBianca@b%0%a000090...\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090……。\n@c0@"
123:
  de: "@aBianca@bDas könnte das letzte Mal sein, dass wir Gelegenheit zum Reden haben, deshalb möchte ich dir noch etwas Wichtiges sagen.\n@c0@"
  en: "@aBianca@bThis could be the last chance we have to talk,\r\nso there's somethin' I want to say.\n@c0@"
  es: "@aBianca@bEsta podría ser nuestra última ocasión para hablar, así que quiero decirte algo.\n@c0@"
  fr: "@aBianca@bÇa pourrait être la dernière fois que nous pouvons parler et je voudrais te dire quelque chose.\n@c0@"
  it: "@aBianca@bQuesta potrebbe essere l'ultima volta che abbiamo la possibilità di parlarci, quindi vorrei dirti una cosa molto importante...\n@c0@"
  ja: "@a@bビアンカ「もしかしたら\n\t最後かもしれないでしょ？\n\tだから　今のうちに　きいておくわね。\n@c0@"
124:
  de: "@aBianca@bErinnerst du dich an den Schwur, den wir damals in Mostroferrator geleistet haben?\n@c0@"
  en: "@aBianca@bD'you remember the vows we made back\r\nin Mostroferrato?\n@c0@"
  es: "@aBianca@b¿Recuerdas los votos que hicimos allá en Mostroferrato?\n@c0@"
  fr: "@aBianca@bTu te souviens des vœux que nous avons échangés à Mostroferratoⓡ\n@c0@"
  it: "@aBianca@bRicordi il giuramento che ci siamo scambiati a Mostroferrato, quando ci siamo sposati...?\n@c0@"
  ja: "@a@bビアンカ「サラボナで　誓ったこと\n\t今でもまだ　おぼえてる？\n@c0@"
125:
  de: "@aBianca@bWir haben in der Kirche gestanden und uns ewige Liebe geschworen.\n@c0@"
  en: "@aBianca@bWe stood there in that church and promised to love each other forever.\n@c0@"
  es: "@aBianca@bNos prometimos amor eterno ante el altar.\n@c0@"
  fr: "@aBianca@bDans cette église, nous avons promis de nous aimer pour toujours.\n@c0@"
  it: "@aBianca@bCi siamo promessi di stare sempre insieme, di amarci e di rispettarci, fino alla fine dei nostri giorni...\n@c0@"
  ja: "@a@bビアンカ「私たち　あの教会で\n\t永遠の愛を　誓ったわよね。\n@c0@"
126:
  de: "@aBianca@bWenn wir heute hier sterben, sterben wir wenigstens gemeinsam.\n㈡\nTrotzdem müssen wir alles daransetzen, den heutigen Tag zu überleben, um dann Hand in Hand nach Humburg zurückkehren zu können!\n@c0@"
  en: "@aBianca@bIf we die here, it looks like we'll be dyin' together at least. But we have to try to get through this and go home to Gotha hand-in-hand.\n@c0@"
  es: "@aBianca@bSi morimos aquí, al menos moriremos juntos. Pero tenemos que intentar salir de esta y volver a Pankraz juntos, de la mano, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bSi nous mourons ici, au moins, nous mourrons ensemble, mais nous devons faire tout notre\r\npossible pour revenir à Gotha main dans la main.\n@c0@"
  it: "@aBianca@bSpero che riusciremo a superare anche questa difficoltà, e che torneremo a Denim mano nella mano, per continuare a essere felici l'uno accanto all'altra.\n㈡\nSe però moriremo qui, avremo comunque tenuto fede alla nostra promessa...\nTi amo, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090。　死ぬときは\n\tいっしょよ。　だけど　絶対に生きて\n\tグランバニアに　帰りましょうね。\n@c0@"
127:
  de: "@aNera@bIch möchte mich bei dir entschuldigen, Liebling. Ich bin weder eine gute Frau noch eine gute Mutter gewesen und ich habe dir eine Menge Sorgen bereitet.\n@c0@"
  en: "@aNera@bI must apologise to you, darling. I haven't been a good wife or mother, and I know I've caused you lots of stress.\n@c0@"
  es: "@aNera@bTengo que pedirte disculpas, caro mio. No he sido buena esposa ni buena mamma, y sé que te he causado mucha tensión.\n@c0@"
  fr: "@aNera@bJe dois te faire des excuses, mon chéri. Je n'ai pas été une épouse ni une mère idéale et je sais que je t'ai causé beaucoup d'ennuis.\n@c0@"
  it: "@aNera@bVoglio scusarmi con te, %a000090.\nNon credo di essere stata una brava moglie. Non ho fatto altro che causarti problemi e preoccupazioni.\n@c0@"
  ja: "@a@bフローラ「あなた　ごめんなさいね。\n\t私　迷わくを　かけてばっかりで\n\tいい妻でも母でも　なかったわ……。\n@c0@"
128:
  de: "@aNera@bAls wir geheiratet und Mostroferrato gemeinsam verlassen haben, habe ich mein Bestes gegeben, um mit dir mitzuhalten.\n@c0@"
  en: "@aNera@bWhen we were married and we left Mostroferrato together, I tried my very hardest so I'd be able to keep up with you.\n@c0@"
  es: "@aNera@bCuando nos casamos y partimos juntos de Mostroferrato, me esforcé cuanto pude por estar a la tua altura.\n@c0@"
  fr: "@aNera@bDepuis notre mariage et notre départ de Mostroferrato, j'ai toujours fait le maximum\r\npour être à la hauteur.\n@c0@"
  it: "@aNera@bDopo il nostro matrimonio, ti ho seguito in tutti i tuoi viaggi, facendo del mio meglio per non esserti di peso e per aiutarti in tutti i modi possibili...\n@c0@"
  ja: "@a@bフローラ「結婚して　サラボナを出たときも\n\t私　本当に　あなたに　ついていくのが\n\t精いっぱいだった……。\n@c0@"
129:
  de: "@aNera@bIch werde Mama und Papa ewig dankbar sein, dass sie mich großgezogen haben.\n㈡\nAber als du mich als deine Braut erwählt hast, war ich zum ersten Mal in meinem Leben wirklich glücklich.\n@c0@"
  en: "@aNera@bI'll always be grateful to Mama and Papa for bringing me up, but being chosen by you like\r\nthat was when I first knew true happiness.\n@c0@"
  es: "@aNera@bSiempre les estaré agradecida al mio papino y a la mia mamma por haberme criado, pero cuando tú me elegiste de esa forma fue cuando conocí la felicidad.\n@c0@"
  fr: "@aNera@bJe serai éternellement reconnaissante à mamma et papa de m'avoir élevée, mais je n'ai véritablement connu le bonheur que lorsque tu m'as choisie.\n@c0@"
  it: "@aNera@bSarò sempre grata ai miei genitori per avermi fatto diventare ciò che sono oggi, ma lo sono ancora di più a te per avermi scelto come compagna per la vita.\n@c0@"
  ja: "@a@bフローラ「私を育ててくれた父や母には\n\tとても感謝しているけど…　あなたが\n\t私を　選んでくれてうれしかったわ。\n@c0@"
130:
  de: "@aNera@bIch spürte, dass es das Schicksal so wollte: Dass wir zusammen sein und eine Familie gründen sollten. Ich hätte nicht glücklicher sein können.\n@c0@"
  en: "@aNera@bI felt as if we were destined to be together, to have a family together, and I couldn't have been happier.\n@c0@"
  es: "@aNera@bSiento como si estuviéramos destinados a estar juntos, a tener nuestra famiglia, y no podría haber sido más felice.\n@c0@"
  fr: "@aNera@bJ'ai l'impression que c'était notre destin de nous unir et de fonder une famille, et je n'aurais pas pu être plus heureuse.\n@c0@"
  it: "@aNera@bAvevo sempre sognato di incontrare una persona come te, e quando i nostri cuori hanno cominciato a battere all'unisono il mio animo s'è riempito di gioia...\n@c0@"
  ja: "@a@bフローラ「だって　運命を感じた人と\n\t本当の家族をつくれるんですもの。\n@c0@"
131:
  de: "@aNera@bWir sind es unserer Liebe schuldig, das alles hier zu überstehen und gesund und munter nach Humburg zurückzukehren.\n@c0@"
  en: "@aNera@bWe owe it to our love to make sure we come out of this alive and return home to live in peace in Gotha.\n@c0@"
  es: "@aNera@bPer nuestro amore, debemos asegurarnos de salir con vida de aquí, volver a casa y vivir pacíficamente en Pankraz.\n@c0@"
  fr: "@aNera@bNous devons compter sur notre amour pour sortir d'ici vivants et retourner couler des jours paisibles à Gotha.\n@c0@"
  it: "@aNera@bVoglio che superiamo anche quest'ennesima prova, e che torniamo a Denim insieme.\n㈡\nTi prometto che m'impegnerò ancora di più per diventare la moglie migliore che un uomo abbia mai avuto.\n@c0@"
  ja: "@a@bフローラ「だから　必ず　生きて\n\tグランバニアへ帰りましょう？\n\tそして　その時こそ……\n@c0@"
132:
  de: "@aNera@bDann können wir %a001240 und %a001250 endlich die Kindheit geben, die sie verdient haben.\n@c0@"
  en: "@aNera@bThen we can finally give %a001240 and %a001250 the childhood they deserve.\n@c0@"
  es: "@aNera@bAsí podremos dar a %a001240 y %a001250 la infancia que veramente merecen.\n@c0@"
  fr: "@aNera@bNous pourrons enfin donner à %a001240 et %a001250 l'enfance qu'ils méritent.\n@c0@"
  it: "@aNera@bE finalmente daremo a %a001240 e %a001250 la possibilità di vivere la loro gioventù con spensieratezza. Ti amo, %a000090.\n@c0@"
  ja: "@a@bフローラ「%a001240と%a001250を\n\tふつうの子供に\n\tもどしてあげましょうね。\n@c0@"
133:
  de: "@aGriselda@bDeine Mutter muss hier irgendwo sein, %a000090. Los, wir müssen sie retten.\n@c0@"
  en: "@aDebora@bYour mother is in here somewhere, %a000090.\nWe should hurry up and rescue her.\n@c0@"
  es: "@aStefania@bLa tua mamma está aquí, en algún lado, %a000090.\nDebemos darnos prisa y rescatarla.\n@c0@"
  fr: "@aPandora@bTa mère est ici, quelque part, %a000090.\nNous devrions nous dépêcher d'aller la sauver.\n@c0@"
  it: "@aViola@bTua madre è qui da qualche parte, %a000090.\nSbrighiamoci a trovarla.\n@c0@"
  ja: "@a@bデボラ「この奥に　%a000090のママが\n\tとらわれているのね。\n\tさあ　急いで　助けにいくわよ。\n@c0@"
134:
  de: "@aGriselda@bDas ist das letzte Mal, dass ich hierher komme. Wir werden Nimzo jetzt endlich besiegen und dann nach Hause zurückkehren!\n@c0@"
  en: "@aDebora@bThis is the last time I'm coming here. We're going to defeat Nimzo once and for all, and go home to our proper lives.\n@c0@"
  es: "@aStefania@bEsta es la última vez que vengo aquí. Derrotaremos a Nimzo de una vez per tutti y volveremos a casa a seguir con nuestras vidas.\n@c0@"
  fr: "@aPandora@bC'est la dernière fois que je viens ici. Nous allons vaincre Nimzo une bonne fois pour toutes et retourner chez nous vivre notre propre vie.\n@c0@"
  it: "@aViola@bQuesta è l'ultima volta che veniamo qui, caro.\nNon possiamo più fallire.\n㈡\nDobbiamo sconfiggere Nimzo, così potremo finalmente tornare a casa, dove mi servirai e riverirai come hai promesso di fare il giorno del nostro matrimonio.\n@c0@"
  ja: "@a@bデボラ「ここを通るのは　最後にするわよ。\n\t今度こそ　ミルドラースを倒して\n\t家に　帰るんだから。\n@c0@"
135:
  de: "@aGriselda@bOje, ich werde bald dem Großmeister der Unterwelt gegenübertreten! Das hätte ich mir nie träumen lassen, als ich noch zu Hause wohnte.\n@c0@"
  en: "@aDebora@bTo think that I'm going to challenge the Grandmaster of the Underworld! I would never have imagined it back when I was living at home.\n@c0@"
  es: "@aStefania@b¡Voy a desafiar al Gran Maestro del Inframundo! Non lo hubiese imaginado jamás cuando vivía en casa de il mio papino.\n@c0@"
  fr: "@aPandora@bDire que je vais défier le Grand Maître des Enfersⓠ Je n'aurais jamais imaginé ça, à l'époque où je vivais à la maison.\n@c0@"
  it: "@aViola@bSto per affrontare il Gran Maestro degli Inferi...\nIo, Viola Fosconi da Mostroferrato sto per battermi contro il malvagio Nimzo!\n@c0@"
  ja: "@a@bデボラ「この私が　大魔王に　挑むなんてね。\n\tルドマン家で　暮らしていたころには\n\t想像すら　していなかったわ。\n@c0@"
136:
  de: "@aGriselda@bIst ja auch nicht unbedingt das, wovon ein junges Mädchen so träumt, nicht?\n@c0@"
  en: "@aDebora@bIt's not exactly the kind of thing you daydream of,\r\nis it?\n@c0@"
  es: "@aStefania@bNo es el tipo de cosa con la que uno sueña despierto, ¿vero?\n@c0@"
  fr: "@aPandora@bCe n'est pas exactement le genre de chose dont\non rêve, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bNah.\nNon penso di aver voglia di farlo.\nTroppa fatica.\n㈡\nLascerò a te l'onore di fare a pezzi quel carognone, %a000090, così potrai vantarti con gli amici quando ti darò il permesso di incontrarli alla taverna.\n@c0@"
