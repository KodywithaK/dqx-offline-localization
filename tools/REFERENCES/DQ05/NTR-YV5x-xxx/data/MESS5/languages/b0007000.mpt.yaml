  es: "@a@b*: Dicen que el trasbordador a Puerto Securus zarpó hace unos días, así que había venido con la esperanza de tomar el próximo.\n@c0@"
  fr: "@a@b*ⓢ Il paraît que le bateau pour le Petit Havre a mis les voiles l'autre jour. Je me suis dépêché de venir en espérant que je pourrais prendre le suivant. \n@c0@"
  it: "@a@b*: Ero venuto qui per imbarcarmi sulla prossima nave diretta a Cala Disorte perché avevo sentito dire che la navigazione era ripresa regolarmente...\n@c0@"
  ja: "@a@b＊「船が出せなきゃ　オレたち\n\t仕事もありゃしないよ。\n@c0@"
189:
  de: "@a@b*: Aber anscheinend war das die letzte. Wie soll ich denn so zum Paradies des Weißen Königs gelangen, hä?\n@c0@"
  en: "@a@b*: But apparently that was the last one to go. How's a fella supposed to get to that White King's Paradise at this rate, eh?\n@c0@"
  es: "@a@b*: Pero parece que aquel fue el último. Así, ¿cómo me las voy a arreglar para llegar al Paraíso del Rey Blanco?\n@c0@"
  fr: "@a@b*ⓢ Mais apparemment, c'était le dernier qui partait. Comment je vais faire pour aller au Paradis du Roi blanc, moiⓡ\n@c0@"
  it: "@a@b*: E invece pare che, dopo l'ultima partenza, non salperanno altre imbarcazioni! E io come faccio a raggiungere il Paradiso del Re Bianco, eh?\n@c0@"
  ja: "@a@b＊「つい先日　ビスタへの連絡船が\n\t出たっていうんで　また出るだろうと\n\t来てみたんですが……。\n@c0@"
190:
  de: "@a@b*: Seht Ihr den Leuchtturm dort drüben? Auf seiner Spitze haust ein furchteinflößender Oger!\n@c0@"
