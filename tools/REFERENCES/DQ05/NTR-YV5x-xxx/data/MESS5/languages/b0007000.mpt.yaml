  it: "@a@b*: Mio figlio era un bravo marinaio.\nIl suo capitano era fiero di lui.\n@c0@"
  ja: "@a@b＊「なんだ　あんた　本気にしたのか。\n\t冗談だよ　冗談。\n\tわっはっはっはっ。\n@c0@"
195:
  de: "@a@b*: Aber dann wurde sein Schiff von Monstern angegriffen.\n@c0@"
