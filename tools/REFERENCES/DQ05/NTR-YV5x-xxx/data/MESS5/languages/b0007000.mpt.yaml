  it: "@a@b*: Si nun %H0860%Xvoi%Yvolete%Z lasciacce la pelle, %H0860%Xte%Yve%Z conviene gira' alla larga da quer posto!\n@c0@"
  ja: "@a@b＊「この先に　灯台があるが\n\tすごい怪物が　住んでるぞ！\n@c0@"
192:
