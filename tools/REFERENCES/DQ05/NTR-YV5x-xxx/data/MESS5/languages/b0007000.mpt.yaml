179:
  de: "@a@b*: Ha-püh... Ha-püh...\nZzz...\n@c0@"
  en: "@a@b*: Ah-phew... Ah-phew...\nZzz...\n@c0@"
  es: "@a@b*: Ah, fiuu... Ah, fiuu...\r\nZzz...\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\nZzz...\n@c0@"
  it: "@a@b*: Ronfff... Ronfff...\nZzz...\n@c0@"
  ja: "@a@b＊「ぐがー　ぐがー。\n\tやった！　これで船が来るぞ！\n\tむにゃむにゃ……。\n@c0@"
180:
  de: "@a@b*: Mein Mann will immer nur Nickerchen machen!\n@c0@"
