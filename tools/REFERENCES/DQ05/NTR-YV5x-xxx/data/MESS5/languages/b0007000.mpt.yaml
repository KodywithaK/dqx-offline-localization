  es: "@a@b*: ¿Que %H0860%Xquieres%Yqueréis%Z volver a bordo? Me temo que ahora mismo no puedo admitir más pasajeros.\n@c0@"
  fr: "@a@b*ⓢ Vous voulez remonter à bordⓡ Je suis désolé, mais nous ne prenons pas de passagers pour l'instant.\n@c0@"
  it: "@a@b*: Come? %H0860%XVuoi%YVolete%Z tornare a bordo? Mi spiace, ma non è possibile.\n@c0@"
  ja: "@a@b＊「よーし　お客さんは\n\t全員　おりたな。\n@c0@"
184:
  de: "@a@b*: Die Fähre nach Kleinhaven wurde vor kurzem von Monstern angegriffen und ist gesunken.\n@c0@"
  en: "@a@b*: The ferry to Littlehaven was attacked and sunk by monsters a little while back.\n@c0@"
