  ja: "@a@b＊「しかし　息子の乗った船が\n\t魔物どもに　おそわれてのう。\n@c0@"
197:
  de: "@a@b*: He! Habt Ihr schon gehört?\n@c0@"
  en: "@a@b*: Hey! Have you heard?\n@c0@"
  es: "@a@b*: ¡Eh! ¿Lo %H0860%Xhas%Yhabéis%Z oído?\n@c0@"
  fr: "@a@b*ⓢ Héⓠ Vous avez entenduⓡ\n@c0@"
  it: "@a@b*: Accidentaccio, che notiziona!\nL'%H0860%Xhai%Yavete%Z sentita, vero?\n@c0@"
  ja: "@a@b＊「今　思いだしても　くやしくて\n\t涙が　でてくるわい……。\n@c0@"
198:
  de: "@a@b*: Dann stimmt es also! Ich wünschte, das könnte ich auch lernen.\n@c0@"
  en: "@a@b*: Then it's true!\nI wish I could learn how to do it.\n@c0@"
  es: "@a@b*: ¡Así que es verdad!\r\nCómo me gustaría aprender a hacerlo.\n@c0@"
  fr: "@a@b*ⓢ C'est donc vraiⓠ\nJ'aimerais bien savoir comment faire.\n@c0@"
  it: "@a@b*: È vero! È tutto vero!\n@c0@"
  ja: "@a@b＊「あんた！\n\t知ってますかっ？\n@c0@"
199:
  de: "@a@b*: Es gibt anscheinend einen alten Zauber, der einen sofort zu Schlössern und Städten zurückbringen kann, die man schon kennt.\n@c0@"
  en: "@a@b*: Seems there used to be an ancient spell that would allow you to return to castles and towns you've visited in an instant.\n@c0@"
  es: "@a@b*: Parece que en el pasado un antiguo conjuro te permitía regresar al instante a los castillos y ciudades que ya habías visitado.\n@c0@"
  fr: "@a@b*ⓢ Il paraît qu'il existe un ancien sort qui permet de retourner instantanément dans les châteaux et les villes que vous avez déjà visités.\n@c0@"
  it: "@a@b*: Esiste un incantesimo che ti permette di tornare istantaneamente nelle città e nei castelli che hai già visitato!\n@c0@"
  ja: "@a@b＊「では　本当だったんだ！\n\t私も　覚えたいもんですなあ。\n@c0@"
200:
  de: "@a@b*: Wäre das nicht toll, wenn man so einen Zauber wirken könnte? Man könnte überall herumreisen!\n@c0@"
  en: "@a@b*: Can you imagine how great it would be if you knew a spell like that!? You could go travelling off all over the place!\n@c0@"
  es: "@a@b*: ¡Sería genial conocer un conjuro así! ¿%H0860%XTe lo imaginas%YOs lo imagináis%Z? ¡Con él se podría viajar a todas partes!\n@c0@"
  fr: "@a@b*ⓢ Vous imaginezⓡ Ce serait vraiment génial de connaître un sort pareilⓠ Vous pourriez vous rendre à peu près partoutⓠ\n@c0@"
  it: "@a@b*: Devo assolutamente trovare il modo di impararlo!\nPotrei girare il mondo intero senza perdere tempo in faticosi viaggi!\n@c0@"
  ja: "@a@b＊「昔は　１度行った城や町に\n\tいつでも戻れる呪文が\n\tあったらしいですよ。\n@c0@"
201:
  de: "@a@b*: Angeblich plant das Königreich Tifortu, die Welt zu erobern.\n@c0@"
  en: "@a@b*: Rumour has it that the Kingdom of Coburg is planning on conquering the world.\n@c0@"
  es: "@a@b*: Según los rumores, el Reino de Trastámara está planeando conquistar el mundo.\n@c0@"
  fr: "@a@b*ⓢ Il paraît que le royaume de Cobourg a l'intention de conquérir le monde.\n@c0@"
  it: "@a@b*: Qualcuno ha messo in giro la voce che il Re di Coburg vuole conquistare il mondo intero...\n@c0@"
  ja: "@a@b＊「そういう呪文が　つかえたら\n\t本当に　便利でしょうなあ。\n@c0@"
202:
  de: "@a@b*: Bisher haben sie sich allerdings noch nicht groß gerührt. Langsam glaube ich, das waren alles nur Gerüchte.\n@c0@"
  en: "@a@b*: They don't seem to be doing much about it so far, mind you. I'm starting to think it was all just a hoax.\n@c0@"
  es: "@a@b*: Pero no parece que estén desplegando gran actividad para ello. Estoy empezando a pensar que es un camelo.\n@c0@"
  fr: "@a@b*ⓢ Remarquez, pour l'instant, je n'ai pas l'impression qu'il faille avoir peur. Je me demande si ce n'était pas un canular.\n@c0@"
  it: "@a@b*: Secondo me, è tutta una panzana.\nNon ci credo affatto.\n@c0@"
  ja: "@a@b＊「うわさに聞いたのだが\n\tラインハットという国が\n\t世界を征服するつもりらしい。\n@c0@"
203:
  de: "@a@b*: Uhh. Was für ein Kater! Vielleicht hatte ich gestern Abend doch ein Glas zu viel.\n@c0@"
  en: "@a@b*: Urgh. What a hangover! Maybe I had one too many last night.\n@c0@"
  es: "@a@b*: ¡Argh! ¡Menuda resaca! Creo que anoche me pasé un poco.\n@c0@"
  fr: "@a@b*ⓢ Ouille. Quel mal de crâneⓠ Je crois que j'ai un peu abusé hier soir.\n@c0@"
  it: "@a@b*: Urgh, che mal di testa...\nSono a pezzi! Mi sa che ieri sono andato a dormire troppo tardi...\n@c0@"
  ja: "@a@b＊「しかし　いつまでも\n\t攻めて来ないところを　みると\n\tどうやら　デマだったようだな。\n@c0@"
204:
  de: "@a@b*: Dies ist Bakenmünde.\n@c0@"
  en: "@a@b*: This is Lodestar Harbour.\n@c0@"
  es: "@a@b*: Esto es Puerto Polaris.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes à Port-Lanterne.\n@c0@"
  it: "@a@b*: Questa è Grandport.\n@c0@"
  ja: "@a@b＊「ああ　二日酔いだ。\n\tきのうは　飲みすぎたなあ。\n@c0@"
205:
  de: "@a@b*: Alte Schriften besagen, es gebe einen mächtigen Drachengott, der die Welt beherrscht.\n@c0@"
  en: "@a@b*: According to ancient manuscripts, there's a giant dragon god that reigns over our world.\n@c0@"
