  it: "@a@b*: Tutti i passeggeri sono scesi a terra!\n@c0@"
  ja: "@a@b＊「でも　まあ　いいことだよね。\n\t平和でなけりゃ　眠ってなんて\n\tいられないもんねえ。\n@c0@"
183:
  de: "@a@b*: Ihr wollt wieder an Bord zurück? Tut mir leid, im Moment können wir keine Passagiere aufnehmen.\n@c0@"
