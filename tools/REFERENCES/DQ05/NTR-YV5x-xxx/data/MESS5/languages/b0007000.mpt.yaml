  fr: "@a@b*ⓢ Le bateau pour le Petit Havre a été attaqué par des monstres il y a peu et il a coulé.\n@c0@"
  it: "@a@b*: La nave per Cala Disorte è stata attaccata e affondata dai mostri qualche tempo fa.\n@c0@"
  ja: "@a@b＊「また　船に乗りたいのか？\n\tだが　この船に　お客さんを\n\tのせられるのは　ここまでなんだよ。\n@c0@"
185:
  de: "@a@b*: Wir konnten diese Fahrt nur unternehmen, weil der Millionär Herr Onassetti so großzügig war.\n@c0@"
  en: "@a@b*: We were only able to run the service we just did thanks to the millionaire Mr Briscoletti bein' so generous.\n@c0@"
  es: "@a@b*: Si no hubiese sido por la generosidad de don Rimaldi no habríamos podido ofrecer este servicio.\n@c0@"
  fr: "@a@b*ⓢ Nous n'avons pu faire la traversée que grâce à la générosité de monsieur Oscuroni, le millionnaire.\n@c0@"
  it: "@a@b*: Abbiamo potuto effettuare questa traversata solo grazie alla generosità di mister Fosconi, il multimilionario.\n@c0@"
  ja: "@a@b＊「しばらく前に　ビスタとの連絡船が\n\t魔物に　おそわれて\n\t沈んじまってね。\n@c0@"
186:
  de: "@a@b*: Ich hoffe, es dauert nicht mehr lange, bis die Welt sicher genug ist, damit wir wieder übers Meer segeln können.\n@c0@"
  en: "@a@b*: I hope it won't be long before the world's safe enough for us to start sailin' again.\n@c0@"
  es: "@a@b*: Espero que no tarde mucho en volver la paz para poder navegar de nuevo.\n@c0@"
  fr: "@a@b*ⓢ J'espère que tout rentrera rapidement dans l'ordre pour qu'on puisse à nouveau voyager sans risque.\n@c0@"
  it: "@a@b*: Spero che la situazione torni presto alla normalità. In queste condizioni non è possibile navigare!\n@c0@"
  ja: "@a@b＊「今回は　特別に　ルドマンという\n\tお金持ちの　この船を　連絡船に\n\t使わせてもらったのさ。\n@c0@"
187:
  de: "@a@b*: Denn wenn wir nicht segeln können, haben wir keine Arbeit. So einfach ist das.\n@c0@"
