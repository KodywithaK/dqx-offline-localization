  it: "@a@b*: Meglio così.\nAlmeno non ce l'ho tra i piedi!\n@c0@"
  ja: "@a@b＊「まったく　うちの人ったら\n\tいねむり　ばかりして……。\n@c0@"
182:
  de: "@a@b*: So, das wär's! Alle Passagiere sind von Bord gegangen.\n@c0@"
