  fr: "@a@b*ⓢ Pas de traversée, pas de travail.\nC'est aussi simple que ça.\n@c0@"
  it: "@a@b*: Se non si naviga, non lavoriamo.\nSe non lavoriamo, non guadagniamo.\nE se non guadagniamo, non mangiamo!\n@c0@"
  ja: "@a@b＊「いつになったら　安心して\n\t船が出せる世の中に\n\tなるんだろうな。\n@c0@"
188:
  de: "@a@b*: Ich habe gehört, dass neulich eine Fähre nach Kleinhaven gesegelt ist, also hatte ich gehofft, die nächste erwischen zu können.\n@c0@"
