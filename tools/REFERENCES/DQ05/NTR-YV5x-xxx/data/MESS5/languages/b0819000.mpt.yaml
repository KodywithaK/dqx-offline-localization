0:
  de: "@a@b*: Verirrtes Schäflein der großen Hirtin, willkommen in diesem Haus der Göttin.\nWie können wir Euch helfen?\n@c0@"
  en: "@a@b*: Wayward sheep of the great shepherdess, welcome to this house of the Goddess.\nHow may we help you?\n@c0@"
  es: "@a@b*: %H0860%XOveja descarriada%YOvejas descarriadas%Z de la gran pastora de los cielos, %H0860%Xte%Yos%Z doy la bienvenida a esta casa de la Diosa.\n¿Puedo ser%H0860%Xte%Yos%Z de utilidad?\n@c0@"
  fr: "@a@b*ⓢ Brebis capricieuse de la grande bergère, bienvenue dans la maison de la Déesse.\nQue puis-je faire pour vousⓡ\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xfratello, e benvenuto%Z%B0110%Xsorella, e benvenuta%Z%Y%R0000%Xsorelle, e benvenute%Yfratelli, e benvenuti%Z%Z nella casa della dea. Cosa posso fare per %H0860%Xte%Yvoi%Z?\n@c0@"
  ja: "@a@b＊「神にみちびかれし　迷える子羊よ。\n\tわが教会へ　ようこそ。\n\tご用は　なんでしょう？\n@c0@"
1:
  de: "@a@b*: Willkommen in unserem Haus der Göttin.\nWelche Sorgen plagen Euch zu dieser späten Stunde, mein Kind?\n@c0@"
  en: "@a@b*: Welcome to our house of the Goddess.\r\nIs something troubling you at this late hour, child?\n@c0@"
  es: "@a@b*: %H0860%X%A0110%XBienvenido%Z%B0110%XBienvenida%Z%Y%R0000%XBienvenidas%YBienvenidos%Z%Z a la casa de la Diosa.\n¿Qué %H0860%Xte%Yos%Z trae por aquí a esta hora tan tardía, %H0860%X%A0110%Xhijo mío%Z%B0110%Xhija mía%Z%Y%R0000%Xhijas mías%Yhijos míos%Z%Z?\n@c0@"
  fr: "@a@b*ⓢ Bienvenue dans la maison de la Déesse.\nQuels tracas peuvent bien vous amener ici\nà une heure si tardive, mon enfantⓡ\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xfratello%Z%B0110%Xsorella%Z%Y%R0000%Xsorelle%Yfratelli%Z%Z.\nCosa %H0860%Xti%Yvi%Z porta nella nostra chiesa a quest'ora della notte?\n@c0@"
  ja: "@a@b＊「ようこそ　わが教会へ。\n\tこのような夜更けに　なにか\n\tお困りごとでしょうか？\n@c0@"
2:
  de: "@a@b*: Beichtet alles, was Ihr getan habt, der allmächtigen Göttin, Kind.\n@c0@"
  en: "@a@b*: Confess all that you have done before the almighty Goddess, child. \n@c0@"
  es: "@a@b*: %H0860%XConfiesa%YConfesad%Z cuanto %H0860%Xhayas%Yhayáis%Z hecho ante la Diosa todopoderosa, %H0860%X%A0110%Xhijo mío%Z%B0110%Xhija mía%Z%Y%R0000%Xhijas mías%Yhijos míos%Z%Z. \n@c0@"
  fr: "@a@b*ⓢ Confessez tout ce que vous avez fait devant la toute-puissante Déesse, mon enfant.\n@c0@"
  it: "@a@b*: Confessa alla dea onnipotente tutti i tuoi peccati, %A0110%Xfratello%Z%B0110%Xsorella%Z.\n@c0@"
  ja: "@a@b＊「では　神の前に\n\tこれまでの　おこないを\n\t告白なさい。\n@c0@"
3:
  de: "@a@b*: Darf ich Euer Wirken in einem Abenteuertagebuch verzeichnen?\n@c0@"
  en: "@a@b*: Would you allow me to record your works in an adventure log?\n@c0@"
  es: "@a@b*: ¿Me %H0860%Xpermitirás%Ypermitiréis%Z tomar nota de %H0860%Xtus%Yvuestras%Z obras en un registro de aventuras?\n@c0@"
  fr: "@a@b*ⓢ Me permettez-vous d'enregistrer vos aventures dans un journalⓡ\n@c0@"
  it: "@a@b*: Desideri salvare le tue azioni nel diario dell'avventura?\n@c0@"
  ja: "@a@b＊「そして　この冒険の書に\n\t記録しても　よろしいですか？\n@c0@"
4:
  de: "@a@b*: In welchem Abenteuertagebuch soll ich es verzeichnen?\n@c0@"
  en: "@a@b*: Into which adventure log do you wish me to record this?\n@c0@"
  es: "@a@b*: ¿En qué registro de aventuras %H0860%Xquieres%Yqueréis%Z que guarde %H0860%Xtus%Yvuestros%Z avances?\n@c0@"
  fr: "@a@b*ⓢ Dans quel journal souhaitez-vous que j'effectue la sauvegardeⓡ\n@c0@"
  it: "@a@b*: In quale diario dell'avventura vuoi salvare le tue imprese?\n@c0@"
  ja: "@a@b＊「なんばんの　冒険の書に\n\t記録なさいますか？\n@c0@"
5:
  de: "@a@b*: In diesem Fall muss ich allerdings\nⓞ%a000660: %0%a000090 %a000240ⓟ überschreiben.\nSoll ich dennoch fortfahren, mein Kind?\n@c0@"
  en: "@a@b*: In that case, I must overwrite\nⓗ%a000660: %0%a000090 %a000240ⓘ.\nDo you wish me to proceed, my child?\n@c0@"
  es: "@a@b*: En tal caso deberé sobrescribir\n''%a000660: %0%a000090 %a000240''.\n¿Debo continuar, %H0860%X%A0110%Xhijo%Z%B0110%Xhija%Z%Y%R0000%Xhijas%Yhijos%Z%Z?\n@c0@"
  fr: "@a@b*ⓢ Dans ce cas, je dois écraser\nⓥ%a000660ⓢ %0%a000090 %a000240ⓦ.\nVoulez-vous que je le fasse, %A0110%Xcher enfant%Z%B0110%Xchère enfant%Zⓡ\n@c0@"
  it: "@a@b*: In tal caso, devo sovrascrivere\nⓕ%a000660: %0%a000090 %a000240ⓖ.\nPosso procedere, %A0110%Xfratello%Z%B0110%Xsorella%Z?\n@c0@"
  ja: "@a@b＊「%a000660：%a000090　%a000240の\n\t記録に　上書きしてしまいますが\n\tそれでも　よろしいですか？\n@c0@"
6:
  de: "@a@bAbenteuertagebuch wird gespeichert.\nBitte das System nicht ausschalten und die\nDS-Karte nicht entfernen!\n@c0@"
  en: "@a@bSaving adventure log.\nDo not turn the power OFF\nor remove the DS Game Card!\n@c0@"
  es: "@a@bGuardando registro de aventuras.\r\nNo apagues la consola\r\nni extraigas la tarjeta DS.\n@c0@"
  fr: "@a@bSauvegarde du journal en cours.\nNe pas éteindre la console ni retirer\nla carte de jeu DSⓠ\n@c0@"
  it: "@a@bSalvataggio del diario dell'avventura.\nNon spegnere la console\ne non rimuovere la scheda di gioco DS!\n@c0@"
  ja: "@a@b冒険の書に　記録しています。\n電源を切らないでください。\nカードを引き抜かないでください。\n@c0@"
7:
  de: "@a@b*: Weh mir! Oh unglücklicher Tag! Meinem Versuch, das Abenteuertagebuch aufzuzeichnen, ward offenbar kein Erfolg beschieden!\n@c0@"
  en: "@a@b*: Woe is me! Alas, unhappy day!\nIt appears my attempt to record the adventure log has failed!\n@c0@"
  es: "@a@b*: ¡Ay de mí! ¡Oh, día aciago!\r\nParece que no he podido guardar el registro de aventuras.\n@c0@"
  fr: "@a@b*ⓢ Pauvre de moiⓠ Quelle affreuse journéeⓠ\nIl semblerait que ma tentative d'enregistrement de votre journal ait échouéⓠ\n@c0@"
  it: "@a@b*: Non ho potuto salvare il diario dell'avventura. Puoi proseguire il tuo viaggio, ma ricorda che i tuoi progressi non sono stati salvati.\n@c0@"
  ja: "@a@b＊「まあ！　どうしたことでしょう？\n\t記録に　失敗したようですわ。\n@c0@"
8:
  de: "@a@b*: Ich habe Euer Abenteuer erfolgreich aufgezeichnet. Habt Ihr die Absicht, es jetzt fortzusetzen?\n@c0@"
  en: "@a@b*: I successfully recorded your adventure log.\nDo you plan to continue on your adventure at this point?\n@c0@"
  es: "@a@b*: %H0860%XTus%YVuestras%Z aventuras han quedado registradas de forma completamente satisfactoria.\n¿%H0860%XDeseas%YDeseáis%Z continuar ahora con %H0860%Xtus%Yvuestras%Z aventuras?\n@c0@"
  fr: "@a@b*ⓢ J'ai enregistré votre journal.\nAvez-vous l'intention de poursuivre votre aventureⓡ\n@c0@"
  it: "@a@b*: Ho salvato i tuoi progressi nel diario dell'avventura.\nVuoi proseguire nel tuo viaggio, %A0110%Xfratello%Z%B0110%Xsorella%Z?\n@c0@"
  ja: "@a@b＊「たしかに　記録いたしました。\n\tまだ　冒険を　お続けになりますか？\n@c0@"
9:
  de: "@a@b*: Ihr würdet Euer Abenteuer lieber nicht aufzeichnen? Nun, so sei es. Ihr seid frei in Eurer Entscheidung und könnt tun, was Ihr wünscht.\n@c0@"
  en: "@a@b*: You would prefer not to make a record of your adventure? Then so be it. You are free to do as you please.\n@c0@"
  es: "@a@b*: ¿%H0860%XPrefieres%YPreferís%Z no conservar un registro de %H0860%Xtus%Yvuestras%Z aventuras? Que así sea, pues. %H0860%XEres libre de hacer lo que te plazca%YSois libres de hacer lo que os plazca%Z.\n@c0@"
  fr: "@a@b*ⓢ Vous préférez ne pas garder trace de votre aventureⓡ Alors qu'il en soit ainsi.\nVous êtes libre de faire comme bon vous semble.\n@c0@"
  it: "@a@b*: Hai deciso di non salvare i tuoi progressi nel diario dell'avventura?\nCome preferisci, %A0110%Xfratello%Z%B0110%Xsorella%Z. La scelta è solo tua.\n@c0@"
  ja: "@a@b＊「では　これまでのことは\n\t記録しないでおきましょう。\n@c0@"
10:
  de: "@a@b*: Habt Ihr die Absicht, Euer Abenteuer jetzt fortzusetzen?\n@c0@"
  en: "@a@b*: Do you plan on continuing your adventure at this point?\n@c0@"
  es: "@a@b*: ¿%H0860%XDeseas%YDeseáis%Z continuar ahora %H0860%Xtus%Yvuestras%Z aventuras?\n@c0@"
  fr: "@a@b*ⓢ Avez-vous l'intention de poursuivre votre aventureⓡ\n@c0@"
  it: "@a@b*: %A0110%XFratello caro%Z%B0110%XSorella cara%Z, vuoi continuare la tua avventura?\n@c0@"
  ja: "@a@b＊「まだ　冒険を\n\tお続けになりますか？\n@c0@"
11:
  de: "@a@b*: Ihr wollt Euch von Euren Abenteuern ausruhen, ohne Eure Taten in einem Abenteuertagebuch aufzuzeichnen?\n@c0@"
  en: "@a@b*: You intend to rest from your adventures without recording your deeds in an adventure log?\n@c0@"
  es: "@a@b*: ¿%H0860%XQuieres tomarte%YQueréis tomaros%Z un descanso en %H0860%Xtus%Yvuestras%Z aventuras sin guardar %H0860%Xtus%Yvuestras%Z proezas en un registro?\n@c0@"
  fr: "@a@b*ⓢ Vous avez l'intention de vous reposer de vos aventures sans enregistrer ce que vous avez accompli dans un journalⓡ\n@c0@"
  it: "@a@b*: Cosa sentono le mie orecchie?!\nDesideri riposarti dai tuoi viaggi senza prima aver salvato i tuoi progressi nel diario dell'avventura?!\n@c0@"
  ja: "@a@b＊「では　記録せずに\n\t休むと　おっしゃるのですね。\n@c0@"
12:
  de: "@a@b*: Das bedeutet, dass Ihr Euer Abenteuer von dem Moment Eurer letzten Beichte fortsetzen werdet. Ist das wirklich Euer Wunsch?\n@c0@"
  en: "@a@b*: This will mean you will restart your adventure from the point of your last confession. Are you sure this is what you want?\n@c0@"
  es: "@a@b*: Eso significa que %H0860%Xdeberás%Ydeberéis%Z reemprender %H0860%Xtu%Yvuestra%Z aventura desde el momento de %H0860%Xtu%Yvuestra%Z última confesión. ¿Seguro que %H0860%Xquieres%Yqueréis%Z hacerlo?\n@c0@"
  fr: "@a@b*ⓢ Cela signifie que vous devrez recommencer votre aventure à partir de votre dernière confession. Est-ce vraiment ce que vous voulezⓡ\n@c0@"
  it: "@a@b*: Ciò significa che dovrai riprendere l'avventura dal punto dove hai effettuato l'ultima confessione. Sei %A0110%Xcerto di voler procedere così, fratello%Z%B0110%Xcerta di voler procedere così, sorella%Z?\n@c0@"
  ja: "@a@b＊「そうすると　冒険が\n\t前の記録まで　もどりますが\n\tよろしいのですか？\n@c0@"
13:
  de: "@a@b*: Oh große Hirtin, bitte lass dieses arme Lamm eine Weile in Frieden ruhen!\n@c0@"
  en: "@a@b*: O great shepherdess, please allow this faithful lamb to rest in peace for a while!\n@c0@"
  es: "@a@b*: ¡Oh, gran pastora, permite que %H0860%Xesta fiel oveja descanse%Yestas fieles ovejas descansen%Z en paz por un rato!\n@c0@"
  fr: "@a@b*ⓢ Ô grande bergère, permets à cette fidèle brebis de se reposer un momentⓠ\n@c0@"
  it: "@a@b*: O dea buona e meravigliosa, concedi a %A0110%Xquesto tuo caro figliolo%Z%B0110%Xquesta tua cara figliola%Z il riposo che si merita.\n@c0@"
  ja: "@a@b＊「ああ　われらが神よ！\n\tこの迷える子羊に　ひとときの\n\t休息を　おあたえください！\n@c0@"
14:
  de: "@a@b%3Die Göttin sei mit Euch, mein Kind.\nBitte schaltet Euer System aus.%4\n@c0@"
  en: "@a@b                  Bless you, my child.\r\n             Please turn the power OFF.\n@c0@"
  es: "@a@b%3%H0860%XVe%YId%Z con la Diosa, %H0860%X%A0110%Xhijo mío%Z%B0110%Xhija mía%Z%Y%R0000%Xhijas mías%Yhijos míos%Z%Z. \nPuedes apagar la consola.%4\n@c0@"
  fr: "@a@b           Qu'il en soit ainsi, mon enfant.\r\n          Appuyez sur le bouton POWER.\n@c0@"
  it: "@a@b           Che la dea non ti abbandoni mai!\n             Ora puoi spegnere la console.\n@c0@"
  ja: "@a@b　　　　　　おつかれさまでした。\n　このまま　電源をＯＦＦにしてください。\n@c0@"
15:
  de: "@a@b*: Die große und gnädige Göttin lässt mich an ihrer Weisheit teilhaben...\n@c0@"
  en: "@a@b*: The great and benevolent Goddess offers\r\nher wisdom...\n@c0@"
  es: "@a@b*: Nuestra magna y compasiva Diosa nos ofrece su sabiduría...\n@c0@"
  fr: "@a@b*ⓢ La grande et bienveillante Déesse est emplie de sagesse...\n@c0@"
  it: "@a@b*: La dea, nella sua infinita benevolenza, ti offre tutta la sua saggezza.\n@c0@"
  ja: "@a@b＊「神の声が　聞こえます。\n@c0@"
16:
  de: "@a@b*: Die Göttin ist Euch hold, %a000060! Ihr scheint bereits so stark zu sein, wie man nur sein kann!\n@c0@"
  en: "@a@b*: The Goddess smiles upon you, %a000060!\nYou appear to be as strong as you can possibly be!\n@c0@"
  es: "@a@b*: ¡La Diosa te sonríe, %a000060!\n¡Parece que eres todo lo fuerte que se puede ser!\n@c0@"
  fr: "@a@b*ⓢ La Déesse vous sourit, %a000060ⓠ\nIl semblerait que vous soyez au maximum de votre forceⓠ\n@c0@"
  it: "@a@b*: %0%a000060, %A0060%Xfratello%Z%B0060%Xsorella%Z%C0060%X%Z!\nNon credo che tu possa incrementare ulteriormente le tue capacità!\n@c0@"
  ja: "@a@b＊「%a000060よ。　\n\tあなたは　もう　じゅうぶん　\n\t強く　おなりですわ。\n@c0@"
17:
  de: "@a@b*: %0%a000060, mein Kind!\nIhr benötigt %a000080 Erfahrungspunkt%H0080%X%Ye%Z, um die nächste Stufe zu erreichen.\n@c0@"
  en: "@a@b*: Faithful servant %a000060.\nThe almighty one declares you need %a000080 experience point%H0080%X%Ys%Z to reach the next level.\n@c0@"
  es: "@a@b*: Fiel, %a000060.\nLa Diosa me dice que necesitas %a000080 punto%H0080%X%Ys%Z de experiencia para alcanzar el siguiente nivel.\n@c0@"
  fr: "@a@b*ⓢ %0%a000060, mon enfantⓠ\nVous avez besoin de %a000080 point%I0080%X%Ys%Z d'expérience pour passer au niveau supérieur.\n@c0@"
  it: "@a@b*: %0%a000060, %A0060%Xfratello%Z%B0060%Xsorella%Z%C0060%X%Z!\nHai bisogno di %H0080%Xun punto%Y%a000080 punti%Z di esperienza per passare al livello successivo.\n@c0@"
  ja: "@a@b＊「%a000060よ。　あなたは\n\tあと　%a000080の経験で\n\t次のレベルに　なるでしょう。\n@c0@"
18:
  de: "@a@b*: Wen soll die Göttin für Euch in die Welt der Lebenden zurückholen?\n@c0@"
  en: "@a@b*: Whom shall we ask the Goddess to return to the world of the living?\n@c0@"
  es: "@a@b*: ¿A quién queremos que devuelva la Diosa al mundo de los vivos?\n@c0@"
  fr: "@a@b*ⓢ Qui la Déesse doit-elle ramener dans le monde des vivantsⓡ\n@c0@"
  it: "@a@b*: Quale membro del gruppo vuoi che sia restituito alla vita dalla nostra dea onnipotente?\n@c0@"
  ja: "@a@b＊「どなたを　この世へ\n\t呼びもどしましょう？\n@c0@"
19:
  de: "@a@b*: Ihr müsst Euch irren. %0%a000180 erscheint mir doch zu lebendig, als dass %A0180%Xer%Z%B0180%Xsie%Z%C0180%Xes%Z tot sein könnte!\n@c0@"
  en: "@a@b*: You must be mistaken.\n%0%a000180 seems rather too lively to be dead!\n@c0@"
  es: "@a@b*: Debe de ser un error. ¡%0%a000180 tiene muy buen aspecto para estar %A0180%Xmuerto%Z%B0180%Xmuerta%Z%C0180%X%Z!\n@c0@"
  fr: "@a@b*ⓢ Vous devez vous tromper.\n%0%a000180 semble bien vivant%A0180%X%Z%B0180%Xe%Z%C0180%X%Zⓠ\n@c0@"
  it: "@a@b*: Santo cielo! Ma cosa dici?\n%0%a000180 mi sembra %A0180%Xtroppo vivo per essere morto%Z%B0180%Xtroppo viva per essere morta%Z%C0180%X%Z!\n@c0@"
  ja: "@a@b＊「あら？　%a000180さんは\n\t生きていらっしゃいますわ。\n@c0@"
20:
  de: "@a@b*: Wenn Ihr gestattet... Um meine Aufgabe zu erfüllen, benötige ich einen kleinen Betrag von %a000650 Goldmünzen. Wenn Ihr so gut wärt...?\n@c0@"
  en: "@a@b*: If I may... In order to perform this task, I shall require a small contribution of %a000650 gold coins. Can you oblige me?\n@c0@"
  es: "@a@b*: Si me %H0860%Xpermites%Ypermitís%Z... Para poder efectuar esta tarea, necesito un pequeño donativo de %a000650 monedas de oro. ¿%H0860%XTe%YOs%Z parece adecuado?\n@c0@"
  fr: "@a@b*ⓢ Si je puis me permettre... Pour accomplir cette tâche, je dois vous demander un modeste tribut de %a000650 pièces d'or.\n㈡\n*ⓢ Auriez-vous l'obligeance de vous en acquitterⓡ\n@c0@"
  it: "@a@b*: Per celebrare questo rito, ho bisogno di una donazione di %a000650 monete d'oro.\nVuoi offrire questa somma, %A0110%Xfratello%Z%B0110%Xsorella%Z?\n@c0@"
  ja: "@a@b＊「それでは　わが教会に\n\t%a000650ゴールドの　ご寄付を。\n\tよろしいですか？\n@c0@"
21:
  de: "@a@b*: Oh Göttin des Lichtes!\nGroße und gnädige Hirtin!\n@c0@"
  en: "@a@b*: O Goddess of light!\nOur great and benevolent shepherdess!\n@c0@"
  es: "@a@b*: ¡Oh, Diosa de la luz!\r\n¡Nuestra magna y compasiva pastora!\n@c0@"
  fr: "@a@b*ⓢ Ô Déesse de la lumièreⓠ\nNotre grande et bienveillante bergèreⓠ\n@c0@"
  it: "@a@b*: O dea buona e onnipotente...\n@c0@"
  ja: "@a@b＊「ああ　わが主よ！\n\t全知全能の神よ！\n@c0@"
22:
  de: "@a@b*: Wenn es dein Wille ist, bring bitte %A0180%Xdeinen treuen Diener%Z%B0180%Xdeine treue Dienerin%Z%C0180%X%Z %a000180 in diese Welt zurück!\n@c0@"
  en: "@a@b*: If it is your will, please bring your faithful servant, %a000180, back to this world!\n@c0@"
  es: "@a@b*: ¡Si es tu voluntad, trae a%A0180%X nuestro fiel siervo%Z%B0180%X nuestra fiel sierva%Z%C0180%X%Z %a000180 de vuelta a este mundo!\n@c0@"
  fr: "@a@b*ⓢ Si telle est ta volonté, ramène dans ce monde notre fidèle %a000180ⓠ\n@c0@"
  it: "@a@b*: Restituisci %A0180%Xil tuo amato figliolo%Z%B0180%Xla tua amata figliola%Z%C0180%X%Z %a000180 all'affetto dei suoi cari!\n@c0@"
  ja: "@a@b＊「忠実なる　神のしもべ\n\t%a000180の　みたまを\n\tどうぞ　ここに　よびもどしたまえ！\n@c0@"
23:
  de: "@a@b%0%a000180 ist wiederauferstanden!\n@c0@"
  en: "@a@b%0%a000180 is resurrected!\n@c0@"
  es: "@a@b¡%0%a000180 ha resucitado!\n@c0@"
  fr: "@a@b%0%a000180 est revenu%A0180%X%Z%B0180%Xe%Z%C0180%X%Z à la vieⓠ\n@c0@"
  it: "@a@b%0%a000180 torna in vita!\n@c0@"
  ja: "@a@b%a000180は　よみがえった！\n@c0@"
24:
  de: "@a@b*: Wen soll ich gegen Gift behandeln?\n@c0@"
  en: "@a@b*: Whom shall I treat for poison?\n@c0@"
  es: "@a@b*: ¿A quién debería curar su envenenamiento?\n@c0@"
  fr: "@a@b*ⓢ Qui a besoin de soins contre le poisonⓡ\n@c0@"
