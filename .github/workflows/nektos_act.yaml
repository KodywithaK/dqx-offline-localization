                    cp \
                    ${{ github.workspace }}/nektos_act/staging/${LANGUAGE}/Game/Content/Localization/Game/Game.locres.${VERSION} \
                    ${{ github.workspace }}/nektos_act/staging/${LANGUAGE}/Game/Content/Localization/Game/ja/Game.locres

                    echo -e \
