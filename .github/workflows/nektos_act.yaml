name: nektos/act
on:
  workflow_dispatch: # cmd.exe /k "act --bind --workflows .github/workflows/nektos_act.yaml workflow_dispatch"

jobs:
  Checkout_Repos:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
    # - run: echo Checkout_Repos
      - name: Checkout dqx_dat_dump
        uses: actions/checkout@v5
        with:
          path: ./nektos_act/dqx_dat_dump
          ref: testing
          repository: KodywithaK/dqx_dat_dump
      - name: Checkout dqx-offline-localization
        uses: actions/checkout@v5
        with:
          path: ./nektos_act/dqx-offline-localization
          ref: main
          repository: KodywithaK/dqx-offline-localization
      - name: Checkout LocRes-Builder
        uses: actions/checkout@v5
        with:
          path: ./nektos_act/LocRes-Builder
          ref: testing
          repository: KodywithaK/LocRes-Builder
  LocRes-Builder-Input:
    needs: [Checkout_Repos]
    runs-on: ubuntu-latest
    steps:
    # - run: echo LocRes-Builder-Input
      - name: LocRes-Builder Inputs
        run: |
          mkdir -p ${{ github.workspace }}/nektos_act/LocRes-Builder/INPUT

          cp \
          "${{ github.workspace }}/nektos_act/dqx-offline-localization/src/pakchunk0-PLATFORM.pak/Holiday/Content/Localization/Game/locmeta.json" \
          "${{ github.workspace }}/nektos_act/LocRes-Builder/INPUT/locmeta.json"

          echo -e "Splitting Game.locres.yaml"
          for LANGUAGE in de en es fr it ja ko la pt-BR zh-Hans zh-Hant; do \
            echo -e "Splitting \033[0;32m$LANGUAGE\033[0m"
            yq "." \
            "${{ github.workspace }}/nektos_act/dqx-offline-localization/src/pakchunk0-PLATFORM.pak/Holiday/Content/Localization/Game/Game.locres.yaml" \
            -o json --yaml-fix-merge-anchor-to-spec \
            | jq --arg LANGUAGE $LANGUAGE \
            --from-file "${{ github.workspace }}/nektos_act/dqx-offline-localization/src/pakchunk0-PLATFORM.pak/Holiday/Content/Localization/Game/Game.locres.jq" \
            > "${{ github.workspace }}/nektos_act/LocRes-Builder/INPUT/${LANGUAGE}.json"
          done
  LocRes-Builder-Output:
    needs: [Checkout_Repos, LocRes-Builder-Input]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        LocResVersion: [Optimized_CRC32, Optimized_CityHash64_UTF16]
    steps:
    # - run: echo LocRes-Builder-Output
      - name: LocRes-Builder Outputs
        run: |
          if [[ ${{ matrix.LocResVersion }} == @(Optimized_CRC32) ]]; then
            LOCRES_VERSION="Optimized_CRC32";
            LOCRES_VERSION_ID=2
          else
            LOCRES_VERSION="Optimized_CityHash64_UTF16";
            LOCRES_VERSION_ID=3
          fi

          echo -e "::group::\033[0;34m Building LocRes-Builder's Outputs \033[0m"
            mkdir -p ${{ github.workspace }}/nektos_act/LocRes-Builder/OUTPUT/${LOCRES_VERSION}

            python3 "${{ github.workspace }}/nektos_act/LocRes-Builder/src/main.py" \
            -i "${{ github.workspace }}/nektos_act/LocRes-Builder/INPUT/locmeta.json" \
            -v ${LOCRES_VERSION_ID} \
            -o "${{ github.workspace }}/nektos_act/LocRes-Builder/OUTPUT/${LOCRES_VERSION}" -f=json

            for LANGUAGE in de en es fr it ja ko la pt-BR zh-Hans zh-Hant; do \
              mkdir -p "${{ github.workspace }}/nektos_act/staging/${LANGUAGE}/Game/Content/Localization/Game"

              cp \
              "${{ github.workspace }}/nektos_act/LocRes-Builder/OUTPUT/${LOCRES_VERSION}/Game/${LANGUAGE}/Game.locres" \
              "${{ github.workspace }}/nektos_act/staging/${LANGUAGE}/Game/Content/Localization/Game/Game.locres.${LOCRES_VERSION}"

            done
          echo "::endgroup::"
  YAML_to_ETP:
    needs: [Checkout_Repos, LocRes-Builder-Input, LocRes-Builder-Output]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          architecture: "x64"
          # python-version: '3.x'
          python-version: "3.11"
      - name: Split ETP.yaml
        run: |
          cd "${{ github.workspace }}/nektos_act/dqx-offline-localization/src/pakchunk0-PLATFORM.pak/Holiday/Content/NonAssets/ETP"
          echo -e "Splitting ETP.yaml"
          yq eval \
          "./ETP.yaml" \
          -o json --yaml-fix-merge-anchor-to-spec \
          | jq --from-file \
          "./ETP.jq" \
          | yq ".[]" --split-exp-file \
          "./ETP.yq" \
          -o json
          rm "./anchors.json"
      - name: dqx_dat_dump
        run: |
          cd "${{ github.workspace }}/nektos_act/dqx_dat_dump"
          python -m venv venv
          source ./venv/bin/activate
          pip install -r requirements.txt
          cd ./tools/packing/

          for LANGUAGE in de en es fr it ja ko pt-BR zh-Hans zh-Hant; do
            echo -e "::group::Packing \033[0;32m ETP_${LANGUAGE}\033[0m"
              python ./pack_etp--KwK_20260306.py -L ${LANGUAGE}
            echo "::endgroup::"
          done

          deactivate
          cd ~
  UnrealPak_-Create:
